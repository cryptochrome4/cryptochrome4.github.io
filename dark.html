<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像と吹き出し説明の無限追加サイト</title>
    <style>
        /* 全体の見た目と背景画像の設定 */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;

            // ▼ いつか背景画像を入れる時は、下の「/*」と「*/」を消して、画像のURLを入れてください //
            
            background-image: url('img61dragon.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            
            /* 画像が入るまでは、仮の薄いグレー背景にしておきます */
            background-color: #f0f2f5; 
        }

        /* 縦に並べるための外枠 */
        .container {
            width: 100%;
            max-width: 600px;
        }

        /* 画像と吹き出しを1つにまとめるセット */
        .item-set {
            margin-bottom: 40px; /* セットごとの間隔を少し広めに設定 */
            width: 100%;
        }

        /* 画像のスタイル */
        .item-set img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin-bottom: 15px; /* 吹き出しとの隙間 */
        }

        /* 漫画の吹き出し風の説明欄 */
        .speech-bubble {
            position: relative;
            background-color: #f7f7f9; /* 白すぎない、ほんのり灰色がかった色 */
            border: 1.5px solid #333333; /* 細い黒の線 */
            border-radius: 12px; /* 4つの角に丸みを持たせる */
            padding: 15px 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #222222;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 吹き出しの三角（△）を作る仕掛け */
        .speech-bubble::before,
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: 100%; /* 吹き出しの上のラインに配置 */
            left: 40px;   /* 真ん中より左寄りに配置 */
            width: 0;
            height: 0;
            border: solid transparent;
            pointer-events: none;
        }

        /* 三角の黒い枠線部分 */
        .speech-bubble::before {
            border-bottom-color: #333333; /* 線の色と同じにする */
            border-width: 10px; /* 三角のサイズ */
            margin-left: -10px;
        }

        /* 三角の内側の塗りつぶし部分（背景が透けないように重ねる） */
        .speech-bubble::after {
            border-bottom-color: #f7f7f9; /* 吹き出しの背景色と同じにする */
            border-width: 8.5px; /* 線より少しだけ小さくして枠線を表現 */
            margin-left: -8.5px;
            margin-top: 2px; /* 位置の微調整 */
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ＝ ＝ ＝ ここからコピー ＝ ＝ ＝ -->
        <div class="item-set">
            <!-- 画像 -->
            <img src="img24x.jpg" alt="画像">
            
            <!-- 吹き出し説明欄 -->
            <div class="speech-bubble">
                1つ目の画像の説明文です。上の画像からセリフが出ているような、左寄りの吹き出し（△）になっています。背景画像を入れてもここは透けません。
            </div>
        </div>
        <!-- ＝ ＝ ＝ ここまでコピー ＝ ＝ ＝ -->


        <!-- 2つ目を増やすときは、すぐ下に貼り付けます -->
        <!-- ＝ ＝ ＝ ここからコピー ＝ ＝ ＝ -->
        <div class="item-set">
            <!-- 画像 -->
            <img src="img23x.jpg" alt="画像">
            
            <!-- 吹き出し説明欄 -->
            <div class="speech-bubble">
                2つ目の画像の説明文です。コードを下にペーストしていけば、何個でも同じデザインの吹き出しが綺麗に繋がっていきます。
            </div>
        </div>
        <!-- ＝ ＝ ＝ ここまでコピー ＝ ＝ ＝ -->

    </div>

</body>
</html>
