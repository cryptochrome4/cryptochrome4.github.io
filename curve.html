<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetime Wiki Lexicon Master</title>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: #131622;
            --accent-cyan: #00f2fe;
            --accent-purple: #4facfe;
            --text-main: #f0f3f8;
            --text-muted: #8a99ad;
            --glow: rgba(0, 242, 254, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        /* 最初のメイン画面エリア（最高のデザインをキープ） */
        .hero-section {
            min-height: 85vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            max-width: 800px;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
        }

        .search-container input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--glow);
        }

        /* スクロールした下のエリア */
        .cheat-sheet-section {
            max-width: 1200px;
            margin: 20rem auto 4rem auto; 
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 3rem;
        }

        /* タイトル文字（今の位置をキープ） */
        .cheat-sheet-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-purple);
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 700;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .word-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .word-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
            box-shadow: 0 8px 20px var(--glow);
            color: var(--accent-cyan);
        }

        /* モーダルポップアップ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 6, 10, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            padding: 2.5rem;
            width: 90%;
            max-width: 550px;
            transform: scale(0.85);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: white;
        }

        .modal-header-wrap {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .modal-word {
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
        }

        /* コピーボタン */
        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-cyan);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-purple);
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        .modal-meaning {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 1.8rem;
            color: var(--text-main);
        }

        .modal-etymology {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #b1c2d9;
            font-style: italic;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-left: 3px solid var(--accent-cyan);
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <header>
            <h1>Spacetime Wiki Vocabulary Dashboard</h1>

        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search dictionary...">

            <div class="modal-header-wrap">

            </div>
            
            <div class="section-title">Scientific Meaning</div>
            <p class="modal-meaning" id="modalMeaning">Loading definition...</p>
            
            <div class="section-title">Etymology & Origins</div>
            <p class="modal-etymology" id="modalEtymology">Loading origin...</p>
        </div>
    </div>
