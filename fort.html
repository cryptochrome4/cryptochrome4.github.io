<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タブ切り替え（スクロールなし）</title>
    <style>
        /* 画面全体の設定：スクロールを完全に禁止 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }

        /* コンテナの設定 */
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        /* ボタンのレイアウト */
        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* ボタンのスタイル */
        .tab-btn {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #ccc;
            background-color: white;
            border-radius: 5px;
            transition: all 0.2s;
        }

        /* 選択されているボタンのスタイル */
        .tab-btn.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        /* コンテンツ表示エリア（高さを固定してスクロールを防ぐ） */
        .content-area {
            height: 60px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 初期状態では非表示にする設定 */
        .tab-content {
            display: none;
        }

        /* activeクラスがついたコンテンツだけを表示 */
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 切り替えボタン -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('tab-s', this)">S</button>
            <button class="tab-btn" onclick="switchTab('tab-a', this)">A</button>
            <button class="tab-btn" onclick="switchTab('tab-b', this)">B</button>
        </div>

        <!-- コンテンツエリア -->
        <div class="content-area">
            <div id="tab-s" class="tab-content active">アインシュタイン</div>
            <div id="tab-a" class="tab-content">ニコラテスラ</div>
            <div id="tab-b" class="tab-content">ガリレオ</div>
        </div>
    </div>

    <script>
        function switchTab(tabId, buttonElement) {
            // すべてのコンテンツを非表示にする
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));

            // すべてのボタンの選択状態を解除する
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // クリックされたコンテンツとボタンをアクティブにする
            document.getElementById(tabId).classList.add('active');
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
