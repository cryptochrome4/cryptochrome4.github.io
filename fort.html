<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Latino - 倍率計算ツール</title>
    <!-- Google Fontsから南米の活気を感じるフォントとモダンなフォントを読み込み -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ブラジル＆南米の海をイメージしたカラーパレット */
            --amazon-green: #009739;
            --rio-yellow: #FEDD00;
            --ocean-blue: #0051BA;
            --sky-cyan: #00B4D8;
            --sand-white: #F8F9FA;
            --deep-sea: #03045E;
            --sunset-orange: #FF5A5F;
        }

        /* 全体の背景：コパカバーナの海と太陽をイメージしたグラデーション */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--deep-sea) 0%, #0077B6 50%, #0096C7 100%);
            background-attachment: fixed;
            color: #333333;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景の装飾：南米の波をイメージした抽象的なデザイン */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 1440 320'%3e%3cpath fill='%2300b4d8' fill-opacity='0.15' d='M0,288L48,272C96,256,192,224,288,197.3C384,171,480,149,576,165.3C672,181,768,235,864,250.7C960,267,1056,245,1152,213.3C1248,181,1344,139,1392,117.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z'%3e%3c/path%3e%3c/svg%3e") bottom no-repeat;
            background-size: cover;
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            color: #ffffff;
            position: relative;
        }

        /* ブラジルテイストを押し出したストライプ看板風のタイトル */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px var(--amazon-green), 6px 6px 0px var(--rio-yellow);
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-top: 15px;
            letter-spacing: 1px;
            font-weight: 300;
            color: var(--rio-yellow);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* メインコンテナ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* グリッドレイアウト：海風が通るような余裕のある配置 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* 各層（カード）のデザイン：波打ち際の砂浜と太陽の輝き */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 81, 186, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 3px solid transparent;
            position: relative;
        }

        /* ホバー時に浮き上がり、ブラジリアングリーンの枠線が光る */
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 151, 57, 0.4);
            border-color: var(--amazon-green);
        }

        /* 各層のヘッダー：リオの太陽のようなエネルギッシュな配色 */
        .card-header {
            background: linear-gradient(90deg, var(--amazon-green), var(--rio-yellow));
            padding: 15px 20px;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
            font-family: 'Montserrat', sans-serif;
        }

        /* 1.2倍〜1.4倍のカードは海のグラデーションで変化をつける */
        .card.high-tier .card-header {
            background: linear-gradient(90deg, var(--ocean-blue), var(--sky-cyan));
        }

        .card-header span {
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 30px;
            letter-spacing: 1px;
        }

        /* 数値リスト */
        .card-body {
            padding: 15px 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            border-bottom: 1px dashed #e0e0e0;
            transition: background 0.2s ease;
        }

        .item:last-child {
            border-bottom: none;
        }

        /* リスト内の数値にホバーした時の海風のようなエフェクト */
        .item:hover {
            background-color: rgba(0, 180, 216, 0.1);
        }

        .base-num {
            font-weight: 600;
            color: #555555;
            font-size: 1.1rem;
        }

        .result-num {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--deep-sea);
            font-family: 'Montserrat', sans-serif;
        }

        /* 1.2倍以上の目立つ数値はパッションカラーに変更 */
        .high-tier .result-num {
            color: var(--sunset-orange);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #ffffff;
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* レスポンシブ調整 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
                text-shadow: 2px 2px 0px var(--amazon-green), 4px 4px 0px var(--rio-yellow);
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Copacabana Multiplier</h1>
        <div class="subtitle">🌴 南米の風を感じる、165〜175の倍率レイヤー 🌊</div>
    </header>

    <div class="container">
        <div class="grid" id="matrix-grid">
            <!-- JavaScriptでここに超高速かつ正確にカードが出力されます -->
        </div>
    </div>

    <footer>
        <p>© 2026 Ritmo do Brasil - Powered by Waves & Sunshine</p>
    </footer>

    <script>
        // 計算データの定義
        const baseNumbers =;
        const tiers = [
            { label: '1.1倍の層', factor: 1.1 },
            { label: '1.11倍の層', factor: 1.11 },
            { label: '1.12倍の層', factor: 1.12 },
            { label: '1.13倍の層', factor: 1.13 },
            { label: '1.14倍の層', factor: 1.14 },
            { label: '1.15倍の層', factor: 1.15 },
            { label: '1.16倍の層', factor: 1.16 },
            { label: '1.18倍の層', factor: 1.18 },
            { label: '1.19倍の層', factor: 1.19 },
            { label: '1.2倍の層', factor: 1.2 },
            { label: '1.3倍の層', factor: 1.3 },
            { label: '1.4倍の層', factor: 1.4 }
        ];

        const grid = document.getElementById('matrix-grid');

        // 各層（倍率ごと）のカードを生成
        tiers.forEach(tier => {
            const card = document.createElement('div');
            // 1.2倍以上のカードには色を変えるためのクラスを付与
            if (tier.factor >= 1.2) {
                card.className = 'card high-tier';
            } else {
                card.className = 'card';
            }

            // カードヘッダーの作成
            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `${tier.label} <span>×${tier.factor}</span>`;
            card.appendChild(header);

            // カードボディ（数値リスト）の作成
            const body = document.createElement('div');
            body.className = 'card-body';

            baseNumbers.forEach(num => {
                // JavaScriptの浮動小数点数誤差を防ぐため、一度100倍して計算してから戻す
                const rawResult = (num * (tier.factor * 100)) / 100;
                // 小数点以下がある場合はそのまま、きれいに割り切れる場合は整数で表示
                const formattedResult = Number(rawResult.toFixed(2));

                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <span class="base-num">${num}</span>
                    <span class="result-num">${formattedResult}</span>
                `;
                body.appendChild(item);
            });

            card.appendChild(body);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
