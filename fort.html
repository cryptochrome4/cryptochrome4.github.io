<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Latino - 南米風倍率計算ツール</title>
    <!-- Google Fonts：南米の活気あるフォントを読み込み -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    
    <!-- 【ここに中編のCSSが入ります】 -->

</head>
<body>

    <!-- ヘッダー：波と太陽のタイトル -->
    <header>
        <h1>Copacabana Multiplier</h1>
        <div class="subtitle">🌴 南米の風を感じる、165〜175の倍率レイヤー 🌊</div>
    </header>

    <!-- メインコンテンツ：倍率ごとの層が並ぶグリッド -->
    <div class="container">
        <div class="grid" id="matrix-grid">
            <!-- 【ここに後編のJavaScriptによって計算結果のカードが自動生成されます】 -->
        </div>
    </div>

    <!-- フッター -->
    <footer>
        <p>© 2026 Ritmo do Brasil - Powered by Waves & Sunshine</p>
    </footer>

    <!-- 【ここに後編のJavaScriptが入ります】 -->

</body>
</html>
<style>
    :root {
        /* ブラジル＆南米の海をイメージした熱気あるカラーパレット */
        --amazon-green: #009739;
        --rio-yellow: #FEDD00;
        --ocean-blue: #0051BA;
        --sky-cyan: #00B4D8;
        --sand-white: #F8F9FA;
        --deep-sea: #03045E;
        --sunset-orange: #FF5A5F;
    }

    /* 全体の背景：リオの深い海と空をイメージしたグラデーション */
    body {
        margin: 0;
        padding: 0;
        font-family: 'Outfit', 'Montserrat', sans-serif;
        background: linear-gradient(135deg, var(--deep-sea) 0%, #0077B6 50%, #0096C7 100%);
        background-attachment: fixed;
        color: #333333;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }

    /* 背景の装飾：押し寄せる南米の波を表現（SVG背景） */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 1440 320'%3e%3cpath fill='%2300b4d8' fill-opacity='0.15' d='M0,288L48,272C96,256,192,224,288,197.3C384,171,480,149,576,165.3C672,181,768,235,864,250.7C960,267,1056,245,1152,213.3C1248,181,1344,139,1392,117.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z'%3e%3c/path%3e%3c/svg%3e") bottom no-repeat;
        background-size: cover;
        z-index: -1;
        pointer-events: none;
    }

    /* ヘッダーエリア */
    header {
        text-align: center;
        padding: 50px 20px 30px 20px;
        color: #ffffff;
        position: relative;
    }

    /* サンバの看板のような、圧倒的インパクトの立体ロゴ風タイトル */
    h1 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 3.2rem;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 3px 3px 0px var(--amazon-green), 6px 6px 0px var(--rio-yellow);
        color: #ffffff;
        animation: waveMotion 3s ease-in-out infinite alternate;
    }

    .subtitle {
        font-size: 1.2rem;
        opacity: 0.9;
        margin-top: 20px;
        letter-spacing: 1.5px;
        font-weight: 600;
        color: var(--rio-yellow);
        text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    /* メインコンテナ（左右の余白を美しく保つ） */
    .container {
        max-width: 1250px;
        margin: 0 auto;
        padding: 20px;
    }

    /* グリッドレイアウト：スマホなら1列、PCなら綺麗に並ぶ自動調整 */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 30px;
    }

    /* 計算カード：砂浜の白と海の透明感を再現 */
    .card {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 24px;
        box-shadow: 0 12px 35px rgba(3, 4, 94, 0.25);
        overflow: hidden;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
        border: 3px solid transparent;
    }

    /* ホバー時：カードが手前に飛び出し、ブラジリアングリーンの光を放つ */
    .card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0, 151, 57, 0.35);
        border-color: var(--amazon-green);
    }

    /* 通常の層（1.1倍〜1.19倍）のヘッダー：ブラジル伝統のグリーン＆ゴールド */
    .card-header {
        background: linear-gradient(90deg, var(--amazon-green), var(--rio-yellow));
        padding: 18px 22px;
        color: #ffffff;
        font-weight: 800;
        font-size: 1.4rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        font-family: 'Montserrat', sans-serif;
    }

    /* 高倍率の層（1.2倍〜1.4倍）のヘッダー：コパカバーナの青い海グラデーション */
    .card.high-tier .card-header {
        background: linear-gradient(90deg, var(--ocean-blue), var(--sky-cyan));
    }

    /* 右側の倍率バッジ（×1.1など） */
    .card-header span {
        font-size: 0.9rem;
        background: rgba(0, 0, 0, 0.25);
        padding: 5px 12px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        font-weight: 800;
    }

    .card-body {
        padding: 10px 0;
    }

    /* 数値行：心地よい余白 */
    .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 25px;
        border-bottom: 1px dashed #e5e7eb;
        transition: background 0.2s ease;
    }

    .item:last-child {
        border-bottom: none;
    }

    /* 行ホバー：波が引いた後の澄んだ水面のようなエフェクト */
    .item:hover {
        background-color: rgba(0, 180, 216, 0.12);
    }

    /* 元の数値（165など） */
    .base-num {
        font-weight: 600;
        color: #4b5563;
        font-size: 1.15rem;
    }

    /* 計算後の数値 */
    .result-num {
        font-weight: 800;
        font-size: 1.3rem;
        color: var(--deep-sea);
        font-family: 'Montserrat', sans-serif;
    }

    /* 1.2倍以上の超目立つ数値は、情熱のサンセットオレンジに変更 */
    .high-tier .result-num {
        color: var(--sunset-orange);
    }

    /* フッター */
    footer {
        text-align: center;
        padding: 50px 20px;
        color: #ffffff;
        font-size: 0.95rem;
        letter-spacing: 1px;
        opacity: 0.85;
    }

    /* タイトルに微妙な波の揺れ動きを与えるアニメーション */
    @keyframes waveMotion {
        0% { transform: rotate(-1deg); }
        100% { transform: rotate(1deg); }
    }

    /* スマホ画面向けのサイズ最適化 */
    @media (max-width: 768px) {
        header { padding: 35px 15px 20px 15px; }
        h1 {
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px var(--amazon-green), 4px 4px 0px var(--rio-yellow);
        }
        .subtitle { font-size: 1rem; }
        .grid { grid-template-columns: 1fr; gap: 20px; }
        .item { padding: 12px 20px; }
    }
</style>
<script>
    // 計算のベースとなる165〜175の数値
    const baseNumbers =;

    // あなたが指定した12パターンの倍率レイヤー（1.17倍を除く）
    const tiers = [
        { label: '1.1倍の層', factor: 1.1 },
        { label: '1.11倍の層', factor: 1.11 },
        { label: '1.12倍の層', factor: 1.12 },
        { label: '1.13倍の層', factor: 1.13 },
        { label: '1.14倍の層', factor: 1.14 },
        { label: '1.15倍の層', factor: 1.15 },
        { label: '1.16倍の層', factor: 1.16 },
        { label: '1.18倍の層', factor: 1.18 },
        { label: '1.19倍の層', factor: 1.19 },
        { label: '1.2倍の層', factor: 1.2 },
        { label: '1.3倍の層', factor: 1.3 },
        { label: '1.4倍の層', factor: 1.4 }
    ];

    // HTML上のグリッドコンテナを取得
    const grid = document.getElementById('matrix-grid');

    // 各倍率の層ごとに、165〜175の計算カードを自動生成して並べる
    tiers.forEach(tier => {
        // カード（層）の器を作成
        const card = document.createElement('div');
        
        // 1.2倍以上の目立つ層には、中編のCSSで設定した「high-tier」クラスを付与
        if (tier.factor >= 1.2) {
            card.className = 'card high-tier';
        } else {
            card.className = 'card';
        }

        // 層の名前と倍率バッジ（ヘッダー部分）を組み立て
        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `${tier.label} <span>×${tier.factor}</span>`;
        card.appendChild(header);

        // 数値リストを格納するボディを作成
        const body = document.createElement('div');
        body.className = 'card-body';

        // 165から175の数値を1つずつ計算して行（アイテム）を追加
        baseNumbers.forEach(num => {
            /* 
               【超重要】
               JavaScript特有の「小数の計算ズレ（例: 165 * 1.14 = 188.10000000000002）」を防ぐため、
               一度倍率を100倍して整数にしてから掛け算し、最後に100で割ることで、
               完全に正確な10進数の計算結果を弾き出します。
            */
            const rawResult = (num * (tier.factor * 100)) / 100;
            
            // 小数点第2位までに丸めつつ、無駄な「.00」は綺麗に消去して表示
            const formattedResult = Number(rawResult.toFixed(2));

            // 数値行のHTMLを組み立て
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <span class="base-num">${num}</span>
                <span class="result-num">${formattedResult}</span>
            `;
            body.appendChild(item);
        });

        // ボディをカードに追加し、最後にグリッド全体へドッキング
        card.appendChild(body);
        grid.appendChild(card);
    });
</script>
