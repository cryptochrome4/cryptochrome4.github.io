<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人物紹介タブ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        /* S〜Gのボタンを横並びにする設定 */
        .tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            overflow-x: auto; /* スマホ画面でボタンが入り切らない場合は横スクロール */
        }

        /* ボタンの見た目 */
        .tab-button {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #eee;
            font-weight: bold;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* 選択されているタブの見た目 */
        .tab-button.active {
            background-color: #fff;
            border-bottom: 1px solid transparent;
            color: #000;
        }

        /* ★最重要：コンテンツを表示する枠の設定 */
        .tab-content-container {
            border: 1px solid #ccc;
            background-color: #fff;
            padding: 15px;
            height: 350px;      /* 枠の高さを固定（好みに合わせて数値を変更してください） */
            overflow-y: auto;   /* 文字が長くなった場合、この枠内だけで縦スクロールさせる */
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* 初期状態では非表示にする設定 */
        .tab-panel {
            display: none;
            white-space: pre-wrap; /* 改行やスペースをそのまま反映する */
            line-height: 1.6;
        }

        /* 選択されたパネルだけを表示する */
        .tab-panel.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- タブボタン部分 -->
    <div class="tab-buttons">
        <button class="tab-button active" onclick="openTab(event, 'tab-S')">S</button>
        <button class="tab-button" onclick="openTab(event, 'tab-A')">A</button>
        <button class="tab-button" onclick="openTab(event, 'tab-B')">B</button>
        <button class="tab-button" onclick="openTab(event, 'tab-C')">C</button>
        <button class="tab-button" onclick="openTab(event, 'tab-D')">D</button>
        <button class="tab-button" onclick="openTab(event, 'tab-E')">E</button>
        <button class="tab-button" onclick="openTab(event, 'tab-F')">F</button>
        <button class="tab-button" onclick="openTab(event, 'tab-G')">G</button>
    </div>

    <!-- 本文表示部分（将来文字をたくさん追加しても、この枠の高さは変わりません） -->
    <div class="tab-content-container">
        <div id="tab-S" class="tab-panel active">アインシュタイン</div>
        <div id="tab-A" class="tab-panel">ニコラテスラ</div>
        <div id="tab-B" class="tab-panel">ガリレオ</div>
        <div id="tab-C" class="tab-panel">ゆたか</div>
        <div id="tab-D" class="tab-panel">ヘラクレイトス</div>
        <div id="tab-E" class="tab-panel">タレス</div>
        <div id="tab-F" class="tab-panel">コペラニクス</div>
        <div id="tab-G" class="tab-panel">グスタフ</div>
    </div>

    <!-- 切り替え用JavaScript -->
    <script>
        function openTab(evt, tabId) {
            // 一度すべてのパネルを非表示にする
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            // 一度すべてのボタンの選択状態を解除する
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));

            // クリックされたタブとパネルだけを表示状態にする
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
