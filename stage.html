<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人物紹介タブ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        /* タブボタンを横並びにする設定 */
        .tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            justify-content: center;
            overflow-x: auto;
        }

        /* ボタンの共通設定 */
        .tab-button {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff;
            font-weight: bold;
            border-radius: 4px;
            white-space: nowrap;
            transition: background-color 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 各ボタンごとの文字色指定（通常時） --- */
        .btn-S { color: #800080; } /* 紫 */
        .btn-A { color: #ff0000; } /* 赤 */
        .btn-B { color: #ffcc00; } /* 黄色 */
        
        /* ★Cのまわり（文字の背景）だけを黒く丸くする設定 */
        .btn-C .char-inner { 
            background-color: #000; 
            color: #fff; 
            display: inline-block;
            width: 24px;       /* 丸の横幅 */
            height: 24px;      /* 丸の高さ */
            line-height: 24px; /* 文字を真ん中に配置 */
            text-align: center;
            border-radius: 50%; /* 完全な丸にする */
        }
        /* Cボタン自体はパディング（余白）を少し削ってサイズを揃えます */
        .tab-button.btn-C {
            padding: 8px 11px; 
        }
        
        .btn-D { color: #0000ff; } /* 青（追加しました） */
        .btn-E { color: #7cfc00; } /* 黄緑 */
        .btn-F { color: #8b4513; } /* 茶色 */
        .btn-G { color: #000000; } /* 黒（そのまま） */


        /* ★最重要：選択されたタブ（activeクラス）の見た目 */
        .tab-buttons .tab-button.active {
            background-color: #007bff !important; /* 鮮やかな青 */
            color: #ffffff !important;            /* 文字は白 */
            border-color: #007bff !important;
        }

        /* ★選択された時は、Cの中の丸い黒背景を解除して全体を青く見せる設定 */
        .tab-buttons .tab-button.active .char-inner {
            background-color: transparent !important;
            color: #ffffff !important;
        }

        /* コンテンツを表示する枠の設定 */
        .tab-content-container {
            border: 1px solid #ccc;
            background-color: #fff;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            border-radius: 4px;
            box-sizing: border-box;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* 初期状態の非表示設定 */
        .tab-panel {
            display: none;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 16px;
        }

        /* 選択されたパネルを表示 */
        .tab-panel.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- タブボタン部分 -->
    <div class="tab-buttons">
        <button class="tab-button btn-S active" onclick="openTab(event, 'tab-S')">S</button>
        <button class="tab-button btn-A" onclick="openTab(event, 'tab-A')">A</button>
        <button class="tab-button btn-B" onclick="openTab(event, 'tab-B')">B</button>
        <!-- Cの文字だけを黒丸で囲むために <span> で囲んでいます -->
        <button class="tab-button btn-C" onclick="openTab(event, 'tab-C')"><span class="char-inner">C</span></button>
        <button class="tab-button btn-D" onclick="openTab(event, 'tab-D')">D</button>
        <button class="tab-button btn-E" onclick="openTab(event, 'tab-E')">E</button>
        <button class="tab-button btn-F" onclick="openTab(event, 'tab-F')">F</button>
        <button class="tab-button btn-G" onclick="openTab(event, 'tab-G')">G</button>
    </div>

    <!-- 本文表示部分 -->
    <div class="tab-content-container">
        <div id="tab-S" class="tab-panel active">アインシュタイン</div>
        <div id="tab-A" class="tab-panel">ニコラテスラ</div>
        <div id="tab-B" class="tab-panel">ガリレオ</div>
        <div id="tab-C" class="tab-panel">ゆたか</div>
        <div id="tab-D" class="tab-panel">ヘラクレイトス</div>
        <div id="tab-E" class="tab-panel">タレス</div>
        <div id="tab-F" class="tab-panel">コペラニクス</div>
        <div id="tab-G" class="tab-panel">グスタフ</div>
    </div>

    <script>
        function openTab(evt, tabId) {
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
