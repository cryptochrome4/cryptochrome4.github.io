<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人物紹介タブ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        /* タブボタンを横並びにする設定 */
        .tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            justify-content: center; /* 画面中央に配置（画像に寄せています） */
            overflow-x: auto;
        }

        /* ボタンの共通設定 */
        .tab-button {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff; /* 通常時は白背景 */
            font-weight: bold;
            border-radius: 4px;
            white-space: nowrap;
            transition: background-color 0.2s, color 0.2s; /* 切り替えをスムーズに */
        }

        /* --- 各ボタンごとの文字色・背景色の指定（通常時） --- */
        .btn-S { color: #800080; } /* 紫 */
        .btn-A { color: #ff0000; } /* 赤 */
        .btn-B { color: #ffcc00; } /* 黄色（見やすいよう少し濃いめ） */
        
        /* Cだけ背景黒・文字白 */
        .btn-C { 
            background-color: #000; 
            color: #fff; 
            border-color: #000;
        } 
        
        .btn-D { color: #000000; } /* 黒（そのまま） */
        .btn-E { color: #7cfc00; } /* 黄緑 */
        .btn-F { color: #8b4513; } /* 茶色 */
        .btn-G { color: #000000; } /* 黒（そのまま） */


        /* ★最重要：選択されたタブ（activeクラス）の見た目（画像の青色を再現） */
        .tab-buttons .tab-button.active {
            background-color: #007bff !important; /* 画像のような鮮やかな青 */
            color: #ffffff !important;            /* 文字は白に固定 */
            border-color: #007bff !important;
        }

        /* コンテンツを表示する枠の設定 */
        .tab-content-container {
            border: 1px solid #ccc;
            background-color: #fff;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            border-radius: 4px;
            box-sizing: border-box;
            max-width: 400px; /* 画像のコンパクトなサイズ感に合わせて制限（不要なら消してください） */
            margin: 0 auto;   /* 中央寄せ */
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* 軽い影をつけて画像に近づけています */
            text-align: center; /* 文字を中央寄せ（画像に寄せています） */
        }

        /* 初期状態の非表示設定 */
        .tab-panel {
            display: none;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 16px;
        }

        /* 選択されたパネルを表示 */
        .tab-panel.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- タブボタン部分 -->
    <div class="tab-buttons">
        <button class="tab-button btn-S active" onclick="openTab(event, 'tab-S')">S</button>
        <button class="tab-button btn-A" onclick="openTab(event, 'tab-A')">A</button>
        <button class="tab-button btn-B" onclick="openTab(event, 'tab-B')">B</button>
        <button class="tab-button btn-C" onclick="openTab(event, 'tab-C')">C</button>
        <button class="tab-button btn-D" onclick="openTab(event, 'tab-D')">D</button>
        <button class="tab-button btn-E" onclick="openTab(event, 'tab-E')">E</button>
        <button class="tab-button btn-F" onclick="openTab(event, 'tab-F')">F</button>
        <button class="tab-button btn-G" onclick="openTab(event, 'tab-G')">G</button>
    </div>

    <!-- 本文表示部分 -->
    <div class="tab-content-container">
        <div id="tab-S" class="tab-panel active">アインシュタイン</div>
        <div id="tab-A" class="tab-panel">ニコラテスラ</div>
        <div id="tab-B" class="tab-panel">ガリレオ</div>
        <div id="tab-C" class="tab-panel">ゆたか</div>
        <div id="tab-D" class="tab-panel">ヘラクレイトス</div>
        <div id="tab-E" class="tab-panel">タレス</div>
        <div id="tab-F" class="tab-panel">コペラニクス</div>
        <div id="tab-G" class="tab-panel">グスタフ</div>
    </div>

    <script>
        function openTab(evt, tabId) {
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
