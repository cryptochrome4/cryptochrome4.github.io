<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ランク切り替え（スクロールなし）</title>
    <style>
        /* 画面全体の設定：縦スクロールを完全に禁止 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }

        /* コンテナの設定 */
        .container {
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ボタンのレイアウト（画面幅からはみ出さないようグリッド配置） */
        .tab-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        /* ボタンのスタイル */
        .tab-btn {
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ccc;
            background-color: white;
            border-radius: 6px;
            transition: all 0.2s;
        }

        /* 選択されているボタンのスタイル */
        .tab-btn.active {
            background-color: #ff5252;
            color: white;
            border-color: #ff5252;
        }

        /* コンテンツ表示エリア（高さを固定して画面の縦伸び・スクロールを完全防止） */
        .content-area {
            height: 80px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 初期状態では非表示にする設定 */
        .tab-content {
            display: none;
        }

        /* activeクラスがついたコンテンツだけを表示 */
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SからGまでの切り替えボタン -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('tab-s', this)">S</button>
            <button class="tab-btn" onclick="switchTab('tab-a', this)">A</button>
            <button class="tab-btn" onclick="switchTab('tab-b', this)">B</button>
            <button class="tab-btn" onclick="switchTab('tab-c', this)">C</button>
            <button class="tab-btn" onclick="switchTab('tab-d', this)">D</button>
            <button class="tab-btn" onclick="switchTab('tab-e', this)">E</button>
            <button class="tab-btn" onclick="switchTab('tab-f', this)">F</button>
            <button class="tab-btn" onclick="switchTab('tab-g', this)">G</button>
        </div>

        <!-- コンテンツエリア（定位置表示） -->
        <div class="content-area">
            <div id="tab-s" class="tab-content active">アインシュタイン</div>
            <div id="tab-a" class="tab-content">ニコラテスラ</div>
            <div id="tab-b" class="tab-content">ガリレオ</div>
            <div id="tab-c" class="tab-content">ゆたか</div>
            <div id="tab-d" class="tab-content">ヘラクレイトス</div>
            <div id="tab-e" class="tab-content">タレス</div>
            <div id="tab-f" class="tab-content">コペラニクス</div>
            <div id="tab-g" class="tab-content">グスタフ</div>
        </div>
    </div>

    <script>
        // ボタンと文字を定位置で瞬時に切り替える関数
        function switchTab(tabId, buttonElement) {
            // すべてのコンテンツをいったん非表示にする
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));

            // すべてのボタンの選択状態をいったん解除する
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // クリックされたコンテンツとボタンだけをアクティブ（表示）にする
            document.getElementById(tabId).classList.add('active');
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
