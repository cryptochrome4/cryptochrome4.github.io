<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギリシャ証券</title>
<style>
  /* ===== ヴィンテージ風ベース ===== */
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root {
    --paper: #f4ecd8;
    --paper-dark: #e8dcc0;
    --ink: #3a2f1e;
    --ink-light: #6b5b3e;
    --accent: #8b3a2a;
    --accent2: #1e3a5f;
    --gold: #b08d3f;
    --border: #b8a67d;
    --shadow: rgba(60, 45, 20, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Kaku Gothic New', 'Shippori Mincho', serif;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(180,160,120,0.05) 2px, rgba(180,160,120,0.05) 4px),
      radial-gradient(circle at 20% 10%, rgba(200,180,140,0.3), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(180,150,110,0.2), transparent 60%);
    color: var(--ink);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ===== ヘッダー ===== */
  header {
    background: linear-gradient(180deg, #efe4c8, #e2d4b0);
    border-bottom: 3px double var(--border);
    box-shadow: 0 3px 10px var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h1.site-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--ink);
    text-shadow: 1px 1px 0 rgba(255,255,255,0.6), 2px 2px 3px var(--shadow);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 2px;
  }

  .menu-btn {
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    width: 42px;
    height: 42px;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .menu-btn:hover { background: var(--accent); border-color: var(--accent); }
  .menu-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }

  /* ヘッダー右上リンク群 */
  .header-links {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }

  .header-links button {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 10px;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.82rem;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .header-links button:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 6px;
    background: rgba(255,255,255,0.4);
  }
  .search-box input {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--ink);
    outline: none;
    width: 120px;
  }
  .search-box span { cursor: pointer; }

  /* ===== メニューパネル ===== */
  .menu-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 20px;
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: 6px;
    box-shadow: 4px 4px 0 var(--shadow);
    min-width: 240px;
    z-index: 200;
    padding: 8px 0;
  }
  .menu-panel.open { display: block; }
  .menu-panel > button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--border);
    padding: 10px 18px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
  }
  .menu-panel > button:last-child { border-bottom: none; }
  .menu-panel > button:hover { background: var(--paper-dark); padding-left: 24px; }

  /* サービスサブメニュー */
  .service-sub {
    display: none;
    background: rgba(0,0,0,0.03);
    border-left: 3px solid var(--gold);
    margin: 0 8px 6px 8px;
    border-radius: 3px;
  }
  .service-sub.open { display: block; }
  .service-sub h4 {
    font-size: 0.78rem;
    color: var(--accent);
    padding: 8px 12px 4px;
    letter-spacing: 0.05em;
    font-weight: 700;
  }
  .service-sub button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 5px 16px 5px 22px;
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.15s;
  }
  .service-sub button:hover { color: var(--accent); background: rgba(180,140,80,0.1); }

  /* ===== ナビゲーション（タイトル下） ===== */
  .nav-primary {
    display: flex;
    gap: 4px;
    padding: 8px 20px;
    background: linear-gradient(180deg, #dcccaa, #d0be98);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .nav-primary button {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 6px 16px;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-primary button:hover {
    background: var(--paper);
    border-color: var(--border);
    box-shadow: 1px 1px 0 var(--shadow);
  }

  hr.nav-divider {
    border: none;
    border-top: 2px solid var(--border);
    border-bottom: 1px solid rgba(255,255,255,0.5);
    margin: 0;
  }

  .nav-secondary {
    display: flex;
    gap: 4px;
    padding: 8px 20px;
    background: linear-gradient(180deg, #e2d4b0, #d8c8a2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    position: relative;
  }
  .nav-secondary button {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 5px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-secondary button:hover {
    background: var(--paper);
    border-color: var(--border);
  }
  .nav-secondary button.active {
    background: var(--ink);
    color: var(--paper);
  }

  /* その他の商品サブメニュー */
  .other-sub {
    display: none;
    position: absolute;
    top: 100%;
    left: 20px;
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: 6px;
    box-shadow: 4px 4px 0 var(--shadow);
    z-index: 150;
    padding: 6px 0;
    min-width: 220px;
  }
  .other-sub.open { display: block; }
  .other-sub button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 7px 18px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
  }
  .other-sub button:hover { background: var(--paper-dark); padding-left: 24px; }

  /* ===== 吹き出し（マーケットトップ等） ===== */
  .bubble-section {
    margin: 24px 20px 0;
  }
  .bubble {
    position: relative;
    background: linear-gradient(180deg, #faf3e0, #f0e6cc);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 18px 22px;
    box-shadow: 3px 3px 0 var(--shadow);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 40px;
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 14px solid var(--border);
  }
  .bubble::before {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 42px;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 12px solid #f0e6cc;
    z-index: 1;
  }
  .bubble button {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }
  .bubble button:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ===== モーダル（解説表示） ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40, 30, 15, 0.55);
    z-index: 500;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(180,160,120,0.04) 3px, rgba(180,160,120,0.04) 6px);
    border: 3px double var(--border);
    border-radius: 8px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 6px 6px 0 var(--shadow);
    position: relative;
    animation: modalIn 0.25s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    background: linear-gradient(180deg, #e2d4b0, #d4c49c);
    padding: 14px 20px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .modal-header h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.25rem;
    color: var(--ink);
    letter-spacing: 0.05em;
  }
  .modal-close {
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: var(--ink); transform: rotate(90deg); }

  .modal-body {
    padding: 20px 24px 26px;
  }
  .modal-body .meaning {
    margin-bottom: 18px;
  }
  .modal-body .meaning h3 {
    font-size: 0.82rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    border-left: 4px solid var(--gold);
    padding-left: 8px;
  }
  .modal-body .meaning p {
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--ink);
  }
  .modal-body .soccer {
    background: rgba(30, 58, 95, 0.06);
    border: 1px dashed var(--accent2);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .modal-body .soccer h3 {
    font-size: 0.82rem;
    color: var(--accent2);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-body .soccer p {
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--ink);
  }

  /* フッター */
  footer {
    text-align: center;
    margin-top: 50px;
    font-size: 0.78rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
  }

  /* レスポンシブ */
  @media (max-width: 720px) {
    h1.site-title { font-size: 1.25rem; }
    .header-top { padding: 10px 12px; }
    .header-links { font-size: 0.75rem; }
    .search-box input { width: 80px; }
    .nav-primary, .nav-secondary { padding: 6px 10px; }
    .nav-primary button { padding: 5px 10px; font-size: 0.82rem; }
    .nav-secondary button { padding: 4px 8px; font-size: 0.78rem; }
    .bubble-section { margin: 18px 10px 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="title-area">
      <h1 class="site-title">ギリシャ証券</h1>
      <button class="menu-btn" id="menuBtn" aria-label="メニュー">☰</button>
    </div>

    <div class="header-links">
      <button data-term="3銘柄">3銘柄</button>

  <!-- メニューパネル -->

      <button data-term="ツール・アプリ">ツール・アプリ</button>

      <button data-term="セミナー・イベント">セミナー・イベント</button>
      <button data-term="各種ご案内">各種ご案内</button>
    </div>
    <button data-term="サポート">サポート</button>
    <button data-term="ログアウト">ログアウト</button>
  </div>
</header>

<!-- 第1ナビ -->
<div class="nav-primary">
  <button data-term="ポートフォリオ">ポートフォリオ</button>
  <button data-term="口座管理">口座管理</button>
  <button data-term="取引">取引</button>
  <button data-term="入出金">入出金</button>
</div>

<div class="nav-secondary">
  <button data-term="ホーム">ホーム</button>

  <button data-term="NISA">NISA</button>
  <button data-term="国内株式">国内株式</button>
  <button data-term="外国株式">外国株式</button>
  <button data-term="投資信託">投資信託</button>

  <div class="other-sub" id="otherSub">

    <button data-term="先物・オプション">先物・オプション</button>
    <button data-term="商品先物">商品先物</button>
    <button data-term="金・銀・プラチナ">金・銀・プラチナ</button>
    <button data-term="外貨建MMF">外貨建MMF</button>

<footer>

</footer>

<!-- モーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

        <h3>⚽ サッカーで例えると</h3>
        <p id="modalSoccer"></p>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   用語解説データ（意味＋サッカー例え）
   ============================================================ */
const TERMS = {
  "3銘柄": {
    meaning: "よく見る・よく取引する3つの銘柄をピックアップしてすぐアクセスできるようにしたショートカット機能。ウォッチリストの簡易版。",
    soccer: "試合前に監督が『今日のキーマン3人』をロッカーで名指しするようなもの。全員を覚える前に、まず注目すべき3人をチェック。"
  },
  "国内株式": {
    meaning: "日本国内の証券取引所に上場している企業の株式。東京証券取引所（プライム・スタンダード・グロース）などで売買される。",
    soccer: "Jリーグの選手。国内のピッチで活躍する選手たちで、ルールも会場も見慣れたもの。"
  },
  "外国株式": {
    meaning: "海外の証券取引所に上場している企業の株式。米国株・中国株・欧州株など。為替の影響も受ける。",
    soccer: "海外リーグの選手。プレミアリーグやラ・リーガのスターたちで、見るには時差や言語の壁があるが、魅力的。"
  },
  "投資信託": {
    meaning: "多くの投資家から資金を集め、専門家（ファンドマネージャー）がまとめて運用する金融商品。少額から分散投資ができる。",
    soccer: "クラブチーム。一人で戦うのではなく、みんなのお金と力を集めて、監督（ファンドマネージャー）が采配する。"
  },
  "銀行": {
    meaning: "預金・融資・為替などの金融サービスを提供する機関。SBI証券では住信SBIネット銀行などと連携したサービスがある。",
    soccer: "クラブの運営本部。選手（投資）を支える裏方で、資金の管理や送金を担当する。"
  },
  "保険": {
    meaning: "病気・事故・死亡などのリスクに備えて、あらかじめお金を払っておき、万が一のときに給付を受ける仕組み。",
    soccer: "控えのGKや保険的な守備選手。普段は出番がなくても、いざという時にチームを救う。"
  },
  "メッセージ": {
    meaning: "証券会社から利用者へのお知らせ・連絡事項。重要なお知らせや取引に関する通知が届く。",
    soccer: "監督からの指示メモ。試合中にベンチから送られる戦術変更や注意事項。"
  },

/* ============================================================
   モーダル制御
   ============================================================ */
const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalMeaning = document.getElementById('modalMeaning');
const modalSoccer = document.getElementById('modalSoccer');
const modalClose = document.getElementById('modalClose');

function openModal(term) {
  const data = TERMS[term];
  if (!data) {
    modalTitle.textContent = term;
    modalMeaning.textContent = "この用語の解説は準備中です。";
    modalSoccer.textContent = "サッカー例えも準備中です。";
  } else {
    modalTitle.textContent = term;
    modalMeaning.textContent = data.meaning;
    modalSoccer.textContent = data.soccer;
  }
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================================
   すべての data-term ボタンにモーダルを紐付け
   ============================================================ */
document.querySelectorAll('[data-term]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    openModal(btn.dataset.term);
  });
});

/* ============================================================
   メニューパネル開閉
   ============================================================ */
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');

menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  menuPanel.classList.toggle('open');
});

/* メニュー外クリックで閉じる */
document.addEventListener('click', (e) => {
  if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
    menuPanel.classList.remove('open');
  }
});

/* ============================================================
   サービスサブメニュー開閉
   ============================================================ */
const serviceToggle = document.getElementById('serviceToggle');
const serviceSub = document.getElementById('serviceSub');

serviceToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  serviceSub.classList.toggle('open');
  serviceToggle.textContent = serviceSub.classList.contains('open') ? 'サービス ▾' : 'サービス ▸';
});

/* ============================================================
   その他の商品サブメニュー開閉
   ============================================================ */

const otherSub = document.getElementById('otherSub');

otherToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  otherSub.classList.toggle('open');
  otherToggle.textContent = otherSub.classList.contains('open') ? 'その他の商品 ▴' : 'その他の商品 ▾';
});

document.addEventListener('click', (e) => {
  if (!otherSub.contains(e.target) && e.target !== otherToggle) {
    otherSub.classList.remove('open');
    otherToggle.textContent = 'その他の商品 ▾';
  }
});

/* ============================================================
   その他の商品サブメニュー内のボタンクリックで閉じる
   ============================================================ */
otherSub.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    otherSub.classList.remove('open');
    otherToggle.textContent = 'その他の商品 ▾';
  });
});

/* サービスサブメニュー内ボタンクリックで閉じる */
serviceSub.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    serviceSub.classList.remove('open');
    serviceToggle.textContent = 'サービス ▸';
    menuPanel.classList.remove('open');
  });
});
