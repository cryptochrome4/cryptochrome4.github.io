<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GRTを探せ！ - マイクラ風</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameWrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,200,255,0.3);
            border: 2px solid #0f3460;
        }
        #canvasContainer {
            position: relative;
            width: 800px;
            height: 500px;
            overflow: hidden;
            border: 4px solid #533483;
            border-radius: 8px;
            background: #87CEEB;
        }
        #canvas {
            display: block;
            background: #87CEEB;
            image-rendering: pixelated;
            cursor: pointer;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: #2d2d44;
            border: 2px solid #6a4c93;
            color: #eee;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .mode-btn.active {
            background: #6a4c93;
            border-color: #b58cd9;
            box-shadow: 0 0 12px #b58cd9;
        }
        .mode-btn:hover { background: #3d3d5c; }
        #bagDisplay {
            background: #0d0d1a;
            color: #ffd700;
            padding: 4px 18px;
            border-radius: 30px;
            border: 2px solid #ffd700;
            font-size: 16px;
            font-weight: bold;
        }
        #status {
            color: #b0e0ff;
            font-size: 15px;
            background: #0d0d1a;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a6b8f;
            min-width: 120px;
            text-align: center;
        }
        #grtCounter {
            color: #ff6b6b;
            font-size: 18px;
            background: #1a0a0a;
            padding: 4px 16px;
            border-radius: 30px;
            border: 2px solid #ff6b6b;
            font-weight: bold;
        }
        .controls-hint {
            color: #8899aa;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        #studyModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #studyModal iframe {
            width: 90%;
            height: 80%;
            border: 4px solid #ffd700;
            border-radius: 16px;
            background: white;
        }
        #studyModal .close-btn {
            margin-top: 20px;
            padding: 12px 40px;
            background: #ff6b6b;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px #ff6b6b88;
        }
        #studyModal .close-btn:hover { background: #ff4757; }
        #grtFoundMsg {
            color: #ffd700;
            font-size: 28px;
            text-shadow: 0 0 30px gold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <canvas id="canvas" width="800" height="500"></canvas>
    </div>

    <div id="ui">
        <div>
            <button class="mode-btn active" data-mode="dig" id="modeDig">⛏ 掘る</button>
            <button class="mode-btn" data-mode="place" id="modePlace">🧱 置く</button>
        </div>
        <div id="bagDisplay">🎒 <span id="bagCount">0</span></div>
        <div id="status">⛏ 掘るモード</div>
        <div id="grtCounter">GRT-</div>
    </div>
    <div class="controls-hint">
        [ WASD移動 / スペースジャンプ / クリックで掘るor置く / マウスホイールでスクロール ]
    </div>
</div>

<!-- 勉強サイト表示モーダル -->
<div id="studyModal">
    <div id="grtFoundMsg">🎉 GRT+ 発見！ 学習サイトを開きます 🎉</div>
    <iframe id="studyFrame" src="about:blank"></iframe>
    <button class="close-btn" id="closeStudy">✕ 閉じてゲームに戻る</button>
</div>

<script>
(function() {
    // ---------- 2013年対応: var 使用 ----------
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var container = document.getElementById('canvasContainer');

    // ワールドサイズ (広大に)
    var WORLD_WIDTH = 40;
    var WORLD_HEIGHT = 40;
    var BLOCK = 25;

    // カメラ位置
    var cameraX = 0;
    var cameraY = 0;

    // ブロックタイプ
    var AIR = 0;
    var DIRT = 1;
    var GRASS = 2;
    var STONE = 3;
    var WOOD = 4;
    var PLANKS = 5;
    var GRT_BLOCK = 6;

    // ワールドデータ
    var world = [];
    var player = { x: 5, y: 10 };
    var velocityY = 0;
    var onGround = false;
    var bag = [];
    var mode = 'dig';
    var grtFound = false;
    var grtPosition = null;

    // キー状態
    var keys = {};

    // ---------- ワールド生成 ----------
    function initWorld() {
        // 全部AIR
        for (var r = 0; r < WORLD_HEIGHT; r++) {
            world[r] = [];
            for (var c = 0; c < WORLD_WIDTH; c++) {
                world[r][c] = AIR;
            }
        }

        // ---- 地表 (y=15〜20 の間で起伏) ----
        for (var x = 0; x < WORLD_WIDTH; x++) {
            var height = 15 + Math.floor(Math.random() * 6);
            for (var y = height; y < WORLD_HEIGHT; y++) {
                if (y === height) {
                    world[y][x] = GRASS;
                } else if (y < height + 4) {
                    world[y][x] = DIRT;
                } else {
                    world[y][x] = STONE;
                }
            }
        }

        // ---- 木を何本か ----
        for (var i = 0; i < 8; i++) {
            var tx = 3 + Math.floor(Math.random() * (WORLD_WIDTH - 6));
            var ty = 14 + Math.floor(Math.random() * 6);
            if (ty < 18) {
                // 幹
                for (var h = 0; h < 4; h++) {
                    if (ty - h >= 0) world[ty - h][tx] = WOOD;
                }
                // 葉っぱ (簡易)
                for (var dy = -2; dy <= 2; dy++) {
                    for (var dx = -2; dx <= 2; dx++) {
                        if (Math.abs(dx) === 2 && Math.abs(dy) === 2) continue;
                        var ny = ty - 4 + dy;
                        var nx = tx + dx;
                        if (ny >= 0 && ny < WORLD_HEIGHT && nx >= 0 && nx < WORLD_WIDTH) {
                            if (world[ny][nx] === AIR) world[ny][nx] = PLANKS;
                        }
                    }
                }
            }
        }

        // ---- 家を2つ ----
        buildHouse(12, 12);
        buildHouse(28, 10);

        // ---- GRTをランダムに1つだけ地下に配置 ----
        var placed = false;
        var attempts = 0;
        while (!placed && attempts < 1000) {
            var gx = Math.floor(Math.random() * WORLD_WIDTH);
            var gy = 20 + Math.floor(Math.random() * (WORLD_HEIGHT - 22));
            if (world[gy] && world[gy][gx] === DIRT) {
                world[gy][gx] = GRT_BLOCK;
                grtPosition = { x: gx, y: gy };
                placed = true;
                break;
            }
            attempts++;
        }
        // もし置けなかったら強制配置
        if (!placed) {
            world[22][10] = GRT_BLOCK;
            grtPosition = { x: 10, y: 22 };
        }

        // プレイヤーを地表に
        player.x = 5;
        player.y = 14;
        while (player.y < WORLD_HEIGHT && world[player.y][player.x] === AIR) {
            player.y++;
        }
        player.y--;
    }

    function buildHouse(hx, hy) {
        // 壁
        for (var y = hy - 3; y <= hy; y++) {
            for (var x = hx - 3; x <= hx + 3; x++) {
                if (y === hy - 3 || y === hy || x === hx - 3 || x === hx + 3) {
                    if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
                        if (world[y][x] === AIR || world[y][x] === GRASS || world[y][x] === DIRT) {
                            world[y][x] = WOOD;
                        }
                    }
                }
            }
        }
        // ドア (簡易)
        if (hx >= 0 && hx < WORLD_WIDTH && hy >= 0 && hy < WORLD_HEIGHT) {
            if (world[hy][hx] === WOOD) world[hy][hx] = AIR;
        }
    }

    // ---------- 物理演算 ----------
    function updatePhysics() {
        var GRAVITY = 0.5;
        var JUMP_FORCE = -8;
        var FRICTION = 0.8;

        // 水平移動
        var speed = 2;
        if (keys['a'] || keys['A'] || keys['ArrowLeft']) {
            player.x -= speed;
        }
        if (keys['d'] || keys['D'] || keys['ArrowRight']) {
            player.x += speed;
        }

        // ジャンプ
        if ((keys[' '] || keys['Space'] || keys['w'] || keys['W'] || keys['ArrowUp']) && onGround) {
            velocityY = JUMP_FORCE;
            onGround = false;
        }

        // 重力
        velocityY += GRAVITY;
        if (velocityY > 10) velocityY = 10;

        // Y軸移動（衝突判定）
        var newY = player.y + velocityY;
        var footY = Math.floor(newY + 0.5);
        var headY = Math.floor(player.y - 0.5);
        var colX = Math.floor(player.x + 0.5);

        // プレイヤーの幅は1ブロックとして簡易判定
        var minX = Math.floor(player.x - 0.3);
        var maxX = Math.floor(player.x + 0.3);

        // 落下判定
        var blocked = false;
        for (var cx = minX; cx <= maxX; cx++) {
            if (cx < 0 || cx >= WORLD_WIDTH) continue;
            var checkY = Math.floor(newY + 0.5);
            if (checkY >= 0 && checkY < WORLD_HEIGHT) {
                if (world[checkY][cx] !== AIR) {
                    blocked = true;
                    break;
                }
            }
        }

        if (blocked || newY >= WORLD_HEIGHT - 1) {
            if (velocityY > 0) {
                velocityY = 0;
                onGround = true;
                newY = Math.floor(player.y);
                // 足元がブロックかチェック
                var belowY = Math.floor(player.y + 0.5);
                var isBlockBelow = false;
                for (var cx2 = minX; cx2 <= maxX; cx2++) {
                    if (cx2 < 0 || cx2 >= WORLD_WIDTH) continue;
                    if (belowY + 1 < WORLD_HEIGHT && world[belowY + 1] && world[belowY + 1][cx2] !== AIR) {
                        isBlockBelow = true;
                        break;
                    }
                }
                if (!isBlockBelow) onGround = false;
            }
        } else {
            player.y = newY;
            onGround = false;
        }

        // 端から落ちない
        if (player.x < 0.5) player.x = 0.5;
        if (player.x > WORLD_WIDTH - 0.5) player.x = WORLD_WIDTH - 0.5;
        if (player.y < 0) { player.y = 0; velocityY = 0; }
        if (player.y > WORLD_HEIGHT - 1) { player.y = WORLD_HEIGHT - 1; velocityY = 0; }

        // カメラ追従
        var targetCamX = player.x * BLOCK - canvas.width / 2;
        var targetCamY = player.y * BLOCK - canvas.height / 2;
        cameraX += (targetCamX - cameraX) * 0.1;
        cameraY += (targetCamY - cameraY) * 0.1;

        // カメラ制限
        if (cameraX < 0) cameraX = 0;
        if (cameraY < 0) cameraY = 0;
        if (cameraX > WORLD_WIDTH * BLOCK - canvas.width) cameraX = WORLD_WIDTH * BLOCK - canvas.width;
        if (cameraY > WORLD_HEIGHT * BLOCK - canvas.height) cameraY = WORLD_HEIGHT * BLOCK - canvas.height;
    }

    // ---------- 描画 ----------
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 描画範囲計算
        var startX = Math.max(0, Math.floor(cameraX / BLOCK));
        var endX = Math.min(WORLD_WIDTH, Math.ceil((cameraX + canvas.width) / BLOCK) + 1);
        var startY = Math.max(0, Math.floor(cameraY / BLOCK));
        var endY = Math.min(WORLD_HEIGHT, Math.ceil((cameraY + canvas.height) / BLOCK) + 1);

        // 背景（空）
        var grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#87CEEB');
        grad.addColorStop(0.6, '#87CEEB');
        grad.addColorStop(1, '#B0D4E8');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ブロック描画
        for (var r = startY; r < endY; r++) {
            for (var c = startX; c < endX; c++) {
                var type = world[r][c];
                if (type === AIR) continue;

                var x = c * BLOCK - cameraX;
                var y = r * BLOCK - cameraY;

                switch(type) {
                    case GRASS: ctx.fillStyle = '#7CB342'; break;
                    case DIRT: ctx.fillStyle = '#8D6E63'; break;
                    case STONE: ctx.fillStyle = '#9E9E9E'; break;
                    case WOOD: ctx.fillStyle = '#A1887F'; break;
                    case PLANKS: ctx.fillStyle = '#8D6E63'; break;
                    case GRT_BLOCK:
                        ctx.fillStyle = '#FFD700';
                        ctx.shadowColor = '#FFD700';
                        ctx.shadowBlur = 20;
                        break;
                    default: ctx.fillStyle = '#888';
                }
                ctx.fillRect(x, y, BLOCK-1, BLOCK-1);
                ctx.shadowBlur = 0;

                if (type === GRT_BLOCK) {
                    ctx.fillStyle = '#000';
                    ctx.font = '16px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', x + BLOCK/2, y + BLOCK/2);
                }
            }
        }

        // プレイヤー (棒人間)
        var px = player.x * BLOCK - cameraX;
        var py = player.y * BLOCK - cameraY;

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(px, py + 14, 10, 4, 0, 0, Math.PI*2);
        ctx.fill();

        // 体
        ctx.fillStyle = '#4FC3F7';
        ctx.strokeStyle = '#01579B';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py-6, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // 目 (向き)
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(px-4, py-8, 2, 0, Math.PI*2);
        ctx.arc(px+4, py-8, 2, 0, Math.PI*2);
        ctx.fill();

        // 体
        ctx.strokeStyle = '#01579B';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, py+3);
        ctx.lineTo(px, py+12);
        ctx.stroke();

        // 足 (歩きアニメーション風)
        var walkOffset = (keys['a'] || keys['d'] || keys['ArrowLeft'] || keys['ArrowRight']) ? Math.sin(Date.now() / 100) * 3 : 0;
        ctx.beginPath();
        ctx.moveTo(px-4, py+12);
        ctx.lineTo(px-7 + walkOffset, py+18);
        ctx.moveTo(px+4, py+12);
        ctx.lineTo(px+7 - walkOffset, py+18);
        ctx.stroke();

        // 腕
        ctx.beginPath();
        ctx.moveTo(px-2, py+4);
        ctx.lineTo(px-8, py+10);
        ctx.moveTo(px+2, py+4);
        ctx.lineTo(px+8, py+10);
        ctx.stroke();

        // GRT発見メッセージ (画面内)
        if (grtFound) {
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 32px monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 30;
            ctx.fillText('🎉 GRT+ 発見！', canvas.width/2, 60);
            ctx.shadowBlur = 0;
        }
    }

    // ---------- 掘る/置く ----------
    function getTargetBlock() {
        // プレイヤーの視線方向 (常に上)
        var tx = Math.floor(player.x + 0.5);
        var ty = Math.floor(player.y - 0.5);
        if (ty < 0 || ty >= WORLD_HEIGHT || tx < 0 || tx >= WORLD_WIDTH) return null;
        return { x: tx, y: ty };
    }

    function digBlock() {
        var target = getTargetBlock();
        if (!target) return;
        var tx = target.x, ty = target.y;
        var block = world[ty][tx];
        if (block === AIR) return;

        if (block === GRT_BLOCK) {
            world[ty][tx] = AIR;
            grtFound = true;
            updateGrtDisplay();
            showStudyModal();
            return;
        }

        bag.push(block);
        world[ty][tx] = AIR;
        updateGrtDisplay();
    }

    function placeBlock() {
        if (bag.length === 0) return;
        var target = getTargetBlock();
        if (!target) return;
        var tx = target.x, ty = target.y;
        if (world[ty][tx] !== AIR) return;
        // プレイヤーの位置には置けない
        var px = Math.floor(player.x + 0.5);
        var py = Math.floor(player.y + 0.5);
        if (tx === px && ty === py) return;

        var block = bag.pop();
        world[ty][tx] = block;
        updateGrtDisplay();
    }

    // ---------- UI更新 ----------
    function updateGrtDisplay() {
        var el = document.getElementById('grtCounter');
        if (grtFound) {
            el.textContent = 'GRT+ 発見！';
            el.style.color = '#FFD700';
            el.style.borderColor = '#FFD700';
        } else {
            el.textContent = 'GRT- (地下を探せ!)';
            el.style.color = '#FF6B6B';
            el.style.borderColor = '#FF6B6B';
        }
        document.getElementById('bagCount').textContent = bag.length;
    }

    // ---------- 勉強サイト表示 ----------
    function showStudyModal() {
        var modal = document.getElementById('studyModal');
        var frame = document.getElementById('studyFrame');
        modal.style.display = 'flex';

        var content = `
        <html>
        <head><meta charset="UTF-8"><title>GRT 学習サイト</title>
        <style>
            body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f4f8; }
            h1 { color: #1a237e; border-bottom: 4px solid gold; }
            .card { background: white; border-radius: 12px; padding: 16px; margin: 16px 0; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
            .soccer { background: #e8f5e9; padding: 10px; border-left: 6px solid #2e7d32; }
        </style>
        </head>
        <body>
        <h1>⚽ GRT 学習コンテンツ</h1>
        <div class="card">
            <h2>📊 データベース + SQL</h2>
            <p><strong>データベース</strong> = クラブの選手名簿。<br>
            <strong>SQL</strong> = 監督のホイッスル。</p>
            <div class="soccer">⚽ 例: SELECT * FROM players WHERE position = 'FW';</div>
        </div>
        <div class="card">
            <h2>🔗 DB設計: リレーション・正規化・テーブル設計</h2>
            <p><strong>リレーション</strong> = 選手とポジションの関連。<br>
            <strong>正規化</strong> = ユニフォーム番号の重複を排除。</p>
            <div class="soccer">⚽ 例: 選手テーブルとチームテーブルを外部キーで結ぶ</div>
        </div>
        <div class="card">
            <h2>🔒 トランザクション・ロック・デッドロック</h2>
            <p><strong>トランザクション</strong> = 交代手続き。<br>
            <strong>ロック</strong> = ボール保持者は他者が奪えない。<br>
            <strong>デッドロック</strong> = 2人が「先にパスをくれ」と譲らず停止。</p>
            <div class="soccer">⚽ 例: ロック待ちで試合が止まる → デッドロック回避が必要</div>
        </div>
        <p style="margin-top:20px; color:#1a237e; font-weight:bold;">🎉 GRT+ 発見！ あなたはデータベースマスターへの第一歩を踏み出しました！</p>
        </body>
        </html>
        `;
        frame.srcdoc = content;
    }

    // ---------- ゲームループ ----------
    function gameLoop() {
        updatePhysics();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---------- イベント登録 ----------
    // モード切替
    document.getElementById('modeDig').addEventListener('click', function() {
        mode = 'dig';
        document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById('status').textContent = '⛏ 掘るモード';
    });
    document.getElementById('modePlace').addEventListener('click', function() {
        mode = 'place';
        document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById('status').textContent = '🧱 置くモード';
    });

    // クリックで掘る/置く
    canvas.addEventListener('click', function() {
        if (mode === 'dig') digBlock();
        else if (mode === 'place') placeBlock();
    });

    // キーボード
    document.addEventListener('keydown', function(e) {
        keys[e.key] = true;
        if (e.key === ' ') e.preventDefault();
        // スペースでジャンプ
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
        }
    });
    document.addEventListener('keyup', function(e) {
        keys[e.key] = false;
    });

    // マウスホイールでスクロール (カメラ上下)
    canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY > 0 ? 30 : -30;
        cameraY += delta;
        if (cameraY < 0) cameraY = 0;
        if (cameraY > WORLD_HEIGHT * BLOCK - canvas.height) cameraY = WORLD_HEIGHT * BLOCK - canvas.height;
    }, { passive: false });

    // モーダル閉じる
    document.getElementById('closeStudy').addEventListener('click', function() {
        document.getElementById('studyModal').style.display = 'none';
    });

    // ---------- 起動 ----------
    initWorld();
    updateGrtDisplay();
    gameLoop();

    // GRTの位置をコンソールに表示（デバッグ用）
    if (grtPosition) {
        console.log('GRTは地下 (' + grtPosition.x + ', ' + grtPosition.y + ') にあります！');
        console.log('地下に行くにはマウスホイールでスクロールするか、下に掘って進んでください。');
    }

})();
</script>
</body>
</html>
