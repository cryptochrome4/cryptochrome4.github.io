<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GRTを探せ！ - テラリア風</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameWrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,200,255,0.3);
            border: 2px solid #0f3460;
            position: relative;
        }
        #canvasContainer {
            position: relative;
            width: 800px;
            height: 500px;
            overflow: hidden;
            border: 4px solid #533483;
            border-radius: 8px;
            background: #1a1a2e;
            cursor: crosshair;
        }
        #canvas {
            display: block;
            background: #1a1a2e;
            image-rendering: pixelated;
        }
        
        /* 画面上の操作ボタン（左右とジャンプと下掘り） */
        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(45, 45, 68, 0.85);
            border: 2px solid #6a4c93;
            color: white;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
            line-height: 60px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 3px 0 rgba(0,0,0,0.5);
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .ctrl-btn.left { grid-column: 1; grid-row: 2; }
        .ctrl-btn.jump { 
            grid-column: 2; grid-row: 2; 
            background: rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
            font-size: 14px;
            line-height: 60px;
        }
        .ctrl-btn.right { grid-column: 3; grid-row: 2; }
        .ctrl-btn.dig-down { 
            grid-column: 2; grid-row: 3;
            background: rgba(255, 100, 100, 0.3);
            border-color: #FF6B6B;
            font-size: 14px;
            line-height: 60px;
        }
        .ctrl-btn.scroll-up { 
            grid-column: 3; grid-row: 1;
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
            line-height: 60px;
        }
        .ctrl-btn.scroll-down { 
            grid-column: 3; grid-row: 3;
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
            line-height: 60px;
        }

        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        #status {
            color: #b0e0ff;
            font-size: 15px;
            background: #0d0d1a;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a6b8f;
            min-width: 120px;
            text-align: center;
        }
        #grtCounter {
            color: #ff6b6b;
            font-size: 18px;
            background: #1a0a0a;
            padding: 4px 16px;
            border-radius: 30px;
            border: 2px solid #ff6b6b;
            font-weight: bold;
        }
        #grtCounter.found {
            color: #FFD700;
            border-color: #FFD700;
            background: #1a1a0a;
        }
        .hint {
            color: #8899aa;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }
        #studyModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #studyModal iframe {
            width: 90%;
            height: 80%;
            border: 4px solid #ffd700;
            border-radius: 16px;
            background: white;
        }
        #studyModal .close-btn {
            margin-top: 20px;
            padding: 12px 40px;
            background: #ff6b6b;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px #ff6b6b88;
        }
        #studyModal .close-btn:hover { background: #ff4757; }
        #grtFoundMsg {
            color: #ffd700;
            font-size: 28px;
            text-shadow: 0 0 30px gold;
            margin-bottom: 10px;
        }
        #blockCounter {
            color: #FF6B6B;
            font-size: 15px;
            background: #0d0d1a;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #FF6B6B;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <canvas id="canvas" width="800" height="500"></canvas>
        
        <!-- マウス操作用ボタン -->
        <div id="controls">
            <div class="ctrl-btn scroll-up" id="scrollUp">▲▲</div>
            <div class="ctrl-btn left" id="moveLeft">◀</div>
            <div class="ctrl-btn jump" id="jumpBtn">ジャンプ</div>
            <div class="ctrl-btn right" id="moveRight">▶</div>
            <div class="ctrl-btn dig-down" id="digDown">▼掘る</div>
            <div class="ctrl-btn scroll-down" id="scrollDown">▼▼</div>
        </div>
    </div>

    <div id="ui">
        <div id="status">⛏ 掘るモード</div>
        <div id="blockCounter">🧱 0</div>
        <div id="grtCounter">GRT-</div>
    </div>
    <div class="hint">【マウス操作】棒人間の周りをクリックで掘る / 王将の動きで全方向</div>
</div>

<!-- 勉強サイト表示モーダル -->
<div id="studyModal">
    <div id="grtFoundMsg">🎉 GRT+ 発見！ 学習サイトを開きます 🎉</div>
    <iframe id="studyFrame" src="about:blank"></iframe>
    <button class="close-btn" id="closeStudy">✕ 閉じてゲームに戻る</button>
</div>

<script>
(function() {
    // ---------- 2013年対応: var 使用 ----------
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var container = document.getElementById('canvasContainer');

    // ワールドサイズ
    var WORLD_WIDTH = 40;
    var WORLD_HEIGHT = 40;
    var BLOCK = 25;

    // カメラ位置
    var cameraX = 0;
    var cameraY = 0;

    // ブロックタイプ
    var AIR = 0;
    var DIRT = 1;
    var GRASS = 2;
    var STONE = 3;
    var WOOD = 4;
    var PLANKS = 5;
    var GRT_BLOCK = 6;

    // ワールドデータ
    var world = [];
    var player = { x: 5, y: 10 };
    var velocityY = 0;
    var onGround = false;
    var grtFound = false;
    var grtPosition = null;
    var blockCount = 0;

    // 移動フラグ
    var moveDir = null;
    var moveInterval = null;
    var scrollDir = null;
    var scrollInterval = null;
    var isJumping = false;

    // ---------- ワールド生成 ----------
    function initWorld() {
        for (var r = 0; r < WORLD_HEIGHT; r++) {
            world[r] = [];
            for (var c = 0; c < WORLD_WIDTH; c++) {
                world[r][c] = AIR;
            }
        }

        // 地表（でこぼこ）
        for (var x = 0; x < WORLD_WIDTH; x++) {
            var height = 15 + Math.floor(Math.random() * 6);
            for (var y = height; y < WORLD_HEIGHT; y++) {
                if (y === height) {
                    world[y][x] = GRASS;
                } else if (y < height + 4) {
                    world[y][x] = DIRT;
                } else {
                    world[y][x] = STONE;
                }
            }
        }

        // 木
        for (var i = 0; i < 8; i++) {
            var tx = 3 + Math.floor(Math.random() * (WORLD_WIDTH - 6));
            var ty = 14 + Math.floor(Math.random() * 6);
            if (ty < 18) {
                for (var h = 0; h < 4; h++) {
                    if (ty - h >= 0) world[ty - h][tx] = WOOD;
                }
                for (var dy = -2; dy <= 2; dy++) {
                    for (var dx = -2; dx <= 2; dx++) {
                        if (Math.abs(dx) === 2 && Math.abs(dy) === 2) continue;
                        var ny = ty - 4 + dy;
                        var nx = tx + dx;
                        if (ny >= 0 && ny < WORLD_HEIGHT && nx >= 0 && nx < WORLD_WIDTH) {
                            if (world[ny][nx] === AIR) world[ny][nx] = PLANKS;
                        }
                    }
                }
            }
        }

        // 家
        buildHouse(12, 12);
        buildHouse(28, 10);

        // GRTをランダムに地下に配置
        var placed = false;
        var attempts = 0;
        while (!placed && attempts < 1000) {
            var gx = Math.floor(Math.random() * WORLD_WIDTH);
            var gy = 20 + Math.floor(Math.random() * (WORLD_HEIGHT - 22));
            if (world[gy] && world[gy][gx] === DIRT) {
                world[gy][gx] = GRT_BLOCK;
                grtPosition = { x: gx, y: gy };
                placed = true;
                break;
            }
            attempts++;
        }
        if (!placed) {
            world[22][10] = GRT_BLOCK;
            grtPosition = { x: 10, y: 22 };
        }

        // プレイヤーを地表に
        player.x = 5;
        player.y = 14;
        while (player.y < WORLD_HEIGHT && world[player.y][player.x] === AIR) {
            player.y++;
        }
        player.y--;
    }

    function buildHouse(hx, hy) {
        for (var y = hy - 3; y <= hy; y++) {
            for (var x = hx - 3; x <= hx + 3; x++) {
                if (y === hy - 3 || y === hy || x === hx - 3 || x === hx + 3) {
                    if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
                        if (world[y][x] === AIR || world[y][x] === GRASS || world[y][x] === DIRT) {
                            world[y][x] = WOOD;
                        }
                    }
                }
            }
        }
        if (hx >= 0 && hx < WORLD_WIDTH && hy >= 0 && hy < WORLD_HEIGHT) {
            if (world[hy][hx] === WOOD) world[hy][hx] = AIR;
        }
    }

    // ---------- 物理演算 ----------
    function updatePhysics() {
        var GRAVITY = 0.5;
        var JUMP_FORCE = -9;
        var MAX_JUMP_HEIGHT = 3; // 3ブロック分

        // 水平移動（1ブロックずつカクカク）
        if (moveDir === 'left') {
            var newX = player.x - 1;
            // 移動先のブロックをチェック
            var canMove = true;
            var checkY = Math.floor(player.y + 0.5);
            // 足元と頭の位置をチェック
            for (var dy = -1; dy <= 1; dy++) {
                var cy = checkY + dy;
                if (cy >= 0 && cy < WORLD_HEIGHT) {
                    if (world[cy][newX] !== AIR) {
                        canMove = false;
                        break;
                    }
                }
            }
            if (canMove && newX >= 0) {
                player.x = newX;
            }
            moveDir = null; // 1回だけ移動（ボタン押し続けで連続）
        }
        if (moveDir === 'right') {
            var newX = player.x + 1;
            var canMove = true;
            var checkY = Math.floor(player.y + 0.5);
            for (var dy = -1; dy <= 1; dy++) {
                var cy = checkY + dy;
                if (cy >= 0 && cy < WORLD_HEIGHT) {
                    if (world[cy][newX] !== AIR) {
                        canMove = false;
                        break;
                    }
                }
            }
            if (canMove && newX < WORLD_WIDTH) {
                player.x = newX;
            }
            moveDir = null;
        }

        // ジャンプ（最大3ブロック分の高さ）
        if (isJumping && onGround) {
            velocityY = JUMP_FORCE;
            onGround = false;
            isJumping = false;
        }

        // 重力
        velocityY += GRAVITY;
        if (velocityY > 10) velocityY = 10;

        var newY = player.y + velocityY;
        var minX = Math.floor(player.x - 0.3);
        var maxX = Math.floor(player.x + 0.3);

        var blocked = false;
        for (var cx = minX; cx <= maxX; cx++) {
            if (cx < 0 || cx >= WORLD_WIDTH) continue;
            var checkY = Math.floor(newY + 0.5);
            if (checkY >= 0 && checkY < WORLD_HEIGHT) {
                if (world[checkY][cx] !== AIR) {
                    blocked = true;
                    break;
                }
            }
        }

        if (blocked || newY >= WORLD_HEIGHT - 1) {
            if (velocityY > 0) {
                velocityY = 0;
                onGround = true;
                newY = Math.floor(player.y);
            }
        } else {
            player.y = newY;
            onGround = false;
        }

        if (player.x < 0.5) player.x = 0.5;
        if (player.x > WORLD_WIDTH - 0.5) player.x = WORLD_WIDTH - 0.5;
        if (player.y < 0) { player.y = 0; velocityY = 0; }
        if (player.y > WORLD_HEIGHT - 1) { player.y = WORLD_HEIGHT - 1; velocityY = 0; }

        // GRTと重なったら発見！
        var px = Math.floor(player.x + 0.5);
        var py = Math.floor(player.y + 0.5);
        if (px >= 0 && px < WORLD_WIDTH && py >= 0 && py < WORLD_HEIGHT) {
            if (world[py][px] === GRT_BLOCK && !grtFound) {
                grtFound = true;
                world[py][px] = AIR; // 消す
                updateGrtDisplay();
                showStudyModal();
            }
        }

        // カメラ追従
        if (scrollDir === null) {
            var targetCamX = player.x * BLOCK - canvas.width / 2;
            var targetCamY = player.y * BLOCK - canvas.height / 2;
            cameraX += (targetCamX - cameraX) * 0.1;
            cameraY += (targetCamY - cameraY) * 0.1;
        }

        if (cameraX < 0) cameraX = 0;
        if (cameraY < 0) cameraY = 0;
        if (cameraX > WORLD_WIDTH * BLOCK - canvas.width) cameraX = WORLD_WIDTH * BLOCK - canvas.width;
        if (cameraY > WORLD_HEIGHT * BLOCK - canvas.height) cameraY = WORLD_HEIGHT * BLOCK - canvas.height;
    }

    // ---------- 描画 ----------
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景（地下っぽく暗め）
        var grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(0.5, '#2d2d44');
        grad.addColorStop(1, '#0d0d1a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        var startX = Math.max(0, Math.floor(cameraX / BLOCK));
        var endX = Math.min(WORLD_WIDTH, Math.ceil((cameraX + canvas.width) / BLOCK) + 1);
        var startY = Math.max(0, Math.floor(cameraY / BLOCK));
        var endY = Math.min(WORLD_HEIGHT, Math.ceil((cameraY + canvas.height) / BLOCK) + 1);

        for (var r = startY; r < endY; r++) {
            for (var c = startX; c < endX; c++) {
                var type = world[r][c];
                if (type === AIR) continue;

                var x = c * BLOCK - cameraX;
                var y = r * BLOCK - cameraY;

                // 光の減衰（地下ほど暗く）
                var brightness = Math.max(0.3, 1 - (r - 15) * 0.02);
                
                switch(type) {
                    case GRASS: ctx.fillStyle = '#7CB342'; break;
                    case DIRT: 
                        var shade = Math.floor(139 * brightness);
                        ctx.fillStyle = 'rgb(' + shade + ',' + Math.floor(110 * brightness) + ',' + Math.floor(99 * brightness) + ')';
                        break;
                    case STONE: 
                        var shade2 = Math.floor(158 * brightness);
                        ctx.fillStyle = 'rgb(' + shade2 + ',' + shade2 + ',' + shade2 + ')';
                        break;
                    case WOOD: 
                        var shade3 = Math.floor(161 * brightness);
                        ctx.fillStyle = 'rgb(' + shade3 + ',' + Math.floor(136 * brightness) + ',' + Math.floor(127 * brightness) + ')';
                        break;
                    case PLANKS: 
                        var shade4 = Math.floor(141 * brightness);
                        ctx.fillStyle = 'rgb(' + shade4 + ',' + Math.floor(110 * brightness) + ',' + Math.floor(99 * brightness) + ')';
                        break;
                    case GRT_BLOCK:
                        ctx.fillStyle = '#FFD700';
                        ctx.shadowColor = '#FFD700';
                        ctx.shadowBlur = 20;
                        break;
                    default: ctx.fillStyle = '#888';
                }
                ctx.fillRect(x, y, BLOCK-1, BLOCK-1);
                ctx.shadowBlur = 0;

                if (type === GRT_BLOCK) {
                    ctx.fillStyle = '#000';
                    ctx.font = '16px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', x + BLOCK/2, y + BLOCK/2);
                    // キラキラ
                    ctx.fillStyle = 'rgba(255,215,0,0.3)';
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(x + BLOCK/2, y + BLOCK/2, 12, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // プレイヤー（王将マーク風）
        var px = player.x * BLOCK - cameraX;
        var py = player.y * BLOCK - cameraY;

        // 王将の範囲表示（周囲1マス）
        ctx.strokeStyle = 'rgba(255,215,0,0.15)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(px - BLOCK, py - BLOCK, BLOCK*3, BLOCK*3);
        ctx.setLineDash([]);

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(px, py + 14, 10, 4, 0, 0, Math.PI*2);
        ctx.fill();

        // 体（将棋の王将風）
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#B8860B';
        ctx.lineWidth = 3;
        // 台形（将棋の駒風）
        ctx.beginPath();
        ctx.moveTo(px-10, py-12);
        ctx.lineTo(px+10, py-12);
        ctx.lineTo(px+8, py+8);
        ctx.lineTo(px-8, py+8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 「王」の文字
        ctx.fillStyle = '#000';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('王', px, py);

        // 目
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(px-6, py-4, 2, 0, Math.PI*2);
        ctx.arc(px+6, py-4, 2, 0, Math.PI*2);
        ctx.fill();

        // GRT発見メッセージ
        if (grtFound) {
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 32px monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 30;
            ctx.fillText('🎉 GRT+ 発見！', canvas.width/2, 60);
            ctx.shadowBlur = 0;
        }

        // 操作ヘルプ（簡易）
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.font = '12px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('← → 移動', 10, 20);
        ctx.fillText('ジャンプで3段上まで', 10, 35);
        ctx.fillText('▼掘るで下へ', 10, 50);
    }

    // ---------- 掘る処理 ----------
    function digBlock() {
        // マウス位置からブロックを取得
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        var mx = (window._lastMouseX - rect.left) * scaleX;
        var my = (window._lastMouseY - rect.top) * scaleY;
        
        var worldX = Math.floor((mx + cameraX) / BLOCK);
        var worldY = Math.floor((my + cameraY) / BLOCK);

        if (worldX < 0 || worldX >= WORLD_WIDTH || worldY < 0 || worldY >= WORLD_HEIGHT) return;

        // 王将の範囲内かチェック（プレイヤーから1マス以内）
        var px = Math.floor(player.x + 0.5);
        var py = Math.floor(player.y + 0.5);
        var distX = Math.abs(worldX - px);
        var distY = Math.abs(worldY - py);

        if (distX > 1 || distY > 1) return; // 範囲外

        var block = world[worldY][worldX];
        if (block === AIR) return;
        if (block === GRT_BLOCK) {
            // GRTは重なったときに発見されるので、ここでは掘れない
            return;
        }

        // ブロックを掘る
        world[worldY][worldX] = AIR;
        blockCount++;
        document.getElementById('blockCounter').textContent = '🧱 ' + blockCount;
    }

    // 下を掘る（下ボタン用）
    function digDown() {
        var px = Math.floor(player.x + 0.5);
        var py = Math.floor(player.y + 1.5); // 真下

        if (px < 0 || px >= WORLD_WIDTH || py < 0 || py >= WORLD_HEIGHT) return;
        if (world[py][px] === AIR) return;
        if (world[py][px] === GRT_BLOCK) return;

        world[py][px] = AIR;
        blockCount++;
        document.getElementById('blockCounter').textContent = '🧱 ' + blockCount;
        
        // 掘ったら1ブロック下がる
        player.y = player.y + 1;
    }

    // ---------- UI更新 ----------
    function updateGrtDisplay() {
        var el = document.getElementById('grtCounter');
        if (grtFound) {
            el.textContent = 'GRT+ 発見！';
            el.className = 'found';
        } else {
            el.textContent = 'GRT- (地下を探せ!)';
            el.className = '';
        }
    }

    // ---------- 勉強サイト表示 ----------
    function showStudyModal() {
        var modal = document.getElementById('studyModal');
        var frame = document.getElementById('studyFrame');
        modal.style.display = 'flex';

        var content = `
        <html>
        <head><meta charset="UTF-8"><title>GRT 学習サイト</title>
        <style>
            body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f4f8; }
            h1 { color: #1a237e; border-bottom: 4px solid gold; }
            .card { background: white; border-radius: 12px; padding: 16px; margin: 16px 0; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
            .soccer { background: #e8f5e9; padding: 10px; border-left: 6px solid #2e7d32; }
        </style>
        </head>
        <body>
        <h1>⚽ GRT 学習コンテンツ</h1>
        <div class="card">
            <h2>📊 データベース + SQL</h2>
            <p><strong>データベース</strong> = クラブの選手名簿。<br>
            <strong>SQL</strong> = 監督のホイッスル。</p>
            <div class="soccer">⚽ 例: SELECT * FROM players WHERE position = 'FW';</div>
        </div>
        <div class="card">
            <h2>🔗 DB設計: リレーション・正規化・テーブル設計</h2>
            <p><strong>リレーション</strong> = 選手とポジションの関連。<br>
            <strong>正規化</strong> = ユニフォーム番号の重複を排除。</p>
            <div class="soccer">⚽ 例: 選手テーブルとチームテーブルを外部キーで結ぶ</div>
        </div>
        <div class="card">
            <h2>🔒 トランザクション・ロック・デッドロック</h2>
            <p><strong>トランザクション</strong> = 交代手続き。<br>
            <strong>ロック</strong> = ボール保持者は他者が奪えない。<br>
            <strong>デッドロック</strong> = 2人が「先にパスをくれ」と譲らず停止。</p>
            <div class="soccer">⚽ 例: ロック待ちで試合が止まる → デッドロック回避が必要</div>
        </div>
        <p style="margin-top:20px; color:#1a237e; font-weight:bold;">🎉 GRT+ 発見！ あなたはデータベースマスターへの第一歩を踏み出しました！</p>
        </body>
        </html>
        `;
        frame.srcdoc = content;
    }

    // ---------- ゲームループ ----------
    function gameLoop() {
        updatePhysics();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---------- マウス操作イベント ----------
    // マウス位置を記録
    canvas.addEventListener('mousemove', function(e) {
        window._lastMouseX = e.clientX;
        window._lastMouseY = e.clientY;
    });

    // クリックで掘る
    canvas.addEventListener('click', function(e) {
        digBlock();
    });

    function setupMoveButton(id, dir) {
        var btn = document.getElementById(id);
        btn.addEventListener('mousedown', function(e) {
            e.preventDefault();
            moveDir = dir;
        });
        btn.addEventListener('mouseup', function(e) {
            e.preventDefault();
            // moveDirは1回だけなので、ここでは何もしない
        });
        btn.addEventListener('mouseleave', function(e) {
            // 何もしない
        });
    }

    function setupScrollButton(id, dir) {
        var btn = document.getElementById(id);
        btn.addEventListener('mousedown', function(e) {
            e.preventDefault();
            scrollDir = dir;
            if (scrollInterval) clearInterval(scrollInterval);
            scrollInterval = setInterval(function() {
                var delta = (dir === 'up') ? -15 : 15;
                cameraY += delta;
                if (cameraY < 0) cameraY = 0;
                if (cameraY > WORLD_HEIGHT * BLOCK - canvas.height) cameraY = WORLD_HEIGHT * BLOCK - canvas.height;
            }, 50);
        });
        btn.addEventListener('mouseup', function(e) {
            e.preventDefault();
            scrollDir = null;
            if (scrollInterval) {
                clearInterval(scrollInterval);
                scrollInterval = null;
            }
        });
        btn.addEventListener('mouseleave', function(e) {
            scrollDir = null;
            if (scrollInterval) {
                clearInterval(scrollInterval);
                scrollInterval = null;
            }
        });
    }

    // ---------- イベント登録 ----------
    setupMoveButton('moveLeft', 'left');
    setupMoveButton('moveRight', 'right');
    
    // ジャンプボタン
    document.getElementById('jumpBtn').addEventListener('mousedown', function(e) {
        e.preventDefault();
        isJumping = true;
    });
    
    // 下掘りボタン
    document.getElementById('digDown').addEventListener('click', function(e) {
        e.preventDefault();
        digDown();
    });

    setupScrollButton('scrollUp', 'up');
    setupScrollButton('scrollDown', 'down');

    // モーダル閉じる
    document.getElementById('closeStudy').addEventListener('click', function() {
        document.getElementById('studyModal').style.display = 'none';
    });

    // ---------- 起動 ----------
    initWorld();
    updateGrtDisplay();
    gameLoop();

    if (grtPosition) {
        console.log('GRTは地下 (' + grtPosition.x + ', ' + grtPosition.y + ') にあります！');
        console.log('棒人間（王将）がGRTに重なると発見されます！');
    }

})();
</script>
