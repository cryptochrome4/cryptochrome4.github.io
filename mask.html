<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仮面ライダー ストリートバトル</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: #07070d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
    color: white;
    user-select: none;
    padding: 8px;
    gap: 8px;
    overflow-x: hidden;
  }

  #game-wrap { position: relative; width: min(96vw, 1000px); }
  #game {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    overflow: hidden;
    border-radius: 10px;
    border: 3px solid #ff2244;
    box-shadow: 0 0 40px rgba(255,30,70,0.5), 0 0 100px rgba(120,0,255,0.3);
    background: #1a0a2a;
  }

  .bg-sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      #0a0618 0%, #1a0a3a 25%, #3a1050 50%, #6a1a4a 72%, #2a0a1a 100%);
    z-index: 0;
  }
  .moon {
    position: absolute; top: 8%; right: 15%;
    width: 9%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e0, #ffcc88 60%, #cc8844);
    box-shadow: 0 0 40px rgba(255,220,150,0.8), 0 0 80px rgba(255,180,80,0.4);
    z-index: 1;
  }
  .cloud {
    position: absolute; background: rgba(120,80,160,0.3);
    border-radius: 50%; filter: blur(8px); z-index: 1;
  }
  .cloud.c1 { width: 20%; height: 8%; top: 15%; left: 10%; animation: drift 40s linear infinite; }
  .cloud.c2 { width: 28%; height: 6%; top: 30%; left: 40%; animation: drift 55s linear infinite reverse; }
  .cloud.c3 { width: 15%; height: 5%; top: 22%; left: 75%; animation: drift 48s linear infinite; }
  @keyframes drift { 0% { transform: translateX(-30%); } 100% { transform: translateX(130%); } }

  .skyline {
    position: absolute; bottom: 22%; left: 0; right: 0;
    height: 55%; z-index: 2;
  }
  .building {
    position: absolute; bottom: 0;
    background: linear-gradient(180deg, #1a1230 0%, #0a0818 100%);
    border-top: 2px solid #2a1a4a;
    box-shadow: inset 0 0 20px rgba(120,50,255,0.15);
  }
  .building .win {
    position: absolute; width: 6%; height: 3%;
    background: #ffcc55; box-shadow: 0 0 6px #ffcc55; opacity: 0.9;
  }
  .building .win.off { background: #2a2040; box-shadow: none; }
  .building .win.blue { background: #55ccff; box-shadow: 0 0 6px #55ccff; }

  .neon {
    position: absolute;
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(8px, 1.2vw, 14px);
    font-weight: bold; padding: 2px 8px; border-radius: 3px;
    background: rgba(0,0,0,0.6); z-index: 3;
    animation: neonFlicker 2s infinite alternate;
  }
  .neon.pink  { color: #ff44aa; text-shadow: 0 0 8px #ff44aa, 0 0 16px #ff44aa; border: 1px solid #ff44aa; }
  .neon.cyan  { color: #44ffff; text-shadow: 0 0 8px #44ffff, 0 0 16px #44ffff; border: 1px solid #44ffff; }
  .neon.yellow{ color: #ffee44; text-shadow: 0 0 8px #ffee44, 0 0 16px #ffee44; border: 1px solid #ffee44; }
  @keyframes neonFlicker {
    0%, 85%, 100% { opacity: 1; }
    88% { opacity: 0.3; }
    92% { opacity: 1; }
    95% { opacity: 0.5; }
  }

  .street {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 22%;
    background: linear-gradient(180deg, #2a2030 0%, #1a1020 40%, #0a0510 100%);
    border-top: 3px solid #ff2244; z-index: 4;
  }
  .street::before {
    content: ''; position: absolute;
    top: 40%; left: 0; right: 0; height: 4%;
    background: repeating-linear-gradient(90deg,
      transparent 0, transparent 3%, #ffee44 3%, #ffee44 7%);
    opacity: 0.5;
  }
  .street::after {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 100%;
    background: linear-gradient(180deg, rgba(255,50,100,0.15) 0%, transparent 60%);
  }

  .streetlight {
    position: absolute; bottom: 22%;
    width: 1%; height: 30%;
    background: linear-gradient(180deg, #333 0%, #555 100%); z-index: 3;
  }
  .streetlight::before {
    content: ''; position: absolute;
    top: -8%; left: -300%;
    width: 700%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,100,0.5) 0%, transparent 70%);
  }
  .streetlight::after {
    content: ''; position: absolute;
    top: 0; left: -150%;
    width: 400%; height: 4%;
    background: #ffee88; border-radius: 2px;
    box-shadow: 0 0 12px #ffee88;
  }

  .crowd {
    position: absolute; bottom: 20%; left: 0; right: 0;
    height: 6%; z-index: 5; opacity: 0.5;
    background: repeating-linear-gradient(90deg,
      transparent 0, transparent 1.5%, #000 1.5%, #000 3%);
    filter: blur(1px);
  }

  #bg-image {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 78%;
    background-image: url('img370street.jpg');
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;
    z-index: 0; display: none;
  }
  #game.bg-image-mode #bg-css { display: none; }
  #game.bg-image-mode #bg-image { display: block; }

  .fighter {
    position: absolute; bottom: 20%;
    width: 8%; height: 30%; z-index: 10;
    transform: translateX(-50%);
    transition: filter 0.08s;
  }

  #player {
    --body-gradient: linear-gradient(160deg, #ff3333 0%, #cc0000 50%, #660000 100%);
    --limb-color: #cc1111;
    --accent: #ffdd00;
    --eye-glow: #00ffff;
  }
  #enemy {
    --body-gradient: linear-gradient(200deg, #aa33ff 0%, #6611cc 50%, #330088 100%);
    --limb-color: #7711dd;
    --accent: #ff00ff;
    --eye-glow: #ff00ff;
  }

  .torso {
    position: absolute; left: 15%; top: 30%;
    width: 70%; height: 45%;
    background: var(--body-gradient);
    border-radius: 30% 30% 20% 20% / 25% 25% 15% 15%;
    box-shadow: inset -3px 0 8px rgba(0,0,0,0.6), 0 0 10px rgba(255,50,50,0.4);
    z-index: 2; transform-origin: center top;
  }
  .belt {
    position: absolute; left: 15%; top: 68%;
    width: 70%; height: 9%;
    background: var(--accent); border-radius: 2px;
    box-shadow: 0 0 8px var(--accent); z-index: 3;
  }
  .head {
    position: absolute; left: 15%; top: 2%;
    width: 70%; height: 32%;
    background: var(--body-gradient);
    border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
    box-shadow: inset -2px 0 6px rgba(0,0,0,0.6);
    z-index: 3; transform-origin: center bottom;
  }
  .head::before {
    content: ''; position: absolute;
    top: 35%; left: 8%; width: 84%; height: 40%;
    background: radial-gradient(ellipse at center,
      #ffffff 0%, var(--eye-glow) 40%, #003355 100%);
    border-radius: 50% 50% 30% 30%;
    box-shadow: 0 0 12px var(--eye-glow), 0 0 20px var(--eye-glow);
    border: 1px solid #000;
  }
  .head::after {
    content: ''; position: absolute;
    top: -18%; left: 45%; width: 10%; height: 30%;
    background: var(--accent); border-radius: 2px;
    transform: rotate(-5deg); box-shadow: 0 0 6px var(--accent);
  }
  .arm {
    position: absolute; background: var(--limb-color);
    border-radius: 40% 40% 30% 30%;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.5), 0 0 4px rgba(255,50,50,0.3);
    transform-origin: center top;
    transition: transform 0.08s ease-out;
    z-index: 1;
  }
  .arm.left  { width: 18%; height: 38%; left: 2%;  top: 32%; transform: rotate(8deg); }
  .arm.right { width: 18%; height: 38%; right: 2%; top: 32%; transform: rotate(-8deg); }
  .arm::after {
    content: ''; position: absolute;
    bottom: -8%; left: 15%; width: 70%; aspect-ratio: 1;
    background: var(--limb-color); border-radius: 50%;
    box-shadow: inset -1px 0 3px rgba(0,0,0,0.5);
  }
  .leg {
    position: absolute; background: var(--limb-color);
    border-radius: 30% 30% 40% 40%;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.5);
    transform-origin: center top;
    transition: transform 0.08s ease-out;
    z-index: 1;
  }
  .leg.left  { width: 22%; height: 30%; left: 18%; top: 72%; transform: rotate(3deg); }
  .leg.right { width: 22%; height: 30%; right: 18%; top: 72%; transform: rotate(-3deg); }
  .leg::after {
    content: ''; position: absolute;
    bottom: 0; left: -10%; width: 120%; height: 30%;
    background: #111; border-radius: 40% 40% 20% 20%;
  }

  #player.facing-left  .torso,
  #player.facing-left  .head,
  #player.facing-left  .belt { transform: scaleX(-1); }
  #enemy.facing-right  .torso,
  #enemy.facing-right  .head,
  #enemy.facing-right  .belt { transform: scaleX(-1); }

  .fighter.walking .leg.left  { animation: walkL 0.4s infinite alternate ease-in-out; }
  .fighter.walking .leg.right { animation: walkR 0.4s infinite alternate ease-in-out; }
  .fighter.walking .arm.left  { animation: armL 0.4s infinite alternate ease-in-out; }
  .fighter.walking .arm.right { animation: armR 0.4s infinite alternate ease-in-out; }
  .fighter.walking .torso { animation: bob 0.2s infinite alternate ease-in-out; }
  @keyframes walkL { from { transform: rotate(-15deg); } to { transform: rotate(20deg); } }
  @keyframes walkR { from { transform: rotate(20deg); }  to { transform: rotate(-15deg); } }
  @keyframes armL  { from { transform: rotate(15deg); }  to { transform: rotate(-10deg); } }
  @keyframes armR  { from { transform: rotate(-10deg); } to { transform: rotate(15deg); } }
  @keyframes bob   { from { transform: translateY(0); }  to { transform: translateY(-2%); } }

  .fighter.jumping .leg.left  { transform: rotate(-25deg); }
  .fighter.jumping .leg.right { transform: rotate(-25deg); }
  .fighter.jumping .arm.left  { transform: rotate(-30deg); }
  .fighter.jumping .arm.right { transform: rotate(30deg); }

  .fighter.crouching { height: 20% !important; }
  .fighter.crouching .head  { top: -5%; }
  .fighter.crouching .torso { height: 40%; top: 35%; }
  .fighter.crouching .leg.left  { height: 22%; top: 68%; transform: rotate(-30deg); }
  .fighter.crouching .leg.right { height: 22%; top: 68%; transform: rotate(30deg); }
  .fighter.crouching .arm.left  { top: 40%; height: 28%; transform: rotate(40deg); }
  .fighter.crouching .arm.right { top: 40%; height: 28%; transform: rotate(-40deg); }

  .fighter.punching .arm.right {
    transform: rotate(-90deg) translateY(-30%);
    width: 22%; height: 55%;
    transition: transform 0.08s ease-out, height 0.08s ease-out;
  }
  .fighter.punching .arm.right::after {
    box-shadow: 0 0 10px #ffcc00, inset -1px 0 3px rgba(0,0,0,0.5);
  }
  .fighter.facing-left.punching .arm.right { transform: rotate(-8deg); height: 38%; }
  .fighter.facing-left.punching .arm.left {
    transform: rotate(90deg) translateY(-30%);
    width: 22%; height: 55%;
    box-shadow: 0 0 10px #ffcc00;
  }

  .fighter.punching { animation: punchLunge 0.2s ease-out; }
  @keyframes punchLunge {
    0% { transform: translateX(-50%) translateX(0); }
    50% { transform: translateX(-50%) translateX(3%); }
    100% { transform: translateX(-50%) translateX(0); }
  }

  .fighter.kicking .leg.right {
    transform: rotate(-100deg);
    height: 45%;
    transition: transform 0.1s ease-out, height 0.1s ease-out;
    box-shadow: 0 0 15px #ffaa00;
  }
  .fighter.facing-left.kicking .leg.right { transform: rotate(-3deg); height: 30%; box-shadow: none; }
  .fighter.facing-left.kicking .leg.left {
    transform: rotate(100deg);
    height: 45%;
    box-shadow: 0 0 15px #ffaa00;
  }
  .fighter.kicking .torso { transform: rotate(-10deg); }
  .fighter.facing-left.kicking .torso { transform: rotate(10deg); }

  .fighter.kicking { animation: kickLunge 0.25s ease-out; }
  @keyframes kickLunge {
    0% { transform: translateX(-50%) translateX(0); }
    40% { transform: translateX(-50%) translateX(-2%); }
    100% { transform: translateX(-50%) translateX(0); }
  }

  .fighter.hit { filter: brightness(3) saturate(0); }
  .fighter.block { filter: brightness(1.3) sepia(1) hue-rotate(60deg); }

  .fx-container {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 20;
  }
  .fx {
    position: absolute; border-radius: 50%;
    pointer-events: none;
    animation: fxBurst 0.3s ease-out forwards;
  }
  @keyframes fxBurst {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
  }
  .fx.hit   { background: radial-gradient(circle, #fff 0%, #ffcc00 30%, #ff4400 60%, transparent 100%); box-shadow: 0 0 20px #ffcc00; }
  .fx.punch { background: radial-gradient(circle, #fff 0%, #88ddff 40%, #0088ff 70%, transparent 100%); box-shadow: 0 0 20px #00aaff; }
  .fx.kick  { background: radial-gradient(circle, #fff 0%, #ffdd88 40%, #ff8800 70%, transparent 100%); box-shadow: 0 0 25px #ffaa00; }

  .dmg-pop {
    position: absolute;
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(14px, 2.2vw, 24px);
    font-weight: bold; color: #fff;
    text-shadow: 0 0 8px #ff0000, 2px 2px 0 #000;
    pointer-events: none; z-index: 21;
    animation: dmgFloat 0.8s ease-out forwards;
  }
  @keyframes dmgFloat {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    20% { transform: translate(-50%, -30%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -150%) scale(1); opacity: 0; }
  }

  .hp-bar {
    position: absolute; top: 4%;
    width: 38%; height: 6%;
    background: #111; border: 2px solid #ff2244;
    border-radius: 4px; overflow: hidden; z-index: 30;
    box-shadow: 0 0 10px rgba(255,30,70,0.5);
  }
  #player-hp { left: 2%; }
  #enemy-hp { right: 2%; }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff2244, #ffcc00 40%, #44ff88 100%);
    background-size: 200% 100%; background-position: 100% 0;
    transition: width 0.25s, background-position 0.25s;
  }
  #enemy-hp .hp-fill {
    float: right;
    background: linear-gradient(-90deg, #ff2244, #ffcc00 40%, #44ff88 100%);
    background-position: 0 0;
  }
  .hp-label {
    position: absolute; top: 11%;
    font-size: 10px; font-family: Arial, sans-serif;
    color: #ffddaa; text-shadow: 1px 1px 2px #000; z-index: 30;
  }
  #player-hp-label { left: 3%; }
  #enemy-hp-label { right: 3%; }

  .move-label {
    position: absolute; top: 15%;
    font-size: clamp(11px, 1.6vw, 16px);
    color: #ffee00; font-weight: bold;
    text-shadow: 0 0 8px #ff6600, 2px 2px 0 #000;
    opacity: 0; transition: opacity 0.2s;
    font-family: Arial, sans-serif; z-index: 30;
  }
  #player-move { left: 2%; }
  #enemy-move { right: 2%; }
  .move-label.show { opacity: 1; }

  #message {
    position: absolute; top: 45%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(28px, 6vw, 72px); font-weight: bold;
    text-shadow: 0 0 20px currentColor, 4px 4px 0 #000;
    display: none; z-index: 50; white-space: nowrap;
    animation: msgPop 0.4s ease-out;
  }
  @keyframes msgPop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -2px); }
  }
  #game.shake { animation: shake 0.2s; }

  /* ===== クリア画面 ===== */
  #clear-screen {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, #2a1a4a 0%, #000 100%);
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 150; gap: 24px; padding: 5%;
    animation: clearFadeIn 0.6s ease-out;
  }
  #clear-screen.active { display: flex; }
  @keyframes clearFadeIn {
    0% { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
  }
  #clear-screen h2 {
    margin: 0;
    font-size: clamp(32px, 8vw, 80px);
    background: linear-gradient(180deg, #ffffff 0%, #ffdd00 50%, #ff8800 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,200,0,0.8));
    letter-spacing: 4px;
    text-align: center;
    animation: clearPulse 1.2s infinite alternate;
  }
  @keyframes clearPulse { from { transform: scale(1); } to { transform: scale(1.06); } }
  #clear-screen .clear-sub {
    font-family: Arial, sans-serif;
    font-size: clamp(12px, 1.8vw, 16px);
    color: #ccc;
    text-align: center;
    margin: 0;
  }
  #clear-screen .clear-badge {
    padding: 12px 40px;
    background: linear-gradient(180deg, #ff2244, #990000);
    border-radius: 40px;
    font-size: clamp(14px, 2vw, 18px);
    font-weight: bold;
    color: #fff;
    box-shadow: 0 6px 0 #440000, 0 8px 20px rgba(255,0,0,0.5);
    letter-spacing: 2px;
  }
  .clear-buttons {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  }
  .clear-btn {
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(14px, 2.2vw, 20px);
    padding: 14px 36px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
    text-decoration: none;
    display: inline-block;
  }
  #clear-study-btn {
    background: linear-gradient(180deg, #44ff88, #00aa44);
    color: #001a0a;
    box-shadow: 0 6px 0 #005522, 0 8px 20px rgba(0,255,130,0.5);
  }
  #clear-retry-btn {
    background: linear-gradient(180deg, #6666ff, #3333cc);
    color: #fff;
    box-shadow: 0 6px 0 #111188, 0 8px 20px rgba(80,80,255,0.5);
  }
  .clear-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #333; }
  .clear-btn:hover { filter: brightness(1.15); }

  #opening {
    position: absolute; inset: 0;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; overflow: hidden;
  }
  #opening-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill; z-index: 0; opacity: 0.55;
  }
  #opening::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.7) 100%);
    z-index: 1; pointer-events: none;
  }
  #opening .opening-inner {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    width: 100%; height: 100%; padding: 4% 5%;
  }
  #opening h1 {
    margin: 0; font-size: clamp(24px, 5vw, 52px);
    background: linear-gradient(180deg, #ffffff, #ffdd00 40%, #ff2244 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 12px rgba(255,0,0,0.8));
    letter-spacing: 3px; animation: pulse 1.5s infinite alternate;
    text-align: center; line-height: 1.1;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
  #opening p.sub {
    margin: 8px 0 0; color: #fff;
    font-size: clamp(10px, 1.6vw, 14px); font-family: Arial, sans-serif;
    text-shadow: 1px 1px 4px #000, 0 0 8px #000; text-align: center;
  }
  .future-slot { display: flex; gap: 10px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
  .future-btn {
    font-family: Arial, sans-serif; font-size: clamp(9px, 1.3vw, 12px);
    padding: 6px 14px; border: 1px dashed #666; border-radius: 20px;
    background: rgba(0,0,0,0.5); color: #888; cursor: not-allowed;
  }
  .opening-buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .open-btn {
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(14px, 2.4vw, 22px);
    padding: 12px 36px; border: none; border-radius: 40px; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
  }
  #start-btn {
    background: linear-gradient(180deg, #ff2244, #cc0022); color: #fff;
    box-shadow: 0 6px 0 #660011, 0 8px 20px rgba(255,30,70,0.6);
  }
  #view-bg-btn {
    background: linear-gradient(180deg, #666, #333); color: #fff;
    box-shadow: 0 6px 0 #111, 0 8px 20px rgba(0,0,0,0.6);
  }
  .open-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #333; }
  .open-btn:hover { filter: brightness(1.15); }

  #bg-viewer {
    position: absolute; inset: 0; background: #000;
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  #bg-viewer.active { display: flex; }
  #bg-viewer img { width: 100%; height: 100%; object-fit: fill; }
  #close-bg {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,0,0,0.85); color: #fff; border: none;
    width: 42px; height: 42px; border-radius: 50%;
    font-size: 20px; cursor: pointer; z-index: 201; font-weight: bold;
  }

<body>

<script>
/* ============================================================
   キーボード矢印キー → キャラを動かす（十字キー扱い）
   ============================================================ */
window.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    e.stopPropagation();
    if (e.repeat) return;
    switch (e.key) {
      case 'ArrowLeft':  input.left = true;  break;
      case 'ArrowRight': input.right = true; break;
      case 'ArrowUp':    tryJump(P);         break;
      case 'ArrowDown':  tryCrouch(P, true); break;
    }
  }
}, true);

window.addEventListener('keyup', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    e.stopPropagation();
    switch (e.key) {
      case 'ArrowLeft':  input.left = false;  break;
      case 'ArrowRight': input.right = false; break;
      case 'ArrowDown':  tryCrouch(P, false); break;
    }
  }
}, true);

/* ============================================================
   ビル群を生成
   ============================================================ */
(function generateSkyline() {
  const skyline = document.getElementById('skyline');
  const buildings = [
    { left: 0,   width: 8,  height: 60 },
    { left: 8,   width: 6,  height: 75 },
    { left: 14,  width: 10, height: 50 },
    { left: 25,  width: 7,  height: 85 },
    { left: 33,  width: 9,  height: 65 },
    { left: 43,  width: 6,  height: 90 },
    { left: 50,  width: 11, height: 55 },
    { left: 62,  width: 8,  height: 70 },
    { left: 71,  width: 7,  height: 80 },
    { left: 79,  width: 10, height: 60 },
    { left: 90,  width: 10, height: 72 },
  ];
  buildings.forEach(b => {
    const el = document.createElement('div');
    el.className = 'building';
    el.style.left = b.left + '%';
    el.style.width = b.width + '%';
    el.style.height = b.height + '%';
    const rows = Math.floor(b.height / 10);
    const cols = Math.floor(b.width / 2);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const w = document.createElement('div');
        w.className = 'win';
        const rnd = Math.random();
        if (rnd < 0.3) w.classList.add('off');
        else if (rnd < 0.4) w.classList.add('blue');
        w.style.left = (10 + c * (80 / cols)) + '%';
        w.style.top = (5 + r * (90 / rows)) + '%';
        el.appendChild(w);
      }
    }
    skyline.appendChild(el);
  });
})();

/* ============================================================
   背景画像トグル
   ============================================================ */
const gameEl = document.getElementById('game');
const bgToggle = document.getElementById('bg-toggle');
bgToggle.addEventListener('change', () => {
  gameEl.classList.toggle('bg-image-mode', bgToggle.checked);
});

/* ============================================================
   座標系・定数
   ============================================================ */
const GAME = document.getElementById('game');
const player = document.getElementById('player');
const enemy = document.getElementById('enemy');
const playerHpFill = document.querySelector('#player-hp .hp-fill');
const enemyHpFill  = document.querySelector('#enemy-hp .hp-fill');
const message = document.getElementById('message');
const opening = document.getElementById('opening');
const startBtn = document.getElementById('start-btn');
const viewBgBtn = document.getElementById('view-bg-btn');
const bgViewer = document.getElementById('bg-viewer');
const closeBg = document.getElementById('close-bg');
const playerMoveLbl = document.getElementById('player-move');
const enemyMoveLbl  = document.getElementById('enemy-move');
const fxContainer = document.getElementById('fxContainer');
const clearScreen = document.getElementById('clear-screen');
const clearRetryBtn = document.getElementById('clear-retry-btn');

const GROUND = 20;
const GRAVITY = 0.55;
const JUMP_POWER = 6.5;
const MOVE_SPEED = 0.55;
const MIN_DIST = 11;
const PUNCH_RANGE = 13;
const KICK_RANGE = 15;
const PUNCH_DAMAGE = 8;
const KICK_DAMAGE = 12;
const PUNCH_DURATION = 14;
const KICK_DURATION = 18;
const HIT_DURATION = 10;
const ATTACK_COOLDOWN = 18;

/* ============================================================
   状態
   ============================================================ */
const P = {
  x: 22, hp: 100, facing: 1,
  state: 'idle', stateTimer: 0,
  jumpY: 0, jumpVel: 0,
  isCrouching: false, attackHitDone: false,
};
const E = {
  x: 78, hp: 100, facing: -1,
  state: 'idle', stateTimer: 0,
  jumpY: 0, jumpVel: 0,
  isCrouching: false, attackHitDone: false,
};

let gameStarted = false;
let gameOver = false;
let playerCanAttack = true;
let enemyAttackCooldown = 0;
let enemyNextAttackTimer = 60;
let hitStopTimer = 0;
let attackLockTimer = 0;   // ★ 攻撃ロックのタイマー方式（保険）

const input = { left: false, right: false };

/* ============================================================
   入力処理（画面上の十字キー・PUNCH/KICK）
   ============================================================ */
function bindDirButton(btn) {
  const dir = btn.dataset.dir;

  const press = (e) => {
    if (e) e.preventDefault();
    btn.classList.add('pressed');
    if (dir === 'left')  input.left = true;
    if (dir === 'right') input.right = true;
    if (dir === 'up')    tryJump(P);
    if (dir === 'down')  tryCrouch(P, true);
  };

  const release = (e) => {
    if (e) e.preventDefault();
    btn.classList.remove('pressed');
    if (dir === 'left')  input.left = false;
    if (dir === 'right') input.right = false;
    if (dir === 'down')  tryCrouch(P, false);
  };

  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);

  btn.addEventListener('touchstart',  press,   { passive: false });
  btn.addEventListener('touchend',    release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });

  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}
document.querySelectorAll('[data-dir]').forEach(bindDirButton);

document.querySelectorAll('[data-btn]').forEach(btn => {
  const press = (e) => {
    if (e) e.preventDefault();
    btn.classList.add('pressed');
    tryAttack(P, btn.dataset.btn);
  };
  const release = (e) => {
    if (e) e.preventDefault();
    btn.classList.remove('pressed');
  };

  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);

  btn.addEventListener('touchstart',  press,   { passive: false });
  btn.addEventListener('touchend',    release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });

  btn.addEventListener('contextmenu', (e) => e.preventDefault());
});

/* ============================================================
   オープニング
   ============================================================ */
startBtn.addEventListener('click', () => {
  opening.style.display = 'none';
  opening.remove();
  gameStarted = true;
});
viewBgBtn.addEventListener('click', () => bgViewer.classList.add('active'));
closeBg.addEventListener('click', () => bgViewer.classList.remove('active'));

/* ============================================================
   クリア画面：もう一度
   ============================================================ */
clearRetryBtn.addEventListener('click', () => {
  location.reload();
});

/* ============================================================
   アクション
   ============================================================ */
function tryJump(c) {
  if (!gameStarted || gameOver) return;
  if (c.jumpY > 0) return;
  if (c.state === 'hit') return;
  c.isCrouching = false;
  c.jumpVel = JUMP_POWER;
  c.state = 'jumping';
  if (c === P) showLabel(playerMoveLbl, 'JUMP');
}

function tryCrouch(c, flag) {
  if (!gameStarted || gameOver) return;
  if (c.jumpY > 0) return;
  if (c.state === 'hit') return;
  c.isCrouching = flag;
  if (flag) {
    c.state = 'crouching';
    if (c === P) showLabel(playerMoveLbl, 'GUARD');
  } else if (c.state === 'crouching') {
    c.state = 'idle';
  }
}

/* ★ 修正：しゃがみ中・端・ヒット硬直後でも攻撃できるように */
function tryAttack(c, type) {
  if (!gameStarted || gameOver) return;
  if (c !== P) return;

  // 攻撃中なら弾く（ここだけは維持）
  if (c.state === 'punching' || c.state === 'kicking') return;

  // 空中でも攻撃不可（維持）
  if (c.jumpY > 0) return;

  // ★ playerCanAttack が false でも、タイマー方式で必ず復帰させる
  if (!playerCanAttack) {
    // 何らかの理由でロックが残っていたら強制解除
    if (attackLockTimer <= 0) {
      playerCanAttack = true;
    } else {
      return;
    }
  }

  // ★ しゃがみ中なら攻撃前に解除
  if (c.isCrouching) {
    c.isCrouching = false;
    if (c.state === 'crouching') c.state = 'idle';
  }

  // ★ hit 硬直中でも攻撃を受け付ける（硬直解除）
  if (c.state === 'hit') {
    c.state = 'idle';
    c.stateTimer = 0;
  }

  playerCanAttack = false;
  attackLockTimer = (type === 'punch') ? PUNCH_DURATION : KICK_DURATION;
  c.attackHitDone = false;

  if (type === 'punch') {
    c.state = 'punching';
    c.stateTimer = PUNCH_DURATION;
    c.isCrouching = false;
    showLabel(playerMoveLbl, 'PUNCH');
  } else {
    c.state = 'kicking';
    c.stateTimer = KICK_DURATION;
    c.isCrouching = false;
    showLabel(playerMoveLbl, 'KICK');
  }
}

/* ============================================================
   当たり判定
   ============================================================ */
function getBodyBox(c) {
  const w = 6;
  let h = 28;
  if (c.isCrouching) h = 16;
  if (c.jumpY > 0) h = 26;
  return {
    left: c.x - w/2, right: c.x + w/2,
    bottom: GROUND + c.jumpY,
    top: GROUND + c.jumpY + h, h: h,
  };
}

function getAttackBox(c, target) {
  if (c.state !== 'punching' && c.state !== 'kicking') return null;
  const body = getBodyBox(c);
  const facingRight = target.x > c.x;

  if (c.state === 'punching') {
    const y = body.bottom + body.h * 0.55;
    const range = PUNCH_RANGE;
    return {
      left:  facingRight ? body.right : body.left - range,
      right: facingRight ? body.right + range : body.left,
      bottom: y - 4, top: y + 8,
      type: 'punch', damage: PUNCH_DAMAGE,
    };
  } else {
    const y = body.bottom + body.h * 0.65;
    const range = KICK_RANGE;
    return {
      left:  facingRight ? body.right : body.left - range,
      right: facingRight ? body.right + range : body.left,
      bottom: y - 6, top: y + 12,
      type: 'kick', damage: KICK_DAMAGE,
    };
  }
}

function boxesOverlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.top < b.bottom || a.bottom > b.top);
}

/* ============================================================
   ダメージ & エフェクト
   ============================================================ */
function applyDamage(target, amount, atkType) {
  const isPlayer = target === P;
  target.hp = Math.max(0, target.hp - amount);

  if (isPlayer) {
    playerHpFill.style.width = target.hp + '%';
    player.classList.add('hit');
    setTimeout(() => player.classList.remove('hit'), 120);
  } else {
    enemyHpFill.style.width = target.hp + '%';
    enemy.classList.add('hit');
    setTimeout(() => enemy.classList.remove('hit'), 120);
  }

  spawnDamagePop(target.x, GROUND + (target.isCrouching ? 22 : 32), amount);
  const hitY = (GROUND + (target.isCrouching ? 20 : 30));
  spawnFx(target.x, hitY, atkType);

  GAME.classList.remove('shake');
  void GAME.offsetWidth;
  GAME.classList.add('shake');

  hitStopTimer = 4;

  if (!(target.isCrouching && atkType === 'punch')) {
    target.state = 'hit';
    target.stateTimer = HIT_DURATION;
  }

  checkGameOver();
}

function spawnFx(xPct, yPct, type) {
  const el = document.createElement('div');
  el.className = 'fx ' + (type === 'punch' ? 'punch' : type === 'kick' ? 'kick' : 'hit');
  el.style.left = xPct + '%';
  el.style.top = (100 - yPct - 4) + '%';
  el.style.width = '10%';
  el.style.aspectRatio = '1';
  fxContainer.appendChild(el);
  setTimeout(() => el.remove(), 320);
}

function spawnDamagePop(xPct, yPct, amount) {
  const el = document.createElement('div');
  el.className = 'dmg-pop';
  el.textContent = '-' + amount;
  el.style.left = xPct + '%';
  el.style.top = (100 - yPct) + '%';
  fxContainer.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

/* ============================================================
   ヒット判定解決
   ============================================================ */
function resolveAttack(attacker, defender) {
  if (attacker.attackHitDone) return;
  const atkBox = getAttackBox(attacker, defender);
  if (!atkBox) return;

  const defBox = getBodyBox(defender);

  if (atkBox.type === 'punch' && defender.isCrouching) {
    attacker.attackHitDone = true;
    showLabel(defender === P ? playerMoveLbl : enemyMoveLbl, 'GUARD');
    return;
  }
  if (atkBox.type === 'kick' && defender.jumpY > 3) {
    attacker.attackHitDone = true;
    showLabel(defender === P ? playerMoveLbl : enemyMoveLbl, 'MISS');
    return;
  }
  if (defender.jumpY > 3) {
    attacker.attackHitDone = true;
    return;
  }

  if (boxesOverlap(atkBox, defBox)) {
    attacker.attackHitDone = true;
    applyDamage(defender, atkBox.damage, atkBox.type);
    showLabel(attacker === P ? enemyMoveLbl : playerMoveLbl, 'HIT!');
  }
}

/* ============================================================
   敵AI
   ============================================================ */
function updateEnemyAI() {
  if (gameOver) return;
  const dist = Math.abs(P.x - E.x);
  E.facing = P.x > E.x ? 1 : -1;

  if (E.state === 'hit') return;
  if (E.jumpY > 0) return;
  if (E.state === 'punching' || E.state === 'kicking') return;
  if (E.state === 'crouching') return;

  if (enemyAttackCooldown > 0) { enemyAttackCooldown--; return; }

  if (P.state === 'punching' && dist < PUNCH_RANGE + 3 && Math.random() < 0.35) {
    tryCrouch(E, true);
    setTimeout(() => tryCrouch(E, false), 400);
    showLabel(enemyMoveLbl, 'しゃがみ回避');
    enemyAttackCooldown = ATTACK_COOLDOWN;
    return;
  }
  if (P.state === 'kicking' && dist < KICK_RANGE + 3 && Math.random() < 0.35) {
    tryJump(E);
    showLabel(enemyMoveLbl, 'ジャンプ回避');
    enemyAttackCooldown = ATTACK_COOLDOWN;
    return;
  }

  if (dist > 18) {
    E.x += E.facing * MOVE_SPEED * 0.9;
    if (E.state !== 'walking') E.state = 'walking';
  } else if (enemyNextAttackTimer <= 0) {
    const useKick = Math.random() < 0.45;
    E.attackHitDone = false;
    E.state = useKick ? 'kicking' : 'punching';
    E.stateTimer = useKick ? KICK_DURATION : PUNCH_DURATION;
    showLabel(enemyMoveLbl, useKick ? 'KICK' : 'PUNCH');
    enemyAttackCooldown = ATTACK_COOLDOWN;
    enemyNextAttackTimer = 50 + Math.floor(Math.random() * 40);
  } else {
    enemyNextAttackTimer--;
    if (Math.random() < 0.3) E.x += E.facing * MOVE_SPEED * 0.4;
    if (E.state !== 'walking') E.state = 'walking';
  }
}

/* ============================================================
   更新
   ============================================================ */
function updatePlayer() {
  // ★ 攻撃ロックのタイマーを毎フレーム減らす
  if (attackLockTimer > 0) {
    attackLockTimer--;
    if (attackLockTimer <= 0) playerCanAttack = true;
  }

  if (P.state === 'hit') {
    P.stateTimer--;
    if (P.stateTimer <= 0) P.state = 'idle';
    return;
  }
  if (P.state === 'punching' || P.state === 'kicking') {
    P.stateTimer--;
    if (P.stateTimer <= 0) { P.state = 'idle'; playerCanAttack = true; }
    return;
  }
  if (P.jumpY > 0) {
    if (input.left)  P.x -= MOVE_SPEED * 0.6;
    if (input.right) P.x += MOVE_SPEED * 0.6;
    return;
  }
  if (P.state === 'crouching') {
    if (!P.isCrouching) P.state = 'idle';
    return;
  }

  let moved = false;
  if (input.left)  { P.x -= MOVE_SPEED; moved = true; }
  if (input.right) { P.x += MOVE_SPEED; moved = true; }
  if (moved) P.state = 'walking';
  else if (P.state !== 'crouching') P.state = 'idle';

  P.facing = E.x > P.x ? 1 : -1;
}

function updatePhysics() {
  [P, E].forEach(c => {
    if (c.jumpY > 0 || c.jumpVel > 0) {
      c.jumpVel -= GRAVITY;
      c.jumpY += c.jumpVel;
      if (c.jumpY <= 0) {
        c.jumpY = 0; c.jumpVel = 0;
        if (c.state === 'jumping') c.state = 'idle';
      }
    }
  });
}

function clampPositions() {
  P.x = Math.max(5, Math.min(95, P.x));
  E.x = Math.max(5, Math.min(95, E.x));
  const dist = P.x - E.x;
  if (Math.abs(dist) < MIN_DIST) {
    if (dist > 0) P.x = E.x + MIN_DIST;
    else P.x = E.x - MIN_DIST;
  }
}

/* ============================================================
   描画
   ============================================================ */
function render() {
  player.style.left = P.x + '%';
  player.style.bottom = (GROUND + P.jumpY) + '%';
  player.classList.toggle('facing-right', P.facing === 1);
  player.classList.toggle('facing-left',  P.facing === -1);
  player.classList.toggle('walking',   P.state === 'walking');
  player.classList.toggle('jumping',   P.jumpY > 0);
  player.classList.toggle('crouching', P.isCrouching);
  player.classList.toggle('punching',  P.state === 'punching');
  player.classList.toggle('kicking',   P.state === 'kicking');

  enemy.style.left = E.x + '%';
  enemy.style.bottom = (GROUND + E.jumpY) + '%';
  enemy.classList.toggle('facing-right', E.facing === 1);
  enemy.classList.toggle('facing-left',  E.facing === -1);
  enemy.classList.toggle('walking',   E.state === 'walking');
  enemy.classList.toggle('jumping',   E.jumpY > 0);
  enemy.classList.toggle('crouching', E.isCrouching);
  enemy.classList.toggle('punching',  E.state === 'punching');
  enemy.classList.toggle('kicking',   E.state === 'kicking');
}

/* ============================================================
   ラベル・勝敗
   ============================================================ */
function showLabel(el, text) {
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 600);
}

function checkGameOver() {
  if (E.hp <= 0) endGame('YOU WIN!', '#00ff88');
  else if (P.hp <= 0) endGame('YOU LOSE...', '#ff2244');
}

function endGame(text, color) {
  if (gameOver) return;
  gameOver = true;
  message.textContent = text;
  message.style.color = color;
  message.style.display = 'block';

  if (text === 'YOU WIN!') {
    // ★ クリア画面を表示（同タブで study.html へ誘導可能）
    setTimeout(() => {
      message.style.display = 'none';
      clearScreen.classList.add('active');
    }, 1200);
  } else {
    setTimeout(() => location.reload(), 3000);
  }
}

/* ============================================================
   メインループ
   ============================================================ */
function loop() {
  if (gameStarted && !gameOver) {
    if (hitStopTimer > 0) {
      hitStopTimer--;
    } else {
      updatePlayer();
      updateEnemyAI();
      updatePhysics();
      clampPositions();
      resolveAttack(P, E);
      resolveAttack(E, P);
      [P, E].forEach(c => {
        if (c.state === 'hit') {
          c.stateTimer--;
          if (c.stateTimer <= 0) c.state = 'idle';
        }
      });
      if (E.state === 'punching' || E.state === 'kicking') {
        E.stateTimer--;
        if (E.stateTimer <= 0) E.state = 'idle';
      }
    }
    render();
  }
  requestAnimationFrame(loop);
}

render();
loop();
</script>
