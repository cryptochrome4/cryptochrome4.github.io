<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資格クイズ ミリオネア 80問</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Playfair Display', 'Times New Roman', serif;
    }
    body {
      background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: radial-gradient(circle at 20% 20%, #2a3147, #141a28);
      border: 3px solid #c9a84c;
      border-radius: 60px 60px 40px 40px;
      padding: 30px 25px 40px;
      box-shadow: 0 30px 45px rgba(0,0,0,0.8), 0 0 0 2px #7a6530 inset;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #b4944b;
      padding-bottom: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: #f5e7b2;
      text-shadow: 0 0 12px #b48b3a, 0 2px 0 #4f3e1a;
      letter-spacing: 3px;
    }
    .title .crown {
      font-size: 2.4rem;
      filter: drop-shadow(0 0 6px #f5c542);
    }
    .score-area {
      background: #1e2337;
      padding: 8px 22px;
      border-radius: 40px;
      border: 1px solid #c9a84c;
      color: #eedb8a;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }
    .score-area span {
      color: #fad974;
      font-size: 1.6rem;
      margin-left: 8px;
    }
    .quiz-card {
      background: rgba(22, 28, 45, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid #b4944b;
      border-radius: 50px;
      padding: 25px 30px 20px;
      margin-bottom: 30px;
      box-shadow: 0 12px 18px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255, 215, 120, 0.3);
    }
    .qualification-badge {
      display: inline-block;
      background: #c9a84c;
      color: #0b0e1a;
      font-weight: bold;
      padding: 6px 24px;
      border-radius: 40px;
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 18px;
      border: 1px solid #fae49b;
      box-shadow: 0 2px 0 #5f4a1f;
    }
    .question-number {
      color: #b8ab7a;
      font-size: 1rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #4d4f66;
      padding-bottom: 6px;
    }
    .question-text {
      font-size: 1.7rem;
      font-weight: 500;
      color: #f2e6c7;
      line-height: 1.4;
      margin: 15px 0 20px;
      padding: 0 8px;
      text-shadow: 0 2px 3px #00000055;
      min-height: 3.8rem;
    }

    /* ===== 選択肢エリア（最初は非表示） ===== */
    .choices-wrapper {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.5s ease, opacity 0.4s ease, margin 0.3s ease;
      margin: 0;
    }
    .choices-wrapper.open {
      max-height: 600px;
      opacity: 1;
      margin: 18px 0 12px;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .choice-item {
      background: #1b2137;
      border: 1px solid #4d4f66;
      border-radius: 30px;
      padding: 14px 18px;
      color: #dbd0b0;
      font-size: 1.1rem;
      font-weight: 500;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
      letter-spacing: 0.3px;
    }
    .choice-item .choice-label {
      display: inline-block;
      background: #c9a84c;
      color: #0b0e1a;
      font-weight: bold;
      width: 28px;
      height: 28px;
      text-align: center;
      line-height: 28px;
      border-radius: 50%;
      margin-right: 12px;
      font-size: 0.95rem;
    }

    /* ===== 選択肢を表示するボタン ===== */
    .show-choices-btn {
      display: inline-block;
      background: #2a3150;
      border: 2px solid #b4944b;
      color: #f5e3b0;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 60px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 0 #0b0e16, 0 4px 12px #00000066;
      letter-spacing: 1px;
      margin: 8px 0 14px;
      width: 100%;
      text-align: center;
      background: linear-gradient(145deg, #2f3652, #1b2137);
    }
    .show-choices-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0b0e16, 0 8px 18px #00000099;
      background: #3a4161;
      border-color: #dbb85a;
    }
    .show-choices-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0b0e16;
    }
    .show-choices-btn.revealed {
      background: #1f3a2a;
      border-color: #7ab87a;
      color: #b8e0b8;
    }

    /* ===== 答えボックス（クリックで答え＋解説） ===== */
    .answer-box {
      background: #101522;
      border-left: 6px solid #c9a84c;
      border-radius: 30px;
      padding: 0 22px;
      margin: 12px 0 12px;
      transition: 0.25s ease;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    .answer-box .answer-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 14px;
      color: #d4c088;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2d344b;
    }
    .answer-box .answer-label .icon {
      font-size: 1.7rem;
      color: #e3c77a;
      transition: 0.2s;
    }
    .answer-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0;
      color: #e7dbb8;
      padding: 0 4px;
    }
    .answer-box.open .answer-content {
      max-height: 400px;
      opacity: 1;
      padding: 16px 4px 22px;
    }
    .answer-content .correct-answer {
      font-weight: 700;
      color: #fad974;
      font-size: 1.3rem;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .answer-content .explanation {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbc1a2;
      background: #1d233a;
      padding: 14px 18px;
      border-radius: 30px;
      border: 1px solid #3b3f5e;
    }
    .answer-box .click-hint {
      font-size: 0.9rem;
      color: #8b8469;
      margin-top: 6px;
      text-align: right;
      font-style: italic;
    }

    /* 答えボタンが非アクティブ（選択肢が出てないと押せない） */
    .answer-box.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .nav-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 15px;
    }
    .progress {
      color: #bba87a;
      font-size: 1.1rem;
      background: #1b2135;
      padding: 6px 24px;
      border-radius: 40px;
      border: 1px solid #735f2b;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #292f47;
      border: 2px solid #b4944b;
      color: #f5e3b0;
      font-weight: bold;
      padding: 12px 30px;
      border-radius: 60px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 6px 0 #0b0e16, 0 4px 12px #00000066;
      letter-spacing: 1px;
      background: linear-gradient(145deg, #2f3652, #1b2137);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0b0e16, 0 8px 18px #00000099;
      background: #3a4161;
      border-color: #dbb85a;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0b0e16;
    }
    .btn:disabled {
      opacity: 0.45;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0b0e16;
      pointer-events: none;
    }
    .footer-gold {
      margin-top: 20px;
      text-align: center;
      color: #8a7b4f;
      font-size: 0.9rem;
      border-top: 1px solid #4f432b;
      padding-top: 18px;
    }
    @media (max-width: 600px) {
      .container { padding: 20px 15px; }
      .title h1 { font-size: 1.6rem; }
      .question-text { font-size: 1.3rem; }
      .btn { padding: 10px 20px; font-size: 1rem; }
      .choices-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="header">
    <div class="title">
      <span class="crown">👑</span>
      <h1>資格クイズ</h1>
    </div>
    <div class="score-area">
      📚 <span id="questionCounter">1</span> / <span id="totalQuestions">80</span>
    </div>
  </div>

  <div class="quiz-card" id="quizCard">
    <div class="qualification-badge" id="qualificationBadge">🏛️ 司法書士</div>
    <div class="question-number">
      <span id="qNumberDisplay">第 1 問</span>
      <span id="qCategoryDisplay">📌 法律</span>
    </div>
    <div class="question-text" id="questionText">問題文がここに表示されます。</div>

    <!-- 選択肢を表示するボタン（最初は「選択肢を表示」） -->
    <button class="show-choices-btn" id="showChoicesBtn">🔍 選択肢を表示</button>

    <!-- 4択エリア：デフォルトで閉じてる -->
    <div class="choices-wrapper" id="choicesWrapper">
      <div class="choices-grid" id="choicesGrid">
        <div class="choice-item"><span class="choice-label">A</span> <span class="choice-text">選択肢A</span></div>
        <div class="choice-item"><span class="choice-label">B</span> <span class="choice-text">選択肢B</span></div>
        <div class="choice-item"><span class="choice-label">C</span> <span class="choice-text">選択肢C</span></div>
        <div class="choice-item"><span class="choice-label">D</span> <span class="choice-text">選択肢D</span></div>
      </div>
    </div>

    <!-- 答え＋解説 (クリックで展開) 最初はdisabled -->
    <div class="answer-box disabled" id="answerBox">
      <div class="answer-label" id="answerToggle">
        <span>💡 答えを表示</span>
        <span class="icon">▼</span>
      </div>
      <div class="answer-content" id="answerContent">
        <div class="correct-answer" id="correctAnswerText">✅ 正解：ここに正解</div>
        <div class="explanation" id="explanationText">📖 解説がここに入ります。</div>
      </div>
      <div class="click-hint">※ クリックで答え＆解説</div>
    </div>
  </div>

  <div class="nav-area">
    <div class="progress" id="progressText">資格 1 / 20</div>
    <div class="btn-group">
      <button class="btn" id="prevBtn" disabled>◀ 前へ</button>
      <button class="btn" id="nextBtn">次へ ▶</button>
    </div>
  </div>
  <div class="footer-gold">⚜️ 全80問 あなたは何問正解できる？ ⚜️</div>
</div>

<script>
  (function() {
    // ---------- クイズデータ 20ジャンル × 4問 = 80問 ----------
    const quizData = [
      { qualification: '⚖️ 司法書士', category: '法律', questions: [
        { q: '司法書士が独占的に代理できる業務は？', choices: ['登記・供託', '訴訟代理全般', '行政手続き', '税務代理'], ans: 0, exp: '司法書士は登記・供託の手続きを独占的に代理できる。訴訟代理は簡易裁判所に限られる。' },
        { q: '司法書士試験は年に何回実施される？', choices: ['年1回', '年2回', '年3回', '年4回'], ans: 0, exp: '司法書士試験は毎年1回、法務省が実施する国家試験である。' },
        { q: '司法書士の付加業務として認められているのは？', choices: ['簡易裁判所の訴訟代理', '刑事弁護', '税務申告', '労働審判代理'], ans: 0, exp: '簡易裁判所での一定額以下の訴訟代理が付加業務として認められている。' },
        { q: '司法書士はどの省庁の所管か？', choices: ['法務省', '財務省', '経済産業省', '厚生労働省'], ans: 0, exp: '司法書士は法務省が所管する国家資格である。' }
      ]},
      { qualification: '📜 行政書士', category: '行政', questions: [
        { q: '行政書士の主な業務は？', choices: ['官公署への書類作成・提出代理', '会計監査', '建築設計', '医療行為'], ans: 0, exp: '行政書士は許認可申請など行政機関への書類作成・提出を代理する。' },
        { q: '行政書士はどのような資格か？', choices: ['名称独占資格', '業務独占資格', '必置資格', '検定資格'], ans: 0, exp: '行政書士は名称独占資格であり、業務を独占はしないが、専門性が求められる。' },
        { q: '行政書士試験の実施団体は？', choices: ['行政書士試験研究センター', '日本商工会議所', '経済産業省', '法務省'], ans: 0, exp: '一般財団法人 行政書士試験研究センターが実施する。' },
        { q: '行政書士が代理できる訴訟は？', choices: ['簡易裁判所の少額訴訟', 'すべての民事訴訟', '刑事訴訟', '家事事件'], ans: 0, exp: '行政書士は簡易裁判所での少額訴訟等の代理が認められる場合がある。' }
      ]},
      { qualification: '🧾 税理士', category: '会計・税務', questions: [
        { q: '税理士の三大業務は？', choices: ['税務代理・書類作成・相談', '監査・会計・経営', '登記・供託・訴訟', '許認可・申請・届出'], ans: 0, exp: '税理士法で定められた三大業務は税務代理、税務書類の作成、税務相談である。' },
        { q: '税理士試験の科目数は？', choices: ['5科目', '3科目', '7科目', '4科目'], ans: 0, exp: '必須3科目＋選択2科目の計5科目である。' },
        { q: '税理士の独占業務でないものは？', choices: ['経営コンサルタント', '税務申告書作成', '税務相談', '税務代理'], ans: 0, exp: '経営コンサルティングは独占業務ではなく、他士業と協業する。' },
        { q: '税理士登録に必要な実務経験は？', choices: ['2年以上', '1年', '3年', 'なし'], ans: 0, exp: '試験合格後、2年以上の実務経験または実務修習を経て登録される。' }
      ]},
      { qualification: '📊 中小企業診断士', category: '経営', questions: [
        { q: '中小企業診断士は何の国家資格？', choices: ['経営コンサルタント', '会計士', '弁護士', '建築士'], ans: 0, exp: '経営コンサルタントとして唯一の国家資格である。' },
        { q: '試験の構成は？', choices: ['1次筆記＋2次筆記・口述', '筆記のみ', '実技のみ', '口述のみ'], ans: 0, exp: '1次試験（マーク式）と2次試験（記述＋口述）で構成される。' },
        { q: '所管官庁は？', choices: ['経済産業省', '財務省', '法務省', '厚生労働省'], ans: 0, exp: '中小企業庁（経済産業省）が所管する。' },
        { q: '主な支援対象は？', choices: ['中小企業・小規模事業者', '大企業', '官公庁', 'NPO'], ans: 0, exp: '中小企業・小規模事業者の経営診断、事業計画策定などを支援する。' }
      ]},
      { qualification: '🏗️ 建築士', category: '建設', questions: [
        { q: '建築士の独占業務は？', choices: ['設計・工事監理', '施工管理', '測量', '設備設計'], ans: 0, exp: '建築士は一定規模以上の建築物の設計・工事監理を独占する。' },
        { q: '一級建築士の受験資格に必要な実務経験は？', choices: ['2年以上', '1年', '3年', 'なし'], ans: 0, exp: '大学卒業後2年以上の実務経験が必要である。' },
        { q: '二級建築士が設計できる最大規模は？', choices: ['木造3階建て以下', '5階建て', '10階建て', '制限なし'], ans: 0, exp: '二級建築士は木造3階建て以下、延べ面積500㎡以下など制限がある。' },
        { q: '建築士法の所管省庁は？', choices: ['国土交通省', '経済産業省', '法務省', '総務省'], ans: 0, exp: '建築士法は国土交通省が所管する。' }
      ]},
      { qualification: '⚡ 電気工事士', category: '電気', questions: [
        { q: '電気工事士の業務は？', choices: ['電気工事の作業', '設計', '監理', '保安'], ans: 0, exp: '電気工事士は電気工事の作業を独占的に行うことができる。' },
        { q: '第一種と第二種の違いは？', choices: ['扱える電圧・工事範囲', '試験難易度', '更新期間', '受験資格'], ans: 0, exp: '第一種は高圧（600V以下）まで、第二種は低圧（400V以下）まで扱える。' },
        { q: '電気工事士試験の実施団体は？', choices: ['経済産業省', '国土交通省', '総務省', '消防庁'], ans: 0, exp: '経済産業省が所管し、一般財団法人電気技術者試験センターが実施する。' },
        { q: '第二種電気工事士で扱える最大電圧は？', choices: ['400V以下', '600V以下', '300V以下', '100V以下'], ans: 0, exp: '第二種は低圧（400V以下）の電気工事を行うことができる。' }
      ]},
      { qualification: '🚗 自動車整備士', category: '整備', questions: [
        { q: '自動車整備士は何級まで存在する？', choices: ['1級・2級・3級', '特級・1級', '1級・2級', '1級のみ'], ans: 0, exp: '一級、二級、三級の3段階がある。' },
        { q: '一級整備士の受験資格は？', choices: ['二級合格後3年以上実務', '二級合格後1年', '実務経験なし', '高校卒業のみ'], ans: 0, exp: '二級自動車整備士に合格し、3年以上の実務経験が必要。' },
        { q: '自動車整備士の所管官庁は？', choices: ['国土交通省', '経済産業省', '警察庁', '環境省'], ans: 0, exp: '国土交通省が所管する国家資格である。' },
        { q: '三級整備士が行える整備範囲は？', choices: ['定期点検・分解整備の一部', '全ての整備', 'エンジン交換', '車体修理'], ans: 0, exp: '三級は基本的な定期点検や簡単な分解整備が主な業務である。' }
      ]},
      { qualification: '🏠 宅地建物取引士', category: '不動産', questions: [
        { q: '宅建士の独占業務は？', choices: ['重要事項説明書への記名・押印', '契約書作成', '登記申請', '鑑定評価'], ans: 0, exp: '重要事項説明書（いわゆる「35条書面」）への記名押印が独占業務である。' },

        { q: 'FPの主な業務は？', choices: ['資産設計・ライフプラン', '投資運用', '保険販売', '税務申告'], ans: 0, exp: '家計管理、資産形成、保険、年金など総合的なライフプランニングを提案する。' },

        { q: '気象予報士試験の実施団体は？', choices: ['気象庁（一般財団法人気象業務支援センター）', '日本気象協会', '文科省', '環境省'], ans: 0, exp: '一般財団法人気象業務支援センターが実施する。' }
      ]},
      { qualification: '🛡️ 衛生管理者', category: '安全衛生', questions: [
        { q: '衛生管理者は何の資格？', choices: ['必置資格（常時50人以上の事業所）', '名称独占', '業務独占', '任意資格'], ans: 0, exp: '労働安全衛生法で常時50人以上の事業所に選任が義務付けられている必置資格。' },
        { q: '衛生管理者の試験は何種？', choices: ['第一種・第二種', '1級・2級', '特級・1級', '甲種・乙種'], ans: 0, exp: '第一種（全ての事業場）と第二種（一部業種）の2種類がある。' },
        { q: '衛生管理者の所管官庁は？', choices: ['厚生労働省', '経済産業省', '総務省', '法務省'], ans: 0, exp: '厚生労働省が所管する国家資格である。' },
        { q: '第一種衛生管理者が扱える範囲は？', choices: ['全ての事業場', '製造業のみ', '建設業のみ', '医療機関のみ'], ans: 0, exp: '第一種はすべての業種の事業場で選任できる。' }
      ]},
      { qualification: '🔥 危険物取扱者', category: '安全', questions: [
        { q: '危険物取扱者は何類まで？', choices: ['甲・乙・丙（6類）', '1～6類', 'A～C類', '特級・1級'], ans: 0, exp: '甲種、乙種（1～6類）、丙種に分かれる。' },
        { q: '危険物取扱者の試験は誰が実施？', choices: ['消防庁（都道府県）', '経済産業省', '国土交通省', '総務省'], ans: 0, exp: '都道府県知事（消防庁指導）が実施する国家試験である。' },
        { q: '甲種危険物取扱者の受験資格は？', choices: ['大学で化学に関する科目を修得', '誰でも受験可', '乙種合格者', '実務経験5年'], ans: 0, exp: '大学で所定の化学科目を修得するか、同等の資格・経験が必要。' },
        { q: '危険物取扱者の所管官庁は？', choices: ['総務省（消防庁）', '経済産業省', '国土交通省', '厚生労働省'], ans: 0, exp: '消防庁（総務省）が所管する。' }
      ]}
    ];

    // ---------- 状態 ----------
    let currentQualIndex = 0;
    let currentQIndex = 0;
    const totalQual = quizData.length;
    const totalQuestions = totalQual * 4;

    // DOM
    const qualBadge = document.getElementById('qualificationBadge');
    const qNumberDisplay = document.getElementById('qNumberDisplay');
    const qCategoryDisplay = document.getElementById('qCategoryDisplay');
    const questionText = document.getElementById('questionText');
    const showChoicesBtn = document.getElementById('showChoicesBtn');
    const choicesWrapper = document.getElementById('choicesWrapper');
    const choicesGrid = document.getElementById('choicesGrid');
    const answerBox = document.getElementById('answerBox');
    const answerToggle = document.getElementById('answerToggle');
    const correctAnswerText = document.getElementById('correctAnswerText');
    const explanationText = document.getElementById('explanationText');
    const questionCounter = document.getElementById('questionCounter');
    const totalQuestionsSpan = document.getElementById('totalQuestions');
    const progressText = document.getElementById('progressText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const labels = ['A', 'B', 'C', 'D'];
    let choicesRevealed = false;  // 選択肢が表示されているか

    function renderQuestion() {
      const qual = quizData[currentQualIndex];
      const q = qual.questions[currentQIndex];

      qualBadge.textContent = qual.qualification;
      qNumberDisplay.textContent = `第 ${currentQIndex + 1} 問`;
      qCategoryDisplay.textContent = `📌 ${qual.category}`;
      questionText.textContent = q.q;

      // 4択テキストをセット
      const choiceItems = choicesGrid.querySelectorAll('.choice-item');
      choiceItems.forEach((item, idx) => {
        item.querySelector('.choice-text').textContent = q.choices[idx] || '---';
      });

      // 答え＆解説をセット
      const correctLetter = labels[q.ans];
      correctAnswerText.innerHTML = `✅ 正解：${correctLetter}. ${q.choices[q.ans]}`;
      explanationText.textContent = `📖 ${q.exp}`;

      // 選択肢・答えを全て閉じる
      choicesWrapper.classList.remove('open');
      answerBox.classList.remove('open');
      answerBox.classList.add('disabled');
      choicesRevealed = false;
      showChoicesBtn.textContent = '🔍 選択肢を表示';
      showChoicesBtn.classList.remove('revealed');
      const icon = answerToggle.querySelector('.icon');
      icon.textContent = '▼';

      // カウンター
      const globalIndex = currentQualIndex * 4 + currentQIndex + 1;
      questionCounter.textContent = globalIndex;
      totalQuestionsSpan.textContent = totalQuestions;
      progressText.textContent = `資格 ${currentQualIndex + 1} / ${totalQual}`;

      prevBtn.disabled = (currentQualIndex === 0 && currentQIndex === 0);
      const isLast = (currentQualIndex === totalQual - 1 && currentQIndex === 3);
      nextBtn.disabled = isLast;
      nextBtn.textContent = isLast ? '🏁 完了' : '次へ ▶';
    }

    // 選択肢表示トグル
    function toggleChoices() {
      if (choicesRevealed) {
        // 選択肢を閉じる → 答えも閉じる
        choicesWrapper.classList.remove('open');
        answerBox.classList.remove('open');
        answerBox.classList.add('disabled');
        choicesRevealed = false;
        showChoicesBtn.textContent = '🔍 選択肢を表示';
        showChoicesBtn.classList.remove('revealed');
        const icon = answerToggle.querySelector('.icon');
        icon.textContent = '▼';
      } else {
        // 選択肢を開く → 答えボタンを有効化
        choicesWrapper.classList.add('open');
        answerBox.classList.remove('disabled');
        choicesRevealed = true;
        showChoicesBtn.textContent = '🙈 選択肢を隠す';
        showChoicesBtn.classList.add('revealed');
      }
    }

    // 答え表示トグル
    function toggleAnswer() {
      if (!choicesRevealed) return; // 選択肢が出てないと押せない
      const isOpen = answerBox.classList.toggle('open');
      const icon = answerToggle.querySelector('.icon');
      icon.textContent = isOpen ? '▲' : '▼';
    }

    function goNext() {
      if (currentQualIndex === totalQual - 1 && currentQIndex === 3) return;
      if (currentQIndex < 3) {
        currentQIndex++;
      } else {
        if (currentQualIndex < totalQual - 1) {
          currentQualIndex++;
          currentQIndex = 0;
        }
      }
      renderQuestion();
      document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function goPrev() {
      if (currentQualIndex === 0 && currentQIndex === 0) return;
      if (currentQIndex > 0) {
        currentQIndex--;
      } else {
        if (currentQualIndex > 0) {
          currentQualIndex--;
          currentQIndex = 3;
        }
      }
      renderQuestion();
      document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // イベント
    showChoicesBtn.addEventListener('click', toggleChoices);

    answerToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleAnswer();
    });
    answerBox.addEventListener('click', function(e) {
      if (e.target.closest('.answer-label')) return;
      toggleAnswer();
    });

    nextBtn.addEventListener('click', goNext);
    prevBtn.addEventListener('click', goPrev);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (!nextBtn.disabled) goNext();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (!prevBtn.disabled) goPrev();
      }
    });

    renderQuestion();
  })();
</script>
