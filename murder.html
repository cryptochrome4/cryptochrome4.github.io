<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジェイソンからの脱出 - 9ステージ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
        }
        #gameContainer {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            border: 2px solid #333;
        }
        #topPanel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f0f1f;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 12px;
            flex-wrap: wrap;
            gap: 5px;
        }
        #topPanel .label {
            color: #888;
        }
        #topPanel .value {
            color: #ffd93d;
            font-weight: bold;
        }
        #topPanel .danger {
            color: #ff6b6b;
        }
        #canvasWrapper {
            position: relative;
            border: 3px solid #2a2a4a;
            background: #1a3a1a;
            cursor: crosshair;
        }
        canvas {
            display: block;
            width: 800px;
            height: 600px;
            image-rendering: pixelated;
            background: #1a3a1a;
        }
        #bottomPanel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            gap: 10px;
        }
        #statusMsg {
            color: #ff6b6b;
            padding: 6px 10px;
            background: #0f0f1f;
            border-radius: 5px;
            font-size: 13px;
            flex: 1;
            min-height: 30px;
            border: 1px solid #2a2a4a;
        }
        #statusMsg.info {
            color: #64d8ff;
        }
        #statusMsg.success {
            color: #69db7c;
        }
        #minimap {
            display: grid;
            grid-template-columns: repeat(3, 28px);
            grid-template-rows: repeat(3, 28px);
            gap: 2px;
            background: #0f0f1f;
            padding: 4px;
            border-radius: 5px;
            border: 1px solid #2a2a4a;
            flex-shrink: 0;
        }
        .minimap-cell {
            background: #1a3a1a;
            border: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #444;
            transition: all 0.2s;
            position: relative;
        }
        .minimap-cell.current {
            border: 2px solid #ffd93d;
        }
        .minimap-cell.has-jason {
            background: #4a0a0a;
        }
        .minimap-cell.has-bear {
            background: #3a2a0a;
        }
        .minimap-cell .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            position: absolute;
        }
        .minimap-cell .dot.player {
            background: #ff6b6b;
            top: 2px;
            left: 2px;
        }
        .minimap-cell .dot.jason {
            background: #ff0000;
            bottom: 2px;
            right: 2px;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #gameOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            pointer-events: none;
            z-index: 10;
        }
        #gameOverlay.show {
            display: flex;
            pointer-events: auto;
        }
        #gameOverlay .title {
            font-size: 32px;
            margin-bottom: 10px;
        }
        #gameOverlay .sub {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 20px;
        }
        #gameOverlay button {
            background: #4a4a6a;
            color: white;
            border: 2px solid #6a6a8a;
            padding: 10px 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
        }
        #gameOverlay button:hover {
            background: #5a5a8a;
            transform: scale(1.05);
        }
        #inventoryDisplay {
            color: #a8e6cf;
            font-size: 12px;
            background: #0f0f1f;
            padding: 4px 10px;
            border-radius: 3px;
            border: 1px solid #2a2a4a;
            min-width: 80px;
            text-align: center;
        }
        .controls-hint {
            color: #555;
            font-size: 10px;
            text-align: center;
            padding: 4px;
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <div id="topPanel">
        <span><span class="label">📅 日</span> <span class="value" id="dayDisplay">1</span>/7</span>
        <span><span class="label">⏰</span> <span class="value" id="phaseDisplay">朝</span></span>
        <span><span class="label">🏠 補強</span> <span class="value" id="defenseDisplay">0</span>/100</span>
        <span id="inventoryDisplay">🎒 なし</span>
        <span><span class="label">📌</span> <span class="value" id="stageDisplay">中央</span></span>
    </div>
    <div id="canvasWrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameOverlay">
            <div class="title" id="resultTitle">ゲームオーバー</div>
            <div class="sub" id="resultSub">ジェイソンにやられた...</div>
            <button id="restartBtn">🔄 やり直す</button>
        </div>
    </div>
    <div id="bottomPanel">
        <div id="statusMsg">▶ マウスで移動 | クリックで使用 | 右クリックで捨てる</div>
        <div id="minimap"></div>
    </div>
    <div class="controls-hint">[1-9] ステージ移動 (デバッグ) | 青い点=ジェイソン | 赤い点=プレイヤー</div>
</div>

<script>
// ============================================================
// シンプルで堅牢な設計 - バグを防ぐために徹底的にシンプルに
// ============================================================

// ===== 定数 =====
const CELL = 40;
const COLS = 20;
const ROWS = 15;
const STAGE_COUNT = 9;
const STAGE_NAMES = ['左上', '上', '右上', '左', '中央', '右', '左下', '下', '右下'];

// ===== ステージマップ (0=森, 1=家, 2=倉庫) =====
function createStageMaps() {
    const maps = [];
    for(let i=0; i<9; i++) {
        maps.push(Array(ROWS).fill().map(() => Array(COLS).fill(0)));
    }
    // 中央ステージに家と倉庫
    for(let r=5; r<=9; r++) {
        for(let c=7; c<=11; c++) {
            maps[4][r][c] = 1;
        }
    }
    maps[4][7][9] = 2;
    maps[4][7][10] = 2;
    return maps;
}

// ===== ドット絵描画関数 =====
function drawPixelPerson(ctx, x, y, color, hairColor, isHero, hasWood) {
    const s = 2;
    // 頭
    ctx.fillStyle = hairColor;
    ctx.fillRect(x-6*s, y-10*s, 12*s, 10*s);
    // 顔
    ctx.fillStyle = '#f5d0b8';
    ctx.fillRect(x-4*s, y-8*s, 8*s, 6*s);
    // 目
    ctx.fillStyle = '#000';
    ctx.fillRect(x-3*s, y-6*s, 2*s, 2*s);
    ctx.fillRect(x+1*s, y-6*s, 2*s, 2*s);
    // 口
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(x-1*s, y-3*s, 2*s, 1*s);
    // 体
    ctx.fillStyle = color;
    ctx.fillRect(x-4*s, y, 8*s, 10*s);
    // 腕
    ctx.fillRect(x-6*s, y+1*s, 2*s, 6*s);
    ctx.fillRect(x+4*s, y+1*s, 2*s, 6*s);
    // 足
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(x-3*s, y+10*s, 2*s, 4*s);
    ctx.fillRect(x+1*s, y+10*s, 2*s, 4*s);
    // 主人公マーク
    if(isHero) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('★', x, y-12*s);
    }
    // 木材
    if(hasWood) {
        ctx.fillStyle = '#8b6b4d';
        ctx.fillRect(x+2*s, y-6*s, 4*s, 3*s);
    }
}

function drawPixelBear(ctx, x, y, isHungry) {
    const s = 2.5;
    ctx.fillStyle = isHungry ? '#4a0a0a' : '#5d4037';
    // 体
    ctx.fillRect(x-8*s, y-3*s, 16*s, 10*s);
    // 頭
    ctx.fillRect(x-6*s, y-8*s, 12*s, 8*s);
    // 耳
    ctx.fillRect(x-8*s, y-10*s, 4*s, 5*s);
    ctx.fillRect(x+4*s, y-10*s, 4*s, 5*s);
    ctx.fillStyle = isHungry ? '#8b0000' : '#795548';
    ctx.fillRect(x-7*s, y-9*s, 2*s, 3*s);
    ctx.fillRect(x+5*s, y-9*s, 2*s, 3*s);
    // 目
    ctx.fillStyle = '#000';
    ctx.fillRect(x-4*s, y-6*s, 2*s, 2*s);
    ctx.fillRect(x+2*s, y-6*s, 2*s, 2*s);
    // 鼻
    ctx.fillStyle = isHungry ? '#ff0000' : '#333';
    ctx.fillRect(x-1*s, y-4*s, 2*s, 2*s);
    if(isHungry) {
        ctx.fillStyle = '#ff0000';
        ctx.font = '12px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('🔥', x, y-12*s);
    }
}

function drawPixelWolf(ctx, x, y, isFed) {
    const s = 1.8;
    ctx.fillStyle = isFed ? '#78909c' : '#90a4ae';
    // 体
    ctx.fillRect(x-6*s, y-2*s, 12*s, 7*s);
    // 頭
    ctx.fillRect(x-8*s, y-6*s, 8*s, 6*s);
    // 耳
    ctx.fillRect(x-8*s, y-8*s, 3*s, 4*s);
    ctx.fillRect(x-5*s, y-8*s, 3*s, 4*s);
    // 目
    ctx.fillStyle = '#000';
    ctx.fillRect(x-6*s, y-4*s, 1.5*s, 1.5*s);
    ctx.fillRect(x-3*s, y-4*s, 1.5*s, 1.5*s);
    // 口
    ctx.fillStyle = isFed ? '#ff8a80' : '#ff1744';
    ctx.fillRect(x-5*s, y-1*s, 3*s, 1.5*s);
    if(isFed) {
        ctx.fillStyle = '#ff6b6b';
        ctx.font = '10px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('❤', x, y-10*s);
    }
}

function drawPixelJason(ctx, x, y) {
    const s = 2.2;
    // マスク
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(x-6*s, y-10*s, 12*s, 10*s);
    // マスクの穴
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(x-4*s, y-7*s, 2.5*s, 3*s);
    ctx.fillRect(x+1.5*s, y-7*s, 2.5*s, 3*s);
    ctx.fillRect(x-1*s, y-3*s, 2*s, 2*s);
    // 体
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(x-5*s, y, 10*s, 10*s);
    // 腕
    ctx.fillRect(x-7*s, y+2*s, 2*s, 6*s);
    ctx.fillRect(x+5*s, y+2*s, 2*s, 6*s);
    // 足
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(x-3*s, y+10*s, 2*s, 4*s);
    ctx.fillRect(x+1*s, y+10*s, 2*s, 4*s);
    // 武器 (包丁)
    ctx.fillStyle = '#78909c';
    ctx.fillRect(x+6*s, y-4*s, 1.5*s, 8*s);
    ctx.fillRect(x+5*s, y-6*s, 3.5*s, 2*s);
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(x+5.5*s, y-5*s, 2*s, 1*s);
    // 血痕
    ctx.fillStyle = '#8b0000';
    ctx.fillRect(x-2*s, y+3*s, 1.5*s, 1.5*s);
    ctx.fillRect(x+1*s, y+5*s, 1.5*s, 1.5*s);
    // チェーンソーの音（エフェクト）
    ctx.fillStyle = 'rgba(255,0,0,0.1)';
    ctx.beginPath();
    ctx.arc(x, y, 18*s, 0, Math.PI*2);
    ctx.fill();
}

// ===== ゲーム状態 =====
const G = {
    // 基本
    day: 1,
    phase: 0, // 0=朝,1=昼,2=夜
    phaseTimer: 0,
    defense: 0,
    gameOver: false,
    won: false,
    ended: false,
    
    // ステージ
    currentStage: 4,
    maps: null,
    
    // プレイヤー
    player: null,
    mouseX: 400,
    mouseY: 300,
    
    // ジェイソン
    jason: null,
    jasonSpeed: 10,
    jasonMoveTimer: 0,
    
    // アイテム
    inventory: null,
    woodStock: 0,
    items: {}, // stage -> items[]
    
    // 動物
    wolves: {}, // stage -> wolves[]
    bear: null,
    
    // 補強フラグ
    windowReinforced: false,
    trapSet: false,
    wolfFed: false,
    gunStored: false,
    axeStored: false,
    
    // キャラクター
    characters: {},
    
    // フレームカウント
    frame: 0
};

// ===== ユーティリティ =====
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randF(min, max) { return Math.random() * (max - min) + min; }
function dist(a, b) { return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ===== 初期化 =====
function initGame() {
    // マップ
    G.maps = createStageMaps();
    
    // プレイヤー (紅葉)
    G.player = {
        name: '紅葉',
        x: 400,
        y: 300,
        stage: 4,
        speed: 70,
        color: '#e74c3c',
        hairColor: '#e74c3c',
        isHero: true,
        alive: true,
        hasWood: false
    };
    
    // 他のキャラクター
    const charData = [
        {name: '坪池', color: '#e74c3c', hair: '#c0392b', speed: 70},
        {name: '加藤', color: '#3498db', hair: '#2980b9', speed: 40},
        {name: '山崎', color: '#2ecc71', hair: '#27ae60', speed: 10},
        {name: '松本', color: '#9b59b6', hair: '#8e44ad', speed: 60},
        {name: '角田', color: '#f39c12', hair: '#d68910', speed: 20},
        {name: '木元', color: '#1abc9c', hair: '#16a085', speed: 50},
        {name: '市川', color: '#e67e22', hair: '#d35400', speed: 30},
        {name: '青笹', color: '#2e86de', hair: '#1a5276', speed: 80}
    ];
    
    G.characters = {};
    const startPositions = [
        {x: 350, y: 250}, {x: 450, y: 250}, {x: 350, y: 350},
        {x: 450, y: 350}, {x: 300, y: 300}, {x: 500, y: 300},
        {x: 400, y: 200}, {x: 400, y: 400}
    ];
    
    charData.forEach((data, i) => {
        G.characters[data.name] = {
            name: data.name,
            x: startPositions[i].x + rand(-30, 30),
            y: startPositions[i].y + rand(-30, 30),
            stage: 4,
            speed: data.speed,
            color: data.color,
            hairColor: data.hair,
            isHero: false,
            alive: true,
            hasWood: false,
            actionTimer: rand(0, 30),
            targetX: 400,
            targetY: 300
        };
    });
    
    // ジェイソン - 森のステージからスタート
    const forestStages = [0,1,2,3,5,6,7,8];
    const startStage = forestStages[rand(0, forestStages.length-1)];
    G.jason = {
        stage: startStage,
        x: rand(50, 750),
        y: rand(50, 550),
        speed: 10
    };
    G.jasonSpeed = 10;
    G.jasonMoveTimer = 0;
    
    // アイテムを全ステージに生成
    G.items = {};
    for(let stage=0; stage<9; stage++) {
        G.items[stage] = generateStageItems(stage);
    }
    
    // 狼を全ステージに生成（中央以外）
    G.wolves = {};
    for(let stage=0; stage<9; stage++) {
        G.wolves[stage] = generateStageWolves(stage);
    }
    
    // 熊をランダムステージに配置
    const bearStage = rand(0, 8);
    const bearMap = G.maps[bearStage];
    const cells = [];
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            if(bearMap[r][c] === 0) cells.push({x: c*CELL+CELL/2, y: r*CELL+CELL/2});
        }
    }
    const pos = cells[rand(0, cells.length-1)] || {x: 400, y: 300};
    G.bear = {
        stage: bearStage,
        x: pos.x,
        y: pos.y,
        speed: 60,
        isHungry: false,
        alive: true,
        hungryDays: new Set(),
        moveTimer: 0
    };
    // 襲来日をランダムに2日設定
    while(G.bear.hungryDays.size < 2) {
        G.bear.hungryDays.add(rand(1, 7));
    }
    
    // リセット
    G.day = 1;
    G.phase = 0;
    G.phaseTimer = 0;
    G.defense = 0;
    G.inventory = null;
    G.woodStock = 0;
    G.windowReinforced = false;
    G.trapSet = false;
    G.wolfFed = false;
    G.gunStored = false;
    G.axeStored = false;
    G.gameOver = false;
    G.won = false;
    G.ended = false;
    G.currentStage = 4;
    G.frame = 0;
    
    // UI更新
    updateUI();
    updateMinimap();
    document.getElementById('gameOverlay').classList.remove('show');
    document.getElementById('statusMsg').textContent = '▶ ゲームスタート！ 逃げ切れ！';
    document.getElementById('statusMsg').className = 'info';
}

// ===== ステージアイテム生成 =====
function generateStageItems(stage) {
    const map = G.maps[stage];
    const cells = [];
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            if(map[r][c] === 0) cells.push({x: c*CELL+CELL/2, y: r*CELL+CELL/2});
        }
    }
    // シャッフル
    for(let i=cells.length-1; i>0; i--) {
        const j = rand(0, i);
        [cells[i], cells[j]] = [cells[j], cells[i]];
    }
    
    const items = [];
    const types = [];
    // 木材は多めに
    for(let i=0; i<6; i++) types.push('木材');
    types.push('スコップ');
    types.push('狼の餌');
    types.push('銃');
    types.push('斧');
    
    let idx = 0;
    for(let type of types) {
        if(idx < cells.length) {
            items.push({
                x: cells[idx].x,
                y: cells[idx].y,
                type: type,
                collected: false,
                isWood: type === '木材'
            });
            idx++;
        }
    }
    return items;
}

// ===== ステージ狼生成 =====
function generateStageWolves(stage) {
    if(stage === 4) return []; // 中央には狼なし
    const map = G.maps[stage];
    const cells = [];
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            if(map[r][c] === 0) cells.push({x: c*CELL+CELL/2, y: r*CELL+CELL/2});
        }
    }
    const wolves = [];
    const count = rand(0, 2);
    for(let i=0; i<count; i++) {
        if(cells.length > 0) {
            const idx = rand(0, cells.length-1);
            wolves.push({
                x: cells[idx].x,
                y: cells[idx].y,
                speed: 40,
                isFed: false,
                alive: true,
                targetX: cells[idx].x,
                targetY: cells[idx].y,
                moveTimer: rand(0, 30)
            });
            cells.splice(idx, 1);
        }
    }
    return wolves;
}

// ===== フェーズ更新 =====
function updatePhase() {
    G.phaseTimer++;
    if(G.phaseTimer >= 30) {
        G.phaseTimer = 0;
        G.phase = (G.phase + 1) % 3;
        if(G.phase === 0) {
            G.day++;
            if(G.day > 7) {
                endGame();
                return;
            }
            G.jasonSpeed = Math.min(70, 10 + (G.day-1) * 10);
            G.jason.speed = G.jasonSpeed;
            // 熊の空腹チェック
            if(G.bear) {
                G.bear.isHungry = G.bear.hungryDays.has(G.day);
            }
            updateUI();
        }
        const phaseNames = ['朝', '昼', '夜'];
        document.getElementById('phaseDisplay').textContent = phaseNames[G.phase];
        document.getElementById('dayDisplay').textContent = G.day;
    }
}

// ===== ジェイソン移動（青鬼スタイル） =====
function updateJason() {
    if(G.gameOver || G.ended) return;
    
    const jason = G.jason;
    const player = G.player;
    
    // ランダムにステージ移動（青鬼スタイル）
    G.jasonMoveTimer++;
    if(G.jasonMoveTimer > 60 + rand(0, 60)) {
        G.jasonMoveTimer = 0;
        // 隣接ステージに移動（または同じステージに留まる）
        const current = jason.stage;
        const row = Math.floor(current / 3);
        const col = current % 3;
        const neighbors = [current];
        if(row > 0) neighbors.push(current - 3);
        if(row < 2) neighbors.push(current + 3);
        if(col > 0) neighbors.push(current - 1);
        if(col < 2) neighbors.push(current + 1);
        // プレイヤーのステージを優先
        if(neighbors.includes(player.stage) && Math.random() < 0.4) {
            jason.stage = player.stage;
        } else {
            jason.stage = neighbors[rand(0, neighbors.length-1)];
        }
        // 新しいステージのランダム位置
        jason.x = rand(50, 750);
        jason.y = rand(50, 550);
    }
    
    // プレイヤーと同じステージなら追跡
    if(jason.stage === player.stage && player.alive) {
        const dx = player.x - jason.x;
        const dy = player.y - jason.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if(d > 20) {
            const speed = jason.speed * 0.15;
            jason.x += (dx/d) * Math.min(speed, d);
            jason.y += (dy/d) * Math.min(speed, d);
        }
        // 接触チェック
        if(d < 25) {
            gameOver(false, 'ジェイソンに捕まった...');
        }
    }
    
    // 範囲制限
    jason.x = clamp(jason.x, 20, 780);
    jason.y = clamp(jason.y, 20, 580);
}

// ===== キャラクター移動 =====
function updateCharacters() {
    if(G.gameOver || G.ended) return;
    
    const player = G.player;
    
    // プレイヤー移動 (マウス追従)
    const dx = G.mouseX - player.x;
    const dy = G.mouseY - player.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d > 5) {
        const speed = player.speed * 0.15;
        player.x += (dx/d) * Math.min(speed, d);
        player.y += (dy/d) * Math.min(speed, d);
    }
    player.x = clamp(player.x, 20, 780);
    player.y = clamp(player.y, 20, 580);
    
    // ステージ移動（端に行ったら隣接ステージへ）
    const stageRow = Math.floor(G.currentStage / 3);
    const stageCol = G.currentStage % 3;
    if(player.x > 780 && stageCol < 2) moveToStage(G.currentStage + 1);
    else if(player.x < 20 && stageCol > 0) moveToStage(G.currentStage - 1);
    else if(player.y > 580 && stageRow < 2) moveToStage(G.currentStage + 3);
    else if(player.y < 20 && stageRow > 0) moveToStage(G.currentStage - 3);
    
    // 家の中判定
    // (実際の家ステージ切り替えはなし - 家の中は中央ステージの一部)
    
    // 他のキャラクター（裏で動く）
    for(let name in G.characters) {
        const char = G.characters[name];
        if(!char.alive) continue;
        
        char.actionTimer = (char.actionTimer || 0) + 1;
        if(char.actionTimer > 40 + rand(0, 20)) {
            char.actionTimer = 0;
            // ランダムに歩く
            if(Math.random() < 0.6) {
                char.targetX = rand(50, 750);
                char.targetY = rand(50, 550);
            }
        }
        
        const dx2 = char.targetX - char.x;
        const dy2 = char.targetY - char.y;
        const d2 = Math.sqrt(dx2*dx2 + dy2*dy2);
        if(d2 > 10) {
            char.x += (dx2/d2) * Math.min(char.speed * 0.08, d2);
            char.y += (dy2/d2) * Math.min(char.speed * 0.08, d2);
        }
        char.x = clamp(char.x, 20, 780);
        char.y = clamp(char.y, 20, 580);
    }
}

// ===== 熊の更新 =====
function updateBear() {
    if(G.gameOver || G.ended) return;
    if(!G.bear || !G.bear.alive) return;
    
    const bear = G.bear;
    const player = G.player;
    
    // 同じステージかつ空腹なら追跡
    if(bear.stage === player.stage && bear.isHungry && player.alive) {
        const dx = player.x - bear.x;
        const dy = player.y - bear.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if(d > 15) {
            bear.x += (dx/d) * Math.min(bear.speed * 0.12, d);
            bear.y += (dy/d) * Math.min(bear.speed * 0.12, d);
        }
        if(d < 30) {
            gameOver(false, '熊に襲われた...');
        }
    } else {
        // ランダム移動
        bear.moveTimer = (bear.moveTimer || 0) + 1;
        if(bear.moveTimer > 50) {
            bear.moveTimer = 0;
            bear.targetX = rand(50, 750);
            bear.targetY = rand(50, 550);
        }
        if(bear.targetX !== undefined) {
            const dx = bear.targetX - bear.x;
            const dy = bear.targetY - bear.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if(d > 10) {
                bear.x += (dx/d) * Math.min(bear.speed * 0.05, d);
                bear.y += (dy/d) * Math.min(bear.speed * 0.05, d);
            }
        }
    }
    bear.x = clamp(bear.x, 20, 780);
    bear.y = clamp(bear.y, 20, 580);
}

// ===== 狼の更新 =====
function updateWolves() {
    if(G.gameOver || G.ended) return;
    
    for(let stage in G.wolves) {
        for(let wolf of G.wolves[stage]) {
            if(!wolf.alive) continue;
            wolf.moveTimer = (wolf.moveTimer || 0) + 1;
            if(wolf.moveTimer > 40 + rand(0, 30)) {
                wolf.moveTimer = 0;
                wolf.targetX = rand(50, 750);
                wolf.targetY = rand(50, 550);
            }
            const dx = wolf.targetX - wolf.x;
            const dy = wolf.targetY - wolf.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if(d > 10) {
                wolf.x += (dx/d) * Math.min(wolf.speed * 0.08, d);
                wolf.y += (dy/d) * Math.min(wolf.speed * 0.08, d);
            }
            wolf.x = clamp(wolf.x, 20, 780);
            wolf.y = clamp(wolf.y, 20, 580);
        }
    }
}

// ===== アイテム収集 =====
function collectItems() {
    if(G.gameOver || G.ended) return;
    
    const player = G.player;
    const items = G.items[G.currentStage] || [];
    
    for(let item of items) {
        if(item.collected) continue;
        if(dist(player, item) < 30) {
            if(item.isWood) {
                G.woodStock++;
                item.collected = true;
                document.getElementById('statusMsg').textContent = `🌲 木材を拾った! (${G.woodStock}個)`;
                document.getElementById('statusMsg').className = 'success';
            } else if(G.inventory === null) {
                G.inventory = item.type;
                item.collected = true;
                document.getElementById('statusMsg').textContent = `🎒 ${item.type}を拾った!`;
                document.getElementById('statusMsg').className = 'success';
                updateUI();
            } else {
                document.getElementById('statusMsg').textContent = '⚠ インベントリが一杯! (右クリックで捨てる)';
                document.getElementById('statusMsg').className = '';
            }
            break;
        }
    }
}

// ===== アイテム使用 =====
function useItem() {
    if(G.gameOver || G.ended) return;
    if(G.inventory === null) {
        document.getElementById('statusMsg').textContent = '⚠ アイテムがない!';
        document.getElementById('statusMsg').className = '';
        return;
    }
    
    const item = G.inventory;
    const player = G.player;
    const isCentral = G.currentStage === 4;
    
    // 家の中かどうか (中央ステージの家エリア)
    const col = Math.floor(player.x / CELL);
    const row = Math.floor(player.y / CELL);
    const inHouse = isCentral && G.maps[4][row] && G.maps[4][row][col] === 1;
    
    let used = false;
    let msg = '';
    
    switch(item) {
        case '木材':
            if(G.woodStock >= 3 && !G.windowReinforced && inHouse) {
                G.woodStock -= 3;
                G.windowReinforced = true;
                G.defense += 10;
                msg = '窓を補強! +10ポイント';
                used = true;
            } else if(G.woodStock >= 3 && inHouse) {
                G.woodStock -= 3;
                G.defense += 50;
                msg = '補強材をタンスに! +50ポイント';
                used = true;
            } else if(G.woodStock < 3) {
                msg = '木材が足りない (3個必要)';
            } else {
                msg = '家の中で使って!';
            }
            break;
            
        case 'スコップ':
            if(!G.trapSet && isCentral) {
                G.trapSet = true;
                G.defense += 10;
                msg = '落とし穴を掘った! +10ポイント';
                used = true;
            } else {
                msg = '中央ステージで使って!';
            }
            break;
            
        case '狼の餌':
            const wolves = G.wolves[G.currentStage] || [];
            let fed = false;
            for(let wolf of wolves) {
                if(!wolf.isFed && dist(player, wolf) < 50) {
                    wolf.isFed = true;
                    G.wolfFed = true;
                    G.defense += 10;
                    fed = true;
                    msg = '狼に餌をあげた! +10ポイント';
                    used = true;
                    break;
                }
            }
            if(!fed) msg = '狼の近くで使って!';
            break;
            
        case '銃':
            if(!G.gunStored && inHouse) {
                G.gunStored = true;
                G.defense += 10;
                msg = '銃をタンスに! +10ポイント';
                used = true;
            } else {
                msg = '家の中で使って!';
            }
            break;
            
        case '斧':
            if(!G.axeStored && inHouse) {
                G.axeStored = true;
                G.defense += 10;
                msg = '斧をタンスに! +10ポイント';
                used = true;
            } else {
                msg = '家の中で使って!';
            }
            break;
    }
    
    if(used) {
        G.inventory = null;
        document.getElementById('statusMsg').textContent = '✅ ' + msg;
        document.getElementById('statusMsg').className = 'success';
        updateUI();
    } else {
        document.getElementById('statusMsg').textContent = '❌ ' + msg;
        document.getElementById('statusMsg').className = '';
    }
}

// ===== ステージ移動 =====
function moveToStage(stage) {
    if(stage < 0 || stage > 8) return;
    if(stage === G.currentStage) return;
    
    // 隣接チェック
    const currentRow = Math.floor(G.currentStage / 3);
    const currentCol = G.currentStage % 3;
    const targetRow = Math.floor(stage / 3);
    const targetCol = stage % 3;
    if(Math.abs(currentRow - targetRow) + Math.abs(currentCol - targetCol) !== 1) return;
    
    G.currentStage = stage;
    document.getElementById('stageDisplay').textContent = STAGE_NAMES[stage];
    updateMinimap();
}

// ===== ゲームオーバー =====
function gameOver(win, reason) {
    if(G.ended) return;
    G.ended = true;
    G.gameOver = !win;
    G.won = win;
    
    const overlay = document.getElementById('gameOverlay');
    overlay.classList.add('show');
    
    if(win) {
        document.getElementById('resultTitle').textContent = '🏆 勝利!';
        document.getElementById('resultSub').textContent = `ジェイソンを撃退した! (防御: ${G.defense}ポイント)`;
    } else {
        document.getElementById('resultTitle').textContent = '💀 ゲームオーバー';
        document.getElementById('resultSub').textContent = reason || 'ジェイソンにやられた...';
    }
}

// ===== ゲーム終了 =====
function endGame() {
    if(G.ended) return;
    const jasonPoints = rand(50, 90);
    if(G.defense > jasonPoints) {
        gameOver(true, `防御${G.defense} vs ジェイソン${jasonPoints} で勝利!`);
    } else {
        gameOver(false, `防御${G.defense} vs ジェイソン${jasonPoints} で敗北...`);
    }
}

// ===== UI更新 =====
function updateUI() {
    document.getElementById('defenseDisplay').textContent = G.defense;
    document.getElementById('dayDisplay').textContent = G.day;
    const inv = G.inventory ? G.inventory : 'なし';
    document.getElementById('inventoryDisplay').textContent = `🎒 ${inv}`;
}

// ===== ミニマップ更新 =====
function updateMinimap() {
    const container = document.getElementById('minimap');
    container.innerHTML = '';
    for(let i=0; i<9; i++) {
        const cell = document.createElement('div');
        cell.className = 'minimap-cell';
        if(i === G.currentStage) cell.classList.add('current');
        if(i === G.jason.stage) cell.classList.add('has-jason');
        if(G.bear && i === G.bear.stage && G.bear.isHungry) cell.classList.add('has-bear');
        
        // プレイヤードット
        if(i === G.currentStage) {
            const dot = document.createElement('span');
            dot.className = 'dot player';
            cell.appendChild(dot);
        }
        // ジェイソンドット
        if(i === G.jason.stage) {
            const dot = document.createElement('span');
            dot.className = 'dot jason';
            cell.appendChild(dot);
        }
        // ステージ番号
        const label = document.createElement('span');
        label.style.fontSize = '7px';
        label.style.color = '#555';
        label.textContent = i;
        cell.appendChild(label);
        
        container.appendChild(cell);
    }
}

// ===== 描画 =====
function draw() {
    const ctx = document.getElementById('gameCanvas').getContext('2d');
    ctx.clearRect(0, 0, 800, 600);
    
    const stage = G.currentStage;
    const map = G.maps[stage];
    
    // マップ描画
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            const x = c * CELL;
            const y = r * CELL;
            if(map[r][c] === 0) {
                ctx.fillStyle = '#1a3a1a';
                ctx.fillRect(x, y, CELL, CELL);
                // 木
                if((r+c) % 3 === 0) {
                    ctx.fillStyle = '#0a2a0a';
                    ctx.fillRect(x+10, y+10, 20, 20);
                    ctx.fillStyle = '#2a5a2a';
                    ctx.fillRect(x+14, y+5, 12, 12);
                    ctx.fillStyle = '#3a2a1a';
                    ctx.fillRect(x+18, y+22, 4, 8);
                } else if((r+c) % 5 === 0) {
                    ctx.fillStyle = '#0a2a0a';
                    ctx.fillRect(x+5, y+5, 30, 30);
                    ctx.fillStyle = '#2a5a2a';
                    ctx.fillRect(x+12, y+2, 16, 16);
                }
            } else if(map[r][c] === 1) {
                // 家
                ctx.fillStyle = '#7a5a3a';
                ctx.fillRect(x, y, CELL, CELL);
                ctx.fillStyle = '#5a3a2a';
                ctx.fillRect(x+2, y+2, CELL-4, CELL-4);
                // 窓
                if(r===6 && c===8) {
                    ctx.fillStyle = '#4a7a4a';
                    ctx.fillRect(x+10, y+8, 20, 20);
                    ctx.fillStyle = '#6a9a6a';
                    ctx.fillRect(x+14, y+12, 12, 12);
                    ctx.fillStyle = '#3a2a1a';
                    ctx.fillRect(x+18, y+6, 4, 24);
                    ctx.fillRect(x+8, y+16, 24, 4);
                }
                // ドア
                if(r===9 && c===8) {
                    ctx.fillStyle = '#3a2a1a';
                    ctx.fillRect(x+14, y+26, 12, 14);
                    ctx.fillStyle = '#5a3a2a';
                    ctx.fillRect(x+16, y+28, 8, 10);
                }
                // 屋根
                if(r===5) {
                    ctx.fillStyle = '#5a3a1a';
                    ctx.fillRect(x-5, y-5, CELL+10, 8);
                    ctx.fillRect(x-10, y-2, CELL+20, 5);
                }
            } else if(map[r][c] === 2) {
                // 倉庫
                ctx.fillStyle = '#5a4a3a';
                ctx.fillRect(x, y, CELL, CELL);
                ctx.fillStyle = '#3a2a1a';
                ctx.fillRect(x+2, y+2, CELL-4, CELL-4);
                ctx.fillStyle = '#7a6a5a';
                ctx.font = '18px "Courier New"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('倉', x+20, y+20);
            }
        }
    }
    
    // アイテム描画 (現在のステージ)
    const items = G.items[stage] || [];
    for(let item of items) {
        if(item.collected) continue;
        const colors = {
            '木材': '#8b6b4d',
            'スコップ': '#7a7a7a',
            '狼の餌': '#c0392b',
            '銃': '#2c3e50',
            '斧': '#7f8c8d'
        };
        ctx.fillStyle = colors[item.type] || '#ffd700';
        ctx.fillRect(item.x-8, item.y-8, 16, 16);
        ctx.fillStyle = '#fff';
        ctx.font = '9px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.type.substring(0,2), item.x, item.y);
        // 光るエフェクト
        ctx.fillStyle = 'rgba(255,255,200,0.1)';
        ctx.beginPath();
        ctx.arc(item.x, item.y, 12, 0, Math.PI*2);
        ctx.fill();
    }
    
    // 狼描画 (現在のステージ)
    const wolves = G.wolves[stage] || [];
    for(let wolf of wolves) {
        if(!wolf.alive) continue;
        drawPixelWolf(ctx, wolf.x, wolf.y, wolf.isFed);
    }
    
    // 熊描画 (同じステージ)
    if(G.bear && G.bear.alive && G.bear.stage === stage) {
        drawPixelBear(ctx, G.bear.x, G.bear.y, G.bear.isHungry);
    }
    
    // ジェイソン描画 (同じステージ)
    if(G.jason.stage === stage) {
        drawPixelJason(ctx, G.jason.x, G.jason.y);
        // 警告表示
        ctx.fillStyle = 'rgba(255,0,0,0.15)';
        ctx.beginPath();
        ctx.arc(G.jason.x, G.jason.y, 60, 0, Math.PI*2);
        ctx.fill();
    }
    
    // キャラクター描画 (同じステージ)
    // 最初に他のキャラクター
    for(let name in G.characters) {
        const char = G.characters[name];
        if(!char.alive || char.stage !== stage) continue;
        drawPixelPerson(ctx, char.x, char.y, char.color, char.hairColor, false, char.hasWood);
        ctx.fillStyle = '#aaa';
        ctx.font = '9px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText(name, char.x, char.y+26);
    }
    
    // プレイヤー (一番上に描画)
    if(G.player.alive && G.player.stage === stage) {
        drawPixelPerson(ctx, G.player.x, G.player.y, '#e74c3c', '#e74c3c', true, G.player.hasWood);
        ctx.fillStyle = '#fff';
        ctx.font = '9px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('紅葉', G.player.x, G.player.y+26);
    }
    
    // 情報オーバーレイ
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, 280, 22);
    ctx.fillStyle = '#fff';
    ctx.font = '11px "Courier New"';
    ctx.textAlign = 'left';
    ctx.fillText(`⚡ジェイソン速度: ${G.jasonSpeed}  |  📌${STAGE_NAMES[stage]}`, 8, 16);
    
    // 家の中表示
    if(stage === 4) {
        const col = Math.floor(G.player.x / CELL);
        const row = Math.floor(G.player.y / CELL);
        if(map[row] && map[row][col] === 1) {
            ctx.fillStyle = 'rgba(255,215,0,0.08)';
            ctx.fillRect(0, 0, 800, 600);
            ctx.fillStyle = '#ffd93d';
            ctx.font = '14px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('🏠 家の中', 400, 30);
        }
    }
    
    // 補強アイテム表示
    let defenseItems = [];
    if(G.windowReinforced) defenseItems.push('窓');
    if(G.trapSet) defenseItems.push('穴');
    if(G.wolfFed) defenseItems.push('狼');
    if(G.gunStored) defenseItems.push('銃');
    if(G.axeStored) defenseItems.push('斧');
    if(defenseItems.length > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 575, 300, 25);
        ctx.fillStyle = '#69db7c';
        ctx.font = '11px "Courier New"';
        ctx.textAlign = 'left';
        ctx.fillText(`✅ ${defenseItems.join(' ')}`, 8, 593);
    }
    
    // 木材表示
    if(G.woodStock > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(550, 575, 150, 25);
        ctx.fillStyle = '#8b6b4d';
        ctx.font = '11px "Courier New"';
        ctx.textAlign = 'left';
        ctx.fillText(`🌲 木材: ${G.woodStock}`, 558, 593);
    }
}

// ===== メインループ =====
function gameLoop() {
    if(!G.ended) {
        G.frame++;
        updatePhase();
        updateJason();
        updateCharacters();
        updateBear();
        updateWolves();
        collectItems();
        updateUI();
        updateMinimap();
    }
    draw();
    requestAnimationFrame(gameLoop);
}

// ===== イベント =====
const canvas = document.getElementById('gameCanvas');

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    G.mouseX = clamp((e.clientX - rect.left) * scaleX, 20, 780);
    G.mouseY = clamp((e.clientY - rect.top) * scaleY, 20, 580);
});

canvas.addEventListener('click', () => {
    useItem();
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if(G.ended || G.gameOver) return;
    if(G.inventory !== null) {
        const items = G.items[G.currentStage] || [];
        items.push({
            x: G.player.x + rand(-30, 30),
            y: G.player.y + rand(-30, 30),
            type: G.inventory,
            collected: false,
            isWood: G.inventory === '木材'
        });
        G.items[G.currentStage] = items;
        G.inventory = null;
        document.getElementById('statusMsg').textContent = '📤 アイテムを捨てた';
        document.getElementById('statusMsg').className = 'info';
        updateUI();
    }
});

// キーボードデバッグ
document.addEventListener('keydown', (e) => {
    const num = parseInt(e.key);
    if(num >= 1 && num <= 9) {
        moveToStage(num - 1);
    }
    if(e.key === 'r' || e.key === 'R') {
        initGame();
    }
});

document.getElementById('restartBtn').addEventListener('click', initGame);

// ===== 起動 =====
initGame();
gameLoop();
</script>
