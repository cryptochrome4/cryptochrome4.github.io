<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>森のサバイバル - 7日間</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'MS Gothic',monospace; }
#gameWrapper { background:#2d2d44; padding:10px; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.8); }
#mainCanvas { display:block; margin:0 auto; background:#3d5a3d; cursor:default; border:2px solid #5a4a3a; }
#ui { background:#1a1a2e; color:#c0c0c0; padding:6px 12px; display:flex; justify-content:space-between; font-size:14px; border-top:1px solid #444; }
#ui span { background:#2a2a44; padding:2px 10px; border-radius:4px; }
#infoPanel { background:#222; color:#ddd; padding:8px 12px; font-size:13px; border-bottom:1px solid #444; display:flex; justify-content:space-between; }
#message { color:#ffcc88; }
</style>
</head>
<body>
<div id="gameWrapper">
<div id="infoPanel">
<span>主人公: 紅葉</span>
<span id="dayDisplay">1日目</span>
<span id="timeDisplay">朝</span>
<span id="bearAlert"></span>
</div>
<canvas id="mainCanvas" width="560" height="560"></canvas>
<div id="ui">
<span id="statusMsg">▶ 小屋からスタート</span>
<span id="enemyStatus">青鬼: 森の中</span>
</div>
</div>
<script>
(function() {
// ---- 2013年対応: 厳密モード、IE対策 ----
"use strict";

// ---------- 定数 ----------
const SIZE = 560;
const CELL = 40;        // 1マス40px
const COLS = 14;        // 14x14グリッド
const ROWS = 14;

// マップチップ
const T_FLOOR = 0;
const T_WALL = 1;
const T_TREE = 2;
const T_HOUSE = 3;      // 小屋の床（内部）
const T_HOUSE_WALL = 4; // 小屋の壁（外からは入れないが、内部は通れる）
const T_BED = 5;
const T_CHEST = 6;

// 方角
const DIR = [
    {dx:0, dy:-1}, // 上
    {dx:1, dy:0},  // 右
    {dx:0, dy:1},  // 下
    {dx:-1, dy:0}  // 左
];

// ---------- 状態 ----------
let map = [];           // 二次元配列 [y][x]
let player = { x:0, y:0 };
let enemy = { x:0, y:0 };
let bear = { x:0, y:0, active:false, day:0 };

let day = 1;
let timeState = 0;      // 0=朝, 1=昼, 2=夜
let timeCounter = 0;    // 秒カウント（30秒で1日）
let gameOver = false;
let gameWin = false;
let enemyActive = true;

// 熊の襲撃日（2日間をランダム設定）
let bearDays = [];

// Canvas
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

// UI要素
const dayDisplay = document.getElementById('dayDisplay');
const timeDisplay = document.getElementById('timeDisplay');
const statusMsg = document.getElementById('statusMsg');
const enemyStatus = document.getElementById('enemyStatus');
const bearAlert = document.getElementById('bearAlert');

// ---------- マップ生成 ----------
function generateMap() {
    // 14x14 全て森（床）
    map = [];
    for (let y=0; y<ROWS; y++) {
        map[y] = [];
        for (let x=0; x<COLS; x++) {
            map[y][x] = T_FLOOR;
        }
    }

    // 外周を壁（森の外）
    for (let i=0; i<COLS; i++) {
        map[0][i] = T_WALL;
        map[ROWS-1][i] = T_WALL;
    }
    for (let i=0; i<ROWS; i++) {
        map[i][0] = T_WALL;
        map[i][COLS-1] = T_WALL;
    }

    // ---- 小屋を中央付近に設置 (4x4) ----
    const hx = 5, hy = 5;
    for (let dy=0; dy<4; dy++) {
        for (let dx=0; dx<4; dx++) {
            const gx = hx + dx;
            const gy = hy + dy;
            if (gx < COLS && gy < ROWS) {
                if (dx===0 || dx===3 || dy===0 || dy===3) {
                    map[gy][gx] = T_HOUSE_WALL; // 壁
                } else {
                    map[gy][gx] = T_HOUSE; // 床
                }
            }
        }
    }
    // 小屋の中にベッドとタンス
    map[hy+1][hx+1] = T_BED;
    map[hy+2][hx+2] = T_CHEST;
    // 入り口（南側の壁を開ける）
    map[hy+3][hx+1] = T_HOUSE;
    map[hy+3][hx+2] = T_HOUSE;

    // ---- 木をランダムに配置（森一面に3本まで） ----
    let treeCount = 0;
    let attempts = 0;
    while (treeCount < 3 && attempts < 200) {
        attempts++;
        const tx = 1 + Math.floor(Math.random() * (COLS-2));
        const ty = 1 + Math.floor(Math.random() * (ROWS-2));
        // 小屋の位置を避ける
        if (tx >= hx && tx < hx+4 && ty >= hy && ty < hy+4) continue;
        if (map[ty][tx] === T_FLOOR) {
            map[ty][tx] = T_TREE;
            treeCount++;
        }
    }

    // ---- プレイヤー初期位置: 小屋の中 ----
    player.x = hx+1;
    player.y = hy+1;

    // ---- 敵(青鬼)初期位置: 森のどこか（小屋外） ----
    let ex, ey;
    let found = false;
    for (let tries=0; tries<500; tries++) {
        ex = 1 + Math.floor(Math.random() * (COLS-2));
        ey = 1 + Math.floor(Math.random() * (ROWS-2));
        if (map[ey][ex] === T_FLOOR && !(ex>=hx && ex<hx+4 && ey>=hy && ey<hy+4)) {
            found = true;
            break;
        }
    }
    if (!found) { ex=2; ey=2; }
    enemy.x = ex;
    enemy.y = ey;

    // ---- 熊の初期位置 ----
    let bx, by;
    found = false;
    for (let tries=0; tries<500; tries++) {
        bx = 1 + Math.floor(Math.random() * (COLS-2));
        by = 1 + Math.floor(Math.random() * (ROWS-2));
        if (map[by][bx] === T_FLOOR && !(bx>=hx && bx<hx+4 && by>=hy && by<hy+4)) {
            if (!(bx===enemy.x && by===enemy.y)) {
                found = true;
                break;
            }
        }
    }
    if (!found) { bx=3; by=3; }
    bear.x = bx;
    bear.y = by;
    bear.active = false;
}

// ---------- 熊の襲撃日をランダム設定（2日間） ----------
function setBearDays() {
    bearDays = [];
    const candidates = [1,2,3,4,5,6,7];
    // シャッフルして先頭2つ
    for (let i=candidates.length-1; i>0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    bearDays = candidates.slice(0, 2);
    bearDays.sort((a,b)=>a-b);
    // デバッグ用（表示はしない）
    console.log('熊襲撃日:', bearDays);
}

// ---------- 時間更新 ----------
function advanceTime() {
    if (gameOver || gameWin) return;

    timeCounter++;
    // 1日 = 30秒（timeCounterは秒数）
    if (timeCounter >= 30) {
        timeCounter = 0;
        day++;
        if (day > 7) {
            // 7日間生存！
            gameWin = true;
            enemyActive = false;
            statusMsg.textContent = '🏆 7日間逃げ切った！ クリア！';
            enemyStatus.textContent = '青鬼: 消滅';
            return;
        }
        // 熊のアクティブ状態更新
        bear.active = (bearDays.indexOf(day) !== -1);
        if (bear.active) {
            bearAlert.textContent = '⚠ 熊が活動中！';
        } else {
            bearAlert.textContent = '';
        }
        // 日付表示
        dayDisplay.textContent = day + '日目';
    }

    // 時間帯: 0-9秒 朝, 10-19秒 昼, 20-29秒 夜
    const t = timeCounter % 30;
    let timeName = '';
    if (t < 10) { timeName = '朝'; }
    else if (t < 20) { timeName = '昼'; }
    else { timeName = '夜'; }
    timeDisplay.textContent = timeName;

    // 熊がアクティブで、かつプレイヤーと同じマスならゲームオーバー
    if (bear.active) {
        if (player.x === bear.x && player.y === bear.y) {
            gameOver = true;
            statusMsg.textContent = '💀 熊に襲われた... ゲームオーバー';
            return;
        }
    }

    // 青鬼の移動（1秒ごとに移動）
    if (enemyActive && !gameOver && !gameWin) {
        moveEnemy();
    }

    // 夜の暗さは描画で表現
}

// ---------- 青鬼の移動（単純追跡） ----------
function moveEnemy() {
    if (!enemyActive) return;
    // プレイヤーとの差分
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    let moves = [];
    if (dx !== 0) moves.push({dx: (dx>0?1:-1), dy:0});
    if (dy !== 0) moves.push({dx:0, dy: (dy>0?1:-1)});
    // シャッフルしてランダム性
    for (let i=moves.length-1; i>0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [moves[i], moves[j]] = [moves[j], moves[i]];
    }
    for (let m of moves) {
        const nx = enemy.x + m.dx;
        const ny = enemy.y + m.dy;
        if (nx<0 || nx>=COLS || ny<0 || ny>=ROWS) continue;
        const cell = map[ny][nx];
        // 小屋の壁は通れないが、小屋内部（T_HOUSE, T_BED, T_CHEST）は通れる
        if (cell === T_WALL || cell === T_HOUSE_WALL) continue;
        if (cell === T_TREE) continue;
        // 熊の位置には移動しない（重ならないように）
        if (bear.active && nx===bear.x && ny===bear.y) continue;
        // 移動
        enemy.x = nx;
        enemy.y = ny;
        break;
    }

    // 青鬼とプレイヤーが同じマスならゲームオーバー
    if (enemy.x === player.x && enemy.y === player.y) {
        gameOver = true;
        statusMsg.textContent = '💀 青鬼に捕まった... ゲームオーバー';
        enemyStatus.textContent = '青鬼: 捕獲';
    }
}

// ---------- プレイヤー移動 ----------
function movePlayer(dx, dy) {
    if (gameOver || gameWin) return;
    const nx = player.x + dx;
    const ny = player.y + dy;
    if (nx<0 || nx>=COLS || ny<0 || ny>=ROWS) return;
    const cell = map[ny][nx];
    // 壁と木は通れない
    if (cell === T_WALL || cell === T_HOUSE_WALL) return;
    if (cell === T_TREE) return;
    // 熊がアクティブでそのマスに熊がいたらゲームオーバー（移動先チェック）
    if (bear.active && nx===bear.x && ny===bear.y) {
        // 熊がいるマスには移動できない（踏み込んだら死亡）
        gameOver = true;
        statusMsg.textContent = '💀 熊に襲われた... ゲームオーバー';
        return;
    }
    // 移動
    player.x = nx;
    player.y = ny;

    // 移動後、青鬼と重なったらゲームオーバー（敵が先に動くので通常は起きないが安全のため）
    if (enemyActive && player.x===enemy.x && player.y===enemy.y) {
        gameOver = true;
        statusMsg.textContent = '💀 青鬼に捕まった... ゲームオーバー';
    }
}

// ---------- 描画 ----------
function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // 時間帯による明るさ
    const t = timeCounter % 30;
    let brightness = 1.0;
    if (t >= 20) { // 夜 (20-29秒)
        brightness = 0.5;
    } else if (t >= 10) { // 昼
        brightness = 1.0;
    } else { // 朝
        brightness = 0.85;
    }

    // マップ描画
    for (let y=0; y<ROWS; y++) {
        for (let x=0; x<COLS; x++) {
            const cx = x * CELL;
            const cy = y * CELL;
            const cell = map[y][x];
            let color = '#3d5a3d'; // デフォルト: 森の床
            if (cell === T_WALL) color = '#2a3a2a';
            else if (cell === T_TREE) color = '#1e4a1e';
            else if (cell === T_HOUSE || cell === T_HOUSE_WALL) {
                color = '#8b7a5a';
            } else if (cell === T_BED) {
                color = '#6a5a4a';
            } else if (cell === T_CHEST) {
                color = '#5a3a2a';
            }
            ctx.fillStyle = color;
            ctx.fillRect(cx, cy, CELL, CELL);
            // グリッド線
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(cx, cy, CELL, CELL);
        }
    }

    // 小屋の壁に屋根っぽい色
    for (let y=0; y<ROWS; y++) {
        for (let x=0; x<COLS; x++) {
            if (map[y][x] === T_HOUSE_WALL) {
                ctx.fillStyle = '#6a5a3a';
                ctx.fillRect(x*CELL+2, y*CELL+2, CELL-4, CELL-4);
            }
        }
    }

    // ベッドとタンスのマーク（文字で表現）
    for (let y=0; y<ROWS; y++) {
        for (let x=0; x<COLS; x++) {
            if (map[y][x] === T_BED) {
                ctx.fillStyle = '#8a7a5a';
                ctx.font = '20px "MS Gothic"';
                ctx.fillText('🛏', x*CELL+6, y*CELL+30);
            } else if (map[y][x] === T_CHEST) {
                ctx.fillStyle = '#6a4a2a';
                ctx.font = '20px "MS Gothic"';
                ctx.fillText('📦', x*CELL+6, y*CELL+30);
            }
        }
    }

    // 熊（アクティブなときだけ）
    if (bear.active) {
        ctx.fillStyle = '#3a2a1a';
        ctx.font = '28px "MS Gothic"';
        ctx.fillText('🐻', bear.x*CELL+4, bear.y*CELL+34);
    }

    // 青鬼（敵）
    if (enemyActive && !gameWin) {
        ctx.fillStyle = '#2a5a8a';
        ctx.font = '28px "MS Gothic"';
        ctx.fillText('👻', enemy.x*CELL+4, enemy.y*CELL+34);
        // 青鬼ラベル
        ctx.fillStyle = '#88ccff';
        ctx.font = '10px "MS Gothic"';
        ctx.fillText('青鬼', enemy.x*CELL+2, enemy.y*CELL+10);
    }

    // プレイヤー（紅葉）
    ctx.fillStyle = '#cc4444';
    ctx.font = '28px "MS Gothic"';
    ctx.fillText('🧑', player.x*CELL+4, player.y*CELL+34);
    ctx.fillStyle = '#ffaa88';
    ctx.font = '10px "MS Gothic"';
    ctx.fillText('紅葉', player.x*CELL+2, player.y*CELL+10);

    // 暗さオーバーレイ（夜）
    if (brightness < 1.0) {
        ctx.fillStyle = 'rgba(0,0,30,' + (1-brightness)*0.5 + ')';
        ctx.fillRect(0, 0, SIZE, SIZE);
    }

    // ゲームオーバー/クリア表示
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 240, SIZE, 80);
        ctx.fillStyle = '#ff6666';
        ctx.font = 'bold 32px "MS Gothic"';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', SIZE/2, 300);
        ctx.textAlign = 'left';
    } else if (gameWin) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 200, SIZE, 120);
        ctx.fillStyle = '#ffdd44';
        ctx.font = 'bold 36px "MS Gothic"';
        ctx.textAlign = 'center';
        ctx.fillText('★ 脱出成功 ★', SIZE/2, 260);
        ctx.font = '20px "MS Gothic"';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('refined.html へ移動', SIZE/2, 310);
        ctx.textAlign = 'left';
        // refined.htmlへの誘導
        if (typeof refinedTrigger === 'undefined') {
            // クリックで移動させる
            canvas.style.cursor = 'pointer';
        }
    }

    // 情報更新
    if (!gameOver && !gameWin) {
        let status = '';
        if (bear.active) status += '🐻 熊注意！ ';
        status += '移動: クリック';
        statusMsg.textContent = status;
        enemyStatus.textContent = '青鬼: ' + (enemyActive ? '追跡中' : '消滅');
    }
}

// ---------- マウス操作 ----------
canvas.addEventListener('click', function(e) {
    if (gameOver || gameWin) {
        if (gameWin) {
            // refined.htmlへ誘導（実際には遷移しないが、表示を変更）
            statusMsg.textContent = '🎉 クリア！ refined.html へ移動してください';
        }
        return;
    }
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const gx = Math.floor(mx / CELL);
    const gy = Math.floor(my / CELL);
    if (gx<0 || gx>=COLS || gy<0 || gy>=ROWS) return;

    // クリックした方向に移動
    const dx = gx - player.x;
    const dy = gy - player.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) {
        movePlayer(dx, dy);
    } else if (Math.abs(dx) + Math.abs(dy) === 2 && dx!==0 && dy!==0) {
        // 斜め移動は不可
    }
});

// ---------- ゲームループ ----------
function gameLoop() {
    // 1秒ごとに時間更新
    advanceTime();
    draw();
    // refined.html誘導表示のためのリンク処理
    if (gameWin) {
        // クリックで遷移できるように表示
    }
}

// ---------- 初期化 ----------
function init() {
    generateMap();
    setBearDays();
    bear.active = (bearDays.indexOf(1) !== -1);
    if (bear.active) bearAlert.textContent = '⚠ 熊が活動中！';
    day = 1;
    timeCounter = 0;
    gameOver = false;
    gameWin = false;
    enemyActive = true;
    dayDisplay.textContent = '1日目';
    timeDisplay.textContent = '朝';
    statusMsg.textContent = '▶ 小屋からスタート';
    enemyStatus.textContent = '青鬼: 森の中';
    canvas.style.cursor = 'default';
    // タイマー開始
    setInterval(gameLoop, 1000);
    draw();
}

init();

// ウィンドウリサイズ対応
window.addEventListener('resize', function() {
    // 何もしない
});

})();
</script>
</body>
</html>
