<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7日間サバイバル</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body {
  background: #0d0d1a;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', 'MS Gothic', sans-serif;
}
#app {
  background: #1a1a2e;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 0 60px rgba(0,0,0,0.9);
  display: flex;
  gap: 20px;
}
#map-wrap {
  background: #162013;
  border-radius: 8px;
  padding: 4px;
  border: 2px solid #2a3a2a;
  position: relative;
}
#map-wrap canvas {
  display: block;
  border-radius: 4px;
  image-rendering: pixelated;
  cursor: pointer;
}
#panel {
  width: 240px;
  color: #c8d8ff;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#panel .title {
  color: #ffcc66;
  font-size: 16px;
  font-weight: bold;
  text-align: center;
  padding-bottom: 6px;
  border-bottom: 1px solid #334;
}
.stat {
  display: flex;
  justify-content: space-between;
  padding: 3px 4px;
  background: #111128;
  border-radius: 4px;
}
.stat .label { color: #8899cc; }
.stat .value { color: #ffdd99; font-weight: bold; }
#log {
  background: #0a0a18;
  border: 1px solid #223;
  border-radius: 4px;
  padding: 4px 6px;
  height: 100px;
  overflow-y: auto;
  font-size: 11px;
  color: #88cc88;
  flex-shrink: 0;
}
#log div { padding: 1px 0; border-bottom: 1px solid #1a1a2a; }
#controls {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
#controls button {
  background: #2a2a4a;
  border: 1px solid #446;
  color: #ccddff;
  padding: 4px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
#controls button:hover { background: #3a3a5a; }
#bottom {
  display: flex;
  justify-content: space-between;
  color: #88aacc;
  font-size: 12px;
}
#day-display { color: #ffaa66; font-weight: bold; }
.night-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,30,0.55);
  pointer-events: none;
  border-radius: 4px;
  display: none;
}
#popup {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.92);
  border: 3px solid #ffcc44;
  border-radius: 12px;
  padding: 30px 40px;
  color: #fff;
  text-align: center;
  display: none;
  z-index: 100;
  min-width: 280px;
}
#popup h2 { color: #ffcc44; font-size: 26px; margin-bottom: 10px; }
#popup p { font-size: 15px; color: #ddd; margin-bottom: 16px; }
#popup button {
  background: #ffcc44;
  border: none;
  padding: 8px 32px;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: #1a1a2e;
}
#popup button:hover { background: #ffdd66; }
</style>
</head>
<body>

<div id="app">
  <div id="map-wrap">
    <canvas id="canvas" width="320" height="320"></canvas>
    <div class="night-overlay" id="nightOverlay"></div>
    <div id="popup">
      <h2 id="popupTitle"></h2>
      <p id="popupDesc"></p>
      <button id="popupBtn">OK</button>
    </div>
  </div>
  <div id="panel">
    <div class="title">📋 情報パネル</div>
    <div class="stat"><span class="label">📅 日数</span><span class="value" id="dispDay">1 / 7</span></div>
    <div class="stat"><span class="label">🔰 補強ポイント</span><span class="value" id="dispPoints">0</span></div>
    <div class="stat"><span class="label">📦 所持アイテム</span><span class="value" id="dispItem">なし</span></div>
    <div class="stat"><span class="label">👥 生存モブ</span><span class="value" id="dispMob">8 / 8</span></div>
    <div id="log"></div>
    <div id="controls">
      <button id="btnDrop">📤 アイテムを落とす</button>
    </div>
    <div id="bottom">
      <span id="dayDisplay">🌅 1日目 (30秒)</span>
      <span>⬆⬇⬅➡ 移動</span>
    </div>
  </div>
</div>

<script>
// ============================================================
// 7日間サバイバル - 完全再構築版 (ES6+)
// ============================================================

// ---- 定数 ----
const BLOCK_SIZE = 32;
const GRID_SIZE = 10;
const CANVAS_SIZE = 320;
const DAY_DURATION = 30;
const MAX_DAYS = 7;

// ---- 画像マッピング ----
const IMG_FILES = {
  '加藤': 'img154streamer.jpg',
  '松本': 'img155streamer.jpg',
  '坪池': 'img156streamer.jpg',
  '市川': 'img157youtuber.jpg',
  '青笹': 'img158nontitle.jpg',
  '角田': 'img159streamer.jpg',
  '木元': 'img160artist.jpg',
  '山崎': 'img161streamer.jpg',
  '紅葉': 'img162feat.jpg',
  'ジェイソン': 'img163enemy.jpg',
  '熊': 'img164bear.jpg',
  '狼': 'img165wolf.jpg',
  '斧': 'img166axe.jpg',
  '銃': 'img167gun.jpg'
};

const MOB_NAMES = ['加藤','松本','坪池','市川','青笹','角田','木元','山崎'];
const HERO_NAME = '紅葉';

// ---- 画像キャッシュ ----
const imageCache = {};

function loadImages() {
  return new Promise((resolve) => {
    const names = Object.keys(IMG_FILES);
    let loaded = 0;
    for (const name of names) {
      const img = new Image();
      img.onload = () => { loaded++; if (loaded === names.length) resolve(); };
      img.onerror = () => { loaded++; if (loaded === names.length) resolve(); };
      img.src = IMG_FILES[name];
      imageCache[name] = img;
    }
    if (names.length === 0) resolve();
  });
}

function getImage(name) {
  const img = imageCache[name];
  if (img && img.complete && img.naturalWidth > 0) return img;
  return null;
}

// ---- ユーティリティ ----
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const randf = (min, max) => Math.random() * (max - min) + min;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const dist = (a, b) => Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);

// ---- ブロック変換 ----
const BLOCK_NAMES = ['森8','森7','森6','森5','小屋','森4','森3','森2','森1'];

function blockToGrid(blockId) {
  return { row: Math.floor(blockId / 3), col: blockId % 3 };
}

function gridToBlock(row, col) {
  if (row < 0 || row > 2 || col < 0 || col > 2) return -1;
  return row * 3 + col;
}

// ============================================================
// メインゲームクラス
// ============================================================
class Game {
  constructor() {
    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.nightOverlay = document.getElementById('nightOverlay');
    this.popup = document.getElementById('popup');
    this.popupTitle = document.getElementById('popupTitle');
    this.popupDesc = document.getElementById('popupDesc');
    this.popupBtn = document.getElementById('popupBtn');
    
    this.dispDay = document.getElementById('dispDay');
    this.dispPoints = document.getElementById('dispPoints');
    this.dispItem = document.getElementById('dispItem');
    this.dispMob = document.getElementById('dispMob');
    this.logEl = document.getElementById('log');
    this.dayDisplay = document.getElementById('dayDisplay');
    this.btnDrop = document.getElementById('btnDrop');

    // 状態
    this.day = 1;
    this.dayElapsed = 0;
    this.points = 0;
    this.gameOver = false;
    this.night = false;
    this.heroItem = null;
    this.mobAlive = 8;
    this.currentBlock = 4;
    this.logs = [];
    this.jasonPoints = 0;
    this.bearAttackDays = [];
    this.frameCount = 0;
    this.jasonKillCooldown = 0;
    this.bearKillCooldown = 0;
    this.isRunning = true;
    this.animId = null;
    this.timerId = null;

    // マップデータ
    this.blockMap = [];
    this.items = [];
    this.objects = [];

    // キャラクター
    this.hero = null;
    this.mobs = [];
    this.jason = null;
    this.bear = null;
    this.wolf = null;

    // イベントバインド
    this.onKeyDown = this.onKeyDown.bind(this);
    this.onCanvasClick = this.onCanvasClick.bind(this);
    this.onDrop = this.onDrop.bind(this);

    this.init();
  }

  // ---- 初期化 ----
  init() {
    // イベント解除
    document.removeEventListener('keydown', this.onKeyDown);
    this.canvas.removeEventListener('click', this.onCanvasClick);
    this.btnDrop.removeEventListener('click', this.onDrop);

    // タイマー停止
    if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    if (this.animId) { cancelAnimationFrame(this.animId); this.animId = null; }

    // 状態リセット
    this.day = 1;
    this.dayElapsed = 0;
    this.points = 0;
    this.gameOver = false;
    this.night = false;
    this.heroItem = null;
    this.mobAlive = 8;
    this.currentBlock = 4;
    this.logs = [];
    this.frameCount = 0;
    this.jasonKillCooldown = 0;
    this.bearKillCooldown = 0;
    this.isRunning = true;

    this.popup.style.display = 'none';
    this.nightOverlay.style.display = 'none';

    this.logs = [];
    this.addLog('🌅 ゲーム開始！ 7日間逃げ切れ！');

    // 熊の襲撃日
    const days = [1,2,3,4,5,6,7];
    const shuffled = [...days];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = rand(0, i);
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    this.bearAttackDays = shuffled.slice(0, 2);
    this.addLog(`🐻 熊の襲撃日: ${this.bearAttackDays.join(', ')}日目`);

    this.jasonPoints = rand(15, 20);
    this.addLog(`🔪 ジェイソンポイント: ${this.jasonPoints}`);

    // マップ初期化
    this.initMap();

    // キャラクター初期化
    this.initCharacters();

    // アイテム初期化
    this.initItems();

    // 小屋のオブジェクト
    this.objects = [
      { type: '樽', x: 6, y: 4, blockId: 4, used: false },
      { type: '箱', x: 7, y: 4, blockId: 4, used: false },
      { type: '品', x: 3, y: 5, blockId: 4, used: false },
      { type: '窓', x: 5, y: 5, blockId: 4, used: false },
      { type: '穴', x: 7, y: 7, blockId: 4, used: false }
    ];

    // モブにタスク割り当て
    for (const mob of this.mobs) {
      this.assignMobTask(mob);
    }

    this.updateUI();
    this.startTimer();

    // イベント
    document.addEventListener('keydown', this.onKeyDown);
    this.canvas.addEventListener('click', this.onCanvasClick);
    this.btnDrop.addEventListener('click', this.onDrop);

    this.loop();
  }

  // ---- マップ初期化 ----
  initMap() {
    this.blockMap = [];
    for (let b = 0; b < 9; b++) {
      this.blockMap[b] = [];
      for (let y = 0; y < GRID_SIZE; y++) {
        this.blockMap[b][y] = [];
        for (let x = 0; x < GRID_SIZE; x++) {
          this.blockMap[b][y][x] = null;
        }
      }
    }

    // 森に木を配置 (縦2×横1 が3つ)
    for (let b = 0; b < 9; b++) {
      if (b === 4) continue;
      let placed = 0;
      let attempts = 0;
      while (placed < 3 && attempts < 200) {
        attempts++;
        const tx = rand(0, 8);
        const ty = rand(0, 8);
        if (this.blockMap[b][ty][tx] === null && ty + 1 < GRID_SIZE && this.blockMap[b][ty+1][tx] === null) {
          this.blockMap[b][ty][tx] = 'tree';
          this.blockMap[b][ty+1][tx] = 'tree';
          placed++;
        }
      }
    }
  }

  // ---- キャラクター初期化 ----
  initCharacters() {
    // 主人公
    this.hero = {
      name: HERO_NAME,
      x: rand(3, 6),
      y: rand(3, 6),
      blockId: 4,
      alive: true,
      img: '紅葉'
    };

    // モブ
    this.mobs = [];
    const mobPositions = [
      {x:1,y:1},{x:8,y:1},{x:1,y:8},{x:8,y:8},
      {x:2,y:0},{x:7,y:0},{x:0,y:2},{x:0,y:7}
    ];
    const shuffledMobs = [...MOB_NAMES];
    for (let i = shuffledMobs.length - 1; i > 0; i--) {
      const j = rand(0, i);
      [shuffledMobs[i], shuffledMobs[j]] = [shuffledMobs[j], shuffledMobs[i]];
    }
    for (let i = 0; i < 8; i++) {
      const pos = mobPositions[i % mobPositions.length];
      this.mobs.push({
        name: shuffledMobs[i],
        x: pos.x,
        y: pos.y,
        blockId: 4,
        alive: true,
        img: shuffledMobs[i],
        taskId: i,
        hasDelivered: false,
        targetX: null,
        targetY: null,
        targetBlock: null,
        state: 'idle',
        cooldown: 0
      });
    }

    // ジェイソン
    let jasonBlock = rand(0, 8);
    if (jasonBlock === 4) jasonBlock = 0;
    this.jason = {
      name: 'ジェイソン',
      x: rand(0, 9),
      y: rand(0, 9),
      blockId: jasonBlock,
      alive: true,
      img: 'ジェイソン',
      cooldown: 0
    };

    // 熊
    let bearBlock = rand(0, 8);
    if (bearBlock === 4) bearBlock = 1;
    this.bear = {
      name: '熊',
      x: rand(0, 9),
      y: rand(0, 9),
      blockId: bearBlock,
      alive: true,
      img: '熊',
      cooldown: 0
    };

    // 狼
    let wolfBlock = rand(0, 8);
    if (wolfBlock === 4) wolfBlock = 2;
    this.wolf = {
      name: '狼',
      x: rand(0, 9),
      y: rand(0, 9),
      blockId: wolfBlock,
      alive: true,
      img: '狼',
      cooldown: 0
    };
  }

  // ---- アイテム初期化 ----
  initItems() {
    this.items = [];
    const itemTypes = ['材','斧','銃','餌','堀'];
    
    // 品10〜品80
    for (let i = 0; i < 8; i++) {
      let blockId = i;
      if (blockId >= 4) blockId = i + 1;
      this.items.push({
        name: `品${(i + 1) * 10}`,
        x: rand(0, 9),
        y: rand(0, 9),
        blockId: blockId
      });
    }
    
    // 材・斧・銃・餌・堀
    const allBlocks = [0,1,2,3,4,5,6,7,8];
    for (const type of itemTypes) {
      const bid = allBlocks[rand(0, allBlocks.length - 1)];
      this.items.push({
        name: type,
        x: rand(0, 9),
        y: rand(0, 9),
        blockId: bid
      });
    }
  }

  // ---- モブタスク割り当て ----
  assignMobTask(mob) {
    if (!mob.alive || mob.hasDelivered) return;
    
    const taskId = mob.taskId;
    let blockId = taskId;
    if (blockId >= 4) blockId = taskId + 1;
    
    const targetItem = this.items.find(it => it.name === `品${taskId + 1}`);
    if (targetItem) {
      mob.targetX = targetItem.x;
      mob.targetY = targetItem.y;
      mob.targetBlock = targetItem.blockId;
      mob.state = 'moving_to_item';
    } else {
      mob.state = 'idle';
    }
  }

  // ---- 移動処理 ----
  moveCharacter(entity, dx, dy) {
    if (!entity || !entity.alive) return false;
    
    const nx = entity.x + dx;
    const ny = entity.y + dy;
    
    // 範囲内
    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
      if (this.blockMap[entity.blockId]?.[ny]?.[nx] === 'tree') return false;
      entity.x = nx;
      entity.y = ny;
      return true;
    }
    
    // ブロック移動
    const g = blockToGrid(entity.blockId);
    let newRow = g.row, newCol = g.col;
    let newX = nx, newY = ny;
    
    if (nx < 0) { newCol--; newX = GRID_SIZE - 1; }
    else if (nx >= GRID_SIZE) { newCol++; newX = 0; }
    else if (ny < 0) { newRow--; newY = GRID_SIZE - 1; }
    else if (ny >= GRID_SIZE) { newRow++; newY = 0; }
    
    const newBlock = gridToBlock(newRow, newCol);
    if (newBlock < 0 || newBlock > 8) return false;
    if (this.blockMap[newBlock]?.[newY]?.[newX] === 'tree') return false;
    
    entity.blockId = newBlock;
    entity.x = newX;
    entity.y = newY;
    
    if (entity === this.hero) {
      this.currentBlock = newBlock;
    }
    return true;
  }

  moveToBlock(entity, targetBlock) {
    if (!entity || !entity.alive) return false;
    if (targetBlock === entity.blockId) return false;
    
    const current = blockToGrid(entity.blockId);
    const target = blockToGrid(targetBlock);
    const dr = target.row - current.row;
    const dc = target.col - current.col;
    
    if (dc < 0 && entity.x === 0) {
      entity.blockId = targetBlock;
      entity.x = GRID_SIZE - 1;
      return true;
    }
    if (dc > 0 && entity.x === GRID_SIZE - 1) {
      entity.blockId = targetBlock;
      entity.x = 0;
      return true;
    }
    if (dr < 0 && entity.y === 0) {
      entity.blockId = targetBlock;
      entity.y = GRID_SIZE - 1;
      return true;
    }
    if (dr > 0 && entity.y === GRID_SIZE - 1) {
      entity.blockId = targetBlock;
      entity.y = 0;
      return true;
    }
    return false;
  }

  // ---- モブAI ----
  updateMobs() {
    for (const mob of this.mobs) {
      if (!mob.alive) continue;
      
      if (mob.hasDelivered) {
        // ランダム移動
        if (this.frameCount % 8 === 0) {
          const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
          const d = dirs[rand(0, 3)];
          this.moveCharacter(mob, d[0], d[1]);
        }
        continue;
      }

      if (mob.cooldown > 0) { mob.cooldown--; continue; }
      mob.cooldown = 3;

      if (mob.state === 'moving_to_item') {
        if (mob.blockId !== mob.targetBlock) {
          this.moveToBlock(mob, mob.targetBlock);
          continue;
        }
        
        const dx = mob.targetX - mob.x;
        const dy = mob.targetY - mob.y;
        
        if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) {
          // アイテム取得
          const idx = this.items.findIndex(it => 
            it.name === `品${mob.taskId + 1}` && 
            it.blockId === mob.blockId &&
            Math.abs(it.x - mob.x) <= 1 && Math.abs(it.y - mob.y) <= 1
          );
          if (idx >= 0) {
            this.items.splice(idx, 1);
            mob.state = 'moving_to_hut';
            mob.targetX = 3;
            mob.targetY = 5;
            mob.targetBlock = 4;
            this.addLog(`📦 ${mob.name} が 品${mob.taskId + 1} を入手`);
          } else {
            mob.state = 'idle';
            this.assignMobTask(mob);
          }
        } else {
          const mx = dx > 0 ? 1 : dx < 0 ? -1 : 0;
          const my = dy > 0 ? 1 : dy < 0 ? -1 : 0;
          if (mx !== 0 || my !== 0) this.moveCharacter(mob, mx, my);
        }
      } else if (mob.state === 'moving_to_hut') {
        if (mob.blockId !== 4) {
          this.moveToBlock(mob, 4);
          continue;
        }
        
        const hutItem = this.objects.find(o => o.blockId === 4 && o.x === 3 && o.y === 5 && o.type === '品');
        if (hutItem && !hutItem.used) {
          if (Math.abs(3 - mob.x) <= 1 && Math.abs(5 - mob.y) <= 1) {
            hutItem.used = true;
            mob.hasDelivered = true;
            this.points += 1;
            this.addLog(`✅ ${mob.name} 納品完了！ +1ポイント`);
            this.updateUI();
            mob.state = 'delivered';
          } else {
            const mx = 3 > mob.x ? 1 : 3 < mob.x ? -1 : 0;
            const my = 5 > mob.y ? 1 : 5 < mob.y ? -1 : 0;
            if (mx !== 0 || my !== 0) this.moveCharacter(mob, mx, my);
          }
        } else {
          mob.hasDelivered = true;
          mob.state = 'delivered';
        }
      } else {
        this.assignMobTask(mob);
      }
    }
  }

  // ---- 敵AI ----
  updateEnemies() {
    // ジェイソン
    if (this.jason && this.jason.alive) {
      const jSpeed = 10 + (this.day - 1) * 10;
      
      if (this.jason.cooldown > 0) {
        this.jason.cooldown--;
      } else {
        this.jason.cooldown = Math.max(1, Math.floor(12 / (jSpeed / 10)));
        
        const hero = this.hero;
        if (hero && hero.alive) {
          if (this.jason.blockId === hero.blockId) {
            const dx = hero.x - this.jason.x;
            const dy = hero.y - this.jason.y;
            const mx = dx > 0 ? 1 : dx < 0 ? -1 : 0;
            const my = dy > 0 ? 1 : dy < 0 ? -1 : 0;
            if (Math.abs(dx) > Math.abs(dy)) {
              this.moveCharacter(this.jason, mx, 0);
            } else {
              this.moveCharacter(this.jason, 0, my);
            }
            if (Math.abs(this.jason.x - hero.x) <= 0.5 && Math.abs(this.jason.y - hero.y) <= 0.5) {
              this.killHero('ジェイソン');
            }
          } else {
            this.moveToBlock(this.jason, hero.blockId);
          }
        }
      }
      
      // モブを殺す
      for (const mob of this.mobs) {
        if (!mob.alive) continue;
        if (this.jason.blockId === mob.blockId) {
          if (Math.abs(this.jason.x - mob.x) <= 0.5 && Math.abs(this.jason.y - mob.y) <= 0.5) {
            if (this.jasonKillCooldown <= 0) {
              this.killMob(mob, 'ジェイソン');
              this.jasonKillCooldown = 20;
            }
          }
        }
      }
      if (this.jasonKillCooldown > 0) this.jasonKillCooldown--;
    }

    // 熊
    const isBearAttackDay = this.bearAttackDays.includes(this.day);
    if (this.bear && this.bear.alive) {
      if (this.bear.cooldown > 0) {
        this.bear.cooldown--;
      } else {
        this.bear.cooldown = 3;
        
        const hero = this.hero;
        if (hero && hero.alive && isBearAttackDay) {
          if (this.bear.blockId === hero.blockId) {
            const dx = hero.x - this.bear.x;
            const dy = hero.y - this.bear.y;
            const mx = dx > 0 ? 1 : dx < 0 ? -1 : 0;
            const my = dy > 0 ? 1 : dy < 0 ? -1 : 0;
            if (Math.abs(dx) > Math.abs(dy)) {
              this.moveCharacter(this.bear, mx, 0);
            } else {
              this.moveCharacter(this.bear, 0, my);
            }
            if (Math.abs(this.bear.x - hero.x) <= 0.5 && Math.abs(this.bear.y - hero.y) <= 0.5) {
              this.killHero('熊');
            }
          } else {
            this.moveToBlock(this.bear, hero.blockId);
          }
        } else {
          const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
          const d = dirs[rand(0, 3)];
          this.moveCharacter(this.bear, d[0], d[1]);
        }
      }
      
      for (const mob of this.mobs) {
        if (!mob.alive) continue;
        if (this.bear.blockId === mob.blockId && isBearAttackDay) {
          if (Math.abs(this.bear.x - mob.x) <= 0.5 && Math.abs(this.bear.y - mob.y) <= 0.5) {
            if (this.bearKillCooldown <= 0) {
              this.killMob(mob, '熊');
              this.bearKillCooldown = 20;
            }
          }
        }
      }
      if (this.bearKillCooldown > 0) this.bearKillCooldown--;
    }

    // 狼 (ランダム)
    if (this.wolf && this.wolf.alive) {
      if (this.wolf.cooldown > 0) {
        this.wolf.cooldown--;
      } else {
        this.wolf.cooldown = 4;
        const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
        const d = dirs[rand(0, 3)];
        this.moveCharacter(this.wolf, d[0], d[1]);
      }
    }
  }

  // ---- 殺害処理 ----
  killHero(killer) {
    if (!this.hero || !this.hero.alive) return;
    this.hero.alive = false;
    this.gameOver = true;
    this.isRunning = false;
    if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    this.addLog(`💀 主人公が ${killer} に殺された... ゲームオーバー`);
    this.showPopup('ゲームオーバー', `主人公が ${killer} に殺されました...`, '再挑戦', () => {
      this.hidePopup();
      this.init();
    });
  }

  killMob(mob, killer) {
    if (!mob.alive) return;
    mob.alive = false;
    this.mobAlive--;
    this.addLog(`💀 ${mob.name} が ${killer} に殺された (生存 ${this.mobAlive}/8)`);
    this.updateUI();
  }

  // ---- 主人公移動 ----
  moveHero(dx, dy) {
    if (this.gameOver) return;
    if (!this.hero || !this.hero.alive) return;
    
    this.moveCharacter(this.hero, dx, dy);
    this.pickupItem();
    this.updateUI();
  }

  // ---- アイテム拾い (自動) ----
  pickupItem() {
    if (!this.hero || !this.hero.alive) return;
    if (this.heroItem) return;
    
    const idx = this.items.findIndex(it => 
      it.blockId === this.hero.blockId &&
      Math.abs(it.x - this.hero.x) <= 1 && Math.abs(it.y - this.hero.y) <= 1
    );
    if (idx >= 0) {
      this.heroItem = this.items[idx].name;
      this.items.splice(idx, 1);
      this.addLog(`📦 ${this.heroItem} を拾った`);
      this.updateUI();
    }
  }

  // ---- クリックでアイテム拾い ----
  pickupItemByClick(gx, gy) {
    if (!this.hero || !this.hero.alive) return;
    if (this.heroItem) {
      this.addLog('⚠️ すでにアイテムを持っている');
      return;
    }
    if (Math.abs(gx - this.hero.x) > 1 || Math.abs(gy - this.hero.y) > 1) {
      this.addLog('⚠️ 範囲外です');
      return;
    }
    
    const idx = this.items.findIndex(it => 
      it.blockId === this.hero.blockId &&
      it.x === gx && it.y === gy
    );
    if (idx >= 0) {
      this.heroItem = this.items[idx].name;
      this.items.splice(idx, 1);
      this.addLog(`📦 ${this.heroItem} を拾った`);
      this.updateUI();
    } else {
      this.addLog('⚠️ そこにアイテムはありません');
    }
  }

  // ---- アイテム使用 ----
  useItemOnObject(objType) {
    if (!this.hero || !this.hero.alive) return;
    if (!this.heroItem) {
      this.addLog('⚠️ アイテムを持っていない');
      return;
    }

    const itemName = this.heroItem;

    // 餌→狼
    if (itemName === '餌' && objType === '狼') {
      if (this.wolf && this.wolf.alive && this.wolf.blockId === this.hero.blockId) {
        if (Math.abs(this.wolf.x - this.hero.x) <= 1 && Math.abs(this.wolf.y - this.hero.y) <= 1) {
          this.points += 1;
          this.heroItem = null;
          this.wolf.alive = false;
          this.addLog('✅ 餌で狼を懐かせた！ +1ポイント');
          this.updateUI();
          return;
        } else {
          this.addLog('⚠️ 狼が近くにいない');
          return;
        }
      } else {
        this.addLog('⚠️ 狼が近くにいない');
        return;
      }
    }

    // 通常オブジェクト
    const obj = this.objects.find(o => 
      o.blockId === this.hero.blockId &&
      o.type === objType &&
      Math.abs(o.x - this.hero.x) <= 1 && Math.abs(o.y - this.hero.y) <= 1
    );
    if (!obj) {
      this.addLog(`⚠️ ${objType} が近くにない`);
      return;
    }
    if (obj.used) {
      this.addLog(`⚠️ この${objType}はもう使われている`);
      return;
    }

    const valid = (
      (objType === '窓' && itemName === '材') ||
      (objType === '穴' && itemName === '堀') ||
      (objType === '樽' && itemName === '斧') ||
      (objType === '箱' && itemName === '銃') ||
      (objType === '品' && itemName.startsWith('品'))
    );
    if (!valid) {
      this.addLog(`⚠️ ${itemName} は ${objType} に使えない`);
      return;
    }

    obj.used = true;
    this.points += 1;
    this.heroItem = null;
    this.addLog(`✅ ${itemName} を使って +1ポイント！`);
    this.updateUI();
  }

  // ---- アイテムを落とす ----
  dropItem() {
    if (!this.heroItem) {
      this.addLog('⚠️ 持っているアイテムがない');
      return;
    }
    this.items.push({
      name: this.heroItem,
      x: this.hero.x,
      y: this.hero.y,
      blockId: this.hero.blockId
    });
    this.addLog(`📤 ${this.heroItem} を落とした`);
    this.heroItem = null;
    this.updateUI();
  }

  // ---- タイマー ----
  startTimer() {
    if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    this.dayElapsed = 0;
    this.night = false;
    this.nightOverlay.style.display = 'none';

    this.timerId = setInterval(() => {
      if (this.gameOver) return;
      this.dayElapsed++;
      const remaining = DAY_DURATION - this.dayElapsed;
      this.dayDisplay.textContent = `🌅 ${this.day}日目 (${Math.max(0, remaining)}秒)`;

      if (remaining <= 10 && !this.night) {
        this.night = true;
        this.nightOverlay.style.display = 'block';
        this.addLog('🌙 夜になった...');
      }

      if (this.dayElapsed >= DAY_DURATION) {
        this.nextDay();
      }
    }, 1000);
  }

  nextDay() {
    if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    this.day++;

    if (this.day > MAX_DAYS) {
      this.endGame();
      return;
    }

    const jSpeed = 10 + (this.day - 1) * 10;
    this.addLog(`📈 ${this.day}日目: ジェイソンの速度が ${jSpeed} になった`);

    // モブ再割り当て
    for (const mob of this.mobs) {
      if (mob.alive && !mob.hasDelivered) {
        this.assignMobTask(mob);
      }
    }

    // 品10〜品80 再補充
    for (let i = 0; i < 8; i++) {
      let blockId = i;
      if (blockId >= 4) blockId = i + 1;
      const name = `品${(i + 1) * 10}`;
      const exists = this.items.some(it => it.name === name);
      if (!exists) {
        this.items.push({
          name: name,
          x: rand(0, 9),
          y: rand(0, 9),
          blockId: blockId
        });
      }
    }

    // 小屋オブジェクトリセット
    for (const obj of this.objects) {
      obj.used = false;
    }

    this.dayElapsed = 0;
    this.night = false;
    this.nightOverlay.style.display = 'none';
    this.updateUI();
    this.startTimer();
  }

  endGame() {
    if (this.gameOver) return;
    this.isRunning = false;
    if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    
    const total = this.points;
    const target = this.jasonPoints;
    this.addLog(`🏁 7日間終了！ 総ポイント: ${total} / ジェイソンポイント: ${target}`);

    if (total > target) {
      this.addLog('🎉 勝利！');
      this.showPopup('🎉 勝利！', `補強ポイント ${total} で ジェイソンポイント ${target} を上回った！\nrefined.html に移動します`, '移動する', () => {
        this.hidePopup();
        window.location.href = 'refined.html';
      });
    } else if (total === target) {
      this.gameOver = true;
      this.addLog('⚖️ 引き分け... 負け');
      this.showPopup('😵 引き分け', `補強ポイント ${total} で ジェイソンポイント ${target} と同点...\n負けです`, '再挑戦', () => {
        this.hidePopup();
        this.init();
      });
    } else {
      this.gameOver = true;
      this.addLog('💀 敗北...');
      this.showPopup('💀 敗北', `補強ポイント ${total} で ジェイソンポイント ${target} に届かなかった...`, '再挑戦', () => {
        this.hidePopup();
        this.init();
      });
    }
  }

  // ---- ポップアップ ----
  showPopup(title, desc, btnText, callback) {
    this.popupTitle.textContent = title;
    this.popupDesc.textContent = desc;
    this.popupBtn.textContent = btnText;
    this.popup.style.display = 'block';
    this.popupBtn.onclick = callback;
  }

  hidePopup() {
    this.popup.style.display = 'none';
  }

  // ---- ログ ----
  addLog(msg) {
    this.logs.unshift(msg);
    if (this.logs.length > 50) this.logs.pop();
    this.renderLog();
  }

  renderLog() {
    this.logEl.innerHTML = this.logs.slice(0, 12).map(m => `<div>${m}</div>`).join('');
  }

  // ---- UI更新 ----
  updateUI() {
    this.dispDay.textContent = `${this.day} / 7`;
    this.dispPoints.textContent = this.points;
    this.dispItem.textContent = this.heroItem || 'なし';
    this.dispMob.textContent = `${this.mobAlive} / 8`;
    if (!this.gameOver) {
      const remaining = DAY_DURATION - this.dayElapsed;
      this.dayDisplay.textContent = `🌅 ${this.day}日目 (${Math.max(0, remaining)}秒)`;
    }
  }

  // ---- メインループ ----
  loop() {
    this.frameCount++;

    if (!this.gameOver && this.isRunning) {
      if (this.frameCount % 3 === 0) this.updateMobs();
      if (this.frameCount % 4 === 0) this.updateEnemies();
    }

    this.render();
    this.animId = requestAnimationFrame(() => this.loop());
  }

  // ---- 描画 ----
  render() {
    const ctx = this.ctx;
    const blockId = this.currentBlock;

    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // 背景
    ctx.fillStyle = blockId === 4 ? '#8B7D6B' : '#2d5a27';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // グリッド
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * BLOCK_SIZE, 0);
      ctx.lineTo(i * BLOCK_SIZE, CANVAS_SIZE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * BLOCK_SIZE);
      ctx.lineTo(CANVAS_SIZE, i * BLOCK_SIZE);
      ctx.stroke();
    }

    // 木
    if (blockId !== 4) {
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          if (this.blockMap[blockId]?.[y]?.[x] === 'tree') {
            ctx.fillStyle = '#1a3d1a';
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.fillStyle = '#2a5a2a';
            ctx.fillRect(x * BLOCK_SIZE + 4, y * BLOCK_SIZE + 4, BLOCK_SIZE - 8, BLOCK_SIZE - 8);
            ctx.fillStyle = '#3a7a3a';
            ctx.font = '14px "MS Gothic"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('木', x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
          }
        }
      }
    }

    // 小屋オブジェクト
    if (blockId === 4) {
      for (const obj of this.objects) {
        if (obj.blockId !== blockId) continue;
        const px = obj.x * BLOCK_SIZE;
        const py = obj.y * BLOCK_SIZE;
        ctx.fillStyle = obj.used ? '#555' : '#3a3a5a';
        ctx.fillRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
        ctx.strokeStyle = obj.used ? '#777' : '#88aaff';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
        ctx.fillStyle = obj.used ? '#888' : '#fff';
        ctx.font = '12px "MS Gothic"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let label = obj.type;
        if (obj.type === '窓') label = '密';
        if (obj.type === '樽') label = '椅';
        ctx.fillText(label, px + BLOCK_SIZE/2, py + BLOCK_SIZE/2);
      }
    }

    // アイテム
    for (const item of this.items) {
      if (item.blockId !== blockId) continue;
      const px = item.x * BLOCK_SIZE;
      const py = item.y * BLOCK_SIZE;
      ctx.fillStyle = '#ffdd44';
      ctx.fillRect(px + 4, py + 4, BLOCK_SIZE - 8, BLOCK_SIZE - 8);
      ctx.fillStyle = '#000';
      ctx.font = '10px "MS Gothic"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = item.name.length > 4 ? item.name.substring(0, 4) : item.name;
      ctx.fillText(label, px + BLOCK_SIZE/2, py + BLOCK_SIZE/2);
    }

    // キャラクター収集
    const chars = [];
    if (this.hero?.alive && this.hero.blockId === blockId) {
      chars.push({ name: this.hero.img, x: this.hero.x, y: this.hero.y });
    }
    for (const mob of this.mobs) {
      if (mob.alive && mob.blockId === blockId) {
        chars.push({ name: mob.img, x: mob.x, y: mob.y });
      }
    }
    if (this.jason?.alive && this.jason.blockId === blockId) {
      chars.push({ name: this.jason.img, x: this.jason.x, y: this.jason.y });
    }
    if (this.bear?.alive && this.bear.blockId === blockId) {
      chars.push({ name: this.bear.img, x: this.bear.x, y: this.bear.y });
    }
    if (this.wolf?.alive && this.wolf.blockId === blockId) {
      chars.push({ name: this.wolf.img, x: this.wolf.x, y: this.wolf.y });
    }

    // 描画
    for (const ch of chars) {
      const px = ch.x * BLOCK_SIZE;
      const py = ch.y * BLOCK_SIZE;
      const img = getImage(ch.name);
      if (img) {
        ctx.drawImage(img, px, py, BLOCK_SIZE, BLOCK_SIZE);
      } else {
        const colors = {
          '紅葉': '#aa44ff',
          '加藤': '#ff6644',
          '松本': '#ff6644',
          '坪池': '#ff6644',
          '市川': '#ff6644',
          '青笹': '#ff6644',
          '角田': '#ff6644',
          '木元': '#ff6644',
          '山崎': '#ff6644',
          'ジェイソン': '#ff0000',
          '熊': '#8B4513',
          '狼': '#888888'
        };
        ctx.fillStyle = colors[ch.name] || '#888';
        ctx.fillRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "MS Gothic"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = ch.name.length > 2 ? ch.name.substring(0, 2) : ch.name;
        ctx.fillText(label, px + BLOCK_SIZE/2, py + BLOCK_SIZE/2);
      }
    }

    // ブロック名
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '10px "MS Gothic"';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(BLOCK_NAMES[blockId], 4, 4);
  }

  // ---- イベント ----
  onKeyDown(e) {
    const key = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
      e.preventDefault();
      const dir = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0] };
      const [dx, dy] = dir[key];
      this.moveHero(dx, dy);
    }
  }

  onCanvasClick(e) {
    if (this.gameOver) return;
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const gx = Math.floor(mx / BLOCK_SIZE);
    const gy = Math.floor(my / BLOCK_SIZE);
    if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) return;

    const hero = this.hero;
    if (!hero || !hero.alive) return;
    if (hero.blockId !== this.currentBlock) return;

    // アイテム拾い
    this.pickupItemByClick(gx, gy);

    // オブジェクト使用
    const obj = this.objects.find(o => o.blockId === hero.blockId && o.x === gx && o.y === gy);
    if (obj) {
      this.useItemOnObject(obj.type);
      return;
    }

    // 狼クリック
    if (this.wolf?.alive && this.wolf.blockId === hero.blockId && this.wolf.x === gx && this.wolf.y === gy) {
      this.useItemOnObject('狼');
    }
  }

  onDrop() {
    this.dropItem();
  }
}

// ---- 起動 ----
(async function() {
  await loadImages();
  const game = new Game();
  window.game = game;
})();
</script>
