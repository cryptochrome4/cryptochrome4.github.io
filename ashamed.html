<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紙芝居ループ（並べ替え対応）</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #111; color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100%;
  }
  body {
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }

  /* 本編ステージ：画面いっぱい */
  #stage {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden;
    position: relative;
  }
  #stage img {
    width: 100%; height: 100%;
    display: block;
    object-fit: contain; /* デフォルト */
  }
  #stage img.fit-fill    { object-fit: fill; }
  #stage img.fit-cover   { object-fit: cover; }
  #stage img.fit-contain { object-fit: contain; }
  #stage img.fit-none    { object-fit: none; }

  /* 下部バー（常時表示の最小UI） */
  #bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: #181818;
    border-top: 1px solid #333; font-size: 13px;
    box-sizing: border-box;
  }
  #bar .spacer { flex: 1 1 auto; }
  #counter { color: #888; font-variant-numeric: tabular-nums; }
  button {
    background: #333; color: #eee; border: 1px solid #555;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #444; }
  #panelToggle {
    display: flex; align-items: center; gap: 4px;
  }
  #panelToggle .arrow {
    display: inline-block; transition: transform .2s;
  }
  #panelToggle.open .arrow { transform: rotate(180deg); }

  /* 情報パネル（下から開閉） */
  #panel {
    flex: 0 0 auto;
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
    background: #141414;
    border-top: 1px solid #333;
    box-sizing: border-box;
  }
  #panel.open {
    max-height: 55vh;
    overflow-y: auto;
  }
  #panelInner {
    padding: 12px 16px 20px;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 1100px; margin: 0 auto;
  }
  .section h2 {
    font-size: 12px; color: #aaa; margin: 0 0 8px;
    font-weight: normal; letter-spacing: .05em;
  }
  .row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    font-size: 13px;
  }
  .row label { display: flex; align-items: center; gap: 6px; }
  #intervalValue {
    min-width: 3.8em; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* 並べ替えリスト */
  #orderList {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }
  #orderList li {
    display: flex; align-items: center; gap: 8px;
    background: #1c1c1c; border: 1px solid #333; border-radius: 6px;
    padding: 6px 8px; cursor: grab; user-select: none; font-size: 12px;
  }
  #orderList li.dragging { opacity: .4; }
  #orderList li.over { border-color: #6cf; }
  #orderList img {
    width: 36px; height: 36px; object-fit: cover;
    border-radius: 4px; background: #000; flex: 0 0 auto;
  }
  #orderList .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #orderList .num { color: #666; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
</style>
</head>
<body>

<!-- 本編：画面いっぱい -->
<div id="stage"><img id="frame" src="" alt="" class="fit-contain"></div>

<!-- 下部バー（最小UI） -->
<div id="bar">
  <button id="toggleBtn">一時停止</button>
  <span id="counter"></span>
  <span class="spacer"></span>
  <button id="panelToggle" class="open">
    設定 <span class="arrow">∨</span>
  </button>
</div>

<!-- 情報パネル -->
<div id="panel" class="open">
  <div id="panelInner">

    <div class="section">
      <h2>表示間隔（1秒〜10分）</h2>
      <div class="row">
        <label>
          <input type="range" id="intervalRange" min="1" max="600" step="1" value="20">
          <span id="intervalValue">20秒</span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2>画像サイズ</h2>
      <div class="row">
        <label><input type="radio" name="fit" value="fill"> fill</label>
        <label><input type="radio" name="fit" value="cover"> cover</label>
        <label><input type="radio" name="fit" value="contain" checked> contain（デフォルト）</label>
        <label><input type="radio" name="fit" value="none"> none</label>
      </div>
    </div>

    <div class="section">
      <h2>表示順（ドラッグで並べ替え／自動保存）</h2>
      <div class="row" style="margin-bottom:8px;">
        <button id="resetOrderBtn">順番をリセット</button>
      </div>
      <ul id="orderList"></ul>
    </div>

  </div>
</div>

<script>
  // ===== 設定 =====
  const DEFAULT_IMAGES = [
    "zfill.jpg","z8fill.jpg","zcease.jpg","zfee.jpg","zthen.jpg","zmites.jpg",
    "ztorn.jpg","z8torn.jpg","zditzy.jpg","zclean.jpg","ztin.jpg","zlousy.jpg",
    "z8lousy.jpg","zopen.jpg","zbizarre.jpg","zblur.jpg","z8blur.jpg","zbeg.jpg"
  ];
  const DEFAULT_INTERVAL_SEC = 20;   // デフォ20秒
  const MIN_INTERVAL_SEC = 1;
  const MAX_INTERVAL_SEC = 600;      // 10分
  const DEFAULT_FIT = "contain";
  const FITS = ["fill","cover","contain","none"];

  const KEY_ORDER = "ashamed_order_v2";
  const KEY_INTERVAL = "ashamed_interval_v2";
  const KEY_FIT = "ashamed_fit_v1";
  const KEY_PANEL = "ashamed_panel_v1";

  const stageImg = document.getElementById("frame");
  const stage = document.getElementById("stage");
  const range = document.getElementById("intervalRange");
  const intervalValue = document.getElementById("intervalValue");
  const toggleBtn = document.getElementById("toggleBtn");
  const resetOrderBtn = document.getElementById("resetOrderBtn");
  const counter = document.getElementById("counter");
  const orderList = document.getElementById("orderList");
  const panel = document.getElementById("panel");
  const panelToggle = document.getElementById("panelToggle");

  let order = loadOrder();
  let index = 0;
  let intervalSec = loadInterval();
  let fit = loadFit();
  let timerId = null;
  let running = true;

  // 相対パス（ashamed.html と同じフォルダの画像）
  function urlOf(name) { return name; }

  // ---- 保存/復元 ----
  function loadOrder() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY_ORDER));
      if (Array.isArray(saved)) {
        const valid = saved.filter(n => DEFAULT_IMAGES.includes(n));
        const missing = DEFAULT_IMAGES.filter(n => !valid.includes(n));
        return valid.concat(missing);
      }
    } catch (e) {}
    return DEFAULT_IMAGES.slice();
  }
  function saveOrder() { localStorage.setItem(KEY_ORDER, JSON.stringify(order)); }
  function loadInterval() {
    const v = Number(localStorage.getItem(KEY_INTERVAL));
    if (Number.isFinite(v) && v >= MIN_INTERVAL_SEC && v <= MAX_INTERVAL_SEC) return v;
    return DEFAULT_INTERVAL_SEC;
  }
  function saveInterval() { localStorage.setItem(KEY_INTERVAL, String(intervalSec)); }
  function loadFit() {
    const v = localStorage.getItem(KEY_FIT);
    return FITS.includes(v) ? v : DEFAULT_FIT;
  }
  function saveFit() { localStorage.setItem(KEY_FIT, fit); }
  function loadPanel() {
    const v = localStorage.getItem(KEY_PANEL);
    return v === "closed" ? false : true; // デフォは開く
  }
  function savePanel(open) { localStorage.setItem(KEY_PANEL, open ? "open" : "closed"); }

  // ---- 表示 ----
  function applyFit() {
    FITS.forEach(f => stageImg.classList.remove("fit-" + f));
    stageImg.classList.add("fit-" + fit);
    document.querySelectorAll('input[name="fit"]').forEach(r => {
      r.checked = (r.value === fit);
    });
  }
  function showFrame(i) {
    const name = order[i];
    stageImg.src = urlOf(name);
    stageImg.alt = name;
    counter.textContent = (i + 1) + " / " + order.length + "  " + name;
  }
  function next() { index = (index + 1) % order.length; showFrame(index); }
  function startTimer() { stopTimer(); timerId = setInterval(next, intervalSec * 1000); }
  function stopTimer() { if (timerId !== null) { clearInterval(timerId); timerId = null; } }
  function updateRunning() {
    if (running) { startTimer(); toggleBtn.textContent = "一時停止"; }
    else { stopTimer(); toggleBtn.textContent = "再開"; }
  }

  // ---- パネル開閉 ----
  function setPanel(open) {
    if (open) panel.classList.add("open");
    else panel.classList.remove("open");
    panelToggle.classList.toggle("open", open);
    savePanel(open);
  }

  // ---- 並べ替えリスト ----
  function renderOrderList() {
    orderList.innerHTML = "";
    order.forEach((name, i) => {
      const li = document.createElement("li");
      li.draggable = true;
      li.dataset.name = name;
      li.innerHTML = '<span class="num">' + (i + 1) + '</span>' +
        '<img src="' + urlOf(name) + '" alt="">' +
        '<span class="name">' + name + '</span>';
      li.addEventListener("dragstart", e => {
        li.classList.add("dragging");
        e.dataTransfer.setData("text/plain", name);
        e.dataTransfer.effectAllowed = "move";
      });
      li.addEventListener("dragend", () => {
        li.classList.remove("dragging");
        document.querySelectorAll("#orderList li.over").forEach(el => el.classList.remove("over"));
      });
      li.addEventListener("dragover", e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        li.classList.add("over");
      });
      li.addEventListener("dragleave", () => li.classList.remove("over"));
      li.addEventListener("drop", e => {
        e.preventDefault();
        li.classList.remove("over");
        const fromName = e.dataTransfer.getData("text/plain");
        const toName = li.dataset.name;
        if (!fromName || fromName === toName) return;
        moveItem(fromName, toName);
      });
      orderList.appendChild(li);
    });
  }
  function moveItem(fromName, toName) {
    const from = order.indexOf(fromName);
    const to = order.indexOf(toName);
    if (from < 0 || to < 0) return;
    order.splice(to, 0, order.splice(from, 1)[0]);
    saveOrder();
    const currentName = stageImg.alt;
    index = Math.max(0, order.indexOf(currentName));
    renderOrderList();
    showFrame(index);
  }

  // ---- UIイベント ----
  range.min = MIN_INTERVAL_SEC;
  range.max = MAX_INTERVAL_SEC;
  range.value = intervalSec;
  intervalValue.textContent = intervalSec + "秒";

  range.addEventListener("input", () => {
    intervalSec = Number(range.value);
    intervalValue.textContent = intervalSec + "秒";
    saveInterval();
    if (running) startTimer();
  });

  document.querySelectorAll('input[name="fit"]').forEach(r => {
    r.addEventListener("change", () => {
      if (!r.checked) return;
      fit = r.value;
      saveFit();
      applyFit();
    });
  });

  toggleBtn.addEventListener("click", () => { running = !running; updateRunning(); });

  panelToggle.addEventListener("click", () => {
    setPanel(!panel.classList.contains("open"));
  });

  resetOrderBtn.addEventListener("click", () => {
    if (!confirm("表示順を初期状態に戻します。よろしいですか？（1/4）")) return;
    if (!confirm("本当にリセットしますか？（2/4）")) return;
    if (!confirm("本当に本当にリセットしますか？（3/4）")) return;
    if (!confirm("これが最後の確認です。本当にリセットしますか？（4/4）")) return;
    order = DEFAULT_IMAGES.slice();
    saveOrder();
    index = 0;
    renderOrderList();
    showFrame(index);
  });

  // プリロード
  DEFAULT_IMAGES.forEach(n => { const im = new Image(); im.src = urlOf(n); });

  // 初期化
  applyFit();
  renderOrderList();
  showFrame(index);
  updateRunning();
  setPanel(loadPanel());
</script>

</body>
</html>
