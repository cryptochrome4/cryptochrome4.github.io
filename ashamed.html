<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紙芝居ループ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
  }
  #stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 90vw;
    height: 70vh;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
  }
  #stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #intervalValue {
    min-width: 3.5em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #counter {
    font-size: 12px;
    color: #888;
  }
  button {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background: #444;
  }
</style>
</head>
<body>

<div id="stage">
  <img id="frame" src="" alt="">
</div>

<div id="controls">
  <label>
    間隔:
    <input type="range" id="intervalRange" min="1" max="300" step="1" value="5">
    <span id="intervalValue">5秒</span>
  </label>
  <button id="toggleBtn">一時停止</button>
  <span id="counter"></span>
</div>

<script>
  // ===== 設定ここから =====

  // GitHub上の画像があるベースURL（末尾スラッシュ付き）
  // 例: https://yourname.github.io/yourrepo/images/
  const BASE = "https://yourname.github.io/yourrepo/";

  // 表示順。ここを並べ替えれば順番が変わる。
  const IMAGES = [
    "zfill.jpg",
    "z8fill.jpg",
    "z.cease.jpg",
    "zfee.jpg",
    "zthen.jpg",
    "zmites.jpg",
    "ztorn.jpg",
    "z8torn.jpg",
    "zditzy.jp",
    "zclean.jpg",
    "ztin.jpg",
    "zlousy.jpg",
    "z8lousy.jpg",
    "zopen.jpg",
    "zbizarre.jpg",
    "zblur.jpg",
    "z8blur.jpg",
    "zbeg.jpg"
  ];

  const DEFAULT_INTERVAL_SEC = 5; // デフォルト5秒
  const MIN_INTERVAL_SEC = 1;
  const MAX_INTERVAL_SEC = 300;   // 5分

  // ===== 設定ここまで =====


  const stageImg = document.getElementById("frame");
  const range = document.getElementById("intervalRange");
  const intervalValue = document.getElementById("intervalValue");
  const toggleBtn = document.getElementById("toggleBtn");
  const counter = document.getElementById("counter");

  let index = 0;
  let intervalSec = DEFAULT_INTERVAL_SEC;
  let timerId = null;
  let running = true;

  // 画像URLを配列化（サイト内にURLを掲載する目的でここで生成）
  const urls = IMAGES.map(name => BASE + name);

  // 初期UI設定
  range.min = MIN_INTERVAL_SEC;
  range.max = MAX_INTERVAL_SEC;
  range.value = DEFAULT_INTERVAL_SEC;
  intervalValue.textContent = DEFAULT_INTERVAL_SEC + "秒";

  function showFrame(i) {
    stageImg.src = urls[i];
    stageImg.alt = IMAGES[i];
    counter.textContent = (i + 1) + " / " + urls.length;
  }

  function next() {
    index = (index + 1) % urls.length;
    showFrame(index);
  }

  function startTimer() {
    stopTimer();
    timerId = setInterval(next, intervalSec * 1000);
  }

  function stopTimer() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function updateRunning() {
    if (running) {
      startTimer();
      toggleBtn.textContent = "一時停止";
    } else {
      stopTimer();
      toggleBtn.textContent = "再開";
    }
  }

  range.addEventListener("input", () => {
    intervalSec = Number(range.value);
    intervalValue.textContent = intervalSec + "秒";
    if (running) startTimer(); // 間隔変更を即反映
  });

  toggleBtn.addEventListener("click", () => {
    running = !running;
    updateRunning();
  });

  // プリロード（任意）
  urls.forEach(u => { const im = new Image(); im.src = u; });

  // 開始
  showFrame(index);
  updateRunning();
</script>

</body>
</html>
