<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI証券 ポートフォリオ・ジャパネスク</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap');

  :root {
    --ai: #1b2a4a;          /* 藍 */
    --ai-light: #2d4270;
    --shu: #b13a2e;         /* 朱 */
    --shu-light: #d46a5a;
    --kin: #c9a84c;         /* 金 */
    --kin-light: #e8d5a3;
    --sumi: #1a1614;        /* 墨 */
    --washi: #f5efe3;       /* 和紙 */
    --matcha: #5a7a4a;      /* 抹茶 */
    --fuji: #7a6a9a;        /* 藤 */
    --sakura: #d98a9a;      /* 桜 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Shippori Mincho', 'Zen Kaku Gothic New', serif;
    background: var(--sumi);
    color: var(--washi);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(201,168,76,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(177,58,46,0.06) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(201,168,76,0.015) 40px, rgba(201,168,76,0.015) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(201,168,76,0.015) 40px, rgba(201,168,76,0.015) 41px);
  }

  /* 和紙の繊維感 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(245,239,227,0.02) 0%, transparent 30%),
      radial-gradient(circle at 90% 90%, rgba(245,239,227,0.02) 0%, transparent 30%);
    pointer-events: none;
    z-index: 0;
  }

  /* 額縁（朱塗り） */
  .frame {
    position: fixed;
    inset: 10px;
    border: 3px solid var(--shu);
    box-shadow:
      inset 0 0 0 1px var(--kin),
      0 0 0 1px var(--sumi),
      0 0 40px rgba(177,58,46,0.2);
    pointer-events: none;
    z-index: 1;
    opacity: 0.85;
  }
  .frame::before {
    content: '◆';
    position: absolute;
    top: -16px; left: 50%;
    transform: translateX(-50%);
    color: var(--kin);
    font-size: 1.2rem;
    background: var(--sumi);
    padding: 0 12px;
  }
  .frame::after {
    content: '◆';
    position: absolute;
    bottom: -16px; left: 50%;
    transform: translateX(-50%);
    color: var(--kin);
    font-size: 1.2rem;
    background: var(--sumi);
    padding: 0 12px;
  }

  /* 四隅の飾り */
  .corner {
    position: fixed;
    width: 70px; height: 70px;
    z-index: 2;
    pointer-events: none;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner.tl { top: 2px; left: 2px; }
  .corner.tr { top: 2px; right: 2px; transform: scaleX(-1); }
  .corner.bl { bottom: 2px; left: 2px; transform: scaleY(-1); }
  .corner.br { bottom: 2px; right: 2px; transform: scale(-1,-1); }

  .container {
    position: relative;
    z-index: 3;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 30px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 45px;
    position: relative;
  }

  /* 家紋風の円 */
  .kamon {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    position: relative;
  }
  .kamon svg { width: 100%; height: 100%; }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(1.8rem, 4.5vw, 2.8rem);
    font-weight: 600;
    letter-spacing: 0.25em;
    color: var(--kin);
    text-shadow:
      0 0 20px rgba(201,168,76,0.4),
      2px 2px 0 var(--shu);
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 0.95rem;
    letter-spacing: 0.4em;
    color: var(--kin-light);
    opacity: 0.75;
    font-weight: 400;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 22px 0;
    color: var(--shu);
    font-size: 1.1rem;
  }
  .divider::before, .divider::after {
    content: '';
    height: 1px;
    width: 100px;
    background: linear-gradient(to right, transparent, var(--kin), var(--shu));
  }
  .divider::after { background: linear-gradient(to left, transparent, var(--kin), var(--shu)); }

  /* 凡例 */
  .legend {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-bottom: 40px;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--kin-light);
    opacity: 0.9;
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--kin);
  }
  .dot.fund { background: var(--matcha); }
  .dot.stock { background: var(--shu); }
  .dot.bond { background: var(--fuji); }

  /* グリッド */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 28px;
  }

  /* カード（和紙風） */
  .card {
    background:
      linear-gradient(160deg, rgba(27,42,74,0.85), rgba(26,22,20,0.95));
    border: 2px solid rgba(201,168,76,0.4);
    border-radius: 2px;
    padding: 34px 24px 24px;
    position: relative;
    transition: all 0.4s ease;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.6s ease forwards;
    box-shadow:
      inset 0 0 30px rgba(0,0,0,0.5),
      0 4px 20px rgba(0,0,0,0.4);
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover {
    border-color: var(--kin);
    box-shadow:
      inset 0 0 30px rgba(0,0,0,0.4),
      0 0 30px rgba(201,168,76,0.25),
      0 4px 24px rgba(0,0,0,0.5);
    transform: translateY(-3px);
  }

  /* 上部の飾り線 */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 3px;
    background: linear-gradient(to right, transparent, var(--shu), var(--kin), var(--shu), transparent);
  }

  /* 家紋風の飾り */
  .card-ornament {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    color: var(--kin);
    font-size: 1.1rem;
    background: var(--sumi);
    padding: 0 12px;
    letter-spacing: 4px;
  }

  .card-header {
    text-align: center;
    margin-bottom: 18px;
  }

  .persona-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--kin);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    text-shadow: 0 0 10px rgba(201,168,76,0.3);
  }

  .persona-desc {
    font-size: 0.78rem;
    color: var(--kin-light);
    opacity: 0.6;
    font-style: italic;
    letter-spacing: 0.05em;
  }

  .total {
    text-align: center;
    font-size: 0.85rem;
    color: var(--matcha);
    margin: 14px 0;
    padding: 8px 0;
    border-top: 1px solid rgba(201,168,76,0.2);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    letter-spacing: 0.15em;
    font-weight: 500;
  }

  .coin-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .coin-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
  }

  .coin-symbol {
    width: 70px;
    font-weight: 600;
    color: var(--washi);
    font-family: 'Shippori Mincho', serif;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .coin-bar-wrap {
    flex: 1;
    height: 18px;
    background: rgba(245,239,227,0.06);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }

  .coin-bar {
    height: 100%;
    border-radius: 1px;
    transition: width 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative;
  }

  .coin-bar.fund {
    background: linear-gradient(90deg, rgba(90,122,74,0.5), var(--matcha));
    border-right: 1px solid #9aba8a;
  }
  .coin-bar.stock {
    background: linear-gradient(90deg, rgba(177,58,46,0.5), var(--shu-light));
    border-right: 1px solid var(--shu-light);
  }
  .coin-bar.bond {
    background: linear-gradient(90deg, rgba(122,106,154,0.5), var(--fuji));
    border-right: 1px solid #a89ac0;
  }

  .coin-amount {
    width: 78px;
    text-align: right;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.75rem;
    color: var(--kin-light);
  }

  .coin-pct {
    width: 42px;
    text-align: right;
    font-size: 0.7rem;
    color: var(--kin);
    opacity: 0.75;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }

  .badge {
    font-size: 0.55rem;
    padding: 1px 4px;
    border-radius: 1px;
    letter-spacing: 0.02em;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    line-height: 1.4;
  }
  .badge.fund {
    background: rgba(90,122,74,0.3);
    color: #a8c898;
    border: 1px solid rgba(90,122,74,0.5);
  }
  .badge.stock {
    background: rgba(177,58,46,0.25);
    color: var(--shu-light);
    border: 1px solid rgba(177,58,46,0.45);
  }
  .badge.bond {
    background: rgba(122,106,154,0.3);
    color: #b8a8d8;
    border: 1px solid rgba(122,106,154,0.5);
  }

  footer {
    text-align: center;
    margin-top: 60px;
    font-size: 0.75rem;
    color: var(--kin-light);
    opacity: 0.45;
    letter-spacing: 0.2em;
    line-height: 1.8;
  }

  /* 背景の青海波 */
  .seigaiha {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 200px;
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
  }
  .seigaiha svg { width: 100%; height: 100%; }

  /* 桜の花びら */
  .sakura {
    position: fixed;
    z-index: 1;
    opacity: 0.08;
    pointer-events: none;
    font-size: 2rem;
    color: var(--sakura);
  }

  @media (max-width: 600px) {
    .container { padding: 40px 16px 60px; }
    .grid { grid-template-columns: 1fr; }
    .frame { inset: 6px; }
    .coin-symbol { width: 55px; font-size: 0.7rem; }
    .coin-amount { width: 68px; font-size: 0.68rem; }
    .coin-pct { width: 36px; font-size: 0.65rem; }
    .kamon { width: 70px; height: 70px; }
  }
</style>
</head>

// ============================================================
// ポートフォリオ計算
// ============================================================

const TOTAL_BUDGET = 50000; // 各タイプの総投資額（円）

function buildPortfolio(persona) {
  const weights = persona.weights;
  const active = ASSETS.filter(a => (weights[a.symbol] || 0) > 0);

  // 最低3000円保証：アクティブ銘柄数 × 3000 が総額を超えないように
  const minTotal = active.length * 3000;
  const budget = Math.max(TOTAL_BUDGET, minTotal);

  const totalWeight = active.reduce((s, a) => s + weights[a.symbol], 0);

  // まず重みで按分
  let allocs = active.map(a => ({
    ...a,
    weight: weights[a.symbol],
    amount: Math.round((weights[a.symbol] / totalWeight) * budget / 100) * 100
  }));

  // 最低3000円を保証
  allocs.forEach(a => { if (a.amount < 3000) a.amount = 3000; });

  // 合計を再計算し、超過分を比率で調整
  let sum = allocs.reduce((s, a) => s + a.amount, 0);
  if (sum > 0) {
    const scale = budget / sum;
    allocs.forEach(a => {
      a.amount = Math.round(a.amount * scale / 100) * 100;
      if (a.amount < 3000) a.amount = 3000;
    });
  }

  const finalTotal = allocs.reduce((s, a) => s + a.amount, 0);
  const maxAmount = Math.max(...allocs.map(a => a.amount));

  return { allocs, total: finalTotal, maxAmount };
}

// ============================================================
// レンダリング
// ============================================================

const grid = document.getElementById('grid');

PERSONAS.forEach((persona, idx) => {
  const { allocs, total, maxAmount } = buildPortfolio(persona);

  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${idx * 0.08}s`;

  const ornament = document.createElement('div');
  ornament.className = 'card-ornament';
  ornament.textContent = '❁ ❁';
  card.appendChild(ornament);

  // ヘッダー
  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `
    <div class="persona-name">${persona.name}</div>
    <div class="persona-desc">${persona.desc}</div>
  `;
  card.appendChild(header);

  // 合計
  const totalEl = document.createElement('div');
  totalEl.className = 'total';
  totalEl.textContent = `総投資額 ¥${total.toLocaleString()}`;
  card.appendChild(totalEl);

  // リスト
  const list = document.createElement('div');
  list.className = 'coin-list';

  const sorted = [...allocs].sort((a, b) => b.amount - a.amount);

  sorted.forEach(asset => {
    const pct = ((asset.amount / total) * 100).toFixed(1);
    const barWidth = maxAmount > 0 ? (asset.amount / maxAmount) * 100 : 0;
    const typeClass = asset.type;
    const badgeText = asset.type === 'fund' ? '投' : asset.type === 'stock' ? '株' : '債';
    const badgeClass = asset.type;

    const row = document.createElement('div');
    row.className = 'coin-row';
    row.innerHTML = `
      <div class="coin-symbol">${asset.symbol}<span class="badge ${badgeClass}">${badgeText}</span></div>
      <div class="coin-bar-wrap">
        <div class="coin-bar ${typeClass}" style="width:0%" data-width="${barWidth}%"></div>
      </div>
      <div class="coin-amount">¥${asset.amount.toLocaleString()}</div>
      <div class="coin-pct">${pct}%</div>
    `;
    list.appendChild(row);
  });

  card.appendChild(list);
  grid.appendChild(card);
});
