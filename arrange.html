<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GRT- アリの巣</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        #gameWrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #0f3460;
        }
        #canvasContainer {
            position: relative;
            width: 800px;
            height: 500px;
            border: 4px solid #533483;
            border-radius: 8px;
            background: #1a1a2e;
            cursor: crosshair;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            image-rendering: pixelated;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 4px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(45, 45, 68, 0.85);
            border: 2px solid #6a4c93;
            color: white;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            line-height: 60px;
            font-weight: bold;
            box-shadow: 0 3px 0 rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: none; }
        .ctrl-btn.attack {
            background: rgba(255, 50, 50, 0.4);
            border-color: #FF1744;
            color: #FF1744;
            font-size: 14px;
        }
        .ctrl-btn.scroll-up {
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
        }
        .ctrl-btn.scroll-down {
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        #grtCounter {
            color: #ff6b6b;
            font-size: 20px;
            background: #1a0a0a;
            padding: 6px 24px;
            border-radius: 30px;
            border: 2px solid #ff6b6b;
            font-weight: bold;
        }
        #grtCounter.found {
            color: #FFD700;
            border-color: #FFD700;
            background: #1a1a0a;
        }
        #blockCounter {
            color: #88CCFF;
            font-size: 16px;
            background: #0d0d1a;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #88CCFF;
        }
        #hpBar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff6b6b;
            font-size: 14px;
        }
        #hpBar .bar {
            width: 120px;
            height: 12px;
            background: #2a1a1a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ff6b6b;
        }
        #hpBar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ff1744, #ff6b6b);
            transition: width 0.3s;
            width: 100%;
        }
        #inventory {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        #inventory span {
            color: #aaa;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
        }
        #inventory .active {
            color: #FFD700;
            border: 1px solid #FFD700;
            background: rgba(255,215,0,0.1);
        }
        .hint {
            color: #8899aa;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }
        #scoreDisplay {
            color: #4FC3F7;
            font-size: 14px;
        }
        #controllerStatus {
            color: #4CAF50;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #4CAF50;
            background: rgba(76,175,80,0.1);
        }
        #enemyCounter {
            color: #ff6b6b;
            font-size: 14px;
            background: #1a0a0a;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #ff6b6b;
        }
        #victoryOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        #victoryOverlay .title {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        #victoryOverlay .sub {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }
        #victoryOverlay .btn-go {
            padding: 16px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #FFD700, #FFA000);
            border: none;
            border-radius: 50px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
        }
        #victoryOverlay .stats {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <canvas id="canvas" width="800" height="500"></canvas>
        <div id="controls">
            <div class="ctrl-btn attack" id="attackBtn">⚔️</div>
            <div class="ctrl-btn scroll-up" id="scrollUp">▲▲</div>
            <div class="ctrl-btn scroll-down" id="scrollDown">▼▼</div>
        </div>
    </div>
    <div id="ui">
        <div id="hpBar">❤️ <span id="hpText">10/10</span><div class="bar"><div class="fill" id="hpFill"></div></div></div>
        <div id="blockCounter">🧱 0</div>
        <div id="grtCounter">GRT-</div>
        <div id="scoreDisplay">💀 0</div>
        <div id="enemyCounter">🐜 0</div>
        <div id="inventory">
            <span class="active" id="invPick">⛏️</span>
            <span id="invSword">🗡️</span>
            <span id="invPotion">❤️‍🩹</span>
        </div>
        <div id="controllerStatus">🎮 未接続</div>
    </div>
    <div class="hint">【操作】←→移動 / ↑ジャンプ / ↓足元を掘る / クリックで周囲を掘る / Z攻撃 / Xポーション</div>
</div>

<div id="victoryOverlay">
    <div class="title">🎉 GRT+ 発見！</div>
    <div class="sub">データベースの王将、おめでとうございます！</div>
    <button class="btn-go" id="goToBattery">⚡ バッテリー情報へ進む</button>
    <div class="stats" id="victoryStats">採掘: 0 ブロック | 撃破: 0 体</div>
</div>

<script>
// ============================================
// アリの巣モード - 地下洞窟に敵が密集
// ============================================

var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');

var W = 800, H = 500;
var BW = 20;
var COLS = 60, ROWS = 50;

var world = [];
var player = { x: 5, y: 14 };
var camera = { x: 0, y: 0 };
var grtFound = false;
var blockCount = 0;
var killCount = 0;
var enemies = [];
var particles = [];
var moveDir = null;
var isJumping = false;
var vy = 0;
var onGround = false;
var playerHp = 10;
var maxHp = 10;
var invincible = 0;
var attackCooldown = 0;
var selectedItem = 'pickaxe';
var hpPotions = 3;
var lastMouseX = 0;
var lastMouseY = 0;

// ---- ワールド生成（アリの巣） ----
function createWorld() {
    // 空の世界
    for (var r = 0; r < ROWS; r++) {
        world[r] = [];
        for (var c = 0; c < COLS; c++) {
            world[r][c] = 0;
        }
    }
    
    // 地面（地表〜地下）
    for (var x = 0; x < COLS; x++) {
        var h = 15 + Math.floor(Math.random() * 4);
        for (var y = h; y < ROWS; y++) {
            if (y === h) world[y][x] = 2;
            else if (y < h + 3) world[y][x] = 1;
            else world[y][x] = 3;
        }
    }
    
    // 木
    for (var i = 0; i < 8; i++) {
        var tx = 3 + Math.floor(Math.random() * (COLS - 6));
        var ty = 14 + Math.floor(Math.random() * 3);
        if (world[ty] && world[ty][tx] === 2) {
            for (var h = 0; h < 4; h++) {
                if (ty - h >= 0) world[ty - h][tx] = 4;
            }
        }
    }
    
    // ★★★ アリの巣（地下洞窟）を生成 ★★★
    var nestCount = 8 + Math.floor(Math.random() * 6); // 8〜14個の巣
    var nestPositions = [];
    
    for (var n = 0; n < nestCount; n++) {
        // 地下深くに巣を作る（Y: 22〜42）
        var cx = 5 + Math.floor(Math.random() * (COLS - 10));
        var cy = 22 + Math.floor(Math.random() * 20);
        var radius = 3 + Math.floor(Math.random() * 4); // 巣の大きさ
        
        // 巣の中心を記録（後で敵を配置するため）
        nestPositions.push({ x: cx, y: cy });
        
        // 巣の空洞を作る（円形に掘る）
        for (var dy = -radius; dy <= radius; dy++) {
            for (var dx = -radius; dx <= radius; dx++) {
                if (dx*dx + dy*dy < radius*radius) {
                    var nx = cx + dx;
                    var ny = cy + dy;
                    if (nx > 1 && nx < COLS-1 && ny > 1 && ny < ROWS-1) {
                        // 地下の石や土を掘って空洞にする
                        if (world[ny][nx] === 3 || world[ny][nx] === 1) {
                            world[ny][nx] = 0;
                        }
                    }
                }
            }
        }
        
        // 巣と巣をつなぐトンネル（隣の巣と接続）
        if (n > 0) {
            var prev = nestPositions[n-1];
            // 直線的にトンネルを掘る
            var steps = 20;
            for (var s = 0; s < steps; s++) {
                var t = s / steps;
                var tx = Math.floor(prev.x + (cx - prev.x) * t);
                var ty = Math.floor(prev.y + (cy - prev.y) * t);
                if (tx > 1 && tx < COLS-1 && ty > 1 && ty < ROWS-1) {
                    if (world[ty][tx] === 3 || world[ty][tx] === 1) {
                        world[ty][tx] = 0;
                    }
                    // トンネルを少し太く
                    for (var ddx = -1; ddx <= 1; ddx++) {
                        for (var ddy = -1; ddy <= 1; ddy++) {
                            var nx2 = tx + ddx;
                            var ny2 = ty + ddy;
                            if (nx2 > 1 && nx2 < COLS-1 && ny2 > 1 && ny2 < ROWS-1) {
                                if (world[ny2][nx2] === 3 || world[ny2][nx2] === 1) {
                                    world[ny2][nx2] = 0;
                                }
                            }
                        }
                    }
                }
            }
        }
    }
    
    // ★★★ GRTを地下深くの巣の近くに配置 ★★★
    var grtPlaced = false;
    for (var attempts = 0; attempts < 300 && !grtPlaced; attempts++) {
        var gx = 5 + Math.floor(Math.random() * (COLS - 10));
        var gy = 25 + Math.floor(Math.random() * (ROWS - 30));
        // 洞窟の近く（空気ブロックの隣の石）に配置
        if (world[gy] && world[gy][gx] === 3) {
            // 周囲に空気があるか確認（洞窟の隣）
            var hasAir = false;
            for (var ddx = -1; ddx <= 1 && !hasAir; ddx++) {
                for (var ddy = -1; ddy <= 1 && !hasAir; ddy++) {
                    if (ddx === 0 && ddy === 0) continue;
                    var nx = gx + ddx;
                    var ny = gy + ddy;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && world[ny][nx] === 0) {
                        hasAir = true;
                    }
                }
            }
            if (hasAir) {
                world[gy][gx] = 6;
                grtPlaced = true;
            }
        }
    }
    if (!grtPlaced) {
        world[30][20] = 6;
    }
    
    // ★★★ 敵を巣の中に大量配置 ★★★
    var enemyTotal = 50 + Math.floor(Math.random() * 40); // 50〜90匹
    
    for (var i = 0; i < enemyTotal; i++) {
        // 巣の位置をランダムに選ぶ
        var nest = nestPositions[Math.floor(Math.random() * nestPositions.length)];
        // 巣の周辺に配置（半径5以内）
        var ex = nest.x + Math.floor(Math.random() * 10) - 5;
        var ey = nest.y + Math.floor(Math.random() * 10) - 5;
        
        // 空気ブロックかつ、下が固体なら配置可能
        if (ex >= 1 && ex < COLS-1 && ey >= 1 && ey < ROWS-1) {
            if (world[ey][ex] === 0 && world[ey+1] && world[ey+1][ex] !== 0) {
                enemies.push({
                    x: ex, y: ey,
                    hp: 2 + Math.floor(Math.random() * 2),
                    maxHp: 4,
                    timer: Math.random() * 100,
                    dir: Math.random() > 0.5 ? 1 : -1,
                    speed: 0.3 + Math.random() * 0.6
                });
            }
        }
    }
    
    // 地上にも少量の敵（アリが地上に出てくるイメージ）
    for (var i = 0; i < 8; i++) {
        var ex = 3 + Math.floor(Math.random() * (COLS - 6));
        var ey = 12 + Math.floor(Math.random() * 4);
        if (world[ey] && world[ey][ex] === 0 && world[ey+1] && world[ey+1][ex] !== 0) {
            enemies.push({
                x: ex, y: ey,
                hp: 2,
                maxHp: 3,
                timer: Math.random() * 100,
                dir: Math.random() > 0.5 ? 1 : -1,
                speed: 0.4 + Math.random() * 0.4
            });
        }
    }
    
    // プレイヤー位置（地上）
    player.x = 5;
    player.y = 14;
    while (player.y < ROWS && world[player.y][player.x] === 0) player.y++;
    player.y--;
}

// ---- ブロック判定 ----
function isSolid(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
    return world[y][x] !== 0 && world[y][x] !== 6;
}

// ---- 物理更新 ----
function updatePhysics() {
    // 移動
    if (moveDir === 'left') {
        var nx = player.x - 1;
        if (nx >= 0 && !isSolid(nx, player.y)) {
            if (!isSolid(nx, player.y + 1)) {
                player.x = nx;
                player.y = player.y + 1;
            } else if (!isSolid(nx, player.y)) {
                player.x = nx;
            }
        }
        moveDir = null;
    }
    if (moveDir === 'right') {
        var nx = player.x + 1;
        if (nx < COLS && !isSolid(nx, player.y)) {
            if (!isSolid(nx, player.y + 1)) {
                player.x = nx;
                player.y = player.y + 1;
            } else if (!isSolid(nx, player.y)) {
                player.x = nx;
            }
        }
        moveDir = null;
    }
    
    // ジャンプ
    if (isJumping && onGround) {
        vy = -3.2;
        onGround = false;
        isJumping = false;
    }
    
    vy += 0.4;
    if (vy > 3) vy = 3;
    
    var ny = player.y + vy;
    if (isSolid(player.x, Math.floor(ny + 0.5))) {
        if (vy > 0) { vy = 0; onGround = true; }
    } else if (ny >= 0 && ny < ROWS) {
        player.y = Math.floor(ny + 0.5);
        onGround = false;
    }
    
    // GRTチェック
    if (!grtFound && world[player.y] && world[player.y][player.x] === 6) {
        grtFound = true;
        world[player.y][player.x] = 0;
        showVictory();
    }
    
    if (attackCooldown > 0) attackCooldown--;
    if (invincible > 0) invincible--;
    
    // ★ 敵AI（アリのように動く）
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        e.timer++;
        
        var dx = player.x - e.x;
        var dy = player.y - e.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        
        // プレイヤーが近くに来たら追跡
        if (dist < 10) {
            var moveX = 0;
            if (Math.abs(dx) > 0.5) {
                moveX = dx > 0 ? 1 : -1;
            }
            var nx = e.x + moveX;
            if (nx >= 0 && nx < COLS && !isSolid(nx, e.y) && isSolid(nx, e.y+1)) {
                e.x = nx;
            } else if (!isSolid(nx, e.y)) {
                e.x = nx;
            }
            
            // 攻撃
            if (dist < 1.2 && e.timer % 25 === 0) {
                if (invincible === 0) {
                    playerHp--;
                    invincible = 25;
                    if (playerHp <= 0) {
                        playerHp = maxHp;
                        player.x = 5;
                        player.y = 14;
                        while (player.y < ROWS && world[player.y][player.x] === 0) player.y++;
                        player.y--;
                    }
                    updateUI();
                }
            }
        } else {
            // 巣の中でランダムに動く
            if (e.timer % 70 === 0) e.dir = Math.random() > 0.5 ? 1 : -1;
            var nx = e.x + e.dir;
            if (nx >= 0 && nx < COLS && !isSolid(nx, e.y) && isSolid(nx, e.y+1)) {
                e.x = nx;
            }
        }
    }
    
    // カメラ
    var tx = player.x * BW + BW/2 - W/2;
    var ty = player.y * BW + BW/2 - H/2;
    camera.x += (tx - camera.x) * 0.1;
    camera.y += (ty - camera.y) * 0.1;
    camera.x = Math.max(0, Math.min(COLS * BW - W, camera.x));
    camera.y = Math.max(0, Math.min(ROWS * BW - H, camera.y));
    
    document.getElementById('enemyCounter').textContent = '🐜 ' + enemies.length;
}

// ---- 描画 ----
function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    var sx = Math.floor(camera.x / BW);
    var sy = Math.floor(camera.y / BW);
    var ex = Math.ceil((camera.x + W) / BW) + 1;
    var ey = Math.ceil((camera.y + H) / BW) + 1;
    
    for (var r = sy; r < ey && r < ROWS; r++) {
        for (var c = sx; c < ex && c < COLS; c++) {
            var type = world[r][c];
            if (type === 0) continue;
            var x = c * BW - camera.x;
            var y = r * BW - camera.y;
            
            switch(type) {
                case 1: ctx.fillStyle = '#8D6E63'; break;
                case 2: ctx.fillStyle = '#7CB342'; break;
                case 3: ctx.fillStyle = '#9E9E9E'; break;
                case 4: ctx.fillStyle = '#A1887F'; break;
                case 6: 
                    ctx.fillStyle = '#B8860B';
                    ctx.fillRect(x, y, BW-1, BW-1);
                    ctx.fillStyle = 'rgba(255,215,0,0.3)';
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(x+2, y+2, BW-5, BW-5);
                    ctx.shadowBlur = 0;
                    continue;
                default: ctx.fillStyle = '#888';
            }
            ctx.fillRect(x, y, BW-1, BW-1);
        }
    }
    
    // ★ 敵（アリ）
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        var ex = e.x * BW - camera.x;
        var ey = e.y * BW - camera.y;
        
        // 体
        ctx.fillStyle = '#D32F2F';
        ctx.shadowColor = 'rgba(211,47,47,0.3)';
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.ellipse(ex + BW/2, ey + BW - 2, 7, 5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 目
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(ex + BW/2 - 3, ey + BW - 5, 2, 0, Math.PI*2);
        ctx.arc(ex + BW/2 + 3, ey + BW - 5, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(ex + BW/2 - 3 + (e.dir > 0 ? 1 : -1), ey + BW - 4, 1, 0, Math.PI*2);
        ctx.arc(ex + BW/2 + 3 + (e.dir > 0 ? 1 : -1), ey + BW - 4, 1, 0, Math.PI*2);
        ctx.fill();
        
        // HPバー
        if (e.hp < e.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(ex + 2, ey - 4, BW - 4, 3);
            ctx.fillStyle = '#ff1744';
            ctx.fillRect(ex + 2, ey - 4, (BW - 4) * (e.hp / e.maxHp), 3);
        }
    }
    
    // プレイヤー
    var px = player.x * BW - camera.x;
    var py = player.y * BW - camera.y;
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px + BW/2, py + BW - 2, 7, 3, 0, 0, Math.PI*2);
    ctx.fill();
    
    if (!(invincible > 0 && invincible % 6 < 3)) {
        ctx.fillStyle = '#FF6B6B';
        ctx.shadowColor = 'rgba(255,107,107,0.2)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(px + BW/2, py + BW/2 - 2, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px + 5, py + 4);
    ctx.lineTo(px + BW/2, py - 2);
    ctx.lineTo(px + BW - 5, py + 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#FF1744';
    ctx.beginPath();
    ctx.arc(px + BW/2, py - 1, 2, 0, Math.PI*2);
    ctx.fill();
    
    // ミニマップ
    drawMinimap();
}

function drawMinimap() {
    var size = 60;
    var mx = W - size - 10;
    var my = 10;
    var sc = size / Math.max(COLS, ROWS);
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(mx - 2, my - 2, size + 4, size + 4);
    ctx.fillStyle = 'rgba(20,20,40,0.8)';
    ctx.fillRect(mx, my, size, size);
    
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            if (world[r][c] !== 0) {
                var col = world[r][c] === 6 ? '#FFD700' : 
                         world[r][c] === 2 ? '#4CAF50' : 
                         world[r][c] === 1 ? '#8D6E63' : '#9E9E9E';
                ctx.globalAlpha = world[r][c] === 6 ? 1 : 0.3;
                ctx.fillStyle = col;
                ctx.fillRect(mx + c * sc, my + r * sc, Math.ceil(sc), Math.ceil(sc));
                ctx.globalAlpha = 1;
            }
        }
    }
    
    // 敵を赤点で表示
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        ctx.fillStyle = '#FF1744';
        ctx.globalAlpha = 0.6;
        ctx.fillRect(mx + e.x * sc, my + e.y * sc, Math.ceil(sc), Math.ceil(sc));
        ctx.globalAlpha = 1;
    }
    
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath();
    ctx.arc(mx + player.x * sc + sc/2, my + player.y * sc + sc/2, 2, 0, Math.PI*2);
    ctx.fill();
}

// ---- 掘る ----
function digBlock() {
    if (grtFound) return;
    if (selectedItem !== 'pickaxe') return;
    
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var mx = (lastMouseX - rect.left) * scaleX;
    var my = (lastMouseY - rect.top) * scaleY;
    
    var worldX = Math.floor((mx + camera.x) / BW);
    var worldY = Math.floor((my + camera.y) / BW);
    
    if (worldX < 0 || worldX >= COLS || worldY < 0 || worldY >= ROWS) return;
    
    var distX = Math.abs(worldX - player.x);
    var distY = Math.abs(worldY - player.y);
    if (distX > 1 || distY > 1) return;
    
    var block = world[worldY][worldX];
    if (block === 0 || block === 6) return;
    
    world[worldY][worldX] = 0;
    blockCount++;
    updateUI();
}

function digDown() {
    if (grtFound) return;
    if (selectedItem !== 'pickaxe') return;
    
    var px = player.x;
    var py = player.y + 1;
    
    if (px < 0 || px >= COLS || py < 0 || py >= ROWS) return;
    if (world[py][px] === 0 || world[py][px] === 6) return;
    
    world[py][px] = 0;
    blockCount++;
    player.y = py;
    updateUI();
}

// ---- 攻撃 ----
function attackEnemy() {
    if (attackCooldown > 0 || grtFound) return;
    if (selectedItem !== 'sword') return;
    
    attackCooldown = 12;
    
    var hitCount = 0;
    for (var i = enemies.length - 1; i >= 0; i--) {
        var e = enemies[i];
        if (Math.abs(e.x - player.x) <= 1.5 && Math.abs(e.y - player.y) <= 1.5) {
            e.hp -= 2;
            if (e.hp <= 0) {
                enemies.splice(i, 1);
                killCount++;
                blockCount += 2;
                hitCount++;
                updateUI();
            }
        }
    }
    if (hitCount > 0) {
        for (var p = 0; p < 10; p++) {
            particles.push({
                x: player.x * BW + BW/2 + (Math.random() - 0.5) * 20,
                y: player.y * BW + BW/2 + (Math.random() - 0.5) * 20,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4 - 2,
                life: 20 + Math.random() * 10,
                maxLife: 30,
                size: 2 + Math.random() * 3,
                color: '#FF1744'
            });
        }
    }
}

// ---- ポーション ----
function usePotion() {
    if (hpPotions > 0 && playerHp < maxHp) {
        hpPotions--;
        playerHp = Math.min(playerHp + 4, maxHp);
        updateUI();
        for (var p = 0; p < 15; p++) {
            particles.push({
                x: player.x * BW + BW/2 + (Math.random() - 0.5) * 20,
                y: player.y * BW + BW/2 + (Math.random() - 0.5) * 20,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3 - 3,
                life: 30 + Math.random() * 20,
                maxLife: 50,
                size: 3 + Math.random() * 4,
                color: '#FFD700'
            });
        }
    }
}

// ---- UI更新 ----
function updateUI() {
    document.getElementById('hpText').textContent = playerHp + '/' + maxHp;
    document.getElementById('hpFill').style.width = (playerHp / maxHp * 100) + '%';
    document.getElementById('blockCounter').textContent = '🧱 ' + blockCount;
    document.getElementById('scoreDisplay').textContent = '💀 ' + killCount;
    document.getElementById('enemyCounter').textContent = '🐜 ' + enemies.length;
    
    var map = { pickaxe: 'invPick', sword: 'invSword', potion: 'invPotion' };
    document.querySelectorAll('#inventory span').forEach(function(el) { el.className = ''; });
    if (map[selectedItem]) document.getElementById(map[selectedItem]).className = 'active';
    
    var el = document.getElementById('grtCounter');
    if (grtFound) { el.textContent = 'GRT+'; el.className = 'found'; }
    else { el.textContent = 'GRT-'; el.className = ''; }
}

// ---- 勝利 ----
function showVictory() {
    document.getElementById('victoryStats').textContent = '採掘: ' + blockCount + ' ブロック | 撃破: ' + killCount + ' 体';
    document.getElementById('victoryOverlay').style.display = 'flex';
    updateUI();
}

// ---- ゲームループ ----
function gameLoop() {
    updatePhysics();
    
    // パーティクル更新
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    draw();
    
    // パーティクル描画
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y - camera.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    requestAnimationFrame(gameLoop);
}

// ---- イベント設定 ----
canvas.addEventListener('mousemove', function(e) {
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

canvas.addEventListener('click', function(e) {
    digBlock();
});

document.addEventListener('keydown', function(e) {
    if (grtFound) return;
    switch(e.key) {
        case 'ArrowLeft': moveDir = 'left'; e.preventDefault(); break;
        case 'ArrowRight': moveDir = 'right'; e.preventDefault(); break;
        case 'ArrowUp': isJumping = true; e.preventDefault(); break;
        case 'ArrowDown': digDown(); e.preventDefault(); break;
        case 'z': case 'Z': attackEnemy(); e.preventDefault(); break;
        case 'x': case 'X': usePotion(); e.preventDefault(); break;
        case '1': selectedItem = 'pickaxe'; updateUI(); break;
        case '2': selectedItem = 'sword'; updateUI(); break;
        case '3': selectedItem = 'potion'; updateUI(); break;
    }
});
document.addEventListener('keyup', function(e) {
    switch(e.key) {
        case 'ArrowLeft': if (moveDir === 'left') moveDir = null; break;
        case 'ArrowRight': if (moveDir === 'right') moveDir = null; break;
        case 'ArrowUp': isJumping = false; break;
    }
});

document.getElementById('attackBtn').addEventListener('click', function(e) {
    e.preventDefault();
    attackEnemy();
});

document.getElementById('scrollUp').addEventListener('mousedown', function(e) {
    e.preventDefault();
    camera.y -= 30;
    camera.y = Math.max(0, camera.y);
});
document.getElementById('scrollDown').addEventListener('mousedown', function(e) {
    e.preventDefault();
    camera.y += 30;
    camera.y = Math.min(ROWS * BW - H, camera.y);
});

document.getElementById('goToBattery').addEventListener('click', function() {
    window.location.href = 'battery.html';
});

document.querySelectorAll('#inventory span').forEach(function(el) {
    el.addEventListener('click', function() {
        var map = { invPick: 'pickaxe', invSword: 'sword', invPotion: 'potion' };
        if (map[this.id]) { selectedItem = map[this.id]; updateUI(); }
    });
});

// ---- コントローラー ----
function updateGamepad() {
    var gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
    if (gp) {
        document.getElementById('controllerStatus').textContent = '🎮 接続中';
        document.getElementById('controllerStatus').style.borderColor = '#4CAF50';
        
        var deadZone = 0.2;
        var ax = gp.axes[0] || 0;
        var ay = gp.axes[1] || 0;
        
        if (Math.abs(ax) > deadZone) {
            moveDir = ax < 0 ? 'left' : 'right';
        } else if (moveDir === 'left' || moveDir === 'right') {
            moveDir = null;
        }
        
        if (ay > deadZone) { digDown(); }
        if (gp.buttons[0] && gp.buttons[0].pressed) { isJumping = true; }
        if (gp.buttons[2] && gp.buttons[2].pressed) { attackEnemy(); }
        if (gp.buttons[3] && gp.buttons[3].pressed) { usePotion(); }
        if (gp.buttons[4] && gp.buttons[4].pressed) { selectedItem = 'pickaxe'; updateUI(); }
        if (gp.buttons[5] && gp.buttons[5].pressed) { selectedItem = 'sword'; updateUI(); }
    } else {
        document.getElementById('controllerStatus').textContent = '🎮 未接続';
        document.getElementById('controllerStatus').style.borderColor = '#f44336';
    }
    requestAnimationFrame(updateGamepad);
}

// ---- 起動 ----
createWorld();
updateUI();
gameLoop();
updateGamepad();

console.log('🐜 アリの巣モード！地下洞窟に敵が密集');
console.log('←→移動 / ↑ジャンプ / ↓足元を掘る / クリックで周囲を掘る / Z攻撃 / Xポーション');
</script>
