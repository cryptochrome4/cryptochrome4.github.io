<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GRT- テラリア風</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        #gameWrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #0f3460;
        }
        #canvasContainer {
            position: relative;
            width: 800px;
            height: 500px;
            border: 4px solid #533483;
            border-radius: 8px;
            background: #1a1a2e;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            image-rendering: pixelated;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 4px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(45, 45, 68, 0.85);
            border: 2px solid #6a4c93;
            color: white;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            line-height: 60px;
            font-weight: bold;
            box-shadow: 0 3px 0 rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: none; }
        .ctrl-btn.attack {
            background: rgba(255, 50, 50, 0.4);
            border-color: #FF1744;
            color: #FF1744;
            font-size: 14px;
        }
        .ctrl-btn.scroll-up {
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
        }
        .ctrl-btn.scroll-down {
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        #grtCounter {
            color: #ff6b6b;
            font-size: 20px;
            background: #1a0a0a;
            padding: 6px 24px;
            border-radius: 30px;
            border: 2px solid #ff6b6b;
            font-weight: bold;
        }
        #grtCounter.found {
            color: #FFD700;
            border-color: #FFD700;
            background: #1a1a0a;
        }
        #blockCounter {
            color: #88CCFF;
            font-size: 16px;
            background: #0d0d1a;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #88CCFF;
        }
        #hpBar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff6b6b;
            font-size: 14px;
        }
        #hpBar .bar {
            width: 120px;
            height: 12px;
            background: #2a1a1a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ff6b6b;
        }
        #hpBar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ff1744, #ff6b6b);
            transition: width 0.3s;
            width: 100%;
        }
        #inventory {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        #inventory span {
            color: #aaa;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
        }
        #inventory .active {
            color: #FFD700;
            border: 1px solid #FFD700;
            background: rgba(255,215,0,0.1);
        }
        .hint {
            color: #8899aa;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }
        #scoreDisplay {
            color: #4FC3F7;
            font-size: 14px;
        }
        #controllerStatus {
            color: #4CAF50;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #4CAF50;
            background: rgba(76,175,80,0.1);
        }
        #victoryOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        #victoryOverlay .title {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        #victoryOverlay .sub {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }
        #victoryOverlay .btn-go {
            padding: 16px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #FFD700, #FFA000);
            border: none;
            border-radius: 50px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
        }
        #victoryOverlay .stats {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <canvas id="canvas" width="800" height="500"></canvas>
        <div id="controls">
            <div class="ctrl-btn attack" id="attackBtn">⚔️</div>
            <div class="ctrl-btn scroll-up" id="scrollUp">▲▲</div>
            <div class="ctrl-btn scroll-down" id="scrollDown">▼▼</div>
        </div>
    </div>
    <div id="ui">
        <div id="hpBar">❤️ <span id="hpText">10/10</span><div class="bar"><div class="fill" id="hpFill"></div></div></div>
        <div id="blockCounter">🧱 0</div>
        <div id="grtCounter">GRT-</div>
        <div id="scoreDisplay">💀 0</div>
        <div id="inventory">
            <span class="active" id="invPick">⛏️</span>
            <span id="invSword">🗡️</span>
            <span id="invPotion">❤️‍🩹</span>
        </div>
        <div id="controllerStatus">🎮 未接続</div>
    </div>
    <div class="hint">【操作】矢印キー移動 / ジャンプ↑ / 攻撃Z / クリックで掘る / ポーションX</div>
</div>

<div id="victoryOverlay">
    <div class="title">🎉 GRT+ 発見！</div>
    <div class="sub">データベースの王将、おめでとうございます！</div>
    <button class="btn-go" id="goToBattery">⚡ バッテリー情報へ進む</button>
    <div class="stats" id="victoryStats">採掘: 0 ブロック | 撃破: 0 体</div>
</div>

<script>
// ============================================
// シンプルで確実に動くゲーム
// ============================================

// ---- キャンバス取得 ----
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');

// ---- 定数 ----
var W = 800, H = 500;
var BW = 20; // ブロックサイズ
var COLS = 60, ROWS = 50;

// ---- ゲーム状態 ----
var world = [];
var player = { x: 5, y: 14 };
var camera = { x: 0, y: 0 };
var grtFound = false;
var blockCount = 0;
var killCount = 0;
var enemies = [];
var particles = [];
var moveDir = null;
var isJumping = false;
var vy = 0;
var onGround = false;
var playerHp = 10;
var maxHp = 10;
var invincible = 0;
var attackCooldown = 0;
var selectedItem = 'pickaxe';
var hpPotions = 3;

// ---- ワールド生成 ----
function createWorld() {
    // 空の世界
    for (var r = 0; r < ROWS; r++) {
        world[r] = [];
        for (var c = 0; c < COLS; c++) {
            world[r][c] = 0;
        }
    }
    
    // 地面
    for (var x = 0; x < COLS; x++) {
        var h = 15 + Math.floor(Math.random() * 5);
        for (var y = h; y < ROWS; y++) {
            if (y === h) world[y][x] = 2; // 草
            else if (y < h + 4) world[y][x] = 1; // 土
            else world[y][x] = 3; // 石
        }
    }
    
    // 木
    for (var i = 0; i < 10; i++) {
        var tx = 5 + Math.floor(Math.random() * (COLS - 10));
        var ty = 14 + Math.floor(Math.random() * 4);
        if (world[ty] && world[ty][tx] === 2) {
            for (var h = 0; h < 4; h++) {
                if (ty - h >= 0) world[ty - h][tx] = 4;
            }
        }
    }
    
    // GRTを配置（必ず見つかる位置）
    world[24][15] = 6;
    
    // 敵
    for (var i = 0; i < 6; i++) {
        var ex = 8 + Math.floor(Math.random() * (COLS - 16));
        var ey = 20 + Math.floor(Math.random() * 10);
        if (world[ey] && world[ey][ex] === 0 && world[ey+1] && world[ey+1][ex] !== 0) {
            enemies.push({ x: ex, y: ey, hp: 3, maxHp: 3, timer: 0, dir: 1 });
        }
    }
    
    // プレイヤー位置
    player.x = 5;
    player.y = 14;
    while (player.y < ROWS && world[player.y][player.x] === 0) player.y++;
    player.y--;
}

// ---- ブロック判定 ----
function isSolid(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
    return world[y][x] !== 0 && world[y][x] !== 6;
}

// ---- 物理更新 ----
function updatePhysics() {
    // 移動
    if (moveDir === 'left') {
        var nx = player.x - 1;
        if (nx >= 0 && !isSolid(nx, player.y)) {
            if (!isSolid(nx, player.y + 1)) {
                player.x = nx;
                player.y = player.y + 1;
            } else if (!isSolid(nx, player.y)) {
                player.x = nx;
            }
        }
        moveDir = null;
    }
    if (moveDir === 'right') {
        var nx = player.x + 1;
        if (nx < COLS && !isSolid(nx, player.y)) {
            if (!isSolid(nx, player.y + 1)) {
                player.x = nx;
                player.y = player.y + 1;
            } else if (!isSolid(nx, player.y)) {
                player.x = nx;
            }
        }
        moveDir = null;
    }
    
    // ジャンプ
    if (isJumping && onGround) {
        vy = -3;
        onGround = false;
        isJumping = false;
    }
    
    // 重力
    vy += 0.4;
    if (vy > 3) vy = 3;
    
    var ny = player.y + vy;
    if (isSolid(player.x, Math.floor(ny + 0.5))) {
        if (vy > 0) {
            vy = 0;
            onGround = true;
        }
    } else if (ny >= 0 && ny < ROWS) {
        player.y = Math.floor(ny + 0.5);
        onGround = false;
    }
    
    // GRTチェック
    if (!grtFound && world[player.y] && world[player.y][player.x] === 6) {
        grtFound = true;
        world[player.y][player.x] = 0;
        showVictory();
    }
    
    // 攻撃クールダウン
    if (attackCooldown > 0) attackCooldown--;
    if (invincible > 0) invincible--;
    
    // 敵AI
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        e.timer++;
        var dx = player.x - e.x;
        var dy = player.y - e.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < 8) {
            if (e.timer % 20 < 10) {
                var nx = e.x + (dx > 0 ? 1 : -1);
                if (nx >= 0 && nx < COLS && !isSolid(nx, e.y) && isSolid(nx, e.y+1)) {
                    e.x = nx;
                }
            }
            if (dist < 1.2 && e.timer % 30 === 0) {
                if (invincible === 0) {
                    playerHp--;
                    invincible = 30;
                    if (playerHp <= 0) {
                        playerHp = maxHp;
                        player.x = 5;
                        player.y = 14;
                        while (player.y < ROWS && world[player.y][player.x] === 0) player.y++;
                        player.y--;
                    }
                    updateUI();
                }
            }
        } else {
            if (e.timer % 60 === 0) e.dir = Math.random() > 0.5 ? 1 : -1;
            var nx = e.x + e.dir;
            if (nx >= 0 && nx < COLS && !isSolid(nx, e.y) && isSolid(nx, e.y+1)) {
                e.x = nx;
            }
        }
    }
    
    // カメラ
    var tx = player.x * BW + BW/2 - W/2;
    var ty = player.y * BW + BW/2 - H/2;
    camera.x += (tx - camera.x) * 0.1;
    camera.y += (ty - camera.y) * 0.1;
    camera.x = Math.max(0, Math.min(COLS * BW - W, camera.x));
    camera.y = Math.max(0, Math.min(ROWS * BW - H, camera.y));
}

// ---- 描画 ----
function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // 背景
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    var sx = Math.floor(camera.x / BW);
    var sy = Math.floor(camera.y / BW);
    var ex = Math.ceil((camera.x + W) / BW) + 1;
    var ey = Math.ceil((camera.y + H) / BW) + 1;
    
    // ブロック
    for (var r = sy; r < ey && r < ROWS; r++) {
        for (var c = sx; c < ex && c < COLS; c++) {
            var type = world[r][c];
            if (type === 0) continue;
            var x = c * BW - camera.x;
            var y = r * BW - camera.y;
            
            switch(type) {
                case 1: ctx.fillStyle = '#8D6E63'; break;
                case 2: ctx.fillStyle = '#7CB342'; break;
                case 3: ctx.fillStyle = '#9E9E9E'; break;
                case 4: ctx.fillStyle = '#A1887F'; break;
                case 6: 
                    ctx.fillStyle = '#B8860B';
                    ctx.fillRect(x, y, BW-1, BW-1);
                    ctx.fillStyle = 'rgba(255,215,0,0.3)';
                    ctx.fillRect(x+2, y+2, BW-5, BW-5);
                    continue;
                default: ctx.fillStyle = '#888';
            }
            ctx.fillRect(x, y, BW-1, BW-1);
        }
    }
    
    // 敵
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        var ex = e.x * BW - camera.x;
        var ey = e.y * BW - camera.y;
        ctx.fillStyle = '#4CAF50';
        ctx.beginPath();
        ctx.ellipse(ex + BW/2, ey + BW - 2, 8, 6, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#2E7D32';
        ctx.beginPath();
        ctx.arc(ex + BW/2 - 4, ey + BW - 6, 3, 0, Math.PI*2);
        ctx.arc(ex + BW/2 + 4, ey + BW - 6, 3, 0, Math.PI*2);
        ctx.fill();
        if (e.hp < e.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(ex + 2, ey - 4, BW - 4, 3);
            ctx.fillStyle = '#ff1744';
            ctx.fillRect(ex + 2, ey - 4, (BW - 4) * (e.hp / e.maxHp), 3);
        }
    }
    
    // プレイヤー
    var px = player.x * BW - camera.x;
    var py = player.y * BW - camera.y;
    
    // 影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px + BW/2, py + BW - 2, 7, 3, 0, 0, Math.PI*2);
    ctx.fill();
    
    // 体
    if (!(invincible > 0 && invincible % 6 < 3)) {
        ctx.fillStyle = '#FF6B6B';
        ctx.beginPath();
        ctx.arc(px + BW/2, py + BW/2 - 2, 7, 0, Math.PI*2);
        ctx.fill();
    }
    
    // 王冠
    ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px + 5, py + 4);
    ctx.lineTo(px + BW/2, py - 2);
    ctx.lineTo(px + BW - 5, py + 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#FF1744';
    ctx.beginPath();
    ctx.arc(px + BW/2, py - 1, 2, 0, Math.PI*2);
    ctx.fill();
    
    // ミニマップ
    drawMinimap();
}

function drawMinimap() {
    var size = 60;
    var mx = W - size - 10;
    var my = 10;
    var sc = size / Math.max(COLS, ROWS);
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(mx - 2, my - 2, size + 4, size + 4);
    ctx.fillStyle = 'rgba(20,20,40,0.8)';
    ctx.fillRect(mx, my, size, size);
    
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            if (world[r][c] !== 0) {
                var col = world[r][c] === 6 ? '#FFD700' : 
                         world[r][c] === 2 ? '#4CAF50' : 
                         world[r][c] === 1 ? '#8D6E63' : '#9E9E9E';
                ctx.globalAlpha = world[r][c] === 6 ? 1 : 0.3;
                ctx.fillStyle = col;
                ctx.fillRect(mx + c * sc, my + r * sc, Math.ceil(sc), Math.ceil(sc));
                ctx.globalAlpha = 1;
            }
        }
    }
    
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath();
    ctx.arc(mx + player.x * sc + sc/2, my + player.y * sc + sc/2, 2, 0, Math.PI*2);
    ctx.fill();
}

// ---- 掘る ----
function digBlock() {
    if (grtFound) return;
    var px = player.x;
    var py = player.y + 1;
    if (py >= 0 && py < ROWS && world[py] && world[py][px] !== 0 && world[py][px] !== 6) {
        world[py][px] = 0;
        blockCount++;
        updateUI();
    }
}

// ---- 攻撃 ----
function attackEnemy() {
    if (attackCooldown > 0 || grtFound) return;
    attackCooldown = 15;
    
    for (var i = enemies.length - 1; i >= 0; i--) {
        var e = enemies[i];
        if (Math.abs(e.x - player.x) <= 1.5 && Math.abs(e.y - player.y) <= 1.5) {
            e.hp -= 2;
            if (e.hp <= 0) {
                enemies.splice(i, 1);
                killCount++;
                blockCount += 2;
                updateUI();
            }
        }
    }
}

// ---- UI更新 ----
function updateUI() {
    document.getElementById('hpText').textContent = playerHp + '/' + maxHp;
    document.getElementById('hpFill').style.width = (playerHp / maxHp * 100) + '%';
    document.getElementById('blockCounter').textContent = '🧱 ' + blockCount;
    document.getElementById('scoreDisplay').textContent = '💀 ' + killCount;
    
    var map = { pickaxe: 'invPick', sword: 'invSword', potion: 'invPotion' };
    document.querySelectorAll('#inventory span').forEach(function(el) { el.className = ''; });
    if (map[selectedItem]) document.getElementById(map[selectedItem]).className = 'active';
    
    var el = document.getElementById('grtCounter');
    if (grtFound) { el.textContent = 'GRT+'; el.className = 'found'; }
    else { el.textContent = 'GRT-'; el.className = ''; }
}

// ---- 勝利 ----
function showVictory() {
    document.getElementById('victoryStats').textContent = '採掘: ' + blockCount + ' ブロック | 撃破: ' + killCount + ' 体';
    document.getElementById('victoryOverlay').style.display = 'flex';
    updateUI();
}

// ---- ゲームループ ----
function gameLoop() {
    updatePhysics();
    draw();
    requestAnimationFrame(gameLoop);
}

// ---- イベント設定 ----
// キーボード
document.addEventListener('keydown', function(e) {
    if (grtFound) return;
    switch(e.key) {
        case 'ArrowLeft': moveDir = 'left'; e.preventDefault(); break;
        case 'ArrowRight': moveDir = 'right'; e.preventDefault(); break;
        case 'ArrowUp': isJumping = true; e.preventDefault(); break;
        case 'z': case 'Z': attackEnemy(); e.preventDefault(); break;
        case 'x': case 'X': 
            if (hpPotions > 0 && playerHp < maxHp) {
                hpPotions--;
                playerHp = Math.min(playerHp + 4, maxHp);
                updateUI();
            }
            e.preventDefault();
            break;
        case '1': selectedItem = 'pickaxe'; updateUI(); break;
        case '2': selectedItem = 'sword'; updateUI(); break;
        case '3': selectedItem = 'potion'; updateUI(); break;
    }
});
document.addEventListener('keyup', function(e) {
    switch(e.key) {
        case 'ArrowLeft': if (moveDir === 'left') moveDir = null; break;
        case 'ArrowRight': if (moveDir === 'right') moveDir = null; break;
        case 'ArrowUp': isJumping = false; break;
    }
});

// ボタン
document.getElementById('attackBtn').addEventListener('click', function(e) {
    e.preventDefault();
    attackEnemy();
});

document.getElementById('scrollUp').addEventListener('mousedown', function(e) {
    e.preventDefault();
    camera.y -= 30;
    camera.y = Math.max(0, camera.y);
});
document.getElementById('scrollDown').addEventListener('mousedown', function(e) {
    e.preventDefault();
    camera.y += 30;
    camera.y = Math.min(ROWS * BW - H, camera.y);
});

document.getElementById('goToBattery').addEventListener('click', function() {
    window.location.href = 'battery.html';
});

// インベントリクリック
document.querySelectorAll('#inventory span').forEach(function(el) {
    el.addEventListener('click', function() {
        var map = { invPick: 'pickaxe', invSword: 'sword', invPotion: 'potion' };
        if (map[this.id]) { selectedItem = map[this.id]; updateUI(); }
    });
});

// ---- 起動 ----
createWorld();
updateUI();
gameLoop();

console.log('🎮 ゲーム起動！矢印キーで移動、Z攻撃、Xポーション');
</script>
</body>
</html>
