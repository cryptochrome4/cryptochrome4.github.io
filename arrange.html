<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GRT- 蜂蟻の巣</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        #gameWrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #0f3460;
        }
        #canvasContainer {
            position: relative;
            width: 800px;
            height: 500px;
            border: 4px solid #533483;
            border-radius: 8px;
            background: #1a1a2e;
            cursor: crosshair;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            image-rendering: pixelated;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 4px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(45, 45, 68, 0.85);
            border: 2px solid #6a4c93;
            color: white;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            line-height: 60px;
            font-weight: bold;
            box-shadow: 0 3px 0 rgba(0,0,0,0.5);
            position: relative;
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: none; }
        .ctrl-btn.attack {
            background: rgba(255, 50, 50, 0.4);
            border-color: #FF1744;
            color: #FF1744;
            font-size: 24px;
        }
        .ctrl-btn.attack.ready {
            background: rgba(255, 50, 50, 0.8);
            box-shadow: 0 0 20px rgba(255,50,50,0.6);
        }
        .ctrl-btn.attack .charge-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #FFD700;
            color: #1a1a2e;
            font-size: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            line-height: 22px;
            font-weight: bold;
            border: 2px solid #1a1a2e;
        }
        .ctrl-btn.scroll-up {
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
        }
        .ctrl-btn.scroll-down {
            background: rgba(100, 200, 255, 0.3);
            border-color: #4FC3F7;
            font-size: 16px;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        #grtCounter {
            color: #ff6b6b;
            font-size: 20px;
            background: #1a0a0a;
            padding: 6px 24px;
            border-radius: 30px;
            border: 2px solid #ff6b6b;
            font-weight: bold;
        }
        #grtCounter.found {
            color: #FFD700;
            border-color: #FFD700;
            background: #1a1a0a;
        }
        #blockCounter {
            color: #88CCFF;
            font-size: 16px;
            background: #0d0d1a;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #88CCFF;
        }
        #hpBar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff6b6b;
            font-size: 14px;
        }
        #hpBar .bar {
            width: 120px;
            height: 12px;
            background: #2a1a1a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ff6b6b;
        }
        #hpBar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ff1744, #ff6b6b);
            transition: width 0.3s;
            width: 100%;
        }
        #inventory {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        #inventory span {
            color: #aaa;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
        }
        #inventory .active {
            color: #FFD700;
            border: 1px solid #FFD700;
            background: rgba(255,215,0,0.1);
        }
        .hint {
            color: #8899aa;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }
        #scoreDisplay {
            color: #4FC3F7;
            font-size: 14px;
        }
        #controllerStatus {
            color: #4CAF50;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #4CAF50;
            background: rgba(76,175,80,0.1);
        }
        #enemyCounter {
            color: #ff6b6b;
            font-size: 14px;
            background: #1a0a0a;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #ff6b6b;
        }
        #chargeCounter {
            color: #FFD700;
            font-size: 16px;
            background: #1a1a0a;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #FFD700;
            font-weight: bold;
        }
        #victoryOverlay, #gameOverOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        #victoryOverlay .title {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        #gameOverOverlay .title {
            font-size: 48px;
            color: #ff1744;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(255,23,68,0.5);
        }
        #victoryOverlay .sub, #gameOverOverlay .sub {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn-go {
            padding: 16px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #FFD700, #FFA000);
            border: none;
            border-radius: 50px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
        }
        .btn-retry {
            padding: 16px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #ff1744, #d50000);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
        }
        .stats {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <canvas id="canvas" width="800" height="500"></canvas>
        <div id="controls">
            <div class="ctrl-btn attack" id="attackBtn">
                ⚔️
                <span class="charge-badge" id="chargeBadge">0</span>
            </div>
            <div class="ctrl-btn scroll-up" id="scrollUp">▲▲</div>
            <div class="ctrl-btn scroll-down" id="scrollDown">▼▼</div>
        </div>
    </div>
    <div id="ui">
        <div id="hpBar">❤️ <span id="hpText">1/1</span><div class="bar"><div class="fill" id="hpFill"></div></div></div>
        <div id="blockCounter">🧱 0</div>
        <div id="chargeCounter">⚡ 0/10</div>
        <div id="grtCounter">GRT-</div>
        <div id="scoreDisplay">💀 0</div>
        <div id="enemyCounter">🐝 0</div>
        <div id="inventory">
            <span class="active" id="invPick">⛏️</span>
        </div>
        <div id="controllerStatus">🎮 未接続</div>
    </div>
    <div class="hint">【操作】←→移動 / ↑ジャンプ / ↓足元を掘る / クリックで掘る / 赤ボタンで弾発射（要チャージ） / 蜂蟻に触れたら即死 / 5ブロック落下で即死</div>
</div>

<div id="victoryOverlay">
    <div class="title">🎉 GRT+ 発見！</div>
    <div class="sub">データベースの王将、おめでとうございます！</div>
    <button class="btn-go" id="goToBattery">⚡ バッテリー情報へ進む</button>
    <div class="stats" id="victoryStats">採掘: 0 ブロック | 撃破: 0 体</div>
</div>

<div id="gameOverOverlay">
    <div class="title">💀 GAME OVER</div>
    <div class="sub" id="gameOverReason">蜂蟻に触れました...</div>
    <button class="btn-retry" id="retryBtn">🔄 リトライ</button>
    <div class="stats" id="gameOverStats">採掘: 0 ブロック | 撃破: 0 体</div>
</div>

<script>
// ============================================
// 蜂蟻モード - 飛ぶ敵、即死、チャージ制攻撃、落下ダメージ
// ============================================

var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');

var W = 800, H = 500;
var BW = 20;
var COLS = 60, ROWS = 50;

var world = [];
var player = { x: 5, y: 14 };
var camera = { x: 0, y: 0 };
var grtFound = false;
var gameOver = false;
var blockCount = 0;
var killCount = 0;
var enemies = [];
var bullets = [];
var particles = [];
var moveDir = null;
var isJumping = false;
var vy = 0;
var onGround = false;
var invincible = 0;
var selectedItem = 'pickaxe';
var lastMouseX = 0;
var lastMouseY = 0;

// ★ チャージ制攻撃システム
var charge = 0;           // 現在のチャージ数（ブロック10個で+1）
var chargeProgress = 0;   // 進捗（0〜9）
var MAX_CHARGE = 20;      // 最大チャージ
var bulletCooldown = 0;

// ★ 落下ダメージ用
var fallStartY = 0;
var isFalling = false;
var FALL_DAMAGE_THRESHOLD = 5; // 5ブロック

// ---- ワールド生成 ----
function createWorld() {
    for (var r = 0; r < ROWS; r++) {
        world[r] = [];
        for (var c = 0; c < COLS; c++) {
            world[r][c] = 0;
        }
    }
    
    // 地面
    for (var x = 0; x < COLS; x++) {
        var h = 15 + Math.floor(Math.random() * 4);
        for (var y = h; y < ROWS; y++) {
            if (y === h) world[y][x] = 2;
            else if (y < h + 3) world[y][x] = 1;
            else world[y][x] = 3;
        }
    }
    
    // 木
    for (var i = 0; i < 8; i++) {
        var tx = 3 + Math.floor(Math.random() * (COLS - 6));
        var ty = 14 + Math.floor(Math.random() * 3);
        if (world[ty] && world[ty][tx] === 2) {
            for (var h = 0; h < 4; h++) {
                if (ty - h >= 0) world[ty - h][tx] = 4;
            }
        }
    }
    
    // 蜂蟻の巣（洞窟）
    var nestCount = 10 + Math.floor(Math.random() * 8);
    var nestPositions = [];
    
    for (var n = 0; n < nestCount; n++) {
        var cx = 5 + Math.floor(Math.random() * (COLS - 10));
        var cy = 22 + Math.floor(Math.random() * 20);
        var radius = 3 + Math.floor(Math.random() * 4);
        nestPositions.push({ x: cx, y: cy });
        
        for (var dy = -radius; dy <= radius; dy++) {
            for (var dx = -radius; dx <= radius; dx++) {
                if (dx*dx + dy*dy < radius*radius) {
                    var nx = cx + dx;
                    var ny = cy + dy;
                    if (nx > 1 && nx < COLS-1 && ny > 1 && ny < ROWS-1) {
                        if (world[ny][nx] === 3 || world[ny][nx] === 1) {
                            world[ny][nx] = 0;
                        }
                    }
                }
            }
        }
        
        // トンネル
        if (n > 0) {
            var prev = nestPositions[n-1];
            var steps = 20;
            for (var s = 0; s < steps; s++) {
                var t = s / steps;
                var tx = Math.floor(prev.x + (cx - prev.x) * t);
                var ty = Math.floor(prev.y + (cy - prev.y) * t);
                if (tx > 1 && tx < COLS-1 && ty > 1 && ty < ROWS-1) {
                    for (var ddx = -1; ddx <= 1; ddx++) {
                        for (var ddy = -1; ddy <= 1; ddy++) {
                            var nx2 = tx + ddx;
                            var ny2 = ty + ddy;
                            if (nx2 > 1 && nx2 < COLS-1 && ny2 > 1 && ny2 < ROWS-1) {
                                if (world[ny2][nx2] === 3 || world[ny2][nx2] === 1) {
                                    world[ny2][nx2] = 0;
                                }
                            }
                        }
                    }
                }
            }
        }
    }
    
    // GRT
    var grtPlaced = false;
    for (var attempts = 0; attempts < 300 && !grtPlaced; attempts++) {
        var gx = 5 + Math.floor(Math.random() * (COLS - 10));
        var gy = 28 + Math.floor(Math.random() * (ROWS - 32));
        if (world[gy] && world[gy][gx] === 3) {
            var hasAir = false;
            for (var ddx = -1; ddx <= 1 && !hasAir; ddx++) {
                for (var ddy = -1; ddy <= 1 && !hasAir; ddy++) {
                    if (ddx === 0 && ddy === 0) continue;
                    var nx = gx + ddx, ny = gy + ddy;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && world[ny][nx] === 0) hasAir = true;
                }
            }
            if (hasAir) { world[gy][gx] = 6; grtPlaced = true; }
        }
    }
    if (!grtPlaced) world[32][20] = 6;
    
    // ★★★ 蜂蟻を大量配置（3倍 = 150〜270匹） ★★★
    var enemyTotal = 150 + Math.floor(Math.random() * 120);
    
    for (var i = 0; i < enemyTotal; i++) {
        var nest = nestPositions[Math.floor(Math.random() * nestPositions.length)];
        var ex = nest.x + Math.floor(Math.random() * 16) - 8;
        var ey = nest.y + Math.floor(Math.random() * 16) - 8;
        
        if (ex >= 1 && ex < COLS-1 && ey >= 1 && ey < ROWS-1) {
            if (world[ey][ex] === 0) {
                // ★ 蜂蟻：自由に飛び回る（重力なし）
                enemies.push({
                    x: ex, y: ey,
                    hp: 2,
                    maxHp: 2,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    timer: Math.random() * 100,
                    wingPhase: Math.random() * Math.PI * 2,
                    homeX: ex,
                    homeY: ey,
                    homeRadius: 8 + Math.random() * 6
                });
            }
        }
    }
    
    // 地上にも蜂蟻
    for (var i = 0; i < 15; i++) {
        var ex = 3 + Math.floor(Math.random() * (COLS - 6));
        var ey = 10 + Math.floor(Math.random() * 5);
        if (world[ey] && world[ey][ex] === 0) {
            enemies.push({
                x: ex, y: ey,
                hp: 2, maxHp: 2,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                timer: Math.random() * 100,
                wingPhase: Math.random() * Math.PI * 2,
                homeX: ex, homeY: ey,
                homeRadius: 10 + Math.random() * 8
            });
        }
    }
    
    // プレイヤー
    player.x = 5;
    player.y = 14;
    while (player.y < ROWS && world[player.y][player.x] === 0) player.y++;
    player.y--;
}

// ---- ブロック判定 ----
function isSolid(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
    return world[y][x] !== 0 && world[y][x] !== 6;
}

// ---- 物理更新 ----
function updatePhysics() {
    if (gameOver || grtFound) return;
    
    // 移動
    if (moveDir === 'left') {
        var nx = player.x - 1;
        if (nx >= 0 && !isSolid(nx, player.y)) {
            player.x = nx;
        }
        moveDir = null;
    }
    if (moveDir === 'right') {
        var nx = player.x + 1;
        if (nx < COLS && !isSolid(nx, player.y)) {
            player.x = nx;
        }
        moveDir = null;
    }
    
    // ジャンプ
    if (isJumping && onGround) {
        vy = -3.2;
        onGround = false;
        isJumping = false;
    }
    
    // 重力
    vy += 0.4;
    if (vy > 5) vy = 5;
    
    var ny = player.y + vy;
    if (isSolid(player.x, Math.floor(ny + 0.5))) {
        if (vy > 0) {
            // ★ 着地時の落下ダメージ判定
            if (isFalling) {
                var fallDist = Math.floor(player.y + vy) - fallStartY;
                if (fallDist >= FALL_DAMAGE_THRESHOLD) {
                    gameOver = true;
                    showGameOver('高さ' + fallDist + 'ブロックから落下しました...');
                    return;
                }
                isFalling = false;
            }
            vy = 0;
            onGround = true;
        }
    } else if (ny >= 0 && ny < ROWS) {
        // ★ 落下開始判定
        if (!isFalling && vy > 0) {
            isFalling = true;
            fallStartY = player.y;
        }
        player.y = Math.floor(ny + 0.5);
        onGround = false;
    }
    
    // GRTチェック
    if (!grtFound && world[player.y] && world[player.y][player.x] === 6) {
        grtFound = true;
        world[player.y][player.x] = 0;
        showVictory();
    }
    
    if (invincible > 0) invincible--;
    if (bulletCooldown > 0) bulletCooldown--;
    
    // ★ 蜂蟻の動き（飛び回る）
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        e.timer++;
        e.wingPhase += 0.3;
        
        var dx = player.x - e.x;
        var dy = player.y - e.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        
        // プレイヤーが近くにいたら追跡
        if (dist < 12) {
            e.vx += (dx > 0 ? 0.08 : -0.08);
            e.vy += (dy > 0 ? 0.08 : -0.08);
            e.vx *= 0.95;
            e.vy *= 0.95;
            // 速度制限
            var speed = Math.sqrt(e.vx*e.vx + e.vy*e.vy);
            if (speed > 1.5) { e.vx *= 1.5/speed; e.vy *= 1.5/speed; }
        } else {
            // 巣の周りをふらふら飛ぶ
            var hdx = e.homeX - e.x;
            var hdy = e.homeY - e.y;
            e.vx += hdx * 0.005 + (Math.random() - 0.5) * 0.15;
            e.vy += hdy * 0.005 + (Math.random() - 0.5) * 0.15;
            e.vx *= 0.96;
            e.vy *= 0.96;
            var speed2 = Math.sqrt(e.vx*e.vx + e.vy*e.vy);
            if (speed2 > 0.8) { e.vx *= 0.8/speed2; e.vy *= 0.8/speed2; }
        }
        
        // 移動
        var nx = e.x + e.vx;
        var ny2 = e.y + e.vy;
        
        // 壁に当たったら反射
        if (isSolid(Math.floor(nx), Math.floor(e.y))) {
            e.vx = -e.vx * 0.8;
        } else {
            e.x = nx;
        }
        if (isSolid(Math.floor(e.x), Math.floor(ny2))) {
            e.vy = -e.vy * 0.8;
        } else {
            e.y = ny2;
        }
        
        // 範囲制限
        if (e.x < 1) { e.x = 1; e.vx = Math.abs(e.vx); }
        if (e.x > COLS-2) { e.x = COLS-2; e.vx = -Math.abs(e.vx); }
        if (e.y < 1) { e.y = 1; e.vy = Math.abs(e.vy); }
        if (e.y > ROWS-2) { e.y = ROWS-2; e.vy = -Math.abs(e.vy); }
        
        // ★ 蜂蟻に触れたら即ゲームオーバー
        if (dist < 0.9) {
            gameOver = true;
            showGameOver('蜂蟻に触れました...');
            return;
        }
    }
    
    // ★ 弾の更新
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        
        // 壁に当たったら消滅
        if (isSolid(Math.floor(b.x), Math.floor(b.y))) {
            bullets.splice(i, 1);
            continue;
        }
        
        // 蜂蟻に当たったらダメージ
        var hit = false;
        for (var j = enemies.length - 1; j >= 0; j--) {
            var e = enemies[j];
            var dx = e.x - b.x;
            var dy = e.y - b.y;
            if (dx*dx + dy*dy < 1.0) {
                e.hp--;
                hit = true;
                // ヒットパーティクル
                for (var p = 0; p < 5; p++) {
                    particles.push({
                        x: b.x * BW + BW/2,
                        y: b.y * BW + BW/2,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 15 + Math.random() * 10,
                        maxLife: 25,
                        size: 2 + Math.random() * 3,
                        color: '#FFD700'
                    });
                }
                if (e.hp <= 0) {
                    enemies.splice(j, 1);
                    killCount++;
                    updateUI();
                }
                break;
            }
        }
        
        if (hit || b.life <= 0) {
            bullets.splice(i, 1);
        }
    }
    
    // カメラ
    var tx = player.x * BW + BW/2 - W/2;
    var ty = player.y * BW + BW/2 - H/2;
    camera.x += (tx - camera.x) * 0.1;
    camera.y += (ty - camera.y) * 0.1;
    camera.x = Math.max(0, Math.min(COLS * BW - W, camera.x));
    camera.y = Math.max(0, Math.min(ROWS * BW - H, camera.y));
}

// ---- ★ チャージ加算（ブロック破壊時） ----
function addCharge() {
    chargeProgress++;
    if (chargeProgress >= 10) {
        chargeProgress = 0;
        if (charge < MAX_CHARGE) {
            charge++;
        }
    }
    updateUI();
}

// ---- ★ 攻撃（弾発射） ----
function fireBullets() {
    if (gameOver || grtFound) return;
    if (bulletCooldown > 0) return;
    if (charge <= 0) {
        // チャージなし
        return;
    }
    
    // チャージを全消費
    var bulletCount = charge;
    charge = 0;
    bulletCooldown = 30;
    
    // 周囲に弾を放射状に発射
    for (var i = 0; i < bulletCount; i++) {
        var angle = (Math.PI * 2 / bulletCount) * i + Math.random() * 0.2;
        bullets.push({
            x: player.x + 0.5,
            y: player.y + 0.5,
            vx: Math.cos(angle) * 0.8,
            vy: Math.sin(angle) * 0.8,
            life: 60
        });
    }
    
    // 発射エフェクト
    for (var p = 0; p < 20; p++) {
        var a = Math.random() * Math.PI * 2;
        particles.push({
            x: player.x * BW + BW/2,
            y: player.y * BW + BW/2,
            vx: Math.cos(a) * 3,
            vy: Math.sin(a) * 3,
            life: 20 + Math.random() * 15,
            maxLife: 35,
            size: 3 + Math.random() * 3,
            color: '#FFD700'
        });
    }
    
    updateUI();
}

// ---- 描画 ----
function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // 背景（地下は暗く）
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(0.4, '#15152a');
    grad.addColorStop(1, '#0a0a15');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    var sx = Math.floor(camera.x / BW);
    var sy = Math.floor(camera.y / BW);
    var ex = Math.ceil((camera.x + W) / BW) + 1;
    var ey = Math.ceil((camera.y + H) / BW) + 1;
    
    // ブロック描画
    for (var r = sy; r < ey && r < ROWS; r++) {
        for (var c = sx; c < ex && c < COLS; c++) {
            var type = world[r][c];
            if (type === 0) continue;
            var x = c * BW - camera.x;
            var y = r * BW - camera.y;
            
            var brightness = Math.max(0.35, 1 - (r - 15) * 0.015);
            
            switch(type) {
                case 1: 
                    var s1 = Math.floor(139 * brightness);
                    ctx.fillStyle = 'rgb(' + s1 + ',' + Math.floor(110*brightness) + ',' + Math.floor(99*brightness) + ')';
                    break;
                case 2: ctx.fillStyle = '#7CB342'; break;
                case 3: 
                    var s3 = Math.floor(158 * brightness);
                    ctx.fillStyle = 'rgb(' + s3 + ',' + s3 + ',' + s3 + ')';
                    break;
                case 4: 
                    var s4 = Math.floor(161 * brightness);
                    ctx.fillStyle = 'rgb(' + s4 + ',' + Math.floor(136*brightness) + ',' + Math.floor(127*brightness) + ')';
                    break;
                case 6: 
                    ctx.fillStyle = '#B8860B';
                    ctx.fillRect(x, y, BW-1, BW-1);
                    ctx.fillStyle = 'rgba(255,215,0,0.3)';
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(x+2, y+2, BW-5, BW-5);
                    ctx.shadowBlur = 0;
                    continue;
                default: ctx.fillStyle = '#888';
            }
            ctx.fillRect(x, y, BW-1, BW-1);
        }
    }
    
    // ★ 弾
    for (var i = 0; i < bullets.length; i++) {
        var b = bullets[i];
        var bx = b.x * BW - camera.x;
        var by = b.y * BW - camera.y;
        ctx.fillStyle = '#FFD700';
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(bx + BW/2, by + BW/2, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // ★ 蜂蟻（飛んでいる）
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        var ex = e.x * BW - camera.x;
        var ey = e.y * BW - camera.y;
        
        // 羽（羽ばたき）
        var wingAngle = Math.sin(e.wingPhase) * 0.6;
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.ellipse(ex + BW/2 - 5, ey + BW/2 - 6 + wingAngle * 3, 5, 2, wingAngle, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(ex + BW/2 + 5, ey + BW/2 - 6 - wingAngle * 3, 5, 2, -wingAngle, 0, Math.PI*2);
        ctx.fill();
        
        // 体（黄と黒の縞）
        ctx.fillStyle = '#FFC107';
        ctx.shadowColor = 'rgba(255,193,7,0.4)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.ellipse(ex + BW/2, ey + BW/2, 7, 5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 縞
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(ex + BW/2 - 5, ey + BW/2 - 1, 10, 2);
        ctx.fillRect(ex + BW/2 - 4, ey + BW/2 + 2, 8, 2);
        
        // 頭
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(ex + BW/2, ey + BW/2 - 5, 3.5, 0, Math.PI*2);
        ctx.fill();
        
        // 目（赤く光る）
        ctx.fillStyle = '#ff1744';
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(ex + BW/2 - 1.5, ey + BW/2 - 6, 1.2, 0, Math.PI*2);
        ctx.arc(ex + BW/2 + 1.5, ey + BW/2 - 6, 1.2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // HPバー
        if (e.hp < e.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(ex + 2, ey - 4, BW - 4, 2);
            ctx.fillStyle = '#ff1744';
            ctx.fillRect(ex + 2, ey - 4, (BW - 4) * (e.hp / e.maxHp), 2);
        }
    }
    
    // プレイヤー
    var px = player.x * BW - camera.x;
    var py = player.y * BW - camera.y;
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px + BW/2, py + BW - 2, 7, 3, 0, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#FF6B6B';
    ctx.shadowColor = 'rgba(255,107,107,0.3)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px + BW/2, py + BW/2 - 2, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // 王冠
    ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px + 5, py + 4);
    ctx.lineTo(px + BW/2, py - 2);
    ctx.lineTo(px + BW - 5, py + 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#FF1744';
    ctx.beginPath();
    ctx.arc(px + BW/2, py - 1, 2, 0, Math.PI*2);
    ctx.fill();
    
    // ★ チャージオーラ（チャージがある時）
    if (charge > 0) {
        ctx.strokeStyle = 'rgba(255,215,0,' + (0.3 + Math.sin(Date.now()/200) * 0.2) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px + BW/2, py + BW/2 - 2, 12 + Math.sin(Date.now()/300) * 2, 0, Math.PI*2);
        ctx.stroke();
    }
    
    drawMinimap();
    
    // 落下中警告
    if (isFalling && vy > 1) {
        var currentFall = player.y - fallStartY;
        if (currentFall >= FALL_DAMAGE_THRESHOLD - 2) {
            ctx.fillStyle = 'rgba(255,0,0,' + (0.2 + Math.sin(Date.now()/100) * 0.15) + ')';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ff1744';
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('⚠️ 落下注意！', W/2, 40);
        }
    }
}

function drawMinimap() {
    var size = 60;
    var mx = W - size - 10;
    var my = 10;
    var sc = size / Math.max(COLS, ROWS);
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(mx - 2, my - 2, size + 4, size + 4);
    ctx.fillStyle = 'rgba(20,20,40,0.8)';
    ctx.fillRect(mx, my, size, size);
    
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            if (world[r][c] !== 0) {
                var col = world[r][c] === 6 ? '#FFD700' : 
                         world[r][c] === 2 ? '#4CAF50' : 
                         world[r][c] === 1 ? '#8D6E63' : '#9E9E9E';
                ctx.globalAlpha = world[r][c] === 6 ? 1 : 0.3;
                ctx.fillStyle = col;
                ctx.fillRect(mx + c * sc, my + r * sc, Math.ceil(sc), Math.ceil(sc));
                ctx.globalAlpha = 1;
            }
        }
    }
    
    // 蜂蟻
    ctx.fillStyle = '#FFC107';
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        ctx.globalAlpha = 0.5;
        ctx.fillRect(mx + e.x * sc, my + e.y * sc, 1, 1);
        ctx.globalAlpha = 1;
    }
    
    // プレイヤー
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath();
    ctx.arc(mx + player.x * sc + sc/2, my + player.y * sc + sc/2, 2, 0, Math.PI*2);
    ctx.fill();
}

// ---- 掘る ----
function digBlock() {
    if (gameOver || grtFound) return;
    if (selectedItem !== 'pickaxe') return;
    
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var mx = (lastMouseX - rect.left) * scaleX;
    var my = (lastMouseY - rect.top) * scaleY;
    
    var worldX = Math.floor((mx + camera.x) / BW);
    var worldY = Math.floor((my + camera.y) / BW);
    
    if (worldX < 0 || worldX >= COLS || worldY < 0 || worldY >= ROWS) return;
    
    var distX = Math.abs(worldX - player.x);
    var distY = Math.abs(worldY - player.y);
    if (distX > 1 || distY > 1) return;
    
    var block = world[worldY][worldX];
    if (block === 0 || block === 6) return;
    
    world[worldY][worldX] = 0;
    blockCount++;
    addCharge(); // ★ チャージ加算
    updateUI();
}

function digDown() {
    if (gameOver || grtFound) return;
    if (selectedItem !== 'pickaxe') return;
    
    var px = player.x;
    var py = player.y + 1;
    
    if (px < 0 || px >= COLS || py < 0 || py >= ROWS) return;
    if (world[py][px] === 0 || world[py][px] === 6) return;
    
    world[py][px] = 0;
    blockCount++;
    addCharge(); // ★ チャージ加算
    player.y = py;
    updateUI();
}

// ---- UI更新 ----
function updateUI() {
    document.getElementById('blockCounter').textContent = '🧱 ' + blockCount;
    document.getElementById('scoreDisplay').textContent = '💀 ' + killCount;
    document.getElementById('enemyCounter').textContent = '🐝 ' + enemies.length;
    document.getElementById('chargeCounter').textContent = '⚡ ' + charge + ' (' + chargeProgress + '/10)';
    
    var badge = document.getElementById('chargeBadge');
    badge.textContent = charge;
    badge.style.display = charge > 0 ? 'block' : 'none';
    
    var attackBtn = document.getElementById('attackBtn');
    if (charge > 0) attackBtn.classList.add('ready');
    else attackBtn.classList.remove('ready');
    
    var el = document.getElementById('grtCounter');
    if (grtFound) { el.textContent = 'GRT+'; el.className = 'found'; }
    else { el.textContent = 'GRT-'; el.className = ''; }
}

// ---- 勝利 ----
function showVictory() {
    document.getElementById('victoryStats').textContent = '採掘: ' + blockCount + ' ブロック | 撃破: ' + killCount + ' 体';
    document.getElementById('victoryOverlay').style.display = 'flex';
    updateUI();
}

function showGameOver(reason) {
    document.getElementById('gameOverReason').textContent = reason;
    document.getElementById('gameOverStats').textContent = '採掘: ' + blockCount + ' ブロック | 撃破: ' + killCount + ' 体';
    document.getElementById('gameOverOverlay').style.display = 'flex';
}

// ---- リトライ ----
function retry() {
    // リセット
    world = [];
    player = { x: 5, y: 14 };
    camera = { x: 0, y: 0 };
    grtFound = false;
    gameOver = false;
    blockCount = 0;
    killCount = 0;
    enemies = [];
    bullets = [];
    particles = [];
    moveDir = null;
    isJumping = false;
    vy = 0;
    onGround = false;
    invincible = 0;
    charge = 0;
    chargeProgress = 0;
    bulletCooldown = 0;
    isFalling = false;
    fallStartY = 0;
    
    document.getElementById('victoryOverlay').style.display = 'none';
    document.getElementById('gameOverOverlay').style.display = 'none';
    
    createWorld();
    updateUI();
}

// ---- ゲームループ ----
function gameLoop() {
    updatePhysics();
    
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    draw();
    
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y - camera.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    requestAnimationFrame(gameLoop);
}

// ---- イベント ----
canvas.addEventListener('mousemove', function(e) {
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

canvas.addEventListener('click', function(e) {
    digBlock();
});

document.addEventListener('keydown', function(e) {
    if (gameOver || grtFound) return;
    switch(e.key) {
        case 'ArrowLeft': moveDir = 'left'; e.preventDefault(); break;
        case 'ArrowRight': moveDir = 'right'; e.preventDefault(); break;
        case 'ArrowUp': isJumping = true; e.preventDefault(); break;
        case 'ArrowDown': digDown(); e.preventDefault(); break;
        case 'z': case 'Z': fireBullets(); e.preventDefault(); break;
        case ' ': fireBullets(); e.preventDefault(); break;
    }
});
document.addEventListener('keyup', function(e) {
    switch(e.key) {
        case 'ArrowLeft': if (moveDir === 'left') moveDir = null; break;
        case 'ArrowRight': if (moveDir === 'right') moveDir = null; break;
        case 'ArrowUp': isJumping = false; break;
    }
});

document.getElementById('attackBtn').addEventListener('click', function(e) {
    e.preventDefault();
    fireBullets();
});

document.getElementById('scrollUp').addEventListener('mousedown', function(e) {
    e.preventDefault();
    camera.y -= 30;
    camera.y = Math.max(0, camera.y);
});
document.getElementById('scrollDown').addEventListener('mousedown', function(e) {
    e.preventDefault();
    camera.y += 30;
    camera.y = Math.min(ROWS * BW - H, camera.y);
});

document.getElementById('goToBattery').addEventListener('click', function() {
    window.location.href = 'battery.html';
});
document.getElementById('retryBtn').addEventListener('click', retry);

// ---- コントローラー ----
function updateGamepad() {
    var gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
    if (gp) {
        document.getElementById('controllerStatus').textContent = '🎮 接続中';
        document.getElementById('controllerStatus').style.borderColor = '#4CAF50';
        
        var deadZone = 0.2;
        var ax = gp.axes[0] || 0;
        var ay = gp.axes[1] || 0;
        
        if (Math.abs(ax) > deadZone) {
            moveDir = ax < 0 ? 'left' : 'right';
        } else if (moveDir === 'left' || moveDir === 'right') {
            moveDir = null;
        }
        
        if (ay > deadZone) { digDown(); }
        if (gp.buttons[0] && gp.buttons[0].pressed) { isJumping = true; }
        if (gp.buttons[2] && gp.buttons[2].pressed) { fireBullets(); }
    } else {
        document.getElementById('controllerStatus').textContent = '🎮 未接続';
        document.getElementById('controllerStatus').style.borderColor = '#f44336';
    }
    requestAnimationFrame(updateGamepad);
}

// ---- 起動 ----
createWorld();
updateUI();
gameLoop();
updateGamepad();

console.log('🐝 蜂蟻モード！飛び回る蜂蟻に触れたら即死');
console.log('⚡ ブロック10個壊すごとにチャージ+1、赤ボタンで周囲に弾を発射');
console.log('⚠️ 5ブロック以上落下すると即死！');
</script>
