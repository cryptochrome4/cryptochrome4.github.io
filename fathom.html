<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://w3.org" lang="ja" xml:lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>CoinPost ニュース仕分けボード (2013 Retro Edition)</title>
<style type="text/css">
/* 2013年のブラウザ互換性を重視したレトロCSS */
body {
    font-family: "ヒラギノ角ゴ Pro W3", "Hiragino Kaku Gothic Pro", "メイリオ", Meiryo, Osaka, "ＭＳ Ｐゴシック", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #333333;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}
h1 {
    font-size: 24px;
    color: #003366;
    margin-bottom: 5px;
}
p.description {
    font-size: 12px;
    color: #666666;
    margin-top: 0;
    margin-bottom: 20px;
}
.btn {
    padding: 6px 20px;
    font-size: 14px;
    background-color: #0055aa;
    color: #ffffff;
    border: 1px solid #003366;
    cursor: pointer;
    font-weight: bold;
}
.btn:hover {
    background-color: #003366;
}
.btn-danger {
    background-color: #cc0000;
    border: 1px solid #990000;
}
.btn-danger:hover {
    background-color: #990000;
}
/* メインレイアウト */
.board-container {
    width: 100%;
    overflow: hidden; /* floatクリア用 */
}
/* POOL（左側） */
.pool-box {
    float: left;
    width: 30%;
    background-color: #e6f2ff;
    border: 2px solid #0055aa;
    padding: 10px;
    min-height: 650px;
}
/* ジャンルエリア（右側） */
.genres-box {
    float: right;
    width: 66%;
    background-color: #ffffff;
    border: 1px solid #cccccc;
    padding: 10px;
    min-height: 650px;
}
.pool-box h2, .genres-box h2 {
    font-size: 18px;
    margin-top: 0;
    padding-bottom: 5px;
    border-bottom: 1px solid #cccccc;
}
/* ジャンルごとの格子レイアウト（30枠） */
.genre-card {
    float: left;
    width: 46%;
    margin: 1%;
    background-color: #f9f9f9;
    border: 1px solid #dddddd;
    padding: 8px;
    min-height: 120px;
}
.genre-card h3 {
    font-size: 14px;
    margin: 0 0 8px 0;
    background-color: #003366;
    color: #ffffff;
    padding: 3px 5px;
}
/* ニュースアイテムのスタイル */
.news-item {
    background-color: #ffffff;
    border: 1px solid #bbbbbb;
    padding: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.4;
}
.news-title {
    word-break: break-all;
    font-weight: bold;
}
.news-actions {
    margin-top: 8px;
    font-size: 11px;
    text-align: right;
}
.news-actions select {
    font-size: 11px;
    padding: 2px;
}
/* システムコントロール */
.sys-control {
    margin-top: 30px;
    padding-top: 15px;
    border-top: 1px dashed #cccccc;
    text-align: right;
}
</style>
</head>
<body>

<h1>CoinPost ニュース仕分けボード</h1>
<p class="description">コードに直接書き込んだ日付入りのタイトルを、SEC・CFTC・トランプ大統領などのジャンルに分類して握力を鍛える専用ボードです。</p>

<!-- メインボード -->
<div class="board-container">
    
    <!-- 左側：未分類プール -->
    <div class="pool-box">
        <h2>📥 ニュース POOL</h2>
        <div id="pool_list">
            <!-- ここにJavaScriptでニュースが入ります -->
        </div>
    </div>
    
    <!-- 右側：30個のジャンル振り分け先 -->
    <div class="genres-box">
        <h2>📂 ジャンル別分類 (30ジャンル枠)</h2>
        <div id="genres_container">
            <!-- ここにJavaScriptで30個のフォルダカードが生成されます -->
        </div>
    </div>

</div>

<!-- システム管理（振り分け位置の4回かまをかけるリセット） -->
<div class="sys-control">
    <input type="button" value="⚡ 振り分け位置をリセット（ニュースは消えません）" class="btn btn-danger" onclick="tripleCheckReset(1)" />
</div>

<!-- ここから中編のJavaScriptにつづく -->
<script type="text/javascript">
// ----------------------------------------------------
// 2013年レトロ互換仕様 JavaScript（中編：データ定義と初期化）
// ----------------------------------------------------

// 1. 【ニュース手動追加エリア】
// ★ここにニュースタイトル（日付入り）をご自身で直接書き足してください！
// 古いニュースを下、新しいニュースを上（先頭）に並べていくと、POOL内でも上に表示されます。
var INITIAL_NEWS = [
    "20260820XRPとトランプが強気の方針というニュースタイトル"
    // ,"20260821 次のニュースタイトルを足すときは、このようにカンマを入れて追加します"
    // ,"20260822 さらにニュースを足すときはこのように並べていきます"
];

// 2. ジャンル定義（30ジャンル枠を配列で確保）
var GENRE_NAMES = [
    "トランプ大統領 / 政権",
    "SEC（証券取引委員会）",
    "CFTC（商品先物取引委員会）",
    "リップル（XRP） / Ripple社",
    "ビットコイン（BTC）",
    "イーサリアム（ETH）",
    "ステーブルコイン（USDC/USDT）",
    "仮想通貨・予測市場会合",
    "クラリティー法案 / 規制動向",
    "KBRA / 格付・機関投資家",
    "金融業界 / 伝統金融",
    "ホワイトハウス動向",
    "CoinPost 主要ニュース",
    "ジャンル14（未設定）", "ジャンル15（未設定）",
    "ジャンル16（未設定）", "ジャンル17（未設定）", "ジャンル18（未設定）",
    "ジャンル19（未設定）", "ジャンル20（未設定）", "ジャンル21（未設定）",
    "ジャンル22（未設定）", "ジャンル23（未設定）", "ジャンル24（未設定）",
    "ジャンル25（未設定）", "ジャンル26（未設定）", "ジャンル27（未設定）",
    "ジャンル28（未設定）", "ジャンル29（未設定）", "ジャンル30（未設定）"
];

// 3. グローバルデータ構造（ブラウザには「ニュースのタイトルと仕分け先IDのペア」だけを保持します）
var savedMap = {}; // タイトル文字列 を キー、 ジャンルID を 値 にする連想配列
var appData = {
    newsList: []
};

// 4. 画面初期化処理
window.onload = function() {
    initGenreCards();      // 右側の30ジャンル枠のHTML生成
    loadAndSyncData();     // コード内の配列とブラウザ記憶の同期
    renderBoard();         // 画面へのニュース描画
};

// 5. 右側の30ジャンルコンテナのHTML構築
function initGenreCards() {
    var container = document.getElementById("genres_container");
    var htmlBuffer = "";
    
    for (var i = 0; i < GENRE_NAMES.length; i++) {
        htmlBuffer += '<div class="genre-card">';
        htmlBuffer += '<h3>[' + (i + 1) + '] ' + GENRE_NAMES[i] + '</h3>';
        htmlBuffer += '<div id="genre_list_' + i + '"></div>';
        htmlBuffer += '</div>';
    }
    
    container.innerHTML = htmlBuffer;
}

// 6. データのローカル保存
function saveData() {
    if (window.localStorage) {
        window.localStorage.setItem("coinpost_direct_map", JSON.stringify(savedMap));
    }
}

// 7. データの読み込み ＆ コード内配列（INITIAL_NEWS）との同期
// これにより、新しくコードに足したニュースは自動でPOOLに並び、
// すでに仕分け済みのニュースはブラウザの記憶（localStorage）から仕分け先のフォルダに正しく配置されます。
function loadAndSyncData() {
    savedMap = {};
    if (window.localStorage) {
        var rawData = window.localStorage.getItem("coinpost_direct_map");
        if (rawData) {
            try {
                savedMap = JSON.parse(rawData);
            } catch(e) {
                savedMap = {};
            }
        }
    }
    
    // コード内の INITIAL_NEWS をベースに表示用リストを再構築
    appData.newsList = [];
    for (var i = 0; i < INITIAL_NEWS.length; i++) {
        var titleText = INITIAL_NEWS[i];
        
        // 過去に仕分けデータが保存されているかチェック、なければ -1 (POOL)
        var currentGenreId = -1;
        if (typeof savedMap[titleText] !== "undefined") {
            currentGenreId = parseInt(savedMap[titleText], 10);
        }
        
        appData.newsList.push({
            id: i, // ループ内の簡易ID
            title: titleText,
            genreId: currentGenreId
        });
    }
}

// ここから後編（ジャンル移動処理、4回かまをかけるリセット等）につづく
</script>
</body>
</html>
