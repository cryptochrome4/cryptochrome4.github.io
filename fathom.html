<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinPost Title Hub</title>
    <style>
        /* スマホでもテレビでも見やすく、バグが最も起きにくい基本デザイン */
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #e2e8f0;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 20px; color: #ffffff; }

        .system-controls { display: flex; gap: 10px; }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button.btn-danger { background-color: var(--danger-color); }

        /* 【王道レイアウト】スマホでは縦並び、広い画面（PC/PS4）では左右2分割 */
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .app-container {
                display: grid;
                grid-template-columns: 320px 1fr;
                align-items: start;
            }
        }

        /* 左側: POOLエリア */
        .pool-sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .pool-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        /* 右側: 30のジャンルボックスが並ぶエリア */
        .genre-main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .genre-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            min-height: 200px;
        }

        .genre-title {
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>CoinPost ニュースタイトル・ハブ</h1>
        <div class="system-controls">
            <button id="import-btn">GitHubからデータ投入 (仮)</button>
            <button id="reset-btn" class="btn-danger">全データ安全リセット</button>
        </div>
    </header>

    <div class="app-container">
        <!-- 左カラム: POOL -->
        <aside class="pool-sidebar">
            <div class="pool-header">
                <span>📰 ニュース POOL</span>
                <span id="pool-count" style="color: #94a3b8;">0 件</span>
            </div>
            <ul id="news-pool" class="news-list"></ul>
        </aside>

        <!-- 右カラム: 30ジャンル -->
        <main class="genre-main" id="genre-container"></main>
    </div>

    <script>
        // --- 1. IndexedDBによる絶対消えない保存の土台 ---
        const DB_NAME = 'CoinPostHubDB_Modern';
        const DB_VERSION = 1;
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject('DB起動失敗');
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('articles')) {
                        database.createObjectStore('articles', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        // --- 2. 定義された30個のジャンルエリア ---
        const defaultGenres = [
            "SEC関連", "CFTC関連", "トランプ大統領発言", "リップル(XRP)公式", "予測市場・マクロ",
            "ジャンル6", "ジャンル7", "ジャンル8", "ジャンル9", "ジャンル10",
            "ジャンル11", "ジャンル12", "ジャンル13", "ジャンル14", "ジャンル15",
            "ジャンル16", "ジャンル17", "ジャンル18", "ジャンル19", "ジャンル20",
            "ジャンル21", "ジャンル22", "ジャンル23", "ジャンル24", "ジャンル25",
            "ジャンル26", "ジャンル27", "ジャンル28", "ジャンル29", "ジャンル30"
        ];

        function createGenreBoxes() {
            const container = document.getElementById('genre-container');
            container.innerHTML = '';
            defaultGenres.forEach((genreName, index) => {
                const box = document.createElement('div');
                box.className = 'genre-box';
                box.innerHTML = `
                    <div class="genre-title">${index + 1}. ${genreName}</div>
                    <ul class="news-list" id="genre-list-${index}"></ul>
                `;
                container.appendChild(box);
            });
        }
