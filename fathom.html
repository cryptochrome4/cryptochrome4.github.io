<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CoinPost Title Hub for PS4</title>
    <style>
        /* PS4ブラウザが100%解釈できる安全なカラーコードと基本設定 */
        body {
            background-color: #121214;
            color: #e2e8f0;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            font-size: 14px;
        }

        /* ヘッダーエリア */
        #ps4-header {
            background-color: #1e1e24;
            padding: 15px;
            border-bottom: 2px solid #334155;
            margin-bottom: 15px;
        }
        #ps4-title {
            float: left;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
            line-height: 36px;
        }
        .system-controls {
            float: right;
        }

        /* 古いブラウザでも絶対に崩れないボタン装飾 */
        button {
            background-color: #3b82f6;
            color: #ffffff;
            border: 1px solid #2563eb;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
        }
        button.btn-danger {
            background-color: #ef4444;
            border: 1px solid #dc2626;
        }

        /* つまづき防止用の回り込み解除 */
        .clear {
            clear: both;
        }

        /* 【重要】PS4で確実に左右2分割するためのテーブルレイアウト */
        .main-wrapper {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        .main-row {
            display: table-row;
        }

        /* 左側: POOLエリア (全体の25%の横幅に固定) */
        .pool-cell {
            display: table-cell;
            width: 25%;
            background-color: #1e1e24;
            border: 1px solid #334155;
            vertical-align: top;
            padding: 15px;
        }

        /* 右側: 30ジャンルエリア (全体の75%の横幅に固定) */
        .genre-cell {
            display: table-cell;
            width: 75%;
            vertical-align: top;
            padding-left: 15px;
        }

        .pool-header {
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* 【重要】30ジャンルをPS4で綺麗に3列に並べるための古典的ボックス */
        .genre-box-wrapper {
            float: left;
            width: 33.3%; /* 横にきっちり3玉並べる */
            box-sizing: border-box;
            padding: 0 5px 15px 5px;
        }
        .genre-box {
            background-color: #1e1e24;
            border: 1px solid #334155;
            padding: 12px;
            height: 280px; /* 高さを固定してPS4でのガタつきを防止 */
            overflow-y: auto; /* 溢れたら確実にスクロールさせる */
        }
        .genre-title {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* 共通リストスタイル */
        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- ヘッダー構造 -->
    <div id="ps4-header">
        <div id="ps4-title">CoinPost ニュースタイトル・ハブ (PS4最適化版)</div>
        <div class="system-controls">
            <button id="import-btn">GitHubからデータ投入 (仮)</button>
            <button id="reset-btn" class="btn-danger">全データ安全リセット</button>
        </div>
        <div class="clear"></div>
    </div>

    <!-- メインレイアウト構造（テーブル形式） -->
    <div class="main-wrapper">
        <div class="main-row">
            
            <!-- 左側: ニュースプール -->
            <div class="pool-cell">
                <div class="pool-header">
                    <span>📰 ニュース POOL</span>
                    <span id="pool-count" style="float: right; font-size: 12px; color: #94a3b8;">0 件</span>
                    <div class="clear"></div>
                </div>
                <!-- 縦長スクロールを保証 -->
                <div style="height: 600px; overflow-y: auto;">
                    <ul id="news-pool" class="news-list"></ul>
                </div>
            </div>

            <!-- 右側: 30の分類ジャンル -->
            <div class="genre-cell">
                <div id="genre-container">
                    <!-- ここにJavaScriptで30個のボックスが浮動(float)配置されます -->
                </div>
                <div class="clear"></div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. IndexedDB 保存基盤 (PS4ブラウザ対応) ---
        const DB_NAME = 'CoinPostHubDB_PS4'; // PS4用にDB名を変えて新規作成
        const DB_VERSION = 1;
        let db;

        function initDB() {
            return new Promise(function(resolve, reject) {
                // 古い記述方法（シグネチャ）でも動くよう、安全な書き方に統一
                var request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = function() { reject('DB起動失敗'); };
                request.onsuccess = function(e) {
                    db = e.target.result;
                    resolve(db);
                };

                request.onupgradeneeded = function(e) {
                    var database = e.target.result;
                    if (!database.objectStoreNames.contains('articles')) {
                        database.createObjectStore('articles', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        // --- 2. 30個のジャンル枠生成 (PS4専用レイアウト構築) ---
        const defaultGenres = [
            "SEC関連", "CFTC関連", "トランプ大統領発言", "リップル(XRP)公式", "予測市場・マクロ",
            "ジャンル6", "ジャンル7", "ジャンル8", "ジャンル9", "ジャンル10",
            "ジャンル11", "ジャンル12", "ジャンル13", "ジャンル14", "ジャンル15",
            "ジャンル16", "ジャンル17", "ジャンル18", "ジャンル19", "ジャンル20",
            "ジャンル21", "ジャンル22", "ジャンル23", "ジャンル24", "ジャンル25",
            "ジャンル26", "ジャンル27", "ジャンル28", "ジャンル29", "ジャンル30"
        ];

        function createGenreBoxes() {
            var container = document.getElementById('genre-container');
            container.innerHTML = '';
            
            for (var i = 0; i < defaultGenres.length; i++) {
                var wrapper = document.createElement('div');
                wrapper.className = 'genre-box-wrapper';
                
                wrapper.innerHTML = 
                    '<div class="genre-box" data-genre-id="' + i + '">' +
                        '<div class="genre-title">' + (i + 1) + '. ' + defaultGenres[i] + '</div>' +
                        '<ul class="news-list" id="genre-list-' + i + '"></ul>' +
                    '</div>';
                
                container.appendChild(wrapper);
            }
        }

        // 読み込み時の初期フック
        document.addEventListener('DOMContentLoaded', async function() {
            await initDB();
            createGenreBoxes();
        });
    </script>
</body>
</html>
