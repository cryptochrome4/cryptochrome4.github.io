<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://w3.org" lang="ja" xml:lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>CoinPost ニュース仕分けボード (2013 Retro Edition)</title>
<style type="text/css">
/* 2013年のブラウザ互換性を重視したレトロCSS */
body {
    font-family: "ヒラギノ角ゴ Pro W3", "Hiragino Kaku Gothic Pro", "メイリオ", Meiryo, Osaka, "ＭＳ Ｐゴシック", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #333333;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}
h1 {
    font-size: 24px;
    color: #003366;
    margin-bottom: 5px;
}
p.description {
    font-size: 12px;
    color: #666666;
    margin-top: 0;
    margin-bottom: 20px;
}
.btn {
    padding: 6px 20px;
    font-size: 14px;
    background-color: #0055aa;
    color: #ffffff;
    border: 1px solid #003366;
    cursor: pointer;
    font-weight: bold;
}
.btn:hover {
    background-color: #003366;
}
.btn-danger {
    background-color: #cc0000;
    border: 1px solid #990000;
}
.btn-danger:hover {
    background-color: #990000;
}
/* メインレイアウト */
.board-container {
    width: 100%;
    overflow: hidden; /* floatクリア用 */
}
/* POOL（左側） */
.pool-box {
    float: left;
    width: 30%;
    background-color: #e6f2ff;
    border: 2px solid #0055aa;
    padding: 10px;
    min-height: 650px;
}
/* ジャンルエリア（右側） */
.genres-box {
    float: right;
    width: 66%;
    background-color: #ffffff;
    border: 1px solid #cccccc;
    padding: 10px;
    min-height: 650px;
}
.pool-box h2, .genres-box h2 {
    font-size: 18px;
    margin-top: 0;
    padding-bottom: 5px;
    border-bottom: 1px solid #cccccc;
}
/* ジャンルごとの格子レイアウト（30枠） */
.genre-card {
    float: left;
    width: 46%;
    margin: 1%;
    background-color: #f9f9f9;
    border: 1px solid #dddddd;
    padding: 8px;
    min-height: 120px;
}
.genre-card h3 {
    font-size: 14px;
    margin: 0 0 8px 0;
    background-color: #003366;
    color: #ffffff;
    padding: 3px 5px;
}
/* ニュースアイテムのスタイル */
.news-item {
    background-color: #ffffff;
    border: 1px solid #bbbbbb;
    padding: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.4;
}
.news-title {
    word-break: break-all;
    font-weight: bold;
}
.news-actions {
    margin-top: 8px;
    font-size: 11px;
    text-align: right;
}
.news-actions select {
    font-size: 11px;
    padding: 2px;
}
/* システムコントロール */
.sys-control {
    margin-top: 30px;
    padding-top: 15px;
    border-top: 1px dashed #cccccc;
    text-align: right;
}
</style>
</head>
<body>

<h1>CoinPost ニュース仕分けボード</h1>
<p class="description">コードに直接書き込んだ日付入りのタイトルを、SEC・CFTC・トランプ大統領などのジャンルに分類して握力を鍛える専用ボードです。</p>

<!-- メインボード -->
<div class="board-container">
    
    <!-- 左側：未分類プール -->
    <div class="pool-box">
        <h2>📥 ニュース POOL</h2>
        <div id="pool_list">
            <!-- ここにJavaScriptでニュースが入ります -->
        </div>
    </div>
    
    <!-- 右側：30個のジャンル振り分け先 -->
    <div class="genres-box">
        <h2>📂 ジャンル別分類 (30ジャンル枠)</h2>
        <div id="genres_container">
            <!-- ここにJavaScriptで30個のフォルダカードが生成されます -->
        </div>
    </div>

</div>

<!-- システム管理（振り分け位置の4回かまをかけるリセット） -->
<div class="sys-control">
    <input type="button" value="⚡ 振り分け位置をリセット（ニュースは消えません）" class="btn btn-danger" onclick="tripleCheckReset(1)" />
</div>

<!-- ここから中編のJavaScriptにつづく -->
