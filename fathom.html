<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CoinPost Title Hub for PS4</title>
    <style>
        /* PS4ブラウザが100%解釈できる安全なカラーコードと基本設定 */
        body {
            background-color: #121214;
            color: #e2e8f0;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            font-size: 14px;
        }

        /* ヘッダーエリア */
        #ps4-header {
            background-color: #1e1e24;
            padding: 15px;
            border-bottom: 2px solid #334155;
            margin-bottom: 15px;
        }
        #ps4-title {
            float: left;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
            line-height: 36px;
        }
        .system-controls {
            float: right;
        }

        /* 古いブラウザでも絶対に崩れないボタン装飾 */
        button {
            background-color: #3b82f6;
            color: #ffffff;
            border: 1px solid #2563eb;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
        }
        button.btn-danger {
            background-color: #ef4444;
            border: 1px solid #dc2626;
        }

        /* つまづき防止用の回り込み解除 */
        .clear {
            clear: both;
        }

        /* 【重要】PS4で確実に左右2分割するためのテーブルレイアウト */
        .main-wrapper {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        .main-row {
            display: table-row;
        }

        /* 左側: POOLエリア (全体の25%の横幅に固定) */
        .pool-cell {
            display: table-cell;
            width: 25%;
            background-color: #1e1e24;
            border: 1px solid #334155;
            vertical-align: top;
            padding: 15px;
        }

        /* 右側: 30ジャンルエリア (全体の75%の横幅に固定) */
        .genre-cell {
            display: table-cell;
            width: 75%;
            vertical-align: top;
            padding-left: 15px;
        }

        .pool-header {
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* 【重要】30ジャンルをPS4で綺麗に3列に並べるための古典的ボックス */
        .genre-box-wrapper {
            float: left;
            width: 33.3%; /* 横にきっちり3玉並べる */
            box-sizing: border-box;
            padding: 0 5px 15px 5px;
        }
        .genre-box {
            background-color: #1e1e24;
            border: 1px solid #334155;
            padding: 12px;
            height: 280px; /* 高さを固定してPS4でのガタつきを防止 */
            overflow-y: auto; /* 溢れたら確実にスクロールさせる */
        }
        .genre-title {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* 共通リストスタイル */
        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
                /* 【中編追加】PS4の画面で見やすく、カーソルが合わせやすいニュースカード */
        .news-card {
            background-color: #2a2a35;
            border: 1px solid #475569;
            padding: 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .news-title-text {
            font-size: 14px; /* PS4で読めるように少し大きめに設定 */
            line-height: 1.5;
            margin-bottom: 10px;
            word-break: break-all;
            color: #f1f5f9;
        }

        /* コントローラーで押しやすい操作エリア */
        .card-controls {
            margin-bottom: 10px;
        }

        /* 日付入力欄を大きく広く */
        .date-input-field {
            background-color: #1e1e24;
            color: #ffffff;
            border: 1px solid #64748b;
            padding: 6px;
            font-size: 14px;
            width: 100px;
            font-family: monospace;
            box-sizing: border-box;
            vertical-align: middle;
        }

        /* 記録ボタンを巨大化 */
        .btn-save-date {
            background-color: #10b981;
            border: 1px solid #059669;
            color: white;
            font-size: 13px;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 4px;
        }

        /* 分配用セレクトボックスを巨大化（PS4で最も押しやすいサイズ） */
        .move-select {
            width: 100%;
            background-color: #0f172a;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 8px;
            font-size: 14px;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* テレビ画面でも一発でわかる日付バッジ */
        .badge-date {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            margin-bottom: 8px;
            font-family: monospace;
        }

    </style>
</head>
<body>

    <!-- ヘッダー構造 -->
    <div id="ps4-header">
        <div id="ps4-title">CoinPost ニュースタイトル・ハブ (PS4最適化版)</div>
        <div class="system-controls">
            <button id="import-btn">GitHubからデータ投入 (仮)</button>
            <button id="reset-btn" class="btn-danger">全データ安全リセット</button>
        </div>
        <div class="clear"></div>
    </div>

    <!-- メインレイアウト構造（テーブル形式） -->
    <div class="main-wrapper">
        <div class="main-row">
            
            <!-- 左側: ニュースプール -->
            <div class="pool-cell">
                <div class="pool-header">
                    <span>📰 ニュース POOL</span>
                    <span id="pool-count" style="float: right; font-size: 12px; color: #94a3b8;">0 件</span>
                    <div class="clear"></div>
                </div>
                <!-- 縦長スクロールを保証 -->
                <div style="height: 600px; overflow-y: auto;">
                    <ul id="news-pool" class="news-list"></ul>
                </div>
            </div>

            <!-- 右側: 30の分類ジャンル -->
            <div class="genre-cell">
                <div id="genre-container">
                    <!-- ここにJavaScriptで30個のボックスが浮動(float)配置されます -->
                </div>
                <div class="clear"></div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. IndexedDB 保存基盤 (PS4ブラウザ対応) ---
        const DB_NAME = 'CoinPostHubDB_PS4'; // PS4用にDB名を変えて新規作成
        const DB_VERSION = 1;
        let db;

        function initDB() {
            return new Promise(function(resolve, reject) {
                // 古い記述方法（シグネチャ）でも動くよう、安全な書き方に統一
                var request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = function() { reject('DB起動失敗'); };
                request.onsuccess = function(e) {
                    db = e.target.result;
                    resolve(db);
                };

                request.onupgradeneeded = function(e) {
                    var database = e.target.result;
                    if (!database.objectStoreNames.contains('articles')) {
                        database.createObjectStore('articles', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        // --- 2. 30個のジャンル枠生成 (PS4専用レイアウト構築) ---
        const defaultGenres = [
            "SEC関連", "CFTC関連", "トランプ大統領発言", "リップル(XRP)公式", "予測市場・マクロ",
            "ジャンル6", "ジャンル7", "ジャンル8", "ジャンル9", "ジャンル10",
            "ジャンル11", "ジャンル12", "ジャンル13", "ジャンル14", "ジャンル15",
            "ジャンル16", "ジャンル17", "ジャンル18", "ジャンル19", "ジャンル20",
            "ジャンル21", "ジャンル22", "ジャンル23", "ジャンル24", "ジャンル25",
            "ジャンル26", "ジャンル27", "ジャンル28", "ジャンル29", "ジャンル30"
        ];

        function createGenreBoxes() {
            var container = document.getElementById('genre-container');
            container.innerHTML = '';
            
            for (var i = 0; i < defaultGenres.length; i++) {
                var wrapper = document.createElement('div');
                wrapper.className = 'genre-box-wrapper';
                
                wrapper.innerHTML = 
                    '<div class="genre-box" data-genre-id="' + i + '">' +
                        '<div class="genre-title">' + (i + 1) + '. ' + defaultGenres[i] + '</div>' +
                        '<ul class="news-list" id="genre-list-' + i + '"></ul>' +
                    '</div>';
                
                container.appendChild(wrapper);
            }
        }

        // 読み込み時の初期フック
        document.addEventListener('DOMContentLoaded', async function() {
            await initDB();
            createGenreBoxes();
        });
                // --- 【中編追加】ニュースカードHTMLの生成 (PS4の古いエンジンで絶対エラーが出ない記述) ---
        function createNewsCardHTML(article) {
            var dateBadge = '';
            if (article.date) {
                dateBadge = '<span class="badge-date">📅 ' + article.date + '</span><br>';
            }
            
            // ジャンル選択のオプション組み立て
            var genreOptions = '<option value="pool">📄 POOLに戻す</option>';
            for (var i = 0; i < defaultGenres.length; i++) {
                var selected = (article.genre === String(i)) ? 'selected' : '';
                genreOptions += '<option value="' + i + '" ' + selected + '>' + (i + 1) + ': ' + defaultGenres[i] + '</option>';
            }

            // 安全な文字列結合でHTMLをビルド
            var html = '';
            html += '<li class="news-card" data-id="' + article.id + '">';
            html += dateBadge;
            html += '<div class="news-title-text">' + article.title + '</div>';
            html += '<div class="card-controls">';
            html += '<input type="text" class="date-input-field" placeholder="20260810" value="' + (article.date || '') + '" maxlength="8">';
            html += '<button class="btn-save-date" onclick="updateArticleDate(' + article.id + ', this)">記録</button>';
            html += '</div>';
            html += '<select class="move-select" onchange="moveArticleGenre(' + article.id + ', this.value)">';
            html += '<option value="" disabled selected>📦 ジャンルへ配分...</option>';
            html += genreOptions;
            html += '</select>';
            html += '</li>';

            return html;
        }

        // --- 【中編追加】日付データの保存・更新処理 ---
        async function updateArticleDate(id, buttonEl) {
            var inputEl = buttonEl.previousElementSibling;
            var dateValue = inputEl.value.trim();

            // 8桁の半角数字か空欄のみ許可するバリデーション
            if (dateValue !== "" && !/^\d{8}$/.test(dateValue)) {
                alert("日付は「20260810」のように8桁の半角数字で入力してください。");
                return;
            }

            var transaction = db.transaction(['articles'], 'readwrite');
            var store = transaction.objectStore(['articles']);
            
            store.get(id).onsuccess = function(e) {
                var article = e.target.result;
                if (article) {
                    article.date = dateValue;
                    store.put(article).onsuccess = function() {
                        // 後編で実装する再描画処理を呼び出し
                        renderAllArticles();
                    };
                }
            };
        }

        // --- 【中編追加】ジャンル移動・配分処理 ---
        async function moveArticleGenre(id, targetGenre) {
            var transaction = db.transaction(['articles'], 'readwrite');
            var store = transaction.objectStore(['articles']);

            store.get(id).onsuccess = function(e) {
                var article = e.target.result;
                if (article) {
                    article.genre = targetGenre; // "pool" または "0"〜"29"
                    store.put(article).onsuccess = function() {
                        renderAllArticles();
                    };
                }
            };
        }

                // --- 【後編追加】データベースから全記事を読み込んで画面に分配・描画する処理 ---
        function renderAllArticles() {
            // まずPOOLとすべてのジャンルリストの画面表示をクリア
            document.getElementById('news-pool').innerHTML = '';
            for (var i = 0; i < 30; i++) {
                var listEl = document.getElementById('genre-list-' + i);
                if (listEl) {
                    listEl.innerHTML = '';
                }
            }

            var poolCount = 0;
            var transaction = db.transaction(['articles'], 'readonly');
            var store = transaction.objectStore(['articles']);
            
            // PS4の古いブラウザ環境で最も安定して動作するカーソルループを採用
            store.openCursor().onsuccess = function(event) {
                var cursor = event.target.result;
                if (cursor) {
                    var article = cursor.value;
                    var cardHTML = createNewsCardHTML(article);

                    // 保存されているジャンルIDに応じて画面の適切な場所に振り分け
                    if (!article.genre || article.genre === 'pool') {
                        // PS4の古いDOM操作でも絶対にバグらないように innerHTML を安全に結合
                        document.getElementById('news-pool').innerHTML += cardHTML;
                        poolCount++;
                    } else {
                        var targetList = document.getElementById('genre-list-' + article.genre);
                        if (targetList) {
                            targetList.innerHTML += cardHTML;
                        }
                    }
                    cursor.continue(); // 次の記事へ進む
                } else {
                    // 全件の読み込みが完全に終わったら、プールの件数を画面に反映
                    document.getElementById('pool-count').textContent = poolCount + ' 件';
                }
            };
        }

        // --- 【後編追加】GitHubから最新ニュースをプールへ同期するシミュレーター ---
        // 将来的にGitHubにJSONファイルを置いてここから読み込める（fetchできる）ように拡張可能です
        document.getElementById('import-btn').onclick = function() {
            // お送りいただいたスクリーンショット（CoinPost）の実際のニュースデータを初期プリセット
            var mockGitHubData = [
                {
                    title: "トランプ大統領、来週の仮想通貨・予測市場会合に出席見込み＝報道",
                    genre: "pool",
                    date: ""
                },
                {
                    title: "リップル子会社が優先無担保債発行、436億円調達",
                    genre: "pool",
                    date: ""
                },
                {
                    title: "トランプ大統領、政府によるビットコイン購入検討を表明 BTCは6月以来の高値",
                    genre: "pool",
                    date: ""
                }
            ];

            var transaction = db.transaction(['articles'], 'readwrite');
            var store = transaction.objectStore(['articles']);

            var addedCount = 0;
            
            // 二重で同じタイトルがプールに入らないように既存チェックをかける
            store.getAll().onsuccess = function(e) {
                var currentArticles = e.target.result;
                var currentTitles = [];
                for (var i = 0; i < currentArticles.length; i++) {
                    currentTitles.push(currentArticles[i].title);
                }

                // 新着ニュースのみを厳選してIndexedDBに追加
                for (var j = 0; j < mockGitHubData.length; j++) {
                    var item = mockGitHubData[j];
                    if (currentTitles.indexOf(item.title) === -1) {
                        store.add(item);
                        addedCount++;
                    }
                }

                // データベースへの書き込みがすべて成功・完了した時の処理
                transaction.oncomplete = function() {
                    if (addedCount > 0) {
                        alert("GitHub（シミュレート）から新着ニュースを " + addedCount + " 件プールに読み込みました！");
                        renderAllArticles(); // 画面をリフレッシュ
                    } else {
                        alert("新着ニュースはありません（すべて読込済みです）。");
                    }
                };
            };
        };

        // --- 【後編追加】4回連続のかまかけ（確認）付き絶対リセット機能 ---
        function secureReset() {
            var warnings = [
                "【確認 1/4】本当にすべてのニュースデータ、および分類ログを初期化しますか？",
                "【確認 2/4】クッキー削除でも消えないデータベース（IndexedDB）内のデータが完全に削除されます。本当によろしいですか？",
                "【確認 3/4】ジャンル分けした仕込みの記憶もリセットされます。後悔しませんか？",
                "【最終確認 4/4】これが最後の警告です。本当にすべて消去して初期状態に戻しますか？"
            ];

            // 4回の確認ダイアログを順番に出撃させる
            for (var i = 0; i < warnings.length; i++) {
                if (!confirm(warnings[i])) {
                    alert("リセットをキャンセルしました。大切なデータは守られました。");
                    return; // 1回でもキャンセルが押されたら即座に処理を中断
                }
            }

            // 4回ともすべて「OK」を突き進んだ場合のみ全データを物理削除
            var transaction = db.transaction(['articles'], 'readwrite');
            var store = transaction.objectStore(['articles']);
            var clearRequest = store.clear();

            clearRequest.onsuccess = function() {
                alert("すべてのデータを完全にリセットしました。画面を初期化します。");
                location.reload();
            };
        }

        // --- システム全体の起動初期化処理（前編のフックをここで完全に結合） ---
        document.addEventListener('DOMContentLoaded', async function() {
            // 1. データベースに接続
            await initDB();
            // 2. 30ジャンルのテーブル骨組みを作成
            createGenreBoxes();
            // 3. すでに保存されているデータを画面に綺麗に分配
            renderAllArticles();
            // 4. 安全リセットボタンに4回かまかけイベントを紐付け
            document.getElementById('reset-btn').onclick = secureReset;
        });
    </script>
</body>
</html>

    </script>
</body>
</html>
