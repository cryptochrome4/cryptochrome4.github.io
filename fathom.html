<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://w3.org" lang="ja" xml:lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>CoinPost ニュース仕分けボード (2013 Retro Edition)</title>
<style type="text/css">
/* 2013年のブラウザ互換性を重視したレトロCSS */
body {
    font-family: "ヒラギノ角ゴ Pro W3", "Hiragino Kaku Gothic Pro", "メイリオ", Meiryo, Osaka, "ＭＳ Ｐゴシック", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #333333;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}
h1 {
    font-size: 24px;
    color: #003366;
    margin-bottom: 5px;
}
p.description {
    font-size: 12px;
    color: #666666;
    margin-top: 0;
    margin-bottom: 20px;
}
/* 入力エリア */
.input-area {
    background-color: #ffffff;
    border: 1px solid #cccccc;
    padding: 15px;
    margin-bottom: 20px;
}
.input-area table {
    width: 100%;
}
.input-area td {
    padding: 5px;
}
.input-area input[type="text"], .input-area select {
    width: 95%;
    padding: 5px;
    font-size: 14px;
}
.btn {
    padding: 5px 15px;
    font-size: 14px;
    background-color: #0055aa;
    color: #ffffff;
    border: 1px solid #003366;
    cursor: pointer;
}
.btn:hover {
    background-color: #003366;
}
.btn-danger {
    background-color: #cc0000;
    border: 1px solid #990000;
}
.btn-danger:hover {
    background-color: #990000;
}
/* メインレイアウト */
.board-container {
    width: 100%;
    overflow: hidden; /* floatクリア用 */
}
/* POOL（左側） */
.pool-box {
    float: left;
    width: 30%;
    background-color: #e6f2ff;
    border: 2px solid #0055aa;
    padding: 10px;
    min-height: 600px;
}
/* ジャンルエリア（右側） */
.genres-box {
    float: right;
    width: 66%;
    background-color: #ffffff;
    border: 1px solid #cccccc;
    padding: 10px;
    min-height: 600px;
}
.pool-box h2, .genres-box h2 {
    font-size: 18px;
    margin-top: 0;
    padding-bottom: 5px;
    border-bottom: 1px solid #cccccc;
}
/* ジャンルごとの格子レイアウト */
.genre-card {
    float: left;
    width: 46%;
    margin: 1%;
    background-color: #f9f9f9;
    border: 1px solid #dddddd;
    padding: 8px;
    min-height: 120px;
}
.genre-card h3 {
    font-size: 14px;
    margin: 0 0 8px 0;
    background-color: #003366;
    color: #ffffff;
    padding: 3px 5px;
}
/* ニュースアイテムのスタイル */
.news-item {
    background-color: #ffffff;
    border: 1px solid #bbbbbb;
    padding: 5px;
    margin-bottom: 8px;
    font-size: 13px;
}
.news-date {
    font-weight: bold;
    color: #666666;
    font-family: monospace;
    margin-right: 5px;
}
.news-title {
    word-break: break-all;
}
.news-actions {
    margin-top: 5px;
    font-size: 11px;
    text-align: right;
}
.news-actions select {
    font-size: 11px;
}
/* システムコントロール */
.sys-control {
    margin-top: 30px;
    padding-top: 15px;
    border-top: 1px dashed #cccccc;
    text-align: right;
}
</style>
</head>
<body>

<h1>CoinPost ニュース仕分けボード</h1>
<p class="description">毎日タイトルを登録し、SEC・CFTC・トランプ大統領などのジャンルに分類して握力を鍛えるボードです。</p>

<!-- ニュース手動追加エリア -->
<div class="input-area">
    <table>
        <tr>
            <td width="15%"><strong>記事の日付:</strong></td>
            <td width="20%">
                <select id="input_year"></select>
                <select id="input_month"></select>
                <select id="input_day"></select>
            </td>
            <td width="50%"><strong>ニュースタイトル:</strong></td>
            <td width="15%">&nbsp;</td>
        </tr>
        <tr>
            <td colspan="2" style="font-size:11px; color:#666666;">※本日からの記事を想定（2013-2050年選択可）</td>
            <td><input type="text" id="input_title" placeholder="トランプ大統領、来週の仮想通貨・予測市場会合に出席見込み＝報道" /></td>
            <td><input type="button" value="POOLに追加" class="btn" onclick="addNewsToPool()" /></td>
        </tr>
    </table>
</div>

<!-- メインボード -->
<div class="board-container">
    
    <!-- 左側：未分類プール -->
    <div class="pool-box">
        <h2>📥 ニュース POOL</h2>
        <div id="pool_list">
            <!-- ここにJavaScriptで未分類ニュースが入ります -->
        </div>
    </div>
    
    <!-- 右側：30個のジャンル振り分け先 -->
    <div class="genres-box">
        <h2>📂 ジャンル別分類 (30ジャンル枠)</h2>
        <div id="genres_container">
            <!-- ここにJavaScriptで30個のフォルダカードが生成されます -->
        </div>
    </div>

</div>

<!-- システム管理（4回かまをかけるリセット） -->
<div class="sys-control">
    <input type="button" value="⚡ データを完全リセット" class="btn btn-danger" onclick="tripleCheckReset(1)" />
</div>

<!-- ここから中編のJavaScriptにつづく -->
<script type="text/javascript">
// ----------------------------------------------------
// 2013年レトロ互換仕様 JavaScript（中編：データ定義と初期化）
// ----------------------------------------------------

// 1. ジャンル定義（ご要望の「30ジャンル」をあらかじめ配列で確保）
// 主要な重要ワードを先頭に配置し、残りは拡張可能な空きスロットとして30個定義
var GENRE_NAMES = [
    "トランプ大統領 / 政権",
    "SEC（証券取引委員会）",
    "CFTC（商品先物取引委員会）",
    "リップル（XRP） / Ripple社",
    "ビットコイン（BTC）",
    "イーサリアム（ETH）",
    "ステーブルコイン（USDC/USDT）",
    "仮想通貨・予測市場会合",
    "クラリティー法案 / 規制動向",
    "KBRA / 格付・機関投資家",
    "金融業界 / 伝統金融",
    "ホワイトハウス動向",
    "CoinPost 主要ニュース",
    "ジャンル14（未設定）", "ジャンル15（未設定）",
    "ジャンル16（未設定）", "ジャンル17（未設定）", "ジャンル18（未設定）",
    "ジャンル19（未設定）", "ジャンル20（未設定）", "ジャンル21（未設定）",
    "ジャンル22（未設定）", "ジャンル23（未設定）", "ジャンル24（未設定）",
    "ジャンル25（未設定）", "ジャンル26（未設定）", "ジャンル27（未設定）",
    "ジャンル28（未設定）", "ジャンル29（未設定）", "ジャンル30（未設定）"
];

// 2. グローバルデータ構造（localStorageに保存するデータ）
// ニュース一つ一つは { id:タイムスタンプ, date:"20260810", title:"タイトル", genreId:-1(POOL)か0〜29 } というオブジェクト
var appData = {
    newsList: []
};

// 3. 画面初期化処理（ページが読み込まれたときに実行）
window.onload = function() {
    initDateSelects();     // 日付選択プルダウンの生成 (2013〜2050年)
    initGenreCards();      // 右側の30ジャンル枠のHTML生成
    loadData();            // localStorageからのデータ読み込み
    renderBoard();         // 画面へのニュース描画
};

// 4. 日付選択プルダウン（2013年〜2050年）の自動生成
function initDateSelects() {
    var yearSelect = document.getElementById("input_year");
    var monthSelect = document.getElementById("input_month");
    var daySelect = document.getElementById("input_day");
    
    // 現在の年月日を初期値として取得（今日からの記事用）
    var today = new Date();
    var currentYear = today.getFullYear();
    var currentMonth = today.getMonth() + 1;
    var currentDay = today.getDate();
    
    // 年: 2013年〜2050年
    for (var y = 2013; y <= 2050; y++) {
        var opt = document.createElement("option");
        opt.value = y;
        opt.innerHTML = y + "年";
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
    }
    
    // 月: 1月〜12月
    for (var m = 1; m <= 12; m++) {
        var opt = document.createElement("option");
        var mStr = m < 10 ? "0" + m : "" + m;
        opt.value = mStr;
        opt.innerHTML = m + "月";
        if (m === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
    }
    
    // 日: 1日〜31日
    for (var d = 1; d <= 31; d++) {
        var opt = document.createElement("option");
        var dStr = d < 10 ? "0" + d : "" + d;
        opt.value = dStr;
        opt.innerHTML = d + "日";
        if (d === currentDay) opt.selected = true;
        daySelect.appendChild(opt);
    }
}

// 5. 右側の30ジャンルコンテナのHTML構築
function initGenreCards() {
    var container = document.getElementById("genres_container");
    var htmlBuffer = "";
    
    // 2013年当時は文字列結合によるHTML構築が最速かつ安全
    for (var i = 0; i < GENRE_NAMES.length; i++) {
        htmlBuffer += '<div class="genre-card">';
        htmlBuffer += '<h3>[' + (i + 1) + '] ' + GENRE_NAMES[i] + '</h3>';
        htmlBuffer += '<div id="genre_list_' + i + '"></div>';
        htmlBuffer += '</div>';
    }
    
    container.innerHTML = htmlBuffer;
}

// 6. データのローカル保存と読み込み（localStorageを使用）
// ※クッキー削除やブラウザ再起動を行っても、同一PC・同一ブラウザであればデータは残ります
function saveData() {
    if (window.localStorage) {
        // 2013年互換のため、JSON文字列に変換して保存
        window.localStorage.setItem("coinpost_board_data", JSON.stringify(appData));
    }
}

function loadData() {
    if (window.localStorage) {
        var rawData = window.localStorage.getItem("coinpost_board_data");
        if (rawData) {
            try {
                appData = JSON.parse(rawData);
                // データ構造が古い、または壊れていた場合のフォールバック
                if (!appData.newsList) {
                    appData.newsList = [];
                }
            } catch(e) {
                appData = { newsList: [] };
            }
        }
    }
}

// ここから後編（ニュースの追加、ジャンル移動、4回かまをかけるリセット等）につづく
</script>
</body>
</html>
