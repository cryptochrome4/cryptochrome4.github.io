<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CoinPost Title Hub for PS4</title>
    <style>
        /* PS4ブラウザが絶対に誤解しない、古典的かつ堅牢なカラーと基本設定 */
        body {
            background-color: #121214;
            color: #e2e8f0;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            font-size: 14px;
        }

        /* 上部のシステムヘッダー */
        #ps4-header {
            background-color: #1e1e24;
            padding: 15px;
            border-bottom: 2px solid #334155;
            margin-bottom: 15px;
        }
        #ps4-title {
            float: left;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
            line-height: 36px;
        }
        .system-controls {
            float: right;
        }

        /* コントローラーのカーソルで絶対に押しやすい、大きめの操作ボタン */
        button {
            background-color: #3b82f6;
            color: #ffffff;
            border: 1px solid #2563eb;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
        }
        button.btn-danger {
            background-color: #ef4444;
            border: 1px solid #dc2626;
        }

        /* float（浮動配置）のつまづきを防ぐ確実な回り込み解除 */
        .clear {
            clear: both;
        }

        /* 【PS4専用設計】Gridを使わず、左右2分割を絶対に維持するテーブル構造 */
        .main-wrapper {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        .main-row {
            display: table-row;
        }

        /* 左側：新着ニュースが入るPOOL cell (横幅を全体の25%に固定) */
        .pool-cell {
            display: table-cell;
            width: 25%;
            background-color: #1e1e24;
            border: 1px solid #334155;
            vertical-align: top;
            padding: 15px;
        }

        /* 右側：30個のジャンル箱を並べるベース cell */
        .genre-cell {
            display: table-cell;
            width: 75%;
            vertical-align: top;
            padding-left: 15px;
        }

        .pool-header {
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* 30ジャンルをPS4の画面上で横3列にガチッと等間隔で並べる設定 */
        .genre-box-wrapper {
            float: left;
            width: 33.3%;
            box-sizing: border-box;
            padding: 0 5px 15px 5px;
        }
        .genre-box {
            background-color: #1e1e24;
            border: 1px solid #334155;
            padding: 12px;
            height: 280px; /* 高さを揃えてガタつきを完全に防止 */
            overflow-y: auto; /* 記事が増えたら箱の中で個別にスクロール */
        }
        .genre-title {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* ニュースリスト共通 */
        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
                /* 【中編追加】テレビ画面で見やすく、カーソルを合わせやすい特大ニュースカード */
        .news-card {
            background-color: #2a2a35;
            border: 2px solid #475569; /* 枠線を太くして存在感を強調 */
            padding: 14px;
            margin-bottom: 14px;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .news-title-text {
            font-size: 14px; /* PS4の解像度でもハッキリ読めるサイズ */
            line-height: 1.6;
            margin-bottom: 12px;
            word-break: break-all;
            color: #ffffff;
            font-weight: bold;
        }

        /* 操作パネルの背景を一段暗くしてメリハリをつける */
        .card-controls {
            margin-bottom: 12px;
            background-color: #1a1a20;
            padding: 8px;
            border-radius: 4px;
        }

        /* 日付入力の文字をより大きく、ハッキリと */
        .date-input-field {
            background-color: #2e2e38;
            color: #00ff66; /* 入力中の数字を鮮やかなグリーンにして視認性アップ */
            border: 1px solid #64748b;
            padding: 8px;
            font-size: 15px;
            width: 110px;
            font-family: monospace;
            box-sizing: border-box;
            vertical-align: middle;
            text-align: center;
        }

        /* 日付確定ボタン（コントローラーのカーソルが吸い付きやすい大きめサイズ） */
        .btn-save-date {
            background-color: #10b981;
            border: 1px solid #059669;
            color: white;
            font-size: 14px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 6px;
            border-radius: 4px;
        }

        /* 分配用セレクトボックス（PS4で最も選択ミスが起きない高さと余白） */
        .move-select {
            width: 100%;
            background-color: #0f172a;
            color: #cbd5e1;
            border: 2px solid #475569;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            box-sizing: border-box;
            border-radius: 4px;
        }

        /* 画面から離れても絶対に日付が読み取れる高コントラストなオレンジバッジ */
        .badge-date {
            display: inline-block;
            background-color: #ff9900; /* ビットコイン・暗号資産をイメージしたオレンジ */
            color: #000000;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            margin-bottom: 10px;
            font-family: monospace;
            border-radius: 3px;
        }

    </style>
</head>
<body>

    <!-- ヘッダー構造 -->
    <div id="ps4-header">
        <div id="ps4-title">CoinPost ニュースタイトル・ハブ (PS4完全最適化版)</div>
        <div class="system-controls">
            <button id="import-btn">GitHubからデータ投入 (仮)</button>
            <button id="reset-btn" class="btn-danger">全データ安全リセット</button>
        </div>
        <div class="clear"></div>
    </div>

    <!-- 左右2分割メインレイアウト -->
    <div class="main-wrapper">
        <div class="main-row">
            
            <!-- 左カラム：ニュースプール -->
            <div class="pool-cell">
                <div class="pool-header">
                    <span>📰 ニュース POOL</span>
                    <span id="pool-count" style="float: right; font-size: 12px; color: #94a3b8;">0 件</span>
                    <div class="clear"></div>
                </div>
                <!-- PS4で確実に個別スクロールさせるための独立エリア -->
                <div style="height: 600px; overflow-y: auto;">
                    <ul id="news-pool" class="news-list"></ul>
                </div>
            </div>

            <!-- 右カラム：30ジャンルエリア -->
            <div class="genre-cell">
                <div id="genre-container">
                    <!-- ここにJavaScriptで30枚のボックスを自動で並べます -->
                </div>
                <div class="clear"></div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. IndexedDB 永続保存システム (PS4完全互換版) ---
        var DB_NAME = 'CoinPostHubDB_PS4_Perfect';
        var DB_VERSION = 1;
        var db;

        // 最新のasync/awaitを徹底排除し、古いブラウザが絶対にエラーを出さない記述
        function initDB() {
            return new Promise(function(resolve, reject) {
                var request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = function() { reject('DB起動失敗'); };
                request.onsuccess = function(e) {
                    db = e.target.result;
                    resolve(db);
                };

                request.onupgradeneeded = function(e) {
                    var database = e.target.result;
                    if (!database.objectStoreNames.contains('articles')) {
                        database.createObjectStore('articles', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        // --- 2. 30個のジャンル定義 ---
        var defaultGenres = [
            "SEC関連", "CFTC関連", "トランプ大統領発言", "リップル(XRP)公式", "予測市場・マクロ",
            "ジャンル6", "ジャンル7", "ジャンル8", "ジャンル9", "ジャンル10",
            "ジャンル11", "ジャンル12", "ジャンル13", "ジャンル14", "ジャンル15",
            "ジャンル16", "ジャンル17", "ジャンル18", "ジャンル19", "ジャンル20",
            "ジャンル21", "ジャンル22", "ジャンル23", "ジャンル24", "ジャンル25",
            "ジャンル26", "ジャンル27", "ジャンル28", "ジャンル29", "ジャンル30"
        ];

        // 画面に30個のジャンルボックスの骨組みを流し込む関数
        function createGenreBoxes() {
            var container = document.getElementById('genre-container');
            container.innerHTML = '';
            
            for (var i = 0; i < defaultGenres.length; i++) {
                var wrapper = document.createElement('div');
                wrapper.className = 'genre-box-wrapper';
                
                wrapper.innerHTML = 
                    '<div class="genre-box" data-genre-id="' + i + '">' +
                        '<div class="genre-title">' + (i + 1) + '. ' + defaultGenres[i] + '</div>' +
                        '<ul class="news-list" id="genre-list-' + i + '"></ul>' +
                    '</div>';
                
                container.appendChild(wrapper);
            }
        }
