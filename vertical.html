<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギリシャ証券 - マーケット情報</title>
<style>
  /* ===== グランジ風ベース ===== */
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root {
    --concrete: #2b2b2b;
    --concrete-light: #3a3a3a;
    --concrete-dark: #1a1a1a;
    --rust: #a85a3a;
    --rust-bright: #c96a45;
    --acid: #b8c94a;
    --bone: #d8d2c2;
    --bone-dim: #9a9488;
    --blood: #7a2a1a;
    --ink: #e8e2d4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Zen Kaku Gothic New', 'Shippori Mincho', sans-serif;
    background: var(--concrete);
    background-image:
      /* グランジノイズ */
      radial-gradient(circle at 15% 20%, rgba(0,0,0,0.35), transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(0,0,0,0.3), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(80,70,50,0.15), transparent 60%),
      repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 6px),
      repeating-linear-gradient(-45deg, transparent, transparent 5px, rgba(255,255,255,0.015) 5px, rgba(255,255,255,0.015) 10px);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* ===== 左サイドバー ===== */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--concrete-dark);
    background-image:
      radial-gradient(circle at 30% 10%, rgba(120,60,30,0.15), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(60,60,40,0.2), transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.15) 4px, rgba(0,0,0,0.15) 8px);
    border-right: 3px solid #000;
    box-shadow: inset -8px 0 20px rgba(0,0,0,0.6), 6px 0 18px rgba(0,0,0,0.5);
    padding: 20px 0 40px;
    height: 100vh;
    overflow-y: auto;
    position: sticky;
    top: 0;
  }

  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-track { background: #111; }
  .sidebar::-webkit-scrollbar-thumb { background: #444; border: 1px solid #222; }

  .sidebar-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.2em;
    color: var(--acid);
    text-shadow: 2px 2px 0 #000, 0 0 12px rgba(184,201,74,0.4);
    padding: 6px 22px 18px;
    border-bottom: 2px dashed #444;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  /* 大カテゴリ */
  .cat {
    border-bottom: 1px solid #333;
  }
  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: transparent;
    border: none;
    padding: 12px 20px;
    font-family: 'Shippori Mincho', serif;
    font-size: 0.98rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--bone);
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    text-shadow: 1px 1px 0 #000;
    position: relative;
  }
  .cat-header:hover {
    background: linear-gradient(90deg, rgba(168,90,58,0.25), transparent);
    color: var(--acid);
    padding-left: 26px;
  }
  .cat-header::before {
    content: '▶';
    font-size: 0.7rem;
    color: var(--rust);
    margin-right: 8px;
    transition: transform 0.25s;
    display: inline-block;
  }
  .cat.open .cat-header::before {
    transform: rotate(90deg);
    color: var(--acid);
  }
  .cat-header span.label { flex: 1; }

  /* サブ項目 */
  .cat-items {
    display: none;
    background: #151515;
    border-top: 1px solid #000;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.7);
  }
  .cat.open .cat-items { display: block; }

  .cat-items button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px dotted #2e2e2e;
    padding: 9px 20px 9px 34px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.85rem;
    color: var(--bone-dim);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .cat-items button::before {
    content: '▶';
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.55rem;
    color: #555;
    transition: color 0.15s;
  }
  .cat-items button:hover {
    background: linear-gradient(90deg, rgba(184,201,74,0.12), transparent);
    color: var(--acid);
    padding-left: 40px;
  }
  .cat-items button:hover::before { color: var(--acid); }

  /* ===== メインエリア ===== */
  .main {
    flex: 1;
    padding: 40px 50px;
    position: relative;
    overflow-y: auto;
    height: 100vh;
  }

  .main h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    color: var(--bone);
    text-shadow: 3px 3px 0 #000, 0 0 20px rgba(168,90,58,0.5);
    margin-bottom: 8px;
    position: relative;
  }
  .main h1::after {
    content: '';
    display: block;
    width: 120px;
    height: 4px;
    margin-top: 12px;
    background: linear-gradient(90deg, var(--rust), var(--acid), transparent);
  }
  .main .subtitle {
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    color: var(--bone-dim);
    margin-bottom: 30px;
  }
  .main .hint {
    font-size: 0.85rem;
    color: #777;
    border-left: 3px solid var(--rust);
    padding: 8px 14px;
    background: rgba(0,0,0,0.25);
    max-width: 520px;
    line-height: 1.7;
  }

  /* ===== モーダル ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    background-image: radial-gradient(circle at 50% 50%, rgba(60,40,20,0.3), transparent 70%);
    z-index: 500;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #1e1e1e;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(120,60,30,0.18), transparent 50%),
      repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(0,0,0,0.2) 4px, rgba(0,0,0,0.2) 8px);
    border: 2px solid var(--rust);
    border-radius: 4px;
    max-width: 620px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 0 0 1px #000, 0 0 40px rgba(168,90,58,0.3), 10px 10px 0 rgba(0,0,0,0.6);
    position: relative;
    animation: modalIn 0.22s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(14px) scale(0.97); filter: blur(3px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .modal-header {
    background: linear-gradient(180deg, #2a2a2a, #151515);
    padding: 16px 22px;
    border-bottom: 2px solid var(--rust);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .modal-header h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--acid);
    text-shadow: 2px 2px 0 #000;
  }
  .modal-close {
    background: var(--blood);
    color: var(--ink);
    border: 1px solid #000;
    border-radius: 3px;
    width: 32px;
    height: 32px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .modal-close:hover { background: var(--rust-bright); transform: rotate(90deg); }

  .modal-body { padding: 22px 26px 30px; }

  .modal-body .meaning { margin-bottom: 20px; }
  .modal-body .meaning h3 {
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    color: var(--acid);
    margin-bottom: 10px;
    border-left: 4px solid var(--rust);
    padding-left: 10px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #000;
  }
  .modal-body .meaning p {
    font-size: 0.95rem;
    line-height: 1.85;
    color: var(--bone);
  }

  .modal-body .soccer {
    background: rgba(0,0,0,0.45);
    border: 1px dashed var(--acid);
    border-radius: 4px;
    padding: 16px 18px;
    position: relative;
  }
  .modal-body .soccer::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(-45deg, transparent, transparent 6px, rgba(184,201,74,0.03) 6px, rgba(184,201,74,0.03) 12px);
    pointer-events: none;
  }
  .modal-body .soccer h3 {
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    color: var(--acid);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #000;
    position: relative;
  }
  .modal-body .soccer p {
    font-size: 0.95rem;
    line-height: 1.85;
    color: var(--bone);
    position: relative;
  }

  /* ===== レスポンシブ ===== */
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: 0;
      height: auto;
      max-height: 45vh;
      position: relative;
      border-right: none;
      border-bottom: 3px solid #000;
    }
    .main {
      height: auto;
      padding: 24px 18px;
    }
    .main h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<!-- ===== 左サイドバー ===== -->
<aside class="sidebar">
  <div class="sidebar-title">MARKET DATA</div>

  <!-- 指数・為替・金利 -->
  <div class="cat" data-cat>

      <button data-term="国内市況">国内市況</button>

  </div>

  <!-- ニュース -->
  <div class="cat" data-cat>
    <button class="cat-header" data-term="ニュース"><span class="label">ニュース</span></button>

      <button data-term="経済指標（ニュース）">経済指標</button>

  <!-- ご注意情報 -->
  <div class="cat" data-cat>

      <button data-term="国内株式現物　本日の注意銘柄">国内株式現物　本日の注意銘柄</button>
      <button data-term="国内株式信用　本日の注意銘柄">国内株式信用　本日の注意銘柄</button>

  <!-- サポート2 -->
  <div class="cat" data-cat>

</aside>

<!-- ===== メイン ===== -->
<main class="main">
  <h1>ギリシャ証券</h1>
  <p class="subtitle">MARKET INFORMATION TERMINAL</p>
  <p class="hint">
    左のメニューから気になる項目をクリックしてください。<br>
    「この言葉の意味」と「サッカーで例えると」の解説が表示されます。
  </p>
</main>

<!-- ===== モーダル ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">

/* ============================================================
   モーダル制御
   ============================================================ */
const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalMeaning = document.getElementById('modalMeaning');
const modalSoccer = document.getElementById('modalSoccer');
const modalClose = document.getElementById('modalClose');

function openModal(term) {
  const data = TERMS[term];
  modalTitle.textContent = term;
  if (data) {
    modalMeaning.textContent = data.meaning;
    modalSoccer.textContent = data.soccer;
  } else {
    modalMeaning.textContent = "この用語の解説は準備中です。";
    modalSoccer.textContent = "サッカー例えも準備中です。";
  }
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================================
   カテゴリ開閉
   ============================================================ */
document.querySelectorAll('[data-cat]').forEach(cat => {
  const header = cat.querySelector('.cat-header');
  header.addEventListener('click', (e) => {
    e.stopPropagation();
    cat.classList.toggle('open');
  });
});

/* ============================================================
   すべての data-term ボタンにモーダルを紐付け
   （カテゴリヘッダー含む、ただし開閉もするのでstopPropagation）
   ============================================================ */
document.querySelectorAll('[data-term]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    openModal(btn.dataset.term);
  });
});

/* カテゴリヘッダーは開閉しつつモーダルも開く（両立） */
document.querySelectorAll('.cat-header').forEach(header => {
  header.addEventListener('click', (e) => {
    e.stopPropagation();
    const term = header.dataset.term;
    if (term) openModal(term);
  });
});
</script>
