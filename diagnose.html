    z-index: 0;

  /* Art Nouveau border frame */
  .frame {
    position: fixed;
    inset: 12px;
    border: 2px solid var(--gold);
    border-radius: 2px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
  }
  .frame::before, .frame::after {
    content: '❦';
    position: absolute;
    color: var(--gold);
    font-size: 1.8rem;
    opacity: 0.8;
  }

  .frame::after { bottom: -14px; right: 30px; background: var(--deep); padding: 0 8px; }

  }

  .corner.tr { top: 0; right: 0; transform: scaleX(-1); }
  .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .corner.br { bottom: 0; right: 0; transform: scale(-1,-1); }

    opacity: 0.7;
    font-weight: 300;
  }

  .divider {

    align-items: center;

    gap: 15px;
    margin: 25px 0;
    color: var(--gold);
    opacity: 0.6;
  }
  .divider::before, .divider::after {
    content: '';
    height: 1px;
    width: 80px;
    background: linear-gradient(to right, transparent, var(--gold));

  .divider::after { background: linear-gradient(to left, transparent, var(--gold)); }

  .legend {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-bottom: 40px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;

  .legend-item {

    color: var(--gold-light);
    opacity: 0.8;
  }
  .dot {
    width: 10px; height: 10px;

    border: 1.5px solid var(--gold);
  }
  .dot.lightning { background: var(--green); }
  .dot.exchange { background: var(--rose); }

    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 30px;

    transform: translateY(20px);

    to { opacity: 1; transform: translateY(0); }

// ============================================================
// ポートフォリオ計算
// ============================================================

const TOTAL_BUDGET = 50000; // 各タイプの総投資額（円）

function buildPortfolio(persona) {
  const weights = persona.weights;
  const active = COINS.filter(c => (weights[c.symbol] || 0) > 0);

  // 最低3000円保証：アクティブ銘柄数 × 3000 が総額を超えないように
  const minTotal = active.length * 3000;
  const budget = Math.max(TOTAL_BUDGET, minTotal);

  const totalWeight = active.reduce((s, c) => s + weights[c.symbol], 0);

  // まず重みで按分
  let allocs = active.map(c => ({
    ...c,
    weight: weights[c.symbol],
    amount: Math.round((weights[c.symbol] / totalWeight) * budget / 100) * 100 // 100円単位
  }));

  // 最低3000円を保証
  allocs.forEach(a => { if (a.amount < 3000) a.amount = 3000; });

  // 合計を再計算し、超過分を比率で調整
  let sum = allocs.reduce((s, a) => s + a.amount, 0);
  if (sum > 0) {
    const scale = budget / sum;
    allocs.forEach(a => {
      a.amount = Math.round(a.amount * scale / 100) * 100;
      if (a.amount < 3000) a.amount = 3000;
    });
  }

  // 最終合計
  const finalTotal = allocs.reduce((s, a) => s + a.amount, 0);
  const maxAmount = Math.max(...allocs.map(a => a.amount));

  return { allocs, total: finalTotal, maxAmount };
}

  header.innerHTML = `
    <div class="persona-name">${persona.name}</div>
    <div class="persona-desc">${persona.desc}</div>
  `;
  card.appendChild(header);

  // 合計

  totalEl.className = 'total';
  totalEl.textContent = `総投資額 ¥${total.toLocaleString()}`;
  card.appendChild(totalEl);

  // コインリスト

  list.className = 'coin-list';

  const sorted = [...allocs].sort((a, b) => b.amount - a.amount);

  sorted.forEach(coin => {
    const pct = ((coin.amount / total) * 100).toFixed(1);
    const barWidth = maxAmount > 0 ? (coin.amount / maxAmount) * 100 : 0;
    const typeClass = coin.lightning ? 'lightning' : 'exchange';
    const badgeText = coin.lightning ? 'L' : '販';
    const badgeClass = coin.lightning ? 'lightning' : 'exchange';

    const row = document.createElement('div');
    row.className = 'coin-row';
    row.innerHTML = `
      <div class="coin-symbol">${coin.symbol}<span class="badge ${badgeClass}">${badgeText}</span></div>
      <div class="coin-bar-wrap">
        <div class="coin-bar ${typeClass}" style="width:0%" data-width="${barWidth}%"></div>
      </div>
      <div class="coin-amount">¥${coin.amount.toLocaleString()}</div>
      <div class="coin-pct">${pct}%</div>
    `;
    list.appendChild(row);
  });

  card.appendChild(list);
  grid.appendChild(card);
});

// バーアニメーション
setTimeout(() => {
  document.querySelectorAll('.coin-bar').forEach(bar => {
    bar.style.width = bar.dataset.width;
  });
}, 300);

</script>
</body>
</html>
