<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ボールキック</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a12; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; padding: 10px 14px; color: #fff; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none; }
  #btns { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 44px); left: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  #btns button { font-size: 13px; font-weight: 700; color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.5); border-radius: 18px; padding: 8px 14px; }
  #btns button.on { background: #e0a800; border-color: #ffe08a; color: #1a1200; }
  #btns button:active { opacity: .7; }
  #msg { position: fixed; top: 34%; left: 0; right: 0; text-align: center; color: #fff; font-size: 44px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,.7); opacity: 0; transition: opacity .25s; pointer-events: none; }
  #hint { position: fixed; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: rgba(255,255,255,.8); font-size: 13px; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; transition: opacity .4s; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: rgba(255,255,255,.25); background: linear-gradient(transparent, rgba(0,0,0,.35)); }
  /* ステルスリンク: 最初は完全に透明。ゴール後にうっすら現れる */
  #secret { color: rgba(255,255,255,.3); text-decoration: none; font-size: 10px; opacity: 0; pointer-events: none; transition: opacity 1.2s; padding: 6px; }
  #secret.show { opacity: 1; pointer-events: auto; }
  #secret:active { color: #fff; }

  /* ===== オープン画面 ===== */
  #intro { position: fixed; inset: 0; z-index: 100; background: #000; color: #fff; overflow: hidden; }
  #intro.hidden { display: none; }
  #introVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #introShade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.15) 40%, rgba(0,0,0,.55)); pointer-events: none; transition: opacity .3s; }
  #introMain { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 20px; }
  #introTitle { font-size: 40px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 2px 12px rgba(0,0,0,.7); margin-bottom: 8px; text-align: center; }
  .ibtn { font-size: 16px; font-weight: 700; color: #fff; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.6); border-radius: 28px; padding: 12px 26px; min-width: 190px; }
  .ibtn:active { opacity: .7; }
  #startBtn { font-size: 20px; padding: 15px 34px; background: #e0a800; border-color: #ffe08a; color: #1a1200; }
  #audioBtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; min-width: 0; font-size: 14px; padding: 9px 16px; }
  #backBtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; min-width: 0; font-size: 14px; padding: 9px 16px; display: none; }
  #fitBar { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #fitBar .lbl { font-size: 11px; color: rgba(255,255,255,.8); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #fitBar .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 0 10px; }
  #fitBar button { font-size: 12px; font-weight: 700; color: #fff; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 7px 12px; }
  #fitBar button.on { background: #e0a800; border-color: #ffe08a; color: #1a1200; }
  #introErr { position: absolute; top: 50%; left: 0; right: 0; text-align: center; font-size: 12px; color: #ffb3b3; display: none; }
  /* 動画だけを見るモード: 主要ボタンを隠す */
  #intro.watch #introMain, #intro.watch #introShade { opacity: 0; pointer-events: none; }
  #intro.watch #backBtn { display: block; }
</style>
</head>
<body>
<div id="intro">
  <video id="introVideo" src="video2messi.mp4" autoplay muted loop playsinline preload="auto"></video>
  <div id="introShade"></div>
  <div id="introErr">video2messi.mp4 が見つかりません(ball.htmlと同じ場所に置いてください)</div>
  <button class="ibtn" id="backBtn">&larr; もどる</button>
  <button class="ibtn" id="audioBtn">&#128263; 音声オフ</button>
  <div id="introMain">
    <div id="introTitle">BALL KICK</div>
    <button class="ibtn" id="startBtn">はじめる</button>
    <button class="ibtn" id="watchBtn">動画だけを見る</button>
  </div>
  <div id="fitBar">
    <div class="lbl">動画の表示</div>
    <div class="row">
      <button data-fit="fill">fill (100% 100%)</button>
      <button data-fit="cover" class="on">cover</button>
      <button data-fit="contain">contain</button>
      <button data-fit="none">none</button>
    </div>
  </div>
</div>
<canvas id="c"></canvas>
<div id="hud"><div id="score">壁当て HIT 0</div><div id="shots">SHOT 0</div></div>
<div id="btns">
  <button id="modeBtn">壁の穴ありモード</button>
  <button id="regenBtn" style="display:none">穴を作り直す</button>
  <button id="resetBtn">ボールを戻す</button>
</div>
<div id="msg"></div>
<div id="hint">ボールをタップして蹴る<br>右を押すと左へ、左を押すと右へ。下を押すと浮く</div>
<footer>
  <span>&copy; ball</span>
  <a id="secret" href="study.html">study.html</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ===== 設定 =====
  var AUTO_REDIRECT = false;   // true にするとゴール直後に自動で study.html へ同タブ遷移
  var WALL_Z = -16;            // 壁の手前の面
  var WALL_W = 22;             // 壁の横幅
  var WALL_H = 7;              // 壁の高さ
  var WALL_T = 0.6;            // 壁の厚み
  var R = 0.5;                 // ボール半径
  var G = -9.8;
  var KICK_FWD = 16;           // 前への速さ
  var KICK_SIDE = 9;           // 横への最大速さ
  var HOLE_COUNT = 3;
  var HOLE_R_MIN = 1.2;        // 最小の穴の半径(ボール半径0.5の2.4倍 = 必ず入れる)
  var HOLE_R_MAX = 2.4;

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7fc4f0);
  scene.fog = new THREE.Fog(0x7fc4f0, 35, 80);
  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
  camera.position.set(0, 2.1, 4.5);
  camera.lookAt(0, 2.6, -14);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a7a3a, 0.9));
  var sun = new THREE.DirectionalLight(0xffffff, 0.55);
  sun.position.set(5, 12, 6);
  scene.add(sun);

  // ===== 芝(縞模様) =====
  for (var i = 0; i < 18; i++) {
    var stripe = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 4),
      new THREE.MeshLambertMaterial({ color: i % 2 ? 0x2f8f3f : 0x37a048 })
    );
    stripe.rotation.x = -Math.PI / 2;
    stripe.position.set(0, 0, 8 - i * 4 - 2);
    scene.add(stripe);
  }

  // ===== 壁 =====
  function makeBrickTexture() {
    var cv = document.createElement('canvas');
    cv.width = 128; cv.height = 64;
    var g = cv.getContext('2d');
    g.fillStyle = '#d8cdbb';
    g.fillRect(0, 0, 128, 64);
    var cols = ['#b2573d', '#a64e36', '#bd6046', '#ac523a'];
    for (var row = 0; row < 2; row++) {
      var off = row ? 32 : 0;
      for (var b = -1; b < 3; b++) {
        g.fillStyle = cols[(row * 2 + b + 4) % 4];
        g.fillRect(b * 64 + off + 2, row * 32 + 2, 60, 28);
      }
    }
    var tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(0.5, 1);   // 2m x 1m で1タイル
    return tex;
  }
  var brickTex = makeBrickTexture();
  var wallMat = new THREE.MeshLambertMaterial({ map: brickTex });
  var wallGroup = new THREE.Group();
  scene.add(wallGroup);
  var holes = [];

  function clearWall() {
    while (wallGroup.children.length) {
      var ch = wallGroup.children.pop();
      wallGroup.remove(ch);
      if (ch.geometry) ch.geometry.dispose();
    }
  }

  function genHoles() {
    var list = [];
    var tries = 0;
    while (list.length < HOLE_COUNT && tries < 400) {
      tries++;
      var r = HOLE_R_MIN + Math.random() * (HOLE_R_MAX - HOLE_R_MIN);
      var x = (Math.random() * 2 - 1) * (WALL_W / 2 - r - 0.6);
      var y = r + 0.4 + Math.random() * (WALL_H - 2 * r - 0.8);
      var ok = true;
      for (var j = 0; j < list.length; j++) {
        var dx = x - list[j].x, dy = y - list[j].y;
        if (Math.sqrt(dx * dx + dy * dy) < r + list[j].r + 0.7) { ok = false; break; }
      }
      if (ok) list.push({ x: x, y: y, r: r });
    }
    return list;
  }

  function buildWall(withHoles) {
    clearWall();
    holes = withHoles ? genHoles() : [];
    var shape = new THREE.Shape();
    shape.moveTo(-WALL_W / 2, 0);
    shape.lineTo(WALL_W / 2, 0);
    shape.lineTo(WALL_W / 2, WALL_H);
    shape.lineTo(-WALL_W / 2, WALL_H);
    shape.lineTo(-WALL_W / 2, 0);
    holes.forEach(function (h) {
      var p = new THREE.Path();
      p.absarc(h.x, h.y, h.r, 0, Math.PI * 2, true);
      shape.holes.push(p);
    });
    var geo = new THREE.ExtrudeGeometry(shape, { depth: WALL_T, bevelEnabled: false, curveSegments: 40 });
    var wall = new THREE.Mesh(geo, wallMat);
    wall.position.set(0, 0, WALL_Z - WALL_T);
    wallGroup.add(wall);
    // 穴のふち(見つけやすくする黄色いリング)
    holes.forEach(function (h) {
      var ring = new THREE.Mesh(
        new THREE.TorusGeometry(h.r, 0.08, 8, 48),
        new THREE.MeshBasicMaterial({ color: 0xffd23f })
      );
      ring.position.set(h.x, h.y, WALL_Z + 0.02);
      wallGroup.add(ring);
    });
  }

  // ===== ボール =====
  var geo = new THREE.IcosahedronGeometry(R, 1).toNonIndexed();
  var cols = [];
  var faceCount = geo.attributes.position.count / 3;
  for (var f = 0; f < faceCount; f++) {
    var dark = (f % 4 === 0);
    var c = dark ? [0.08, 0.08, 0.08] : [1, 1, 1];
    for (var k = 0; k < 3; k++) cols.push(c[0], c[1], c[2]);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  var ball = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  scene.add(ball);

  var shadow = new THREE.Mesh(
    new THREE.CircleGeometry(R, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })
  );
  shadow.rotation.x = -Math.PI / 2;
  scene.add(shadow);

  // ===== 状態 =====
  var vel = new THREE.Vector3();
  var holeMode = false;
  var state = 'ready';          // ready / flying / result
  var resultTimer = 0;
  var stillTimer = 0;
  var passed = false;           // 穴を通過したか
  var wallHitThisShot = false;
  var goals = 0, hits = 0, shots = 0;
  var msgTimer = 0;
  var clock = new THREE.Clock();
  var active = false;           // オープン画面中は止める

  var elScore = document.getElementById('score');
  var elShots = document.getElementById('shots');
  var elMsg = document.getElementById('msg');
  var elHint = document.getElementById('hint');
  var elSecret = document.getElementById('secret');
  var elMode = document.getElementById('modeBtn');
  var elRegen = document.getElementById('regenBtn');
  var elReset = document.getElementById('resetBtn');

  function updateHud() {
    elScore.textContent = holeMode ? ('GOAL ' + goals) : ('壁当て HIT ' + hits);
    elShots.textContent = 'SHOT ' + shots;
  }

  function showMsg(text, color, sec) {
    elMsg.textContent = text;
    elMsg.style.color = color || '#fff';
    elMsg.style.opacity = 1;
    msgTimer = sec || 0;
  }

  function resetBall() {
    ball.position.set(0, R, 0);
    vel.set(0, 0, 0);
    state = 'ready';
    passed = false;
    wallHitThisShot = false;
    stillTimer = 0;
    msgTimer = 0;
    elMsg.style.opacity = 0;
  }

  function setMode(hole) {
    holeMode = hole;
    elMode.classList.toggle('on', hole);
    elMode.textContent = hole ? '壁当てモードに戻す' : '壁の穴ありモード';
    elRegen.style.display = hole ? '' : 'none';
    buildWall(hole);
    resetBall();
    updateHud();
  }

  elMode.addEventListener('click', function () { setMode(!holeMode); });
  elRegen.addEventListener('click', function () { buildWall(true); resetBall(); });
  elReset.addEventListener('click', resetBall);

  function onGoal() {
    goals++;
    updateHud();
    showMsg('GOAL!', '#ffe14d', 0);
    // ステルスにフッターへ study.html を出す(同タブで遷移)
    elSecret.classList.add('show');
    if (AUTO_REDIRECT) {
      setTimeout(function () { location.href = 'study.html'; }, 1400);
    }
  }

  // ===== 入力: ボールのどこを押したかで飛ぶ向きが変わる =====
  // 右を押す→左へ / 左を押す→右へ / 下を押す→浮く / 上を押す→低く
  function kick(clientX, clientY) {
    if (state === 'result') return;
    var rect = canvas.getBoundingClientRect();
    camera.updateMatrixWorld();
    var c = ball.position.clone().project(camera);
    var right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    var e = ball.position.clone().addScaledVector(right, R).project(camera);
    var px = (c.x * 0.5 + 0.5) * rect.width + rect.left;
    var py = (-c.y * 0.5 + 0.5) * rect.height + rect.top;
    var ex = (e.x * 0.5 + 0.5) * rect.width + rect.left;
    var rs = Math.max(Math.abs(ex - px), 6);
    var hitR = Math.max(rs * 1.6, 34);
    var dx = clientX - px, dy = clientY - py;
    if (Math.sqrt(dx * dx + dy * dy) > hitR) return;   // ボールを押していない
    if (ball.position.z < -9) return;                   // 壁の近くは蹴れない

    var nx = Math.max(-1, Math.min(1, dx / rs));
    var ny = Math.max(-1, Math.min(1, dy / rs));

    vel.x = -nx * KICK_SIDE;
    vel.z = -KICK_FWD;
    vel.y = ny >= 0 ? 3 + ny * 7 : 3 + ny * 2;

    state = 'flying';
    wallHitThisShot = false;
    stillTimer = 0;
    shots++;
    updateHud();
    elHint.style.opacity = 0;
  }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    kick(e.clientX, e.clientY);
  });

  // ===== 物理 =====
  function step(dt) {
    if (state === 'ready') return;

    vel.y += G * dt;
    ball.position.addScaledVector(vel, dt);
    var p = ball.position;

    // 地面
    if (p.y < R) {
      p.y = R;
      if (vel.y < -0.8) vel.y = -vel.y * 0.6; else vel.y = 0;
      vel.x *= 0.94; vel.z *= 0.94;
    }
    if (p.y <= R + 0.001) {
      var fr = Math.max(0, 1 - 0.7 * dt);
      vel.x *= fr; vel.z *= fr;
    }

    // 壁との当たり
    if (!passed && vel.z < 0 && p.z - R <= WALL_Z && p.z > WALL_Z - WALL_T - R && Math.abs(p.x) < WALL_W / 2 + R) {
      var through = false;
      if (holeMode) {
        for (var i = 0; i < holes.length; i++) {
          var h = holes[i];
          var ddx = p.x - h.x, ddy = p.y - h.y;
          if (Math.sqrt(ddx * ddx + ddy * ddy) <= h.r - R * 0.75) { through = true; break; }
        }
      }
      if (through) {
        passed = true;
        state = 'result';
        resultTimer = 0;
        onGoal();
      } else {
        p.z = WALL_Z + R;
        vel.z = -vel.z * 0.7;
        vel.x *= 0.92;
        hits++;
        updateHud();
        if (holeMode && !wallHitThisShot) showMsg('おしい!', '#ffb36b', 0.8);
        wallHitThisShot = true;
      }
    }

    // 回転(転がり表現)
    ball.rotation.x -= vel.z * dt / R;
    ball.rotation.z += vel.x * dt / R;

    // 止まった / 場外
    var speed = vel.length();
    if (p.y <= R + 0.01 && speed < 0.4) stillTimer += dt; else stillTimer = 0;
    var out = p.z > 5.5 || p.z < -60 || Math.abs(p.x) > 40;
    if (state === 'flying' && (out || (stillTimer > 1.5 && p.z < -8.5))) {
      resetBall();
    }
  }

  function update() {
    var dt = Math.min(clock.getDelta(), 0.033);
    if (msgTimer > 0) {
      msgTimer -= dt;
      if (msgTimer <= 0) elMsg.style.opacity = 0;
    }
    if (state === 'result') {
      resultTimer += dt;
      step(dt);
      if (resultTimer > 2.2) {
        if (holeMode) buildWall(true);   // ゴールのたびに穴を作り直す
        resetBall();
      }
    } else {
      step(dt);
    }
    // 影
    shadow.position.set(ball.position.x, 0.02, ball.position.z);
    var s = Math.max(0.3, 1 - ball.position.y * 0.15);
    shadow.scale.set(s, s, s);
    shadow.material.opacity = 0.3 * s;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 1 ? 80 : 60;   // 縦長画面では視野を広げる
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  buildWall(false);
  resetBall();
  updateHud();

  window.__setBallActive = function (v) {
    active = !!v;
    clock.getDelta();   // 再開時の時間飛びを防ぐ
  };

  function loop() {
    requestAnimationFrame(loop);
    if (!active) return;
    update();
    renderer.render(scene, camera);
  }
  loop();
})();
</script>
<script>
(function () {
  var intro = document.getElementById('intro');
  var vid = document.getElementById('introVideo');
  var err = document.getElementById('introErr');
  var audioBtn = document.getElementById('audioBtn');
  var fitBtns = intro.querySelectorAll('[data-fit]');

  function tryPlay() {
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
  }
  vid.muted = true;   // 自動再生のため最初はミュート
  vid.loop = true;
  tryPlay();
  vid.addEventListener('error', function () { err.style.display = 'block'; });
  // 自動再生がブロックされた場合、最初のタッチで再生
  intro.addEventListener('pointerdown', function () { if (vid.paused) tryPlay(); });

  // 音声オンオフ
  function updateAudioLabel() {
    audioBtn.innerHTML = vid.muted ? '&#128263; 音声オフ' : '&#128266; 音声オン';
  }
  audioBtn.addEventListener('click', function () {
    vid.muted = !vid.muted;
    if (!vid.muted) { vid.volume = 1; }
    tryPlay();
    updateAudioLabel();
  });
  updateAudioLabel();

  // 表示切り替え: fill(100% 100%) / cover / contain / none
  Array.prototype.forEach.call(fitBtns, function (b) {
    b.addEventListener('click', function () {
      vid.style.objectFit = b.getAttribute('data-fit');
      Array.prototype.forEach.call(fitBtns, function (x) { x.classList.toggle('on', x === b); });
    });
  });

  // 動画だけを見る / もどる
  document.getElementById('watchBtn').addEventListener('click', function () { intro.classList.add('watch'); });
  document.getElementById('backBtn').addEventListener('click', function () { intro.classList.remove('watch'); });

  // はじめる: オープン画面を閉じて動画を止め、ゲーム開始
  document.getElementById('startBtn').addEventListener('click', function () {
    vid.pause();
    intro.classList.add('hidden');
    if (window.__setBallActive) window.__setBallActive(true);
  });
})();
</script>
</body>
</html>
