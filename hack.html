<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elon · terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0b0d10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* main screen container — fullscreen like a laptop */
        .screen {
            width: 100vw;
            height: 100vh;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.45s ease;
        }

        /* ----- BOOT SCREEN (img186car.jpg) ----- */
        .boot-screen {
            background-image: url('img186car.jpg');
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 0 18px rgba(0, 180, 255, 0.6);
            letter-spacing: 1px;
            background-color: #0a0c0e; /* fallback */
        }

        .boot-logo {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
            animation: pulseGlow 2s infinite alternate;
        }

        .boot-sub {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 0.5rem;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(0, 200, 255, 0.4); }
            100% { text-shadow: 0 0 30px rgba(0, 180, 255, 0.9), 0 0 10px rgba(255, 255, 255, 0.5); }
        }

        /* ----- PASSWORD SCREEN (img181gun.jpg) ----- */
        .pass-screen {
            background-image: url('img181gun.jpg');
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #121212; /* fallback */
            background-blend-mode: overlay;
        }

        .pass-panel {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(16px);
            padding: 3rem 4rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
            color: white;
        }

        .pass-panel h2 {
            font-weight: 400;
            font-size: 1.2rem;
            letter-spacing: 4px;
            margin-bottom: 1.8rem;
            opacity: 0.9;
        }

        .pass-input {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            padding: 1rem 1.8rem;
            font-size: 1.8rem;
            width: 260px;
            text-align: center;
            color: white;
            letter-spacing: 8px;
            outline: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .pass-input:focus {
            border-color: #3a8cff;
            box-shadow: 0 0 20px rgba(58, 140, 255, 0.4);
        }

        .pass-btn {
            margin-top: 1.5rem;
            background: #ffffff10;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.9rem 2.5rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            letter-spacing: 1.5px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }

        .pass-btn:hover {
            background: #ffffff20;
            border-color: #3a8cff;
        }

        .pass-error {
            margin-top: 1rem;
            color: #ff6b6b;
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* ----- HOME SCREEN (img151white.jpg) ----- */
        .home-screen {
            background-image: url('img151white.jpg');
            background-color: #1e1e1e; /* fallback */
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 4rem 3.5rem;
            gap: 2.2rem 2.8rem;
        }

        /* each icon wrapper */
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        }

        .icon-item:hover {
            transform: translateY(-6px) scale(1.02);
            filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.6));
        }

        .icon-img {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.1s;
            color: white;
        }

        .icon-label {
            margin-top: 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: white;
            text-shadow: 0 2px 8px black;
            letter-spacing: 0.4px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        /* hide screens except active */
        .hidden {
            display: none !important;
        }

        /* utility for fade */
        .screen {
            transition: opacity 0.3s;
        }

        /* no text hints, no comments */
    </style>
</head>
<body>
    <!-- BOOT SCREEN -->
    <div id="bootScreen" class="screen boot-screen">
        <div class="boot-logo">⏻</div>
        <div class="boot-sub">INITIALIZING SYSTEM</div>
    </div>

    <!-- PASSWORD SCREEN -->
    <div id="passScreen" class="screen pass-screen hidden">
        <div class="pass-panel">
            <h2>ENTER PASSCODE</h2>
            <input type="password" id="passInput" class="pass-input" maxlength="12" inputmode="numeric" autocomplete="off">
            <br>
            <button id="passSubmit" class="pass-btn">UNLOCK</button>
            <div id="passError" class="pass-error">INCORRECT CODE</div>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen home-screen hidden">
        <!-- icons — all english labels, one goes to marge.html (same tab) -->
        <div class="icon-item" data-target="terminal">
            <div class="icon-img">⌨️</div>
            <span class="icon-label">Terminal</span>
        </div>
        <div class="icon-item" data-target="files">
            <div class="icon-img">📁</div>
            <span class="icon-label">Files</span>
        </div>
        <div class="icon-item" data-target="browser">
            <div class="icon-img">🌐</div>
            <span class="icon-label">Browser</span>
        </div>
        <!-- MARGE ICON: no hint, just a normal icon. navigates to marge.html (same tab) -->
        <div class="icon-item" data-target="marge">
            <div class="icon-img">📄</div>
            <span class="icon-label">Marge</span>
        </div>
        <div class="icon-item" data-target="mail">
            <div class="icon-img">✉️</div>
            <span class="icon-label">Mail</span>
        </div>
        <div class="icon-item" data-target="settings">
            <div class="icon-img">⚙️</div>
            <span class="icon-label">Settings</span>
        </div>
        <div class="icon-item" data-target="camera">
            <div class="icon-img">📷</div>
            <span class="icon-label">Camera</span>
        </div>
        <div class="icon-item" data-target="music">
            <div class="icon-img">🎵</div>
            <span class="icon-label">Music</span>
        </div>
        <div class="icon-item" data-target="notes">
            <div class="icon-img">📝</div>
            <span class="icon-label">Notes</span>
        </div>
        <div class="icon-item" data-target="calendar">
            <div class="icon-img">📅</div>
            <span class="icon-label">Calendar</span>
        </div>
    </div>

    <script>
        (function() {
            // ---------- SCREEN REFS ----------
            const bootScreen = document.getElementById('bootScreen');
            const passScreen = document.getElementById('passScreen');
            const homeScreen = document.getElementById('homeScreen');
            const passInput = document.getElementById('passInput');
            const passSubmit = document.getElementById('passSubmit');
            const passError = document.getElementById('passError');

            // ---------- PASSWORD CHECK (obfuscated expression, no literal 167) ----------
            function isValid(input) {
                const val = parseInt(input, 10);
                if (isNaN(val)) return false;
                // three separate chunks: (50+50) + (30+7) + (20+10) = 167
                const part1 = 50 + 50;       // 100
                const part2 = 30 + 7;        // 37
                const part3 = 20 + 10;       // 30
                const target = part1 + part2 + part3; // 167
                return val === target;
            }

            // ---------- FLOW ----------
            function showScreen(screen) {
                [bootScreen, passScreen, homeScreen].forEach(s => s.classList.add('hidden'));
                screen.classList.remove('hidden');
            }

            // boot → after 10s → password screen
            setTimeout(() => {
                showScreen(passScreen);
                passInput.focus();
                passError.style.opacity = '0';
                passInput.value = '';
            }, 10000); // 10 seconds

            // password submit
            function attemptUnlock() {
                const raw = passInput.value.trim();
                if (isValid(raw)) {
                    // success → home screen
                    passError.style.opacity = '0';
                    showScreen(homeScreen);
                } else {
                    // error feedback
                    passError.style.opacity = '1';
                    passInput.value = '';
                    passInput.focus();
                    // small shake effect (optional)
                    passScreen.style.transform = 'translateX(4px)';
                    setTimeout(() => passScreen.style.transform = '', 100);
                }
            }

            passSubmit.addEventListener('click', attemptUnlock);
            passInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptUnlock();
                }
            });

            // ---------- ICON CLICK HANDLERS (all same tab) ----------
            document.querySelectorAll('.icon-item').forEach(icon => {
                icon.addEventListener('click', (e) => {
                    const target = icon.dataset.target;
                    // navigate to marge.html in the SAME tab for 'marge'
                    if (target === 'marge') {
                        window.location.href = 'marge.html';  // same tab
                        return;
                    }
                    // other icons — no navigation, just a subtle visual feedback
                    icon.style.transform = 'scale(0.95)';
                    setTimeout(() => icon.style.transform = '', 120);
                });
            });

            // optional: prevent double-tap zoom on mobile (not necessary but fine)
            // keep everything clean.
        })();
    </script>
</body>
</html>
