<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CROWD — Character Portfolio</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-card: #141414;
    --bg-panel: #101010;
    --fg: #f5f5f5;
    --fg-dim: #8a8a8a;
    --line: #2a2a2a;
    --accent: #e8ff3a;
    --accent-dim: rgba(232,255,58,0.15);
    --card-width: clamp(130px, 18vw, 190px);
    --img-fit: cover;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--fg);
    font-family: "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: 0.02em;
  }
  body { padding-bottom: 80px; overflow-x: hidden; }

  /* HEADER */
  .header { padding: 48px clamp(20px, 6vw, 80px) 32px; border-bottom: 1px solid var(--line); }
  .header__label { font-size: 11px; letter-spacing: 0.3em; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; }
  .header__title { font-size: clamp(28px, 6vw, 64px); font-weight: 800; line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase; }
  .header__title span { color: var(--accent); }
  .header__sub { margin-top: 20px; font-size: clamp(12px, 1.6vw, 14px); color: var(--fg-dim); max-width: 560px; line-height: 1.7; }

  /* SLIDER */
  .slider-section { padding: 40px 0 24px; border-bottom: 1px solid var(--line); }
  .slider-head { display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 6vw, 80px) 20px; flex-wrap: wrap; gap: 12px; }
  .slider-head__title { font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--fg-dim); }
  .slider {
    position: relative; width: 100%;
    height: calc(var(--card-width) * 4 / 3 + 80px);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 85%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 85%, transparent 100%);
  }
  .track { position: relative; width: 100%; height: 100%; }

  /* CARD */
  .card {
    position: absolute; left: 50%; top: 50%;
    width: var(--card-width); aspect-ratio: 3 / 4;
    margin-left: calc(var(--card-width) / -2);
    margin-top: calc(var(--card-width) * 4 / 3 / -2);
    background: var(--bg-card); cursor: pointer; overflow: hidden;
    border: 1px solid var(--line);
    will-change: transform, opacity, z-index;
    transform-origin: center center;
  }
  .card img { width: 100%; height: 100%; object-fit: var(--img-fit); display: block; pointer-events: none; filter: grayscale(15%); transition: filter 0.25s; }
  .card:hover img { filter: grayscale(0%); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 24px rgba(232,255,58,0.2); }
  .card.selected img { filter: grayscale(0%); }
  .card__badge { position: absolute; top: 8px; left: 8px; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; background: rgba(0,0,0,0.75); color: var(--accent); padding: 3px 7px; border: 1px solid var(--accent); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .card.selected .card__badge { opacity: 1; }

  /* PANEL */
  .panel-section { padding: 48px clamp(20px, 6vw, 80px); }
  .panel { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 40px; }
  .panel__empty { text-align: center; padding: 80px 20px; color: var(--fg-dim); font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; border: 1px dashed var(--line); }
  .panel__empty span { color: var(--accent); }

  .char-head { display: grid; grid-template-columns: auto 1fr; gap: clamp(20px, 4vw, 48px); align-items: end; padding-bottom: 32px; border-bottom: 1px solid var(--line); }
  .char-head__img { width: clamp(120px, 20vw, 200px); aspect-ratio: 3 / 4; object-fit: var(--img-fit); border: 1px solid var(--line); display: block; }
  .char-head__meta { min-width: 0; }
  .char-head__no { font-size: 11px; letter-spacing: 0.3em; color: var(--accent); margin-bottom: 8px; }
  .char-head__name { font-size: clamp(32px, 6vw, 64px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; word-break: break-word; }
  .char-head__type { margin-top: 12px; font-size: clamp(13px, 2vw, 16px); color: var(--fg-dim); line-height: 1.6; }

  .total-block { padding: 32px 0; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .total-block__label { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--fg-dim); }
  .total-block__value { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -0.02em; color: var(--accent); }
  .total-block__value small { font-size: 0.5em; color: var(--fg-dim); font-weight: 400; margin-left: 6px; }

  .cat { padding: 32px 0; border-bottom: 1px solid var(--line); }
  .cat:last-child { border-bottom: none; }
  .cat__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .cat__title { font-size: 14px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
  .cat__title::before { content: ''; display: inline-block; width: 10px; height: 10px; background: var(--accent); margin-right: 10px; transform: translateY(-1px); }
  .cat__sum { font-size: 12px; color: var(--fg-dim); letter-spacing: 0.05em; }

  .holding { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .holding:last-child { border-bottom: none; }
  .holding__name { font-size: 14px; font-weight: 600; }
  .holding__code { font-size: 11px; color: var(--fg-dim); margin-left: 8px; letter-spacing: 0.05em; }
  .holding__amount { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
  .holding__pct { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; text-align: right; width: 56px; }
  .holding__bar { grid-column: 1 / -1; height: 2px; background: var(--line); margin-top: 6px; position: relative; overflow: hidden; }
  .holding__bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width 0.4s ease; }

  /* FIT PANEL */
  .fit-panel { display: grid; gap: 12px; }
  .fit-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 16px 20px; background: var(--bg-panel); border: 1px solid var(--line); }
  .fit-row__label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-dim); }
  .fit-row__label strong { color: var(--accent); font-weight: 700; margin-left: 6px; letter-spacing: 0.1em; }
  .fit-switch { display: flex; gap: 6px; flex-wrap: wrap; }
  .fit-switch button { background: transparent; border: 1px solid var(--line); color: var(--fg-dim); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; padding: 7px 14px; cursor: pointer; border-radius: 2px; transition: all 0.2s; font-family: inherit; }
  .fit-switch button:hover { color: var(--fg); border-color: var(--fg-dim); }
  .fit-switch button.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

  @media (max-width: 640px) {
    .char-head { grid-template-columns: 1fr; align-items: start; }
    .char-head__img { width: 120px; }
    .holding { grid-template-columns: 1fr auto; }
    .holding__pct { width: auto; }
    .holding__bar { grid-column: 1 / -1; }
    .fit-row { padding: 14px; }
  }

  .footer { padding: 40px clamp(20px, 6vw, 80px); border-top: 1px solid var(--line); text-align: center; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--fg-dim); }
</style>
</head>
<body>

  <header class="header">
    <div class="header__label">Character Portfolio / No.01</div>
    <h1 class="header__title">誰の<span>ポートフォリオ</span><br>見てみる？</h1>
    <p class="header__sub">17人のキャラクターから1人を選んでください。<br>性格がにじみ出る株式配分を、100万円台で再現しています。</p>
  </header>

  <section class="slider-section">
    <div class="slider-head">
      <div class="slider-head__title">Select Character ── 円を描いて流れます / ホバーで停止</div>
    </div>
    <div class="slider" id="slider">
      <div class="track" id="track"></div>
    </div>
  </section>

  <section class="panel-section">
    <div class="panel" id="panel">
      <div class="panel__empty" id="panelEmpty">キャラクターを選択してください <span>↑</span></div>
    </div>
  </section>

  <footer class="footer">© CROWD — Character Portfolio</footer>

  <script src="crowd.js"></script>
</body>
</html>
