<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こしょうと船 - 投資モード</title>
<style>
    * { box-sizing: border-box; user-select: none; }
    body {
        margin: 0; min-height: 100vh; background: #0a1a2e;
        display: flex; justify-content: center; align-items: center;
        font-family: 'Courier New', Courier, monospace;
    }
    .game-wrapper {
        background: #1e2f4a; padding: 20px; border-radius: 28px;
        box-shadow: 0 20px 30px rgba(0,0,0,0.7);
    }
    canvas {
        display: block; margin: 0 auto; border-radius: 16px;
        box-shadow: inset 0 0 0 2px #3e5f7a, 0 0 0 3px #0b1622;
        image-rendering: crisp-edges;
    }
    .info-panel {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 14px; color: #e9f2f0;
        text-shadow: 2px 2px 0 #0b1b2a;
        font-weight: bold; letter-spacing: 0.5px; padding: 0 8px;
        flex-wrap: wrap; gap: 8px;
    }
    .info-panel span {
        background: #0e1e2b; padding: 6px 18px; border-radius: 40px;
        border: 2px solid #4a7a9c; box-shadow: inset 0 2px 0 #2e4b62;
        font-size: 1rem;
    }
    .info-panel .money { font-size: 1.15rem; color: #ffd966; }
    .info-panel .goal { color: #9be89b; }
    button {
        background: #3f6b8c; border: none; border-radius: 40px; color: white;
        font-weight: bold; font-family: inherit; padding: 8px 22px;
        font-size: 1rem; cursor: pointer; box-shadow: 0 6px 0 #1b2c3b, 0 8px 10px rgba(0,0,0,0.4);
        transition: 0.05s linear; letter-spacing: 1px; border: 1px solid #6a9fc0;
    }
    button:active { transform: translateY(5px); box-shadow: 0 2px 0 #1b2c3b, 0 5px 10px rgba(0,0,0,0.4); }
    .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.85); backdrop-filter: blur(3px);
        z-index: 100; transition: opacity 0.4s;
    }
    .overlay-card {
        background: #1d3449; border-radius: 48px; padding: 30px 50px;
        text-align: center; color: #edf7f5; box-shadow: 0 20px 30px #00000080, inset 0 0 0 3px #5f8aa8;
        max-width: 780px; border: 2px solid #9bc2db;
    }
    .overlay-card h1 {
        font-size: 2.6rem; margin: 0 0 10px; text-shadow: 6px 6px 0 #0e1b24;
        letter-spacing: 6px; color: #ffd966;
    }
    .overlay-card p { font-size: 1.05rem; margin: 12px 0; line-height: 1.6;
        background: #0e1f2c; padding: 10px 20px; border-radius: 60px; }
    .mode-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0 10px; }
    .mode-buttons button { background: #346f8c; box-shadow: 0 6px 0 #1a2c38; padding: 8px 20px; font-size: 0.95rem; }
    .mode-buttons button.selected {
        background: #ffb347; color: #1d2c3a; box-shadow: 0 6px 0 #a05f1a;
        border: 2px solid #ffdc9a; transform: scale(1.02);
    }
    .start-btn {
        background: #6ac46a; box-shadow: 0 8px 0 #2f6b2f;
        font-size: 1.5rem; padding: 12px 50px; margin-top: 16px;
        border: 2px solid #b1f0b1; letter-spacing: 4px;
    }
    .start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #2f6b2f; }
    .hidden { display: none !important; }
    .opening-bg {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-image: url('img39x.jpg'); background-size: cover;
        background-position: center; opacity: 0.3; z-index: 0;
    }
    .overlay .overlay-card { position: relative; z-index: 2; }
    .subnote { font-size: 0.85rem; color: #b8d0dd; margin-top: 12px; }

    /* ストーリーアニメーション */
    .story-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #050d16; z-index: 200;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: #e9f2f0; font-family: 'Courier New', monospace;
        padding: 40px;
    }
    .story-box {
        max-width: 900px; width: 100%;
        background: #0e1f2c; border: 3px solid #5f8aa8; border-radius: 24px;
        padding: 30px 40px; box-shadow: 0 20px 40px #000;
    }
    .story-title { font-size: 1.8rem; color: #ffd966; text-align: center;
        margin-bottom: 20px; letter-spacing: 4px; text-shadow: 4px 4px 0 #0e1b24; }
    .story-text {
        font-size: 1.15rem; line-height: 2; min-height: 200px;
        white-space: pre-wrap; color: #d4e9f7;
    }
    .story-cursor { display: inline-block; width: 10px; background: #ffd966; animation: blink 1s infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    .story-next {
        margin-top: 24px; text-align: center;
    }
    .story-next button {
        background: #ffb347; color: #1d2c3a;
        box-shadow: 0 6px 0 #a05f1a; font-size: 1.1rem;
        padding: 10px 40px; border: 2px solid #ffdc9a;
    }
    .story-scene {
        display: flex; justify-content: center; gap: 30px;
        margin: 20px 0; font-size: 2.5rem; letter-spacing: 8px;
    }
    .clear-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,20,10,0.92); z-index: 250;
        display: flex; justify-content: center; align-items: center;
        flex-direction: column; color: #fff;
    }
    .clear-card {
        background: #1a4a2a; border: 4px solid #6ac46a; border-radius: 30px;
        padding: 40px 60px; text-align: center; box-shadow: 0 0 60px #6ac46a80;
    }
    .clear-card h2 { font-size: 3rem; color: #ffd966; margin: 0 0 20px;
        text-shadow: 6px 6px 0 #0e1b24; letter-spacing: 8px; }
    .clear-card p { font-size: 1.3rem; line-height: 1.8; margin: 10px 0; }
    .clear-card .final-money { font-size: 2rem; color: #9be89b; font-weight: bold;
        background: #0e1f2c; padding: 10px 30px; border-radius: 40px; margin: 20px 0; }
    .log-panel {
        position: absolute; bottom: 10px; left: 10px;
        background: rgba(0,0,0,0.6); color: #ffd966;
        padding: 8px 14px; border-radius: 10px; font-size: 0.85rem;
        max-width: 400px; border: 1px solid #4a7a9c;
    }
</style>
</head>
<body>

<!-- オープニング -->
<div id="openingOverlay" class="overlay">
    <div class="opening-bg"></div>
    <div class="overlay-card">
        <h1>こしょうと船</h1>
        <p>投資の根源は こしょう と 船 の話</p>
        <p style="font-size:0.9rem; background:#0a1620;">— モードを選択 —</p>
        <div class="mode-buttons" id="modeSelector">
            <button data-mode="simple" class="selected">シンプル</button>
            <button data-mode="nisa">NISA</button>
            <button data-mode="domestic">国内株式</button>
            <button data-mode="foreign">外国株式</button>
            <button data-mode="trust">投資信託</button>
            <button data-mode="bond">債券</button>
            <button data-mode="fx">FX</button>
        </div>
        <button id="startGameBtn" class="start-btn">⚓ 出航 ⚓</button>
        <div class="subnote">※ 矢印キーで船を操作 / 目的地クリックで交易 / 島に帰ればクリア</div>
    </div>
</div>

<!-- ストーリーアニメーション画面 -->
<div id="storyScreen" class="story-screen hidden">
    <div class="story-box">
        <div class="story-title" id="storyTitle">こしょうと船の話</div>
        <div class="story-scene" id="storyScene"></div>
        <div class="story-text" id="storyText"></div>
        <div class="story-next">
            <button id="storyNextBtn">▶ 次へ</button>
        </div>
    </div>
</div>

<!-- ゲーム本体 -->
<div class="game-wrapper" id="gameWrapper" style="display:none; position:relative;">
    <canvas id="gameCanvas" width="900" height="560"></canvas>
    <div class="log-panel" id="logPanel"></div>
    <div class="info-panel">
        <span class="money" id="moneyDisplay">💰 こしょう: 0</span>
        <span class="goal" id="goalDisplay">🎯 目標: 1</span>
        <span id="modeLabel">シンプル</span>
        <button id="backToMenuBtn">メニュー</button>
    </div>
</div>

<!-- クリア画面 -->
<div id="clearScreen" class="clear-screen hidden">
    <div class="clear-card">
        <h2>⚓ 帰還 ⚓</h2>
        <p id="clearMessage">こしょうを集めて島に帰ってきた！</p>
        <div class="final-money" id="clearMoney">+0 こしょう</div>
        <p id="clearSub" style="font-size:1rem; color:#b8d0dd;"></p>
        <button onclick="location.reload()" style="margin-top:20px; font-size:1.2rem; padding:12px 40px;">もう一度</button>
    </div>
</div>

<script>
(function() {
    // =========================================================
    // 単位系（1円〜不可説不可説転）
    // =========================================================
    const UNITS = [
        { name: '円', value: 1 },
        { name: '万', value: 1e4 },
        { name: '億', value: 1e8 },
        { name: '兆', value: 1e12 },
        { name: '京', value: 1e16 },
        { name: '垓', value: 1e20 },
        { name: '秭', value: 1e24 },
        { name: '穣', value: 1e28 },
        { name: '溝', value: 1e32 },
        { name: '澗', value: 1e36 },
        { name: '正', value: 1e40 },
        { name: '載', value: 1e44 },
        { name: '極', value: 1e48 },
        { name: '恒河沙', value: 1e52 },
        { name: '阿僧祇', value: 1e56 },
        { name: '那由他', value: 1e60 },
        { name: '不可思議', value: 1e64 },
        { name: '無量大数', value: 1e68 },
        { name: '不可説不可説転', value: 1e72 }
    ];

    // 数値を読みやすく（大きい数は単位で表示）
    function formatMoney(v) {
        if (v < 10000) return Math.floor(v) + ' 円';
        for (let i = UNITS.length - 1; i >= 0; i--) {
            if (v >= UNITS[i].value) {
                const n = v / UNITS[i].value;
                if (n < 1000) return n.toFixed(2) + ' ' + UNITS[i].name + '円';
            }
        }
        return v.toExponential(2);
    }

    // =========================================================
    // モード定義（ストーリー・クリア条件・利益）
    // =========================================================
    const MODES = {
        simple: {
            label: 'シンプル',
            goal: 100,             // 100こしょうでクリア（後で調整）
            goalLabel: '100 こしょう',
            storyTitle: 'こしょうと船の話（シンプル）',
            intro: [
                { scene: '🏝️  ⛵  🌊', text: '昔々、こしょうは金と同じくらい貴重だった。\nインドや東南アジアでしか採れず、ヨーロッパでは\n原価の何百倍で売れた。' },
                { scene: '🪙  🧑‍🤝‍🧑  🪙', text: 'しかし、船を1隻出すには莫大な金がいる。\n船、乗組員、食料、武器…\n一人では到底無理だった。' },
                { scene: '🤝  ⛵  🤝', text: 'だから、みんなでお金を出し合った。\nこれが株式会社の始まり。\n投資の原型である。' },
                { scene: '🏝️  🚢  🌊', text: 'あなたは一隻の船を任された。\n島から出発し、港でこしょうを集め、\n再び島に帰ればミッション完了。' },
                { scene: '⚓  100  ⚓', text: '【シンプルモード】\n目標: 100 こしょうを集めて島に帰れ。\n原始的な貿易の世界。' }
            ],
            outro: [
                { scene: '🏝️  ⛵  💰', text: '船は無事、島に帰り着いた。\n積荷のこしょうはすべて売り払われ、\n出資者たちに分配された。' },
                { scene: '📜  🪙  📜', text: 'これが投資の原点。\nリスクを取って、リターンを得る。\nシンプルだが、それがすべての始まり。' }
            ]
        },
        nisa: {
            label: 'NISA',
            goal: 3600000,         // 360万こしょう（非課税枠）
            goalLabel: '360万 こしょう（非課税枠）',
            storyTitle: 'NISAモード — 非課税の島',
            intro: [
                { scene: '🏝️  📜  🏝️', text: '時の政府は「少額投資非課税制度」を布告した。\n毎年360万こしょうまでの利益に\n税金をかけない、というのだ。' },
                { scene: '🛡️  ⛵  🛡️', text: 'ただし、枠を超えた分には\nきっちり20%の課税が待っている。\n枠を意識して航海せよ。' },
                { scene: '📊  📈  📊', text: 'NISAの港は成長企業が多く、\n利益は通常より1.5倍。\n長期投資の味方である。' },
                { scene: '🏝️  🚢  🌊', text: '島から出発し、こしょうを集め、\n年間非課税枠360万こしょうを\n使い切って島に帰れ。' },
                { scene: '⚓  360万  ⚓', text: '【NISAモード】\n目標: 360万 こしょうを集めて島に帰れ。\n枠を超えたら課税される。' }
            ],
            outro: [
                { scene: '🏝️  📜  💰', text: '非課税枠を使い切った。\n税金は一切取られていない。\nこれがNISAの真骨頂。' },
                { scene: '📈  🪙  📈', text: '長期・積立・分散。\n非課税の恩恵は計り知れない。\nあなたは賢明な投資家だ。' }
            ]
        },
        domestic: {
            label: '国内株式',
            goal: 500000,          // 50万こしょう
            goalLabel: '50万 こしょう',
            storyTitle: '国内株式モード — 日本の港',
            intro: [
                { scene: '🗾  ⛵  🗾', text: 'あなたは日本の港を巡る商人だ。\n東京、大阪、名古屋…\n国内の取引所でこしょうを売買する。' },
                { scene: '📊  🏢  📊', text: '国内株式は配当がつく。\n一定時間ごとに自動で\nこしょうが入ってくるのだ。' },
                { scene: '📉  📈  📉', text: 'ただし、株価は上下する。\n港によっては価値が\n大きく変動することもある。' },
                { scene: '🏝️  🚢  🌊', text: '島から出発し、\n日本の港でこしょうを集め、\n50万こしょうを達成して島に帰れ。' },
                { scene: '⚓  50万  ⚓', text: '【国内株式モード】\n目標: 50万 こしょう。\n配当が自動で入る。' }
            ],
            outro: [
                { scene: '🗾  📜  💰', text: '日本の港を巡り、\n配当と値上がり益を\nしっかり確保した。' },
                { scene: '🏢  🪙  🏢', text: '国内株式は身近な投資。\n日本経済の成長とともに\n資産は育つ。' }
            ]
        },
        foreign: {
            label: '外国株式',
            goal: 5000000,         // 500万こしょう
            goalLabel: '500万 こしょう',
            storyTitle: '外国株式モード — 遠い海',
            intro: [
                { scene: '🌎  ⛵  🌎', text: 'あなたは遠い海を渡る冒険商人。\nニューヨーク、ロンドン、上海…\n世界中の港で取引する。' },
                { scene: '💱  📈  💱', text: '外国株式には為替リスクがある。\n利益は為替レートで\n大きく変動する。' },
                { scene: '⚠️  🌊  ⚠️', text: '遠い港ほどリターンは大きいが、\n沈没や海賊のリスクも\n大きい。ハイリスク・ハイリターン。' },
                { scene: '🏝️  🚢  🌊', text: '島から出発し、\n世界の港でこしょうを集め、\n500万こしょうを達成して島に帰れ。' },
                { scene: '⚓  500万  ⚓', text: '【外国株式モード】\n目標: 500万 こしょう。\n為替とリスクの世界。' }
            ],
            outro: [
                { scene: '🌎  📜  💰', text: '世界を股にかけた航海の末、\nあなたは莫大な富を\n手に入れた。' },
                { scene: '🌍  🪙  🌍', text: '外国株式は世界経済への\nダイレクトな投資。\nリスクは大きいが、リターンも大きい。' }
            ]
        },
        trust: {
            label: '投資信託',
            goal: 10000000,        // 1000万こしょう
            goalLabel: '1000万 こしょう',
            storyTitle: '投資信託モード — ほったらかしの海',
            intro: [
                { scene: '🤖  ⛵  🤖', text: 'あなたはプロの運用者に\n船を任せることにした。\nこれが投資信託だ。' },
                { scene: '⚙️  📈  ⚙️', text: '投資信託は自動でこしょうを\n集めてくれる。\nクリック不要、ほったらかし。' },
                { scene: '💸  📉  💸', text: 'ただし、手数料が引かれる。\n運用のプロに支払う\nコストである。' },
                { scene: '🏝️  🚢  🌊', text: '島から出発し、\n自動運用でこしょうを集め、\n1000万こしょうを達成して島に帰れ。' },
                { scene: '⚓  1000万  ⚓', text: '【投資信託モード】\n目標: 1000万 こしょう。\n自動で増えるが手数料あり。' }
            ],
            outro: [
                { scene: '🤖  📜  💰', text: 'プロの運用者は\n着実にこしょうを増やした。\nあなたは何もしなかった。' },
                { scene: '📈  🪙  📈', text: '投資信託は忙しい人向け。\n長期・積立・分散の\n王道である。' }
            ]
        },
        bond: {
            label: '債券',
            goal: 300000,          // 30万こしょう
            goalLabel: '30万 こしょう',
            storyTitle: '債券モード — 安定の港',
            intro: [
                { scene: '🏛️  ⛵  🏛️', text: 'あなたは国や企業にお金を貸すことにした。\nこれが債券だ。\n満期まで待てば確実に利子がつく。' },
                { scene: '⏳  💰  ⏳', text: '債券は時間が経つと\n確実にこしょうが増える。\nただし、増え方はゆっくり。' },
                { scene: '🛡️  📉  🛡️', text: 'リスクは低いがリターンも低い。\n安定こそが債券の\n最大の武器である。' },
                { scene: '🏝️  🚢  🌊', text: '島から出発し、\n債券の港でこしょうを待ち、\n30万こしょうを達成して島に帰れ。' },
                { scene: '⚓  30万  ⚓', text: '【債券モード】\n目標: 30万 こしょう。\n安定・確実・低リターン。' }
            ],
            outro: [
                { scene: '🏛️  📜  💰', text: '満期が来るたび、\n利子が支払われた。\nあなたは着実に富を築いた。' },
                { scene: '⏳  🪙  ⏳', text: '債券は投資ポートフォリオの\n安定剤。\n派手ではないが、頼りになる。' ]
            ]
        },
        fx: {
            label: 'FX',
            goal: 100000000,       // 1億こしょう（でもすぐ超える）
            goalLabel: '1億 こしょう',
            storyTitle: 'FXモード — レバレッジの嵐',
            intro: [
                { scene: '💱  ⛵  💱', text: 'あなたは外国為替証拠金取引、\nFXの世界に足を踏み入れた。\n少ない元手で大きく動かせる。' },
                { scene: '⚡  📈  ⚡', text: 'レバレッジ10倍。\n1こしょうの動きが\n10こしょうになる。' },
                { scene: '💥  📉  💥', text: 'しかし、それは逆も同じ。\n50%の確率で大損する。\nハイリスク・ハイリターンの極み。' },
                { scene: '🏝️  🚢  🌊', text: '島から出発し、\nFXの港で大勝負を繰り返し、\n1億こしょうを達成して島に帰れ。' },
                { scene: '⚓  1億  ⚓', text: '【FXモード】\n目標: 1億 こしょう。\n運と度胸の世界。' }
            ],
            outro: [
                { scene: '💱  📜  💰', text: '大勝負の末、\nあなたは1億こしょうを\n手に入れた。' },
                { scene: '⚡  🪙  ⚡', text: 'FXは諸刃の剣。\n大きく勝てるが、\n大きく負ける。' }
            ]
        }
    };

    // =========================================================
    // ゲーム状態
    // =========================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const moneyDisplay = document.getElementById('moneyDisplay');
    const goalDisplay = document.getElementById('goalDisplay');
    const modeLabel = document.getElementById('modeLabel');
    const gameWrapper = document.getElementById('gameWrapper');
    const openingOverlay = document.getElementById('openingOverlay');
    const storyScreen = document.getElementById('storyScreen');
    const storyTitle = document.getElementById('storyTitle');
    const storyText = document.getElementById('storyText');
    const storyScene = document.getElementById('storyScene');
    const storyNextBtn = document.getElementById('storyNextBtn');
    const clearScreen = document.getElementById('clearScreen');
    const logPanel = document.getElementById('logPanel');

    let currentMode = 'simple';
    let gameActive = false;
    let money = 0;
    let lastTimestamp = 0;
    let storyIndex = 0;
    let storyPhase = 'intro'; // intro or outro
    let storyQueue = [];
    let storyComplete = false;

    const SHIP_SPEED = 140; // 2倍
    const SHIP_SIZE = 18;
    const ship = { x: 400, y: 250 };

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    const MAP_WIDTH = 2600;
    const MAP_HEIGHT = 1800;

    // 島（スタート＆ゴール地点）
    const HOME_ISLAND = { x: 400, y: 250, r: 60 };

    let destinations = [];
    let offsetX = 0, offsetY = 0;
    let hasLeftIsland = false; // 一度でも島を出たか
    let autoIncomeTimer = 0;

    // =========================================================
    // 目的地生成（モード別）
    // =========================================================
    function getDestinationsForMode(mode) {
        const base = [
            { x: 300, y: 250, name: '胡椒の里', value: 30, cd: 0, cdMax: 1.5 },
            { x: 1000, y: 400, name: '香辛料港', value: 45, cd: 0, cdMax: 1.5 },
            { x: 1800, y: 180, name: '遠い岬', value: 60, cd: 0, cdMax: 2.0 },
            { x: 2000, y: 1100, name: '船着き場', value: 35, cd: 0, cdMax: 1.5 },
            { x: 600, y: 1200, name: '西の交易所', value: 50, cd: 0, cdMax: 2.0 },
            { x: 1400, y: 1300, name: '胡椒農園', value: 40, cd: 0, cdMax: 1.5 }
        ];

        if (mode === 'simple') return base;

        if (mode === 'nisa') {
            base.forEach(d => d.value = Math.floor(d.value * 1.5));
            base.push({ x: 500, y: 600, name: 'NISA枠', value: 80, cd: 0, cdMax: 2.0 });
            base.push({ x: 1900, y: 700, name: '成長投資枠', value: 120, cd: 0, cdMax: 2.5 });
            base.push({ x: 1200, y: 900, name: 'つみたて枠', value: 60, cd: 0, cdMax: 1.5 });
            return base;
        }
        if (mode === 'domestic') {
            base.push({ x: 700, y: 100, name: '東京証券取引所', value: 100, cd: 0, cdMax: 2.0, dividend: true });
            base.push({ x: 300, y: 900, name: '大阪取引所', value: 120, cd: 0, cdMax: 2.0, dividend: true });
            base.push({ x: 1500, y: 800, name: '名古屋港', value: 90, cd: 0, cdMax: 1.5, dividend: true });
            base.push({ x: 2200, y: 500, name: '福岡証券', value: 80, cd: 0, cdMax: 1.5, dividend: true });
            return base;
        }
        if (mode === 'foreign') {
            base.push({ x: 2200, y: 300, name: 'ニューヨーク港', value: 500, cd: 0, cdMax: 3.0, volatility: 0.5 });
            base.push({ x: 1200, y: 200, name: 'ロンドン港', value: 400, cd: 0, cdMax: 2.5, volatility: 0.4 });
            base.push({ x: 400, y: 1400, name: '上海港', value: 350, cd: 0, cdMax: 2.5, volatility: 0.6 });
            base.push({ x: 2400, y: 1500, name: 'シドニー港', value: 450, cd: 0, cdMax: 3.0, volatility: 0.5 });
            return base;
        }
        if (mode === 'trust') {
            base.forEach(d => d.auto = true);
            base.push({ x: 900, y: 500, name: '投資信託A', value: 200, cd: 0, cdMax: 3.0, auto: true });
            base.push({ x: 1700, y: 1500, name: 'インデックス', value: 300, cd: 0, cdMax: 3.0, auto: true });
            base.push({ x: 100, y: 800, name: 'バランス型', value: 250, cd: 0, cdMax: 3.0, auto: true });
            return base;
        }
        if (mode === 'bond') {
            base.forEach(d => { d.stable = true; d.value = Math.floor(d.value * 0.7); d.cdMax = 5.0; });
            base.push({ x: 500, y: 200, name: '国債', value: 60, cd: 0, cdMax: 6.0, stable: true });
            base.push({ x: 1600, y: 400, name: '社債', value: 90, cd: 0, cdMax: 5.0, stable: true });
            base.push({ x: 800, y: 1300, name: '地方債', value: 70, cd: 0, cdMax: 5.5, stable: true });
            return base;
        }
        if (mode === 'fx') {
            base.forEach(d => { d.highRisk = true; d.value = Math.floor(d.value * 5); d.cdMax = 0.8; });
            base.push({ x: 1400, y: 600, name: 'ドル/円', value: 800, cd: 0, cdMax: 1.0, highRisk: true });
            base.push({ x: 200, y: 400, name: 'ユーロ/円', value: 700, cd: 0, cdMax: 1.0, highRisk: true });
            base.push({ x: 2000, y: 1400, name: 'ポンド/円', value: 900, cd: 0, cdMax: 1.0, highRisk: true });
            return base;
        }
        return base;
    }

    function resetDestinations(mode) {
        destinations = getDestinationsForMode(mode);
        destinations.forEach(d => d.cd = 0);
    }

    // =========================================================
    // ストーリー表示
    // =========================================================
    function startStory() {
        const mode = MODES[currentMode];
        storyQueue = [];
        mode.intro.forEach(s => storyQueue.push({ ...s, phase: 'intro' }));
        storyIndex = 0;
        storyPhase = 'intro';
        storyComplete = false;
        storyScreen.classList.remove('hidden');
        openingOverlay.classList.add('hidden');
        gameWrapper.style.display = 'none';
        showStoryStep();
    }

    function showStoryStep() {
        if (storyIndex >= storyQueue.length) {
            if (storyPhase === 'intro') {
                // イントロ終了 → ゲーム開始
                storyScreen.classList.add('hidden');
                startGame();
            } else {
                // アウトロ終了 → クリア画面
                storyScreen.classList.add('hidden');
                showClearScreen();
            }
            return;
        }
        const step = storyQueue[storyIndex];
        storyTitle.textContent = MODES[currentMode].storyTitle;
        storyScene.textContent = step.scene || '';
        // タイプライター風
        storyText.textContent = '';
        let i = 0;
        const text = step.text;
        const interval = setInterval(() => {
            storyText.textContent = text.slice(0, i + 1);
            i++;
            if (i >= text.length) clearInterval(interval);
        }, 18);
        storyNextBtn.textContent = (storyIndex === storyQueue.length - 1) ?
            (storyPhase === 'intro' ? '▶ 出航！' : '▶ 帰還') : '▶ 次へ';
    }

    storyNextBtn.addEventListener('click', () => {
        if (storyIndex < storyQueue.length - 1) {
            storyIndex++;
            showStoryStep();
        } else {
            if (storyPhase === 'intro') {
                storyIndex++;
                showStoryStep();
            } else {
                storyIndex++;
                showStoryStep();
            }
        }
    });

    // =========================================================
    // ゲーム開始
    // =========================================================
    function startGame() {
        const mode = MODES[currentMode];
        modeLabel.textContent = mode.label;
        money = 0;
        updateMoneyDisplay();
        goalDisplay.textContent = '🎯 目標: ' + mode.goalLabel;
        ship.x = HOME_ISLAND.x;
        ship.y = HOME_ISLAND.y;
        hasLeftIsland = false;
        autoIncomeTimer = 0;
        resetDestinations(currentMode);
        updateOffset();
        gameWrapper.style.display = 'block';
        gameActive = true;
        lastTimestamp = performance.now();
        canvas.focus();
        addLog('⚓ 島を出発した。こしょうを集めて戻ってこよう。');
        requestAnimationFrame(gameLoop);
    }

    function updateMoneyDisplay() {
        moneyDisplay.textContent = '💰 こしょう: ' + formatMoney(money);
    }

    function addLog(msg) {
        const div = document.createElement('div');
        div.textContent = msg;
        logPanel.appendChild(div);
        if (logPanel.children.length > 5) logPanel.removeChild(logPanel.firstChild);
        setTimeout(() => { if (div.parentNode) div.remove(); }, 4000);
    }

    // =========================================================
    // 更新処理
    // =========================================================
    function updateOffset() {
        offsetX = ship.x - canvas.width / 2;
        offsetY = ship.y - canvas.height / 2;
        offsetX = Math.max(0, Math.min(MAP_WIDTH - canvas.width, offsetX));
        offsetY = Math.max(0, Math.min(MAP_HEIGHT - canvas.height, offsetY));
    }

    function updateShip(dt) {
        let vx = 0, vy = 0;
        if (keys.ArrowLeft) vx = -SHIP_SPEED;
        if (keys.ArrowRight) vx = SHIP_SPEED;
        if (keys.ArrowUp) vy = -SHIP_SPEED;
        if (keys.ArrowDown) vy = SHIP_SPEED;
        if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }
        ship.x += vx * dt;
        ship.y += vy * dt;
        ship.x = Math.max(SHIP_SIZE, Math.min(MAP_WIDTH - SHIP_SIZE, ship.x));
        ship.y = Math.max(SHIP_SIZE, Math.min(MAP_HEIGHT - SHIP_SIZE, ship.y));
        updateOffset();

        // 島から離れたか
        const distToIsland = Math.hypot(ship.x - HOME_ISLAND.x, ship.y - HOME_ISLAND.y);
        if (!hasLeftIsland && distToIsland > HOME_ISLAND.r + 20) {
            hasLeftIsland = true;
        }
    }

    function updateCooldowns(dt) {
        destinations.forEach(d => {
            if (d.cd > 0) d.cd = Math.max(0, d.cd - dt);
        });
    }

    function updateAutoIncome(dt) {
        // 国内株式の配当
        if (currentMode === 'domestic') {
            autoIncomeTimer += dt;
            if (autoIncomeTimer >= 3) {
                autoIncomeTimer = 0;
                const dividend = Math.floor(1000 + Math.random() * 2000);
                money += dividend;
                updateMoneyDisplay();
                addLog('📈 配当 +' + formatMoney(dividend));
            }
        }
        // 投資信託の自動運用
        if (currentMode === 'trust') {
            autoIncomeTimer += dt;
            if (autoIncomeTimer >= 0.5) {
                autoIncomeTimer = 0;
                const auto = Math.floor(500 + Math.random() * 1000);
                money += auto;
                updateMoneyDisplay();
                addLog('🤖 自動運用 +' + formatMoney(auto));
            }
        }
        // FXの変動（ランダムイベント）
        if (currentMode === 'fx') {
            autoIncomeTimer += dt;
            if (autoIncomeTimer >= 2) {
                autoIncomeTimer = 0;
                const event = Math.random();
                if (event < 0.3) {
                    const loss = Math.floor(money * (0.05 + Math.random() * 0.15));
                    money -= loss;
                    if (money < 0) money = 0;
                    updateMoneyDisplay();
                    addLog('💥 FX大損 -' + formatMoney(loss));
                } else if (event < 0.5) {
                    const gain = Math.floor(5000 + Math.random() * 20000);
                    money += gain;
                    updateMoneyDisplay();
                    addLog('⚡ FX大勝ち +' + formatMoney(gain));
                }
            }
        }
    }

    function collectProfit(dest) {
        if (dest.cd > 0) return;
        let value = dest.value;
        let label = '';

        // モード別補正
        if (currentMode === 'nisa') {
            value = Math.floor(value * 1.5);
            label = '（非課税）';
        } else if (currentMode === 'fx') {
            const win = Math.random() < 0.5;
            if (win) {
                value = Math.floor(value * (5 + Math.random() * 10));
                label = '（大勝ち！）';
            } else {
                const loss = Math.floor(money * (0.1 + Math.random() * 0.2));
                money -= loss;
                if (money < 0) money = 0;
                updateMoneyDisplay();
                addLog('💥 FXで損 -' + formatMoney(loss));
                dest.cd = dest.cdMax;
                return;
            }
        } else if (currentMode === 'foreign') {
            const rate = 0.5 + Math.random() * 2.0;
            value = Math.floor(value * rate);
            label = '（為替' + rate.toFixed(2) + '倍）';
        } else if (currentMode === 'bond') {
            value = Math.floor(value * 0.7);
            label = '（安定）';
        } else if (currentMode === 'trust') {
            value = Math.floor(value * 1.2);
            label = '（手数料後）';
        } else if (currentMode === 'domestic') {
            value = Math.floor(value * 1.0);
        }

        money += value;
        updateMoneyDisplay();
        addLog('⛵ ' + dest.name + ' +' + formatMoney(value) + label);
        dest.cd = dest.cdMax;

        checkClear();
    }

    function checkClear() {
        const mode = MODES[currentMode];
        if (money >= mode.goal && !hasLeftIsland) return; // まだ島にいる
        if (money >= mode.goal) {
            // 島に戻ったらクリア
            const distToIsland = Math.hypot(ship.x - HOME_ISLAND.x, ship.y - HOME_ISLAND.y);
            if (distToIsland <= HOME_ISLAND.r + 30) {
                gameActive = false;
                startOutro();
            }
        }
    }

    function startOutro() {
        const mode = MODES[currentMode];
        storyQueue = [];
        mode.outro.forEach(s => storyQueue.push({ ...s, phase: 'outro' }));
        storyIndex = 0;
        storyPhase = 'outro';
        storyScreen.classList.remove('hidden');
        gameWrapper.style.display = 'none';
        showStoryStep();
    }

    function showClearScreen() {
        const mode = MODES[currentMode];
        clearScreen.classList.remove('hidden');
        document.getElementById('clearMessage').textContent = 
            '島に帰還！ ' + mode.label + ' モードクリア';
        document.getElementById('clearMoney').textContent = 
            '最終資産: ' + formatMoney(money);
        document.getElementById('clearSub').textContent = 
            '目標 ' + mode.goalLabel + ' を達成した。';
    }

    // =========================================================
    // 描画
    // =========================================================
    function drawShip(ctx, x, y) {
        // 船体
        ctx.fillStyle = '#8B5A2B';
        ctx.beginPath();
        ctx.moveTo(x - 12, y + 8);
        ctx.lineTo(x + 12, y + 8);
        ctx.lineTo(x + 8, y - 6);
        ctx.lineTo(x - 8, y - 6);
        ctx.closePath();
        ctx.fill();
        // マスト
        ctx.fillStyle = '#654321';
        ctx.fillRect(x - 1, y - 20, 2, 16);
        // 帆
        ctx.fillStyle = '#F5F5DC';
        ctx.beginPath();
        ctx.moveTo(x - 2, y - 18);
        ctx.lineTo(x + 8, y - 12);
        ctx.lineTo(x - 2, y - 6);
        ctx.closePath();
        ctx.fill();
        // 旗
        ctx.fillStyle = '#D32F2F';
        ctx.fillRect(x + 2, y - 22, 6, 6);
    }

    function drawIsland(ctx, sx, sy) {
        // 島
        ctx.fillStyle = '#c2b280';
        ctx.beginPath();
        ctx.arc(sx, sy, HOME_ISLAND.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8fbc8f';
        ctx.beginPath();
        ctx.arc(sx - 15, sy - 15, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx + 20, sy + 10, 15, 0, Math.PI * 2);
        ctx.fill();
        // 旗
        ctx.fillStyle = '#ffd966';
        ctx.fillRect(sx - 2, sy - 60, 4, 40);
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy - 60);
        ctx.lineTo(sx + 30, sy - 50);
        ctx.lineTo(sx + 2, sy - 40);
        ctx.fill();
        // ラベル
        ctx.fillStyle = '#0e1f2c';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('HOME', sx, sy + 5);
    }

    function drawDestination(ctx, dest, offsetX, offsetY) {
        const sx = dest.x - offsetX;
        const sy = dest.y - offsetY;
        if (sx < -50 || sx > canvas.width + 50 || sy < -50 || sy > canvas.height + 50) return;

        // 港
        let color = '#3a7ca5';
        if (dest.highRisk) color = '#c44545';
        else if (dest.stable) color = '#4caf50';
        else if (dest.auto) color = '#9c27b0';
        else if (dest.dividend) color = '#ff9800';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.rect(sx - 14, sy - 14, 28, 28);
        ctx.fill();
        // 内側
        ctx.fillStyle = '#f0e68c';
        ctx.beginPath();
        ctx.arc(sx, sy, 7, 0, Math.PI * 2);
        ctx.fill();
        // 名前
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(dest.name, sx, sy + 30);

        // クールダウン
        if (dest.cd > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.rect(sx - 14, sy - 14, 28, 28);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Courier New';
            ctx.fillText(Math.ceil(dest.cd), sx, sy + 4);
        }
    }

    function draw() {
        // 海
        ctx.fillStyle = '#1e3b4f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // 波
        ctx.fillStyle = '#2d5a73';
        for (let i = 0; i < 60; i++) {
            const wx = (i * 173 + 31) % MAP_WIDTH;
            const wy = (i * 97 + 13) % MAP_HEIGHT;
            const sx = wx - offsetX;
            const sy = wy - offsetY;
            if (sx > -10 && sx < canvas.width + 10 && sy > -10 && sy < canvas.height + 10) {
                ctx.fillRect(sx, sy, 4, 4);
            }
        }
        // 島
        drawIsland(ctx, HOME_ISLAND.x - offsetX, HOME_ISLAND.y - offsetY);
        // 目的地
        destinations.forEach(d => drawDestination(ctx, d, offsetX, offsetY));
        // 船
        drawShip(ctx, ship.x - offsetX, ship.y - offsetY);
    }

    // =========================================================
    // メインループ
    // =========================================================
    function gameLoop(now) {
        if (!gameActive) return;
        const dt = Math.min(0.05, (now - lastTimestamp) / 1000 || 0.016);
        lastTimestamp = now;

        updateShip(dt);
        updateCooldowns(dt);
        updateAutoIncome(dt);
        draw();

        // クリア判定（島に戻ったか）
        checkClear();

        requestAnimationFrame(gameLoop);
    }

    // =========================================================
    // イベント
    // =========================================================
    function handleKeyDown(e) {
        if (e.key in keys) { keys[e.key] = true; e.preventDefault(); }
    }
    function handleKeyUp(e) {
        if (e.key in keys) { keys[e.key] = false; e.preventDefault(); }
    }

    function handleCanvasClick(e) {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        const wx = mx + offsetX;
        const wy = my + offsetY;
        for (let d of destinations) {
            if (Math.abs(wx - d.x) < 24 && Math.abs(wy - d.y) < 24) {
                collectProfit(d);
                return;
            }
        }
    }

    // モード選択
    const modeButtons = document.querySelectorAll('#modeSelector button');
    modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            modeButtons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentMode = btn.dataset.mode;
        });
    });

    document.getElementById('startGameBtn').addEventListener('click', () => {
        startStory();
    });
    document.getElementById('backToMenuBtn').addEventListener('click', () => {
        gameActive = false;
        gameWrapper.style.display = 'none';
        openingOverlay.classList.remove('hidden');
        for (let k in keys) keys[k] = false;
    });

    // 初期化
    window.addEventListener('load', () => {
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        canvas.addEventListener('click', handleCanvasClick);
        canvas.setAttribute('tabindex', '0');
        canvas.style.outline = 'none';
    });
})();
</script>
</body>
