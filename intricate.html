<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こしょうと船 - 投資モード</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-wrapper {
            background: #1e2f4a;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: inset 0 0 0 2px #3e5f7a, 0 0 0 3px #0b1622;
            image-rendering: crisp-edges; /* ドット絵っぽく */
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #e9f2f0;
            text-shadow: 2px 2px 0 #0b1b2a;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 0 8px;
        }
        .info-panel span {
            background: #0e1e2b;
            padding: 6px 18px;
            border-radius: 40px;
            border: 2px solid #4a7a9c;
            box-shadow: inset 0 2px 0 #2e4b62;
            font-size: 1.1rem;
        }
        .controls {
            display: flex;
            gap: 16px;
        }
        button {
            background: #3f6b8c;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-family: inherit;
            padding: 8px 22px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 0 #1b2c3b, 0 8px 10px rgba(0,0,0,0.4);
            transition: 0.05s linear;
            letter-spacing: 1px;
            border: 1px solid #6a9fc0;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #1b2c3b, 0 5px 10px rgba(0,0,0,0.4);
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            z-index: 100;
            transition: opacity 0.4s;
        }
        .overlay-card {
            background: #1d3449;
            border-radius: 48px;
            padding: 40px 60px;
            text-align: center;
            color: #edf7f5;
            box-shadow: 0 20px 30px #00000080, inset 0 0 0 3px #5f8aa8;
            max-width: 700px;
            border: 2px solid #9bc2db;
        }
        .overlay-card h1 {
            font-size: 3.2rem;
            margin: 0 0 10px;
            text-shadow: 6px 6px 0 #0e1b24;
            letter-spacing: 6px;
            color: #ffd966;
        }
        .overlay-card p {
            font-size: 1.2rem;
            margin: 20px 0 10px;
            line-height: 1.6;
            background: #0e1f2c;
            padding: 12px 24px;
            border-radius: 60px;
        }
        .mode-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 28px 0 10px;
        }
        .mode-buttons button {
            background: #346f8c;
            box-shadow: 0 6px 0 #1a2c38;
            padding: 10px 26px;
            font-size: 1rem;
        }
        .mode-buttons button.selected {
            background: #ffb347;
            color: #1d2c3a;
            box-shadow: 0 6px 0 #a05f1a;
            border: 2px solid #ffdc9a;
            transform: scale(1.02);
        }
        .start-btn {
            background: #6ac46a;
            box-shadow: 0 8px 0 #2f6b2f;
            font-size: 1.8rem;
            padding: 12px 60px;
            margin-top: 20px;
            border: 2px solid #b1f0b1;
            letter-spacing: 4px;
        }
        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #2f6b2f;
        }
        .hidden {
            display: none !important;
        }
        .opening-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img39x.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: 0;
        }
        .overlay .overlay-card {
            position: relative;
            z-index: 2;
        }
        .subnote {
            font-size: 0.9rem;
            color: #b8d0dd;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <!-- オープニング背景 (img39x.jpg) オーバーレイ内で使用 -->
    <div id="openingOverlay" class="overlay">
        <div class="opening-bg"></div>
        <div class="overlay-card">
            <h1>こしょうと船</h1>
            <p>投資の根源は こしょう と 船 の話</p>
            <div style="font-size: 1rem; color: #bbd9f0; margin: 10px 0 0;">— モードを選択 —</div>
            <div class="mode-buttons" id="modeSelector">
                <button data-mode="simple" class="selected">シンプル</button>
                <button data-mode="nisa">NISA</button>
                <button data-mode="domestic">国内株式</button>
                <button data-mode="foreign">外国株式</button>
                <button data-mode="trust">投資信託</button>
                <button data-mode="bond">債券</button>
                <button data-mode="fx">FX</button>
            </div>
            <button id="startGameBtn" class="start-btn">⚓ 出航 ⚓</button>
            <div class="subnote">※ 矢印キーで船を操作 / 目的地クリックで交易</div>
        </div>
    </div>

    <div class="game-wrapper" id="gameWrapper" style="display: none;">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="info-panel">
            <span id="moneyDisplay">💰 こしょう: 0</span>
            <div class="controls">
                <span id="modeLabel">シンプル</span>
                <button id="backToMenuBtn">メニュー</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- ゲーム設定 ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const moneyDisplay = document.getElementById('moneyDisplay');
            const modeLabel = document.getElementById('modeLabel');
            const gameWrapper = document.getElementById('gameWrapper');
            const openingOverlay = document.getElementById('openingOverlay');

            // 状態
            let currentMode = 'simple';       // simple, nisa, domestic, foreign, trust, bond, fx
            let gameActive = false;
            let money = 0;
            let lastTimestamp = 0;

            // 船
            const SHIP_SPEED = 70;            // ピクセル/秒
            const SHIP_SIZE = 18;
            const ship = {
                x: 400, y: 250,
                vx: 0, vy: 0
            };

            // キー状態
            const keys = {
                ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
            };

            // マップ (広いスクロール用)
            const MAP_WIDTH = 2400;
            const MAP_HEIGHT = 1600;

            // 目的地 (こしょうを生む港)
            let destinations = [];

            // シンプルモード用の基本目的地
            const BASE_DESTS = [
                { id: 'portA', x: 300, y: 250, name: '胡椒の里', value: 30, cooldown: 0 },
                { id: 'portB', x: 1000, y: 400, name: '香辛料港', value: 45, cooldown: 0 },
                { id: 'portC', x: 1800, y: 180, name: '遠い岬', value: 60, cooldown: 0 },
                { id: 'portD', x: 2000, y: 1100, name: '船着き場', value: 35, cooldown: 0 },
                { id: 'portE', x: 600, y: 1200, name: '西の交易所', value: 50, cooldown: 0 },
                { id: 'portF', x: 1400, y: 1300, name: '胡椒農園', value: 40, cooldown: 0 }
            ];

            // モードごとの目的地生成(複雑さを追加)
            function getDestinationsForMode(mode) {
                // 基本の港 (シンプルモードはこれをそのまま)
                let base = JSON.parse(JSON.stringify(BASE_DESTS)); // deep copy

                // すべてのモードでベースは使うが、追加の港や特殊効果を付与
                if (mode === 'simple') {
                    return base;
                }

                // 複雑化: 追加の目的地や名前を変更
                if (mode === 'nisa') {
                    base.push({ id: 'nisa1', x: 500, y: 600, name: 'NISA枠', value: 25, cooldown: 0, special: 'taxFree' });
                    base.push({ id: 'nisa2', x: 1900, y: 700, name: '成長投資枠', value: 55, cooldown: 0, special: 'taxFree' });
                    // NISAは非課税: 価値が少し高め
                    base.forEach(d => { if (!d.special) d.value = Math.floor(d.value * 1.3); });
                } else if (mode === 'domestic') {
                    base.push({ id: 'dom1', x: 700, y: 100, name: '東京証券取引所', value: 40, cooldown: 0 });
                    base.push({ id: 'dom2', x: 300, y: 900, name: '大阪取引所', value: 48, cooldown: 0 });
                    base.push({ id: 'dom3', x: 1500, y: 800, name: '名古屋港', value: 38, cooldown: 0 });
                } else if (mode === 'foreign') {
                    base.push({ id: 'for1', x: 2200, y: 300, name: 'ニューヨーク港', value: 75, cooldown: 0, volatility: 0.3 });
                    base.push({ id: 'for2', x: 1200, y: 200, name: 'ロンドン港', value: 65, cooldown: 0, volatility: 0.2 });
                    base.push({ id: 'for3', x: 400, y: 1400, name: '上海港', value: 70, cooldown: 0, volatility: 0.4 });
                } else if (mode === 'trust') {
                    base.push({ id: 'trust1', x: 900, y: 500, name: '投資信託A', value: 20, cooldown: 0, auto: true });
                    base.push({ id: 'trust2', x: 1700, y: 1500, name: 'インデックス', value: 35, cooldown: 0, auto: true });
                    base.push({ id: 'trust3', x: 100, y: 800, name: 'バランス型', value: 30, cooldown: 0, auto: true });
                } else if (mode === 'bond') {
                    base.push({ id: 'bond1', x: 500, y: 200, name: '国債', value: 15, cooldown: 0, stable: true });
                    base.push({ id: 'bond2', x: 1600, y: 400, name: '社債', value: 28, cooldown: 0, stable: true });
                    base.push({ id: 'bond3', x: 800, y: 1300, name: '地方債', value: 22, cooldown: 0, stable: true });
                } else if (mode === 'fx') {
                    base.push({ id: 'fx1', x: 1400, y: 600, name: 'ドル/円', value: 100, cooldown: 0, highRisk: true });
                    base.push({ id: 'fx2', x: 200, y: 400, name: 'ユーロ/円', value: 90, cooldown: 0, highRisk: true });
                    base.push({ id: 'fx3', x: 2000, y: 1400, name: 'ポンド/円', value: 120, cooldown: 0, highRisk: true });
                }
                return base;
            }

            // 目的地初期化
            function resetDestinations(mode) {
                destinations = getDestinationsForMode(mode);
                // クールダウンリセット
                destinations.forEach(d => d.cooldown = 0);
            }

            // ---------- ユーティリティ ----------
            // 簡易ドット絵風描画 (図形のみ使用、絵文字なし)
            function drawShip(ctx, x, y) {
                // 船体 (台形っぽい)
                ctx.fillStyle = '#8B5A2B';
                ctx.beginPath();
                ctx.moveTo(x - 12, y + 8);
                ctx.lineTo(x + 12, y + 8);
                ctx.lineTo(x + 8, y - 6);
                ctx.lineTo(x - 8, y - 6);
                ctx.closePath();
                ctx.fill();
                // マスト
                ctx.fillStyle = '#654321';
                ctx.fillRect(x - 1, y - 20, 2, 16);
                // 帆 (ドット風の四角)
                ctx.fillStyle = '#F5F5DC';
                ctx.beginPath();
                ctx.moveTo(x - 2, y - 18);
                ctx.lineTo(x + 8, y - 12);
                ctx.lineTo(x - 2, y - 6);
                ctx.closePath();
                ctx.fill();
                // 旗
                ctx.fillStyle = '#D32F2F';
                ctx.fillRect(x + 2, y - 22, 6, 6);
            }

            function drawDestination(ctx, dest, offsetX, offsetY) {
                const screenX = dest.x - offsetX;
                const screenY = dest.y - offsetY;
                // 港 (四角と点)
                ctx.fillStyle = dest.special === 'taxFree' ? '#4caf50' : (dest.highRisk ? '#c44545' : '#3a7ca5');
                ctx.beginPath();
                ctx.rect(screenX - 12, screenY - 12, 24, 24);
                ctx.fill();
                ctx.fillStyle = '#f0e68c';
                ctx.beginPath();
                ctx.arc(screenX, screenY, 6, 0, Math.PI * 2);
                ctx.fill();
                // ドット文字 (名前の代わりに小さなドットで表現)
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 6; i++) {
                    ctx.fillRect(screenX - 8 + i * 3, screenY + 14, 2, 2);
                }
                // クールダウン表示
                if (dest.cooldown > 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.beginPath();
                    ctx.rect(screenX - 12, screenY - 12, 24, 24);
                    ctx.fill();
                }
                // 価値表示（小さなドットの数で表現）
                const dots = Math.min(10, Math.floor(dest.value / 10));
                ctx.fillStyle = '#ffd966';
                for (let i = 0; i < dots; i++) {
                    ctx.fillRect(screenX - 20 + i * 4, screenY - 22, 3, 3);
                }
            }

            // クリック判定
            function getClickedDestination(clickX, clickY, offsetX, offsetY) {
                const worldX = clickX + offsetX;
                const worldY = clickY + offsetY;
                for (let d of destinations) {
                    const dx = worldX - d.x;
                    const dy = worldY - d.y;
                    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
                        return d;
                    }
                }
                return null;
            }

            // ---------- ゲームロジック ----------
            let offsetX = 0, offsetY = 0; // マップスクロール用

            function updateOffset() {
                // 船を画面中央に固定 (スクロール)
                offsetX = ship.x - canvas.width / 2;
                offsetY = ship.y - canvas.height / 2;
                // マップ境界でクランプ
                offsetX = Math.max(0, Math.min(MAP_WIDTH - canvas.width, offsetX));
                offsetY = Math.max(0, Math.min(MAP_HEIGHT - canvas.height, offsetY));
            }

            function updateShip(dt) {
                // キー入力で速度
                const speed = SHIP_SPEED;
                ship.vx = 0;
                ship.vy = 0;
                if (keys.ArrowLeft) ship.vx = -speed;
                if (keys.ArrowRight) ship.vx = speed;
                if (keys.ArrowUp) ship.vy = -speed;
                if (keys.ArrowDown) ship.vy = speed;
                // 斜め移動も同速にするため正規化(今回は簡易)
                if (ship.vx !== 0 && ship.vy !== 0) {
                    ship.vx *= 0.707;
                    ship.vy *= 0.707;
                }
                // 位置更新
                ship.x += ship.vx * dt;
                ship.y += ship.vy * dt;

                // マップ範囲内に制限
                ship.x = Math.max(SHIP_SIZE, Math.min(MAP_WIDTH - SHIP_SIZE, ship.x));
                ship.y = Math.max(SHIP_SIZE, Math.min(MAP_HEIGHT - SHIP_SIZE, ship.y));

                updateOffset();
            }

            function updateCooldowns(dt) {
                destinations.forEach(d => {
                    if (d.cooldown > 0) {
                        d.cooldown = Math.max(0, d.cooldown - dt);
                    }
                });
            }

            // 利益計算 (モードによって少し変化)
            function collectProfit(dest) {
                if (dest.cooldown > 0) return;
                let value = dest.value;
                // モード補正
                if (currentMode === 'nisa') {
                    value = Math.floor(value * 1.3); // NISAは非課税で高め
                } else if (currentMode === 'fx') {
                    value = Math.floor(value * (0.7 + Math.random() * 0.8)); // 変動大
                } else if (currentMode === 'bond') {
                    value = Math.floor(value * 0.9); // 安定だが低め
                } else if (currentMode === 'trust') {
                    value = Math.floor(value * 1.1); // 少しお得
                } else if (currentMode === 'foreign') {
                    value = Math.floor(value * (0.8 + Math.random() * 0.6));
                } else if (currentMode === 'domestic') {
                    value = Math.floor(value * 1.0);
                }
                money += value;
                moneyDisplay.textContent = `💰 こしょう: ${money}`;
                // クールダウン設定 (モードにより変化)
                let cd = 1.5;
                if (currentMode === 'bond') cd = 3.0;        // 債券は低頻度
                if (currentMode === 'fx') cd = 0.8;          // FXは高頻度
                if (currentMode === 'trust') cd = 2.0;
                dest.cooldown = cd;
            }

            // 描画
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 背景 (海)
                ctx.fillStyle = '#1e3b4f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // 波のドット
                ctx.fillStyle = '#2d5a73';
                for (let i = 0; i < 40; i++) {
                    const wx = (i * 173 + 31) % MAP_WIDTH;
                    const wy = (i * 97 + 13) % MAP_HEIGHT;
                    const sx = wx - offsetX;
                    const sy = wy - offsetY;
                    if (sx > -10 && sx < canvas.width + 10 && sy > -10 && sy < canvas.height + 10) {
                        ctx.fillRect(sx, sy, 4, 4);
                    }
                }
                // 目的地描画
                destinations.forEach(d => {
                    drawDestination(ctx, d, offsetX, offsetY);
                });
                // 船描画 (画面中央付近に来るように)
                const shipScreenX = ship.x - offsetX;
                const shipScreenY = ship.y - offsetY;
                drawShip(ctx, shipScreenX, shipScreenY);
            }

            // メインループ
            function gameLoop(now) {
                if (!gameActive) return;
                const dt = Math.min(0.05, (now - lastTimestamp) / 1000 || 0.016);
                lastTimestamp = now;

                updateShip(dt);
                updateCooldowns(dt);
                draw();

                requestAnimationFrame(gameLoop);
            }

            // ---------- イベント ----------
            function handleKeyDown(e) {
                if (!gameActive) return;
                if (e.key in keys) {
                    keys[e.key] = true;
                    e.preventDefault();
                }
            }
            function handleKeyUp(e) {
                if (e.key in keys) {
                    keys[e.key] = false;
                    e.preventDefault();
                }
            }

            function handleCanvasClick(e) {
                if (!gameActive) return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;

                const dest = getClickedDestination(mouseX, mouseY, offsetX, offsetY);
                if (dest) {
                    collectProfit(dest);
                }
            }

            // モード選択UI
            const modeButtons = document.querySelectorAll('#modeSelector button');
            modeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeButtons.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentMode = btn.dataset.mode;
                });
            });

            // ゲーム開始
            function startGame() {
                // モードラベル更新
                const modeNames = {
                    simple: 'シンプル',
                    nisa: 'NISA',
                    domestic: '国内株式',
                    foreign: '外国株式',
                    trust: '投資信託',
                    bond: '債券',
                    fx: 'FX'
                };
                modeLabel.textContent = modeNames[currentMode] || 'シンプル';

                // 初期化
                money = 0;
                moneyDisplay.textContent = `💰 こしょう: 0`;
                ship.x = 400;
                ship.y = 250;
                resetDestinations(currentMode);
                updateOffset();

                // 表示切り替え
                openingOverlay.classList.add('hidden');
                gameWrapper.style.display = 'block';
                gameActive = true;
                lastTimestamp = performance.now();

                // フォーカス
                canvas.focus();
                requestAnimationFrame(gameLoop);
            }

            // メニューへ戻る
            function backToMenu() {
                gameActive = false;
                gameWrapper.style.display = 'none';
                openingOverlay.classList.remove('hidden');
                // キー状態リセット
                for (let k in keys) keys[k] = false;
            }

            // 初期化
            function init() {
                // スタートボタン
                document.getElementById('startGameBtn').addEventListener('click', startGame);
                document.getElementById('backToMenuBtn').addEventListener('click', backToMenu);

                // キーボード
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                canvas.addEventListener('click', handleCanvasClick);

                // キャンバスのフォーカス可能に (キーイベント用)
                canvas.setAttribute('tabindex', '0');
                canvas.style.outline = 'none';

                // オープニング背景画像のロードチェック (img39x.jpg は既にCSSで読み込み)
                // ゲームスタート時のみ表示
            }

            // ページロード
            window.addEventListener('load', () => {
                init();
                // 初期状態ではゲーム非アクティブ
                gameActive = false;
            });

            // リサイズとかは特になし (固定キャンバス)
        })();
    </script>
</body>
</html>
