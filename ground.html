<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素周期表サッカーポジション配置ツール</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 200px;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .control-panel {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        .reset-btn:hover {
            background-color: #cc0000;
        }
        .container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        /* ポジション表（左側） */
        .board {
            flex: 1;
            background-color: #ffffff;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
        }
        .position-group {
            border-bottom: 1px dashed #ccc;
            padding: 10px 0;
            display: flex;
            align-items: center;
        }
        .position-group:last-child {
            border-bottom: none;
        }
        .pos-title {
            width: 80px;
            font-weight: bold;
            color: #2c3e50;
            background-color: #e2e8f0;
            padding: 5px;
            text-align: center;
            border-radius: 4px;
            margin-right: 15px;
        }
        .pos-content {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
            min-height: 35px;
            align-items: center;
        }
        /* POOL（右側） */
        .pool-container {
            width: 350px;
            background-color: #ffffff;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            position: sticky;
            top: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .pool-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }
        .pool-content {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        /* 元素アイテムのスタイル */
        .element-card {
            background-color: #e1f5fe;
            border: 1px solid #b3e5fc;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .element-name {
            font-weight: bold;
        }
        .move-select {
            font-size: 12px;
            padding: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>元素周期表 サッカーポジション配置</h1>

    <div class="control-panel">
        <button class="reset-btn" onclick="confirmReset()">配置を初期化（POOLに戻す）</button>
    </div>

    <div class="container">
        <!-- 左側：ポジション表 -->
        <div class="board" id="position-board">
            <!-- JavaScriptで上から順番に生成 -->
        </div>

        <!-- 右側：POOL -->
        <div class="pool-container">
            <div class="pool-title">POOL（未配置の元素）</div>
            <div class="pool-content" id="pool">
                <!-- JavaScriptで118元素を生成 -->
            </div>
        </div>
    </div>

<script>
    // 1. 指定順のポジション定義
    const positions = ["CF", "ST", "LWG", "OMF", "RWG", "LMF", "CMF", "RMF", "DMF", "LSB", "CB", "RSB", "GK"];

    // 2. 周期表の全118元素の記号（配列の長さ: 118、漏れなし）
    const allElements = [
        "H", "He", "Li", "Be", "B", "C", "N", "O", "F", "Ne",
        "Na", "Mg", "Al", "Si", "P", "S", "Cl", "Ar", "K", "Ca",
        "Sc", "Ti", "V", "Cr", "Mn", "Fe", "Co", "Ni", "Cu", "Zn",
        "Ga", "Ge", "As", "Se", "Br", "Kr", "Rb", "Sr", "Y", "Zr",
        "Nb", "Mo", "Tc", "Ru", "Rh", "Pd", "Ag", "Cd", "In", "Sn",
        "Sb", "Te", "I", "Xe", "Cs", "Ba", "La", "Ce", "Pr", "Nd",
        "Pm", "Sm", "Eu", "Gd", "Tb", "Dy", "Ho", "Er", "Tm", "Yb",
        "Lu", "Hf", "Ta", "W", "Re", "Os", "Ir", "Pt", "Au", "Hg",
        "Tl", "Pb", "Bi", "Po", "At", "Rn", "Fr", "Ra", "Ac", "Th",
        "Pa", "U", "Np", "Pu", "Am", "Cm", "Bk", "Cf", "Es", "Fm",
        "Md", "No", "Lr", "Rf", "Db", "Sg", "Bh", "Hs", "Mt", "Ds",
        "Rg", "Cn", "Nh", "Fl", "Mc", "Lv", "Ts", "Og"
    ];

    // 3. データの状態管理（各元素がどこにいるか。初期値はすべて "P" = POOL）
    let elementPlacement = {};

    // データの読み込み
    function loadData() {
        const savedData = localStorage.getItem("element_football_positions");
        if (savedData) {
            elementPlacement = JSON.parse(savedData);
            // 保存データに漏れがある場合のセーフティ
            allElements.forEach(el => {
                if (!elementPlacement[el]) elementPlacement[el] = "P";
            });
        } else {
            initDefaultData();
        }
    }

    // 初期化データ作成
    function initDefaultData() {
        allElements.forEach(el => {
            elementPlacement[el] = "P";
        });
        saveData();
    }

    // データの保存
    function saveData() {
        localStorage.setItem("element_football_positions", JSON.stringify(elementPlacement));
    }

    // 4. 画面（DOM）の構築
    function renderBoard() {
        // ポジションエリアのクリアと生成
        const boardContainer = document.getElementById("position-board");
        boardContainer.innerHTML = "";

        positions.forEach(pos => {
            const group = document.createElement("div");
            group.className = "position-group";

            const title = document.createElement("div");
            title.className = "pos-title";
            title.textContent = pos;

            const content = document.createElement("div");
            content.className = "pos-content";
            content.id = `pos-${pos}`;

            group.appendChild(title);
            group.appendChild(content);
            boardContainer.appendChild(group);
        });

        // POOLエリアのクリア
        const poolContainer = document.getElementById("pool");
        poolContainer.innerHTML = "";

        // 118個の元素カードを適切な場所に配置
        allElements.forEach(el => {
            const currentPos = elementPlacement[el];
            
            // 元素カードのHTML要素を作成
            const card = document.createElement("div");
            card.className = "element-card";
            
            const nameSpan = document.createElement("span");
            nameSpan.className = "element-name";
            nameSpan.textContent = el;
            
            // 移動用のセレクトボックスボタン
            const select = document.createElement("select");
            select.className = "move-select";
            select.onchange = (e) => moveElement(el, e.target.value);

            // 「POOL（P）」の選択肢
            const optPool = document.createElement("option");
            optPool.value = "P";
            optPool.textContent = "POOL";
            if (currentPos === "P") optPool.selected = true;
            select.appendChild(optPool);

            // 各ポジションの選択肢
            positions.forEach(pos => {
                const opt = document.createElement("option");
                opt.value = pos;
                opt.textContent = pos;
                if (currentPos === pos) opt.selected = true;
                select.appendChild(opt);
            });

            card.appendChild(nameSpan);
            card.appendChild(select);

            // 所属先に応じてDOMへ追加
            if (currentPos === "P") {
                poolContainer.appendChild(card);
            } else {
                const targetPosContent = document.getElementById(`pos-${currentPos}`);
                if (targetPosContent) {
                    targetPosContent.appendChild(card);
                }
            }
        });
    }

    // 5. 元素移動の処理
    function moveElement(elementSymbol, targetPosition) {
        elementPlacement[elementSymbol] = targetPosition;
        saveData();   // ローカルストレージに即時保存
        renderBoard(); // 画面を再描画
    }

    // 6. 4連警告つきリセット機能
    function confirmReset() {
        const q1 = confirm("【警告 1/4】本当に配置をリセットして、すべての元素をPOOLに戻しますか？");
        if (!q1) return;

        const q2 = confirm("【警告 2/4】本当に本当によろしいですか？ これまでの配置データはすべて消去されます。");
        if (!q2) return;

        const q3 = confirm("【警告 3/4】しつこくてすみません。本当にリセットして後悔しませんか？");
        if (!q3) return;

        const q4 = confirm("【最終警告 4/4】これが最後の確認です。本当にリセットしますね？");
        if (!q4) return;

        // 4回すべてクリアした場合のみ実行
        initDefaultData();
        renderBoard();
        alert("すべての配置を初期化し、POOLに戻しました。");
    }

    // 起動時の初期処理
    loadData();
    renderBoard();
</script>

</body>
</html>
