<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周期表 118元素 サッカーポジション配置</title>
    <style>
        /* 画面崩れを防ぐための基本設定 */
        body {
            font-family: sans-serif;
            margin: 15px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .controls {
            margin-bottom: 15px;
        }
        button.reset-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
            font-size: 14px;
        }
        
        /* ポジション表全体のレイアウト設定（絶対に横に潰れない構造） */
        .position-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .position-row {
            display: flex;
            flex-direction: column; /* スマホでラベルと中身が潰れ合わないように縦並びを基本にする */
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 5px;
            overflow: hidden;
        }
        /* パソコンや広い画面では横並びにして見やすくする */
        @media (min-width: 600px) {
            .position-row {
                flex-direction: row;
            }
        }

        /* ポジション名を表示するラベル */
        .position-label {
            background-color: #444;
            color: white;
            padding: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* POOL専用のラベル色（未配置と分かりやすく） */
        .position-P .position-label {
            background-color: #888;
        }

        /* 元素記号たちが並ぶエリア */
        .position-content {
            display: flex;
            flex-wrap: wrap; /* 横幅がいっぱいになったら自動で綺麗に改行する */
            gap: 6px;
            padding: 10px;
            align-items: center;
            flex-grow: 1;
            min-height: 45px;
            background-color: #fafafa;
        }
        
        /* 元素1個1個のカードスタイル */
        .element-card {
            display: inline-flex;
            align-items: center;
            border: 1px solid #bbb;
            padding: 4px 6px;
            background-color: #ffffff;
            border-radius: 4px;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .element-name {
            font-weight: bold;
            margin-right: 6px;
            min-width: 25px;
            text-align: center;
        }
        .position-select {
            font-size: 13px;
            padding: 2px;
            cursor: pointer;
            border: 1px solid #999;
            border-radius: 3px;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <h1>周期表 118元素 サッカーポジション配置</h1>
    
    <div class="controls">
        <button class="reset-btn" onclick="tryReset()">ポジション表をリセットする</button>
    </div>

    <div class="position-container">
        <!-- 指示通りの順番で並べた13のポジション枠 -->
        <div class="position-row position-CF" id="row-CF"><div class="position-label">CF</div><div class="position-content" id="content-CF"></div></div>
        <div class="position-row position-ST" id="row-ST"><div class="position-label">ST</div><div class="position-content" id="content-ST"></div></div>
        <div class="position-row position-LWG" id="row-LWG"><div class="position-label">LWG</div><div class="position-content" id="content-LWG"></div></div>
        <div class="position-row position-OMF" id="row-OMF"><div class="position-label">OMF</div><div class="position-content" id="content-OMF"></div></div>
        <div class="position-row position-RWG" id="row-RWG"><div class="position-label">RWG</div><div class="position-content" id="content-RWG"></div></div>
        <div class="position-row position-LMF" id="row-LMF"><div class="position-label">LMF</div><div class="position-content" id="content-LMF"></div></div>
        <div class="position-row position-CMF" id="row-CMF"><div class="position-label">CMF</div><div class="position-content" id="content-CMF"></div></div>
        <div class="position-row position-RMF" id="row-RMF"><div class="position-label">RMF</div><div class="position-content" id="content-RMF"></div></div>
        <div class="position-row position-DMF" id="row-DMF"><div class="position-label">DMF</div><div class="position-content" id="content-DMF"></div></div>
        <div class="position-row position-LSB" id="row-LSB"><div class="position-label">LSB</div><div class="position-content" id="content-LSB"></div></div>
        <div class="position-row position-CB" id="row-CB"><div class="position-label">CB</div><div class="position-content" id="content-CB"></div></div>
        <div class="position-row position-RSB" id="row-RSB"><div class="position-label">RSB</div><div class="position-content" id="content-RSB"></div></div>
        <div class="position-row position-GK" id="row-GK"><div class="position-label">GK</div><div class="position-content" id="content-GK"></div></div>
        
        <!-- POOL（初期位置：ここから確実にスタートします） -->
        <div class="position-row position-P" id="row-P"><div class="position-label">POOL (P)</div><div class="position-content" id="content-P"></div></div>
    </div>

<script>
// 118元素の完全なデータ（漏れや不足は一切ありません）
const allElements = [
    "H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar",
    "K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr",
    "Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe",
    "Cs","Ba","La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu",
    "Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg","Tl","Pb","Bi","Po","At","Rn",
    "Fr","Ra","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No","Lr",
    "Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og"
];

// すべての配置先（13ポジション + POOL）のリスト
const positions = ['CF', 'ST', 'LWG', 'OMF', 'RWG', 'LMF', 'CMF', 'RMF', 'DMF', 'LSB', 'CB', 'RSB', 'GK', 'P'];

// ストレージ保存用のキー名
const STORAGE_KEY = "soccer_element_position_mapping";

// 配置状態を保持するオブジェクト
let currentMapping = {};

// 初期化
function init() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        currentMapping = JSON.parse(saved);
    } else {
        // 保存データがない場合、全118元素を確実にPOOL('P')へ入れる
        allElements.forEach(el => {
            currentMapping[el] = 'P';
        });
    }
    render();
}

// 画面描画
function render() {
    // 全ての枠内をいったんクリア
    positions.forEach(pos => {
        document.getElementById(`content-${pos}`).innerHTML = "";
    });

    // 118元素を現在の設定に合わせて各ポジションへ振り分け
    allElements.forEach(el => {
        const targetPos = currentMapping[el] || 'P';
        const container = document.getElementById(`content-${targetPos}`);
        
        if (container) {
            const card = document.createElement('div');
            card.className = 'element-card';
            
            // 元素記号名
            const nameSpan = document.createElement('span');
            nameSpan.className = 'element-name';
            nameSpan.textContent = el;
            card.appendChild(nameSpan);
            
            // 選択用ドロップダウン
            const select = document.createElement('select');
            select.className = 'position-select';
            select.onchange = (e) => changePosition(el, e.target.value);
            
            positions.forEach(pos => {
                const opt = document.createElement('option');
                opt.value = pos;
                // 選択肢の表示名（Pの場合はPOOLと表示）
                opt.textContent = (pos === 'P') ? 'POOL' : pos;
                if (pos === targetPos) opt.selected = true;
                select.appendChild(opt);
            });
            
            card.appendChild(select);
            container.appendChild(card);
        }
    });
}

// ポジションを変更したとき
function changePosition(element, newPos) {
    currentMapping[element] = newPos;
    // 変更をブラウザに自動保存
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentMapping));
    render();
}

// 4連かまかけリセット警告
function tryReset() {
    if (confirm("【警告 1/4】本当にポジション表を初期化して、すべての元素をPOOLに戻しますか？")) {
        if (confirm("【警告 2/4】これまでに配置したデータはすべて消去されます。本当によろしいですか？")) {
            if (confirm("【警告 3/4】後戻りはできません。本当に後悔しませんか？（あと1回確認があります）")) {
                if (confirm("【最終警告 4/4】これが最後の確認です。本当に118元素すべてをPOOLに戻しますか？")) {
                    // 全てPOOLに強制書き換え
                    allElements.forEach(el => {
                        currentMapping[el] = 'P';
                    });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentMapping));
                    render();
                    alert("初期化が完了しました。すべての元素がPOOLに戻りました。");
                }
            }
        }
    }
}

// 開始実行
init();
</script>

</body>
</html>
