<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>118元素 サッカーポジション編成シミュレーター</title>
    <style>
        :root {
            --bg-color: #05140b;
            --pitch-bg: #0f2e1a;
            --card-bg: #164225;
            --text-color: #f1f5f9;
            --accent-color: #4ade80;
            --pool-color: #334155;
            
            /* ポジション別カラー */
            --color-cf: #ef4444;
            --color-st: #f97316;
            --color-lwg: #f59e0b;
            --color-rwg: #eab308;
            --color-omf: #84cc16;
            --color-lmf: #10b981;
            --color-cmf: #06b6d4;
            --color-rmf: #3b82f6;
            --color-dmf: #6366f1;
            --color-lsb: #8b5cf6;
            --color-cb: #a855f7;
            --color-rsb: #d946ef;
            --color-gk: #ec4899;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: var(--accent-color);
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a7f3d0;
            margin-bottom: 25px;
            text-align: center;
        }

        .header-controls {
            margin-bottom: 30px;
        }

        .btn-reset {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.4);
        }

        .pitch-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
            background-color: var(--pitch-bg);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #1e5330;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
        }

        .position-row {
            display: flex;
            background-color: rgba(22, 66, 37, 0.4);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            min-height: 80px;
        }

        .position-label {
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .position-content {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            align-items: center;
            flex-grow: 1;
        }

        /* ポジション別グラデーション背景 */
        .pos-cf .position-label { background: linear-gradient(90deg, var(--color-cf), transparent); }
        .pos-st .position-label { background: linear-gradient(90deg, var(--color-st), transparent); }
        .pos-lwg .position-label { background: linear-gradient(90deg, var(--color-lwg), transparent); }
        .pos-omf .position-label { background: linear-gradient(90deg, var(--color-omf), transparent); }
        .pos-rwg .position-label { background: linear-gradient(90deg, var(--color-rwg), transparent); }
        .pos-lmf .position-label { background: linear-gradient(90deg, var(--color-lmf), transparent); }
        .pos-cmf .position-label { background: linear-gradient(90deg, var(--color-cmf), transparent); }
        .pos-rmf .position-label { background: linear-gradient(90deg, var(--color-rmf), transparent); }
        .pos-dmf .position-label { background: linear-gradient(90deg, var(--color-dmf), transparent); }
        .pos-lsb .position-label { background: linear-gradient(90deg, var(--color-lsb), transparent); }
        .pos-cb .position-label { background: linear-gradient(90deg, var(--color-cb), transparent); }
        .pos-rsb .position-label { background: linear-gradient(90deg, var(--color-rsb), transparent); }
        .pos-gk .position-label { background: linear-gradient(90deg, var(--color-gk), transparent); }
        .pos-p { background-color: #1e293b; }
        .pos-p .position-label { background: linear-gradient(90deg, var(--pool-color), transparent); font-size: 1.1rem; }

        /* コンパクトになった元素カード */
        .element-card {
            background-color: #0b1f12;
            border: 1px solid #2e7d46;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* POOL内にあるカードは少し色を変えて見やすく */
        .pos-p .element-card {
            background-color: #0f172a;
            border-color: #334155;
        }

        .element-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 40px;
        }

        .element-symbol {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }

        .element-number {
            font-size: 0.7rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        /* ポジション移動用のドロップダウンメニュー */
        .pos-select-menu {
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .pos-select-menu:hover {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <h1>118 Elements Soccer Position Board</h1>
    <div class="subtitle">全118元素をサッカーの13ポジションに綺麗に配置</div>

    <div class="header-controls">
        <button class="btn-reset" onclick="resetPositionsWithWarnings()">チーム編成を完全リセットする</button>
    </div>

    <div class="pitch-container">
        <!-- ポジションの行（上から順） -->
        <div class="position-row pos-cf" id="row-CF"><div class="position-label">CF</div><div class="position-content" id="content-CF"></div></div>
        <div class="position-row pos-st" id="row-ST"><div class="position-label">ST</div><div class="position-content" id="content-ST"></div></div>
        <div class="position-row pos-lwg" id="row-LWG"><div class="position-label">LWG</div><div class="position-content" id="content-LWG"></div></div>
        <div class="position-row pos-omf" id="row-OMF"><div class="position-label">OMF</div><div class="position-content" id="content-OMF"></div></div>
        <div class="position-row pos-rwg" id="row-RWG"><div class="position-label">RWG</div><div class="position-content" id="content-RWG"></div></div>
        <div class="position-row pos-lmf" id="row-LMF"><div class="position-label">LMF</div><div class="position-content" id="content-LMF"></div></div>
        <div class="position-row pos-cmf" id="row-CMF"><div class="position-label">CMF</div><div class="position-content" id="content-CMF"></div></div>
        <div class="position-row pos-rmf" id="row-RMF"><div class="position-label">RMF</div><div class="position-content" id="content-RMF"></div></div>
        <div class="position-row pos-dmf" id="row-DMF"><div class="position-label">DMF</div><div class="position-content" id="content-DMF"></div></div>
        <div class="position-row pos-lsb" id="row-LSB"><div class="position-label">LSB</div><div class="position-content" id="content-LSB"></div></div>
        <div class="position-row pos-cb" id="row-CB"><div class="position-label">CB</div><div class="position-content" id="content-CB"></div></div>
        <div class="position-row pos-rsb" id="row-RSB"><div class="position-label">RSB</div><div class="position-content" id="content-RSB"></div></div>
        <div class="position-row pos-gk" id="row-GK"><div class="position-label">GK</div><div class="position-content" id="content-GK"></div></div>
        
        <!-- POOL (初期位置・控え) -->
        <div class="position-row pos-p" id="row-P"><div class="position-label">POOL (控え)</div><div class="position-content" id="content-P"></div></div>
    </div>

    <script>
        const elements = [
            "H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca",
            "Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Y","Zr",
            "Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba","La","Ce","Pr","Nd",
            "Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu","Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg",
            "Tl","Pb","Bi","Po","At","Rn","Fr","Ra","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm",
            "Md","No","Lr","Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og"
        ];

        const positions = ['CF', 'ST', 'LWG', 'OMF', 'RWG', 'LMF', 'CMF', 'RMF', 'DMF', 'LSB', 'CB', 'RSB', 'GK', 'P'];

        let soccerData = {};

        function loadSoccerData() {
            const savedData = localStorage.getItem('elementSoccerDataV2');
            if (savedData) {
                soccerData = JSON.parse(savedData);
