<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI証券パチンコ ｜ 用語で大当たり</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      font-family: 'MS PGothic', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif;
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      overflow-x: hidden;
    }

    .app {
      max-width: 1000px;
      width: 100%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ===== 左：台 ===== */
    .machine {
      flex: 1 1 560px;
      background: linear-gradient(180deg, #2a2a3a 0%, #1a1a2a 100%);
      border: 4px solid #8a7a4a;
      border-radius: 10px;
      padding: 10px;
      position: relative;
      box-shadow: 0 0 0 2px #111, 0 0 20px rgba(0,0,0,0.7);
    }

    .machine-top {
      background: linear-gradient(90deg, #c06020 0%, #e08030 50%, #c06020 100%);
      border: 2px solid #ffcc80;
      border-radius: 6px;
      padding: 6px 12px;
      text-align: center;
      font-size: 0.85rem;
      color: #fff;
      letter-spacing: 3px;
      font-weight: bold;
      text-shadow: 1px 1px 0 #804010;
      margin-bottom: 8px;
    }

    .board {
      background: #0a0a12;
      border: 3px solid #444;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      height: 500px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    }

    .board-bg {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, #3a3a4a 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      opacity: 0.6;
    }

    .stage {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 70px;
      border-bottom: 2px solid #666;
      background: linear-gradient(180deg, #15151f, #222230);
      border-radius: 0 0 20px 20px;
      z-index: 3;
    }

    .heso {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 34px;
      border: 3px solid #8a7a4a;
      border-radius: 4px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: #8a7a4a;
      letter-spacing: 2px;
      z-index: 6;
      transition: 0.3s;
    }

    .heso.hit {
      background: #3a2a10;
      border-color: #ffcc80;
      color: #ffcc80;
    }

    .denchu {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 22px;
      border: 2px solid #556;
      border-radius: 10px;
      background: #1a1a28;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      color: #778;
      letter-spacing: 1px;
      z-index: 5;
    }

    .digital {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 2rem;
      color: #7ac0e0;
      background: #0a0a12;
      border: 2px solid #446;
      padding: 6px 24px;
      border-radius: 4px;
      letter-spacing: 6px;
      text-align: center;
      z-index: 8;
      min-width: 120px;
      transition: 0.3s;
    }

    .digital.hit {
      color: #ffcc80;
      border-color: #8a7a4a;
    }

    /* スロット演出 */
    .slot-area {
      position: absolute;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      z-index: 20;
      align-items: center;
    }

    .slot-area.active {
      display: flex;
    }

    .slot-window {
      width: 60px;
      height: 80px;
      background: #0a0a12;
      border: 3px solid #c06020;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .slot-reel {
      position: absolute;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s;
    }

    .slot-reel.spinning {
      animation: reelSpin 0.15s linear infinite;
    }

    @keyframes reelSpin {
      0% { transform: translateY(0); }
      100% { transform: translateY(-80px); }
    }

    .dot-symbol {
      width: 40px;
      height: 40px;
      margin: 4px 0;
      position: relative;
      image-rendering: pixelated;
    }

    .dot-symbol.s7::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(#c06020, #c06020) 8px 4px / 24px 6px no-repeat,
        linear-gradient(#c06020, #c06020) 16px 10px / 8px 8px no-repeat,
        linear-gradient(#c06020, #c06020) 12px 18px / 16px 6px no-repeat,
        linear-gradient(#c06020, #c06020) 8px 24px / 24px 6px no-repeat;
    }

    .dot-symbol.sbar::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(#e08030, #e08030) 6px 6px / 28px 6px no-repeat,
        linear-gradient(#e08030, #e08030) 6px 16px / 28px 6px no-repeat,
        linear-gradient(#e08030, #e08030) 6px 26px / 28px 6px no-repeat;
    }

    .dot-symbol.scherry::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12px 16px, #e04040 6px, transparent 7px),
        radial-gradient(circle at 28px 16px, #e04040 6px, transparent 7px),
        linear-gradient(#40a040, #40a040) 18px 6px / 4px 12px no-repeat;
    }

    .dot-symbol.sbell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20px 12px, #ffcc80 8px, transparent 9px),
        linear-gradient(#ffcc80, #ffcc80) 18px 20px / 4px 10px no-repeat,
        linear-gradient(#ffcc80, #ffcc80) 12px 30px / 16px 4px no-repeat;
    }

    .dot-symbol.ssuika::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20px 20px, #40a040 12px, transparent 13px),
        radial-gradient(circle at 16px 16px, #e04040 2px, transparent 3px),
        radial-gradient(circle at 24px 20px, #e04040 2px, transparent 3px),
        radial-gradient(circle at 20px 26px, #e04040 2px, transparent 3px);
    }

    .dot-symbol.sreplay::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(#7ac0e0, #7ac0e0) 8px 8px / 24px 4px no-repeat,
        linear-gradient(#7ac0e0, #7ac0e0) 8px 28px / 24px 4px no-repeat,
        linear-gradient(#7ac0e0, #7ac0e0) 8px 8px / 4px 24px no-repeat,
        linear-gradient(#7ac0e0, #7ac0e0) 28px 8px / 4px 24px no-repeat;
    }

    .slot-push-btn {
      display: none;
      background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
      border: 3px solid #fff;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #601010;
      animation: pulse 0.8s ease infinite;
      margin-left: 8px;
    }

    .slot-push-btn.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .ball {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #a0a0a0);
      box-shadow: 0 0 4px rgba(255,255,255,0.4);
      z-index: 10;
      pointer-events: none;
    }

    /* ===== 右：情報パネル ===== */
    .panel {
      flex: 1 1 320px;
      background: linear-gradient(180deg, #22222e 0%, #15151f 100%);
      border: 4px solid #8a7a4a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 0 0 2px #111, 0 0 20px rgba(0,0,0,0.7);
    }

    .panel-title {
      text-align: center;
      font-size: 1rem;
      color: #ffcc80;
      letter-spacing: 4px;
      border-bottom: 2px solid #8a7a4a;
      padding-bottom: 8px;
      font-weight: bold;
      text-shadow: 1px 1px 0 #804010;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .data-box {
      background: #0a0a12;
      border: 2px solid #446;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
    }

    .data-box .label {
      font-size: 0.7rem;
      color: #88a;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
    }

    .data-box .value {
      font-size: 1.3rem;
      color: #7ac0e0;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .data-box .value.hit {
      color: #ffcc80;
    }

    .data-box .value.small {
      font-size: 1rem;
    }

    .term-display {
      background: #0a0a12;
      border: 2px solid #446;
      border-radius: 6px;
      padding: 10px 12px;
      min-height: 70px;
    }

    .term-display .t-label {
      font-size: 0.65rem;
      color: #88a;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .term-display .t-term {
      font-size: 1.1rem;
      color: #ffcc80;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .term-display .t-desc {
      font-size: 0.78rem;
      color: #b0b0c0;
      line-height: 1.5;
    }

    .panel-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pbtn {
      flex: 1 1 auto;
      background: linear-gradient(180deg, #3a3a4a 0%, #22222e 100%);
      border: 2px solid #8a7a4a;
      color: #ffcc80;
      padding: 8px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 1px;
      font-family: 'MS PGothic', sans-serif;
      font-weight: bold;
      transition: 0.15s;
      text-align: center;
    }

    .pbtn:hover {
      background: linear-gradient(180deg, #4a4a5a 0%, #2a2a3a 100%);
      border-color: #a89858;
    }

    .pbtn:active {
      transform: translateY(2px);
    }

    .pbtn.danger {
      border-color: #7a4a4a;
      color: #c08080;
    }

    .spin-area {
      margin-top: auto;
      background: #0a0a12;
      border: 2px solid #446;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .spin-label {
      font-size: 0.75rem;
      color: #88a;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .spin-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .spin-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      font-family: 'MS PGothic', sans-serif;
      box-shadow: 0 4px 0 #601010, 0 0 20px rgba(224, 64, 64, 0.4);
      transition: 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
    }

    .spin-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #601010, 0 0 10px rgba(224, 64, 64, 0.6);
    }

    .spin-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 0 #601010;
    }

    .spin-btn .sub {
      font-size: 0.55rem;
      opacity: 0.8;
    }

    .auto-area {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .auto-btn {
      background: linear-gradient(180deg, #40a040 0%, #207020 100%);
      border: 2px solid #80ff80;
      color: #fff;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 2px;
      font-family: 'MS PGothic', sans-serif;
      box-shadow: 0 3px 0 #104010;
      transition: 0.1s;
    }

    .auto-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #104010;
    }

    .auto-btn.on {
      background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
      border-color: #ff8080;
      box-shadow: 0 3px 0 #601010;
    }

    .log {
      background: #0a0a12;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      height: 100px;
      overflow-y: auto;
      font-size: 0.72rem;
      font-family: 'Courier New', monospace;
      color: #99a;
      line-height: 1.6;
    }

    .log .log-line { margin-bottom: 2px; }
    .log .log-line.hit { color: #ffcc80; }
    .log .log-line.miss { color: #667; }
    .log .log-line.event { color: #c0a060; }
    .log .log-line.system { color: #7ac0e0; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1a1a2a;
      border: 3px solid #8a7a4a;
      border-radius: 10px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
    }

    .modal h2 {
      color: #ffcc80;
      font-size: 1.2rem;
      letter-spacing: 3px;
      margin-bottom: 16px;
      border-bottom: 2px solid #8a7a4a;
      padding-bottom: 8px;
    }

    .modal p, .modal li {
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .modal ul {
      margin-left: 20px;
      margin-bottom: 16px;
    }

    .modal .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .modal .pbtn {
      min-width: 100px;
    }

    @media (max-width: 760px) {
      .app { flex-direction: column; }
      .board { height: 400px; }
      .digital { font-size: 1.5rem; }
      .spin-btn { width: 60px; height: 60px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- ===== 左：台 ===== -->
    <div class="machine">
      <div class="machine-top" id="machineTop">SBI証券パチンコ ～ 用語で大当たり ～</div>

      <div class="board" id="board">
        <div class="board-bg"></div>
        <div class="stage"></div>
        <div class="denchu" id="denchu">電チュー</div>
        <div class="heso" id="heso">ヘソ</div>
        <div class="digital" id="digital">---</div>

        <!-- スロット演出 -->
        <div class="slot-area" id="slotArea">
          <div class="slot-window">
            <div class="slot-reel" id="reel0">
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol sbar"></div>
              <div class="dot-symbol scherry"></div>
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol sbell"></div>
              <div class="dot-symbol ssuika"></div>
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol sreplay"></div>
              <div class="dot-symbol sbar"></div>
              <div class="dot-symbol s7"></div>
            </div>
          </div>
          <div class="slot-window">
            <div class="slot-reel" id="reel1">
              <div class="dot-symbol sbar"></div>
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol sbell"></div>
              <div class="dot-symbol scherry"></div>
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol ssuika"></div>
              <div class="dot-symbol sreplay"></div>
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol sbar"></div>
              <div class="dot-symbol sbell"></div>
            </div>
          </div>
          <div class="slot-window">
            <div class="slot-reel" id="reel2">
              <div class="dot-symbol scherry"></div>
              <div class="dot-symbol sbell"></div>
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol sbar"></div>
              <div class="dot-symbol ssuika"></div>
              <div class="dot-symbol s7"></div>
              <div class="dot-symbol sreplay"></div>
              <div class="dot-symbol sbar"></div>
              <div class="dot-symbol scherry"></div>
              <div class="dot-symbol s7"></div>
            </div>
          </div>
          <button class="slot-push-btn" id="slotPushBtn" onclick="slotPush()">押せ！</button>
        </div>

        <div id="fxArea" style="position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden;"></div>
      </div>
    </div>

    <!-- ===== 右：情報パネル ===== -->
    <div class="panel">

      <div class="panel-title">情報パネル</div>

      <div class="data-grid">
        <div class="data-box">
          <span class="label">回転数</span>
          <span class="value" id="dSpins">0</span>
        </div>
        <div class="data-box">
          <span class="label">総回転数</span>
          <span class="value" id="dTotalSpins">0</span>
        </div>
        <div class="data-box">
          <span class="label">現在連荘数</span>
          <span class="value" id="dChain">0</span>
        </div>
        <div class="data-box">
          <span class="label">総大当たり</span>
          <span class="value hit" id="dTotalHits">0</span>
        </div>
        <div class="data-box">
          <span class="label">持ち玉</span>
          <span class="value small" id="dBalls">0</span>
        </div>
        <div class="data-box">
          <span class="label">差玉</span>
          <span class="value small" id="dDiff">0</span>
        </div>
        <div class="data-box">
          <span class="label">レート</span>
          <span class="value small" id="dRate">4円</span>
        </div>
        <div class="data-box">
          <span class="label">交換率</span>
          <span class="value small" id="dExchange">等価</span>
        </div>
      </div>

      <div class="term-display">
        <div class="t-label">当選用語</div>
        <div class="t-term" id="tTerm">---</div>
        <div class="t-desc" id="tDesc">大当たりで用語を引くと解説が表示されます</div>
      </div>

      <div class="panel-buttons">
        <button class="pbtn" onclick="showHowTo()">遊び方</button>
        <button class="pbtn" onclick="showSpec()">スペック</button>
        <button class="pbtn" onclick="showCredit()">クレジット</button>
      </div>

      <div class="spin-area">
        <div class="spin-label">回 転 ｜ LOW / STOP / HIGH</div>
        <div class="spin-controls">
          <button class="spin-btn" id="spinLow" onclick="doSpin('low')">LOW<span class="sub">少なめ</span></button>
          <button class="spin-btn" id="spinStop" onclick="doSpin('stop')">STOP<span class="sub">普通</span></button>
          <button class="spin-btn" id="spinHigh" onclick="doSpin('high')">HIGH<span class="sub">多め</span></button>
        </div>
        <div class="auto-area">
          <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">自動回転 OFF</button>
        </div>
      </div>

      <div class="log" id="logBox">
        <div class="log-line system">▶ SBI証券パチンコへようこそ</div>
        <div class="log-line system">▶ 財布：15万円 ｜ 持ち玉：0</div>
      </div>

      <div class="panel-buttons" style="margin-top:auto;">
        <button class="pbtn" onclick="doSave()">セーブ</button>
        <button class="pbtn danger" onclick="openResetModal()">リセット</button>
      </div>

    </div>

  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    // ===== 用語データ（抜粋） =====
    const TERMS = [
      { term: '債券', desc: '国や企業が発行する借用証書。満期まで持つと利息がもらえる。' },
      { term: 'ファンダメンタルズ', desc: '企業の業績・財務など本質的価値。長期投資の判断材料。' },
      { term: '配当', desc: '企業が利益の一部を株主に分配するお金。' },
      { term: '保護預り', desc: '証券会社が顧客資産を保管。倒産しても資産は守られる。' },
      { term: '米国株', desc: 'アメリカの証券取引所に上場する株式。Apple、Amazonなど。' },

      { term: 'キャッシュフロー計算書', desc: 'CF。現金の流れ。' },
      { term: '財務諸表', desc: '企業の財務状態を示す書類。' },
      { term: '有価証券報告書', desc: '企業が提出する年次報告書。' },
      { term: '決算短信', desc: '決算内容をまとめた資料。' },
      { term: 'IR情報', desc: '投資家向け情報。' },
      { term: '株主総会', desc: '株主が集まる会議。' },
      { term: '議決権', desc: '株主総会での投票権。' },
      { term: '株主', desc: '株式を保有する人。' },
      { term: '株式', desc: '会社の所有権。' },
      { term: '上場', desc: '取引所で売買できるようにすること。' },
      { term: '非上場', desc: '取引所で売買できない。' },
      { term: '市場', desc: '売買が行われる場所。' },
      { term: '価格', desc: '売買の値段。' },
      { term: '需要', desc: '買いたい量。' },
      { term: '供給', desc: '売りたい量。' },
      { term: '均衡価格', desc: '需要と供給が一致する価格。' },
      { term: '見えざる手', desc: '市場を調整する力。' },
      { term: '神', desc: '市場そのもの。' }
    ];

    // ===== パチンコの種類 =====
    const PACHINKO_TYPES = [
      { name: '1円パチンコ', rate: 1, exchange: '等価', desc: '1玉=1円。少額で遊べる。' },
      { name: '2円パチンコ', rate: 2, exchange: '等価', desc: '1玉=2円。低貸し。' },
      { name: '4円パチンコ', rate: 4, exchange: '等価', desc: '1玉=4円。標準。' },
      { name: '4円パチンコ（換金率低）', rate: 4, exchange: '3.3円交換', desc: '1玉=4円だが換金は3.3円。' },
      { name: '10円パチンコ', rate: 10, exchange: '等価', desc: '1玉=10円。高額。' },
      { name: '100円パチンコ', rate: 100, exchange: '等価', desc: '1玉=100円。超ハイレート。' },
      { name: '5円パチンコ', rate: 5, exchange: '等価', desc: '1玉=5円。中間。' },
      { name: '1円パチンコ（換金率低）', rate: 1, exchange: '0.8円交換', desc: '1玉=1円だが換金は0.8円。' }
    ];

    let spec = {};

    function generateSpec() {
      const type = PACHINKO_TYPES[Math.floor(Math.random() * PACHINKO_TYPES.length)];
      const modes = [
        { name: 'ノーマル', desc: '標準スペック', hitRate: 1/50, balls: 500 },
        { name: 'ライト', desc: '軽い・当たりやすい', hitRate: 1/30, balls: 350 },
        { name: 'ミドル', desc: 'バランス型', hitRate: 1/80, balls: 800 },
        { name: 'ハード', desc: '重い・出玉多め', hitRate: 1/120, balls: 1200 },
        { name: '爆裂', desc: '超重い・超出玉', hitRate: 1/200, balls: 2500 },
        { name: '甘デジ', desc: '甘い・連荘しやすい', hitRate: 1/25, balls: 300 }
      ];
      const m = modes[Math.floor(Math.random() * modes.length)];
      spec = {
        type: type,
        hitRate: m.hitRate,
        ballsPerHit: m.balls,
        modeName: m.name,
        modeDesc: m.desc,
        ballCost: 1,
        lowMult: 0.5,
        stopMult: 1,
        highMult: 2
      };
    }

    let state = {
      wallet: 150000,
      deposit: 20000,
      balls: 0,
      spins: 0,
      totalSpins: 0,
      chain: 0,
      totalHits: 0,
      zukan: {},
      logs: [],
      stateMode: '通常',
      stateDesc: '確率変動なし'
    };

    const SAVE_KEY = 'sbi_pachinko_v5';

    let autoMode = false;
    let autoTimer = null;
    let spinning = false;
    let slotActive = false;

    function init() {
      loadSave();
      if (!spec.type) generateSpec();
      render();
      addLog('▶ SBI証券パチンコへようこそ', 'system');
      addLog(`▶ 財布：${state.wallet.toLocaleString()}円 ｜ 持ち玉：${state.balls}`, 'system');
      addLog(`▶ ${spec.type.name}（${spec.type.desc}）`, 'system');
      addLog(`▶ スペック：${spec.modeName}（${spec.modeDesc}）`, 'system');
    }

    function doSave() {
      try {
        const data = { ...state, spec };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        addLog('💾 セーブしました', 'system');
      } catch(e) {
        addLog('⚠️ セーブ失敗', 'system');
      }
    }

    function loadSave() {
      try {
        const data = localStorage.getItem(SAVE_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          if (parsed.spec) spec = parsed.spec;
          delete parsed.spec;
          state = { ...state, ...parsed };
        }
      } catch(e) {}
    }

    let resetStep = 0;

    function openResetModal() {
      resetStep = 1;
      showModal(`
        <h2>⚠️ リセット確認 (1/4)</h2>
        <p>本当にリセットしますか？<br><span style="color:#c08080;">すべてのデータが消えます</span></p>
        <div class="modal-btns">
          <button class="pbtn" onclick="confirmReset()">はい</button>
          <button class="pbtn" onclick="closeModal()">いいえ</button>
        </div>
      `);
    }

    function confirmReset() {
      resetStep++;
      if (resetStep === 2) {
        showModal(`
          <h2>⚠️ リセット確認 (2/4)</h2>
          <p>本当に本当にリセットしますか？<br><span style="color:#c08080;">持ち玉・回転数・図鑑がすべて消えます</span></p>
          <div class="modal-btns">
            <button class="pbtn" onclick="confirmReset()">はい</button>
            <button class="pbtn" onclick="closeModal()">いいえ</button>
          </div>
        `);
      } else if (resetStep === 3) {
        showModal(`
          <h2>⚠️ リセット確認 (3/4)</h2>
          <p>本当に本当に本当にリセットしますか？<br><span style="color:#c08080;">後悔しませんか？</span></p>
          <div class="modal-btns">
            <button class="pbtn" onclick="confirmReset()">はい</button>
            <button class="pbtn" onclick="closeModal()">いいえ</button>
          </div>
        `);
      } else if (resetStep === 4) {
        showModal(`
          <h2>⚠️ 最終確認 (4/4)</h2>
          <p><span style="color:#ff6666;font-size:1.1rem;">本当にリセットしますか？</span><br><span style="color:#c08080;">この操作は取り消せません</span></p>
          <div class="modal-btns">
            <button class="pbtn" onclick="confirmReset()" style="border-color:#7a4a4a;color:#c08080;">はい</button>
            <button class="pbtn" onclick="closeModal()">いいえ</button>
          </div>
        `);
      } else {
        localStorage.removeItem(SAVE_KEY);
        state = {
          wallet: 150000,
          deposit: 20000,
          balls: 0,
          spins: 0,
          totalSpins: 0,
          chain: 0,
          totalHits: 0,
          zukan: {},
          logs: [],
          stateMode: '通常',
          stateDesc: '確率変動なし'
        };
        generateSpec();
        render();
        addLog('🔄 リセットしました', 'system');
        addLog(`▶ 新しいスペック：${spec.type.name}（${spec.type.desc}）`, 'system');
        addLog(`▶ ${spec.modeName}（${spec.modeDesc}）`, 'system');
        addLog(`▶ 財布：${state.wallet.toLocaleString()}円 ｜ 持ち玉：${state.balls}`, 'system');
        closeModal();
        resetStep = 0;
      }
    }

    function showModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      resetStep = 0;
    }

    function render() {
      document.getElementById('dSpins').textContent = state.spins;
      document.getElementById('dTotalSpins').textContent = state.totalSpins;
      document.getElementById('dChain').textContent = state.chain;
      document.getElementById('dTotalHits').textContent = state.totalHits;
      document.getElementById('dBalls').textContent = state.balls;
      const diff = state.balls - state.deposit;
      const diffEl = document.getElementById('dDiff');
      diffEl.textContent = (diff >= 0 ? '+' : '') + diff;
      diffEl.className = 'value small ' + (diff >= 0 ? 'hit' : '');

      if (spec.type) {
        document.getElementById('dRate').textContent = spec.type.rate + '円';
        document.getElementById('dExchange').textContent = spec.type.exchange;
        document.getElementById('machineTop').textContent = `SBI証券パチンコ ～ ${spec.type.name} ～`;
      }
      renderLog();
    }

    function renderLog() {
      const box = document.getElementById('logBox');
      box.innerHTML = state.logs.slice(-40).map(l =>
        `<div class="log-line ${l.type}">${l.text}</div>`
      ).join('');
      box.scrollTop = box.scrollHeight;
    }

    function addLog(text, type = 'system') {
      state.logs.push({ text, type });
      if (state.logs.length > 150) state.logs = state.logs.slice(-80);
      renderLog();
    }

    function toggleAuto() {
      autoMode = !autoMode;
      const btn = document.getElementById('autoBtn');
      if (autoMode) {
        btn.textContent = '自動回転 ON';
        btn.classList.add('on');
        addLog('🔄 自動回転 ON', 'system');
        autoTimer = setInterval(() => {
          if (!spinning && state.balls >= spec.ballCost) {
            doSpin('stop');
          } else if (state.balls < spec.ballCost) {
            addLog('⚠️ 持ち玉切れ。自動回転停止', 'system');
            toggleAuto();
          }
        }, 2000);
      } else {
        btn.textContent = '自動回転 OFF';
        btn.classList.remove('on');
        addLog('⏹ 自動回転 OFF', 'system');
        if (autoTimer) {
          clearInterval(autoTimer);
          autoTimer = null;
        }
      }
    }

    function doSpin(intensity) {
      if (spinning) return;

      const cost = spec.ballCost;
      if (state.balls < cost) {
        addLog(`⚠️ 持ち玉が足りません（${cost}玉必要）`, 'system');
        if (autoMode) toggleAuto();
        return;
      }

      spinning = true;
      document.getElementById('spinLow').disabled = true;
      document.getElementById('spinStop').disabled = true;
      document.getElementById('spinHigh').disabled = true;

      state.balls -= cost;
      state.spins++;
      state.totalSpins++;
      render();

      addLog(`🎯 ${state.spins}回転目…（${intensity.toUpperCase()}）`, 'system');

      // スロット演出開始（回転時だけ動く）
      startSlot();

      // 玉を出す
      const ballCount = intensity === 'low' ? 1 : intensity === 'stop' ? 3 : 6;
      for (let i = 0; i < ballCount; i++) {
        setTimeout(() => spawnBall(), i * 150);
      }

      let hitRate = spec.hitRate;
      if (state.stateMode === '確変') hitRate *= 3;
      if (state.stateMode === '時短') hitRate *= 1.5;

      const mult = intensity === 'low' ? spec.lowMult : intensity === 'stop' ? spec.stopMult : spec.highMult;
      const hit = Math.random() < hitRate * mult;

      setTimeout(() => {
        stopSlot(hit);
        if (hit) {
          state.totalHits++;
          state.chain++;
          state.balls += spec.ballsPerHit;
          const term = TERMS[Math.floor(Math.random() * TERMS.length)];
          state.zukan[term.term] = (state.zukan[term.term] || 0) + 1;

          if (Math.random() < 0.3) {
            state.stateMode = '確変';
            state.stateDesc = '大当たり確率アップ';
          } else if (Math.random() < 0.5) {
            state.stateMode = '時短';
            state.stateDesc = '回転数アップ';
          }

          document.getElementById('tTerm').textContent = term.term;
          document.getElementById('tDesc').textContent = term.desc;

          addLog(`🎉 大当たり！【${term.term}】${term.desc}`, 'hit');
          addLog(`💰 +${spec.ballsPerHit}玉 獲得！ 連荘：${state.chain}`, 'hit');

          if (state.stateMode !== '通常') {
            addLog(`⭐ 状態変化：${state.stateMode}`, 'event');
          }

          playHitFX();
        } else {
          addLog(`…ハズレ`, 'miss');
          if (state.stateMode !== '通常') {
            state.stateMode = '通常';
            state.stateDesc = '確率変動なし';
          }
          state.chain = 0;
        }

        spinning = false;
        document.getElementById('spinLow').disabled = false;
        document.getElementById('spinStop').disabled = false;
        document.getElementById('spinHigh').disabled = false;
        render();
        doSave();
      }, 1200);
    }

    // ===== スロット演出（回転時だけ動く） =====
    const SYMBOL_CLASSES = ['s7', 'sbar', 'scherry', 'sbell', 'ssuika', 'sreplay'];

    function startSlot() {
      if (slotActive) return;
      slotActive = true;
      const area = document.getElementById('slotArea');
      area.classList.add('active');
      for (let i = 0; i < 3; i++) {
        const reel = document.getElementById('reel' + i);
        reel.classList.add('spinning');
      }
      if (Math.random() < 0.3) {
        document.getElementById('slotPushBtn').classList.add('active');
      }
    }

    function slotPush() {
      document.getElementById('slotPushBtn').classList.remove('active');
      addLog('👆 押せ！ボタンを押した！', 'event');
    }

    function stopSlot(hit) {
      for (let i = 0; i < 3; i++) {
        const reel = document.getElementById('reel' + i);
        setTimeout(() => {
          reel.classList.remove('spinning');
          if (hit) {
            reel.innerHTML = '<div class="dot-symbol s7"></div>';
          } else {
            const cls = SYMBOL_CLASSES[Math.floor(Math.random() * SYMBOL_CLASSES.length)];
            reel.innerHTML = `<div class="dot-symbol ${cls}"></div>`;
          }
        }, i * 250);
      }
      setTimeout(() => {
        document.getElementById('slotArea').classList.remove('active');
        document.getElementById('slotPushBtn').classList.remove('active');
        slotActive = false;
      }, 1200);
    }

    function spawnBall() {
      const board = document.getElementById('board');
      const ball = document.createElement('div');
      ball.className = 'ball';
      ball.style.left = '50%';
      ball.style.top = '70px';
      ball.style.transform = 'translateX(-50%)';
      board.appendChild(ball);

      const duration = 800 + Math.random() * 400;
      ball.style.transition = `top ${duration}ms ease-in, left ${duration}ms ease-in-out`;

      setTimeout(() => {
        ball.style.top = '380px';
        ball.style.left = (50 + (Math.random() * 30 - 15)) + '%';
      }, 30);

      const enters = Math.random() < 0.2;
      if (enters) {
        setTimeout(() => {
          ball.style.top = '340px';
          ball.style.left = '50%';
          ball.style.opacity = '0';
        }, duration * 0.85);
      }

      setTimeout(() => ball.remove(), duration + 200);
    }

    function playHitFX() {
      const board = document.getElementById('board');
      board.style.animation = 'none';
      void board.offsetWidth;
      board.style.animation = 'boardShake 0.4s ease';

      const digital = document.getElementById('digital');
      digital.textContent = '大当り';
      digital.classList.add('hit');
      setTimeout(() => {
        digital.classList.remove('hit');
        digital.textContent = '---';
      }, 1800);

      const heso = document.getElementById('heso');
      heso.classList.add('hit');
      setTimeout(() => heso.classList.remove('hit'), 1500);

      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'ball';
        p.style.left = '50%';
        p.style.top = '340px';
        p.style.width = '8px';
        p.style.height = '8px';
        p.style.opacity = '1';
        p.style.transition = 'transform 1s ease-out, opacity 1s';
        document.getElementById('fxArea').appendChild(p);
        setTimeout(() => {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 120 + 40;
          p.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
          p.style.opacity = '0';
        }, 30);
        setTimeout(() => p.remove(), 1100);
      }
    }

    function showHowTo() {
      showModal(`
        <h2>📖 遊び方</h2>
        <p><strong>パチンコとパチスロの違い：</strong></p>
        <ul>
          <li><strong>パチンコ</strong>：玉を弾いてヘソに入れて大当たり。玉が増える。</li>
          <li><strong>パチスロ</strong>：リールを回して図柄を揃える。メダルが増える。</li>
        </ul>
        <p><strong>このアプリ：</strong></p>
        <ul>
          <li><strong>LOW / STOP / HIGH</strong>：回転の強さ。強さで玉の数と当たりやすさが変わる。</li>
          <li><strong>自動回転</strong>：ONにすると勝手に回り続ける。</li>
          <li><strong>スロット演出</strong>：回転時だけリールが動く。「押せ！」ボタンが出たら押す。</li>
          <li><strong>スペック</strong>：リセットごとにランダム。レート（1円〜100円）と交換率も変わる。</li>
          <li><strong>クレジット</strong>：財布から持ち玉に変える。デフォルト2万円。</li>
        </ul>
        <p><strong>レートの種類：</strong>1円、2円、4円、5円、10円、100円パチンコがある。1玉の価値が違う。</p>
        <div class="modal-btns">
          <button class="pbtn" onclick="closeModal()">閉じる</button>
        </div>
      `);
    }

    function showSpec() {
      showModal(`
        <h2>⚙️ 現在のスペック</h2>
        <p><strong>レート：</strong>${spec.type.name}（${spec.type.desc}）</p>
        <p><strong>交換率：</strong>${spec.type.exchange}</p>
        <p><strong>モード：</strong>${spec.modeName}（${spec.modeDesc}）</p>
        <ul>
          <li>大当たり確率：1/${Math.round(1/spec.hitRate)}</li>
          <li>1回の出玉：${spec.ballsPerHit}玉</li>
          <li>1回転の消費：${spec.ballCost}玉</li>
          <li>LOW倍率：${spec.lowMult}倍</li>
          <li>STOP倍率：${spec.stopMult}倍</li>
          <li>HIGH倍率：${spec.highMult}倍</li>
        </ul>
        <p style="color:#88a;font-size:0.8rem;">※リセットするとスペックがランダムに変わります</p>
        <div class="modal-btns">
          <button class="pbtn" onclick="closeModal()">閉じる</button>
        </div>
      `);
    }

    function showCredit() {
      showModal(`
        <h2>💰 クレジット</h2>
        <p>財布：<strong>${state.wallet.toLocaleString()}円</strong></p>
        <p>持ち玉：<strong>${state.balls}玉</strong></p>
        <p>レート：<strong>${spec.type.rate}円 / 玉</strong></p>
        <p style="color:#88a;font-size:0.8rem;">※1万円 = ${Math.floor(10000 / spec.type.rate)}玉 として交換します</p>
        <div class="modal-btns">
          <button class="pbtn" onclick="doDeposit(20000)">2万円入金</button>
          <button class="pbtn" onclick="doDeposit(50000)">5万円入金</button>
          <button class="pbtn" onclick="doDeposit(100000)">10万円入金</button>
          <button class="pbtn" onclick="closeModal()">閉じる</button>
        </div>
      `);
    }

    function doDeposit(amount) {
      if (state.wallet < amount) {
        addLog('⚠️ 財布の残高が足りません', 'system');
        return;
      }
      state.wallet -= amount;
      const balls = Math.floor(amount / spec.type.rate);
      state.balls += balls;
      addLog(`💰 ${amount.toLocaleString()}円入金 → ${balls}玉 獲得（${spec.type.rate}円/玉）`, 'system');
      render();
      closeModal();
      doSave();
    }

    init();
  </script>

  <style>
    @keyframes boardShake {
      0%, 100% { transform: translate(0,0); }
      20% { transform: translate(-4px, -2px); }
      40% { transform: translate(4px, 2px); }
      60% { transform: translate(-3px, 1px); }
      80% { transform: translate(2px, -1px); }
    }
  </style>

</body>
</html>
