<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI証券パチンコ ｜ 用語で大当たり</title>
  <style>
    /* ===== パチンコ店 × SBI証券：落ち着いた色調、目に優しい ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      font-family: 'MS PGothic', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif;
      color: #d0d0d0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      overflow-x: hidden;
    }

    .cabinet {
      max-width: 900px;
      width: 100%;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      border: 4px solid #8a7a4a;
      border-radius: 10px;
      box-shadow:
        0 0 0 2px #111,
        0 0 30px rgba(0,0,0,0.8),
        inset 0 0 40px rgba(0,0,0,0.5);
      padding: 14px;
      position: relative;
    }

    /* ===== ヘッダー ===== */
    .machine-header {
      background: linear-gradient(90deg, #2a2518 0%, #3a3020 50%, #2a2518 100%);
      border: 2px solid #8a7a4a;
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .machine-title {
      font-size: 1.15rem;
      color: #c8b070;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .machine-title small {
      display: block;
      font-size: 0.65rem;
      color: #888;
      letter-spacing: 2px;
      font-weight: normal;
      margin-top: 2px;
    }

    .header-stats {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      color: #aaa;
      flex-wrap: wrap;
    }

    .header-stats span {
      background: #111;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .header-stats .val { color: #c8b070; font-weight: bold; }

    /* ===== パチンコ盤面 ===== */
    .pachinko-board {
      background: #0a0a0a;
      border: 3px solid #444;
      border-radius: 8px;
      padding: 0;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      height: 420px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    }

    /* 盤面の背景（釘のイメージ） */
    .board-bg {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, #3a3a3a 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      opacity: 0.5;
    }

    /* ステージ（玉が通る道） */
    .stage {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 80px;
      border-bottom: 2px solid #555;
      background: linear-gradient(180deg, #1a1a1a, #222);
      border-radius: 0 0 20px 20px;
    }

    /* ヘソ（入賞口） */
    .heso {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
      border: 3px solid #8a7a4a;
      border-radius: 4px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: #8a7a4a;
      letter-spacing: 2px;
      z-index: 5;
      transition: 0.3s;
    }

    .heso.hit {
      background: #3a2a10;
      border-color: #c8b070;
    }

    /* 電チュー（電動チューリップ） */
    .denchu {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 20px;
      border: 2px solid #555;
      border-radius: 10px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: #666;
      letter-spacing: 1px;
      z-index: 5;
    }

    /* 玉 */
    .ball {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e0e0e0, #808080);
      box-shadow: 0 0 4px rgba(200,200,200,0.3);
      z-index: 10;
      pointer-events: none;
    }

    /* ===== デジタル表示（控えめ） ===== */
    .digital-display {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 1.8rem;
      color: #a0c080;
      background: #0a0a0a;
      border: 2px solid #555;
      padding: 6px 20px;
      border-radius: 4px;
      letter-spacing: 4px;
      text-align: center;
      z-index: 8;
      transition: 0.3s;
    }

    .digital-display.hit {
      color: #e0c080;
      border-color: #8a7a4a;
    }

    /* ===== 演出エリア ===== */
    .fx-area {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    /* ===== 情報パネル ===== */
    .info-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .info-box {
      flex: 1 1 180px;
      background: #151515;
      border: 1px solid #444;
      border-left: 3px solid #8a7a4a;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #aaa;
      line-height: 1.6;
    }

    .info-box .label {
      color: #777;
      font-size: 0.7rem;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
    }

    .info-box .term {
      color: #c8b070;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .info-box .desc {
      color: #b0b0b0;
      font-size: 0.78rem;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ===== 操作ボタン ===== */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(180deg, #3a3a3a 0%, #222 100%);
      border: 2px solid #8a7a4a;
      color: #c8b070;
      padding: 14px 24px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 2px;
      font-family: 'MS PGothic', sans-serif;
      font-weight: bold;
      transition: 0.15s;
      flex: 1 1 auto;
      min-width: 120px;
    }

    .btn:hover {
      background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
      border-color: #a89858;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .btn.danger {
      border-color: #7a4a4a;
      color: #c08080;
    }

    .btn.danger:hover {
      border-color: #9a5a5a;
      background: linear-gradient(180deg, #4a2a2a 0%, #2a1a1a 100%);
    }

    .btn.small {
      padding: 8px 16px;
      font-size: 0.8rem;
      min-width: auto;
      flex: 0 1 auto;
    }

    /* ===== 図鑑 ===== */
    .zukan {
      background: #151515;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .zukan h3 {
      font-size: 0.9rem;
      color: #c8b070;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
    }

    .zukan-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 0.78rem;
      border-bottom: 1px dashed #2a2a2a;
      color: #aaa;
    }

    .zukan-item:last-child { border-bottom: none; }

    .zukan-item .z-term { color: #c8b070; }
    .zukan-item .z-count { color: #a0c080; font-family: 'Courier New', monospace; }

    /* ===== ログ ===== */
    .log {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 12px;
      height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
      color: #999;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .log .log-line { margin-bottom: 2px; }
    .log .log-line.hit { color: #c8b070; }
    .log .log-line.miss { color: #666; }
    .log .log-line.event { color: #a89858; }
    .log .log-line.system { color: #7a9ac0; }

    /* ===== セーブ・リセット ===== */
    .save-panel {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ===== モーダル ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1a1a1a;
      border: 3px solid #8a7a4a;
      border-radius: 10px;
      padding: 30px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
    }

    .modal h2 {
      color: #c8b070;
      font-size: 1.3rem;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .modal p {
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .modal .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .modal .btn {
      min-width: 100px;
      flex: 0 1 auto;
    }

    /* ===== 演出用（控えめ） ===== */
    .fx-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.6rem;
      color: #c8b070;
      letter-spacing: 4px;
      z-index: 60;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 12px 30px;
      border: 2px solid #8a7a4a;
      border-radius: 6px;
    }

    .fx-text.show {
      opacity: 1;
    }

    .board-shake {
      animation: boardShake 0.4s ease;
    }

    @keyframes boardShake {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(-4px, -2px); }
      50% { transform: translate(4px, 2px); }
      75% { transform: translate(-3px, 1px); }
    }

    /* 玉のアニメーション用 */
    .ball-fall {
      animation: ballFall 1.2s ease-in forwards;
    }

    @keyframes ballFall {
      0% { top: 80px; opacity: 1; }
      100% { top: 360px; opacity: 0.3; }
    }

    /* レスポンシブ */
    @media (max-width: 600px) {
      .pachinko-board { height: 340px; }
      .digital-display { font-size: 1.3rem; padding: 4px 14px; top: 80px; }
      .btn { padding: 10px 14px; font-size: 0.85rem; }
      .machine-title { font-size: 0.95rem; }
      .info-box { flex: 1 1 100%; }
    }
  </style>
</head>
<body>

  <div class="cabinet" id="cabinet">

    <!-- ヘッダー -->
    <div class="machine-header">
      <div class="machine-title">
        SBI証券パチンコ
        <small>～ 用語で大当たり ～</small>
      </div>
      <div class="header-stats">
        <span>所持金 <span class="val" id="statMoney">1000</span>枚</span>
        <span>回転数 <span class="val" id="statSpins">0</span></span>
        <span>大当たり <span class="val" id="statHits">0</span></span>
      </div>
    </div>

    <!-- パチンコ盤面 -->
    <div class="pachinko-board" id="pachinkoBoard">
      <div class="board-bg"></div>

      <!-- ステージ -->
      <div class="stage"></div>

      <!-- 電チュー -->
      <div class="denchu" id="denchu">電チュー</div>

      <!-- ヘソ -->
      <div class="heso" id="heso">ヘソ</div>

      <!-- デジタル表示 -->
      <div class="digital-display" id="digitalDisplay">---</div>

      <!-- 演出テキスト -->
      <div class="fx-text" id="fxText"></div>

      <!-- 演出エリア（玉など） -->
      <div class="fx-area" id="fxArea"></div>
    </div>

    <!-- 情報パネル -->
    <div class="info-panel">
      <div class="info-box">
        <span class="label">当選用語</span>
        <span class="term" id="infoTerm">---</span>
        <div class="desc" id="infoDesc">用語を引くと解説が表示されます</div>
      </div>
      <div class="info-box">
        <span class="label">状態</span>
        <span class="term" id="infoState">通常</span>
        <div class="desc" id="infoStateDesc">確率変動なし</div>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button class="btn" id="btnSpin" onclick="doSpin()">🎯 玉を打つ（100枚）</button>
      <button class="btn" id="btnBet" onclick="doBet()">💰 ベット（10枚）</button>
      <button class="btn small" onclick="doZukan()">📖 図鑑</button>
      <button class="btn small" onclick="doSave()">💾 セーブ</button>
    </div>

    <!-- 図鑑 -->
    <div class="zukan" id="zukanBox">
      <h3>📖 用語図鑑</h3>
      <div id="zukanList">
        <div class="zukan-item" style="color:#666;">まだ何も引いていません</div>
      </div>
    </div>

    <!-- ログ -->
    <div class="log" id="logBox">
      <div class="log-line system">▶ SBI証券パチンコへようこそ</div>
      <div class="log-line system">▶ 100枚からスタート。玉を打って用語を学ぼう</div>
    </div>

    <!-- セーブ・リセット -->
    <div class="save-panel">
      <button class="btn small danger" onclick="openResetModal()">🔄 リセット</button>
      <button class="btn small" onclick="doSave()">💾 セーブ</button>
    </div>

  </div>

  <!-- リセット確認モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">⚠️ リセット確認</h2>
      <p id="modalText">本当にリセットしますか？</p>
      <div class="modal-btns" id="modalBtns">
        <button class="btn danger" onclick="confirmReset()">はい</button>
        <button class="btn" onclick="closeModal()">いいえ</button>
      </div>
    </div>
  </div>

  <script>

    // ===== 状態 =====
    let state = {
      money: 1000,
      spins: 0,
      hits: 0,
      zukan: {},
      logs: [],
      stateMode: '通常',
      stateDesc: '確率変動なし'
    };

    const SAVE_KEY = 'sbi_pachinko_save_v2';

    // ===== 初期化 =====
    function init() {
      loadSave();
      render();
      addLog('▶ SBI証券パチンコへようこそ', 'system');
      addLog('▶ 100枚からスタート。玉を打って用語を学ぼう', 'system');
    }

    // ===== セーブ =====
    function doSave() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        addLog('💾 セーブしました', 'system');
      } catch(e) {
        addLog('⚠️ セーブ失敗', 'system');
      }
    }

    function loadSave() {
      try {
        const data = localStorage.getItem(SAVE_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          state = { ...state, ...parsed };
        }
      } catch(e) {}
    }

    // ===== リセット（4回確認） =====
    let resetStep = 0;

    function openResetModal() {
      resetStep = 1;
      showModal(
        '⚠️ リセット確認 (1/4)',
        '本当にリセットしますか？<br><span style="color:#a44;">すべてのデータが消えます</span>'
      );
    }

    function confirmReset() {
      resetStep++;
      if (resetStep === 2) {
        showModal(
          '⚠️ リセット確認 (2/4)',
          '本当に本当にリセットしますか？<br><span style="color:#a44;">所持金・回転数・図鑑がすべて消えます</span>'
        );
      } else if (resetStep === 3) {
        showModal(
          '⚠️ リセット確認 (3/4)',
          '本当に本当に本当にリセットしますか？<br><span style="color:#a44;">後悔しませんか？</span>'
        );
      } else if (resetStep === 4) {
        showModal(
          '⚠️ 最終確認 (4/4)',
          '<span style="color:#ff6666;font-size:1.1rem;">本当にリセットしますか？</span><br><span style="color:#a44;">この操作は取り消せません</span>'
        );
      } else {
        localStorage.removeItem(SAVE_KEY);
        state = {
          money: 1000,
          spins: 0,
          hits: 0,
          zukan: {},
          logs: [],
          stateMode: '通常',
          stateDesc: '確率変動なし'
        };
        render();
        addLog('🔄 リセットしました', 'system');
        addLog('▶ 100枚から再スタート', 'system');
        closeModal();
        resetStep = 0;
      }
    }

    function showModal(title, text) {
      document.getElementById('modalTitle').innerHTML = title;
      document.getElementById('modalText').innerHTML = text;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      resetStep = 0;
    }

    // ===== レンダリング =====
    function render() {
      document.getElementById('statMoney').textContent = state.money;
      document.getElementById('statSpins').textContent = state.spins;
      document.getElementById('statHits').textContent = state.hits;
      document.getElementById('infoState').textContent = state.stateMode;
      document.getElementById('infoStateDesc').textContent = state.stateDesc;
      renderZukan();
      renderLog();
    }

    function renderZukan() {
      const list = document.getElementById('zukanList');
      const keys = Object.keys(state.zukan);
      if (keys.length === 0) {
        list.innerHTML = '<div class="zukan-item" style="color:#666;">まだ何も引いていません</div>';
        return;
      }
      keys.sort((a,b) => state.zukan[b] - state.zukan[a]);
      list.innerHTML = keys.map(k =>
        `<div class="zukan-item">
          <span class="z-term">${k}</span>
          <span class="z-count">×${state.zukan[k]}</span>
        </div>`
      ).join('');
    }

    function renderLog() {
      const box = document.getElementById('logBox');
      box.innerHTML = state.logs.slice(-50).map(l =>
        `<div class="log-line ${l.type}">${l.text}</div>`
      ).join('');
      box.scrollTop = box.scrollHeight;
    }

    function addLog(text, type = 'system') {
      state.logs.push({ text, type });
      if (state.logs.length > 200) state.logs = state.logs.slice(-100);
      renderLog();
    }

    // ===== 玉を打つ =====
    function doSpin() {
      if (state.money < 100) {
        addLog('⚠️ 所持金が足りません（100枚必要）', 'system');
        return;
      }

      state.money -= 100;
      state.spins++;
      render();

      addLog(`🎯 ${state.spins}回転目…玉を打ちます`, 'system');

      // 玉のアニメーション
      spawnBall();

      // 大当たり判定
      let hitRate = 1/50;
      if (state.stateMode === '確変') hitRate = 1/10;
      if (state.stateMode === '時短') hitRate = 1/25;

      const hit = Math.random() < hitRate;

      // 演出選択（控えめ）
      const fxRoll = Math.random();
      if (fxRoll < 0.08) {
        showFxText('リーチ！', 1200);
      } else if (fxRoll < 0.15) {
        showFxText('…', 600);
      }

      // 結果
      setTimeout(() => {
        if (hit) {
          state.hits++;
          state.money += 500;
          const term = TERMS[Math.floor(Math.random() * TERMS.length)];
          state.zukan[term.term] = (state.zukan[term.term] || 0) + 1;

          if (Math.random() < 0.3) {
            state.stateMode = '確変';
            state.stateDesc = '大当たり確率アップ';
          } else if (Math.random() < 0.5) {
            state.stateMode = '時短';
            state.stateDesc = '回転数アップ';
          }

          document.getElementById('infoTerm').textContent = term.term;
          document.getElementById('infoDesc').textContent = term.desc;

          addLog(`🎉 大当たり！【${term.term}】${term.desc}`, 'hit');
          addLog(`💰 +500枚 獲得！`, 'hit');

          if (state.stateMode !== '通常') {
            addLog(`⭐ 状態変化：${state.stateMode}（${state.stateDesc}）`, 'event');
          }

          // 控えめな大当たり演出
          playHitFX();
        } else {
          addLog(`…ハズレ`, 'miss');
          if (state.stateMode !== '通常') {
            state.stateMode = '通常';
            state.stateDesc = '確率変動なし';
            addLog('状態が通常に戻りました', 'system');
          }
        }
        render();
        doSave();
      }, 900);
    }

    // ===== 玉の生成 =====
    function spawnBall() {
      const board = document.getElementById('pachinkoBoard');
      const ball = document.createElement('div');
      ball.className = 'ball';
      ball.style.left = '50%';
      ball.style.top = '80px';
      ball.style.transform = 'translateX(-50%)';
      board.appendChild(ball);

      // 落ちるアニメーション
      const duration = 900 + Math.random() * 300;
      ball.style.transition = `top ${duration}ms ease-in, left ${duration}ms ease-in-out`;

      setTimeout(() => {
        ball.style.top = '360px';
        ball.style.left = (50 + (Math.random() * 20 - 10)) + '%';
      }, 30);

      // ヘソに入るかどうか（見た目）
      const enters = Math.random() < 0.15;
      if (enters) {
        setTimeout(() => {
          ball.style.top = '330px';
          ball.style.left = '50%';
          ball.style.opacity = '0';
        }, duration * 0.9);
      }

      setTimeout(() => ball.remove(), duration + 200);
    }

    // ===== 演出テキスト =====
    function showFxText(text, duration) {
      const fx = document.getElementById('fxText');
      fx.textContent = text;
      fx.classList.add('show');
      setTimeout(() => fx.classList.remove('show'), duration);
    }

    // ===== 大当たり演出（控えめ） =====
    function playHitFX() {
      const board = document.getElementById('pachinkoBoard');
      board.classList.add('board-shake');
      setTimeout(() => board.classList.remove('board-shake'), 400);

      // デジタル表示
      const digital = document.getElementById('digitalDisplay');
      digital.classList.add('hit');
      digital.textContent = '大当り';
      setTimeout(() => {
        digital.classList.remove('hit');
        digital.textContent = '---';
      }, 2000);

      // ヘソを光らせる（控えめ）
      const heso = document.getElementById('heso');
      heso.classList.add('hit');
      setTimeout(() => heso.classList.remove('hit'), 1500);

      // 控えめなパーティクル（玉が弾けるイメージ）
      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'fx-particle';
        p.textContent = '●';
        p.style.color = '#c8b070';
        p.style.fontSize = '10px';
        p.style.left = '50%';
        p.style.top = '330px';
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 100 + 40;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        document.getElementById('fxArea').appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }
    }

    // ===== ベット（所持金回復） =====
    function doBet() {
      if (state.money >= 1000) {
        addLog('⚠️ 所持金が十分にあります', 'system');
        return;
      }
      state.money += 10;
      addLog('💰 ベットで10枚獲得', 'system');
      render();
      doSave();
    }

    // ===== 図鑑 =====
    function doZukan() {
      const keys = Object.keys(state.zukan);
      if (keys.length === 0) {
        addLog('📖 図鑑はまだ空です', 'system');
      } else {
        addLog(`📖 図鑑：${keys.length}種類の用語を引きました`, 'system');
      }
      const box = document.getElementById('zukanBox');
      box.scrollIntoView({ behavior: 'smooth' });
    }

    // ===== 初期化 =====
    init();
  </script>

</body>
</html>
