<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI証券パチンコ ｜ 土管横視点完全版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a1a;
  font-family: 'MS PGothic', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif;
  color: #eee;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 10px;
  overflow-x: hidden;
}

.app {
  max-width: 1100px;
  width: 100%;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.machine {
  flex: 1 1 620px;
  background: linear-gradient(180deg, #2a2a3a 0%, #1a1a2a 100%);
  border: 4px solid #8a7a4a;
  border-radius: 10px;
  padding: 10px;
  position: relative;
  box-shadow: 0 0 0 2px #111, 0 0 20px rgba(0,0,0,0.7);
}

.machine-top {
  background: linear-gradient(90deg, #c06020 0%, #e08030 50%, #c06020 100%);
  border: 2px solid #ffcc80;
  border-radius: 6px;
  padding: 6px 12px;
  text-align: center;
  font-size: 0.85rem;
  color: #fff;
  letter-spacing: 3px;
  font-weight: bold;
  text-shadow: 1px 1px 0 #804010;
  margin-bottom: 8px;
}

.board {
  background: #0a0a12;
  border: 3px solid #444;
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  height: 600px;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
}

.board-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(60,60,100,0.3) 0%, transparent 60%),
    #0a0a12;
}

/* ネジ */
.nail {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ddd, #666);
  z-index: 2;
  box-shadow: 0 0 3px rgba(200,200,200,0.5);
}

/* 土管（横から見た筒） */
.pipe {
  position: absolute;
  z-index: 8;
  transition: 0.2s;
}

.pipe-body {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg,
    #0a2a0a 0%,
    #2a6a2a 20%,
    #4a9a4a 50%,
    #2a6a2a 80%,
    #0a2a0a 100%);
  border: 2px solid #0a2a0a;
  border-radius: 3px 3px 0 0;
  box-shadow:
    inset 0 0 20px rgba(0,0,0,0.6),
    inset -8px 0 12px rgba(0,0,0,0.4),
    0 0 12px rgba(60, 160, 60, 0.4);
}

/* 開口部（上端）の縁 */
.pipe-rim {
  position: absolute;
  top: -6px;
  left: -4px;
  width: calc(100% + 8px);
  height: 10px;
  background: linear-gradient(90deg,
    #1a4a1a 0%,
    #3a8a3a 50%,
    #1a4a1a 100%);
  border: 2px solid #0a2a0a;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

/* 土管の内側（暗がり） */
.pipe-inner {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 100%;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.9) 0%,
    rgba(0,0,0,0.6) 40%,
    rgba(0,0,0,0.3) 100%);
  pointer-events: none;
}

.pipe-label {
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.5rem;
  color: #aaffaa;
  letter-spacing: 1px;
  font-weight: bold;
  text-shadow: 1px 1px 0 #000;
  white-space: nowrap;
}

.pipe.hit .pipe-body {
  background: linear-gradient(90deg,
    #1a4a1a 0%,
    #4a8a2a 20%,
    #7aca2a 50%,
    #4a8a2a 80%,
    #1a4a1a 100%);
  box-shadow:
    inset 0 0 20px rgba(0,0,0,0.4),
    inset -8px 0 12px rgba(0,0,0,0.3),
    0 0 30px rgba(150, 255, 100, 1);
}

.pipe.hit .pipe-rim {
  background: linear-gradient(90deg,
    #2a7a2a 0%,
    #7aca2a 50%,
    #2a7a2a 100%);
  box-shadow: 0 0 20px rgba(150, 255, 100, 0.9);
}

/* 玉 */
.ball {
  position: absolute;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff, #b0b0b0);
  box-shadow: 0 0 3px rgba(255,255,255,0.5);
  z-index: 15;
  pointer-events: none;
  will-change: transform;
}

/* スロット */
.slot-area {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  gap: 10px;
  z-index: 30;
  align-items: center;
  background: rgba(0,0,0,0.9);
  padding: 20px 24px;
  border: 3px solid #c06020;
  border-radius: 10px;
  box-shadow: 0 0 40px rgba(200, 100, 40, 0.6);
}

.slot-area.active { display: flex; }

.slot-window {
  width: 70px;
  height: 90px;
  background: #0a0a12;
  border: 3px solid #c06020;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}

.slot-reel {
  position: absolute;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.slot-reel.spinning {
  animation: reelSpin 0.1s linear infinite;
}

@keyframes reelSpin {
  0% { transform: translateY(0); }
  100% { transform: translateY(-90px); }
}

.slot-symbol {
  width: 100%;
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffcc80;
  font-family: 'MS PGothic', 'Yu Gothic', serif;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(255, 200, 100, 0.6);
  white-space: nowrap;
}

.slot-symbol.len1 { font-size: 2rem; }
.slot-symbol.len2 { font-size: 1.5rem; letter-spacing: -2px; }
.slot-symbol.len3 { font-size: 1.1rem; letter-spacing: -2px; }

.hit-display {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  z-index: 35;
  background: rgba(0,0,0,0.9);
  border: 3px solid #ffcc80;
  border-radius: 10px;
  padding: 16px 28px;
  text-align: center;
  box-shadow: 0 0 40px rgba(255, 200, 100, 0.8);
  min-width: 280px;
}

.hit-display.active { display: block; }

.hit-display .hit-label {
  font-size: 0.7rem;
  color: #88a;
  letter-spacing: 3px;
  margin-bottom: 6px;
}

.hit-display .hit-term {
  font-size: 1.4rem;
  color: #ffcc80;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 8px;
  text-shadow: 0 0 12px rgba(255, 200, 100, 0.8);
}

.hit-display .hit-desc {
  font-size: 0.8rem;
  color: #ccc;
  line-height: 1.5;
  max-width: 320px;
}

.hit-display .hit-rank {
  font-size: 0.7rem;
  color: #c08080;
  letter-spacing: 2px;
  margin-top: 8px;
}

.panel {
  flex: 1 1 320px;
  background: linear-gradient(180deg, #22222e 0%, #15151f 100%);
  border: 4px solid #8a7a4a;
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 0 0 2px #111, 0 0 20px rgba(0,0,0,0.7);
}

.panel-title {
  text-align: center;
  font-size: 1rem;
  color: #ffcc80;
  letter-spacing: 4px;
  border-bottom: 2px solid #8a7a4a;
  padding-bottom: 6px;
  font-weight: bold;
  text-shadow: 1px 1px 0 #804010;
}

.data-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.data-box {
  background: #0a0a12;
  border: 2px solid #446;
  border-radius: 6px;
  padding: 6px 8px;
  text-align: center;
}

.data-box .label {
  font-size: 0.65rem;
  color: #88a;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 3px;
}

.data-box .value {
  font-size: 1.1rem;
  color: #7ac0e0;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  letter-spacing: 1px;
}

.data-box .value.hit { color: #ffcc80; }
.data-box .value.small { font-size: 0.9rem; }

.term-display {
  background: #0a0a12;
  border: 2px solid #446;
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 60px;
}

.term-display .t-label {
  font-size: 0.6rem;
  color: #88a;
  letter-spacing: 2px;
  margin-bottom: 3px;
}

.term-display .t-term {
  font-size: 1rem;
  color: #ffcc80;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 3px;
}

.term-display .t-desc {
  font-size: 0.72rem;
  color: #b0b0c0;
  line-height: 1.4;
}

.panel-buttons {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.pbtn {
  flex: 1 1 auto;
  background: linear-gradient(180deg, #3a3a4a 0%, #22222e 100%);
  border: 2px solid #8a7a4a;
  color: #ffcc80;
  padding: 6px 8px;
  font-size: 0.75rem;
  cursor: pointer;
  border-radius: 6px;
  letter-spacing: 1px;
  font-family: 'MS PGothic', sans-serif;
  font-weight: bold;
  transition: 0.15s;
  text-align: center;
}

.pbtn:hover {
  background: linear-gradient(180deg, #4a4a5a 0%, #2a2a3a 100%);
  border-color: #a89858;
}

.pbtn:active { transform: translateY(2px); }

.pbtn.danger {
  border-color: #7a4a4a;
  color: #c08080;
}

.spin-area {
  margin-top: auto;
  background: #0a0a12;
  border: 2px solid #446;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}

.spin-label {
  font-size: 0.7rem;
  color: #88a;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.spin-controls {
  display: flex;
  gap: 6px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.spin-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 4px solid #fff;
  background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
  color: #fff;
  font-size: 0.7rem;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 1px;
  font-family: 'MS PGothic', sans-serif;
  box-shadow: 0 4px 0 #601010, 0 0 20px rgba(224, 64, 64, 0.4);
  transition: 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 2px;
}

.spin-btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #601010, 0 0 10px rgba(224, 64, 64, 0.6);
}

.spin-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
  box-shadow: 0 4px 0 #601010;
}

.spin-btn .sub {
  font-size: 0.5rem;
  opacity: 0.8;
}

.auto-area {
  margin-top: 8px;
  display: flex;
  gap: 8px;
  justify-content: center;
}

.auto-btn {
  background: linear-gradient(180deg, #40a040 0%, #207020 100%);
  border: 2px solid #80ff80;
  color: #fff;
  padding: 6px 14px;
  font-size: 0.75rem;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
  letter-spacing: 2px;
  font-family: 'MS PGothic', sans-serif;
  box-shadow: 0 3px 0 #104010;
  transition: 0.1s;
}

.auto-btn:active {
  transform: translateY(3px);
  box-shadow: 0 0 0 #104010;
}

.auto-btn.on {
  background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
  border-color: #ff8080;
  box-shadow: 0 3px 0 #601010;
}

.log {
  background: #0a0a12;
  border: 2px solid #333;
  border-radius: 6px;
  padding: 6px 8px;
  height: 90px;
  overflow-y: auto;
  font-size: 0.68rem;
  font-family: 'Courier New', monospace;
  color: #99a;
  line-height: 1.5;
}

.log .log-line { margin-bottom: 2px; }
.log .log-line.hit { color: #ffcc80; }
.log .log-line.miss { color: #667; }
.log .log-line.event { color: #c0a060; }
.log .log-line.system { color: #7ac0e0; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
  background: #1a1a2a;
  border: 3px solid #8a7a4a;
  border-radius: 10px;
  padding: 24px;
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 0 40px rgba(0,0,0,0.9);
}

.modal h2 {
  color: #ffcc80;
  font-size: 1.2rem;
  letter-spacing: 3px;
  margin-bottom: 14px;
  border-bottom: 2px solid #8a7a4a;
  padding-bottom: 6px;
}

.modal p, .modal li {
  color: #ccc;
  font-size: 0.88rem;
  line-height: 1.7;
}

.modal ul { margin-left: 20px; margin-bottom: 14px; }

.modal .modal-btns {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

.modal .pbtn { min-width: 90px; }

@media (max-width: 760px) {
  .app { flex-direction: column; }
  .board { height: 480px; }
  .spin-btn { width: 55px; height: 55px; font-size: 0.6rem; }
  .slot-window { width: 55px; height: 70px; }
  .slot-symbol { height: 35px; }
  .slot-symbol.len1 { font-size: 1.5rem; }
  .slot-symbol.len2 { font-size: 1.1rem; }
  .slot-symbol.len3 { font-size: 0.85rem; }
}
</style>
</head>
<body>

<div class="app">

<div class="machine">
  <div class="machine-top" id="machineTop">SBI証券パチンコ ～ 土管 ～</div>

  <div class="board" id="board">
    <div class="board-bg"></div>

    <!-- 土管（左右・横から見た筒） -->
    <div class="pipe" id="pipeLeft">
      <div class="pipe-body"></div>
      <div class="pipe-rim"></div>
      <div class="pipe-inner"></div>
      <div class="pipe-label">土管</div>
    </div>
    <div class="pipe" id="pipeRight">
      <div class="pipe-body"></div>
      <div class="pipe-rim"></div>
      <div class="pipe-inner"></div>
      <div class="pipe-label">土管</div>
    </div>

    <div class="slot-area" id="slotArea">
      <div class="slot-window"><div class="slot-reel" id="reel0"></div></div>
      <div class="slot-window"><div class="slot-reel" id="reel1"></div></div>
      <div class="slot-window"><div class="slot-reel" id="reel2"></div></div>
    </div>

    <div class="hit-display" id="hitDisplay">
      <div class="hit-label">当選用語</div>
      <div class="hit-term" id="hitTerm">---</div>
      <div class="hit-desc" id="hitDesc"></div>
      <div class="hit-rank" id="hitRank"></div>
    </div>

    <div id="fxArea" style="position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden;"></div>
    <div id="nailArea" style="position:absolute;inset:0;pointer-events:none;z-index:2;"></div>
    <div id="ballArea" style="position:absolute;inset:0;pointer-events:none;z-index:15;"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">情報パネル</div>

  <div class="data-grid">
    <div class="data-box"><span class="label">回転数</span><span class="value" id="dSpins">0</span></div>
    <div class="data-box"><span class="label">総回転数</span><span class="value" id="dTotalSpins">0</span></div>
    <div class="data-box"><span class="label">現在連荘数</span><span class="value" id="dChain">0</span></div>
    <div class="data-box"><span class="label">総大当たり</span><span class="value hit" id="dTotalHits">0</span></div>
    <div class="data-box"><span class="label">持ち玉</span><span class="value small" id="dBalls">0</span></div>
    <div class="data-box"><span class="label">差玉</span><span class="value small" id="dDiff">0</span></div>
    <div class="data-box"><span class="label">レート</span><span class="value small" id="dRate">4円</span></div>
    <div class="data-box"><span class="label">スロット率</span><span class="value small" id="dSlotRate">1/3</span></div>
  </div>

  <div class="term-display">
    <div class="t-label">当選用語</div>
    <div class="t-term" id="tTerm">---</div>
    <div class="t-desc" id="tDesc">土管の筒の中に入るとスロットが始まります</div>
  </div>

  <div class="panel-buttons">
    <button class="pbtn" onclick="showHowTo()">遊び方</button>
    <button class="pbtn" onclick="showSpec()">スペック</button>
    <button class="pbtn" onclick="showCredit()">クレジット</button>
  </div>

  <div class="spin-area">
    <div class="spin-label">回 転 ｜ LOW / STOP / HIGH</div>
    <div class="spin-controls">
      <button class="spin-btn" id="spinLow" onclick="doSpin('low')">LOW<span class="sub">少なめ</span></button>
      <button class="spin-btn" id="spinStop" onclick="doSpin('stop')">STOP<span class="sub">普通</span></button>
      <button class="spin-btn" id="spinHigh" onclick="doSpin('high')">HIGH<span class="sub">多め</span></button>
    </div>
    <div class="auto-area">
      <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">自動回転 OFF</button>
    </div>
  </div>

  <div class="log" id="logBox">
    <div class="log-line system">▶ SBI証券パチンコへようこそ</div>
    <div class="log-line system">▶ 財布：15万円 ｜ 持ち玉：0</div>
  </div>

  <div class="panel-buttons" style="margin-top:auto;">
    <button class="pbtn" onclick="doSave()">セーブ</button>
    <button class="pbtn danger" onclick="openResetModal()">リセット</button>
  </div>
</div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const SLOT_SYMBOLS = [
  { str: '§ｦ', len: 2, rank: '最強', weight: 3, balls: 3000 },
  { str: '甜', len: 1, rank: '大当たり', weight: 5, balls: 1500 },
  { str: '¡=º', len: 3, rank: '大当たり', weight: 10, balls: 1000 },

  { term: '投信買い', desc: '投資信託を購入すること。少額から分散投資できる。' },
  { term: '現物売り', desc: '保有している株式を売却すること。' },
  { term: '制度信用', desc: '証券取引所のルールに基づく信用取引。返済期限6ヶ月。' },

// 土管の寸法（横から見た筒）
const PIPE_WIDTH = 40;      // 外径（壁含む）
const PIPE_INNER = 20;      // 内径（穴の幅）
const PIPE_HEIGHT = 70;     // 筒の高さ
const BALL_R = 5.5;

function generateNails() {
  nails = [];
  const board = document.getElementById('board');
  const W = board.clientWidth || 620;
  const H = board.clientHeight || 600;

  // 土管の位置
  const pipeLeftX = 90;
  const pipeRightX = W - 90;
  const pipeBottomY = H - 40;
  const pipeTopY = pipeBottomY - PIPE_HEIGHT;

  pipes = [
    {
      x: pipeLeftX,          // 中心X
      topY: pipeTopY,        // 上端Y
      bottomY: pipeBottomY,  // 下端Y
      innerHalf: PIPE_INNER / 2,   // 内径の半分
      outerHalf: PIPE_WIDTH / 2    // 外径の半分
    },
    {
      x: pipeRightX,
      topY: pipeTopY,
      bottomY: pipeBottomY,
      innerHalf: PIPE_INNER / 2,
      outerHalf: PIPE_WIDTH / 2
    }
  ];

  // 土管のDOM配置
  const pl = document.getElementById('pipeLeft');
  pl.style.left = (pipeLeftX - PIPE_WIDTH / 2) + 'px';
  pl.style.top = pipeTopY + 'px';
  pl.style.width = PIPE_WIDTH + 'px';
  pl.style.height = PIPE_HEIGHT + 'px';

  const pr = document.getElementById('pipeRight');
  pr.style.left = (pipeRightX - PIPE_WIDTH / 2) + 'px';
  pr.style.top = pipeTopY + 'px';
  pr.style.width = PIPE_WIDTH + 'px';
  pr.style.height = PIPE_HEIGHT + 'px';

  // ネジ生成（土管の直上と内部を避ける）
  const count = 100 + Math.floor(Math.random() * 40);
  for (let i = 0; i < count; i++) {
    const x = 30 + Math.random() * (W - 60);
    const y = 60 + Math.random() * (H - 200);

    let skip = false;
    for (const p of pipes) {
      // 土管の真上（開口部に落ちるルート）を避ける
      if (Math.abs(x - p.x) < p.outerHalf + 15 && y > p.topY - 180 && y < p.topY) {
        skip = true; break;
      }
      // 土管の内部を避ける
      if (Math.abs(x - p.x) < p.outerHalf + 8 && y >= p.topY && y <= p.bottomY) {
        skip = true; break;
      }
    }
    if (skip) continue;

    nails.push({ x, y, r: 3 });
  }

  const area = document.getElementById('nailArea');
  area.innerHTML = '';
  nails.forEach(n => {
    const el = document.createElement('div');
    el.className = 'nail';
    el.style.left = (n.x - 3) + 'px';
    el.style.top = (n.y - 3) + 'px';
    area.appendChild(el);
  });
}

// ===== 玉の物理シミュレーション（横から見た土管の縁・側面判定） =====
function simulateBall(startX, startY, vx0, vy0) {
  return new Promise(resolve => {
    const board = document.getElementById('board');
    const W = board.clientWidth || 620;
    const H = board.clientHeight || 600;

    let x = startX;
    let y = startY;
    let vx = vx0;
    let vy = vy0;

    const ball = document.createElement('div');
    ball.className = 'ball';
    ball.style.left = x + 'px';
    ball.style.top = y + 'px';
    document.getElementById('ballArea').appendChild(ball);

    let steps = 0;
    const maxSteps = 800;

    function step() {
      steps++;
      vy += 0.32;
      vx *= 0.992;
      vy *= 0.995;

      x += vx;
      y += vy;

      // 盤面の壁
      if (x < 12) { x = 12; vx = Math.abs(vx) * 0.4; }
      if (x > W - 12) { x = W - 12; vx = -Math.abs(vx) * 0.5; }
      if (y < 12) { y = 12; vy = Math.abs(vy) * 0.4; }

      // ネジ衝突
      for (const n of nails) {
        const dx = x - n.x;
        const dy = y - n.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 8 && dist > 0.01) {
          const nx = dx / dist;
          const ny = dy / dist;
          const dot = vx * nx + vy * ny;
          vx -= 1.8 * dot * nx;
          vy -= 1.8 * dot * ny;
          vx *= 0.75;
          vy *= 0.75;
          x = n.x + nx * 8;
          y = n.y + ny * 8;
        }
      }

      // 土管判定（横から見た筒）
      for (let pi = 0; pi < pipes.length; pi++) {
        const p = pipes[pi];
        const relX = x - p.x;   // 中心からの相対X

        // 上端より下にいる場合のみ土管の影響を受ける
        if (y > p.topY) {
          // 開口部の内側（穴の中）にいる場合
          if (Math.abs(relX) < p.innerHalf - BALL_R * 0.3) {
            // 筒の中に落ちた → 入賞
            ball.style.background = 'radial-gradient(circle at 35% 35%, #aaffaa, #2a7a2a)';
            ball.style.boxShadow = '0 0 20px #80ff80';
            const pipeEl = document.getElementById(pi === 0 ? 'pipeLeft' : 'pipeRight');
            pipeEl.classList.add('hit');
            setTimeout(() => pipeEl.classList.remove('hit'), 800);
            setTimeout(() => {
              ball.style.opacity = '0';
              setTimeout(() => ball.remove(), 200);
            }, 150);
            resolve('pipe');
            return;
          }

          // 開口部の縁（上端付近）に当たった場合
          if (y < p.topY + 12 && Math.abs(relX) < p.outerHalf + BALL_R) {
            const side = relX > 0 ? 1 : -1;
            // 上に跳ね返す
            vy = -Math.abs(vy) * 0.6;
            vx = side * Math.abs(vx) * 0.5 + side * 0.5;
            x = p.x + side * (p.outerHalf + BALL_R);
            y = p.topY - BALL_R;
          }
          // 筒の側面（左右の壁）に当たった場合
          else if (y >= p.topY + 12 && y <= p.bottomY) {
            if (Math.abs(relX) > p.innerHalf - BALL_R * 0.3 && Math.abs(relX) < p.outerHalf + BALL_R) {
              const side = relX > 0 ? 1 : -1;
              // 横に跳ね返す
              vx = side * Math.abs(vx) * 0.6;
              x = p.x + side * (p.outerHalf + BALL_R);
            }
          }
        }
      }

      // 底
      if (y > H - 8) {
        ball.style.opacity = '0';
        setTimeout(() => ball.remove(), 200);
        resolve('out');
        return;
      }

      ball.style.left = x + 'px';
      ball.style.top = y + 'px';

      if (steps < maxSteps) {
        requestAnimationFrame(step);
      } else {
        ball.remove();
        resolve('out');
      }
    }

    requestAnimationFrame(step);
  });
}

async function doSpin(intensity) {
  if (spinning) return;

  const cost = spec.ballCost;
  if (state.balls < cost) {
    addLog(`⚠️ 持ち玉が足りません（${cost}玉必要）`, 'system');
    if (autoMode) toggleAuto();
    return;
  }

  spinning = true;
  document.getElementById('spinLow').disabled = true;
  document.getElementById('spinStop').disabled = true;
  document.getElementById('spinHigh').disabled = true;

  state.balls -= cost;
  state.spins++;
  state.totalSpins++;
  render();

  addLog(`🎯 ${state.spins}回転目…（${intensity.toUpperCase()}）`, 'system');

  const ballCount = intensity === 'low' ? 5 : intensity === 'stop' ? 15 : 30;
  const board = document.getElementById('board');
  const W = board.clientWidth || 620;

  const promises = [];
  for (let i = 0; i < ballCount; i++) {
    const lane = 1 + Math.floor(Math.random() * 15);
    const startX = 20 + (lane - 1) * ((W - 40) / 14);
    const startY = 20;
    const vx0 = (Math.random() - 0.5) * 1.5;
    const vy0 = 1 + Math.random() * 1.5;
    const delay = i * 60;
    promises.push(
      new Promise(r => setTimeout(r, delay)).then(() => simulateBall(startX, startY, vx0, vy0))
    );
  }

  const results = await Promise.all(promises);
  let pipeCount = 0;
  results.forEach(r => { if (r === 'pipe') pipeCount++; });

  if (pipeCount > 0) {
    addLog(`🟢 土管入賞！ ${pipeCount}個`, 'event');
    const term = TERMS_ATARI[Math.floor(Math.random() * TERMS_ATARI.length)];
    state.zukan[term.term] = (state.zukan[term.term] || 0) + 1;
    document.getElementById('tTerm').textContent = term.term;
    document.getElementById('tDesc').textContent = term.desc;
    addLog(`📖 当たり用語：【${term.term}】${term.desc}`, 'hit');

    if (!slotActive) {
      startSlot();
    } else {
      addLog('⏳ スロット中。予約はされません', 'system');
    }
  } else {
    addLog(`…ハズレ`, 'miss');
  }

  spinning = false;
  document.getElementById('spinLow').disabled = false;
  document.getElementById('spinStop').disabled = false;
  document.getElementById('spinHigh').disabled = false;
  render();
  doSave();
}

function buildReel(reel) {
  reel.innerHTML = '';
  const symbols = [...SLOT_SYMBOLS, ...SLOT_SYMBOLS, ...SLOT_SYMBOLS];
  symbols.forEach(sym => {
    const s = document.createElement('div');
    s.className = 'slot-symbol len' + sym.len;
    s.textContent = sym.str;
    reel.appendChild(s);
  });
}

function initSlotReels() {
  for (let i = 0; i < 3; i++) {
    buildReel(document.getElementById('reel' + i));
  }
}

function startSlot() {
  if (slotActive) return;
  slotActive = true;
  const area = document.getElementById('slotArea');
  area.classList.add('active');

  for (let i = 0; i < 3; i++) {
    const reel = document.getElementById('reel' + i);
    reel.classList.add('spinning');
  }

  setTimeout(() => {
    const slotHit = Math.random() < spec.slotRate;

    if (slotHit) {
      const weights = SLOT_SYMBOLS.map(s => s.weight);
      const total = weights.reduce((a,b) => a+b, 0);
      let rand = Math.random() * total;
      let chosenIndex = 0;
      for (let i = 0; i < weights.length; i++) {
        rand -= weights[i];
        if (rand <= 0) { chosenIndex = i; break; }
      }
      const chosen = SLOT_SYMBOLS[chosenIndex];

      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const reel = document.getElementById('reel' + i);
          reel.classList.remove('spinning');
          reel.innerHTML = '';
          const s = document.createElement('div');
          s.className = 'slot-symbol len' + chosen.len;
          s.textContent = chosen.str;
          reel.appendChild(s);
        }, i * 300);
      }

      setTimeout(() => {
        document.getElementById('slotArea').classList.remove('active');
        slotActive = false;

        state.totalHits++;
        state.chain++;
        state.balls += chosen.balls;

        const term = TERMS_DAIATARI[Math.floor(Math.random() * TERMS_DAIATARI.length)];
        state.zukan[term.term] = (state.zukan[term.term] || 0) + 1;

        document.getElementById('tTerm').textContent = term.term;
        document.getElementById('tDesc').textContent = term.desc;

        const hitDisplay = document.getElementById('hitDisplay');
        document.getElementById('hitTerm').textContent = term.term;
        document.getElementById('hitDesc').textContent = term.desc;
        document.getElementById('hitRank').textContent = `図柄：${chosen.str}（${chosen.rank}） ｜ +${chosen.balls}玉`;
        hitDisplay.classList.add('active');

        addLog(`🎉 大当たり！【${term.term}】${term.desc}`, 'hit');
        addLog(`💰 +${chosen.balls}玉 獲得！ 連荘：${state.chain} ｜ 図柄：${chosen.str}`, 'hit');

        if (Math.random() < 0.3) {
          state.stateMode = '確変';
          state.stateDesc = '大当たり確率アップ';
          addLog(`⭐ 状態変化：確変`, 'event');
        } else if (Math.random() < 0.5) {
          state.stateMode = '時短';
          state.stateDesc = '回転数アップ';
          addLog(`⭐ 状態変化：時短`, 'event');
        }

        setTimeout(() => {
          hitDisplay.classList.remove('active');
        }, 3500);

        render();
        doSave();
      }, 3 * 300 + 500);
    } else {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const reel = document.getElementById('reel' + i);
          reel.classList.remove('spinning');
          reel.innerHTML = '';
          const randomSym = SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)];
          const s = document.createElement('div');
          s.className = 'slot-symbol len' + randomSym.len;
          s.textContent = randomSym.str;
          reel.appendChild(s);
        }, i * 300);
      }

      setTimeout(() => {
        document.getElementById('slotArea').classList.remove('active');
        slotActive = false;
        addLog('…スロットハズレ', 'miss');
        state.chain = 0;
        render();
        doSave();
      }, 3 * 300 + 500);
    }
  }, 1500);
}

function doDeposit(amount) {
  if (state.wallet < amount) {
    addLog('⚠️ 財布の残高が足りません', 'system');
    return;
  }
  state.wallet -= amount;
  const balls = Math.floor(amount / spec.type.rate);
  state.balls += balls;
  addLog(`💰 ${amount.toLocaleString()}円入金 → ${balls}玉 獲得（${spec.type.rate}円/玉）`, 'system');
  render();
  closeModal();
  doSave();
}
