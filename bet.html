<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI証券パチンコ ｜ 本格物理版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a1a;
  font-family: 'MS PGothic', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif;
  color: #eee;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 10px;
  overflow-x: hidden;
}

.app {
  max-width: 1100px;
  width: 100%;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.machine {
  flex: 1 1 620px;
  background: linear-gradient(180deg, #2a2a3a 0%, #1a1a2a 100%);
  border: 4px solid #8a7a4a;
  border-radius: 10px;
  padding: 10px;
  position: relative;
  box-shadow: 0 0 0 2px #111, 0 0 20px rgba(0,0,0,0.7);
}

.machine-top {
  background: linear-gradient(90deg, #c06020 0%, #e08030 50%, #c06020 100%);
  border: 2px solid #ffcc80;
  border-radius: 6px;
  padding: 6px 12px;
  text-align: center;
  font-size: 0.85rem;
  color: #fff;
  letter-spacing: 3px;
  font-weight: bold;
  text-shadow: 1px 1px 0 #804010;
  margin-bottom: 8px;
}

.board {
  background: #0a0a12;
  border: 3px solid #444;
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  height: 600px;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
}

.board-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(60,60,100,0.3) 0%, transparent 60%),
    #0a0a12;
}

/* 発射レール（左端） */
.rail {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 18px;
  background: linear-gradient(90deg, #222, #333, #222);
  border-right: 2px solid #555;
  z-index: 2;
}

/* ステージ（土管みたいな場所） */
.stage-area {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 70px;
  z-index: 4;
  pointer-events: none;
}

.stage-shape {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #1a1a2a 0%, #252540 100%);
  border: 2px solid #556;
  border-radius: 0 0 40px 40px;
  position: relative;
  overflow: hidden;
}

.stage-shape::after {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 100%;
  background: linear-gradient(180deg, transparent, rgba(100,150,255,0.15));
}

/* ヘソ（始動口） */
.heso {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 24px;
  border: 3px solid #c06020;
  border-radius: 12px;
  background: #1a0a0a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  color: #ffcc80;
  letter-spacing: 1px;
  z-index: 8;
  transition: 0.2s;
  box-shadow: 0 0 10px rgba(200, 100, 40, 0.5);
}

.heso.hit {
  background: #3a1a0a;
  border-color: #ffcc80;
  box-shadow: 0 0 20px rgba(255, 200, 100, 0.8);
}

/* 電チュー（電動チューリップ） */
.denchu {
  position: absolute;
  bottom: 140px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  height: 18px;
  border: 2px solid #c06020;
  border-radius: 9px;
  background: #1a1a28;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.5rem;
  color: #ffcc80;
  letter-spacing: 1px;
  z-index: 7;
}

/* アタッカー（大当たり時に開く） */
.attacker {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 70px;
  height: 50px;
  border: 3px solid #666;
  border-radius: 6px;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  color: #666;
  letter-spacing: 1px;
  z-index: 8;
  transition: 0.3s;
}

.attacker.open {
  border-color: #ffcc80;
  background: #3a2a10;
  color: #ffcc80;
  box-shadow: 0 0 20px rgba(255, 200, 100, 0.6);
}

/* デジタル */
.digital {
  position: absolute;
  top: 140px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier New', monospace;
  font-size: 1.6rem;
  color: #7ac0e0;
  background: #0a0a12;
  border: 2px solid #446;
  padding: 5px 18px;
  border-radius: 4px;
  letter-spacing: 4px;
  text-align: center;
  z-index: 9;
  min-width: 100px;
  transition: 0.3s;
}

.digital.hit {
  color: #ffcc80;
  border-color: #8a7a4a;
}

/* スロット演出 */
.slot-area {
  position: absolute;
  top: 200px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 6px;
  z-index: 20;
  align-items: center;
}

.slot-area.active {
  display: flex;
}

.slot-window {
  width: 50px;
  height: 68px;
  background: #0a0a12;
  border: 3px solid #c06020;
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}

.slot-reel {
  position: absolute;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.slot-reel.spinning {
  animation: reelSpin 0.12s linear infinite;
}

@keyframes reelSpin {
  0% { transform: translateY(0); }
  100% { transform: translateY(-68px); }
}

.dot-symbol {
  width: 34px;
  height: 34px;
  margin: 3px 0;
  position: relative;
  image-rendering: pixelated;
}

.dot-symbol.s7::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(#c06020, #c06020) 6px 3px / 20px 5px no-repeat,
    linear-gradient(#c06020, #c06020) 13px 8px / 7px 7px no-repeat,
    linear-gradient(#c06020, #c06020) 10px 15px / 14px 5px no-repeat,
    linear-gradient(#c06020, #c06020) 6px 20px / 20px 5px no-repeat;
}

.dot-symbol.sbar::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(#e08030, #e08030) 5px 5px / 24px 5px no-repeat,
    linear-gradient(#e08030, #e08030) 5px 13px / 24px 5px no-repeat,
    linear-gradient(#e08030, #e08030) 5px 21px / 24px 5px no-repeat;
}

.dot-symbol.scherry::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 10px 13px, #e04040 5px, transparent 6px),
    radial-gradient(circle at 24px 13px, #e04040 5px, transparent 6px),
    linear-gradient(#40a040, #40a040) 15px 5px / 4px 10px no-repeat;
}

.dot-symbol.sbell::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 17px 10px, #ffcc80 7px, transparent 8px),
    linear-gradient(#ffcc80, #ffcc80) 15px 17px / 4px 9px no-repeat,
    linear-gradient(#ffcc80, #ffcc80) 10px 26px / 14px 4px no-repeat;
}

.dot-symbol.ssuika::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 17px 17px, #40a040 10px, transparent 11px),
    radial-gradient(circle at 13px 13px, #e04040 2px, transparent 3px),
    radial-gradient(circle at 21px 17px, #e04040 2px, transparent 3px),
    radial-gradient(circle at 17px 23px, #e04040 2px, transparent 3px);
}

.dot-symbol.sreplay::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(#7ac0e0, #7ac0e0) 7px 7px / 20px 4px no-repeat,
    linear-gradient(#7ac0e0, #7ac0e0) 7px 23px / 20px 4px no-repeat,
    linear-gradient(#7ac0e0, #7ac0e0) 7px 7px / 4px 20px no-repeat,
    linear-gradient(#7ac0e0, #7ac0e0) 23px 7px / 4px 20px no-repeat;
}

.slot-push-btn {
  display: none;
  background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
  border: 3px solid #fff;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  color: #fff;
  font-size: 0.6rem;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 4px 0 #601010;
  animation: pulse 0.8s ease infinite;
  margin-left: 6px;
}

.slot-push-btn.active {
  display: flex;
  align-items: center;
  justify-content: center;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* 玉 */
.ball {
  position: absolute;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff, #b0b0b0);
  box-shadow: 0 0 3px rgba(255,255,255,0.5);
  z-index: 15;
  pointer-events: none;
  will-change: transform;
}

/* 釘 */
.nail {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ddd, #666);
  z-index: 1;
  box-shadow: 0 0 2px rgba(200,200,200,0.4);
}

/* 右パネル */
.panel {
  flex: 1 1 320px;
  background: linear-gradient(180deg, #22222e 0%, #15151f 100%);
  border: 4px solid #8a7a4a;
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 0 0 2px #111, 0 0 20px rgba(0,0,0,0.7);
}

.panel-title {
  text-align: center;
  font-size: 1rem;
  color: #ffcc80;
  letter-spacing: 4px;
  border-bottom: 2px solid #8a7a4a;
  padding-bottom: 6px;
  font-weight: bold;
  text-shadow: 1px 1px 0 #804010;
}

.data-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.data-box {
  background: #0a0a12;
  border: 2px solid #446;
  border-radius: 6px;
  padding: 6px 8px;
  text-align: center;
}

.data-box .label {
  font-size: 0.65rem;
  color: #88a;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 3px;
}

.data-box .value {
  font-size: 1.1rem;
  color: #7ac0e0;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  letter-spacing: 1px;
}

.data-box .value.hit { color: #ffcc80; }
.data-box .value.small { font-size: 0.9rem; }

.term-display {
  background: #0a0a12;
  border: 2px solid #446;
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 60px;
}

.term-display .t-label {
  font-size: 0.6rem;
  color: #88a;
  letter-spacing: 2px;
  margin-bottom: 3px;
}

.term-display .t-term {
  font-size: 1rem;
  color: #ffcc80;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 3px;
}

.term-display .t-desc {
  font-size: 0.72rem;
  color: #b0b0c0;
  line-height: 1.4;
}

.panel-buttons {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.pbtn {
  flex: 1 1 auto;
  background: linear-gradient(180deg, #3a3a4a 0%, #22222e 100%);
  border: 2px solid #8a7a4a;
  color: #ffcc80;
  padding: 6px 8px;
  font-size: 0.75rem;
  cursor: pointer;
  border-radius: 6px;
  letter-spacing: 1px;
  font-family: 'MS PGothic', sans-serif;
  font-weight: bold;
  transition: 0.15s;
  text-align: center;
}

.pbtn:hover {
  background: linear-gradient(180deg, #4a4a5a 0%, #2a2a3a 100%);
  border-color: #a89858;
}

.pbtn:active { transform: translateY(2px); }

.pbtn.danger {
  border-color: #7a4a4a;
  color: #c08080;
}

.spin-area {
  margin-top: auto;
  background: #0a0a12;
  border: 2px solid #446;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}

.spin-label {
  font-size: 0.7rem;
  color: #88a;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.spin-controls {
  display: flex;
  gap: 6px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.spin-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 4px solid #fff;
  background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
  color: #fff;
  font-size: 0.7rem;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 1px;
  font-family: 'MS PGothic', sans-serif;
  box-shadow: 0 4px 0 #601010, 0 0 20px rgba(224, 64, 64, 0.4);
  transition: 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 2px;
}

.spin-btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #601010, 0 0 10px rgba(224, 64, 64, 0.6);
}

.spin-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
  box-shadow: 0 4px 0 #601010;
}

.spin-btn .sub {
  font-size: 0.5rem;
  opacity: 0.8;
}

.auto-area {
  margin-top: 8px;
  display: flex;
  gap: 8px;
  justify-content: center;
}

.auto-btn {
  background: linear-gradient(180deg, #40a040 0%, #207020 100%);
  border: 2px solid #80ff80;
  color: #fff;
  padding: 6px 14px;
  font-size: 0.75rem;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
  letter-spacing: 2px;
  font-family: 'MS PGothic', sans-serif;
  box-shadow: 0 3px 0 #104010;
  transition: 0.1s;
}

.auto-btn:active {
  transform: translateY(3px);
  box-shadow: 0 0 0 #104010;
}

.auto-btn.on {
  background: linear-gradient(180deg, #e04040 0%, #a02020 100%);
  border-color: #ff8080;
  box-shadow: 0 3px 0 #601010;
}

.log {
  background: #0a0a12;
  border: 2px solid #333;
  border-radius: 6px;
  padding: 6px 8px;
  height: 80px;
  overflow-y: auto;
  font-size: 0.68rem;
  font-family: 'Courier New', monospace;
  color: #99a;
  line-height: 1.5;
}

.log .log-line { margin-bottom: 2px; }
.log .log-line.hit { color: #ffcc80; }
.log .log-line.miss { color: #667; }
.log .log-line.event { color: #c0a060; }
.log .log-line.system { color: #7ac0e0; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
  background: #1a1a2a;
  border: 3px solid #8a7a4a;
  border-radius: 10px;
  padding: 24px;
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 0 40px rgba(0,0,0,0.9);
}

.modal h2 {
  color: #ffcc80;
  font-size: 1.2rem;
  letter-spacing: 3px;
  margin-bottom: 14px;
  border-bottom: 2px solid #8a7a4a;
  padding-bottom: 6px;
}

.modal p, .modal li {
  color: #ccc;
  font-size: 0.88rem;
  line-height: 1.7;
}

.modal ul { margin-left: 20px; margin-bottom: 14px; }

.modal .modal-btns {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

.modal .pbtn { min-width: 90px; }

@media (max-width: 760px) {
  .app { flex-direction: column; }
  .board { height: 480px; }
  .digital { font-size: 1.2rem; }
  .spin-btn { width: 55px; height: 55px; font-size: 0.6rem; }
}
</style>
</head>
<body>

<div class="app">

<div class="machine">
  <div class="machine-top" id="machineTop">SBI証券パチンコ ～ 本格物理版 ～</div>

  <div class="board" id="board">
    <div class="board-bg"></div>
    <div class="rail"></div>

    <div class="stage-area">
      <div class="stage-shape"></div>
    </div>

    <div class="denchu" id="denchu">電チュー</div>
    <div class="heso" id="heso">ヘソ</div>
    <div class="attacker" id="attacker">アタッカー</div>
    <div class="digital" id="digital">---</div>

    <div class="slot-area" id="slotArea">
      <div class="slot-window"><div class="slot-reel" id="reel0"></div></div>
      <div class="slot-window"><div class="slot-reel" id="reel1"></div></div>
      <div class="slot-window"><div class="slot-reel" id="reel2"></div></div>
      <button class="slot-push-btn" id="slotPushBtn" onclick="slotPush()">押せ！</button>
    </div>

    <div id="fxArea" style="position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden;"></div>
    <div id="nailArea" style="position:absolute;inset:0;pointer-events:none;z-index:1;"></div>
    <div id="ballArea" style="position:absolute;inset:0;pointer-events:none;z-index:15;"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">情報パネル</div>

  <div class="data-grid">
    <div class="data-box"><span class="label">回転数</span><span class="value" id="dSpins">0</span></div>
    <div class="data-box"><span class="label">総回転数</span><span class="value" id="dTotalSpins">0</span></div>
    <div class="data-box"><span class="label">現在連荘数</span><span class="value" id="dChain">0</span></div>
    <div class="data-box"><span class="label">総大当たり</span><span class="value hit" id="dTotalHits">0</span></div>
    <div class="data-box"><span class="label">持ち玉</span><span class="value small" id="dBalls">0</span></div>
    <div class="data-box"><span class="label">差玉</span><span class="value small" id="dDiff">0</span></div>
    <div class="data-box"><span class="label">レート</span><span class="value small" id="dRate">4円</span></div>
    <div class="data-box"><span class="label">交換率</span><span class="value small" id="dExchange">等価</span></div>
  </div>

  <div class="term-display">
    <div class="t-label">当選用語</div>
    <div class="t-term" id="tTerm">---</div>
    <div class="t-desc" id="tDesc">大当たりで用語を引くと解説が表示されます</div>
  </div>

  <div class="panel-buttons">
    <button class="pbtn" onclick="showHowTo()">遊び方</button>
    <button class="pbtn" onclick="showSpec()">スペック</button>
    <button class="pbtn" onclick="showCredit()">クレジット</button>
  </div>

  <div class="spin-area">
    <div class="spin-label">回 転 ｜ LOW / STOP / HIGH</div>
    <div class="spin-controls">
      <button class="spin-btn" id="spinLow" onclick="doSpin('low')">LOW<span class="sub">少なめ</span></button>
      <button class="spin-btn" id="spinStop" onclick="doSpin('stop')">STOP<span class="sub">普通</span></button>
      <button class="spin-btn" id="spinHigh" onclick="doSpin('high')">HIGH<span class="sub">多め</span></button>
    </div>
    <div class="auto-area">
      <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">自動回転 OFF</button>
    </div>
  </div>

  <div class="log" id="logBox">
    <div class="log-line system">▶ SBI証券パチンコへようこそ</div>
    <div class="log-line system">▶ 財布：15万円 ｜ 持ち玉：0</div>
  </div>

  <div class="panel-buttons" style="margin-top:auto;">
    <button class="pbtn" onclick="doSave()">セーブ</button>
    <button class="pbtn danger" onclick="openResetModal()">リセット</button>
  </div>
</div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ===== 用語データ（主要どころ・抜粋） =====
const TERMS = [
  { term: '債券', desc: '国や企業が発行する借用証書。満期まで持つと利息がもらえる。' },
  { term: 'ファンダメンタルズ', desc: '企業の業績・財務など本質的価値。長期投資の判断材料。' },
  { term: '配当', desc: '企業が利益の一部を株主に分配するお金。' },
  { term: '保護預り', desc: '証券会社が顧客資産を保管。倒産しても資産は守られる。' },
  { term: '米国株', desc: 'アメリカの証券取引所に上場する株式。Apple、Amazonなど。' },
  { term: '中国株', desc: '中国本土や香港に上場する株式。規制リスクに注意。' },

let nails = [];

function generateNails() {
  nails = [];
  const board = document.getElementById('board');
  const W = board.clientWidth || 620;
  const H = board.clientHeight || 600;

  const hesoX = W / 2;
  const hesoY = H - 100;

  // ヘソ周辺の誘導釘（重要）
  for (let i = -3; i <= 3; i++) {
    if (i === 0) continue;
    nails.push({ x: hesoX + i * 25, y: hesoY - 30, r: 3 });
  }
  nails.push({ x: hesoX - 35, y: hesoY - 10, r: 3 });
  nails.push({ x: hesoX + 35, y: hesoY - 10, r: 3 });

  // ステージ下の誘導釘
  nails.push({ x: hesoX - 70, y: hesoY - 90, r: 3 });
  nails.push({ x: hesoX + 70, y: hesoY - 90, r: 3 });
  nails.push({ x: hesoX - 50, y: hesoY - 120, r: 3 });
  nails.push({ x: hesoX + 50, y: hesoY - 120, r: 3 });

  // 盤面全体にランダム配置（100本以上）
  const count = 100 + Math.floor(Math.random() * 40);
  for (let i = 0; i < count; i++) {
    const x = 30 + Math.random() * (W - 60);
    const y = 80 + Math.random() * (H - 200);
    // ヘソとステージの直撃を避ける
    if (Math.abs(x - hesoX) < 45 && Math.abs(y - hesoY) < 60) continue;
    if (Math.abs(x - hesoX) < 100 && y < 160) continue;
    nails.push({ x, y, r: 3 });
  }

  const area = document.getElementById('nailArea');
  area.innerHTML = '';
  nails.forEach(n => {
    const el = document.createElement('div');
    el.className = 'nail';
    el.style.left = (n.x - 2) + 'px';
    el.style.top = (n.y - 2) + 'px';
    area.appendChild(el);
  });
}

// ===== 玉の物理シミュレーション（複数同時） =====
function simulateBall(startX, startY, vx0, vy0) {
  return new Promise(resolve => {
    const board = document.getElementById('board');
    const W = board.clientWidth || 620;
    const H = board.clientHeight || 600;

    let x = startX;
    let y = startY;
    let vx = vx0;
    let vy = vy0;

    const ball = document.createElement('div');
    ball.className = 'ball';
    ball.style.left = x + 'px';
    ball.style.top = y + 'px';
    document.getElementById('ballArea').appendChild(ball);

    const hesoX = W / 2;
    const hesoY = H - 100;
    const attackerX = W - 75;
    const attackerY = H - 65;

    let steps = 0;
    const maxSteps = 500;

    function step() {
      steps++;
      // 重力
      vy += 0.3;

      // 空気抵抗
      vx *= 0.992;
      vy *= 0.995;

      // 移動
      x += vx;
      y += vy;

      // 左のレール（発射レール）
      if (x < 22) {
        x = 22;
        vx = Math.abs(vx) * 0.4;
      }

      // 右壁
      if (x > W - 12) {
        x = W - 12;
        vx = -Math.abs(vx) * 0.5;
      }

      // 天井
      if (y < 12) {
        y = 12;
        vy = Math.abs(vy) * 0.4;
      }

      // 釘との衝突
      for (const n of nails) {
        const dx = x - n.x;
        const dy = y - n.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 8 && dist > 0.01) {
          const nx = dx / dist;
          const ny = dy / dist;
          const dot = vx * nx + vy * ny;
          vx -= 1.8 * dot * nx;
          vy -= 1.8 * dot * ny;
          vx *= 0.75;
          vy *= 0.75;
          x = n.x + nx * 8;
          y = n.y + ny * 8;
        }
      }

      // ステージ判定
      if (y > 60 && y < 130 && x > W/2 - 90 && x < W/2 + 90) {
        vx += (hesoX - x) * 0.003;
      }

      // ヘソ判定（始動口）
      if (Math.abs(x - hesoX) < 25 && Math.abs(y - hesoY) < 12) {
        ball.style.background = 'radial-gradient(circle at 35% 35%, #ffcc80, #c06020)';
        ball.style.boxShadow = '0 0 12px #ffcc80';
        setTimeout(() => {
          ball.style.opacity = '0';
          setTimeout(() => ball.remove(), 200);
        }, 100);
        resolve('heso');
        return;
      }

      // アタッカー判定（大当たり中のみ）
      if (attackerOpen && Math.abs(x - attackerX) < 35 && Math.abs(y - attackerY) < 25) {
        ball.style.background = 'radial-gradient(circle at 35% 35%, #80ff80, #20a020)';
        setTimeout(() => {
          ball.style.opacity = '0';
          setTimeout(() => ball.remove(), 200);
        }, 100);
        resolve('attacker');
        return;
      }

      // 底に落ちた
      if (y > H - 8) {
        ball.style.opacity = '0';
        setTimeout(() => ball.remove(), 200);
        resolve('out');
        return;
      }

      ball.style.left = x + 'px';
      ball.style.top = y + 'px';

      if (steps < maxSteps) {
        requestAnimationFrame(step);
      } else {
        ball.remove();
        resolve('out');
      }
    }

    requestAnimationFrame(step);
  });
}

async function doSpin(intensity) {
  if (spinning) return;

  const cost = spec.ballCost;
  if (state.balls < cost) {
    addLog(`⚠️ 持ち玉が足りません（${cost}玉必要）`, 'system');
    if (autoMode) toggleAuto();
    return;
  }

  spinning = true;
  document.getElementById('spinLow').disabled = true;
  document.getElementById('spinStop').disabled = true;
  document.getElementById('spinHigh').disabled = true;

  state.balls -= cost;
  state.spins++;
  state.totalSpins++;
  render();

  addLog(`🎯 ${state.spins}回転目…（${intensity.toUpperCase()}）`, 'system');

  startSlot();

  // 玉を複数発射（強度で数が変わる）
  const ballCount = intensity === 'low' ? 5 : intensity === 'stop' ? 15 : 30;
  let hesoCount = 0;
  let attackerCount = 0;

  // 同時に発射
  const promises = [];
  for (let i = 0; i < ballCount; i++) {
    const delay = i * 50;
    const startX = 15 + Math.random() * 5;
    const startY = H_BOARD() - 20;
    const vx0 = 2 + Math.random() * 1.5;
    const vy0 = -7 - Math.random() * 2;
    promises.push(
      new Promise(r => setTimeout(r, delay)).then(() => simulateBall(startX, startY, vx0, vy0))
    );
  }

  function H_BOARD() {
    const board = document.getElementById('board');
    return board.clientHeight || 600;
  }

  const results = await Promise.all(promises);
  results.forEach(r => {
    if (r === 'heso') hesoCount++;
    if (r === 'attacker') attackerCount++;
  });

  // ヘソに入った玉の数で当たり判定
  let hitRate = spec.hitRate;
  if (state.stateMode === '確変') hitRate *= 3;
  if (state.stateMode === '時短') hitRate *= 1.5;

  const mult = intensity === 'low' ? spec.lowMult : intensity === 'stop' ? spec.stopMult : spec.highMult;
  // ヘソ入賞数 × 確率 + 乱数
  const hesoHit = hesoCount > 0 && Math.random() < (hitRate * mult * hesoCount * 2);
  const randomHit = Math.random() < hitRate * mult;
  const hit = hesoHit || randomHit;

  stopSlot(hit);

  if (hit) {
    state.totalHits++;
    state.chain++;
    state.balls += spec.ballsPerHit;
    const term = TERMS[Math.floor(Math.random() * TERMS.length)];
    state.zukan[term.term] = (state.zukan[term.term] || 0) + 1;

    if (Math.random() < 0.3) {
      state.stateMode = '確変';
      state.stateDesc = '大当たり確率アップ';
    } else if (Math.random() < 0.5) {
      state.stateMode = '時短';
      state.stateDesc = '回転数アップ';
    }

    document.getElementById('tTerm').textContent = term.term;
    document.getElementById('tDesc').textContent = term.desc;

    addLog(`🎉 大当たり！【${term.term}】${term.desc}`, 'hit');
    addLog(`💰 +${spec.ballsPerHit}玉 獲得！ 連荘：${state.chain}`, 'hit');
    addLog(`📊 ヘソ入賞：${hesoCount}個`, 'event');

    if (state.stateMode !== '通常') {
      addLog(`⭐ 状態変化：${state.stateMode}`, 'event');
    }

    playHitFX();
  } else {
    addLog(`…ハズレ（ヘソ入賞：${hesoCount}個）`, 'miss');
    if (state.stateMode !== '通常') {
      state.stateMode = '通常';
      state.stateDesc = '確率変動なし';
    }
    state.chain = 0;
  }

  spinning = false;
  document.getElementById('spinLow').disabled = false;
  document.getElementById('spinStop').disabled = false;
  document.getElementById('spinHigh').disabled = false;
  render();
  doSave();
}

const SYMBOL_CLASSES = ['s7', 'sbar', 'scherry', 'sbell', 'ssuika', 'sreplay'];

function initSlotReels() {
  for (let i = 0; i < 3; i++) {
    const reel = document.getElementById('reel' + i);
    reel.innerHTML = '';
    const classes = [...SYMBOL_CLASSES, ...SYMBOL_CLASSES, ...SYMBOL_CLASSES];
    classes.forEach(cls => {
      const s = document.createElement('div');
      s.className = 'dot-symbol ' + cls;
      reel.appendChild(s);
    });
  }
}

function startSlot() {
  if (slotActive) return;
  slotActive = true;
  const area = document.getElementById('slotArea');
  area.classList.add('active');
  for (let i = 0; i < 3; i++) {
    const reel = document.getElementById('reel' + i);
    reel.classList.add('spinning');
  }
  if (Math.random() < 0.3) {
    document.getElementById('slotPushBtn').classList.add('active');
  }
}

function slotPush() {
  document.getElementById('slotPushBtn').classList.remove('active');
  addLog('👆 押せ！ボタンを押した！', 'event');
}

function stopSlot(hit) {
  for (let i = 0; i < 3; i++) {
    const reel = document.getElementById('reel' + i);
    setTimeout(() => {
      reel.classList.remove('spinning');
      if (hit) {
        reel.innerHTML = '<div class="dot-symbol s7"></div>';
      } else {
        const cls = SYMBOL_CLASSES[Math.floor(Math.random() * SYMBOL_CLASSES.length)];
        reel.innerHTML = `<div class="dot-symbol ${cls}"></div>`;
      }
    }, i * 250);
  }
  setTimeout(() => {
    document.getElementById('slotArea').classList.remove('active');
    document.getElementById('slotPushBtn').classList.remove('active');
    slotActive = false;
    initSlotReels();
  }, 1500);
}

function playHitFX() {
  attackerOpen = true;
  document.getElementById('attacker').classList.add('open');

  const board = document.getElementById('board');
  board.style.animation = 'none';
  void board.offsetWidth;
  board.style.animation = 'boardShake 0.4s ease';

  const digital = document.getElementById('digital');
  digital.textContent = '大当り';
  digital.classList.add('hit');
  setTimeout(() => {
    digital.classList.remove('hit');
    digital.textContent = '---';
  }, 2000);

  const heso = document.getElementById('heso');
  heso.classList.add('hit');
  setTimeout(() => heso.classList.remove('hit'), 1500);

  setTimeout(() => {
    attackerOpen = false;
    document.getElementById('attacker').classList.remove('open');
  }, 3000);
}

      <li><strong>LOW / STOP / HIGH</strong>：発射する玉の数が変わる（5 / 15 / 30個）。</li>
      <li><strong>ヘソに入った玉の数</strong>で当たりやすさが変わる。</li>
      <li><strong>自動回転</strong>：ONにすると勝手に回り続ける。</li>
      <li><strong>スロット演出</strong>：回転時だけリールが動く。</li>
      <li><strong>スペック</strong>：リセットごとにランダム。レートも変わる。</li>
    </ul>
    <div class="modal-btns">
      <button class="pbtn" onclick="closeModal()">閉じる</button>
    </div>
  `);
}

function showSpec() {
  showModal(`
    <h2>⚙️ 現在のスペック</h2>
    <p><strong>レート：</strong>${spec.type.name}（${spec.type.desc}）</p>
    <p><strong>交換率：</strong>${spec.type.exchange}</p>
    <p><strong>モード：</strong>${spec.modeName}（${spec.modeDesc}）</p>
    <ul>
      <li>大当たり確率：1/${Math.round(1/spec.hitRate)}</li>
      <li>1回の出玉：${spec.ballsPerHit}玉</li>
      <li>1回転の消費：${spec.ballCost}玉</li>
      <li>LOW倍率：${spec.lowMult}倍（玉5個）</li>
      <li>STOP倍率：${spec.stopMult}倍（玉15個）</li>
      <li>HIGH倍率：${spec.highMult}倍（玉30個）</li>
      <li>釘の数：${nails.length}本</li>
    </ul>
    <p style="color:#88a;font-size:0.8rem;">※リセットするとスペックと釘配置がランダムに変わります</p>
    <div class="modal-btns">
      <button class="pbtn" onclick="closeModal()">閉じる</button>
    </div>
  `);
}

function showCredit() {
  showModal(`
    <h2>💰 クレジット</h2>
    <p>財布：<strong>${state.wallet.toLocaleString()}円</strong></p>
    <p>持ち玉：<strong>${state.balls}玉</strong></p>
    <p>レート：<strong>${spec.type.rate}円 / 玉</strong></p>
    <p style="color:#88a;font-size:0.8rem;">※1万円 = ${Math.floor(10000 / spec.type.rate)}玉 として交換します</p>
    <div class="modal-btns">
      <button class="pbtn" onclick="doDeposit(20000)">2万円入金</button>
      <button class="pbtn" onclick="doDeposit(50000)">5万円入金</button>
      <button class="pbtn" onclick="doDeposit(100000)">10万円入金</button>
      <button class="pbtn" onclick="closeModal()">閉じる</button>
    </div>
  `);
}

function doDeposit(amount) {
  if (state.wallet < amount) {
    addLog('⚠️ 財布の残高が足りません', 'system');
    return;
  }
  state.wallet -= amount;
  const balls = Math.floor(amount / spec.type.rate);
  state.balls += balls;
  addLog(`💰 ${amount.toLocaleString()}円入金 → ${balls}玉 獲得（${spec.type.rate}円/玉）`, 'system');
  render();
  closeModal();
  doSave();
}

initSlotReels();
init();
window.addEventListener('resize', () => { generateNails(); });

// boardShakeアニメーション
const style = document.createElement('style');
style.textContent = `
  @keyframes boardShake {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-4px, -2px); }
    40% { transform: translate(4px, 2px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(2px, -1px); }
  }
`;
document.head.appendChild(style);
</script>
