<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI証券パチンコ ｜ 用語で大当たり</title>
  <style>
    /* ===== パチンコ店 × SBI証券：ネオン・メタリック・黒 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      font-family: 'MS PGothic', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      overflow-x: hidden;
    }

    .cabinet {
      max-width: 900px;
      width: 100%;
      background: linear-gradient(180deg, #1a1a2a 0%, #0a0a12 100%);
      border: 4px solid #d4af37;
      border-radius: 12px;
      box-shadow:
        0 0 0 2px #000,
        0 0 40px rgba(212, 175, 55, 0.3),
        inset 0 0 60px rgba(0,0,0,0.8);
      padding: 14px;
      position: relative;
    }

    /* ===== ヘッダー ===== */
    .machine-header {
      background: linear-gradient(90deg, #1a1508 0%, #2a2010 50%, #1a1508 100%);
      border: 2px solid #d4af37;
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .machine-title {
      font-size: 1.2rem;
      color: #d4af37;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
      font-weight: bold;
    }

    .machine-title small {
      display: block;
      font-size: 0.65rem;
      color: #888;
      letter-spacing: 2px;
      font-weight: normal;
      margin-top: 2px;
    }

    .header-stats {
      display: flex;
      gap: 14px;
      font-size: 0.8rem;
      color: #aaa;
      flex-wrap: wrap;
    }

    .header-stats span {
      background: #111;
      border: 1px solid #333;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .header-stats .val { color: #d4af37; font-weight: bold; }

    /* ===== メイン画面（リール＋デジタル） ===== */
    .main-screen {
      background: #050508;
      border: 3px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ネオン背景 */
    .main-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(100, 100, 255, 0.06) 0%, transparent 40%);
      pointer-events: none;
    }

    /* デジタル表示 */
    .digital-display {
      font-family: 'Courier New', monospace;
      font-size: 3rem;
      color: #00ff88;
      text-shadow: 0 0 20px #00ff88, 0 0 40px rgba(0, 255, 136, 0.5);
      letter-spacing: 8px;
      background: #000;
      border: 2px solid #00ff88;
      padding: 10px 30px;
      border-radius: 6px;
      margin-bottom: 16px;
      min-width: 200px;
      text-align: center;
      transition: 0.2s;
      position: relative;
      z-index: 1;
    }

    .digital-display.flash {
      animation: digiFlash 0.3s ease 3;
    }

    @keyframes digiFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .digital-display.rainbow {
      animation: rainbowText 0.5s linear infinite;
    }

    @keyframes rainbowText {
      0% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
      17% { color: #ffff00; text-shadow: 0 0 20px #ffff00; }
      33% { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
      50% { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
      67% { color: #0000ff; text-shadow: 0 0 20px #0000ff; }
      83% { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
      100% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
    }

    /* リール風 */
    .reels {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .reel {
      width: 80px;
      height: 100px;
      background: #111;
      border: 3px solid #d4af37;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #d4af37;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .reel .symbol {
      transition: transform 0.1s;
    }

    .reel.spinning .symbol {
      animation: reelSpin 0.1s linear infinite;
    }

    @keyframes reelSpin {
      0% { transform: translateY(-50%); }
      100% { transform: translateY(50%); }
    }

    /* ===== 演出エリア ===== */
    .fx-area {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    /* ===== 情報パネル ===== */
    .info-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .info-box {
      flex: 1 1 180px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-left: 3px solid #d4af37;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #aaa;
      line-height: 1.6;
    }

    .info-box .label {
      color: #666;
      font-size: 0.7rem;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
    }

    .info-box .term {
      color: #d4af37;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .info-box .desc {
      color: #b0b0b0;
      font-size: 0.78rem;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ===== 操作ボタン ===== */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(180deg, #2a2a2a 0%, #111 100%);
      border: 2px solid #d4af37;
      color: #d4af37;
      padding: 14px 24px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 2px;
      font-family: 'MS PGothic', sans-serif;
      font-weight: bold;
      transition: 0.15s;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
      flex: 1 1 auto;
      min-width: 120px;
    }

    .btn:hover {
      background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 100%);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .btn.danger {
      border-color: #a44;
      color: #c66;
      text-shadow: 0 0 8px rgba(200, 80, 80, 0.4);
    }

    .btn.danger:hover {
      box-shadow: 0 0 20px rgba(200, 80, 80, 0.4);
    }

    .btn.small {
      padding: 8px 16px;
      font-size: 0.8rem;
      min-width: auto;
      flex: 0 1 auto;
    }

    /* ===== 図鑑 ===== */
    .zukan {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .zukan h3 {
      font-size: 0.9rem;
      color: #d4af37;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }

    .zukan-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 0.78rem;
      border-bottom: 1px dashed #1a1a1a;
      color: #aaa;
    }

    .zukan-item:last-child { border-bottom: none; }

    .zukan-item .z-term { color: #d4af37; }
    .zukan-item .z-count { color: #00ff88; font-family: 'Courier New', monospace; }

    /* ===== ログ ===== */
    .log {
      background: #080808;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px 12px;
      height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
      color: #888;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .log .log-line { margin-bottom: 2px; }
    .log .log-line.hit { color: #00ff88; }
    .log .log-line.miss { color: #666; }
    .log .log-line.event { color: #d4af37; }
    .log .log-line.system { color: #66aaff; }

    /* ===== セーブ・リセット ===== */
    .save-panel {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ===== モーダル ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: #0a0a12;
      border: 3px solid #d4af37;
      border-radius: 10px;
      padding: 30px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.4);
    }

    .modal h2 {
      color: #d4af37;
      font-size: 1.3rem;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .modal p {
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .modal .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .modal .btn {
      min-width: 100px;
      flex: 0 1 auto;
    }

    /* ===== 演出用 ===== */
    .fx-particle {
      position: absolute;
      pointer-events: none;
      z-index: 200;
      font-size: 1.5rem;
      animation: particleFly 1.5s ease-out forwards;
    }

    @keyframes particleFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    .screen-shake {
      animation: screenShake 0.5s ease;
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0,0); }
      10% { transform: translate(-8px, -4px); }
      30% { transform: translate(8px, 4px); }
      50% { transform: translate(-6px, 2px); }
      70% { transform: translate(6px, -2px); }
      90% { transform: translate(-3px, 1px); }
    }

    .flash-white {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.1s;
    }

    .flash-white.on { opacity: 0.9; }

    /* レスポンシブ */
    @media (max-width: 600px) {
      .digital-display { font-size: 2rem; padding: 8px 16px; }
      .reel { width: 60px; height: 80px; font-size: 1.6rem; }
      .btn { padding: 10px 14px; font-size: 0.85rem; }
      .machine-title { font-size: 0.95rem; }
      .info-box { flex: 1 1 100%; }
    }
  </style>
</head>
<body>

  <div class="flash-white" id="flashWhite"></div>

  <div class="cabinet" id="cabinet">

    <!-- ヘッダー -->
    <div class="machine-header">
      <div class="machine-title">
        SBI証券パチンコ
        <small>～ 用語で大当たり ～</small>
      </div>
      <div class="header-stats">
        <span>所持金 <span class="val" id="statMoney">1000</span>枚</span>
        <span>回転数 <span class="val" id="statSpins">0</span></span>
        <span>大当たり <span class="val" id="statHits">0</span></span>
      </div>
    </div>

    <!-- メイン画面 -->
    <div class="main-screen" id="mainScreen">
      <div class="digital-display" id="digitalDisplay">---</div>
      <div class="reels">
        <div class="reel" id="reel0"><span class="symbol">7</span></div>
        <div class="reel" id="reel1"><span class="symbol">7</span></div>
        <div class="reel" id="reel2"><span class="symbol">7</span></div>
      </div>
      <div class="fx-area" id="fxArea"></div>
    </div>

    <!-- 情報パネル -->
    <div class="info-panel">
      <div class="info-box">
        <span class="label">当選用語</span>
        <span class="term" id="infoTerm">---</span>
        <div class="desc" id="infoDesc">用語を引くと解説が表示されます</div>
      </div>
      <div class="info-box">
        <span class="label">状態</span>
        <span class="term" id="infoState">通常</span>
        <div class="desc" id="infoStateDesc">確率変動なし</div>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button class="btn" id="btnSpin" onclick="doSpin()">🎰 回す（100枚）</button>
      <button class="btn" id="btnBet" onclick="doBet()">💰 ベット（10枚）</button>
      <button class="btn small" onclick="doZukan()">📖 図鑑</button>
      <button class="btn small" onclick="doSave()">💾 セーブ</button>
    </div>

    <!-- 図鑑 -->
    <div class="zukan" id="zukanBox">
      <h3>📖 用語図鑑</h3>
      <div id="zukanList">
        <div class="zukan-item" style="color:#666;">まだ何も引いていません</div>
      </div>
    </div>

    <!-- ログ -->
    <div class="log" id="logBox">
      <div class="log-line system">▶ SBI証券パチンコへようこそ</div>
      <div class="log-line system">▶ 100枚からスタート。回して用語を学ぼう</div>
    </div>

    <!-- セーブ・リセット -->
    <div class="save-panel">
      <button class="btn small danger" onclick="openResetModal()">🔄 リセット</button>
      <button class="btn small" onclick="doSave()">💾 セーブ</button>
    </div>

  </div>

  <!-- リセット確認モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">⚠️ リセット確認</h2>
      <p id="modalText">本当にリセットしますか？</p>
      <div class="modal-btns" id="modalBtns">
        <button class="btn danger" onclick="confirmReset()">はい</button>
        <button class="btn" onclick="closeModal()">いいえ</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 用語データ =====
    const TERMS = [

      { term: '非上場', desc: '取引所で売買できない。' },
      { term: '公開', desc: '一般に公開すること。' },
      { term: '非公開', desc: '一般に公開しない。' },
      { term: '市場', desc: '売買が行われる場所。' },
      { term: '価格', desc: '売買の値段。' },
      { term: '需要', desc: '買いたい量。' },
      { term: '供給', desc: '売りたい量。' },
      { term: '均衡価格', desc: '需要と供給が一致する価格。' },
      { term: '見えざる手', desc: '市場を調整する力。' },
      { term: '神', desc: '市場そのもの。' }
    ];

    // ===== 状態 =====
    let state = {
      money: 1000,
      spins: 0,
      hits: 0,
      zukan: {},        // 用語: 出現回数
      logs: [],
      stateMode: '通常',
      stateDesc: '確率変動なし'
    };

    // セーブキー
    const SAVE_KEY = 'sbi_pachinko_save';

    // ===== 初期化 =====
    function init() {
      loadSave();
      render();
      addLog('▶ SBI証券パチンコへようこそ', 'system');
      addLog('▶ 100枚からスタート。回して用語を学ぼう', 'system');
    }

    // ===== セーブ =====
    function doSave() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        addLog('💾 セーブしました', 'system');
      } catch(e) {
        addLog('⚠️ セーブ失敗', 'system');
      }
    }

    function loadSave() {
      try {
        const data = localStorage.getItem(SAVE_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          state = { ...state, ...parsed };
        }
      } catch(e) {}
    }

    // ===== リセット（4回確認） =====
    let resetStep = 0;

    function openResetModal() {
      resetStep = 1;
      showModal(
        '⚠️ リセット確認 (1/4)',
        '本当にリセットしますか？<br><span style="color:#a44;">すべてのデータが消えます</span>',
        true
      );
    }

    function confirmReset() {
      resetStep++;
      if (resetStep === 2) {
        showModal(
          '⚠️ リセット確認 (2/4)',
          '本当に本当にリセットしますか？<br><span style="color:#a44;">所持金・回転数・図鑑がすべて消えます</span>',
          true
        );
      } else if (resetStep === 3) {
        showModal(
          '⚠️ リセット確認 (3/4)',
          '本当に本当に本当にリセットしますか？<br><span style="color:#a44;">後悔しませんか？</span>',
          true
        );
      } else if (resetStep === 4) {
        showModal(
          '⚠️ 最終確認 (4/4)',
          '<span style="color:#ff4444;font-size:1.1rem;">本当にリセットしますか？</span><br><span style="color:#a44;">この操作は取り消せません</span>',
          true
        );
      } else {
        // 実行
        localStorage.removeItem(SAVE_KEY);
        state = {
          money: 1000,
          spins: 0,
          hits: 0,
          zukan: {},
          logs: [],
          stateMode: '通常',
          stateDesc: '確率変動なし'
        };
        render();
        addLog('🔄 リセットしました', 'system');
        addLog('▶ 100枚から再スタート', 'system');
        closeModal();
        resetStep = 0;
      }
    }

    function showModal(title, text, showBtns) {
      document.getElementById('modalTitle').innerHTML = title;
      document.getElementById('modalText').innerHTML = text;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      resetStep = 0;
    }

    // ===== レンダリング =====
    function render() {
      document.getElementById('statMoney').textContent = state.money;
      document.getElementById('statSpins').textContent = state.spins;
      document.getElementById('statHits').textContent = state.hits;
      document.getElementById('infoState').textContent = state.stateMode;
      document.getElementById('infoStateDesc').textContent = state.stateDesc;
      renderZukan();
      renderLog();
    }

    function renderZukan() {
      const list = document.getElementById('zukanList');
      const keys = Object.keys(state.zukan);
      if (keys.length === 0) {
        list.innerHTML = '<div class="zukan-item" style="color:#666;">まだ何も引いていません</div>';
        return;
      }
      keys.sort((a,b) => state.zukan[b] - state.zukan[a]);
      list.innerHTML = keys.map(k =>
        `<div class="zukan-item">
          <span class="z-term">${k}</span>
          <span class="z-count">×${state.zukan[k]}</span>
        </div>`
      ).join('');
    }

    function renderLog() {
      const box = document.getElementById('logBox');
      box.innerHTML = state.logs.slice(-50).map(l =>
        `<div class="log-line ${l.type}">${l.text}</div>`
      ).join('');
      box.scrollTop = box.scrollHeight;
    }

    function addLog(text, type = 'system') {
      state.logs.push({ text, type });
      if (state.logs.length > 200) state.logs = state.logs.slice(-100);
      renderLog();
    }

    // ===== 回す =====
    function doSpin() {
      if (state.money < 100) {
        addLog('⚠️ 所持金が足りません（100枚必要）', 'system');
        return;
      }

      state.money -= 100;
      state.spins++;
      render();

      addLog(`🎰 ${state.spins}回転目…`, 'system');

      // リール回転
      spinReels();

      // 演出抽選
      const roll = Math.random();
      let hit = false;
      let term = null;

      // 大当たり確率 1/50 + 状態補正
      let hitRate = 1/50;
      if (state.stateMode === '確変') hitRate = 1/10;
      if (state.stateMode === '時短') hitRate = 1/25;

      if (roll < hitRate) {
        hit = true;
      }

      // 演出選択
      const fxRoll = Math.random();
      if (fxRoll < 0.05) {
        // 激アツ演出
        playFX('super');
      } else if (fxRoll < 0.15) {
        playFX('reach');
      } else if (fxRoll < 0.35) {
        playFX('normal');
      } else {
        playFX('none');
      }

      // 結果
      setTimeout(() => {
        stopReels(hit);
        if (hit) {
          state.hits++;
          state.money += 500; // 出玉
          term = TERMS[Math.floor(Math.random() * TERMS.length)];
          state.zukan[term.term] = (state.zukan[term.term] || 0) + 1;

          // 状態変化
          if (Math.random() < 0.3) {
            state.stateMode = '確変';
            state.stateDesc = '大当たり確率アップ';
          } else if (Math.random() < 0.5) {
            state.stateMode = '時短';
            state.stateDesc = '回転数アップ';
          }

          document.getElementById('infoTerm').textContent = term.term;
          document.getElementById('infoDesc').textContent = term.desc;

          addLog(`🎉 大当たり！【${term.term}】${term.desc}`, 'hit');
          addLog(`💰 +500枚 獲得！`, 'hit');

          if (state.stateMode !== '通常') {
            addLog(`⭐ 状態変化：${state.stateMode}（${state.stateDesc}）`, 'event');
          }

          // 大当たり演出
          playHitFX();
        } else {
          addLog(`…ハズレ`, 'miss');
          // 通常に戻る
          if (state.stateMode !== '通常') {
            state.stateMode = '通常';
            state.stateDesc = '確率変動なし';
            addLog('状態が通常に戻りました', 'system');
          }
        }
        render();
        doSave();
      }, 800);
    }

    // ===== ベット（所持金回復） =====
    function doBet() {
      if (state.money >= 1000) {
        addLog('⚠️ 所持金が十分にあります', 'system');
        return;
      }
      state.money += 10;
      addLog('💰 ベットで10枚獲得', 'system');
      render();
      doSave();
    }

    // ===== 図鑑 =====
    function doZukan() {
      const keys = Object.keys(state.zukan);
      if (keys.length === 0) {
        addLog('📖 図鑑はまだ空です', 'system');
      } else {
        addLog(`📖 図鑑：${keys.length}種類の用語を引きました`, 'system');
      }
      const box = document.getElementById('zukanBox');
      box.scrollIntoView({ behavior: 'smooth' });
    }

    // ===== リール =====
    let reelIntervals = [];

    function spinReels() {
      for (let i = 0; i < 3; i++) {
        const reel = document.getElementById('reel' + i);
        reel.classList.add('spinning');
        const symbols = ['7', 'BAR', '◆', '★', '🍒', '🔔', '💰', '📈', '📊', '⚙'];
        let idx = 0;
        const interval = setInterval(() => {
          idx = (idx + 1) % symbols.length;
          reel.querySelector('.symbol').textContent = symbols[idx];
        }, 60);
        reelIntervals[i] = interval;
      }
    }

    function stopReels(hit) {
      for (let i = 0; i < 3; i++) {
        clearInterval(reelIntervals[i]);
        const reel = document.getElementById('reel' + i);
        reel.classList.remove('spinning');
        setTimeout(() => {
          if (hit) {
            reel.querySelector('.symbol').textContent = '7';
          } else {
            const symbols = ['BAR', '◆', '★', '🍒', '🔔'];
            reel.querySelector('.symbol').textContent = symbols[Math.floor(Math.random() * symbols.length)];
          }
        }, i * 200);
      }
    }

    // ===== 演出 =====
    function playFX(type) {
      const screen = document.getElementById('mainScreen');

      if (type === 'super') {
        // 激アツ：画面シェイク＋フラッシュ＋レインボー
        screen.classList.add('screen-shake');
        setTimeout(() => screen.classList.remove('screen-shake'), 500);
        flashScreen();
        const digital = document.getElementById('digitalDisplay');
        digital.classList.add('rainbow');
        setTimeout(() => digital.classList.remove('rainbow'), 2000);
        addLog('🔥 激アツ演出発生！', 'event');
      } else if (type === 'reach') {
        // リーチ
        const digital = document.getElementById('digitalDisplay');
        digital.classList.add('flash');
        setTimeout(() => digital.classList.remove('flash'), 1000);
        addLog('⚡ リーチ！', 'event');
      } else if (type === 'normal') {
        // 通常演出
        const digital = document.getElementById('digitalDisplay');
        digital.textContent = '??';
        setTimeout(() => digital.textContent = '---', 500);
      }
    }

    function playHitFX() {
      flashScreen();
      const screen = document.getElementById('mainScreen');
      screen.classList.add('screen-shake');
      setTimeout(() => screen.classList.remove('screen-shake'), 500);

      // パーティクル
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'fx-particle';
        p.textContent = ['💰','⭐','🎉','✨','🏆'][Math.floor(Math.random()*5)];
        p.style.left = '50%';
        p.style.top = '50%';
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 300 + 100;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        document.getElementById('fxArea').appendChild(p);
        setTimeout(() => p.remove(), 1600);
      }

      const digital = document.getElementById('digitalDisplay');
      digital.classList.add('rainbow');
      setTimeout(() => digital.classList.remove('rainbow'), 3000);
    }

    function flashScreen() {
      const flash = document.getElementById('flashWhite');
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 150);
      setTimeout(() => flash.classList.add('on'), 300);
      setTimeout(() => flash.classList.remove('on'), 450);
    }

    // ===== 初期化 =====
    init();
  </script>

</body>
</html>
