<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逆転裁判 · 令和の闇</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Yu Gothic', sans-serif; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            max-width: 920px;
            width: 100%;
            background: #f5f0e8;
            background-image: linear-gradient(145deg, #f8f3ea 0%, #e8dfd3 100%);
            border-radius: 48px 48px 28px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px #b8a58b inset;
            padding: 24px 28px 32px;
        }
        .court-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #7d5d3a;
            padding-bottom: 10px;
            margin-bottom: 18px;
        }
        .court-badge h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #2d1f12;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #c9b69a;
            margin: 0;
        }
        .chapter-indicator {
            background: #3f2c1b;
            padding: 8px 18px;
            border-radius: 60px;
            color: #f0e2cf;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 2px 0 #5f4530;
        }
        .status-panel {
            background: #d7cbbe;
            border-radius: 40px;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 2px solid #b7a187;
            box-shadow: inset 0 2px 4px #b09b84;
        }
        .progress { display: flex; gap: 6px; font-weight: 600; color: #1f140e; flex-wrap: wrap; }
        .progress span {
            background: #eee5da;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #a48d74;
        }
        .save-status {
            background: #4d3825;
            color: #f0e1cd;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .testimony-box {
            background: #fcf9f2;
            border-radius: 32px;
            padding: 26px 30px;
            min-height: 300px;
            border: 3px solid #b59d80;
            box-shadow: inset 0 6px 12px rgba(90, 60, 30, 0.2);
            margin: 16px 0 24px;
            font-size: 1.08rem;
            line-height: 1.85;
            color: #1e150e;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .testimony-box .speaker {
            font-weight: 700;
            color: #7d3c1b;
            display: block;
            margin-bottom: 8px;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }
        .testimony-box .speaker::before { content: "⚖️ "; }
        .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .choice-btn {
            background: #ede3d6;
            border: 3px solid #8f775d;
            border-radius: 60px;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #20180e;
            text-align: left;
            cursor: pointer;
            transition: all 0.08s linear;
            box-shadow: 0 5px 0 #6b5743;
        }
        .choice-btn:hover { background: #faf1e2; transform: translateY(-2px); box-shadow: 0 7px 0 #5f4b38; }
        .choice-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #5f4b38; }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 28px;
            border-top: 2px dashed #b49f89;
            padding-top: 22px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #3b2b1d;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            color: #efe5d8;
            font-weight: 600;
            font-size: 1.0rem;
            box-shadow: 0 5px 0 #1b140e;
            cursor: pointer;
            transition: 0.08s linear;
        }
        .action-btn.reset { background: #883f2a; box-shadow: 0 5px 0 #542a1b; }
        .action-btn.reset:hover { background: #a54d34; transform: scale(0.97); }
        .action-btn:hover { background: #4f3b29; transform: scale(0.97); }
        .action-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #1b140e; }
        .footer-message {
            text-align: right;
            color: #524433;
            font-size: 0.8rem;
            margin-top: 8px;
            opacity: 0.8;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-box {
            background: #efe6da;
            max-width: 460px;
            width: 90%;
            padding: 32px 28px;
            border-radius: 64px 24px 64px 24px;
            border: 4px solid #896f55;
            box-shadow: 0 20px 40px #00000066;
            text-align: center;
        }
        .modal-box h2 {
            margin-top: 0;
            color: #3d2a19;
            font-weight: 700;
            border-bottom: 3px solid #ae9278;
            padding-bottom: 12px;
        }
        .modal-box p { font-size: 1.2rem; color: #20180f; }
        .modal-btn-group { display: flex; gap: 20px; justify-content: center; margin-top: 28px; }
        .modal-btn {
            background: #5f4734;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 700;
            color: #f0e3d4;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #2e1f14;
            cursor: pointer;
            transition: 0.06s linear;
        }
        .modal-btn.danger { background: #9e3d2a; box-shadow: 0 4px 0 #5f271b; }
        .modal-btn:hover { transform: scale(0.95); }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2e1f14; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="court-badge">
            <h1>⚡逆転裁判</h1>
            <div class="chapter-indicator" id="chapterLabel">第1章</div>
        </div>

        <div class="status-panel">
            <div class="progress">
                <span id="stageDisplay">📌 証言中</span>
                <span id="clearMark" style="background:#b9a48b;">⚪ 未クリア</span>
            </div>
            <div class="save-status" id="saveStatus">💾 セーブ済み</div>
        </div>

        <div class="testimony-box">
            <span class="speaker" id="speakerName">🎙️ 裁判長</span>
            <div id="dialogueText">法廷はこれより開廷する。</div>
        </div>

        <div id="choicesContainer" class="choices"></div>

        <div class="action-bar">
            <button class="action-btn reset" id="resetBtn">⚠️ 最初からやり直す</button>
            <button class="action-btn" id="saveBtn">📀 今の進行をセーブ</button>
        </div>
        <div class="footer-message">★ 各章クリアで自動セーブ | リセットは二度確認</div>
    </div>

    <div class="modal-overlay" id="resetModal">
        <div class="modal-box">
            <h2>⚠️ 本当にリセットしますか？</h2>
            <p>すべての進行が消去されます。<br>（セーブデータも完全に削除）</p>
            <div class="modal-btn-group">
                <button class="modal-btn" id="modalCancel">やめる</button>
                <button class="modal-btn danger" id="modalConfirm">はい、リセット</button>
            </div>
        </div>
    </div>

    <script>
        (function(){
            "use strict";

            // ================================================================
            // STORY: 各章を横展開で大幅増量
            // ================================================================
            const STORY = {

                // ============================================================
                // 第1章: はんじょうの反社問題
                // ============================================================
                chapter1: {
                    name: "第1章 · はんじょうの反社問題",
                    stages: [
                        {
                            speaker: "🎙️ 裁判長",
                            text: "法廷はこれより開廷する。\n\n本日の案件は、登録者数380万人を誇る人気配信者『はんじょう』が、指定暴力団『神奈川一家』と金銭的な関係を持っていたという疑いである。\n\n告発者は匿名の内部関係者。SNSでは既に『はんじょう逮捕か？』『いや、冤罪だ』『いや、前から怪しかった』と、1日で50万件を超える投稿がなされた。\n\n検察側の主張はこうだ——はんじょうは反社に月100万円を送金し、見返りに配信の妨害工作や、ライバル配信者の個人情報を入手していた。\n\nはんじょう、あなたは反社組織に金を送っていたのか？",
                            choices: [
                                { label: "✅ 認める。反社に金を送った。", next: 1 },
                                { label: "❌ 否定する。全くのデマだ。", next: 2 }
                            ]
                        },
                        {
                            speaker: "⚡ はんじょう",
                            text: "……確かに金は送った。月100万円、半年間で合計600万円。\n\nだがそれは『取材協力費』だ。俺は半年前から反社の実態を暴く潜入取材を続けていた。そのための必要経費だったんだ。\n\n証拠ならある。まず、俺が反社のアジトに出入りしていた時の動画。次に、反社の幹部と交わしたメールのスクショ。そして、反社が関与していた違法賭博場の内部資料。\n\n俺はジャーナリストとして動いていた。なのに、なぜ俺が裁かれなきゃいけない？ むしろ、評価されるべきじゃないのか？",
                            choices: [
                                { label: "📹 潜入取材の動画を提出する", next: 3 },
                                { label: "🧾 領収書の控えを提出する", next: 4 },
                                { label: "📧 反社幹部とのメールを提出する", next: 5 }
                            ]
                        },
                        {
                            speaker: "⚡ はんじょう",
                            text: "違う！ 俺は何も知らない。これは俺への嫌がらせだ！\n\n同じ業界のライバル配信者が、俺を陥れようとしているんだ。あいつらは俺の再生数を妬んでる。俺がトップに立ったから、引きずり下ろそうとしてる。\n\n反社なんて本当に接点ない。俺はただゲーム実況して、雑談して、たまにコラボしてるだけの配信者だ。\n\n信じてくれ。俺は無実だ。",
                            choices: [
                                { label: "📱 過去の反社関連投稿を指摘", next: 6 },
                                { label: "🔍 アカウントのIPログを鑑定", next: 7 }
                            ]
                        },
                        {
                            speaker: "🎙️ 裁判長",
                            text: "動画を確認する。……確かに、はんじょうが反社のボスと握手するシーンが映っている。しかし、その直後のインタビューで彼は『真実を暴くため、あえて近づいた』と語っている。\n\nさらに、動画の最後には反社の違法行為の証拠リストまで映っていた。これは……ただの癒着では説明がつかない。\n\n検察側、この動画についてどう考える？",
                            choices: [
                                { label: "👍 はんじょうを信じる", next: 8 },
                                { label: "👎 やはり反社と癒着している", next: 9 }
                            ]
                        },
                        {
                            speaker: "🎙️ 裁判長",
                            text: "領収書には『反社調査費』と明記されている。宛先は反社のフロント企業『神奈川観光開発』。金額は月100万円、期間は6ヶ月。\n\nしかし、これだけでは『潜入取材』と『癒着』の区別がつかない。検察側は『単なる資金提供』と主張。弁護側は『必要経費』と主張。\n\n決め手に欠ける。他に証拠はあるか？",
                            choices: [
                                { label: "🗂️ 内部告発者の追加証言を求める", next: 8 },
                                { label: "⚖️ 警察の捜査報告書を提出", next: 10 }
                            ]
                        },
                        {
                            speaker: "🎙️ 裁判長",
                            text: "メールの内容を確認する。……はんじょうは反社幹部に対し、『違法賭博の現場を見せてほしい』『暴力団の資金源を教えてほしい』と繰り返し依頼している。\n\n一方、反社側からは『情報を渡す代わりに、配信で俺たちを悪く言うな』という条件が出ている。はんじょうはこれを拒否し、『真実は曲げない』と返信している。\n\nこれは……明らかにジャーナリストの行動だ。",
                            choices: [
                                { label: "📺 配信アーカイブを確認する", next: 8 },
                                { label: "🧑‍💼 元反社構成員の証言を求める", next: 8 }
                            ]
                        },
                        {
                            speaker: "📱 検察官",
                            text: "過去の投稿を確認。……3年前、はんじょうは『反社の飲み会に参加した』という投稿をしている。しかし、よく見ると、この投稿は彼のアカウントではなく、なりすましアカウントによるものだ。\n\n本物のはんじょうは、その投稿を即座に否定し、『なりすましは通報しました』と報告している。つまり、これは彼を陥れるための偽情報だ。",
                            choices: [
                                { label: "🕵️ なりすまし犯を特定する", next: 8 },
                                { label: "📊 投稿の拡散経路を追う", next: 8 }
                            ]
                        },
                        {
                            speaker: "🔍 検察官",
                            text: "IPログを鑑定した結果……はんじょうのアカウントは、反社のアジト周辺から複数回アクセスしている。しかし、アクセス時間はすべて深夜から早朝。これは潜入取材の時間帯と一致する。\n\nさらに、同じ時間帯に警察の捜査員も同じエリアにいたという記録がある。つまり、はんじょうは警察と連携していた可能性が高い。",
                            choices: [
                                { label: "👮 警察に問い合わせる", next: 8 },
                                { label: "📞 担当刑事の証言を求める", next: 8 }
                            ]
                        },
                        {
                            speaker: "🎙️ 裁判長",
                            text: "————判決。\n\nはんじょうが提供した内部資料により、反社組織『神奈川一家』の幹部3名が逮捕。違法賭博場も摘発され、暴力団の資金源が断たれた。警察も彼の協力を公式に認めている。\n\n彼は『潜入ジャーナリスト』として正当な活動を行っていた。\n\nはんじょう、無罪。\n\n✅ 第1章 クリア！\nはんじょうの名誉は守られ、炎上は鎮火した。彼は再び配信を再開し、その模様は100万人が同時視聴した。",
                            choices: []
                        },
                        {
                            speaker: "🎙️ 裁判長",
                            text: "————判決。\n\nはんじょうは反社との癒着が認められ、有罪。配信者としての活動は永久停止。SNSはさらに炎上し、彼は表舞台から消えた。\n\nしかし、彼は最後にこう言い残した——『俺は真実を暴きたかっただけだ。信じてくれる人がいるなら、それでいい』。\n\n❌ 第1章 バッドエンド…\nもう一度、真実を掴み取れ。",
                            choices: []
                        },
                        {
                            speaker: "🎙️ 裁判長",
                            text: "警察の捜査報告書を確認。……そこには、はんじょうが警察に協力していた事実が明確に記録されていた。\n\n彼は単独で動いていたのではなく、警察の捜査に協力しながら、独自に取材を進めていた。検察側の主張は完全に崩れた。\n\n————判決。はんじょう、無罪。\n\n✅ 第1章 クリア！\n彼の勇気ある行動は、多くのメディアで称えられた。",
                            choices: []
                        }
                    ]
                },

                // ============================================================
                // 第2章: こめおの食中毒問題
                // ============================================================
                chapter2: {
                    name: "第2章 · こめお食中毒事件",
                    stages: [
                        {
                            speaker: "👨‍⚖️ 裁判長",
                            text: "次なる事件は、登録者数250万人の人気YouTuber『こめお』が主催したファンミーティングでの集団食中毒。\n\n参加者120名のうち、40名以上が激しい腹痛と発熱を訴え、5名が入院。保健所は『提供された寿司が原因』と断定。\n\nさらに、SNSでは『こめおのイベントは危険』『金儲けしか考えてない』と批判が殺到。スポンサー2社が契約を解除。\n\nこめお、あなたは主催者として責任を認めるか？",
                            choices: [
                                { label: "🍣 仕入れ先の過失だ", next: 1 },
                                { label: "😰 自分も同じものを食べて被害者だ", next: 2 },
                                { label: "🤔 まず事実関係を確認したい", next: 3 }
                            ]
                        },
                        {
                            speaker: "🍙 こめお",
                            text: "仕入れ先の業者が賞味期限切れの魚を混ぜたんだ。俺は知らなかった。\n\n俺は信頼できる業者としか取引してこなかった。まさかこんなことになるなんて……。俺だって被害者なんだよ。\n\nそもそも、俺は当日、朝の4時から準備して、全部の寿司を試食した。その時は何ともなかった。なのに、なぜ参加者だけが……。",
                            choices: [
                                { label: "📄 仕入れ先との契約書を提示", next: 4 },
                                { label: "🧪 食品の検査結果を要求", next: 5 },
                                { label: "📞 仕入れ先の業者を呼び出す", next: 6 }
                            ]
                        },
                        {
                            speaker: "🍙 こめお",
                            text: "俺も同じものを食べてダウンした。40度の熱が出て、3日間入院した。\n\n被害者なのに、なぜ俺が責められるんだ？ 仕入れ先を責めるべきだろ？ 俺は何も悪くない。\n\nむしろ、俺は被害者を救おうと必死だった。入院中も、スタッフに指示して、参加者全員に連絡を取った。医療費も立て替えた。なのに、なぜ……。",
                            choices: [
                                { label: "🏥 こめおの診断書を確認", next: 7 },
                                { label: "📹 当日の調理動画を確認", next: 8 },
                                { label: "💬 参加者の証言を集める", next: 9 }
                            ]
                        },
                        {
                            speaker: "🤔 こめお",
                            text: "……わかった。まず事実を確認しよう。\n\n俺が知っているのは、当日の朝、仕入れ先から届いた魚の一部が、指定した鮮度基準を満たしていなかったこと。でも、俺はそれを『大丈夫だろう』と判断して使ってしまった。\n\nそれが間違いだったのかもしれない。でも、全部を俺のせいにするのは違う。仕入れ先にも責任がある。",
                            choices: [
                                { label: "📋 鮮度基準の書類を確認", next: 4 },
                                { label: "🧑‍🍳 当日の調理スタッフを呼ぶ", next: 8 }
                            ]
                        },
                        {
                            speaker: "⚖️ 検察官",
                            text: "契約書には『仕入れ先が全責任を負う』とある。しかし、こめおは当日、衛生管理を怠っていた。\n\n調理場の温度管理は不完全。手洗いの記録もない。さらに、こめお自身が『ちょっと味見』と称して素手で寿司を触っていた動画が残っている。\n\nこれは明らかな衛生管理義務違反だ。",
                            choices: [
                                { label: "📋 衛生講習の受講証明を出す", next: 10 },
                                { label: "🧑‍🍳 当日のシェフの証言を求める", next: 8 },
                                { label: "🌡️ 調理場の温度記録を提出", next: 10 }
                            ]
                        },
                        {
                            speaker: "🧪 検察官",
                            text: "食品の検査結果を確認。……提供された寿司からは、複数の種類の細菌が検出された。\n\nしかし、興味深いことに、細菌の種類は仕入れ先の魚から検出されたものと、こめおの調理場から検出されたものの2種類ある。\n\nつまり、仕入れ先の魚だけが原因ではない。こめおの調理場でも二次汚染が起きている。",
                            choices: [
                                { label: "🔬 二次汚染の経路を特定", next: 10 },
                                { label: "🧼 調理場の衛生状態を調査", next: 10 }
                            ]
                        },

            // ================================================================
            // キー管理
            // ================================================================
            const SAVE_KEY = 'gyakuten_save_data';
            const ENDING_SEEN_KEY = 'gyakuten_ending_seen';

            let state = {
                chapter: 'chapter1',
                stageIndex: 0,
                cleared: { chapter1: false, chapter2: false, chapter3: false }
            };

            const chapterLabel = document.getElementById('chapterLabel');
            const stageDisplay = document.getElementById('stageDisplay');
            const clearMark = document.getElementById('clearMark');
            const saveStatus = document.getElementById('saveStatus');
            const speakerName = document.getElementById('speakerName');
            const dialogueText = document.getElementById('dialogueText');
            const choicesContainer = document.getElementById('choicesContainer');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');
            const resetModal = document.getElementById('resetModal');
            const modalCancel = document.getElementById('modalCancel');
            const modalConfirm = document.getElementById('modalConfirm');

            function getChapterData(key) { return STORY[key] || STORY.chapter1; }

            function getCurrentStage() {
                const ch = getChapterData(state.chapter);
                if (!ch || !ch.stages || state.stageIndex >= ch.stages.length) {
                    return ch?.stages?.[0] || { speaker: '裁判長', text: 'エラー', choices: [] };
                }
                return ch.stages[state.stageIndex];
            }

            function getChapterDisplayName(key) {
                const map = {
                    chapter1: '第1章 · はんじょうの反社問題',
                    chapter2: '第2章 · こめお食中毒事件',
                    chapter3: '最終章 · DJ社長の借金問題'
                };
                return map[key] || key;
            }

            function checkFinalClear() {
                if (state.chapter === 'chapter3' && state.cleared.chapter3 === true) {
                    const seen = localStorage.getItem(ENDING_SEEN_KEY);
                    if (seen !== 'true') {
                        localStorage.setItem(ENDING_SEEN_KEY, 'true');
                        window.location.href = 'meme.html';
                    }
                }
            }

            function render() {
                const chKey = state.chapter;
                const chData = getChapterData(chKey);
                const stage = getCurrentStage();

                chapterLabel.textContent = getChapterDisplayName(chKey);

                const total = chData.stages.length;
                const index = state.stageIndex + 1;
                stageDisplay.textContent = `📌 証言 ${index}/${total}`;

                const isCleared = state.cleared[chKey] || false;
                clearMark.textContent = isCleared ? '⭐ クリア済' : '⚪ 未クリア';
                clearMark.style.background = isCleared ? '#b5d6a8' : '#b9a48b';

                saveStatus.textContent = '💾 セーブ済み';

                speakerName.textContent = stage.speaker || '🎙️ 裁判長';
                dialogueText.textContent = stage.text || '…';

                choicesContainer.innerHTML = '';
                if (stage.choices && stage.choices.length > 0) {
                    stage.choices.forEach((choice) => {
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.textContent = choice.label;
                        btn.addEventListener('click', function() {
                            if (choice.next !== undefined) {
                                const nextIndex = choice.next;
                                const chStages = getChapterData(state.chapter).stages;
                                if (nextIndex < chStages.length) {
                                    state.stageIndex = nextIndex;
                                    const newStage = getCurrentStage();
                                    if (newStage.choices.length === 0) {
                                        state.cleared[state.chapter] = true;
                                        saveGame();
                                        checkFinalClear();
                                    }
                                    render();
                                    saveGame();
                                }
                            }
                        });
                        choicesContainer.appendChild(btn);
                    });
                } else {
                    if (state.cleared[state.chapter]) {
                        const nextChapter = getNextChapter(state.chapter);
                        if (nextChapter) {
                            const btn = document.createElement('button');
                            btn.className = 'choice-btn';
                            btn.textContent = `▶️ 次の章 (${getChapterDisplayName(nextChapter)}) へ`;
                            btn.addEventListener('click', function() {
                                state.chapter = nextChapter;
                                state.stageIndex = 0;
                                render();
                                saveGame();
                            });
                            choicesContainer.appendChild(btn);
                        } else {
                            const btn = document.createElement('button');
                            btn.className = 'choice-btn';
                            btn.textContent = '🏁 全ての章をクリア済み（エンディングは確認済み）';
                            btn.style.background = '#cfb89e';
                            btn.style.pointerEvents = 'none';
                            choicesContainer.appendChild(btn);
                        }
                    } else {
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.textContent = '🔄 この章をやり直す';
                        btn.addEventListener('click', function() {
                            state.stageIndex = 0;
                            render();
                            saveGame();
                        });
                        choicesContainer.appendChild(btn);
                    }
                }
            }

            function getNextChapter(current) {
                const order = ['chapter1', 'chapter2', 'chapter3'];
                const idx = order.indexOf(current);
                return (idx !== -1 && idx < order.length - 1) ? order[idx + 1] : null;
            }

            function saveGame() {
                try {
                    localStorage.setItem(SAVE_KEY, JSON.stringify({
                        chapter: state.chapter,
                        stageIndex: state.stageIndex,
                        cleared: state.cleared
                    }));
                    saveStatus.textContent = '💾 セーブ完了';
                } catch(e) { console.warn('セーブ失敗', e); }
            }

            function loadGame() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (data.chapter && data.stageIndex !== undefined && data.cleared) {
                        state.chapter = data.chapter;
                        state.stageIndex = data.stageIndex;
                        state.cleared = data.cleared;
                        return true;
                    }
                } catch(e) {}
                return false;
            }

            function resetGame() {
                state = {
                    chapter: 'chapter1',
                    stageIndex: 0,
                    cleared: { chapter1: false, chapter2: false, chapter3: false }
                };
                localStorage.removeItem(SAVE_KEY);
                localStorage.removeItem(ENDING_SEEN_KEY);
                render();
                saveStatus.textContent = '🗑️ リセット完了';
            }

            let resetPending = false;
            resetBtn.addEventListener('click', function() {
                resetModal.style.display = 'flex';
                resetPending = true;
            });
            modalCancel.addEventListener('click', function() {
                resetModal.style.display = 'none';
                resetPending = false;
            });
            modalConfirm.addEventListener('click', function() {
                if (resetPending) {
                    resetGame();
                    resetModal.style.display = 'none';
                    resetPending = false;
                }
            });
            resetModal.addEventListener('click', function(e) {
                if (e.target === resetModal) {
                    resetModal.style.display = 'none';
                    resetPending = false;
                }
            });
            saveBtn.addEventListener('click', function() {
                saveGame();
                saveStatus.textContent = '💾 手動セーブ完了';
                setTimeout(() => { saveStatus.textContent = '💾 セーブ済み'; }, 1500);
            });

            (function init() {
                const loaded = loadGame();
                if (!loaded) {
                    resetGame();
                } else {
                    if (!STORY[state.chapter]) {
                        state.chapter = 'chapter1';
                        state.stageIndex = 0;
                    }
                    const ch = getChapterData(state.chapter);
                    if (state.stageIndex >= ch.stages.length) state.stageIndex = 0;
                    render();
                    saveStatus.textContent = '💾 セーブデータを復元';
                }
                saveGame();
            })();

        })();
    </script>
