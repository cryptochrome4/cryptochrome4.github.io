<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據列表加載器</title>
    <style>
        /* 全局基礎樣式設定 */
        body {
            background-color: #0d0626; 
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 垂直滾動容器調製 */
        .scroll-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 40px; 
            padding-bottom: 100px;
        }

        /* 核心數據區塊模組 */
        .team-block {
            background: linear-gradient(135deg, #18113c 0%, #0d0626 100%);
            border: 1px solid #2d245d;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 區塊頂部標題列 */
        .team-header {
            border-bottom: 2px solid #00ff66; 
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* 標題欄設定 */
        .team-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ff66;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        /* 雙列網格版面配置（左20、右20） */
        .member-list-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 20px; 
        }

        /* 單列數據流控制 */
        .member-column {
            display: flex;
            flex-direction: column;
        }

        /* 數據顯示列基礎樣式 */
        .word-row {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
        }

        .word-row:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.06); 
        }

        /* 標記符號樣式 (Ω) */
        .pos-badge {
            background-color: #00ff66;
            color: #0d0626;
            font-size: 13px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 2px;
            margin-right: 10px;
            min-width: 28px;
            text-align: center;
        }

        /* 唯讀文字欄位樣式 */
        .word-text {
            background: transparent;
            border: none;
            color: #ffffff; /* 正常的白色普通字體顏色 */
            font-size: 14px;
            padding: 4px;
            outline: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="scroll-container">

        <!-- ==================== 【批量生產起始線】 ==================== -->
        <div class="team-block">
            <div class="team-header">
                <!-- 標題部分，您可在 value="" 中寫入區塊名稱 -->
                <input type="text" class="team-title" value="數據節點一" readonly>
            </div>
            
            <div class="member-list-container">
                
                <!-- 左側數據列（共20項，請直接在 value="" 中寫入您的英語單字） -->
                <div class="member-column">
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="apple" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="banana" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="cherry" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                </div>
                                <!-- 右側數據列（共20項，請直接在 value="" 中寫入您的英語單字） -->
                <div class="member-column">
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-input" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                    <div class="word-row"><span class="pos-badge">Ω</span><input type="text" class="word-text" value="" readonly></div>
                </div>

            </div>
        </div>
        <!-- ==================== 【批量生產線終點】 ==================== -->

    </div>

    <!-- 🖼️ 4張偽裝圖片圖層（初始狀態下全部重疊） -->
    <!-- 請將「cover1.jpg〜4.jpg」替換為您想顯示的圖片文件名或網頁圖片網址 -->
    <div id="cover-4" class="camouflage-layer" style="background-image: url('cover4.jpg'); z-index: 9995;"></div> <!-- 第4張（最底層） -->
    <div id="cover-3" class="camouflage-layer" style="background-image: url('cover3.jpg'); z-index: 9996;"></div> <!-- 第3張 -->
    <div id="cover-2" class="camouflage-layer" style="background-image: url('cover2.jpg'); z-index: 9997;"></div> <!-- 第2張 -->
    <div id="cover-1" class="camouflage-layer" style="background-image: url('cover1.jpg'); z-index: 9998;"></div> <!-- 第1張（最頂層） -->

    <!-- 🕵️‍♂️ 4個秘密的透明按鈕（固定在屏幕上的絕對位置，完全透明） -->
    <!-- 1. 右上角的透明按鈕（消除第1張圖片） -->
    <div class="secret-btn" onclick="removeCover(1)" style="top: 0; right: 0; width: 80px; height: 80px;"></div>
    
    <!-- 2. 左側中央的透明按鈕（消除第2張圖片） -->
    <div class="secret-btn" onclick="removeCover(2)" style="top: 50%; left: 0; transform: translateY(-50%); width: 80px; height: 80px;"></div>
    
    <!-- 3. 右下角的透明按鈕（消除第3張圖片） -->
    <div class="secret-btn" onclick="removeCover(3)" style="bottom: 0; right: 0; width: 80px; height: 80px;"></div>
    
    <!-- 4. 屏幕正中央的透明按鈕（消除最後的第4張圖片） -->
    <div class="secret-btn" onclick="removeCover(4)" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px;"></div>

    <!-- 🎨 隱藏圖層與按鈕共用的CSS樣式 -->
    <style>
        .camouflage-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            pointer-events: none; /* 允許隨時點擊下方的透明按鈕 */
            transition: opacity 0.3s ease; /* 消失時帶有淡出效果 */
        }
        .secret-btn {
            position: fixed;
            background: transparent;
            cursor: default;
            z-index: 10000; /* 始終置於所有圖片的最前端 */
        }
    </style>

    <!-- ⚙️ 用於逐張消除對應圖片的腳本 -->
    <script>
        function removeCover(num) {
            const currentCover = document.getElementById('cover-' + num);
            if (currentCover) {
                currentCover.style.display = 'none';
            }
        }
    </script>

</body>
</html>
