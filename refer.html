<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據列表加載器</title>
    <style>
        /* 全局基礎樣式設定 */
        body {
            background-color: #0d0626; 
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 垂直滾動容器調製 */
        .scroll-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 40px; 
            padding-bottom: 100px;
        }

        /* 核心數據區塊模組 */
        .team-block {
            background: linear-gradient(135deg, #18113c 0%, #0d0626 100%);
            border: 1px solid #2d245d;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 區塊頂部標題列 */
        .team-header {
            border-bottom: 2px solid #00ff66; 
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* 標題欄設定 */
        .team-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ff66;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        /* 雙列網格版面配置（左20、右20） */
        .member-list-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 20px; 
        }

        /* 單列數據流控制 */
        .member-column {
            display: flex;
            flex-direction: column;
        }

        /* 數據顯示列基礎樣式 */
        .word-row {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
        }

        .word-row:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.06); 
        }

        /* 標記符號樣式 (Ω) */
        .pos-badge {
            background-color: #00ff66;
            color: #0d0626;
            font-size: 13px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 2px;
            margin-right: 10px;
            min-width: 28px;
            text-align: center;
        }

        /* 唯讀文字欄位樣式 */
        .word-text {
            background: transparent;
            border: none;
            color: #ffffff; /* 正常的白色普通字體顏色 */
            font-size: 14px;
            padding: 4px;
            outline: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="scroll-container">

        <!-- ==================== 【批量生產起始線】 ==================== -->
        <div class="team-block">
            <div class="team-header">
                <!-- 標題部分，您可在 value="" 中寫入區塊名稱 -->
                <input type="text" class="team-title" value="數據節點一" readonly>
            </div>
            
            <div class="member-list-container">
