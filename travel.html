<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>USA 50 States Puzzle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0c0f; color:#e0e0e0;
    font-family:'Segoe UI','Helvetica Neue',sans-serif;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }

  #loading {
    position:fixed; inset:0; z-index:2000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#0a0c0f; gap:20px;
  }
  #loading .spinner {
    width:48px; height:48px;
    border:3px solid rgba(0,230,176,0.2);
    border-top-color:#00e6b0;
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading p { color:#7a8b9b; font-size:13px; letter-spacing:0.2em; }

  #opening {
    position:fixed; inset:0; z-index:1000;
    background-image:url('img40x.jpg');
    background-size:cover; background-position:center;
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    gap:30px; transition:opacity 0.5s ease;
  }
  #opening::before {
    content:''; position:absolute; inset:0;
    background:rgba(0,0,0,0.55);
  }
  #opening h1 {
    position:relative; z-index:1;
    color:#00e6b0; font-size:clamp(36px,8vw,72px);
    font-weight:800; letter-spacing:8px;
    text-shadow:0 0 30px #00e6b0aa, 0 0 60px #00e6b055;
  }
  #opening .subtitle {
    position:relative; z-index:1;
    color:#b0c8d8; font-size:clamp(11px,2.5vw,16px);
    letter-spacing:4px; margin-top:-14px;
  }
  #startBtn {
    position:relative; z-index:1;
    background:#00e6b0; color:#0a0c0f;
    border:none; border-radius:50px;
    padding:18px 72px;
    font-size:clamp(16px,3.5vw,22px);
    font-weight:800; letter-spacing:4px;
    cursor:pointer; font-family:inherit;
    box-shadow:0 0 30px #00e6b0cc, 0 0 60px #00e6b066;
    transition:all 0.2s ease;
  }
  #startBtn:hover { transform:scale(1.06); box-shadow:0 0 50px #00e6b0ff, 0 0 100px #00e6b0aa; }
  #startBtn:active { transform:scale(0.98); }
  #opening.hidden-opening { opacity:0; pointer-events:none; }

  #game { display:none; position:fixed; inset:0; }
  #mapSvg {
    position:absolute; inset:0;
    width:100%; height:100%;
    background:#0b0f14;
    display:block;
    touch-action:none;
  }

  #pool {
    position:fixed;
    left:16px; top:16px;
    width:160px;
    padding:12px 10px;
    background:rgba(17,22,28,0.92);
    border:1px solid rgba(0,230,176,0.35);
    border-radius:16px;
    display:flex; flex-direction:column; gap:10px;
    backdrop-filter:blur(8px);
    box-shadow:0 8px 24px rgba(0,0,0,0.6);
    z-index:50;
    touch-action:none;
  }
  #pool h2 {
    font-size:11px; letter-spacing:0.3em;
    color:#00e6b0; text-align:center;
    padding-bottom:6px;
    border-bottom:1px solid rgba(0,230,176,0.3);
  }
  .poolSlot {
    position:relative;
    width:100%; height:90px;
    background:rgba(255,255,255,0.03);
    border:1px dashed rgba(0,230,176,0.35);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    touch-action:none;
    transition:background 0.15s;
  }
  .poolSlot.filled {
    border-style:solid;
    background:rgba(0,230,176,0.08);
    cursor:grab;
  }
  .poolSlot.filled:active { cursor:grabbing; }
  .poolSlot svg { pointer-events:none; display:block; }
  .poolSlot .label {
    position:absolute;
    bottom:3px; left:0; right:0;
    text-align:center;
    font-size:9px; letter-spacing:0.05em;
    color:#7ad7ff;
    pointer-events:none;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:0 4px;
  }

  .stateHole {
    fill:rgba(0,0,0,0.55);
    stroke:rgba(0,230,176,0.6);
    stroke-width:1.5;
    stroke-dasharray:6 5;
    vector-effect:non-scaling-stroke;
  }
  .stateGhost {
    fill:rgba(60,110,160,0.22);
    stroke:rgba(140,190,230,0.28);
    stroke-width:0.8;
    vector-effect:non-scaling-stroke;
  }
  .stateGhostAlaska {
    fill:rgba(230,57,70,0.35);
    stroke:rgba(255,180,180,0.5);
    stroke-width:0.8;
    vector-effect:non-scaling-stroke;
  }
  .statePlaced {
    fill:rgba(0,230,176,0.85);
    stroke:#d8ffe8;
    stroke-width:1.5;
    vector-effect:non-scaling-stroke;
  }
  .statePlacedAlaska {
    fill:rgba(230,57,70,0.9);
    stroke:#ffd8d8;
    stroke-width:1.5;
    vector-effect:non-scaling-stroke;
  }
  .stateGhostLabel {
    fill:rgba(180,210,235,0.38);
    font-size:9px; font-weight:500;
    pointer-events:none;
    text-anchor:middle;
  }
  .statePlacedLabel {
    fill:#0a0c0f;
    font-size:9px; font-weight:700;
    pointer-events:none;
    text-anchor:middle;
  }
  .statePlacedAlaskaLabel {
    fill:#fff;
    font-size:9px; font-weight:700;
    pointer-events:none;
    text-anchor:middle;
  }

  .canadaShape {
    fill:rgba(255,255,255,0.92);
    stroke:rgba(180,200,220,0.7);
    stroke-width:1.5;
    vector-effect:non-scaling-stroke;
  }
  .canadaLabel {
    fill:#0a0c0f;
    font-size:60px;
    font-weight:900;
    letter-spacing:0.4em;
    pointer-events:none;
    text-anchor:middle;
  }

  .dragPiece {
    fill:rgba(0,230,176,0.95);
    stroke:#e0fff8;
    stroke-width:2;
    vector-effect:non-scaling-stroke;
    filter:drop-shadow(0 6px 14px rgba(0,230,176,0.7));
    pointer-events:none;
  }
  .dragPieceAlaska {
    fill:rgba(230,57,70,0.95);
    stroke:#ffe0e0;
    stroke-width:2;
    vector-effect:non-scaling-stroke;
    filter:drop-shadow(0 6px 14px rgba(230,57,70,0.7));
    pointer-events:none;
  }

  #win {
    position:fixed; inset:0; z-index:500;
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(0,8,18,0.93);
    backdrop-filter:blur(8px);
    text-align:center; padding:20px;
  }
  #win.show { display:flex; }
  #win h1 {
    font-size:clamp(32px,8vw,80px);
    letter-spacing:0.15em;
    background:linear-gradient(90deg,#00e6b0,#7ad7ff,#00e6b0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:18px;
    animation:pulse 1.6s infinite alternate;
  }
  #win p { color:#9fd8ff; font-size:clamp(13px,2.5vw,18px); letter-spacing:0.2em; }
  @keyframes pulse { from{filter:brightness(1)} to{filter:brightness(1.4)} }

  #winFooter {
    position:absolute;
    bottom:0; left:0; right:0;
    height:56px;
    background:rgba(8,12,20,0.85);
    border-top:1px solid rgba(0,230,176,0.3);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
  }
  #winFooter a {
    color:#00e6b0; font-size:14px; letter-spacing:0.25em;
    text-decoration:none; padding:10px 28px;
    border:1px solid rgba(0,230,176,0.5);
    border-radius:20px;
    transition:background 0.2s;
  }
  #winFooter a:hover { background:rgba(0,230,176,0.18); }

  #hint {
    position:fixed; right:16px; top:16px;
    z-index:70;
    font-size:11px;
    color:#7a8b9b;
    letter-spacing:0.1em;
    text-align:right;
    line-height:1.7;
    background:rgba(8,12,20,0.6);
    padding:10px 14px;
    border-radius:8px;
    border:1px solid rgba(0,230,176,0.2);
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>LOADING MAP DATA...</p>
</div>

<div id="opening">
  <h1>USA PUZZLE</h1>
  <div class="subtitle">- 50 STATES -</div>
  <button id="startBtn">はじめる</button>
</div>

<div id="game">
  <svg id="mapSvg" preserveAspectRatio="xMidYMid slice"></svg>

  <aside id="pool">
    <h2>POOL</h2>
    <div class="poolSlot" data-slot="0"></div>
    <div class="poolSlot" data-slot="1"></div>
    <div class="poolSlot" data-slot="2"></div>
    <div class="poolSlot" data-slot="3"></div>
  </aside>

  <div id="hint">
    ← ↑ ↓ → で移動<br>
    州を長押ししてドラッグ
  </div>
</div>

<div id="win">
  <h1>COMPLETE!</h1>
  <p>50 STATES PUZZLE CLEARED</p>
  <div id="winFooter">
    <a href="air.html" target="_self">AIR へ進む</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>

<script>
(async function () {
  const loading = document.getElementById("loading");
  const opening = document.getElementById("opening");
  const startBtn = document.getElementById("startBtn");
  const game = document.getElementById("game");
  const mapSvg = document.getElementById("mapSvg");
  const poolEl = document.getElementById("pool");
  const winEl = document.getElementById("win");

  const SVG_NS = "http://www.w3.org/2000/svg";

  let usTopo, worldTopo;

  try {
    const [usRes, worldRes] = await Promise.all([
      fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"),
      fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
    ]);
    if (!usRes.ok) throw new Error("us-atlas fetch failed: " + usRes.status);
    if (!worldRes.ok) throw new Error("world-atlas fetch failed: " + worldRes.status);
    usTopo = await usRes.json();
    worldTopo = await worldRes.json();
  } catch (e) {
    loading.innerHTML = "<p style='color:#ff4d6d;text-align:center;padding:20px'>データの読み込みに失敗しました<br><small style='color:#7a8b9b'>" + e.message + "</small></p>";
    console.error(e);
    return;
  }

  // 投影
  const projection = d3.geoAlbersUsa().scale(1300).translate([487.5, 305]);
  const pathGen = d3.geoPath(projection);

  // 全州
  const statesFeatures = topojson.feature(usTopo, usTopo.objects.states).features;

  const EXCLUDE_FIPS = new Set(["15"]); // Hawaii
  const ALASKA_FIPS = "02";

  const FIPS_NAME = {
    "01":"Alabama","02":"Alaska","04":"Arizona","05":"Arkansas","06":"California",
    "08":"Colorado","09":"Connecticut","10":"Delaware","12":"Florida","13":"Georgia",
    "16":"Idaho","17":"Illinois","18":"Indiana","19":"Iowa","20":"Kansas",
    "21":"Kentucky","22":"Louisiana","23":"Maine","24":"Maryland","25":"Massachusetts",
    "26":"Michigan","27":"Minnesota","28":"Mississippi","29":"Missouri","30":"Montana",
    "31":"Nebraska","32":"Nevada","33":"New Hampshire","34":"New Jersey","35":"New Mexico",
    "36":"New York","37":"North Carolina","38":"North Dakota","39":"Ohio","40":"Oklahoma",
    "41":"Oregon","42":"Pennsylvania","44":"Rhode Island","45":"South Carolina",
    "46":"South Dakota","47":"Tennessee","48":"Texas","49":"Utah","50":"Vermont",
    "51":"Virginia","53":"Washington","54":"West Virginia","55":"Wisconsin","56":"Wyoming"
  };

  const STATES = [];
  statesFeatures.forEach(f => {
    const fips = f.id;
    if (EXCLUDE_FIPS.has(fips)) return;
    const name = FIPS_NAME[fips];
    if (!name) return;

    const d = pathGen(f);
    if (!d) return;

    const tempPath = document.createElementNS(SVG_NS, "path");
    tempPath.setAttribute("d", d);
    mapSvg.appendChild(tempPath);
    const bb = tempPath.getBBox();
    mapSvg.removeChild(tempPath);

    STATES.push({
      fips, name, d,
      bbox: { x: bb.x, y: bb.y, w: bb.width, h: bb.height },
      cx: bb.x + bb.width / 2,
      cy: bb.y + bb.height / 2,
    });
  });

  // カナダ
  const canadaFeature = topojson.feature(worldTopo, worldTopo.objects.countries)
    .features.find(f => f.properties.name === "Canada");
  const canadaPath = pathGen(canadaFeature);

  const tempCan = document.createElementNS(SVG_NS, "path");
  tempCan.setAttribute("d", canadaPath);
  mapSvg.appendChild(tempCan);
  const canBB = tempCan.getBBox();
  mapSvg.removeChild(tempCan);

  // world サイズ
  const allBoxes = STATES.map(s => s.bbox).concat([canBB]);
  const worldMinX = Math.min(...allBoxes.map(b => b.x));
  const worldMinY = Math.min(...allBoxes.map(b => b.y));
  const worldMaxX = Math.max(...allBoxes.map(b => b.x + b.w));
  const worldMaxY = Math.max(...allBoxes.map(b => b.y + b.h));

  const PAD = 40;
  const WORLD_W = worldMaxX - worldMinX + PAD * 2;
  const WORLD_H = worldMaxY - worldMinY + PAD * 2;
  const VB_X = worldMinX - PAD;
  const VB_Y = worldMinY - PAD;

  const VIEW_W = WORLD_W / 2.2;
  const VIEW_H = WORLD_H / 2.2;

  STATES.forEach(s => { s.home = [s.cx, s.cy]; });

  let activeStates = [];
  let placedCount = 0;
  const CAMERA = { x: 0, y: 0, speed: 18 };
  const keys = {};

  function pickRandomStates(n) {
    const arr = [...STATES];
    const picked = [];
    while (picked.length < n && arr.length) {
      const i = Math.floor(Math.random() * arr.length);
      picked.push(arr.splice(i, 1)[0]);
    }
    return picked;
  }

  function buildMap() {
    mapSvg.innerHTML = "";

    const bg = document.createElementNS(SVG_NS, "rect");
    bg.setAttribute("x", VB_X); bg.setAttribute("y", VB_Y);
    bg.setAttribute("width", WORLD_W); bg.setAttribute("height", WORLD_H);
    bg.setAttribute("fill", "#0b0f14");
    mapSvg.appendChild(bg);

    const can = document.createElementNS(SVG_NS, "path");
    can.setAttribute("d", canadaPath);
    can.setAttribute("class", "canadaShape");
    mapSvg.appendChild(can);

    const canLabel = document.createElementNS(SVG_NS, "text");
    canLabel.setAttribute("x", canBB.x + canBB.width / 2);
    canLabel.setAttribute("y", canBB.y + canBB.height / 2);
    canLabel.setAttribute("class", "canadaLabel");
    canLabel.textContent = "CANADA";
    mapSvg.appendChild(canLabel);

    const holeNames = new Set(activeStates.map(s => s.name));

    STATES.forEach(st => {
      const isAlaska = st.fips === ALASKA_FIPS;

      if (holeNames.has(st.name)) {
        const hole = document.createElementNS(SVG_NS, "path");
        hole.setAttribute("d", st.d);
        hole.setAttribute("class", "stateHole");
        hole.dataset.stateName = st.name;
        mapSvg.appendChild(hole);
      } else {
        const ghost = document.createElementNS(SVG_NS, "path");
        ghost.setAttribute("d", st.d);
        ghost.setAttribute("class", isAlaska ? "stateGhostAlaska" : "stateGhost");
        mapSvg.appendChild(ghost);

        if (st.bbox.w > 15 && st.bbox.h > 15) {
          const label = document.createElementNS(SVG_NS, "text");
          label.setAttribute("x", st.cx);
          label.setAttribute("y", st.cy);
          label.setAttribute("class", "stateGhostLabel");
          label.textContent = st.name;
          mapSvg.appendChild(label);
        }
      }
    });
  }

  function buildPool() {
    const slots = poolEl.querySelectorAll(".poolSlot");
    slots.forEach((slot, i) => {
      slot.innerHTML = "";
      slot.classList.remove("filled");
      delete slot.dataset.stateName;
      const st = activeStates[i];
      if (!st) return;

      const isAlaska = st.fips === ALASKA_FIPS;

      const svgEl = document.createElementNS(SVG_NS, "svg");
      const pad = Math.max(st.bbox.w, st.bbox.h) * 0.1;
      svgEl.setAttribute("viewBox",
        `${st.bbox.x - pad} ${st.bbox.y - pad} ${st.bbox.w + pad*2} ${st.bbox.h + pad*2}`);
      svgEl.setAttribute("width", "100%");
      svgEl.setAttribute("height", "72%");
      svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");

      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", st.d);
      if (isAlaska) {
        path.setAttribute("style", "fill:rgba(230,57,70,0.85);stroke:#ffd8d8;stroke-width:0.5;");
      } else {
        path.setAttribute("style", "fill:rgba(0,230,176,0.7);stroke:#d8ffe8;stroke-width:0.5;");
      }
      svgEl.appendChild(path);
      slot.appendChild(svgEl);

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = st.name;
      slot.appendChild(label);

      slot.classList.add("filled");
      slot.dataset.stateName = st.name;
      attachDrag(slot, st);
    });
  }

  let dragState = null;

  function attachDrag(el, state) {
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (dragState) return;

      el.setPointerCapture(e.pointerId);

      const worldPt = screenToWorld(e.clientX, e.clientY);
      const dx = worldPt.x - state.cx;
      const dy = worldPt.y - state.cy;

      const piece = document.createElementNS(SVG_NS, "path");
      piece.setAttribute("d", state.d);
      piece.setAttribute("transform", `translate(${dx} ${dy})`);
      piece.setAttribute("class", state.fips === ALASKA_FIPS ? "dragPieceAlaska" : "dragPiece");
      mapSvg.appendChild(piece);

      dragState = { state, el, piece, pointerId: e.pointerId };

      el.style.opacity = "0.3";
      el.addEventListener("pointermove", onDragMove);
      el.addEventListener("pointerup", onDragEnd);
      el.addEventListener("pointercancel", onDragEnd);
    });
  }

  function onDragMove(e) {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    e.preventDefault();
    const worldPt = screenToWorld(e.clientX, e.clientY);
    const dx = worldPt.x - dragState.state.cx;
    const dy = worldPt.y - dragState.state.cy;
    dragState.piece.setAttribute("transform", `translate(${dx} ${dy})`);
  }

  function onDragEnd(e) {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    e.preventDefault();

    const st = dragState.state;
    const worldPt = screenToWorld(e.clientX, e.clientY);
    const dx = worldPt.x - st.cx;
    const dy = worldPt.y - st.cy;
    const dist = Math.hypot(dx, dy);
    const threshold = Math.max(st.bbox.w, st.bbox.h) * 0.7;

    if (dist < threshold) {
      placeState(st);
    } else {
      dragState.el.style.opacity = "";
    }

    dragState.piece.remove();
    dragState = null;

    e.target.removeEventListener("pointermove", onDragMove);
    e.target.removeEventListener("pointerup", onDragEnd);
    e.target.removeEventListener("pointercancel", onDragEnd);
  }

  function placeState(st) {
    const holes = mapSvg.querySelectorAll(".stateHole");
    let targetHole = null;
    holes.forEach(h => {
      if (h.dataset.stateName === st.name) targetHole = h;
    });
    if (!targetHole) return;

    const isAlaska = st.fips === ALASKA_FIPS;
    targetHole.setAttribute("class", isAlaska ? "statePlacedAlaska" : "statePlaced");
    delete targetHole.dataset.stateName;

    if (st.bbox.w > 15 && st.bbox.h > 15) {
      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("x", st.cx);
      label.setAttribute("y", st.cy);
      label.setAttribute("class", isAlaska ? "statePlacedAlaskaLabel" : "statePlacedLabel");
      label.textContent = st.name;
      mapSvg.appendChild(label);
    }

    const slot = poolEl.querySelector(`.poolSlot[data-state-name="${st.name}"]`);
    if (slot) {
      slot.innerHTML = "";
      slot.classList.remove("filled");
      delete slot.dataset.stateName;
      slot.style.opacity = "";
    }

    placedCount++;
    if (placedCount >= activeStates.length) {
      setTimeout(() => winEl.classList.add("show"), 400);
    }
  }

  function clampCamera() {
    const minX = VB_X;
    const minY = VB_Y;
    const maxX = VB_X + WORLD_W - VIEW_W;
    const maxY = VB_Y + WORLD_H - VIEW_H;
    CAMERA.x = Math.max(minX, Math.min(maxX, CAMERA.x));
    CAMERA.y = Math.max(minY, Math.min(maxY, CAMERA.y));
  }

  function applyCamera() {
    mapSvg.setAttribute("viewBox", `${CAMERA.x} ${CAMERA.y} ${VIEW_W} ${VIEW_H}`);
  }

  function screenToWorld(sx, sy) {
    const pt = mapSvg.createSVGPoint();
    pt.x = sx; pt.y = sy;
    const inv = mapSvg.getScreenCTM().inverse();
    const w = pt.matrixTransform(inv);
    return { x: w.x, y: w.y };
  }

  function updateCamera() {
    let dx = 0, dy = 0;
    if (keys["ArrowLeft"])  dx -= 1;
    if (keys["ArrowRight"]) dx += 1;
    if (keys["ArrowUp"])    dy -= 1;
    if (keys["ArrowDown"])  dy += 1;

    if (dx || dy) {
      CAMERA.x += dx * CAMERA.speed;
      CAMERA.y += dy * CAMERA.speed;
      clampCamera();
      applyCamera();
    }
    requestAnimationFrame(updateCamera);
  }

  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  });
  window.addEventListener("keyup", e => { keys[e.key] = false; });

  function startGame() {
    activeStates = pickRandomStates(4);
    placedCount = 0;

    opening.classList.add("hidden-opening");
    game.style.display = "block";

    CAMERA.x = VB_X + (WORLD_W - VIEW_W) / 2;
    CAMERA.y = VB_Y + (WORLD_H - VIEW_H) / 2;
    clampCamera();
    applyCamera();

    buildMap();
    buildPool();

    requestAnimationFrame(updateCamera);

    setTimeout(() => { opening.style.display = "none"; }, 500);
  }

  startBtn.addEventListener("click", startGame);

  loading.style.display = "none";
  opening.style.display = "flex";
})();
</script>
</body>
</html>
