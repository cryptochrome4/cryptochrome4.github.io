<html lang="ja">

<title>USA 50 States Puzzle</title>
<style>

  }

    content:''; position:absolute; inset:0;
    background:rgba(0,0,0,0.55);
  }
  #opening h1 {
    position:relative; z-index:1;
    color:#00e6b0; font-size:clamp(36px,8vw,72px);
    font-weight:800; letter-spacing:8px;
    text-shadow:0 0 30px #00e6b0aa, 0 0 60px #00e6b055;
  }
  #opening .subtitle {
    position:relative; z-index:1;
    color:#b0c8d8; font-size:clamp(11px,2.5vw,16px);
    letter-spacing:4px; margin-top:-14px;
  }
  #startBtn {
    position:relative; z-index:1;
    background:#00e6b0; color:#0a0c0f;
    border:none; border-radius:50px;
    padding:18px 72px;
    font-size:clamp(16px,3.5vw,22px);
    font-weight:800; letter-spacing:4px;
    cursor:pointer; font-family:inherit;
    box-shadow:0 0 30px #00e6b0cc, 0 0 60px #00e6b066;
    transition:all 0.2s ease;
  }
  #startBtn:hover { transform:scale(1.06); box-shadow:0 0 50px #00e6b0ff, 0 0 100px #00e6b0aa; }
  #startBtn:active { transform:scale(0.98); }
  #opening.hidden-opening { opacity:0; pointer-events:none; }

  /* ===== Game ===== */
  #game {
    display:none;
    position:fixed; inset:0;
  }
  #mapSvg {
    position:absolute; inset:0;
    width:100%; height:100%;
    background:#0b0f14;
    display:block;
    touch-action:none;
  }

  #pool {
    position:fixed;
    left:16px; top:16px;

    color:#00e6b0; text-align:center;

    border-bottom:1px solid rgba(0,230,176,0.3);

  .poolSlot {
    position:relative;
    width:100%; height:90px;

    border:1px dashed rgba(0,230,176,0.35);

  { name:"Maine",         pts:"-0.3,-0.6 0.4,-0.6 0.4,0.4 0.0,0.6 -0.3,0.3", area:0.25 },
  { name:"South Carolina",pts:"-0.4,-0.4 0.4,-0.4 0.4,0.4 -0.4,0.4", area:0.24 },
  { name:"West Virginia", pts:"-0.4,-0.4 0.4,-0.4 0.4,0.4 -0.4,0.4", area:0.22 },
  { name:"Maryland",      pts:"-0.5,-0.3 0.5,-0.3 0.5,0.3 -0.5,0.3", area:0.18 },
  { name:"Vermont",       pts:"-0.3,-0.5 0.3,-0.5 0.3,0.5 -0.3,0.5", area:0.15 },
  { name:"New Hampshire", pts:"-0.3,-0.5 0.3,-0.5 0.3,0.5 -0.3,0.5", area:0.15 },
  { name:"Massachusetts", pts:"-0.5,-0.3 0.5,-0.3 0.5,0.3 -0.5,0.3", area:0.14 },
  { name:"New Jersey",    pts:"-0.3,-0.5 0.3,-0.5 0.4,0.5 -0.3,0.5", area:0.13 },
  { name:"Connecticut",   pts:"-0.4,-0.3 0.4,-0.3 0.4,0.3 -0.4,0.3", area:0.10 },
  { name:"Delaware",      pts:"-0.2,-0.5 0.2,-0.5 0.2,0.5 -0.2,0.5", area:0.06 },
  { name:"Rhode Island",  pts:"-0.3,-0.3 0.3,-0.3 0.3,0.3 -0.3,0.3", area:0.04 },
];

/* =========================================================
   グリッド配置
   8列 × 7行 = 56セル（50州 + 余白）
   各セルは最大 260×260
   ========================================================= */
const GRID_COLS = 8;
const GRID_ROWS = 7;
const CELL_MAX = 260;
const WORLD_W = GRID_COLS * CELL_MAX;
const WORLD_H = GRID_ROWS * CELL_MAX;

// 各州にグリッド位置を割り当て（ランダムシャッフル）
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 50州をグリッドの56セルにランダム配置
const gridCells = [];
for (let r = 0; r < GRID_ROWS; r++) {
  for (let c = 0; c < GRID_COLS; c++) {
    gridCells.push({ r, c });
  }
}
const shuffledCells = shuffle(gridCells);

// 各州に home を割り当て（セル中心を基準に、サイズでスケール）
// 州のサイズ = area を 0.3..1.0 にマップ → CELL_MAX * scale
const STATES = STATE_DATA.map((s, i) => {
  const cell = shuffledCells[i];
  const cx = cell.c * CELL_MAX + CELL_MAX / 2;
  const cy = cell.r * CELL_MAX + CELL_MAX / 2;
  // area(0.04..1.0) → 0.45..1.0 にマップ
  const scale = 0.45 + (s.area - 0.04) / (1.0 - 0.04) * 0.55;
  return {
    name: s.name,
    pts: s.pts,
    area: s.area,
    home: [cx, cy],
    scale: scale * CELL_MAX * 0.42, // 半径
  };
});

/* =========================================================
   セットアップ
   ========================================================= */
const mapSvg = document.getElementById("mapSvg");
const poolEl = document.getElementById("pool");
const winEl = document.getElementById("win");
const opening = document.getElementById("opening");
const game = document.getElementById("game");

const SVG_NS = "http://www.w3.org/2000/svg";

// ビュー（窓）サイズ：3×3 セル分
const VIEW_W = CELL_MAX * 3;
const VIEW_H = CELL_MAX * 3;

let activeStates = [];
let placedCount = 0;

// カメラ（world座標）
const CAMERA = {
  x: 0, y: 0,
  speed: 18,
};

const keys = {};

/* =========================================================
   ユーティリティ
   ========================================================= */
function pickRandomStates(n) {
  const arr = [...STATES];
  const picked = [];
  while (picked.length < n && arr.length) {
    const i = Math.floor(Math.random() * arr.length);
    picked.push(arr.splice(i, 1)[0]);
  }
  return picked;
}

// 正規化座標 → world座標の path
function statePath(st, cx = null, cy = null) {
  const c = cx !== null ? cx : st.home[0];
  const cY = cy !== null ? cy : st.home[1];
  const pts = st.pts.trim().split(/\s+/).map(p => {
    const [x, y] = p.split(",").map(Number);
    return [c + x * st.scale, cY + y * st.scale];
  });
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) d += ` L ${pts[i][0]} ${pts[i][1]}`;
  return d + " Z";
}

// 州の bbox（world座標）
function stateBBox(st, cx = null, cy = null) {
  const c = cx !== null ? cx : st.home[0];
  const cY = cy !== null ? cy : st.home[1];
  const pts = st.pts.trim().split(/\s+/).map(p => {
    const [x, y] = p.split(",").map(Number);
    return [c + x * st.scale, cY + y * st.scale];
  });
  const xs = pts.map(p => p[0]);
  const ys = pts.map(p => p[1]);
  return {
    minX: Math.min(...xs), maxX: Math.max(...xs),
    minY: Math.min(...ys), maxY: Math.max(...ys),
  };
}

/* =========================================================
   マップ描画
   ========================================================= */
function buildMap() {
  mapSvg.innerHTML = "";

  // 背景グリッド
  const defs = document.createElementNS(SVG_NS, "defs");
  const pattern = document.createElementNS(SVG_NS, "pattern");
  pattern.setAttribute("id", "grid");
  pattern.setAttribute("width", CELL_MAX);
  pattern.setAttribute("height", CELL_MAX);
  pattern.setAttribute("patternUnits", "userSpaceOnUse");
  const pp = document.createElementNS(SVG_NS, "path");
  pp.setAttribute("d", `M ${CELL_MAX} 0 L 0 0 0 ${CELL_MAX}`);
  pp.setAttribute("fill", "none");
  pp.setAttribute("stroke", "rgba(0,230,176,0.08)");
  pp.setAttribute("stroke-width", "1");
  pattern.appendChild(pp);
  defs.appendChild(pattern);
  mapSvg.appendChild(defs);

  const bg = document.createElementNS(SVG_NS, "rect");
  bg.setAttribute("x", 0); bg.setAttribute("y", 0);
  bg.setAttribute("width", WORLD_W); bg.setAttribute("height", WORLD_H);
  bg.setAttribute("fill", "url(#grid)");
  mapSvg.appendChild(bg);

  // 穴の対象名
  const holeNames = new Set(activeStates.map(s => s.name));

  // 全州を描画
  STATES.forEach(st => {
    if (holeNames.has(st.name)) {
      // 穴
      const hole = document.createElementNS(SVG_NS, "path");
      hole.setAttribute("d", statePath(st));
      hole.setAttribute("class", "stateHole");
      hole.dataset.stateName = st.name;
      mapSvg.appendChild(hole);
    } else {
      // 背景の他州
      const ghost = document.createElementNS(SVG_NS, "path");
      ghost.setAttribute("d", statePath(st));
      ghost.setAttribute("class", "stateGhost");
      mapSvg.appendChild(ghost);

      const bb = stateBBox(st);
      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("x", (bb.minX + bb.maxX) / 2);
      label.setAttribute("y", (bb.minY + bb.maxY) / 2);
      label.setAttribute("class", "stateGhostLabel");
      label.textContent = st.name;
      mapSvg.appendChild(label);
    }
  });
}

/* =========================================================
   POOL描画
   ========================================================= */
function buildPool() {
  const slots = poolEl.querySelectorAll(".poolSlot");
  slots.forEach((slot, i) => {
    slot.innerHTML = "";
    slot.classList.remove("filled");
    delete slot.dataset.stateName;
    const st = activeStates[i];
    if (!st) return;

    // POOL用の小さい SVG
    const svgEl = document.createElementNS(SVG_NS, "svg");
    svgEl.setAttribute("viewBox", "-1.2 -1.2 2.4 2.4");
    svgEl.setAttribute("width", "100%");
    svgEl.setAttribute("height", "72%");
    svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");

    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", statePath(st, 0, 0));
    path.setAttribute("class", "stateGhost");
    path.setAttribute("style", "fill:rgba(0,230,176,0.7);stroke:#d8ffe8;stroke-width:1.5;");
    svgEl.appendChild(path);

    slot.appendChild(svgEl);

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = st.name;
    slot.appendChild(label);

    slot.classList.add("filled");
    slot.dataset.stateName = st.name;

    attachDrag(slot, st);
  });
}

/* =========================================================
   ドラッグ（pointer イベントに統一）
   ========================================================= */
let dragState = null;

function attachDrag(el, state) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (dragState) return;

    el.setPointerCapture(e.pointerId);

    const worldPt = screenToWorld(e.clientX, e.clientY);

    // ドラッグ中の州を SVG に追加
    const piece = document.createElementNS(SVG_NS, "path");
    piece.setAttribute("d", statePath(state, worldPt.x, worldPt.y));
    piece.setAttribute("class", "dragPiece");
    mapSvg.appendChild(piece);

    dragState = {
      state,
      el,
      piece,
      offsetX: 0,
      offsetY: 0,
      pointerId: e.pointerId,
    };

    el.style.opacity = "0.3";

    el.addEventListener("pointermove", onDragMove);
    el.addEventListener("pointerup", onDragEnd);
    el.addEventListener("pointercancel", onDragEnd);
  });
}

function onDragMove(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  e.preventDefault();
  const worldPt = screenToWorld(e.clientX, e.clientY);
  dragState.piece.setAttribute("d", statePath(dragState.state, worldPt.x, worldPt.y));
}

function onDragEnd(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  e.preventDefault();

  const st = dragState.state;
  const worldPt = screenToWorld(e.clientX, e.clientY);

  const dx = worldPt.x - st.home[0];
  const dy = worldPt.y - st.home[1];
  const dist = Math.hypot(dx, dy);
  const threshold = st.scale * 1.4;

  if (dist < threshold) {
    placeState(st);
  } else {
    dragState.el.style.opacity = "";
  }

  dragState.piece.remove();
  dragState = null;

  e.target.removeEventListener("pointermove", onDragMove);
  e.target.removeEventListener("pointerup", onDragEnd);
  e.target.removeEventListener("pointercancel", onDragEnd);
}

function placeState(st) {
  const holes = mapSvg.querySelectorAll(".stateHole");
  let targetHole = null;
  holes.forEach(h => {
    if (h.dataset.stateName === st.name) targetHole = h;
  });
  if (!targetHole) return;

  targetHole.setAttribute("class", "statePlaced");
  delete targetHole.dataset.stateName;

  const bb = stateBBox(st);
  const label = document.createElementNS(SVG_NS, "text");
  label.setAttribute("x", (bb.minX + bb.maxX) / 2);
  label.setAttribute("y", (bb.minY + bb.maxY) / 2);
  label.setAttribute("class", "statePlacedLabel");
  label.textContent = st.name;
  mapSvg.appendChild(label);

  const slot = poolEl.querySelector(`.poolSlot[data-state-name="${st.name}"]`);
  if (slot) {
    slot.innerHTML = "";
    slot.classList.remove("filled");
    delete slot.dataset.stateName;
    slot.style.opacity = "";
  }

  placedCount++;
  if (placedCount >= activeStates.length) {
    setTimeout(() => winEl.classList.add("show"), 400);
  }
}

/* =========================================================
   カメラ（viewBox 方式）
   ========================================================= */
function clampCamera() {
  const maxX = Math.max(0, WORLD_W - VIEW_W);
  const maxY = Math.max(0, WORLD_H - VIEW_H);
  CAMERA.x = Math.max(0, Math.min(maxX, CAMERA.x));
  CAMERA.y = Math.max(0, Math.min(maxY, CAMERA.y));
}

function applyCamera() {
  mapSvg.setAttribute("viewBox", `${CAMERA.x} ${CAMERA.y} ${VIEW_W} ${VIEW_H}`);
}

// 画面座標 → world座標（SVGの CTM を使う）
function screenToWorld(sx, sy) {
  const pt = mapSvg.createSVGPoint();
  pt.x = sx; pt.y = sy;
  const inv = mapSvg.getScreenCTM().inverse();
  const w = pt.matrixTransform(inv);
  return { x: w.x, y: w.y };
}

function updateCamera() {
  let dx = 0, dy = 0;
  if (keys["ArrowLeft"])  dx -= 1;
  if (keys["ArrowRight"]) dx += 1;
  if (keys["ArrowUp"])    dy -= 1;
  if (keys["ArrowDown"])  dy += 1;

  if (dx || dy) {
    CAMERA.x += dx * CAMERA.speed;
    CAMERA.y += dy * CAMERA.speed;
    clampCamera();
    applyCamera();
  }
  requestAnimationFrame(updateCamera);
}

window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

/* =========================================================
   初期化
   ========================================================= */
function startGame() {
  activeStates = pickRandomStates(4);
  placedCount = 0;

  opening.classList.add("hidden-opening");
  game.style.display = "block";

  // 初期カメラを中央付近に
  CAMERA.x = (WORLD_W - VIEW_W) / 2;
  CAMERA.y = (WORLD_H - VIEW_H) / 2;
  clampCamera();
  applyCamera();

  buildMap();
  buildPool();

  requestAnimationFrame(updateCamera);

  setTimeout(() => { opening.style.display = "none"; }, 500);
}

document.getElementById("startBtn").addEventListener("click", startGame);
</script>
