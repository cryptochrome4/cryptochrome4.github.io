<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>USA 50 States Puzzle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background:#111; color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== Opening ===== */
  #opening {
    position:fixed; inset:0; z-index:1000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#000;
    transition:opacity 0.5s ease;
  }
  #opening.hidden { opacity:0; pointer-events:none; }
  #opening img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0.55;
  }
  #opening .content {
    position:relative; z-index:2;
    display:flex; flex-direction:column;
    align-items:center; gap:32px;
  }
  #opening h1 {
    font-size:clamp(24px,5vw,56px);
    letter-spacing:0.08em;
    text-shadow:0 4px 20px rgba(0,0,0,0.9);
    text-align:center;
  }
  #startBtn {
    padding:18px 64px;
    font-size:clamp(18px,2.5vw,28px);
    font-weight:700;
    letter-spacing:0.15em;
    color:#fff;
    background:linear-gradient(135deg,#3a7bd5,#00d2ff);
    border:none; border-radius:60px;
    cursor:pointer;
    box-shadow:0 8px 32px rgba(0,210,255,0.45);
    transition:transform 0.15s, box-shadow 0.15s;
  }
  #startBtn:hover { transform:scale(1.06); box-shadow:0 12px 40px rgba(0,210,255,0.7); }
  #startBtn:active { transform:scale(0.97); }

  /* ===== Game ===== */
  #game { display:none; width:100%; height:100%; position:relative; }
  #viewport {
    position:absolute; inset:0;
    overflow:hidden;
    background:radial-gradient(circle at 30% 20%, #1b2735 0%, #090a0f 80%);
  }
  #world {
    position:absolute; top:0; left:0;
    width:5000px; height:3000px;
    transform-origin:0 0;
    will-change:transform;
  }

  /* ===== POOL ===== */
  #pool {
    position:fixed;
    left:0; top:0; bottom:0;
    width:220px;
    background:rgba(10,14,22,0.92);
    border-right:1px solid rgba(80,180,255,0.35);
    z-index:50;
    display:flex; flex-direction:column;
    padding:12px;
    gap:10px;
    overflow-y:auto;
    backdrop-filter:blur(6px);
    touch-action:none;
  }
  #pool h2 {
    font-size:13px; letter-spacing:0.2em;
    color:#5ec8ff; text-align:center;
    padding-bottom:8px;
    border-bottom:1px solid rgba(80,180,255,0.3);
  }
  .poolSlot {
    position:relative;
    width:100%; height:110px;
    background:rgba(255,255,255,0.04);
    border:1px dashed rgba(120,180,255,0.35);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    touch-action:none;
  }
  .poolSlot.filled {
    border-style:solid;
    background:rgba(60,140,220,0.12);
    cursor:grab;
  }
  .poolSlot.filled:active { cursor:grabbing; }
  .poolSlot svg { pointer-events:none; display:block; }
  .poolSlot .label {
    position:absolute;
    bottom:4px; left:0; right:0;
    text-align:center;
    font-size:11px; letter-spacing:0.08em;
    color:#9fd8ff;
    pointer-events:none;
  }

  /* ===== SVG 州 ===== */
  .stateShape {
    fill:rgba(70,150,230,0.85);
    stroke:#bfe6ff;
    stroke-width:1.5;
    vector-effect:non-scaling-stroke;
  }
  .stateHole {
    fill:rgba(0,0,0,0.55);
    stroke:rgba(120,200,255,0.5);
    stroke-width:1.5;
    stroke-dasharray:5 4;
    vector-effect:non-scaling-stroke;
  }
  .stateLabel {
    fill:#cfeaff;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.05em;
    pointer-events:none;
    text-anchor:middle;
    paint-order:stroke;
    stroke:#04121f;
    stroke-width:3px;
    stroke-linejoin:round;
  }
  .canadaShape {
    fill:rgba(120,140,160,0.18);
    stroke:rgba(180,200,220,0.4);
    stroke-width:1.2;
    vector-effect:non-scaling-stroke;
  }
  .canadaLabel {
    fill:rgba(200,220,240,0.5);
    font-size:22px;
    font-weight:700;
    letter-spacing:0.3em;
    pointer-events:none;
    text-anchor:middle;
  }

  /* ドラッグ中の州 */
  #dragLayer {
    position:fixed; inset:0;
    pointer-events:none;
    z-index:200;
  }
  #dragLayer svg {
    position:absolute;
    left:0; top:0;
    filter:drop-shadow(0 8px 18px rgba(0,180,255,0.7));
    pointer-events:none;
  }

  /* ===== Footer ===== */
  #footer {
    position:fixed;
    bottom:0; left:0; right:0;
    height:44px;
    background:rgba(8,12,20,0.85);
    border-top:1px solid rgba(80,180,255,0.3);
    display:flex; align-items:center; justify-content:center;
    z-index:60;
    backdrop-filter:blur(6px);
  }
  #footer a {
    color:#7fd4ff;
    font-size:13px;
    letter-spacing:0.25em;
    text-decoration:none;
    padding:8px 20px;
    border:1px solid rgba(80,180,255,0.4);
    border-radius:20px;
    transition:background 0.2s;
  }
  #footer a:hover { background:rgba(80,180,255,0.18); }

  /* ===== Win ===== */
  #win {
    position:fixed; inset:0; z-index:500;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(0,8,18,0.93);
    backdrop-filter:blur(8px);
  }
  #win.show { display:flex; }
  #win h1 {
    font-size:clamp(32px,7vw,80px);
    letter-spacing:0.15em;
    background:linear-gradient(90deg,#00d2ff,#3a7bd5,#00d2ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:18px;
    animation:pulse 1.6s infinite alternate;
  }
  #win p { color:#9fd8ff; font-size:clamp(14px,2vw,20px); letter-spacing:0.2em; }
  @keyframes pulse { from{filter:brightness(1)} to{filter:brightness(1.6)} }

  /* スクロールヒント */
  #hint {
    position:fixed;
    right:16px; top:16px;
    z-index:70;
    font-size:12px;
    color:#7fa9c9;
    letter-spacing:0.1em;
    text-align:right;
    line-height:1.7;
    background:rgba(8,12,20,0.6);
    padding:10px 14px;
    border-radius:8px;
    border:1px solid rgba(80,180,255,0.25);
    pointer-events:none;
  }
</style>
</head>
<body>

<!-- ===== Opening ===== -->
<div id="opening">
  <img src="img40x.jpg" alt="">
  <div class="content">
    <h1>USA 50 STATES PUZZLE</h1>
    <button id="startBtn">はじめる</button>
  </div>
</div>

<!-- ===== Game ===== -->
<div id="game">
  <div id="viewport">
    <div id="world">
      <svg id="mapSvg" width="5000" height="3000" viewBox="0 0 5000 3000"></svg>
    </div>
  </div>

  <aside id="pool">
    <h2>POOL</h2>
    <div class="poolSlot" data-slot="0"></div>

    ← ↑ ↓ → / WASD で移動<br>

  <div id="dragLayer"></div>

  <footer id="footer">
    <a href="air.html" target="_self">AIR</a>

</div>

<!-- ===== Win ===== -->
<div id="win">
  <h1>COMPLETE!</h1>
  <p>50 STATES PUZZLE CLEARED</p>
</div>

<script>

  { name:"Florida",      pts:"0,0 130,0 120,60 80,200 20,200 -20,80", cx:60, cy:100, home:[1780,1050] },
  { name:"South Carolina", pts:"0,0 110,0 110,100 0,100", cx:55, cy:50, home:[1850,780] },
  { name:"North Carolina", pts:"0,0 180,0 180,80 0,80", cx:90, cy:40, home:[1850,680] },
  { name:"Virginia",     pts:"0,0 190,0 190,90 0,90", cx:95, cy:45, home:[1880,590] },

  { name:"Maryland",     pts:"0,0 120,0 120,60 0,60", cx:60, cy:30, home:[2000,500] },

  { name:"Pennsylvania", pts:"0,0 160,0 160,100 0,100", cx:80, cy:50, home:[2020,410] },
  { name:"New Jersey",   pts:"0,0 60,0 70,120 0,120", cx:35, cy:60, home:[2140,470] },
  { name:"New York",     pts:"0,0 180,0 180,110 0,110", cx:90, cy:55, home:[2100,320] },
  { name:"Connecticut",  pts:"0,0 70,0 70,60 0,60", cx:35, cy:30, home:[2260,420] },
  { name:"Rhode Island", pts:"0,0 40,0 40,50 0,50", cx:20, cy:25, home:[2320,430] },
  { name:"Massachusetts",pts:"0,0 110,0 120,70 0,70", cx:55, cy:35, home:[2280,360] },
  { name:"Vermont",      pts:"0,0 60,0 60,100 0,100", cx:30, cy:50, home:[2240,280] },
  { name:"New Hampshire",pts:"0,0 60,0 60,100 0,100", cx:30, cy:50, home:[2300,280] },
  { name:"Maine",        pts:"0,0 100,0 120,120 40,140 -20,60", cx:50, cy:70, home:[2380,240] },
  { name:"Alaska",       pts:"0,0 200,0 220,80 160,180 40,200 -60,120 -40,40", cx:90, cy:100, home:[300,1500] },
];

const CANADA = {
  pts:"0,0 900,0 950,120 800,260 500,300 200,280 0,180",
  cx:450, cy:120,
  home:[600,1200]
};

/* =========================================================
   セットアップ
   ========================================================= */
const world = document.getElementById("world");
const svg = document.getElementById("mapSvg");
const viewport = document.getElementById("viewport");
const poolEl = document.getElementById("pool");
const dragLayer = document.getElementById("dragLayer");
const winEl = document.getElementById("win");
const opening = document.getElementById("opening");
const game = document.getElementById("game");

const SVG_NS = "http://www.w3.org/2000/svg";

let activeStates = [];
let placedCount = 0;
let gameStarted = false;

/* =========================================================
   ユーティリティ
   ========================================================= */
function pickRandomStates(n) {
  const arr = [...STATES];
  const picked = [];
  while (picked.length < n && arr.length) {
    const i = Math.floor(Math.random()*arr.length);
    picked.push(arr.splice(i,1)[0]);
  }
  return picked;
}

function ptsToPath(pts, offsetX=0, offsetY=0) {
  const pairs = pts.trim().split(/\s+/).map(p=>{
    const [x,y] = p.split(",").map(Number);
    return [x+offsetX, y+offsetY];
  });
  let d = `M ${pairs[0][0]} ${pairs[0][1]}`;
  for (let i=1;i<pairs.length;i++) d += ` L ${pairs[i][0]} ${pairs[i][1]}`;
  d += " Z";
  return d;
}

function bbox(pts) {
  const pairs = pts.trim().split(/\s+/).map(p=>p.split(",").map(Number));
  const xs = pairs.map(p=>p[0]), ys = pairs.map(p=>p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  return { minX, minY, maxX, maxY, w:maxX-minX, h:maxY-minY };
}

/* =========================================================
   マップ描画
   ========================================================= */
function buildMap() {
  svg.innerHTML = "";

  const defs = document.createElementNS(SVG_NS,"defs");
  const pattern = document.createElementNS(SVG_NS,"pattern");
  pattern.setAttribute("id","grid");
  pattern.setAttribute("width","100"); pattern.setAttribute("height","100");
  pattern.setAttribute("patternUnits","userSpaceOnUse");
  const pPath = document.createElementNS(SVG_NS,"path");
  pPath.setAttribute("d","M 100 0 L 0 0 0 100");
  pPath.setAttribute("fill","none");
  pPath.setAttribute("stroke","rgba(80,140,200,0.08)");
  pPath.setAttribute("stroke-width","1");
  pattern.appendChild(pPath);
  defs.appendChild(pattern);
  svg.appendChild(defs);

  const bg = document.createElementNS(SVG_NS,"rect");
  bg.setAttribute("width","5000"); bg.setAttribute("height","3000");
  bg.setAttribute("fill","url(#grid)");
  svg.appendChild(bg);

  // カナダ
  const canG = document.createElementNS(SVG_NS,"g");
  const canPath = document.createElementNS(SVG_NS,"path");
  const [cx,cy] = CANADA.home;
  canPath.setAttribute("d", ptsToPath(CANADA.pts, cx, cy));
  canPath.setAttribute("class","canadaShape");
  canG.appendChild(canPath);
  const canLabel = document.createElementNS(SVG_NS,"text");
  canLabel.setAttribute("x", cx + CANADA.cx);
  canLabel.setAttribute("y", cy + CANADA.cy);
  canLabel.setAttribute("class","canadaLabel");
  canLabel.textContent = "CANADA";
  canG.appendChild(canLabel);
  svg.appendChild(canG);

  // 穴
  activeStates.forEach((st, idx) => {
    const g = document.createElementNS(SVG_NS,"g");
    g.dataset.holeIdx = idx;
    const [hx,hy] = st.home;
    const hole = document.createElementNS(SVG_NS,"path");
    hole.setAttribute("d", ptsToPath(st.pts, hx, hy));
    hole.setAttribute("class","stateHole");
    hole.dataset.holeIdx = idx;
    g.appendChild(hole);
    svg.appendChild(g);
  });
}

/* =========================================================
   POOL描画
   ========================================================= */
function buildPool() {
  const slots = poolEl.querySelectorAll(".poolSlot");
  slots.forEach((slot, i) => {
    slot.innerHTML = "";
    slot.classList.remove("filled");
    delete slot.dataset.stateName;
    const st = activeStates[i];
    if (!st) return;

    const bb = bbox(st.pts);
    const svgEl = document.createElementNS(SVG_NS,"svg");
    svgEl.setAttribute("viewBox", `${bb.minX-5} ${bb.minY-5} ${bb.w+10} ${bb.h+10}`);
    svgEl.setAttribute("width","100%");
    svgEl.setAttribute("height","80%");
    svgEl.setAttribute("preserveAspectRatio","xMidYMid meet");

    const path = document.createElementNS(SVG_NS,"path");
    path.setAttribute("d", ptsToPath(st.pts));
    path.setAttribute("class","stateShape");
    svgEl.appendChild(path);

    slot.appendChild(svgEl);

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = st.name;
    slot.appendChild(label);

    slot.classList.add("filled");
    slot.dataset.stateName = st.name;

    attachDrag(slot, st);
  });
}

/* =========================================================
   ドラッグ＆ドロップ
   ========================================================= */
let dragState = null;
let holdTimer = null;
const HOLD_MS = 120;

function attachDrag(el, state) {
  const start = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const point = getPoint(e);

    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      holdTimer = null;
      beginDrag(el, state, point);
    }, HOLD_MS);
  };
  const cancel = () => {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  };

  el.addEventListener("mousedown", start);
  el.addEventListener("touchstart", start, {passive:false});
  el.addEventListener("mouseup", cancel);
  el.addEventListener("mouseleave", cancel);
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchcancel", cancel);
}

function getPoint(e) {
  if (e.touches && e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
  if (e.changedTouches && e.changedTouches[0]) return {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY};
  return {x:e.clientX, y:e.clientY};
}

function beginDrag(el, state, point) {
  const bb = bbox(state.pts);

  // ゴースト作成
  const ghost = document.createElementNS(SVG_NS,"svg");
  const w = Math.max(bb.w, 120);
  const h = Math.max(bb.h, 90);
  ghost.setAttribute("width", w);
  ghost.setAttribute("height", h);
  ghost.setAttribute("viewBox", `${bb.minX-5} ${bb.minY-5} ${bb.w+10} ${bb.h+10}`);
  ghost.style.width = w + "px";
  ghost.style.height = h + "px";

  const path = document.createElementNS(SVG_NS,"path");
  path.setAttribute("d", ptsToPath(state.pts));
  path.setAttribute("class","stateShape");
  path.setAttribute("style","fill:rgba(90,180,255,0.95);stroke:#e0f4ff;stroke-width:2;");
  ghost.appendChild(path);

  dragLayer.appendChild(ghost);

  dragState = {
    state,
    el,
    ghost,
    ghostW: w,
    ghostH: h,
    bb
  };

  el.style.opacity = "0.3";
  moveGhost(point.x, point.y);

  window.addEventListener("mousemove", onDragMove);
  window.addEventListener("touchmove", onDragMove, {passive:false});
  window.addEventListener("mouseup", onDragEnd);
  window.addEventListener("touchend", onDragEnd);
  window.addEventListener("touchcancel", onDragEnd);
}

function moveGhost(px, py) {
  if (!dragState) return;
  const g = dragState.ghost;
  g.style.left = (px - dragState.ghostW/2) + "px";
  g.style.top  = (py - dragState.ghostH/2) + "px";
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  const p = getPoint(e);
  moveGhost(p.x, p.y);
}

function onDragEnd(e) {
  if (!dragState) return;
  const p = getPoint(e);
  const st = dragState.state;

  // 画面座標 → world座標
  const worldPt = screenToWorld(p.x, p.y);

  // 正解位置（world座標）
  const [hx,hy] = st.home;
  const bb = bbox(st.pts);
  const targetCx = hx + bb.minX + bb.w/2;
  const targetCy = hy + bb.minY + bb.h/2;

  const dist = Math.hypot(worldPt.x - targetCx, worldPt.y - targetCy);

  if (dist < 200) {
    placeState(st);
  } else {
    // 失敗時はPOOLに戻す
    dragState.el.style.opacity = "";
  }

  dragState.ghost.remove();
  dragState = null;

  window.removeEventListener("mousemove", onDragMove);
  window.removeEventListener("touchmove", onDragMove);
  window.removeEventListener("mouseup", onDragEnd);
  window.removeEventListener("touchend", onDragEnd);
  window.removeEventListener("touchcancel", onDragEnd);
}

function placeState(st) {
  const groups = svg.querySelectorAll("g[data-hole-idx]");
  let targetHole = null;
  groups.forEach(g => {
    const idx = Number(g.dataset.holeIdx);
    if (activeStates[idx].name === st.name) {
      targetHole = g.querySelector(".stateHole");
    }
  });
  if (!targetHole) return;

  const [hx,hy] = st.home;
  targetHole.setAttribute("class","stateShape");
  targetHole.setAttribute("style","fill:rgba(70,200,140,0.9);stroke:#d8ffe8;stroke-width:2;");
  targetHole.removeAttribute("data-hole-idx");

  const bb = bbox(st.pts);
  const label = document.createElementNS(SVG_NS,"text");
  label.setAttribute("x", hx + bb.minX + bb.w/2);
  label.setAttribute("y", hy + bb.minY + bb.h/2);
  label.setAttribute("class","stateLabel");
  label.textContent = st.name;
  svg.appendChild(label);

  const slot = poolEl.querySelector(`.poolSlot[data-state-name="${st.name}"]`);
  if (slot) {
    slot.innerHTML = "";
    slot.classList.remove("filled");
    delete slot.dataset.stateName;
    slot.style.opacity = "";
  }

  placedCount++;
  if (placedCount >= activeStates.length) {
    setTimeout(showWin, 400);
  }
}

function showWin() {
  winEl.classList.add("show");
}

/* =========================================================
   カメラ（上下左右キー / WASD）
   ========================================================= */
const VIEW_SCALE = 0.2;
const WORLD_W = 5000;
const WORLD_H = 3000;

// camX / camY は「world座標」でのカメラ左上位置
let camX = 0, camY = 0;
const camSpeed = 60; // world座標/フレーム
const keys = {};

function clampCamera() {
  // 画面に映る world の幅・高さ
  const viewW = window.innerWidth / VIEW_SCALE;
  const viewH = window.innerHeight / VIEW_SCALE;

  const maxX = Math.max(0, WORLD_W - viewW);
  const maxY = Math.max(0, WORLD_H - viewH);

  camX = Math.max(0, Math.min(maxX, camX));
  camY = Math.max(0, Math.min(maxY, camY));
}

function applyCamera() {
  // world を scale した上で、カメラ位置ぶん translate
  // 順序: translate(-camX*scale, -camY*scale) scale(scale)
  const tx = -camX * VIEW_SCALE;
  const ty = -camY * VIEW_SCALE;
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${VIEW_SCALE})`;
}

// 画面座標 → world座標
function screenToWorld(sx, sy) {
  return {
    x: sx / VIEW_SCALE + camX,
    y: sy / VIEW_SCALE + camY
  };
}

// world座標 → 画面座標（必要なら）
function worldToScreen(wx, wy) {
  return {
    x: (wx - camX) * VIEW_SCALE,
    y: (wy - camY) * VIEW_SCALE
  };
}

function updateCamera() {
  let dx = 0, dy = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= 1;
  if (keys["ArrowRight"]|| keys["d"] || keys["D"]) dx += 1;
  if (keys["ArrowUp"]   || keys["w"] || keys["W"]) dy -= 1;
  if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += 1;

  if (dx || dy) {
    camX += dx * camSpeed;
    camY += dy * camSpeed;
    clampCamera();
    applyCamera();
  }
  requestAnimationFrame(updateCamera);
}

window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

/* =========================================================
   初期化
   ========================================================= */
function startGame() {
  activeStates = pickRandomStates(4);
  placedCount = 0;

  opening.classList.add("hidden");
  game.style.display = "block";
  gameStarted = true;

  buildMap();
  buildPool();

  camX = 0; camY = 0;
  clampCamera();
  applyCamera();
  requestAnimationFrame(updateCamera);

  setTimeout(() => { opening.style.display = "none"; }, 500);
}

document.getElementById("startBtn").addEventListener("click", startGame);
window.addEventListener("resize", () => {
  clampCamera();
  applyCamera();
});
</script>
