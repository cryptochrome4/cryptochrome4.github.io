<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #eee;
        }
        .container {
            background: #0d0d22;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #1a2a5a;
            box-shadow: 0 0 60px rgba(0,80,200,0.08);
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #060612;
            border-radius: 8px;
            width: 960px;
            height: 540px;
            image-rendering: pixelated;
            border: 1px solid #1a2a4a;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding: 10px 14px;
            background: #0a0a1a;
            border-radius: 8px;
            border: 1px solid #1a2a4a;
            font-size: 12px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .info-left {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            align-items: center;
        }
        .info-right {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            align-items: center;
        }
        .info .badge {
            background: #12122e;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid #1a2a5a;
            color: #8ac4ff;
            font-size: 11px;
            white-space: nowrap;
        }
        .badge .num {
            color: #ffd700;
            font-weight: bold;
        }
        .badge .label {
            color: #8899bb;
        }
        .legend {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: #aabbdd;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        button {
            background: #1a2a5a;
            border: none;
            color: #fff;
            padding: 2px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: 0.2s;
            border: 1px solid #2a3a6a;
        }
        button:hover { background: #2a4a8a; box-shadow: 0 0 20px rgba(0,80,255,0.15); }
        .status-log {
            color: #66ff66;
            font-size: 11px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(100,255,100,0.3);
        }
        @media (max-width: 1000px) {
            canvas { width: 100%; height: auto; aspect-ratio: 960/540; }
            .info { flex-direction: column; align-items: stretch; gap: 6px; }
            .info-left, .info-right { justify-content: center; }
        }
    </style>
</head>

    // ---------- キャンバス ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 960, H = 540;
    const countSpan = document.getElementById('countDisplay');
    const logSpan = document.getElementById('reactionLog');
    const battleSpan = document.getElementById('battleCount');
    const reactionSpan = document.getElementById('reactionCount');
    const typeSummarySpan = document.getElementById('typeSummary');

    // ---------- 物理定数 ----------
    const GRAVITY = 0.20;
    const FRICTION = 0.985;
    const BOUNCE = 0.45;
    const MAX_SPEED = 4.8;

    // ---------- 統計 ----------
    let battleTotal = 0;
    let reactionTotal = 0;

    // ---------- Elementalクラス ----------
    class Elemental {
        constructor(type, x, y) {
            const def = ELEMENTS_DATA[type];
            if (!def) { console.warn('不明な元素:', type); return; }
            this.type = type;
            this.symbol = def.symbol;
            this.color = def.color;
            this.mass = def.mass;
            this.attack = def.attack;
            this.radius = def.radius;
            this.group = def.group;

            this.x = x || 20 + Math.random() * (W - 40);
            this.y = y || 20 + Math.random() * (H - 40);
            this.vx = (Math.random() - 0.5) * 1.6;
            this.vy = (Math.random() - 0.5) * 1.6 - 0.3;

            this.wanderTimer = 0;
            this.wanderAngle = Math.random() * Math.PI * 2;
            this.battleCooldown = 0;
            this.isEvolved = false;
            this.life = 9999;
            this.fade = 1.0;
            this.isCompound = (type.length > 2 || type.includes('₂') || type.includes('₃'));
        }

        updateAI() {
            this.wanderTimer -= 1;
            if (this.wanderTimer <= 0) {
                this.wanderTimer = 25 + Math.floor(Math.random() * 35);
                this.wanderAngle += (Math.random() - 0.5) * 1.0;
                if (this.x < 30) this.wanderAngle = 0;
                else if (this.x > W - 30) this.wanderAngle = Math.PI;
                if (this.y < 30) this.wanderAngle = Math.PI / 2;
                else if (this.y > H - 30) this.wanderAngle = -Math.PI / 2;
            }
            const accel = 0.10;
            const targetVx = Math.cos(this.wanderAngle) * 0.7;
            const targetVy = Math.sin(this.wanderAngle) * 0.7;
            this.vx += (targetVx - this.vx * 0.08) * accel;
            this.vy += (targetVy - this.vy * 0.08) * accel;

            const massFactor = this.mass / 50;
            if (this.mass < 20) {
                this.vy -= 0.04 * (1 - massFactor);
            } else if (this.mass > 80) {
                this.vy += 0.06 * (massFactor - 1);
            }
        }

        updatePhysics() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += GRAVITY * (0.5 + this.mass / 200);

            this.vx *= FRICTION;
            this.vy *= FRICTION;

            if (this.x - this.radius < 0) {
                this.x = this.radius;
                this.vx = Math.abs(this.vx) * BOUNCE;
            } else if (this.x + this.radius > W) {
                this.x = W - this.radius;
                this.vx = -Math.abs(this.vx) * BOUNCE;
            }
            if (this.y - this.radius < 0) {
                this.y = this.radius;
                this.vy = Math.abs(this.vy) * BOUNCE;
            } else if (this.y + this.radius > H) {
                this.y = H - this.radius;
                this.vy = -Math.abs(this.vy) * BOUNCE;
            }

            if (this.battleCooldown > 0) this.battleCooldown--;
        }

        draw(ctx) {
            const r = this.radius;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 14;

            ctx.beginPath();
            ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // ★ 蛍光グリーン (ネオン) に変更
            const fs = Math.min(r * 0.85, 14);
            ctx.fillStyle = '#66ff66';  // 蛍光グリーン
            ctx.shadowColor = '#33ff33';
            ctx.shadowBlur = 18;  // グロー強め
            ctx.font = 'bold ' + fs + 'px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.symbol, this.x, this.y + 1);
            ctx.shadowBlur = 0;

            if (this.mass > 100) {
                ctx.fillStyle = 'rgba(255,200,50,0.4)';
                ctx.beginPath();
                ctx.arc(this.x - r*0.5, this.y - r*0.5, 4, 0, Math.PI*2);
                ctx.fill();
            }
            // 化合物マーク
            if (this.isCompound || this.isEvolved) {
                ctx.strokeStyle = 'rgba(100,255,100,0.25)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 4]);
                ctx.beginPath();
                ctx.arc(this.x, this.y, r + 3, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        collidesWith(other) {
            const dx = this.x - other.x;
            const dy = this.y - other.y;
            return (dx*dx + dy*dy) < (this.radius + other.radius) ** 2;
        }

        reactWith(other, elements) {
            if (this.battleCooldown > 0 || other.battleCooldown > 0) return false;
            if (this.isEvolved || other.isEvolved) return false;

            const pair = [this.type, other.type].sort();
            const key = pair.join('+');
            let newType = REACTION_MAP[key] || null;
            let logMsg = '';

            if (newType && EVOLVED_DEFS[newType]) {
                const def = EVOLVED_DEFS[newType];
                const mx = (this.x + other.x) / 2;
                const my = (this.y + other.y) / 2;

                this.type = newType;
                this.symbol = def.symbol;
                this.color = def.color;
                this.mass = def.mass;
                this.attack = def.attack;
                this.radius = def.radius;
                this.isEvolved = true;
                this.isCompound = true;
                this.x = mx;
                this.y = my;
                this.vx = (this.vx + other.vx) * 0.2;
                this.vy = (this.vy + other.vy) * 0.2 - 1.0;
                this.battleCooldown = 40;

                other.life = 0;
                reactionTotal++;
                logMsg = `🧪 ${this.symbol} 生成！`;
                logSpan.textContent = logMsg;
                return true;
            }

            // バトル
            if (this.attack > other.attack) {
                other.life = 0;
                logMsg = `⚔️ ${this.symbol} > ${other.symbol}`;
            } else if (other.attack > this.attack) {
                this.life = 0;
                logMsg = `⚔️ ${other.symbol} > ${this.symbol}`;
            } else {
                this.life = 0;
                other.life = 0;
                logMsg = `💥 ${this.symbol} ⇔ ${other.symbol}`;
            }
            battleTotal++;
            this.battleCooldown = 15;
            other.battleCooldown = 15;
            logSpan.textContent = logMsg;
            return true;
        }
    }

    // ---------- ゲーム管理 ----------
    let elements = [];
    let frameCount = 0;

    function initGame() {
        elements = [];
        battleTotal = 0;
        reactionTotal = 0;
        const shuffled = ALL_KEYS.slice().sort(() => Math.random() - 0.5);
        const count = Math.min(45, shuffled.length);
        for (let i = 0; i < count; i++) {
            const type = shuffled[i % shuffled.length];
            const x = 30 + (i % 20) * 45 + Math.random() * 20;
            const y = 30 + Math.floor(i / 20) * 55 + Math.random() * 30;
            elements.push(new Elemental(type, x, y));
        }
        for (let i = 0; i < 10; i++) {
            const heavy = ['U', 'Pu', 'Au', 'Pt', 'Pb', 'Th', 'W', 'Os', 'Ir', 'Re'];
            const type = heavy[i % heavy.length];
            elements.push(new Elemental(type, 100 + Math.random() * 760, 100 + Math.random() * 340));
        }
        logSpan.textContent = '⚡ 全118元素始動！';
        updateUI();
    }

    function updateUI() {
        const alive = elements.filter(e => e.life > 0);
        countSpan.textContent = `${alive.length} / 118`;
        battleSpan.textContent = battleTotal;
        reactionSpan.textContent = reactionTotal;

        const groups = {};
        for (let e of alive) {
            const g = e.group || 'その他';
            groups[g] = (groups[g] || 0) + 1;
        }
        const sorted = Object.entries(groups).sort((a,b) => b[1] - a[1]);
        const top3 = sorted.slice(0, 3).map(([g,c]) => `${g}${c}`).join(' ');
        typeSummarySpan.textContent = top3 || '-';
    }

    function spawnElement() {
        if (elements.length > 160) return;
        const type = ALL_KEYS[Math.floor(Math.random() * ALL_KEYS.length)];
        const x = 20 + Math.random() * (W - 40);
        const y = 20 + Math.random() * (H - 40);
        const el = new Elemental(type, x, y);
        el.vx = (Math.random() - 0.5) * 1.2;
        el.vy = (Math.random() - 0.5) * 1.2;
        elements.push(el);
    }

    function update() {
        frameCount++;
        if (frameCount % 25 === 0) spawnElement();

        elements = elements.filter(e => e.life > 0);

        for (let e of elements) {
            e.updateAI();
            e.updatePhysics();
        }

        for (let i = 0; i < elements.length; i++) {
            for (let j = i + 1; j < elements.length; j++) {
                const a = elements[i];
                const b = elements[j];
                if (a.life <= 0 || b.life <= 0) continue;
                if (a.collidesWith(b)) {
                    const reacted = a.reactWith(b, elements);
                    if (!reacted) {
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist === 0) continue;
                        const overlap = (a.radius + b.radius - dist) / 2;
                        const nx = dx/dist, ny = dy/dist;
                        a.x += nx * overlap;
                        a.y += ny * overlap;
                        b.x -= nx * overlap;
                        b.y -= ny * overlap;
                        const relV = (a.vx - b.vx)*nx + (a.vy - b.vy)*ny;
                        if (relV < 0) {
                            const impulse = -relV * 0.25;
                            a.vx += impulse * nx / a.mass;
                            a.vy += impulse * ny / a.mass;
                            b.vx -= impulse * nx / b.mass;
                            b.vy -= impulse * ny / b.mass;
                        }
                    }
                }
            }
        }

        elements = elements.filter(e => e.life > 0);
        updateUI();
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#060612';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(30,50,80,0.05)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x < W; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        for (let e of elements) {
            e.draw(ctx);
        }

        ctx.strokeStyle = 'rgba(60,120,200,0.05)';
        ctx.lineWidth = 3;
        ctx.strokeRect(2, 2, W-4, H-4);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
        initGame();
        logSpan.textContent = '🔄 リセット完了';
    });

    setInterval(() => {
        if (logSpan.textContent !== '⚡ 待機中...' && 
            logSpan.textContent !== '⚡ 全118元素始動！' &&
            logSpan.textContent !== '🔄 リセット完了') {
            setTimeout(() => {
                if (logSpan.textContent !== '⚡ 待機中...') {
                    logSpan.textContent = '⚡ 待機中...';
                }
            }, 2000);
        }
    }, 1000);

    initGame();
    loop();
})();
</script>
</body>
