<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ドット絵エディタ (2013スタイル)</title>
<style>
/* 2013年頃のブラウザでも動く、シンプルなスタイル */
* {
  box-sizing: border-box;
  user-select: none; /* ドラッグ時の選択防止 */
}
body {
  background: #eaeef2;
  font-family: 'Segoe UI', 'Meiryo', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 16px;
}
.editor-wrapper {
  background: #f5f7fa;
  border: 2px solid #a0b0c0;
  border-radius: 8px;
  padding: 20px 20px 20px 24px;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.2);
  display: inline-block;
}
.canvas-area {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}
/* キャンバスと左右パレットをまとめるコンテナ */
.canvas-with-palettes {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
#gridContainer {
  background: #ffffff;
  border: 2px solid #7a8a9a;
  display: inline-block;
  padding: 4px;
  box-shadow: inset 0 0 0 1px #c0cedc;
  flex-shrink: 0;
}
canvas#dotCanvas {
  display: block;
  background: #ffffff;
  image-rendering: crisp-edges; /* ドット感 */
  image-rendering: pixelated;
  width: 400px;  /* デフォルトサイズ、JSで調整 */
  height: 400px;
  border: none;
  cursor: crosshair;
}
/* 左側の塗りつぶしパレット */
.fill-palette {
  background: #dce4ec;
  border: 2px solid #7a8a9a;
  border-radius: 4px;
  padding: 6px 6px 6px 8px;
  display: inline-block;
  box-shadow: inset 0 0 0 1px #e8f0f8;
  flex-shrink: 0;
}
.fill-palette .palette-colors .color-swatch {
  border-color: #4a5a6a;
}
.fill-palette .palette-colors .color-swatch:hover {
  transform: scale(1.08);
  border-color: #000000;
}
/* 右側の通常パレット */
.palette {
  background: #e0e8f0;
  border: 2px solid #8a9aaa;
  border-radius: 4px;
  padding: 6px 6px 6px 8px;
  display: inline-block;
  box-shadow: inset 0 0 0 1px #f0f8ff;
  flex-shrink: 0;
}
.palette-colors {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.palette-label {
  font-size: 10px;
  font-weight: bold;
  color: #2a3a4a;
  text-align: center;
  margin-bottom: 3px;
  letter-spacing: 0.5px;
}
.color-swatch {
  width: 36px;
  height: 36px;
  border: 2px solid #3a4a5a;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.1s;
  box-shadow: 0 0 0 1px #d0d8e0;
}
.color-swatch:hover {
  transform: scale(1.08);
  border-color: #000000;
}
.color-swatch.active {
  border: 4px solid #ffffff;
  outline: 2px solid #000000;
  box-shadow: 0 0 0 2px #000;
}
.controls {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 12px;
  background: #dce4ec;
  padding: 10px 16px;
  border-radius: 30px;
  border: 1px solid #b0c0d0;
}
.controls label {
  font-weight: bold;
  color: #1a2a3a;
  font-size: 14px;
}
.controls input[type="number"] {
  width: 60px;
  padding: 4px 4px 4px 8px;
  border: 2px solid #7a8a9a;
  border-radius: 20px;
  background: #fafcff;
  font-weight: bold;
  text-align: center;
}
.controls button {
  background: #eaf0f8;
  border: 2px solid #5a6a7a;
  border-radius: 30px;
  padding: 6px 18px;
  font-weight: bold;
  color: #1a2a3a;
  cursor: pointer;
  box-shadow: 0 2px 0 #8a9aaa;
  font-size: 14px;
  transition: 0.05s linear;
}
.controls button:active {
  transform: translateY(2px);
  box-shadow: none;
}
.controls button.reset-btn {
  background: #f0d8d0;
  border-color: #a06050;
  color: #4a2018;
}
#sizeDisplay {
  font-weight: bold;
  color: #0a1a2a;
  background: #f0f6fe;
  padding: 2px 14px;
  border-radius: 40px;
  border: 1px solid #8a9aaa;
}
.download-section {
  margin-top: 12px;
  text-align: right;
}
.download-btn {
  background: #c0d8e8;
  border: 2px solid #3a5a7a;
  padding: 6px 24px;
  border-radius: 40px;
  font-weight: bold;
  color: #0a1a2a;
  cursor: pointer;
  font-size: 15px;
}
.download-btn:active {
  transform: scale(0.95);
}
</style>
</head>
<body>
<div class="editor-wrapper">
  <div class="canvas-area">
    <!-- キャンバス + 左右パレット -->
    <div class="canvas-with-palettes">
      <!-- 塗りつぶし用パレット (左側) -->
      <div class="fill-palette">
        <div class="palette-label">▼塗りつぶし</div>
        <div class="palette-colors" id="fillPaletteContainer">
          <!-- 13色 上から順に -->
        </div>
      </div>

      <!-- ドット絵キャンバス -->
      <div id="gridContainer">
        <canvas id="dotCanvas" width="400" height="400"></canvas>
      </div>

      <!-- 通常パレット (右側) -->
      <div class="palette">
        <div class="palette-colors" id="paletteContainer">
          <!-- 13色 上から順に -->
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <label>縦</label>
    <input type="number" id="gridSizeInput" min="1" max="400" value="10">
    <label>横</label>
    <input type="number" id="gridSizeInput2" min="1" max="400" value="10">
    <button id="applySizeBtn">変更</button>
    <span id="sizeDisplay">10×10</span>
    <button id="resetBtn" class="reset-btn">🗑 リセット</button>
  </div>
  <div class="download-section">
    <button id="downloadBtn" class="download-btn">⬇ 画像ダウンロード</button>
  </div>
</div>
<script>
(function() {
  // ---------- 2013年仕様: 古いブラウザでも動くようにvar, function, シンプル ----------
  var canvas = document.getElementById('dotCanvas');
  var ctx = canvas.getContext('2d');

  // デフォルト 10x10
  var rows = 10;
  var cols = 10;
  var cellSizeX = 400 / cols;
  var cellSizeY = 400 / rows;

  // カラーパレット (13色) 上から順
  var paletteColors = [
    '#FF0000', // 赤
    '#00BFFF', // 水色
    '#FFD700', // 黄色
    '#FF69B4', // ピンク
    '#0000FF', // 青
    '#8B4513', // 茶色
    '#FFFFFF', // 白
    '#FF8C00', // 橙
    '#800080', // 紫
    '#000000', // 黒
    '#808080', // 灰色
    '#008000', // 緑
    '#ADFF2F'  // 黄緑
  ];

  // 現在選択中の色 (デフォルト: 黒)
  var selectedColor = '#000000';

  // グリッドデータ (二次元配列) デフォルトは白背景だが、黒線は描画時に引く
  var gridData = []; // gridData[row][col] = colorString

  // マウス押下フラグ (ドラッグ描画用)
  var isMouseDown = false;

  // 初期化 (全セルを白にする)
  function initGrid(r, c) {
    var data = [];
    for (var i = 0; i < r; i++) {
      data[i] = [];
      for (var j = 0; j < c; j++) {
        data[i][j] = '#FFFFFF'; // 白
      }
    }
    return data;
  }

  // キャンバスにドット絵を描画 (黒線 + カラーセル)
  function drawCanvas() {
    ctx.clearRect(0, 0, 400, 400);
    // セル描画
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var color = gridData[r][c];
        ctx.fillStyle = color;
        ctx.fillRect(c * cellSizeX, r * cellSizeY, cellSizeX, cellSizeY);
      }
    }
    // 黒線 (グリッド線) を引く
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    for (var i = 0; i <= rows; i++) {
      ctx.moveTo(0, i * cellSizeY);
      ctx.lineTo(400, i * cellSizeY);
    }
    for (var j = 0; j <= cols; j++) {
      ctx.moveTo(j * cellSizeX, 0);
      ctx.lineTo(j * cellSizeX, 400);
    }
    ctx.stroke();
  }

  // 座標からセルインデックス取得 (クリック/ドラッグ)
  function getCellIndexFromCoord(x, y) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;   // 常に400/表示幅
    var scaleY = canvas.height / rect.height;
    var canvasX = (x - rect.left) * scaleX;
    var canvasY = (y - rect.top) * scaleY;
    if (canvasX < 0 || canvasX >= 400 || canvasY < 0 || canvasY >= 400) {
      return null;
    }
    var col = Math.floor(canvasX / cellSizeX);
    var row = Math.floor(canvasY / cellSizeY);
    if (row < 0 || row >= rows || col < 0 || col >= cols) return null;
    return { row: row, col: col };
  }

  // セルに色をセット (描画更新)
  function setCellColor(row, col, color) {
    if (row < 0 || row >= rows || col < 0 || col >= cols) return;
    gridData[row][col] = color;
    ctx.fillStyle = color;
    ctx.fillRect(col * cellSizeX, row * cellSizeY, cellSizeX, cellSizeY);
    drawCanvas(); // 全描画 (シンプル)
  }

  // ---- 塗りつぶし機能 ----
  function fillAllCells(color) {
    // 二重確認
    var confirm1 = confirm('全てのセルをこの色で塗りつぶしますか？');
    if (!confirm1) return;
    var confirm2 = confirm('本当に全てのセルを塗りつぶしますか？ (元に戻せません)');
    if (!confirm2) return;

    // 実行
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        gridData[r][c] = color;
      }
    }
    drawCanvas();
  }

  // イベント処理 (マウス)
  function handleCanvasMouse(e) {
    var coord = getCellIndexFromCoord(e.clientX, e.clientY);
    if (!coord) return;
    var row = coord.row;
    var col = coord.col;
    if (row >= 0 && row < rows && col >= 0 && col < cols) {
      setCellColor(row, col, selectedColor);
    }
  }

  // マウスダウン
  function onMouseDown(e) {
    isMouseDown = true;
    handleCanvasMouse(e);
    e.preventDefault();
  }

  function onMouseMove(e) {
    if (isMouseDown) {
      handleCanvasMouse(e);
    }
    e.preventDefault();
  }

  function onMouseUp(e) {
    isMouseDown = false;
    e.preventDefault();
  }

  function onMouseLeave(e) {
    isMouseDown = false;
  }

  // パレット作成 (通常用 + 塗りつぶし用)
  function buildPalettes() {
    // 通常パレット (右側)
    var container = document.getElementById('paletteContainer');
    container.innerHTML = '';
    for (var i = 0; i < paletteColors.length; i++) {
      var color = paletteColors[i];
      var swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.backgroundColor = color;
      swatch.dataset.color = color;
      if (color === selectedColor) {
        swatch.classList.add('active');
      }
      swatch.addEventListener('click', function(e) {
        var c = this.dataset.color;
        selectedColor = c;
        // アクティブ表示更新 (通常パレットのみ)
        var allSwatches = document.querySelectorAll('#paletteContainer .color-swatch');
        for (var s = 0; s < allSwatches.length; s++) {
          allSwatches[s].classList.remove('active');
        }
        this.classList.add('active');
        // 塗りつぶしパレットのアクティブは外す
        var fillSwatches = document.querySelectorAll('#fillPaletteContainer .color-swatch');
        for (var f = 0; f < fillSwatches.length; f++) {
          fillSwatches[f].classList.remove('active');
        }
      });
      container.appendChild(swatch);
    }

    // 塗りつぶし用パレット (左側)
    var fillContainer = document.getElementById('fillPaletteContainer');
    fillContainer.innerHTML = '';
    for (var j = 0; j < paletteColors.length; j++) {
      var color2 = paletteColors[j];
      var swatch2 = document.createElement('div');
      swatch2.className = 'color-swatch';
      swatch2.style.backgroundColor = color2;
      swatch2.dataset.color = color2;
      swatch2.addEventListener('click', function(e) {
        var c = this.dataset.color;
        // 塗りつぶし実行 (二重確認付き)
        fillAllCells(c);
        // アクティブ表示更新 (塗りつぶしパレットのみ)
        var allSwatches = document.querySelectorAll('#fillPaletteContainer .color-swatch');
        for (var s = 0; s < allSwatches.length; s++) {
          allSwatches[s].classList.remove('active');
        }
        this.classList.add('active');
        // 通常パレットのアクティブは外す
        var normalSwatches = document.querySelectorAll('#paletteContainer .color-swatch');
        for (var n = 0; n < normalSwatches.length; n++) {
          normalSwatches[n].classList.remove('active');
        }
      });
      fillContainer.appendChild(swatch2);
    }
  }

  // サイズ表示更新
  function updateSizeDisplay() {
    document.getElementById('sizeDisplay').textContent = rows + '×' + cols;
    document.getElementById('gridSizeInput').value = rows;
    document.getElementById('gridSizeInput2').value = cols;
  }

  // リセット (確認ダイアログ)
  function resetGrid() {
    var really = confirm('本当にリセットしますか？ (すべて白に戻ります)');
    if (really) {
      gridData = initGrid(rows, cols);
      drawCanvas();
    }
  }

  // 画像ダウンロード (PNG)
  function downloadImage() {
    var link = document.createElement('a');
    link.download = 'dot_art.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // サイズ変更 (入力値に基づく)
  function applySizeChange() {
    var input1 = document.getElementById('gridSizeInput');
    var val1 = parseInt(input1.value, 10);
    var input2 = document.getElementById('gridSizeInput2');
    var val2 = parseInt(input2.value, 10);
    if (isNaN(val1) || val1 < 1) val1 = 1;
    if (isNaN(val2) || val2 < 1) val2 = 1;
    if (val1 > 400) val1 = 400;
    if (val2 > 400) val2 = 400;

    rows = val1;
    cols = val2;
    cellSizeX = 400 / cols;
    cellSizeY = 400 / rows;

    // グリッドデータを初期化 (白)
    gridData = initGrid(rows, cols);
    drawCanvas();
    updateSizeDisplay();
  }

  // 初期化処理
  function init() {
    rows = 10;
    cols = 10;
    cellSizeX = 400 / cols;
    cellSizeY = 400 / rows;

    gridData = initGrid(rows, cols);

    // パレット作成
    buildPalettes();
    // 描画
    drawCanvas();
    updateSizeDisplay();

    // イベント登録
    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseup', onMouseUp);
    canvas.addEventListener('mouseleave', onMouseLeave);

    document.getElementById('applySizeBtn').addEventListener('click', function() {
      applySizeChange();
    });
    document.getElementById('resetBtn').addEventListener('click', function() {
      resetGrid();
    });
    document.getElementById('downloadBtn').addEventListener('click', function() {
      downloadImage();
    });
  }

  // スタート
  init();
})();
</script>
</body>
</html>
