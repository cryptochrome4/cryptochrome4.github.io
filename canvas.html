<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ドット絵エディタ (2013スタイル)</title>
<style>
/* 2013年頃のブラウザでも動く、シンプルなスタイル */
* {
  box-sizing: border-box;
  user-select: none;
}
body {
  background: #eaeef2;
  font-family: 'Segoe UI', 'Meiryo', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 16px;
}
.editor-wrapper {
  background: #f5f7fa;
  border: 2px solid #a0b0c0;
  border-radius: 8px;
  padding: 20px 20px 20px 24px;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.2);
  display: inline-block;
}
.canvas-area {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}
.canvas-with-palettes {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
#gridContainer {
  background: #ffffff;
  border: 2px solid #7a8a9a;
  display: inline-block;
  padding: 4px;
  box-shadow: inset 0 0 0 1px #c0cedc;
  flex-shrink: 0;
}
canvas#dotCanvas {
  display: block;
  background: #ffffff;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  width: 400px;
  height: 400px;
  border: none;
  cursor: crosshair;
}
.fill-palette {
  background: #dce4ec;
  border: 2px solid #7a8a9a;
  border-radius: 4px;
  padding: 6px 6px 6px 8px;
  display: inline-block;
  box-shadow: inset 0 0 0 1px #e8f0f8;
  flex-shrink: 0;
}
.fill-palette .palette-colors .color-swatch {
  border-color: #4a5a6a;
}
.fill-palette .palette-colors .color-swatch:hover {
  transform: scale(1.08);
  border-color: #000000;
}
.palette {
  background: #e0e8f0;
  border: 2px solid #8a9aaa;
  border-radius: 4px;
  padding: 6px 6px 6px 8px;
  display: inline-block;
  box-shadow: inset 0 0 0 1px #f0f8ff;
  flex-shrink: 0;
}
.palette-colors {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.palette-label {
  font-size: 10px;
  font-weight: bold;
  color: #2a3a4a;
  text-align: center;
  margin-bottom: 3px;
  letter-spacing: 0.5px;
}
.color-swatch {
  width: 36px;
  height: 36px;
  border: 2px solid #3a4a5a;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.1s;
  box-shadow: 0 0 0 1px #d0d8e0;
}
.color-swatch:hover {
  transform: scale(1.08);
  border-color: #000000;
}
.color-swatch.active {
  border: 4px solid #ffffff;
  outline: 2px solid #000000;
  box-shadow: 0 0 0 2px #000;
}
.controls {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 12px;
  background: #dce4ec;
  padding: 10px 16px;
  border-radius: 30px;
  border: 1px solid #b0c0d0;
}
.controls label {
  font-weight: bold;
  color: #1a2a3a;
  font-size: 14px;
}
.controls input[type="number"] {
  width: 60px;
  padding: 4px 4px 4px 8px;
  border: 2px solid #7a8a9a;
  border-radius: 20px;
  background: #fafcff;
  font-weight: bold;
  text-align: center;
}
.controls button {
  background: #eaf0f8;
  border: 2px solid #5a6a7a;
  border-radius: 30px;
  padding: 6px 18px;
  font-weight: bold;
  color: #1a2a3a;
  cursor: pointer;
  box-shadow: 0 2px 0 #8a9aaa;
  font-size: 14px;
  transition: 0.05s linear;
}
.controls button:active {
  transform: translateY(2px);
  box-shadow: none;
}
.controls button.reset-btn {
  background: #f0d8d0;
  border-color: #a06050;
  color: #4a2018;
}
#sizeDisplay {
  font-weight: bold;
  color: #0a1a2a;
  background: #f0f6fe;
  padding: 2px 14px;
  border-radius: 40px;
  border: 1px solid #8a9aaa;
}
.download-section {
  margin-top: 12px;
  text-align: right;
}
.download-btn {
  background: #c0d8e8;
  border: 2px solid #3a5a7a;
  padding: 6px 24px;
  border-radius: 40px;
  font-weight: bold;
  color: #0a1a2a;
  cursor: pointer;
  font-size: 15px;
}
.download-btn:active {
  transform: scale(0.95);
}
.save-indicator {
  font-size: 12px;
  color: #2a6a3a;
  background: #d8f0d8;
  padding: 2px 12px;
  border-radius: 30px;
  border: 1px solid #5a8a5a;
  display: inline-block;
  margin-left: 8px;
}
</style>
</head>
<body>
<div class="editor-wrapper">
  <div class="canvas-area">
    <div class="canvas-with-palettes">
      <!-- 塗りつぶし用パレット (左側) -->
      <div class="fill-palette">
        <div class="palette-label">▼塗りつぶし</div>
        <div class="palette-colors" id="fillPaletteContainer"></div>
      </div>

      <!-- ドット絵キャンバス -->
      <div id="gridContainer">
        <canvas id="dotCanvas" width="400" height="400"></canvas>
      </div>

      <!-- 通常パレット (右側) -->
      <div class="palette">
        <div class="palette-colors" id="paletteContainer"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <label>縦</label>
    <input type="number" id="gridSizeInput" min="1" max="400" value="10">
    <label>横</label>
    <input type="number" id="gridSizeInput2" min="1" max="400" value="10">
    <button id="applySizeBtn">変更</button>
    <span id="sizeDisplay">10×10</span>
    <button id="resetBtn" class="reset-btn">🗑 リセット</button>
    <span class="save-indicator" id="saveIndicator">💾 自動保存</span>
  </div>
  <div class="download-section">
    <button id="downloadBtn" class="download-btn">⬇ 画像ダウンロード</button>
  </div>
</div>
<script>
(function() {
  // ---------- 2013年仕様: 古いブラウザでも動くようにvar, function, シンプル ----------
  var canvas = document.getElementById('dotCanvas');
  var ctx = canvas.getContext('2d');

  // デフォルト 10x10
  var rows = 10;
  var cols = 10;
  var cellSizeX = 400 / cols;
  var cellSizeY = 400 / rows;

  // カラーパレット (13色) 上から順
  var paletteColors = [
    '#FF0000', '#00BFFF', '#FFD700', '#FF69B4', '#0000FF',
    '#8B4513', '#FFFFFF', '#FF8C00', '#800080', '#000000',
    '#808080', '#008000', '#ADFF2F'
  ];

  var selectedColor = '#000000';
  var gridData = [];
  var isMouseDown = false;

  // ---- ローカルストレージ保存/読込 ----
  function saveToStorage() {
    try {
      var data = {
        rows: rows,
        cols: cols,
        grid: gridData,
        selected: selectedColor
      };
      localStorage.setItem('dotEditorData', JSON.stringify(data));
      var indicator = document.getElementById('saveIndicator');
      indicator.textContent = '💾 保存済み';
      setTimeout(function() {
        indicator.textContent = '💾 自動保存';
      }, 1500);
    } catch(e) {
      // 2013年ブラウザでもlocalStorageは大抵使える
    }
  }

  function loadFromStorage() {
    try {
      var raw = localStorage.getItem('dotEditorData');
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!data || !data.grid || !data.grid.length) return false;
      rows = data.rows || 10;
      cols = data.cols || 10;
      gridData = data.grid;
      selectedColor = data.selected || '#000000';
      cellSizeX = 400 / cols;
      cellSizeY = 400 / rows;
      return true;
    } catch(e) {
      return false;
    }
  }

  // 初期化 (全セルを白にする)
  function initGrid(r, c) {
    var data = [];
    for (var i = 0; i < r; i++) {
      data[i] = [];
      for (var j = 0; j < c; j++) {
        data[i][j] = '#FFFFFF';
      }
    }
    return data;
  }

  // キャンバスにドット絵を描画
  function drawCanvas() {
    ctx.clearRect(0, 0, 400, 400);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var color = gridData[r][c];
        ctx.fillStyle = color;
        ctx.fillRect(c * cellSizeX, r * cellSizeY, cellSizeX, cellSizeY);
      }
    }
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    for (var i = 0; i <= rows; i++) {
      ctx.moveTo(0, i * cellSizeY);
      ctx.lineTo(400, i * cellSizeY);
    }
    for (var j = 0; j <= cols; j++) {
      ctx.moveTo(j * cellSizeX, 0);
      ctx.lineTo(j * cellSizeX, 400);
    }
    ctx.stroke();
  }

  function getCellIndexFromCoord(x, y) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var canvasX = (x - rect.left) * scaleX;
    var canvasY = (y - rect.top) * scaleY;
    if (canvasX < 0 || canvasX >= 400 || canvasY < 0 || canvasY >= 400) return null;
    var col = Math.floor(canvasX / cellSizeX);
    var row = Math.floor(canvasY / cellSizeY);
    if (row < 0 || row >= rows || col < 0 || col >= cols) return null;
    return { row: row, col: col };
  }

  function setCellColor(row, col, color) {
    if (row < 0 || row >= rows || col < 0 || col >= cols) return;
    gridData[row][col] = color;
    ctx.fillStyle = color;
    ctx.fillRect(col * cellSizeX, row * cellSizeY, cellSizeX, cellSizeY);
    drawCanvas();
    saveToStorage(); // 自動保存
  }

  // 塗りつぶし
  function fillAllCells(color) {
    var confirm1 = confirm('全てのセルをこの色で塗りつぶしますか？');
    if (!confirm1) return;
    var confirm2 = confirm('本当に全てのセルを塗りつぶしますか？ (元に戻せません)');
    if (!confirm2) return;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        gridData[r][c] = color;
      }
    }
    drawCanvas();
    saveToStorage();
  }

  // マウスイベント
  function handleCanvasMouse(e) {
    var coord = getCellIndexFromCoord(e.clientX, e.clientY);
    if (!coord) return;
    setCellColor(coord.row, coord.col, selectedColor);
  }

  function onMouseDown(e) {
    isMouseDown = true;
    handleCanvasMouse(e);
    e.preventDefault();
  }
  function onMouseMove(e) {
    if (isMouseDown) handleCanvasMouse(e);
    e.preventDefault();
  }
  function onMouseUp(e) {
    isMouseDown = false;
    e.preventDefault();
  }
  function onMouseLeave(e) {
    isMouseDown = false;
  }

  // パレット作成
  function buildPalettes() {
    var container = document.getElementById('paletteContainer');
    container.innerHTML = '';
    for (var i = 0; i < paletteColors.length; i++) {
      var color = paletteColors[i];
      var swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.backgroundColor = color;
      swatch.dataset.color = color;
      if (color === selectedColor) swatch.classList.add('active');
      swatch.addEventListener('click', function(e) {
        var c = this.dataset.color;
        selectedColor = c;
        var allSwatches = document.querySelectorAll('#paletteContainer .color-swatch');
        for (var s = 0; s < allSwatches.length; s++) {
          allSwatches[s].classList.remove('active');
        }
        this.classList.add('active');
        var fillSwatches = document.querySelectorAll('#fillPaletteContainer .color-swatch');
        for (var f = 0; f < fillSwatches.length; f++) {
          fillSwatches[f].classList.remove('active');
        }
        saveToStorage();
      });
      container.appendChild(swatch);
    }

    var fillContainer = document.getElementById('fillPaletteContainer');
    fillContainer.innerHTML = '';
    for (var j = 0; j < paletteColors.length; j++) {
      var color2 = paletteColors[j];
      var swatch2 = document.createElement('div');
      swatch2.className = 'color-swatch';
      swatch2.style.backgroundColor = color2;
      swatch2.dataset.color = color2;
      swatch2.addEventListener('click', function(e) {
        var c = this.dataset.color;
        fillAllCells(c);
        var allSwatches = document.querySelectorAll('#fillPaletteContainer .color-swatch');
        for (var s = 0; s < allSwatches.length; s++) {
          allSwatches[s].classList.remove('active');
        }
        this.classList.add('active');
        var normalSwatches = document.querySelectorAll('#paletteContainer .color-swatch');
        for (var n = 0; n < normalSwatches.length; n++) {
          normalSwatches[n].classList.remove('active');
        }
      });
      fillContainer.appendChild(swatch2);
    }
  }

  function updateSizeDisplay() {
    document.getElementById('sizeDisplay').textContent = rows + '×' + cols;
    document.getElementById('gridSizeInput').value = rows;
    document.getElementById('gridSizeInput2').value = cols;
  }

  function resetGrid() {
    var really = confirm('本当にリセットしますか？ (すべて白に戻ります)');
    if (really) {
      gridData = initGrid(rows, cols);
      drawCanvas();
      saveToStorage();
    }
  }

  function downloadImage() {
    var link = document.createElement('a');
    link.download = 'dot_art.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function applySizeChange() {
    var val1 = parseInt(document.getElementById('gridSizeInput').value, 10);
    var val2 = parseInt(document.getElementById('gridSizeInput2').value, 10);
    if (isNaN(val1) || val1 < 1) val1 = 1;
    if (isNaN(val2) || val2 < 1) val2 = 1;
    if (val1 > 400) val1 = 400;
    if (val2 > 400) val2 = 400;
    rows = val1;
    cols = val2;
    cellSizeX = 400 / cols;
    cellSizeY = 400 / rows;
    gridData = initGrid(rows, cols);
    drawCanvas();
    updateSizeDisplay();
    saveToStorage();
  }

  // 初期化
  function init() {
    // 保存データがあれば読み込む
    var loaded = loadFromStorage();
    if (!loaded) {
      rows = 10;
      cols = 10;
      cellSizeX = 400 / cols;
      cellSizeY = 400 / rows;
      gridData = initGrid(rows, cols);
    }
    // 選択色が有効か確認
    var found = false;
    for (var i = 0; i < paletteColors.length; i++) {
      if (paletteColors[i] === selectedColor) { found = true; break; }
    }
    if (!found) selectedColor = '#000000';

    buildPalettes();
    drawCanvas();
    updateSizeDisplay();

    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseup', onMouseUp);
    canvas.addEventListener('mouseleave', onMouseLeave);

    document.getElementById('applySizeBtn').addEventListener('click', applySizeChange);
    document.getElementById('resetBtn').addEventListener('click', resetGrid);
    document.getElementById('downloadBtn').addEventListener('click', downloadImage);
  }

  init();
})();
</script>
</body>
</html>
