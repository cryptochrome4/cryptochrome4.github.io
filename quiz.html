<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズコード単語学習サイト - 前編</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #475569;
            --code-bg: #1e293b;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: var(--text-light);
            font-size: 1rem;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .word-btn {
            background-color: var(--card-bg);
            border: 2px solid #e2e8f0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .word-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .word-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .display-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .word-title {
            font-size: 1.8rem;
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .description-box {
            margin-bottom: 25px;
        }
        .description-box h3 {
            margin-bottom: 8px;
            color: var(--text);
        }
        .description-box p {
            color: var(--text-light);
            margin-top: 0;
        }
        pre {
            background-color: var(--code-bg);
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 0.9rem;
            margin: 0;
        }
        .comment { color: #6272a4; }
        .keyword { color: #ff79c6; }
        .string { color: #f1fa8c; }
        .number { color: #bd93f9; }
        .footer-nav {
            margin-top: 30px;
            text-align: right;
            color: var(--text-light);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>クイズコード専門用語学習：前編</h1>
        <p class="subtitle">📊 1. 問題データ・構造に関する単語 (1〜10 / 40)</p>
    </header>

    <!-- 単語切り替えボタン -->
    <div class="nav-buttons" id="navButtons"></div>

    <!-- コンテンツ表示エリア -->
    <div class="display-card" id="contentCard">
        <h2 class="word-title" id="wordTitle"></h2>
        <div class="description-box">
            <h3>💡 単語の解説</h3>
            <p id="wordDescription"></p>
        </div>
        <div>
            <h3>💻 コードでの実際の使われ方</h3>
            <pre id="codeDisplay"></pre>
        </div>
    </div>

    <div class="footer-nav">
        ※ボタンをクリックすると、解説とコード例が連動して切り替わります。
    </div>
</div>

<script>
// 前編用のデータ（単語1〜10）
const wordsData = [
    {
        id: 1,
        word: "Quiz",
        definition: "クイズアプリ全体、またはクイズゲームそのものを指す最も大きなオブジェクトやクラス名に使われます。アプリの根幹となる名前です。",
        code: `<span class="keyword">const</span> <span class="string">myQuiz</span> = {
    title: <span class="string">"JavaScript初心者検定"</span>,
    version: <span class="string">"1.0.0"</span>,
    questions: [] <span class="comment">// ここに問題を追加していく</span>
};`
    },
    {
        id: 2,
        word: "Question",
        definition: "クイズの中の「問題文」そのもの、あるいは問題1問分に関連するデータをひとまとめにしたオブジェクトの変数名として使われます。",
        code: `<span class="keyword">const</span> <span class="string">currentQuestion</span> = <span class="string">"日本の首都はどこ？"</span>;

<span class="comment">// または1問分のデータのかたまり</span>
<span class="keyword">const</span> <span class="string">questionData</span> = {
    text: <span class="string">"世界で一番高い山は？"</span>
};`
    },
    {
        id: 3,
        word: "Option / Choice",
        definition: "ユーザーがクリックして選ぶ「選択肢の1つひとつ」を指します。どちらの単語を使うかは開発者の好みですが、どちらも超頻出です。",
        code: `<span class="keyword">const</span> <span class="string">firstOption</span> = <span class="string">"富士山"</span>;
<span class="keyword">const</span> <span class="string">userChoice</span> = <span class="string">"エベレスト"</span>;`
    },
    {
        id: 4,
        word: "Options / Choices",
        definition: "単語3の複数形です。問題に対する「すべての選択肢のリスト（配列）」を格納するときに必ず使われます。配列（[ ]）で囲むのが基本です。",
        code: `<span class="keyword">const</span> <span class="string">options</span> = [<span class="string">"富士山"</span>, <span class="string">"エベレスト"</span>, <span class="string">"キリマンジャロ"</span>];`
    },
    {
        id: 5,
        word: "Answer",
        definition: "「回答」を表します。ユーザーが画面上で実際に選択した答え、またはシステムが裏側で持っている答えを格納する変数に使われます。",
        code: `<span class="keyword">let</span> <span class="string">userAnswer</span> = <span class="string">""</span>; <span class="comment">// ユーザーが選んだ答えを入れる空の変数</span>`
    },
    {
        id: 6,
        word: "CorrectAnswer",
        definition: "その問題の「正解（正しい答え）」をピンポイントで格納する変数です。ユーザーの回答とこの値を比較して、正解・不正解を判定します。",
        code: `<span class="keyword">const</span> <span class="string">correctAnswer</span> = <span class="string">"エベレスト"</span>;`
    },
    {
        id: 7,
        word: "SelectedOption",
        definition: "「現在ユーザーがマウスや指でクリックして選択している状態の選択肢」を一時的に保存しておくための変数名です。",
        code: `<span class="keyword">let</span> <span class="string">selectedOption</span> = <span class="string">"富士山"</span>; <span class="comment">// ユーザーが富士山をクリックした状態</span>`
    },
    {
        id: 8,
        word: "Explanation",
        definition: "問題の「解説文」です。ユーザーが回答を選び終わった後に、「なぜそれが正解なのか」を画面に説明するテキストデータとして使われます。",
        code: `<span class="keyword">const</span> <span class="string">explanation</span> = <span class="string">"エベレストは標高8,848mで世界最高の高さを誇る山です。"</span>;`
    },
    {
        id: 9,
        word: "Category / Genre",
        definition: "問題の「ジャンルやカテゴリ（歴史、科学、アニメ、雑学など）」を分類・管理して、画面に表示したり絞り込んだりする際に使います。",
        code: `<span class="keyword">const</span> <span class="string">category</span> = <span class="string">"地理"</span>;`
    },
    {
        id: 10,
        word: "Difficulty",
        definition: "問題の「難易度」を表します。一般的に \"Easy\"(簡単)、\"Medium\"(普通)、\"Hard\"(難しい) などの文字列を入れて管理します。",
        code: `<span class="keyword">const</span> <span class="string">difficulty</span> = <span class="string">"Medium"</span>;`
    }
];

// 初期設定と画面への描画処理
const navButtonsContainer = document.getElementById('navButtons');
const wordTitle = document.getElementById('wordTitle');
const wordDescription = document.getElementById('wordDescription');
const codeDisplay = document.getElementById('codeDisplay');

function displayWord(index) {
    const item = wordsData[index];
    wordTitle.textContent = `${item.id}. ${item.word}`;
    wordDescription.textContent = item.definition;
    codeDisplay.innerHTML = item.code;

    // ボタンのアクティブ状態を切り替え
    const buttons = document.querySelectorAll('.word-btn');
    buttons.forEach((btn, idx) => {
        if(idx === index) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

// ボタンを自動生成
wordsData.forEach((item, index) => {
    const button = document.createElement('button');
    button.className = 'word-btn';
    button.textContent = item.word;
    button.addEventListener('click', () => displayWord(index));
    navButtonsContainer.appendChild(button);
});

// 最初の単語を初期表示
displayWord(0);
</script>

</body>
</html>
