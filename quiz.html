<!-- ==========================================
     クイズコード専門用語学習：前編 (単語 1〜10)
     ========================================== -->
<div class="quiz-container-part1">
    <header class="quiz-header-part1">
        <h1 class="quiz-h1-part1">クイズコード専門用語学習：前編</h1>
        <p class="quiz-subtitle-part1">📊 1. 問題データ・構造に関する単語 (1〜10 / 40)</p>
    </header>

    <!-- 前編専用のボタンエリア -->
    <div class="word-buttons-part1" id="navButtons_part1"></div>

    <!-- 前編専用の表示カード -->
    <div class="display-card-part1" id="contentCard_part1">
        <h2 class="word-title-part1" id="wordTitle_part1"></h2>
        <div class="description-box-part1">
            <h3 class="quiz-h3-part1">💡 単語の解説</h3>
            <p id="wordDescription_part1"></p>
        </div>
        <div>
            <h3 class="quiz-h3-part1">💻 コードでの実際の使われ方</h3>
            <pre class="quiz-pre-part1" id="codeDisplay_part1"></pre>
        </div>
    </div>

    <div class="footer-nav-part1">
        ※ボタンをクリックすると、解説とコード例が連動して切り替わります。
    </div>
</div>

<style>
/* 前編専用のデザイン（他と混ざらないように設定） */
.quiz-container-part1 {
    max-width: 800px;
    margin: 20px auto 40px auto;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #0f172a;
    line-height: 1.6;
    background-color: #f8fafc;
    padding: 20px;
    border-radius: 12px;
}
.quiz-header-part1 { text-align: center; margin-bottom: 30px; }
.quiz-h1-part1 { color: #4f46e5; font-size: 1.8rem; margin-bottom: 10px; }
.quiz-subtitle-part1 { color: #475569; font-size: 0.95rem; }
.word-buttons-part1 { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
.word-btn-part1 {
    background-color: #ffffff;
    border: 2px solid #e2e8f0;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9rem;
    transition: all 0.2s;
}
.word-btn-part1:hover { border-color: #4f46e5; color: #4f46e5; }
.word-btn-part1.active { background-color: #4f46e5; border-color: #4f46e5; color: white; }
.display-card-part1 { background-color: #ffffff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
.word-title-part1 { font-size: 1.6rem; margin-top: 0; color: #4f46e5; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
.quiz-h3-part1 { margin-bottom: 8px; color: #0f172a; font-size: 1.1rem; }
.description-box-part1 p { color: #475569; margin-top: 0; }
.quiz-pre-part1 { background-color: #1e293b; color: #f8f8f2; padding: 20px; border-radius: 8px; overflow-x: auto; font-family: monospace; font-size: 0.9rem; margin: 0; }
.footer-nav-part1 { margin-top: 20px; text-align: right; color: #475569; font-size: 0.85rem; }
/* コードハイライト用 */
.quiz-pre-part1 .keyword { color: #ff79c6; }
.quiz-pre-part1 .string { color: #f1fa8c; }
.quiz-pre-part1 .comment { color: #6272a4; }
</style>

<script>
// 前編専用のJavaScriptオブジェクトと変数
const wordsData_part1 = [
    { id: 1, word: "Quiz", definition: "クイズアプリ全体、またはクイズゲームそのものを指すオブジェクトやクラス名に使われます。", code: `<span class="keyword">const</span> <span class="string">myQuiz</span> = {\n    title: <span class="string">"JavaScript初心者検定"</span>,\n    questions: []\n};` },
    { id: 2, word: "Question", definition: "クイズの中の「問題文」そのもの、あるいは問題1問分のデータをまとめた変数名です。", code: `<span class="keyword">const</span> <span class="string">currentQuestion</span> = <span class="string">"日本の首都はどこ？"</span>;` },
    { id: 3, word: "Option / Choice", definition: "ユーザーがクリックして選ぶ「選択肢の1つひとつ」を指します。", code: `<span class="keyword">const</span> <span class="string">userChoice</span> = <span class="string">"エベレスト"</span>;` },
    { id: 4, word: "Options / Choices", definition: "問題に対する「すべての選択肢のリスト（配列）」を格納するときに使われます。", code: `<span class="keyword">const</span> <span class="string">options</span> = [<span class="string">"富士山"</span>, <span class="string">"エベレスト"</span>];` },
    { id: 5, word: "Answer", definition: "「回答」を表します。ユーザーが選んだ答えや、システム側の回答データを指します。", code: `<span class="keyword">let</span> <span class="string">userAnswer</span> = <span class="string">""</span>;` },
    { id: 6, word: "CorrectAnswer", definition: "その問題の「正解（正しい答え）」をピンポイントで格納する変数です。", code: `<span class="keyword">const</span> <span class="string">correctAnswer</span> = <span class="string">"エベレスト"</span>;` },
    { id: 7, word: "SelectedOption", definition: "「現在ユーザーがマウスや指でクリックして選択している状態の選択肢」を一時保存します。", code: `<span class="keyword">let</span> <span class="string">selectedOption</span> = <span class="string">"富士山"</span>;` },
    { id: 8, word: "Explanation", definition: "問題の「解説文」です。回答後に「なぜそれが正解なのか」を説明するテキストです。", code: `<span class="keyword">const</span> <span class="string">explanation</span> = <span class="string">"エベレストは世界最高の高さを誇る山です。"</span>;` },
    { id: 9, word: "Category", definition: "問題の「ジャンルやカテゴリ（歴史、科学など）」を分類・管理します。", code: `<span class="keyword">const</span> <span class="string">category</span> = <span class="string">"地理"</span>;` },
    { id: 10, word: "Difficulty", definition: "問題の「難易度」を表します。\"Easy\", \"Hard\" などの文字列を入れます。", code: `<span class="keyword">const</span> <span class="string">difficulty</span> = <span class="string">"Medium"</span>;` }
];

const navContainer_part1 = document.getElementById('navButtons_part1');
const titleElement_part1 = document.getElementById('wordTitle_part1');
const descElement_part1 = document.getElementById('wordDescription_part1');
const codeElement_part1 = document.getElementById('codeDisplay_part1');

function displayWord_part1(index) {
    const item = wordsData_part1[index];
    titleElement_part1.textContent = `${item.id}. ${item.word}`;
    descElement_part1.textContent = item.definition;
    codeElement_part1.innerHTML = item.code;

    const buttons = navContainer_part1.querySelectorAll('.word-btn-part1');
    buttons.forEach((btn, idx) => {
        if(idx === index) { btn.classList.add('active'); } else { btn.classList.remove('active'); }
    });
}

wordsData_part1.forEach((item, index) => {
    const button = document.createElement('button');
    button.className = 'word-btn-part1';
    button.textContent = item.word.split(' / ')[0];
    button.addEventListener('click', () => displayWord_part1(index));
    navContainer_part1.appendChild(button);
});

displayWord_part1(0);
</script>
