<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間の釣りゲーム 〜サンマを釣れ！〜</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a2f3a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-container {
            background: #2b5f73;
            padding: 20px 30px 35px;
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.2);
            border-bottom: 8px solid #1a3f4f;
        }
        .canvas-wrapper {
            background: #6b9fb3;
            border-radius: 40px 40px 20px 20px;
            padding: 10px;
            box-shadow: inset 0 0 0 3px #3a7a8f, inset 0 0 15px #1f4f62;
        }
        canvas {
            display: block;
            margin: 0 auto;
            width: 800px;
            height: 500px;
            border-radius: 30px 30px 16px 16px;
            background: #7bb8cf;
            box-shadow: inset 0 0 30px #2f6a7e;
            image-rendering: pixelated;
            cursor: pointer;
        }
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            gap: 12px;
        }
        .field-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .field-btn {
            background: #d7ecf5;
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #104a5e;
            box-shadow: 0 4px 0 #6a8a96, 0 3px 8px rgba(0,0,0,0.2);
            transition: 0.05s linear;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .field-btn.active {
            background: #feda75;
            box-shadow: 0 4px 0 #a57c2e;
            transform: translateY(1px);
            color: #1f3d47;
        }
        .field-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #6a8a96;
        }
        .action-area {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #14556b;
            padding: 5px 20px 5px 18px;
            border-radius: 80px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
        }
        .fish-count {
            color: #f5ffd3;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 2px 3px black;
            background: #08303f;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 1px;
            min-width: 70px;
            text-align: center;
        }
        .catch-btn {
            background: #fdbb3a;
            border: none;
            border-radius: 60px;
            padding: 12px 32px;
            font-weight: 800;
            font-size: 1.3rem;
            color: #1d3b44;
            box-shadow: 0 6px 0 #8f6b1f, 0 6px 12px black;
            transition: 0.04s linear;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .catch-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #8f6b1f;
        }
        .catch-btn:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #5f491b;
            pointer-events: none;
        }
        .message-box {
            font-size: 0.95rem;
            background: #09303f;
            padding: 6px 22px;
            border-radius: 30px;
            color: #cfeefb;
            font-weight: 500;
            min-width: 150px;
            text-align: center;
            box-shadow: inset 0 0 10px #08222e;
        }
        .win-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .win-overlay.show {
            display: flex;
        }
        .win-card {
            background: #edf9fc;
            padding: 30px 50px 50px;
            border-radius: 70px 70px 40px 40px;
            text-align: center;
            box-shadow: 0 30px 40px rgba(0,0,0,0.8);
            max-width: 480px;
            border: 4px solid #f5c542;
        }
        .win-card h1 {
            font-size: 3.5rem;
            margin: 0 0 5px;
            color: #d48c2b;
            text-shadow: 0 4px 0 #7a581d;
        }
        .win-card p {
            font-size: 1.2rem;
            color: #1a4d5e;
        }
        .win-card .study-link {
            display: inline-block;
            margin-top: 25px;
            background: #1f7a5c;
            color: white;
            font-weight: bold;
            font-size: 1.7rem;
            padding: 16px 48px;
            border-radius: 80px;
            text-decoration: none;
            box-shadow: 0 8px 0 #0a3d2e;
            transition: 0.08s linear;
            letter-spacing: 2px;
        }
        .win-card .study-link:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #0a3d2e;
        }
        .footer {
            margin-top: 10px;
            color: #bbdef0;
            font-size: 0.8rem;
            text-align: center;
        }
        .key-hint {
            color: #b3d9e8;
            font-size: 0.75rem;
            margin-left: 10px;
            background: #0a3342;
            padding: 3px 14px;
            border-radius: 30px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div class="control-panel">
        <div class="field-selector">
            <button class="field-btn" data-field="river_up">川上流</button>
            <button class="field-btn" data-field="river_mid">川中流</button>
            <button class="field-btn" data-field="river_down">川下流</button>
            <button class="field-btn" data-field="sea_shallow">海浅場</button>
            <button class="field-btn" data-field="sea_deep">海深場</button>
        </div>
        <div class="action-area">
            <span class="fish-count" id="fishCountDisplay">🐟 0</span>
            <button class="catch-btn" id="catchBtn">🎣 釣る！</button>
        </div>
        <div class="message-box" id="messageBox">サンマを狙え！</div>
    </div>
    <div class="footer">
        <span>⬆⬇⬅➡ 移動 · 釣り場で止まって魚を待つ</span>
        <span class="key-hint">⏎ 釣る</span>
    </div>
</div>

<!-- 勝利オーバーレイ -->
<div class="win-overlay" id="winOverlay">
    <div class="win-card">
        <h1>🏆 サンマ !</h1>
        <p>見事サンマを釣り上げた！<br>あなたは正しい場所を選んだ。</p>
        <a href="#" class="study-link" id="studyLink">📖 border.html へ</a>
        <p style="margin-top: 18px; font-size:0.9rem; color:#3b6c7a;">※ 釣りゲームは非表示になります</p>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ----- フィールド定義 (サンマ出現率 現実に近い調整) -----
        const FIELD_DATA = {
            river_up:   { sanmaRate: 0.01,  fishPool: ['ヤマメ', 'イワナ', 'アユ', 'カジカ'], bg: 'river_up' },
            river_mid:  { sanmaRate: 0.02,  fishPool: ['ヤマメ', 'アユ', 'オイカワ', 'ウグイ'], bg: 'river_mid' },
            river_down: { sanmaRate: 0.03,  fishPool: ['ボラ', 'ハゼ', 'ウグイ', 'スズキ'], bg: 'river_down' },
            sea_shallow:{ sanmaRate: 0.18,  fishPool: ['サバ', 'イワシ', 'アジ', 'カレイ', 'タイ'], bg: 'sea_shallow' },
            sea_deep:   { sanmaRate: 0.42,  fishPool: ['サンマ', 'マグロ', 'カツオ', 'ブリ', 'サメ'], bg: 'sea_deep' }
        };

        // プレイヤー座標 (2D見下ろし)
        let playerX = 400, playerY = 250;
        const PLAYER_SIZE = 24;
        const MOVE_STEP = 6;

        // ゲーム状態
        let currentField = 'sea_deep';
        let caughtFish = [];
        let fishCount = 0;
        let isWaitingForBite = false;
        let biteFishName = '';
        let catchCooldown = false;
        let winTriggered = false;
        let fishAppearTimer = 0;
        const FISH_APPEAR_INTERVAL = 45; // フレーム数

        // DOM
        const messageBox = document.getElementById('messageBox');
        const fishCountDisplay = document.getElementById('fishCountDisplay');
        const catchBtn = document.getElementById('catchBtn');
        const winOverlay = document.getElementById('winOverlay');
        const studyLink = document.getElementById('studyLink');
        const fieldBtns = document.querySelectorAll('.field-btn');

        // キー入力
        const keys = { up: false, down: false, left: false, right: false };

        // ----- フィールド切り替え -----
        function setField(fieldKey) {
            if (winTriggered) return;
            currentField = fieldKey;
            fieldBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.field === fieldKey) btn.classList.add('active');
            });
            const fieldData = FIELD_DATA[fieldKey];
            const fieldName = {
                river_up:'川上流', river_mid:'川中流', river_down:'川下流',
                sea_shallow:'海浅場', sea_deep:'海深場'
            }[fieldKey] || '不明';
            messageBox.textContent = `📍 ${fieldName} · サンマ率 ${Math.round(fieldData.sanmaRate*100)}%`;
            // バイト状態リセット
            isWaitingForBite = false;
            biteFishName = '';
            catchBtn.disabled = false;
            fishAppearTimer = 0;
            drawGame();
        }

        // ----- 背景描画 (フィールドごとに異なる) -----
        function drawBackground() {
            const bgType = FIELD_DATA[currentField].bg;
            // ベースカラー
            let grad;
            if (bgType === 'river_up' || bgType === 'river_mid' || bgType === 'river_down') {
                // 川系: 透明感のある青緑
                grad = ctx.createLinearGradient(0, 0, 0, 500);
                grad.addColorStop(0, '#82b8c9');
                grad.addColorStop(0.5, '#5f9eb3');
                grad.addColorStop(1, '#3f7e93');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 800, 500);
                // 川の流れ模様
                ctx.strokeStyle = 'rgba(255,255,255,0.13)';
                ctx.lineWidth = 2;
                for (let i=0; i<10; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, 30 + i*50 + Math.sin(i)*10);
                    for (let x=0; x<=800; x+=8) {
                        ctx.lineTo(x, 30 + i*50 + Math.sin(x/30 + i*0.8 + Date.now()/3000)*8);
                    }
                    ctx.stroke();
                }
                // 川岸っぽい影
                ctx.fillStyle = 'rgba(50,80,70,0.15)';
                ctx.fillRect(0, 420, 800, 80);
            } else {
                // 海系: 青〜濃紺
                grad = ctx.createLinearGradient(0, 0, 0, 500);
                grad.addColorStop(0, '#3b88b0');
                grad.addColorStop(0.5, '#1d6a8a');
                grad.addColorStop(1, '#0d4a66');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 800, 500);
                // 波模様
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 2.5;
                for (let i=0; i<12; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, 20 + i*45 + i*3);
                    for (let x=0; x<=800; x+=10) {
                        ctx.lineTo(x, 20 + i*45 + i*3 + Math.sin(x/25 + i*1.3 + Date.now()/2000)*12);
                    }
                    ctx.stroke();
                }
                // 海深場はより暗い
                if (bgType === 'sea_deep') {
                    ctx.fillStyle = 'rgba(0,20,40,0.25)';
                    ctx.fillRect(0, 0, 800, 500);
                }
            }
            // 格子 (見下ろし感)
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let i=0; i<800; i+=40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 500);
                ctx.stroke();
            }
            for (let i=0; i<500; i+=40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(800, i);
                ctx.stroke();
            }
        }

        // ----- 棒人間 (2D見下ろし) -----
        function drawPlayer() {
            const x = playerX, y = playerY;
            // 影
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 12;
            // 体 (丸みを帯びた棒人間)
            ctx.fillStyle = '#f7d9a0';
            ctx.beginPath();
            ctx.ellipse(x, y-6, 12, 14, 0, 0, Math.PI*2);
            ctx.fill();
            // 頭
            ctx.fillStyle = '#f7d9a0';
            ctx.beginPath();
            ctx.arc(x, y-22, 10, 0, 2*Math.PI);
            ctx.fill();
            // 目
            ctx.fillStyle = '#1a2a2f';
            ctx.beginPath();
            ctx.arc(x-4, y-24, 2.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x+4, y-24, 2.5, 0, 2*Math.PI);
            ctx.fill();
            // 竿 (斜め)
            ctx.strokeStyle = '#6b4a2e';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x+10, y-18);
            ctx.lineTo(x+35, y-40);
            ctx.stroke();
            // 糸
            ctx.strokeStyle = '#b0b0b0';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x+35, y-40);
            ctx.lineTo(x+50, y-20);
            ctx.stroke();
            // 浮き
            ctx.fillStyle = '#e03a3a';
            ctx.beginPath();
            ctx.arc(x+50, y-20, 5, 0, 2*Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // ----- 魚の表示 (餌に来ている) -----
        function drawBiteFish() {
            if (!isWaitingForBite || !biteFishName) return;
            const fx = playerX + 65, fy = playerY - 10;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 16;
            // 魚体
            ctx.fillStyle = '#ddbb77';
            ctx.beginPath();
            ctx.ellipse(fx, fy, 22, 14, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#5f4a2a';
            ctx.lineWidth = 2;
            ctx.stroke();
            // 目
            ctx.fillStyle = '#f0f0f0';
            ctx.beginPath();
            ctx.arc(fx+8, fy-3, 4, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(fx+10, fy-5, 2, 0, 2*Math.PI);
            ctx.fill();
            // 尾びれ
            ctx.fillStyle = '#b8955a';
            ctx.beginPath();
            ctx.moveTo(fx-22, fy);
            ctx.lineTo(fx-36, fy-14);
            ctx.lineTo(fx-36, fy+14);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            // 名前
            ctx.font = 'bold 14px sans-serif';
            ctx.fillStyle = '#02212b';
            ctx.fillText(`🐟 ${biteFishName}`, fx-20, fy-30);
        }

        // ----- メイン描画 -----
        function drawGame() {
            ctx.clearRect(0, 0, 800, 500);
            drawBackground();
            drawPlayer();
            drawBiteFish();

            // 情報表示 (フィールド名)
            ctx.font = 'bold 14px "Segoe UI", sans-serif';
            ctx.fillStyle = '#02212b';
            ctx.shadowColor = 'rgba(255,255,255,0.2)';
            ctx.shadowBlur = 4;
            const fname = {
                river_up:'川上流', river_mid:'川中流', river_down:'川下流',
                sea_shallow:'海浅場', sea_deep:'海深場'
            }[currentField] || '';
            ctx.fillText(`📍 ${fname}`, 20, 35);
            ctx.shadowBlur = 0;
        }

        // ----- 魚をヒットさせる (タイマー制) -----
        function tryBite() {
            if (winTriggered) return;
            if (catchCooldown) return;
            if (isWaitingForBite) return;

            const fieldData = FIELD_DATA[currentField];
            const rand = Math.random();
            let selectedFish = '';
            if (rand < fieldData.sanmaRate) {
                selectedFish = 'サンマ';
            } else {
                const pool = fieldData.fishPool.filter(f => f !== 'サンマ');
                if (pool.length === 0) selectedFish = fieldData.fishPool[0] || 'イワシ';
                else selectedFish = pool[Math.floor(Math.random() * pool.length)];
            }
            isWaitingForBite = true;
            biteFishName = selectedFish;
            messageBox.textContent = `🐡 ${biteFishName} がヒット！ 釣るボタンを押せ！`;
            catchBtn.disabled = false;
            drawGame();
        }

        // ----- 釣るアクション -----
        function performCatch() {
            if (winTriggered) return;
            if (!isWaitingForBite) {
                messageBox.textContent = '💤 まだ魚が来てない... 待って';
                return;
            }
            if (catchCooldown) return;

            const caughtName = biteFishName;
            caughtFish.push(caughtName);
            fishCount++;
            fishCountDisplay.textContent = `🐟 ${fishCount}`;

            if (caughtName === 'サンマ') {
                winTriggered = true;
                isWaitingForBite = false;
                biteFishName = '';
                catchBtn.disabled = true;
                messageBox.textContent = '🎉 サンマを釣った！ 勝利！';
                drawGame();
                winOverlay.classList.add('show');
                studyLink.href = 'border.html';
                return;
            }

            messageBox.textContent = `✅ ${caughtName} を釣った！ また待つ`;
            isWaitingForBite = false;
            biteFishName = '';
            catchBtn.disabled = true;
            catchCooldown = true;
            setTimeout(() => {
                catchCooldown = false;
                if (!winTriggered && !isWaitingForBite) {
                    tryBite();
                }
            }, 800);
            drawGame();
        }

        // ----- 移動処理 -----
        function movePlayer() {
            if (winTriggered) return;
            let dx = 0, dy = 0;
            if (keys.left) dx = -MOVE_STEP;
            if (keys.right) dx = MOVE_STEP;
            if (keys.up) dy = -MOVE_STEP;
            if (keys.down) dy = MOVE_STEP;
            if (dx !== 0 || dy !== 0) {
                // 対角線補正
                if (dx !== 0 && dy !== 0) {
                    dx *= 0.707;
                    dy *= 0.707;
                }
                const newX = Math.min(780-PLAYER_SIZE, Math.max(PLAYER_SIZE, playerX + dx));
                const newY = Math.min(480-PLAYER_SIZE, Math.max(PLAYER_SIZE, playerY + dy));
                // 移動したらバイト状態リセット (魚は逃げる)
                if ((newX !== playerX || newY !== playerY) && isWaitingForBite) {
                    isWaitingForBite = false;
                    biteFishName = '';
                    catchBtn.disabled = true;
                    messageBox.textContent = '🚶 移動したので魚が逃げた... また待つ';
                    drawGame();
                }
                playerX = newX;
                playerY = newY;
                drawGame();
            }
        }

        // ----- ゲームループ (移動 + 魚出現タイマー) -----
        function gameLoop() {
            if (!winTriggered) {
                movePlayer();
                // 魚出現タイマー
                if (!isWaitingForBite && !catchCooldown && !winTriggered) {
                    fishAppearTimer++;
                    if (fishAppearTimer >= FISH_APPEAR_INTERVAL) {
                        fishAppearTimer = 0;
                        tryBite();
                    }
                } else {
                    fishAppearTimer = 0;
                }
            }
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // ----- イベントリスナー -----
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowUp') { keys.up = true; e.preventDefault(); }
            if (key === 'ArrowDown') { keys.down = true; e.preventDefault(); }
            if (key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
            if (key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
            if (key === 'Enter' || key === ' ') {
                e.preventDefault();
                performCatch();
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowUp') { keys.up = false; e.preventDefault(); }
            if (key === 'ArrowDown') { keys.down = false; e.preventDefault(); }
            if (key === 'ArrowLeft') { keys.left = false; e.preventDefault(); }
            if (key === 'ArrowRight') { keys.right = false; e.preventDefault(); }
        });

        catchBtn.addEventListener('click', performCatch);

        fieldBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (winTriggered) return;
                const field = e.target.dataset.field;
                setField(field);
                isWaitingForBite = false;
                biteFishName = '';
                catchBtn.disabled = true;
                fishAppearTimer = 0;
                drawGame();
                // 少し遅れてバイト
                setTimeout(() => {
                    if (!winTriggered && !isWaitingForBite) tryBite();
                }, 400);
            });
        });

        // ----- 初期化 -----
        function init() {
            document.querySelector('.field-btn[data-field="sea_deep"]').classList.add('active');
            setField('sea_deep');
            fishAppearTimer = 0;
            setTimeout(() => { if (!winTriggered) tryBite(); }, 500);
            gameLoop();
        }
        init();

        // 隠しメッセージ: サンマ出現率 (勉強用)
        console.log('サンマ出現率: 川上流1%, 川中流2%, 川下流3%, 海浅場18%, 海深場42% (現実準拠)');
    })();
</script>
</body>
</html>
