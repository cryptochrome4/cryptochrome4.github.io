<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラー足し算学習表</title>
    <style>
        /* 全体の基本デザイン */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        /* 足し算の表全体のコンテナ */
        .tashi-container {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 12px;
            max-width: 1000px;
            width: 100%;
        }
        /* 各マス（カード）のデザイン */
        .tashi-card {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .tashi-title {
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 5px;
            margin-bottom: 8px;
            color: #4a5568;
        }
        .tashi-line {
            font-size: 1.2rem;
            margin: 6px 0;
            font-weight: bold;
            letter-spacing: 1px;
            /* 明るい色（黄色など）を見えやすくするための薄いフチ取り */
            text-shadow: 1px 1px 1px rgba(0,0,0,0.15), -1px -1px 1px rgba(0,0,0,0.15);
        }
        
        /* 九九と同じ色ルールを適用 */
        .digit-1 { color: #ff0000; } /* つねに赤 */
        .digit-2 { color: #007fff; } /* 水色に近い青 */
        .digit-3 { color: #ffff00; } /* 黄色 */
        .digit-4 { color: #ff007f; } /* 赤に近いピンク */
        .digit-5 { color: #4b0082; } /* 紫かかった青 */
        .digit-6 { color: #8b4513; } /* 茶色 */
        .digit-7 { color: #ffb6c1; } /* 白に近いピンク */
        .digit-8 { color: #ff7f00; } /* 橙 */
        .digit-9 { color: #2e0854; } /* 紫かかった黒 */
        
        /* 画面が狭いときのレスポンシブ対応 */
        @media (max-width: 768px) {
            .tashi-container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 480px) {
            .tashi-container { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <h1>色で覚える足し算一覧表</h1>
    
    <!-- ここにJavaScriptで足し算の表が自動で入ります -->
    <div class="tashi-container" id="tashiGrid"></div>

    <script>
        // 渡された数字を1文字ずつごとの色付きHTMLに変換する関数
        function colorizeNumbers(num) {
            const numStr = String(num);
            let resultHtml = "";
            
            for (let i = 0; i < numStr.length; i++) {
                const digit = numStr[i];
                // 1〜9の数字であれば対応するクラスを適用、それ以外（0など）はそのまま
                if (digit >= '1' && digit <= '9') {
                    resultHtml += `<span class="digit-${digit}">${digit}</span>`;
                } else {
                    resultHtml += `<span>${digit}</span>`;
                }
            }
            return resultHtml;
        }
        // 足し算の表を自動生成してHTMLに挿入する処理
        const grid = document.getElementById('tashiGrid');
        
        for (let base = 1; base <= 9; base++) {
            // 各数字から始まるカードを作成
            let cardHtml = `<div class="tashi-card">`;
            cardHtml += `<div class="tashi-title">${colorizeNumbers(base)}の足し算</div>`;
            
            for (let i = 1; i <= 9; i++) {
                const answer = base + i;
                
                // 全ての数字に色付け関数を適用
                const partBase = colorizeNumbers(base);
                const partI = colorizeNumbers(i);
                const partAns = colorizeNumbers(answer);
                
                // 記号を「+」に変更
                cardHtml += `<div class="tashi-line">${partBase}＋${partI}＝${partAns}</div>`;
            }
            
            cardHtml += `</div>`;
            grid.innerHTML += cardHtml;
        }
    </script>
</body>
</html>
