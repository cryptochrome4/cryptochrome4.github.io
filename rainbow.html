<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラー足し算学習表</title>
    <style>
        /* 全体の基本デザイン */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        /* 足し算の表全体のコンテナ */
        .tashi-container {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 12px;
            max-width: 1000px;
            width: 100%;
        }
