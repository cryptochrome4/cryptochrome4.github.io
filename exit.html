<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>4番出口 · カササギの生態</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
        }
        .game-container {
            background: #1a212b;
            border-radius: 32px;
            padding: 24px 28px 32px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.8), inset 0 0 0 1px #3a4a5a;
            max-width: 640px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .display-area {
            background: #10161e;
            border-radius: 20px;
            padding: 18px 20px 20px;
            border: 1px solid #2f4052;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .exit-sign {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #bcd4e6;
            text-shadow: 0 0 6px #3d7a9c;
            background: #1f2b38;
            padding: 12px 10px;
            border-radius: 60px;
            text-align: center;
            border: 1px solid #3f5a72;
            margin-bottom: 20px;
            transition: all 0.15s;
            cursor: default;
        }
        .exit-sign.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            height: 0;
            padding: 0;
            margin: 0;
            border: 0;
            overflow: hidden;
            transition: all 0.25s;
        }
        .message-box {
            background: #0d121b;
            border-radius: 16px;
            padding: 18px 16px;
            border-left: 6px solid #4c7a9c;
            color: #c8dae8;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 80px;
            box-shadow: inset 0 2px 3px #00000055;
            margin-bottom: 18px;
        }
        .magpie-info {
            background: #0f1a1f;
            border-radius: 16px;
            padding: 20px 18px;
            border: 1px solid #3a6b7a;
            color: #d4eaf0;
            font-size: 0.95rem;
            line-height: 1.7;
            display: none;
            box-shadow: inset 0 0 12px #1e3e4a;
        }
        .magpie-info.visible {
            display: block;
        }
        .magpie-info h3 {
            color: #b3def0;
            font-size: 1.25rem;
            letter-spacing: 1px;
            border-bottom: 1px dashed #3f7a8a;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
        .magpie-info p {
            margin-bottom: 8px;
        }
        .magpie-info ul {
            padding-left: 22px;
            margin: 8px 0 12px;
        }
        .magpie-info li {
            list-style-type: square;
            color: #b8d8e8;
        }
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 8px;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 18px;
        }
        .game-btn {
            background: #273542;
            border: none;
            border-radius: 60px;
            padding: 14px 30px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 1.3rem;
            color: #d3e2f0;
            box-shadow: 0 6px 0 #0f151d, 0 4px 8px rgba(0,0,0,0.6);
            transition: all 0.06s linear;
            cursor: pointer;
            border: 1px solid #4b657b;
            letter-spacing: 1px;
            flex: 1 0 auto;
            min-width: 110px;
            text-shadow: 0 1px 0 #2f4a5a;
        }
        .game-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #0f151d;
        }
        .game-btn.reset-btn {
            background: #3a2e3e;
            border-color: #6e4f5e;
            color: #f0d8dc;
            box-shadow: 0 6px 0 #231d26;
        }
        .game-btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0f151d;
            pointer-events: none;
        }
        .counter {
            color: #7e9bb0;
            font-size: 0.9rem;
            background: #18222d;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #324a58;
            text-align: center;
        }
        .footer {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #56748a;
            font-size: 0.8rem;
        }
        @media (max-width: 480px) {
            .game-container { padding: 16px; }
            .exit-sign { font-size: 1.8rem; }
            .game-btn { font-size: 1.1rem; padding: 12px 16px; min-width: 80px; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="display-area">
        <!-- 4番出口 表示 -->
        <div class="exit-sign" id="exitSign">🚪 4番出口</div>

        <!-- 通常メッセージ or カササギ情報 -->
        <div class="message-box" id="messageBox">
            <span id="dynamicMessage">▶ 出口はどこだろう？</span>
        </div>

        <!-- カササギ情報 (隠し) -->
        <div class="magpie-info" id="magpieInfo">
            <h3>🖤 カササギ (Pica pica)</h3>
            <p>カササギはカラス科の鳥類で、ユーラシア大陸に広く分布します。</p>
            <ul>
                <li>体長は約40〜50cm。黒と白のコントラストが美しい。</li>
                <li>雑食性で、昆虫、小動物、果実、種子、さらにはゴミも食べる。</li>
                <li>非常に知能が高く、鏡に映った自分を認識できる数少ない鳥の一種。</li>
                <li>つがいで生活し、大きな巣を作る。巣はドーム状で、木の高い場所に作る。</li>
                <li>鳴き声は「カシャカシャ」と騒がしく、様々な音を真似ることも。</li>
            </ul>
            <p style="margin-top: 10px; font-size: 0.9rem; color: #aac2d0;">—— クリアおめでとう！ 4番出口はもう要らないね。</p>
        </div>

        <!-- アクションエリア -->
        <div class="action-area">
            <div class="button-group">
                <button class="game-btn" id="leftBtn">⬅ 左</button>
                <button class="game-btn" id="rightBtn">➡ 右</button>
                <button class="game-btn" id="straightBtn">⬆ 直進</button>
            </div>
            <div class="button-group">
                <button class="game-btn reset-btn" id="resetBtn">↺ 戻る</button>
            </div>
        </div>

        <div class="footer">
            <span class="counter" id="stepCounter">ステップ: 0</span>
            <span style="color:#3f5f72;">🖱️ マウス操作</span>
        </div>
    </div>
</div>
<script>
    (function() {
        // ---------- 2013年ハードウェア向け シンプル実装 ----------
        // 状態管理 (キーボード不使用・マウスクリックのみ)
        let stepCount = 0;
        let gameCleared = false;       // クリアフラグ (4番出口非表示)
        let magpieVisible = false;     // カササギ情報表示中か

        // DOM 要素
        const exitSign = document.getElementById('exitSign');
        const dynamicMsg = document.getElementById('dynamicMessage');
        const magpieInfo = document.getElementById('magpieInfo');
        const stepCounter = document.getElementById('stepCounter');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const straightBtn = document.getElementById('straightBtn');
        const resetBtn = document.getElementById('resetBtn');

        // メッセージ更新関数 (シンプル)
        function setMessage(text) {
            dynamicMsg.textContent = text;
        }

        // クリア状態を更新 (カササギ表示 / 4番出口非表示)
        function setCleared(cleared) {
            gameCleared = cleared;
            if (cleared) {
                exitSign.classList.add('hidden');
                magpieInfo.classList.add('visible');
                magpieVisible = true;
                setMessage('✨ 4番出口を発見！ カササギの生態を表示中 ✨');
                // ボタンは押せるまま（リセットで戻る）
            } else {
                exitSign.classList.remove('hidden');
                magpieInfo.classList.remove('visible');
                magpieVisible = false;
                setMessage('▶ 出口はどこだろう？');
            }
            // カウンターは更新
            stepCounter.textContent = 'ステップ: ' + stepCount;
        }

        // ゲームリセット (初期状態)
        function resetGame() {
            stepCount = 0;
            setCleared(false);
            setMessage('▶ ゲームをリセット。 4番出口を探そう。');
            stepCounter.textContent = 'ステップ: 0';
            // ボタン有効化はデフォルト
        }

        // 進行処理 (左/右/直進)
        function advance(direction) {
            // クリア済みなら カササギ情報を表示しているだけ → 操作しても変化させない (ただしカウントは増やさない)
            if (gameCleared) {
                setMessage('🕊️ もう出口は見つけたよ。 カササギのページを読んでね。');
                return;
            }

            // 歩数カウント
            stepCount++;
            stepCounter.textContent = 'ステップ: ' + stepCount;

            // 乱数で出口出現 (2013年スタイル: シンプルに 20% でクリア)
            // ただし 4番出口は "4" にちなんで ステップ数が4の倍数なら確率UP (レトロ感)
            let chance = 0.20;
            if (stepCount % 4 === 0) {
                chance = 0.45;  // 4の倍数で確率アップ
            }
            // 左・右・直進でちょっとだけ確率変動 (遊び)
            if (direction === 'left') chance += 0.05;
            else if (direction === 'right') chance -= 0.02;
            else if (direction === 'straight') chance += 0.03;

            // 乱数判定 (0~1)
            const roll = Math.random();
            if (roll < chance) {
                // クリア！
                setCleared(true);
                setMessage('🎉 4番出口を見つけた！ カササギの生態を表示します。');
                stepCounter.textContent = 'ステップ: ' + stepCount;
                return;
            } else {
                // はずれメッセージ (バリエーション)
                const msgs = [
                    '🚫 ここは違う… まだ4番出口じゃない。',
                    '🌀 また別の通路だ。 気配を感じる。',
                    '⬛ 暗い… でも進むしかない。',
                    '🔦 何かが光った気がした。 でも違う。',
                    '🕸️ 行き止まり？ いや、引き返そう。',
                    '🌫️ 霧が濃い… 出口はどこ？',
                    '💡 閃いた！ でも違った。',
                ];
                const idx = Math.floor(Math.random() * msgs.length);
                setMessage(msgs[idx]);
            }
            // もしステップが20を超えてもクリアしなかったらヒント (2013年らしい親切)
            if (stepCount > 20 && !gameCleared) {
                setMessage('💡 ヒント: 4の倍数で確率が上がるかも…？');
            }
            if (stepCount > 40 && !gameCleared) {
                setMessage('⚠️ まだ見つからない… もう一度リセットして挑戦しよう。');
            }
        }

        // ---- イベントリスナー (マウスクリックのみ) ----
        leftBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!gameCleared) {
                advance('left');
            } else {
                setMessage('🕊️ すでにクリア済みです。 カササギのページをご覧ください。');
            }
        });

        rightBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!gameCleared) {
                advance('right');
            } else {
                setMessage('🕊️ すでにクリア済みです。 カササギのページをご覧ください。');
            }
        });

        straightBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!gameCleared) {
                advance('straight');
            } else {
                setMessage('🕊️ すでにクリア済みです。 カササギのページをご覧ください。');
            }
        });

        resetBtn.addEventListener('click', function(e) {
            e.preventDefault();
            resetGame();
        });

        // 初期化
        resetGame();

        // 2013年らしい: 何か細工を入れておく (ハードウェア制限を模擬: アニメーションなどは極力排除)
        // マウスカーソルのみ使用、キーボード無効化 (念のため)
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            return false;
        });
        // 右クリックも封じる (おまけ)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // タッチ操作にも対応 (ただしマウス操作のみという指示だが、モバイル対策で一応)
        // しかし「マウスカーソルしか使えない」ので、タッチは無効化はしないが、マウスイベントで十分
        console.log('4番出口 · カササギ版 2013 style loaded');
    })();
</script>
</body>
</html>
