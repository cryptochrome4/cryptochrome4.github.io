<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lv1出口 · 15のテーマ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
        }
        .game-container {
            background: #1a212b;
            border-radius: 32px;
            padding: 24px 28px 32px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.8), inset 0 0 0 1px #3a4a5a;
            max-width: 720px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .display-area {
            background: #10161e;
            border-radius: 20px;
            padding: 18px 20px 20px;
            border: 1px solid #2f4052;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
            min-height: 280px;
            display: flex;
            flex-direction: column;
        }
        .exit-sign {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #bcd4e6;
            text-shadow: 0 0 6px #3d7a9c;
            background: #1f2b38;
            padding: 12px 10px;
            border-radius: 60px;
            text-align: center;
            border: 1px solid #3f5a72;
            margin-bottom: 18px;
            transition: all 0.15s;
            cursor: default;
        }
        .exit-sign.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            height: 0;
            padding: 0;
            margin: 0;
            border: 0;
            overflow: hidden;
            transition: all 0.25s;
        }
        .message-box {
            background: #0d121b;
            border-radius: 16px;
            padding: 18px 16px;
            border-left: 6px solid #4c7a9c;
            color: #c8dae8;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 70px;
            box-shadow: inset 0 2px 3px #00000055;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        /* 15テーマ表示エリア (サッカー例え) */
        .theme-grid {
            display: none;
            background: #0f1a1f;
            border-radius: 16px;
            padding: 18px 16px;
            border: 1px solid #3a6b7a;
            color: #d4eaf0;
            font-size: 0.92rem;
            line-height: 1.6;
            box-shadow: inset 0 0 12px #1e3e4a;
            max-height: 380px;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        .theme-grid.visible {
            display: block;
        }
        .theme-grid h3 {
            color: #b3def0;
            font-size: 1.3rem;
            letter-spacing: 1px;
            border-bottom: 1px dashed #3f7a8a;
            padding-bottom: 8px;
            margin-bottom: 14px;
            text-align: center;
        }
        .theme-item {
            background: #16222b;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-left: 4px solid #5b8a9c;
        }
        .theme-item strong {
            color: #e0f0fa;
            font-size: 1rem;
            display: block;
            margin-bottom: 4px;
        }
        .theme-item .soccer-example {
            color: #b8d8e8;
            font-size: 0.9rem;
            background: #0f1a22;
            padding: 6px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 4px;
            border: 1px solid #2f5a6a;
        }
        .theme-item .desc {
            color: #c8dce6;
            margin-top: 4px;
        }
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 8px;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 18px;
        }
        .game-btn {
            background: #273542;
            border: none;
            border-radius: 60px;
            padding: 14px 30px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 1.3rem;
            color: #d3e2f0;
            box-shadow: 0 6px 0 #0f151d, 0 4px 8px rgba(0,0,0,0.6);
            transition: all 0.06s linear;
            cursor: pointer;
            border: 1px solid #4b657b;
            letter-spacing: 1px;
            flex: 1 0 auto;
            min-width: 100px;
            text-shadow: 0 1px 0 #2f4a5a;
        }
        .game-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #0f151d;
        }
        .game-btn.reset-btn {
            background: #3a2e3e;
            border-color: #6e4f5e;
            color: #f0d8dc;
            box-shadow: 0 6px 0 #231d26;
        }
        .game-btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0f151d;
            pointer-events: none;
        }
        .counter {
            color: #7e9bb0;
            font-size: 0.9rem;
            background: #18222d;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #324a58;
            text-align: center;
        }
        .footer {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #56748a;
            font-size: 0.8rem;
        }
        @media (max-width: 480px) {
            .game-container { padding: 16px; }
            .exit-sign { font-size: 1.8rem; }
            .game-btn { font-size: 1.1rem; padding: 12px 16px; min-width: 80px; }
            .theme-item { padding: 10px; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="display-area">
        <!-- Lv1出口 表示 -->
        <div class="exit-sign" id="exitSign">🚪 Lv1出口</div>

        <!-- メッセージ -->
        <div class="message-box" id="messageBox">
            <span id="dynamicMessage">▶ 出口はどこだろう？</span>
        </div>

        <!-- 15テーマ表示エリア (サッカー例え) -->
        <div class="theme-grid" id="themeGrid">
            <h3>⚽ 15のテーマ × サッカー例え</h3>
            <div id="themeList"></div>
        </div>

        <!-- アクションエリア -->
        <div class="action-area">
            <div class="button-group">
                <button class="game-btn" id="leftBtn">⬅ 左</button>
                <button class="game-btn" id="rightBtn">➡ 右</button>
                <button class="game-btn" id="straightBtn">⬆ 直進</button>
            </div>
            <div class="button-group">
                <button class="game-btn reset-btn" id="resetBtn">↺ 戻る</button>
            </div>
        </div>

        <div class="footer">
            <span class="counter" id="stepCounter">ステップ: 0</span>
            <span style="color:#3f5f72;">🖱️ マウス操作</span>
        </div>
    </div>
</div>
<script>
    (function() {
        // ---------- 2013年スタイル マウス専用 ----------
        let stepCount = 0;
        let gameCleared = false;

        const exitSign = document.getElementById('exitSign');
        const dynamicMsg = document.getElementById('dynamicMessage');
        const themeGrid = document.getElementById('themeGrid');
        const themeList = document.getElementById('themeList');
        const stepCounter = document.getElementById('stepCounter');

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const straightBtn = document.getElementById('straightBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ----- 15テーマ (画像3枚から抽出) + サッカー例え -----
        const themes = [
            { title: "PHP入門", desc: "初心者向け1時間で学べるPHP入門。", soccer: "まるで初心者向けのパス練習。基本のキックを覚えるようなもの。" },
            { title: "オブジェクト指向", desc: "クラスや継承、ポリモーフィズム。", soccer: "フォーメーションのようなもの。各選手(オブジェクト)が役割を持ち連携する。" },
            { title: "ウォーターフォール開発", desc: "段階的に進める古典的開発手法。", soccer: "試合前の決まったセットプレー。順序を守って進める戦略。" },
            { title: "アジャイル開発", desc: "柔軟で反復的な開発手法。", soccer: "試合中の臨機応変な戦術変更。状況に応じてフォーメーションを変える。" },
            { title: "MVCモデル", desc: "Model-View-Controller で責務を分離。", soccer: "監督(Controller)、選手(Model)、観客(View)の役割分担。" },
            { title: "Vue.js 3", desc: "モダンなフロントエンドフレームワーク。", soccer: "若手のテクニカルなウィング。軽快で直感的な動き。" },
            { title: "DB設計", desc: "データベースの設計と正規化。", soccer: "チームの布陣を決めるようなもの。ポジションを最適化する。" },
            { title: "インデックス (DB)", desc: "検索を高速化する仕組み。", soccer: "素早いカウンター攻撃。インデックスがパスコースを瞬時に見つける。" },
            { title: "パーティショニング", desc: "データを分割して管理。", soccer: "試合を前半・後半に分けるようなもの。負荷を分散。" },
            { title: "Ruby on Rails", desc: "フルスタックWebフレームワーク。", soccer: "万能なミッドフィールダー。攻守をつなぐ司令塔。" },
            { title: "プログラミング独学", desc: "初心者が独学で学ぶ方法。", soccer: "サッカーを公園で練習するようなもの。自主練が大切。" },
            { title: "フロー状態", desc: "集中して生産性を最大化。", soccer: "試合でゾーンに入る感覚。何もかもがスムーズに決まる。" },
            { title: "Cron (crontab)", desc: "ジョブを自動実行するスケジューラ。", soccer: "試合前のルーティン。決まった時間に自動で準備する。" },
            { title: "N+1問題 (DB)", desc: "クエリが大量に発生する問題。", soccer: "無駄なパス回し。効率的にゴールへつながらない。" },
            { title: "BULK INSERT", desc: "大量データを一括挿入して高速化。", soccer: "一気にロングボールを送り込むような効率攻撃。" }
        ];

        // テーマをレンダリング
        function renderThemes() {
            themeList.innerHTML = '';
            themes.forEach((t, idx) => {
                const div = document.createElement('div');
                div.className = 'theme-item';
                div.innerHTML = `
                    <strong>${idx+1}. ${t.title}</strong>
                    <div class="desc">${t.desc}</div>
                    <span class="soccer-example">⚽ ${t.soccer}</span>
                `;
                themeList.appendChild(div);
            });
        }
        renderThemes();

        // ----- UI更新 -----
        function setMessage(text) {
            dynamicMsg.textContent = text;
        }

        function setCleared(cleared) {
            gameCleared = cleared;
            if (cleared) {
                exitSign.classList.add('hidden');
                themeGrid.classList.add('visible');
                setMessage('🎉 Lv1出口を発見！ 15のテーマをサッカー例えで表示中 ⚽');
            } else {
                exitSign.classList.remove('hidden');
                themeGrid.classList.remove('visible');
                setMessage('▶ 出口はどこだろう？');
            }
            stepCounter.textContent = 'ステップ: ' + stepCount;
        }

        function resetGame() {
            stepCount = 0;
            setCleared(false);
            setMessage('▶ ゲームをリセット。 Lv1出口を探そう。');
            stepCounter.textContent = 'ステップ: 0';
        }

        // ----- 進行処理 (マウスクリック) -----
        function advance(direction) {
            if (gameCleared) {
                setMessage('⚽ もう出口は見つけたよ。 テーマを読んでね。');
                return;
            }

            stepCount++;
            stepCounter.textContent = 'ステップ: ' + stepCount;

            // 出口確率 (2013年風 4の倍数でUP)
            let chance = 0.18;
            if (stepCount % 4 === 0) chance = 0.42;
            if (direction === 'left') chance += 0.04;
            else if (direction === 'right') chance -= 0.02;
            else if (direction === 'straight') chance += 0.06;

            const roll = Math.random();
            if (roll < chance) {
                setCleared(true);
                setMessage('🎉 Lv1出口を発見！ 15テーマ＋サッカー例えを表示');
                stepCounter.textContent = 'ステップ: ' + stepCount;
                return;
            } else {
                const msgs = [
                    '🚫 ここは違う… まだLv1出口じゃない。',
                    '🌀 別の通路だ。 サッカーボールが転がってる…',
                    '⬛ 暗い… でも進むしかない。',
                    '🔦 何か光った。 でも違う出口。',
                    '🌫️ 霧が濃い… 出口はどこ？',
                    '💡 閃いた！ でも違った。',
                    '⚽ サッカー場の匂いがする… でも出口じゃない。'
                ];
                const idx = Math.floor(Math.random() * msgs.length);
                setMessage(msgs[idx]);
            }

            if (stepCount > 25 && !gameCleared) {
                setMessage('💡 ヒント: 4の倍数で確率が上がるかも…？');
            }
            if (stepCount > 45 && !gameCleared) {
                setMessage('⚠️ まだ見つからない… リセットして再挑戦しよう。');
            }
        }

        // ----- イベント (マウス専用) -----
        leftBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!gameCleared) advance('left');
            else setMessage('⚽ テーマをじっくり読んでね。');
        });
        rightBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!gameCleared) advance('right');
            else setMessage('⚽ テーマをじっくり読んでね。');
        });
        straightBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!gameCleared) advance('straight');
            else setMessage('⚽ テーマをじっくり読んでね。');
        });
        resetBtn.addEventListener('click', function(e) {
            e.preventDefault();
            resetGame();
        });

        // キーボード無効化 (2013年ハード制限)
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 初期化
        resetGame();
        console.log('Lv1出口 · 15テーマ+サッカー例え 2013 style');
    })();
</script>
</body>
</html>
