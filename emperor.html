<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>総理大臣シミュレーション · パワプロ育成風</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a26 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .game-container {
            max-width: 600px;
            width: 100%;
            background: #e8e0d0;
            background-image: radial-gradient(circle at 20% 30%, #f4efe4 0%, #d9cfbb 100%);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,242,210,0.6);
            padding: 24px 20px 30px;
            border: 3px solid #b8a68b;
        }
        .game-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2d3f4b;
            padding: 8px 16px 8px 20px;
            border-radius: 60px;
            margin-bottom: 18px;
            box-shadow: inset 0 -3px 0 #14212b, 0 6px 0 #0b141c;
            color: #f5edc6;
            text-shadow: 2px 2px 0 #1f2e3a;
            font-weight: bold;
        }
        .game-title span { font-size: 1.1rem; background: #1f2f3b; padding: 4px 16px; border-radius: 40px; }
        .game-title .pm-label { background: #c9b58b; color: #1d2b33; text-shadow: none; }
        .status-bar {
            background: #d2c4ac;
            padding: 14px 18px;
            border-radius: 80px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: inset 0 -4px 0 #b6a485, 0 4px 0 #73634a;
            border: 1px solid #c6b294;
            font-weight: bold;
        }
        .pm-name { font-size: 1.4rem; background: #fcf3e0; padding: 0 16px; border-radius: 60px; box-shadow: inset 0 -2px 0 #b8a282; }
        .pm-name small { font-size: 0.8rem; font-weight: normal; color: #5b4d37; }
        .month-box { background: #1d2b2f; color: #efebc0; padding: 8px 18px; border-radius: 60px; box-shadow: inset 0 -3px 0 #3d555e; }
        .approval-box { background: #3d4f3d; color: #f5f0ce; padding: 6px 18px; border-radius: 60px; box-shadow: inset 0 -3px 0 #1e2f1e; }
        .event-area {
            background: #f3edde;
            border-radius: 40px;
            padding: 18px 16px 14px;
            margin-bottom: 18px;
            box-shadow: inset 0 -6px 0 #bfaf92, 0 8px 0 #7f6e55;
            border: 1px solid #dccdb6;
        }
        .event-title { font-size: 1.2rem; font-weight: bold; background: #c6b294; display: inline-block; padding: 0 20px; border-radius: 40px; color: #1f2c22; margin-bottom: 14px; }
        .event-desc {
            background: #fcf8ec;
            padding: 16px 18px;
            border-radius: 30px;
            font-size: 1.0rem;
            line-height: 1.5;
            color: #1e2b22;
            min-height: 70px;
            margin-bottom: 12px;
            border: 1px solid #dbceb6;
            box-shadow: inset 0 2px 6px rgba(80,60,30,0.2);
        }
        .choice-grid { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 4px; }
        .choice-btn {
            background: #dfd3bd;
            border: none;
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: left;
            color: #1d2a1d;
            box-shadow: inset 0 -5px 0 #a48d70, 0 5px 0 #6b5b44;
            transition: 0.05s linear;
            border: 1px solid #c7b396;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .choice-btn:active { transform: translateY(4px); box-shadow: inset 0 -1px 0 #a48d70, 0 2px 0 #6b5b44; }
        .choice-btn .choice-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }
        .choice-btn .choice-desc {
            font-size: 0.8rem;
            font-weight: normal;
            color: #3d3a2a;
            padding-left: 28px;
            opacity: 0.8;
        }
        .choice-btn .badge { background: #2c3f3a; color: #f5edc0; border-radius: 40px; padding: 0 14px; font-size: 0.8rem; line-height: 1.8; margin-left: auto; white-space: nowrap; }
        .choice-btn .risk-badge { background: #8a3a2a; color: #ffeac0; border-radius: 40px; padding: 0 12px; font-size: 0.75rem; line-height: 1.8; }
        .reset-area { display: flex; justify-content: flex-end; margin-top: 16px; gap: 12px; flex-wrap: wrap; }
        .reset-btn { background: #5b4d3a; border: none; color: #efe3c9; font-weight: bold; padding: 10px 24px; border-radius: 60px; box-shadow: inset 0 -4px 0 #322b1f, 0 4px 0 #1e1a12; cursor: pointer; border: 1px solid #6f604a; }
        .reset-btn:active { transform: translateY(4px); box-shadow: inset 0 -1px 0 #322b1f, 0 1px 0 #1e1a12; }
        .reset-confirm { margin-top: 10px; display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
        .reset-confirm button { background: #b5533b; border: none; padding: 8px 18px; border-radius: 40px; font-weight: bold; color: #f5efe0; box-shadow: inset 0 -3px 0 #772f1f, 0 3px 0 #441d13; cursor: pointer; border: 1px solid #b35f47; }
        .reset-confirm button:active { transform: translateY(3px); box-shadow: inset 0 -1px 0 #772f1f, 0 1px 0 #441d13; }
        .reset-confirm .cancel-btn { background: #6e7a74; box-shadow: inset 0 -3px 0 #46534b, 0 3px 0 #2b3831; border-color: #788680; }
        .hidden { display: none !important; }
        .footer { font-size: 0.7rem; color: #6f604a; text-align: center; margin-top: 14px; background: #d6c8b0; border-radius: 40px; padding: 4px 10px; width: fit-content; margin-left: auto; margin-right: auto; }
        .game-over-message { text-align: center; background: #d6bca0; border-radius: 40px; padding: 12px; font-weight: bold; color: #1d2a1a; }
        .toast { background: #2d3f3a; color: #f5edc0; padding: 8px 16px; border-radius: 60px; font-size: 0.9rem; margin-bottom: 10px; text-align: center; }
        #nameSetupPhase input { width: 100%; padding: 16px; border-radius: 60px; border: 2px solid #9d8a6c; background: #fcf6e6; font-size: 1.3rem; font-weight: bold; outline: none; }
        #startGameBtn { width: 100%; background: #3d5a4a; border: none; padding: 16px; border-radius: 60px; font-weight: bold; font-size: 1.4rem; color: #f5efd0; box-shadow: inset 0 -6px 0 #1b3428, 0 6px 0 #0f231a; cursor: pointer; margin-top: 16px; }
        .load-more-info { text-align: center; padding: 10px; background: #c9b58b; border-radius: 40px; margin-top: 10px; font-weight: bold; color: #1d2b33; }
    </style>
</head>
<body>

<div class="game-container" id="app">
    <div class="game-title">
        <span>⚾ 総理・育成</span>
        <span class="pm-label">🇯🇵 PM</span>
    </div>

    <div id="nameSetupPhase">
        <div style="background: #d6c8b0; border-radius: 60px; padding: 20px 16px; box-shadow: inset 0 -4px 0 #b6a282;">
            <label style="font-weight: bold; font-size: 1.3rem; display: block; margin-bottom: 12px; color: #1f2c1f;">⛩️ 総理の名前を決めてください</label>
            <input type="text" id="playerNameInput" placeholder="例: あすか かずき">
            <button id="startGameBtn">スタート</button>
        </div>
    </div>

    <div id="gameMainPhase" class="hidden">
        <div class="status-bar">
            <span class="pm-name" id="displayPmName">○○総理 <small>総理</small></span>
            <span class="month-box" id="displayMonth">2026年1月</span>
            <span class="approval-box" id="displayApproval">📊 支持率: 50</span>
        </div>
        <div id="toastMessage" class="toast hidden"></div>
        <div class="event-area">
            <div class="event-title" id="eventTitle">▶ 今月の政務</div>
            <div class="event-desc" id="eventDesc">イベントがここに表示されます</div>
            <div class="choice-grid" id="choiceContainer"></div>
            <div id="loadMoreInfo" class="load-more-info hidden">📌 続きのデータは「中編ください」と言ってください</div>
        </div>
        <div class="reset-area">
            <button class="reset-btn" id="resetBtn">🗑️ リセット</button>
        </div>
        <div id="resetConfirmBox" class="reset-confirm hidden">
            <button class="cancel-btn" id="resetCancel">キャンセル</button>
            <button id="resetConfirmYes">本当にリセット (1回目)</button>
        </div>
        <div id="resetFinalConfirm" class="reset-confirm hidden">
            <button class="cancel-btn" id="resetFinalCancel">やっぱやめとく</button>
            <button id="resetFinalYes">⚠️ 最終確認！ リセット</button>
        </div>
        <div class="footer">⚡ 未来予測シミュレーション · 2030年12月まで</div>
    </div>
</div>

// ---- 全てのイベントデータを格納する配列 ----
let FULL_EVENT_DATA = [];

// ---- ゲーム状態 ----
let state = {
    name: "",
    year: 2026,
    month: 1,
    idx: 0,
    approval: 50,
    gameOver: false,
    totalGain: 0,
    resetStep: 0,
    dataLoaded: 12,
};

// ---- DOM ----
const $ = id => document.getElementById(id);
const nameSetup = $('nameSetupPhase');
const gameMain = $('gameMainPhase');
const nameInput = $('playerNameInput');
const startBtn = $('startGameBtn');
const displayName = $('displayPmName');
const displayMonth = $('displayMonth');
const displayApproval = $('displayApproval');
const eventTitle = $('eventTitle');
const eventDesc = $('eventDesc');
const choiceContainer = $('choiceContainer');
const resetBtn = $('resetBtn');
const resetConfirmBox = $('resetConfirmBox');
const resetFinalConfirm = $('resetFinalConfirm');
const resetCancel = $('resetCancel');
const resetFinalCancel = $('resetFinalCancel');
const resetConfirmYes = $('resetConfirmYes');
const resetFinalYes = $('resetFinalYes');
const toast = $('toastMessage');
const loadMoreInfo = $('loadMoreInfo');

// ---- 初期化 ----
function initEventData() {
    FULL_EVENT_DATA = [];
    EVENT_DATA_2026.forEach(d => FULL_EVENT_DATA.push(d));
    state.dataLoaded = 12;
}

// ---- データ追加関数 ----
function appendEventData(newData) {
    newData.forEach(d => FULL_EVENT_DATA.push(d));
    state.dataLoaded = FULL_EVENT_DATA.length;
    updateLoadInfo();
    if (state.idx < FULL_EVENT_DATA.length && !state.gameOver) {
        render();
    }
}

function updateLoadInfo() {
    const total = FULL_EVENT_DATA.length;
    if (total >= 60) {
        loadMoreInfo.classList.add('hidden');
    } else {
        loadMoreInfo.classList.remove('hidden');
        loadMoreInfo.textContent = `📌 現在 ${total}/60 ヶ月分のデータがロードされています。続きは「中編ください」と入力してください。`;
    }
}

// ---- 保存 ----
function save() {
    if (!state.name) return;
    localStorage.setItem('pmSimData', JSON.stringify({
        name: state.name, year: state.year, month: state.month,
        idx: state.idx, approval: state.approval,
        gameOver: state.gameOver, totalGain: state.totalGain,
        dataLoaded: state.dataLoaded
    }));
}

function load() {
    try {
        const raw = localStorage.getItem('pmSimData');
        if (!raw) return false;
        const d = JSON.parse(raw);
        if (d.name) {
            state.name = d.name; state.year = d.year; state.month = d.month;
            state.idx = d.idx || 0; state.approval = d.approval ?? 50;
            state.gameOver = d.gameOver || false; state.totalGain = d.totalGain || 0;
            state.dataLoaded = d.dataLoaded || 12;
            return true;
        }
    } catch(e) {}
    return false;
}

function resetGame() {
    localStorage.removeItem('pmSimData');
    state = { name: "", year: 2026, month: 1, idx: 0, approval: 50, gameOver: false, totalGain: 0, resetStep: 0, dataLoaded: 12 };
    hideResets();
    nameSetup.classList.remove('hidden');
    gameMain.classList.add('hidden');
    nameInput.value = "";
    toast.classList.add('hidden');
    initEventData();
}

function hideResets() {
    resetConfirmBox.classList.add('hidden');
    resetFinalConfirm.classList.add('hidden');
    resetBtn.classList.remove('hidden');
}

// ---- トースト ----
function showToast(msg, good = true) {
    toast.textContent = msg;
    toast.classList.remove('hidden');
    toast.style.background = good ? '#2d4a3a' : '#5a2a2a';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.add('hidden'), 3000);
}

// ---- 支持率更新 ----
function changeApproval(delta, risk = 0, riskAmt = 0) {
    let final = delta;
    let risky = false;
    if (risk > 0 && Math.random() < risk) {
        final += riskAmt;
        risky = true;
        showToast(`💥 リスク発動！ ${riskAmt} の支持率減少`, false);
    }
    state.approval = Math.max(0, Math.min(100, state.approval + final));
    state.totalGain += final;
    displayApproval.textContent = `📊 支持率: ${Math.round(state.approval)}`;
    if (final > 0 && !risky) showToast(`📈 支持率 +${final}`, true);
    else if (final < 0 && !risky) showToast(`📉 支持率 ${final}`, false);
    else if (final === 0) showToast(`⚖️ 支持率変わらず`, true);
    if (state.approval <= 0) {
        showToast(`💀 支持率0 ... 総理失脚`, false);
        state.gameOver = true;
        save();
        render();
    }
    save();
}

// ---- レンダリング ----
function render() {
    if (state.idx >= FULL_EVENT_DATA.length && !state.gameOver) {
        eventTitle.textContent = "⏳ データ読込中";
        eventDesc.textContent = `現在 ${FULL_EVENT_DATA.length}/60 ヶ月分のデータがロードされています。`;
        choiceContainer.innerHTML = '';
        loadMoreInfo.classList.remove('hidden');
        loadMoreInfo.textContent = `📌 続きのデータが必要です。「中編ください」と入力してください (現在 ${FULL_EVENT_DATA.length}/60)`;
        return;
    }

    if (state.gameOver || state.idx >= 60) {
        state.gameOver = true;
        eventTitle.textContent = "🏁 任期終了";
        const final = Math.round(state.approval);
        const total = Math.round(state.totalGain);
        eventDesc.innerHTML = `
            <div class="game-over-message">
                🎌 ${state.name}総理、お疲れ様でした！<br>
                最終支持率: ${final} / 100<br>
                累計獲得支持率: ${total}<br>
                ${final >= 70 ? '🏆 偉大な総理として記憶されるでしょう。' :
                  final >= 40 ? '📖 及第点の総理でした。' :
                  '💀 歴史に残る迷政権...'}
            </div>
        `;
        choiceContainer.innerHTML = '';
        displayApproval.textContent = `📊 支持率: ${final}`;
        loadMoreInfo.classList.add('hidden');
        return;
    }

    const idx = state.idx;
    const data = FULL_EVENT_DATA[idx];
    if (!data) {
        eventTitle.textContent = "⏳ データ不足";
        eventDesc.textContent = `月 ${idx+1} のデータがロードされていません。`;
        choiceContainer.innerHTML = '';
        loadMoreInfo.classList.remove('hidden');
        loadMoreInfo.textContent = `📌 続きのデータが必要です。「中編ください」と入力してください (現在 ${FULL_EVENT_DATA.length}/60)`;
        return;
    }

    const themeIdx = data.themeIdx;
    const themeName = ALL_THEMES[themeIdx] || "未知のテーマ";
    const year = 2026 + Math.floor(idx / 12);
    const month = (idx % 12) + 1;
    const season = month === 1 ? "新年" : month === 4 ? "新年度" : month === 7 ? "夏" : month === 12 ? "年末" : "";

    state.year = year;
    state.month = month;

    displayName.innerHTML = `${state.name}総理 <small>総理</small>`;
    displayMonth.textContent = `${year}年${month}月`;
    displayApproval.textContent = `📊 支持率: ${Math.round(state.approval)}`;

    const evTitle = `📌 ${season}${themeName}`;
    eventTitle.textContent = evTitle;
    eventDesc.textContent = `${year}年${month}月、${themeName}に関する重要局面。あなたの決断が支持率を左右する。`;

    choiceContainer.innerHTML = '';
    data.choices.forEach((ch, i) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        const labels = ["A", "B", "C"];
        btn.innerHTML = `
            <div class="choice-header">
                <span>${labels[i]}</span>
                <strong>${ch.label}</strong>
                <span class="badge">+${ch.effect}</span>
                ${ch.risk > 0 ? `<span class="risk-badge">⚠️${Math.round(ch.risk*100)}%</span>` : ''}
            </div>
            <div class="choice-desc">${ch.desc}</div>
        `;
        btn.addEventListener('click', () => {
            changeApproval(ch.effect, ch.risk, ch.riskAmt);
            state.idx++;
            if (state.idx >= 60) state.gameOver = true;
            save();
            render();
        });
        choiceContainer.appendChild(btn);
    });

    updateLoadInfo();
}

// ---- ゲーム開始 ----
function startGame(name) {
    if (!name.trim()) { alert("総理の名前を入力してください！"); return; }
    state.name = name.trim();
    state.year = 2026; state.month = 1; state.idx = 0;
    state.approval = 50; state.gameOver = false; state.totalGain = 0; state.resetStep = 0;
    nameSetup.classList.add('hidden');
    gameMain.classList.remove('hidden');
    hideResets();
    initEventData();
    save();
    render();
}

function loadGame() {
    if (state.name) {
        nameSetup.classList.add('hidden');
        gameMain.classList.remove('hidden');
        initEventData();
        render();
        hideResets();
    } else {
        nameSetup.classList.remove('hidden');
        gameMain.classList.add('hidden');
    }
}

// ---- イベント ----
startBtn.addEventListener('click', () => startGame(nameInput.value));
nameInput.addEventListener('keypress', e => { if (e.key === 'Enter') startGame(nameInput.value); });

resetBtn.addEventListener('click', () => {
    if (state.resetStep === 0) {
        state.resetStep = 1;
        resetConfirmBox.classList.remove('hidden');
        resetFinalConfirm.classList.add('hidden');
        resetBtn.classList.add('hidden');
        resetConfirmYes.textContent = "本当にリセットしますか？ (1回目)";
    }
});

resetCancel.addEventListener('click', () => { state.resetStep = 0; hideResets(); });
resetConfirmYes.addEventListener('click', () => {
    if (state.resetStep === 1) { state.resetStep = 2; resetConfirmYes.textContent = "⚠️ もう一度確認 (2回目)"; }
    else if (state.resetStep === 2) { state.resetStep = 3; resetConfirmBox.classList.add('hidden'); resetFinalConfirm.classList.remove('hidden'); }
});
resetFinalCancel.addEventListener('click', () => { state.resetStep = 0; hideResets(); });
resetFinalYes.addEventListener('click', () => { resetGame(); state.resetStep = 0; hideResets(); });

// ---- 外部からデータを追加する関数 ----
window.appendEventData = appendEventData;

// ---- 初期化 ----
initEventData();
if (load()) loadGame();
else { nameSetup.classList.remove('hidden'); gameMain.classList.add('hidden'); }

console.log("✅ 前編ロード完了！ 2026年分(12ヶ月)のデータが読み込まれています。");
console.log("📌 続きは「中編ください」と入力してください。");
</script>
