<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORQUES - コマ回し対決</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: #111; color: #eee; overflow: hidden;
  }
  #app { width: 100%; height: 100%; position: relative; }

  /* ===== オープニング ===== */
  #opening {
    position: absolute; inset: 0;
    background: url('img188elon.jpg') center/cover no-repeat, #111;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  #opening::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(0,0,0,0.45);
  }
  #opening h1 {
    position: relative;
    font-size: clamp(28px, 8vw, 64px);
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px #0ff, 0 0 40px #08f;
    margin-bottom: 40px;
  }
  #opening .sub {
    position: relative;
    font-size: clamp(12px, 3vw, 18px);
    opacity: 0.8; margin-bottom: 50px; letter-spacing: 0.2em;
  }
  #startBtn {
    position: relative;
    padding: 18px 60px;
    font-size: clamp(18px, 4vw, 26px);
    letter-spacing: 0.3em;
    background: linear-gradient(135deg, #06c, #0af);
    color: #fff; border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0,180,255,0.7);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(0,200,255,1); }

  /* ===== ゲーム画面 ===== */
  #game {
    display: none;
    position: absolute; inset: 0;
    flex-direction: column;
  }
  #game.active { display: flex; }

  #canvasWrap {
    flex: 1; position: relative;
    background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 80%);
    overflow: hidden;
  }
  #battleCanvas { display: block; width: 100%; height: 100%; }

  #panels {
    display: flex; gap: 8px;
    padding: 8px;
    background: rgba(0,0,0,0.75);
    border-top: 1px solid #333;
    min-height: 140px;
  }
  .panel {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: clamp(10px, 2.4vw, 13px);
    display: flex; flex-direction: column; gap: 4px;
  }
  .panel h3 {
    font-size: clamp(11px, 2.6vw, 14px);
    letter-spacing: 0.1em;
    border-bottom: 1px solid #444;
    padding-bottom: 3px;
    display: flex; align-items: center; gap: 6px;
  }
  .swatch {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid #fff3; display: inline-block;
  }
  .stat-row {
    display: flex; justify-content: space-between;
    font-size: clamp(9px, 2.2vw, 12px);
  }
  .stat-row .label { opacity: 0.7; }
  .stat-row .val { font-weight: bold; }
  .hp-bar {
    height: 6px; background: #333; border-radius: 3px; overflow: hidden;
    margin-top: 2px;
  }
  .hp-bar > div {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #0f0, #ff0);
    transition: width 0.15s;
  }

  #centerMsg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(20px, 6vw, 42px);
    font-weight: bold;
    text-shadow: 0 0 20px #000, 0 0 40px #000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-align: center;
    letter-spacing: 0.2em;
    z-index: 20;
  }
  #centerMsg.show { opacity: 1; }

  #streakBadge {
    position: absolute; top: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    border: 1px solid #0af;
    padding: 4px 16px; border-radius: 20px;
    font-size: clamp(12px, 3vw, 16px);
    letter-spacing: 0.15em;
    z-index: 15;
    color: #8ef;
  }

  #timerBadge {
    position: absolute; top: 10px; right: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #666;
    padding: 4px 12px; border-radius: 20px;
    font-size: clamp(11px, 2.6vw, 14px);
    letter-spacing: 0.1em;
    z-index: 15;
    color: #ccc;
  }

  #battleControls {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    display: flex; gap: 10px;
  }
  #battleControls button {
    padding: 10px 28px;
    font-size: clamp(13px, 3vw, 17px);
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #06c, #0af);
    color: #fff; border: none; border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0,150,255,0.6);
  }
  #battleControls button:disabled { opacity: 0.4; cursor: default; box-shadow: none; }

  /* ===== 選択画面 ===== */
  #choiceOverlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 50;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    padding: 20px;
  }
  #choiceOverlay.active { display: flex; }
  #choiceOverlay h2 {
    font-size: clamp(20px, 5vw, 32px);
    letter-spacing: 0.2em;
    color: #ffd94a;
    text-shadow: 0 0 20px #ff8c00;
    margin-bottom: 8px;
  }
  #choiceOverlay p { opacity: 0.8; font-size: clamp(12px,3vw,15px); margin-bottom: 6px; text-align:center;}
  .choiceBtn {
    width: min(360px, 90vw);
    padding: 14px;
    font-size: clamp(14px, 3.5vw, 18px);
    letter-spacing: 0.1em;
    background: rgba(255,255,255,0.08);
    color: #eee;
    border: 1px solid #0af;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    text-align: left;
    line-height: 1.5;
  }
  .choiceBtn:hover { background: rgba(0,170,255,0.25); transform: translateY(-2px); }
  .choiceBtn small { display:block; opacity:0.65; font-size: 0.8em; margin-top:4px;}

  /* ===== 結果 ===== */
  #resultOverlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 80;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
    padding: 20px; text-align: center;
  }
  #resultOverlay.active { display: flex; }
  #resultOverlay h2 {
    font-size: clamp(28px, 8vw, 56px);
    letter-spacing: 0.2em;
  }
  #resultOverlay .win { color: #ffd94a; text-shadow: 0 0 30px #ff8c00; }
  #resultOverlay .lose { color: #ff4a6e; text-shadow: 0 0 30px #f00; }
  #resultOverlay p { opacity: 0.8; font-size: clamp(13px,3.5vw,17px); }
  #resultOverlay button {
    padding: 14px 50px;
    font-size: clamp(15px, 4vw, 20px);
    letter-spacing: 0.2em;
    background: linear-gradient(135deg, #06c, #0af);
    color: #fff; border: none; border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,180,255,0.7);
  }
</style>
</head>
<body>
<div id="app">

  <div id="opening">
    <h1>TORQUES</h1>
    <div class="sub">- コマ回し対決 -</div>
    <button id="startBtn">はじめる</button>
  </div>

  <div id="game">
    <div id="canvasWrap">
      <canvas id="battleCanvas"></canvas>
      <div id="streakBadge">連勝 0 / 5</div>
      <div id="timerBadge">30.0s</div>
      <div id="centerMsg"></div>
      <div id="battleControls">
        <button id="spinBtn">スタート</button>
      </div>
    </div>
    <div id="panels">
      <div class="panel" id="playerPanel"></div>
      <div class="panel" id="enemyPanel"></div>
    </div>
  </div>

  <div id="choiceOverlay">
    <h2>WIN!</h2>
    <p>次の敵にどう挑む？</p>
    <button class="choiceBtn" id="keepBtn"></button>
    <button class="choiceBtn" id="rerollBtn"></button>
    <button class="choiceBtn" id="upSpinBtn"></button>
    <button class="choiceBtn" id="upBounceBtn"></button>
  </div>

  <div id="resultOverlay">
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <button id="resultBtn">オープニングへ</button>
  </div>

</div>

<script>
(() => {
  "use strict";

  // ===================== 定数 =====================
  const COLORS = [
    { name:"赤",   hex:"#e63946" },
    { name:"水色", hex:"#4cc9f0" },
    { name:"黄色", hex:"#ffd60a" },
    { name:"ピンク",hex:"#ff70a6" },
    { name:"青",   hex:"#3a86ff" },
    { name:"茶色", hex:"#8d6e63" },
    { name:"白",   hex:"#f1faee" },
    { name:"橙",   hex:"#fb8500" },
    { name:"紫",   hex:"#9b5de5" },
    { name:"黒",   hex:"#222222" },
    { name:"灰色", hex:"#9e9e9e" },
    { name:"緑",   hex:"#2a9d8f" },
    { name:"黄緑", hex:"#a7c957" },
  ];
  const SHAPES = ["circle","triangle","square","star","hexagon","pentagon"];
  const STAT_KEYS = ["attack","defense","stamina","weight","spin","bounce"];
  const STAT_LABELS = {
    attack:"攻撃", defense:"防御", stamina:"持久",
    weight:"重さ", spin:"回転", bounce:"バウンド"
  };
  const TOTAL_POINTS = 60;
  const MIN_STAT = 3, MAX_STAT = 18;
  const MAX_HP = 100;
  const ARENA_MARGIN = 0.82;
  const BASE_RADIUS = 24;
  const WIN_STREAK = 5;
  const MAX_BATTLE_TIME = 30;

  // 物理定数
  const CENTER_PULL = 22;      // 中心引力
  const FRICTION = 0.55;       // 台との摩擦（速度比例）
  const AIR_DRAG = 0.12;       // 空気抵抗
  const PRECESS_DRIFT = 14;    // 歳差による内側ドリフト
  const WALL_RESTITUTION = 0.72;
  const HP_DRAIN_BASE = 1.4;   // 毎秒の自然減
  const HP_DRAIN_HIT = 1.0;    // 衝突衝撃の係数

  // ===================== 状態 =====================
  const state = {
    player: null, enemy: null, streak: 0,
    phase: "idle", rafId: null, lastTime: 0,
    battle: null,
  };

  const $ = id => document.getElementById(id);
  const opening = $("opening");
  const gameEl = $("game");
  const canvas = $("battleCanvas");
  const ctx = canvas.getContext("2d");
  const playerPanel = $("playerPanel");
  const enemyPanel = $("enemyPanel");
  const spinBtn = $("spinBtn");
  const centerMsg = $("centerMsg");
  const streakBadge = $("streakBadge");
  const timerBadge = $("timerBadge");
  const choiceOverlay = $("choiceOverlay");
  const resultOverlay = $("resultOverlay");
  const resultTitle = $("resultTitle");
  const resultMsg = $("resultMsg");

  // ===================== ユーティリティ =====================
  const rand = (a,b) => a + Math.random()*(b-a);
  const randInt = (a,b) => Math.floor(rand(a,b+1));
  const pick = arr => arr[randInt(0,arr.length-1)];
  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));

  function randomStats() {
    const stats = {};
    let remaining = TOTAL_POINTS;
    for (const k of STAT_KEYS) { stats[k] = MIN_STAT; remaining -= MIN_STAT; }
    let guard = 0;
    while (remaining > 0 && guard < 10000) {
      guard++;
      const k = pick(STAT_KEYS);
      if (stats[k] < MAX_STAT) { stats[k]++; remaining--; }
    }
    return stats;
  }

  function makeKom(base) {
    const color = pick(COLORS);
    const shape = pick(SHAPES);
    const stats = base && base.stats ? { ...base.stats } : randomStats();
    const mass = 0.6 + stats.weight * 0.08;   // 質量
    return {
      color: color.hex, colorName: color.name, shape, stats,
      hp: MAX_HP, maxHp: MAX_HP, mass,
      x:0, y:0, vx:0, vy:0, angle:0, spinRate:0,
      radius:0, wobble:0,
    };
  }

  // ===================== Canvas =====================
  let canvasW=0, canvasH=0, dpr=1;
  let arena = { cx:0, cy:0, r:0 };

  function resize() {
    const wrap = canvas.parentElement;
    const rect = wrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvasW = rect.width; canvasH = rect.height;
    canvas.width = canvasW*dpr; canvas.height = canvasH*dpr;
    canvas.style.width = canvasW+"px"; canvas.style.height = canvasH+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    arena.cx = canvasW/2; arena.cy = canvasH/2;
    arena.r = Math.min(canvasW, canvasH) * 0.5 * ARENA_MARGIN;
    const rr = BASE_RADIUS * (Math.min(canvasW,canvasH)/420);
    if (state.player) state.player.radius = rr;
    if (state.enemy) state.enemy.radius = rr;
  }

  function drawArena() {
    ctx.save();
    const g = ctx.createRadialGradient(arena.cx, arena.cy, arena.r*0.05, arena.cx, arena.cy, arena.r);
    g.addColorStop(0, "#3a3a5c");
    g.addColorStop(0.5, "#22223a");
    g.addColorStop(1, "#101020");
    ctx.beginPath();
    ctx.arc(arena.cx, arena.cy, arena.r, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#4cc9f0";
    ctx.shadowColor = "#4cc9f0"; ctx.shadowBlur = 18; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(arena.cx, arena.cy, arena.r*0.66, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath();
    ctx.arc(arena.cx, arena.cy, arena.r*0.33, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function drawKom(k) {
    if (!k) return;
    ctx.save();
    ctx.translate(k.x, k.y);

    // 影（回転量が落ちると揺れる）
    const hpRatio = clamp(k.hp/k.maxHp, 0, 1);
    const wobble = (1 - hpRatio) * 0.5;
    ctx.save();
    ctx.translate(Math.sin(k.angle*0.7)*wobble*4, Math.cos(k.angle*0.9)*wobble*4);
    ctx.rotate(k.angle);
    const r = k.radius;

    ctx.shadowColor = k.color; ctx.shadowBlur = 14 + hpRatio*8;
    ctx.beginPath();
    switch (k.shape) {
      case "circle":   ctx.arc(0,0,r,0,Math.PI*2); break;
      case "triangle": poly(r,3,-Math.PI/2); break;
      case "square":   poly(r,4,Math.PI/4); break;
      case "pentagon": poly(r,5,-Math.PI/2); break;
      case "hexagon":  poly(r,6,0); break;
      case "star":     star(r,r*0.45,5,-Math.PI/2); break;
    }
    ctx.closePath();
    ctx.fillStyle = k.color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(r*0.75,0);
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function poly(r,n,offset) {
    for (let i=0;i<n;i++) {
      const a = offset + i*(Math.PI*2/n);
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
  }
  function star(rOut,rIn,n,offset) {
    for (let i=0;i<n*2;i++) {
      const rr = (i%2===0)?rOut:rIn;
      const a = offset + i*Math.PI/n;
      const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
  }

  function render() {
    ctx.clearRect(0,0,canvasW,canvasH);
    drawArena();
    if (state.enemy) drawKom(state.enemy);
    if (state.player) drawKom(state.player);
  }

  // ===================== パネル =====================
  function renderPanel(el,k,title) {
    if (!k) { el.innerHTML=""; return; }
    const s = k.stats;
    const hpPct = clamp(k.hp/k.maxHp*100,0,100);
    el.innerHTML = `
      <h3><span class="swatch" style="background:${k.color}"></span>${title}：${k.colorName} / ${shapeName(k.shape)}</h3>
      <div class="hp-bar"><div style="width:${hpPct}%"></div></div>
      <div class="stat-row"><span class="label">${STAT_LABELS.attack}</span><span class="val">${s.attack}</span></div>
      <div class="stat-row"><span class="label">${STAT_LABELS.defense}</span><span class="val">${s.defense}</span></div>
      <div class="stat-row"><span class="label">${STAT_LABELS.stamina}</span><span class="val">${s.stamina}</span></div>
      <div class="stat-row"><span class="label">${STAT_LABELS.weight}</span><span class="val">${s.weight}</span></div>
      <div class="stat-row"><span class="label">${STAT_LABELS.spin}</span><span class="val">${s.spin}</span></div>
      <div class="stat-row"><span class="label">${STAT_LABELS.bounce}</span><span class="val">${s.bounce}</span></div>
    `;
  }
  function shapeName(s) {
    return { circle:"円", triangle:"三角", square:"四角", star:"星",
             hexagon:"六角", pentagon:"五角" }[s] || s;
  }
  function updatePanels() {
    renderPanel(playerPanel, state.player, "YOU");
    renderPanel(enemyPanel, state.enemy, "CPU");
    streakBadge.textContent = `連勝 ${state.streak} / ${WIN_STREAK}`;
  }

  // ===================== 戦闘開始 =====================
  function startSpin() {
    const p = state.player, e = state.enemy;
    const rr = arena.r * 0.6;
    const angP = rand(0, Math.PI*2);
    const angE = angP + Math.PI + rand(-0.6, 0.6);
    p.x = arena.cx + Math.cos(angP)*rr;
    p.y = arena.cy + Math.sin(angP)*rr;
    e.x = arena.cx + Math.cos(angE)*rr;
    e.y = arena.cy + Math.sin(angE)*rr;

    // 初速：接線方向＋ランダム
    const tangentP = angP + Math.PI/2;
    const tangentE = angE + Math.PI/2;
    const speedP = rand(140, 200);
    const speedE = rand(140, 200);
    p.vx = Math.cos(tangentP)*speedP + rand(-20,20);
    p.vy = Math.sin(tangentP)*speedP + rand(-20,20);
    e.vx = Math.cos(tangentE)*speedE + rand(-20,20);
    e.vy = Math.sin(tangentE)*speedE + rand(-20,20);

    p.hp = p.maxHp; e.hp = e.maxHp;
    p.angle = 0; e.angle = Math.PI;
    p.radius = BASE_RADIUS * (Math.min(canvasW,canvasH)/420);
    e.radius = p.radius;

    state.battle = {
      elapsed: 0,
      hitCooldown: 0,
      lastCollision: 0,
    };
    state.phase = "battle";
    spinBtn.disabled = true;
    showCenter("READY...", 700, () => showCenter("GO!", 500));
    updatePanels();
  }

  function showCenter(text, ms, cb) {
    centerMsg.textContent = text;
    centerMsg.classList.add("show");
    setTimeout(() => {
      centerMsg.classList.remove("show");
      if (cb) cb();
    }, ms);
  }

  // ===================== 物理更新 =====================
  function updateBattle(dt) {
    const b = state.battle;
    if (!b) return;
    const p = state.player, e = state.enemy;

    b.elapsed += dt;
    b.hitCooldown -= dt;

    // ---- 力の適用 ----
    applyForces(p, dt);
    applyForces(e, dt);

    // ---- 位置積分 ----
    p.x += p.vx * dt; p.y += p.vy * dt;
    e.x += e.vx * dt; e.y += e.vy * dt;

    // ---- 壁 ----
    wallCollide(p);
    wallCollide(e);

    // ---- コマ同士の衝突 ----
    komCollide(p, e, b);

    // ---- 回転アニメ ----
    const hpRatioP = clamp(p.hp/p.maxHp, 0, 1);
    const hpRatioE = clamp(e.hp/e.maxHp, 0, 1);
    p.angle += dt * (6 + p.stats.spin*0.3) * hpRatioP;
    e.angle -= dt * (6 + e.stats.spin*0.3) * hpRatioE;

    // ---- 回転量（HP）減少 ----
    const drainP = (HP_DRAIN_BASE - p.stats.stamina*0.04) * dt;
    const drainE = (HP_DRAIN_BASE - e.stats.stamina*0.04) * dt;
    p.hp -= Math.max(0.15, drainP);
    e.hp -= Math.max(0.15, drainE);

    // ---- 時間切れ ----
    const remain = Math.max(0, MAX_BATTLE_TIME - b.elapsed);
    timerBadge.textContent = remain.toFixed(1) + "s";
    if (b.elapsed >= MAX_BATTLE_TIME) {
      if (p.hp > e.hp) endBattle("win");
      else if (e.hp > p.hp) endBattle("lose");
      else endBattle("draw");
      return;
    }

    // ---- 決着判定 ----
    if (p.hp <= 0 || e.hp <= 0) {
      if (p.hp <= 0 && e.hp <= 0) endBattle("draw");
      else if (p.hp <= 0) endBattle("lose");
      else endBattle("win");
      return;
    }

    updatePanels();
  }

  function applyForces(k, dt) {
    const dx = arena.cx - k.x;
    const dy = arena.cy - k.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const nx = dx/dist, ny = dy/dist;

    // 中心引力（距離に比例）
    const pull = CENTER_PULL * (dist / arena.r);
    k.vx += nx * pull * dt;
    k.vy += ny * pull * dt;

    // 歳差ドリフト：回転が落ちるほど内側へ
    const hpRatio = clamp(k.hp/k.maxHp, 0, 1);
    const drift = PRECESS_DRIFT * (1 - hpRatio) * (1 + k.stats.spin*0.02);
    k.vx += nx * drift * dt;
    k.vy += ny * drift * dt;

    // 摩擦＋空気抵抗
    const damp = 1 - (FRICTION*0.3 + AIR_DRAG) * dt;
    k.vx *= damp;
    k.vy *= damp;

    // 速度上限
    const sp = Math.hypot(k.vx,k.vy);
    const maxSp = 420;
    if (sp > maxSp) { k.vx = k.vx/sp*maxSp; k.vy = k.vy/sp*maxSp; }
  }

  function wallCollide(k) {
    const dx = k.x - arena.cx;
    const dy = k.y - arena.cy;
    const dist = Math.hypot(dx, dy);
    const limit = arena.r - k.radius;
    if (dist > limit) {
      const nx = dx/dist, ny = dy/dist;
      // 位置補正
      k.x = arena.cx + nx*limit;
      k.y = arena.cy + ny*limit;
      // 反射
      const vn = k.vx*nx + k.vy*ny;
      if (vn > 0) {
        k.vx -= (1 + WALL_RESTITUTION) * vn * nx;
        k.vy -= (1 + WALL_RESTITUTION) * vn * ny;
      }
      // 場外判定：縁が完全に外＝中心が円外
      const centerDist = Math.hypot(k.x - arena.cx, k.y - arena.cy);
      if (centerDist > arena.r) {
        if (k === state.player) endBattle("lose");
        else endBattle("win");
      }
    }
  }

  function komCollide(p, e, b) {
    const dx = e.x - p.x;
    const dy = e.y - p.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const touch = p.radius + e.radius;
    if (dist >= touch) return;

    const nx = dx/dist, ny = dy/dist;
    const overlap = touch - dist;

    // 位置分離（質量比）
    const totalM = p.mass + e.mass;
    const pShare = e.mass / totalM;
    const eShare = p.mass / totalM;
    p.x -= nx * overlap * pShare;
    p.y -= ny * overlap * pShare;
    e.x += nx * overlap * eShare;
    e.y += ny * overlap * eShare;

    // 相対速度
    const rvx = e.vx - p.vx;
    const rvy = e.vy - p.vy;
    const vn = rvx*nx + rvy*ny;
    if (vn > 0) return; // 離れていく

    // 反発係数：バウンド力
    const rest = clamp(0.25 + (p.stats.bounce + e.stats.bounce)*0.02, 0.2, 0.95);
    const j = -(1 + rest) * vn / (1/p.mass + 1/e.mass);

    p.vx -= j * nx / p.mass;
    p.vy -= j * ny / p.mass;
    e.vx += j * nx / e.mass;
    e.vy += j * ny / e.mass;

    // 攻撃・防御・回転による追加衝撃
    if (b.hitCooldown <= 0) {
      const atkP = p.stats.attack*0.5 + p.stats.spin*0.5;
      const atkE = e.stats.attack*0.5 + e.stats.spin*0.5;
      const defP = p.stats.defense*0.6 + p.stats.weight*0.4;
      const defE = e.stats.defense*0.6 + e.stats.weight*0.4;

      const impactP = Math.max(0, atkE - defP) * 0.25 + Math.abs(vn)*0.02;
      const impactE = Math.max(0, atkP - defE) * 0.25 + Math.abs(vn)*0.02;

      e.hp -= impactP * HP_DRAIN_HIT;
      p.hp -= impactE * HP_DRAIN_HIT;

      // 押し出しブースト
      const pushP = Math.max(0, atkP - defE) * 0.6;
      const pushE = Math.max(0, atkE - defP) * 0.6;
      e.vx += nx * pushP; e.vy += ny * pushP;
      p.vx -= nx * pushE; p.vy -= ny * pushE;

      b.hitCooldown = 0.18;
      b.lastCollision = b.elapsed;
    }
  }

  // ===================== ループ =====================
  function loop(t) {
    if (!state.lastTime) state.lastTime = t;
    let dt = (t - state.lastTime)/1000;
    state.lastTime = t;
    dt = Math.min(dt, 0.04);

    if (state.phase === "battle") {
      updateBattle(dt);
    } else {
      if (state.player) state.player.angle += dt*3;
      if (state.enemy) state.enemy.angle -= dt*3;
    }
    render();
    state.rafId = requestAnimationFrame(loop);
  }

  // ===================== 勝敗 =====================
  function endBattle(result) {
    if (state.phase === "ended") return;
    state.phase = "ended";
    spinBtn.disabled = false;

    if (result === "win") {
      state.streak++;
      updatePanels();
      if (state.streak >= WIN_STREAK) {
        showCenter("5連勝!!", 1200, () => { window.location.href = "hardware.html"; });
        return;
      }
      showCenter("WIN!", 900, () => setTimeout(openChoice, 200));
    } else if (result === "lose") {
      state.streak = 0;
      updatePanels();
      showCenter("LOSE...", 1000, () => showResult(false));
    } else {
      state.streak = 0;
      updatePanels();
      showCenter("DRAW", 1000, () => showResult(false));
    }
  }

  // ===================== 選択 =====================
  function openChoice() {
    const p = state.player;
    $("keepBtn").innerHTML = `このコマのまま挑む<small>${p.colorName} / ${shapeName(p.shape)}</small>`;
    $("rerollBtn").innerHTML = `ランダム生成で新しいコマにする<small>パラメータ再抽選（強化なし）</small>`;
    $("upSpinBtn").innerHTML = `回転速度を 1up して続ける<small>現在 回転 ${p.stats.spin} → ${Math.min(MAX_STAT,p.stats.spin+1)}</small>`;
    $("upBounceBtn").innerHTML = `バウンド力を 1up して続ける<small>現在 バウンド ${p.stats.bounce} → ${Math.min(MAX_STAT,p.stats.bounce+1)}</small>`;

    $("keepBtn").style.display = "block";
    $("rerollBtn").style.display = "block";
    $("upSpinBtn").style.display = "none";
    $("upBounceBtn").style.display = "none";
    choiceOverlay.classList.add("active");
  }
  function closeChoice() { choiceOverlay.classList.remove("active"); }

  $("keepBtn").addEventListener("click", () => {
    $("keepBtn").style.display = "none";
    $("rerollBtn").style.display = "none";
    $("upSpinBtn").style.display = "block";
    $("upBounceBtn").style.display = "block";
  });
  $("rerollBtn").addEventListener("click", () => {
    closeChoice();
    state.player = makeKom(null);
    nextEnemy();
  });
  $("upSpinBtn").addEventListener("click", () => {
    closeChoice();
    state.player.stats.spin = Math.min(MAX_STAT, state.player.stats.spin + 1);
    state.player.mass = 0.6 + state.player.stats.weight*0.08;
    nextEnemy();
  });
  $("upBounceBtn").addEventListener("click", () => {
    closeChoice();
    state.player.stats.bounce = Math.min(MAX_STAT, state.player.stats.bounce + 1);
    nextEnemy();
  });

  function nextEnemy() {
    state.enemy = makeKom(null);
    resetPositions();
    updatePanels();
    state.phase = "idle";
    spinBtn.disabled = false;
    spinBtn.textContent = "スタート";
    timerBadge.textContent = MAX_BATTLE_TIME.toFixed(1) + "s";
    showCenter("NEXT BATTLE", 800);
  }

  function resetPositions() {
    const rr = arena.r*0.6;
    if (state.player) { state.player.x = arena.cx - rr; state.player.y = arena.cy; state.player.angle=0; }
    if (state.enemy)  { state.enemy.x  = arena.cx + rr; state.enemy.y  = arena.cy; state.enemy.angle=Math.PI; }
  }

  // ===================== 結果 =====================
  function showResult(isWin) {
    resultOverlay.classList.add("active");
    resultTitle.textContent = isWin ? "WIN" : "GAME OVER";
    resultTitle.className = isWin ? "win" : "lose";
    resultMsg.textContent = isWin ? "5連勝達成！" : "連勝は " + state.streak + " でストップ…";
  }
  $("resultBtn").addEventListener("click", () => {
    resultOverlay.classList.remove("active");
    backToOpening();
  });

  function backToOpening() {
    state.player=null; state.enemy=null; state.streak=0;
    state.phase = "idle";
    gameEl.classList.remove("active");
    opening.style.display = "flex";
  }

  // ===================== 開始 =====================
  function startGame() {
    opening.style.display = "none";
    gameEl.classList.add("active");
    state.streak = 0;
    state.player = makeKom(null);
    state.enemy = makeKom(null);
    resize();
    resetPositions();
    updatePanels();
    state.phase = "idle";
    spinBtn.disabled = false;
    spinBtn.textContent = "スタート";
    timerBadge.textContent = MAX_BATTLE_TIME.toFixed(1) + "s";
  }

  $("startBtn").addEventListener("click", startGame);
  spinBtn.addEventListener("click", () => {
    if (state.phase === "idle" || state.phase === "ended") {
      state.phase = "idle";
      startSpin();
    }
  });
  window.addEventListener("resize", () => { if (gameEl.classList.contains("active")) resize(); });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
