<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greatest Physicists Tier Maker</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #00adb5;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: var(--accent-color); margin-bottom: 5px; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 25px; font-size: 14px; }
        .controls { display: flex; justify-content: center; margin-bottom: 20px; }
        .reset-btn {
            background-color: #ff4444; color: white; border: none; padding: 10px 20px;
            font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        .reset-btn:hover { background-color: #cc3333; }
        .tier-container { max-width: 1000px; margin: 0 auto; border: 2px solid #444; border-radius: 8px; overflow: hidden; }
        .tier-row { display: flex; border-bottom: 1px solid #444; background: #222; min-height: 70px; }
        .tier-row:last-child { border-bottom: none; }
        .tier-label {
            width: 80px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: #111; flex-shrink: 0;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
        }
        .tier-content { display: flex; flex-wrap: wrap; padding: 10px; gap: 8px; flex-grow: 1; min-height: 50px; }
        .tier-S { background-color: #ff7f7f; }
        .tier-A { background-color: #ffbf7f; }
        .tier-B { background-color: #ffdf7f; }
        .tier-C { background-color: #ffff7f; }
        .tier-D { background-color: #bfff7f; }
        .tier-E { background-color: #7fff7f; }
        .tier-F { background-color: #7fbeff; }
        .tier-G { background-color: #ff7fff; }
        .tier-POOL { background-color: #3a3a3a; }
        .pool-label { background-color: #555; color: white; font-size: 14px; text-shadow: none; }
        .physicist-badge {
            background-color: var(--panel-bg); border: 1px solid #555; border-radius: 4px;
            padding: 6px 12px; cursor: pointer; user-select: none; font-size: 13px;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .physicist-badge:hover { border-color: var(--accent-color); background-color: #3d3d3d; }
        .tier-selector {
            background: #111; border: 1px solid var(--accent-color); border-radius: 3px;
            color: white; font-size: 11px; padding: 2px; cursor: pointer;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg); padding: 30px; border-radius: 8px;
            max-width: 500px; width: 90%; border: 1px solid #555; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .modal-header { font-size: 24px; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .modal-years { font-style: italic; color: #aaa; margin-bottom: 15px; }
        .modal-section { margin-bottom: 15px; }
        .modal-section-title { font-weight: bold; color: #ffbf7f; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; }
        .modal-body { line-height: 1.6; font-size: 15px; }
        .close-btn {
            background: var(--accent-color); color: white; border: none; padding: 8px 16px;
            border-radius: 4px; cursor: pointer; float: right; margin-top: 10px; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Greatest Physicists Tier Maker</h1>
    <div class="subtitle">名前をクリック：詳細情報を表示 ｜ セレクトボックス：Tier（S〜G）へ移動</div>

    <div class="controls">
        <button class="reset-btn" onclick="triggerCarefulReset()">Tier表をリセット</button>
    </div>

    <div class="tier-container">
        <div class="tier-row"><div class="tier-label tier-S">S</div><div class="tier-content" id="row-S"></div></div>
        <div class="tier-row"><div class="tier-label tier-A">A</div><div class="tier-content" id="row-A"></div></div>
        <div class="tier-row"><div class="tier-label tier-B">B</div><div class="tier-content" id="row-B"></div></div>
        <div class="tier-row"><div class="tier-label tier-C">C</div><div class="tier-content" id="row-C"></div></div>
        <div class="tier-row"><div class="tier-label tier-D">D</div><div class="tier-content" id="row-D"></div></div>
        <div class="tier-row"><div class="tier-label tier-E">E</div><div class="tier-content" id="row-E"></div></div>
        <div class="tier-row"><div class="tier-label tier-F">F</div><div class="tier-content" id="row-F"></div></div>
        <div class="tier-row"><div class="tier-label tier-G">G</div><div class="tier-content" id="row-G"></div></div>
        
        <div class="tier-row" style="margin-top: 20px; border-top: 2px solid #444;">
            <div class="tier-label pool-label">POOL</div>
            <div class="tier-content tier-POOL" id="row-POOL"></div>
        </div>
    </div>

    <div class="modal" id="infoModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header" id="modalName"></div>
            <div class="modal-years" id="modalYears"></div>
            <div class="modal-section">
                <div class="modal-section-title">主な業績・理論</div>
                <div class="modal-body" id="modalTheory"></div>
            </div>
            <div class="modal-section">
                <div class="modal-section-title">逸話・エピソード</div>
                <div class="modal-body" id="modalAnecdote"></div>
            </div>
            <button class="close-btn" onclick="document.getElementById('infoModal').style.display='none'">閉じる</button>
        </div>
    </div>

    <script>
        const physicists = [
            { id: 1, name: "Thales of Miletus", years: "c. 624 BC - c. 546 BC", theory: "万物の根源は水であると提唱。琥珀をこすると物を引き寄せる現象（静電気）を記録。", anecdote: "日食を予測してオリーブの豊作を当て、大儲けして哲学が役に立つことを証明した。" },
            { id: 2, name: "Democritus", years: "c. 460 BC - c. 370 BC", theory: "万物はそれ以上分割できない「原子（アトモス）」と空虚からなるという原子論を提唱。", anecdote: "常に世の中を笑い飛ばしていたため「笑う哲学者」と呼ばれた。" },
            { id: 3, name: "Heraclitus", years: "c. 540 BC - c. 480 BC", theory: "「万物は流転する」と説き、宇宙の根源変化の本質を「火」の象徴で表した。", anecdote: "人間嫌いで山にこもり、草を食べて暮らしていたという気難しい孤高の哲学者。" },
            { id: 4, name: "Aristotle", years: "384 BC - 322 BC", theory: "四元素説や自然な運動・強制運動など、中世まで支配的となる古代物理学体系を確立。", anecdote: "アレクサンダー大王の家庭教師。彼の物理学は説得力がありすぎて、1500年以上科学の進歩を止める副作用も。" },
            { id: 5, name: "Archimedes", years: "c. 287 BC - c. 212 BC", theory: "浮力の原理（アルキメデスの原理）、てこの原理、微積分に迫る幾何学計算。", anecdote: "王冠の純金偽装を見抜く方法を風呂場で思いつき、裸で「エウレカ（分かった）！」と叫んで街を走った。" },
            { id: 6, name: "Zhang Heng", years: "78 AD - 139 AD", theory: "世界初の地震計（候風地動儀）や水力駆動の天球儀を発明。宇宙を卵に例える渾天説を支持。", anecdote: "数学、天文学、地理、文学すべてに超一流で、中国では「科聖」と称えられる。" },
            { id: 7, name: "Abbas ibn Firnas", years: "810 - 887", theory: "羽をつけた装置での有人飛行実験、ガラスの製造法の改良、プラネタリウムの製作。", anecdote: "70歳近くで自作の翼をつけ崖から飛び立ち、しばらく飛行したが、尾翼をつけ忘れて着陸時に腰を強打した。" },
            { id: 8, name: "Ibn Yunus", years: "c. 950 - 1009", theory: "極めて精密な天文大表「ハ―キム大天文表」の作成。振り子による時間計測の先駆。", anecdote: "天体観測に熱中するあまり、衣服の破れや身なりを全く気にしない風変わりな人物だった。" },
            { id: 9, name: "Ibn al-Haytham", years: "965 - 1040", theory: "「光学の父」。光が目から出るのではなく、物体から反射して目に入ると証明。近代科学的手法の祖。", anecdote: "ナイル川の治水計画の大風呂敷を広げたが不可能だと気づき、当時のカリフの処刑を逃れるため狂人を装って軟禁生活を送った。" },
            { id: 10, name: "Al-Biruni", years: "973 - 1050", theory: "地球の半径の極めて正確な測定（誤差1%未満）、諸物質の比重の測定、地動説への言及。", anecdote: "死の直前、意識が朦朧とする中で見舞いに来た友人に「さっき議論していた数学の難問の答えは何だったか」と尋ねた。" },
            { id: 11, name: "Ibn Sina", years: "980 - 1037", theory: "運動量に繋がる「傾性の概念」を提唱。空気抵抗がなければ運動は永遠に続くと見抜く（慣性の先駆）。", anecdote: "10代で全ての学問を修め、夜通し読書し疲れたらワインを飲んで頭をシャキッとさせていた超人。" },
            { id: 12, name: "Nicolaus Copernicus", years: "1473 - 1543", theory: "地動説（太陽中心説）を提唱し、数千年の天動説宇宙観にパラダイムシフトを起こす。", anecdote: "カトリック教会の司政官であり、宗教的摩擦を恐れて主著の出版は彼の死の当日までずれ込んだ。" },
            { id: 13, name: "William Gilbert", years: "1544 - 1603", theory: "地球自体が巨大な磁石であると提唱（地球磁気学の祖）。電気（electricity）という言葉を創出。", anecdote: "エリザベス1世の主治医。女王は彼の磁気研究を気に入り、研究費の助成金を個人的に与えていた。" },
            { id: 14, name: "Galileo Galilei", years: "1564 - 1642", theory: "落体の法則、慣性の法則の基礎、望遠鏡による天体観測（木星の衛星発見）、地動説の擁護。", anecdote: "ピサの斜塔から重さの違う球を落とした逸話や、宗教裁判で「それでも地球は動いている」と呟いたとされる伝説で有名。" },
            { id: 15, name: "Johannes Kepler", years: "1571 - 1630", theory: "ケプラーの法則（惑星の軌道は楕円であるなど）を発見し、天体運動を数学的に解明。", anecdote: "占星術師としても有名で、母親が魔女裁判にかけられた際は、自ら弁護に奔走して無罪を勝ち取った。" },
            { id: 16, name: "Isaac Beeckman", years: "1588 - 1637", theory: "物質論的な機械論的自然観の先駆。デカルトに数学と物理学の融合の重要性を説く。", anecdote: "日記にアイデアを書き殴るだけで出版に興味がなかったが、その日記が後に物理学史の重要史料となった。" },
            { id: 17, name: "Otto von Guericke", years: "1602 - 1686", theory: "真空ポンプの発明。真空の存在を証明し、大気圧の凄まじい力を視覚的に実証。", anecdote: "「マクデブルクの半球実験」で、金属球を合わせて真空にし、両側から16頭の馬に引っ張らせても外れないショーを行い大喝采を浴びた。" },
            { id: 18, name: "Evangelista Torricelli", years: "1608 - 1647", theory: "水銀気圧計の発明。「トリチェリの空白（真空）」を発見。大気の重さを証明。", anecdote: "ガリレオの最晩年の弟子。彼が発明した水銀気圧計は、大気が私たちを常に押し潰している事実を暴いた。" },
            { id: 19, name: "Blaise Pascal", years: "1623 - 1662", theory: "「パスカルの原理（密閉容器内の流体圧）」。大気圧の高度変化の実証、確率論の基礎。", anecdote: "「人間は考える葦である」の格言で有名。神童すぎて10代で計算機「パスカリーヌ」を開発。" },
            { id: 20, name: "Robert Boyle", years: "1627 - 1691", theory: "「ボイルの法則（気体の体積は圧力に反比例する）」。近代化学・実験物理の基礎を確立。", anecdote: "大富豪の伯爵家に生まれるが、生涯を独身で通し、実験室にこもって研究にすべての資産を注ぎ込んだ。" },
            { id: 26, name: "Pierre-Louis Maupertuis", years: "1698 - 1759", theory: "力学の根幹をなす「最小作用の原理」を最初に定式化。地球が極方向に平たいことを測量で証明。", anecdote: "プライドが高く、晩年はボルテールから強烈な風刺文学のターゲットにされて精神的に病んでしまった。" },
            { id: 27, name: "Benjamin Franklin", years: "1706 - 1790", theory: "雷が電気であることを証明。プラス・マイナスの電気概念の導入。避雷針の発明。", anecdote: "雷の日に凧を揚げるという命知らずな実験を行った。アメリカ建国の父の一人でもある。" },
            { id: 28, name: "Roger Joseph Boscovich", years: "1711 - 1787", theory: "原子間の引力と斥力をグラフ化した、現代の原子間ポテンシャルの先駆的理論（ボスコヴィッチの原子論）。", anecdote: "外交官としても活躍し、ロンドンでニュートン主義者たちとハイレベルな科学議論を交わしたマルチ超人。" },
            { id: 29, name: "Jean Le Rond d'Alembert", years: "1717 - 1783", theory: "「ダランベールの原理（動気力学を静力学に還元）」。波動方程式の解法。", anecdote: "生まれた直後に教会の階段に捨てられていた孤児だったが、ガラス職人の妻に育てられ、自力で大数学者へ登り詰めた。" },
            { id: 30, name: "Joseph Priestley", years: "1733 - 1804", theory: "酸素、アンモニア、炭酸ガスなど多数の気体を発見。電気の逆二乗則（クーロンの先駆）を示唆。", anecdote: "炭酸水の生みの親。政治的・宗教的発言が過激すぎて、怒った暴徒に自宅と実験室を焼き討ちされアメリカへ亡命した。" },
            { id: 31, name: "Charles-Augustin de Coulomb", years: "1736 - 1806", theory: "「クーロンの法則（電荷間に働く力）」。ねじり天秤を用いた超微小な力の測定、摩擦の研究。", anecdote: "元々は軍の技術将校で、西インド諸島の要塞建設に従事していた。その際の土木工学の経験が物理研究に生きた。" },
            { id: 32, name: "Alessandro Volta", years: "1745 - 1827", theory: "ボルタ電池（世界初の持続的な化学電池）の発明。電位・電圧概念の確立。", anecdote: "カエルの足の電気論争（ガルヴァーニと対立）に勝つため、金属同士を重ねるだけで電気が起きる電池を作った。" },
            { id: 33, name: "Thomas Young", years: "1773 - 1829", theory: "光の干渉実験（ヤングの実験）による光の波動説の決定打。「ヤング率（弾性）」、色の三原色説。", anecdote: "「最後の万能人」と呼ばれる。物理学者であり、医師であり、エジプトのロゼッタストーンの解読にも貢献した。" },
            { id: 34, name: "André-Marie Ampère", years: "1775 - 1836", theory: "「アンペールの法則（電流とその周りの磁場）」。右ねじの法則、電磁気学の基礎。", anecdote: "凄まじい「うっかり屋」で、通りがかった馬車の背面にチョークで数学の数式を夢中で書き殴り、馬車が動いて焦って追いかけた。" },
            { id: 35, name: "Hans Christian Ørsted", years: "1777 - 1851", theory: "「電流が磁場を作る」現象（電磁相互作用）を世界で初めて発見し、電磁気学の幕を開ける。", anecdote: "講義の最中、たまたま電流を流したワイヤーの近くにあった方位磁針が動いたことで世紀の大発見をした。" },
            { id: 36, name: "Humphry Davy", years: "1778 - 1829", theory: "電気分解によるナトリウム、カリウムなどの新元素の大量発見。安全灯（デービー灯）の発明。", anecdote: "実験中に笑気ガス（亜酸化窒素）を吸いまくり、その幻覚症状にドハマりして危うく中毒死しかけた。" },
            { id: 37, name: "Joseph von Fraunhofer", years: "1787 - 1826", theory: "太陽スペクトルの暗線（フラウンホーファー線）の発見。回折格子の開発、分光学の祖。", anecdote: "貧しいガラス職人の見習いだったが、勤め先の建物が崩壊し、救出に来たバイエルン選帝侯に気に入られて学問の道へ。" },
            { id: 38, name: "Augustin-Jean Fresnel", years: "1788 - 1827", theory: "光の回折・偏光の数理理論。灯台の性能を爆発的に高めた「フレネルレンズ」の発明。", anecdote: "ヤングと並ぶ光波動説の英雄。彼の灯台レンズは世界中の海の安全を劇的に変え、数え切れない命を救った。" },
            { id: 39, name: "Georg Ohm", years: "1789 - 1854", theory: "「オームの法則（電圧・電流・抵抗の関係）」。電気回路理論の基礎。", anecdote: "発見当初は数学的すぎるとドイツの学会から完全無視され、ショックで高校教師の職まで辞める不遇の時代を過ごした。" },
            { id: 40, name: "Michael Faraday", years: "1791 - 1867", theory: "電磁誘導の発見、電場・磁場（「場の概念」）の提唱、電気分解の法則、ファラデー効果。", anecdote: "貧困のため高等教育を受けず、製本所の丁稚奉公からデービーの助手になりトップ科学者へ。数式が使えないため図で思考した。" },
            { id: 41, name: "Julius Plücker", years: "1801 - 1868", theory: "陰極線の発見（電子発見への道を開く）。磁気光学、高度な解析幾何学への貢献。", anecdote: "数学者と物理学者の２つの顔を持ち、それぞれの分野の派閥闘争に巻き込まれながらも独自の光を放ち続けた。" },
            { id: 42, name: "Christian Doppler", years: "1803 - 1853", theory: "「ドップラー効果（波の発生源が動くと周波数が変化する現象）」の提唱。", anecdote: "彼の理論を証明するため、トランペット奏者を乗せた蒸気機関車を走らせ、絶対音感を持つ音楽家に音程変化を聴き取らせた。" },
            { id: 43, name: "Wilhelm Eduard Weber", years: "1804 - 1891", theory: "電磁気単位系の構築。ガウスと共に世界初の移動式電信機を開発。磁束単位「ウェーバ」に名を残す。", anecdote: "政治的発言（ゲッティンゲン７人事件）で大学をクビになったが、ガウスとの熱い友情と共同研究は途切れなかった。" },
            { id: 44, name: "William Rowan Hamilton", years: "1805 - 1865", theory: "ハミルトン力学（現代物理の記述に不可欠な量子力学の基礎）、四元数の発見。", anecdote: "四元数の公式（i²=j²=k²=ijk=-1）を散歩中に思いつき、興奮のあまり近くのダブリンの橋の石にナイフで彫り刻んだ。" },
            { id: 45, name: "Julius Robert von Mayer", years: "1814 - 1878", theory: "熱力学第一法則（エネルギー保存の法則）を世界で最初に熱の仕事当量として定式化。", anecdote: "医者。船医時代に熱帯地方の患者の静脈血が鮮やか（代謝が低い）なことから閃いたが、物理学者たちに無視され絶望して飛び降り自殺未遂を起こした。" },
            { id: 46, name: "William Thomson", years: "1824 - 1907", theory: "熱力学第二法則の確立。絶対温度（ケルビン）の導入。大西洋横断海底電信ケーブルの敷設成功。", anecdote: "「物理学はほぼ完成しており、あとは詳細の微調整だけだ」と言った直後、量子力学と相対性理論の「二つの暗雲」を指摘した。" },
            { id: 47, name: "Gustav Kirchhoff", years: "1824 - 1887", theory: "「キルヒホッフの法則（電気回路、及び放射エネルギー）」。ブンゼンと共に分光分析を創始。", anecdote: "「太陽に金があるとしても地球に持ってこれなきゃ意味ない」と銀行家に馬鹿にされ、後に発見の功績で金メダルを貰うと「太陽の金を換金してきました」とその銀行家に突きつけた。" },
            { id: 48, name: "James Clerk Maxwell", years: "1831 - 1879", theory: "マクスウェル方程式（電磁気学の統合）、光が電磁波であることの予言、気体分子の速度分布。", anecdote: "アインシュタインが「ニュートン以来、最も深い物理学の変革」と絶賛。幼少期はあまりに内向的で「ダフ（のろま）」と呼ばれていた。" },
            { id: 49, name: "Ernst Mach", years: "1838 - 1916", theory: "マッハ数（超音速）。ニュートンの絶対空間を批判（アインシュタインの相対性理論に超影響）。", anecdote: "徹底的な経験論者。目に見えない「原子」の存在を生涯頑なに信じず、ボルツマンらと激しく対立した。" },
            { id: 50, name: "Josiah Willard Gibbs", years: "1839 - 1903", theory: "統計力学の創始・命名。ギブス自由エネルギー、化学ポテンシャル、ベクトル解析の確立。", anecdote: "アメリカが生んだ最初の天才理論物理学者。極めて物静かで生涯を大学の近くの実家で過ごし、名声を全く求めなかった。" },
            { id: 51, name: "John William Strutt", years: "1842 - 1919", theory: "レイリー散乱（空が青い理由の解明）、アルゴンの発見（ノーベル賞）、黒体放射のレイリー・ジーンズの法則。", anecdote: "貴族（第3代レイリー男爵）。自宅の邸宅に巨大な実験室を自費で作り、精密測定の鬼として数々の金字塔を打ち立てた。" },
            { id: 52, name: "Nikola Tesla", years: "1856 - 1943", theory: "交流（AC）電流システム、テスラコイル、無線操縦、遠隔エネルギー伝送の予言。", anecdote: "エジソンと激しい「電流戦争」を展開。超絶な潔癖症で、鳩を異常に愛し、数字の「3」に病的にこだわるマッドサイエンティスト。" },
            { id: 53, name: "Heinrich Hertz", years: "1857 - 1894", theory: "マクスウェルが予言した「電磁波」の存在を実験で完全実証。光電効果の発見。", anecdote: "周波数の単位「ヘルツ(Hz)」の由来。「これで無線通信ができるか？」と聞かれ、「何の役にも立たない実験さ」と答えたという。" },
            { id: 54, name: "Walther Nernst", years: "1864 - 1941", theory: "熱力学第三法則（絶対零度でエントロピーはゼロになる）の提唱。物理化学の基礎。", anecdote: "非常に気が強く皮肉屋で、アインシュタインすら彼の前ではタジタジになることがあった。趣味の狩猟を愛した。" },
            { id: 55, name: "Nikolay Umov", years: "1846 - 1915", theory: "エネルギーの移動を記述する「ウモフ・ポインティング・ベクトル」の先行概念、E=kmc²の初期提示。", anecdote: "モスクワ大学の物理学リーダー。ロシアの科学をヨーロッパ水準に引き上げるため、教育と普及に人生を捧げた。" },
            { id: 56, name: "Wilhelm Röntgen", years: "1845 - 1923", theory: "「X線」の発見。第1回ノーベル物理学賞を受賞。", anecdote: "謎の線の意味を込めて「X線」と命名。人類初のレントゲン写真は彼の妻の手（指輪付き）。賞金はすべて大学に寄付し、特許も取らなかった。" },
            { id: 57, name: "Hendrik Lorentz", years: "1853 - 1928", theory: "ローレンツ変換、ローレンツ力。特殊相対性理論の数学的基礎を築く。ゼーマン効果の理論化。", anecdote: "圧倒的な人格者で、当時のヨーロッパ物理学界の調停者。ソルベー会議の議長として、天才たちの議論を完璧にまとめた。" },
            { id: 58, name: "Henri Becquerel", years: "1852 - 1908", theory: "天然ウランからの放射能の発見（キュリー夫妻と共にノーベル賞）。", anecdote: "曇りの日が続いたため、ウランの鉱石を黒い紙に包んで引き出しに放置していたら、なぜか写真乾板が感光していて放射能を発見した。" },
            { id: 59, name: "Henri Poincaré", years: "1854 - 1912", theory: "三体問題、ポアンカレ予想。相対性理論の先駆적数学、カオス理論の祖。", anecdote: "「最後の数学的万能科学者」。凄まじい脳内思考派で、実験や視覚的な図を嫌い、頭の中だけで複雑な多次元の数理を組み立てた。" },
            { id: 60, name: "J. J. Thomson", years: "1856 - 1940", theory: "「電子」の発見（陰極線の正体が粒子であることを証明）。原子のブドウパンモデルを提示。", anecdote: "キャヴェンディッシュ研究所の所長。彼の弟子から7人、実の息子（G.P.トムソン）までもがノーベル賞を受室する怪物育成の神。" },
            { id: 61, name: "Max Planck", years: "1858 - 1947", theory: "エネルギー量子仮説（プランク定数）を提唱し、量子力学の扉を完全に開く。", anecdote: "学生時代、教授に「物理学はもう終わった学問だからやめとけ」と言われたが、「基礎を知りたいだけ」と研究を続け、新時代を作った。" },
            { id: 62, name: "Pierre Curie", years: "1859 - 1906", theory: "ピエゾ電気（圧電効果）の発見、磁性のキュリーの法則。ラジウム・ポロニウムの共同発見。", anecdote: "マリーを深く愛しサポートした。ノーベル賞がマリー抜きで彼一人に贈られそうになった際、「彼女がいないなら辞退する」と抗議した。" },
            { id: 63, name: "Pieter Zeeman", years: "1865 - 1943", theory: "「ゼーマン効果（磁場によってスペクトル線が分裂する現象）」の発見（ローレンツとノーベル賞）。", anecdote: "大学の規則を破って勝手に磁場と光の実験を強行し、その結果世紀の大発見を成し遂げてクビを免れた。" },
            { id: 64, name: "Marie Curie", years: "1867 - 1934", theory: "「放射能（Radioactivity）」の命名、ラジウムとポロニウムの分離。ピッチブレンドの研究。", anecdote: "歴史上唯一、異なる２つの科学分野（物理学・化学）でノーベル賞を受賞した偉人。研究ノートは今も放射線を放ち、防護服なしでは読めない。" },
            { id: 65, name: "Robert Millikan", years: "1868 - 1953", theory: "油滴実験による電気素量（電子1個の電荷）の超精密測定。光電効果によるプランク定数の実証。", anecdote: "アインシュタインの光量子仮説を「絶対に間違っている」と証明するために10年間実験を続け、逆に完璧に証明してしまいノーベル賞を得た。" },
            { id: 66, name: "Ernest Rutherford", years: "1871 - 1937", theory: "原子核の発見（ラザフォード散乱）、α線・β線の発見、原子の太陽系モデル。", anecdote: "「科学は物理学か、さもなければ切手収集のようなものである」と言い放つ超物理至上主義者。なぜかノーベル化学賞を渡され苦笑いした。" },
            { id: 67, name: "Guglielmo Marconi", years: "1874 - 1937", theory: "長距離無線通信の実用化、大西洋横断無線電信の成功（ノーベル賞）。", anecdote: "テスラやヘルツの基礎研究を土台にビジネス化し大成功。タイタニック号沈没の際、彼の無線機が多くの命を救った。" },
            { id: 68, name: "Albert Einstein", years: "1879 - 1955", theory: "特殊・一般相対性理論、光量子仮説（光電効果の解明）、ブラウン運動の理論、E=mc²。", anecdote: "26歳の時、特許庁の平職員でありながら物理学の常識を覆す論文を4つ同時発表（奇跡の年）。靴下を履くのが嫌いだった。" },
            { id: 69, name: "Max von Laue", years: "1879 - 1960", theory: "結晶によるX線回折現象（ラウエ斑点）の発見。X線が波であることを証明。", anecdote: "ナチス政権下において、ユダヤ系科学者たちを密かに庇い続けた。アインシュタインの相対性理論をいち早く支持した熱き男。" },
            { id: 70, name: "Arthur Eddington", years: "1882 - 1944", theory: "皆既日食の観測により、太陽の重力で光が曲がることを実証（アインシュタインの相対論を証明）。", anecdote: "「世界で相対論を理解しているのは3人だけ（アインシュタイン、あなた、あと一人は？）」と聞かれ、答えに詰まり「誰だろうと考えていた」と返した。" },
            { id: 71, name: "Niels Bohr", years: "1885 - 1962", theory: "ボーアの原子模型（量子化された軌道）、相補性原理。コペンハーゲン解釈のリーダー。", anecdote: "アインシュタインと「神はサイコロを振らない」を巡って生涯大論争。ノーベル賞受賞時、地元ビール工場から「自宅に直接繋がるビールパイプライン」を贈られた。" },
            { id: 72, name: "Henry Moseley", years: "1887 - 1915", theory: "モーズリーの法則（X線の固有波長と原子番号の関係）。周期表を原子量順から原子番号順へ修正。", anecdote: "27歳の若さで第一次世界大戦のガリポリの戦いで戦死。科学界は彼の死を「大いなる国家的損失」と嘆き、以降科学者の前線送りは禁止された。" },
            { id: 73, name: "Alexander Friedmann", years: "1888 - 1925", theory: "アインシュタイン方程式を解き、宇宙が膨張または収縮しているという「膨張宇宙モデル」を導く。", anecdote: "気象学者でもあり、高層大気観測のために当時の気球の世界高度記録（7400m）を叩き出したタフな男。" },
            { id: 74, name: "Edwin Hubble", years: "1889 - 1953", theory: "ハッブルの法則（宇宙膨張の観測的実証）。銀河が天の川の外にも無数にあることを発見。", anecdote: "若い頃はボクシングのヘビー級選手で、さらに弁護士の資格も持っていたという超文武両道のイケメン学者。" },
            { id: 75, name: "Arthur Compton", years: "1892 - 1962", theory: "「コンプトン効果（X線が電子と衝突すると波長が伸びる現象）」の発見。光の粒子性を決定づける。", anecdote: "非常に熱心なテニスプレイヤー。原子爆弾開発のマンハッタン計画の主要メンバーでもあった。" },
            { id: 76, name: "Louis de Broglie", years: "1892 - 1987", theory: "物質波（ド・ブロイ波）の提唱。「粒子だと思われていた物質も、実は波の性質を持つ」と見抜く。", anecdote: "フランスの超名門貴族（公爵）。歴史の論文を書く予定だったが、兄（実験物理学者）の影響で急遽物理に転向してノーベル賞を獲った。" },
            { id: 77, name: "Satyendra Nath Bose", years: "1894 - 1974", theory: "ボース＝アインシュタイン統計、ボース粒子の定義。光子の新しい統計的記述。", anecdote: "論文をアインシュタインに直接送り、感銘を受けたアインシュタインがドイツ語に翻訳して出版させたことで一躍世界トップへ。" },
            { id: 78, name: "Werner Heisenberg", years: "1901 - 1976", theory: "「不確定性原理」、行列力学の創始。量子力学の理論的骨組みを構築。", anecdote: "花粉症が酷すぎて避難した北海の孤島（ヘルゴラント島）で、夜通し計算して行列力学を閃き、興奮のあまり夜明けに崖に登って朝日を浴びた。" },
            { id: 79, name: "Wolfgang Pauli", years: "1900 - 1958", theory: "「パウリの排他原理」、電子スピンの理論化、ニュートリノの存在予言。", anecdote: "彼が実験室に入ると装置がなぜか爆発・破損する「パウリ効果」があまりに有名。毒舌家で、他人の論文を「間違出すらしていない」と一蹴した。" },
            { id: 80, name: "Erwin Schrödinger", years: "1887 - 1961", theory: "シュレーディンガー方程式（波動力学の創始）。「シュレーディンガーの猫」の思考実験。", anecdote: "数式を閃いたのは、アルプスの山小屋で愛人とバカンスを過ごしている最中だった。超絶な女たらしとして有名。" },
            { id: 81, name: "George Uhlenbeck", years: "1905 - 1956", theory: "ガーズミットと共に「電子スピン（自転のような固有角運動量）」の概念を提唱。", anecdote: "大学院生時代にスピンを思いついたが、論文提出後に「電子の表面が光速を超えて回転することになり矛盾する！」と気づいて焦ったが、大発見となった。" },
            { id: 82, name: "Walter Heinrich Heitler", years: "1906 - 1967", theory: "ロンドンと共に量子力学を化学結合（水素分子）に適用し、量子化学・分子軌道論の先駆となる。", anecdote: "ナチスを逃れてアイルランドへ。シュレーディンガーと共にダブリン高等研究所の物理学部門を支えた。" },
            { id: 83, name: "James Chadwick", years: "1891 - 1974", theory: "「中性子」の発見（原子爆弾開発への決定打となりノーベル賞）。", anecdote: "第一次世界大戦中、ドイツの捕虜収容所に拘留されていたが、そこで潜入してきた科学雑誌を読みながら即席の実験室を作って研究していた根性の人。" },
            { id: 84, name: "Leo Szilard", years: "1898 - 1964", theory: "核連鎖反応（アインシュタイン＝シラードの手紙の発起人）、情報理論への初期貢献。", anecdote: "ロンドンの信号待ちの最中に「核連鎖反応」のアイデアを閃いた。天才だが定住を嫌い、生涯のほとんどをホテル暮らしで過ごした。" },
            { id: 85, name: "George Gamow", years: "1904 - 1968", theory: "ビッグバン理論の確立（宇宙背景放射の予言）、アルファ崩壊のトンネル効果。DNA的暗号コード提示。", anecdote: "超悪戯好き。「アルファ・ベータ・ガンマ（α, β, γ）論文」を作るため、何もしてない友人ベテ（Bethe）の名前を著者に勝手に入れた。" },
            { id: 86, name: "Hideki Yukawa", years: "1907 - 1981", theory: "中間子理論（原子核を結合させる強い力の媒介粒子）の提唱。日本人初のノーベル賞。", anecdote: "子供の頃は寡黙すぎて「イワン（言わん）」というあだ名だった。兄たちが天才すぎて劣等感を持っていたが、世界を驚かせる大天才へ。" },
            { id: 87, name: "K. Alex Müller", years: "1927 - 2016", theory: "ベドノルツと共に「高温超伝導」を発見し、物理学界に大フィーバーを巻き起こす（即ノーベル賞）。", anecdote: "IBM的研究所で、誰も見向きもしなかった「セラミック（酸化物）」をひたすら冷やす粘り強い実験で大奇跡を起こした。" },
            { id: 88, name: "Carl David Anderson", years: "1905 - 1992", theory: "「陽電子（世界初の反物質）」、および「ミューオン」の発見。", anecdote: "宇宙線（空から降ってくる放射線）の観測中、電子と全く同じなのに磁場で逆向きに曲がる謎の軌跡を見つけて反物質の存在を証明した。" },
            { id: 89, name: "Lev Landau", years: "1908 - 1968", theory: "液体ヘリウムの超流動の理論、ランダウ準位、プラズマのランダウ減衰。物理学のほぼ全領域を網羅。", anecdote: "物理学者を能力ごとに「対数」で採点するノートをつけていた（アインシュタインは0.5、自分は1.5〜1）。超難関の試験「理論ミニマム」を作った。" },
            { id: 90, name: "Hans Bethe", years: "1906 - 1997", theory: "太陽や星が輝くエネルギー源（核融合反応：CNOサイクル）の解明。マンハッタン計画理論部門長。", anecdote: "ガモフに勝手に論文の著者に名前を連ねられたが、内容が良すぎたのでそのまま喜び、のちに星のエネルギーの理論で本当にノーベル賞を獲った。" },
            { id: 91, name: "Fred Hoyle", years: "1515 - 2001", theory: "恒星内元素合成論（星の中で炭素や鉄ができる仕組み）。定常宇宙論の提唱。", anecdote: "宇宙膨張論をバカにしてラジオ番組で「ビッグバン（大ホラ吹き）」と呼んだ。それがそのまま理論の正式名称になってしまった皮肉。" },
            { id: 92, name: "Enrico Fermi", years: "1901 - 1954", theory: "世界初の原子炉（シカゴ・パイル1号）の建設、フェルミ統計、弱気相互作用の理論。", anecdote: "「原子力の設計者」。実験も理論も完璧な歴史上最後の両刀使い。「宇宙人はどこにいる？（フェルミのパラドックス）」や、フェルミ推定で有名。" },
            { id: 93, name: "J. Robert Oppenheimer", years: "1904 - 1967", theory: "マンハッタン計画の科学部門リーダー。ブラックホール存在の初期理論、ボルン＝オッペンハイマー近似。", anecdote: "「原爆の父」。最初の原爆実験の成功時、ヒンドゥー教の聖典から「我は死神なり、世界の破壊者なり」という言葉を想起した。" },
            { id: 94, name: "Dennis Gabor", years: "1000 - 1979", theory: "「ホログラフィー（3D立体写真技術）」の発明・基本原理の提唱（ノーベル賞）。", anecdote: "電子顕微鏡の解像度を上げる研究の過程で偶然思いついたが、当時はレーザーが存在しなかったため、実用化まで20年待つことになった。" },
            { id: 95, name: "Richard Feynman", years: "1918 - 1988", theory: "量子電磁力学（QED）の完成（ファインマン・ダイアグラム）、経路積分、ナノテクノロジーの予言。", anecdote: "金庫破りの達人、サンバのドラム奏者、ストリップ劇場の常連。難しい物理を極限までシンプルに解説する天才。" },
            { id: 96, name: "John Bardeen", years: "1908 - 1991", theory: "「トランジスタの開発」、および「超伝導のBCS理論」。", anecdote: "ノーベル物理学賞を【２回】受賞した歴史上唯一の人物。２回目の受賞時、スウェーデン国王に「今回は家族を全員連れてきました」と笑って話した。" },
            { id: 97, name: "Abdus Salam", years: "1926 - 1996", theory: "電弱統一理論（電磁気力と弱い力を一つの数式に統合：ノーベル賞）。", anecdote: "パキスタン初のノーベル賞受賞者。授賞式には伝統衣装の民族服と尖った靴で出席し、独自の信仰と科学の融合をアピールした。" },
            { id: 98, name: "Stephen Hawking", years: "1942 - 2018", theory: "ホーキング放射（ブラックホールは蒸発する）、宇宙の特異点定理、無境界仮説。", anecdote: "「車椅子の物理学者」。難病ALSと闘いながら、ユーモアに溢れた性格でアニメ『ザ・シンプソンズ』や映画に本人役で多数出演した。" }
        ];

        // 各Tierの配置データ管理
        let tierData = {
            S: [], A: [], B: [], C: [], D: [], E: [], F: [], G: [],
            POOL: physicists.map(p => p.id)
        };

        // 前回の配置をローカルストレージから復元
        if (localStorage.getItem('physicists_tier_split_v4')) {
            tierData = JSON.parse(localStorage.getItem('physicists_tier_split_v4'));
        }

        // アプリ画面を描画する関数
        function render() {
            const rows = ['S', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'POOL'];
            rows.forEach(r => document.getElementById(`row-${r}`).innerHTML = '');

            rows.forEach(rowKey => {
                const container = document.getElementById(`row-${rowKey}`);
                tierData[rowKey].forEach(id => {
                    const physicist = physicists.find(p => p.id === id);
                    if (!physicist) return;

                    const badge = document.createElement('div');
                    badge.className = 'physicist-badge';
                    badge.innerHTML = `<span onclick="showDetails(${physicist.id})">${physicist.name}</span>`;

                    const select = document.createElement('select');
                    select.className = 'tier-selector';
                    
                    const options = ['POOL', 'S', 'A', 'B', 'C', 'D', 'E', 'F', 'G'];
                    options.forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt;
                        option.text = opt === 'POOL' ? 'P' : opt;
                        if (opt === rowKey) option.selected = true;
                        select.appendChild(option);
                    });

                    select.onchange = (e) => {
                        movePhysicist(physicist.id, rowKey, e.target.value);
                    };

                    badge.appendChild(select);
                    container.appendChild(badge);
                });
            });

            // 現在の配置をブラウザに自動保存
            localStorage.setItem('physicists_tier_split_v4', JSON.stringify(tierData));
        }

        // メンバーを移動させる関数
        function movePhysicist(id, fromRow, toRow) {
            tierData[fromRow] = tierData[fromRow].filter(x => x !== id);
            tierData[toRow].push(id);
            render();
        }

        // ポップアップ詳細画面を表示する関数
        function showDetails(id) {
            const p = physicists.find(x => x.id === id);
            document.getElementById('modalName').innerText = p.name;
            document.getElementById('modalYears').innerText = p.years;
            document.getElementById('modalTheory').innerText = p.theory;
            document.getElementById('modalAnecdote').innerText = p.anecdote;
            document.getElementById('infoModal').style.display = 'flex';
        }

        // ポップアップを閉じる関数
        function closeModal(e) {
            if (e.target.id === 'infoModal') {
                document.getElementById('infoModal').style.display = 'none';
            }
        }

        // 4回連続で執念深く問い詰めるリセットシステム
        function triggerCarefulReset() {
            const prompts = [
                "【確認 1/4】本当にすべてのTier配置をリセットして初期状態に戻しますか？",
                "【確認 2/4】本当に、本当によろしいですか？ せっかく悩んで作ったTierデータがすべて消去されます。",
                "【確認 3/4】後悔しませんか？ 98人の天才物理学者たちが全員POOL（未配置）に引きずり戻されますよ？",
                "【最終警告 4/4】これで本当に最後です。もう一度だけ聞きます。リセットを実行しますね？"
            ];

            for (let i = 0; i < prompts.length; i++) {
                if (!confirm(prompts[i])) {
                    alert("リセットを取り消しました。賢明な判断です。");
                    return; // 途中でキャンセルされたら処理を即終了
                }
            }

            // 4回すべてを突破した場合のみ初期化
            tierData = {
                S: [], A: [], B: [], C: [], D: [], E: [], F: [], G: [],
                POOL: physicists.map(p => p.id)
            };
            render();
            alert("すべてのTierを完全に初期化し、POOLへ戻しました。");
        }

        // 初回起動時の実行
        render();
    </script>
</body>
</html>
