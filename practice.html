<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greatest Physicists Tier Maker</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #00adb5;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: var(--accent-color); margin-bottom: 5px; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 25px; font-size: 14px; }
        .controls { display: flex; justify-content: center; margin-bottom: 20px; }
        .reset-btn {
            background-color: #ff4444; color: white; border: none; padding: 10px 20px;
            font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        .reset-btn:hover { background-color: #cc3333; }
        .tier-container { max-width: 1000px; margin: 0 auto; border: 2px solid #444; border-radius: 8px; overflow: hidden; }
        .tier-row { display: flex; border-bottom: 1px solid #444; background: #222; min-height: 70px; }
        .tier-row:last-child { border-bottom: none; }
        .tier-label {
            width: 80px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: #111; flex-shrink: 0;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
        }
        .tier-content { display: flex; flex-wrap: wrap; padding: 10px; gap: 8px; flex-grow: 1; min-height: 50px; }
        .tier-S { background-color: #ff7f7f; }
        .tier-A { background-color: #ffbf7f; }
        .tier-B { background-color: #ffdf7f; }
        .tier-C { background-color: #ffff7f; }
        .tier-D { background-color: #bfff7f; }
        .tier-E { background-color: #7fff7f; }
        .tier-F { background-color: #7fbeff; }
        .tier-G { background-color: #ff7fff; }
        .tier-POOL { background-color: #3a3a3a; }
        .pool-label { background-color: #555; color: white; font-size: 14px; text-shadow: none; }
        .physicist-badge {
            background-color: var(--panel-bg); border: 1px solid #555; border-radius: 4px;
            padding: 6px 12px; cursor: pointer; user-select: none; font-size: 13px;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .physicist-badge:hover { border-color: var(--accent-color); background-color: #3d3d3d; }
        .tier-selector {
            background: #111; border: 1px solid var(--accent-color); border-radius: 3px;
            color: white; font-size: 11px; padding: 2px; cursor: pointer;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg); padding: 30px; border-radius: 8px;
            max-width: 500px; width: 90%; border: 1px solid #555; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .modal-header { font-size: 24px; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .modal-years { font-style: italic; color: #aaa; margin-bottom: 15px; }
        .modal-section { margin-bottom: 15px; }
        .modal-section-title { font-weight: bold; color: #ffbf7f; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; }
        .modal-body { line-height: 1.6; font-size: 15px; }
        .close-btn {
            background: var(--accent-color); color: white; border: none; padding: 8px 16px;
            border-radius: 4px; cursor: pointer; float: right; margin-top: 10px; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Greatest Physicists Tier Maker</h1>
    <div class="subtitle">名前をクリック：詳細情報を表示 ｜ セレクトボックス：Tier（S〜G）へ移動</div>

    <div class="controls">
        <button class="reset-btn" onclick="triggerCarefulReset()">Tier表をリセット</button>
    </div>

    <div class="tier-container">
        <div class="tier-row"><div class="tier-label tier-S">S</div><div class="tier-content" id="row-S"></div></div>
        <div class="tier-row"><div class="tier-label tier-A">A</div><div class="tier-content" id="row-A"></div></div>
        <div class="tier-row"><div class="tier-label tier-B">B</div><div class="tier-content" id="row-B"></div></div>
        <div class="tier-row"><div class="tier-label tier-C">C</div><div class="tier-content" id="row-C"></div></div>
        <div class="tier-row"><div class="tier-label tier-D">D</div><div class="tier-content" id="row-D"></div></div>
        <div class="tier-row"><div class="tier-label tier-E">E</div><div class="tier-content" id="row-E"></div></div>
        <div class="tier-row"><div class="tier-label tier-F">F</div><div class="tier-content" id="row-F"></div></div>
        <div class="tier-row"><div class="tier-label tier-G">G</div><div class="tier-content" id="row-G"></div></div>
        
        <div class="tier-row" style="margin-top: 20px; border-top: 2px solid #444;">
            <div class="tier-label pool-label">POOL</div>
            <div class="tier-content tier-POOL" id="row-POOL"></div>
        </div>
    </div>

    <div class="modal" id="infoModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header" id="modalName"></div>
            <div class="modal-years" id="modalYears"></div>
            <div class="modal-section">
                <div class="modal-section-title">主な業績・理論</div>
                <div class="modal-body" id="modalTheory"></div>
            </div>
            <div class="modal-section">
                <div class="modal-section-title">逸話・エピソード</div>
                <div class="modal-body" id="modalAnecdote"></div>
            </div>
            <button class="close-btn" onclick="document.getElementById('infoModal').style.display='none'">閉じる</button>
        </div>
    </div>

    <script>
        const physicists = [
            { id: 1, name: "Thales of Miletus", years: "c. 624 BC - c. 546 BC", theory: "万物の根源は水であると提唱。琥珀をこすると物を引き寄せる現象（静電気）を記録。", anecdote: "日食を予測してオリーブの豊作を当て、大儲けして哲学が役に立つことを証明した。" },
            { id: 2, name: "Democritus", years: "c. 460 BC - c. 370 BC", theory: "万物はそれ以上分割できない「原子（アトモス）」と空虚からなるという原子論を提唱。", anecdote: "常に世の中を笑い飛ばしていたため「笑う哲学者」と呼ばれた。" },
            { id: 3, name: "Heraclitus", years: "c. 540 BC - c. 480 BC", theory: "「万物は流転する」と説き、宇宙の根源変化の本質を「火」の象徴で表した。", anecdote: "人間嫌いで山にこもり、草を食べて暮らしていたという気難しい孤高の哲学者。" },
            { id: 4, name: "Aristotle", years: "384 BC - 322 BC", theory: "四元素説や自然な運動・強制運動など、中世まで支配的となる古代物理学体系を確立。", anecdote: "アレクサンダー大王の家庭教師。彼の物理学は説得力がありすぎて、1500年以上科学の進歩を止める副作用も。" },
            { id: 5, name: "Archimedes", years: "c. 287 BC - c. 212 BC", theory: "浮力の原理（アルキメデスの原理）、てこの原理、微積分に迫る幾何学計算。", anecdote: "王冠の純金偽装を見抜く方法を風呂場で思いつき、裸で「エウレカ（分かった）！」と叫んで街を走った。" },
            { id: 6, name: "Zhang Heng", years: "78 AD - 139 AD", theory: "世界初の地震計（候風地動儀）や水力駆動の天球儀を発明。宇宙を卵に例える渾天説を支持。", anecdote: "数学、天文学、地理、文学すべてに超一流で、中国では「科聖」と称えられる。" },
            { id: 7, name: "Abbas ibn Firnas", years: "810 - 887", theory: "羽をつけた装置での有人飛行実験、ガラスの製造法の改良、プラネタリウムの製作。", anecdote: "70歳近くで自作の翼をつけ崖から飛び立ち、しばらく飛行したが、尾翼をつけ忘れて着陸時に腰を強打した。" },
            { id: 8, name: "Ibn Yunus", years: "c. 950 - 1009", theory: "極めて精密な天文大表「ハ―キム大天文表」の作成。振り子による時間計測の先駆。", anecdote: "天体観測に熱中するあまり、衣服の破れや身なりを全く気にしない風変わりな人物だった。" },
            { id: 9, name: "Ibn al-Haytham", years: "965 - 1040", theory: "「光学の父」。光が目から出るのではなく、物体から反射して目に入ると証明。近代科学的手法の祖。", anecdote: "ナイル川の治水計画の大風呂敷を広げたが不可能だと気づき、当時のカリフの処刑を逃れるため狂人を装って軟禁生活を送った。" },
            { id: 10, name: "Al-Biruni", years: "973 - 1050", theory: "地球の半径の極めて正確な測定（誤差1%未満）、諸物質の比重の測定、地動説への言及。", anecdote: "死の直前、意識が朦朧とする中で見舞いに来た友人に「さっき議論していた数学の難問の答えは何だったか」と尋ねた。" },
            { id: 11, name: "Ibn Sina", years: "980 - 1037", theory: "運動量に繋がる「傾性の概念」を提唱。空気抵抗がなければ運動は永遠に続くと見抜く（慣性の先駆）。", anecdote: "10代で全ての学問を修め、夜通し読書し疲れたらワインを飲んで頭をシャキッとさせていた超人。" },
            { id: 12, name: "Nicolaus Copernicus", years: "1473 - 1543", theory: "地動説（太陽中心説）を提唱し、数千年の天動説宇宙観にパラダイムシフトを起こす。", anecdote: "カトリック教会の司政官であり、宗教的摩擦を恐れて主著の出版は彼の死の当日までずれ込んだ。" },
            { id: 13, name: "William Gilbert", years: "1544 - 1603", theory: "地球自体が巨大な磁石であると提唱（地球磁気学の祖）。電気（electricity）という言葉を創出。", anecdote: "エリザベス1世の主治医。女王は彼の磁気研究を気に入り、研究費の助成金を個人的に与えていた。" },
            { id: 14, name: "Galileo Galilei", years: "1564 - 1642", theory: "落体の法則、慣性の法則の基礎、望遠鏡による天体観測（木星の衛星発見）、地動説の擁護。", anecdote: "ピサの斜塔から重さの違う球を落とした逸話や、宗教裁判で「それでも地球は動いている」と呟いたとされる伝説で有名。" },
            { id: 15, name: "Johannes Kepler", years: "1571 - 1630", theory: "ケプラーの法則（惑星の軌道は楕円であるなど）を発見し、天体運動を数学的に解明。", anecdote: "占星術師としても有名で、母親が魔女裁判にかけられた際は、自ら弁護に奔走して無罪を勝ち取った。" },
            { id: 16, name: "Isaac Beeckman", years: "1588 - 1637", theory: "物質論的な機械論的自然観の先駆。デカルトに数学と物理学の融合の重要性を説く。", anecdote: "日記にアイデアを書き殴るだけで出版に興味がなかったが、その日記が後に物理学史の重要史料となった。" },
            { id: 17, name: "Otto von Guericke", years: "1602 - 1686", theory: "真空ポンプの発明。真空の存在を証明し、大気圧の凄まじい力を視覚的に実証。", anecdote: "「マクデブルクの半球実験」で、金属球を合わせて真空にし、両側から16頭の馬に引っ張らせても外れないショーを行い大喝采を浴びた。" },
            { id: 18, name: "Evangelista Torricelli", years: "1608 - 1647", theory: "水銀気圧計の発明。「トリチェリの空白（真空）」を発見。大気の重さを証明。", anecdote: "ガリレオの最晩年の弟子。彼が発明した水銀気圧計は、大気が私たちを常に押し潰している事実を暴いた。" },
            { id: 19, name: "Blaise Pascal", years: "1623 - 1662", theory: "「パスカルの原理（密閉容器内の流体圧）」。大気圧の高度変化の実証、確率論の基礎。", anecdote: "「人間は考える葦である」の格言で有名。神童すぎて10代で計算機「パスカリーヌ」を開発。" },
            { id: 20, name: "Robert Boyle", years: "1627 - 1691", theory: "「ボイルの法則（気体の体積は圧力に反比例する）」。近代化学・実験物理の基礎を確立。", anecdote: "大富豪の伯爵家に生まれるが、生涯を独身で通し、実験室にこもって研究にすべての資産を注ぎ込んだ。" },
