<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOCK CARD GAME</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #cff;
  }

  /* =====================
     オープニング
  ===================== */
  #opening {
    position: fixed; inset: 0;
    background-image: url("img237italy.jpg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #opening::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 0;
  }
  #opening .title {
    position: relative; z-index: 1;
    color: #fff;
    font-size: clamp(28px, 6vw, 64px);
    letter-spacing: 0.15em;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0af, 0 0 40px #06f;
    margin-bottom: 20px;
    text-align: center;
  }
  #opening .subtitle {
    position: relative; z-index: 1;
    color: #cff;
    font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 0.3em;
    margin-bottom: 50px;
    text-shadow: 0 0 8px #0af;
  }
  .btn-area {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  .btn {
    min-width: 220px;
    padding: 12px 28px;
    font-size: clamp(14px, 2vw, 20px);
    letter-spacing: 0.2em;
    color: #e8ffff;
    background: linear-gradient(180deg, #0a2a3a 0%, #041018 100%);
    border: 2px solid #0ff;
    border-radius: 8px;
    cursor: pointer;
    text-shadow: 0 0 6px #0ff;
    box-shadow: 0 0 10px rgba(0,255,255,0.5), inset 0 0 12px rgba(0,255,255,0.2);
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: linear-gradient(180deg, #0f4a5a 0%, #062028 100%);
    box-shadow: 0 0 20px rgba(0,255,255,0.9), inset 0 0 18px rgba(0,255,255,0.4);
    transform: translateY(-2px);
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled {
    opacity: 0.35; cursor: not-allowed;
    box-shadow: none; transform: none;
  }

  /* 背景ビューア */
  #bgViewer {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: none; justify-content: center; align-items: center;
  }
  #bgViewer.active { display: flex; }
  #bgViewer img {
    width: 100%; height: 100%;
    object-fit: fill; display: block;
  }
  #bgViewer .close-viewer {
    position: absolute; top: 20px; right: 20px; z-index: 210;
    padding: 10px 24px;
    color: #fff;
    background: rgba(0,0,0,0.6);
    border: 2px solid #0ff;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.15em;
  }
  #bgViewer .close-viewer:hover { background: rgba(0,255,255,0.3); }

  /* =====================
     ゲーム画面
  ===================== */
  #game {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    background: radial-gradient(circle at 50% 0%, #0a1a2a 0%, #03060a 70%);
    z-index: 50;
    overflow: hidden;
  }
  #game.active { display: flex; }

  #topBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px;
    background: rgba(0,20,30,0.85);
    border-bottom: 1px solid #0ff;
    font-size: 14px;
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }
  #topBar .clock { color: #0ff; text-shadow: 0 0 6px #0ff; }
  #topBar .money { color: #ff0; text-shadow: 0 0 6px #ff0; }

  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #packArea {
    flex: 1.4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px;
    position: relative;
  }

  #packCardWrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #packCardWrap.active { display: flex; }

  /* 遊戯王風カード */
  .ygo-card {
    width: 260px;
    height: 380px;
    background: linear-gradient(160deg, #d4a24a 0%, #b07d2a 40%, #8a5f1c 100%);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 0 20px rgba(255,200,80,0.5), 0 0 40px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .ygo-card.space {
    background: linear-gradient(160deg, #4a6ad4 0%, #2a3fb0 40%, #1c288a 100%);
    box-shadow: 0 0 20px rgba(120,160,255,0.6), 0 0 40px rgba(0,0,0,0.8);
  }
  .ygo-card.ur {
    background: linear-gradient(160deg, #e0c060 0%, #c09020 30%, #8050a0 70%, #5030a0 100%);
    box-shadow: 0 0 30px rgba(255,220,100,0.9), 0 0 60px rgba(160,100,255,0.6);
  }
  .ygo-card.sr {
    background: linear-gradient(160deg, #b0a0e0 0%, #7050c0 40%, #4030a0 100%);
    box-shadow: 0 0 25px rgba(180,150,255,0.8), 0 0 50px rgba(0,0,0,0.8);
  }

  .ygo-name {
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 4px 8px;
    border-radius: 4px;
    text-align: center;
    letter-spacing: 0.05em;
    min-height: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .ygo-attr-mark {
    display: inline-block;
    width: 18px; height: 18px;
    line-height: 18px;
    text-align: center;
    border-radius: 50%;
    font-size: 11px;
    font-weight: bold;
  }
  .ygo-attr-mark.earth { background: #2a8a2a; color: #fff; }
  .ygo-attr-mark.space { background: #2a4ad0; color: #fff; }

  .ygo-art {
    flex: 1;
    margin: 6px 0;
    background: #0a0a12;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .ygo-art canvas {
    width: 100%; height: 100%;
    image-rendering: pixelated;
  }

  .ygo-stats {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .ygo-effect {
    font-size: 10px;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 4px 6px;
    border-radius: 4px;
    margin-top: 4px;
    min-height: 34px;
    line-height: 1.2;
  }

  .pack-controls {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin-top: 8px;
  }
  .pack-controls .btn { min-width: 90px; padding: 8px 14px; font-size: 12px; }

  #buyArea {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }

  #infoPanel {
    flex: 1;
    border-left: 1px solid #0ff;
    display: flex;
    flex-direction: column;
    background: rgba(0,10,20,0.9);
    overflow: hidden;
  }
  #infoPanel h3 {
    font-size: 13px;
    padding: 8px;
    letter-spacing: 0.15em;
    color: #0ff;
    border-bottom: 1px solid #0ff;
    text-shadow: 0 0 6px #0ff;
  }
  #sortSelect {
    margin: 6px 8px;
    padding: 4px;
    background: #041018;
    color: #cff;
    border: 1px solid #0ff;
    border-radius: 4px;
    font-size: 12px;
  }
  #infoList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 8px;
  }
  .info-item {
    padding: 5px 6px;
    font-size: 12px;
    border-bottom: 1px solid rgba(0,255,255,0.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #cff;
  }
  .info-item:hover { background: rgba(0,255,255,0.12); }

  #priceTable {
    border-top: 1px solid #0ff;
    max-height: 38%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #priceTable h3 {
    font-size: 12px;
    padding: 6px 8px;
    color: #ff0;
    border-bottom: 1px solid #ff0;
    letter-spacing: 0.1em;
    text-shadow: 0 0 6px #ff0;
  }
  #priceList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
    font-size: 11px;
  }
  .price-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    border-bottom: 1px dashed rgba(255,255,0,0.2);
    color: #ffd;
  }
  .price-row .up { color: #4f4; }
  .price-row .down { color: #f66; }

  /* モーダル */
  #modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 300;
  }
  #modal.active { display: flex; }
  #modalInner {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  #modalControls {
    display: flex; gap: 12px;
  }
  #modalControls .btn { min-width: 120px; }

  /* footer */
  #footer {
    flex-shrink: 0;
    height: 22px;
    background: rgba(0,0,0,0.9);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
  }
  #studyLink {
    display: none;
    color: #0a4a4a;
    text-decoration: none;
    letter-spacing: 0.1em;
  }
  #studyLink:hover { color: #0ff; text-shadow: 0 0 6px #0ff; }
  #studyLink.visible { display: inline; }
</style>
</head>
<body>

<!-- オープニング -->
<div id="opening">
  <div class="title">STOCK CARD GAME</div>
  <div class="subtitle">- DOMESTIC &amp; FOREIGN -</div>
  <div class="btn-area">
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn" id="viewBgBtn">背景画像を見る</button>
  </div>
</div>

<!-- 背景ビューア -->
<div id="bgViewer">
  <img src="img237italy.jpg" alt="背景画像">
  <button class="close-viewer" id="closeViewerBtn">CLOSE</button>
</div>

<!-- ゲーム -->
<div id="game">
  <div id="topBar">
    <div class="clock" id="clock">00:00:00</div>
    <div class="money" id="moneyDisplay">所持金：200円</div>
  </div>

  <div id="main">
    <div id="packArea">
      <div id="buyArea">
        <button class="btn" id="buyPackBtn">パックを買う（200円）</button>
        <div style="font-size:11px;color:#8ac;">1パック = 7枚</div>
      </div>

      <div id="packCardWrap">
        <div class="ygo-card" id="packCard">
          <div class="ygo-name" id="packName"></div>
          <div class="ygo-art"><canvas id="packCanvas" width="120" height="120"></canvas></div>
          <div class="ygo-stats">
            <span id="packAtk">ATK 0</span>
            <span id="packDef">DEF 0</span>
          </div>
          <div class="ygo-effect" id="packEffect"></div>
        </div>
        <div class="pack-controls">
          <button class="btn" id="prevBtn">PREV</button>
          <button class="btn" id="nextBtn">NEXT</button>
          <button class="btn" id="sellNowBtn">その場で売る</button>
          <button class="btn" id="endPackBtn">売らずに開封終了</button>
        </div>
      </div>
    </div>

    <div id="infoPanel">
      <h3>入手カード</h3>
      <select id="sortSelect">
        <option value="obtained">入手順</option>
        <option value="rarity">レア度順</option>
        <option value="atk">攻撃力が高い順</option>
        <option value="defLow">守備力が低い順</option>
        <option value="earth">国内株式順</option>
        <option value="space">外国株式順</option>
      </select>
      <div id="infoList"></div>

      <div id="priceTable">
        <h3>買取相場表</h3>
        <div id="priceList"></div>
      </div>
    </div>
  </div>

  <div id="footer">
    <a href="magazine.html" id="studyLink">magazine.html</a>
  </div>
</div>

<!-- モーダル -->
<div id="modal">
  <div id="modalInner">
    <div class="ygo-card" id="modalCard">
      <div class="ygo-name" id="modalName"></div>
      <div class="ygo-art"><canvas id="modalCanvas" width="120" height="120"></canvas></div>
      <div class="ygo-stats">
        <span id="modalAtk">ATK 0</span>
        <span id="modalDef">DEF 0</span>
      </div>
      <div class="ygo-effect" id="modalEffect"></div>
    </div>
    <div id="modalControls">
      <button class="btn" id="modalCloseBtn">CLOSE</button>
      <button class="btn" id="modalSellBtn">売る</button>
    </div>
  </div>
</div>

  /* ---------- スーパーレア 6銘柄（外国中心） ---------- */
  { name:"NVIDIA",             attr:"外", rarity:"SR", atk:100,def:90, effect:"外国株式なら攻撃3倍",       basePrice:280,stock:{type:"candle",color:"#76b900", accent:"#ccff66"}},
  { name:"Tesla",              attr:"外", rarity:"SR", atk:110,def:100,effect:"攻守を2倍",                  basePrice:300,stock:{type:"line", color:"#e82127", accent:"#ff8888"}},
  { name:"Microsoft",          attr:"外", rarity:"SR", atk:120,def:85, effect:"相手の攻撃力を半減",         basePrice:290,stock:{type:"bar",  color:"#00a4ef", accent:"#66ddff"}},
  { name:"Apple",              attr:"外", rarity:"SR", atk:85, def:130,effect:"守備力+60",                  basePrice:260,stock:{type:"pie",  color:"#a2aaad", accent:"#ffffff"}},
  { name:"Amazon",             attr:"外", rarity:"SR", atk:130,def:90, effect:"攻撃力+50",                  basePrice:310,stock:{type:"bar",  color:"#ff9900", accent:"#ffcc66"}},
  { name:"Accenture",          attr:"外", rarity:"SR", atk:115,def:105,effect:"1ターン攻撃4倍",             basePrice:300,stock:{type:"pie",  color:"#a100ff", accent:"#cc88ff"}},

  /* ---------- ウルトラレア 2銘柄（外国） ---------- */
  { name:"NVIDIA",             attr:"外", rarity:"UR", atk:200,def:180,effect:"攻守を入れ替えて3倍",        basePrice:1200,stock:{type:"candle",color:"#76b900", accent:"#ffffff"}},
  { name:"Microsoft",          attr:"外", rarity:"UR", atk:180,def:200,effect:"相手の効果を全て無効",        basePrice:1000,stock:{type:"bar",  color:"#00a4ef", accent:"#ffffff"}}
];

/* レア度順のランク */
function rarityRank(r) {
  return { N: 0, R: 1, SR: 2, UR: 3 }[r];
}

/* =========================================================
   カード名ごとの共有マーケット（唯一の相場）
========================================================= */
const MARKET = {};

CARD_MASTER.forEach(card => {
  MARKET[card.name] = {
    trend: Math.random() < 0.5 ? "up" : "down",
    basePrice: card.basePrice,
    maxPrice: card.basePrice * 2,
    minPrice: 0,
    currentPrice: card.basePrice
  };
});

/* =========================================================
   株式アイコン描画（ドット絵 + 図形学）
========================================================= */
function drawStock(canvas, stock, rarity, attr) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, attr === "外" ? "#0a1030" : "#101a10");
  bg.addColorStop(1, "#000");
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  const cx = W/2, cy = H/2;
  const s = W/120;

  const main = stock.color;
  const accent = stock.accent;
  const dark = "#111";

  ctx.save();
  ctx.translate(cx, cy);

  /* 背景グリッド */
  ctx.strokeStyle = "rgba(0,255,255,0.08)";
  ctx.lineWidth = 1;
  for (let i = -50; i <= 50; i += 20) {
    ctx.beginPath(); ctx.moveTo(i*s, -50*s); ctx.lineTo(i*s, 50*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-50*s, i*s); ctx.lineTo(50*s, i*s); ctx.stroke();
  }

  if (stock.type === "bar") {
    /* 棒グラフ */
    const bars = [0.35, 0.55, 0.45, 0.7, 0.6, 0.85, 0.75];
    bars.forEach((h, i) => {
      const x = -42*s + i * 13*s;
      const bh = h * 70*s;
      ctx.fillStyle = i === bars.length - 1 ? accent : main;
      ctx.fillRect(x, 35*s - bh, 9*s, bh);
    });
    /* トレンドライン */
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2*s;
    ctx.beginPath();
    bars.forEach((h, i) => {
      const x = -37.5*s + i * 13*s;
      const y = 35*s - h * 70*s - 6*s;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  } else if (stock.type === "line") {
    /* 折れ線グラフ */
    const pts = [0.2, 0.45, 0.3, 0.6, 0.5, 0.8, 0.65, 0.9];
    ctx.strokeStyle = main;
    ctx.lineWidth = 3*s;
    ctx.beginPath();
    pts.forEach((v, i) => {
      const x = -40*s + i * (80*s / (pts.length - 1));
      const y = 30*s - v * 60*s;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    /* ポイント */
    pts.forEach((v, i) => {
      const x = -40*s + i * (80*s / (pts.length - 1));
      const y = 30*s - v * 60*s;
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(x, y, 3*s, 0, Math.PI*2); ctx.fill();
    });
    /* エリア塗り */
    ctx.lineTo(40*s, 40*s);
    ctx.lineTo(-40*s, 40*s);
    ctx.closePath();
    ctx.fillStyle = main + "33";
    ctx.fill();
  } else if (stock.type === "candle") {
    /* ローソク足 */
    const candles = [
      {o:0.5, c:0.7, h:0.8, l:0.4},
      {o:0.7, c:0.6, h:0.75,l:0.5},
      {o:0.6, c:0.8, h:0.9, l:0.55},
      {o:0.8, c:0.7, h:0.85,l:0.65},
      {o:0.7, c:0.9, h:0.95,l:0.6},
      {o:0.9, c:0.85,h:0.95,l:0.75},
      {o:0.85,c:0.95,h:1.0, l:0.8},
    ];
    candles.forEach((c, i) => {
      const x = -38*s + i * 12*s;
      const isUp = c.c >= c.o;
      const top = 30*s - Math.max(c.o,c.c) * 60*s;
      const bot = 30*s - Math.min(c.o,c.c) * 60*s;
      const high = 30*s - c.h * 60*s;
      const low = 30*s - c.l * 60*s;
      /* ヒゲ */
      ctx.strokeStyle = isUp ? accent : main;
      ctx.lineWidth = 1.5*s;
      ctx.beginPath(); ctx.moveTo(x, high); ctx.lineTo(x, low); ctx.stroke();
      /* 実体 */
      ctx.fillStyle = isUp ? accent : main;
      ctx.fillRect(x - 4*s, top, 8*s, Math.max(bot - top, 2*s));
    });
  } else if (stock.type === "pie") {
    /* 円グラフ */
    const slices = [0.35, 0.25, 0.2, 0.15, 0.05];
    let start = -Math.PI/2;
    const colors = [main, accent, main+"aa", accent+"aa", "#666"];
    slices.forEach((v, i) => {
      const end = start + v * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0, 0, 40*s, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.fill();
      start = end;
    });
    /* 中央の穴 */
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(0, 0, 16*s, 0, Math.PI*2); ctx.fill();
    /* 中央のシンボル */
    ctx.fillStyle = accent;
    ctx.font = `${18*s}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 0);
  }

  ctx.restore();

  /* レアリティオーラ */
  if (rarity === "UR") {
    ctx.strokeStyle = "rgba(255,220,100,0.9)";
    ctx.lineWidth = 3;
    ctx.strokeRect(2,2,W-4,H-4);
  } else if (rarity === "SR") {
    ctx.strokeStyle = "rgba(180,150,255,0.7)";
    ctx.lineWidth = 2;
    ctx.strokeRect(2,2,W-4,H-4);
  } else if (rarity === "R") {
    ctx.strokeStyle = "rgba(120,200,255,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(2,2,W-4,H-4);
  }
}

/* =========================================================
   カードプール
========================================================= */
const NORMAL_POOL = CARD_MASTER.filter(c => c.rarity === "N");   // 30
const RARE_POOL   = CARD_MASTER.filter(c => c.rarity !== "N");   // 20

/* =========================================================
   ゲーム状態
========================================================= */
let money = 200;
let currentPack = [];
let currentIndex = 0;
let obtainedCards = [];
let sortMode = "obtained";
let packsBought = 0;
let startTime = Date.now();
let gameStarted = false;

const opening = document.getElementById("opening");
const startBtn = document.getElementById("startBtn");
const viewBgBtn = document.getElementById("viewBgBtn");
const bgViewer = document.getElementById("bgViewer");
const closeViewerBtn = document.getElementById("closeViewerBtn");
const game = document.getElementById("game");

const clockEl = document.getElementById("clock");
const moneyDisplay = document.getElementById("moneyDisplay");
const buyPackBtn = document.getElementById("buyPackBtn");
const buyArea = document.getElementById("buyArea");
const packCardWrap = document.getElementById("packCardWrap");

const packCard = document.getElementById("packCard");
const packName = document.getElementById("packName");
const packCanvas = document.getElementById("packCanvas");
const packAtk = document.getElementById("packAtk");
const packDef = document.getElementById("packDef");
const packEffect = document.getElementById("packEffect");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const sellNowBtn = document.getElementById("sellNowBtn");
const endPackBtn = document.getElementById("endPackBtn");

const infoList = document.getElementById("infoList");
const sortSelect = document.getElementById("sortSelect");
const priceList = document.getElementById("priceList");
const studyLink = document.getElementById("studyLink");

const modal = document.getElementById("modal");
const modalCard = document.getElementById("modalCard");
const modalName = document.getElementById("modalName");
const modalCanvas = document.getElementById("modalCanvas");
const modalAtk = document.getElementById("modalAtk");
const modalDef = document.getElementById("modalDef");
const modalEffect = document.getElementById("modalEffect");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const modalSellBtn = document.getElementById("modalSellBtn");

/* =========================================================
   時計・相場
========================================================= */
function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const ss = String(now.getSeconds()).padStart(2,"0");
  clockEl.textContent = `${hh}:${mm}:${ss}`;
}

function updateAllPrices() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);

  Object.values(MARKET).forEach(m => {
    if (m.trend === "up") {
      m.currentPrice = Math.min(m.maxPrice, m.basePrice + elapsed);
    } else {
      m.currentPrice = Math.max(m.minPrice, m.basePrice - elapsed);
    }
  });
}

function getPrice(cardName) {
  return MARKET[cardName] ? MARKET[cardName].currentPrice : 0;
}

function renderPriceTable() {
  priceList.innerHTML = CARD_MASTER.map(card => {
    const m = MARKET[card.name];
    const cls = m.trend === "up" ? "up" : "down";
    const arrow = m.trend === "up" ? "▲" : "▼";
    return `<div class="price-row">
      <span>${card.name}</span>
      <span class="${cls}">${arrow} ${m.currentPrice}円</span>
    </div>`;
  }).join("");
}

/* =========================================================
   情報パネル
========================================================= */
function sortCards(mode) {
  const cards = [...obtainedCards];
  switch (mode) {
    case "rarity":  return cards.sort((a,b) => rarityRank(b.rarity) - rarityRank(a.rarity));
    case "atk":     return cards.sort((a,b) => b.atk - a.atk);
    case "defLow":  return cards.sort((a,b) => a.def - b.def);
    case "earth":   return cards.sort((a,b) => (a.attr === "国" ? -1 : 1));
    case "space":   return cards.sort((a,b) => (a.attr === "外" ? -1 : 1));
    default:        return cards.sort((a,b) => a.obtainedAt - b.obtainedAt);
  }
}

function renderInfoList() {
  const cards = sortCards(sortMode);
  infoList.innerHTML = cards.map((card, i) => {
    const mark = card.attr === "国"
      ? `<span class="ygo-attr-mark earth">国</span>`
      : `<span class="ygo-attr-mark space">外</span>`;
    return `<div class="info-item" data-id="${card.uid}">
      <span>${i+1}.</span>${mark}<span>${card.name}</span>
    </div>`;
  }).join("");

  infoList.querySelectorAll(".info-item").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.id;
      const card = obtainedCards.find(c => c.uid === id);
      if (card) openModal(card);
    });
  });
}

/* =========================================================
   カード表示
========================================================= */
function renderCardToUI(card, cardEl, nameEl, canvasEl, atkEl, defEl, effectEl) {
  cardEl.classList.remove("space", "ur", "sr");
  if (card.attr === "外") cardEl.classList.add("space");
  if (card.rarity === "UR") cardEl.classList.add("ur");
  if (card.rarity === "SR") cardEl.classList.add("sr");

  const mark = card.attr === "国"
    ? `<span class="ygo-attr-mark earth">国</span>`
    : `<span class="ygo-attr-mark space">外</span>`;

  nameEl.innerHTML = `${mark}<span>${card.name}</span>`;
  drawStock(canvasEl, card.stock, card.rarity, card.attr);
  atkEl.textContent = `ATK ${card.atk}`;
  defEl.textContent = `DEF ${card.def}`;
  effectEl.textContent = card.effect;
}

function showPackCard() {
  const card = currentPack[currentIndex];
  if (!card) return;
  renderCardToUI(card, packCard, packName, packCanvas, packAtk, packDef, packEffect);
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === currentPack.length - 1;
}

/* =========================================================
   パック
========================================================= */
function makeInstance(master) {
  return {
    uid: "U" + Math.random().toString(36).slice(2,10),
    name: master.name,
    attr: master.attr,
    rarity: master.rarity,
    atk: master.atk,
    def: master.def,
    effect: master.effect,
    stock: master.stock,
    obtainedAt: 0
  };
}

function buyPack() {
  if (money < 200) return;
  money -= 200;
  packsBought++;
  updateMoneyDisplay();

  currentPack = [];
  currentIndex = 0;

  for (let i = 0; i < 6; i++) {
    const master = NORMAL_POOL[Math.floor(Math.random() * NORMAL_POOL.length)];
    currentPack.push(makeInstance(master));
  }
  const masterRare = RARE_POOL[Math.floor(Math.random() * RARE_POOL.length)];
  currentPack.push(makeInstance(masterRare));

  buyArea.style.display = "none";
  packCardWrap.classList.add("active");
  showPackCard();
}

function nextCard() { if (currentIndex < currentPack.length - 1) { currentIndex++; showPackCard(); } }
function prevCard() { if (currentIndex > 0) { currentIndex--; showPackCard(); } }

/* =========================================================
   売却
========================================================= */
function sellCurrentCard() {
  const card = currentPack[currentIndex];
  if (!card) return;

  updateAllPrices();
  money += getPrice(card.name);
  updateMoneyDisplay();
  currentPack.splice(currentIndex, 1);

  if (currentPack.length === 0) {
    endPack();
  } else {
    currentIndex = Math.min(currentIndex, currentPack.length - 1);
    showPackCard();
  }
}

function endPack() {
  currentPack.forEach(card => {
    card.obtainedAt = obtainedCards.length;
    obtainedCards.push(card);
  });
  currentPack = [];
  currentIndex = 0;
  packCardWrap.classList.remove("active");
  buyArea.style.display = "flex";
  renderInfoList();
}

/* =========================================================
   モーダル
========================================================= */
let modalCardData = null;

function openModal(card) {
  modalCardData = card;
  renderCardToUI(card, modalCard, modalName, modalCanvas, modalAtk, modalDef, modalEffect);
  modal.classList.add("active");
}
function closeModal() {
  modal.classList.remove("active");
  modalCardData = null;
}

function sellFromModal() {
  if (!modalCardData) return;

  updateAllPrices();
  money += getPrice(modalCardData.name);
  updateMoneyDisplay();
  obtainedCards = obtainedCards.filter(c => c.uid !== modalCardData.uid);
  renderInfoList();
  closeModal();
}

function updateMoneyDisplay() {
  moneyDisplay.textContent = `所持金：${money}円`;
}

function checkStudyLink() {
  if (packsBought >= 3) studyLink.classList.add("visible");
}

/* =========================================================
   イベント
========================================================= */
startBtn.addEventListener("click", () => {
  opening.style.display = "none";
  game.classList.add("active");
  gameStarted = true;
  startTime = Date.now();
  updateMoneyDisplay();
  renderInfoList();
  renderPriceTable();
});

viewBgBtn.addEventListener("click", () => bgViewer.classList.add("active"));
closeViewerBtn.addEventListener("click", () => bgViewer.classList.remove("active"));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && bgViewer.classList.contains("active")) {
    bgViewer.classList.remove("active");
  }
});

buyPackBtn.addEventListener("click", () => {
  buyPack();
  checkStudyLink();
});

prevBtn.addEventListener("click", prevCard);
nextBtn.addEventListener("click", nextCard);
sellNowBtn.addEventListener("click", sellCurrentCard);
endPackBtn.addEventListener("click", endPack);

sortSelect.addEventListener("change", () => {
  sortMode = sortSelect.value;
  renderInfoList();
});

modalCloseBtn.addEventListener("click", closeModal);
modalSellBtn.addEventListener("click", sellFromModal);

/* =========================================================
   ループ
========================================================= */
setInterval(() => {
  updateClock();
  if (gameStarted) {
    updateAllPrices();
    renderPriceTable();
  }
}, 1000);

updateClock();
</script>

</body>
