<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOCK CARD GAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Inter:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0e0b09;
    background-image: radial-gradient(circle at 20% 30%, #2a241f 0%, #0e0b09 90%);
    font-family: 'Shippori Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
    color: #e8e0d5;
  }

  /* =====================
     オープニング
  ===================== */
  #opening {
    position: fixed; inset: 0;
    background-image: url("img237italy.jpg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #opening::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(14,11,9,0.55); z-index: 0;
  }
  #opening .title {
    position: relative; z-index: 1;
    font-family: 'Cinzel', serif;
    color: #d4af37;
    font-size: clamp(28px, 6vw, 64px);
    letter-spacing: 0.2em;
    text-shadow: 0 0 20px rgba(212,175,55,0.5), 0 2px 4px #000;
    margin-bottom: 20px;
    text-align: center;
  }
  #opening .subtitle {
    position: relative; z-index: 1;
    color: #b8a58b;
    font-family: 'Inter', sans-serif;
    font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 0.35em;
    margin-bottom: 50px;
  }
  .btn-area {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 16px; align-items: center;
  }

  /* 共通ボタン */
  .btn {
    min-width: 220px;
    padding: 12px 28px;
    font-family: 'Cinzel', serif;
    font-size: clamp(13px, 1.8vw, 17px);
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #e8d5b8;
    background: linear-gradient(180deg, #2a2018 0%, #140e08 100%);
    border: 1.5px solid #b89b70;
    border-radius: 40px;
    cursor: pointer;
    text-shadow: 0 1px 2px #000;
    box-shadow: 0 4px 0 #0a0603, 0 6px 12px rgba(0,0,0,0.6);
    transition: all 0.12s ease;
    transform: translateY(-2px);
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, #3a2e22 0%, #1e1610 100%);
    color: #ffeac2;
    box-shadow: 0 2px 0 #0a0603, 0 8px 16px rgba(0,0,0,0.7);
    transform: translateY(0);
  }
  .btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a0603, 0 4px 8px rgba(0,0,0,0.6);
  }
  .btn:disabled {
    opacity: 0.3; cursor: not-allowed;
    box-shadow: 0 2px 0 #0a0603; transform: translateY(0);
  }

  /* 背景ビューア */
  #bgViewer {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: none; justify-content: center; align-items: center;
  }
  #bgViewer.active { display: flex; }
  #bgViewer img {
    width: 100%; height: 100%;
    object-fit: fill; display: block;
  }
  #bgViewer .close-viewer {
    position: absolute; top: 20px; right: 20px; z-index: 210;
    padding: 10px 24px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.2em;
    color: #e8d5b8;
    background: rgba(0,0,0,0.7);
    border: 1.5px solid #b89b70;
    border-radius: 40px;
    cursor: pointer;
  }
  #bgViewer .close-viewer:hover { background: rgba(184,155,112,0.25); color: #ffeac2; }

  /* ゲーム画面 */
  #game {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    background: radial-gradient(circle at 50% 0%, #241d17 0%, #0e0b09 70%);
    z-index: 50;
    overflow: hidden;
  }
  #game.active { display: flex; }

  #topBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px;
    background: linear-gradient(180deg, rgba(26,21,18,0.95) 0%, rgba(14,11,9,0.95) 100%);
    border-bottom: 1px solid rgba(212,175,55,0.35);
    font-size: 14px;
    letter-spacing: 0.12em;
    flex-shrink: 0;
  }
  #topBar .clock {
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    color: #d4af37;
    text-shadow: 0 0 10px rgba(212,175,55,0.4);
  }
  #topBar .money {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: #ffeac2;
    text-shadow: 0 0 8px rgba(212,175,55,0.4);
  }

  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #packArea {
    flex: 1.4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px;
    position: relative;
  }

  #packCardWrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #packCardWrap.active { display: flex; }

  /* =========================================================
     カード骨格
  ========================================================= */
  .ygo-card {
    width: 260px;
    height: 380px;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.3s ease;
  }

  .ygo-card.paper {
    background:
      repeating-linear-gradient(88deg, rgba(160,140,120,0.06) 0px, rgba(160,140,120,0.06) 1px, transparent 1px, transparent 7px),
      radial-gradient(ellipse at 25% 20%, rgba(255,255,255,0.7) 0%, transparent 55%),
      linear-gradient(160deg, #f0e8da 0%, #d8cec0 100%);
    box-shadow:
      inset 0 0 20px rgba(255,255,255,0.5),
      inset -4px 0 12px rgba(180,160,140,0.4),
      0 15px 30px rgba(0,0,0,0.6);
    border: 1px solid rgba(140,120,90,0.4);
    color: #3a2e22;
  }
  .ygo-card.velvet {
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 5px),
      radial-gradient(ellipse at 30% 20%, rgba(80,140,200,0.2) 0%, transparent 55%),
      linear-gradient(160deg, #142438 0%, #060c14 100%);
    box-shadow:
      inset 0 0 25px rgba(100,160,220,0.12),
      inset -6px 0 18px rgba(0,0,0,0.85),
      0 20px 35px rgba(0,0,0,0.85);
    border: 1px solid rgba(100,160,220,0.35);
    color: #b8d0e8;
  }
  .ygo-card.silver {
    background:
      linear-gradient(115deg, transparent 30%, rgba(200,210,230,0.12) 48%, rgba(255,255,255,0.18) 50%, rgba(200,210,230,0.12) 52%, transparent 70%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 2px, transparent 2px, transparent 5px),
      linear-gradient(160deg, #18181a 0%, #08080a 100%);
    box-shadow:
      inset 0 0 25px rgba(180,190,210,0.12),
      inset -6px 0 18px rgba(0,0,0,0.9),
      0 20px 35px rgba(0,0,0,0.9);
    border: 1px solid rgba(180,190,220,0.35);
    color: #c8d0e0;
  }
  .ygo-card.marble {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(120,130,160,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(100,110,140,0.12) 0%, transparent 50%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 6px),
      linear-gradient(160deg, #14141e 0%, #060608 100%);
    box-shadow:
      inset 0 0 30px rgba(120,130,160,0.12),
      inset -6px 0 18px rgba(0,0,0,0.9),
      0 20px 35px rgba(0,0,0,0.9);
    border: 1.5px solid rgba(160,170,200,0.4);
    color: #b0b8d0;
  }
  .ygo-card.gold {
    background:
      linear-gradient(115deg, transparent 30%, rgba(212,175,55,0.18) 48%, rgba(255,240,200,0.28) 50%, rgba(212,175,55,0.18) 52%, transparent 70%),
      radial-gradient(ellipse at 30% 20%, rgba(212,175,55,0.12) 0%, transparent 50%),
      repeating-linear-gradient(0deg, rgba(212,175,55,0.03) 0px, rgba(212,175,55,0.03) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, #1a1613 0%, #060504 100%);
    box-shadow:
      inset 0 0 30px rgba(212,175,55,0.15),
      inset -8px 0 20px rgba(0,0,0,0.9),
      0 0 30px rgba(212,175,55,0.3),
      0 20px 40px rgba(0,0,0,0.9);
    border: 1.5px solid rgba(212,175,55,0.6);
    color: #d4af37;
  }

  /* カード内要素 */
  .ygo-name {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 8px;
    border-radius: 4px;
    text-align: center;
    letter-spacing: 0.08em;
    min-height: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
  }
  .paper .ygo-name   { background: rgba(90,70,48,0.15); color: #4a3a2a; border: 1px solid rgba(140,120,90,0.3); }
  .velvet .ygo-name  { background: rgba(10,26,42,0.6);   color: #c8ddf0; border: 1px solid rgba(100,160,220,0.25); }
  .silver .ygo-name  { background: rgba(0,0,0,0.55);     color: #c8d0e0; border: 1px solid rgba(180,190,220,0.25); }
  .marble .ygo-name  { background: rgba(0,0,0,0.55);     color: #b0b8d0; border: 1px solid rgba(160,170,200,0.3); }
  .gold .ygo-name    { background: rgba(0,0,0,0.55);     color: #d4af37; border: 1px solid rgba(212,175,55,0.4); }

  .ygo-attr-mark {
    display: inline-block;
    width: 18px; height: 18px;
    line-height: 18px;
    text-align: center;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Shippori Mincho', serif;
    flex-shrink: 0;
  }
  .ygo-attr-mark.earth { background: #2a8a2a; color: #fff; border: 1px solid rgba(255,255,255,0.3); }
  .ygo-attr-mark.space { background: #2a4ad0; color: #fff; border: 1px solid rgba(255,255,255,0.3); }

  .ygo-art {
    flex: 1;
    margin: 6px 0;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    z-index: 2;
  }
  .paper .ygo-art   { background: #fdfaf5; border: 1.5px solid rgba(140,120,90,0.4); }
  .velvet .ygo-art  { background: #030810; border: 1.5px solid rgba(100,160,220,0.35); }
  .silver .ygo-art  { background: #08080a; border: 1.5px solid rgba(180,190,220,0.3); }
  .marble .ygo-art  { background: #060608; border: 1.5px solid rgba(160,170,200,0.35); }
  .gold .ygo-art    { background: #060504; border: 1.5px solid rgba(212,175,55,0.4); }

  .ygo-art canvas {
    width: 100%; height: 100%;
    image-rendering: pixelated;
  }

  .ygo-stats {
    display: flex;
    justify-content: space-between;
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    position: relative;
    z-index: 2;
  }
  .paper .ygo-stats   { background: rgba(90,70,48,0.12); color: #4a3a2a; border: 1px solid rgba(140,120,90,0.25); }
  .velvet .ygo-stats  { background: rgba(10,26,42,0.6);   color: #b8d0e8; border: 1px solid rgba(100,160,220,0.2); }
  .silver .ygo-stats  { background: rgba(0,0,0,0.55);     color: #c8d0e0; border: 1px solid rgba(180,190,220,0.2); }
  .marble .ygo-stats  { background: rgba(0,0,0,0.55);     color: #b0b8d0; border: 1px solid rgba(160,170,200,0.25); }
  .gold .ygo-stats    { background: rgba(0,0,0,0.55);     color: #d4af37; border: 1px solid rgba(212,175,55,0.35); }

  .ygo-effect {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px;
    padding: 5px 7px;
    border-radius: 4px;
    margin-top: 5px;
    min-height: 36px;
    line-height: 1.35;
    position: relative;
    z-index: 2;
  }
  .paper .ygo-effect   { background: rgba(255,255,255,0.4); color: #3a2e22; border: 1px solid rgba(180,160,130,0.25); }
  .velvet .ygo-effect  { background: rgba(0,0,0,0.5);       color: #c8ddf0; border: 1px solid rgba(100,160,220,0.2); }
  .silver .ygo-effect  { background: rgba(0,0,0,0.55);      color: #c8d0e0; border: 1px solid rgba(180,190,220,0.15); }
  .marble .ygo-effect  { background: rgba(0,0,0,0.55);      color: #b0b8d0; border: 1px solid rgba(160,170,200,0.2); }
  .gold .ygo-effect    { background: rgba(0,0,0,0.6);       color: #d8c8a8; border: 1px solid rgba(212,175,55,0.3); }

  .type-tag { font-weight: 700; letter-spacing: 0.05em; }
  .type-tag.link { color: #6ee7a8; }
  .type-tag.xrp  { color: #ffb86b; }
  .paper .type-tag.link { color: #2f7a4a; }
  .paper .type-tag.xrp  { color: #b86a1f; }

  /* 外周リング */
  .ygo-card.velvet::before,
  .ygo-card.silver::before,
  .ygo-card.marble::before,
  .ygo-card.gold::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 7px;
    pointer-events: none;
    z-index: 1;
  }
  .velvet::before { border: 1px solid rgba(100,160,220,0.2); }
  .silver::before { border: 1px solid rgba(180,190,220,0.18); }
  .marble::before { border: 1px solid rgba(160,170,200,0.22); }
  .gold::before   { border: 1px solid rgba(212,175,55,0.35); box-shadow: inset 0 0 15px rgba(212,175,55,0.15); }

  .pack-controls {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin-top: 8px;
  }
  .pack-controls .btn {
    min-width: 88px; padding: 8px 12px;
    font-size: 10px; letter-spacing: 0.15em;
    border-radius: 30px;
  }

  #buyArea { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #buyArea .buy-note {
    font-family: 'Inter', sans-serif;
    font-size: 11px; color: #8a7a6a; letter-spacing: 0.15em;
  }

  /* 情報パネル */
  #infoPanel {
    flex: 1;
    border-left: 1px solid rgba(212,175,55,0.3);
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(20,16,12,0.95) 0%, rgba(10,8,6,0.95) 100%);
    overflow: hidden;
  }
  #infoPanel h3 {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    padding: 10px 12px;
    letter-spacing: 0.22em;
    color: #d4af37;
    border-bottom: 1px solid rgba(212,175,55,0.3);
    background: linear-gradient(90deg, rgba(212,175,55,0.08), transparent);
    text-shadow: 0 0 8px rgba(212,175,55,0.3);
  }
  #sortSelect {
    margin: 8px 10px;
    padding: 5px 6px;
    background: #1a1512;
    color: #e8d5b8;
    border: 1px solid rgba(184,155,112,0.5);
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
  }
  #infoList { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .info-item {
    padding: 6px 8px;
    font-size: 12px;
    border-bottom: 1px solid rgba(184,155,112,0.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #e8e0d5;
    font-family: 'Shippori Mincho', serif;
    transition: background 0.15s ease;
  }
  .info-item:hover { background: rgba(212,175,55,0.08); }

  #priceTable {
    border-top: 1px solid rgba(212,175,55,0.3);
    max-height: 38%;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #priceTable h3 {
    font-size: 11px; padding: 8px 12px; color: #d4af37;
    border-bottom: 1px solid rgba(212,175,55,0.3);
    background: linear-gradient(90deg, rgba(212,175,55,0.08), transparent);
    font-family: 'Cinzel', serif; letter-spacing: 0.2em;
  }
  #priceList {
    flex: 1; overflow-y: auto; padding: 4px 10px;
    font-size: 11px; font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .price-row {
    display: flex; justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px dashed rgba(212,175,55,0.15);
    color: #d8c8a8;
  }
  .price-row .up { color: #6ee7a8; }
  .price-row .down { color: #ff8a8a; }

  /* モーダル */
  #modal {
    position: fixed; inset: 0;
    background: rgba(5,4,3,0.9);
    display: none; justify-content: center; align-items: center;
    z-index: 300; backdrop-filter: blur(4px);
  }
  #modal.active { display: flex; }
  #modalInner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #modalControls { display: flex; gap: 12px; }
  #modalControls .btn { min-width: 120px; }

  /* フッター */
  #footer {
    flex-shrink: 0; height: 24px;
    background: rgba(5,4,3,0.95);
    display: flex; justify-content: flex-end; align-items: center;
    padding: 0 14px; font-size: 11px;
    border-top: 1px solid rgba(212,175,55,0.15);
  }
  #studyLink {
    display: none; color: #4a3e30; text-decoration: none;
    letter-spacing: 0.15em; font-family: 'Inter', sans-serif; font-size: 10px;
  }
  #studyLink:hover { color: #d4af37; text-shadow: 0 0 6px rgba(212,175,55,0.5); }
  #studyLink.visible { display: inline; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
  ::-webkit-scrollbar-thumb { background: rgba(184,155,112,0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,55,0.5); }
</style>
</head>
<body>

<!-- オープニング -->
<div id="opening">
  <div class="title">STOCK CARD GAME</div>
  <div class="subtitle">DOMESTIC &amp; FOREIGN · NISA EDITION</div>
  <div class="btn-area">
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn" id="viewBgBtn">背景画像を見る</button>
  </div>
</div>

<!-- 背景ビューア -->
<div id="bgViewer">
  <img src="img237italy.jpg" alt="背景画像">
  <button class="close-viewer" id="closeViewerBtn">CLOSE</button>
</div>

<!-- ゲーム -->
<div id="game">
  <div id="topBar">
    <div class="clock" id="clock">00:00:00</div>
    <div class="money" id="moneyDisplay">所持金：200円</div>
  </div>

  <div id="main">
    <div id="packArea">
      <div id="buyArea">
        <button class="btn" id="buyPackBtn">パックを買う（200円）</button>
        <div class="buy-note">1 PACK = 7 CARDS</div>
      </div>

      <div id="packCardWrap">
        <div class="ygo-card paper" id="packCard">
          <div class="ygo-name" id="packName"></div>
          <div class="ygo-art"><canvas id="packCanvas" width="160" height="160"></canvas></div>
          <div class="ygo-stats">
            <span id="packAtk">ATK 0</span>
            <span id="packDef">DEF 0</span>
          </div>
          <div class="ygo-effect" id="packEffect"></div>
        </div>
        <div class="pack-controls">
          <button class="btn" id="prevBtn">PREV</button>
          <button class="btn" id="nextBtn">NEXT</button>
          <button class="btn" id="sellNowBtn">その場で売る</button>
          <button class="btn" id="endPackBtn">売らずに開封終了</button>
        </div>
      </div>
    </div>

    <div id="infoPanel">
      <h3>入手カード</h3>
      <select id="sortSelect">
        <option value="obtained">入手順</option>
        <option value="rarity">レア度順</option>
        <option value="atk">攻撃力が高い順</option>
        <option value="defLow">守備力が低い順</option>
        <option value="earth">国内株式順</option>
        <option value="space">外国株式順</option>
        <option value="link">LINK型順</option>
        <option value="xrp">XRP型順</option>
      </select>
      <div id="infoList"></div>

      <div id="priceTable">
        <h3>買取相場表</h3>
        <div id="priceList"></div>
      </div>
    </div>
  </div>

  <div id="footer">
    <a href="magazine.html" id="studyLink">magazine.html</a>
  </div>
</div>

<!-- モーダル -->
<div id="modal">
  <div id="modalInner">

/* =========================================================
   エンブレム描画
   - シンボルロゴ：図形のみ
   - 文字ロゴ：fillTextで文字を絵の中に描く
========================================================= */
function drawEmblem(canvas, emblem, rarity, attr) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  if (rarity === "UR") {
    bg.addColorStop(0, "#1a1408"); bg.addColorStop(1, "#050402");
  } else if (rarity === "SR") {
    bg.addColorStop(0, "#14141e"); bg.addColorStop(1, "#060608");
  } else if (rarity === "R") {
    bg.addColorStop(0, "#18181a"); bg.addColorStop(1, "#08080a");
  } else if (attr === "外") {
    bg.addColorStop(0, "#0a1430"); bg.addColorStop(1, "#030610");
  } else {
    bg.addColorStop(0, "#f0e8da"); bg.addColorStop(1, "#d8cec0");
  }
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // グリッド
  ctx.strokeStyle = (rarity === "N" && attr === "国")
    ? "rgba(140,120,90,0.12)" : "rgba(212,175,55,0.06)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const cx = W / 2;
  const cy = H / 2 - 6;
  const s = W / 160;

  ctx.save();
  ctx.translate(cx, cy);

  const badgeR = 54 * s;
  const badgeGrad = ctx.createRadialGradient(-12*s, -12*s, 4*s, 0, 0, badgeR);
  if (rarity === "UR") {
    badgeGrad.addColorStop(0, "#3a2a10"); badgeGrad.addColorStop(1, "#1a1005");
  } else if (rarity === "SR") {
    badgeGrad.addColorStop(0, "#2a2a3a"); badgeGrad.addColorStop(1, "#101018");
  } else if (rarity === "R") {
    badgeGrad.addColorStop(0, "#1a1a20"); badgeGrad.addColorStop(1, "#08080c");
  } else if (attr === "外") {
    badgeGrad.addColorStop(0, "#0a1a3a"); badgeGrad.addColorStop(1, "#03060f");
  } else {
    badgeGrad.addColorStop(0, "#f5ede0"); badgeGrad.addColorStop(1, "#d8cec0");
  }
  ctx.fillStyle = badgeGrad;
  ctx.beginPath();
  ctx.arc(0, 0, badgeR, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineWidth = 2 * s;
  if (rarity === "UR") ctx.strokeStyle = "rgba(212,175,55,0.9)";
  else if (rarity === "SR") ctx.strokeStyle = "rgba(180,190,220,0.7)";
  else if (rarity === "R") ctx.strokeStyle = "rgba(180,190,220,0.6)";
  else if (attr === "外") ctx.strokeStyle = "rgba(100,160,220,0.6)";
  else ctx.strokeStyle = "rgba(140,120,90,0.5)";
  ctx.beginPath();
  ctx.arc(0, 0, badgeR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = (rarity === "N" && attr === "国")
    ? "rgba(140,120,90,0.25)" : "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1 * s;
  ctx.beginPath();
  ctx.arc(0, 0, badgeR - 5 * s, 0, Math.PI * 2);
  ctx.stroke();

  // モチーフ
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, badgeR - 6 * s, 0, Math.PI * 2);
  ctx.clip();
  drawEmblemMotif(ctx, emblem, s, rarity, attr);
  ctx.restore();
  ctx.restore();

  // レアリティ外周
  if (rarity === "UR") {
    ctx.strokeStyle = "rgba(212,175,55,0.85)";
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, W - 4, H - 4);
  } else if (rarity === "SR") {
    ctx.strokeStyle = "rgba(180,190,220,0.6)";
    ctx.lineWidth = 2;
    ctx.strokeRect(2, 2, W - 4, H - 4);
  } else if (rarity === "R") {
    ctx.strokeStyle = "rgba(180,190,220,0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(2, 2, W - 4, H - 4);
  }
}

/* 文字をバッジ下に描く補助 */
function drawLabel(ctx, text, s, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `700 ${14*s}px 'Cinzel', 'Inter', sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 0, 38*s);
  ctx.restore();
}

/* =========================================================
   エンブレムモチーフ（50銘柄）
========================================================= */
function drawEmblemMotif(ctx, emblem, s, rarity, attr) {
  const reset = () => { ctx.shadowBlur = 0; };
  const glow = (c, b) => { ctx.shadowColor = c; ctx.shadowBlur = (b || 6) * s; };
  const white = "#ffffff";

  switch (emblem) {

    /* ===== 外国株式・主要銘柄 ===== */
    case "nvidia": {
      // 緑の目のシンボル＋NVIDIA文字
      ctx.fillStyle = "#76b900"; glow("#76b900");
      ctx.beginPath();
      ctx.moveTo(0,-24*s); ctx.lineTo(20*s,-12*s); ctx.lineTo(20*s,12*s);
      ctx.lineTo(0,24*s); ctx.lineTo(-20*s,12*s); ctx.lineTo(-20*s,-12*s);
      ctx.closePath(); ctx.fill(); reset();
      ctx.fillStyle = "#0a2a10";
      ctx.beginPath(); ctx.ellipse(0,0,14*s,8*s,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#c8ff66";
      ctx.beginPath(); ctx.ellipse(0,0,8*s,4*s,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#0a2a10";
      ctx.beginPath(); ctx.arc(0,0,2.5*s,0,Math.PI*2); ctx.fill();
      drawLabel(ctx, "NVIDIA", s, "#76b900");
      break;
    }

    case "tesla": {
      // 赤T字＋TESLA文字
      ctx.fillStyle = "#e82127"; glow("#e82127");
      ctx.fillRect(-18*s,-22*s,36*s,6*s);
      ctx.beginPath();
      ctx.moveTo(-6*s,-16*s); ctx.lineTo(6*s,-16*s);
      ctx.lineTo(4*s,22*s); ctx.lineTo(-4*s,22*s);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-18*s,-22*s); ctx.quadraticCurveTo(-20*s,-4*s,-9*s,-6*s);
      ctx.lineTo(-9*s,-16*s); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(18*s,-22*s); ctx.quadraticCurveTo(20*s,-4*s,9*s,-6*s);
      ctx.lineTo(9*s,-16*s); ctx.closePath(); ctx.fill();
      reset();
      drawLabel(ctx, "TESLA", s, "#e82127");
      break;
    }

    case "microsoft": {
      // 4色窓＋Microsoft文字
      const q = 16*s;
      const colors = ["#f25022","#7fba00","#00a4ef","#ffb900"];
      const pos = [[-q,-q-6*s],[0,-q-6*s],[-q,-6*s],[0,-6*s]];
      pos.forEach((p,i) => {
        ctx.fillStyle = colors[i]; glow(colors[i],5);
        ctx.fillRect(p[0], p[1], q-2*s, q-2*s);
      });
      reset();
      drawLabel(ctx, "Microsoft", s, "#00a4ef");
      break;
    }

    case "apple": {
      // リンゴ＋かじり跡＋葉＋Apple文字
      ctx.fillStyle = "#e8e8e8"; glow("#ffffff");
      ctx.beginPath(); ctx.arc(-7*s,0,15*s,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(7*s,0,15*s,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,8*s,17*s,0,Math.PI); ctx.fill();
      reset();
      ctx.fillStyle = "#0a0a12";
      ctx.beginPath(); ctx.arc(17*s,-4*s,7*s,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#7fba00";
      ctx.beginPath(); ctx.ellipse(5*s,-22*s,8*s,4*s,-0.6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 2*s;
      ctx.beginPath(); ctx.moveTo(0,-18*s); ctx.quadraticCurveTo(-2*s,-22*s,4*s,-24*s); ctx.stroke();
      drawLabel(ctx, "Apple", s, "#e8e8e8");
      break;
    }

    case "amazon": {
      // スマイル矢印＋a＋amazon文字
      ctx.strokeStyle = "#ff9900"; ctx.lineWidth = 4*s; ctx.lineCap = "round";
      glow("#ff9900");
      ctx.beginPath(); ctx.moveTo(-20*s,8*s); ctx.quadraticCurveTo(0,20*s,20*s,8*s); ctx.stroke();
      ctx.fillStyle = "#ff9900";
      ctx.beginPath();
      ctx.moveTo(20*s,8*s); ctx.lineTo(24*s,2*s); ctx.lineTo(16*s,6*s);
      ctx.closePath(); ctx.fill();
      reset();
      ctx.strokeStyle = "#ffcc66"; ctx.lineWidth = 3*s;
      ctx.beginPath(); ctx.arc(0,-12*s,10*s,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10*s,-22*s); ctx.lineTo(10*s,-2*s); ctx.stroke();
      drawLabel(ctx, "amazon", s, "#ff9900");
      break;
    }

    case "cognizant": {
      // 青C＋Cognizant文字
      ctx.strokeStyle = "#0033a0"; ctx.lineWidth = 8*s; ctx.lineCap = "round";
      glow("#3366ff");
      ctx.beginPath(); ctx.arc(0,0,20*s,Math.PI*0.25,Math.PI*1.75); ctx.stroke();
      reset();
      ctx.fillStyle = "#6688ff";
      ctx.beginPath(); ctx.arc(0,0,5*s,0,Math.PI*2); ctx.fill();
      drawLabel(ctx, "Cognizant", s, "#3366ff");
      break;
    }

    case "ibm": {
      // 横縞＋IBM文字
      ctx.fillStyle = "#1f70c1"; glow("#1f70c1");
      for (let i = 0; i < 7; i++) {
        ctx.fillRect(-24*s,-18*s+i*5.5*s,48*s,3*s);
      }
      reset();
      drawLabel(ctx, "IBM", s, "#1f70c1");
      break;
    }

    case "accenture": {
      // 紫＞＋accenture文字
      ctx.fillStyle = "#a100ff"; glow("#a100ff");
      ctx.beginPath();
      ctx.moveTo(-16*s,-20*s); ctx.lineTo(16*s,0); ctx.lineTo(-16*s,20*s);
      ctx.lineTo(-8*s,20*s); ctx.lineTo(24*s,0); ctx.lineTo(-8*s,-20*s);
      ctx.closePath(); ctx.fill();
      reset();
      drawLabel(ctx, "accenture", s, "#a100ff");
      break;
    }

    case "epam": {
      // 4ドット＋EPAM文字
      const dots = [[-12*s,-12*s],[12*s,-12*s],[-12*s,12*s],[12*s,12*s]];
      const cols = ["#00b4d8","#00b4d8","#00b4d8","#66ffdd"];
      dots.forEach((p,i) => {
        ctx.fillStyle = cols[i]; glow(cols[i],5);
        ctx.beginPath(); ctx.arc(p[0],p[1],8*s,0,Math.PI*2); ctx.fill();
      });
      reset();
      drawLabel(ctx, "EPAM", s, "#00b4d8");
      break;
    }

    case "datadog": {
      // 犬＋Datadog文字
      ctx.fillStyle = "#632ca6"; glow("#aa88ff");
      ctx.beginPath(); ctx.arc(0,-2*s,18*s,0,Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-14*s,-16*s); ctx.lineTo(-22*s,-28*s); ctx.lineTo(-6*s,-22*s);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();

        ctx.fillRect(i*7*s - 1.5*s, -8*s, 3*s, 12*s);

      ctx.strokeStyle = "#66ff88"; ctx.lineWidth = 2*s;
      ctx.beginPath(); ctx.moveTo(0,6*s); ctx.lineTo(0,18*s); ctx.stroke();
      ctx.fillStyle = "#66ff88";

      drawLabel(ctx, "MICRONICS", s, "#009944");
      break;
    }

    default: {
      ctx.strokeStyle = (rarity === "N" && attr === "国") ? "#8a6a3a" : "#d4af37";
      ctx.lineWidth = 3*s; ctx.lineCap = "round";
      glow(ctx.strokeStyle);
      ctx.beginPath();
      const pts = [0.2,0.5,0.35,0.7,0.55,0.85];
      pts.forEach((v,i) => {
        const x = -22*s + i*(44*s/(pts.length-1));
        const y = 14*s - v*28*s;
        i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      });
      ctx.stroke();
      reset();
      break;
    }
  }
}

function updateClock() {
  const now = new Date();
  clockEl.textContent = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
}
function updateAllPrices() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  Object.values(MARKET).forEach(m => {
    if (m.trend === "up") m.currentPrice = Math.min(m.maxPrice, m.basePrice + elapsed);
    else m.currentPrice = Math.max(m.minPrice, m.basePrice - elapsed);
  });
}
function getPrice(name) { return MARKET[name] ? MARKET[name].currentPrice : 0; }
function renderPriceTable() {
  priceList.innerHTML = CARD_MASTER.map(card => {
    const m = MARKET[card.name];
    const cls = m.trend === "up" ? "up" : "down";
    const arrow = m.trend === "up" ? "▲" : "▼";
    return `<div class="price-row"><span>${card.name}</span><span class="${cls}">${arrow} ${m.currentPrice}円</span></div>`;
  }).join("");
}

/* 情報パネル */
function sortCards(mode) {
  const cards = [...obtainedCards];
  switch (mode) {
    case "rarity":  return cards.sort((a,b) => rarityRank(b.rarity) - rarityRank(a.rarity));
    case "atk":     return cards.sort((a,b) => b.atk - a.atk);
    case "defLow":  return cards.sort((a,b) => a.def - b.def);
    case "earth":   return cards.sort((a,b) => (a.attr === "国" ? -1 : 1));
    case "space":   return cards.sort((a,b) => (a.attr === "外" ? -1 : 1));
    case "link":    return cards.sort((a,b) => (a.type === "link" ? -1 : 1));
    case "xrp":     return cards.sort((a,b) => (a.type === "xrp" ? -1 : 1));
    default:        return cards.sort((a,b) => a.obtainedAt - b.obtainedAt);
  }
}
function renderInfoList() {
  const cards = sortCards(sortMode);
  infoList.innerHTML = cards.map((card, i) => {
    const mark = card.attr === "国"
      ? `<span class="ygo-attr-mark earth">国</span>`
      : `<span class="ygo-attr-mark space">外</span>`;
    const tc = typeClass(card.type);
    return `<div class="info-item" data-id="${card.uid}">
      <span>${i+1}.</span>${mark}
      <span class="type-tag ${tc}">${card.type === "link" ? "L" : "X"}</span>
      <span>${card.name}</span>
    </div>`;
  }).join("");
  infoList.querySelectorAll(".info-item").forEach(el => {
    el.addEventListener("click", () => {
      const card = obtainedCards.find(c => c.uid === el.dataset.id);
      if (card) openModal(card);
    });
  });
}

/* カード表示 */
function renderCardToUI(card, cardEl, nameEl, canvasEl, atkEl, defEl, effectEl) {
  cardEl.className = "ygo-card " + rarityClass(card);
  const mark = card.attr === "国"
    ? `<span class="ygo-attr-mark earth">国</span>`
    : `<span class="ygo-attr-mark space">外</span>`;
  const tc = typeClass(card.type);
  nameEl.innerHTML = `${mark}<span>${card.name}</span><span style="font-size:9px;opacity:0.6;letter-spacing:0.05em;">${card.code}</span>`;
  drawEmblem(canvasEl, card.emblem, card.rarity, card.attr);
  atkEl.textContent = `ATK ${card.atk}`;
  defEl.textContent = `DEF ${card.def}`;
  effectEl.innerHTML = `<span class="type-tag ${tc}">${typeLabel(card.type)}</span> ${card.effect}`;
}
function showPackCard() {
  const card = currentPack[currentIndex];
  if (!card) return;
  renderCardToUI(card, packCard, packName, packCanvas, packAtk, packDef, packEffect);
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === currentPack.length - 1;
}

/* パック */
function makeInstance(m) {
  return {
    uid: "U" + Math.random().toString(36).slice(2,10),
    name: m.name, code: m.code, attr: m.attr, rarity: m.rarity,
    type: m.type, atk: m.atk, def: m.def, effect: m.effect,
    emblem: m.emblem, obtainedAt: 0
  };
}
function buyPack() {
  if (money < 200) return;
  money -= 200; packsBought++; updateMoneyDisplay();
  currentPack = []; currentIndex = 0;
  for (let i = 0; i < 6; i++) {
    currentPack.push(makeInstance(NORMAL_POOL[Math.floor(Math.random() * NORMAL_POOL.length)]));
  }
  currentPack.push(makeInstance(RARE_POOL[Math.floor(Math.random() * RARE_POOL.length)]));
  buyArea.style.display = "none";
  packCardWrap.classList.add("active");
  showPackCard();
}
function nextCard() { if (currentIndex < currentPack.length - 1) { currentIndex++; showPackCard(); } }
function prevCard() { if (currentIndex > 0) { currentIndex--; showPackCard(); } }

/* 売却 */
function sellCurrentCard() {
  const card = currentPack[currentIndex];
  if (!card) return;
  updateAllPrices();
  money += getPrice(card.name); updateMoneyDisplay();
  currentPack.splice(currentIndex, 1);
  if (currentPack.length === 0) endPack();
  else { currentIndex = Math.min(currentIndex, currentPack.length - 1); showPackCard(); }
}
function endPack() {
  currentPack.forEach(card => {
    card.obtainedAt = obtainedCards.length;
    obtainedCards.push(card);
  });
  currentPack = []; currentIndex = 0;
  packCardWrap.classList.remove("active");
  buyArea.style.display = "flex";
  renderInfoList();
}

/* モーダル */
let modalCardData = null;
function openModal(card) {
  modalCardData = card;
  renderCardToUI(card, modalCard, modalName, modalCanvas, modalAtk, modalDef, modalEffect);
  modal.classList.add("active");
}
function closeModal() { modal.classList.remove("active"); modalCardData = null; }
function sellFromModal() {
  if (!modalCardData) return;
  updateAllPrices();
  money += getPrice(modalCardData.name); updateMoneyDisplay();
  obtainedCards = obtainedCards.filter(c => c.uid !== modalCardData.uid);
  renderInfoList(); closeModal();
}
function updateMoneyDisplay() { moneyDisplay.textContent = `所持金：${money}円`; }
function checkStudyLink() { if (packsBought >= 3) studyLink.classList.add("visible"); }

/* イベント */
startBtn.addEventListener("click", () => {
  opening.style.display = "none";
  game.classList.add("active");
  gameStarted = true; startTime = Date.now();
  updateMoneyDisplay(); renderInfoList(); renderPriceTable();
});
viewBgBtn.addEventListener("click", () => bgViewer.classList.add("active"));
closeViewerBtn.addEventListener("click", () => bgViewer.classList.remove("active"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && bgViewer.classList.contains("active")) bgViewer.classList.remove("active");
});
buyPackBtn.addEventListener("click", () => { buyPack(); checkStudyLink(); });
prevBtn.addEventListener("click", prevCard);
nextBtn.addEventListener("click", nextCard);
sellNowBtn.addEventListener("click", sellCurrentCard);
endPackBtn.addEventListener("click", endPack);
sortSelect.addEventListener("change", () => { sortMode = sortSelect.value; renderInfoList(); });
modalCloseBtn.addEventListener("click", closeModal);
modalSellBtn.addEventListener("click", sellFromModal);

setInterval(() => {
  updateClock();
  if (gameStarted) { updateAllPrices(); renderPriceTable(); }
}, 1000);
updateClock();
</script>

</body>
</html>
