<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI証券 ポートフォリオ・琳派</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap');

  :root {
    --kin: #c9a84c;         /* 金 */
    --kin-light: #e8d5a3;
    --kin-deep: #8a6a28;
    --shu: #b13a2e;         /* 朱 */
    --shu-light: #d46a5a;
    --ai: #1b2a4a;          /* 藍 */
    --ai-light: #3a4a70;
    --sumi: #1a1614;        /* 墨 */
    --washi: #f5efe3;       /* 和紙 */
    --matcha: #5a7a4a;      /* 抹茶 */
    --fuji: #7a6a9a;        /* 藤 */
    --sakura: #d98a9a;      /* 桜 */
    --kurenai: #8a1a2e;     /* 紅 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Shippori Mincho', 'Zen Kaku Gothic New', serif;
    background: #0e0a06;
    color: var(--washi);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 金屏風の背景 */
  .gold-screen {
    position: fixed;
    inset: 0;
    background:
      linear-gradient(135deg, #1a1208 0%, #2a1e10 25%, #1a1208 50%, #2a1e10 75%, #1a1208 100%);
    z-index: 0;
  }

  .gold-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(201,168,76,0.15) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(201,168,76,0.12) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 50%, rgba(177,58,46,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  /* 金箔の粒々 */
  .gold-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 15%, rgba(232,213,163,0.15) 0%, transparent 1.5%),
      radial-gradient(circle at 30% 80%, rgba(232,213,163,0.12) 0%, transparent 1%),
      radial-gradient(circle at 70% 20%, rgba(232,213,163,0.1) 0%, transparent 1.2%),
      radial-gradient(circle at 90% 60%, rgba(232,213,163,0.13) 0%, transparent 0.8%),
      radial-gradient(circle at 50% 45%, rgba(232,213,163,0.08) 0%, transparent 1%),
      radial-gradient(circle at 15% 55%, rgba(232,213,163,0.1) 0%, transparent 0.9%),
      radial-gradient(circle at 85% 85%, rgba(232,213,163,0.11) 0%, transparent 1.1%);
    pointer-events: none;
  }

  /* 額縁（金） */
  .frame {
    position: fixed;
    inset: 12px;
    border: 3px solid var(--kin);
    box-shadow:
      inset 0 0 0 1px var(--kin-deep),
      0 0 0 1px var(--sumi),
      0 0 60px rgba(201,168,76,0.25);
    pointer-events: none;
    z-index: 5;
    opacity: 0.9;
  }
  .frame::before {
    content: '❦';
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    color: var(--kin);
    font-size: 1.5rem;
    background: #1a1208;
    padding: 0 16px;
  }
  .frame::after {
    content: '❦';
    position: absolute;
    bottom: -18px; left: 50%;
    transform: translateX(-50%);
    color: var(--kin);
    font-size: 1.5rem;
    background: #1a1208;
    padding: 0 16px;
  }

  /* 四隅の花 */
  .corner-flower {
    position: fixed;
    z-index: 6;
    pointer-events: none;
    opacity: 0.7;
  }
  .corner-flower.tl { top: 15px; left: 15px; }
  .corner-flower.tr { top: 15px; right: 15px; }
  .corner-flower.bl { bottom: 15px; left: 15px; }
  .corner-flower.br { bottom: 15px; right: 15px; }

  /* 流水（尾形光琳の燕子花図風） */
  .ryusui {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 300px;
    z-index: 1;
    pointer-events: none;
    opacity: 0.35;
  }

  .ryusui svg { width: 100%; height: 100%; }

  /* 花々 */
  .hana {
    position: fixed;
    z-index: 2;
    pointer-events: none;
    opacity: 0.5;
    font-size: 2.5rem;
  }

  .container {
    position: relative;
    z-index: 10;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 30px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 45px;
    position: relative;
  }

  /* 家紋風の円 */
  .kamon {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    position: relative;
  }
  .kamon svg { width: 100%; height: 100%; }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(1.8rem, 4.5vw, 2.8rem);
    font-weight: 600;
    letter-spacing: 0.25em;
    color: var(--kin-light);
    text-shadow:
      0 0 30px rgba(201,168,76,0.6),
      0 0 60px rgba(201,168,76,0.3),
      2px 2px 0 var(--shu);
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 0.95rem;
    letter-spacing: 0.4em;
    color: var(--kin);
    opacity: 0.85;
    font-weight: 400;
  }

  .world-note {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 24px;
    border: 1px solid var(--shu);
    background: rgba(177,58,46,0.15);
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    color: var(--shu-light);
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 22px 0;
    color: var(--kin);
    font-size: 1.2rem;
  }
  .divider::before, .divider::after {
    content: '';
    height: 1px;
    width: 100px;
    background: linear-gradient(to right, transparent, var(--kin), var(--shu));
  }
  .divider::after { background: linear-gradient(to left, transparent, var(--kin), var(--shu)); }

  /* 凡例 */
  .legend {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-bottom: 40px;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--kin-light);
    opacity: 0.95;
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--kin);
  }
  .dot.fund { background: var(--matcha); }
  .dot.stock { background: var(--shu); }
  .dot.bond { background: var(--fuji); }

  /* グリッド */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 28px;
  }

  /* カード（金屏風の小屏風風） */
  .card {
    background:
      linear-gradient(160deg, rgba(26,18,8,0.95), rgba(14,10,6,0.98));
    border: 2px solid rgba(201,168,76,0.5);
    border-radius: 2px;
    padding: 36px 24px 24px;
    position: relative;
    transition: all 0.4s ease;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.6s ease forwards;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.6),
      0 4px 20px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(177,58,46,0.05) 0%, transparent 40%);
    pointer-events: none;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover {
    border-color: var(--kin);
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.5),
      0 0 40px rgba(201,168,76,0.35),
      0 4px 24px rgba(0,0,0,0.6);
    transform: translateY(-3px);
  }

  /* 上部の飾り線 */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 3px;
    background: linear-gradient(to right, transparent, var(--shu), var(--kin), var(--shu), transparent);
    z-index: 1;
  }

  .card-ornament {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    color: var(--kin);
    font-size: 1.2rem;
    background: #0e0a06;
    padding: 0 14px;
    letter-spacing: 6px;
    z-index: 2;
  }

  .card-header {
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }

  .persona-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--kin-light);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    text-shadow: 0 0 10px rgba(201,168,76,0.4);
  }

  .persona-desc {
    font-size: 0.78rem;
    color: var(--kin);
    opacity: 0.7;
    font-style: italic;
    letter-spacing: 0.05em;
  }

  .total {
    text-align: center;
    font-size: 0.85rem;
    color: var(--matcha);
    margin: 14px 0;
    padding: 8px 0;
    border-top: 1px solid rgba(201,168,76,0.25);
    border-bottom: 1px solid rgba(201,168,76,0.25);
    letter-spacing: 0.15em;
    font-weight: 500;
    position: relative;
    z-index: 1;
  }

  .coin-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    position: relative;
    z-index: 1;
  }

  .coin-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
  }

  .coin-symbol {
    width: 78px;
    font-weight: 600;
    color: var(--washi);
    font-family: 'Shippori Mincho', serif;
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .coin-bar-wrap {
    flex: 1;
    height: 18px;
    background: rgba(245,239,227,0.06);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }

  .coin-bar {
    height: 100%;
    border-radius: 1px;
    transition: width 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative;
  }

  .coin-bar.fund {
    background: linear-gradient(90deg, rgba(90,122,74,0.5), var(--matcha));
    border-right: 1px solid #9aba8a;
  }
  .coin-bar.stock {
    background: linear-gradient(90deg, rgba(177,58,46,0.5), var(--shu-light));
    border-right: 1px solid var(--shu-light);
  }
  .coin-bar.bond {
    background: linear-gradient(90deg, rgba(122,106,154,0.5), var(--fuji));
    border-right: 1px solid #a89ac0;
  }

  .coin-amount {
    width: 78px;
    text-align: right;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.72rem;
    color: var(--kin-light);
  }

  .coin-pct {
    width: 42px;
    text-align: right;
    font-size: 0.68rem;
    color: var(--kin);
    opacity: 0.8;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }

  .badge {
    font-size: 0.55rem;
    padding: 1px 4px;
    border-radius: 1px;
    letter-spacing: 0.02em;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    line-height: 1.4;
  }
  .badge.fund {
    background: rgba(90,122,74,0.3);
    color: #a8c898;
    border: 1px solid rgba(90,122,74,0.5);
  }
  .badge.stock {
    background: rgba(177,58,46,0.25);
    color: var(--shu-light);
    border: 1px solid rgba(177,58,46,0.45);
  }
  .badge.bond {
    background: rgba(122,106,154,0.3);
    color: #b8a8d8;
    border: 1px solid rgba(122,106,154,0.5);
  }

  footer {
    text-align: center;
    margin-top: 60px;
    font-size: 0.75rem;
    color: var(--kin);
    opacity: 0.6;
    letter-spacing: 0.2em;
    line-height: 1.8;
    position: relative;
    z-index: 10;
  }

  .footer-note {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 20px;
    border: 1px solid rgba(177,58,46,0.5);
    background: rgba(177,58,46,0.1);
    font-size: 0.7rem;
    color: var(--shu-light);
  }

  @media (max-width: 600px) {
    .container { padding: 40px 16px 60px; }
    .grid { grid-template-columns: 1fr; }
    .frame { inset: 6px; }
    .coin-symbol { width: 62px; font-size: 0.68rem; }
    .coin-amount { width: 68px; font-size: 0.68rem; }
    .coin-pct { width: 36px; font-size: 0.62rem; }
    .kamon { width: 75px; height: 75px; }
    .ryusui { height: 180px; }
    .hana { font-size: 1.5rem; }
  }
</style>
</head>
<body>

// ============================================================
// データ定義：オルカンとS&P500が存在しない世界線

const ASSETS = [
  // BTC枠 → 日経225インデックス（日本全体）
  { symbol: '日経225',    name: '日経225インデックス投信',  type: 'fund'  },

// ============================================================
// ポートフォリオ計算
// ============================================================

const TOTAL_BUDGET = 50000;

function buildPortfolio(persona) {
  const weights = persona.weights;
  const active = ASSETS.filter(a => (weights[a.symbol] || 0) > 0);

  const minTotal = active.length * 3000;
  const budget = Math.max(TOTAL_BUDGET, minTotal);

  const totalWeight = active.reduce((s, a) => s + weights[a.symbol], 0);

  let allocs = active.map(a => ({
    ...a,
    weight: weights[a.symbol],
    amount: Math.round((weights[a.symbol] / totalWeight) * budget / 100) * 100
  }));

  allocs.forEach(a => { if (a.amount < 3000) a.amount = 3000; });

  let sum = allocs.reduce((s, a) => s + a.amount, 0);
  if (sum > 0) {
    const scale = budget / sum;
    allocs.forEach(a => {
      a.amount = Math.round(a.amount * scale / 100) * 100;
      if (a.amount < 3000) a.amount = 3000;
    });
  }

  const finalTotal = allocs.reduce((s, a) => s + a.amount, 0);
  const maxAmount = Math.max(...allocs.map(a => a.amount));

  return { allocs, total: finalTotal, maxAmount };
}

  card.appendChild(totalEl);

  const list = document.createElement('div');
  list.className = 'coin-list';

  const sorted = [...allocs].sort((a, b) => b.amount - a.amount);

  sorted.forEach(asset => {
    const pct = ((asset.amount / total) * 100).toFixed(1);
    const barWidth = maxAmount > 0 ? (asset.amount / maxAmount) * 100 : 0;
    const typeClass = asset.type;
    const badgeText = asset.type === 'fund' ? '投' : asset.type === 'stock' ? '株' : '債';
    const badgeClass = asset.type;

    const row = document.createElement('div');
    row.className = 'coin-row';
    row.innerHTML = `
      <div class="coin-symbol">${asset.symbol}<span class="badge ${badgeClass}">${badgeText}</span></div>
      <div class="coin-bar-wrap">
        <div class="coin-bar ${typeClass}" style="width:0%" data-width="${barWidth}%"></div>
      </div>
      <div class="coin-amount">¥${asset.amount.toLocaleString()}</div>
      <div class="coin-pct">${pct}%</div>
    `;
    list.appendChild(row);
  });

  card.appendChild(list);
  grid.appendChild(card);
});
