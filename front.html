<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ブラウザメモ帳</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 300px; box-sizing: border-box; }
    </style>
</head>
<body>
<div class="container">
    <textarea id="notepad" placeholder="文字を入力..."></textarea>
</div>
<script>
    const notepad = document.getElementById('notepad');
    // 前回データを読み込み
    window.onload = () => notepad.value = localStorage.getItem('notes') || '';
    // 入力ごとに自動保存
    notepad.addEventListener('input', () => localStorage.setItem('notes', notepad.value));
</script>
</body>
</html>
