<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アインシュタイン数式クイズ (Lv.1 - Lv.50)</title>
    <!-- 数式を綺麗に表示するためのKaTeXライブラリ -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script defer src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        .level-badge {
            background-color: #e74c3c;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .formula-display {
            font-size: 28px;
            margin: 25px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            min-height: 50px;
        }
        .question-text { font-size: 18px; margin-bottom: 20px; font-weight: bold; }
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #3498db;
            background-color: white;
            color: #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        button:hover { background-color: #3498db; color: white; }
        .result-message { font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 25px; }
        .correct { color: #2ecc71; }
        .incorrect { color: #e74c3c; }
        .hide { display: none; }
        .score-screen { font-size: 20px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- クイズ画面 -->
    <div id="quiz-screen">
        <h1>アインシュタイン数式マスター</h1>
        <div id="level-badge" class="level-badge">レベル 1 / 50</div>
        <div id="question-text" class="question-text">読み込み中...</div>
        <div id="formula-display" class="formula-display"></div>
        <div id="options" class="options-container"></div>
        <div id="result-message" class="result-message"></div>
    </div>

    <!-- 結果画面 -->
    <div id="end-screen" class="hide score-screen">
        <h2>🎉 全問クリア！ 🎉</h2>
        <p>あなたのアインシュタイン・レベルは最高値に達しました！</p>
        <p>物理学の天才です！</p>
        <button onclick="restartQuiz()">もう一度挑戦する</button>
    </div>
</div>

<script>
// クイズの基礎データ（10種類のテーマをベースに難易度を50段階に展開）
const baseQuestions = [
    { formula: "E = mc^2", target: "c", desc: "特殊相対性理論の質量とエネルギーの等価性。cが表すものは？", answer: "光速度", dummy: ["宇宙速度", "重力定数", "プランク定数"] },
    { formula: "R_{\\mu\\nu} - \\frac{1}{2}R g_{\\mu\\nu} + \\Lambda g_{\\mu\\nu} = \\frac{8\\pi G}{c^4} T_{\\mu\\nu}", target: "\\Lambda", desc: "アインシュタイン方程式。Λ（ラムダ）が表すものは？", answer: "宇宙定数", dummy: ["重力子数", "時空歪み係数", "ブラックホール半径"] },
    { formula: "E = h\\nu", target: "h", desc: "光電効果の式。hが表す定数は？", answer: "プランク定数", dummy: ["ボルツマン定数", "アボガドロ数", "万有引力定数"] },
    { formula: "t' = \\frac{t}{\\sqrt{1 - \\frac{v^2}{c^2}}}", target: "t'", desc: "時間の遅れの式。速度vが光速cに近づくと、動いている時計の時間t'はどうなる？", answer: "遅くなる（引き延ばされる）", dummy: ["速くなる", "逆行する", "完全に停止して動かなくなる"] },
    { formula: "S = k \\log W", target: "k", desc: "ボルツマンの原理（アインシュタインも多用）。kが表すものは？", answer: "ボルツマン定数", dummy: ["光速度", "熱伝導率", "シュテファン定数"] }
];

let currentLevel = 1;
const maxLevel = 50;

function initQuiz() {
    if (currentLevel > maxLevel) {
        document.getElementById('quiz-screen').classList.add('hide');
        document.getElementById('end-screen').classList.remove('hide');
        return;
    }

    document.getElementById('level-badge').innerText = `レベル ${currentLevel} / ${maxLevel}`;
    document.getElementById('result-message').innerText = "";

    // レベルに応じて問題を動的に生成・難化させるロジック
    const base = baseQuestions[(currentLevel - 1) % baseQuestions.length];
    let questionText = base.desc;
    let formulaText = base.formula;
    
    // レベルが上がると問題文のヒントが減る・マニアックな選択肢になる
    if (currentLevel > 15) {
        questionText = questionText.replace("特殊相対性理論の", "").replace("アインシュタイン方程式。", "");
    }
    if (currentLevel > 30) {
        questionText += "（※上級者向け：より厳密な定義を選べ）";
    }

    document.getElementById('question-text').innerText = questionText;
    
    // 数式のレンダリング (KaTeX)
    const formulaDiv = document.getElementById('formula-display');
    try {
        katex.render(formulaText, formulaDiv, { throwOnError: false });
    } catch (err) {
        formulaDiv.innerText = formulaText;
    }

    // 選択肢のシャッフル生成
    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = "";

    // ダミーの難易度をレベルに応じて少し変える
    let currentDummy = [...base.dummy];
    if (currentLevel > 25) {
        currentDummy = currentDummy.map(d => d + "（補正値）" ); // レベルが上がると紛らわしくなる例
    }

    const choices = [base.answer, ...currentDummy];
    choices.sort(() => Math.random() - 0.5);

    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.innerText = choice;
        btn.onclick = () => checkAnswer(choice, base.answer);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(selected, correct) {
    const msgDiv = document.getElementById('result-message');
    if (selected === correct || selected.startsWith(correct)) {
        msgDiv.className = "result-message correct";
        msgDiv.innerText = "⭕ 正解！次のレベルへ進みます...";
        currentLevel++;
        setTimeout(initQuiz, 1500);
    } else {
        msgDiv.className = "result-message incorrect";
        msgDiv.innerText = "❌ 不正解！レベル1からやり直しです！";
        currentLevel = 1;
        setTimeout(initQuiz, 2000);
    }
}

function restartQuiz() {
    currentLevel = 1;
    document.getElementById('quiz-screen').classList.remove('hide');
    document.getElementById('end-screen').classList.add('hide');
    initQuiz();
}

// 起動時にクイズを開始
window.onload = initQuiz;
</script>

</body>
</html>
