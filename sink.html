<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周期表ピース運び・沈む順</title>
<style>
  :root{
    --bg-overlay: rgba(0,0,0,0.45);
    --panel-bg: rgba(20,20,30,0.92);
    --panel-border: #4a4a6a;
    --text: #eaeaf0;
    --accent: #7fd1ff;
    --dish: #3a3a4a;
    --dish-inner: #2a2a38;
    --shadow: 0 8px 24px rgba(0,0,0,0.5);
    --water: #1a3f5c;
    --water-light: #2a6f9c;
    --brick: #b85c3a;
  }

  body.theme-simple{
    --bg-overlay: rgba(0,0,0,0.45);
    --panel-bg: rgba(20,20,30,0.92);
    --panel-border: #4a4a6a;
    --text: #eaeaf0;
    --accent: #7fd1ff;
    --water: #1a3f5c;
    --water-light: #2a6f9c;
    --brick: #b85c3a;
  }

  body.theme-seabreeze{
    --bg-overlay: rgba(10,40,60,0.5);
    --panel-bg: rgba(18,50,70,0.94);
    --panel-border: #4a9ec0;
    --text: #e0f2ff;
    --accent: #7ee8fa;
    --water: #0d3b4f;
    --water-light: #1e6f8c;
    --brick: #c77a4a;
  }

  body.theme-mediterranean{
    --bg-overlay: rgba(30,20,10,0.5);
    --panel-bg: rgba(60,40,25,0.94);
    --panel-border: #d4a373;
    --text: #fefae0;
    --accent: #e9c46a;
    --water: #2a5a7a;
    --water-light: #3a8aaa;
    --brick: #d68c5a;
  }

  body.theme-ukiyoe{
    --bg-overlay: rgba(20,15,25,0.6);
    --panel-bg: rgba(35,25,40,0.94);
    --panel-border: #b07a9a;
    --text: #f5e6f0;
    --accent: #e8a0b0;
    --water: #1a2a4a;
    --water-light: #2a4a7a;
    --brick: #c07050;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html,body{
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--text);
    background: #000;
  }

  #bg{
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  #bg-overlay{
    position: fixed;
    inset: 0;
    background: var(--bg-overlay);
    z-index: 1;
    transition: background 0.4s;
  }

  .screen{
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .screen.active{ display: flex; }

  #opening .title{
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    margin-bottom: 12px;
    text-align: center;
  }
  #opening .subtitle{
    font-size: clamp(14px, 2.5vw, 20px);
    opacity: 0.85;
    margin-bottom: 40px;
    text-align: center;
    line-height: 1.7;
  }

  .btn{
    display: inline-block;
    padding: 14px 36px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    box-shadow: var(--shadow);
    user-select: none;
  }
  .btn:hover{
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    border-color: var(--accent);
  }
  .btn:active{ transform: scale(0.97); }

  #settings .panel{
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 20px;
    padding: 28px 32px;
    max-width: 520px;
    width: 100%;
    box-shadow: var(--shadow);
  }
  #settings h2{
    font-size: 24px;
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .theme-list{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .theme-option{
    padding: 14px 10px;
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.15s;
    background: rgba(255,255,255,0.04);
  }
  .theme-option:hover{ border-color: var(--accent); }
  .theme-option.selected{
    border-color: var(--accent);
    background: rgba(127,209,255,0.15);
    box-shadow: 0 0 0 2px var(--accent) inset;
  }
  .settings-actions{
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .settings-actions .btn{ flex: 1; padding: 12px 16px; font-size: 16px; }

  #game{
    justify-content: flex-start;
    padding: 0;
  }

  #game-header{
    width: 100%;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    z-index: 20;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 8px;
  }
  #game-header .info{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  #game-header .info span{ color: var(--accent); }
  #game-header .cat-legend{
    font-size: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    width: 100%;
    justify-content: center;
    margin-top: 4px;
  }
  .cat-legend-item{
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    font-weight: 700;
  }

  #play-area{
    position: relative;
    flex: 1;
    width: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, transparent 0%, var(--water) 60%, var(--water-light) 100%);
  }

  .piece{
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: grab;
    user-select: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4), inset 3px 3px 6px rgba(255,255,255,0.25), 0 4px 10px rgba(0,0,0,0.5);
    transition: transform 0.1s;
    z-index: 5;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .piece:active{ cursor: grabbing; }
  .piece.dragging{
    z-index: 999;
    transform: scale(1.2);
    box-shadow: 0 0 0 3px var(--accent), 0 8px 24px rgba(0,0,0,0.7);
  }

  /* レンガ型（重い元素用） */
  .piece.brick{
    border-radius: 4px;
    width: 54px;
    height: 32px;
    font-size: 10px;
    background: var(--brick) !important;
    background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 4px, transparent 4px, transparent 8px);
    border: 2px solid rgba(0,0,0,0.3);
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255,255,255,0.15), 0 4px 8px rgba(0,0,0,0.5);
  }
  .piece.brick .dot{ display: none; }

  .piece .dot{
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    opacity: 0.4;
    background-image: radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 1px);
    background-size: 6px 6px;
    pointer-events: none;
  }

  /* 水面の波紋 */
  .ripple{
    position: absolute;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    pointer-events: none;
    animation: rippleAnim 1.2s ease-out forwards;
    z-index: 1;
  }
  @keyframes rippleAnim{
    0%{ width: 10px; height: 10px; opacity: 0.8; transform: translate(-50%,-50%) scale(1); }
    100%{ width: 120px; height: 120px; opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }

  /* 沈むアニメーション */
  @keyframes sinkDown{
    0%{ transform: translateY(0) scale(1); opacity: 1; }
    70%{ opacity: 0.9; }
    100%{ transform: translateY(300px) scale(0.6); opacity: 0; }
  }
  .sinking{
    animation: sinkDown 1.2s ease-in forwards;
  }

  /* 浮くアニメーション */
  @keyframes floatUp{
    0%{ transform: translateY(0) scale(1); opacity: 1; }
    100%{ transform: translateY(-60px) scale(0.9); opacity: 0.7; }
  }
  .floating{
    animation: floatUp 1.5s ease-out forwards;
  }

  /* 情報パネル */
  #info-panel{
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px 16px;
    max-width: 260px;
    z-index: 30;
    font-size: 11px;
    line-height: 1.6;
    box-shadow: var(--shadow);
    backdrop-filter: blur(4px);
  }
  #info-panel h3{
    font-size: 13px;
    margin-bottom: 8px;
    text-align: center;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .info-cat{
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .info-cat .swatch{
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .info-cat .name{
    font-weight: 700;
    font-size: 10px;
  }

  #victory .panel, #gameover .panel{
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 24px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: var(--shadow);
    max-width: 520px;
  }
  #victory h1{
    font-size: clamp(28px, 5vw, 44px);
    margin-bottom: 12px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(127,209,255,0.6);
  }
  #gameover h1{
    font-size: clamp(28px, 5vw, 44px);
    margin-bottom: 12px;
    color: #ff6b6b;
    text-shadow: 0 0 20px rgba(255,107,107,0.5);
  }
  #victory p, #gameover p{ margin-bottom: 24px; opacity: 0.9; line-height: 1.7; }

  #victory footer, #gameover footer{
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--panel-border);
  }
  #victory footer a, #gameover footer a{
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
    font-size: 16px;
    letter-spacing: 0.05em;
  }
  #victory footer a:hover, #gameover footer a:hover{ text-decoration: underline; }

  @media (max-width: 600px){
    .theme-list{ grid-template-columns: 1fr; }
    .piece{ width: 38px; height: 38px; font-size: 9px; }
    .piece.brick{ width: 46px; height: 28px; font-size: 8px; }
    #info-panel{ max-width: 180px; font-size: 9px; padding: 8px 10px; }
  }
</style>
</head>
<body class="theme-simple">

<img id="bg" src="" alt="">
<div id="bg-overlay"></div>

<!-- オープニング -->
<div id="opening" class="screen active">
  <div class="title">周期表ピース運び・沈む順</div>
  <div class="subtitle">重い元素から順にプールへ落とそう。<br>8つ連続で正しい順なら勝利。間違えたらゲームオーバー。</div>
  <button class="btn" id="btn-start">はじめる</button>
</div>

<!-- 設定 -->
<div id="settings" class="screen">
  <div class="panel">
    <h2>設定</h2>
    <div class="theme-list">
      <div class="theme-option selected" data-theme="theme-simple">シンプル</div>
      <div class="theme-option" data-theme="theme-seabreeze">海風</div>
      <div class="theme-option" data-theme="theme-mediterranean">地中海風</div>
      <div class="theme-option" data-theme="theme-ukiyoe">浮世絵風</div>
    </div>
    <div class="settings-actions">
      <button class="btn" id="btn-back">戻る</button>
      <button class="btn" id="btn-play">プレイ</button>
    </div>
  </div>
</div>

<!-- ゲーム -->
<div id="game" class="screen">
  <div id="game-header">
    <div class="info">連続正解：<span id="count-streak">0</span> / <span id="total-streak">8</span></div>
    <div class="info">残り元素：<span id="count-remaining">0</span></div>
    <div class="cat-legend" id="cat-legend"></div>
  </div>
  <div id="play-area"></div>
  <div id="info-panel">
    <h3>分類の色</h3>
    <div id="info-cats"></div>
  </div>
</div>

<!-- 勝利 -->
<div id="victory" class="screen">
  <div class="panel">
    <h1>勝利！</h1>
    <p>重い順に8つ正しく並べました。<br>元素の密度、お見事です。</p>
    <button class="btn" id="btn-again-win">もう一度</button>
    <footer>
      <a href="kick.html">kick.html で復習する</a>
    </footer>
  </div>
</div>

<!-- ゲームオーバー -->
<div id="gameover" class="screen">
  <div class="panel">
    <h1>ゲームオーバー</h1>
    <p id="gameover-msg">順番を間違えました……。<br>もう一度挑戦しよう。</p>
    <button class="btn" id="btn-again-lose">もう一度</button>
    <footer>
      <a href="kick.html">kick.html で復習する</a>
    </footer>
  </div>
</div>

const CAT_COLORS = {
  alkali:     "#ff6b6b",
  alkaline:   "#ffa94d",
  transition: "#4dabf7",
  post:       "#9775fa",
  metalloid:  "#38d9a9",
  nonmetal:   "#ffd43b",
  halogen:    "#f783ac",
  noble:      "#ced4da"
};

const CAT_NAMES = {
  alkali:     "アルカリ金属",
  alkaline:   "アルカリ土類金属",
  transition: "遷移元素",
  post:       "典型金属",
  metalloid:  "半金属",
  nonmetal:   "非金属",
  halogen:    "ハロゲン",
  noble:      "貴ガス"
};

/* 背景画像の候補 */
const BG_IMAGES = ["img99aria.jpg", "img122fleet.jpg"];

/* 重い元素の閾値（質量 > 59 でレンガ） */
const BRICK_MASS_THRESHOLD = 59;

/* ゲーム設定 */
const TARGET_STREAK = 8;

/* =========================================================
   状態
   ========================================================= */
const state = {
  theme: "theme-simple",
  pieces: [],
  totalElements: 0,
  streak: 0,
  placedMasses: [],      // 正しく置かれた質量の履歴（降順チェック用）
  gameActive: false,
  dragging: null,
  dragOffset: {x:0, y:0},
  animFrame: null,
  sortedByMass: []       // 選ばれた32個を質量降順にソートしたリスト
};

/* =========================================================
   画面切り替え
   ========================================================= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* =========================================================
   テーマ
   ========================================================= */
function applyTheme(theme){
  state.theme = theme;
  document.body.className = theme;
  document.querySelectorAll(".theme-option").forEach(el => {
    el.classList.toggle("selected", el.dataset.theme === theme);
  });
}

/* =========================================================
   背景ランダム設定
   ========================================================= */
function setRandomBackground(){
  const bg = document.getElementById("bg");
  const idx = Math.floor(Math.random() * BG_IMAGES.length);
  bg.src = BG_IMAGES[idx];
}

/* =========================================================
   ランダムに32個選ぶ（各分類から4つずつ）
   ========================================================= */
function pickRandom32(){
  const cats = Object.keys(CAT_COLORS);
  const picked = [];

  cats.forEach(cat => {
    const pool = ELEMENTS.filter(e => e.cat === cat);
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    picked.push(...pool.slice(0, 4));
  });

  for(let i = picked.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [picked[i], picked[j]] = [picked[j], picked[i]];
  }

  return picked;
}

/* =========================================================
   情報パネル生成
   ========================================================= */
function buildInfoPanel(){
  const container = document.getElementById("info-cats");
  container.innerHTML = "";
  const cats = Object.keys(CAT_COLORS);

  cats.forEach(cat => {
    const div = document.createElement("div");
    div.className = "info-cat";

    const swatch = document.createElement("div");
    swatch.className = "swatch";
    swatch.style.background = CAT_COLORS[cat];

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = CAT_NAMES[cat];

    div.appendChild(swatch);
    div.appendChild(name);
    container.appendChild(div);
  });
}

/* =========================================================
   ヘッダー凡例
   ========================================================= */
function buildHeaderLegend(){
  const container = document.getElementById("cat-legend");
  container.innerHTML = "";
  const cats = Object.keys(CAT_COLORS);
  cats.forEach(cat => {
    const span = document.createElement("span");
    span.className = "cat-legend-item";
    span.style.color = CAT_COLORS[cat];
    span.textContent = CAT_NAMES[cat];
    container.appendChild(span);
  });
}

/* =========================================================
   ゲーム初期化
   ========================================================= */
function initGame(){
  const area = document.getElementById("play-area");
  area.innerHTML = "";
  state.pieces = [];
  state.streak = 0;
  state.placedMasses = [];
  state.gameActive = true;
  state.dragging = null;

  const selected = pickRandom32();
  state.totalElements = selected.length;

  // 質量降順にソート（正解順）
  state.sortedByMass = [...selected].sort((a, b) => b.mass - a.mass);

  // 情報パネル・凡例
  buildInfoPanel();
  buildHeaderLegend();

  const areaRect = area.getBoundingClientRect();
  const margin = 70;
  const topMargin = 60;
  const bottomLimit = areaRect.height - 120;

  // 元素ピース配置
  selected.forEach(el => {
    const piece = document.createElement("div");
    piece.className = "piece";
    piece.dataset.z = el.z;
    piece.dataset.cat = el.cat;
    piece.dataset.mass = el.mass;
    piece.textContent = el.sym;

    // 重い元素はレンガ型
    const isBrick = el.mass > BRICK_MASS_THRESHOLD;
    if(isBrick){
      piece.classList.add("brick");
    } else {
      piece.style.background = CAT_COLORS[el.cat];
    }

    piece.title = `${el.z} ${el.name}（${CAT_NAMES[el.cat]}）質量:${el.mass}`;

    if(!isBrick){
      const dot = document.createElement("div");
      dot.className = "dot";
      piece.appendChild(dot);
    }

    const x = margin + Math.random() * (areaRect.width - margin * 2);
    const y = topMargin + Math.random() * (bottomLimit - topMargin);
    piece.style.left = x + "px";
    piece.style.top = y + "px";

    piece.addEventListener("pointerdown", onPointerDown);

    area.appendChild(piece);
    state.pieces.push({
      el: piece,
      data: el,
      x: x, y: y,
      vx: 0, vy: 0,
      dragging: false,
      placed: false
    });
  });

  updateHUD();
  startAnimation();
}

/* =========================================================
   ドラッグ処理
   ========================================================= */
function onPointerDown(e){
  if(!state.gameActive) return;
  const pieceEl = e.currentTarget;
  const piece = state.pieces.find(p => p.el === pieceEl);
  if(!piece || piece.placed) return;

  e.preventDefault();
  pieceEl.setPointerCapture(e.pointerId);

  const rect = pieceEl.getBoundingClientRect();

  state.dragging = piece;
  piece.dragging = true;
  pieceEl.classList.add("dragging");

  state.dragOffset.x = e.clientX - rect.left;
  state.dragOffset.y = e.clientY - rect.top;

  pieceEl.addEventListener("pointermove", onPointerMove);
  pieceEl.addEventListener("pointerup", onPointerUp);
  pieceEl.addEventListener("pointercancel", onPointerUp);
}

function onPointerMove(e){
  if(!state.dragging) return;
  e.preventDefault();

  const area = document.getElementById("play-area");
  const areaRect = area.getBoundingClientRect();
  const piece = state.dragging;
  const el = piece.el;

  let nx = e.clientX - areaRect.left - state.dragOffset.x;
  let ny = e.clientY - areaRect.top - state.dragOffset.y;

  nx = Math.max(0, Math.min(areaRect.width - el.offsetWidth, nx));
  ny = Math.max(0, Math.min(areaRect.height - el.offsetHeight, ny));

  // 質量に応じた追従速度（重いほど遅い）
  const mass = piece.data.mass;
  const speed = mass > 200 ? 0.2 : mass > 150 ? 0.3 : mass > 100 ? 0.45 : mass > 60 ? 0.6 : 0.85;

  piece.x += (nx - piece.x) * speed;
  piece.y += (ny - piece.y) * speed;

  el.style.left = piece.x + "px";
  el.style.top = piece.y + "px";
}

function onPointerUp(e){
  if(!state.dragging) return;
  const piece = state.dragging;
  const el = piece.el;
  el.classList.remove("dragging");
  el.removeEventListener("pointermove", onPointerMove);
  el.removeEventListener("pointerup", onPointerUp);
  el.removeEventListener("pointercancel", onPointerUp);
  piece.dragging = false;
  state.dragging = null;

  checkPoolDrop(piece);
}

/* =========================================================
   プール落下判定
   ========================================================= */
function checkPoolDrop(piece){
  const el = piece.el;
  const areaRect = document.getElementById("play-area").getBoundingClientRect();
  const pieceRect = el.getBoundingClientRect();

  // プール領域＝画面下部60%以降
  const poolTop = areaRect.top + areaRect.height * 0.35;
  const cx = pieceRect.left + pieceRect.width / 2;
  const cy = pieceRect.top + pieceRect.height / 2;

  if(cy > poolTop){
    // プールに落ちた
    handleDropInPool(piece, cx - areaRect.left, cy - areaRect.top);
  }
}

function handleDropInPool(piece, dropX, dropY){
  if(!state.gameActive || piece.placed) return;

  const area = document.getElementById("play-area");

  // 波紋エフェクト
  const ripple = document.createElement("div");
  ripple.className = "ripple";
  ripple.style.left = dropX + "px";
  ripple.style.top = dropY + "px";
  area.appendChild(ripple);
  setTimeout(() => ripple.remove(), 1200);

  // 正解チェック
  const nextCorrect = state.sortedByMass[state.streak];
  const isCorrect = (nextCorrect.z === piece.data.z);

  if(isCorrect){
    // 正解
    state.streak++;
    piece.placed = true;
    piece.el.style.display = "none";

    // 沈むアニメーション（レンガは早く沈む、軽いものは浮く）
    const clone = piece.el.cloneNode(true);
    clone.style.left = dropX + "px";
    clone.style.top = dropY + "px";
    clone.style.pointerEvents = "none";
    clone.style.zIndex = "50";
    area.appendChild(clone);

    const isHeavy = piece.data.mass > BRICK_MASS_THRESHOLD;
    if(isHeavy){
      clone.classList.add("sinking");
      // 重いものは早く沈む
      clone.style.animationDuration = "0.8s";
    } else {
      clone.classList.add("floating");
      clone.style.animationDuration = "1.5s";
    }
    setTimeout(() => clone.remove(), 2000);

    updateHUD();

    // 勝利判定
    if(state.streak >= TARGET_STREAK){
      state.gameActive = false;
      setTimeout(() => {
        showScreen("victory");
      }, 600);
    }
  } else {
    // 不正解 → ゲームオーバー
    state.gameActive = false;
    piece.el.style.display = "none";

    const clone = piece.el.cloneNode(true);
    clone.style.left = dropX + "px";
    clone.style.top = dropY + "px";
    clone.style.pointerEvents = "none";
    clone.style.zIndex = "50";
    clone.classList.add("sinking");
    area.appendChild(clone);
    setTimeout(() => clone.remove(), 1500);

    // 正解を表示
    const correct = state.sortedByMass[state.streak];
    document.getElementById("gameover-msg").innerHTML =
      `「${piece.data.name}」（質量${piece.data.mass}）を選びましたが、` +
      `次に重いのは「${correct.name}」（質量${correct.mass}）でした。<br>` +
      `連続正解：${state.streak} / ${TARGET_STREAK}`;

    setTimeout(() => {
      showScreen("gameover");
    }, 800);
  }
}

/* =========================================================
   HUD更新
   ========================================================= */
function updateHUD(){
  document.getElementById("count-streak").textContent = state.streak;
  document.getElementById("total-streak").textContent = TARGET_STREAK;
  const remaining = state.pieces.filter(p => !p.placed).length;
  document.getElementById("count-remaining").textContent = remaining;
}

/* =========================================================
   アニメーションループ（浮力・沈降シミュレーション）
   ========================================================= */
function startAnimation(){
  if(state.animFrame) cancelAnimationFrame(state.animFrame);

  function loop(){
    if(!state.gameActive) {
      state.animFrame = requestAnimationFrame(loop);
      return;
    }

    const area = document.getElementById("play-area");
    const areaRect = area.getBoundingClientRect();
    const poolTop = areaRect.height * 0.35;

    state.pieces.forEach(piece => {
      if(piece.placed || piece.dragging) return;

      const el = piece.el;
      const mass = piece.data.mass;
      const isHeavy = mass > BRICK_MASS_THRESHOLD;

      // 物理パラメータ
      // 水の抵抗・浮力: 軽いほど浮き、重いほど沈む
      // 質量 < 40 は強く浮く、質量 > 80 は沈む傾向
      const buoyancy = mass < 30 ? -0.25 : mass < 50 ? -0.1 : mass < 70 ? 0.05 : mass < 100 ? 0.15 : 0.3;
      const drag = mass > 150 ? 0.92 : mass > 80 ? 0.94 : 0.96;

      // ランダムな揺らぎ（液体・気体）
      if(piece.data.state === "gas" || mass < 40){
        piece.vx += (Math.random() - 0.5) * 0.2;
        piece.vy += (Math.random() - 0.5) * 0.2;
      }
      if(piece.data.state === "liquid"){
        piece.vx += (Math.random() - 0.5) * 0.4;
        piece.vy += (Math.random() - 0.5) * 0.4;
      }

      // 浮力適用（画面上部へ）
      piece.vy += buoyancy;

      // 水抵抗
      piece.vx *= drag;
      piece.vy *= drag;

      // 位置更新
      piece.x += piece.vx;
      piece.y += piece.vy;

      // 境界処理
      const w = el.offsetWidth;
      const h = el.offsetHeight;

      // 左右
      if(piece.x < 0){ piece.x = 0; piece.vx *= -0.5; }
      if(piece.x > areaRect.width - w){ piece.x = areaRect.width - w; piece.vx *= -0.5; }

      // 上
      if(piece.y < 0){ piece.y = 0; piece.vy *= -0.3; }

      // 下（プールの底）
      if(piece.y > areaRect.height - h){
        piece.y = areaRect.height - h;
        // 重いものは底に留まりやすい
        if(isHeavy){
          piece.vy = 0;
          piece.vx *= 0.8;
        } else {
          piece.vy *= -0.5;
        }
      }

      // 水面より下では浮力が強く働く
      if(piece.y + h/2 > poolTop){
        // 水中では浮力が増す
        piece.vy += buoyancy * 0.5;
      }

      el.style.left = piece.x + "px";
      el.style.top = piece.y + "px";
    });

    state.animFrame = requestAnimationFrame(loop);
  }
  loop();
}

/* =========================================================
   イベント登録
   ========================================================= */
document.getElementById("btn-start").addEventListener("click", () => {
  showScreen("settings");
});

document.querySelectorAll(".theme-option").forEach(el => {
  el.addEventListener("click", () => {
    applyTheme(el.dataset.theme);
  });
});

  });

  });

document.getElementById("btn-again-lose").addEventListener("click", () => {
  showScreen("game");
  requestAnimationFrame(() => {
    setTimeout(initGame, 50);
  });
});

let resizeTimer;
window.addEventListener("resize", () => {
  if(!document.getElementById("game").classList.contains("active")) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    initGame();
  }, 300);
});

setRandomBackground();
applyTheme("theme-simple");
