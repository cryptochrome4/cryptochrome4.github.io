<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サークルレース</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; }
  #game { position: relative; width: 100vw; height: 100vh; background: #111; }
  canvas { display: block; width: 100%; height: 100%; }

  #opening {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100;
    background: url('img37x.jpg') center/cover no-repeat, #222;
  }
  #opening::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.55); }
  #opening > * { position: relative; z-index: 1; }
  #opening h1 { color: #fff; font-size: 64px; text-shadow: 0 0 20px #0af, 0 0 40px #08f; margin-bottom: 40px; letter-spacing: 6px; }
  #opening .btns { display: flex; gap: 30px; }
  .menu-btn {
    padding: 16px 48px; font-size: 24px; border: 2px solid #0af; border-radius: 8px;
    background: rgba(0,20,40,0.8); color: #0af; cursor: pointer; transition: all 0.2s;
    letter-spacing: 3px;
  }
  .menu-btn:hover { background: #0af; color: #001; box-shadow: 0 0 25px #0af; }

  #settings {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100;
    background: #1a1a2e; color: #fff; overflow-y: auto; padding: 30px;
  }
  #settings h2 { font-size: 36px; margin-bottom: 30px; color: #0af; letter-spacing: 4px; }
  .setting-group { margin-bottom: 24px; text-align: center; }
  .setting-group h3 { font-size: 20px; margin-bottom: 12px; color: #ccc; }
  .color-picker { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px; }
  .color-swatch {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: all 0.15s; position: relative;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: #fff; box-shadow: 0 0 15px #fff; }
  .color-swatch.selected::after {
    content: '✓'; position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; font-size: 22px; font-weight: bold;
    color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000;
  }
  .course-btn, .design-btn {
    padding: 12px 32px; margin: 6px; font-size: 18px; border: 2px solid #0af;
    border-radius: 6px; background: transparent; color: #0af; cursor: pointer; transition: all 0.2s;
  }
  .course-btn:hover, .design-btn:hover { background: rgba(0,170,255,0.2); }
  .course-btn.selected, .design-btn.selected { background: #0af; color: #001; }
  .nav-btns { display: flex; gap: 20px; margin-top: 30px; }

  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 50;
    background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 12px; color: #fff; font-size: 13px;
    min-width: 200px; display: none;
  }
  #hud h4 { font-size: 15px; margin-bottom: 8px; color: #0af; letter-spacing: 2px; }
  .rank-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 4px;
    border-radius: 4px; margin-bottom: 2px;
  }
  .rank-row.me { background: rgba(255,255,255,0.18); font-weight: bold; }
  .rank-row.done { opacity: 0.45; }
  .rank-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.3); }
  .rank-pos { width: 20px; text-align: right; font-variant-numeric: tabular-nums; }

  #lapInfo {
    position: absolute; top: 12px; right: 12px; z-index: 50;
    background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 12px 20px; color: #fff; font-size: 20px;
    display: none; text-align: center; letter-spacing: 2px;
  }
  #lapInfo span { color: #0af; font-weight: bold; }

  #spectate {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 58; display: none; color: #fff; font-size: 32px;
    letter-spacing: 6px; text-shadow: 0 0 20px #0af;
    background: rgba(0,0,0,0.6); padding: 16px 40px; border-radius: 12px;
    border: 2px solid #0af; pointer-events: none;
  }

  #pedals {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 55; display: none; flex-direction: row; gap: 40px; align-items: flex-end;
  }
  .pedal-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pedal-btn {
    width: 90px; height: 130px; font-size: 22px; font-weight: bold;
    border: 3px solid; border-radius: 12px; cursor: pointer; user-select: none;
    letter-spacing: 6px; transition: all 0.1s;
    writing-mode: vertical-rl; text-orientation: upright;
    display: flex; align-items: center; justify-content: center;
  }
  #accelBtn { border-color: #0f0; color: #0f0; background: rgba(0,40,0,0.8); }
  #accelBtn.active { background: #0f0; color: #001; box-shadow: 0 0 30px #0f0; }
  #brakeBtn { border-color: #f33; color: #f33; background: rgba(40,0,0,0.8); }
  #brakeBtn.active { background: #f33; color: #001; box-shadow: 0 0 30px #f33; }

  #accelGauge {
    width: 90px; height: 16px; border: 2px solid #0f0; border-radius: 8px;
    background: rgba(0,0,0,0.6); overflow: hidden;
  }
  #accelFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #0a0, #0f0, #afa);
  }
  .pedal-label { color: #ccc; font-size: 11px; letter-spacing: 2px; }

  #countdown {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    z-index: 60; pointer-events: none;
  }
  #countdown span {
    font-size: 150px; font-weight: bold; color: #fff;
    text-shadow: 0 0 30px #0af, 0 0 60px #0af;
  }

  #victory {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 200;
    background: rgba(0,0,0,0.85); color: #fff; text-align: center;
    pointer-events: none;
  }
  #victory h2 { font-size: 72px; color: #ffd700; text-shadow: 0 0 30px #ffd700; letter-spacing: 8px; }

  #result {
    position: absolute; inset: 0; display: none; flex-direction: column;
    z-index: 300; background: rgba(10,10,25,0.97); color: #fff;
    overflow-y: auto; padding: 40px 20px 80px;
  }
  #result h2 {
    font-size: 44px; color: #0af; text-align: center; margin-bottom: 8px;
    letter-spacing: 6px; text-shadow: 0 0 20px #0af;
  }
  #result .subtitle { text-align: center; font-size: 18px; color: #aaa; margin-bottom: 30px; }
  #resultTable {
    max-width: 900px; margin: 0 auto; width: 100%;
    border-collapse: collapse; font-size: 15px;
  }
  #resultTable th, #resultTable td {
    padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.12);
    text-align: center;
  }
  #resultTable th {
    background: rgba(0,170,255,0.2); color: #0af; font-weight: bold;
    letter-spacing: 1px; position: sticky; top: 0;
  }
  #resultTable tr.me { background: rgba(255,255,255,0.12); font-weight: bold; }
  #resultTable tr.winner td { color: #ffd700; }
  .res-dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; border: 1px solid rgba(255,255,255,0.3); }
  .stat-bar-wrap { display: inline-block; width: 90px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; vertical-align: middle; }
  .stat-bar { height: 100%; background: linear-gradient(90deg, #0af, #0ff); }
  .stat-bar.me-bar { background: linear-gradient(90deg, #ff6, #fa0); }
  .stat-val { display: inline-block; width: 30px; text-align: right; margin-left: 4px; font-variant-numeric: tabular-nums; }
  #result .total-cell { color: #ffd700; font-weight: bold; }
  #result .btn-row { text-align: center; margin-top: 36px; }
  #result .again-btn {
    padding: 14px 40px; font-size: 20px; border: 2px solid #0af; border-radius: 8px;
    background: transparent; color: #0af; cursor: pointer; letter-spacing: 3px; transition: all 0.2s;
  }
  #result .again-btn:hover { background: #0af; color: #001; box-shadow: 0 0 25px #0af; }
  #result footer {
    text-align: center; margin-top: 30px; padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.15); color: #888; font-size: 14px;
    min-height: 30px;
  }
  #result footer a { color: #0af; text-decoration: none; border-bottom: 1px dotted #0af; }
  #result footer a:hover { color: #0ff; }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud">
    <h4>順位表</h4>
    <div id="rankList"></div>
  </div>

  <div id="lapInfo">LAP <span id="lapNum">1</span> / 3</div>

  <div id="spectate">観戦中…</div>

  <div id="pedals">
    <div class="pedal-col">
      <div class="pedal-label">BRAKE</div>
      <div class="pedal-btn" id="brakeBtn">ブレーキ</div>
    </div>
    <div class="pedal-col">
      <div id="accelGauge"><div id="accelFill"></div></div>
      <div class="pedal-btn" id="accelBtn">アクセル</div>
    </div>
  </div>

  <div id="countdown"><span id="cdText">3</span></div>

  <div id="opening">
    <h1>サークルレース</h1>
    <div class="btns">
      <button class="menu-btn" id="btnStart">はじめる</button>
      <button class="menu-btn" id="btnSettings">設定</button>
    </div>
  </div>

  <div id="settings">
    <h2>設定</h2>
    <div class="setting-group">
      <h3>マイキャラの色</h3>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="setting-group">
      <h3>レースコース</h3>
      <div>
        <button class="course-btn" data-course="0">競馬場</button>
        <button class="course-btn" data-course="1">サーキット</button>
        <button class="course-btn" data-course="2">ワインディング</button>
      </div>
    </div>
    <div class="setting-group">
      <h3>デザインテーマ</h3>
      <div>
        <button class="design-btn" data-design="simple">シンプル</button>
        <button class="design-btn" data-design="magazine">雑誌風</button>
        <button class="design-btn" data-design="ukiyoe">浮世絵風</button>
        <button class="design-btn" data-design="cyber">サイバーゲーム風</button>
      </div>
    </div>
    <div class="nav-btns">
      <button class="menu-btn" id="btnBack">戻る</button>
    </div>
  </div>

  <div id="victory"><h2>VICTORY!</h2></div>

  <div id="result">
    <h2 id="resultTitle">RESULT</h2>
    <div class="subtitle" id="resultSub">全員のステータス公開</div>
    <table id="resultTable">
      <thead>
        <tr>
          <th>順位</th><th>色</th><th>スピード</th><th>アクセル</th><th>コーナー</th><th>合計</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
    <div class="btn-row">
      <button class="again-btn" id="btnAgain">もう一度</button>
    </div>
    <footer id="resultFooter"></footer>
  </div>
</div>

<script>
(function(){
'use strict';

const COLORS = [
  {name:'赤',   hex:'#e8302a', num:'#fff'},
  {name:'水色', hex:'#5bc8f5', num:'#000'},
  {name:'黄色', hex:'#f5e642', num:'#000'},
  {name:'ピンク',hex:'#f56ab0', num:'#fff'},
  {name:'青',   hex:'#2a4de8', num:'#fff'},
  {name:'茶色', hex:'#8b5a2b', num:'#fff'},
  {name:'白',   hex:'#f0f0f0', num:'#000'},
  {name:'橙',   hex:'#f5902a', num:'#000'},
  {name:'紫',   hex:'#8a2ae8', num:'#fff'},
  {name:'黒',   hex:'#1a1a1a', num:'#fff'},
  {name:'灰色', hex:'#9a9a9a', num:'#000'},
  {name:'緑',   hex:'#2ab84a', num:'#fff'},
  {name:'黄緑', hex:'#a8e830', num:'#000'}
];
const TOTAL_RACERS = 13;
const TOTAL_LAPS = 3;
const BALL_R = 14;
const START_IDX = 5;

// チューニング定数
const GAUGE_UP_RATE   = 1.2;
const GAUGE_DOWN_RATE = 0.45;
const SPEED_RESPONSE  = 4.5;
const BRAKE_RESPONSE  = 9.0;

let state = {
  myColorIdx: 4,
  courseIdx: 0,
  design: 'simple',
  running: false,
  finished: false,
  raceStarted: false,
  myFinished: false,
  countdown: 3,
  countdownTimer: 0,
  lastTime: 0,
  racers: [],
  camX: 0, camY: 0,
  accelInput: false,
  accelCharge: 0,
  brakeInput: false,
  playerWon: false
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

function resize(){
  W = cv.width = cv.clientWidth * (window.devicePixelRatio||1);
  H = cv.height = cv.clientHeight * (window.devicePixelRatio||1);
}
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

const accelBtn = document.getElementById('accelBtn');
const brakeBtn = document.getElementById('brakeBtn');

function bindPedal(btn, onDown, onUp){
  const down = (e)=>{ e.preventDefault(); btn.classList.add('active'); onDown(); };
  const up = (e)=>{ e.preventDefault(); btn.classList.remove('active'); onUp(); };
  btn.addEventListener('mousedown', down);
  btn.addEventListener('mouseup', up);
  btn.addEventListener('mouseleave', up);
  btn.addEventListener('touchstart', down, {passive:false});
  btn.addEventListener('touchend', up);
  btn.addEventListener('touchcancel', up);
}
bindPedal(accelBtn,
  ()=>{ state.accelInput = true; },
  ()=>{ state.accelInput = false; }
);
bindPedal(brakeBtn,
  ()=>{ state.brakeInput = true; },
  ()=>{ state.brakeInput = false; }
);

function makeCourse(idx){
  const pts = [];
  if(idx===0){
    const cx=900, cy=600, rx=700, ry=380;
    for(let i=0;i<120;i++){
      const a = i/120*Math.PI*2;
      pts.push({x:cx+Math.cos(a)*rx, y:cy+Math.sin(a)*ry});
    }
    return { pts, width: 160, name:'競馬場' };
  } else if(idx===1){
    const cx=900, cy=600;
    for(let i=0;i<200;i++){
      const a = i/200*Math.PI*2;
      const r = 500 + Math.sin(a*3)*180 + Math.cos(a*5)*120 + Math.sin(a*2)*100;
      pts.push({x:cx+Math.cos(a)*r*1.1, y:cy+Math.sin(a)*r*0.8});
    }
    return { pts, width: 130, name:'サーキット' };
  } else {
    const cx=900, cy=600;
    for(let i=0;i<240;i++){
      const a = i/240*Math.PI*2;
      const r = 480 + Math.sin(a*4)*200 + Math.cos(a*7)*140 + Math.sin(a*2.5)*160 + Math.cos(a*11)*60;
      pts.push({x:cx+Math.cos(a)*r*1.15, y:cy+Math.sin(a)*r*0.85});
    }
    return { pts, width: 120, name:'ワインディング' };
  }
}

function buildCourseMesh(course){
  const pts = course.pts;
  const n = pts.length;
  const segs = [];
  for(let i=0;i<n;i++){
    const p0 = pts[i];
    const p1 = pts[(i+1)%n];
    const dx = p1.x-p0.x, dy = p1.y-p0.y;
    const len2 = dx*dx+dy*dy||1;
    segs.push({p0, p1, dx, dy, len2, idx:i});
  }
  const cellSize = 200;
  const grid = new Map();
  function cellKey(cx, cy){ return cx+','+cy; }
  for(let i=0;i<n;i++){
    const s = segs[i];
    const minX = Math.min(s.p0.x, s.p1.x) - BALL_R - 50;
    const maxX = Math.max(s.p0.x, s.p1.x) + BALL_R + 50;
    const minY = Math.min(s.p0.y, s.p1.y) - BALL_R - 50;
    const maxY = Math.max(s.p0.y, s.p1.y) + BALL_R + 50;
    const cx0 = Math.floor(minX/cellSize);
    const cx1 = Math.floor(maxX/cellSize);
    const cy0 = Math.floor(minY/cellSize);
    const cy1 = Math.floor(maxY/cellSize);
    for(let cx=cx0;cx<=cx1;cx++){
      for(let cy=cy0;cy<=cy1;cy++){
        const k = cellKey(cx,cy);
        if(!grid.has(k)) grid.set(k, []);
        grid.get(k).push(i);
      }
    }
  }
  return { segs, grid, cellSize, n };
}

function findNearestSegment(mesh, x, y, hintIdx){
  const { segs, grid, cellSize, n } = mesh;
  const cx = Math.floor(x/cellSize);
  const cy = Math.floor(y/cellSize);
  let candidates = new Set();
  for(let rad=0; rad<=3; rad++){
    for(let dx=-rad;dx<=rad;dx++){
      for(let dy=-rad;dy<=rad;dy++){
        if(rad>0 && Math.abs(dx)!==rad && Math.abs(dy)!==rad) continue;
        const k = (cx+dx)+','+(cy+dy);
        if(grid.has(k)){
          for(const i of grid.get(k)) candidates.add(i);
        }
      }
    }
    if(candidates.size > 0) break;
  }
  if(candidates.size === 0){
    for(let i=0;i<n;i++) candidates.add(i);
  }
  if(hintIdx !== undefined){
    for(let d=-3; d<=3; d++){
      const i = ((hintIdx+d)%n+n)%n;
      candidates.add(i);
    }
  }
  let bestSeg = 0, bestT = 0, bestD = Infinity;
  for(const i of candidates){
    const s = segs[i];
    let t = ((x-s.p0.x)*s.dx + (y-s.p0.y)*s.dy)/s.len2;
    t = Math.max(0, Math.min(1, t));
    const px = s.p0.x + s.dx*t;
    const py = s.p0.y + s.dy*t;
    const d = (x-px)*(x-px)+(y-py)*(y-py);
    if(d<bestD){ bestD=d; bestSeg=i; bestT=t; }
  }
  return { idx: bestSeg, t: bestT, contPos: bestSeg + bestT };
}

function collideWalls(course, mesh, ball){
  const near = findNearestSegment(mesh, ball.x, ball.y, ball.hintIdx);
  ball.hintIdx = near.idx;
  const s = mesh.segs[near.idx];
  const t = near.t;
  const cx = s.p0.x + s.dx*t;
  const cy = s.p0.y + s.dy*t;
  const nx = ball.x-cx, ny = ball.y-cy;
  const dist = Math.sqrt(nx*nx+ny*ny) || 0.001;
  const halfW = course.width/2 - BALL_R;
  if(dist > halfW){
    const ux = nx/dist, uy = ny/dist;
    const push = dist - halfW;
    ball.x -= ux*push;
    ball.y -= uy*push;
    const vn = ball.vx*ux + ball.vy*uy;
    if(vn>0){
      ball.vx -= (1.6)*vn*ux;
      ball.vy -= (1.6)*vn*uy;
    }
  }
}

function genComStats(){
  return {
    speed: 40 + Math.floor(Math.random()*11),
    accel: 40 + Math.floor(Math.random()*11),
    turn:  40 + Math.floor(Math.random()*11)
  };
}
// 俺: 合計110〜140（各30〜50）
function genMyStats(){
  while(true){
    const a = 30 + Math.floor(Math.random()*21); // 30〜50
    const b = 30 + Math.floor(Math.random()*21);
    const c = 30 + Math.floor(Math.random()*21);
    const total = a+b+c;
    if(total >= 110 && total <= 140){
      const arr = [a,b,c];
      for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
      }
      return { speed: arr[0], accel: arr[1], turn: arr[2] };
    }
  }
}

function makeRacers(){
  const course = makeCourse(state.courseIdx);
  const n = course.pts.length;
  const sp = course.pts[START_IDX];
  const sp2 = course.pts[(START_IDX+3)%n];
  const dirX = sp2.x-sp.x, dirY = sp2.y-sp.y;
  const dl = Math.sqrt(dirX*dirX+dirY*dirY)||1;
  const fx = dirX/dl, fy = dirY/dl;
  const px = -fy, py = fx;

  const racers = [];
  const myIdx = state.myColorIdx;
  const colorOrder = [];
  for(let i=0;i<COLORS.length;i++) colorOrder.push(i);
  const orderedColors = [myIdx, ...colorOrder.filter(i=>i!==myIdx)];

  for(let i=0;i<TOTAL_RACERS;i++){
    const colIdx = orderedColors[i];
    const isMe = (i===0);
    const row = Math.floor(i/3);
    const col = i%3;
    const offX = (col-1)*70;
    const offY = row*60;
    const x = sp.x + px*offX + fx*(-offY);
    const y = sp.y + py*offX + fy*(-offY);

    const st = isMe ? genMyStats() : genComStats();
    racers.push({
      colorIdx: colIdx,
      color: COLORS[colIdx],
      isMe,
      x, y,
      vx: 0, vy: 0,
      angle: Math.atan2(fy, fx),
      contPathPos: START_IDX,
      lap: 0,
      totalProgress: START_IDX,
      finished: false,
      finishTime: 0,
      rank: i+1,
      hintIdx: START_IDX,
      speed: st.speed,
      accel: st.accel,
      turn: st.turn,
      skill: 0.5 + Math.random()*0.5
    });
  }
  return racers;
}

function update(dt){
  if(!state.running || state.finished) return;
  const course = makeCourse(state.courseIdx);
  const mesh = buildCourseMesh(course);
  const n = course.pts.length;

  if(!state.raceStarted){
    state.countdownTimer += dt;
    if(state.countdownTimer >= 1){
      state.countdownTimer -= 1;
      state.countdown--;
      if(state.countdown <= 0){
        state.raceStarted = true;
        document.getElementById('countdown').style.display = 'none';
      } else {
        document.getElementById('cdText').textContent = state.countdown;
      }
    }
    return;
  }

  // ===== キー入力（常に受け付ける） =====
  let inputX=0, inputY=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']) inputX-=1;
  if(keys['ArrowRight']||keys['d']||keys['D']) inputX+=1;
  if(keys['ArrowUp']||keys['w']||keys['W']) inputY-=1;
  if(keys['ArrowDown']||keys['s']||keys['S']) inputY+=1;

  // ===== ゲージの動き =====
  if(state.accelInput){
    state.accelCharge = Math.min(1.0, state.accelCharge + GAUGE_UP_RATE * dt);
  } else {
    state.accelCharge = Math.max(0, state.accelCharge - GAUGE_DOWN_RATE * dt);
  }
  const accelFill = document.getElementById('accelFill');
  if(accelFill) accelFill.style.width = (state.accelCharge*100)+'%';

  // ===== 自分の操作（P制御） =====
  const me = state.racers.find(r=>r.isMe);
  if(me && !me.finished){
    const pts = course.pts;
    const nextIdx = (Math.floor(me.contPathPos)+6)%n;
    const target = pts[nextIdx];
    const dx = target.x-me.x, dy = target.y-me.y;
    const dl = Math.sqrt(dx*dx+dy*dy)||1;
    const tx = dx/dl, ty = dy/dl;

    // 目標速度: ゲージ × ステータス由来の最大速度
    const maxSpeedByStat = (me.speed/50) * 480 + (me.accel/50) * 120;
    const targetSpeed = state.brakeInput ? 0 : state.accelCharge * maxSpeedByStat;

    // 現在速度と向き
    let sp = Math.sqrt(me.vx*me.vx + me.vy*me.vy);
    let dirX2 = 0, dirY2 = 0;
    if(sp > 0.01){
      dirX2 = me.vx/sp; dirY2 = me.vy/sp;
    } else {
      dirX2 = tx; dirY2 = ty;
    }

    // P制御
    const response = state.brakeInput ? BRAKE_RESPONSE : SPEED_RESPONSE;
    const speedError = targetSpeed - sp;

    if(Math.abs(speedError) > 0.1){
      // 進行方向の決定
      let accDirX, accDirY;

      // 速度がほぼゼロなら、コース進行方向 + キー入力で向きを決める
      if(sp < 5){
        let ax = tx*0.7 + inputX*0.5;
        let ay = ty*0.7 + inputY*0.5;
        const al = Math.sqrt(ax*ax+ay*ay)||1;
        accDirX = ax/al; accDirY = ay/al;
      } else {
        // 速度がある程度ある場合:
        // 基本は速度方向、キー入力で操舵（常に効く）
        let steerX = inputX, steerY = inputY;
        const sl = Math.sqrt(steerX*steerX + steerY*steerY);

        if(sl > 0.01){
          // 操舵あり: 速度方向と操舵方向を合成
          // 速度方向を軸に、操舵で曲げる
          // （アクセルON時は操舵強め、OFF時は弱め）
          const steerWeight = state.accelInput ? 0.55 : 0.35;
          let ax = dirX2*(1-steerWeight) + (steerX/sl)*steerWeight;
          let ay = dirY2*(1-steerWeight) + (steerY/sl)*steerWeight;
          const al = Math.sqrt(ax*ax+ay*ay)||1;
          accDirX = ax/al; accDirY = ay/al;
        } else {
          // 操舵なし: 速度方向に真っ直ぐ
          accDirX = dirX2; accDirY = dirY2;
        }
      }

      // 速度補正量 = 誤差 × 応答係数 × dt
      const dv = speedError * response * dt;

      // 加速: 補正方向へ加算 / 減速: 速度の逆方向に減算
      if(speedError > 0){
        // 加速: 操舵方向へ加速
        me.vx += accDirX * dv;
        me.vy += accDirY * dv;
      } else {
        // 減速: 速度方向の逆向きに減速（操舵で曲げない）
        me.vx -= dirX2 * (-dv);
        me.vy -= dirY2 * (-dv);
      }

      // 速度が0を跨いで逆走しないように
      const newSp = Math.sqrt(me.vx*me.vx+me.vy*me.vy);
      if(newSp > 0.01 && sp > 0.01){
        const newDirX = me.vx/newSp, newDirY = me.vy/newSp;
        if((dirX2*newDirX + dirY2*newDirY) < 0){
          me.vx = 0; me.vy = 0;
        }
      }
    }

    // 上限クランプ
    sp = Math.sqrt(me.vx*me.vx+me.vy*me.vy);
    const absMax = maxSpeedByStat * 1.05;
    if(sp > absMax){
      me.vx = me.vx/sp*absMax;
      me.vy = me.vy/sp*absMax;
    }

    me.angle = Math.atan2(me.vy, me.vx);
  }

  // ===== コンピューターAI =====
  for(const r of state.racers){
    if(r.isMe || r.finished) continue;
    const pts = course.pts;
    const nextIdx = (Math.floor(r.contPathPos)+7)%n;
    const target = pts[nextIdx];
    const dx = target.x-r.x, dy = target.y-r.y;
    const dl = Math.sqrt(dx*dx+dy*dy)||1;
    let ax = dx/dl, ay = dy/dl;
    ax += (Math.random()-0.5)*0.3;
    ay += (Math.random()-0.5)*0.3;
    const al = Math.sqrt(ax*ax+ay*ay)||1;
    ax/=al; ay/=al;

    const accelPower = (r.accel/50) * 850 * r.skill;
    r.vx += ax*accelPower*dt;
    r.vy += ay*accelPower*dt;
    r.vx *= 0.985;
    r.vy *= 0.985;

    const maxSp = (r.speed/50) * 500;
    const sp = Math.sqrt(r.vx*r.vx+r.vy*r.vy);
    if(sp>maxSp){ r.vx = r.vx/sp*maxSp; r.vy = r.vy/sp*maxSp; }
    r.angle = Math.atan2(r.vy, r.vx);
  }

  for(const r of state.racers){
    if(r.finished) continue;
    r.x += r.vx*dt;
    r.y += r.vy*dt;
  }

  for(const r of state.racers){
    if(r.finished) continue;
    collideWalls(course, mesh, r);
  }

  for(let i=0;i<state.racers.length;i++){
    const a = state.racers[i];
    if(a.finished) continue;
    for(let j=i+1;j<state.racers.length;j++){
      const b = state.racers[j];
      if(b.finished) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      const minD = BALL_R*2;
      if(d < minD && d > 0.001){
        const ux = dx/d, uy = dy/d;
        const overlap = minD - d;
        const push = overlap * 0.5;
        a.x -= ux*push; a.y -= uy*push;
        b.x += ux*push; b.y += uy*push;
        const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
        const vn = rvx*ux + rvy*uy;
        if(vn < 0){
          const imp = -vn * 0.7;
          a.vx -= ux*imp; a.vy -= uy*imp;
          b.vx += ux*imp; b.vy += uy*imp;
        }
      }
    }
  }

  for(const r of state.racers){
    if(r.finished) continue;
    const near = findNearestSegment(mesh, r.x, r.y, r.hintIdx);
    r.hintIdx = near.idx;
    const newPos = near.contPos;
    let diff = newPos - r.contPathPos;
    if(diff < -n*0.5) diff += n;
    else if(diff > n*0.5) diff -= n;

    if(Math.abs(diff) < n*0.25){
      r.contPathPos = newPos;
      r.totalProgress += diff;
    }

    const netProgress = r.totalProgress - START_IDX;
    r.lap = Math.floor(netProgress / n);
    if(r.lap < 0) r.lap = 0;

    if(r.lap >= TOTAL_LAPS){
      r.finished = true;
      r.finishTime = performance.now();
    }
  }

  const sorted = state.racers.slice().sort((a,b)=>{
    if(a.finished && b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.totalProgress - a.totalProgress;
  });
  sorted.forEach((r,i)=> r.rank = i+1);

  const me3 = state.racers.find(r=>r.isMe);
  if(me3){
    state.camX += (me3.x - state.camX) * 0.08;
    state.camY += (me3.y - state.camY) * 0.08;
  }

  if(!state.myFinished){
    const me2 = state.racers.find(r=>r.isMe);
    if(me2 && me2.finished){
      state.myFinished = true;
      state.playerWon = (me2.rank === 1);
      if(state.playerWon){
        document.getElementById('victory').style.display = 'flex';
        setTimeout(()=>{
          document.getElementById('victory').style.display = 'none';
        }, 2000);
      }
      document.getElementById('spectate').style.display = 'block';
    }
  }

  if(state.racers.every(r=>r.finished)){
    state.finished = true;
    state.running = false;
    document.getElementById('spectate').style.display = 'none';
    showResult(state.playerWon);
  }

  updateHUD();
}

function updateHUD(){
  const list = document.getElementById('rankList');
  const sorted = state.racers.slice().sort((a,b)=>{
    if(a.finished && b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.totalProgress - a.totalProgress;
  });
  let html = '';
  for(const r of sorted){
    const cls = 'rank-row' + (r.isMe?' me':'') + (r.finished?' done':'');
    html += `<div class="${cls}">
      <span class="rank-pos">${r.rank}</span>
      <span class="rank-dot" style="background:${r.color.hex}"></span>
      <span>${r.color.name}${r.isMe?' (俺)':''}${r.finished?' ✓':''}</span>
    </div>`;
  }
  list.innerHTML = html;
  const me = state.racers.find(r=>r.isMe);
  if(me) document.getElementById('lapNum').textContent = Math.min(me.lap+1, TOTAL_LAPS);
}

function draw(){
  const dpr = window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = W/dpr, h = H/dpr;

  drawBackground(w, h);

  if(!state.running && !state.finished) return;
  if(state.racers.length===0) return;

  const course = makeCourse(state.courseIdx);

  ctx.save();
  const camScale = 0.9;
  ctx.translate(w/2, h/2);
  ctx.scale(camScale, camScale);
  ctx.translate(-state.camX, -state.camY);

  drawCourse(course);

  const sorted = state.racers.slice().filter(r=>!r.finished).sort((a,b)=>{
    if(a.isMe) return 1;
    if(b.isMe) return -1;
    return 0;
  });
  for(const r of sorted){
    drawRacer(r);
  }

  ctx.restore();
}

function drawBackground(w, h){
  const d = state.design;
  if(d==='simple'){
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const gs = 60;
    const ox = (-state.camX*0.3)%gs;
    const oy = (-state.camY*0.3)%gs;
    for(let x=ox;x<w;x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(let y=oy;y<h;y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  } else if(d==='magazine'){
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#ff6b9d');
    g.addColorStop(0.5,'#ffd93d');
    g.addColorStop(1,'#6bcbff');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for(let i=0;i<80;i++){
      const x = (i*137.5)%w, y=(i*89.3)%h;
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    }
  } else if(d==='ukiyoe'){
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#1a3a5c');
    g.addColorStop(0.5,'#2a5a8c');
    g.addColorStop(1,'#0f2a4a');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(200,220,255,0.15)';
    ctx.lineWidth = 2;
    for(let i=0;i<10;i++){
      ctx.beginPath();
      for(let x=0;x<w;x+=10){
        const y = i*80 + Math.sin(x*0.02+i)*20;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  } else if(d==='cyber'){
    ctx.fillStyle = '#050510';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(0,255,255,0.15)';
    ctx.lineWidth = 1;
    const gs = 50;
    const ox = (-state.camX*0.5)%gs;
    const oy = (-state.camY*0.5)%gs;
    for(let x=ox;x<w;x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(let y=oy;y<h;y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0,255,255,0.03)';
    for(let y=0;y<h;y+=4){ ctx.fillRect(0,y,w,2); }
  }
}

function drawCourse(course){
  const pts = course.pts;
  const n = pts.length;
  const d = state.design;

  ctx.save();
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const p = pts[i%n];
    const p2 = pts[(i+1)%n];
    const dx = p2.x-p.x, dy = p2.y-p.y;
    const dl = Math.sqrt(dx*dx+dy*dy)||1;
    const nx = -dy/dl, ny = dx/dl;
    if(i===0) ctx.moveTo(p.x+nx*course.width/2, p.y+ny*course.width/2);
    else ctx.lineTo(p.x+nx*course.width/2, p.y+ny*course.width/2);
  }
  for(let i=n;i>=0;i--){
    const p = pts[i%n];
    const p2 = pts[(i+1)%n];
    const dx = p2.x-p.x, dy = p2.y-p.y;
    const dl = Math.sqrt(dx*dx+dy*dy)||1;
    const nx = -dy/dl, ny = dx/dl;
    ctx.lineTo(p.x-nx*course.width/2, p.y-ny*course.width/2);
  }
  ctx.closePath();

  let roadColor = '#444';
  let lineColor = '#fff';
  if(d==='magazine'){ roadColor='#5a4a6a'; lineColor='#ff6b9d'; }
  else if(d==='ukiyoe'){ roadColor='#3a3a2a'; lineColor='#d4c9a8'; }
  else if(d==='cyber'){ roadColor='#0a1a2a'; lineColor='#0ff'; }
  ctx.fillStyle = roadColor;
  ctx.fill();
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.beginPath();
  for(let i=0;i<n;i++){
    const p = pts[i];
    if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
  ctx.closePath();
  ctx.strokeStyle = d==='cyber' ? 'rgba(0,255,255,0.4)' : 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.setLineDash([20,20]);
  ctx.stroke();
  ctx.setLineDash([]);

  const sp = pts[START_IDX];
  const sp2 = pts[(START_IDX+6)%n];
  const sdx = sp2.x-sp.x, sdy = sp2.y-sp.y;
  const sdl = Math.sqrt(sdx*sdx+sdy*sdy)||1;
  const snx = -sdy/sdl, sny = sdx/sdl;
  ctx.beginPath();
  ctx.moveTo(sp.x+snx*course.width/2, sp.y+sny*course.width/2);
  ctx.lineTo(sp.x-snx*course.width/2, sp.y-sny*course.width/2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 8;
  ctx.setLineDash([10,10]);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

function drawRacer(r){
  ctx.save();
  ctx.translate(r.x, r.y);

  ctx.beginPath();
  ctx.arc(2, 3, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = r.color.hex;
  ctx.fill();
  ctx.strokeStyle = r.isMe ? '#fff' : 'rgba(0,0,0,0.4)';
  ctx.lineWidth = r.isMe ? 3 : 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(-4, -5, BALL_R*0.35, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();

  ctx.fillStyle = r.color.num;
  ctx.font = `bold ${BALL_R*1.1}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(r.rank, 0, 1);

  if(r.isMe){
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R+5, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

function loop(now){
  const dt = Math.min((now - state.lastTime)/1000, 0.05);
  state.lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function buildColorPicker(){
  const picker = document.getElementById('colorPicker');
  picker.innerHTML = '';
  COLORS.forEach((c,i)=>{
    const d = document.createElement('div');
    d.className = 'color-swatch' + (i===state.myColorIdx?' selected':'');
    d.style.background = c.hex;
    d.title = c.name;
    if(c.hex==='#1a1a1a') d.style.border = '3px solid #555';
    d.addEventListener('click', ()=>{
      state.myColorIdx = i;
      buildColorPicker();
    });
    picker.appendChild(d);
  });
}

function updateCourseButtons(){
  document.querySelectorAll('.course-btn').forEach(b=>{
    b.classList.toggle('selected', parseInt(b.dataset.course)===state.courseIdx);
  });
}
function updateDesignButtons(){
  document.querySelectorAll('.design-btn').forEach(b=>{
    b.classList.toggle('selected', b.dataset.design===state.design);
  });
}

function showResult(isWin){
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');
  if(isWin){
    title.textContent = '🏆 VICTORY! 🏆';
    title.style.color = '#ffd700';
    title.style.textShadow = '0 0 30px #ffd700';
    sub.textContent = '1位でゴール！全員のステータス公開';
  } else {
    title.textContent = 'RESULT';
    title.style.color = '#0af';
    title.style.textShadow = '0 0 20px #0af';
    sub.textContent = 'レース終了！全員のステータス公開';
  }

  const sorted = state.racers.slice().sort((a,b)=>{
    if(a.finished && b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.totalProgress - a.totalProgress;
  });

  const tbody = document.getElementById('resultBody');
  let html = '';
  sorted.forEach((r)=>{
    const total = r.speed + r.accel + r.turn;
    const cls = (r.isMe?'me ':'') + (r.rank===1?'winner':'');
    const barCls = r.isMe ? 'stat-bar me-bar' : 'stat-bar';
    html += `<tr class="${cls}">
      <td>${r.rank}位</td>
      <td><span class="res-dot" style="background:${r.color.hex}"></span> ${r.color.name}${r.isMe?' (俺)':''}</td>
      <td><div class="stat-bar-wrap"><div class="${barCls}" style="width:${r.speed/50*100}%"></div></div><span class="stat-val">${r.speed}</span></td>
      <td><div class="stat-bar-wrap"><div class="${barCls}" style="width:${r.accel/50*100}%"></div></div><span class="stat-val">${r.accel}</span></td>
      <td><div class="stat-bar-wrap"><div class="${barCls}" style="width:${r.turn/50*100}%"></div></div><span class="stat-val">${r.turn}</span></td>
      <td class="total-cell">${total}</td>
    </tr>`;
  });
  tbody.innerHTML = html;

  const footer = document.getElementById('resultFooter');
  if(isWin){
    footer.innerHTML = 'つぎはこちら → <a href="study.html">study.html</a>';
  } else {
    footer.innerHTML = '';
  }

  document.getElementById('result').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('lapInfo').style.display = 'none';
  document.getElementById('pedals').style.display = 'none';
  document.getElementById('spectate').style.display = 'none';
}

function startRace(){
  state.racers = makeRacers();
  state.running = true;
  state.finished = false;
  state.myFinished = false;
  state.raceStarted = false;
  state.countdown = 3;
  state.countdownTimer = 0;
  state.accelInput = false;
  state.accelCharge = 0;
  state.brakeInput = false;
  state.playerWon = false;
  state.camX = state.racers[0].x;
  state.camY = state.racers[0].y;

  document.getElementById('hud').style.display = 'block';
  document.getElementById('lapInfo').style.display = 'block';
  document.getElementById('pedals').style.display = 'flex';
  document.getElementById('countdown').style.display = 'flex';
  document.getElementById('cdText').textContent = '3';
  document.getElementById('victory').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('spectate').style.display = 'none';
  document.getElementById('accelFill').style.width = '0%';

  accelBtn.classList.remove('active');
  brakeBtn.classList.remove('active');

  updateHUD();
  state.lastTime = performance.now();
}

resize();
buildColorPicker();
updateCourseButtons();
updateDesignButtons();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
