<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プログラミング記号単語帳【前編】</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        .intro { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-btn { background: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-btn:hover { background: #2980b9; transform: translateY(-2px); }
        .card-btn.active { background: #e74c3c; }
        #detail-box { background: #f9f9f9; border-left: 5px solid #e74c3c; padding: 20px; border-radius: 0 8px 8px 0; display: none; }
        #detail-rank { font-size: 14px; color: #e74c3c; font-weight: bold; margin: 0; }
        #detail-title { font-size: 24px; margin: 5px 0 15px 0; color: #2c3e50; }
        #detail-desc { font-size: 16px; line-height: 1.6; margin-bottom: 15px; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 6px; overflow-x: auto; font-family: 'Courier New', Courier, monospace; }
        .nav-text { text-align: center; color: #7f8c8d; font-size: 14px; margin-top: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1>コード記号単語帳 【前編】</h1>
    <p class="intro">1位〜25位の記号を収録。クリックすると意味とコード例が表示されます！</p>

    <!-- 記号のボタン一覧 -->
    <div class="grid" id="button-grid"></div>

    <!-- 詳細表示エリア -->
    <div id="detail-box">
        <p id="detail-rank"></p>
        <h2 id="detail-title"></h2>
        <p id="detail-desc"></p>
        <strong>コードでの使われ方（例）：</strong>
        <pre><code id="detail-code"></code></pre>
    </div>

    <p class="nav-text">※暗記できたら、チャットに戻って「中編をちょうだい」と教えてくださいね！</p>
</div>

<script>
// 1位〜25位のデータ
const signData = [
    { rank: 1, sign: "( )", name: "丸かっこ", desc: "命令を実行するときにデータを中に入れたり、計算の優先順位を決めたりする、全言語で必須の超最重要記号です。", code: "print(\"こんにちは\")\nval = (1 + 2) * 3" },
    { rank: 2, sign: '\" \"', name: "ダブルクォート", desc: "文字を囲むための記号です。これに囲まれた部分は、命令ではなくただの「文章（文字列）」として扱われます。", code: "let text = \"ホームページを作る\"" },
    { rank: 3, sign: "\' \'", name: "シングルクォート", desc: "ダブルクォートと全く同じ役割です。言語や好みによって使い分けられますが、文章を表現するのに必須です。", code: "let text = 'ホームページを作る'" },
    { rank: 4, sign: "{ }", name: "波かっこ", desc: "いくつかの命令を一つの「グループ（ブロック）」としてまとめる箱の役割をします。条件分岐やループで大活躍します。", code: "if (score > 80) {\n    print(\"合格です！\")\n}" },
    { rank: 5, sign: "[ ]", name: "角かっこ", desc: "複数のデータをまとめて一つのロッカーに保管する「配列（リスト）」を作るときや、その中身を取り出すときに使います。", code: "let fruits = [\"りんご\", \"みかん\", \"バナナ\"];\nprint(fruits[0]); // りんごを取り出す" },
    { rank: 6, sign: ";", name: "セミコロン", desc: "文章の「句点（。）」と同じです。プログラムの一行がここで終わり、次の命令に移ることをパソコンに伝えます。", code: "let x = 10;\nlet y = 20;" },
    { rank: 7, sign: ",", name: "カンマ", desc: "データや設定を「区切る」ために使います。リストの中にたくさんの要素を並べるときなどに必須です。", code: "let colors = [\"赤\", \"青\", \"黄\"];" },
    { rank: 8, sign: ".", name: "ドット", desc: "特定のデータや機能が持っている「中身」や「命令」を呼び出すための繋ぎ役です。「〜の」と脳内変換すると分かりやすいです。", code: "user.name = \"太郎\"; // userのname（名前）" },
    { rank: 9, sign: "=", name: "イコール", desc: "算数の「同じ」という意味ではなく、プログラミングでは「右側のデータを、左側の箱の中に代入する（入れる）」という意味になります。", code: "let age = 20; // 20をageに入れる" },
    { rank: 10, sign: ":", name: "コロン", desc: "データの名前と中身をペアにするときや、条件式の区切り（Pythonなど）に使われる重要な仕切り線です。", code: "let user = { name: \"太郎\", age: 20 };" },
    { rank: 11, sign: "+", name: "プラス", desc: "数字の足し算はもちろん、文字と文字をガッチャンコと「結合」して一つの文章にするときにもよく使います。", code: "let message = \"こんにちは、\" + \"太郎さん\";" },
    { rank: 12, sign: "-", name: "マイナス", desc: "数字の引き算をするとき、または「-5」のように数字がマイナス（負の数）であることを示すときに使います。", code: "let damage = attack - defense;" },
    { rank: 13, sign: "*", name: "アスタリスク", desc: "プログラミングの世界での「掛け算（×）」の記号です。キーボードに入力しやすいため、これが使われます。", code: "let total = price * taxRate;" },
    { rank: 14, sign: "/", name: "スラッシュ", desc: "プログラミングの世界での「割り算（÷）」の記号です。また、ファイルの保存場所（パス）を区切るときにも使います。", code: "let average = total / 5;" },
    { rank: 15, sign: "!", name: "エクスプラメーション", desc: "「否定（〜ではない）」を意味します。True（正しい）をFalse（間違い）にひっくり返したいときなどに先頭につけます。", code: "if (!isLoggedIn) {\n    print(\"ログインしてください\")\n}" },
    { rank: 16, sign: "?", name: "クエスチョン", desc: "「もし〜なら」という条件分岐を、たった1行で短く書くとき（三項演算子）や、データがあるか不確定なときに使います。", code: "let status = (age >= 18) ? \"大人\" : \"子供\";" },
    { rank: 17, sign: "<", name: "小なり", desc: "左側が右側よりも「小さい（未満）」かどうかを比べるための比較演算子です。", code: "if (count < 10) { ... }" },
    { rank: 18, sign: ">", name: "大なり", desc: "左側が右側よりも「大きい（超える）」かどうかを比べるための比較演算子です。", code: "if (score > 80) { ... }" },
    { rank: 19, sign: "&", name: "アンパサンド", desc: "「かつ（And）」の条件を作るときや、一部の言語でデータの保存場所（アドレス）を直接指し示すときに使います。", code: "// 主に2つ連ねて使われます" },
    { rank: 20, sign: "|", name: "パイプ", desc: "「または（Or）」の条件を作るときに使います。キーボードでは「Shift + ￥キー」などで入力できる縦線です。", code: "// 主に2つ連ねて使われます" },
    { rank: 21, sign: "%", name: "パーセント", desc: "割り算をしたときの「余り」を計算する記号です。偶数・奇数の判定（2で割って余りが0か）などで超頻出します。", code: "let amari = 10 % 3; // 答えは 1" },
    { rank: 22, sign: "$", name: "ドル", desc: "言語（PHPなど）で「これは変数（箱）だよ」と目印にしたり、文字列の中に変数を埋め込むとき（JavaScript等）に使います。", code: "let msg = `こんにちは、${name}さん`;" },
    { rank: 23, sign: "#", name: "シャープ/ハッシュ", desc: "ホームページのデザイン（CSS）で特定のIDを指定するときや、Pythonなどの言語で「ここから右はメモ書き（コメント）」とするときに使います。", code: "# これはPythonのコメントです\n#html-id { color: red; }" },
    { rank: 24, sign: "@", name: "アットマーク", desc: "プログラムに特殊な味付けをする「デコレータ」という高度な機能や、CSSで画面サイズに応じた設定（メディアクエリ）をするときに使います。", code: "@media (max-width: 600px) { ... }" },
    { rank: 25, sign: "_", name: "アンダースコア", desc: "プログラミングではスペース（空白）を名前に使えないため、単語と単語を繋いで読みやすくするための「接着剤」として使います。", code: "let user_login_count = 5;" }
];

const grid = document.getElementById('button-grid');
const detailBox = document.getElementById('detail-box');
const dRank = document.getElementById('detail-rank');
const dTitle = document.getElementById('detail-title');
const dDesc = document.getElementById('detail-desc');
const dCode = document.getElementById('detail-code');

// ボタンを生成
signData.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.textContent = item.sign;
    btn.onclick = () => {
        // アクティブ状態の切り替え
        document.querySelectorAll('.card-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 詳細を表示
        dRank.textContent = `第 ${item.rank} 位`;
        dTitle.textContent = `${item.sign} （${item.name}）`;
        dDesc.textContent = item.desc;
        dCode.textContent = item.code;
        detailBox.style.display = 'block';
    };
    grid.appendChild(btn);
});
</script>

</body>
</html>
