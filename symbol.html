<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語帳【前編】1-25位</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 15px; }
        .container { max-width: 100%; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { text-align: center; color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; font-size: 20px; }
        .intro { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .card-btn { background: #3498db; color: white; border: none; padding: 15px 5px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; }
        .card-btn.active { background: #e74c3c !important; }
        #detail-box { background: #f9f9f9; border-left: 5px solid #e74c3c; padding: 15px; border-radius: 0 8px 8px 0; display: none; margin-top: 15px; box-sizing: border-box; }
        #detail-rank { font-size: 12px; color: white; font-weight: bold; background: #e74c3c; display: inline-block; padding: 2px 6px; border-radius: 4px; margin: 0; }
        #detail-title { font-size: 18px; margin: 8px 0 10px 0; color: #2c3e50; }
        #detail-desc { font-size: 14px; line-height: 1.5; margin-bottom: 12px; color: #444; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 13px; margin: 0; white-space: pre; }
    </style>
</head>
<body>

<div class="container">
    <h1>コード記号単語帳【前編】</h1>
    <p class="intro">1位〜25位の超最重要記号です。</p>

    <div class="grid" id="button-grid"></div>

    <div id="detail-box">
        <p id="detail-rank"></p>
        <h2 id="detail-title"></h2>
        <p id="detail-desc"></p>
        <span style="font-size: 13px; font-weight: bold;">コードでの例：</span>
        <pre><code id="detail-code"></code></pre>
    </div>
</div>

<script>
const signData = [
    { rank: 1, sign: "( )", name: "丸かっこ", desc: "命令を実行するときにデータを中に入れたり、計算の優先順位を決めたりする必須記号です。", code: "print(\"こんにちは\")\nval = (1 + 2) * 3" },
    { rank: 2, sign: '\" \"', name: "ダブルクォート", desc: "文字を囲むための記号です。囲まれた部分はただの「文章」になります。", code: "let text = \"ホームページを作る\"" },
    { rank: 3, sign: "\' \'", name: "シングルクォート", desc: "ダブルクォートと同じ役割です。文章を表現するのに必須です。", code: "let text = 'ホームページを作る'" },
    { rank: 4, sign: "{ }", name: "波かっこ", desc: "いくつかの命令を一つの「グループ」としてまとめる箱の役割をします。", code: "if (score > 80) {\n    print(\"合格！\")\n}" },
    { rank: 5, sign: "[ ]", name: "角かっこ", desc: "複数のデータをまとめて一つのロッカーに保管する「配列」を作ります。", code: "let fruits = [\"りんご\", \"バナナ\"];" },
    { rank: 6, sign: ";", name: "セミコロン", desc: "文章の「句点（。）」と同じです。プログラムの一行がここで終わる合図です。", code: "let x = 10;\nlet y = 20;" },
    { rank: 7, sign: ",", name: "カンマ", desc: "データや設定を「区切る」ために使います。リストに並べるときに必須です。", code: "let colors = [\"赤\", \"青\", \"黄\"];" },
    { rank: 8, sign: ".", name: "ドット", desc: "特定のデータが持っている「中身」や「命令」を呼び出す繋ぎ役です。", code: "user.name = \"太郎\";" },
    { rank: 9, sign: "=", name: "イコール", desc: "プログラミングでは「右側のデータを、左側の箱の中に入れる」意味になります。", code: "let age = 20;" },
    { rank: 10, sign: ":", name: "コロン", desc: "データの名前と中身をペアにするときや、条件式の区切り線として使います。", code: "let user = { name: \"太郎\", age: 20 };" },
    { rank: 11, sign: "+", name: "プラス", desc: "数字の足し算や、文字と文字をガッチャンコと繋ぐときに使います。", code: "let message = \"ハロー、\" + \"太郎さん\";" },
    { rank: 12, sign: "-", name: "マイナス", desc: "数字の引き算をするとき、またはマイナスの数（負の数）を示すときに使います。", code: "let damage = attack - defense;" },
    { rank: 13, sign: "*", name: "アスタリスク", desc: "プログラミングの世界での「掛け算（×）」の記号です。", code: "let total = price * taxRate;" },
    { rank: 14, sign: "/", name: "スラッシュ", desc: "プログラミングでの「割り算（÷）」や、ファイルの保存場所の区切りです。", code: "let average = total / 5;" },
    { rank: 15, sign: "!", name: "否定", desc: "「〜ではない」を意味します。正しい(True)と間違い(False)を反転させます。", code: "if (!isLoggedIn) { ... }" },
    { rank: 16, sign: "?", name: "クエスチョン", desc: "「もし〜なら」という条件分岐をたった1行で短く書くときに使います。", code: "let status = (age >= 18) ? \"大人\" : \"子供\";" },
    { rank: 17, sign: "<", name: "小なり", desc: "左側が右側よりも「小さい」かどうかを比べるための記号です。", code: "if (count < 10) { ... }" },
    { rank: 18, sign: ">", name: "大なり", desc: "左側が右側よりも「大きい」かどうかを比べるための記号です。", code: "if (score > 80) { ... }" },
    { rank: 19, sign: "&", name: "アンパサンド", desc: "「かつ（And）」の条件を作るときや、データの保存場所を指すときに使います。", code: "// 主に2つ連ねて使われます" },
    { rank: 20, sign: "|", name: "パイプ", desc: "「または（Or）」の条件を作るときに使います。縦線の記号です。", code: "// 主に2つ連ねて使われます" },
    { rank: 21, sign: "%", name: "パーセント", desc: "割り算をしたときの「余り」を計算します。偶数・奇数の判定などで使います。", code: "let amari = 10 % 3; // 1" },
    { rank: 22, sign: "$", name: "ドル", desc: "特定の言語で変数名の頭につけたり、文章の中に変数を埋め込むときに使います。", code: "let msg = `こんにちは、${name}さん`;" },
    { rank: 23, sign: "#", name: "シャープ", desc: "CSSでのID指定や、Pythonなどの言語で「ここから右はメモ書き」とするときに使います。", code: "# コメントです" },
    { rank: 24, sign: "@", name: "アットマーク", desc: "プログラムに特殊な味付けをする機能や、CSSの画面サイズ設定などで使います。", code: "@media (max-width: 600px) { ... }" },
    { rank: 25, sign: "_", name: "アンダースコア", desc: "スペースを使えない場所に、単語を繋いで読みやすくする接着剤です。", code: "let user_login_count = 5;" }
];

const grid = document.getElementById('button-grid');
const detailBox = document.getElementById('detail-box');
const dRank = document.getElementById('detail-rank');
const dTitle = document.getElementById('detail-title');
const dDesc = document.getElementById('detail-desc');
const dCode = document.getElementById('detail-code');

signData.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.textContent = item.sign;
    btn.onclick = () => {
        document.querySelectorAll('.card-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        dRank.textContent = `第 ${item.rank} 位`;
        dTitle.textContent = `${item.sign} （${item.name}）`;
        dDesc.textContent = item.desc;
        dCode.textContent = item.code;
        detailBox.style.display = 'block';
        detailBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    grid.appendChild(btn);
});
</script>
</body>
</html>

<html lang="ja">
<head>

    <title>単語帳【中編】26-50位</title>

</head>
<body>

<div class="container">
    <h1>コード記号単語帳【中編】</h1>
    <p class="intro">26位〜50位の重要記号です。</p>

    <div class="grid" id="button-grid"></div>

    <div id="detail-box">
        <p id="detail-rank"></p>
        <h2 id="detail-title"></h2>
        <p id="detail-desc"></p>
        <span style="font-size: 13px; font-weight: bold;">コードでの例：</span>
        <pre><code id="detail-code"></code></pre>
    </div>
</div>

<script>
const signData = [
    { rank: 26, sign: "\\", name: "バックスラッシュ", desc: "キーボードの「￥」と同じです。改行などの特殊な命令を文字に混ぜたり、記号をただの文字に変える（エスケープ）ときに使います。", code: "console.log(\"こんにちは\\nさようなら\");" },
    { rank: 27, sign: "^", name: "キャレット", desc: "特殊な計算に使われたり、検索システム（正規表現）で「ここから始まる文字」を指定するときに使います。", code: "/^Apple/ // 「Apple」から始まる文章にヒット" },
    { rank: 28, sign: "~", name: "チルダ", desc: "低いレベルの数字計算（ビット反転）や、アドレスで「個人のページ」を表す名残りで使われます。", code: "let result = ~value;" },
    { rank: 29, sign: "==", name: "二連イコール", desc: "「左と右のデータは同じですか？」と質問する記号です。もし同じならTrue（正しい）を返します。", code: "if (password == \"1234\") { ... }" },
    { rank: 30, sign: "!=", name: "否定イコール", desc: "「左と右のデータは違っていますか？」と質問する記号です。「〜ではないとき」という条件を作ります。", code: "if (status != \"退会\") { ... }" },
    { rank: 31, sign: "++", name: "インクリメント", desc: "数字を「1だけ増やす」記号です。スコア加算やカウンターで毎日のように使われます。", code: "count++; // countが1増える" },
    { rank: 32, sign: "--", name: "デクリメント", desc: "数字を「1だけ減らす」記号です。制限時間をカウントダウンするときなどに使います。", code: "timer--; // timerが1減る" },
    { rank: 33, sign: "+=", name: "プラス代入", desc: "「今の数字に、新しく右側の数字を足して上書きする」ショートカット記号です。", code: "score += 10; // score = score + 10 と同じ" },
    { rank: 34, sign: "-=", name: "マイナス代入", desc: "「今の数字から、右側の数字を引いて上書きする」ショートカット記号です。", code: "hp -= attack;" },
    { rank: 35, sign: "&&", name: "二連アンパサンド", desc: "「A かつ B（両方とも正しいとき）」という厳しめの条件を組み立てるときに使います。", code: "if (age >= 18 && premiumUser == true)" },
    { rank: 36, sign: "||", name: "二連パイプ", desc: "「A または B（どちらか片方でも正しいとき）」という緩めの条件を作るときに使います。", code: "if (isWeekend || isHoliday)" },
    { rank: 37, sign: "=>", name: "アロー", desc: "JavaScriptなどで大人気で、短い命令（関数）をサクッとその場で作る矢印記号です。", code: "const double = (x) => x * 2;" },
    { rank: 38, sign: "->", name: "アロー2", desc: "PHPなどの言語で、データや機能の「中身を呼び出す」ために使われます。", code: "$user->getName();" },
    { rank: 39, sign: "===", name: "三連イコール", desc: "二連イコールよりさらに厳密な比較です。データの「種類（型）」まで完全に同じか見抜きます。", code: "if (value === 10) { ... }" },
    { rank: 40, sign: "!==", name: "三連否定イコール", desc: "三連イコールの逆で、「中身もデータの種類も完全に違っていますか？」をチェックします。", code: "if (input !== false)" },
    { rank: 41, sign: "//", name: "二連スラッシュ", desc: "「ここから右側は全部ただのメモ書き（コメント）だよ」と伝える、実行されない文字です。", code: "// ここで消費税の計算をしています" },
    { rank: 42, sign: "/* */", name: "ブロックコメント", desc: "この記号で囲まれた部分は、何行あってもすべて「メモ書き」になります。", code: "/*\n何行あっても\nコメントになります\n*/" },
    { rank: 43, sign: "/** */", name: "ドキュメントコメント", desc: "ここに仕様を書いておくと、後から自動で説明書（ドキュメント）を書き出してくれるメモ枠です。", code: "/** @param {string} name */" },
    { rank: 44, sign: "**", name: "二連アスタリスク", desc: "「べき乗（〇乗）」を計算する記号です。「5の2乗(25)」などを計算します。", code: "let area = 5 ** 2;" },
    { rank: 45, sign: "??", name: "ヌル合体", desc: "「もし左側が空っぽだったら、代わりに右側のデータを使ってね」というエラー防止記号です。", code: "let name = inputName ?? \"名無しさん\";" },
    { rank: 46, sign: "?.", name: "オプショナルチェーン", desc: "「データがあれば呼び出し、無ければエラーにせず無視する」という超安全記号です。", code: "let city = user?.address?.city;" },
    { rank: 47, sign: "...", name: "スプレッド演算子", desc: "箱に入った複数のデータを、まるでパラパラとぶちまけるように「展開」する記号です。", code: "let newArr = [...oldArr, 4, 5];" },
    { rank: 48, sign: "::", name: "ダブルコロン", desc: "C++やPHP等で、設計図（クラス）の持ち主を直接指定して中身を引っ張り出します。", code: "User::MIN_AGE = 18;" },
    { rank: 49, sign: "<=", name: "以下", desc: "左側が右側「以下（同じか、それより小さい）」かどうかを比べるための記号です。", code: "if (age <= 12) { ... }" },
    { rank: 50, sign: ">=", name: "以上", desc: "左側が右側「以上（同じか、それより大きい）」かどうかを比べるための記号です。", code: "if (score >= 70) { ... }" }
];

const grid = document.getElementById('button-grid');
const detailBox = document.getElementById('detail-box');
const dRank = document.getElementById('detail-rank');
const dTitle = document.getElementById('detail-title');
const dDesc = document.getElementById('detail-desc');
const dCode = document.getElementById('detail-code');

signData.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.textContent = item.sign;
    btn.onclick = () => {
        document.querySelectorAll('.card-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        dRank.textContent = `第 ${item.rank} 位`;
        dTitle.textContent = `${item.sign} （${item.name}）`;
        dDesc.textContent = item.desc;
        dCode.textContent = item.code;
        detailBox.style.display = 'block';
        detailBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    grid.appendChild(btn);
});
</script>
