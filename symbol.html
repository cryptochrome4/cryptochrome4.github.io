<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語帳【前編】1-60位</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 10px; }
        .container { max-width: 100%; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { text-align: center; color: #2c3e50; font-size: 18px; margin: 5px 0 15px 0; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .list-item { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; padding: 12px; box-sizing: border-box; }
        .rank-badge { font-size: 11px; font-weight: bold; color: white; display: inline-block; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; background-color: #3498db; }
        .item-title { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; color: #2c3e50; }
        .item-desc { font-size: 13px; line-height: 1.4; margin: 0 0 8px 0; color: #555; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 8px; border-radius: 4px; overflow-x: auto; font-family: monospace; font-size: 12px; margin: 0; white-space: pre; }
    </style>
</head>
<body>

<div class="container">
    <h1>コード記号単語帳【前編：1-60位】</h1>
    <div id="list-container"></div>
</div>

<script>
const signData = [
    { rank: 1, sign: "( )", name: "丸かっこ", desc: "命令を実行するときにデータを中に入れたり、計算の優先順位を決めたりする必須記号です。", code: "print(\"こんにちは\")\nval = (1 + 2) * 3" },
    { rank: 2, sign: '\" \"', name: "ダブルクォート", desc: "文字を囲むための記号です。囲まれた部分はただの「文章」になります。", code: "let text = \"ホームページを作る\"" },
    { rank: 3, sign: "\' \'", name: "シングルクォート", desc: "ダブルクォートと同じ役割です。文章を表現するのに必須です。", code: "let text = 'ホームページを作る'" },
    { rank: 4, sign: "{ }", name: "波かっこ", desc: "いくつかの命令を一つの「グループ」としてまとめる箱の役割をします。", code: "if (score > 80) {\n    print(\"合格！\")\n}" },
    { rank: 5, sign: "[ ]", name: "角かっこ", desc: "複数のデータをまとめて一つのロッカーに保管する「配列」を作ります。", code: "let fruits = [\"りんご\", \"バナナ\"];" },
    { rank: 6, sign: ";", name: "セミコロン", desc: "文章の「句点（。）」と同じです。プログラムの一行がここで終わる合図です。", code: "let x = 10;\nlet y = 20;" },
    { rank: 7, sign: ",", name: "カンマ", desc: "データや設定を「区切る」ために使います。リストに並べるときに必須です。", code: "let colors = [\"赤\", \"青\", \"黄\"];" },
    { rank: 8, sign: ".", name: "ドット", desc: "特定のデータが持っている「中身」や「命令」を呼び出す繋ぎ役です。", code: "user.name = \"太郎\";" },
    { rank: 9, sign: "=", name: "イコール", desc: "プログラミングでは「右側のデータを、左側の箱の中に入れる」意味になります。", code: "let age = 20;" },
    { rank: 10, sign: ":", name: "コロン", desc: "データの名前と中身をペアにするときや、条件式の区切り線として使います。", code: "let user = { name: \"太郎\", age: 20 };" },
    { rank: 11, sign: "+", name: "プラス", desc: "数字の足し算や、文字と文字を繋ぐときに使います。", code: "let message = \"ハロー、\" + \"太郎さん\";" },
    { rank: 12, sign: "-", name: "マイナス", desc: "数字の引き算をするとき、またはマイナスの数（負の数）を示すときに使います。", code: "let damage = attack - defense;" },
    { rank: 13, sign: "*", name: "アスタリスク", desc: "プログラミングの世界での「掛け算（×）」の記号です。", code: "let total = price * taxRate;" },
    { rank: 14, sign: "/", name: "スラッシュ", desc: "プログラミングでの「割り算（÷）」や、ファイルの保存場所の区切りです。", code: "let average = total / 5;" },
    { rank: 15, sign: "!", name: "否定", desc: "「〜ではない」を意味します。正しい(True)と間違い(False)を反転させます。", code: "if (!isLoggedIn) { ... }" },
    { rank: 16, sign: "?", name: "クエスチョン", desc: "「もし〜なら」という条件分岐をたった1行で短く書くときに使います。", code: "let status = (age >= 18) ? \"大人\" : \"子供\";" },
    { rank: 17, sign: "<", name: "小なり", desc: "左側が右側よりも「小さい」かどうかを比べるための記号です。", code: "if (count < 10) { ... }" },
    { rank: 18, sign: ">", name: "大なり", desc: "左側が右側よりも「大きい」かどうかを比べるための記号です。", code: "if (score > 80) { ... }" },
    { rank: 19, sign: "&", name: "アンパサンド", desc: "「かつ（And）」の条件を作るときや、データの保存場所を指すときに使います。", code: "// 主に2つ連ねて使われます" },
    { rank: 20, sign: "|", name: "パイプ", desc: "「または（Or）」の条件を作るときに使います。縦線の記号です。", code: "// 主に2つ連ねて使われます" },
    { rank: 21, sign: "%", name: "パーセント", desc: "割り算をしたときの「余り」を計算します。偶数・奇数の判定などで使います。", code: "let amari = 10 % 3; // 1" },
    { rank: 22, sign: "$", name: "ドル", desc: "特定の言語で変数名の頭につけたり、文章の中に変数を埋め込むときに使います。", code: "let msg = `こんにちは、${name}さん`;" },
    { rank: 23, sign: "#", name: "シャープ", desc: "CSSでのID指定や、Pythonなどの言語で「ここから右はメモ書き」とするときに使います。", code: "# コメントです" },
    { rank: 24, sign: "@", name: "アットマーク", desc: "プログラムに特殊な味付けをする機能や、CSSの画面サイズ設定などで使います。", code: "@media (max-width: 600px) { ... }" },
    { rank: 25, sign: "_", name: "アンダースコア", desc: "スペースを使えない場所に、単語を繋いで読みやすくする接着剤です。", code: "let user_login_count = 5;" },
    { rank: 26, sign: "\\", name: "バックスラッシュ", desc: "改行などの特殊な命令を文字に混ぜたり、記号をただの文字に変えるときに使います。", code: "console.log(\"こんにちは\\nさようなら\");" },
    { rank: 27, sign: "^", name: "キャレット", desc: "特殊な計算や、検索システム（正規表現）で「ここから始まる文字」を指定します。", code: "/^Apple/ // Appleから始まる文章" },
    { rank: 28, sign: "~", name: "チルダ", desc: "低いレベルの数字計算（ビット反転）や、アドレスで「個人のページ」を表す名残りです。", code: "let result = ~value;" },
    { rank: 29, sign: "==", name: "二連イコール", desc: "「左と右のデータは同じですか？」とパソコンに質問する条件用の記号です。", code: "if (password == \"1234\") { ... }" },
    { rank: 30, sign: "!=", name: "否定イコール", desc: "「左と右のデータは違っていますか？」と質問する記号です。", code: "if (status != \"退会\") { ... }" },
    { rank: 31, sign: "++", name: "インクリメント", desc: "入っている数字を「1だけ増やす」記号です。カウンターなどで必須です。", code: "count++; // 1増える" },
    { rank: 32, sign: "--", name: "デクリメント", desc: "入っている数字を「1だけ減らす」記号です。カウントダウンなどで使います。", code: "timer--; // 1減る" },
    { rank: 33, sign: "+=", name: "プラス代入", desc: "「今の数字に新しく右側の数字を足して上書きする」ショートカット記号です。", code: "score += 10; // score = score + 10" },
    { rank: 34, sign: "-=", name: "マイナス代入", desc: "「今の数字から右側の数字を引いて上書きする」ショートカット記号です。", code: "hp -= attack;" },
    { rank: 35, sign: "&&", name: "二連アンパサンド", desc: "「A かつ B（両方とも正しいとき）」という厳しめの条件を作ります。", code: "if (age >= 18 && premiumUser == true)" },
    { rank: 36, sign: "||", name: "二連パイプ", desc: "「A または B（どちらか片方でも正しいとき）」という緩めの条件を作ります。", code: "if (isWeekend || isHoliday)" },
    { rank: 37, sign: "=>", name: "アロー", desc: "短い命令（関数）をサクッとその場で作る矢印記号です。", code: "const double = (x) => x * 2;" },
    { rank: 38, sign: "->", name: "アロー2", desc: "PHP等の言語で、データや機能の「中身を呼び出す」ために使われます。", code: "$user->getName();" },
    { rank: 39, sign: "===", name: "三連イコール", desc: "二連イコールより厳密で、データの種類（型）まで完全に同じか見抜きます。", code: "if (value === 10) { ... }" },
    { rank: 40, sign: "!==", name: "三連否定イコール", desc: "中身もデータの種類も「完全に違っていますか？」をチェックします。", code: "if (input !== false)" },
    { rank: 41, sign: "//", name: "二連スラッシュ", desc: "「ここから右側は全部ただのメモ書き（コメント）」と伝える、実行されない文字です。", code: "// ここで消費税の計算をしています" },
    { rank: 42, sign: "/* */", name: "ブロックコメント", desc: "この記号で囲まれた部分は、何行あってもすべて「メモ書き」になります。", code: "/*\n何行あっても\nコメントになります\n*/" },
    { rank: 43, sign: "/** */", name: "ドキュメントコメント", desc: "ここに仕様を書くと、後から自動で説明書を書き出してくれる便利なメモ枠です。", code: "/** @param {string} name */" },
    { rank: 44, sign: "**", name: "二連アスタリスク", desc: "「べき乗（〇乗）」を計算する記号です。「5の2乗(25)」などを計算します。", code: "let area = 5 ** 2;" },
    { rank: 45, sign: "??", name: "ヌル合体", desc: "「もし左側が空っぽだったら、代わりに右側の身代わりデータを使ってね」という記号です。", code: "let name = inputName ?? \"名無しさん\";" },
    { rank: 46, sign: "?.", name: "オプショナルチェーン", desc: "「データがあれば呼び出し、無ければエラーにせず無視する」という超安全記号です。", code: "let city = user?.address?.city;" },
    { rank: 47, sign: "...", name: "スプレッド演算子", desc: "箱に入った複数のデータを、パラパラとぶちまけるように「展開」する記号です。", code: "let newArr = [...oldArr, 4, 5];" },
    { rank: 48, sign: "::", name: "ダブルコロン", desc: "C++やPHP等で、設計図（クラス）の持ち主を直接指定して中身を引っ張り出します。", code: "User::MIN_AGE = 18;" },
    { rank: 49, sign: "<=", name: "以下", desc: "左側が右側「以下」かどうかを比べる記号です。", code: "if (age <= 12) { ... }" },
    { rank: 50, sign: ">=", name: "以上", desc: "左側が右側「以上」かどうかを比べる記号です。", code: "if (score >= 70) { ... }" },
    { rank: 51, sign: "<<", name: "左シフト", desc: "数字を2進数に変換し、桁を左にずらす計算記号。ゲームの高速化などで使われます。", code: "let result = 2 << 1; // 4になる" },
    { rank: 52, sign: ">>", name: "右シフト", desc: "2進数の桁を右にずらす計算。画像処理や音声解析などで使われます。", code: "let result = 4 >> 1; // 2になる" },
    { rank: 53, sign: "&=", name: "ビットAnd代入", desc: "2進数の計算（And）をして、結果をそのまま元の箱に上書き保存します。", code: "flags &= mask;" },
    { rank: 54, sign: "|=", name: "ビットOr代入", desc: "2進数の計算（Or）をして、結果をそのまま元の箱に上書き保存します。", code: "flags |= mask;" },
    { rank: 55, sign: "^=", name: "ビットXor代入", desc: "2進数計算の結果を上書き。データの暗号化やスイッチの切り替えで使われます。", code: "status ^= 1;" },
    { rank: 56, sign: "%=", name: "余り代入", desc: "「今の数字を右の数字で割った時の『余り』を計算し、上書きする」記号です。", code: "num %= 3;" },
    { rank: 57, sign: "*=", name: "掛け算代入", desc: "「今の数字に右の数字を掛け算して、そのまま上書きする」記号です。", code: "speed *= 1.5;" },
    { rank: 58, sign: "/=", name: "割り算代入", desc: "「今の数字を右の数字で割り算して、そのまま上書きする」記号です。", code: "hp /= 2;" },
    { rank: 59, sign: "**=", name: "べき乗代入", desc: "「今の数字を〇乗して、そのまま上書きする」記号。科学計算以外で見ません。", code: "value **= 2;" },
    { rank: 60, sign: ">>>", name: "符号なし右シフト", desc: "マイナスを無視して強制的にプラスとして右に桁をずらす計算記号です。", code: "let result = -8 >>> 1;" }
];

const container = document.getElementById('list-container');
signData.forEach(item => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
        <span class="rank-badge">第 ${item.rank} 位</span>
        <div class="item-title">${item.sign} （${item.name}）</div>
        <p class="item-desc">${item.desc}</p>
        <pre><code>${item.code}</code></pre>
    `;
    container.appendChild(div);
});
</script>
</body>

        .list-item { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; padding: 12px; box-sizing: border-box; }
        .rank-badge { font-size: 11px; font-weight: bold; color: white; display: inline-block; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; background-color: #e74c3c; }

        .goal-msg { text-align: center; font-size: 16px; font-weight: bold; color: #27ae60; margin: 30px 0 15px 0; padding-top: 15px; border-top: 2px dashed #27ae60; line-height: 1.5; }
    </style>

<body>

<div class="container">
    <h1>コード記号単語帳【完結編：61-100位】</h1>
    <div id="list-container"></div>
    <div class="goal-msg">🎉 おめでとうございます！<br>100位までスクロールして完全制覇です！</div>
</div>

<script>
const signData = [
    { rank: 61, sign: "!!", name: "二連否定", desc: "どんなデータでも強制的に「True(正しい)かFalse(間違い)か」の2択に変換します。", code: "let hasText = !(\"hello\"); // true" },
    { rank: 62, sign: "` `", name: "バッククォート", desc: "JavaScript等で、文章の中に「${変数}」の形でデータを直接埋め込める超便利文字です。", code: "let msg = `合計は ${total} 円です`;" },
    { rank: 63, sign: ":=", name: "セイウチ演算子", desc: "Python等で「データを箱に入れながら、同時にそのデータを使う」という離れ業記号です。", code: "if (n := len(list)) > 10: print(n)" },
    { rank: 64, sign: "<>", name: "不等号セット", desc: "「左と右は同じではない」という意味の古い記号。データベース（SQL）等で残っています。", code: "if (x <> y)" },
    { rank: 65, sign: "<=>", name: "宇宙船演算子", desc: "大小関係（左が大きいか、右が大きいか、同じか）を「1, -1, 0」の数字でまとめて返します。", code: "let result = a <=> b;" },
    { rank: 66, sign: "$*", name: "特殊変数1", desc: "サーバープログラム等で、外から渡されたすべてのデータを1つの文章で受け取ります。", code: "echo $*" },
    { rank: 67, sign: "$@", name: "特殊変数2", desc: "渡されたデータを「バラバラの独立した状態のまま」すべて受け取る記号です。", code: "echo $@" },
    { rank: 68, sign: "$?", name: "終了ステータス", desc: "「直前の命令が成功したか失敗したか」の結果が自動で入る箱（0なら成功）。", code: "if [ $? -eq 0 ]; then echo \"成功\"; fi" },
    { rank: 69, sign: "$$", name: "プロセスID", desc: "動いているプログラムに対してパソコンが発行した「整理番号」をのぞき見ます。", code: "echo $$" },
    { rank: 70, sign: "_", name: "単一アンダースコア", desc: "「データは受け取るけれど、私は使わないので捨てて」と伝えるゴミ箱記号です。", code: "let [first, _] = getPair();" },
    { rank: 71, sign: "__", name: "ダブルアンダースコア", desc: "Python等で裏で動く「特別な命令」の前後を挟み、名前が被らないように保護します。", code: "def __init__(self):" },
    { rank: 72, sign: "#=", name: "シャープイコール", desc: "特定のプログラミング言語で、特殊なコメントブロックを作るレア記号です。", code: "#= 独自のメモ書き" },
    { rank: 73, sign: "=begin", name: "イコールビギン", desc: "Ruby等の言語で「ここから下はすべてメモ書き（コメント）にするよ」と合図します。", code: "=begin\nここからメモ\n=end" },
    { rank: 74, sign: "<!-- -->", name: "HTMLコメント", desc: "ホームページの骨組み（HTML）の中で、画面に出さない制作メモを残す囲みです。", code: "<!-- ここは来月修正する -->" },
    { rank: 75, sign: "&nbsp;", name: "特殊文字：スペース", desc: "HTML専用の暗号。画面上で「絶対に消えない半角スペース」を開けたいときに使います。", code: "こんにちは&nbsp;さようなら" },
    { rank: 76, sign: "&lt;", name: "特殊文字：小なり", desc: "HTMLでタグと勘違いされずに、安全に画面へ「<」を表示させるための暗号です。", code: "5 &lt; 10 // 画面には「5 < 10」" },
    { rank: 77, sign: "&gt;", name: "特殊文字：大なり", desc: "HTMLの画面上に、バグを起こさず安全に「>」を表示させるための暗号です。", code: "10 &gt; 5" },
    { rank: 78, sign: "&amp;", name: "特殊文字：＆", desc: "HTMLの画面上に、安全に「&」という記号そのものを表示させるための暗号です。", code: "米 &amp; 麦" },
    { rank: 79, sign: "&quot;", name: "特殊文字：クォート", desc: "HTMLの画面上に、安全に「\"」を表示させるための暗号です。", code: "駅名は&quot;東京&quot;" },
    { rank: 80, sign: "\\n", name: "改行コード", desc: "文章を表示するときに「ここで改行してね」とシステムに伝える見えない文字です。", code: "console.log(\"1行目\\n2行目\");" },
    { rank: 81, sign: "\\r", name: "キャリッジリターン", desc: "昔の古いパソコンの改行用です。現代のブラウザでは自動無視されるので無意味です。", code: "let text = \"こんにちは\\r\";" },
    { rank: 82, sign: "\\t", name: "タブ文字", desc: "見た目を揃える隙間（空白）です。人間のためだけのもので、消しても動きます。", code: "\tlet x = 10;" },
    { rank: 83, sign: " (余白)", name: "半角スペース", desc: "見やすさのための余白です。公開時は容量削減のために自動消去されるのが普通です。", code: "let total  =  price  +  tax;" },
    { rank: 84, sign: "\\v", name: "垂直タブ", desc: "昔のプリンターで縦に隙間を空ける記号でした。現代では完全に無視される絶滅文字です。", code: "console.log(\"あ\\vい\");" },
