<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相対論もどき — B卿とP君</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { height: 100%; }
  body {
    background: #05080e;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    color: #e8f2ff;
    overflow: hidden;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    overflow: hidden;
  }
  .screen.active { display: block; }

  /* ===== オープニング ===== */
  #opening {
    background: #05080e url('img43x.jpg') center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #opening.active { display: flex; }
  #opening::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 8, 20, 0.62);
    backdrop-filter: blur(2px);
  }
  .opening-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 30px;
    max-width: 480px;
    width: 100%;
  }
  .opening-title {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ffe14a;
    text-shadow: 0 0 25px #ff8a00, 0 0 50px #b05000;
    margin-bottom: 8px;
  }
  .opening-sub {
    font-size: 0.78rem;
    color: #a9c9e8;
    letter-spacing: 3px;
    margin-bottom: 28px;
  }
  .opening-desc {
    font-size: 0.72rem;
    color: #8fb0cc;
    line-height: 1.8;
    margin-bottom: 26px;
    letter-spacing: 1px;
  }
  .start-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: 1px solid #4fc3ff;
    background: linear-gradient(160deg, #1a527a, #0a2438);
    color: #e8f8ff;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 4px;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 0 #041420, 0 15px 30px rgba(0,0,0,0.6), inset 0 0 20px rgba(79,195,255,0.2);
    transition: all 0.12s;
    margin-bottom: 12px;
  }
  .start-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #041420, 0 8px 15px rgba(0,0,0,0.6);
  }
  .mode-btn {
    display: block;
    width: 100%;
    padding: 14px 18px;
    border: 1px solid #3a5f7a;
    background: rgba(10, 25, 40, 0.85);
    color: #cbe6ff;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    margin-bottom: 10px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-btn .arrow {
    font-size: 1.2rem;
    font-weight: 900;
    min-width: 42px;
    height: 42px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    border: 1px solid #2a4a60;
  }
  .mode-btn .mode-txt { flex: 1; }
  .mode-btn .mode-txt small {
    display: block;
    font-size: 0.62rem;
    color: #7fa0bc;
    letter-spacing: 1px;
    font-weight: 400;
    margin-top: 2px;
  }
  .mode-btn:hover {
    border-color: #4fc3ff;
    background: rgba(20, 50, 75, 0.95);
    transform: translateX(3px);
  }
  .mode-btn:active { transform: translateX(1px); }
  .mode-btn.mode-A .arrow { color: #4fe0a8; border-color: #2ea87a; text-shadow: 0 0 10px #4fe0a8; }
  .mode-btn.mode-E .arrow { color: #ff8a5c; border-color: #c04a20; text-shadow: 0 0 10px #ff8a5c; }

  /* ===== ゲーム ===== */
  #game {
    background: #05080e;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
  }
  #game.active { display: flex; }
  .game-inner {
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
  }
  .game-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 10px;
  }
  .back-btn {
    background: #14283c;
    border: 1px solid #2a4e6c;
    color: #8fc0e0;
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .back-btn:hover { background: #1d3a54; color: #d0ecff; }
  .mode-tag {
    font-size: 0.72rem;
    color: #ffe14a;
    border: 1px dashed #ffe14a;
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 2px;
    font-family: 'Courier New', monospace;
  }
  .mode-tag.A { color: #4fe0a8; border-color: #4fe0a8; }
  .mode-tag.E { color: #ff8a5c; border-color: #ff8a5c; }

  /* 視点切り替え */
  .view-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    justify-content: center;
  }
  .view-btn {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #2a4e6c;
    background: #0d1c2a;
    color: #8fb8d4;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .view-btn.active {
    background: #14283c;
    color: #fff;
    border-color: #4fc3ff;
    box-shadow: 0 0 15px rgba(79,195,255,0.4);
  }
  .view-btn.active.b-view {
    border-color: #ffe14a;
    box-shadow: 0 0 15px rgba(255,225,74,0.5);
    color: #ffe14a;
  }
  .view-btn.active.p-view {
    border-color: #fff;
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
    color: #fff;
  }
  .view-btn .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .view-btn.b-view .dot { background: #ffd400; box-shadow: 0 0 8px #ffd400; }
  .view-btn.p-view .dot { background: #222; border: 2px solid #aaa; box-shadow: 0 0 8px #fff; }

  /* ステージ */
  .stage {
    position: relative;
    height: 240px;
    border-radius: 16px;
    border: 1px solid #1e3a52;
    overflow: hidden;
    margin-bottom: 10px;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.7);
    background: #0a1424;
  }
  /* 背景レイヤー（ビル群・山） */
  .bg-layer {
    position: absolute;
    inset: 0;
    background-repeat: repeat-x;
    background-size: auto 100%;
  }
  .bg-layer.buildings {
    background-color: #0a1424;
    background-image:
      linear-gradient(transparent 55%, #1a2a3a 55%, #1a2a3a 58%, transparent 58%),
      linear-gradient(transparent 40%, #16263a 40%, #16263a 45%, transparent 45%),
      linear-gradient(transparent 30%, #14243a 30%, #14243a 35%, transparent 35%);
    background-size: 200px 100%;
    background-position: 0 0;
    background-repeat: repeat-x;
  }
  /* 手続き的にビル群を描画：SVGっぽくlinear-gradientでシルエット */
  .bg-buildings {
    position: absolute;
    inset: 0;
    background-color: transparent;
    background-image:
      repeating-linear-gradient(90deg,
        transparent 0, transparent 30px,
        #14263a 30px, #14263a 50px,
        transparent 50px, transparent 70px,
        #1a2e44 70px, #1a2e44 95px,
        transparent 95px, transparent 120px,
        #0f2030 120px, #0f2030 150px,
        transparent 150px, transparent 180px,
        #18304a 180px, #18304a 200px
      );
    background-size: 200px 100%;
    background-position: 0 60%;
    background-repeat: repeat-x;
    opacity: 0.9;
    mask-image: linear-gradient(to top, #000 0%, #000 55%, transparent 70%);
    -webkit-mask-image: linear-gradient(to top, #000 0%, #000 55%, transparent 70%);
  }
  .bg-mountains {
    position: absolute;
    left: 0; right: 0;
    bottom: 30%;
    height: 45%;
    background-image:
      radial-gradient(ellipse 120px 90px at 100px 100%, #1a3a4a 0%, transparent 70%),
      radial-gradient(ellipse 160px 120px at 300px 100%, #163040 0%, transparent 70%),
      radial-gradient(ellipse 140px 100px at 500px 100%, #1a3a4a 0%, transparent 70%),
      radial-gradient(ellipse 180px 130px at 720px 100%, #163040 0%, transparent 70%);
    background-size: 800px 100%;
    background-repeat: repeat-x;
    background-position: 0 100%;
    opacity: 0.85;
  }
  .bg-sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #0a1a2e 0%, #0d1e34 60%, #0a1424 100%);
  }

  /* 線路 */
  .rail {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: #2a4a60;
    box-shadow: 0 1px 0 #1a2a3a;
    bottom: 40px;
  }
  .rail::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 6px;
    height: 2px;
    background: #2a4a60;
  }

  /* 電車（固定位置） */
  .train {
    position: absolute;
    bottom: 42px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 2px;
    z-index: 3;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
  }
  .car {
    width: 62px;
    height: 68px;
    background: linear-gradient(180deg, #2a4a6a 0%, #14283c 100%);
    border: 1px solid #3a6a8a;
    border-radius: 6px 6px 3px 3px;
    position: relative;
    box-shadow: inset 0 -12px 20px rgba(0,0,0,0.5);
  }
  .car.driver { background: linear-gradient(180deg, #3a6a9a 0%, #1a3a54 100%); }
  .car .window {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    height: 22px;
    background: #0d1a26;
    border-radius: 3px;
    border: 1px solid #2a4a60;
    overflow: hidden;
  }
  .car .window::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 30%;
    width: 2px;
    background: #2a4a60;
  }
  .car .label {
    position: absolute;
    bottom: 4px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.6rem;
    color: #6b9cc0;
    letter-spacing: 1px;
    font-family: 'Courier New', monospace;
  }
  .car .stripe {
    position: absolute;
    top: 38px;
    left: 0; right: 0;
    height: 3px;
    background: #4fc3ff;
    opacity: 0.6;
  }

  /* B卿 */
  .b-lord {
    position: absolute;
    bottom: 82px;
    z-index: 6;
    pointer-events: none;
    transform: translateX(-50%);
  }
  .b-lord .body {
    background: #ffd400;
    color: #1a1400;
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    font-weight: 900;
    border: 2px solid #fff8d0;
    box-shadow: 0 0 18px #ffd400, 0 0 35px rgba(255,212,0,0.5);
    font-family: 'Courier New', monospace;
  }

  /* P君 */
  .p-kun {
    position: absolute;
    bottom: 8px;
    left: 40px;
    z-index: 6;
    transition: left 0.5s ease-in-out;
  }
  .p-kun .body {
    background: #0a0a0a;
    color: #fff;
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    font-weight: 900;
    border: 2px solid #666;
    box-shadow: 0 0 12px #000, inset 0 0 8px #333;
    font-family: 'Courier New', monospace;
  }

  /* 弾 */
  .bullet {
    position: absolute;
    width: 16px;
    height: 6px;
    border-radius: 3px;
    z-index: 4;
    transition: left 0.02s linear;
  }
  .bullet.forward {
    background: linear-gradient(90deg, #fff, #ffd400, #ff8a00);
    box-shadow: 0 0 14px #ffd400, 0 0 28px #ff8a00;
  }
  .bullet.backward {
    background: linear-gradient(90deg, #ff8a00, #ffd400, #fff);
    box-shadow: 0 0 14px #ff8a00, 0 0 28px #ff5c3a;
  }
  .bullet.forward::after {
    content: '';
    position: absolute;
    right: -12px; top: 1px;
    width: 22px; height: 4px;
    background: linear-gradient(90deg, #ffd400, transparent);
    border-radius: 2px;
    opacity: 0.7;
  }
  .bullet.backward::after {
    content: '';
    position: absolute;
    left: -12px; top: 1px;
    width: 22px; height: 4px;
    background: linear-gradient(270deg, #ff8a00, transparent);
    border-radius: 2px;
    opacity: 0.7;
  }

  /* スライダー */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    background: #0a1622;
    border: 1px solid #1e3a52;
    border-radius: 12px;
    padding: 10px 14px;
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
  }
  .slider-row label {
    color: #8fc0e0;
    min-width: 130px;
    letter-spacing: 1px;
  }
  .slider-row input[type=range] {
    flex: 1;
    accent-color: #4fc3ff;
    cursor: pointer;
  }
  .slider-row .val {
    color: #ffe14a;
    font-weight: 800;
    min-width: 70px;
    text-align: right;
    font-size: 0.82rem;
  }

  /* 計算式パネル */
  .calc {
    background: #060f18;
    border: 1px solid #1e3a52;
    border-radius: 12px;
    padding: 12px 16px;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.7;
    color: #cbe6ff;
    margin-bottom: 8px;
    position: relative;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
  }
  .calc::before {
    content: attr(data-label);
    position: absolute;
    top: -9px;
    left: 14px;
    background: #060f18;
    padding: 0 8px;
    font-size: 0.6rem;
    color: #4fc3ff;
    letter-spacing: 2px;
    font-family: 'Segoe UI', sans-serif;
  }
  .calc.b-view::before { color: #ffe14a; }
  .calc.p-view::before { color: #ffffff; }
  .calc .line {
    display: block;
    white-space: nowrap;
    overflow-x: auto;
  }
  .calc .line.indent { padding-left: 20px; color: #8fb8d4; }
  .calc .lbl { color: #7fd4ff; }
  .calc .var { color: #4fe0a8; }
  .calc .num {
    color: #ffe14a;
    font-weight: 700;
    display: inline-block;
    min-width: 3.6em;
    text-align: right;
  }
  .calc .op { color: #ff8a5c; }
  .calc .res { color: #ffffff; font-weight: 800; text-shadow: 0 0 8px #4fe0a8; }
  .calc .delta { color: #ff8a5c; font-weight: 800; }
  .calc .delta.plus { color: #4fe0a8; }
  .calc .delta.minus { color: #ff5c3a; }
  .calc .highlight {
    background: rgba(255,225,74,0.12);
    border-radius: 3px;
    padding: 0 3px;
  }

  /* ボタン */
  .fire-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    color: #eaf6ff;
    font-family: inherit;
    transition: all 0.1s;
  }
  .btn:active { transform: translateY(3px); }
  .btn-fire {
    flex: 1;
    background: linear-gradient(160deg, #c44a2a, #7a1f0f);
    box-shadow: 0 5px 0 #4a0f05, 0 0 20px rgba(255,90,60,0.4);
  }
  .btn-fire:active { box-shadow: 0 1px 0 #4a0f05; }
  .btn-auto {
    background: linear-gradient(160deg, #2e8fc4, #14496e);
    box-shadow: 0 5px 0 #0a2a42;
  }
  .btn-auto.active {
    background: linear-gradient(160deg, #1f8f6b, #0d5a42);
    box-shadow: 0 5px 0 #073a2a, 0 0 20px rgba(79,224,168,0.5);
  }

  .hint {
    text-align: center;
    font-size: 0.68rem;
    color: #5d8cb0;
    letter-spacing: 1px;
    margin-top: 4px;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- ===================== オープニング ===================== -->
<div id="opening" class="screen active">
  <div class="opening-content">
    <div class="opening-title">B卿 と P君</div>
    <div class="opening-sub">— 動く電車の中の弾 —</div>
    <div class="opening-desc">
      走る電車の中から B卿 が銃を撃つ。<br>
      ホームの P君 はそれを見ている。<br>
      同じ弾なのに、見える速さが違う？
    </div>
    <button class="start-btn" onclick="startGame('A')">▶ はじめる</button>
    <button class="mode-btn mode-A" onclick="startGame('A')">
      <span class="arrow">→</span>
      <span class="mode-txt">
        銃口A向きモード
        <small>進行方向に撃つ（前方へ）</small>
      </span>
    </button>
    <button class="mode-btn mode-E" onclick="startGame('E')">
      <span class="arrow">←</span>
      <span class="mode-txt">
        銃口E向きモード
        <small>進行方向と逆に撃つ（後方へ）</small>
      </span>
    </button>
  </div>
</div>

<!-- ===================== ゲーム ===================== -->
<div id="game" class="screen">
  <div class="game-inner">

    <div class="game-top">
      <button class="back-btn" onclick="backToOpening()">← 戻る</button>
      <div class="mode-tag A" id="modeTag">銃口A向きモード</div>
    </div>

    <div class="view-switch">
      <button class="view-btn b-view active" id="viewB" onclick="setView('B')">
        <span class="dot"></span>B卿の目線（車内）
      </button>
      <button class="view-btn p-view" id="viewP" onclick="setView('P')">
        <span class="dot"></span>P君の目線（ホーム）
      </button>
    </div>

    <!-- ステージ -->
    <div class="stage" id="stage">
      <!-- 背景 -->
      <div class="bg-layer bg-sky"></div>
      <div class="bg-mountains" id="bgMountains"></div>
      <div class="bg-buildings" id="bgBuildings"></div>

      <!-- 線路 -->
      <div class="rail"></div>

      <!-- 電車（固定位置） -->
      <div class="train" id="train">
        <div class="car driver">
          <div class="window"></div><div class="stripe"></div><div class="label">A</div>
        </div>
        <div class="car">
          <div class="window"></div><div class="stripe"></div><div class="label">B</div>
        </div>
        <div class="car">
          <div class="window"></div><div class="stripe"></div><div class="label">C</div>
        </div>
        <div class="car">
          <div class="window"></div><div class="stripe"></div><div class="label">D</div>
        </div>
        <div class="car">
          <div class="window"></div><div class="stripe"></div><div class="label">E</div>
        </div>
      </div>

      <!-- B卿 -->
      <div class="b-lord" id="bLord"><div class="body">B</div></div>

      <!-- P君 -->
      <div class="p-kun" id="pKun"><div class="body">P</div></div>
    </div>

    <!-- スライダー -->
    <div class="slider-row">
      <label>電車の速度 v</label>
      <input type="range" id="vSlider" min="0" max="30" step="0.5" value="10">
      <span class="val" id="vVal">10.0</span>
    </div>
    <div class="slider-row">
      <label>銃の速度 u</label>
      <input type="range" id="uSlider" min="1" max="30" step="0.5" value="15">
      <span class="val" id="uVal">15.0</span>
    </div>

    <!-- 発射 -->
    <div class="fire-row">
      <button class="btn btn-fire" onclick="fireBullet()">🔫 撃つ</button>
      <button class="btn btn-auto" id="autoBtn" onclick="toggleAuto()">⟳ 自動連射</button>
    </div>

    <!-- B卿視点パネル -->
    <div class="calc b-view" data-label="📐 瞬間の計算式（B卿の目線）" id="calcB">
      <span class="line"><span class="lbl">弾の速度</span> <span class="op">u'</span> <span class="op">=</span> <span class="num" id="cbU">15.0</span> m/s</span>
      <span class="line"><span class="lbl">弾の位置</span> <span class="op">=</span> <span class="num" id="cbU2">15.0</span> <span class="op">×</span> <span class="num" id="cbT">0.00</span> s <span class="op">=</span> <span class="num res" id="cbPos">0.0</span> m</span>
      <span class="line"><span class="lbl">止まってたら</span> <span class="op">=</span> <span class="num" id="cbU3">15.0</span> m/s （同じ）</span>
      <span class="line"><span class="lbl">差</span> <span class="op">=</span> <span class="num delta" id="cbDelta">0.0</span> m/s</span>
    </div>

    <!-- P君視点パネル -->
    <div class="calc p-view" data-label="📐 瞬間の計算式（P君の目線）" id="calcP">
      <span class="line"><span class="lbl">弾の速度</span> <span class="op">u</span> <span class="op">=</span> <span class="num" id="cpU">15.0</span> <span class="op" id="cpOp">+</span> <span class="num" id="cpV">10.0</span> <span class="op">=</span> <span class="num res" id="cpRes">25.0</span> m/s</span>
      <span class="line"><span class="lbl">弾の位置</span> <span class="op">=</span> <span class="num res" id="cpPos">0.0</span> m</span>
      <span class="line"><span class="lbl">止まってたら</span> <span class="op">=</span> <span class="num" id="cpU2">15.0</span> m/s</span>
      <span class="line"><span class="lbl">差</span> <span class="op">=</span> <span class="num delta" id="cpDelta">0.0</span> m/s</span>
    </div>

    <div class="hint" id="hint">スライダーを動かすと、B卿とP君の見え方が変わる</div>

  </div>
</div>

<script>
/* ============================================================
   状態
============================================================ */
let mode = 'A';          // 'A' = 前方へ, 'E' = 後方へ
let view = 'B';          // 'B' or 'P'
let v = 10;              // 電車の速度 (m/s)
let u = 15;              // B卿から見た弾の速度 (m/s)

let t_P = 0;             // P君視点の経過時間
let t_B = 0;             // B卿視点の経過時間（今回は同じ）
let lastTime = 0;

// 背景のスクロール
let bgOffset = 0;

// 電車内のB卿位置（固定：B車両の中央）
// 電車は画面中央に固定。B車両は左から2番目。
// 1車両 62px + gap 2px = 64px
// A車両: -160〜-98, B車両: -96〜-34
// B卿はB車両の中央 → -65px くらい（画面中央からのオフセット）
const B_LORD_OFFSET = -65;

// 弾
const bullets = [];
let autoFire = false;
let autoTimer = 0;

// DOM
const $ = id => document.getElementById(id);

/* ===== 画面遷移 ===== */
function startGame(m) {
  mode = m;
  $('opening').classList.remove('active');
  $('game').classList.add('active');
  const tag = $('modeTag');
  tag.textContent = m === 'A' ? '銃口A向きモード（前方へ）' : '銃口E向きモード（後方へ）';
  tag.className = 'mode-tag ' + m;
  resetGame();
}

function backToOpening() {
  $('game').classList.remove('active');
  $('opening').classList.add('active');
  autoFire = false;
  $('autoBtn').classList.remove('active');
  $('autoBtn').textContent = '⟳ 自動連射';
}

function resetGame() {
  v = 10;
  u = 15;
  $('vSlider').value = v;
  $('uSlider').value = u;
  t_P = 0;
  t_B = 0;
  bgOffset = 0;
  bullets.forEach(b => b.el && b.el.remove());
  bullets.length = 0;
  lastTime = 0;
  autoFire = false;
  autoTimer = 0;
  $('autoBtn').classList.remove('active');
  $('autoBtn').textContent = '⟳ 自動連射';
  updateSliders();
  updateBLordPosition();
  updateCalcs();
}

/* ===== スライダー ===== */
$('vSlider').addEventListener('input', e => {
  v = parseFloat(e.target.value);
  updateSliders();
});
$('uSlider').addEventListener('input', e => {
  u = parseFloat(e.target.value);
  updateSliders();
});

function updateSliders() {
  $('vVal').textContent = v.toFixed(1);
  $('uVal').textContent = u.toFixed(1);
}

/* ===== 視点 ===== */
function setView(v_) {
  view = v_;
  $('viewB').classList.toggle('active', v_ === 'B');
  $('viewP').classList.toggle('active', v_ === 'P');
}

/* ===== B卿の位置（B車両に固定） ===== */
function updateBLordPosition() {
  const stage = $('stage');
  const W = stage.clientWidth;
  const bX = W / 2 + B_LORD_OFFSET;
  $('bLord').style.left = bX + 'px';
}

/* ===== 発射 ===== */
function fireBullet() {
  const stage = $('stage');
  const W = stage.clientWidth;
  const bX = W / 2 + B_LORD_OFFSET;
  const bullet = {
    x: bX + 10,
    y: 130,
    born: performance.now(),
    dead: false,
    dir: mode === 'A' ? 1 : -1,
  };
  bullets.push(bullet);
  const el = document.createElement('div');
  el.className = 'bullet ' + (mode === 'A' ? 'forward' : 'backward');
  el.style.left = bullet.x + 'px';
  el.style.top = bullet.y + 'px';
  stage.appendChild(el);
  bullet.el = el;
}

function toggleAuto() {
  autoFire = !autoFire;
  $('autoBtn').classList.toggle('active', autoFire);
  $('autoBtn').textContent = autoFire ? '■ 停止' : '⟳ 自動連射';
}

/* ===== メインループ ===== */
function loop(now) {
  if (!$('game').classList.contains('active')) {
    requestAnimationFrame(loop);
    return;
  }
  if (!lastTime) lastTime = now;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  t_P += dt;
  t_B += dt;

  // 背景スクロール（電車が動いてるように見せる）
  bgOffset -= v * 6 * dt;  // v に比例
  if (bgOffset < -200) bgOffset += 200;
  $('bgBuildings').style.backgroundPosition = bgOffset + 'px 60%';
  $('bgMountains').style.backgroundPosition = (bgOffset * 0.4) + 'px 100%';

  // 自動連射
  if (autoFire) {
    autoTimer += dt;
    if (autoTimer >= 0.4) {
      autoTimer = 0;
      fireBullet();
    }
  }

  // 弾の更新
  // B卿視点：弾は u で進む
  // P君視点：弾は u + v（A向き）/ u - v（E向き）で進む
  bullets.forEach(b => {
    if (b.dead) return;
    let speed;
    if (view === 'B') {
      speed = u;
    } else {
      speed = (mode === 'A') ? (u + v) : (u - v);
    }
    b.x += b.dir * speed * 8 * dt;
    if (b.x < -40 || b.x > W_() + 40) {
      b.dead = true;
      b.el.remove();
    } else {
      b.el.style.left = b.x + 'px';
    }
  });
  for (let i = bullets.length - 1; i >= 0; i--) {
    if (bullets[i].dead) bullets.splice(i, 1);
  }

  updateBLordPosition();
  updateCalcs();

  requestAnimationFrame(loop);
}

function W_() { return $('stage').clientWidth; }

/* ===== 計算式パネル更新 ===== */
function updateCalcs() {
  // B卿視点：u' = u（そのまま）
  $('cbU').textContent = u.toFixed(1);
  $('cbU2').textContent = u.toFixed(1);
  $('cbT').textContent = t_B.toFixed(2);
  const bPos = u * t_B;
  $('cbPos').textContent = bPos.toFixed(1);
  $('cbU3').textContent = u.toFixed(1);
  const cbDelta = $('cbDelta');
  cbDelta.textContent = '0.0';
  cbDelta.className = 'num delta';

  // P君視点：u_p = u ± v
  $('cpU').textContent = u.toFixed(1);
  $('cpV').textContent = v.toFixed(1);
  let pVel;
  if (mode === 'A') {
    pVel = u + v;
    $('cpOp').textContent = '+';
  } else {
    pVel = u - v;
    $('cpOp').textContent = '−';
  }
  $('cpRes').textContent = pVel.toFixed(1);
  const pPos = pVel * t_P;
  $('cpPos').textContent = pPos.toFixed(1);
  $('cpU2').textContent = u.toFixed(1);

  // 差：P君視点の弾速度 - 止まってる時の弾速度
  const diff = pVel - u;
  const cpDelta = $('cpDelta');
  cpDelta.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(1);
  cpDelta.className = 'num delta ' + (diff > 0.05 ? 'plus' : diff < -0.05 ? 'minus' : '');
}

/* ===== 初期化 ===== */
requestAnimationFrame(function init() {
  lastTime = 0;
  requestAnimationFrame(loop);
});

// リサイズ時
window.addEventListener('resize', () => {
  updateBLordPosition();
});
</script>
</body>
</html>
