<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微分積分の病 · 数学者の遊び</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1a2e 0%, #1b2f44 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 16px;
        }
        .game-wrapper {
            background: rgba(18, 30, 41, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2rem 2rem;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(200, 230, 255, 0.15);
            border: 1px solid #3e5e7a;
        }
        .game-panel {
            background: #0e1a24;
            border-radius: 2rem;
            padding: 1.8rem 2rem;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.6), 0 10px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #2c4b63;
        }
        h1 {
            text-align: center;
            margin: 0 0 0.25rem 0;
            font-weight: 400;
            font-size: 1.6rem;
            letter-spacing: 4px;
            color: #b3e4ff;
            text-shadow: 0 0 12px #2f8fbb, 0 0 30px #0e3a4f;
            font-family: 'Courier New', monospace;
        }
        .subhead {
            text-align: center;
            color: #6a8fa8;
            font-size: 0.8rem;
            margin-top: -0.2rem;
            margin-bottom: 1.5rem;
            font-style: italic;
            letter-spacing: 2px;
            border-bottom: 1px dashed #2e4a5e;
            padding-bottom: 0.8rem;
        }
        .display-area {
            background: #0b141c;
            border-radius: 2rem;
            padding: 1.2rem 1.8rem;
            box-shadow: inset 0 2px 8px #000000, 0 0 0 1px #2f4d63;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
        }
        .value-box {
            text-align: left;
            flex: 1;
        }
        .value-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4f7b99;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .value-label i {
            font-style: normal;
            font-size: 1rem;
            color: #79c1ff;
        }
        .value-number {
            font-size: 2.8rem;
            font-weight: 600;
            line-height: 1;
            color: #d4f0ff;
            text-shadow: 0 0 15px #2980b9;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            transition: all 0.08s ease;
        }
        .derivative-badge {
            background: #162f40;
            border-radius: 3rem;
            padding: 0.6rem 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 0 1px #2e5777;
        }
        .derivative-badge span:first-child {
            font-size: 0.65rem;
            color: #5d8caa;
            letter-spacing: 3px;
        }
        .derivative-badge .rate {
            font-size: 1.7rem;
            font-weight: 700;
            color: #b1e6ff;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #3d9fd4;
        }
        .integrals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            padding: 0 0.2rem;
        }
        .integral-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0f1e29;
            padding: 0.6rem 1rem;
            border-radius: 1.5rem;
            box-shadow: inset 0 2px 6px #000000, 0 0 0 1px #2e4f66;
            min-width: 100px;
        }
        .integral-item .label {
            font-size: 0.65rem;
            color: #5983a0;
            letter-spacing: 1px;
        }
        .integral-item .amount {
            font-size: 1.3rem;
            font-weight: 600;
            color: #aad4ff;
            font-family: 'Courier New', monospace;
        }
        .integral-item .unit {
            font-size: 0.7rem;
            color: #407090;
        }
        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        .main-button {
            background: radial-gradient(circle at 30% 20%, #274e6b, #0d1f2c);
            border: none;
            border-radius: 6rem;
            padding: 1rem 1rem;
            width: 200px;
            height: 200px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #ddf4ff;
            text-shadow: 0 0 15px #0077be, 0 0 40px #004466;
            cursor: pointer;
            box-shadow: 0 20px 30px -10px #000000, 0 0 0 2px #346b8a, 0 0 30px #1b5270;
            transition: all 0.1s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.3;
            border: 1px solid #4f93b5;
        }
        .main-button small {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #8dc9f0;
            margin-top: 6px;
            opacity: 0.9;
        }
        .main-button:active {
            transform: scale(0.94);
            box-shadow: 0 5px 15px #000000, 0 0 0 2px #4f93b5, 0 0 45px #2b7eb0;
            background: radial-gradient(circle at 30% 20%, #2f6185, #112b3b);
        }
        .main-button:disabled {
            opacity: 0.4;
            filter: grayscale(0.7);
            transform: scale(0.96);
            box-shadow: 0 5px 15px #000;
            cursor: not-allowed;
            pointer-events: none;
        }
        .reset-button {
            background: transparent;
            border: 1px solid #2d556d;
            color: #6b9fc7;
            padding: 0.4rem 1.8rem;
            border-radius: 3rem;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: 0 0 10px #0a1e2b;
        }
        .reset-button:hover {
            background: #1b3547;
            color: #b3e4ff;
            border-color: #5488a8;
            box-shadow: 0 0 18px #1b4f6e;
        }
        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.65rem;
            color: #34617e;
            text-align: center;
            letter-spacing: 1px;
            font-style: italic;
        }
        .math-symbol {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.1rem;
        }
        .glow {
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 10px #3d9fd4; }
            to { text-shadow: 0 0 25px #7ac8ff, 0 0 40px #1f6b99; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-panel">
        <h1>∂ / ∫ <span style="font-size:1.1rem;opacity:0.8;">病</span></h1>
        <div class="subhead">微分積分学者の遊び · 自然と法則が漏れ出す</div>

        <div class="display-area">
            <div class="value-box">
                <div class="value-label"><i>ƒ(x)</i> 現在値</div>
                <div class="value-number" id="currentValue">0.000</div>
            </div>
            <div class="derivative-badge">
                <span>dƒ/dx</span>
                <span class="rate" id="derivativeDisplay">1.000</span>
            </div>
        </div>

        <div class="integrals-row">
            <div class="integral-item">
                <span class="label">∫ 累積A</span>
                <span class="amount" id="integralA">0.0</span>
                <span class="unit">(面積)</span>
            </div>
            <div class="integral-item">
                <span class="label">∫ 累積B</span>
                <span class="amount" id="integralB">0.0</span>
                <span class="unit">(流量)</span>
            </div>
            <div class="integral-item">
                <span class="label">∂ 勾配</span>
                <span class="amount" id="gradient">1.00</span>
                <span class="unit">(変化率)</span>
            </div>
        </div>

        <div class="action-area">
            <button class="main-button" id="mainBtn">
                Δx
                <small>微分せよ</small>
            </button>
            <button class="reset-button" id="resetBtn">⟲ 初期化</button>
        </div>
        <div class="footer-note">
            <span class="math-symbol">∂ƒ/∂t = ∫ g(t) dt</span> — 遊び心が生んだ数学病
        </div>
    </div>
</div>

<script>
    (function(){
        // === 数学病の世界 ===
        // 状態変数 — すべては微分と積分に支配される
        let currentValue = 0.0;           // f(x) 現在値
        let derivative = 1.0;            // 現在の微分係数 (dƒ/dx)
        let integralA = 0.0;             // 積分A: ∫ f(x) dx 的な蓄積（面積）
        let integralB = 0.0;             // 積分B: 流量・累積
        let gradient = 1.0;              // 勾配（変化率の履歴）

        // 微分・積分のパラメータ（数学者が無意識に設定した美しい定数）
        const BASE_DERIVATIVE = 0.618;    // 黄金比の逆数? 適当な美的数値
        const INTEGRAL_FACTOR = 0.025;    // 積分の重み
        const FLOW_FACTOR = 0.018;        // 流量積分の重み
        const GRADIENT_DECAY = 0.992;     // 勾配の減衰（微分の記憶）
        const VALUE_DECAY = 0.9985;       // 自然減衰（放射性崩壊のような）

        // DOM要素
        const currentValueEl = document.getElementById('currentValue');
        const derivativeDisplayEl = document.getElementById('derivativeDisplay');
        const integralAEl = document.getElementById('integralA');
        const integralBEl = document.getElementById('integralB');
        const gradientEl = document.getElementById('gradient');
        const mainBtn = document.getElementById('mainBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 表示更新用（小数点以下の桁数）
        function formatNumber(val, decimals = 3) {
            return val.toFixed(decimals);
        }

        // UIを更新する — 数学的病の可視化
        function updateUI() {
            currentValueEl.textContent = formatNumber(currentValue, 3);
            derivativeDisplayEl.textContent = formatNumber(derivative, 3);
            integralAEl.textContent = formatNumber(integralA, 2);
            integralBEl.textContent = formatNumber(integralB, 2);
            gradientEl.textContent = formatNumber(gradient, 2);

            // ちょっとした視覚効果：値の大きさでグロー
            if (currentValue > 50) {
                currentValueEl.classList.add('glow');
            } else {
                currentValueEl.classList.remove('glow');
            }

            // 微分係数が大きいとボタンが輝く
            if (derivative > 2.5) {
                mainBtn.style.boxShadow = '0 20px 30px -10px #000, 0 0 0 2px #7ac8ff, 0 0 50px #2b8fd9';
            } else {
                mainBtn.style.boxShadow = '0 20px 30px -10px #000, 0 0 0 2px #346b8a, 0 0 30px #1b5270';
            }
        }

        // === 微分と積分の法則 ===
        // この関数がボタン押下のたびに作用する
        function applyCalculus() {
            // 1. 微小変化 Δx を導入（微小だが有限、遊びなので0.1）
            const deltaX = 0.1;

            // 2. 現在の微分係数を更新：dƒ/dx = 現在の値に依存しつつ、勾配も影響
            //    数学的遊び：導関数が自己参照的 + 勾配の積分項
            //    (意識してないけどフラクタルっぽくなってる)
            let newDerivative = BASE_DERIVATIVE + 
                                0.12 * Math.sin(currentValue * 0.3) +   // 周期的なゆらぎ
                                0.08 * (gradient - 0.8);                // 勾配のずれを補正

            // 微分は負にならない（この宇宙では単調増加気味）
            newDerivative = Math.max(0.1, newDerivative);

            // 3. 微分の適用： Δƒ ≈ (dƒ/dx) * Δx + 二次の微小項
            //    ここが微分の本質！ 変化量 = 導関数 * 微小変位
            const deltaF = newDerivative * deltaX;
            currentValue += deltaF;

            // 4. 積分の出現：∫ f(x) dx の離散近似 — 面積の蓄積
            //    リーマン和のごとく、integralA に f(x)*Δx を足す
            integralA += currentValue * deltaX;

            // 5. 流量の積分：∫ derivative dt ？ 実は微分係数の積分は元の関数だが、
            //    遊びで「変化率の累積」を integralB に貯める（第二積分）
            integralB += newDerivative * deltaX;

            // 6. 勾配（gradient）の更新：これは微分の微分（二階微分）っぽい何か
            //    数学者は無意識に二階微分を導入していた…
            const secondDerivative = (newDerivative - derivative) / deltaX;
            gradient = gradient * GRADIENT_DECAY + secondDerivative * 0.04;
            // 勾配は1前後に落ち着くが、時に跳ねる

            // 7. 自然減衰（積分定数のようなもの、放射性崩壊）
            currentValue *= VALUE_DECAY;

            // 8. 積分の再帰的フィードバック（積分が微分に影響を与える、美しい循環）
            //    ここが数学病の核心：積分項が微分を微調整する
            derivative = newDerivative + 0.003 * (integralA * 0.01) - 0.002 * integralB;

            // 微分係数の範囲を制限（非線形性）
            derivative = Math.min(4.8, Math.max(0.15, derivative));

            // 9. 積分値も無限大にならないようにソフトリミッター（遊びの配慮）
            if (integralA > 1000) integralA *= 0.999;
            if (integralB > 1000) integralB *= 0.999;

            // 10. ごくたまに、微分が突発的に跳ねる（数学的カオス）
            //     確率 1/50 くらいで
            if (Math.random() < 0.018) {
                derivative += 0.6 * Math.random();
                // それに伴い値も跳ねる（積分の不連続）
                currentValue += 0.8 * Math.random();
                integralA += 1.2 * Math.random();
            }

            // 11. 表示を更新
            updateUI();
        }

        // 初期リセット（数学的初期条件）
        function resetGame() {
            currentValue = 0.0;
            derivative = 1.0;
            integralA = 0.0;
            integralB = 0.0;
            gradient = 1.0;
            updateUI();
        }

        // イベントリスナー
        mainBtn.addEventListener('click', applyCalculus);

        resetBtn.addEventListener('click', resetGame);

        // 自動で時間発展（微分方程式の自動積分） — 放置しても進む
        // 0.2秒ごとに微小な積分を実行（自然な流れ）
        setInterval(() => {
            // 時間経過による微小変化（自動積分）
            // 微分係数が小さいと自然増加、大きいと減衰？
            const autoDelta = 0.004 * derivative * (1 - currentValue * 0.002);
            currentValue += autoDelta;
            
            // 積分の自然蓄積（面積と流量）
            integralA += currentValue * 0.005;
            integralB += derivative * 0.004;

            // 勾配の自然減衰と再計算
            gradient = gradient * 0.998 + derivative * 0.002;
            
            // 微分係数のわずかなドリフト（環境ゆらぎ）
            derivative += (Math.random() - 0.48) * 0.008;
            derivative = Math.min(4.8, Math.max(0.12, derivative));

            // 値の減衰も忘れずに（無限大回避）
            currentValue *= 0.9998;
            integralA *= 0.9999;
            integralB *= 0.9999;

            // 時々UI更新（ちらつき防止で毎回やる）
            updateUI();
        }, 200);

        // 初期表示
        resetGame();
        // 初回だけ少しだけ値を持たせる（数学者の遊び心）
        currentValue = 0.618;
        integralA = 0.318;
        integralB = 0.206;
        derivative = 1.118;
        gradient = 1.02;
        updateUI();

        // 追加：スペースキーでも微分実行（遊びやすさ）
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();  // スクロール防止
                if (!mainBtn.disabled) {
                    applyCalculus();
                    // ボタン押した感を出す
                    mainBtn.style.transform = 'scale(0.96)';
                    setTimeout(() => mainBtn.style.transform = '', 100);
                }
            }
        });
    })();
</script>
</body>
</html>
