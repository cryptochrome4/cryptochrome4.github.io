<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>∫育て！∂切れ！ — 微分積分の遊び</title>
<style>
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1a2f4a 0%, #0a0f18 70%);
    display: flex; justify-content: center; align-items: center;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    padding: 16px;
    overflow: hidden;
  }
  .game {
    width: 100%; max-width: 520px;
    background: rgba(12, 22, 36, 0.9);
    border-radius: 28px;
    padding: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(120,180,255,0.15);
    border: 1px solid #2a4a6a;
    position: relative;
  }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
    padding: 0 6px;
  }
  .hud-item {
    display: flex; flex-direction: column;
    font-size: 0.7rem; color: #5d8cb0; letter-spacing: 1px;
  }
  .hud-item .num {
    font-size: 1.5rem; font-weight: 700; color: #cbeaff;
    text-shadow: 0 0 12px #2e8fc4;
    font-family: 'Courier New', monospace;
  }
  .lives { font-size: 1.4rem; letter-spacing: 2px; }
  .lives .full { color: #ff5c7a; text-shadow: 0 0 10px #ff5c7a; }
  .lives .empty { color: #2a3a4a; }

  .stage {
    position: relative;
    height: 320px;
    background: radial-gradient(circle at 50% 55%, #102030 0%, #060b12 90%);
    border-radius: 22px;
    box-shadow: inset 0 0 40px #000, inset 0 0 0 1px #1e3a52;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    margin-bottom: 14px;
    cursor: pointer;
  }

  .orb {
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7fe4ff, #2a8fd0 45%, #0d4a7a 80%);
    box-shadow: 0 0 40px #3aa8e0, 0 0 80px #1b6a9e, inset 0 0 30px rgba(255,255,255,0.3);
    transition: width 0.06s linear, height 0.06s linear, background 0.3s;
    pointer-events: none;
    position: absolute;
  }
  .orb.danger {
    background: radial-gradient(circle at 35% 30%, #ffd27f, #ff5c3a 45%, #7a1000 80%);
    box-shadow: 0 0 50px #ff5c3a, 0 0 100px #a02000, inset 0 0 30px rgba(255,255,255,0.4);
    animation: dangerPulse 0.25s infinite alternate;
  }
  @keyframes dangerPulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px dashed rgba(120,200,255,0.4);
    pointer-events: none;
    transition: all 0.1s;
  }
  .ring.warn { border-color: rgba(255,120,90,0.7); }

  .effect {
    position: absolute;
    font-weight: 900;
    color: #fff;
    pointer-events: none;
    font-size: 1.6rem;
    text-shadow: 0 0 12px #4fc3ff, 0 0 25px #1b6a9e;
    animation: floatUp 0.9s ease-out forwards;
    font-family: 'Courier New', monospace;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
  }
  .effect.crit {
    color: #ffe14a;
    text-shadow: 0 0 15px #ffb800, 0 0 30px #ff7a00;
    font-size: 2rem;
  }

  .gauge {
    height: 12px;
    background: #0a141f;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 2px 6px #000, 0 0 0 1px #1e3a52;
    margin-bottom: 16px;
    position: relative;
  }
  .gauge-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2ecc9a, #f1c40f, #ff5c3a);
    border-radius: 10px;
    transition: width 0.08s linear;
    box-shadow: 0 0 12px rgba(120,220,255,0.5);
  }
  .gauge-label {
    position: absolute; right: 8px; top: -18px;
    font-size: 0.65rem; color: #6a9cc0; letter-spacing: 1px;
  }

  .controls {
    display: flex; gap: 12px;
  }
  .btn {
    flex: 1;
    padding: 18px 8px;
    border: none;
    border-radius: 18px;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    color: #eaf6ff;
    transition: all 0.08s;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .btn small {
    display: block; font-size: 0.65rem; font-weight: 400;
    letter-spacing: 1px; opacity: 0.75; margin-top: 3px;
  }
  .btn-grow {
    background: linear-gradient(160deg, #1f8f6b, #0d5a42);
    box-shadow: 0 8px 0 #073a2a, 0 12px 20px rgba(0,0,0,0.5);
  }
  .btn-grow:active { transform: translateY(6px); box-shadow: 0 2px 0 #073a2a, 0 6px 12px rgba(0,0,0,0.5); }

  .btn-cut {
    background: linear-gradient(160deg, #c44a2a, #7a1f0f);
    box-shadow: 0 8px 0 #4a0f05, 0 12px 20px rgba(0,0,0,0.5);
  }
  .btn-cut:active { transform: translateY(6px); box-shadow: 0 2px 0 #4a0f05, 0 6px 12px rgba(0,0,0,0.5); }

  .btn:disabled {
    filter: grayscale(0.8); opacity: 0.5; cursor: not-allowed;
    transform: translateY(6px); box-shadow: 0 2px 0 #333;
  }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(5, 10, 18, 0.94);
    border-radius: 28px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 30px;
    z-index: 50;
    backdrop-filter: blur(6px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: 1.8rem; color: #cbeaff; margin-bottom: 10px;
    text-shadow: 0 0 20px #2e8fc4;
    letter-spacing: 2px;
  }
  .overlay h1 .int { color: #4fe0a8; }
  .overlay h1 .der { color: #ff7a5c; }
  .overlay p {
    color: #8fb8d4; font-size: 0.9rem; line-height: 1.7;
    margin-bottom: 22px; max-width: 340px;
  }
  .overlay .big-btn {
    padding: 16px 50px; border-radius: 50px; border: none;
    font-size: 1.1rem; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(160deg, #2e8fc4, #14496e);
    color: #fff; cursor: pointer;
    box-shadow: 0 8px 0 #0a2a42, 0 15px 25px rgba(0,0,0,0.5);
    transition: all 0.1s;
    font-family: inherit;
  }
  .overlay .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #0a2a42; }

  .final-score {
    font-size: 3rem; font-weight: 900; color: #ffe14a;
    text-shadow: 0 0 25px #ffb800;
    font-family: 'Courier New', monospace;
    margin: 10px 0;
  }

  .hint {
    text-align: center;
    font-size: 0.7rem;
    color: #4a7a9c;
    margin-top: 12px;
    letter-spacing: 1px;
    min-height: 16px;
  }
  .hint.flash { color: #ffe14a; text-shadow: 0 0 10px #ffb800; }

  .combo {
    position: absolute;
    top: 12px; right: 14px;
    font-size: 1.1rem;
    font-weight: 900;
    color: #ffe14a;
    text-shadow: 0 0 15px #ffb800;
    opacity: 0;
    transition: opacity 0.2s;
    font-family: 'Courier New', monospace;
    z-index: 10;
  }
  .combo.show { opacity: 1; }
</style>
</head>
<body>
<div class="game">
  <div class="hud">
    <div class="hud-item">
      <span>SCORE</span>
      <span class="num" id="score">0</span>
    </div>
    <div class="hud-item" style="align-items:center;">
      <span>LIFE</span>
      <div class="lives" id="lives"></div>
    </div>
    <div class="hud-item" style="align-items:flex-end;">
      <span>BEST</span>
      <span class="num" id="best" style="font-size:1.1rem;">0</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="ring" id="ring"></div>
    <div class="orb" id="orb"></div>
    <div class="combo" id="combo">×1.0</div>
  </div>

  <div class="gauge">
    <span class="gauge-label">積分ゲージ</span>
    <div class="gauge-fill" id="gaugeFill"></div>
  </div>

  <div class="controls">
    <button class="btn btn-grow" id="growBtn">
      ∫ 育てる
      <small>積分する</small>
    </button>
    <button class="btn btn-cut" id="cutBtn">
      ∂ 切る
      <small>微分する</small>
    </button>
  </div>

  <div class="hint" id="hint">育てて、赤くなる前に切れ！</div>

  <!-- スタート画面 -->
  <div class="overlay" id="startOverlay">
    <h1><span class="int">∫</span> 育て！ <span class="der">∂</span> 切れ！</h1>
    <p>
      ボールを育てて（積分）、<br>
      大きくなったら切って（微分）スコアを稼げ！<br><br>
      赤く点滅し始めたら危険サイン。<br>
      破裂する前に切れ！ 早すぎると低得点。
    </p>
    <button class="big-btn" id="startBtn">START</button>
  </div>

  <!-- ゲームオーバー画面 -->
  <div class="overlay hidden" id="overOverlay">
    <h1>GAME OVER</h1>
    <p style="margin-bottom:4px;">破裂した…（微分不能・特異点）</p>
    <div class="final-score" id="finalScore">0</div>
    <p style="margin-top:-10px;margin-bottom:20px;font-size:0.8rem;">
      最大コンボ: <span id="finalCombo">×1.0</span>
    </p>
    <button class="big-btn" id="retryBtn">RETRY</button>
  </div>
</div>

<script>
(function(){
  // ===== 数学病の世界（でも普通に遊べる） =====

  const stage = document.getElementById('stage');
  const orb = document.getElementById('orb');
  const ring = document.getElementById('ring');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const livesEl = document.getElementById('lives');
  const gaugeFill = document.getElementById('gaugeFill');
  const comboEl = document.getElementById('combo');
  const hintEl = document.getElementById('hint');
  const growBtn = document.getElementById('growBtn');
  const cutBtn = document.getElementById('cutBtn');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const finalComboEl = document.getElementById('finalCombo');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  // ===== 状態 =====
  let running = false;
  let score = 0;
  let lives = 3;
  let best = parseInt(localStorage.getItem('mathBest') || '0');
  bestEl.textContent = best;

  // ボールの状態（これが積分で育つ）
  // size: 半径(px), growth: 現在の積分速度, velocity: 育つ勢い(加速度)
  let size = 18;
  let growth = 0;       // 育つ速さ（積分の積分＝二次積分的）
  let velocity = 0;     // 育つ勢い（加速度）
  let stability = 0;    // 切る準備度（微分の材料）

  // タイミング・コンボ
  let lastGrowTime = 0;
  let growCombo = 0;    // 連続育ちコンボ
  let cutCombo = 0;     // 連続クリティカルコンボ
  let comboMult = 1.0;

  // 破裂閾値
  const MAX_SIZE = 130;      // これに近づくと危険
  const BURST_SIZE = 145;    // これを超えたら破裂
  const MIN_SIZE = 10;

  // ゲームループ用
  let animId = null;
  let lastTime = 0;

  // ===== 初期化 =====
  function resetState(){
    running = true;
    score = 0;
    lives = 3;
    size = 18;
    growth = 0;
    velocity = 0;
    stability = 0;
    growCombo = 0;
    cutCombo = 0;
    comboMult = 1.0;
    lastGrowTime = 0;
    updateScore();
    updateLives();
    updateOrb();
    updateGauge();
    comboEl.classList.remove('show');
    hint('育てて、赤くなる前に切れ！');
    growBtn.disabled = false;
    cutBtn.disabled = false;
  }

  // ===== UI更新 =====
  function updateScore(){
    scoreEl.textContent = Math.floor(score);
  }
  function updateLives(){
    let s = '';
    for(let i=0;i<3;i++){
      s += i < lives ? '<span class="full">♥</span>' : '<span class="empty">♥</span>';
    }
    livesEl.innerHTML = s;
  }
  function updateOrb(){
    orb.style.width = (size*2) + 'px';
    orb.style.height = (size*2) + 'px';

    // 危険度判定
    const dangerRatio = size / MAX_SIZE;
    if(size >= MAX_SIZE * 0.72){
      orb.classList.add('danger');
      ring.classList.add('warn');
    } else {
      orb.classList.remove('danger');
      ring.classList.remove('warn');
    }

    // リング（危険ラインの可視化）
    const ringSize = MAX_SIZE * 2;
    ring.style.width = ringSize + 'px';
    ring.style.height = ringSize + 'px';
  }
  function updateGauge(){
    const ratio = Math.min(1, size / MAX_SIZE);
    gaugeFill.style.width = (ratio*100) + '%';
  }
  function updateCombo(){
    comboEl.textContent = '×' + comboMult.toFixed(1);
    if(comboMult > 1.05){
      comboEl.classList.add('show');
    } else {
      comboEl.classList.remove('show');
    }
  }
  function hint(text, flash){
    hintEl.textContent = text;
    if(flash){
      hintEl.classList.add('flash');
      setTimeout(()=>hintEl.classList.remove('flash'), 400);
    }
  }

  // ===== エフェクト（浮き上がる数字） =====
  function spawnEffect(x, y, text, isCrit){
    const el = document.createElement('div');
    el.className = 'effect' + (isCrit ? ' crit' : '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    stage.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }

  // ===== 微分（切る） =====
  function doCut(){
    if(!running) return;

    const stageRect = stage.getBoundingClientRect();
    const cx = stageRect.width/2;
    const cy = stageRect.height/2;

    // 微分の本質：今この瞬間の変化量を抽出 → サイズに比例した得点
    // 早すぎると（小さすぎると）低得点、大きいほど高得点
    const sizeRatio = size / MAX_SIZE;

    // ベース得点：サイズの二乗に比例（面積＝積分の結果を微分で取り出すイメージ）
    let baseGain = Math.floor(size * size * 0.06);

    // 危険ボーナス：赤くなってるほど高得点
    let dangerBonus = 0;
    if(size >= MAX_SIZE * 0.72){
      dangerBonus = Math.floor((sizeRatio - 0.72) * 400);
    }

    // クリティカル判定：MAX_SIZEの85%〜98%が美味しいゾーン
    const isCrit = sizeRatio >= 0.85 && sizeRatio <= 0.98;
    if(isCrit){
      cutCombo++;
      baseGain = Math.floor(baseGain * 1.8);
      comboMult = Math.min(5.0, 1.0 + cutCombo * 0.2);
    } else {
      cutCombo = 0;
      comboMult = Math.max(1.0, comboMult * 0.8);
    }

    let totalGain = Math.floor((baseGain + dangerBonus) * comboMult);
    score += totalGain;
    updateScore();

    // エフェクト
    const effectText = (isCrit ? 'CRIT! +' : '+') + totalGain;
    spawnEffect(cx - 40, cy - 20, effectText, isCrit);

    // 切った後の処理：ボールがリセットされる（微分で取り出した）
    // 切ったサイズに応じて次のボールは少し大きめからスタート（余韻）
    const carry = Math.min(30, size * 0.15);
    size = Math.max(MIN_SIZE, 14 + carry);
    velocity = 0;
    growth = 0;
    stability = 0;

    // コンボ表示
    updateCombo();

    // クリティカル時の演出
    if(isCrit){
      hint('CRITICAL! 微分成功！', true);
      stage.style.boxShadow = 'inset 0 0 60px #ffb800';
      setTimeout(()=>stage.style.boxShadow = '', 200);
    } else {
      hint('切った！ +' + totalGain, true);
    }

    updateOrb();
    updateGauge();
  }

  // ===== 積分（育てる） =====
  function doGrow(){
    if(!running) return;

    const now = performance.now();
    const dt = lastGrowTime ? (now - lastGrowTime) / 1000 : 0.5;
    lastGrowTime = now;

    // 連続で育てるとコンボ（積分コンボ）
    if(dt < 1.2){
      growCombo++;
    } else {
      growCombo = 1;
    }

    // 積分：サイズを増やす。ただし急激に押すと加速度がつく
    // ここが「積分の積分」＝二階積分っぽい動き
    const push = 6 + Math.min(growCombo, 6) * 1.5;
    velocity += push * 0.35;
    growth = Math.min(60, growth + push);

    // 少しだけその場でサイズ加算（即時フィードバック）
    size += push * 0.4;

    // 危険ラインを超えたら破裂チェックはループで
    updateOrb();
    updateGauge();

    // エフェクト
    const stageRect = stage.getBoundingClientRect();
    spawnEffect(stageRect.width/2 - 20, stageRect.height/2, '+∫', false);

    if(size >= MAX_SIZE * 0.72){
      hint('危険！ 赤くなってる！ 早く切れ！', true);
    } else if(growCombo > 3){
      hint('積分コンボ ×' + growCombo + '！', false);
    }
  }

  // ===== メインループ =====
  // 積分の自動進行（放置でも育つ）＋ 微分の自然減衰
  function loop(timestamp){
    if(!running) return;

    if(!lastTime){
      lastTime = timestamp;
      animId = requestAnimationFrame(loop);
      return;
    }
    const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
    lastTime = timestamp;

    // --- 積分の自然進行（育てる勢い） ---
    // velocity が growth を増やし、growth が size を増やす（二階積分）
    growth += velocity * dt * 8;
    velocity *= 0.94;  // 勢いの減衰

    // サイズに反映（積分：growth がそのままサイズ増加）
    size += growth * dt;

    // 自然減衰（積分定数の気まぐれ、放置しすぎると縮む）
    size *= 0.9985;
    growth *= 0.985;

    // 最小サイズを保つ
    if(size < MIN_SIZE) size = MIN_SIZE;

    // --- 破裂判定：限界突破 ---
    if(size >= BURST_SIZE){
      burst();
      return;
    }

    // --- 危険域のドキドキ演出 ---
    if(size >= MAX_SIZE * 0.72 && size < BURST_SIZE){
      // 画面を微妙に揺らす
      const shake = (size - MAX_SIZE*0.72) / (BURST_SIZE - MAX_SIZE*0.72);
      stage.style.transform = `translate(${(Math.random()-0.5)*shake*6}px, ${(Math.random()-0.5)*shake*6}px)`;
    } else {
      stage.style.transform = '';
    }

    // --- 高サイズ時の微振動（微分の予兆） ---
    if(size > MAX_SIZE * 0.9){
      orb.style.transform = `translate(${(Math.random()-0.5)*3}px, ${(Math.random()-0.5)*3}px)`;
    } else {
      orb.style.transform = '';
    }

    // UI更新
    updateOrb();
    updateGauge();

    animId = requestAnimationFrame(loop);
  }

  // ===== 破裂（ゲームオーバー or ライフ減） =====
  function burst(){
    running = false;
    cancelAnimationFrame(animId);
    stage.style.transform = '';

    // 破裂エフェクト
    const stageRect = stage.getBoundingClientRect();
    spawnEffect(stageRect.width/2 - 60, stageRect.height/2 - 20, '💥 破裂！', true);
    orb.style.background = 'radial-gradient(circle at 35% 30%, #fff, #ff3a3a 40%, #500)';
    orb.style.boxShadow = '0 0 80px #ff3a3a, 0 0 150px #a00';

    lives--;
    updateLives();

    if(lives <= 0){
      // ゲームオーバー
      setTimeout(()=>{
        gameOver();
      }, 500);
    } else {
      // ライフ残ってたら続行（少しペナルティ）
      setTimeout(()=>{
        hint('危ない！ ライフ残り' + lives, true);
        // 少し小さめからリスタート
        size = 30;
        growth = 0;
        velocity = 0;
        cutCombo = 0;
        comboMult = Math.max(1.0, comboMult * 0.5);
        updateCombo();
        updateOrb();
        updateGauge();
        running = true;
        lastTime = 0;
        animId = requestAnimationFrame(loop);
      }, 700);
    }
  }

  // ===== ゲームオーバー =====
  function gameOver(){
    running = false;
    cancelAnimationFrame(animId);
    if(score > best){
      best = Math.floor(score);
      localStorage.setItem('mathBest', best);
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = Math.floor(score);
    finalComboEl.textContent = '×' + comboMult.toFixed(1);
    overOverlay.classList.remove('hidden');
    growBtn.disabled = true;
    cutBtn.disabled = true;
  }

  // ===== スタート =====
  function startGame(){
    resetState();
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    lastTime = 0;
    lastGrowTime = 0;
    if(animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  // ===== イベント =====
  growBtn.addEventListener('click', doGrow);
  cutBtn.addEventListener('click', doCut);
  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  // ステージクリックでも育てる（おまけ）
  stage.addEventListener('click', (e)=>{
    if(e.target === growBtn || e.target === cutBtn) return;
    if(running) doGrow();
  });

  // キーボード操作
  window.addEventListener('keydown', (e)=>{
    if(!running) return;
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      doGrow();
    }
    if(e.code === 'Enter' || e.code === 'ArrowDown'){
      e.preventDefault();
      doCut();
    }
  });

  // ===== 初期表示 =====
  // スタート画面の間はボールを小さく表示
  size = 18;
  updateOrb();
  updateGauge();
  updateLives();
  updateScore();
  growBtn.disabled = true;
  cutBtn.disabled = true;

  // 起動時にスタートオーバーレイ表示
  startOverlay.classList.remove('hidden');
  overOverlay.classList.add('hidden');

  // タイトル画面でも軽くボール動かす
  (function idleOrb(){
    if(!running && startOverlay.classList.contains('hidden') === false){
      size = 18 + Math.sin(performance.now()/500)*3;
      updateOrb();
      requestAnimationFrame(idleOrb);
    }
  })();

})();
</script>
</body>
</html>
