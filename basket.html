<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景画像 表示テスト用サイト</title>
    <style>
        /* 画面全体の余白をゼロにする */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111; /* 画像が出ないときは真っ黒になります */
            overflow: hidden;
        }

        /* 画面いっぱいに画像を表示するエリア */
        .image-fullscreen-test {
            width: 100%;
            height: 100%;
            /* ★ 下の「ここにURLを貼り付け」に、GitHubからコピーしたURLを入れてください */
            background-image: url('ここにURLを貼り付け');
            background-size: cover;      /* 縦横比を保ったまま画面いっぱいに広げる */
            background-position: center; /* 画像の中心を画面の真ん中に合わせる */
            background-repeat: no-repeat;/* 画像を繰り返し表示しない */
        }
    </style>
</head>
<body>

    <!-- この箱の中に画像が表示されます -->
    <div class="image-fullscreen-test"></div>

</body>
</html>
