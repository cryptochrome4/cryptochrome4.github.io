<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Bouncing Game</title>
    <style>
        /* 軽さを維持しつつ、洗練されたダークモダンなCSS */
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --btn-hover: #0284c7;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* ゲーム画面（壁判定の基準） */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* コントロールパネル */
        #control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 10;
        }

        button {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--btn-hover);
            transform: scale(1.05);
        }

        /* 動く単語の共通スタイル */
        .moving-word {
            position: absolute;
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--text-color);
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: opacity 0.15s, transform 0.1s;
        }

        .moving-word:hover {
            transform: scale(1.1);
        }

        /* レベルごとの視覚的な区分（おしゃれなグラデーション） */
        .lv-1 { background: linear-gradient(135deg, #10b981, #059669); } /* かなり遅い：緑 */
        .lv-2 { background: linear-gradient(135deg, #06b6d4, #0891b2); } /* 遅い：シアン */
        .lv-3 { background: linear-gradient(135deg, #3b82f6, #2563eb); } /* 普通：青 */
        .lv-4 { background: linear-gradient(135deg, #f59e0b, #d97706); } /* 早い：オレンジ */
        .lv-5 { background: linear-gradient(135deg, #ef4444, #dc2626); } /* かなり早い：赤 */
    </style>
</head>
<body>

    <div id="game-container">
        <div id="control-panel">
            <button id="start-btn">ランダム</button>
        </div>
    </div>

    <script>
        // --- 1. 単語データとレベル区分（ここに入力・追加できます） ---
        // スピードの定義 (1: かなり遅い 〜 5: かなり早い)
        const SPEED_MAP = {
            1: 1.5,
            2: 3.0,
            3: 5.0,
            4: 7.5,
            5: 11.0
        };

        // プリセットの単語リスト
        const wordPool = [
            { text: "atom", level: 1 },
            { text: "proton", level: 1 },
             { text: "299,792km/s", level: 1 },
        { text: "quarks", level: 1 },
             { text: "molecule", level: 1 },
            { text: "Gμv", level: 1 },
            { text: "molecule", level: 1 },
            { text: "molecule", level: 1 },
            { text: "molecule", level: 1 },
            { text: "molecule", level: 1 },
            { text: "molecule", level: 1 },
            { text: "molecule", level: 1 },
            { text: "molecule", level: 1 },
            { text: "electron", level: 2 },
            { text: "neutrion", level: 2 },
            { text: "9.8m/s②", level: 2 },
            { text: "neutrion", level: 2 },
            { text: "neutrion", level: 2 },
            { text: "neutrion", level: 2 },
            { text: "Cosmos", level: 3 },
            { text: "Runner", level: 3 },
            { text: "Shadow", level: 4 },
            { text: "Rocket", level: 4 },
            { text: "Lightning", level: 5 },
            { text: "Meteor", level: 5 }
        ];

        // --- 2. ゲームの管理データ ---
        const container = document.getElementById('game-container');
        const startBtn = document.getElementById('start-btn');
        let activeWords = [];
        let animationFrameId = null;

        // --- 3. イベントリスナー ---
        startBtn.addEventListener('click', startGame);

        // --- 4. ゲーム開始処理 ---
        function startGame() {
            // 前回のゲームが残っていればクリア
            clearExistingGame();

            // 1. プールからランダムに5個の単語を選択（重複可）
            const chosenWords = [];
            for (let i = 0; i < 5; i++) {
                const randomIndex = Math.floor(Math.random() * wordPool.length);
                chosenWords.push(wordPool[randomIndex]);
            }

            // 2. 選ばれた単語のDOM要素を作成し、初期位置と方向を設定
            chosenWords.forEach(wordData => {
                const wordEl = document.createElement('div');
                wordEl.classList.add('moving-word', `lv-${wordData.level}`);
                wordEl.textContent = wordData.text;
                container.appendChild(wordEl);

                // 単語のサイズを取得
                const rect = wordEl.getBoundingClientRect();
                
                // 画面内に収まる初期位置をランダム決定
                const posX = Math.random() * (window.innerWidth - rect.width);
                const posY = Math.random() * (window.innerHeight - rect.height);
                
                // ランダムな移動方向（角度）を決定
                const angle = Math.random() * Math.PI * 2;
                const speed = SPEED_MAP[wordData.level];

                const wordObj = {
                    element: wordEl,
                    x: posX,
                    y: posY,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    width: rect.width,
                    height: rect.height
                };

                // 初期配置の適用
                wordEl.style.left = `${wordObj.x}px`;
                wordEl.style.top = `${wordObj.y}px`;

                // クリック時の消滅処理
                wordEl.addEventListener('click', () => {
                    wordEl.remove();
                    activeWords = activeWords.filter(w => w !== wordObj);
                    checkGameClear();
                });

                activeWords.push(wordObj);
            });

            // 3. コントロールボタンを隠す
            startBtn.style.display = 'none';

            // 4. アニメーションループ開始
            animationFrameId = requestAnimationFrame(updatePhysics);
        }

        // --- 5. 移動と反発の物理計算ループ ---
        function updatePhysics() {
            const maxX = window.innerWidth;
            const maxY = window.innerHeight;

            activeWords.forEach(word => {
                // 位置の更新
                word.x += word.dx;
                word.y += word.dy;

                // 左・右の壁との衝突判定
                if (word.x <= 0) {
                    word.x = 0;
                    word.dx *= -1;
                } else if (word.x + word.width >= maxX) {
                    word.x = maxX - word.width;
                    word.dx *= -1;
                }

                // 上・下の壁との衝突判定
                if (word.y <= 0) {
                    word.y = 0;
                    word.dy *= -1;
                } else if (word.y + word.height >= maxY) {
                    word.y = maxY - word.height;
                    word.dy *= -1;
                }

                // DOMに反映
                word.element.style.left = `${word.x}px`;
                word.element.style.top = `${word.y}px`;
            });

            // ループを継続
            if (activeWords.length > 0) {
                animationFrameId = requestAnimationFrame(updatePhysics);
            }
        }

        // --- 6. クリア判定と初期化 ---
        function checkGameClear() {
            if (activeWords.length === 0) {
                cancelAnimationFrame(animationFrameId);
                // クリア画面は挟まず、すぐにボタンを表示して最初に戻す
                startBtn.style.display = 'inline-block';
            }
        }

        function clearExistingGame() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            activeWords.forEach(w => w.element.remove());
            activeWords = [];
        }
    </script>
</body>
</html>
