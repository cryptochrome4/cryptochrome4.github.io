<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素サッカーカードゲーム CFC</title>
<style>
/* ---------- 2013年スタイル ---------- */
* { box-sizing: border-box; }
body {
  background: #0b0f14;
  color: #c9d1d9;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  padding: 10px;
  margin: 0;
}
header {
  text-align: center;
  border-bottom: 2px solid #2a313c;
  padding-bottom: 10px;
  margin-bottom: 15px;
}
header h1 { color: #fff; margin:0; font-size:1.6rem; }
header p { color: #8b949e; margin:4px 0 0; font-size:0.9rem; }

/* メインレイアウト */
.game-area {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
}

/* プレイヤーエリア */
.player-zone {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 12px;
  width: 100%;
  max-width: 480px;
  min-width: 300px;
  flex: 1 1 45%;
}

.player-zone h2 {
  margin: 0 0 6px 0;
  font-size: 1.2rem;
  color: #58a6ff;
  border-bottom: 1px solid #30363d;
  padding-bottom: 4px;
}
.player-zone .info {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  margin: 4px 0 8px;
  background: #0d1117;
  padding: 4px 10px;
  border-radius: 4px;
}

/* 手札 */
.hand {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 70px;
  padding: 6px 0;
}
.hand .card {
  background: #1c2333;
  border: 1px solid #3d4756;
  border-radius: 5px;
  padding: 4px 8px;
  font-size: 0.7rem;
  cursor: pointer;
  width: 70px;
  flex-shrink: 0;
  transition: 0.1s;
}
.hand .card:hover { border-color: #58a6ff; background: #252e3f; }
.hand .card .sym { font-size: 1.1rem; font-weight:bold; color:#fff; }
.hand .card .atk { color: #ff7b72; }

/* フィールド */
.field {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 80px;
  padding: 6px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px dashed #30363d;
}
.field .card {
  background: #1a2233;
  border: 2px solid #58a6ff;
  border-radius: 5px;
  padding: 4px 8px;
  font-size: 0.7rem;
  width: 80px;
}
.field .card .sym { font-size: 1.2rem; font-weight:bold; color:#fff; }
.field .card .atk { color: #ff7b72; }

/* ボタン */
.btn {
  background: #238636;
  border: none;
  color: #fff;
  padding: 6px 16px;
  border-radius: 4px;
  font-size: 0.9rem;
  cursor: pointer;
  margin: 4px 2px;
}
.btn:hover { background: #2ea043; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
.btn-danger { background: #da3633; }
.btn-danger:hover { background: #f85149; }

/* ログ */
.log {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 5px;
  padding: 6px 10px;
  max-height: 100px;
  overflow-y: auto;
  font-size: 0.8rem;
  margin-top: 8px;
  font-family: monospace;
}
.log p { margin: 2px 0; }

/* 説明ポップアップ（カードクリック時） */
#card-detail {
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 10px;
  background: #161b22;
  border: 1px solid #58a6ff;
  border-radius: 8px;
  padding: 12px 16px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 99;
  display: none;
  font-size:0.85rem;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
#card-detail .close {
  float: right;
  background: #da3633;
  border: none;
  color:#fff;
  padding:2px 10px;
  border-radius:4px;
  cursor:pointer;
}
#card-detail .detail-sym { font-size:1.8rem; font-weight:bold; color:#fff; }
#card-detail .detail-atk { color:#ff7b72; }
</style>
</head>

// ----- ゲーム状態 -----
var state = {
  player: { life: 40000, deck: [], hand: [], field: [], hasAttacked: false },
  computer: { life: 40000, deck: [], hand: [], field: [], hasAttacked: false },
  turn: 'player', // 'player' or 'computer'
  gameOver: false,
  turnPhase: 'main' // 'draw' or 'main'
};

// ----- 補助関数 -----
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function cloneCard(c) {
  return { no:c.no, sym:c.sym, name:c.name, group:c.group, desc:c.desc, soccer:c.soccer };
}

function getAtk(sym) {
  return CARD_ATK[sym] || 3000;
}

// ----- 初期化 -----
function initGame() {
  // 山札作成 (118枚をシャッフル)
  var deckAll = ALL_CARDS.map(function(c) { return cloneCard(c); });
  shuffle(deckAll);
  // プレイヤーとコンピュータに40枚ずつ配布
  state.player.deck = deckAll.slice(0, 40);
  state.computer.deck = deckAll.slice(40, 80);
  // 手札・フィールドをリセット
  state.player.hand = [];
  state.player.field = [];
  state.player.life = 40000;
  state.player.hasAttacked = false;
  state.computer.hand = [];
  state.computer.field = [];
  state.computer.life = 40000;
  state.computer.hasAttacked = false;
  state.gameOver = false;
  state.turnPhase = 'draw';

  // 先攻後攻ランダム
  state.turn = Math.random() < 0.5 ? 'player' : 'computer';
  addLog('🔄 再戦！ 先攻は ' + (state.turn === 'player' ? 'あなた' : 'コンピュータ') + ' です。');

  // 各プレイヤー5枚ドロー
  for (var i=0; i<5; i++) {
    drawCard('player');
    drawCard('computer');
  }

  // コンピュータの手札が見えないようにする（表示はハンド数だけ）
  // コンピュータの手札は内部で管理、表示は伏せる
  renderAll();
  // もし先攻がコンピュータなら、自動でコンピュータターン開始
  if (state.turn === 'computer') {
    setTimeout(computerTurn, 500);
  } else {
    addLog('👤 あなたのターンです。ドローしてください。');
  }
}

// ----- ドロー -----
function drawCard(who) {
  var p = (who === 'player') ? state.player : state.computer;
  if (p.deck.length === 0) return null;
  if (p.hand.length >= 8) {
    addLog((who==='player'?'あなた':'コンピュータ') + 'の手札が上限(8枚)です。');
    return null;
  }
  var card = p.deck.pop();
  p.hand.push(card);
  return card;
}

// ----- カードをフィールドに出す (手札から) -----
function playCard(who, handIndex) {
  var p = (who === 'player') ? state.player : state.computer;
  if (p.field.length >= 3) {
    addLog((who==='player'?'あなた':'コンピュータ') + 'のフィールドは満杯です。');
    return false;
  }
  if (handIndex < 0 || handIndex >= p.hand.length) return false;
  var card = p.hand.splice(handIndex, 1)[0];
  p.field.push(card);
  renderAll();
  return true;
}

// ----- 攻撃 (プレイヤー→コンピュータ) -----
function playerAttack(attackerFieldIndex) {
  if (state.gameOver) return;
  if (state.turn !== 'player') {
    addLog('あなたのターンではありません。');
    return;
  }
  if (state.player.hasAttacked) {
    addLog('すでに攻撃しました。');
    return;
  }
  var p = state.player;
  if (attackerFieldIndex < 0 || attackerFieldIndex >= p.field.length) return;
  var attacker = p.field[attackerFieldIndex];
  var def = state.computer;

  // 自滅判定 (1/4)
  if (Math.random() < 0.25) {
    p.field.splice(attackerFieldIndex, 1);
    addLog('💥 ' + attacker.sym + ' が自滅しました！');
    renderAll();
    return;
  }

  var atkVal = getAtk(attacker.sym);
  // 相手フィールドにカードがあれば、先頭とバトル
  if (def.field.length > 0) {
    var defCard = def.field[0];
    var defAtk = getAtk(defCard.sym);
    if (atkVal > defAtk) {
      // 相手フィールドのカードを破壊、残りダメージをライフに
      def.field.splice(0, 1);
      var dmg = atkVal - defAtk;
      def.life -= dmg;
      addLog('⚔️ ' + attacker.sym + '(' + atkVal + ') が ' + defCard.sym + '(' + defAtk + ') を破壊！ ' + dmg + 'ダメージ！');
    } else if (atkVal < defAtk) {
      // こちらのカードがやられる
      p.field.splice(attackerFieldIndex, 1);
      var dmg2 = defAtk - atkVal;
      p.life -= dmg2;
      addLog('💀 ' + attacker.sym + '(' + atkVal + ') が ' + defCard.sym + '(' + defAtk + ') にやられた！ ' + dmg2 + 'ダメージ！');
    } else {
      // 同値: 両方破壊
      p.field.splice(attackerFieldIndex, 1);
      def.field.splice(0, 1);
      addLog('⚖️ ' + attacker.sym + ' と ' + defCard.sym + ' 相打ち！');
    }
  } else {
    // ダイレクトアタック
    def.life -= atkVal;
    addLog('🎯 ダイレクトアタック！ ' + attacker.sym + ' が ' + atkVal + ' ダメージ！');
  }

  state.player.hasAttacked = true;
  // ゲームオーバーチェック
  checkGameOver();
  renderAll();
}

// ----- コンピュータのAI (バカじゃない) -----
function computerTurn() {
  if (state.gameOver) return;
  if (state.turn !== 'computer') return;
  addLog('🖥️ コンピュータのターン');

  // ドロー
  drawCard('computer');
  // フィールドに出す (手札から1枚)
  var c = state.computer;
  if (c.hand.length > 0 && c.field.length < 3) {
    // ランダムに1枚出す
    var idx = Math.floor(Math.random() * c.hand.length);
    playCard('computer', idx);
  }

  // 攻撃 (相手より攻撃力が高い場合のみ)
  if (c.field.length > 0 && state.player.field.length > 0) {
    var myAtk = getAtk(c.field[0].sym);
    var enemyAtk = getAtk(state.player.field[0].sym);
    if (myAtk > enemyAtk) {
      // 安全に攻撃できる
      computerExecuteAttack(0);
    } else {
      // 攻撃しない (自殺行為を避ける)
      addLog('🖥️ コンピュータは攻撃を控えました (自殺回避)');
    }
  } else if (c.field.length > 0 && state.player.field.length === 0) {
    // ダイレクトアタック
    computerExecuteAttack(0);
  }

  // ターン終了
  state.computer.hasAttacked = false;
  state.turn = 'player';
  state.player.hasAttacked = false;
  addLog('👤 あなたのターンです。ドローしてください。');
  renderAll();
}

function computerExecuteAttack(fieldIdx) {
  if (state.gameOver) return;
  var c = state.computer;
  if (fieldIdx < 0 || fieldIdx >= c.field.length) return;
  var attacker = c.field[fieldIdx];
  var p = state.player;

  // 自滅
  if (Math.random() < 0.25) {
    c.field.splice(fieldIdx, 1);
    addLog('💥 コンピュータの ' + attacker.sym + ' が自滅！');
    renderAll();
    return;
  }

  var atkVal = getAtk(attacker.sym);
  if (p.field.length > 0) {
    var defCard = p.field[0];
    var defAtk = getAtk(defCard.sym);
    if (atkVal > defAtk) {
      p.field.splice(0, 1);
      var dmg = atkVal - defAtk;
      p.life -= dmg;
      addLog('⚔️ コンピュータの ' + attacker.sym + '(' + atkVal + ') が ' + defCard.sym + '(' + defAtk + ') を破壊！ ' + dmg + 'ダメージ！');
    } else if (atkVal < defAtk) {
      c.field.splice(fieldIdx, 1);
      var dmg2 = defAtk - atkVal;
      c.life -= dmg2;
      addLog('💀 コンピュータの ' + attacker.sym + ' がやられた！');
    } else {
      c.field.splice(fieldIdx, 1);
      p.field.splice(0, 1);
      addLog('⚖️ 相打ち！');
    }
  } else {
    p.life -= atkVal;
    addLog('🎯 コンピュータのダイレクトアタック！ ' + atkVal + ' ダメージ！');
  }

  state.computer.hasAttacked = true;
  checkGameOver();
  renderAll();
}

// ----- ゲームオーバーチェック -----
function checkGameOver() {
  if (state.player.life <= 0) {
    state.gameOver = true;
    addLog('💀 あなたの負けです...');
    return true;
  }
  if (state.computer.life <= 0) {
    state.gameOver = true;
    addLog('🎉 あなたの勝ち！');
    return true;
  }
  // 山札・手札・フィールドがすべて空
  if (state.player.deck.length === 0 && state.player.hand.length === 0 && state.player.field.length === 0 &&
      state.computer.deck.length === 0 && state.computer.hand.length === 0 && state.computer.field.length === 0) {
    state.gameOver = true;
    addLog('🤝 引き分け (すべてのカードが尽きた)');
    return true;
  }
  return false;
}

// ----- レンダリング -----
function renderAll() {
  renderPlayer('player');
  renderPlayer('computer');
  // 手札枚数・山札枚数・ライフ更新
  document.getElementById('player-life').textContent = state.player.life;
  document.getElementById('com-life').textContent = state.computer.life;
  document.getElementById('player-hand-count').textContent = state.player.hand.length;
  document.getElementById('com-hand-count').textContent = state.computer.hand.length;
  document.getElementById('player-deck-count').textContent = state.player.deck.length;
  document.getElementById('com-deck-count').textContent = state.computer.deck.length;
}

function renderPlayer(who) {
  var p = (who === 'player') ? state.player : state.computer;
  var fieldId = (who === 'player') ? 'player-field' : 'com-field';
  var handId = (who === 'player') ? 'player-hand' : 'com-hand';

  // フィールド
  var fieldEl = document.getElementById(fieldId);
  fieldEl.innerHTML = '';
  p.field.forEach(function(card, idx) {
    var div = document.createElement('div');
    div.className = 'card';
    var atk = getAtk(card.sym);
    div.innerHTML = '<span class="sym">' + card.sym + '</span> <span class="atk">' + atk + '</span><br><small>' + card.name + '</small>';
    div.style.cursor = 'pointer';
    div.title = 'クリックで詳細';
    div.onclick = function() { showDetail(card); };
    if (who === 'player' && state.turn === 'player' && !state.player.hasAttacked && !state.gameOver) {
      // 攻撃ボタン
      var atkBtn = document.createElement('button');
      atkBtn.textContent = '攻撃';
      atkBtn.className = 'btn';
      atkBtn.style.fontSize = '0.6rem';
      atkBtn.style.padding = '2px 6px';
      atkBtn.onclick = function(e) {
        e.stopPropagation();
        playerAttack(idx);
      };
      div.appendChild(atkBtn);
    }
    fieldEl.appendChild(div);
  });

  // 手札 (コンピュータは伏せる)
  var handEl = document.getElementById(handId);
  handEl.innerHTML = '';
  if (who === 'computer') {
    // コンピュータの手札はカードの裏面だけ表示
    for (var i=0; i<p.hand.length; i++) {
      var back = document.createElement('div');
      back.className = 'card';
      back.style.background = '#1a1a2e';
      back.style.borderColor = '#4a4a6a';
      back.textContent = '🂠';
      back.style.fontSize = '1.5rem';
      back.style.textAlign = 'center';
      back.style.padding = '4px 0';
      back.title = 'コンピュータの手札';
      handEl.appendChild(back);
    }
  } else {
    // プレイヤーの手札は表示
    p.hand.forEach(function(card, idx) {
      var div = document.createElement('div');
      div.className = 'card';
      var atk = getAtk(card.sym);
      div.innerHTML = '<span class="sym">' + card.sym + '</span> <span class="atk">' + atk + '</span><br><small>' + card.name + '</small>';
      div.style.cursor = 'pointer';
      div.title = 'クリックで詳細';
      div.onclick = function() { showDetail(card); };
      // フィールドに出せるボタン
      if (state.turn === 'player' && !state.gameOver && state.player.field.length < 3) {
        var playBtn = document.createElement('button');
        playBtn.textContent = '出す';
        playBtn.className = 'btn';
        playBtn.style.fontSize = '0.5rem';
        playBtn.style.padding = '1px 4px';
        playBtn.onclick = function(e) {
          e.stopPropagation();
          if (playCard('player', idx)) {
            renderAll();
          }
        };
        div.appendChild(playBtn);
      }
      handEl.appendChild(div);
    });
  }
}

// ----- カード詳細表示 -----
function showDetail(card) {
  var detail = document.getElementById('card-detail');
  var content = document.getElementById('detail-content');
  var atk = getAtk(card.sym);
  content.innerHTML = 
    '<div class="detail-sym">' + card.sym + ' (No.' + card.no + ')</div>' +
    '<div><strong>' + card.name + '</strong> ｜ ' + card.group + '</div>' +
    '<div style="color:#ff7b72;">⚔ 攻撃力: ' + atk + '</div>' +
    '<div style="margin-top:6px;"><em>' + card.desc + '</em></div>' +
    '<div style="margin-top:6px;background:#0d1117;padding:6px;border-radius:4px;">⚽ ' + card.soccer + '</div>';
  detail.style.display = 'block';
}

function closeDetail() {
  document.getElementById('card-detail').style.display = 'none';
}

// ----- ログ -----
function addLog(msg) {
  var log = document.getElementById('log');
  var p = document.createElement('p');
  p.textContent = msg;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

// ----- イベント登録 -----
document.getElementById('btn-draw').addEventListener('click', function() {
  if (state.gameOver) return;
  if (state.turn !== 'player') {
    addLog('あなたのターンではありません。');
    return;
  }
  if (state.turnPhase === 'main') {
    addLog('すでにドローしました。');
    return;
  }
  var card = drawCard('player');
  if (card) {
    addLog('🃏 ' + card.sym + ' をドローしました。');
    state.turnPhase = 'main';
    renderAll();
  } else {
    addLog('山札が空です。');
  }
});

document.getElementById('btn-end-turn').addEventListener('click', function() {
  if (state.gameOver) return;
  if (state.turn !== 'player') {
    addLog('あなたのターンではありません。');
    return;
  }
  // プレイヤーターン終了 → コンピュータターンへ
  state.turn = 'computer';
  state.player.hasAttacked = false;
  state.turnPhase = 'draw';
  addLog('🔄 ターン終了。コンピュータのターンです。');
  renderAll();
  setTimeout(computerTurn, 600);
});

document.getElementById('btn-restart').addEventListener('click', function() {
  document.getElementById('log').innerHTML = '<p>▶ ゲームを再起動します...</p>';
  initGame();
});

// ----- 初期起動 -----
initGame();

</script>
</body>
</html>
