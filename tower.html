<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>クラロワ風 全51タイプ（前編）</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a2a3a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    .game-container {
      background: #2d4a5e;
      padding: 20px;
      border-radius: 30px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6);
      max-width: 1000px;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #6b8c5c;
      border-radius: 20px;
      box-shadow: inset 0 0 0 2px #3d5a3d;
      cursor: grab;
      width: 100%;
      height: auto;
      aspect-ratio: 800/500;
    }
    .ui {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      gap: 10px;
    }
    .cost-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .cost-box {
      background: #1f3a47;
      padding: 8px 18px;
      border-radius: 40px;
      border: 2px solid #ffd966;
      box-shadow: 0 4px 0 #7f6b3d;
      font-size: 18px;
    }
    .unit-btn {
      background: #3a5a6a;
      padding: 6px 14px;
      border-radius: 40px;
      border: 2px solid #b8d4e3;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-size: 13px;
      transition: 0.1s;
      box-shadow: 0 4px 0 #1f2f3a;
      white-space: nowrap;
    }
    .unit-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .unit-btn.selected {
      background: #f1c40f;
      color: #1a2a3a;
      border-color: #f39c12;
    }
    .unit-btn.has-bg {
      position: relative;
    }
    .unit-btn .color-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 4px;
      border: 1px solid rgba(255,255,255,0.3);
      vertical-align: middle;
    }
    .reset-btn {
      background: #c0392b;
      border: none;
      padding: 8px 25px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #78281f;
      transition: 0.1s;
    }
    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .message {
      background: #17252e;
      padding: 8px 25px;
      border-radius: 40px;
      border: 2px solid #f1c40f;
      font-size: 15px;
    }
    .unit-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 80px;
      overflow-y: auto;
      padding: 4px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      margin-top: 8px;
      width: 100%;
    }
    .unit-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .unit-scroll::-webkit-scrollbar-thumb {
      background: #ffd966;
      border-radius: 4px;
    }
    @media (max-width: 700px) {
      .ui { font-size: 13px; }
      .unit-btn { font-size: 11px; padding: 4px 10px; }
      .cost-box { font-size: 14px; padding: 6px 12px; }
      .message { font-size: 12px; padding: 6px 14px; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  
  <div class="ui">
    <div class="cost-area">
      <div class="cost-box">💎 <span id="costDisplay">10</span></div>
    </div>
    <div class="message" id="messageDisplay">⚔️ ユニットを選んでドラッグ</div>
    <button class="reset-btn" id="resetBtn">🔄 リセット</button>
  </div>
  
  <!-- ユニットボタン一覧（スクロール） -->
  <div class="unit-scroll" id="unitButtonContainer"></div>
</div>

<script>
// ============================================================
// 前編：全51タイプ定義＋基本ゲームエンジン
// ============================================================

// ---- キャンバス ----
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const costSpan = document.getElementById('costDisplay');
const msgDiv = document.getElementById('messageDisplay');
const btnContainer = document.getElementById('unitButtonContainer');

// ---- ゲーム状態 ----
let gameOver = false;
let winner = null;
let playerCost = 10;
const MAX_COST = 10;
let selectedUnitType = null;
let isDragging = false;
let previewUnit = null;

// ---- タワー ----
const playerTower = { x: 80, y: 200, w: 60, h: 100, hp: 100, maxHp: 100 };
const cpuTower = { x: 660, y: 200, w: 60, h: 100, hp: 100, maxHp: 100 };
let units = [];

// ---- CPU用エリクサー ----
let cpuCost = 10;
const CPU_MAX_COST = 10;
let cpuTimer = 0;

// ============================================================
// 1. 全51タイプのステータス定義
// ============================================================
const UNIT_TYPES = {
  // ---- 基本4種 ----
  melee:   { name: '近接', cost: 3, hp: 40, attack: 12, range: 40, speed: 1.2, size: 18, attackSpeed: 30, icon: '⚔️' },
  ranged:  { name: '遠距離', cost: 5, hp: 25, attack: 8, range: 100, speed: 0.8, size: 16, attackSpeed: 30, icon: '🏹' },
  tank:    { name: 'タンク', cost: 4, hp: 80, attack: 6, range: 30, speed: 0.8, size: 24, attackSpeed: 40, icon: '🛡️' },
  mage:    { name: '魔法使い', cost: 6, hp: 20, attack: 10, range: 120, speed: 0.7, size: 16, attackSpeed: 35, icon: '🧙' },

  // ---- 戦術4種 ----
  speedster: { name: 'スピードスター', cost: 3, hp: 15, attack: 8, range: 25, speed: 2.5, size: 14, attackSpeed: 20, icon: '⚡' },
  healer:    { name: 'ヒーラー', cost: 5, hp: 30, attack: 0, range: 80, speed: 0.9, size: 18, attackSpeed: 20, icon: '💚' },
  bomber:    { name: '爆弾兵', cost: 4, hp: 20, attack: 25, range: 70, speed: 1.0, size: 18, attackSpeed: 1, icon: '💥' },
  wall:      { name: '壁', cost: 3, hp: 120, attack: 0, range: 0, speed: 0, size: 30, attackSpeed: 999, icon: '🧱' },

  // ---- 特殊4種 ----
  sniper:    { name: 'スナイパー', cost: 6, hp: 18, attack: 15, range: 200, speed: 0.6, size: 14, attackSpeed: 45, icon: '🎯' },
  necromancer: { name: 'ネクロマンサー', cost: 5, hp: 25, attack: 5, range: 90, speed: 0.8, size: 18, attackSpeed: 30, icon: '🧟' },
  stealth:   { name: 'ステルス', cost: 4, hp: 30, attack: 10, range: 35, speed: 1.3, size: 16, attackSpeed: 28, icon: '👻' },
  freeze:    { name: 'フリーズ', cost: 4, hp: 25, attack: 2, range: 100, speed: 0.9, size: 18, attackSpeed: 80, icon: '❄️' },

  // ---- 変則10種 ----
  jumper:    { name: 'ジャンプ兵', cost: 4, hp: 25, attack: 10, range: 30, speed: 1.4, size: 16, attackSpeed: 30, icon: '🦘' },
  counter:   { name: 'カウンター', cost: 4, hp: 30, attack: 4, range: 30, speed: 1.0, size: 18, attackSpeed: 30, icon: '🔄' },
  berserker: { name: 'バーサーカー', cost: 4, hp: 50, attack: 8, range: 35, speed: 1.3, size: 20, attackSpeed: 28, icon: '🔥' },
  vampire:   { name: 'バンパイア', cost: 5, hp: 35, attack: 10, range: 30, speed: 1.0, size: 18, attackSpeed: 28, icon: '🧛' },
  golem:     { name: 'ゴーレム', cost: 6, hp: 70, attack: 8, range: 30, speed: 0.7, size: 26, attackSpeed: 35, icon: '🪨' },
  wind:      { name: 'ウィンド', cost: 3, hp: 15, attack: 1, range: 60, speed: 1.2, size: 16, attackSpeed: 30, icon: '🌪️' },
  mirage:    { name: 'ミラージュ', cost: 5, hp: 20, attack: 6, range: 35, speed: 1.0, size: 16, attackSpeed: 30, icon: '🌀' },
  electro:   { name: 'エレクトロ', cost: 4, hp: 25, attack: 6, range: 80, speed: 0.9, size: 16, attackSpeed: 30, icon: '⚡' },
  poison:    { name: 'ポイズン', cost: 4, hp: 25, attack: 3, range: 90, speed: 0.9, size: 16, attackSpeed: 30, icon: '☠️' },
  charger:   { name: 'チャージャー', cost: 4, hp: 35, attack: 15, range: 30, speed: 1.0, size: 18, attackSpeed: 30, icon: '🏇' },

  // ---- ギミック8種 ----
  timewarp:  { name: 'タイムワープ', cost: 5, hp: 20, attack: 0, range: 100, speed: 0.8, size: 18, attackSpeed: 999, icon: '⏳' },
  teleporter: { name: 'テレポーター', cost: 5, hp: 25, attack: 0, range: 150, speed: 0.8, size: 18, attackSpeed: 999, icon: '📡' },
  shield:    { name: 'シールド', cost: 4, hp: 20, attack: 0, range: 80, speed: 0.9, size: 18, attackSpeed: 999, icon: '🛡️✨' },
  copycat:   { name: 'コピーキャット', cost: 3, hp: 30, attack: 0, range: 30, speed: 1.0, size: 16, attackSpeed: 999, icon: '🐱' },
  grenade:   { name: 'グレネード', cost: 3, hp: 10, attack: 20, range: 60, speed: 0, size: 14, attackSpeed: 999, icon: '💣' },
  treant:    { name: 'トレント', cost: 6, hp: 40, attack: 5, range: 40, speed: 1.0, size: 16, attackSpeed: 30, icon: '🌳' },
  elf:       { name: 'エルフ', cost: 4, hp: 20, attack: 0, range: 90, speed: 0.9, size: 16, attackSpeed: 999, icon: '🧝' },
  blackhole: { name: 'ブラックホール', cost: 7, hp: 40, attack: 15, range: 120, speed: 0.6, size: 22, attackSpeed: 20, icon: '🕳️' },

  // ---- コンセプト6種 ----
  treasure:  { name: 'トレジャー', cost: 2, hp: 10, attack: 0, range: 0, speed: 0, size: 16, attackSpeed: 999, icon: '📦' },
  decay:     { name: 'ディケイ', cost: 6, hp: 30, attack: 0, range: 80, speed: 0.6, size: 20, attackSpeed: 999, icon: '🧪' },
  swarm:     { name: 'スワーム', cost: 4, hp: 8, attack: 3, range: 30, speed: 1.2, size: 10, attackSpeed: 25, icon: '🐝' },
  nest:      { name: 'ネスト', cost: 6, hp: 60, attack: 0, range: 0, speed: 0, size: 28, attackSpeed: 999, icon: '🪹' },
  reflector: { name: 'リフレクター', cost: 5, hp: 40, attack: 0, range: 0, speed: 0, size: 24, attackSpeed: 999, icon: '🪞' },
  phoenix:   { name: 'フェニックス', cost: 7, hp: 30, attack: 12, range: 40, speed: 0.9, size: 20, attackSpeed: 30, icon: '🔥' },

  // ---- 超常7種 ----
  gambler:   { name: 'ギャンブラー', cost: 3, hp: 25, attack: 1, range: 40, speed: 1.0, size: 18, attackSpeed: 30, icon: '🎲' },
  backup:    { name: 'バックアップ', cost: 2, hp: 30, attack: 10, range: 40, speed: 0, size: 16, attackSpeed: 30, icon: '⏰' },
  trader:    { name: 'トレーダー', cost: 5, hp: 1, attack: 0, range: 30, speed: 0.9, size: 16, attackSpeed: 999, icon: '🔄' },
  sabotage:  { name: 'サボタージュ', cost: 4, hp: 20, attack: 0, range: 0, speed: 0.8, size: 16, attackSpeed: 999, icon: '🛠️' },
  bouncer:   { name: 'バウンサー', cost: 5, hp: 25, attack: 10, range: 50, speed: 0.9, size: 18, attackSpeed: 30, icon: '⛹️' },
  doppel:    { name: 'ドッペルゲンガー', cost: 4, hp: 20, attack: 0, range: 0, speed: 0.8, size: 16, attackSpeed: 999, icon: '👥' },
  chaos:     { name: 'カオス', cost: 3, hp: 20, attack: 0, range: 0, speed: 0.8, size: 18, attackSpeed: 999, icon: '🌪️' },

  // ---- オリジナル8種（固定背景色付き） ----
  trump:  { name: 'トランプ大統領', cost: 5, hp: 50, attack: 5, range: 60, speed: 0.8, size: 22, attackSpeed: 35, icon: '🇺🇸', bgColor: '#FFD700' },
  judah:  { name: 'ユダヤ', cost: 4, hp: 25, attack: 3, range: 50, speed: 0.9, size: 18, attackSpeed: 30, icon: '✡️', bgColor: '#0A1E8C' },
  oil:    { name: 'オイル', cost: 4, hp: 30, attack: 4, range: 40, speed: 0.9, size: 20, attackSpeed: 30, icon: '🛢️', bgColor: '#1A1A1A' },
  musk:   { name: 'イーロンマスク', cost: 6, hp: 35, attack: 0, range: 0, speed: 0.8, size: 20, attackSpeed: 999, icon: '🚀', bgColor: '#FFFFFF' },
  iran:   { name: 'イラン', cost: 6, hp: 30, attack: 18, range: 250, speed: 0.5, size: 18, attackSpeed: 45, icon: '🇮🇷', bgColor: '#FF6B00' },
  strait: { name: 'ホルムズ海峡', cost: 5, hp: 60, attack: 0, range: 0, speed: 0, size: 30, attackSpeed: 999, icon: '🌊', bgColor: '#6A0DAD' },
  hamas:  { name: 'ハマス', cost: 5, hp: 30, attack: 10, range: 35, speed: 1.0, size: 18, attackSpeed: 30, icon: '🟢', bgColor: '#8B4513' },
  kim:    { name: 'キム・ジョンウン', cost: 8, hp: 40, attack: 50, range: 150, speed: 0.4, size: 22, attackSpeed: 1, icon: '🇰🇵', bgColor: '#0B5E0B' }
};

// ---- ユニットクラス ----
class Unit {
  constructor(x, y, typeKey, team) {
    const def = UNIT_TYPES[typeKey];
    if (!def) throw new Error(`Unknown unit type: ${typeKey}`);
    
    this.typeKey = typeKey;
    this.team = team;
    this.x = x;
    this.y = y;
    this.hp = def.hp;
    this.maxHp = def.hp;
    this.attack = def.attack;
    this.range = def.range;
    this.speed = def.speed;
    this.size = def.size;
    this.attackSpeed = def.attackSpeed;
    this.cost = def.cost;
    this.icon = def.icon;
    this.bgColor = def.bgColor || null;
    this.alive = true;
    this.attackCooldown = 0;
    this.target = null;
    
    // 特殊フラグ
    this.isHealer = (typeKey === 'healer');
    this.isStealth = (typeKey === 'stealth');
    this.isRevealed = false;
    this.isFrozen = false;
    this.frozenTimer = 0;
    this.hasExploded = false;
    this.growTimer = 0;
    this.chargeSpeed = this.speed;
    this.cloneTimer = 0;
    this.hasCloned = false;
    this.reviveCount = 0;
    this.maxRevive = 1;
    this.isPhoenix = (typeKey === 'phoenix');
    this.isCopycat = (typeKey === 'copycat');
    this.copiedType = null;
    this.isBackup = (typeKey === 'backup');
    this.backupTimer = 300; // 5秒
    this.isSpawned = false;
    this.isNest = (typeKey === 'nest');
    this.nestSpawnTimer = 0;
    this.nestSpawnCount = 0;
    this.maxNestSpawns = 3;
    this.isTreasure = (typeKey === 'treasure');
    this.treasureTimer = 600; // 10秒
    this.isDecay = (typeKey === 'decay');
    this.decayTimer = 0;
    this.isReflector = (typeKey === 'reflector');
    this.isGrenade = (typeKey === 'grenade');
    this.hasDetonated = false;
    this.isGambler = (typeKey === 'gambler');
    this.isTrader = (typeKey === 'trader');
    this.hasTraded = false;
    this.isSabotage = (typeKey === 'sabotage');
    this.sabotageTimer = 0;
    this.sabotageActive = false;
    this.isBouncer = (typeKey === 'bouncer');
    this.bounceCount = 0;
    this.maxBounces = 3;
    this.isDoppel = (typeKey === 'doppel');
    this.hasDoppeled = false;
    this.isChaos = (typeKey === 'chaos');
    this.chaosTransformed = false;
    
    // オリジナル用
    this.isTrump = (typeKey === 'trump');
    this.trumpWallCount = 0;
    this.isJudah = (typeKey === 'judah');
    this.isOil = (typeKey === 'oil');
    this.isMusk = (typeKey === 'musk');
    this.isIran = (typeKey === 'iran');
    this.isStrait = (typeKey === 'strait');
    this.isHamas = (typeKey === 'hamas');
    this.hamasTeleported = false;
    this.isKim = (typeKey === 'kim');
    this.kimExploded = false;
  }

  distanceTo(other) {
    return Math.hypot(this.x - other.x, this.y - other.y);
  }

  distanceToRect(rect) {
    const cx = Math.max(rect.x, Math.min(this.x, rect.x + rect.w));
    const cy = Math.max(rect.y, Math.min(this.y, rect.y + rect.h));
    return Math.hypot(this.x - cx, this.y - cy);
  }

  findTarget(units) {
    let closest = null;
    let closestDist = Infinity;

    for (let u of units) {
      if (u === this || !u.alive || u.team === this.team) continue;
      // ステルスは透明でない場合のみターゲット
      if (u.isStealth && !u.isRevealed) continue;
      const d = this.distanceTo(u);
      if (d < closestDist) {
        closestDist = d;
        closest = u;
      }
    }

    const enemyTower = this.team === 'player' ? cpuTower : playerTower;
    const dTower = this.distanceToRect(enemyTower);
    if (dTower < closestDist) {
      closestDist = dTower;
      closest = enemyTower;
    }

    return closest;
  }

  update(units) {
    if (!this.alive) return;
    
    // ---- 凍結 ----
    if (this.isFrozen) {
      this.frozenTimer--;
      if (this.frozenTimer <= 0) this.isFrozen = false;
      return;
    }
    
    // ---- バックアップ（遅延配置） ----
    if (this.isBackup && !this.isSpawned) {
      this.backupTimer--;
      if (this.backupTimer <= 0) {
        this.isSpawned = true;
        this.speed = UNIT_TYPES[this.typeKey].speed || 0.8;
      }
      return;
    }
    
    // ---- トレジャー（エリクサー獲得） ----
    if (this.isTreasure) {
      this.treasureTimer--;
      if (this.treasureTimer <= 0 && this.alive) {
        if (this.team === 'player') {
          playerCost = Math.min(MAX_COST, playerCost + 5);
          updateCostDisplay();
        }
        this.alive = false;
        msgDiv.innerText = '💰 +5エリクサー！';
      }
      return;
    }
    
    // ---- ディケイ（タワー継続ダメ） ----
    if (this.isDecay) {
      this.decayTimer++;
      if (this.decayTimer % 10 === 0) {
        const enemyTower = this.team === 'player' ? cpuTower : playerTower;
        if (this.distanceToRect(enemyTower) < this.range + 40) {
          enemyTower.hp -= 5;
          if (enemyTower.hp < 0) enemyTower.hp = 0;
        }
      }
      return;
    }
    
    // ---- ネスト（自動生成） ----
    if (this.isNest) {
      this.nestSpawnTimer++;
      if (this.nestSpawnTimer >= 300 && this.nestSpawnCount < this.maxNestSpawns) {
        this.nestSpawnTimer = 0;
        this.nestSpawnCount++;
        const spawnUnit = new Unit(
          this.x + (Math.random() - 0.5) * 60,
          this.y + (Math.random() - 0.5) * 60,
          'melee',
          this.team
        );
        spawnUnit.hp = 15;
        spawnUnit.maxHp = 15;
        spawnUnit.attack = 4;
        spawnUnit.size = 12;
        units.push(spawnUnit);
      }
      return;
    }
    
    // ---- リフレクター（反射壁） ----
    if (this.isReflector) {
      // 反射処理は攻撃フェーズで実装（中編）
      return;
    }
    
    // ---- グレネード（地雷） ----
    if (this.isGrenade) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < this.range) {
          // 爆発
          for (let target of units) {
            if (target === this || !target.alive || target.team === this.team) continue;
            if (this.distanceTo(target) < this.range) {
              target.hp -= this.attack;
              if (target.hp <= 0) { target.alive = false; target.hp = 0; }
            }
          }
          const enemyTower = this.team === 'player' ? cpuTower : playerTower;
          if (this.distanceToRect(enemyTower) < this.range) {
            enemyTower.hp -= this.attack;
            if (enemyTower.hp < 0) enemyTower.hp = 0;
          }
          this.alive = false;
          this.hasDetonated = true;
          break;
        }
      }
      return;
    }
    
    // ---- チャージャー（加速） ----
    if (this.typeKey === 'charger') {
      this.chargeSpeed = Math.min(3.0, this.chargeSpeed + 0.005);
      this.speed = this.chargeSpeed;
    }
    
    // ---- トレント（成長） ----
    if (this.typeKey === 'treant') {
      this.growTimer++;
      if (this.growTimer % 60 === 0 && this.growTimer < 1800) {
        this.hp = Math.min(120, this.hp + 3);
        this.maxHp = this.hp;
        this.attack = Math.min(20, this.attack + 0.5);
        this.size = Math.min(40, this.size + 0.5);
        this.speed = Math.max(0.6, this.speed - 0.005);
      }
    }
    
    // ---- フェニックス（復活） ----
    if (this.isPhoenix && !this.alive && this.reviveCount < this.maxRevive) {
      this.reviveCount++;
      this.alive = true;
      this.hp = this.maxHp;
      msgDiv.innerText = '🔥 フェニックス復活！';
      return;
    }
    
    if (this.attackCooldown > 0) this.attackCooldown--;
    
    // ---- ヒーラー ----
    if (this.isHealer) {
      this.healCooldown = (this.healCooldown || 0) - 1;
      if (this.healCooldown <= 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team !== this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.hp = Math.min(u.maxHp, u.hp + 3);
          }
        }
        this.healCooldown = 20;
      }
      return;
    }
    
    // ---- 壁 ----
    if (this.typeKey === 'wall') return;
    
    // ---- 爆弾兵（自爆済み） ----
    if (this.typeKey === 'bomber' && this.hasExploded) return;
    
    // ---- カオス（変身） ----
    if (this.isChaos && !this.chaosTransformed) {
      const keys = Object.keys(UNIT_TYPES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const def = UNIT_TYPES[randomKey];
      this.typeKey = randomKey;
      this.hp = def.hp;
      this.maxHp = def.hp;
      this.attack = def.attack;
      this.range = def.range;
      this.speed = def.speed;
      this.size = def.size;
      this.attackSpeed = def.attackSpeed;
      this.icon = def.icon;
      this.bgColor = def.bgColor || null;
      this.chaosTransformed = true;
      // 特殊フラグ更新（簡略化）
    }
    
    // ---- ターゲット ----
    this.target = this.findTarget(units);
    
    if (!this.target) {
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- 距離判定 ----
    let dist;
    if (this.target.hp !== undefined) {
      dist = this.distanceTo(this.target);
    } else {
      dist = this.distanceToRect(this.target);
    }
    
    if (dist <= this.range) {
      if (this.attackCooldown === 0) {
        this.performAttack(units);
        this.attackCooldown = this.attackSpeed;
      }
    } else {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const len = Math.hypot(dx, dy);
      if (len > 1) {
        this.x += (dx / len) * this.speed;
        this.y += (dy / len) * this.speed;
      }
    }
    
    this.x = Math.max(20, Math.min(780, this.x));
    this.y = Math.max(20, Math.min(480, this.y));
  }

  performAttack(units) {
    // 基本攻撃（中編で特殊攻撃を実装）
    if (this.target.hp !== undefined) {
      this.target.hp -= this.attack;
      if (this.target.hp <= 0) {
        this.target.alive = false;
        this.target.hp = 0;
      }
    } else {
      this.target.hp -= this.attack;
      if (this.target.hp < 0) this.target.hp = 0;
    }
  }

  draw(ctx) {
    if (!this.alive) return;
    
    // ---- 背景色（オリジナルのみ） ----
    if (this.bgColor) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size + 4, 0, Math.PI * 2);
      ctx.fillStyle = this.bgColor;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // ---- ステルス（透明） ----
    if (this.isStealth && !this.isRevealed) {
      ctx.globalAlpha = 0.25;
    }
    
    // ---- 本体 ----
    const color = this.team === 'player' ? '#3498db' : '#e74c3c';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // ---- アイコン ----
    ctx.fillStyle = 'white';
    ctx.font = `${Math.min(20, this.size + 4)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.icon || '❓', this.x, this.y - 1);
    
    // ---- HPバー ----
    const barW = Math.min(34, this.size * 2);
    const barH = 4;
    const hpRatio = this.hp / this.maxHp;
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(this.x - barW/2, this.y - this.size - 8, barW, barH);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(this.x - barW/2, this.y - this.size - 8, barW * hpRatio, barH);
    
    ctx.globalAlpha = 1.0;
    
    // ---- 凍結エフェクト ----
    if (this.isFrozen) {
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size + 6, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// ---- コスト表示 ----
function updateCostDisplay() {
  costSpan.textContent = Math.floor(playerCost);
}

// ---- CPU行動 ----
function cpuAction() {
  if (gameOver) return;
  cpuCost = Math.min(CPU_MAX_COST, cpuCost + 0.03);
  if (cpuCost < 3) return;
  if (Math.random() > 0.04) return;
  
  const keys = Object.keys(UNIT_TYPES);
  let available = keys.filter(k => UNIT_TYPES[k].cost <= cpuCost);
  if (available.length === 0) return;
  const key = available[Math.floor(Math.random() * available.length)];
  const def = UNIT_TYPES[key];
  cpuCost -= def.cost;
  const y = 80 + Math.random() * 340;
  const unit = new Unit(700, y, key, 'cpu');
  units.push(unit);
}

// ---- リセット ----
function resetGame() {
  gameOver = false;
  winner = null;
  playerTower.hp = playerTower.maxHp;
  cpuTower.hp = cpuTower.maxHp;
  units = [];
  playerCost = 10;
  cpuCost = 10;
  selectedUnitType = null;
  isDragging = false;
  previewUnit = null;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
  msgDiv.innerText = '⚔️ ユニットを選んでドラッグ';
  updateCostDisplay();
}

// ---- 更新ループ ----
function update() {
  if (gameOver) return;
  playerCost = Math.min(MAX_COST, playerCost + 0.03);
  updateCostDisplay();
  
  cpuTimer++;
  if (cpuTimer % 10 === 0) cpuAction();
  
  for (let u of units) {
    u.update(units);
  }
  units = units.filter(u => u.alive);
  
  if (cpuTower.hp <= 0) {
    gameOver = true;
    winner = 'player';
    msgDiv.innerText = '🎉 あなたの勝ち！';
  } else if (playerTower.hp <= 0) {
    gameOver = true;
    winner = 'cpu';
    msgDiv.innerText = '😵 CPUの勝ち...';
  }
}

// ---- 描画 ----
function draw() {
  ctx.clearRect(0, 0, 800, 500);
  
  // 中央線
  ctx.strokeStyle = '#4a6b3a';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 15]);
  ctx.beginPath();
  ctx.moveTo(400, 20);
  ctx.lineTo(400, 480);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // タワー
  function drawTower(tower, isPlayer) {
    const color = isPlayer ? '#2980b9' : '#c0392b';
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 10;
    ctx.fillRect(tower.x, tower.y, tower.w, tower.h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 3;
    ctx.strokeRect(tower.x, tower.y, tower.w, tower.h);
    const ratio = tower.hp / tower.maxHp;
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(tower.x, tower.y - 20, tower.w, 10);
    ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(tower.x, tower.y - 20, tower.w * ratio, 10);
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isPlayer ? '🔵' : '🔴', tower.x + tower.w/2, tower.y - 30);
  }
  drawTower(playerTower, true);
  drawTower(cpuTower, false);
  
  // ユニット
  for (let u of units) {
    u.draw(ctx);
  }
  
  // プレビュー
  if (isDragging && selectedUnitType && previewUnit) {
    ctx.globalAlpha = 0.5;
    const pu = new Unit(previewUnit.x, previewUnit.y, selectedUnitType, 'player');
    pu.draw(ctx);
    ctx.globalAlpha = 1.0;
  }
}

// ---- ゲームループ ----
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ---- UIボタン生成 ----
function createUnitButtons() {
  btnContainer.innerHTML = '';
  for (const [key, def] of Object.entries(UNIT_TYPES)) {
    const btn = document.createElement('div');
    btn.className = 'unit-btn';
    if (def.bgColor) {
      btn.classList.add('has-bg');
      const dot = document.createElement('span');
      dot.className = 'color-dot';
      dot.style.background = def.bgColor;
      btn.appendChild(dot);
    }
    const text = document.createTextNode(`${def.icon} ${def.name} (${def.cost})`);
    btn.appendChild(text);
    btn.dataset.type = key;
    btn.dataset.cost = def.cost;
    
    btn.addEventListener('click', () => {
      if (gameOver) return;
      const cost = parseInt(btn.dataset.cost);
      if (playerCost < cost) {
        msgDiv.innerText = '⚠️ コストが足りません！';
        return;
      }
      if (selectedUnitType === key) {
        selectedUnitType = null;
        btn.classList.remove('selected');
        msgDiv.innerText = '⚔️ ユニットを選択してください';
      } else {
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
        selectedUnitType = key;
        btn.classList.add('selected');
        msgDiv.innerText = `👉 ${def.name}をドラッグして配置`;
      }
    });
    btnContainer.appendChild(btn);
  }
}

// ---- マウスイベント ----
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', (e) => {
  if (gameOver) return;
  if (!selectedUnitType) {
    msgDiv.innerText = '⚠️ 先にユニットを選択してください';
    return;
  }
  const def = UNIT_TYPES[selectedUnitType];
  if (!def) return;
  if (playerCost < def.cost) {
    msgDiv.innerText = '⚠️ コストが足りません！';
    return;
  }
  const pos = getCanvasCoords(e);
  if (pos.x > 350) {
    msgDiv.innerText = '❌ 自陣側(左半分)に配置してください';
    return;
  }
  isDragging = true;
  previewUnit = { x: pos.x, y: pos.y };
  msgDiv.innerText = '📍 配置位置を決めてドロップ';
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDragging || !previewUnit) return;
  const pos = getCanvasCoords(e);
  previewUnit.x = Math.max(20, Math.min(350, pos.x));
  previewUnit.y = Math.max(20, Math.min(480, pos.y));
});

canvas.addEventListener('mouseup', (e) => {
  if (!isDragging || !selectedUnitType || !previewUnit) {
    isDragging = false;
    return;
  }
  const def = UNIT_TYPES[selectedUnitType];
  if (!def) return;
  if (playerCost < def.cost) {
    msgDiv.innerText = '⚠️ コストが足りません！';
    isDragging = false;
    previewUnit = null;
    return;
  }
  const unit = new Unit(previewUnit.x, previewUnit.y, selectedUnitType, 'player');
  units.push(unit);
  playerCost -= def.cost;
  updateCostDisplay();
  msgDiv.innerText = `✅ ${def.name}を配置！`;
  isDragging = false;
  previewUnit = null;
});

// ---- リセット ----
document.getElementById('resetBtn').addEventListener('click', resetGame);

// ---- 初期化 ----
createUnitButtons();
resetGame();
gameLoop();

// ---- リサイズ ----
function resizeCanvas() {
  const container = canvas.parentElement;
  const maxWidth = window.innerWidth - 40;
  const maxHeight = window.innerHeight - 300;
  let w = 800, h = 500;
  if (maxWidth < 800) {
    w = maxWidth;
    h = w * (500/800);
  }
  if (maxHeight < h) {
    h = maxHeight;
    w = h * (800/500);
  }
  canvas.style.width = Math.min(w, 800) + 'px';
  canvas.style.height = Math.min(h, 500) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

      // 相手のエリクサー回復を停止（CPU側）

      }

        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;

      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- タイムワープ（加速） ----
    if (this.typeKey === 'timewarp') {
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          u.speed = (u.speed || 1) * 1.02;
        }
      }
      // 移動
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- テレポーター（引き寄せ） ----
    if (this.typeKey === 'teleporter') {

      let minDist = Infinity;
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        const d = this.distanceTo(u);
        if (d < minDist) {
          minDist = d;
          closest = u;
        }
      }
      if (closest && minDist < this.range) {
        closest.x = this.x + (this.team === 'player' ? 30 : -30);
        closest.y = this.y;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- シールド（無敵バリア） ----
    if (this.typeKey === 'shield') {
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          // シールド付与（中編では簡易実装：HPを一時的に増やす）
          u.maxHp *= 2;
          u.hp = u.maxHp;
        }
      }
      this.alive = false; // 使い切り
      return;
    }
    
    // ---- コピーキャット（変身） ----
    if (this.isCopycat && !this.copiedType) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < 50) {
          this.copiedType = u.typeKey;
          const def = UNIT_TYPES[u.typeKey];
          if (def) {
            this.hp = def.hp;
            this.maxHp = def.hp;
            this.attack = def.attack;
            this.range = def.range;
            this.speed = def.speed;
            this.size = def.size;
            this.icon = def.icon;
          }
          break;
        }
      }
    }
    
    // ---- ドッペルゲンガー（鏡像） ----

      if (enemyUnits.length > 0) {
        const last = enemyUnits[enemyUnits.length - 1];
        const def = UNIT_TYPES[last.typeKey];
        if (def) {
          const clone = new Unit(
            this.x + (this.team === 'player' ? -50 : 50),
            this.y,
            last.typeKey,
            this.team
          );
          units.push(clone);
          this.hasDoppeled = true;
        }
      }
    }
    
    // ---- スワーム（大群） ----

      // 既に5体で出現しているので、特別な処理は不要
    }

      this.attackCooldown = Math.max(0, this.attackCooldown - 1);

        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.hp -= 3; // 毒ダメージ
            if (u.hp <= 0) { u.alive = false; u.hp = 0; }
          }
        }
        this.attackCooldown = 20;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));

          if (this.distanceTo(u) <= this.range) {
            u.attackSpeed = Math.max(10, u.attackSpeed * 0.5);
          }
        }
        this.attackCooldown = 30;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));

    }

          this.y,
          'wall',
          this.team
        );
        wall.hp = 80;
        wall.maxHp = 80;
        wall.size = 20;
        units.push(wall);
        this.trumpWallCount++;
        this.attackCooldown = 120;
        msgDiv.innerText = '🇺🇸 壁を建設！';
      }
    }
    
    // ---- ユダヤ（エリクサー加速） ----
    if (this.isJudah) {

        updateCostDisplay();
      }
    }
    
    // ---- オイル（移動速度低下） ----
    if (this.isOil) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) <= 80) {
          u.speed = u.speed * 0.5;
        }
      }
    }
    
    // ---- イーロンマスク（ワープ） ----
    if (this.isMusk) {
      let closest = null;
      let minDist = Infinity;
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        const d = this.distanceTo(u);
        if (d < minDist) {
          minDist = d;
          closest = u;
        }
      }
      if (closest) {
        closest.x = this.team === 'player' ? 600 : 200;
        msgDiv.innerText = '🚀 ワープ！';
        this.alive = false;
      }
      return;
    }
    
    // ---- ホルムズ海峡（通過ブロック） ----
    if (this.isStrait) {
      // 通過ブロックは描画のみで、移動制御は別途
      // 実際はユニットの移動を制限する処理が必要
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (Math.abs(u.x - this.x) < 20 && Math.abs(u.y - this.y) < 100) {
          if (u.team === 'player' && this.team === 'cpu') {
            u.x -= 2;
          } else if (u.team === 'cpu' && this.team === 'player') {
            u.x += 2;
          }
        }
      }
      return;
    }
    
    // ---- ハマス（敵陣後方ワープ） ----
    if (this.isHamas && !this.hamasTeleported) {
      this.hamasTeleported = true;
      this.x = this.team === 'player' ? 700 + Math.random() * 50 : 100 - Math.random() * 50;
      this.y = 100 + Math.random() * 300;
      msgDiv.innerText = '🟢 ハマスがワープ！';
    }
    
    // ---- チャージャー（加速） ----
    if (this.typeKey === 'charger') {
      this.chargeSpeed = Math.min(3.0, (this.chargeSpeed || 1.0) + 0.005);
      this.speed = this.chargeSpeed;
    }
    
    // ---- トレント（成長） ----
    if (this.typeKey === 'treant') {
      this.growTimer = (this.growTimer || 0) + 1;
      if (this.growTimer % 60 === 0 && this.growTimer < 1800) {
        this.hp = Math.min(120, this.hp + 3);
        this.maxHp = this.hp;
        this.attack = Math.min(20, this.attack + 0.5);
        this.size = Math.min(40, this.size + 0.5);
        this.speed = Math.max(0.6, this.speed - 0.005);
      }
    }
    
    // ---- エルフ（攻撃力強化） ----
    if (this.typeKey === 'elf') {
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          u.attack = u.attack * 1.3;
        }
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- ブラックホール（吸引） ----
    if (this.typeKey === 'blackhole') {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < this.range) {
          const dx = this.x - u.x;
          const dy = this.y - u.y;
          const len = Math.hypot(dx, dy);
          if (len > 1) {
            u.x += (dx / len) * 0.5;
            u.y += (dy / len) * 0.5;
            u.hp -= 0.5;
            if (u.hp <= 0) { u.alive = false; u.hp = 0; }
          }
        }
      }
      return;
    }
    
    // ---- リフレクター（反射壁）- 簡易実装 ----
    if (this.isReflector) {
      // 遠距離攻撃を反射（簡易：近くの敵にダメージ）
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < 60) {
          u.hp -= 5;
          if (u.hp <= 0) { u.alive = false; u.hp = 0; }
        }
      }
      return;

      this.hp = this.maxHp;

      return;

    // ---- カオス（変身）- update内で処理 ----

      const keys = Object.keys(UNIT_TYPES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const def = UNIT_TYPES[randomKey];
      if (def) {
        this.typeKey = randomKey;
        this.hp = def.hp;
        this.maxHp = def.hp;
        this.attack = def.attack;
        this.range = def.range;
        this.speed = def.speed;
        this.size = def.size;
        this.attackSpeed = def.attackSpeed;
        this.icon = def.icon;
        this.bgColor = def.bgColor || null;
        this.chaosTransformed = true;
      }
    }
    
    // ---- ウィンド（吹き飛ばし） ----
    if (this.typeKey === 'wind') {
      this.attackCooldown = Math.max(0, this.attackCooldown - 1);
      if (this.attackCooldown === 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.x += (this.team === 'player' ? 1 : -1) * 80;
            u.y += (Math.random() - 0.5) * 40;
          }
        }
        this.attackCooldown = 60;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- ジャンプ兵（飛び越え） ----
    if (this.typeKey === 'jumper') {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (Math.abs(u.x - this.x) < 30 && Math.abs(u.y - this.y) < 30) {
          this.x += (this.team === 'player' ? 80 : -80);
          this.y += (Math.random() - 0.5) * 40;
          break;
        }
      }
    }
    
    // ---- カウンター（反射） ----
    if (this.typeKey === 'counter') {
      // 受けたダメージの反射は別途実装（被ダメージ時に処理）
      // 簡易実装：攻撃時に自分が受けるダメージを相手に返す
      if (this.attackCooldown === 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;

      const hpRatio = this.hp / this.maxHp;

        this.attack = 20;
        this.speed = 1.5;
      } else if (hpRatio < 0.6) {
        this.attack = 14;
        this.speed = 1.3;
      }
    }
    
    // ---- ゴーレム（分裂） ----
    if (this.typeKey === 'golem' && !this.alive && this.reviveCount === 0) {
      this.reviveCount++;
      for (let i = 0; i < 2; i++) {
        const mini = new Unit(
          this.x + (i === 0 ? -20 : 20),
          this.y + (i === 0 ? -20 : 20),
          'melee',
          this.team
        );
        mini.hp = 30;
        mini.maxHp = 30;
        mini.attack = 5;
        mini.size = 14;
        mini.icon = '🪨';
        units.push(mini);
      }
    }
    
    // ---- ミラージュ（分身） ----
    if (this.typeKey === 'mirage' && !this.hasCloned) {
      this.cloneTimer = (this.cloneTimer || 0) + 1;
      if (this.cloneTimer >= 300) { // 5秒
        this.hasCloned = true;
        const clone = new Unit(
          this.x + (Math.random() - 0.5) * 40,
          this.y + (Math.random() - 0.5) * 40,
          'melee',
          this.team
        );
        clone.hp = this.hp * 0.5;
        clone.maxHp = clone.hp;
        clone.attack = this.attack;
        clone.size = this.size;
        clone.icon = '🌀';
        units.push(clone);
      }
    }
    
    // ---- トレーダー（交換） ----
    if (this.isTrader && !this.hasTraded) {
      let closest = null;
      let minDist = Infinity;
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        const d = this.distanceTo(u);
        if (d < minDist) {
          minDist = d;
          closest = u;
        }
      }
      if (closest && minDist < 100) {
        const tempX = this.x;
        const tempY = this.y;
        this.x = closest.x;
        this.y = closest.y;
        closest.x = tempX;
        closest.y = tempY;
        this.hasTraded = true;
        msgDiv.innerText = '🔄 位置交換！';
      }
    }
    
    // ---- ここから通常の移動処理 ----

    if (this.attackCooldown > 0) this.attackCooldown--;
    
    // ヒーラーは既にreturn済み
    
    // 壁は既にreturn済み
    
    // 爆弾兵は既にreturn済み
    
    // 攻撃処理
    this.target = this.findTarget(units);
    
    if (!this.target) {
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }

    if (this.target.hp !== undefined) {
      dist = this.distanceTo(this.target);
    } else {
      dist = this.distanceToRect(this.target);
    }
    
    if (dist <= this.range) {
      if (this.attackCooldown === 0) {
        this.performAttack(units);
        this.attackCooldown = this.attackSpeed;
      }
    } else {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const len = Math.hypot(dx, dy);
      if (len > 1) {
        this.x += (dx / len) * this.speed;
        this.y += (dy / len) * this.speed;
      }
    }
    
    this.x = Math.max(20, Math.min(780, this.x));
    this.y = Math.max(20, Math.min(480, this.y));
