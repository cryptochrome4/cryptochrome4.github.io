<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>クラロワ風 簡易ゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a2a3a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    .game-container {
      background: #2d4a5e;
      padding: 20px;
      border-radius: 30px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #6b8c5c;
      border-radius: 20px;
      box-shadow: inset 0 0 0 2px #3d5a3d;
      cursor: grab;
      width: 800px;
      height: 500px;
    }
    .ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }
    .cost-area {
      display: flex;
      gap: 20px;
    }
    .cost-box {
      background: #1f3a47;
      padding: 8px 20px;
      border-radius: 40px;
      border: 2px solid #ffd966;
      box-shadow: 0 4px 0 #7f6b3d;
    }
    .unit-btn {
      background: #3a5a6a;
      padding: 8px 18px;
      border-radius: 40px;
      border: 2px solid #b8d4e3;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: 0.1s;
      box-shadow: 0 4px 0 #1f2f3a;
    }
    .unit-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .unit-btn.selected {
      background: #f1c40f;
      color: #1a2a3a;
      border-color: #f39c12;
    }
    .reset-btn {
      background: #c0392b;
      border: none;
      padding: 8px 25px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #78281f;
      transition: 0.1s;
    }
    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .message {
      background: #17252e;
      padding: 8px 25px;
      border-radius: 40px;
      border: 2px solid #f1c40f;
    }
  </style>
</head>
<body>
<div class="game-container">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="ui">
    <div class="cost-area">
      <div class="cost-box">💎 <span id="costDisplay">10</span></div>
      <div class="unit-btn" data-cost="3" data-type="melee">⚔️ 近接 (3)</div>
      <div class="unit-btn" data-cost="5" data-type="ranged">🏹 遠距離 (5)</div>
    </div>
    <div class="message" id="messageDisplay">⚔️ ドラッグして配置</div>
    <button class="reset-btn" id="resetBtn">🔄 リセット</button>
  </div>
</div>
<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const costSpan = document.getElementById('costDisplay');
    const msgDiv = document.getElementById('messageDisplay');

    // ---- ゲーム状態 ----
    let gameOver = false;
    let winner = null; // 'player' or 'cpu'

    // タワー
    const playerTower = { x: 80, y: 200, w: 60, h: 100, hp: 100, maxHp: 100 };
    const cpuTower = { x: 660, y: 200, w: 60, h: 100, hp: 100, maxHp: 100 };

    // ユニット配列
    let units = [];
    // コスト
    let playerCost = 10;
    const MAX_COST = 10;

    // 選択中のユニットタイプ (null = 選択なし)
    let selectedUnitType = null; // 'melee' or 'ranged'

    // ドラッグ状態
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let previewUnit = null; // 配置プレビュー用

    // ---- ユニットクラス ----
    class Unit {
      constructor(x, y, type, team) {
        this.x = x;
        this.y = y;
        this.type = type; // 'melee' or 'ranged'
        this.team = team; // 'player' or 'cpu'
        this.hp = type === 'melee' ? 40 : 25;
        this.maxHp = this.hp;
        this.attack = type === 'melee' ? 12 : 8;
        this.range = type === 'melee' ? 40 : 100;
        this.attackCooldown = 0;
        this.attackSpeed = 30; // frames
        this.size = 18;
        this.speed = type === 'melee' ? 1.2 : 0.8;
        this.alive = true;
        // 攻撃対象
        this.target = null;
      }

      // 対象を探す (タワー or 敵ユニット)
      findTarget(units) {
        let closest = null;
        let closestDist = Infinity;

        // まず敵ユニットを探す
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          const d = this.distanceTo(u);
          if (d < closestDist) {
            closestDist = d;
            closest = u;
          }
        }

        // 次に敵タワー
        const enemyTower = this.team === 'player' ? cpuTower : playerTower;
        const dTower = this.distanceToRect(enemyTower);
        if (dTower < closestDist) {
          closestDist = dTower;
          closest = enemyTower;
        }

        return closest;
      }

      distanceTo(other) {
        return Math.hypot(this.x - other.x, this.y - other.y);
      }

      distanceToRect(rect) {
        const cx = Math.max(rect.x, Math.min(this.x, rect.x + rect.w));
        const cy = Math.max(rect.y, Math.min(this.y, rect.y + rect.h));
        return Math.hypot(this.x - cx, this.y - cy);
      }

      // 更新
      update(units) {
        if (!this.alive) return;
        if (this.attackCooldown > 0) this.attackCooldown--;

        // ターゲットを更新
        this.target = this.findTarget(units);

        if (!this.target) {
          // 目標なし → 前進
          this.x += (this.team === 'player' ? 1 : -1) * this.speed;
          return;
        }

        // 距離判定
        let dist;
        if (this.target.hp !== undefined) {
          // ユニット
          dist = this.distanceTo(this.target);
        } else {
          // タワー
          dist = this.distanceToRect(this.target);
        }

        if (dist <= this.range) {
          // 攻撃
          if (this.attackCooldown === 0) {
            // 攻撃実行
            if (this.target.hp !== undefined) {
              this.target.hp -= this.attack;
              if (this.target.hp <= 0) {
                this.target.alive = false;
                this.target.hp = 0;
              }
            } else {
              // タワー
              this.target.hp -= this.attack;
              if (this.target.hp < 0) this.target.hp = 0;
            }
            this.attackCooldown = this.attackSpeed;
          }
        } else {
          // 近づく
          const dx = this.target.x - this.x;
          const dy = this.target.y - this.y;
          const len = Math.hypot(dx, dy);
          if (len > 1) {
            this.x += (dx / len) * this.speed;
            this.y += (dy / len) * this.speed;
          }
        }

        // フィールド外に出ないように
        this.x = Math.max(20, Math.min(780, this.x));
        this.y = Math.max(20, Math.min(480, this.y));
      }

      draw(ctx) {
        if (!this.alive) return;
        const color = this.team === 'player' ? '#3498db' : '#e74c3c';
        // 丸
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 2;
        ctx.stroke();

        // アイコン
        ctx.fillStyle = 'white';
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type === 'melee' ? '⚔️' : '🏹', this.x, this.y - 2);

        // HPバー
        const barW = 30;
        const barH = 4;
        const hpRatio = this.hp / this.maxHp;
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(this.x - barW/2, this.y - this.size - 8, barW, barH);
        ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(this.x - barW/2, this.y - this.size - 8, barW * hpRatio, barH);
      }
    }

    // ---- リセット ----
    function resetGame() {
      gameOver = false;
      winner = null;
      playerTower.hp = playerTower.maxHp;
      cpuTower.hp = cpuTower.maxHp;
      units = [];
      playerCost = 10;
      selectedUnitType = null;
      isDragging = false;
      previewUnit = null;
      document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
      msgDiv.innerText = '⚔️ ドラッグして配置';
      updateCostDisplay();
    }

    // ---- コスト表示 ----
    function updateCostDisplay() {
      costSpan.textContent = Math.floor(playerCost);
    }

    // ---- CPU 行動 ----
    let cpuTimer = 0;
    function cpuAction() {
      if (gameOver) return;
      // CPUコストは擬似的に無限（ただしバランス用に制限）
      const r = Math.random();
      if (r < 0.03) { // 3% 確率でユニット生成
        const type = Math.random() < 0.6 ? 'melee' : 'ranged';
        const y = 80 + Math.random() * 340;
        const unit = new Unit(720, y, type, 'cpu');
        units.push(unit);
      }
    }

    // ---- ゲームループ ----
    function update() {
      if (gameOver) return;

      // コスト回復
      playerCost = Math.min(MAX_COST, playerCost + 0.03);
      updateCostDisplay();

      // CPU行動
      cpuTimer++;
      if (cpuTimer % 10 === 0) cpuAction();

      // ユニット更新
      for (let u of units) {
        u.update(units);
      }

      // 死亡ユニットを除去
      units = units.filter(u => u.alive);

      // タワー破壊判定
      if (cpuTower.hp <= 0) {
        gameOver = true;
        winner = 'player';
        msgDiv.innerText = '🎉 あなたの勝ち！';
      } else if (playerTower.hp <= 0) {
        gameOver = true;
        winner = 'cpu';
        msgDiv.innerText = '😵 CPUの勝ち...';
      }

      // ドラッグ中のプレビュー更新
      if (isDragging && selectedUnitType) {
        // マウス座標をキャンバス座標に変換（イベントで更新）
      }
    }

    // ---- 描画 ----
    function draw() {
      ctx.clearRect(0, 0, 800, 500);

      // 地面のライン
      ctx.strokeStyle = '#4a6b3a';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 15]);
      ctx.beginPath();
      ctx.moveTo(400, 20);
      ctx.lineTo(400, 480);
      ctx.stroke();
      ctx.setLineDash([]);

      // タワー描画
      function drawTower(tower, isPlayer) {
        const color = isPlayer ? '#2980b9' : '#c0392b';
        ctx.fillStyle = color;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 10;
        ctx.fillRect(tower.x, tower.y, tower.w, tower.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 3;
        ctx.strokeRect(tower.x, tower.y, tower.w, tower.h);
        // HPバー
        const ratio = tower.hp / tower.maxHp;
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(tower.x, tower.y - 20, tower.w, 10);
        ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(tower.x, tower.y - 20, tower.w * ratio, 10);
        // 旗
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(isPlayer ? '🔵' : '🔴', tower.x + tower.w/2, tower.y - 30);
      }
      drawTower(playerTower, true);
      drawTower(cpuTower, false);

      // ユニット描画
      for (let u of units) {
        u.draw(ctx);
      }

      // ドラッグプレビュー
      if (isDragging && selectedUnitType && previewUnit) {
        ctx.globalAlpha = 0.5;
        const pu = new Unit(previewUnit.x, previewUnit.y, selectedUnitType, 'player');
        pu.draw(ctx);
        ctx.globalAlpha = 1.0;
      }
    }

    // ---- ゲームループ ----
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ---- イベント: ユニット選択 ----
    document.querySelectorAll('.unit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (gameOver) return;
        const type = btn.dataset.type;
        const cost = parseInt(btn.dataset.cost);
        if (playerCost < cost) {
          msgDiv.innerText = '⚠️ コストが足りません！';
          return;
        }
        // 選択切り替え
        if (selectedUnitType === type) {
          selectedUnitType = null;
          btn.classList.remove('selected');
          msgDiv.innerText = '⚔️ ユニットを選択してください';
        } else {
          document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
          selectedUnitType = type;
          btn.classList.add('selected');
          msgDiv.innerText = `👉 ${type === 'melee' ? '近接' : '遠距離'}をドラッグして配置`;
        }
      });
    });

    // ---- マウスイベント (ドラッグ＆ドロップ) ----
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      if (gameOver) return;
      if (!selectedUnitType) {
        msgDiv.innerText = '⚠️ 先にユニットを選択してください';
        return;
      }
      const cost = selectedUnitType === 'melee' ? 3 : 5;
      if (playerCost < cost) {
        msgDiv.innerText = '⚠️ コストが足りません！';
        return;
      }

      const pos = getCanvasCoords(e);
      // 自陣側のみ配置可能 (x < 350)
      if (pos.x > 350) {
        msgDiv.innerText = '❌ 自陣側(左半分)に配置してください';
        return;
      }

      isDragging = true;
      dragStartX = pos.x;
      dragStartY = pos.y;
      previewUnit = { x: pos.x, y: pos.y };
      msgDiv.innerText = '📍 配置位置を決めてドロップ';
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging || !previewUnit) return;
      const pos = getCanvasCoords(e);
      previewUnit.x = Math.max(20, Math.min(350, pos.x));
      previewUnit.y = Math.max(20, Math.min(480, pos.y));
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!isDragging || !selectedUnitType || !previewUnit) {
        isDragging = false;
        return;
      }

      const cost = selectedUnitType === 'melee' ? 3 : 5;
      if (playerCost < cost) {
        msgDiv.innerText = '⚠️ コストが足りません！';
        isDragging = false;
        previewUnit = null;
        return;
      }

      // ユニット生成
      const unit = new Unit(previewUnit.x, previewUnit.y, selectedUnitType, 'player');
      units.push(unit);
      playerCost -= cost;
      updateCostDisplay();

      msgDiv.innerText = `✅ ${selectedUnitType === 'melee' ? '近接' : '遠距離'}を配置！`;
      isDragging = false;
      previewUnit = null;

      // 選択解除（任意）
      // 連続配置したい場合はコメントアウト
      // selectedUnitType = null;
      // document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
    });

    // リセット
    document.getElementById('resetBtn').addEventListener('click', resetGame);

    // ---- 初期化 ----
    resetGame();
    gameLoop();

    // ウィンドウリサイズ対応（簡易）
    function resizeCanvas() {
      const container = canvas.parentElement;
      const maxWidth = window.innerWidth - 60;
      const maxHeight = window.innerHeight - 200;
      let w = 800, h = 500;
      if (maxWidth < 800) {
        w = maxWidth;
        h = w * (500/800);
      }
      if (maxHeight < h) {
        h = maxHeight;
        w = h * (800/500);
      }
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  })();
</script>
</body>
</html>
