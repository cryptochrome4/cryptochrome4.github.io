<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>クラロワ風 デッキ編集画面</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0d1b2a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      background: #1b3a4b;
      padding: 25px;
      border-radius: 30px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.8);
      max-width: 1200px;
      width: 100%;
    }
    h1 {
      color: #ffd966;
      text-align: center;
      margin: 0 0 15px 0;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 20px;
      align-items: center;
    }
    .settings label {
      color: #ecf0f1;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 2px solid #5a8a9a;
      background: #1a2a3a;
      color: #ffd966;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
    }
    .settings input[type="range"] {
      width: 120px;
      accent-color: #ffd966;
    }
    .settings .value-display {
      color: #ffd966;
      font-weight: bold;
      min-width: 30px;
      display: inline-block;
      text-align: center;
    }
    .deck-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      color: #ecf0f1;
    }
    .deck-info .count {
      font-size: 18px;
      font-weight: bold;
      color: #ffd966;
    }
    .btn-start {
      background: #27ae60;
      border: none;
      padding: 12px 40px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1a6b3a;
      transition: 0.1s;
    }
    .btn-start:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .btn-start:disabled {
      background: #555;
      box-shadow: 0 4px 0 #333;
      cursor: not-allowed;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
      padding: 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card-grid::-webkit-scrollbar {
      width: 6px;
    }
    .card-grid::-webkit-scrollbar-thumb {
      background: #ffd966;
      border-radius: 4px;
    }
    .card {
      background: #2c4c5e;
      border: 2px solid #5a8a9a;
      border-radius: 12px;
      padding: 8px 6px;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
      color: #ecf0f1;
      font-size: 12px;
      position: relative;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #8ab8c8;
    }
    .card.selected {
      border-color: #ffd966;
      background: #3a6a7a;
      box-shadow: 0 0 12px rgba(255, 217, 102, 0.3);
    }
    .card .icon {
      font-size: 28px;
      display: block;
    }
    .card .name {
      font-weight: bold;
      font-size: 12px;
      margin-top: 2px;
    }
    .card .cost-badge {
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      padding: 0 8px;
      font-size: 11px;
      color: #ffd966;
      display: inline-block;
      margin-top: 2px;
    }
    .card .color-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      vertical-align: middle;
      margin-right: 3px;
    }
    .card .detail-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid #5a8a9a;
      border-radius: 20px;
      color: #8ab8c8;
      font-size: 10px;
      padding: 2px 10px;
      cursor: pointer;
      margin-top: 4px;
      transition: 0.1s;
    }
    .card .detail-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    .card .check-mark {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ffd966;
      color: #1a2a3a;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: #1b3a4b;
      border-radius: 24px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid #ffd966;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .modal h2 {
      color: #ffd966;
      margin-top: 0;
      text-align: center;
    }
    .modal .stat {
      color: #ecf0f1;
      font-size: 14px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .modal .stat span {
      color: #ffd966;
      font-weight: bold;
    }
    .modal .close-btn {
      background: #c0392b;
      border: none;
      padding: 8px 30px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 0 #78281f;
      transition: 0.1s;
    }
    .modal .close-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .modal .special-desc {
      color: #8ab8c8;
      font-size: 14px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }
    @media (max-width: 600px) {
      .settings { flex-direction: column; align-items: stretch; }
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .container { padding: 15px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>⚔️ デッキ編集</h1>
  
  <!-- 設定 -->
  <div class="settings">
    <label>
      🎯 CPUランダム枚数:
      <input type="range" id="cpuRandomCount" min="0" max="47" value="10" />
      <span class="value-display" id="cpuRandomCountDisplay">10</span>
    </label>
    <label>
      🏰 自タワーHP:
      <input type="number" id="playerTowerHp" value="120" min="50" max="500" />
    </label>
    <label>
      🏰 CPUタワーHP:
      <input type="number" id="cpuTowerHp" value="120" min="50" max="500" />
    </label>
    <label>
      ⏱️ エリクサー速度（秒/1):
      <input type="range" id="elixirSpeed" min="3" max="10" value="3" step="0.5" />
      <span class="value-display" id="elixirSpeedDisplay">3</span>秒
    </label>
  </div>
  
  <!-- デッキ情報 -->
  <div class="deck-info">
    <span>📋 デッキ枚数: <span class="count" id="deckCount">0</span> / 51</span>
    <span>🟢 CPU固定: イラン・ホルムズ海峡・ハマス・キム</span>
    <button class="btn-start" id="startBattleBtn">⚔️ 試合開始</button>
  </div>
  
  <!-- カード一覧 -->
  <div class="card-grid" id="cardGrid"></div>
</div>

<!-- 詳細モーダル -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h2 id="modalTitle">カード詳細</h2>
    <div id="modalBody"></div>
    <button class="close-btn" id="modalCloseBtn">閉じる</button>
  </div>
</div>

// ---- カードレンダリング ----
function renderCards() {
  grid.innerHTML = '';
  let count = 0;
  
  for (const [key, def] of Object.entries(UNIT_TYPES)) {
    const isSelected = deck.includes(key);
    if (isSelected) count++;
    
    const card = document.createElement('div');
    card.className = 'card' + (isSelected ? ' selected' : '');
    
    // 色ドット
    if (def.bgColor) {
      const dot = document.createElement('span');
      dot.className = 'color-dot';
      dot.style.background = def.bgColor;
      card.appendChild(dot);
    }
    
    // アイコン
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = def.icon;
    card.appendChild(icon);
    
    // 名前
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = def.name;
    card.appendChild(name);
    
    // コスト
    const cost = document.createElement('div');
    cost.className = 'cost-badge';
    cost.textContent = `💎 ${def.cost}`;
    card.appendChild(cost);
    
    // 詳細ボタン
    const detailBtn = document.createElement('button');
    detailBtn.className = 'detail-btn';
    detailBtn.textContent = '詳しく見る';
    detailBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showDetail(key);
    });
    card.appendChild(detailBtn);
    
    // 選択マーク
    if (isSelected) {
      const check = document.createElement('div');
      check.className = 'check-mark';
      check.textContent = '✓';
      card.appendChild(check);
    }
    
    // クリックで選択/解除
    card.addEventListener('click', () => {
      toggleCard(key);
    });
    
    grid.appendChild(card);
  }
  
  deckCount.textContent = count;
  startBtn.disabled = (count === 0);
}

// ---- カード選択/解除 ----
function toggleCard(key) {
  const idx = deck.indexOf(key);
  if (idx >= 0) {
    deck.splice(idx, 1);
  } else {
    if (deck.length >= 51) return;
    deck.push(key);
  }
  renderCards();
}

// ---- CPUデッキ構築 ----
function buildCpuDeck(randomCount) {
  const cpuDeck = [...CPU_FIXED];
  
  // 残り47タイプからランダムに選択
  const allKeys = Object.keys(UNIT_TYPES);
  const available = allKeys.filter(k => !CPU_FIXED.includes(k));
  const shuffled = available.sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(randomCount, available.length));
  
  cpuDeck.push(...selected);
  return cpuDeck;
}

// ---- 試合ループ ----
function battleLoop() {
  if (!battleState || battleState.gameOver) return;
  
  const state = battleState;
  state.frameCount++;
  
  // ---- エリクサー回復 ----
  const elixirPerFrame = 1 / (state.elixirSpeed * 20); // 20FPS換算
  state.playerElixir = Math.min(state.maxElixir, state.playerElixir + elixirPerFrame);
  state.cpuElixir = Math.min(state.maxElixir, state.cpuElixir + elixirPerFrame);
  
  // ---- CPU行動（デッキからユニットを出す） ----
  if (state.frameCount % 15 === 0) {
    tryCpuAction(state);
  }
  
  // ---- ユニット更新 ----
  // （ここでは簡易的に、ユニットが前に進むだけの処理）
  // 実際のバトルロジックは後編で実装
  
  // ---- UI更新 ----
  updateBattleUI();
  
  // ---- キャンバス描画 ----
  drawBattle();
  
  // ---- 勝敗判定 ----
  if (state.cpuTower.hp <= 0) {
    state.gameOver = true;
    state.winner = 'player';
    showVictory('player');
  } else if (state.playerTower.hp <= 0) {
    state.gameOver = true;
    state.winner = 'cpu';
    showVictory('cpu');
  }
}

// ---- CPU行動 ----
function tryCpuAction(state) {
  if (state.cpuDeck.length === 0) return;
  
  // コストが足りるカードを探す
  const affordable = state.cpuDeck.filter(key => {
    const def = UNIT_TYPES[key];
    return def && def.cost <= state.cpuElixir;
  });
  
  if (affordable.length === 0) return;
  
  // ランダムに選択
  const key = affordable[Math.floor(Math.random() * affordable.length)];
  const def = UNIT_TYPES[key];
  if (!def) return;
  
  // エリクサー消費
  state.cpuElixir -= def.cost;
  
  // 情報パネルに記録
  state.cpuLastUnit = key;
  state.cpuHistory.push(key);
  if (state.cpuHistory.length > 5) state.cpuHistory.shift();
  
  // ユニットを配置（簡易：右端から出現）
  const y = 80 + Math.random() * 340;
  const unit = {
    key: key,
    x: 700,
    y: y,
    hp: def.hp,
    maxHp: def.hp,
    attack: def.attack,
    range: def.range,
    speed: def.speed,
    size: def.size,
    icon: def.icon,
    name: def.name,
    team: 'cpu',
    alive: true,
    attackCooldown: 0,
    target: null
  };
  state.cpuUnits.push(unit);
}

// ---- UI更新 ----
function updateBattleUI() {
  if (!battleState) return;
  const state = battleState;
  
  document.getElementById('battlePlayerElixir').textContent = Math.floor(state.playerElixir);
  document.getElementById('battleCpuElixir').textContent = Math.floor(state.cpuElixir);

  document.getElementById('cpuLastUnitDisplay').textContent = cpuName;

// ---- キャンバス描画 ----
function drawBattle() {
  const canvas = document.getElementById('battleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const state = battleState;
  if (!state) return;
  
  ctx.clearRect(0, 0, 800, 500);
  
  // 中央線
  ctx.strokeStyle = '#4a6b3a';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 15]);
  ctx.beginPath();
  ctx.moveTo(400, 20);
  ctx.lineTo(400, 480);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // タワー（簡易）
  function drawTower(tower, x, y, isPlayer) {
    const color = isPlayer ? '#2980b9' : '#c0392b';
    const hp = tower.hp;
    const maxHp = tower.maxHp;
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.fillRect(x, y, 60, 100);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 60, 100);
    const ratio = Math.max(0, hp / maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(x, y - 22, 60, 12);
    ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(x, y - 22, 60 * ratio, 12);
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isPlayer ? '🔵' : '🔴', x + 30, y - 35);
    ctx.fillStyle = 'white';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${Math.floor(hp)}/${maxHp}`, x + 30, y - 10);
  }
  drawTower(state.playerTower, 80, 200, true);
  drawTower(state.cpuTower, 660, 200, false);
  
  // CPUユニット
  for (let u of state.cpuUnits) {
    if (!u.alive) continue;
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.size, 0, Math.PI * 2);
    ctx.fillStyle = '#e74c3c';
    ctx.fill();
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'white';
    ctx.font = `${Math.min(20, u.size + 4)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.icon || '?', u.x, u.y - 1);
  }
  
  // プレイヤーユニット（簡易：まだ実装なし）
}

// ---- プレイヤー用状態 ----
let playerSelectedUnit = null;
let isPlayerDragging = false;
let playerPreviewUnit = null;

// ---- 試合開始関数を拡張 ----
const originalStartBattle = startBattle;
startBattle = function() {
  // 元の処理を呼び出し
  originalStartBattle();
  
  // 追加：プレイヤー操作用のイベント設定
  setupPlayerControls();
};

// ---- プレイヤー操作用イベント ----
function setupPlayerControls() {
  const canvas = document.getElementById('battleCanvas');
  if (!canvas) return;
  
  // 既存のイベントを削除（重複防止）
  const newCanvas = canvas.cloneNode(true);
  canvas.parentNode.replaceChild(newCanvas, canvas);
  
  // 新しいキャンバスにイベントを設定
  newCanvas.addEventListener('mousedown', onCanvasMouseDown);
  newCanvas.addEventListener('mousemove', onCanvasMouseMove);
  newCanvas.addEventListener('mouseup', onCanvasMouseUp);
  newCanvas.addEventListener('touchstart', onCanvasTouchStart);
  newCanvas.addEventListener('touchmove', onCanvasTouchMove);
  newCanvas.addEventListener('touchend', onCanvasTouchEnd);
}

function getCanvasCoords(e) {
  const canvas = document.getElementById('battleCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function onCanvasMouseDown(e) {
  if (!battleState || battleState.gameOver) return;
  if (!playerSelectedUnit) {
    showPlayerUnitSelector();
    return;
  }
  const pos = getCanvasCoords(e);
  if (pos.x > 350) {
    showMessage('❌ 自陣側(左半分)に配置してください');
    return;
  }
  const def = UNIT_TYPES[playerSelectedUnit];
  if (!def) return;
  if (battleState.playerElixir < def.cost) {
    showMessage(`⚠️ エリクサーが足りません！ (${def.cost}必要)`);
    return;
  }
  isPlayerDragging = true;
  playerPreviewUnit = { x: pos.x, y: pos.y };
}

function onCanvasMouseMove(e) {

function onCanvasTouchStart(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const mouseEvent = new MouseEvent('mousedown', {
    clientX: touch.clientX,
    clientY: touch.clientY
  });
  onCanvasMouseDown(mouseEvent);
}

function onCanvasTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const mouseEvent = new MouseEvent('mousemove', {
    clientX: touch.clientX,
    clientY: touch.clientY
  });
  onCanvasMouseMove(mouseEvent);
}

function onCanvasTouchEnd(e) {
  e.preventDefault();
  onCanvasMouseUp(e);
}

// ---- 完全な試合ループ（拡張） ----
const originalBattleLoop = battleLoop;
battleLoop = function() {
  if (!battleState || battleState.gameOver) return;
  
  const state = battleState;
  state.frameCount++;
  
  // ---- エリクサー回復 ----
  const elixirPerFrame = 1 / (state.elixirSpeed * 20);
  state.playerElixir = Math.min(state.maxElixir, state.playerElixir + elixirPerFrame);
  state.cpuElixir = Math.min(state.maxElixir, state.cpuElixir + elixirPerFrame);
  
  // ---- CPU行動 ----
  if (state.frameCount % 12 === 0) {
    tryCpuAction(state);
  }
  
  // ---- 全ユニット更新 ----
  // プレイヤーユニット
  for (let u of state.playerUnits) {
    if (!u.alive) continue;
    updateUnit(u, state.cpuUnits, state.cpuTower, 'player');
  }
  
  // CPUユニット
  for (let u of state.cpuUnits) {
    if (!u.alive) continue;
    updateUnit(u, state.playerUnits, state.playerTower, 'cpu');
  }
  
  // ---- 死亡ユニット除去 ----
  state.playerUnits = state.playerUnits.filter(u => u.alive);
  state.cpuUnits = state.cpuUnits.filter(u => u.alive);
  
  // ---- UI更新 ----
  updateBattleUI();
  
  // ---- 描画 ----
  drawBattle();
  
  // ---- 勝敗判定 ----
  if (state.cpuTower.hp <= 0) {
    state.gameOver = true;
    state.winner = 'player';
    showVictory('player');
  } else if (state.playerTower.hp <= 0) {
    state.gameOver = true;
    state.winner = 'cpu';
    showVictory('cpu');
  }
};

// ---- ユニット更新関数 ----
function updateUnit(unit, enemyUnits, enemyTower, team) {
  if (!unit.alive) return;
  if (unit.attackCooldown > 0) unit.attackCooldown--;
  
  // ---- 特殊：壁 ----
  if (unit.key === 'wall') return;
  
  // ---- 特殊：ヒーラー ----
  if (unit.isHealer) {
    const allies = team === 'player' ? battleState.playerUnits : battleState.cpuUnits;
    for (let a of allies) {
      if (a === unit || !a.alive) continue;
      if (getDistance(unit, a) < unit.range) {
        a.hp = Math.min(a.maxHp, a.hp + 2);
        addEffect(a.x, a.y, '💚', 10);
      }
    }
    // 移動
    unit.x += (team === 'player' ? 1 : -1) * unit.speed * 0.5;
    unit.x = Math.max(20, Math.min(780, unit.x));
    unit.y = Math.max(20, Math.min(480, unit.y));
    return;
  }
  
  // ---- ターゲット選択 ----
  let target = findTarget(unit, enemyUnits, enemyTower);
  unit.target = target;
  
  if (!target) {
    // 前進
    unit.x += (team === 'player' ? 1 : -1) * unit.speed;
    unit.x = Math.max(20, Math.min(780, unit.x));
    unit.y = Math.max(20, Math.min(480, unit.y));
    return;
  }
  
  // ---- 距離判定 ----
  let dist;
  if (target.hp !== undefined) {
    dist = getDistance(unit, target);
  } else {
    dist = getDistanceToRect(unit, target);
  }
  
  if (dist <= unit.range) {
    // 攻撃
    if (unit.attackCooldown === 0) {
      performUnitAttack(unit, target, enemyUnits);
      unit.attackCooldown = 30; // 簡易
    }
  } else {
    // 近づく
    const dx = target.x - unit.x;
    const dy = target.y - unit.y;
    const len = Math.hypot(dx, dy);
    if (len > 1) {
      unit.x += (dx / len) * unit.speed;
      unit.y += (dy / len) * unit.speed;
    }
  }
  
  unit.x = Math.max(20, Math.min(780, unit.x));
  unit.y = Math.max(20, Math.min(480, unit.y));
}

// ---- ターゲット検索 ----
function findTarget(unit, enemyUnits, enemyTower) {
  let closest = null;
  let closestDist = Infinity;
  
  // 敵ユニット
  for (let u of enemyUnits) {
    if (!u.alive) continue;
    const d = getDistance(unit, u);
    if (d < closestDist) {
      closestDist = d;
      closest = u;
    }
  }
  
  // タワー
  const dTower = getDistanceToRect(unit, enemyTower);
  if (dTower < closestDist) {
    closestDist = dTower;
    closest = enemyTower;
  }
  
  return closest;
}

// ---- 攻撃実行 ----
function performUnitAttack(unit, target, enemyUnits) {
  // ---- 爆弾兵 ----
  if (unit.isBomber) {
    for (let u of enemyUnits) {
      if (!u.alive) continue;
      if (getDistance(unit, u) < 70) {
        u.hp -= 25;
        if (u.hp <= 0) u.alive = false;
        addEffect(u.x, u.y, '💥', 20);
      }
    }
    const tower = unit.team === 'player' ? battleState.cpuTower : battleState.playerTower;
    if (getDistanceToRect(unit, tower) < 70) {
      tower.hp -= 25;
      addEffect(tower.x + 30, tower.y + 50, '💥', 20);
    }
    unit.alive = false;
    return;
  }
  
  // ---- 魔法使い（範囲攻撃） ----
  if (unit.isMage) {
    for (let u of enemyUnits) {
      if (!u.alive) continue;
      if (getDistance(unit, u) < 50) {
        u.hp -= 10;
        if (u.hp <= 0) u.alive = false;
        addEffect(u.x, u.y, '✨', 10);
      }
    }
    const tower = unit.team === 'player' ? battleState.cpuTower : battleState.playerTower;
    if (getDistanceToRect(unit, tower) < 50) {
      tower.hp -= 5;
      addEffect(tower.x + 30, tower.y + 50, '✨', 10);
    }
    return;
  }
  
  // ---- 通常攻撃 ----
  if (target.hp !== undefined) {
    target.hp -= unit.attack;
    if (target.hp <= 0) {
      target.alive = false;
      addEffect(target.x, target.y, '💀', 15);
    }
    addEffect(target.x, target.y, '⚔️', 8);
  } else {
    target.hp -= unit.attack;
    if (target.hp < 0) target.hp = 0;
    addEffect(target.x + 30, target.y + 50, '⚔️', 8);
  }
}

// ---- 距離計算 ----
function getDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function getDistanceToRect(unit, rect) {
  const cx = Math.max(rect.x, Math.min(unit.x, rect.x + 60));
  const cy = Math.max(rect.y, Math.min(unit.y, rect.y + 100));
  return Math.hypot(unit.x - cx, unit.y - cy);
}

// ---- エフェクト ----
let battleEffects = [];

function addEffect(x, y, text, duration) {
  battleEffects.push({ x, y, text, duration, timer: 0 });
}

function updateBattleEffects() {
  for (let i = battleEffects.length - 1; i >= 0; i--) {
    battleEffects[i].timer++;
    if (battleEffects[i].timer >= battleEffects[i].duration) {
      battleEffects.splice(i, 1);
    }
  }
}

// ---- 描画（拡張） ----
const originalDrawBattle = drawBattle;
drawBattle = function() {
  const canvas = document.getElementById('battleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const state = battleState;
  if (!state) return;
  
  ctx.clearRect(0, 0, 800, 500);
  
  // 中央線
  ctx.strokeStyle = '#4a6b3a';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 15]);
  ctx.beginPath();
  ctx.moveTo(400, 20);
  ctx.lineTo(400, 480);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // タワー
  function drawTower(tower, x, y, isPlayer) {
    const color = isPlayer ? '#2980b9' : '#c0392b';
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.fillRect(x, y, 60, 100);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 60, 100);
    const ratio = Math.max(0, tower.hp / tower.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(x, y - 22, 60, 12);
    ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(x, y - 22, 60 * ratio, 12);
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isPlayer ? '🔵' : '🔴', x + 30, y - 35);
    ctx.fillStyle = 'white';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${Math.floor(tower.hp)}/${tower.maxHp}`, x + 30, y - 10);
  }
  drawTower(state.playerTower, 80, 200, true);
  drawTower(state.cpuTower, 660, 200, false);
  
  // ---- ユニット描画 ----
  function drawUnit(u, color) {
    if (!u.alive) return;
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.size, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'white';
    ctx.font = `${Math.min(20, u.size + 4)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.icon || '?', u.x, u.y - 1);
    // HPバー
    const barW = Math.min(30, u.size * 2);
    const barH = 4;
    const hpRatio = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(u.x - barW/2, u.y - u.size - 8, barW, barH);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(u.x - barW/2, u.y - u.size - 8, barW * hpRatio, barH);
  }
  
  for (let u of state.playerUnits) {
    drawUnit(u, '#3498db');
  }
  for (let u of state.cpuUnits) {
    drawUnit(u, '#e74c3c');
  }
  
  // ---- エフェクト描画 ----
  for (let e of battleEffects) {
    const alpha = 1 - (e.timer / e.duration);
    const scale = 1 + (e.timer / e.duration) * 0.5;
    ctx.globalAlpha = alpha;
    ctx.font = `${24 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(e.text, e.x, e.y - e.timer * 0.5);
  }
  ctx.globalAlpha = 1.0;
  
  // ---- プレビュー ----
  if (isPlayerDragging && playerPreviewUnit && playerSelectedUnit) {
    const def = UNIT_TYPES[playerSelectedUnit];
    if (def) {
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(playerPreviewUnit.x, playerPreviewUnit.y, def.size, 0, Math.PI * 2);
      ctx.fillStyle = '#3498db';
      ctx.fill();
      ctx.strokeStyle = '#ecf0f1';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.font = `${Math.min(20, def.size + 4)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.icon, playerPreviewUnit.x, playerPreviewUnit.y - 1);
      ctx.globalAlpha = 1.0;
    }
  }
  
  // ---- エリクサーバー ----
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 100, 20);
  ctx.fillStyle = '#ffd966';
  ctx.fillRect(10, 10, (state.playerElixir / state.maxElixir) * 100, 20);
  ctx.fillStyle = 'white';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`💎 ${Math.floor(state.playerElixir)}`, 14, 20);
  
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(690, 10, 100, 20);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(690, 10, (state.cpuElixir / state.maxElixir) * 100, 20);
  ctx.fillStyle = 'white';
  ctx.fillText(`💎 ${Math.floor(state.cpuElixir)}`, 694, 20);
};

  let dist;
  if (target.hp !== undefined) {
    dist = getDistance(unit, target);
  } else {
    dist = getDistanceToRect(unit, target);
  }
  
  if (dist <= unit.range) {
    if (unit.attackCooldown === 0) {
      performUnitAttack(unit, target, enemyUnits);
      unit.attackCooldown = 30;
    }
  } else {
    const dx = target.x - unit.x;
    const dy = target.y - unit.y;
    const len = Math.hypot(dx, dy);
    if (len > 1) {
      unit.x += (dx / len) * unit.speed;
      unit.y += (dy / len) * unit.speed;
    }
  }
  
  unit.x = Math.max(20, Math.min(780, unit.x));
  unit.y = Math.max(20, Math.min(480, unit.y));
}

// ---- ターゲット検索 ----
function findTarget(unit, enemyUnits, enemyTower) {
  let closest = null;
  let closestDist = Infinity;
  
  for (let u of enemyUnits) {
    if (!u.alive) continue;
    const d = getDistance(unit, u);
    if (d < closestDist) {
      closestDist = d;
      closest = u;
    }
  }
  
  const dTower = getDistanceToRect(unit, enemyTower);
  if (dTower < closestDist) {
    closestDist = dTower;
    closest = enemyTower;
  }
  
  return closest;
}

// ---- 攻撃実行 ----
function performUnitAttack(unit, target, enemyUnits) {
  // 爆弾兵
  if (unit.isBomber) {
    for (let u of enemyUnits) {
      if (!u.alive) continue;
      if (getDistance(unit, u) < 70) {
        u.hp -= 25;
        if (u.hp <= 0) u.alive = false;
        addEffect(u.x, u.y, '💥', 20);
      }
    }
    const tower = unit.team === 'player' ? battleState.cpuTower : battleState.playerTower;
    if (getDistanceToRect(unit, tower) < 70) {
      tower.hp -= 25;
      addEffect(tower.x + 30, tower.y + 50, '💥', 20);
    }
    unit.alive = false;
    return;
  }
  
  // 魔法使い（範囲攻撃）
  if (unit.isMage) {
    for (let u of enemyUnits) {
      if (!u.alive) continue;
      if (getDistance(unit, u) < 50) {
        u.hp -= 10;
        if (u.hp <= 0) u.alive = false;
        addEffect(u.x, u.y, '✨', 10);
      }
    }
    const tower = unit.team === 'player' ? battleState.cpuTower : battleState.playerTower;
    if (getDistanceToRect(unit, tower) < 50) {
      tower.hp -= 5;
      addEffect(tower.x + 30, tower.y + 50, '✨', 10);
    }
    return;
  }
  
  // 通常攻撃
  if (target.hp !== undefined) {
    target.hp -= unit.attack;
    if (target.hp <= 0) {
      target.alive = false;
      addEffect(target.x, target.y, '💀', 15);
    }
    addEffect(target.x, target.y, '⚔️', 8);
  } else {
    target.hp -= unit.attack;
    if (target.hp < 0) target.hp = 0;
    addEffect(target.x + 30, target.y + 50, '⚔️', 8);
  }
}

// ---- 距離計算 ----
function getDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function getDistanceToRect(unit, rect) {
  const cx = Math.max(rect.x, Math.min(unit.x, rect.x + 60));
  const cy = Math.max(rect.y, Math.min(unit.y, rect.y + 100));
  return Math.hypot(unit.x - cx, unit.y - cy);
}

// ---- エフェクト ----
let battleEffects = [];

function addEffect(x, y, text, duration) {
  battleEffects.push({ x, y, text, duration, timer: 0 });
}

function updateBattleEffects() {
  for (let i = battleEffects.length - 1; i >= 0; i--) {
    battleEffects[i].timer++;
    if (battleEffects[i].timer >= battleEffects[i].duration) {
      battleEffects.splice(i, 1);
    }
  }
}

// ---- 描画（完全版） ----
function drawBattle() {
  const canvas = document.getElementById('battleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const state = battleState;
  if (!state) return;
  
  ctx.clearRect(0, 0, 800, 500);
  
  // 中央線
  ctx.strokeStyle = '#4a6b3a';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 15]);
  ctx.beginPath();
  ctx.moveTo(400, 20);
  ctx.lineTo(400, 480);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // タワー
  function drawTower(tower, x, y, isPlayer) {
    const color = isPlayer ? '#2980b9' : '#c0392b';
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.fillRect(x, y, 60, 100);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 60, 100);
    const ratio = Math.max(0, tower.hp / tower.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(x, y - 22, 60, 12);
    ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(x, y - 22, 60 * ratio, 12);
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isPlayer ? '🔵' : '🔴', x + 30, y - 35);
    ctx.fillStyle = 'white';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${Math.floor(tower.hp)}/${tower.maxHp}`, x + 30, y - 10);
  }
  drawTower(state.playerTower, 80, 200, true);
  drawTower(state.cpuTower, 660, 200, false);
  
  // ---- ユニット描画 ----
  function drawUnit(u, color) {
    if (!u.alive) return;
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.size || 18, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'white';
    ctx.font = `${Math.min(20, (u.size || 18) + 4)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.icon || '?', u.x, u.y - 1);
    // HPバー
    const barW = Math.min(30, (u.size || 18) * 2);
    const barH = 4;
    const hpRatio = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(u.x - barW/2, u.y - (u.size || 18) - 8, barW, barH);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(u.x - barW/2, u.y - (u.size || 18) - 8, barW * hpRatio, barH);
  }
  
  for (let u of state.playerUnits) {
    drawUnit(u, '#3498db');
  }
  for (let u of state.cpuUnits) {
    drawUnit(u, '#e74c3c');
  }
  
  // ---- エフェクト描画 ----
  for (let e of battleEffects) {
    const alpha = 1 - (e.timer / e.duration);
    const scale = 1 + (e.timer / e.duration) * 0.5;
    ctx.globalAlpha = alpha;
    ctx.font = `${24 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(e.text, e.x, e.y - e.timer * 0.5);
  }
  ctx.globalAlpha = 1.0;
  
  // ---- プレビュー ----
  if (isPlayerDragging && playerPreviewUnit && playerSelectedUnit) {
    const def = UNIT_TYPES[playerSelectedUnit];
    if (def) {
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(playerPreviewUnit.x, playerPreviewUnit.y, def.size || 18, 0, Math.PI * 2);
      ctx.fillStyle = '#3498db';
      ctx.fill();
      ctx.strokeStyle = '#ecf0f1';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.font = `${Math.min(20, (def.size || 18) + 4)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.icon, playerPreviewUnit.x, playerPreviewUnit.y - 1);
      ctx.globalAlpha = 1.0;
    }
  }
  
  // ---- エリクサーバー ----
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 100, 20);
  ctx.fillStyle = '#ffd966';
  ctx.fillRect(10, 10, (state.playerElixir / state.maxElixir) * 100, 20);
  ctx.fillStyle = 'white';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`💎 ${Math.floor(state.playerElixir)}`, 14, 20);
  
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(690, 10, 100, 20);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(690, 10, (state.cpuElixir / state.maxElixir) * 100, 20);
  ctx.fillStyle = 'white';
  ctx.fillText(`💎 ${Math.floor(state.cpuElixir)}`, 694, 20);
}

// ---- 試合開始関数を完全に置き換え ----
function startBattle() {
  const cpuRandomCount = parseInt(document.getElementById('cpuRandomCount').value);
  const playerTowerHp = parseInt(document.getElementById('playerTowerHp').value) || 120;
  const cpuTowerHp = parseInt(document.getElementById('cpuTowerHp').value) || 120;
  const elixirSpeed = parseFloat(document.getElementById('elixirSpeed').value) || 3;
  
  const cpuDeck = buildCpuDeck(cpuRandomCount);
  
  if (deck.length === 0) {
    alert('デッキが空です。少なくとも1枚は選択してください。');
    return;
  }
  
  battleState = {
    playerDeck: [...deck],
    cpuDeck: cpuDeck,
    playerTowerHp: playerTowerHp,
    cpuTowerHp: cpuTowerHp,
    elixirSpeed: elixirSpeed,
    playerElixir: 10,
    cpuElixir: 10,
    maxElixir: 10,
    playerUnits: [],
    cpuUnits: [],
    playerTower: { hp: playerTowerHp, maxHp: playerTowerHp },
    cpuTower: { hp: cpuTowerHp, maxHp: cpuTowerHp },
    gameOver: false,
    winner: null,
    playerLastUnit: null,
    cpuLastUnit: null,
    frameCount: 0
  };
  
  // エフェクトクリア
  battleEffects = [];
  
  showBattleScreen();
  setupPlayerControls();
  
  if (battleInterval) clearInterval(battleInterval);
  battleInterval = setInterval(battleLoop, 50);
  isBattleActive = true;
}

</script>
