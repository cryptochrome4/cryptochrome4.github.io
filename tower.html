<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>クラロワ風 デッキ編集＋試合</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: #0d1b2a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      background: #1b3a4b;
      padding: 25px;
      border-radius: 30px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.8);
      max-width: 1200px;
      width: 100%;
    }
    h1 {
      color: #ffd966;
      text-align: center;
      margin: 0 0 15px 0;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 20px;
      align-items: center;
    }
    .settings label {
      color: #ecf0f1;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 2px solid #5a8a9a;
      background: #1a2a3a;
      color: #ffd966;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
    }
    .settings input[type="range"] {
      width: 120px;
      accent-color: #ffd966;
    }
    .settings .value-display {
      color: #ffd966;
      font-weight: bold;
      min-width: 30px;
      display: inline-block;
      text-align: center;
    }
    .deck-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      color: #ecf0f1;
    }
    .deck-info .count {
      font-size: 18px;
      font-weight: bold;
      color: #ffd966;
    }
    .btn-start {
      background: #27ae60;
      border: none;
      padding: 12px 40px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1a6b3a;
      transition: 0.1s;
    }
    .btn-start:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .btn-start:disabled {
      background: #555;
      box-shadow: 0 4px 0 #333;
      cursor: not-allowed;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
      padding: 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card-grid::-webkit-scrollbar { width: 6px; }
    .card-grid::-webkit-scrollbar-thumb { background: #ffd966; border-radius: 4px; }
    .card {
      background: #2c4c5e;
      border: 2px solid #5a8a9a;
      border-radius: 12px;
      padding: 8px 6px;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
      color: #ecf0f1;
      font-size: 12px;
      position: relative;
    }
    .card:hover { transform: translateY(-2px); border-color: #8ab8c8; }
    .card.selected { border-color: #ffd966; background: #3a6a7a; box-shadow: 0 0 12px rgba(255,217,102,0.3); }
    .card .icon { font-size: 28px; display: block; }
    .card .name { font-weight: bold; font-size: 12px; margin-top: 2px; }
    .card .cost-badge { background: rgba(0,0,0,0.5); border-radius: 10px; padding: 0 8px; font-size: 11px; color: #ffd966; display: inline-block; margin-top: 2px; }
    .card .color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); vertical-align: middle; margin-right: 3px; }
    .card .detail-btn { background: rgba(255,255,255,0.1); border: 1px solid #5a8a9a; border-radius: 20px; color: #8ab8c8; font-size: 10px; padding: 2px 10px; cursor: pointer; margin-top: 4px; transition: 0.1s; }
    .card .detail-btn:hover { background: rgba(255,255,255,0.2); }
    .card .check-mark { position: absolute; top: -6px; right: -6px; background: #ffd966; color: #1a2a3a; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1b3a4b; border-radius: 24px; padding: 30px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; border: 2px solid #ffd966; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .modal h2 { color: #ffd966; margin-top: 0; text-align: center; }
    .modal .stat { color: #ecf0f1; font-size: 14px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .modal .stat span { color: #ffd966; font-weight: bold; }
    .modal .close-btn { background: #c0392b; border: none; padding: 8px 30px; border-radius: 40px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; box-shadow: 0 4px 0 #78281f; transition: 0.1s; }
    .modal .close-btn:active { transform: translateY(4px); box-shadow: none; }
    .modal .special-desc { color: #8ab8c8; font-size: 14px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-top: 8px; }
    #battleContainer { background: #1b3a4b; padding: 20px; border-radius: 30px; box-shadow: 0 20px 30px rgba(0,0,0,0.8); max-width: 1200px; width: 100%; display: none; }
    #battleContainer .back-btn { background: #555; border: none; padding: 8px 20px; border-radius: 30px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
    #infoPanel { display: flex; justify-content: space-between; gap: 20px; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 10px 16px; margin-bottom: 10px; color: #ecf0f1; font-size: 13px; flex-wrap: wrap; }
    #battleCanvas { display: block; margin: 0 auto; background: #6b8c5c; border-radius: 20px; box-shadow: inset 0 0 0 3px #3d5a3d, 0 10px 20px rgba(0,0,0,0.5); cursor: grab; width: 100%; height: auto; aspect-ratio: 800/500; }
    #hpPanel { display: flex; justify-content: space-between; padding: 8px 16px; background: rgba(0,0,0,0.3); border-radius: 10px; margin-top: 10px; color: #ecf0f1; font-size: 14px; font-weight: bold; }
    #victoryScreen { display: none; text-align: center; padding: 40px 20px; background: rgba(0,0,0,0.6); border-radius: 20px; margin-top: 10px; }
    #victoryScreen h2 { color: #ffd966; font-size: 32px; }
    #victoryScreen p { color: #ecf0f1; font-size: 18px; margin: 15px 0; }
    #victoryScreen .oracle-btn { background: #27ae60; border: none; padding: 14px 50px; border-radius: 40px; color: white; font-weight: bold; font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 #1a6b3a; transition: 0.1s; }
    #victoryScreen .oracle-btn:active { transform: translateY(4px); box-shadow: none; }
    #playerUnitSelector { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px; background: rgba(0,0,0,0.5); border-radius: 12px; margin-bottom: 8px; justify-content: center; }
    #playerUnitSelector button { background: #2c4c5e; color: #ecf0f1; border: 2px solid #5a8a9a; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.1s; display: flex; align-items: center; gap: 4px; }
    #playerUnitSelector button.active { background: #ffd966; color: #1a2a3a; border-color: #f39c12; }
    #playerUnitSelector .close-btn { background: #c0392b; border: none; border-radius: 20px; padding: 4px 14px; color: white; font-weight: bold; font-size: 12px; cursor: pointer; }
    #battleMessage { text-align: center; color: #ffd966; font-weight: bold; font-size: 14px; padding: 4px; min-height: 24px; }
    @media (max-width: 600px) {
      .settings { flex-direction: column; align-items: stretch; }
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .container { padding: 15px; }
    }
  </style>
</head>
<body>

<!-- ===== デッキ編集画面 ===== -->
<div class="container" id="deckEditor">
  <h1>⚔️ デッキ編集</h1>
  <div class="settings">
    <label>🎯 CPUランダム枚数: <input type="range" id="cpuRandomCount" min="0" max="47" value="10" /><span class="value-display" id="cpuRandomCountDisplay">10</span></label>
    <label>🏰 自タワーHP: <input type="number" id="playerTowerHp" value="120" min="50" max="500" /></label>
    <label>🏰 CPUタワーHP: <input type="number" id="cpuTowerHp" value="120" min="50" max="500" /></label>
    <label>⏱️ エリクサー速度（秒/1）: <input type="range" id="elixirSpeed" min="1" max="10" value="3" step="0.5" /><span class="value-display" id="elixirSpeedDisplay">3</span>秒</label>
  </div>
  <div class="deck-info">
    <span>📋 デッキ枚数: <span class="count" id="deckCount">0</span> / 51</span>
    <span>🟢 CPU固定: イラン・ホルムズ海峡・ハマス・キム</span>
    <button class="btn-start" id="startBattleBtn">⚔️ 試合開始</button>
  </div>
  <div class="card-grid" id="cardGrid"></div>
</div>

<!-- ===== 試合画面 ===== -->
<div id="battleContainer">
  <button class="back-btn" id="backToDeckBtn">⬅ デッキ編集に戻る</button>
  <div id="infoPanel">
    <div style="flex:1;min-width:150px;"><span style="color:#3498db;">🔵 あなた</span><br><span id="playerLastUnitDisplay">-</span></div>
    <div style="flex:1;min-width:150px;text-align:center;">💎 <span id="battlePlayerElixir">10</span> / <span id="battleCpuElixir">10</span></div>
    <div style="flex:1;min-width:150px;text-align:right;"><span style="color:#e74c3c;">🔴 CPU</span><br><span id="cpuLastUnitDisplay">-</span></div>
  </div>
  <div id="playerUnitSelector"></div>
  <canvas id="battleCanvas" width="800" height="500"></canvas>
  <div id="battleMessage"></div>
  <div id="hpPanel">
    <span>🔵 自タワー: <span id="battlePlayerTowerHp">120</span></span>
    <span>🔴 CPUタワー: <span id="battleCpuTowerHp">120</span></span>
  </div>
  <div id="victoryScreen">
    <h2 id="victoryMessage">🎉 あなたの勝ち！</h2>
    <p>oracle.html に進みますか？</p>
    <button class="oracle-btn" id="oracleBtn">🚀 oracle.html へ進む</button>
  </div>
</div>

<!-- ===== 詳細モーダル ===== -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h2 id="modalTitle">カード詳細</h2>
    <div id="modalBody"></div>
    <button class="close-btn" id="modalCloseBtn">閉じる</button>
  </div>
</div>

// ---- カードレンダリング ----
function renderCards() {
  grid.innerHTML = '';
  let count = 0;
  for (const [key, def] of Object.entries(UNIT_TYPES)) {
    const isSelected = deck.includes(key);
    if (isSelected) count++;
    const card = document.createElement('div');
    card.className = 'card' + (isSelected ? ' selected' : '');
    if (def.bgColor) {
      const dot = document.createElement('span');
      dot.className = 'color-dot';
      dot.style.background = def.bgColor;
      card.appendChild(dot);
    }
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = def.icon;
    card.appendChild(icon);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = def.name;
    card.appendChild(name);
    const cost = document.createElement('div');
    cost.className = 'cost-badge';
    cost.textContent = `💎 ${def.cost}`;
    card.appendChild(cost);
    const detailBtn = document.createElement('button');
    detailBtn.className = 'detail-btn';
    detailBtn.textContent = '詳しく見る';
    detailBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showDetail(key);
    });
    card.appendChild(detailBtn);
    if (isSelected) {
      const check = document.createElement('div');
      check.className = 'check-mark';
      check.textContent = '✓';
      card.appendChild(check);
    }
    card.addEventListener('click', () => { toggleCard(key); });
    grid.appendChild(card);
  }
  deckCount.textContent = count;
  startBtn.disabled = (count === 0);
}

function toggleCard(key) {
  const idx = deck.indexOf(key);
  if (idx >= 0) { deck.splice(idx, 1); } else { if (deck.length >= 51) return; deck.push(key); }
  renderCards();
}

function showDetail(key) {
  const def = UNIT_TYPES[key];
  if (!def) return;
  modalTitle.textContent = `${def.icon} ${def.name}`;
  modalBody.innerHTML = `
    <div class="stat">📋 カテゴリ: <span>${def.cat}</span></div>
    <div class="stat">💎 コスト: <span>${def.cost}</span></div>
    <div class="stat">❤️ HP: <span>${def.hp}</span></div>
    <div class="stat">⚔️ 攻撃力: <span>${def.attack}</span></div>
    <div class="stat">📏 攻撃範囲: <span>${def.range}</span></div>
    <div class="stat">💨 移動速度: <span>${def.speed}</span></div>
    <div class="stat">⏱️ 攻撃速度: <span>${def.attackSpeed}</span></div>
    ${def.bgColor ? `<div class="stat">🎨 背景色: <span style="display:inline-block;width:20px;height:20px;background:${def.bgColor};border-radius:4px;vertical-align:middle;"></span></div>` : ''}
    <div class="special-desc">📖 特殊能力: ${def.desc || 'なし'}</div>
  `;
  modalOverlay.classList.add('active');
}
modalClose.addEventListener('click', () => { modalOverlay.classList.remove('active'); });
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

// ---- CPUデッキ構築 ----
function buildCpuDeck(randomCount) {
  const cpuDeck = [...CPU_FIXED];
  const allKeys = Object.keys(UNIT_TYPES);
  const available = allKeys.filter(k => !CPU_FIXED.includes(k));
  const shuffled = available.sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(randomCount, available.length));
  cpuDeck.push(...selected);
  return cpuDeck;
}

// ---- 距離計算 ----
function getDistance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function getDistanceToRect(unit, rect) {
  const cx = Math.max(rect.x, Math.min(unit.x, rect.x + rect.w));
  const cy = Math.max(rect.y, Math.min(unit.y, rect.y + rect.h));
  return Math.hypot(unit.x - cx, unit.y - cy);
}

// ---- エフェクト ----
function addEffect(x, y, text, duration) {
  battleEffects.push({ x, y, text, duration, timer: 0 });
}
function updateBattleEffects() {
  for (let i = battleEffects.length - 1; i >= 0; i--) {
    battleEffects[i].timer++;
    if (battleEffects[i].timer >= battleEffects[i].duration) battleEffects.splice(i, 1);
  }
}

// ---- ユニット更新（タワー判定を isTower フラグで明示） ----
function updateUnit(unit, enemyUnits, enemyTower, team) {
  if (!unit.alive) return;
  if (unit.attackCooldown > 0) unit.attackCooldown--;
  if (unit.key === 'wall') return;

  // ヒーラー
  if (unit.key === 'healer') {
    const allies = team === 'player' ? battleState.playerUnits : battleState.cpuUnits;
    for (let a of allies) {
      if (a === unit || !a.alive) continue;
      if (getDistance(unit, a) < unit.range) {
        a.hp = Math.min(a.maxHp, a.hp + 2);
        addEffect(a.x, a.y, '💚', 10);
      }
    }
    unit.x += (team === 'player' ? 1 : -1) * unit.speed * 0.5;
    unit.x = Math.max(20, Math.min(780, unit.x));
    unit.y = Math.max(20, Math.min(480, unit.y));
    return;
  }

  // ---- ターゲット選択（ユニット優先、なければタワー） ----
  let target = null;
  let closestDist = Infinity;
  for (let u of enemyUnits) {
    if (!u.alive) continue;
    const d = getDistance(unit, u);
    if (d < closestDist) { closestDist = d; target = u; }
  }
  const dTower = getDistanceToRect(unit, enemyTower);
  if (dTower < closestDist) { closestDist = dTower; target = enemyTower; }
  unit.target = target;

  if (!target) {
    unit.x += (team === 'player' ? 1 : -1) * unit.speed;
    unit.x = Math.max(20, Math.min(780, unit.x));
    unit.y = Math.max(20, Math.min(480, unit.y));
    return;
  }

  // ★ タワーかどうかを明示的に判定
  const isTower = (target === enemyTower);
  const dist = isTower ? getDistanceToRect(unit, target) : getDistance(unit, target);

  if (dist <= unit.range) {
    // 攻撃
    if (unit.attackCooldown === 0) {
      // 爆弾兵
      if (unit.key === 'bomber') {
        for (let u of enemyUnits) {
          if (!u.alive) continue;
          if (getDistance(unit, u) < 70) {
            u.hp -= 25;
            if (u.hp <= 0) u.alive = false;
            addEffect(u.x, u.y, '💥', 20);
          }
        }
        const tower = team === 'player' ? battleState.cpuTower : battleState.playerTower;
        if (getDistanceToRect(unit, tower) < 70) {
          tower.hp -= 25;
          addEffect(tower.x + 30, tower.y + 50, '💥', 20);
        }
        unit.alive = false;
        return;
      }
      // 魔法使い
      if (unit.key === 'mage') {
        for (let u of enemyUnits) {
          if (!u.alive) continue;
          if (getDistance(unit, u) < 50) {
            u.hp -= 10;
            if (u.hp <= 0) u.alive = false;
            addEffect(u.x, u.y, '✨', 10);
          }
        }
        const tower = team === 'player' ? battleState.cpuTower : battleState.playerTower;
        if (getDistanceToRect(unit, tower) < 50) {
          tower.hp -= 5;
          addEffect(tower.x + 30, tower.y + 50, '✨', 10);
        }
        unit.attackCooldown = 30;
        return;
      }
      // 通常攻撃
      if (isTower) {
        // ★ タワー攻撃
        target.hp -= unit.attack;
        if (target.hp < 0) target.hp = 0;
        addEffect(target.x + 30, target.y + 50, '⚔️', 8);
      } else {
        // ユニット攻撃
        target.hp -= unit.attack;
        if (target.hp <= 0) {
          target.alive = false;
          addEffect(target.x, target.y, '💀', 15);
        }
        addEffect(target.x, target.y, '⚔️', 8);
      }
      unit.attackCooldown = 30;
    }
  } else {
    // ★ 移動：タワーの場合は中心を狙う、ユニットはそのまま
    let targetX, targetY;
    if (isTower) {
      targetX = target.x + target.w / 2;
      targetY = target.y + target.h / 2;
    } else {
      targetX = target.x;
      targetY = target.y;
    }
    const dx = targetX - unit.x;
    const dy = targetY - unit.y;
    const len = Math.hypot(dx, dy);
    if (len > 1) {
      unit.x += (dx / len) * unit.speed;
      unit.y += (dy / len) * unit.speed;
    }
  }
  unit.x = Math.max(20, Math.min(780, unit.x));
  unit.y = Math.max(20, Math.min(480, unit.y));
}

// ---- CPU行動 ----
function tryCpuAction(state) {
  if (state.cpuDeck.length === 0) return;
  const affordable = state.cpuDeck.filter(key => {
    const def = UNIT_TYPES[key];
    return def && def.cost <= state.cpuElixir;
  });
  if (affordable.length === 0) return;
  const key = affordable[Math.floor(Math.random() * affordable.length)];
  const def = UNIT_TYPES[key];
  if (!def) return;
  state.cpuElixir -= def.cost;
  state.cpuLastUnit = key;
  const y = 80 + Math.random() * 340;
  const unit = {
    key: key, x: 700, y: y, hp: def.hp, maxHp: def.hp, attack: def.attack,
    range: def.range, speed: def.speed, size: def.size, icon: def.icon,
    name: def.name, team: 'cpu',
    bgColor: def.bgColor || null,
    alive: true, attackCooldown: 0, target: null
  };
  state.cpuUnits.push(unit);
}

// ---- 描画 ----
function drawBattle() {
  const canvas = document.getElementById('battleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const state = battleState;
  if (!state) return;
  
  ctx.clearRect(0, 0, 800, 500);
  ctx.strokeStyle = '#4a6b3a';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 15]);
  ctx.beginPath();
  ctx.moveTo(400, 20);
  ctx.lineTo(400, 480);
  ctx.stroke();
  ctx.setLineDash([]);
  
  function drawTower(tower, isPlayer) {
    const color = isPlayer ? '#2980b9' : '#c0392b';
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.fillRect(tower.x, tower.y, tower.w, tower.h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 3;
    ctx.strokeRect(tower.x, tower.y, tower.w, tower.h);
    const ratio = Math.max(0, tower.hp / tower.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(tower.x, tower.y - 22, tower.w, 12);
    ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(tower.x, tower.y - 22, tower.w * ratio, 12);
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isPlayer ? '🔵' : '🔴', tower.x + tower.w/2, tower.y - 35);
    ctx.fillStyle = 'white';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${Math.floor(tower.hp)}/${tower.maxHp}`, tower.x + tower.w/2, tower.y - 10);
  }
  drawTower(state.playerTower, true);
  drawTower(state.cpuTower, false);
  
  function drawUnit(u, color) {
    if (!u.alive) return;
    if (u.bgColor) {
      ctx.beginPath();
      ctx.arc(u.x, u.y, (u.size || 18) + 4, 0, Math.PI * 2);
      ctx.strokeStyle = u.bgColor;
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.size || 18, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'white';
    ctx.font = `${Math.min(20, (u.size || 18) + 4)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.icon || '?', u.x, u.y - 1);
    const barW = Math.min(30, (u.size || 18) * 2);
    const barH = 4;
    const hpRatio = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(u.x - barW/2, u.y - (u.size || 18) - 8, barW, barH);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(u.x - barW/2, u.y - (u.size || 18) - 8, barW * hpRatio, barH);
  }

  for (let u of state.playerUnits) drawUnit(u, '#3498db');
  for (let u of state.cpuUnits) drawUnit(u, '#e74c3c');
  
  for (let e of battleEffects) {
    const alpha = 1 - (e.timer / e.duration);
    const scale = 1 + (e.timer / e.duration) * 0.5;
    ctx.globalAlpha = alpha;
    ctx.font = `${24 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(e.text, e.x, e.y - e.timer * 0.5);
  }
  ctx.globalAlpha = 1.0;
  
  if (isPlayerDragging && playerPreviewUnit && playerSelectedUnit) {
    const def = UNIT_TYPES[playerSelectedUnit];
    if (def) {
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(playerPreviewUnit.x, playerPreviewUnit.y, def.size || 18, 0, Math.PI * 2);
      ctx.fillStyle = '#3498db';
      ctx.fill();
      ctx.strokeStyle = '#ecf0f1';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.font = `${Math.min(20, (def.size || 18) + 4)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.icon, playerPreviewUnit.x, playerPreviewUnit.y - 1);
      ctx.globalAlpha = 1.0;
    }
  }
  
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 100, 20);
  ctx.fillStyle = '#ffd966';
  ctx.fillRect(10, 10, (state.playerElixir / state.maxElixir) * 100, 20);
  ctx.fillStyle = 'white';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`💎 ${Math.floor(state.playerElixir)}`, 14, 20);
  
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(690, 10, 100, 20);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(690, 10, (state.cpuElixir / state.maxElixir) * 100, 20);
  ctx.fillStyle = 'white';
  ctx.fillText(`💎 ${Math.floor(state.cpuElixir)}`, 694, 20);
}

// ---- UI更新 ----
function updateBattleUI() {
  if (!battleState) return;
  const state = battleState;
  document.getElementById('battlePlayerElixir').textContent = Math.floor(state.playerElixir);
  document.getElementById('battleCpuElixir').textContent = Math.floor(state.cpuElixir);
  document.getElementById('battlePlayerTowerHp').textContent = Math.floor(state.playerTower.hp);
  document.getElementById('battleCpuTowerHp').textContent = Math.floor(state.cpuTower.hp);
  const playerName = state.playerLastUnit ? UNIT_TYPES[state.playerLastUnit]?.name || '-' : '-';
  const cpuName = state.cpuLastUnit ? UNIT_TYPES[state.cpuLastUnit]?.name || '-' : '-';
  document.getElementById('playerLastUnitDisplay').textContent = playerName;
  document.getElementById('cpuLastUnitDisplay').textContent = cpuName;
}

// ---- 勝利画面 ----
function showVictory(winner) {
  if (battleInterval) clearInterval(battleInterval);
  isBattleActive = false;
  const msg = winner === 'player' ? '🎉 あなたの勝ち！' : '😵 CPUの勝ち...';
  document.getElementById('victoryMessage').textContent = msg;
  document.getElementById('battleCanvas').style.display = 'none';
  document.getElementById('infoPanel').style.display = 'none';
  document.getElementById('hpPanel').style.display = 'none';
  document.getElementById('playerUnitSelector').style.display = 'none';
  document.getElementById('battleMessage').style.display = 'none';
  document.getElementById('victoryScreen').style.display = 'block';
  document.getElementById('oracleBtn').onclick = () => { window.location.href = 'toll.html'; };
}

// ---- バトルループ ----
function battleLoop() {
  if (!battleState || battleState.gameOver) {
    drawBattle();
    return;
  }
  const state = battleState;
  state.frameCount = (state.frameCount || 0) + 1;
  const elixirPerFrame = 1 / (state.elixirSpeed * 20);
  state.playerElixir = Math.min(state.maxElixir, state.playerElixir + elixirPerFrame);
  state.cpuElixir = Math.min(state.maxElixir, state.cpuElixir + elixirPerFrame);
  
  if (state.frameCount % 12 === 0) tryCpuAction(state);
  
  for (let i = state.playerUnits.length - 1; i >= 0; i--) {
    const u = state.playerUnits[i];
    if (!u.alive) { state.playerUnits.splice(i, 1); continue; }
    updateUnit(u, state.cpuUnits, state.cpuTower, 'player');
  }
  for (let i = state.cpuUnits.length - 1; i >= 0; i--) {
    const u = state.cpuUnits[i];
    if (!u.alive) { state.cpuUnits.splice(i, 1); continue; }
    updateUnit(u, state.playerUnits, state.playerTower, 'cpu');
  }
  
  updateBattleEffects();
  updateBattleUI();
  drawBattle();
  
  if (state.cpuTower.hp <= 0) { state.gameOver = true; state.winner = 'player'; showVictory('player'); }
  else if (state.playerTower.hp <= 0) { state.gameOver = true; state.winner = 'cpu'; showVictory('cpu'); }
}

// ---- プレイヤー操作 ----
function setupPlayerControls() {
  const canvas = document.getElementById('battleCanvas');
  if (!canvas) return;
  const newCanvas = canvas.cloneNode(true);
  canvas.parentNode.replaceChild(newCanvas, canvas);
  
  const selector = document.getElementById('playerUnitSelector');
  selector.innerHTML = '';
  const deck = battleState.playerDeck;
  for (let key of deck) {
    const def = UNIT_TYPES[key];
    if (!def) continue;
    const btn = document.createElement('button');
    btn.textContent = `${def.icon} ${def.name} (${def.cost})`;
    if (playerSelectedUnit === key) btn.classList.add('active');
    btn.onclick = () => {
      // エリクサー不足でも選択は可能（配置時にチェック）
      playerSelectedUnit = (playerSelectedUnit === key) ? null : key;
      setupPlayerControls();
    };
    selector.appendChild(btn);
  }
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ 閉じる';
  closeBtn.className = 'close-btn';
  closeBtn.onclick = () => { playerSelectedUnit = null; setupPlayerControls(); };
  selector.appendChild(closeBtn);
  
  function getCoords(e) {
    const rect = newCanvas.getBoundingClientRect();
    const scaleX = newCanvas.width / rect.width;
    const scaleY = newCanvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }
  
  newCanvas.addEventListener('mousedown', (e) => {
    if (!battleState || battleState.gameOver) return;
    if (!playerSelectedUnit) {
      document.getElementById('battleMessage').textContent = '⚠️ 先にユニットを選択してください';
      return;
    }
    const def = UNIT_TYPES[playerSelectedUnit];
    if (!def) return;
    if (battleState.playerElixir < def.cost) {
      document.getElementById('battleMessage').textContent = `⚠️ エリクサーが足りません！ (${def.cost}必要)`;
      return;
    }
    const pos = getCoords(e);
    if (pos.x > 350) {
      document.getElementById('battleMessage').textContent = '❌ 自陣側(左半分)に配置してください';
      return;
    }
    isPlayerDragging = true;
    playerPreviewUnit = { x: pos.x, y: pos.y };
  });
  
  newCanvas.addEventListener('mousemove', (e) => {
    if (!isPlayerDragging || !playerPreviewUnit) return;
    const pos = getCoords(e);
    playerPreviewUnit.x = Math.max(20, Math.min(350, pos.x));
    playerPreviewUnit.y = Math.max(20, Math.min(480, pos.y));
    drawBattle();
  });
  
  newCanvas.addEventListener('mouseup', (e) => {
    if (!isPlayerDragging || !playerSelectedUnit || !playerPreviewUnit) {
      isPlayerDragging = false;
      return;
    }
    const def = UNIT_TYPES[playerSelectedUnit];
    if (!def) return;
    if (battleState.playerElixir < def.cost) {
      document.getElementById('battleMessage').textContent = `⚠️ エリクサーが足りません！ (${def.cost}必要)`;
      isPlayerDragging = false;
      playerPreviewUnit = null;
      return;
    }
    battleState.playerElixir -= def.cost;
    const unit = {
      key: playerSelectedUnit,
      x: playerPreviewUnit.x,
      y: playerPreviewUnit.y,
      hp: def.hp, maxHp: def.hp, attack: def.attack,
      range: def.range, speed: def.speed, size: def.size,
      icon: def.icon, name: def.name, team: 'player',
      bgColor: def.bgColor || null,
      alive: true, attackCooldown: 0, target: null
    };
    battleState.playerUnits.push(unit);
    battleState.playerLastUnit = playerSelectedUnit;
    document.getElementById('battleMessage').textContent = `✅ ${def.name}を配置！`;
    isPlayerDragging = false;
    playerPreviewUnit = null;
  });
}

// ---- 試合開始（★バグ修正：プレイヤー状態リセット） ----
function startBattle() {
  const cpuRandomCount = parseInt(cpuRandomInput.value);
  const playerTowerHp = parseInt(playerTowerHpInput.value) || 120;
  const cpuTowerHp = parseInt(cpuTowerHpInput.value) || 120;
  const elixirSpeed = parseFloat(elixirSpeedInput.value) || 3;
  const cpuDeck = buildCpuDeck(cpuRandomCount);
  if (deck.length === 0) { alert('デッキが空です。少なくとも1枚は選択してください。'); return; }
  
  // ★ プレイヤー状態をリセット
  playerSelectedUnit = null;
  isPlayerDragging = false;
  playerPreviewUnit = null;
  battleEffects = [];
  
  battleState = {
    playerDeck: [...deck],
    cpuDeck: cpuDeck,
    playerElixir: 10, cpuElixir: 10, maxElixir: 10,
    playerUnits: [], cpuUnits: [],
    playerTower: { x: 80, y: 200, w: 60, h: 100, hp: playerTowerHp, maxHp: playerTowerHp },
    cpuTower: { x: 660, y: 200, w: 60, h: 100, hp: cpuTowerHp, maxHp: cpuTowerHp },
    elixirSpeed: elixirSpeed,
    gameOver: false, winner: null,
    playerLastUnit: null, cpuLastUnit: null,
    frameCount: 0
  };
  
  document.getElementById('deckEditor').style.display = 'none';
  document.getElementById('battleContainer').style.display = 'block';
  document.getElementById('battleCanvas').style.display = 'block';
  document.getElementById('infoPanel').style.display = 'flex';
  document.getElementById('hpPanel').style.display = 'flex';
  document.getElementById('playerUnitSelector').style.display = 'flex';
  document.getElementById('battleMessage').style.display = 'block';
  document.getElementById('victoryScreen').style.display = 'none';
  
  setupPlayerControls();
  if (battleInterval) clearInterval(battleInterval);
  battleInterval = setInterval(battleLoop, 50);
  isBattleActive = true;
}

// ---- 戻るボタン ----
document.getElementById('backToDeckBtn').addEventListener('click', () => {
  if (battleInterval) clearInterval(battleInterval);
  isBattleActive = false;
  document.getElementById('battleContainer').style.display = 'none';
  document.getElementById('deckEditor').style.display = 'block';
});

// ---- 初期化 ----
startBtn.addEventListener('click', startBattle);
renderCards();
console.log('✅ 完全版 起動完了！');
console.log('✅ タワー攻撃・カード選択バグ修正済み');
</script>
