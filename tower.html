<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クラロワ風 バトル</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-wrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .container {
            background: #2d3b4b;
            padding: 16px;
            border-radius: 24px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: inset 0 0 0 2px #4a5a6e;
            background: #3d4b5e;
            width: 800px;
            height: 600px;
        }
        .panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #f0e6d0;
            gap: 20px;
            background: #1e2a3a;
            padding: 12px 20px;
            border-radius: 40px;
            flex-wrap: wrap;
        }
        .elixir-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f1a2b;
            padding: 4px 18px 4px 12px;
            border-radius: 40px;
            height: 40px;
            border: 1px solid #6b7f94;
        }
        .elixir-fill {
            width: 120px;
            height: 18px;
            background: #3a2a3a;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid #7a5a7a;
        }
        .elixir-current {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b08aff, #d4b0ff);
            border-radius: 30px;
            transition: width 0.2s;
        }
        .elixir-text {
            font-weight: bold;
            color: #e5d5ff;
            min-width: 30px;
            text-align: center;
        }
        .hand {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .card {
            background: #2b3a4e;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #6a7f9a;
            color: #f5f0e0;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #0f1a2b;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 40px;
        }
        .card:hover:not(.disabled) {
            transform: scale(1.02);
            background: #3c5068;
            border-color: #b8cae0;
        }
        .card.disabled {
            opacity: 0.4;
            filter: grayscale(0.6);
            pointer-events: none;
        }
        .card .cost {
            background: #5f3a7a;
            border-radius: 30px;
            padding: 0 10px;
            color: #f0e0ff;
            font-size: 14px;
        }
        .status {
            display: flex;
            gap: 20px;
            font-size: 15px;
            background: #1f2b3a;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid #5a6f84;
        }
        .status span {
            color: #aac3e0;
        }
        .btn-reset {
            background: #4b3a5a;
            border: none;
            color: #eee;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #7a6a8a;
            transition: 0.15s;
        }
        .btn-reset:hover {
            background: #6a4a7a;
        }
        .win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            gap: 20px;
        }
        .win-overlay.show {
            display: flex;
        }
        .win-box {
            background: #1f2e3f;
            padding: 40px 70px;
            border-radius: 60px;
            border: 3px solid #d4b06a;
            box-shadow: 0 0 60px #b08a4a;
            text-align: center;
        }
        .win-box h1 {
            font-size: 48px;
            color: #f5e6b0;
            margin: 0;
        }
        .win-box p {
            color: #ccddee;
            font-size: 20px;
        }
        .win-box a {
            display: inline-block;
            margin-top: 20px;
            background: #4a6a8a;
            padding: 12px 40px;
            border-radius: 60px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            border: 2px solid #8ab0d0;
        }
        .win-box a:hover {
            background: #5a7a9a;
        }
        @media (max-width: 840px) {
            canvas { width: 100%; height: auto; aspect-ratio: 800/600; }
            .panel { flex-direction: column; align-items: stretch; }
            .hand { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="panel">
            <div class="elixir-bar">
                <span style="color:#d4c0f0;">⚡</span>
                <div class="elixir-fill"><div class="elixir-current" id="elixirFill" style="width:0%"></div></div>
                <span class="elixir-text" id="elixirText">0</span>
            </div>
            <div class="hand" id="handContainer"></div>
            <div class="status">
                <span>❤️ <span id="playerKingHp">100</span></span>
                <span>❤️ <span id="cpuKingHp">100</span></span>
                <button class="btn-reset" id="resetButton">🔄 再戦</button>
            </div>
        </div>
    </div>
</div>
<div class="win-overlay" id="winOverlay">
    <div class="win-box">
        <h1 id="winTitle">🏆 勝利</h1>
        <p id="winDesc">doll.html に進む</p>
        <a href="#" id="winLink">doll.html へ</a>
    </div>
</div>
<script>
    (function(){
        // ---- 定数 & マップ ----
        const COLS = 21, ROWS = 23;
        const CELL = 28;
        const OFFSET_X = 20, OFFSET_Y = 20;

        const rawMap = [
            "床床床床床床床床床床床",
            "床床床床青青青床床床床",
            "床床床床青青青床床床床",
            "床灰灰床青青青床灰灰床",
            "床灰灰床床床床床灰灰床",
            "床床床床床水床床床床床",
            "床床床床床床床床床床床",
            "床床床床床床床床床床床",
            "床床床床床床床床床床床",
            "床床床床床紫床床床床床",
            "黒緑緑黒黒黒黒黒緑緑黒",
            "黒緑緑黒黒黒黒黒緑緑黒",
            "黒緑緑黒黒黒黒黒緑緑黒",
            "黒緑緑黒黒黒黒黒緑緑黒",
            "床床床床床橙床床床床床",
            "床床床床床床床床床床床",
            "床床床床床床床床床床床",
            "床床床床床床床床床床床",
            "床床床床床ピ床床床床床",
            "床茶茶床床床床床茶茶床",
            "床茶茶床赤赤赤床茶茶床",
            "床床床床赤赤赤床床床床",
            "床床床床赤赤赤床床床床",
            "床床床床床床床床床床床"
        ];

        let mapGrid = [];
        function parseMap() {
            const charMap = {
                '床':0,'水':1,'灰':2,'紫':3,'赤':4,'茶':5,'ピ':6,'橙':7,'黒':8,'緑':9,'青':10
            };
            for (let r=0; r<ROWS; r++) {
                const row = rawMap[r] || '床床床床床床床床床床床';
                const chars = row.split('');
                mapGrid[r] = [];
                for (let c=0; c<COLS; c++) {
                    const ch = chars[c] || '床';
                    mapGrid[r][c] = charMap[ch] !== undefined ? charMap[ch] : 0;
                }
            }
        }
        parseMap();

        // ---- ユニットクラス ----
        class Unit {
            constructor(type, owner, x, y, hp, atk, def, speed, range=1, isArcher=false) {
                this.type = type;
                this.owner = owner;
                this.x = x; this.y = y;
                this.hp = hp; this.maxHp = hp;
                this.atk = atk; this.def = def;
                this.speed = speed;
                this.range = range;
                this.isArcher = isArcher;
                this.alive = true;
                this.cooldown = 0;
                this.moveCounter = 0;
                this.target = null;
                this.attackCooldown = 0;
            }
        }

        // ---- ゲーム状態 ----
        let units = [];
        let playerDeck = ['トランプ','ユダヤ','オイル','イーロンマスク','トランプ','ユダヤ','オイル','イーロンマスク'];
        let cpuDeck = ['イラン','ホルムズ','ハマス','キムジョウン','イラン','ホルムズ','ハマス','キムジョウン'];
        let playerHand = [];
        let cpuHand = [];
        let elixir = 6;
        let maxElixir = 10;
        let elixirTimer = 0;
        let gameOver = false;
        let winner = null;

        let playerKingHP = 100, playerPrinceHP = [100,100];
        let cpuKingHP = 100, cpuPrinceHP = [100,100];

        const SPAWN_PLAYER = {x:5, y:5};
        const SPAWN_CPU = {x:15, y:18};
        const ARCHER_PLAYER_POS = {x:10, y:9};
        const ARCHER_CPU_POS = {x:10, y:14};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const elixirFill = document.getElementById('elixirFill');
        const elixirText = document.getElementById('elixirText');
        const handContainer = document.getElementById('handContainer');
        const playerKingHpEl = document.getElementById('playerKingHp');
        const cpuKingHpEl = document.getElementById('cpuKingHp');
        const winOverlay = document.getElementById('winOverlay');
        const winTitle = document.getElementById('winTitle');
        const winDesc = document.getElementById('winDesc');
        const winLink = document.getElementById('winLink');

        // ---- ヘルパー ----
        function shuffleArray(arr) {
            for (let i=arr.length-1; i>0; i--) {
                const j=Math.floor(Math.random()*(i+1));
                [arr[i],arr[j]]=[arr[j],arr[i]];
            }
            return arr;
        }

        function drawCardFromDeck(deck) {
            if (deck.length===0) return null;
            return deck.pop();
        }

        function initHands() {
            shuffleArray(playerDeck);
            shuffleArray(cpuDeck);
            playerHand = [];
            cpuHand = [];
            for (let i=0; i<4; i++) {
                if (playerDeck.length) playerHand.push(playerDeck.pop());
                if (cpuDeck.length) cpuHand.push(cpuDeck.pop());
            }
        }

        function getCost(cardName) {
            const map = {'トランプ':9,'ユダヤ':6,'オイル':3,'イーロンマスク':5,'イラン':9,'ホルムズ':6,'ハマス':3,'キムジョウン':5};
            return map[cardName] || 5;
        }

        function createUnitFromCard(cardName, owner, x, y) {
            const stats = {
                'トランプ': {hp:90, atk:9, def:2, speed:1, archer:false},
                'ユダヤ': {hp:60, atk:4, def:5, speed:2, archer:false},
                'オイル': {hp:30, atk:1, def:2, speed:3, archer:false},
                'イーロンマスク': {hp:1, atk:3, def:0, speed:0, archer:true},
                'イラン': {hp:90, atk:8, def:4, speed:1, archer:false},
                'ホルムズ': {hp:60, atk:5, def:2, speed:2, archer:false},
                'ハマス': {hp:30, atk:2, def:0, speed:3, archer:false},
                'キムジョウン': {hp:1, atk:4, def:0, speed:0, archer:true}
            };
            const s = stats[cardName];
            if (!s) return null;
            return new Unit(cardName, owner, x, y, s.hp, s.atk, s.def, s.speed, 1, s.archer);
        }

        function canSpawn(cardName) {
            return elixir >= getCost(cardName);
        }

        function spawnUnit(cardName, owner) {
            if (gameOver) return false;
            const cost = getCost(cardName);
            if (elixir < cost) return false;
            elixir -= cost;
            let spawnPos = (owner==='player') ? SPAWN_PLAYER : SPAWN_CPU;
            if (cardName==='イーロンマスク' && owner==='player') spawnPos = ARCHER_PLAYER_POS;
            else if (cardName==='キムジョウン' && owner==='cpu') spawnPos = ARCHER_CPU_POS;
            
            if (cardName==='オイル' || cardName==='ハマス') {
                const leftX = (owner==='player') ? SPAWN_PLAYER.x - 2 : SPAWN_CPU.x - 2;
                const rightX = (owner==='player') ? SPAWN_PLAYER.x + 2 : SPAWN_CPU.x + 2;
                const y = (owner==='player') ? SPAWN_PLAYER.y : SPAWN_CPU.y;
                const u1 = createUnitFromCard(cardName, owner, leftX, y);
                const u2 = createUnitFromCard(cardName, owner, rightX, y);
                if (u1) { units.push(u1); }
                if (u2) { units.push(u2); }
            } else {
                const u = createUnitFromCard(cardName, owner, spawnPos.x, spawnPos.y);
                if (u) units.push(u);
            }
            let hand = (owner==='player') ? playerHand : cpuHand;
            const idx = hand.indexOf(cardName);
            if (idx!==-1) hand.splice(idx,1);
            const deck = (owner==='player') ? playerDeck : cpuDeck;
            if (deck.length>0) {
                const drawn = deck.pop();
                if (drawn) hand.push(drawn);
            }
            if (owner==='cpu' && cpuHand.length<4 && cpuDeck.length>0) {
                const drawn = cpuDeck.pop();
                if (drawn) cpuHand.push(drawn);
            }
            return true;
        }

        // ---- 戦闘ロジック ----
        function getCell(x,y) {
            if (x<0 || x>=COLS || y<0 || y>=ROWS) return -1;
            return mapGrid[y]?.[x] ?? -1;
        }

        function isWalkable(x,y) {
            const cell = getCell(x,y);
            if (cell===8) return false;
            if (cell===9) return true;
            if (cell===0 || cell===1 || cell===6 || cell===10 || cell===4) return true;
            if (cell===2 || cell===5) return false;
            if (cell===3 || cell===7) return false;
            return true;
        }

        function dist(a,b) {
            return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
        }

        function findTarget(unit) {
            const isPlayer = (unit.owner==='player');
            const princeHP = isPlayer ? cpuPrinceHP : playerPrinceHP;
            const princePos = isPlayer ? [{x:3,y:3},{x:17,y:3}] : [{x:3,y:19},{x:17,y:19}];
            let best = null; let bestDist = Infinity;
            for (let i=0; i<2; i++) {
                if (princeHP[i]<=0) continue;
                const d = dist(unit, {x:princePos[i].x, y:princePos[i].y});
                if (d<bestDist) { bestDist=d; best={type:'prince', idx:i, x:princePos[i].x, y:princePos[i].y}; }
            }
            const kingPos = isPlayer ? {x:10,y:3} : {x:10,y:19};
            if (!unit.isArcher) {
                if (princeHP[0]<=0 && princeHP[1]<=0) {
                    const d = dist(unit, kingPos);
                    if (d<bestDist) { bestDist=d; best={type:'king', idx:-1, x:kingPos.x, y:kingPos.y}; }
                }
            } else {
                const d = dist(unit, kingPos);
                if (d<bestDist) { bestDist=d; best={type:'king', idx:-1, x:kingPos.x, y:kingPos.y}; }
            }
            const enemyUnits = units.filter(u => u.alive && u.owner!==unit.owner);
            for (let u of enemyUnits) {
                if (!u.alive) continue;
                const d = dist(unit, u);
                if (d<bestDist) { bestDist=d; best={type:'unit', ref:u, x:u.x, y:u.y}; }
            }
            return best;
        }

        function applyDefense(atk, def) {
            if (def<=0) return atk;
            if (Math.random() < 0.5) {
                return Math.max(0, atk - def);
            }
            return atk;
        }

        function updateGame() {
            if (gameOver) return;

            elixirTimer += 1/60;
            if (elixirTimer >= 3) {
                elixirTimer = 0;
                if (elixir < maxElixir) elixir++;
                if (elixir > maxElixir) elixir=maxElixir;
            }

            for (let u of units) {
                if (!u.alive) continue;
                if (u.isArcher) {
                    const target = findTarget(u);
                    if (target && target.type==='king') {
                        const isPlayer = (u.owner==='player');
                        const kingHP = isPlayer ? cpuKingHP : playerKingHP;
                        if (kingHP>0) {
                            let dmg = u.atk;
                            if (u.type==='イーロンマスク' && Math.random() < 1/6) {
                                u.alive = false;
                            } else if (u.type==='キムジョウン' && Math.random() < 1/5) {
                                u.alive = false;
                            }
                            if (isPlayer) {
                                cpuKingHP = Math.max(0, cpuKingHP - dmg);
                            } else {
                                playerKingHP = Math.max(0, playerKingHP - dmg);
                            }
                        }
                    }
                    continue;
                }

                const t = findTarget(u);
                if (!t) continue;
                const d = dist(u, {x:t.x, y:t.y});
                if (d <= 1) {
                    if (u.attackCooldown<=0) {
                        let dmg = u.atk;
                        let def = 0;
                        if (t.type==='unit' && t.ref) {
                            def = t.ref.def;
                            dmg = applyDefense(u.atk, def);
                            t.ref.hp -= dmg;
                            if (t.ref.hp <=0) { t.ref.alive=false; }
                        } else if (t.type==='prince') {
                            const idx = t.idx;
                            const isPlayer = (u.owner==='player');
                            const hpArr = isPlayer ? cpuPrinceHP : playerPrinceHP;
                            hpArr[idx] = Math.max(0, hpArr[idx] - dmg);
                        } else if (t.type==='king') {
                            const isPlayer = (u.owner==='player');
                            if (isPlayer) cpuKingHP = Math.max(0, cpuKingHP - dmg);
                            else playerKingHP = Math.max(0, playerKingHP - dmg);
                        }
                        u.attackCooldown = 30;
                    } else {
                        u.attackCooldown--;
                    }
                } else {
                    u.moveCounter++;
                    let moveThreshold = 0;
                    if (u.speed===1) moveThreshold = 10;
                    else if (u.speed===2) moveThreshold = 20;
                    else moveThreshold = 30;
                    if (u.moveCounter >= moveThreshold) {
                        u.moveCounter = 0;
                        const dx = Math.sign(t.x - u.x);
                        const dy = Math.sign(t.y - u.y);
                        const nx = u.x + dx, ny = u.y + dy;
                        if (isWalkable(nx, ny)) {
                            u.x = nx; u.y = ny;
                        } else {
                            if (isWalkable(u.x + dx, u.y)) u.x += dx;
                            else if (isWalkable(u.x, u.y + dy)) u.y += dy;
                        }
                    }
                }
            }

            const deadUnits = units.filter(u => !u.alive);
            for (let u of deadUnits) {
                const deck = (u.owner==='player') ? playerDeck : cpuDeck;
                deck.push(u.type);
            }
            units = units.filter(u => u.alive);

            if (playerKingHP <=0) {
                gameOver = true; winner = 'cpu';
                showWin(false);
            } else if (cpuKingHP <=0) {
                gameOver = true; winner = 'player';
                showWin(true);
            }

            if (!gameOver) {
                cpuAI();
            }

            updateUI();
        }

        function cpuAI() {
            const available = cpuHand.filter(c => canSpawn(c));
            if (available.length===0) return;
            const card = available[Math.floor(Math.random()*available.length)];
            spawnUnit(card, 'cpu');
        }

        function showWin(playerWin) {
            winOverlay.classList.add('show');
            if (playerWin) {
                winTitle.innerText = '🏆 勝利!';
                winDesc.innerText = 'doll.html に移動します';
                winLink.href = 'doll.html';
            } else {
                winTitle.innerText = '💀 敗北...';
                winDesc.innerText = '再戦するか doll.html へ';
                winLink.href = 'doll.html';
            }
        }

        // ---- 描画 ----
        function draw() {
            ctx.clearRect(0,0,800,600);
            
            // マップ描画
            for (let r=0; r<ROWS; r++) {
                for (let c=0; c<COLS; c++) {
                    const cell = mapGrid[r]?.[c] ?? 0;
                    const x = OFFSET_X + c*CELL, y = OFFSET_Y + r*CELL;
                    let color = '#f0f0f0'; // 床は白
                    let alpha = 1.0;
                    
                    // 色名セルは少し透明感（アルファ0.8）
                    if (cell===0) {
                        color = '#f0f0f0'; // 白い床
                    } else if (cell===1) {
                        color = 'rgba(106, 200, 255, 0.8)'; // 水色
                    } else if (cell===2) {
                        color = 'rgba(180, 190, 200, 0.8)'; // 灰色
                    } else if (cell===3) {
                        color = 'rgba(176, 122, 208, 0.8)'; // 紫
                    } else if (cell===4) {
                        color = 'rgba(216, 74, 74, 0.8)'; // 赤
                    } else if (cell===5) {
                        color = 'rgba(154, 122, 90, 0.8)'; // 茶
                    } else if (cell===6) {
                        color = 'rgba(240, 160, 176, 0.8)'; // ピンク
                    } else if (cell===7) {
                        color = 'rgba(224, 144, 64, 0.8)'; // 橙
                    } else if (cell===8) {
                        color = '#2a2a2a'; // 黒は不透明
                    } else if (cell===9) {
                        color = 'rgba(90, 170, 90, 0.8)'; // 緑
                    } else if (cell===10) {
                        color = 'rgba(74, 138, 208, 0.8)'; // 青
                    }
                    
                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, CELL, CELL);
                    ctx.strokeStyle = 'rgba(42, 58, 74, 0.3)';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, CELL, CELL);
                }
            }
            
            // ユニット描画
            for (let u of units) {
                if (!u.alive) continue;
                const x = OFFSET_X + u.x*CELL + 4;
                const y = OFFSET_Y + u.y*CELL + 4;
                ctx.font = 'bold 22px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let label = '';
                if (u.type==='トランプ') label='ト';
                else if (u.type==='ユダヤ') label='ユ';
                else if (u.type==='オイル') label='オ';
                else if (u.type==='イーロンマスク') label='マ';
                else if (u.type==='イラン') label='イ';
                else if (u.type==='ホルムズ') label='ホ';
                else if (u.type==='ハマス') label='ハ';
                else if (u.type==='キムジョウン') label='キ';
                ctx.fillStyle = (u.owner==='player') ? '#b0e0ff' : '#ffb0a0';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 6;
                ctx.fillText(label, x+14, y+16);
                ctx.shadowBlur = 0;
                
                // HPバー
                const hpPct = u.hp/u.maxHp;
                ctx.fillStyle = 'rgba(34,34,34,0.8)';
                ctx.fillRect(x, y-4, 24, 4);
                ctx.fillStyle = hpPct>0.5 ? '#66ff66' : '#ff6666';
                ctx.fillRect(x, y-4, 24*hpPct, 4);
            }
            
            // タワーHP表示
            ctx.font = 'bold 14px sans-serif';
            ctx.fillStyle = '#d0e0f0';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText('P-King '+playerKingHP, 20, 30);
            ctx.fillText('C-King '+cpuKingHP, 680, 30);
            ctx.shadowBlur = 0;
        }

        function updateUI() {
            const pct = (elixir/maxElixir)*100;
            elixirFill.style.width = pct+'%';
            elixirText.textContent = Math.floor(elixir);
            
            handContainer.innerHTML = '';
            for (let card of playerHand) {
                const div = document.createElement('div');
                div.className = 'card' + (canSpawn(card) && !gameOver ? '' : ' disabled');
                div.innerHTML = `${card} <span class="cost">${getCost(card)}</span>`;
                if (canSpawn(card) && !gameOver) {
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        spawnUnit(card, 'player');
                        updateUI();
                    });
                }
                handContainer.appendChild(div);
            }
            playerKingHpEl.textContent = playerKingHP;
            cpuKingHpEl.textContent = cpuKingHP;
        }

        // ---- リセット ----
        function resetGame() {
            units = [];
            playerDeck = ['トランプ','ユダヤ','オイル','イーロンマスク','トランプ','ユダヤ','オイル','イーロンマスク'];
            cpuDeck = ['イラン','ホルムズ','ハマス','キムジョウン','イラン','ホルムズ','ハマス','キムジョウン'];
            playerKingHP = 100; cpuKingHP = 100;
            playerPrinceHP = [100,100]; cpuPrinceHP = [100,100];
            elixir = 6; elixirTimer = 0;
            gameOver = false; winner = null;
            winOverlay.classList.remove('show');
            shuffleArray(playerDeck);
            shuffleArray(cpuDeck);
            initHands();
            updateUI();
        }

        // ---- ゲームループ ----
        let lastTime=0;
        function gameLoop(time) {
            lastTime = time;
            if (!gameOver) {
                updateGame();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---- 初期化 ----
        function init() {
            resetGame();
            setTimeout(() => {
                if (!gameOver) {
                    for (let i=0; i<2; i++) {
                        const available = cpuHand.filter(c => canSpawn(c));
                        if (available.length>0) {
                            const card = available[Math.floor(Math.random()*available.length)];
                            spawnUnit(card, 'cpu');
                        }
                    }
                    updateUI();
                }
            }, 500);
            document.getElementById('resetButton').addEventListener('click', resetGame);
            requestAnimationFrame(gameLoop);
        }

        init();
    })();
</script>
</body>
</html>
