// ---- カテゴリ順序 ----
const CATEGORIES = ['基本', '戦術', '特殊', '変則', 'ギミック', 'コンセプト', '超常', 'オリジナル'];

// ---- ユニットクラス（全特殊能力実装済み） ----
class Unit {
  constructor(x, y, typeKey, team) {
    const def = UNIT_TYPES[typeKey];
    if (!def) throw new Error(`Unknown unit type: ${typeKey}`);
    
    this.typeKey = typeKey;
    this.team = team;
    this.x = x;
    this.y = y;
    this.hp = def.hp;
    this.maxHp = def.hp;
    this.attack = def.attack;
    this.range = def.range;
    this.speed = def.speed;
    this.size = def.size;
    this.attackSpeed = def.attackSpeed;
    this.cost = def.cost;
    this.icon = def.icon;
    this.bgColor = def.bgColor || null;
    this.alive = true;
    this.attackCooldown = 0;
    this.target = null;
    
    // 特殊フラグ（全51種対応）
    this.isHealer = (typeKey === 'healer');
    this.isStealth = (typeKey === 'stealth');
    this.isRevealed = false;
    this.isFrozen = false;
    this.frozenTimer = 0;
    this.hasExploded = false;
    this.growTimer = 0;
    this.chargeSpeed = this.speed;
    this.cloneTimer = 0;
    this.hasCloned = false;
    this.reviveCount = 0;
    this.maxRevive = (typeKey === 'phoenix') ? 1 : 0;
    this.isPhoenix = (typeKey === 'phoenix');
    this.isCopycat = (typeKey === 'copycat');
    this.copiedType = null;
    this.isBackup = (typeKey === 'backup');
    this.backupTimer = 300;
    this.isSpawned = (typeKey !== 'backup');
    this.isNest = (typeKey === 'nest');
    this.nestSpawnTimer = 0;
    this.nestSpawnCount = 0;
    this.maxNestSpawns = 3;
    this.isTreasure = (typeKey === 'treasure');
    this.treasureTimer = 600;
    this.isDecay = (typeKey === 'decay');
    this.decayTimer = 0;
    this.isReflector = (typeKey === 'reflector');
    this.isGrenade = (typeKey === 'grenade');
    this.hasDetonated = false;
    this.isGambler = (typeKey === 'gambler');
    this.isTrader = (typeKey === 'trader');
    this.hasTraded = false;
    this.isSabotage = (typeKey === 'sabotage');
    this.sabotageTimer = 300;
    this.sabotageActive = false;
    this.isBouncer = (typeKey === 'bouncer');
    this.bounceCount = 0;
    this.maxBounces = 3;
    this.isDoppel = (typeKey === 'doppel');
    this.hasDoppeled = false;
    this.isChaos = (typeKey === 'chaos');
    this.chaosTransformed = false;
    
    // オリジナル用
    this.isTrump = (typeKey === 'trump');
    this.trumpWallCount = 0;
    this.trumpCooldown = 0;
    this.isJudah = (typeKey === 'judah');
    this.isOil = (typeKey === 'oil');
    this.isMusk = (typeKey === 'musk');
    this.hasMuskWarped = false;
    this.isIran = (typeKey === 'iran');
    this.isStrait = (typeKey === 'strait');
    this.isHamas = (typeKey === 'hamas');
    this.hamasTeleported = false;
    this.isKim = (typeKey === 'kim');
    this.kimExploded = false;
    this.isSwarm = (typeKey === 'swarm');
    this.isPoison = (typeKey === 'poison');
    this.poisonTimer = 0;
    this.isElectro = (typeKey === 'electro');
    this.isBerserker = (typeKey === 'berserker');
    this.isVampire = (typeKey === 'vampire');
    this.isGolem = (typeKey === 'golem');
    this.hasSplit = false;
    this.isMirage = (typeKey === 'mirage');
    this.isCharger = (typeKey === 'charger');
    this.isTreant = (typeKey === 'treant');
    this.isElf = (typeKey === 'elf');
    this.isBlackhole = (typeKey === 'blackhole');
    this.isTimewarp = (typeKey === 'timewarp');
    this.isTeleporter = (typeKey === 'teleporter');
    this.isShield = (typeKey === 'shield');
    this.hasShielded = false;
    this.isWind = (typeKey === 'wind');
    this.isJumper = (typeKey === 'jumper');
    this.isCounter = (typeKey === 'counter');
    this.isFreeze = (typeKey === 'freeze');
    this.isSniper = (typeKey === 'sniper');
    this.isNecromancer = (typeKey === 'necromancer');
    this.isSpeedster = (typeKey === 'speedster');
  }

  distanceTo(other) {
    return Math.hypot(this.x - other.x, this.y - other.y);
  }

  distanceToRect(rect) {
    const cx = Math.max(rect.x, Math.min(this.x, rect.x + rect.w));
    const cy = Math.max(rect.y, Math.min(this.y, rect.y + rect.h));
    return Math.hypot(this.x - cx, this.y - cy);
  }

  findTarget(units) {
    let closest = null;
    let closestDist = Infinity;

    for (let u of units) {
      if (u === this || !u.alive || u.team === this.team) continue;
      if (u.isStealth && !u.isRevealed) continue;
      if (u.isBackup && !u.isSpawned) continue;
      const d = this.distanceTo(u);
      if (d < closestDist) {
        closestDist = d;
        closest = u;
      }
    }

    const enemyTower = this.team === 'player' ? cpuTower : playerTower;
    const dTower = this.distanceToRect(enemyTower);
    if (dTower < closestDist) {
      closestDist = dTower;
      closest = enemyTower;
    }

    return closest;
  }

  performAttack(units) {
    // ---- 爆弾兵（自爆） ----
    if (this.typeKey === 'bomber' && !this.hasExploded) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          u.hp -= this.attack;
          if (u.hp <= 0) { u.alive = false; u.hp = 0; }
        }
      }
      const enemyTower = this.team === 'player' ? cpuTower : playerTower;
      if (this.distanceToRect(enemyTower) <= this.range) {
        enemyTower.hp -= this.attack;
        if (enemyTower.hp < 0) enemyTower.hp = 0;
      }
      this.alive = false;
      this.hasExploded = true;
      addEffect(this.x, this.y, '💥', 30);
      return;
    }

    // ---- キム・ジョンウン（核爆発） ----
    if (this.typeKey === 'kim' && !this.kimExploded) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          u.hp -= this.attack;
          if (u.hp <= 0) { u.alive = false; u.hp = 0; }
        }
      }
      const enemyTower = this.team === 'player' ? cpuTower : playerTower;
      if (this.distanceToRect(enemyTower) <= this.range) {
        enemyTower.hp -= 30;
        if (enemyTower.hp < 0) enemyTower.hp = 0;
      }
      this.alive = false;
      this.kimExploded = true;
      addEffect(this.x, this.y, '☢️', 60);
      msgDiv.innerText = '💥 核爆発！';
      return;
    }

    // ---- イラン（範囲攻撃） ----
    if (this.typeKey === 'iran') {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) <= 50) {
          u.hp -= this.attack;
          if (u.hp <= 0) { u.alive = false; u.hp = 0; }
        }
      }
      const enemyTower = this.team === 'player' ? cpuTower : playerTower;
      if (this.distanceToRect(enemyTower) <= 50) {
        enemyTower.hp -= this.attack;
        if (enemyTower.hp < 0) enemyTower.hp = 0;
      }
      addEffect(this.x, this.y, '💥', 20);
      this.attackCooldown = this.attackSpeed;
      return;
    }

    // ---- 魔法使い（範囲攻撃） ----
    if (this.typeKey === 'mage') {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) <= 50) {
          u.hp -= this.attack;
          if (u.hp <= 0) { u.alive = false; u.hp = 0; }
        }
      }
      const enemyTower = this.team === 'player' ? cpuTower : playerTower;
      if (this.distanceToRect(enemyTower) <= 50) {
        enemyTower.hp -= this.attack * 0.5;
        if (enemyTower.hp < 0) enemyTower.hp = 0;
      }
      addEffect(this.x, this.y, '✨', 15);
      this.attackCooldown = this.attackSpeed;
      return;
    }

    // ---- バンパイア（吸血） ----
    if (this.typeKey === 'vampire') {
      let damage = this.attack;
      if (this.target.hp !== undefined) {
        this.target.hp -= damage;
        if (this.target.hp <= 0) { this.target.alive = false; this.target.hp = 0; }
        this.hp = Math.min(this.maxHp, this.hp + damage * 0.5);
      } else {
        this.target.hp -= damage;
        if (this.target.hp < 0) this.target.hp = 0;
        this.hp = Math.min(this.maxHp, this.hp + damage * 0.3);
      }
      addEffect(this.x, this.y, '🩸', 10);
      this.attackCooldown = this.attackSpeed;
      return;
    }

    // ---- バウンサー（跳ね返り） ----
    if (this.typeKey === 'bouncer' && this.bounceCount < this.maxBounces) {
      let hitTarget = this.target;
      if (hitTarget.hp !== undefined) {
        hitTarget.hp -= this.attack;
        if (hitTarget.hp <= 0) { hitTarget.alive = false; hitTarget.hp = 0; }
        this.bounceCount++;
        let nextTarget = null;
        let minDist = Infinity;
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (u === hitTarget) continue;
          const d = this.distanceTo(u);
          if (d < minDist) {
            minDist = d;
            nextTarget = u;
          }
        }
        if (nextTarget && this.bounceCount < this.maxBounces) {
          this.target = nextTarget;
          this.attackCooldown = 5;
        }
      } else {
        hitTarget.hp -= this.attack;
        if (hitTarget.hp < 0) hitTarget.hp = 0;
      }
      if (this.bounceCount >= this.maxBounces) {
        this.attackCooldown = this.attackSpeed;
      }
      return;
    }

    // ---- ギャンブラー（ランダムダメ） ----
    if (this.typeKey === 'gambler') {
      const damage = Math.floor(Math.random() * 30) + 1;
      if (this.target.hp !== undefined) {
        this.target.hp -= damage;
        if (this.target.hp <= 0) { this.target.alive = false; this.target.hp = 0; }
      } else {
        this.target.hp -= damage;
        if (this.target.hp < 0) this.target.hp = 0;
      }
      this.attackCooldown = this.attackSpeed;
      return;
    }

    // ---- 通常攻撃 ----
    if (this.target.hp !== undefined) {
      this.target.hp -= this.attack;
      if (this.target.hp <= 0) {
        this.target.alive = false;
        this.target.hp = 0;
        // ---- ネクロマンサー（召喚） ----
        if (this.typeKey === 'necromancer') {
          const skeleton = new Unit(
            this.target.x + (Math.random() - 0.5) * 30,
            this.target.y + (Math.random() - 0.5) * 30,
            'melee',
            this.team
          );
          skeleton.hp = 12;
          skeleton.maxHp = 12;
          skeleton.attack = 5;
          skeleton.size = 12;
          skeleton.icon = '💀';
          skeleton.bgColor = null;
          units.push(skeleton);
          addEffect(this.target.x, this.target.y, '🧟', 15);
        }
      }
    } else {
      this.target.hp -= this.attack;
      if (this.target.hp < 0) this.target.hp = 0;
    }
    this.attackCooldown = this.attackSpeed;
  }

  // ---- update（全特殊能力対応） ----
  update(units) {
    if (!this.alive) return;
    
    // ---- 凍結 ----
    if (this.isFrozen) {
      this.frozenTimer--;
      if (this.frozenTimer <= 0) this.isFrozen = false;
      return;
    }
    
    // ---- バックアップ（遅延配置） ----
    if (this.isBackup && !this.isSpawned) {
      this.backupTimer--;
      if (this.backupTimer <= 0) {
        this.isSpawned = true;
        this.speed = UNIT_TYPES[this.typeKey]?.speed || 0.8;
        this.alive = true;
        addEffect(this.x, this.y, '⏰', 20);
      }
      return;
    }
    
    // ---- トレジャー（エリクサー獲得） ----
    if (this.isTreasure) {
      this.treasureTimer--;
      if (this.treasureTimer <= 0 && this.alive) {
        if (this.team === 'player') {
          playerCost = Math.min(MAX_COST, playerCost + 5);
          updateCostDisplay();
        }
        this.alive = false;
        addEffect(this.x, this.y, '💰', 20);
        msgDiv.innerText = '💰 +5エリクサー！';
      }
      return;
    }
    
    // ---- ディケイ（タワー継続ダメ） ----
    if (this.isDecay) {
      this.decayTimer++;
      if (this.decayTimer % 10 === 0) {
        const enemyTower = this.team === 'player' ? cpuTower : playerTower;
        if (this.distanceToRect(enemyTower) < this.range + 40) {
          enemyTower.hp -= 3;
          if (enemyTower.hp < 0) enemyTower.hp = 0;
          addEffect(enemyTower.x + enemyTower.w/2, enemyTower.y + enemyTower.h/2, '🧪', 10);
        }
      }
      return;
    }
    
    // ---- ネスト（自動生成） ----
    if (this.isNest) {
      this.nestSpawnTimer++;
      if (this.nestSpawnTimer >= 300 && this.nestSpawnCount < this.maxNestSpawns) {
        this.nestSpawnTimer = 0;
        this.nestSpawnCount++;
        const spawnUnit = new Unit(
          this.x + (Math.random() - 0.5) * 60,
          this.y + (Math.random() - 0.5) * 60,
          'melee',
          this.team
        );
        spawnUnit.hp = 15;
        spawnUnit.maxHp = 15;
        spawnUnit.attack = 4;
        spawnUnit.size = 12;
        spawnUnit.icon = '🐣';
        spawnUnit.bgColor = null;
        units.push(spawnUnit);
        addEffect(this.x, this.y, '🪹', 15);
      }
      return;
    }
    
    // ---- グレネード（地雷） ----
    if (this.isGrenade) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < this.range) {
          for (let target of units) {
            if (target === this || !target.alive || target.team === this.team) continue;
            if (this.distanceTo(target) < this.range) {
              target.hp -= this.attack;
              if (target.hp <= 0) { target.alive = false; target.hp = 0; }
            }
          }
          const enemyTower = this.team === 'player' ? cpuTower : playerTower;
          if (this.distanceToRect(enemyTower) < this.range) {
            enemyTower.hp -= this.attack;
            if (enemyTower.hp < 0) enemyTower.hp = 0;
          }
          this.alive = false;
          this.hasDetonated = true;
          addEffect(this.x, this.y, '💥', 25);
          break;
        }
      }
      return;
    }
    
    // ---- サボタージュ（エリクサー妨害） ----
    if (this.isSabotage) {
      if (!this.sabotageActive) {
        this.sabotageActive = true;
        this.sabotageTimer = 300;
        addEffect(this.x, this.y, '🛠️', 20);
      }
      this.sabotageTimer--;
      if (this.sabotageTimer <= 0) {
        this.alive = false;
      }
      // CPUのエリクサー回復を停止（フラグ制御）
      if (this.team === 'player' && this.sabotageActive) {
        // cpuCostの回復を抑制（cpuAction内で制御）
      }
      return;
    }
    
    // ---- フリーズ（凍結攻撃） ----
    if (this.typeKey === 'freeze') {
      this.attackCooldown = Math.max(0, this.attackCooldown - 1);
      if (this.attackCooldown === 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.isFrozen = true;
            u.frozenTimer = 60;
            addEffect(u.x, u.y, '❄️', 15);
          }
        }
        this.attackCooldown = 80;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- タイムワープ（加速） ----
    if (this.typeKey === 'timewarp') {
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          u.speed = Math.min(3.0, (u.speed || 1) * 1.02);
          u.attackSpeed = Math.max(10, (u.attackSpeed || 30) * 0.98);
        }
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- テレポーター（引き寄せ） ----
    if (this.typeKey === 'teleporter') {
      let closest = null;
      let minDist = Infinity;
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        const d = this.distanceTo(u);
        if (d < minDist) {
          minDist = d;
          closest = u;
        }
      }
      if (closest && minDist < this.range) {
        closest.x = this.x + (this.team === 'player' ? 40 : -40);
        closest.y = this.y + (Math.random() - 0.5) * 20;
        addEffect(closest.x, closest.y, '📡', 15);
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- シールド（無敵バリア） ----
    if (this.typeKey === 'shield' && !this.hasShielded) {
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          u.maxHp *= 1.5;
          u.hp = u.maxHp;
          addEffect(u.x, u.y, '🛡️', 20);
        }
      }
      this.hasShielded = true;
      this.alive = false;
      return;
    }
    
    // ---- コピーキャット（変身） ----
    if (this.isCopycat && !this.copiedType) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < 50) {
          this.copiedType = u.typeKey;
          const def = UNIT_TYPES[u.typeKey];
          if (def) {
            this.hp = def.hp;
            this.maxHp = def.hp;
            this.attack = def.attack;
            this.range = def.range;
            this.speed = def.speed;
            this.size = def.size;
            this.icon = def.icon;
            this.bgColor = def.bgColor || null;
            addEffect(this.x, this.y, '🐱', 15);
          }
          break;
        }
      }
    }
    
    // ---- ドッペルゲンガー（鏡像） ----
    if (this.isDoppel && !this.hasDoppeled) {
      const enemyUnits = units.filter(u => u.team !== this.team && u.alive);
      if (enemyUnits.length > 0) {
        const last = enemyUnits[enemyUnits.length - 1];
        const def = UNIT_TYPES[last.typeKey];
        if (def) {
          const clone = new Unit(
            this.x + (this.team === 'player' ? -50 : 50),
            this.y + (Math.random() - 0.5) * 30,
            last.typeKey,
            this.team
          );
          clone.hp = def.hp * 0.7;
          clone.maxHp = clone.hp;
          clone.attack = def.attack;
          clone.range = def.range;
          clone.speed = def.speed;
          clone.size = def.size;
          clone.icon = def.icon;
          clone.bgColor = def.bgColor || null;
          units.push(clone);
          this.hasDoppeled = true;
          addEffect(this.x, this.y, '👥', 20);
        }
      }
    }
    
    // ---- ポイズン（毒） ----
    if (this.typeKey === 'poison') {
      this.attackCooldown = Math.max(0, this.attackCooldown - 1);
      if (this.attackCooldown === 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.hp -= 4;
            if (u.hp <= 0) { u.alive = false; u.hp = 0; }
            addEffect(u.x, u.y, '☠️', 10);
          }
        }
        this.attackCooldown = 25;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- エレクトロ（麻痺） ----
    if (this.typeKey === 'electro') {
      this.attackCooldown = Math.max(0, this.attackCooldown - 1);
      if (this.attackCooldown === 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.attackSpeed = Math.max(10, (u.attackSpeed || 30) * 0.5);
            addEffect(u.x, u.y, '⚡', 10);
          }
        }
        this.attackCooldown = 35;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- トランプ（壁建設） ----
    if (this.isTrump) {
      this.trumpCooldown = Math.max(0, this.trumpCooldown - 1);
      if (this.trumpWallCount < 3 && this.trumpCooldown === 0) {
        const wall = new Unit(
          this.x + (this.team === 'player' ? 50 : -50),
          this.y + (Math.random() - 0.5) * 30,
          'wall',
          this.team
        );
        wall.hp = 80;
        wall.maxHp = 80;
        wall.size = 20;
        wall.icon = '🏛️';
        wall.bgColor = '#FFD700';
        units.push(wall);
        this.trumpWallCount++;
        this.trumpCooldown = 150;
        addEffect(this.x, this.y, '🇺🇸', 20);
        msgDiv.innerText = '🇺🇸 壁を建設！';
      }
    }
    
    // ---- ユダヤ（エリクサー加速） ----
    if (this.isJudah) {
      if (this.team === 'player') {
        playerCost = Math.min(MAX_COST, playerCost + 0.04);
        updateCostDisplay();
      } else {
        cpuCost = Math.min(CPU_MAX_COST, cpuCost + 0.04);
      }
    }
    
    // ---- オイル（移動速度低下） ----
    if (this.isOil) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) <= 80) {
          u.speed = Math.max(0.2, u.speed * 0.7);
          addEffect(u.x, u.y, '🛢️', 5);
        }
      }
    }
    
    // ---- イーロンマスク（ワープ） ----
    if (this.isMusk && !this.hasMuskWarped) {
      let closest = null;
      let minDist = Infinity;
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        const d = this.distanceTo(u);
        if (d < minDist) {
          minDist = d;
          closest = u;
        }
      }
      if (closest) {
        closest.x = this.team === 'player' ? 600 : 200;
        closest.y = 150 + Math.random() * 200;
        addEffect(closest.x, closest.y, '🚀', 25);
        msgDiv.innerText = '🚀 ワープ！';
        this.hasMuskWarped = true;
        this.alive = false;
      }
      return;
    }
    
    // ---- ホルムズ海峡（通過ブロック） ----
    if (this.isStrait) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (Math.abs(u.x - this.x) < 25 && Math.abs(u.y - this.y) < 120) {
          if (u.team === 'player' && this.team === 'cpu') {
            u.x -= 1.5;
          } else if (u.team === 'cpu' && this.team === 'player') {
            u.x += 1.5;
          }
          u.x = Math.max(20, Math.min(780, u.x));
        }
      }
      return;
    }
    
    // ---- ハマス（敵陣後方ワープ） ----
    if (this.isHamas && !this.hamasTeleported) {
      this.hamasTeleported = true;
      this.x = this.team === 'player' ? 700 + Math.random() * 50 : 50 - Math.random() * 30;
      this.y = 80 + Math.random() * 340;
      addEffect(this.x, this.y, '🟢', 25);
      msgDiv.innerText = '🟢 ハマスがワープ！';
    }
    
    // ---- チャージャー（加速） ----
    if (this.isCharger) {
      this.chargeSpeed = Math.min(3.0, (this.chargeSpeed || 1.0) + 0.008);
      this.speed = this.chargeSpeed;
    }
    
    // ---- トレント（成長） ----
    if (this.isTreant) {
      this.growTimer = (this.growTimer || 0) + 1;
      if (this.growTimer % 60 === 0 && this.growTimer < 1800) {
        this.hp = Math.min(130, this.hp + 4);
        this.maxHp = this.hp;
        this.attack = Math.min(22, this.attack + 0.7);
        this.size = Math.min(40, this.size + 0.5);
        this.speed = Math.max(0.5, this.speed - 0.005);
        addEffect(this.x, this.y, '🌳', 10);
      }
    }
    
    // ---- エルフ（攻撃力強化） ----
    if (this.isElf) {
      for (let u of units) {
        if (u === this || !u.alive || u.team !== this.team) continue;
        if (this.distanceTo(u) <= this.range) {
          u.attack = (u.attack || 5) * 1.2;
          addEffect(u.x, u.y, '🧝', 8);
        }
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- ブラックホール（吸引） ----
    if (this.isBlackhole) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < this.range) {
          const dx = this.x - u.x;
          const dy = this.y - u.y;
          const len = Math.hypot(dx, dy);
          if (len > 1) {
            u.x += (dx / len) * 0.8;
            u.y += (dy / len) * 0.8;
            u.hp -= 1;
            if (u.hp <= 0) { u.alive = false; u.hp = 0; }
          }
        }
      }
      addEffect(this.x, this.y, '🕳️', 5);
      return;
    }
    
    // ---- リフレクター（反射壁）- ----
    if (this.isReflector) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (this.distanceTo(u) < 60) {
          u.hp -= 3;
          if (u.hp <= 0) { u.alive = false; u.hp = 0; }
          addEffect(u.x, u.y, '🪞', 8);
        }
      }
      return;
    }
    
    // ---- フェニックス（復活） ----
    if (this.isPhoenix && !this.alive && this.reviveCount < this.maxRevive) {
      this.reviveCount++;
      this.alive = true;
      this.hp = this.maxHp;
      addEffect(this.x, this.y, '🔥', 40);
      msgDiv.innerText = '🔥 フェニックス復活！';
      return;
    }
    
    // ---- カオス（変身） ----
    if (this.isChaos && !this.chaosTransformed) {
      const keys = Object.keys(UNIT_TYPES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const def = UNIT_TYPES[randomKey];
      if (def) {
        this.typeKey = randomKey;
        this.hp = def.hp;
        this.maxHp = def.hp;
        this.attack = def.attack;
        this.range = def.range;
        this.speed = def.speed;
        this.size = def.size;
        this.attackSpeed = def.attackSpeed;
        this.icon = def.icon;
        this.bgColor = def.bgColor || null;
        this.chaosTransformed = true;
        addEffect(this.x, this.y, '🌪️', 25);
        msgDiv.innerText = `🌪️ カオス → ${def.name}！`;
      }
    }
    
    // ---- ウィンド（吹き飛ばし） ----
    if (this.isWind) {
      this.attackCooldown = Math.max(0, this.attackCooldown - 1);
      if (this.attackCooldown === 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.x += (this.team === 'player' ? 1 : -1) * 60;
            u.y += (Math.random() - 0.5) * 40;
            u.x = Math.max(20, Math.min(780, u.x));
            u.y = Math.max(20, Math.min(480, u.y));
            addEffect(u.x, u.y, '🌪️', 10);
          }
        }
        this.attackCooldown = 50;
      }
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    // ---- ジャンプ兵（飛び越え） ----
    if (this.isJumper) {
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        if (Math.abs(u.x - this.x) < 30 && Math.abs(u.y - this.y) < 30) {
          this.x += (this.team === 'player' ? 80 : -80);
          this.y += (Math.random() - 0.5) * 40;
          this.x = Math.max(20, Math.min(780, this.x));
          this.y = Math.max(20, Math.min(480, this.y));
          addEffect(this.x, this.y, '🦘', 15);
          break;
        }
      }
    }
    
    // ---- カウンター（反射） ----
    if (this.isCounter) {
      if (this.attackCooldown === 0) {
        for (let u of units) {
          if (u === this || !u.alive || u.team === this.team) continue;
          if (this.distanceTo(u) <= this.range) {
            u.hp -= this.attack;
            if (u.hp <= 0) { u.alive = false; u.hp = 0; }
            addEffect(u.x, u.y, '🔄', 10);
          }
        }
        this.attackCooldown = this.attackSpeed;
      }
    }
    
    // ---- バーサーカー（HP減少で強化） ----
    if (this.isBerserker) {
      const hpRatio = this.hp / this.maxHp;
      if (hpRatio < 0.3) {
        this.attack = 22;
        this.speed = 1.6;
      } else if (hpRatio < 0.6) {
        this.attack = 15;
        this.speed = 1.4;
      }
    }
    
    // ---- ゴーレム（分裂） ----
    if (this.isGolem && !this.alive && !this.hasSplit) {
      this.hasSplit = true;
      for (let i = 0; i < 2; i++) {
        const mini = new Unit(
          this.x + (i === 0 ? -25 : 25),
          this.y + (i === 0 ? -20 : 20),
          'melee',
          this.team
        );
        mini.hp = 30;
        mini.maxHp = 30;
        mini.attack = 5;
        mini.size = 14;
        mini.icon = '🪨';
        mini.bgColor = null;
        units.push(mini);
        addEffect(mini.x, mini.y, '🪨', 15);
      }
    }
    
    // ---- ミラージュ（分身） ----
    if (this.isMirage && !this.hasCloned) {
      this.cloneTimer = (this.cloneTimer || 0) + 1;
      if (this.cloneTimer >= 300) {
        this.hasCloned = true;
        const clone = new Unit(
          this.x + (Math.random() - 0.5) * 40,
          this.y + (Math.random() - 0.5) * 40,
          'melee',
          this.team
        );
        clone.hp = this.hp * 0.5;
        clone.maxHp = clone.hp;
        clone.attack = this.attack * 0.7;
        clone.size = this.size * 0.7;
        clone.icon = '🌀';
        clone.bgColor = null;
        units.push(clone);
        addEffect(this.x, this.y, '🌀', 20);
      }
    }
    
    // ---- トレーダー（交換） ----
    if (this.isTrader && !this.hasTraded) {
      let closest = null;
      let minDist = Infinity;
      for (let u of units) {
        if (u === this || !u.alive || u.team === this.team) continue;
        const d = this.distanceTo(u);
        if (d < minDist) {
          minDist = d;
          closest = u;
        }
      }
      if (closest && minDist < 100) {
        const tempX = this.x;
        const tempY = this.y;
        this.x = closest.x;
        this.y = closest.y;
        closest.x = tempX;
        closest.y = tempY;
        this.hasTraded = true;
        addEffect(this.x, this.y, '🔄', 25);
        addEffect(closest.x, closest.y, '🔄', 25);
        msgDiv.innerText = '🔄 位置交換！';
      }
    }
    
    // ---- スワーム（大群） ----
    if (this.isSwarm) {
      // 既に5体で出現しているので特別な処理なし
    }
    
    // ---- スピードスター ----
    if (this.isSpeedster) {
      // 基本ステータスで高速移動
    }
    
    // ---- スナイパー ----
    if (this.isSniper) {
      // 基本ステータスで長距離攻撃
    }
    
    // ---- ここから通常の移動・攻撃処理 ----
    if (this.attackCooldown > 0) this.attackCooldown--;
    
    // ヒーラーは既にreturn済み
    // 壁は既にreturn済み
    // 爆弾兵は既にreturn済み
    
    this.target = this.findTarget(units);
    
    if (!this.target) {
      this.x += (this.team === 'player' ? 1 : -1) * this.speed;
      this.x = Math.max(20, Math.min(780, this.x));
      this.y = Math.max(20, Math.min(480, this.y));
      return;
    }
    
    let dist;
    if (this.target.hp !== undefined) {
      dist = this.distanceTo(this.target);
    } else {
      dist = this.distanceToRect(this.target);
    }
    
    if (dist <= this.range) {
      if (this.attackCooldown === 0) {
        this.performAttack(units);
        this.attackCooldown = this.attackSpeed;
      }
    } else {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const len = Math.hypot(dx, dy);
      if (len > 1) {
        this.x += (dx / len) * this.speed;
        this.y += (dy / len) * this.speed;
      }
    }
    
    this.x = Math.max(20, Math.min(780, this.x));
    this.y = Math.max(20, Math.min(480, this.y));
  }

  // ---- 描画 ----
  draw(ctx) {
    if (!this.alive) return;
    if (this.isBackup && !this.isSpawned) {
      ctx.globalAlpha = 0.2;
    }
    
    // 背景色（オリジナル）
    if (this.bgColor) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size + 5, 0, Math.PI * 2);
      ctx.fillStyle = this.bgColor;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // ステルス
    if (this.isStealth && !this.isRevealed) {
      ctx.globalAlpha = 0.2;
    }
    
    // 本体
    const color = this.team === 'player' ? '#3498db' : '#e74c3c';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // アイコン
    ctx.fillStyle = 'white';
    ctx.font = `${Math.min(20, this.size + 4)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.icon || '❓', this.x, this.y - 1);
    
    // HPバー
    const barW = Math.min(36, this.size * 2.2);
    const barH = 4;
    const hpRatio = Math.max(0, this.hp / this.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(this.x - barW/2, this.y - this.size - 8, barW, barH);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(this.x - barW/2, this.y - this.size - 8, barW * hpRatio, barH);
    
    ctx.globalAlpha = 1.0;
    
    // 凍結エフェクト
    if (this.isFrozen) {
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0, 212, 255, 0.1)';
      ctx.fill();
    }
  }
}

// ---- エフェクト ----
function addEffect(x, y, text, duration) {
  effects.push({ x, y, text, duration, timer: 0 });
}

function updateEffects() {
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].timer++;
    if (effects[i].timer >= effects[i].duration) {
      effects.splice(i, 1);
    }
  }
}

function drawEffects(ctx) {
  for (let e of effects) {
    const alpha = 1 - (e.timer / e.duration);
    const scale = 1 + (e.timer / e.duration) * 0.5;
    ctx.globalAlpha = alpha;
    ctx.font = `${24 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(e.text, e.x, e.y - e.timer * 0.5);
  }
  ctx.globalAlpha = 1.0;
}

// ---- コスト表示 ----
function updateCostDisplay() {
  costSpan.textContent = Math.floor(playerCost);
}

// ---- CPU行動（戦略的） ----
function cpuAction() {
  if (gameOver) return;
  
  // サボタージュ中は回復停止
  let saboteurActive = false;
  for (let u of units) {
    if (u.isSabotage && u.alive && u.team === 'player') {
      saboteurActive = true;
      break;
    }
  }
  if (!saboteurActive) {
    cpuCost = Math.min(CPU_MAX_COST, cpuCost + 0.035 * cpuDifficulty);
  }
  
  if (cpuCost < 3) return;
  if (Math.random() > 0.045 * cpuDifficulty) return;
  
  // 戦略的選択：状況に応じてユニットを選ぶ
  const available = [];
  const keys = Object.keys(UNIT_TYPES);
  for (let k of keys) {
    const def = UNIT_TYPES[k];
    if (def.cost <= cpuCost) {
      // タワーが減ってきたら攻撃重視
      let priority = 1;
      if (playerTower.hp < 40 && (k === 'charger' || k === 'speedster' || k === 'kim')) {
        priority = 5;
      }
      if (cpuTower.hp < 40 && (k === 'tank' || k === 'wall' || k === 'healer')) {
        priority = 5;
      }
      // 自軍ユニットが多いほどヒーラー優先
      const allyCount = units.filter(u => u.team === 'cpu' && u.alive).length;
      if (allyCount > 3 && k === 'healer') {
        priority += 3;
      }
      // 敵が密集してたら範囲攻撃優先
      const enemyCount = units.filter(u => u.team === 'player' && u.alive).length;
      if (enemyCount > 4 && (k === 'mage' || k === 'bomber' || k === 'kim')) {
        priority += 3;
      }
      available.push({ key: k, priority });
    }
  }
  
  if (available.length === 0) return;
  
  // 優先度の高いものを選択
  let totalPriority = 0;
  for (let a of available) totalPriority += a.priority;
  let rand = Math.random() * totalPriority;
  let chosen = available[0];
  for (let a of available) {
    rand -= a.priority;
    if (rand <= 0) { chosen = a; break; }
  }
  
  const key = chosen.key;
  const def = UNIT_TYPES[key];
  cpuCost -= def.cost;
  
  // スワームは5体同時
  if (key === 'swarm') {
    for (let i = 0; i < 5; i++) {
      const y = 60 + Math.random() * 380;
      const unit = new Unit(700 + Math.random() * 30, y, 'swarm', 'cpu');
      units.push(unit);
    }
  } else {
    const y = 60 + Math.random() * 380;
    const unit = new Unit(700 + Math.random() * 20, y, key, 'cpu');
    units.push(unit);
  }
}

// ---- リセット ----
function resetGame() {
  gameOver = false;
  winner = null;
  playerTower.hp = playerTower.maxHp;
  cpuTower.hp = cpuTower.maxHp;
  units = [];
  effects = [];
  playerCost = 10;
  cpuCost = 10;
  cpuTimer = 0;
  selectedUnitType = null;
  isDragging = false;
  previewUnit = null;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
  msgDiv.innerText = '⚔️ ユニットを選んでドラッグ';
  updateCostDisplay();
}

// ---- 更新ループ ----
function update() {
  frameCount++;
  if (gameOver) return;
  
  playerCost = Math.min(MAX_COST, playerCost + 0.035);
  updateCostDisplay();
  
  cpuTimer++;
  if (cpuTimer % 8 === 0) cpuAction();
  
  for (let u of units) {
    u.update(units);
  }
  units = units.filter(u => u.alive);
  
  updateEffects();
  
  if (cpuTower.hp <= 0) {
    gameOver = true;
    winner = 'player';
    msgDiv.innerText = '🎉 あなたの勝ち！';
  } else if (playerTower.hp <= 0) {
    gameOver = true;
    winner = 'cpu';
    msgDiv.innerText = '😵 CPUの勝ち...';
  }
}

// ---- 描画 ----
function draw() {
  ctx.clearRect(0, 0, 800, 500);
  
  // 中央線
  ctx.strokeStyle = '#4a6b3a';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 15]);
  ctx.beginPath();
  ctx.moveTo(400, 20);
  ctx.lineTo(400, 480);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // タワー
  function drawTower(tower, isPlayer) {
    const color = isPlayer ? '#2980b9' : '#c0392b';
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.fillRect(tower.x, tower.y, tower.w, tower.h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 3;
    ctx.strokeRect(tower.x, tower.y, tower.w, tower.h);
    const ratio = Math.max(0, tower.hp / tower.maxHp);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(tower.x, tower.y - 22, tower.w, 12);
    ctx.fillStyle = ratio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(tower.x, tower.y - 22, tower.w * ratio, 12);
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isPlayer ? '🔵' : '🔴', tower.x + tower.w/2, tower.y - 35);
    // HPテキスト
    ctx.fillStyle = 'white';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${Math.floor(tower.hp)}/${tower.maxHp}`, tower.x + tower.w/2, tower.y - 10);
  }
  drawTower(playerTower, true);
  drawTower(cpuTower, false);
  
  // ユニット
  for (let u of units) {
    u.draw(ctx);
  }
  
  // エフェクト
  drawEffects(ctx);
  
  // プレビュー
  if (isDragging && selectedUnitType && previewUnit) {
    ctx.globalAlpha = 0.5;
    const pu = new Unit(previewUnit.x, previewUnit.y, selectedUnitType, 'player');
    pu.draw(ctx);
    ctx.globalAlpha = 1.0;
  }
}

// ---- ゲームループ ----
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ---- UIボタン生成（カテゴリ別） ----
function createUnitButtons() {
  btnContainer.innerHTML = '';
  for (let cat of CATEGORIES) {
    const label = document.createElement('span');
    label.className = 'cat-label';
    label.textContent = cat;
    btnContainer.appendChild(label);
    
    const entries = Object.entries(UNIT_TYPES).filter(([k, def]) => def.cat === cat);
    for (let [key, def] of entries) {
      const btn = document.createElement('div');
      btn.className = 'unit-btn';
      if (def.bgColor) {
        const dot = document.createElement('span');
        dot.className = 'color-dot';
        dot.style.background = def.bgColor;
        btn.appendChild(dot);
      }
      const text = document.createElement('span');
      text.textContent = `${def.icon} ${def.name}`;
      btn.appendChild(text);
      const badge = document.createElement('span');
      badge.className = 'cost-badge';
      badge.textContent = `${def.cost}`;
      btn.appendChild(badge);
      btn.dataset.type = key;
      
      btn.addEventListener('click', () => {
        if (gameOver) return;
        if (playerCost < def.cost) {
          msgDiv.innerText = `⚠️ コストが足りません！ (${def.cost}必要)`;
          return;
        }
        if (selectedUnitType === key) {
          selectedUnitType = null;
          btn.classList.remove('selected');
          msgDiv.innerText = '⚔️ ユニットを選択してください';
        } else {
          document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
          selectedUnitType = key;
          btn.classList.add('selected');
          msgDiv.innerText = `👉 ${def.name}をドラッグして配置`;
        }
      });
      btnContainer.appendChild(btn);
    }
  }
}

// ---- マウスイベント ----
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', (e) => {
  if (gameOver) return;
  if (!selectedUnitType) {
    msgDiv.innerText = '⚠️ 先にユニットを選択してください';
    return;
  }
  const def = UNIT_TYPES[selectedUnitType];
  if (!def) return;
  if (playerCost < def.cost) {
    msgDiv.innerText = `⚠️ コストが足りません！ (${def.cost}必要)`;
    return;
  }
  const pos = getCanvasCoords(e);
  if (pos.x > 350) {
    msgDiv.innerText = '❌ 自陣側(左半分)に配置してください';
    return;
  }
  isDragging = true;
  previewUnit = { x: pos.x, y: pos.y };
  msgDiv.innerText = '📍 配置位置を決めてドロップ';
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDragging || !previewUnit) return;
  const pos = getCanvasCoords(e);
  previewUnit.x = Math.max(20, Math.min(350, pos.x));
  previewUnit.y = Math.max(20, Math.min(480, pos.y));
});

canvas.addEventListener('mouseup', (e) => {
  if (!isDragging || !selectedUnitType || !previewUnit) {
    isDragging = false;
    return;
  }
  const def = UNIT_TYPES[selectedUnitType];
  if (!def) return;
  if (playerCost < def.cost) {
    msgDiv.innerText = `⚠️ コストが足りません！ (${def.cost}必要)`;
    isDragging = false;
    previewUnit = null;
    return;
  }
  
  // スワームは5体同時
  if (selectedUnitType === 'swarm') {
    for (let i = 0; i < 5; i++) {
      const unit = new Unit(
        previewUnit.x + (Math.random() - 0.5) * 40,
        previewUnit.y + (Math.random() - 0.5) * 40,
        'swarm',
        'player'
      );
      units.push(unit);
    }
  } else {
    const unit = new Unit(previewUnit.x, previewUnit.y, selectedUnitType, 'player');
    units.push(unit);
  }
  
  playerCost -= def.cost;
  updateCostDisplay();
  msgDiv.innerText = `✅ ${def.name}を配置！`;
  isDragging = false;
  previewUnit = null;
  
  // 連続配置用に選択を維持
});

// ---- タッチ対応 ----
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const mouseEvent = new MouseEvent('mousedown', {
    clientX: touch.clientX,
    clientY: touch.clientY
  });
  canvas.dispatchEvent(mouseEvent);
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const mouseEvent = new MouseEvent('mousemove', {
    clientX: touch.clientX,
    clientY: touch.clientY
  });
  canvas.dispatchEvent(mouseEvent);
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  const mouseEvent = new MouseEvent('mouseup', {});
  canvas.dispatchEvent(mouseEvent);
});

// ---- リセット ----
document.getElementById('resetBtn').addEventListener('click', resetGame);

// ---- 難易度調整（キーボード） ----
document.addEventListener('keydown', (e) => {
  if (e.key === '1') { cpuDifficulty = 0.5; msgDiv.innerText = '🟢 難易度: イージー'; }
  if (e.key === '2') { cpuDifficulty = 1.0; msgDiv.innerText = '🟡 難易度: ノーマル'; }
  if (e.key === '3') { cpuDifficulty = 1.8; msgDiv.innerText = '🔴 難易度: ハード'; }
  if (e.key === '4') { cpuDifficulty = 3.0; msgDiv.innerText = '💀 難易度: インフェルノ'; }
});

// ---- 初期化 ----
createUnitButtons();
resetGame();
gameLoop();

// ---- リサイズ ----
function resizeCanvas() {
  const container = canvas.parentElement;
  const maxWidth = window.innerWidth - 40;
  const maxHeight = window.innerHeight - 280;
  let w = 800, h = 500;
  if (maxWidth < 800) {
    w = maxWidth;
    h = w * (500/800);
  }
  if (maxHeight < h) {
    h = maxHeight;
    w = h * (800/500);
  }
  canvas.style.width = Math.min(w, 800) + 'px';
  canvas.style.height = Math.min(h, 500) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
