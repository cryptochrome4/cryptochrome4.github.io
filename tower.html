<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タワーディフェンス - クラロワ風</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a2a1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .game-wrapper {
            background: #2d4a2a;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-bar {
            display: flex;
            width: 100%;
            justify-content: space-between;
            color: #f0e6b0;
            font-weight: bold;
            font-size: 18px;
            padding: 6px 12px;
            background: #1f3a1c;
            border-radius: 40px;
            margin-bottom: 8px;
            border: 1px solid #6a8a5a;
        }
        .elixir {
            background: #5b3f8a;
            padding: 0 18px;
            border-radius: 30px;
            color: #f5e9ff;
        }
        .canvas-wrap {
            background: #2b4d26;
            padding: 6px;
            border-radius: 20px;
            border: 2px solid #6f9360;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 880px;
            height: auto;
            background: #3f6a38;
            image-rendering: crisp-edges;
            border-radius: 14px;
            box-shadow: inset 0 0 0 2px #4b7642;
            cursor: pointer;
        }
        .hand-area {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            padding: 8px 16px;
            background: #1f3a1c;
            border-radius: 60px;
            border: 1px solid #6a8a5a;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 70px;
        }
        .card {
            background: #c9b382;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: bold;
            color: #1f2f1a;
            border: 2px solid #ac8b5a;
            box-shadow: 0 3px 0 #6b4f2a;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.1s;
            font-size: 14px;
            cursor: pointer;
        }
        .card:active {
            transform: scale(0.94);
        }
        .card .cost {
            background: #7f5bb0;
            color: white;
            border-radius: 30px;
            padding: 0 8px;
        }
        .card .name {
            min-width: 50px;
        }
        .card.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #d8d0b0;
            font-size: 14px;
            margin: 4px 0 2px;
            padding: 0 10px;
        }
        .status-msg {
            background: #1f2e1a;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #5b7a4a;
        }
        button {
            background: #7f5bb0;
            border: none;
            color: white;
            font-weight: bold;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 3px 0 #4d2f73;
            transition: 0.05s;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        @media (max-width: 700px) {
            .card { font-size: 11px; padding: 2px 8px; }
            .top-bar { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <div class="top-bar">
            <span>❤️ プレイヤー</span>
            <span class="elixir">⚡ エリクサー <span id="elixirDisplay">5</span>/10</span>
            <span>❤️ コンピュータ</span>
        </div>
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="792" height="363"></canvas>
        </div>
        <div class="info-panel">
            <span id="playerTowers">タワー: 100/100</span>
            <span class="status-msg" id="statusMsg">▶ カードを選択</span>
            <span id="cpuTowers">タワー: 100/100</span>
        </div>
        <div class="hand-area" id="handArea"></div>
        <div style="display: flex; gap: 16px; margin-top: 6px;">
            <button id="resetBtn">🔄 リセット</button>
        </div>
    </div>
</div>
<script>
    // ---------- ゲーム設定 ----------
    const COLS = 24, ROWS = 11;
    const CELL_W = 33, CELL_H = 33;

    // カード定義（プレイヤー用）
    const CARD_DEFS = {
        'トランプ': { id: 'trump', cost: 9, hp: 90, atk: 9, def: 2, speed: 2, side: 'left', count: 2, emoji: '👱' },
        'ユダヤ': { id: 'judah', cost: 6, hp: 60, atk: 4, def: 5, speed: 1, side: 'right', count: 2, emoji: '🧔' },
        'オイル': { id: 'oil', cost: 3, hp: 30, atk: 1, def: 2, speed: 0, side: 'both', count: 2, emoji: '🛢️' },
        'イーロンマスク': { id: 'elon', cost: 5, hp: 1, atk: 3, def: 0, speed: -1, side: 'bow', count: 2, emoji: '🚀' }
    };
    const CPU_CARD_DEFS = {
        'イラン': { id: 'iran', cost: 9, hp: 90, atk: 8, def: 4, speed: 2, side: 'right', count: 2, emoji: '🔥' },
        'ホルムズ': { id: 'hormuz', cost: 6, hp: 60, atk: 5, def: 2, speed: 1, side: 'left', count: 2, emoji: '🌊' },
        'ハマス': { id: 'hamas', cost: 3, hp: 30, atk: 2, def: 0, speed: 0, side: 'both', count: 2, emoji: '⚔️' },
        'キムジョウン': { id: 'kim', cost: 5, hp: 1, atk: 4, def: 0, speed: -1, side: 'bow_cpu', count: 2, emoji: '🏹' }
    };

    // ゲーム状態
    let game = {
        elixir: 5,
        maxElixir: 10,
        elixirTimer: 0,
        playerTowers: [100, 100, 100], // [左, キング, 右]
        cpuTowers: [100, 100, 100],
        units: [], // {x, y, hp, maxHp, atk, def, side, speed, isBow, owner, name, id, frame}
        projectiles: [],
        deck: [],
        hand: [],
        selectedCard: null,
        turn: 'player',
        gameOver: false,
        frame: 0,
        cpuCooldown: 0,
    };

    // 初期デッキ構築
    function buildDecks() {
        const pDeck = [];
        for (const [name, def] of Object.entries(CARD_DEFS)) {
            for (let i = 0; i < def.count; i++) pDeck.push({ ...def, name });
        }
        const cpuDeck = [];
        for (const [name, def] of Object.entries(CPU_CARD_DEFS)) {
            for (let i = 0; i < def.count; i++) cpuDeck.push({ ...def, name });
        }
        shuffle(pDeck);
        shuffle(cpuDeck);
        game.deck = pDeck;
        game.cpuDeck = cpuDeck;
        game.hand = pDeck.slice(0, 4);
        game.deck = pDeck.slice(4);
        game.cpuHand = cpuDeck.slice(0, 4);
        game.cpuDeck = cpuDeck.slice(4);
    }

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    // 描画関連
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // マップデータ（0=通路, 1=壁, 2=橋, 3=弓配置(紫), 4=弓配置(橙)）
    const map = Array(ROWS).fill().map(() => Array(COLS).fill(0));
    // 画像の配置を再現 (24x11)
    // 壁 (黒) : x=4~6, y=2~4 など / 簡易版として代表的な壁を設定
    function initMap() {
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) map[y][x] = 0;
        // 壁 (黒い部分)
        const walls = [[4,2],[5,2],[6,2],[4,3],[5,3],[6,3],[4,4],[5,4],[6,4],
                       [17,2],[18,2],[19,2],[17,3],[18,3],[19,3],[17,4],[18,4],[19,4]];
        walls.forEach(([x,y]) => { if (y<ROWS && x<COLS) map[y][x] = 1; });
        // 橋 (緑)
        const bridges = [[10,4],[11,4],[12,4],[13,4],[10,6],[11,6],[12,6],[13,6]];
        bridges.forEach(([x,y]) => { if (y<ROWS && x<COLS) map[y][x] = 2; });
        // 紫 (イーロンマスク配置) x=2,y=5 周辺
        map[5][2] = 3; map[5][3] = 3; map[5][4] = 3;
        // 橙 (キムジョウン配置) x=21,y=5 周辺
        map[5][19] = 4; map[5][20] = 4; map[5][21] = 4;
    }
    initMap();

    // ユニット生成ヘルパー
    function spawnUnit(owner, card, x, y) {
        const isBow = (card.side === 'bow' || card.side === 'bow_cpu');
        const unit = {
            x, y, hp: card.hp, maxHp: card.hp, atk: card.atk, def: card.def,
            speed: card.speed, side: card.side, isBow, owner, name: card.name,
            id: card.id, frame: 0, attackCooldown: 0, bowTarget: null
        };
        if (isBow) {
            unit.bowTarget = (owner === 'player') ? 'cpuKing' : 'playerKing';
            unit.x = (owner === 'player') ? 3 : 20;
            unit.y = 5;
        }
        game.units.push(unit);
        return unit;
    }

    // CPU の行動
    function cpuTurn() {
        if (game.gameOver) return;
        // 手札からランダムに選択
        const available = game.cpuHand.filter(c => c.cost <= game.elixir);
        if (available.length === 0) return;
        const card = available[Math.floor(Math.random() * available.length)];
        // 配置場所決定 (左/右/両方)
        const side = card.side;
        let positions = [];
        if (side === 'left') positions = [[2,5], [3,6], [1,4]];
        else if (side === 'right') positions = [[21,5], [20,6], [22,4]];
        else if (side === 'both') positions = [[2,5], [21,5], [3,6], [20,6]];
        else if (side === 'bow_cpu') positions = [[20,5]];
        else positions = [[2,5]];

        // 空きマスを探す
        for (const [px, py] of positions) {
            if (px < 0 || px >= COLS || py < 0 || py >= ROWS) continue;
            if (map[py][px] === 1) continue;
            const occupied = game.units.some(u => Math.floor(u.x) === px && Math.floor(u.y) === py && u.owner === 'cpu');
            if (!occupied) {
                // 召喚
                game.elixir -= card.cost;
                const idx = game.cpuHand.indexOf(card);
                if (idx > -1) game.cpuHand.splice(idx, 1);
                spawnUnit('cpu', card, px, py);
                // ドロー
                if (game.cpuDeck.length > 0) {
                    const drawn = game.cpuDeck.shift();
                    game.cpuHand.push(drawn);
                }
                return;
            }
        }
        // 配置できなければ何もしない
    }

    // ユニット移動・攻撃
    function updateUnits() {
        const units = game.units;
        for (let i = units.length - 1; i >= 0; i--) {
            const u = units[i];
            if (u.hp <= 0) { units.splice(i, 1); continue; }
            if (u.isBow) {
                // 弓攻撃
                u.attackCooldown = (u.attackCooldown || 0) - 1;
                if (u.attackCooldown <= 0) {
                    const target = (u.owner === 'player') ? 'cpuKing' : 'playerKing';
                    const towerIdx = (target === 'cpuKing') ? 1 : 1;
                    const hpArr = (u.owner === 'player') ? game.cpuTowers : game.playerTowers;
                    // 自滅判定
                    let selfDestruct = false;
                    if (u.id === 'elon' && Math.random() < 1/6) selfDestruct = true;
                    if (u.id === 'kim' && Math.random() < 1/5) selfDestruct = true;
                    if (selfDestruct) {
                        u.hp = 0;
                        units.splice(i, 1);
                        continue;
                    }
                    // 防御力適用 (確率)
                    let damage = u.atk;
                    // キングタワーに直接ダメージ
                    hpArr[1] = Math.max(0, hpArr[1] - damage);
                    u.attackCooldown = 20;
                    if (hpArr[1] <= 0) {
                        game.gameOver = true;
                        document.getElementById('statusMsg').textContent = (u.owner === 'player') ? '🏆 プレイヤー勝利!' : '💀 コンピュータ勝利!';
                    }
                }
                continue;
            }

            // 通常ユニット移動
            const speed = u.speed;
            let dx = 0, dy = 0;
            if (u.owner === 'player') {
                if (u.side === 'left') dx = 1;
                else if (u.side === 'right') dx = -1;
                else if (u.side === 'both') dx = (u.x < 12) ? 1 : -1;
            } else {
                if (u.side === 'left') dx = -1;
                else if (u.side === 'right') dx = 1;
                else if (u.side === 'both') dx = (u.x < 12) ? -1 : 1;
            }
            // 橋・壁判定
            const nx = u.x + dx * 0.2;
            const ny = u.y + dy * 0.2;
            const gx = Math.round(nx), gy = Math.round(ny);
            if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS && map[gy][gx] !== 1) {
                u.x = nx;
                u.y = ny;
            }
            // タワー攻撃
            const towerRange = 1.2;
            let targetTower = null;
            if (u.owner === 'player') {
                if (u.x > 20) targetTower = 'cpuRight';
                else if (u.x < 3) targetTower = 'cpuLeft';
            } else {
                if (u.x < 3) targetTower = 'playerLeft';
                else if (u.x > 20) targetTower = 'playerRight';
            }
            // 簡易攻撃
            if (targetTower) {
                const idx = (targetTower.includes('Left')) ? 0 : (targetTower.includes('Right')) ? 2 : 1;
                const hpArr = (u.owner === 'player') ? game.cpuTowers : game.playerTowers;
                if (hpArr[idx] > 0) {
                    // 防御力確率
                    let dmg = u.atk;
                    hpArr[idx] = Math.max(0, hpArr[idx] - dmg);
                    if (hpArr[idx] <= 0) {
                        // プリンスタワー破壊
                    }
                }
            }
            // 敵ユニットに攻撃
            for (const other of units) {
                if (other === u || other.owner === u.owner) continue;
                if (Math.abs(other.x - u.x) < 1.2 && Math.abs(other.y - u.y) < 1.2) {
                    let dmg = u.atk;
                    if (Math.random() < 0.5) dmg = Math.max(0, dmg - other.def);
                    other.hp -= dmg;
                    if (other.hp <= 0) {
                        // 撃破
                    }
                    break;
                }
            }
        }
    }

    // ゲームループ
    function gameLoop() {
        if (game.gameOver) return;
        game.frame++;
        // エリクサー回復
        if (game.elixir < game.maxElixir) {
            game.elixirTimer += 1;
            if (game.elixirTimer >= 30) {
                game.elixir = Math.min(game.maxElixir, game.elixir + 1);
                game.elixirTimer = 0;
            }
        }
        // CPU行動
        if (game.frame % 15 === 0) {
            cpuTurn();
        }
        // ユニット更新
        updateUnits();
        // 手札表示更新
        renderHand();
        render();
        document.getElementById('elixirDisplay').textContent = Math.floor(game.elixir);
        document.getElementById('playerTowers').textContent = `タワー: ${game.playerTowers[0]}/${game.playerTowers[1]}/${game.playerTowers[2]}`;
        document.getElementById('cpuTowers').textContent = `タワー: ${game.cpuTowers[0]}/${game.cpuTowers[1]}/${game.cpuTowers[2]}`;
        requestAnimationFrame(gameLoop);
    }

    // 描画
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // マップ描画
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const val = map[y][x];
                let color = '#3f6a38';
                if (val === 1) color = '#1a1a1a';
                else if (val === 2) color = '#3d9e3d';
                else if (val === 3) color = '#9b6bb0';
                else if (val === 4) color = '#d98c3a';
                ctx.fillStyle = color;
                ctx.fillRect(x * CELL_W, y * CELL_H, CELL_W, CELL_H);
                ctx.strokeStyle = '#2d552a';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(x * CELL_W, y * CELL_H, CELL_W, CELL_H);
            }
        }
        // ユニット描画
        for (const u of game.units) {
            const x = u.x * CELL_W, y = u.y * CELL_H;
            ctx.beginPath();
            ctx.arc(x + CELL_W/2, y + CELL_H/2, 12, 0, Math.PI*2);
            ctx.fillStyle = u.owner === 'player' ? '#4fc3f7' : '#f06292';
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(u.name[0], x + CELL_W/2, y + CELL_H/2 + 4);
            // HPバー
            ctx.fillStyle = '#333';
            ctx.fillRect(x+2, y-4, 28, 4);
            ctx.fillStyle = '#f44';
            ctx.fillRect(x+2, y-4, 28 * (u.hp/u.maxHp), 4);
        }
    }

    function renderHand() {
        const area = document.getElementById('handArea');
        area.innerHTML = '';
        for (let i = 0; i < game.hand.length; i++) {
            const card = game.hand[i];
            const div = document.createElement('div');
            div.className = 'card';
            if (card.cost > game.elixir || game.gameOver) div.classList.add('disabled');
            div.innerHTML = `<span class="name">${card.name}</span><span class="cost">${card.cost}</span>`;
            div.dataset.index = i;
            div.addEventListener('click', () => {
                if (game.gameOver) return;
                const idx = parseInt(div.dataset.index);
                const c = game.hand[idx];
                if (c.cost > game.elixir) return;
                // 配置フェーズ
                game.selectedCard = { card: c, index: idx };
                document.getElementById('statusMsg').textContent = `➡️ ${c.name} を配置 (クリック)`;
            });
            area.appendChild(div);
        }
        // キャンセル用
        canvas.onclick = (e) => {
            if (!game.selectedCard || game.gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            const gx = Math.floor(mx / CELL_W);
            const gy = Math.floor(my / CELL_H);
            if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return;
            if (map[gy][gx] === 1) return; // 壁
            // 配置可能か
            const card = game.selectedCard.card;
            const side = card.side;
            let ok = false;
            if (side === 'left' && gx < 8) ok = true;
            else if (side === 'right' && gx > 15) ok = true;
            else if (side === 'both') ok = true;
            else if (side === 'bow' && gx < 5 && gy >= 4 && gy <= 6) ok = true;
            if (!ok) return;
            // ユニット重複チェック
            const occupied = game.units.some(u => Math.floor(u.x) === gx && Math.floor(u.y) === gy);
            if (occupied) return;
            // 召喚
            const idx = game.selectedCard.index;
            const c = game.hand[idx];
            game.elixir -= c.cost;
            game.hand.splice(idx, 1);
            spawnUnit('player', c, gx, gy);
            // ドロー
            if (game.deck.length > 0) {
                const drawn = game.deck.shift();
                game.hand.push(drawn);
            }
            game.selectedCard = null;
            document.getElementById('statusMsg').textContent = '✅ 配置完了';
            renderHand();
        };
        // リセット
        document.getElementById('resetBtn').onclick = () => {
            game = { elixir: 5, maxElixir: 10, elixirTimer: 0, playerTowers: [100,100,100], cpuTowers: [100,100,100], units: [], deck: [], hand: [], selectedCard: null, gameOver: false, frame: 0, cpuCooldown: 0 };
            buildDecks();
            initMap();
            document.getElementById('statusMsg').textContent = '🔄 リセット';
            renderHand();
        };
    }

    // 初期化
    buildDecks();
    renderHand();
    gameLoop();
</script>
</body>
</html>
