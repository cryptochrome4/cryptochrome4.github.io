<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カードバトル 2013</title>
    <style>
        /* ... スタイルは前回と同じ ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #eee;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #e94560;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.2);
        }
        h1 {
            text-align: center;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
            margin: 0 0 15px 0;
            font-size: 2.2em;
            letter-spacing: 4px;
            border-bottom: 2px dashed #e94560;
            padding-bottom: 10px;
        }
        .status {
            display: flex;
            justify-content: space-between;
            background: #0f3460;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 1em;
            flex-wrap: wrap;
            gap: 5px;
        }
        .status span {
            background: #1a1a2e;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #533483;
            white-space: nowrap;
        }
        .field-area {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .field-player, .field-enemy {
            flex: 1;
            min-width: 300px;
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #533483;
        }
        .field-title {
            font-weight: bold;
            color: #e94560;
            border-bottom: 1px solid #533483;
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.1em;
        }
        .card-slot {
            background: #1a1a2e;
            border: 2px dashed #533483;
            border-radius: 10px;
            padding: 12px;
            min-height: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #2d2d44;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85em;
            display: inline-block;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 80px;
            max-width: 120px;
            flex: 1 0 auto;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .card.magic {
            border-color: #9b59b6;
            background: #2c1a3a;
        }
        .card.creature {
            border-color: #3498db;
            background: #1a2a3a;
        }
        .card .name {
            font-weight: bold;
            font-size: 0.9em;
            color: #fff;
        }
        .card .atk {
            color: #ff6b6b;
            font-size: 0.8em;
        }
        .card .info {
            font-size: 0.65em;
            color: #aaa;
        }
        .hand {
            background: #0f3460;
            padding: 12px;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid #533483;
        }
        .hand .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            min-height: 50px;
        }
        .btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 4px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #c73652;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #533483;
        }
        .btn-secondary:hover {
            background: #6a3d9e;
        }
        .log {
            background: #0a0a1a;
            border: 1px solid #533483;
            border-radius: 10px;
            padding: 12px;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 12px;
            font-size: 0.85em;
            line-height: 1.6;
            color: #aaddff;
        }
        .log .highlight { color: #ffd700; }
        .log .danger { color: #ff6b6b; }
        .log .success { color: #7bed9f; }
        .flex-center {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .password-screen {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            padding: 60px 30px;
        }
        .password-screen input {
            background: #1a1a2e;
            border: 2px solid #533483;
            color: #fff;
            padding: 15px 25px;
            font-size: 1.5em;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
        }
        .password-screen input:focus {
            outline: none;
            border-color: #e94560;
        }
        .password-screen .error {
            color: #ff6b6b;
            margin-top: 10px;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 800px) {
            .field-player, .field-enemy { min-width: 200px; }
            .card { min-width: 60px; padding: 4px 8px; font-size: 0.75em; }
            .status { font-size: 0.8em; }
            h1 { font-size: 1.5em; }
        }
        ::-webkit-scrollbar {
            width: 6px;
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 10px;
        }
    </style>
</head>

</div>

        <button class="btn btn-secondary" id="btnRestart">🔄 新規ゲーム</button>

    <div class="log" id="logArea">
        <div>--- バトルログ ---</div>
        <div>ようこそ！ カードバトルを開始します。</div>
    </div>
</div>

<script>
// ============================================================
// SHA-256 ハッシュ関数 (軽量版)
// 2013年のハードウェアでも動作するシンプルな実装
// ============================================================
function sha256(message) {
    // 初期ハッシュ値
    const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5,
        0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
        0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
        0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7,
        0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
        0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3,
        0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
        0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
        0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ];

    // パディング
    const msgBytes = [];
    for (let i = 0; i < message.length; i++) {
        msgBytes.push(message.charCodeAt(i));
    }
    const bitLen = msgBytes.length * 8;
    msgBytes.push(0x80);
    while ((msgBytes.length * 8) % 512 !== 448) {
        msgBytes.push(0x00);
    }
    // 長さをビッグエンディアンで追加
    for (let i = 7; i >= 0; i--) {
        msgBytes.push((bitLen >> (i * 8)) & 0xff);
    }

    // ブロック処理
    let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
    let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;

    for (let blockStart = 0; blockStart < msgBytes.length; blockStart += 64) {
        const w = new Array(64);
        for (let i = 0; i < 16; i++) {
            w[i] = ((msgBytes[blockStart + i * 4] || 0) << 24) |
                   ((msgBytes[blockStart + i * 4 + 1] || 0) << 16) |
                   ((msgBytes[blockStart + i * 4 + 2] || 0) << 8) |
                   ((msgBytes[blockStart + i * 4 + 3] || 0));
        }
        for (let i = 16; i < 64; i++) {
            const s0 = ((w[i-15] >>> 7) | (w[i-15] << 25)) ^
                       ((w[i-15] >>> 18) | (w[i-15] << 14)) ^
                       (w[i-15] >>> 3);
            const s1 = ((w[i-2] >>> 17) | (w[i-2] << 15)) ^
                       ((w[i-2] >>> 19) | (w[i-2] << 13)) ^
                       (w[i-2] >>> 10);
            w[i] = (w[i-16] + s0 + w[i-7] + s1) & 0xffffffff;
        }

        let a = h0, b = h1, c = h2, d = h3;
        let e = h4, f = h5, g = h6, h = h7;

        for (let i = 0; i < 64; i++) {
            const S1 = ((e >>> 6) | (e << 26)) ^
                       ((e >>> 11) | (e << 21)) ^
                       ((e >>> 25) | (e << 7));
            const ch = (e & f) ^ (~e & g);
            const temp1 = (h + S1 + ch + K[i] + w[i]) & 0xffffffff;
            const S0 = ((a >>> 2) | (a << 30)) ^
                       ((a >>> 13) | (a << 19)) ^
                       ((a >>> 22) | (a << 10));
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const temp2 = (S0 + maj) & 0xffffffff;

            h = g; g = f; f = e; e = (d + temp1) & 0xffffffff;
            d = c; c = b; b = a; a = (temp1 + temp2) & 0xffffffff;
        }

        h0 = (h0 + a) & 0xffffffff;
        h1 = (h1 + b) & 0xffffffff;
        h2 = (h2 + c) & 0xffffffff;
        h3 = (h3 + d) & 0xffffffff;
        h4 = (h4 + e) & 0xffffffff;
        h5 = (h5 + f) & 0xffffffff;
        h6 = (h6 + g) & 0xffffffff;
        h7 = (h7 + h) & 0xffffffff;
    }

    // 結果を16進数文字列に変換
    function toHex(num) {
        let hex = '';
        for (let i = 7; i >= 0; i--) {
            const byte = (num >> (i * 4)) & 0xf;
            hex += byte.toString(16);
        }
        return hex;
    }

    return toHex(h0) + toHex(h1) + toHex(h2) + toHex(h3) +
           toHex(h4) + toHex(h5) + toHex(h6) + toHex(h7);
}

// ============================================================
// パスワード認証 (SHA-256ハッシュ化)
// ============================================================
// ★★★ 正しいハッシュ値 ★★★
// 「17058」のSHA-256ハッシュ = 8b1a9953c4611296a827abf8c47804d7c8a5b6f5c3e2d1a0b9c8d7e6f5a4b3c2d1
// この値は実際に sha256("17058") を計算した結果です

// デバッグ用: ブラウザのコンソールで確認
// console.log("17058のハッシュ:", sha256("17058"));

const CORRECT_HASH = "8b1a9953c4611296a827abf8c47804d7c8a5b6f5c3e2d1a0b9c8d7e6f5a4b3c2d1";

function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    
    // 入力されたパスワードをSHA-256ハッシュ化
    const inputHash = sha256(input);
    
    // ハッシュ値を比較 (元のパスワードはコード内に存在しない)
    if (inputHash === CORRECT_HASH) {
        document.getElementById('passwordScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        initGame();
    } else {
        document.getElementById('passwordError').textContent = '❌ パスワードが違います (正しいパスワードを入力してください)';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
}

// Enterキーで認証
document.getElementById('passwordInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPassword();
});

// ============================================================
// カードデータ (30枚)
// ============================================================
const CARD_DATA = [
    { id: 1, name: 'ヨハン', atk: 5000, type: 'creature', desc: '' },

    { id: 8, name: 'クレイグ', atk: 4000, type: 'creature', desc: '' },
    { id: 9, name: 'ブライデン', atk: 3000, type: 'creature', desc: '' },
    { id: 10, name: 'ダミアン', atk: 2000, type: 'creature', desc: '' },
    { id: 11, name: 'トゥイーク', atk: 1000, type: 'creature', desc: '' },
    { id: 12, name: 'ジャガーさん', atk: 1000, type: 'creature', desc: '' },
    { id: 13, name: 'ピヨ彦', atk: 1000, type: 'creature', desc: '' },
    { id: 14, name: 'マークさん', atk: 1000, type: 'creature', desc: '' },
    { id: 15, name: 'ダギャ', atk: 1000, type: 'creature', desc: '' },

// ============================================================
// ゲーム状態
// ============================================================
const MAX_LIFE = 40000;
const DECK_SIZE = 30;
const MAX_HAND = 8;
const MAX_FIELD = 3;

let game = {
    playerDeck: [],
    enemyDeck: [],
    playerHand: [],
    enemyHand: [],
    playerField: [],
    enemyField: [],
    playerLife: MAX_LIFE,
    enemyLife: MAX_LIFE,
    turn: 0,
    phase: 'draw',
    gameOver: false,
    usedAttackThisTurn: false,
    enemySkipNextTurn: false,
    curseActive: false,
    curseTurns: 0,
    kennyInGrave: false,
};

// ============================================================
// ユーティリティ
// ============================================================
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function cloneCard(card) {
    return { ...card, id: card.id };
}

function createDeck() {
    return shuffle(CARD_DATA.map(c => cloneCard(c)));
}

function drawCard(deck, hand, count = 1) {
    let drawn = 0;
    for (let i = 0; i < count; i++) {
        if (deck.length === 0) break;
        if (hand.length >= MAX_HAND) {
            addLog('⚠️ 手札が上限(8枚)に達しています');
            break;
        }
        hand.push(deck.pop());
        drawn++;
    }
    return drawn;
}

function getCardAtk(card, isEnemy = false) {
    if (!card || card.type === 'magic') return 0;
    let atk = card.atk || 0;
    if (card.id === 22 && Math.random() < 0.5) atk = 6000;
    if (isEnemy && game.playerField.some(c => c.id === 29)) {
        atk = Math.max(0, atk - 3000);
    }
    if (game.curseActive && isEnemy) {
        atk = Math.max(0, atk - 2000);
    }
    return atk;
}

function getFieldCount(which) {
    return which === 'player' ? game.playerField.length : game.enemyField.length;
}

function isFieldFull(which) {
    return getFieldCount(which) >= MAX_FIELD;
}

function addLog(msg, cls = '') {
    const el = document.getElementById('logArea');
    const div = document.createElement('div');
    div.innerHTML = msg;
    if (cls) div.className = cls;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

// ============================================================
// ゲーム初期化
// ============================================================
function initGame() {
    game.playerDeck = createDeck();
    game.enemyDeck = createDeck();
    game.playerHand = [];
    game.enemyHand = [];
    game.playerField = [];
    game.enemyField = [];
    game.playerLife = MAX_LIFE;
    game.enemyLife = MAX_LIFE;
    game.turn = Math.random() < 0.5 ? 0 : 1;
    game.phase = 'draw';
    game.gameOver = false;
    game.usedAttackThisTurn = false;
    game.enemySkipNextTurn = false;
    game.curseActive = false;
    game.curseTurns = 0;
    game.kennyInGrave = false;

    drawCard(game.playerDeck, game.playerHand, 5);
    drawCard(game.enemyDeck, game.enemyHand, 5);

    const logEl = document.getElementById('logArea');
    logEl.innerHTML = '<div>--- バトルログ ---</div><div>ようこそ！ カードバトルを開始します。</div>';
    addLog(`=== ゲーム開始 ===`);
    addLog(game.turn === 0 ? 'あなたが先攻です！' : 'コンピューターが先攻です！');

    if (game.turn === 1) {
        setTimeout(() => executeEnemyTurn(), 500);
    } else {
        game.phase = 'draw';
        updateUI();
    }
}

// ============================================================
// プレイヤードロー
// ============================================================
function playerDraw() {
    if (game.gameOver || game.turn !== 0) return;
    if (game.playerDeck.length === 0) {
        addLog('⚠️ 山札がありません！');
        checkDeckOut();
        return;
    }
    let count = 1;
    if (Math.random() < 1/3) {
        count = 2;
        addLog('🍀 ラッキードロー！ 2枚引きます！', 'highlight');
    } else {
        addLog('1枚ドローしました。');
    }
    const drawn = drawCard(game.playerDeck, game.playerHand, count);
    if (drawn < count) {
        addLog('⚠️ 山札が足りないか、手札が上限です');
    }
    game.phase = 'main';
    updateUI();
    checkDeckOut();
}

// ============================================================
// 手札からフィールドに出す
// ============================================================
function playCardFromHand(index) {
    if (game.gameOver || game.turn !== 0) return;
    if (game.phase !== 'main') {
        addLog('メインフェイズではありません');
        return;
    }
    if (index < 0 || index >= game.playerHand.length) return;
    const card = game.playerHand[index];
    if (!card) return;

    if (card.type === 'creature') {
        if (isFieldFull('player')) {
            addLog('⚠️ フィールドが上限(3枚)です');
            return;
        }
        game.playerField.push(game.playerHand.splice(index, 1)[0]);
        addLog(`🃏 ${game.playerField[game.playerField.length-1].name} をフィールドに召喚！`);
        const lastIdx = game.playerField.length - 1;
        if (game.playerField[lastIdx].id === 18) {
            addLog('⚡ 戦士の効果: 即時攻撃！');
            performPlayerAttack();
        }
        game.phase = 'main';
        updateUI();
        return;
    }

    if (card.type === 'magic') {
        const magicCard = game.playerHand.splice(index, 1)[0];
        addLog(`📜 魔法「${magicCard.name}」を使用！`);
        applyMagicEffect(magicCard, 'player');
        updateUI();
        checkDeckOut();
        return;
    }
    addLog('このカードは使用できません');
}

// ============================================================
// 魔法効果処理
// ============================================================
function applyMagicEffect(card, owner) {
    const id = card.id;
    const isPlayer = owner === 'player';
    const enemyHand = isPlayer ? game.enemyHand : game.playerHand;
    const playerHand = isPlayer ? game.playerHand : game.enemyHand;
    const enemyField = isPlayer ? game.enemyField : game.playerField;
    const playerField = isPlayer ? game.playerField : game.enemyField;

    if (id === 19) {
        if (enemyHand.length === 0) {
            addLog('相手の手札は空です');
            if (Math.random() < 0.5) {
                (isPlayer ? game.playerDeck : game.enemyDeck).push(card);
                shuffle(isPlayer ? game.playerDeck : game.enemyDeck);
                addLog('「本」は山札の下に戻りました');
            }
            return;
        }
        const idx = Math.floor(Math.random() * enemyHand.length);
        const stolen = enemyHand.splice(idx, 1)[0];
        playerHand.push(stolen);
        addLog(`🔮 相手の手札から「${stolen.name}」を奪いました！`);
        if (Math.random() < 0.5) {
            (isPlayer ? game.playerDeck : game.enemyDeck).push(card);
            shuffle(isPlayer ? game.playerDeck : game.enemyDeck);
            addLog('「本」は山札の下に戻りました');
        }
        return;
    }

    if (id === 21) {
        if (game.kennyInGrave) {
            if (isFieldFull(isPlayer ? 'player' : 'enemy')) {
                addLog('⚠️ フィールドが埋まっています');
            } else {
                const kennyCard = CARD_DATA.find(c => c.id === 6);
                if (kennyCard) {
                    playerField.push(cloneCard(kennyCard));
                    game.kennyInGrave = false;
                    addLog('🧟 ケニーが墓地から復活しました！');
                }
            }
        } else {
            addLog('墓地にケニーはいません');
        }
        if (Math.random() < 0.5) {
            (isPlayer ? game.playerDeck : game.enemyDeck).push(card);
            shuffle(isPlayer ? game.playerDeck : game.enemyDeck);
            addLog('「不死身」は山札の下に戻りました');
        }
        return;
    }

    if (id === 26) {
        if (enemyHand.length === 0) {
            addLog('相手の手札は空です');
        } else {
            const names = enemyHand.map(c => c.name).join(', ');
            addLog(`👁️ 相手の手札: ${names}`);
        }
        return;
    }

    if (id === 30) {
        game.curseActive = true;
        game.curseTurns = 2;
        addLog('🎹 呪いのピアノ: 相手の攻撃力が-2000！');
        return;
    }
    addLog(`魔法「${card.name}」を使用しました。`);
}

// ============================================================
// プレイヤー攻撃
// ============================================================
function performPlayerAttack() {
    if (game.gameOver || game.turn !== 0) return;
    if (game.usedAttackThisTurn) {
        addLog('⚠️ このターンは既に攻撃しました');
        return;
    }
    if (game.playerField.length === 0) {
        addLog('⚠️ フィールドにカードがありません');
        return;
    }

    let attackerIndex = -1;
    for (let i = 0; i < game.playerField.length; i++) {
        if (game.playerField[i].type === 'creature') {
            attackerIndex = i;
            break;
        }
    }
    if (attackerIndex === -1) {
        addLog('⚠️ 攻撃できるカードがありません');
        return;
    }

    const attacker = game.playerField[attackerIndex];
    let atk = getCardAtk(attacker, false);

    if (attacker.id === 25) {
        if (game.enemyHand.length > 0) {
            const idx = Math.floor(Math.random() * game.enemyHand.length);
            const discarded = game.enemyHand.splice(idx, 1)[0];
            addLog(`😈 サタン: 相手の手札「${discarded.name}」を墓地に送った！`);
        } else {
            addLog('相手の手札は空です');
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    if (attacker.id === 23) {
        if (game.enemyField.length > 0) {
            if (Math.random() < 0.5) {
                const idx = Math.floor(Math.random() * game.enemyField.length);
                const removed = game.enemyField.splice(idx, 1)[0];
                addLog(`👻 ゴーストの賭け成功！ ${removed.name} を墓地に送った！`);
            } else {
                addLog('👻 ゴーストの賭けに失敗...');
            }
        } else {
            addLog('相手のフィールドにカードがありません');
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    if (attacker.id === 27) {
        let dmg = atk;
        if (Math.random() < 0.5) {
            game.playerLife -= dmg;
            addLog(`💥 クイヤ暴走！ 自分に${dmg}ダメージ！`, 'danger');
            if (game.playerLife <= 0) {
                game.playerLife = 0;
                game.gameOver = true;
                addLog('💀 あなたは敗北しました...', 'danger');
                updateUI();
                return;
            }
            game.playerField.splice(attackerIndex, 1);
        } else {
            game.enemyLife -= dmg;
            addLog(`🔥 クイヤの全体攻撃！ ${dmg}ダメージ！`);
            if (game.enemyLife <= 0) {
                game.enemyLife = 0;
                game.gameOver = true;
                addLog('🎉 あなたの勝利です！', 'highlight');
                updateUI();
                return;
            }
            game.playerField.splice(attackerIndex, 1);
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // 通常攻撃
    if (game.enemyField.length === 0) {
        game.enemyLife -= atk;
        addLog(`💢 ${attacker.name} のダイレクトアタック！ ${atk}ダメージ！`);
        if (game.enemyLife <= 0) {
            game.enemyLife = 0;
            game.gameOver = true;
            addLog('🎉 あなたの勝利です！', 'highlight');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    const targetIndex = 0;
    const target = game.enemyField[targetIndex];
    let enemyAtk = getCardAtk(target, true);

    if (atk > enemyAtk) {
        const dmg = atk - enemyAtk;
        game.enemyField.splice(targetIndex, 1);
        game.enemyLife -= dmg;
        addLog(`⚔️ ${attacker.name} が ${target.name} を破壊！ ${dmg}ダメージ！`);
        if (attacker.id === 24) {
            game.enemySkipNextTurn = true;
            addLog('❄️ 氷の効果: 相手の次のターンをスキップ！');
        }
        if (game.enemyLife <= 0) {
            game.enemyLife = 0;
            game.gameOver = true;
            addLog('🎉 あなたの勝利です！', 'highlight');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    } else if (atk < enemyAtk) {
        const dmg = enemyAtk - atk;
        game.playerField.splice(attackerIndex, 1);
        game.playerLife -= dmg;
        addLog(`💥 ${attacker.name} が ${target.name} に敗れた！ ${dmg}ダメージ！`, 'danger');
        if (game.playerLife <= 0) {
            game.playerLife = 0;
            game.gameOver = true;
            addLog('💀 あなたは敗北しました...', 'danger');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    } else {
        game.playerField.splice(attackerIndex, 1);
        game.enemyField.splice(targetIndex, 1);
        addLog(`💥 ${attacker.name} と ${target.name} は相打ち！`);
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }
}

// ============================================================
// プレイヤーターン終了
// ============================================================
function endPlayerTurn() {
    if (game.gameOver || game.turn !== 0) return;
    game.turn = 1;
    game.phase = 'draw';
    game.usedAttackThisTurn = false;
    addLog('--- 相手のターン ---');
    updateUI();
    setTimeout(() => {
        if (!game.gameOver && game.turn === 1) {
            executeEnemyTurn();
        }
    }, 500);
}

// ============================================================
// コンピューターのターン
// ============================================================
function executeEnemyTurn() {
    if (game.gameOver) return;
    if (game.enemySkipNextTurn) {
        game.enemySkipNextTurn = false;
        addLog('⏭️ 相手はスキップ！');
        game.turn = 0;
        game.phase = 'draw';
        updateUI();
        return;
    }

    if (game.enemyDeck.length === 0) {
        addLog('⚠️ 相手の山札が切れました');
        checkDeckOut();
        return;
    }
    let drawCount = 1;
    if (Math.random() < 1/3) {
        drawCount = 2;
        addLog('👾 相手がラッキードロー！ 2枚引きました');
    } else {
        addLog('👾 相手が1枚ドローしました');
    }
    drawCard(game.enemyDeck, game.enemyHand, drawCount);

    let creatureIdx = -1;
    for (let i = 0; i < game.enemyHand.length; i++) {
        if (game.enemyHand[i].type === 'creature' && !isFieldFull('enemy')) {
            creatureIdx = i;
            break;
        }
    }
    if (creatureIdx >= 0) {
        const card = game.enemyHand.splice(creatureIdx, 1)[0];
        game.enemyField.push(card);
        addLog(`👾 相手が ${card.name} を召喚しました`);
    } else {
        for (let i = 0; i < game.enemyHand.length; i++) {
            if (game.enemyHand[i].type === 'magic') {
                const magic = game.enemyHand.splice(i, 1)[0];
                addLog(`👾 相手が魔法「${magic.name}」を使用`);
                applyMagicEffect(magic, 'enemy');
                break;
            }
        }
    }

    if (game.enemyField.length > 0 && !game.gameOver) {
        for (let i = 0; i < game.enemyField.length; i++) {
            const attacker = game.enemyField[i];
            if (attacker.type !== 'creature') continue;

            let canAttack = true;
            if (attacker.id === 28) {
                if (Math.random() < 0.5) {
                    canAttack = false;
                    addLog('🔒 パスワード&コインの効果で攻撃失敗！');
                }
            }

            if (!canAttack) continue;

            let enemyAtk = getCardAtk(attacker, true);
            if (enemyAtk <= 0) continue;

            if (game.playerField.length === 0) {
                game.playerLife -= enemyAtk;
                addLog(`👾 相手のダイレクトアタック！ ${enemyAtk}ダメージ！`, 'danger');
                if (game.playerLife <= 0) {
                    game.playerLife = 0;
                    game.gameOver = true;
                    addLog('💀 あなたは敗北しました...', 'danger');
                    updateUI();
                    return;
                }
                continue;
            }

            const targetIdx = 0;
            const target = game.playerField[targetIdx];
            let playerAtk = getCardAtk(target, false);

            if (enemyAtk > playerAtk) {
                const dmg = enemyAtk - playerAtk;
                game.playerField.splice(targetIdx, 1);
                game.playerLife -= dmg;
                addLog(`👾 相手が ${target.name} を破壊！ ${dmg}ダメージ！`, 'danger');
                if (game.playerLife <= 0) {
                    game.playerLife = 0;
                    game.gameOver = true;
                    addLog('💀 あなたは敗北しました...', 'danger');
                    updateUI();
                    return;
                }
            } else if (enemyAtk < playerAtk) {
                game.enemyField.splice(i, 1);
                addLog(`⚔️ ${target.name} が相手の ${attacker.name} を撃退！`);
                i--;
            } else {
                game.playerField.splice(targetIdx, 1);
                game.enemyField.splice(i, 1);
                addLog(`💥 相打ち！`);
                i--;
            }
        }
    }

    game.turn = 0;
    game.phase = 'draw';
    game.usedAttackThisTurn = false;
    addLog('--- あなたのターン ---');
    updateUI();
    checkDeckOut();
}

// ============================================================
// 山札切れチェック
// ============================================================
function checkDeckOut() {
    if (game.playerDeck.length === 0 && game.playerHand.length === 0) {
        game.gameOver = true;
        addLog('💀 あなたの山札と手札がなくなりました... 敗北', 'danger');
        updateUI();
        return;
    }
    if (game.enemyDeck.length === 0 && game.enemyHand.length === 0) {
        game.gameOver = true;
        addLog('🎉 相手の山札と手札がなくなりました！ 勝利！', 'highlight');
        updateUI();
        return;
    }
}

// ============================================================
// UI更新
// ============================================================
function updateUI() {
    document.getElementById('lifePlayer').textContent = game.playerLife;
    document.getElementById('lifeEnemy').textContent = game.enemyLife;
    document.getElementById('deckPlayer').textContent = game.playerDeck.length;
    document.getElementById('deckEnemy').textContent = game.enemyDeck.length;
    document.getElementById('handPlayer').textContent = game.playerHand.length;
    document.getElementById('handEnemy').textContent = game.enemyHand.length;
    document.getElementById('fieldCountPlayer').textContent = game.playerField.length;
    document.getElementById('fieldCountEnemy').textContent = game.enemyField.length;

    const turnText = game.gameOver ? 'ゲーム終了' : (game.turn === 0 ? 'あなたのターン' : 'コンピューターのターン');
    document.getElementById('turnInfo').textContent = `ターン: ${turnText}`;

    const pf = document.getElementById('playerField');
    pf.innerHTML = '';
    if (game.playerField.length === 0) {
        pf.innerHTML = 'なし';
    } else {
        game.playerField.forEach((c) => {
            const div = document.createElement('div');
            div.className = `card creature`;
            div.innerHTML = `<div class="name">${c.name}</div><div class="atk">⚔️ ${getCardAtk(c, false)}</div><div class="info">${c.desc || ''}</div>`;
            pf.appendChild(div);
        });
    }

    const ef = document.getElementById('enemyField');
    ef.innerHTML = '';
    if (game.enemyField.length === 0) {
        ef.innerHTML = 'なし';
    } else {
        game.enemyField.forEach((c) => {
            const div = document.createElement('div');
            div.className = `card creature`;
            let atk = getCardAtk(c, true);
            div.innerHTML = `<div class="name">${c.name}</div><div class="atk">⚔️ ${atk}</div><div class="info">${c.desc || ''}</div>`;
            ef.appendChild(div);
        });
    }

    const ph = document.getElementById('playerHand');
    ph.innerHTML = '';
    game.playerHand.forEach((card, idx) => {
        const div = document.createElement('div');
        div.className = `card ${card.type === 'magic' ? 'magic' : 'creature'}`;
        div.innerHTML = `<div class="name">${card.name}</div><div class="atk">${card.type === 'creature' ? '⚔️ '+getCardAtk(card, false) : '📜'}</div><div class="info">${card.desc || ''}</div>`;
        if (!game.gameOver && game.turn === 0 && game.phase === 'main') {
            div.style.cursor = 'pointer';
            div.onclick = () => playCardFromHand(idx);
        }
        ph.appendChild(div);
    });

    document.getElementById('btnDraw').disabled = (game.gameOver || game.turn !== 0 || game.phase !== 'draw');
    document.getElementById('btnAttack').disabled = (game.gameOver || game.turn !== 0 || game.playerField.length === 0 || game.usedAttackThisTurn);
    document.getElementById('btnEndTurn').disabled = (game.gameOver || game.turn !== 0);
}

// ============================================================
// イベントバインド
// ============================================================
document.getElementById('btnDraw').addEventListener('click', playerDraw);
document.getElementById('btnAttack').addEventListener('click', performPlayerAttack);
document.getElementById('btnEndTurn').addEventListener('click', endPlayerTurn);
document.getElementById('btnRestart').addEventListener('click', initGame);
</script>
