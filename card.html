<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カードバトル 2013</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            color: #eee;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #e94560;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.2);
        }
        h1 {
            text-align: center;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
            margin: 0 0 15px 0;
            font-size: 2.2em;
            letter-spacing: 4px;
            border-bottom: 2px dashed #e94560;
            padding-bottom: 10px;
        }
        .status {
            display: flex;
            justify-content: space-between;
            background: #0f3460;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 1em;
            flex-wrap: wrap;
            gap: 5px;
        }
        .status span {
            background: #1a1a2e;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #533483;
            white-space: nowrap;
        }
        .field-area {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .field-player, .field-enemy {
            flex: 1;
            min-width: 300px;
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #533483;
        }
        .field-title {
            font-weight: bold;
            color: #e94560;
            border-bottom: 1px solid #533483;
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.1em;
        }
        .card-slot {
            background: #1a1a2e;
            border: 2px dashed #533483;
            border-radius: 10px;
            padding: 12px;
            min-height: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #2d2d44;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85em;
            display: inline-block;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 80px;
            max-width: 120px;
            flex: 1 0 auto;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .card.magic {
            border-color: #9b59b6;
            background: #2c1a3a;
        }
        .card.creature {
            border-color: #3498db;
            background: #1a2a3a;
        }
        .card .name {
            font-weight: bold;
            font-size: 0.9em;
            color: #fff;
        }
        .card .atk {
            color: #ff6b6b;
            font-size: 0.8em;
        }
        .card .info {
            font-size: 0.65em;
            color: #aaa;
        }
        .hand {
            background: #0f3460;
            padding: 12px;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid #533483;
        }
        .hand .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            min-height: 50px;
        }
        .btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 4px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #c73652;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #533483;
        }
        .btn-secondary:hover {
            background: #6a3d9e;
        }
        .log {
            background: #0a0a1a;
            border: 1px solid #533483;
            border-radius: 10px;
            padding: 12px;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 12px;
            font-size: 0.85em;
            line-height: 1.6;
            color: #aaddff;
        }
        .log .highlight { color: #ffd700; }
        .log .danger { color: #ff6b6b; }
        .log .success { color: #7bed9f; }
        .flex-center {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .password-screen {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            padding: 60px 30px;
        }
        .password-screen input {
            background: #1a1a2e;
            border: 2px solid #533483;
            color: #fff;
            padding: 15px 25px;
            font-size: 1.5em;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
        }
        .password-screen input:focus {
            outline: none;
            border-color: #e94560;
        }
        .password-screen .error {
            color: #ff6b6b;
            margin-top: 10px;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 800px) {
            .field-player, .field-enemy { min-width: 200px; }
            .card { min-width: 60px; padding: 4px 8px; font-size: 0.75em; }
            .status { font-size: 0.8em; }
            h1 { font-size: 1.5em; }
        }
        ::-webkit-scrollbar {
            width: 6px;
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- ===== パスワード認証画面 ===== -->
<div id="passwordScreen" class="container password-screen">
    <h1>🔐 認証</h1>
    <p style="color: #aaa; margin-bottom: 30px;">このサイトを利用するにはパスワードが必要です</p>
    <input type="password" id="passwordInput" placeholder="パスワード" maxlength="20">
    <br>
    <button class="btn" onclick="checkPassword()">認証</button>
    <div id="passwordError" class="error"></div>
    <div style="margin-top: 30px; color: #533483; font-size: 0.8em;">※ 正しいパスワードを入力してください</div>
</div>

<!-- ===== ゲーム画面 ===== -->
<div id="gameScreen" class="container hidden">
    <h1>⚔️ カードバトル 2013</h1>

    <div class="status" id="statusBar">
        <span id="turnInfo">ターン: 準備中</span>
        <span>❤️ あなた: <span id="lifePlayer">40000</span></span>
        <span>❤️ 相手: <span id="lifeEnemy">40000</span></span>
        <span>📚 山札: <span id="deckPlayer">30</span> / <span id="deckEnemy">30</span></span>
        <span>✋ 手札: <span id="handPlayer">0</span> / <span id="handEnemy">0</span></span>
        <span>🏆 フィールド: <span id="fieldCountPlayer">0</span> / <span id="fieldCountEnemy">0</span></span>
    </div>

    <div class="field-area">
        <div class="field-enemy">
            <div class="field-title">👾 コンピューター フィールド</div>
            <div class="card-slot" id="enemyField">なし</div>
        </div>
        <div class="field-player">
            <div class="field-title">🃏 あなたのフィールド</div>
            <div class="card-slot" id="playerField">なし</div>
        </div>
    </div>

    <div class="hand">
        <div class="field-title">✋ あなたの手札 (クリックで召喚/使用)</div>
        <div class="cards" id="playerHand"></div>
    </div>

    <div class="flex-center">
        <button class="btn" id="btnDraw">▶ ドロー (1枚)</button>
        <button class="btn" id="btnAttack">⚔️ 攻撃</button>
        <button class="btn" id="btnEndTurn">⏭️ ターン終了</button>
        <button class="btn btn-secondary" id="btnRestart">🔄 新規ゲーム</button>
    </div>

    <div class="log" id="logArea">
        <div>--- バトルログ ---</div>
        <div>ようこそ！ カードバトルを開始します。</div>
    </div>
</div>

<script>
// ============================================================
// パスワード認証 (暗号化)
// ============================================================
// パスワード「17058」を難読化 (シンプルな暗号化)
// 実際のハッシュ関数は使わず、文字列変換で難読化
const ENCRYPTED_PASSWORD = (function() {
    // "17058" を 各文字のASCIIコード+3 して暗号化
    const pwd = "17058";
    let encrypted = "";
    for (let i = 0; i < pwd.length; i++) {
        encrypted += String.fromCharCode(pwd.charCodeAt(i) + 3);
    }
    return encrypted; // "4:;8" になる
})();

function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    // 入力値を復号化 (ASCII-3)
    let decrypted = "";
    for (let i = 0; i < input.length; i++) {
        decrypted += String.fromCharCode(input.charCodeAt(i) - 3);
    }
    // "17058" と比較
    if (decrypted === "17058") {
        document.getElementById('passwordScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        initGame();
    } else {
        document.getElementById('passwordError').textContent = '❌ パスワードが違います';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
}

// Enterキーで認証
document.getElementById('passwordInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPassword();
});

// ============================================================
// カードデータ (30枚)
// ============================================================
const CARD_DATA = [
    { id: 1, name: 'ヨハン', atk: 5000, type: 'creature', desc: '' },
    { id: 2, name: '十代', atk: 4000, type: 'creature', desc: '' },
    { id: 3, name: 'スタン', atk: 4000, type: 'creature', desc: '' },
    { id: 4, name: 'カイル', atk: 3000, type: 'creature', desc: '' },
    { id: 5, name: 'カートマン', atk: 3000, type: 'creature', desc: '' },
    { id: 6, name: 'ケニー', atk: 1000, type: 'creature', desc: '' },
    { id: 7, name: 'クライド', atk: 4000, type: 'creature', desc: '' },
    { id: 8, name: 'クレイグ', atk: 4000, type: 'creature', desc: '' },
    { id: 9, name: 'ブライデン', atk: 3000, type: 'creature', desc: '' },
    { id: 10, name: 'ダミアン', atk: 2000, type: 'creature', desc: '' },
    { id: 11, name: 'トゥイーク', atk: 1000, type: 'creature', desc: '' },
    { id: 12, name: 'ジャガーさん', atk: 1000, type: 'creature', desc: '' },
    { id: 13, name: 'ピヨ彦', atk: 1000, type: 'creature', desc: '' },
    { id: 14, name: 'マークさん', atk: 1000, type: 'creature', desc: '' },
    { id: 15, name: 'ダギャ', atk: 1000, type: 'creature', desc: '' },
    { id: 16, name: '宝獣', atk: 6000, type: 'creature', desc: '全体攻撃' },
    { id: 17, name: 'ヒーロー', atk: 6000, type: 'creature', desc: '2回攻撃' },
    { id: 18, name: '戦士', atk: 5000, type: 'creature', desc: '即時攻撃' },
    { id: 19, name: '本', atk: 0, type: 'magic', desc: '相手手札を1枚奪う' },
    { id: 20, name: 'マシンガン', atk: 7000, type: 'creature', desc: '' },
    { id: 21, name: '不死身', atk: 0, type: 'magic', desc: '墓地のケニーを召喚' },
    { id: 22, name: '英雄', atk: 4000, type: 'creature', desc: '1/2で攻撃力6000' },
    { id: 23, name: 'ゴースト', atk: 5000, type: 'creature', desc: '賭け: 相手カードを墓地へ' },
    { id: 24, name: '氷', atk: 4000, type: 'creature', desc: '攻撃で破壊で次ターンスキップ' },
    { id: 25, name: 'サタン', atk: 6000, type: 'creature', desc: '代わりに手札を墓地へ' },
    { id: 26, name: '念力', atk: 0, type: 'magic', desc: '相手の手札を公開' },
    { id: 27, name: 'クイヤ', atk: 9000, type: 'creature', desc: '全体攻撃・1/2で自爆' },
    { id: 28, name: 'パスワード&コイン', atk: 1000, type: 'creature', desc: '相手攻撃1/2失敗・優先標的' },
    { id: 29, name: '血の海', atk: 2000, type: 'creature', desc: '相手攻撃力-3000' },
    { id: 30, name: '呪いのピアノ', atk: 0, type: 'magic', desc: '相手攻撃力-2000' }
];

// ============================================================
// ゲーム状態
// ============================================================
const MAX_LIFE = 40000;
const DECK_SIZE = 30;
const MAX_HAND = 8;
const MAX_FIELD = 3;

let game = {
    playerDeck: [],
    enemyDeck: [],
    playerHand: [],
    enemyHand: [],
    playerField: [],    // 最大3枚
    enemyField: [],     // 最大3枚
    playerLife: MAX_LIFE,
    enemyLife: MAX_LIFE,
    turn: 0,
    phase: 'draw',
    gameOver: false,
    usedAttackThisTurn: false,
    enemySkipNextTurn: false,
    curseActive: false,
    curseTurns: 0,
    kennyInGrave: false,
    // 攻撃回数管理
    playerAttacksUsed: 0,
    enemyAttacksUsed: 0,
    // ヒーローの2回攻撃フラグ
    heroDoubleAttack: false,
};

// ============================================================
// ユーティリティ
// ============================================================
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function cloneCard(card) {
    return { ...card, id: card.id };
}

function createDeck() {
    return shuffle(CARD_DATA.map(c => cloneCard(c)));
}

function drawCard(deck, hand, count = 1) {
    let drawn = 0;
    for (let i = 0; i < count; i++) {
        if (deck.length === 0) break;
        if (hand.length >= MAX_HAND) {
            addLog('⚠️ 手札が上限(8枚)に達しています');
            break;
        }
        hand.push(deck.pop());
        drawn++;
    }
    return drawn;
}

function getCardAtk(card, isEnemy = false) {
    if (!card || card.type === 'magic') return 0;
    let atk = card.atk || 0;
    if (card.id === 22 && Math.random() < 0.5) atk = 6000;
    // 血の海効果 (相手の攻撃力-3000)
    if (isEnemy && game.playerField.some(c => c.id === 29)) {
        atk = Math.max(0, atk - 3000);
    }
    // 呪いのピアノ効果
    if (game.curseActive && isEnemy) {
        atk = Math.max(0, atk - 2000);
    }
    return atk;
}

function getFieldCount(which) {
    return which === 'player' ? game.playerField.length : game.enemyField.length;
}

function isFieldFull(which) {
    return getFieldCount(which) >= MAX_FIELD;
}

function addLog(msg, cls = '') {
    const el = document.getElementById('logArea');
    const div = document.createElement('div');
    div.innerHTML = msg;
    if (cls) div.className = cls;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

// ============================================================
// ゲーム初期化
// ============================================================
function initGame() {
    game.playerDeck = createDeck();
    game.enemyDeck = createDeck();
    game.playerHand = [];
    game.enemyHand = [];
    game.playerField = [];
    game.enemyField = [];
    game.playerLife = MAX_LIFE;
    game.enemyLife = MAX_LIFE;
    game.turn = Math.random() < 0.5 ? 0 : 1;
    game.phase = 'draw';
    game.gameOver = false;
    game.usedAttackThisTurn = false;
    game.enemySkipNextTurn = false;
    game.curseActive = false;
    game.curseTurns = 0;
    game.kennyInGrave = false;
    game.playerAttacksUsed = 0;
    game.enemyAttacksUsed = 0;
    game.heroDoubleAttack = false;

    drawCard(game.playerDeck, game.playerHand, 5);
    drawCard(game.enemyDeck, game.enemyHand, 5);

    const logEl = document.getElementById('logArea');
    logEl.innerHTML = '<div>--- バトルログ ---</div><div>ようこそ！ カードバトルを開始します。</div>';
    addLog(`=== ゲーム開始 ===`);
    addLog(game.turn === 0 ? 'あなたが先攻です！' : 'コンピューターが先攻です！');

    if (game.turn === 1) {
        setTimeout(() => executeEnemyTurn(), 500);
    } else {
        game.phase = 'draw';
        updateUI();
    }
}

// ============================================================
// プレイヤードロー
// ============================================================
function playerDraw() {
    if (game.gameOver || game.turn !== 0) return;
    if (game.playerDeck.length === 0) {
        addLog('⚠️ 山札がありません！');
        checkDeckOut();
        return;
    }
    let count = 1;
    if (Math.random() < 1/3) {
        count = 2;
        addLog('🍀 ラッキードロー！ 2枚引きます！', 'highlight');
    } else {
        addLog('1枚ドローしました。');
    }
    const drawn = drawCard(game.playerDeck, game.playerHand, count);
    if (drawn < count) {
        addLog('⚠️ 山札が足りないか、手札が上限です');
    }
    game.phase = 'main';
    updateUI();
    checkDeckOut();
}

// ============================================================
// 手札からフィールドに出す
// ============================================================
function playCardFromHand(index) {
    if (game.gameOver || game.turn !== 0) return;
    if (game.phase !== 'main') {
        addLog('メインフェイズではありません');
        return;
    }
    if (index < 0 || index >= game.playerHand.length) return;
    const card = game.playerHand[index];
    if (!card) return;

    if (card.type === 'creature') {
        if (isFieldFull('player')) {
            addLog('⚠️ フィールドが上限(3枚)です');
            return;
        }
        game.playerField.push(game.playerHand.splice(index, 1)[0]);
        addLog(`🃏 ${game.playerField[game.playerField.length-1].name} をフィールドに召喚！`);
        // 戦士 (18) 即時攻撃
        const lastIdx = game.playerField.length - 1;
        if (game.playerField[lastIdx].id === 18) {
            addLog('⚡ 戦士の効果: 即時攻撃！');
            performPlayerAttack();
        }
        game.phase = 'main';
        updateUI();
        return;
    }

    if (card.type === 'magic') {
        const magicCard = game.playerHand.splice(index, 1)[0];
        addLog(`📜 魔法「${magicCard.name}」を使用！`);
        applyMagicEffect(magicCard, 'player');
        updateUI();
        checkDeckOut();
        return;
    }
    addLog('このカードは使用できません');
}

// ============================================================
// 魔法効果処理
// ============================================================
function applyMagicEffect(card, owner) {
    const id = card.id;
    const isPlayer = owner === 'player';
    const enemyHand = isPlayer ? game.enemyHand : game.playerHand;
    const playerHand = isPlayer ? game.playerHand : game.enemyHand;
    const enemyField = isPlayer ? game.enemyField : game.playerField;
    const playerField = isPlayer ? game.playerField : game.enemyField;

    if (id === 19) { // 本
        if (enemyHand.length === 0) {
            addLog('相手の手札は空です');
            if (Math.random() < 0.5) {
                (isPlayer ? game.playerDeck : game.enemyDeck).push(card);
                shuffle(isPlayer ? game.playerDeck : game.enemyDeck);
                addLog('「本」は山札の下に戻りました');
            }
            return;
        }
        const idx = Math.floor(Math.random() * enemyHand.length);
        const stolen = enemyHand.splice(idx, 1)[0];
        playerHand.push(stolen);
        addLog(`🔮 相手の手札から「${stolen.name}」を奪いました！`);
        if (Math.random() < 0.5) {
            (isPlayer ? game.playerDeck : game.enemyDeck).push(card);
            shuffle(isPlayer ? game.playerDeck : game.enemyDeck);
            addLog('「本」は山札の下に戻りました');
        }
        return;
    }

    if (id === 21) { // 不死身
        if (game.kennyInGrave) {
            if (isFieldFull(isPlayer ? 'player' : 'enemy')) {
                addLog('⚠️ フィールドが埋まっています');
            } else {
                const kennyCard = CARD_DATA.find(c => c.id === 6);
                if (kennyCard) {
                    playerField.push(cloneCard(kennyCard));
                    game.kennyInGrave = false;
                    addLog('🧟 ケニーが墓地から復活しました！');
                }
            }
        } else {
            addLog('墓地にケニーはいません');
        }
        if (Math.random() < 0.5) {
            (isPlayer ? game.playerDeck : game.enemyDeck).push(card);
            shuffle(isPlayer ? game.playerDeck : game.enemyDeck);
            addLog('「不死身」は山札の下に戻りました');
        }
        return;
    }

    if (id === 26) { // 念力
        if (enemyHand.length === 0) {
            addLog('相手の手札は空です');
        } else {
            const names = enemyHand.map(c => c.name).join(', ');
            addLog(`👁️ 相手の手札: ${names}`);
        }
        return;
    }

    if (id === 30) { // 呪いのピアノ
        game.curseActive = true;
        game.curseTurns = 2;
        addLog('🎹 呪いのピアノ: 相手の攻撃力が-2000！');
        return;
    }
    addLog(`魔法「${card.name}」を使用しました。`);
}

// ============================================================
// プレイヤー攻撃
// ============================================================
function performPlayerAttack() {
    if (game.gameOver || game.turn !== 0) return;
    if (game.usedAttackThisTurn) {
        addLog('⚠️ このターンは既に攻撃しました');
        return;
    }
    if (game.playerField.length === 0) {
        addLog('⚠️ フィールドにカードがありません');
        return;
    }

    // 攻撃可能なクリーチャーを探す
    let attackerIndex = -1;
    for (let i = 0; i < game.playerField.length; i++) {
        if (game.playerField[i].type === 'creature') {
            attackerIndex = i;
            break;
        }
    }
    if (attackerIndex === -1) {
        addLog('⚠️ 攻撃できるカードがありません');
        return;
    }

    const attacker = game.playerField[attackerIndex];
    let atk = getCardAtk(attacker, false);

    // サタン (25) 特殊処理
    if (attacker.id === 25) {
        if (game.enemyHand.length > 0) {
            const idx = Math.floor(Math.random() * game.enemyHand.length);
            const discarded = game.enemyHand.splice(idx, 1)[0];
            addLog(`😈 サタン: 相手の手札「${discarded.name}」を墓地に送った！`);
        } else {
            addLog('相手の手札は空です');
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // ゴースト (23) 賭け
    if (attacker.id === 23) {
        if (game.enemyField.length > 0) {
            if (Math.random() < 0.5) {
                const idx = Math.floor(Math.random() * game.enemyField.length);
                const removed = game.enemyField.splice(idx, 1)[0];
                addLog(`👻 ゴーストの賭け成功！ ${removed.name} を墓地に送った！`);
                if (removed.id === 24) {
                    // 相手の氷が墓地に行った場合の処理
                }
            } else {
                addLog('👻 ゴーストの賭けに失敗...');
            }
        } else {
            addLog('相手のフィールドにカードがありません');
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // クイヤ (27) 全体攻撃
    if (attacker.id === 27) {
        let dmg = atk;
        if (Math.random() < 0.5) {
            game.playerLife -= dmg;
            addLog(`💥 クイヤ暴走！ 自分に${dmg}ダメージ！`, 'danger');
            if (game.playerLife <= 0) {
                game.playerLife = 0;
                game.gameOver = true;
                addLog('💀 あなたは敗北しました...', 'danger');
                updateUI();
                return;
            }
            game.playerField.splice(attackerIndex, 1);
        } else {
            game.enemyLife -= dmg;
            addLog(`🔥 クイヤの全体攻撃！ ${dmg}ダメージ！`);
            if (game.enemyLife <= 0) {
                game.enemyLife = 0;
                game.gameOver = true;
                addLog('🎉 あなたの勝利です！', 'highlight');
                updateUI();
                return;
            }
            game.playerField.splice(attackerIndex, 1);
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // 通常攻撃: 相手フィールドにカードがあるかチェック
    if (game.enemyField.length === 0) {
        // ダイレクトアタック！
        game.enemyLife -= atk;
        addLog(`💢 ${attacker.name} のダイレクトアタック！ ${atk}ダメージ！`);
        if (game.enemyLife <= 0) {
            game.enemyLife = 0;
            game.gameOver = true;
            addLog('🎉 あなたの勝利です！', 'highlight');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // 相手フィールドのカードを攻撃 (一番前のカードを攻撃)
    const targetIndex = 0;
    const target = game.enemyField[targetIndex];
    let enemyAtk = getCardAtk(target, true);

    if (atk > enemyAtk) {
        const dmg = atk - enemyAtk;
        game.enemyField.splice(targetIndex, 1);
        game.enemyLife -= dmg;
        addLog(`⚔️ ${attacker.name} が ${target.name} を破壊！ ${dmg}ダメージ！`);
        if (attacker.id === 24) {
            game.enemySkipNextTurn = true;
            addLog('❄️ 氷の効果: 相手の次のターンをスキップ！');
        }
        if (game.enemyLife <= 0) {
            game.enemyLife = 0;
            game.gameOver = true;
            addLog('🎉 あなたの勝利です！', 'highlight');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    } else if (atk < enemyAtk) {
        const dmg = enemyAtk - atk;
        game.playerField.splice(attackerIndex, 1);
        game.playerLife -= dmg;
        addLog(`💥 ${attacker.name} が ${target.name} に敗れた！ ${dmg}ダメージ！`, 'danger');
        if (game.playerLife <= 0) {
            game.playerLife = 0;
            game.gameOver = true;
            addLog('💀 あなたは敗北しました...', 'danger');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    } else {
        // 相打ち
        game.playerField.splice(attackerIndex, 1);
        game.enemyField.splice(targetIndex, 1);
        addLog(`💥 ${attacker.name} と ${target.name} は相打ち！`);
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }
}

// ============================================================
// プレイヤーターン終了
// ============================================================
function endPlayerTurn() {
    if (game.gameOver || game.turn !== 0) return;
    game.turn = 1;
    game.phase = 'draw';
    game.usedAttackThisTurn = false;
    addLog('--- 相手のターン ---');
    updateUI();
    setTimeout(() => {
        if (!game.gameOver && game.turn === 1) {
            executeEnemyTurn();
        }
    }, 500);
}

// ============================================================
// コンピューターのターン
// ============================================================
function executeEnemyTurn() {
    if (game.gameOver) return;
    if (game.enemySkipNextTurn) {
        game.enemySkipNextTurn = false;
        addLog('⏭️ 相手はスキップ！');
        game.turn = 0;
        game.phase = 'draw';
        updateUI();
        return;
    }

    // ドロー
    if (game.enemyDeck.length === 0) {
        addLog('⚠️ 相手の山札が切れました');
        checkDeckOut();
        return;
    }
    let drawCount = 1;
    if (Math.random() < 1/3) {
        drawCount = 2;
        addLog('👾 相手がラッキードロー！ 2枚引きました');
    } else {
        addLog('👾 相手が1枚ドローしました');
    }
    drawCard(game.enemyDeck, game.enemyHand, drawCount);

    // メインフェイズ: クリーチャーを出す
    let creatureIdx = -1;
    for (let i = 0; i < game.enemyHand.length; i++) {
        if (game.enemyHand[i].type === 'creature' && !isFieldFull('enemy')) {
            creatureIdx = i;
            break;
        }
    }
    if (creatureIdx >= 0) {
        const card = game.enemyHand.splice(creatureIdx, 1)[0];
        game.enemyField.push(card);
        addLog(`👾 相手が ${card.name} を召喚しました`);
    } else {
        // 魔法カードを使用 (簡易)
        for (let i = 0; i < game.enemyHand.length; i++) {
            if (game.enemyHand[i].type === 'magic') {
                const magic = game.enemyHand.splice(i, 1)[0];
                addLog(`👾 相手が魔法「${magic.name}」を使用`);
                applyMagicEffect(magic, 'enemy');
                break;
            }
        }
    }

    // 攻撃フェイズ
    if (game.enemyField.length > 0 && !game.gameOver) {
        for (let i = 0; i < game.enemyField.length; i++) {
            const attacker = game.enemyField[i];
            if (attacker.type !== 'creature') continue;

            // パスワード&コイン (28) チェック
            let canAttack = true;
            if (attacker.id === 28) {
                if (Math.random() < 0.5) {
                    canAttack = false;
                    addLog('🔒 パスワード&コインの効果で攻撃失敗！');
                }
                // 優先標的: 他のカードがいる場合はそちらを攻撃
                if (game.playerField.length > 0 && game.playerField.some(c => c.id !== 28)) {
                    // 他のカードを優先
                }
            }

            if (!canAttack) continue;

            let enemyAtk = getCardAtk(attacker, true);
            if (enemyAtk <= 0) continue;

            if (game.playerField.length === 0) {
                // ダイレクトアタック
                game.playerLife -= enemyAtk;
                addLog(`👾 相手のダイレクトアタック！ ${enemyAtk}ダメージ！`, 'danger');
                if (game.playerLife <= 0) {
                    game.playerLife = 0;
                    game.gameOver = true;
                    addLog('💀 あなたは敗北しました...', 'danger');
                    updateUI();
                    return;
                }
                continue;
            }

            // プレイヤーフィールドのカードを攻撃 (一番前)
            const targetIdx = 0;
            const target = game.playerField[targetIdx];
            let playerAtk = getCardAtk(target, false);

            if (enemyAtk > playerAtk) {
                const dmg = enemyAtk - playerAtk;
                game.playerField.splice(targetIdx, 1);
                game.playerLife -= dmg;
                addLog(`👾 相手が ${target.name} を破壊！ ${dmg}ダメージ！`, 'danger');
                if (game.playerLife <= 0) {
                    game.playerLife = 0;
                    game.gameOver = true;
                    addLog('💀 あなたは敗北しました...', 'danger');
                    updateUI();
                    return;
                }
            } else if (enemyAtk < playerAtk) {
                game.enemyField.splice(i, 1);
                addLog(`⚔️ ${target.name} が相手の ${attacker.name} を撃退！`);
                i--;
            } else {
                game.playerField.splice(targetIdx, 1);
                game.enemyField.splice(i, 1);
                addLog(`💥 相打ち！`);
                i--;
            }
        }
    }

    game.turn = 0;
    game.phase = 'draw';
    game.usedAttackThisTurn = false;
    addLog('--- あなたのターン ---');
    updateUI();
    checkDeckOut();
}

// ============================================================
// 山札切れチェック
// ============================================================
function checkDeckOut() {
    if (game.playerDeck.length === 0 && game.playerHand.length === 0) {
        game.gameOver = true;
        addLog('💀 あなたの山札と手札がなくなりました... 敗北', 'danger');
        updateUI();
        return;
    }
    if (game.enemyDeck.length === 0 && game.enemyHand.length === 0) {
        game.gameOver = true;
        addLog('🎉 相手の山札と手札がなくなりました！ 勝利！', 'highlight');
        updateUI();
        return;
    }
}

// ============================================================
// UI更新
// ============================================================
function updateUI() {
    document.getElementById('lifePlayer').textContent = game.playerLife;
    document.getElementById('lifeEnemy').textContent = game.enemyLife;
    document.getElementById('deckPlayer').textContent = game.playerDeck.length;
    document.getElementById('deckEnemy').textContent = game.enemyDeck.length;
    document.getElementById('handPlayer').textContent = game.playerHand.length;
    document.getElementById('handEnemy').textContent = game.enemyHand.length;
    document.getElementById('fieldCountPlayer').textContent = game.playerField.length;
    document.getElementById('fieldCountEnemy').textContent = game.enemyField.length;

    const turnText = game.gameOver ? 'ゲーム終了' : (game.turn === 0 ? 'あなたのターン' : 'コンピューターのターン');
    document.getElementById('turnInfo').textContent = `ターン: ${turnText}`;

    // プレイヤーフィールド
    const pf = document.getElementById('playerField');
    pf.innerHTML = '';
    if (game.playerField.length === 0) {
        pf.innerHTML = 'なし';
    } else {
        game.playerField.forEach((c, idx) => {
            const div = document.createElement('div');
            div.className = `card creature`;
            div.innerHTML = `<div class="name">${c.name}</div><div class="atk">⚔️ ${getCardAtk(c, false)}</div><div class="info">${c.desc || ''}</div>`;
            pf.appendChild(div);
        });
    }

    // 敵フィールド
    const ef = document.getElementById('enemyField');
    ef.innerHTML = '';
    if (game.enemyField.length === 0) {
        ef.innerHTML = 'なし';
    } else {
        game.enemyField.forEach((c, idx) => {
            const div = document.createElement('div');
            div.className = `card creature`;
            let atk = getCardAtk(c, true);
            div.innerHTML = `<div class="name">${c.name}</div><div class="atk">⚔️ ${atk}</div><div class="info">${c.desc || ''}</div>`;
            ef.appendChild(div);
        });
    }

    // 手札
    const ph = document.getElementById('playerHand');
    ph.innerHTML = '';
    game.playerHand.forEach((card, idx) => {
        const div = document.createElement('div');
        div.className = `card ${card.type === 'magic' ? 'magic' : 'creature'}`;
        div.innerHTML = `<div class="name">${card.name}</div><div class="atk">${card.type === 'creature' ? '⚔️ '+getCardAtk(card, false) : '📜'}</div><div class="info">${card.desc || ''}</div>`;
        if (!game.gameOver && game.turn === 0 && game.phase === 'main') {
            div.style.cursor = 'pointer';
            div.onclick = () => playCardFromHand(idx);
        }
        ph.appendChild(div);
    });

    // ボタン制御
    document.getElementById('btnDraw').disabled = (game.gameOver || game.turn !== 0 || game.phase !== 'draw');
    document.getElementById('btnAttack').disabled = (game.gameOver || game.turn !== 0 || game.playerField.length === 0 || game.usedAttackThisTurn);
    document.getElementById('btnEndTurn').disabled = (game.gameOver || game.turn !== 0);
}

// ============================================================
// イベントバインド
// ============================================================
document.getElementById('btnDraw').addEventListener('click', playerDraw);
document.getElementById('btnAttack').addEventListener('click', performPlayerAttack);
document.getElementById('btnEndTurn').addEventListener('click', endPlayerTurn);
document.getElementById('btnRestart').addEventListener('click', initGame);

// 初期化はパスワード認証後に実行
</script>
</body>
