<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カードバトル 2013</title>
    <style>
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }
        h1 {
            text-align: center;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            margin-top: 0;
            font-size: 2em;
            letter-spacing: 4px;
            border-bottom: 2px dashed #e94560;
            padding-bottom: 10px;
        }
        .status {
            display: flex;
            justify-content: space-between;
            background: #0f3460;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 1.1em;
            flex-wrap: wrap;
        }
        .status span {
            background: #1a1a2e;
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid #e94560;
        }
        .field {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .field-player, .field-enemy {
            flex: 1;
            min-width: 250px;
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #533483;
        }
        .field-title {
            font-weight: bold;
            color: #e94560;
            border-bottom: 1px solid #533483;
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .card-slot {
            background: #1a1a2e;
            border: 2px dashed #533483;
            border-radius: 10px;
            padding: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card {
            background: #2d2d44;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.9em;
            display: inline-block;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 80px;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .card.magic {
            border-color: #9b59b6;
            background: #2c1a3a;
        }
        .card.creature {
            border-color: #3498db;
            background: #1a2a3a;
        }
        .card .name {
            font-weight: bold;
            font-size: 0.9em;
            color: #fff;
        }
        .card .atk {
            color: #ff6b6b;
            font-size: 0.8em;
        }
        .card .info {
            font-size: 0.7em;
            color: #aaa;
        }
        .hand {
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid #533483;
        }
        .hand .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 60px;
        }
        .btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #c73652;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .log {
            background: #0a0a1a;
            border: 1px solid #533483;
            border-radius: 10px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 15px;
            font-size: 0.9em;
            line-height: 1.5;
            color: #aaddff;
        }
        .log .highlight {
            color: #ffd700;
        }
        .log .danger {
            color: #ff6b6b;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        @media (max-width: 700px) {
            .field { flex-direction: column; }
            .card { min-width: 60px; padding: 4px 8px; font-size: 0.8em; }
            .status { font-size: 0.9em; }
        }
        ::-webkit-scrollbar {
            width: 8px;
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ カードバトル 2013</h1>

    <div class="status" id="statusBar">
        <span id="turnInfo">ターン: 準備中</span>
        <span>ライフ: <span id="lifePlayer">40000</span></span>
        <span>ライフ: <span id="lifeEnemy">40000</span></span>
        <span>山札: <span id="deckPlayer">30</span> / <span id="deckEnemy">30</span></span>
        <span>手札: <span id="handPlayer">0</span> / <span id="handEnemy">0</span></span>
    </div>

    <div class="field">
        <div class="field-enemy">
            <div class="field-title">👾 コンピューター フィールド</div>
            <div class="card-slot" id="enemyField">なし</div>
        </div>
        <div class="field-player">
            <div class="field-title">🃏 あなたのフィールド</div>
            <div class="card-slot" id="playerField">なし</div>
        </div>
    </div>

    <div class="hand">
        <div class="field-title">✋ あなたの手札</div>
        <div class="cards" id="playerHand"></div>
    </div>

    <div class="flex-center">
        <button class="btn" id="btnDraw">▶ ドロー (1枚)</button>
        <button class="btn" id="btnAttack">⚔️ 攻撃 (召喚してる場合)</button>
        <button class="btn" id="btnEndTurn">⏭️ ターン終了</button>
        <button class="btn" id="btnRestart">🔄 新規ゲーム</button>
    </div>

    <div class="log" id="logArea">
        <div>--- バトルログ ---</div>
        <div>ようこそ！ カードバトルを開始します。</div>
    </div>
</div>

<script>
// ============================================================
// カードデータ (30枚)
// ============================================================
const CARD_DATA = [
    { id: 1, name: 'ヨハン', atk: 5000, type: 'creature', desc: '' },
    { id: 2, name: '十代', atk: 4000, type: 'creature', desc: '' },
    { id: 3, name: 'スタン', atk: 4000, type: 'creature', desc: '' },
    { id: 4, name: 'カイル', atk: 3000, type: 'creature', desc: '' },
    { id: 5, name: 'カートマン', atk: 3000, type: 'creature', desc: '' },
    { id: 6, name: 'ケニー', atk: 1000, type: 'creature', desc: '' },
    { id: 7, name: 'クライド', atk: 4000, type: 'creature', desc: '' },
    { id: 8, name: 'クレイグ', atk: 4000, type: 'creature', desc: '' },
    { id: 9, name: 'ブライデン', atk: 3000, type: 'creature', desc: '' },
    { id: 10, name: 'ダミアン', atk: 2000, type: 'creature', desc: '' },
    { id: 11, name: 'トゥイーク', atk: 1000, type: 'creature', desc: '' },
    { id: 12, name: 'ジャガーさん', atk: 1000, type: 'creature', desc: '' },
    { id: 13, name: 'ピヨ彦', atk: 1000, type: 'creature', desc: '' },
    { id: 14, name: 'マークさん', atk: 1000, type: 'creature', desc: '' },
    { id: 15, name: 'ダギャ', atk: 1000, type: 'creature', desc: '' },
    { id: 16, name: '宝獣', atk: 6000, type: 'creature', desc: '全体攻撃' },
    { id: 17, name: 'ヒーロー', atk: 6000, type: 'creature', desc: '2回攻撃' },
    { id: 18, name: '戦士', atk: 5000, type: 'creature', desc: '即時攻撃' },
    { id: 19, name: '本', atk: 0, type: 'magic', desc: '相手手札を1枚奪う' },
    { id: 20, name: 'マシンガン', atk: 7000, type: 'creature', desc: '' },
    { id: 21, name: '不死身', atk: 0, type: 'magic', desc: '墓地のケニーを召喚' },
    { id: 22, name: '英雄', atk: 4000, type: 'creature', desc: '1/2で攻撃力6000' },
    { id: 23, name: 'ゴースト', atk: 5000, type: 'creature', desc: '賭け: 相手カードを墓地へ' },
    { id: 24, name: '氷', atk: 4000, type: 'creature', desc: '攻撃で相手カード破壊で次ターンスキップ' },
    { id: 25, name: 'サタン', atk: 6000, type: 'creature', desc: '代わりに手札を墓地へ' },
    { id: 26, name: '念力', atk: 0, type: 'magic', desc: '相手の手札を公開' },
    { id: 27, name: 'クイヤ', atk: 9000, type: 'creature', desc: '全体攻撃・1/2で自爆' },
    { id: 28, name: 'パスワード＆コイン', atk: 1000, type: 'creature', desc: '相手攻撃1/2で失敗・優先標的' },
    { id: 29, name: '血の海', atk: 2000, type: 'creature', desc: '相手攻撃力-3000' },
    { id: 30, name: '呪いのピアノ', atk: 0, type: 'magic', desc: '相手攻撃力-2000 (自ターン+次相手ターン)' }
];

// ============================================================
// ゲーム状態
// ============================================================
const MAX_LIFE = 40000;
const DECK_SIZE = 30;

let game = {
    playerDeck: [],
    enemyDeck: [],
    playerHand: [],
    enemyHand: [],
    playerField: null,    // カードオブジェクト
    enemyField: null,
    playerLife: MAX_LIFE,
    enemyLife: MAX_LIFE,
    turn: 0,              // 0=player, 1=enemy
    phase: 'draw',        // draw, main, battle, end
    turnCount: 0,
    gameOver: false,
    selectedHandIndex: -1,
    luckyDrawPending: false,
    usedAttackThisTurn: false,
    enemySkipNextTurn: false,
    curseActive: false,   // 呪いのピアノ効果
    curseTurns: 0,
    bloodSeaActive: false,
    // 特殊フラグ
    kennyInGrave: false,
    // ログ
    log: []
};

// ============================================================
// ユーティリティ
// ============================================================
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function cloneCard(card) {
    return { ...card, id: card.id };
}

function createDeck() {
    return shuffle(CARD_DATA.map(c => cloneCard(c)));
}

function drawCard(deck, hand, count = 1) {
    let drawn = 0;
    for (let i = 0; i < count; i++) {
        if (deck.length === 0) break;
        hand.push(deck.pop());
        drawn++;
    }
    return drawn;
}

function getCardAtk(card) {
    if (!card) return 0;
    if (card.type === 'magic') return 0;
    let atk = card.atk || 0;
    // 英雄
    if (card.id === 22) {
        if (Math.random() < 0.5) atk = 6000;
    }
    return atk;
}

// ============================================================
// ゲーム初期化
// ============================================================
function initGame() {
    game.playerDeck = createDeck();
    game.enemyDeck = createDeck();
    game.playerHand = [];
    game.enemyHand = [];
    game.playerField = null;
    game.enemyField = null;
    game.playerLife = MAX_LIFE;
    game.enemyLife = MAX_LIFE;
    game.turn = 0;
    game.phase = 'draw';
    game.turnCount = 0;
    game.gameOver = false;
    game.selectedHandIndex = -1;
    game.usedAttackThisTurn = false;
    game.enemySkipNextTurn = false;
    game.curseActive = false;
    game.curseTurns = 0;
    game.bloodSeaActive = false;
    game.kennyInGrave = false;
    game.log = [];

    // 先攻後攻ランダム
    game.turn = Math.random() < 0.5 ? 0 : 1;

    // 各5枚ドロー
    drawCard(game.playerDeck, game.playerHand, 5);
    drawCard(game.enemyDeck, game.enemyHand, 5);

    addLog(`=== ゲーム開始 ===`);
    addLog(game.turn === 0 ? 'あなたが先攻です！' : 'コンピューターが先攻です！');

    // 敵が先攻なら、敵ターンに進む（ただし最初のドローはなし？ルール: 最初のターンはドローなし？ → 普通にドローありとする）
    if (game.turn === 1) {
        // コンピューターの最初のドロー
        executeEnemyTurn();
    } else {
        game.phase = 'draw';
        updateUI();
    }
}

// ============================================================
// ログ
// ============================================================
function addLog(msg, cls = '') {
    const el = document.getElementById('logArea');
    const div = document.createElement('div');
    div.innerHTML = msg;
    if (cls) div.className = cls;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    game.log.push(msg);
}

// ============================================================
// プレイヤードロー
// ============================================================
function playerDraw() {
    if (game.gameOver || game.turn !== 0) return;
    if (game.playerDeck.length === 0) {
        addLog('⚠️ 山札がありません！');
        checkDeckOut();
        return;
    }
    // ラッキードロー判定 (1/3)
    let count = 1;
    if (Math.random() < 1/3) {
        count = 2;
        addLog('🍀 ラッキードロー！ 2枚引きます！', 'highlight');
    } else {
        addLog('1枚ドローしました。');
    }
    const drawn = drawCard(game.playerDeck, game.playerHand, count);
    if (drawn < count) {
        addLog('⚠️ 山札が足りませんでした');
    }
    game.phase = 'main';
    updateUI();
    checkDeckOut();
}

// ============================================================
// 手札からフィールドに出す (召喚)
// ============================================================
function playCardFromHand(index) {
    if (game.gameOver || game.turn !== 0) return;
    if (game.phase !== 'main') {
        addLog('メインフェイズではありません');
        return;
    }
    if (index < 0 || index >= game.playerHand.length) return;
    const card = game.playerHand[index];
    if (!card) return;

    // フィールドに既にカードがある場合 (攻撃カードは1体まで)
    if (card.type === 'creature') {
        if (game.playerField) {
            addLog('⚠️ フィールドに既にカードがあります。');
            return;
        }
        // フィールドに出せる
        game.playerField = game.playerHand.splice(index, 1)[0];
        addLog(`🃏 ${game.playerField.name} をフィールドに召喚しました！`);
        // 戦士 (id=18) は即時攻撃可能
        if (game.playerField.id === 18) {
            addLog('⚡ 戦士の効果: 即時攻撃！');
            // 即座に攻撃処理 (バトルフェイズ扱い)
            performPlayerAttack();
        }
        game.phase = 'main';
        updateUI();
        return;
    }

    // 魔法カード
    if (card.type === 'magic') {
        // 魔法カードは何枚でも使える (手札から直接使用)
        const magicCard = game.playerHand.splice(index, 1)[0];
        addLog(`📜 魔法カード「${magicCard.name}」を使用！`);
        applyMagicEffect(magicCard);
        // 魔法カードは墓地へ (効果処理内で山札戻し処理あり)
        updateUI();
        checkDeckOut();
        return;
    }

    addLog('このカードは使用できません');
}

// ============================================================
// 魔法効果処理
// ============================================================
function applyMagicEffect(card) {
    const id = card.id;
    // 本 (19): 相手の手札を一枚奪う
    if (id === 19) {
        if (game.enemyHand.length === 0) {
            addLog('相手の手札は空です');
            // 1/2で山札戻し
            if (Math.random() < 0.5) {
                game.playerDeck.push(card);
                shuffle(game.playerDeck);
                addLog('「本」は山札の下に戻りました');
            }
            return;
        }
        const idx = Math.floor(Math.random() * game.enemyHand.length);
        const stolen = game.enemyHand.splice(idx, 1)[0];
        game.playerHand.push(stolen);
        addLog(`🔮 相手の手札から「${stolen.name}」を奪いました！`);
        // 1/2で山札戻し
        if (Math.random() < 0.5) {
            game.playerDeck.push(card);
            shuffle(game.playerDeck);
            addLog('「本」は山札の下に戻りました');
        }
        return;
    }

    // 不死身 (21): 墓地のケニーをフィールドに出す
    if (id === 21) {
        if (game.kennyInGrave) {
            // ケニーをフィールドに出す (墓地から復活)
            const kennyCard = CARD_DATA.find(c => c.id === 6);
            if (kennyCard) {
                if (game.playerField) {
                    addLog('⚠️ フィールドが埋まっています');
                } else {
                    game.playerField = cloneCard(kennyCard);
                    game.kennyInGrave = false;
                    addLog('🧟 ケニーが墓地から復活しました！');
                }
            }
        } else {
            addLog('墓地にケニーはいません');
        }
        if (Math.random() < 0.5) {
            game.playerDeck.push(card);
            shuffle(game.playerDeck);
            addLog('「不死身」は山札の下に戻りました');
        }
        return;
    }

    // 念力 (26): 相手の手札を公開
    if (id === 26) {
        if (game.enemyHand.length === 0) {
            addLog('相手の手札は空です');
        } else {
            const names = game.enemyHand.map(c => c.name).join(', ');
            addLog(`👁️ 相手の手札: ${names}`);
        }
        // 魔法は墓地へ (戻しなし)
        return;
    }

    // 呪いのピアノ (30)
    if (id === 30) {
        game.curseActive = true;
        game.curseTurns = 2; // 自分のターン+次の相手ターン
        addLog('🎹 呪いのピアノ: 相手の攻撃力が-2000！');
        return;
    }

    addLog(`魔法「${card.name}」を使用しました。`);
}

// ============================================================
// プレイヤー攻撃
// ============================================================
function performPlayerAttack() {
    if (game.gameOver || game.turn !== 0) return;
    if (game.usedAttackThisTurn) {
        addLog('⚠️ このターンは既に攻撃しました');
        return;
    }
    if (!game.playerField) {
        addLog('⚠️ フィールドにカードがありません');
        return;
    }
    if (game.playerField.type === 'magic') {
        addLog('魔法カードは攻撃できません');
        return;
    }

    // 攻撃力計算
    let atk = getCardAtk(game.playerField);
    let enemyAtk = game.enemyField ? getCardAtk(game.enemyField) : 0;

    // 血の海効果 (相手の攻撃力-3000)
    if (game.playerField && game.playerField.id === 29) {
        // 血の海がフィールドにいる場合、相手攻撃力-3000
        if (game.enemyField) {
            enemyAtk -= 3000;
            if (enemyAtk < 0) enemyAtk = 0;
        }
        addLog('🌊 血の海: 相手の攻撃力-3000');
    }

    // 呪いのピアノ効果 (相手攻撃力-2000)
    if (game.curseActive) {
        if (game.enemyField) {
            enemyAtk -= 2000;
            if (enemyAtk < 0) enemyAtk = 0;
        }
        game.curseTurns--;
        if (game.curseTurns <= 0) game.curseActive = false;
        addLog('🎹 呪いの効果: 相手攻撃力-2000');
    }

    // サタン (25) 攻撃の代わりに手札を墓地へ
    if (game.playerField.id === 25) {
        if (game.enemyHand.length > 0) {
            const idx = Math.floor(Math.random() * game.enemyHand.length);
            const discarded = game.enemyHand.splice(idx, 1)[0];
            addLog(`😈 サタン: 相手の手札「${discarded.name}」を墓地に送った！`);
        } else {
            addLog('相手の手札は空です');
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // ゴースト (23) 賭け
    if (game.playerField.id === 23) {
        if (game.enemyField) {
            if (Math.random() < 0.5) {
                const removed = game.enemyField;
                game.enemyField = null;
                addLog(`👻 ゴーストの賭け成功！ ${removed.name} を墓地に送った！`);
                // 氷 (24) 効果: 相手カードを墓地に送れたら次ターンスキップ
                if (removed.id === 24) {
                    // これは相手のカードが氷の場合の処理
                }
                if (game.playerField.id === 24) {
                    game.enemySkipNextTurn = true;
                    addLog('❄️ 氷の効果: 相手の次のターンをスキップ！');
                }
            } else {
                addLog('👻 ゴーストの賭けに失敗...');
            }
        } else {
            addLog('相手のフィールドにカードがありません');
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // クイヤ (27) 全体攻撃・自爆リスク
    if (game.playerField.id === 27) {
        let dmg = atk;
        if (Math.random() < 0.5) {
            // 自分に全体攻撃
            game.playerLife -= dmg;
            addLog(`💥 クイヤ暴走！ 自分に${dmg}ダメージ！`, 'danger');
            if (game.playerLife <= 0) {
                game.playerLife = 0;
                game.gameOver = true;
                addLog('💀 あなたは敗北しました...', 'danger');
                updateUI();
                return;
            }
        } else {
            // 相手に全体攻撃
            game.enemyLife -= dmg;
            addLog(`🔥 クイヤの全体攻撃！ ${dmg}ダメージ！`);
            if (game.enemyLife <= 0) {
                game.enemyLife = 0;
                game.gameOver = true;
                addLog('🎉 あなたの勝利です！', 'highlight');
                updateUI();
                return;
            }
        }
        // フィールドからクイヤを墓地へ (自爆含む)
        game.playerField = null;
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // 通常攻撃
    if (!game.enemyField) {
        // 相手フィールドがない場合、直接ライフにダメージ
        game.enemyLife -= atk;
        addLog(`💢 ${game.playerField.name} の直接攻撃！ ${atk}ダメージ！`);
        if (game.enemyLife <= 0) {
            game.enemyLife = 0;
            game.gameOver = true;
            addLog('🎉 あなたの勝利です！', 'highlight');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }

    // 相手フィールドあり
    if (atk > enemyAtk) {
        // 相手カード破壊、差ダメージ
        const dmg = atk - enemyAtk;
        const enemyCard = game.enemyField;
        game.enemyField = null;
        game.enemyLife -= dmg;
        addLog(`⚔️ ${game.playerField.name} が ${enemyCard.name} を破壊！ ${dmg}ダメージ！`);
        // 氷 (24) 効果: 相手カードを破壊したら次ターンスキップ
        if (game.playerField.id === 24) {
            game.enemySkipNextTurn = true;
            addLog('❄️ 氷の効果: 相手の次のターンをスキップ！');
        }
        if (game.enemyLife <= 0) {
            game.enemyLife = 0;
            game.gameOver = true;
            addLog('🎉 あなたの勝利です！', 'highlight');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    } else if (atk < enemyAtk) {
        // 自分のカードが破壊される
        const myCard = game.playerField;
        const dmg = enemyAtk - atk;
        game.playerField = null;
        game.playerLife -= dmg;
        addLog(`💥 ${myCard.name} が ${game.enemyField.name} に敗れた！ ${dmg}ダメージ！`, 'danger');
        if (game.playerLife <= 0) {
            game.playerLife = 0;
            game.gameOver = true;
            addLog('💀 あなたは敗北しました...', 'danger');
            updateUI();
            return;
        }
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    } else {
        // 相打ち
        const myCard = game.playerField;
        const enemyCard = game.enemyField;
        game.playerField = null;
        game.enemyField = null;
        addLog(`💥 ${myCard.name} と ${enemyCard.name} は相打ち！`);
        game.usedAttackThisTurn = true;
        updateUI();
        return;
    }
}

// ============================================================
// プレイヤーターン終了
// ============================================================
function endPlayerTurn() {
    if (game.gameOver || game.turn !== 0) return;
    game.turn = 1;
    game.phase = 'draw';
    game.usedAttackThisTurn = false;
    addLog('--- 相手のターン ---');
    updateUI();
    // 相手ターン実行 (少し遅延)
    setTimeout(() => {
        if (!game.gameOver && game.turn === 1) {
            executeEnemyTurn();
        }
    }, 500);
}

// ============================================================
// コンピューターのターン
// ============================================================
function executeEnemyTurn() {
    if (game.gameOver) return;
    if (game.enemySkipNextTurn) {
        game.enemySkipNextTurn = false;
        addLog('⏭️ 相手はスキップ！');
        game.turn = 0;
        game.phase = 'draw';
        updateUI();
        return;
    }

    // ドロー
    if (game.enemyDeck.length === 0) {
        addLog('⚠️ 相手の山札が切れました');
        game.gameOver = true;
        addLog('🎉 あなたの勝利！ (山札切れ)', 'highlight');
        updateUI();
        return;
    }
    let drawCount = 1;
    if (Math.random() < 1/3) drawCount = 2;
    drawCard(game.enemyDeck, game.enemyHand, drawCount);
    addLog(`👾 相手が${drawCount}枚ドローしました`);

    // メインフェイズ: カードを出す
    if (!game.enemyField && game.enemyHand.length > 0) {
        // クリーチャーカードを探す
        let creatureIdx = -1;
        for (let i = 0; i < game.enemyHand.length; i++) {
            if (game.enemyHand[i].type === 'creature') {
                creatureIdx = i;
                break;
            }
        }
        if (creatureIdx >= 0) {
            const card = game.enemyHand.splice(creatureIdx, 1)[0];
            game.enemyField = card;
            addLog(`👾 相手が ${card.name} を召喚しました`);
        } else {
            // 魔法カードがあれば使う (簡易)
            for (let i = 0; i < game.enemyHand.length; i++) {
                if (game.enemyHand[i].type === 'magic') {
                    const magic = game.enemyHand.splice(i, 1)[0];
                    addLog(`👾 相手が魔法「${magic.name}」を使用`);
                    // 簡易魔法効果 (敵用)
                    if (magic.id === 19) { // 本
                        if (game.playerHand.length > 0) {
                            const idx = Math.floor(Math.random() * game.playerHand.length);
                            const stolen = game.playerHand.splice(idx, 1)[0];
                            game.enemyHand.push(stolen);
                            addLog(`👾 相手が「${stolen.name}」を奪った！`);
                        }
                    } else if (magic.id === 21) { // 不死身
                        // ケニーをフィールドに (簡易)
                    } else if (magic.id === 26) {
                        // 念力: 公開
                    } else if (magic.id === 30) {
                        // 呪いのピアノ
                        game.curseActive = true;
                        game.curseTurns = 2;
                        addLog('🎹 相手が呪いのピアノを発動！');
                    }
                    break;
                }
            }
        }
    }

    // 攻撃フェイズ
    if (game.enemyField && game.enemyField.type === 'creature' && !game.gameOver) {
        // パスワード＆コイン (28) チェック
        let canAttack = true;
        if (game.enemyField.id === 28) {
            // 相手の攻撃時に1/2で攻撃できなくなる
            if (Math.random() < 0.5) {
                canAttack = false;
                addLog('🔒 パスワード＆コインの効果で攻撃失敗！');
            }
        }
        // 血の海 (29) 相手攻撃力-3000
        let enemyAtk = getCardAtk(game.enemyField);
        if (game.playerField && game.playerField.id === 29) {
            enemyAtk -= 3000;
            if (enemyAtk < 0) enemyAtk = 0;
        }
        if (game.curseActive) {
            enemyAtk -= 2000;
            if (enemyAtk < 0) enemyAtk = 0;
            game.curseTurns--;
            if (game.curseTurns <= 0) game.curseActive = false;
        }

        if (canAttack && enemyAtk > 0) {
            let playerAtk = game.playerField ? getCardAtk(game.playerField) : 0;
            // 相手の攻撃処理
            if (!game.playerField) {
                game.playerLife -= enemyAtk;
                addLog(`👾 相手の直接攻撃！ ${enemyAtk}ダメージ！`, 'danger');
                if (game.playerLife <= 0) {
                    game.playerLife = 0;
                    game.gameOver = true;
                    addLog('💀 あなたは敗北しました...', 'danger');
                    updateUI();
                    return;
                }
            } else {
                if (enemyAtk > playerAtk) {
                    game.playerField = null;
                    game.playerLife -= (enemyAtk - playerAtk);
                    addLog(`👾 相手があなたのカードを破壊！ ${enemyAtk - playerAtk}ダメージ！`, 'danger');
                    if (game.playerLife <= 0) {
                        game.playerLife = 0;
                        game.gameOver = true;
                        addLog('💀 あなたは敗北しました...', 'danger');
                        updateUI();
                        return;
                    }
                } else if (enemyAtk < playerAtk) {
                    game.enemyField = null;
                    addLog(`⚔️ あなたのカードが相手を撃退！`);
                } else {
                    game.playerField = null;
                    game.enemyField = null;
                    addLog(`💥 相打ち！`);
                }
            }
        }
    }

    // ターン終了
    game.turn = 0;
    game.phase = 'draw';
    game.usedAttackThisTurn = false;
    addLog('--- あなたのターン ---');
    updateUI();
    checkDeckOut();
}

// ============================================================
// 山札切れチェック
// ============================================================
function checkDeckOut() {
    if (game.playerDeck.length === 0 && game.playerHand.length === 0) {
        game.gameOver = true;
        addLog('💀 あなたの山札と手札がなくなりました... 敗北', 'danger');
        updateUI();
        return;
    }
    if (game.enemyDeck.length === 0 && game.enemyHand.length === 0) {
        game.gameOver = true;
        addLog('🎉 相手の山札と手札がなくなりました！ 勝利！', 'highlight');
        updateUI();
        return;
    }
}

// ============================================================
// UI更新
// ============================================================
function updateUI() {
    document.getElementById('lifePlayer').textContent = game.playerLife;
    document.getElementById('lifeEnemy').textContent = game.enemyLife;
    document.getElementById('deckPlayer').textContent = game.playerDeck.length;
    document.getElementById('deckEnemy').textContent = game.enemyDeck.length;
    document.getElementById('handPlayer').textContent = game.playerHand.length;
    document.getElementById('handEnemy').textContent = game.enemyHand.length;

    // ターン情報
    const turnText = game.gameOver ? 'ゲーム終了' : (game.turn === 0 ? 'あなたのターン' : 'コンピューターのターン');
    document.getElementById('turnInfo').textContent = `ターン: ${turnText}`;

    // プレイヤーフィールド
    const pf = document.getElementById('playerField');
    if (game.playerField) {
        const c = game.playerField;
        pf.innerHTML = `<div class="card creature"><div class="name">${c.name}</div><div class="atk">⚔️ ${getCardAtk(c)}</div><div class="info">${c.desc || ''}</div></div>`;
    } else {
        pf.innerHTML = 'なし';
    }

    // 敵フィールド
    const ef = document.getElementById('enemyField');
    if (game.enemyField) {
        const c = game.enemyField;
        let atk = getCardAtk(c);
        if (game.curseActive) atk = Math.max(0, atk - 2000);
        if (game.playerField && game.playerField.id === 29) atk = Math.max(0, atk - 3000);
        ef.innerHTML = `<div class="card creature"><div class="name">${c.name}</div><div class="atk">⚔️ ${atk}</div><div class="info">${c.desc || ''}</div></div>`;
    } else {
        ef.innerHTML = 'なし';
    }

    // プレイヤー手札
    const ph = document.getElementById('playerHand');
    ph.innerHTML = '';
    game.playerHand.forEach((card, idx) => {
        const div = document.createElement('div');
        div.className = `card ${card.type === 'magic' ? 'magic' : 'creature'}`;
        div.innerHTML = `<div class="name">${card.name}</div><div class="atk">${card.type === 'creature' ? '⚔️ '+getCardAtk(card) : '📜'}</div><div class="info">${card.desc || ''}</div>`;
        if (!game.gameOver && game.turn === 0 && game.phase === 'main') {
            div.style.cursor = 'pointer';
            div.onclick = () => playCardFromHand(idx);
        }
        ph.appendChild(div);
    });

    // ボタン制御
    document.getElementById('btnDraw').disabled = (game.gameOver || game.turn !== 0 || game.phase !== 'draw');
    document.getElementById('btnAttack').disabled = (game.gameOver || game.turn !== 0 || !game.playerField || game.usedAttackThisTurn || game.playerField.type === 'magic');
    document.getElementById('btnEndTurn').disabled = (game.gameOver || game.turn !== 0);
}

// ============================================================
// イベントバインド
// ============================================================
document.getElementById('btnDraw').addEventListener('click', playerDraw);
document.getElementById('btnAttack').addEventListener('click', performPlayerAttack);
document.getElementById('btnEndTurn').addEventListener('click', endPlayerTurn);
document.getElementById('btnRestart').addEventListener('click', () => {
    initGame();
});

// 初期化
initGame();
</script>
