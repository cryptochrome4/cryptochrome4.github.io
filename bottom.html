<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギリシャ証券 - フッター</title>
<style>
  /* ===== 森風ベース ===== */
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root {
    --forest-deep: #1a2e1a;
    --forest: #2d4a2d;
    --forest-mid: #3e5e3e;
    --moss: #5a7a4a;
    --moss-light: #7a9a5a;
    --leaf: #4a6b3a;
    --bark: #4a3520;
    --bark-light: #6a5030;
    --earth: #2a2018;
    --cream: #e8e0c8;
    --cream-dim: #b8b098;
    --sun: #d4a84a;
    --sun-soft: #c8a860;
    --mist: #d8e0d0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Kaku Gothic New', 'Shippori Mincho', sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(90,122,74,0.15), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(74,53,32,0.2), transparent 50%),
      linear-gradient(180deg, #1e3320, #16281a);
    color: var(--cream);
    min-height: 100vh;
    padding: 40px 20px;
  }

  footer.forest-footer {
    max-width: 1200px;
    margin: 0 auto;
    background:
      radial-gradient(circle at 10% 5%, rgba(122,154,90,0.12), transparent 40%),
      radial-gradient(circle at 90% 95%, rgba(74,53,32,0.25), transparent 45%),
      linear-gradient(180deg, #24381f, #1a2a18);
    border-radius: 18px;
    padding: 40px 36px 30px;
    box-shadow:
      inset 0 0 60px rgba(0,0,0,0.5),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 0 1px rgba(122,154,90,0.2);
    position: relative;
    overflow: hidden;
  }

  /* 木の葉のテクスチャ */
  footer.forest-footer::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(122,154,90,0.08) 0%, transparent 3%),
      radial-gradient(ellipse at 45% 60%, rgba(122,154,90,0.06) 0%, transparent 3%),
      radial-gradient(ellipse at 75% 30%, rgba(122,154,90,0.07) 0%, transparent 3%),
      radial-gradient(ellipse at 30% 85%, rgba(122,154,90,0.05) 0%, transparent 3%),
      radial-gradient(ellipse at 85% 75%, rgba(122,154,90,0.06) 0%, transparent 3%);
    pointer-events: none;
  }

  /* 木の幹のような縦線 */
  footer.forest-footer::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(74,53,32,0.04) 80px, rgba(74,53,32,0.04) 82px);
    pointer-events: none;
  }

  .footer-inner {
    position: relative;
    z-index: 1;
  }

  /* ===== セクション見出し ===== */
  .section {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px dashed rgba(122,154,90,0.3);
  }
  .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .section-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    color: var(--sun);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.5), 0 0 12px rgba(212,168,74,0.3);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 24px;
    background: linear-gradient(180deg, var(--moss-light), var(--leaf));
    border-radius: 3px;
    box-shadow: 0 0 8px rgba(122,154,90,0.5);
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(122,154,90,0.4), transparent);
    margin-left: 12px;
  }

  /* ===== 経済カレンダー ===== */
  .cal-header {
    display: grid;
    grid-template-columns: 90px 60px 90px 1fr 90px 90px 90px;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.35);
    border-radius: 8px 8px 0 0;
    border: 1px solid rgba(122,154,90,0.25);
    border-bottom: none;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--moss-light);
    font-weight: 700;
  }
  .cal-header span { text-align: center; }

  .cal-row {
    display: grid;
    grid-template-columns: 90px 60px 90px 1fr 90px 90px 90px;
    gap: 8px;
    padding: 12px 14px;
    background: rgba(20,32,18,0.6);
    border: 1px solid rgba(122,154,90,0.15);
    border-top: none;
    font-size: 0.82rem;
    color: var(--cream);
    transition: background 0.2s;
    cursor: pointer;
  }
  .cal-row:last-child { border-radius: 0 0 8px 8px; }
  .cal-row:hover { background: rgba(45,74,45,0.7); }
  .cal-row span { text-align: center; }
  .cal-row span.indicator { text-align: left; }
  .cal-row .val-prev { color: var(--cream-dim); }
  .cal-row .val-forecast { color: var(--sun-soft); }
  .cal-row .val-result { color: var(--moss-light); font-weight: 700; }

  @media (max-width: 900px) {
    .cal-header, .cal-row {
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .cal-header span:nth-child(n+3),
    .cal-row span:nth-child(n+3) { display: none; }
    .cal-header span:nth-child(1)::after { content: ' / 時刻'; }
    .cal-header span:nth-child(2)::after { content: ' / 指標'; }
    .cal-row span:nth-child(1) { grid-column: 1; }
    .cal-row span:nth-child(2) { grid-column: 2; }
    .cal-row span.indicator { grid-column: 1 / -1; text-align: left; font-weight: 700; color: var(--sun); }
  }

  /* ===== リンクグリッド ===== */
  .link-grid {
    display: grid;
    gap: 8px;
    margin-bottom: 14px;
  }
  .link-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .link-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .link-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

  @media (max-width: 760px) {
    .link-grid.cols-3,
    .link-grid.cols-2,
    .link-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .link-grid.cols-3,
    .link-grid.cols-2,
    .link-grid.cols-4 { grid-template-columns: 1fr; }
  }

  .link-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(30,48,28,0.7);
    border: 1px solid rgba(122,154,90,0.25);
    border-radius: 8px;
    padding: 11px 16px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--cream);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .link-btn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--moss-light), var(--leaf));
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.25s;
  }
  .link-btn:hover {
    background: rgba(58,94,58,0.85);
    border-color: var(--moss-light);
    color: var(--sun);
    padding-left: 22px;
    box-shadow: 0 0 16px rgba(122,154,90,0.25);
  }
  .link-btn:hover::before { transform: scaleY(1); }

  /* ニュース用（横並び細め） */
  .news-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .news-row .link-btn {
    flex: 1 1 120px;
    text-align: center;
    padding: 10px 12px;
    font-size: 0.82rem;
  }
  .news-row .link-btn:hover { padding-left: 12px; padding-right: 12px; }

  /* ===== お問合せ ===== */
  .contact-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (max-width: 480px) {
    .contact-grid { grid-template-columns: 1fr; }
  }

  /* ===== コピーライト ===== */
  .copyright {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(122,154,90,0.2);
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    color: var(--cream-dim);
    font-family: 'Shippori Mincho', serif;
  }

  /* ===== モーダル ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,20,10,0.85);
    backdrop-filter: blur(4px);
    z-index: 500;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background:
      radial-gradient(circle at 20% 15%, rgba(122,154,90,0.15), transparent 50%),
      linear-gradient(180deg, #24381f, #1a2a18);
    border: 2px solid var(--moss);
    border-radius: 14px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      0 0 50px rgba(122,154,90,0.35),
      10px 10px 0 rgba(0,0,0,0.4);
    animation: modalIn 0.25s ease;
    position: relative;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    padding: 18px 24px;
    background: linear-gradient(180deg, #2d4a2d, #1e3320);
    border-bottom: 2px solid var(--moss);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 2;
    border-radius: 12px 12px 0 0;
  }
  .modal-header h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--sun);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  }
  .modal-close {
    background: var(--bark);
    color: var(--cream);
    border: 1px solid var(--bark-light);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: var(--moss); transform: rotate(90deg); }

  .modal-body { padding: 22px 24px 28px; }

  .modal-body .meaning { margin-bottom: 18px; }
  .modal-body .meaning h3 {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--moss-light);
    margin-bottom: 8px;
    font-weight: 700;
    text-transform: uppercase;
    border-left: 3px solid var(--sun);
    padding-left: 8px;
  }
  .modal-body .meaning p {
    font-size: 0.92rem;
    line-height: 1.85;
    color: var(--cream);
  }
  .modal-body .soccer {
    background: rgba(0,0,0,0.3);
    border: 1px dashed var(--moss-light);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .modal-body .soccer h3 {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--sun);
    margin-bottom: 8px;
    font-weight: 700;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-body .soccer p {
    font-size: 0.92rem;
    line-height: 1.85;
    color: var(--cream);
  }
</style>
</head>
<body>

<footer class="forest-footer">
  <div class="footer-inner">

    <!-- ===== 朝イチ情報 ===== -->

    <!-- ===== ニュース ===== -->

<script>
/* ============================================================
   用語解説データ
   ============================================================ */
const TERMS = {

  /* --- 経済カレンダー --- */
  "経済カレンダー": {
    meaning: "経済指標の発表予定や決算発表日をカレンダー形式で確認できる機能。いつ重要な発表があるか事前に把握できる。",

  /* --- 経済指標・決算 --- */
  "経済指標(週間)": {
    meaning: "1週間分の経済指標の発表予定をまとめたもの。週の相場見通しを立てるのに役立つ。",

  "経済指標(月間)": {

    soccer: "国内リーグの成績発表スケジュール。各チームの結果がいつわかるか。"
  },
  "外国株式決算発表銘柄一覧": {
    meaning: "海外上場企業の決算発表予定を一覧にしたもの。米国株などの決算スケジュール。",
    soccer: "海外リーグの成績発表スケジュール。海外チームの結果がいつわかるか。"
  },

/* ============================================================
   モーダル制御
   ============================================================ */
const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalMeaning = document.getElementById('modalMeaning');
const modalSoccer = document.getElementById('modalSoccer');
const modalClose = document.getElementById('modalClose');

function openModal(term) {
  const data = TERMS[term];
  modalTitle.textContent = term;
  if (data) {
    modalMeaning.textContent = data.meaning;
    modalSoccer.textContent = data.soccer;
  } else {
    modalMeaning.textContent = "この用語の解説は準備中です。";
    modalSoccer.textContent = "サッカー例えも準備中です。";
  }
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================================
   全 data-term 要素にモーダル紐付け
   ============================================================ */
document.querySelectorAll('[data-term]').forEach(el => {
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    openModal(el.dataset.term);
  });
});
