    knowledgeData.sort((a, b) => b.score - a.score);

    const grid = document.getElementById('knowledgeGrid');

    // 150件を超えている場合は先頭150件を使用（念のため）
    const itemsToRender = knowledgeData.slice(0, 150);

    itemsToRender.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'knowledge-item';

      // ヘッダー（タイトルとスコア）
      const headerDiv = document.createElement('div');
      headerDiv.className = 'item-header';

      const titleSpan = document.createElement('span');
      titleSpan.className = 'item-title';
      // 連番を付ける（1から）
      titleSpan.textContent = `${index + 1}. ${item.title}`;

      const scoreSpan = document.createElement('span');
      scoreSpan.className = 'skill-score';
      scoreSpan.textContent = item.score;

      headerDiv.appendChild(titleSpan);
      headerDiv.appendChild(scoreSpan);

      // プログレスバー
      const progressTrack = document.createElement('div');
      progressTrack.className = 'progress-track';
      const progressFill = document.createElement('div');
      progressFill.className = 'progress-fill';
      progressFill.style.width = `${item.score}%`;
      progressTrack.appendChild(progressFill);

      card.appendChild(headerDiv);
      card.appendChild(progressTrack);

      grid.appendChild(card);
    });

    // 統計を動的に更新（オプション）
    const avg = itemsToRender.reduce((sum, item) => sum + item.score, 0) / itemsToRender.length;
    const max = Math.max(...itemsToRender.map(i => i.score));
    const min = Math.min(...itemsToRender.map(i => i.score));

    // 既存の統計を更新
    const statValues = document.querySelectorAll('.stat-value');
    if (statValues.length >= 4) {
      statValues[0].textContent = itemsToRender.length; // 150
      statValues[1].textContent = avg.toFixed(1);
      statValues[2].textContent = max;
      statValues[3].textContent = min;
    }
