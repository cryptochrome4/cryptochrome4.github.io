    <style>
        /* 全体のスタイル設定 */
        body {
            background-color: #0d0626; /* 深い背景色 */
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 縦スクロール用のコンテナ */
        .scroll-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 40px; /* チームごとの間隔 */
            padding-bottom: 100px;
        }

        /* 1つのチームを囲むブロック */
        .team-block {
            background: linear-gradient(135deg, #18113c 0%, #0d0626 100%);
            border: 1px solid #2d245d;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* チームのヘッダー部分 */
        .team-header {
            border-bottom: 2px solid #00ff66; /* ウイイレ風の蛍光グリーン */
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .team-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ff66;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        /* メンバーリストの2列レイアウト（左20、右20） */
        .member-list-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 20px; /* 列間の溝 */
        }

        /* 各列のスタイル */
        .member-column {
            display: flex;
            flex-direction: column;
        }

        /* 入力欄の1行（エクセル風の行） */
        .word-row {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
        }

        .word-row:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.06); /* 縞模様（ゼブラ） */
        }

        /* ポジション欄 (Ω) */
        .pos-badge {
            background-color: #00ff66;
            color: #0d0626;
            font-size: 13px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 2px;
            margin-right: 10px;
            min-width: 28px;
            text-align: center;
        }

        /* テキスト入力フィールド */
        .word-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            padding: 4px;
            outline: none;
            width: 100%;
        }

        .word-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

        <!-- 🖼️ 4枚のカモフラージュ画像レイヤー（初期状態はすべて重なっています） -->
    <!-- お好きな画像ファイル名（cover1.jpg〜4.jpg）や、ネット上の画像URLに書き換えてください -->
    <div id="cover-4" class="camouflage-layer" style="background-image: url('img136pimple.jpg'); z-index: 9995;"></div> <!-- 4枚目（一番下） -->
    <div id="cover-3" class="camouflage-layer" style="background-image: url('img135pimple.jpg'); z-index: 9996;"></div> <!-- 3枚目 -->
    <div id="cover-2" class="camouflage-layer" style="background-image: url('img134china.jpg'); z-index: 9997;"></div> <!-- 2枚目 -->
    <div id="cover-1" class="camouflage-layer" style="background-image: url('img133china.jpg'); z-index: 9998;"></div> <!-- 1枚目（最前面） -->

    <!-- 🕵️‍♂️ 4つの秘密の透明ボタン（すべて画面上の絶対位置に固定、完全に透明です） -->
    <!-- 1. 右上の透明ボタン（1枚目を消す） -->
    <div class="secret-btn" onclick="removeCover(1)" style="top: 0; right: 0; width: 80px; height: 80px;"></div>
    
    <!-- 2. 左中央の透明ボタン（2枚目を消す） -->
    <div class="secret-btn" onclick="removeCover(2)" style="top: 50%; left: 0; transform: translateY(-50%); width: 80px; height: 80px;"></div>
    
    <!-- 3. 右下の透明ボタン（3枚目を消す） -->
    <div class="secret-btn" onclick="removeCover(3)" style="bottom: 0; right: 0; width: 80px; height: 80px;"></div>
    
    <!-- 4. 画面真ん中の透明ボタン（最後の4枚目を消す） -->
    <div class="secret-btn" onclick="removeCover(4)" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px;"></div>

    <!-- 🎨 隠しレイヤーとボタン共通のCSSスタイル -->
    <style>
        .camouflage-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            pointer-events: none; /* 下にある透明ボタンをいつでもクリック可能にする */
            transition: opacity 0.3s ease; /* 消えるときに少しふわっと消える演出 */
        }
        .secret-btn {
            position: fixed;
            background: transparent;
            cursor: default;
            z-index: 10000; /* どの画像よりも常に手前に配置 */
        }
    </style>

    <!-- ⚙️ 各ボタンに対応した画像を1枚ずつ消去するスクリプト -->
    <script>
        function removeCover(num) {
            const currentCover = document.getElementById('cover-' + num);
            if (currentCover) {
                currentCover.style.display = 'none';
            }
        }
    </script>
