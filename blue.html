    <style>
        /* 全体のスタイル設定 */
        body {
            background-color: #0d0626; /* 深い背景色 */
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 縦スクロール用のコンテナ */
        .scroll-container {
            width: 100%;
            max-width: 950px; /* 横幅を少し広げました */
            display: flex;
            flex-direction: column;
            gap: 40px; /* チームごとの間隔 */
            padding-bottom: 100px;
        }

        /* 1つのチームを囲むブロック */
        .team-block {
            background: linear-gradient(135deg, #18113c 0%, #0d0626 100%);
            border: 1px solid #2d245d;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* チームのヘッダー部分 */
        .team-header {
            border-bottom: 2px solid #00ff66; /* ウイイレ風の蛍光グリーン */
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .team-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ff66;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        /* メンバーリストの2列レイアウト（左20、右20） */
        .member-list-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 20px; /* 列間の溝 */
        }

        /* 各列のスタイル */
        .member-column {
            display: flex;
            flex-direction: column;
        }

        /* 単語入力の1行（エクセル風の行） */
        .word-row {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
        }

        .word-row:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.06); /* 縞模様（ゼブラ） */
        }

        /* ポジション欄 (Ω) */
        .pos-badge {
            background-color: #00ff66;
            color: #0d0626;
            font-size: 13px; /* Ωが見えやすいように少し大きくしました */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 2px;
            margin-right: 10px;
            min-width: 28px;
            text-align: center;
        }

        /* テキスト入力フィールド共通 */
        .word-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            padding: 4px;
            outline: none;
            width: 100%;
        }

        .word-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* 英語欄の調整 */
        .input-en {
            font-weight: 500;
        }

        /* 日本語欄の調整 */
        .input-ja {
            color: #cccccc;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding-left: 10px;
        }
    </style>
</head>
