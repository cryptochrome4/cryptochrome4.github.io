    <style>
        /* 全局基礎樣式設定 */
        body {
            background-color: #0d0626; 
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 垂直滾動容器調製 */
        .scroll-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 40px; 
            padding-bottom: 100px;
        }

        /* 核心數據區塊模組 */
        .team-block {
            background: linear-gradient(135deg, #18113c 0%, #0d0626 100%);
            border: 1px solid #2d245d;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 區塊頂部標題列 */
        .team-header {
            border-bottom: 2px solid #00ff66; 
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .team-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ff66;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        /* 雙列網格版面配置（左20、右20） */
        .member-list-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 20px; 
        }

        /* 單列數據流控制 */
        .member-column {
            display: flex;
            flex-direction: column;
        }

        /* 輸入列基礎樣式 */
        .word-row {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
        }

        .word-row:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.06); 
        }

        /* 標記符號樣式 (Ω) */
        .pos-badge {
            background-color: #00ff66;
            color: #0d0626;
            font-size: 13px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 2px;
            margin-right: 10px;
            min-width: 28px;
            text-align: center;
        }

        /* 文字輸入框核心控制器 */
        .word-input {
            background: transparent;
            border: none;
            color: #ff0000;
            font-size: 14px;
            padding: 4px;
            outline: none;
            width: 100%;
        }

        .word-input::placeholder {
            color: rgba(255, 255, 255, 1.0);
        }
    </style>
</head>

        <!-- ⚙️ 核心邏輯腳本（全自動排號保存・ID共存修正版） -->
    <script>
        // 逐張消除對應圖片
        function removeCover(num) {
            const currentCover = document.getElementById('cover-' + num);
            if (currentCover) {
                currentCover.style.display = 'none';
            }
        }

        // 頁面加載完成時，自動讀取先前保存的數據
        window.addEventListener('DOMContentLoaded', () => {
            // 💡 自動按順序計算畫面上所有的輸入框，並自動分配唯一的內部編報
            const saveInputs = document.querySelectorAll('.save-input');
            saveInputs.forEach((input, index) => {
                // 自動將上算出的序號設為保存依據（不會與已存在的id屬性衝突，直接相容）
                const autoId = 'auto-id-' + index;
                
                // 載入已保存的數據
                const savedValue = localStorage.getItem(autoId);
                if (savedValue !== null) {
                    input.value = savedValue;
                }
                
                // 監聽輸入事件：當內容變更時，立即同步寫入本地硬碟保存
                input.addEventListener('input', (e) => {
                    localStorage.setItem(autoId, e.target.value);
                });
            });
        });
    </script>
