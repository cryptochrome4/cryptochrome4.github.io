            // ---------- 毒水しぶき ----------
            function spawnPoisonSplash() {
                if (currentStage !== 'water') return;
                var x = Math.random() * 780 + 10;
                game.poisonSplashes.push({
                    x: x, y: 370, vy: -2.5 - Math.random() * 2,
                    width: 12, height: 16
                });
            }

            // ---------- 弓矢 ----------
            function spawnArrow(fromEnemy) {
                var m = game.mario;
                var dx = (m.x + m.w/2) - (fromEnemy.x + fromEnemy.w/2);
                var dy = (m.y + m.h/2) - (fromEnemy.y + fromEnemy.h/2);
                var dist = Math.sqrt(dx*dx + dy*dy) || 1;
                var speed = 3.2;
                game.arrows.push({
                    x: fromEnemy.x + fromEnemy.w/2,
                    y: fromEnemy.y + fromEnemy.h/2,
                    vx: (dx / dist) * speed, vy: (dy / dist) * speed,
                    w: 18, h: 4, life: 200
                });
            }

            // ---------- 弾丸 ----------
            function spawnBullet(fromEnemy) {
                var m = game.mario;
                var dx = (m.x + m.w/2) - (fromEnemy.x + fromEnemy.w/2);
                var dy = (m.y + m.h/2) - (fromEnemy.y + fromEnemy.h/2);
                var dist = Math.sqrt(dx*dx + dy*dy) || 1;
                var speed = 5.5;
                game.bullets.push({
                    x: fromEnemy.x + fromEnemy.w/2,
                    y: fromEnemy.y + fromEnemy.h/2,
                    vx: (dx / dist) * speed, vy: (dy / dist) * speed,
                    w: 10, h: 6, life: 150, trail: []
                });
            }

            // ---------- 溶岩柱 ----------
            function spawnLavaColumn() {
                if (currentStage !== 'magma') return;
                var x = 60 + Math.random() * 680;
                game.lavaColumns.push({
                    x: x, y: 370, w: 22, h: 0,
                    maxH: 90 + Math.random() * 80,
                    vy: -3.5, growth: 3.5, active: true,
                    life: 120, phase: 'up'
                });
            }

            // ---------- クッパの攻撃 ----------
            function bowserAttack() {
                if (currentStage !== 'magma' || !game.bowser || !game.bowser.alive) return;
                var b = game.bowser;
                var m = game.mario;
                var dx = (m.x + m.w/2) - (b.x + b.w/2);
                var dy = (m.y + m.h/2) - (b.y + b.h/2);
                var dist = Math.sqrt(dx*dx + dy*dy) || 1;
                
                if (Math.random() < 0.5) {
                    var tSpeed = 3.6;
                    game.teslas.push({
                        x: b.x, y: b.y + 20,
                        vx: (dx/dist) * tSpeed, vy: (dy/dist) * tSpeed - 1.5,
                        w: 60, h: 26, life: 200,
                        rotation: 0
                    });
                    if (isStreaming) addChatLine("🚗 クッパがテスラを投げた！");
                } else {
                    var rSpeed = 4.2;
                    game.rockets.push({
                        x: b.x, y: b.y + 20,
                        vx: (dx/dist) * rSpeed, vy: (dy/dist) * rSpeed - 1.0,
                        w: 20, h: 50, life: 220,
                        trail: []
                    });
                    if (isStreaming) addChatLine("🚀 クッパがSpaceXを投げた！");
                }
            }

            // ---------- 物理更新 ----------
            function updatePhysics() {
                if (game.gameClear || game.gameOver) return;
                var m = game.mario;
                
                var isIce = (currentStage === 'ice');
                var fr = isIce ? 0.97 : game.friction;
                var accel = isIce ? 3.2 : game.moveSpeed;
                
                if (game.leftPressed) { m.vx = -accel; }
                else if (game.rightPressed) { m.vx = accel; }
                else { m.vx *= fr; if (Math.abs(m.vx) < 0.1) m.vx = 0; }
                if (isIce) {
                    if (m.vx > 5.5) m.vx = 5.5;
                    if (m.vx < -5.5) m.vx = -5.5;
                }
                
                if (game.jumpPressed && m.onGround) {
                    m.vy = game.jumpPower;
                    m.onGround = false;
                    game.jumpPressed = false;
                }
                
                m.vy += game.gravity;
                if (m.vy > 12) m.vy = 12;
                
                var newX = m.x + m.vx;
                for (var i = 0; i < game.platforms.length; i++) {
                    var p = game.platforms[i];
                    if (p.lava) continue;
                    if (newX < p.x + p.w && newX + m.w > p.x && m.y < p.y + p.h && m.y + m.h > p.y) {
                        if (m.vx > 0) { newX = p.x - m.w; } else if (m.vx < 0) { newX = p.x + p.w; }
                        m.vx = 0;
                        break;
                    }
                }
                m.x = newX;
                
                var newY = m.y + m.vy;
                m.onGround = false;
                for (var j = 0; j < game.platforms.length; j++) {
                    var p2 = game.platforms[j];
                    if (p2.lava) continue;
                    if (m.x < p2.x + p2.w && m.x + m.w > p2.x && newY < p2.y + p2.h && newY + m.h > p2.y) {
                        if (m.vy > 0) { 
                            newY = p2.y - m.h; 
                            m.vy = 0; 
                            m.onGround = true; 
                        } else if (m.vy < 0) { 
                            newY = p2.y + p2.h; 
                            m.vy = 0; 
                        }
                        break;
                    }
                }
                m.y = newY;
                
                if (m.x < 0) m.x = 0;
                if (m.x + m.w > 800) m.x = 800 - m.w;
                
                if (currentStage === 'water' && m.y + m.h > 380) { setGameOver(); return; }
                if ((currentStage === 'land' || currentStage === 'desert' || currentStage === 'ice') && m.y > 400) { setGameOver(); return; }
                if (currentStage === 'magma' && m.y + m.h > 370) { setGameOver(); return; }
                
                for (var k = 0; k < game.coins.length; k++) {
                    var coin = game.coins[k];
                    if (coin.collected) continue;
                    if (m.x + m.w > coin.x && m.x < coin.x + coin.w && m.y + m.h > coin.y && m.y < coin.y + coin.h) {
                        coin.collected = true;
                        game.score += 100;
                        updateUI();
                        if (isStreaming) addChatLine("🪙 コインGET！ +100");
                    }
                }
                
                for (var e = 0; e < game.enemies.length; e++) {
                    var enemy = game.enemies[e];
                    if (!enemy.alive) continue;
                    
                    if (enemy.type === 'archer' || enemy.type === 'gunner') {
                        enemy.shootTimer--;
                        if (enemy.shootTimer <= 0) {
                            if (enemy.type === 'archer') spawnArrow(enemy);
                            else if (enemy.type === 'gunner') {
                                spawnBullet(enemy);
                                if (isStreaming) addChatLine("🔫 デザートイーグル発射！");
                            }
                            enemy.shootTimer = (enemy.type === 'gunner') ? 110 + Math.floor(Math.random() * 60) : 90 + Math.floor(Math.random() * 60);
                        }
                    } else {
                        enemy.x += enemy.vx;
                        if (enemy.x < 0) { enemy.x = 0; enemy.vx = Math.abs(enemy.vx); }
                        if (enemy.x + enemy.w > 800) { enemy.x = 800 - enemy.w; enemy.vx = -Math.abs(enemy.vx); }
                    }
                    
                    if (enemy.type === 'walker') {
                        for (var pi = 0; pi < game.platforms.length; pi++) {
                            var pl = game.platforms[pi];
                            if (pl.lava) continue;
                            if (enemy.x + enemy.w > pl.x && enemy.x < pl.x + pl.w &&
                                enemy.y < pl.y + pl.h && enemy.y + enemy.h > pl.y) {
                                if (enemy.vx > 0 && enemy.x + enemy.w >= pl.x && enemy.x < pl.x) {
                                    enemy.vx = -Math.abs(enemy.vx);
                                } else if (enemy.vx < 0 && enemy.x <= pl.x + pl.w && enemy.x + enemy.w > pl.x + pl.w) {
                                    enemy.vx = Math.abs(enemy.vx);
                                }
                            }
                        }
                    }
                    
                    if (m.x + m.w > enemy.x + 4 && m.x < enemy.x + enemy.w - 4 &&
                        m.y + m.h > enemy.y + 4 && m.y < enemy.y + enemy.h - 4) {
                        if (m.vy > 0 && m.y + m.h - enemy.y < 20) {
                            enemy.alive = false;
                            game.score += 200;
                            updateUI();
                            m.vy = -5;
                            if (isStreaming) addChatLine("💥 クリボーを踏んだ！ +200");
                        } else {
                            setGameOver(); return;
                        }
                    }
                }
                
                if (currentStage === 'water') {
                    game.splashTimer++;
                    if (game.splashTimer >= game.splashInterval) {
                        game.splashTimer = 0;
                        spawnPoisonSplash();
                    }
                    for (var s = game.poisonSplashes.length - 1; s >= 0; s--) {
                        var splash = game.poisonSplashes[s];
                        splash.y += splash.vy;
                        splash.vy += 0.08;
                        if (splash.y < 0 || splash.y > 400) {
                            game.poisonSplashes.splice(s, 1);
                            continue;
                        }
                        if (m.x + m.w > splash.x && m.x < splash.x + splash.width &&
                            m.y + m.h > splash.y && m.y < splash.y + splash.height) {
                            setGameOver(); return;
                        }
                    }
                }
                
                if (currentStage === 'desert') {
                    for (var a = game.arrows.length - 1; a >= 0; a--) {
                        var arrow = game.arrows[a];
                        arrow.x += arrow.vx;
                        arrow.y += arrow.vy;
                        arrow.vy += 0.05;
                        arrow.life--;
                        if (arrow.x < -30 || arrow.x > 830 || arrow.y < -30 || arrow.y > 430 || arrow.life <= 0) {
                            game.arrows.splice(a, 1);
                            continue;
                        }
                        if (m.x + m.w > arrow.x && m.x < arrow.x + arrow.w &&
                            m.y + m.h > arrow.y && m.y < arrow.y + arrow.h) {
                            setGameOver(); return;
                        }
                    }
                }
                
                if (currentStage === 'ice') {
                    for (var b = game.bullets.length - 1; b >= 0; b--) {
                        var bullet = game.bullets[b];
                        bullet.trail.push({ x: bullet.x, y: bullet.y });
                        if (bullet.trail.length > 5) bullet.trail.shift();
                        bullet.x += bullet.vx;
                        bullet.y += bullet.vy;
                        bullet.life--;
                        if (bullet.x < -30 || bullet.x > 830 || bullet.y < -30 || bullet.y > 430 || bullet.life <= 0) {
                            game.bullets.splice(b, 1);
                            continue;
                        }
                        if (m.x + m.w > bullet.x && m.x < bullet.x + bullet.w &&
                            m.y + m.h > bullet.y && m.y < bullet.y + bullet.h) {
                            setGameOver(); return;
                        }
                    }
                }
                
                if (currentStage === 'magma') {
                    game.lavaTimer++;
                    if (game.lavaTimer >= game.lavaInterval) {
                        game.lavaTimer = 0;
                        spawnLavaColumn();
                    }
                    for (var l = game.lavaColumns.length - 1; l >= 0; l--) {
                        var lava = game.lavaColumns[l];
                        lava.h += lava.growth;
                        lava.y = 370 - lava.h;
                        lava.life--;
                        if (lava.life <= 0 || lava.h > lava.maxH) {
                            lava.phase = 'down';
                            lava.growth = -lava.growth;
                            if (lava.h <= 0) {
                                game.lavaColumns.splice(l, 1);
                                continue;
                            }
                        }
                        if (lava.phase === 'down' && lava.h <= 0) {
                            game.lavaColumns.splice(l, 1);
                            continue;
                        }
                        if (m.x + m.w > lava.x && m.x < lava.x + lava.w &&
                            m.y + m.h > lava.y && m.y < lava.y + lava.h) {
                            setGameOver(); return;
                        }
                    }
                    
                    if (game.bowser && game.bowser.alive) {
                        game.bowserTimer++;
                        if (game.bowserTimer >= game.bowserInterval) {
                            game.bowserTimer = 0;
                            bowserAttack();
                        }
                        if (game.bowser.hitTimer > 0) game.bowser.hitTimer--;
                    }
                    
                    for (var t = game.teslas.length - 1; t >= 0; t--) {
                        var tesla = game.teslas[t];
                        tesla.x += tesla.vx;
                        tesla.y += tesla.vy;
                        tesla.vy += 0.10;
                        tesla.rotation += 0.05;
                        tesla.life--;
                        if (tesla.x < -80 || tesla.x > 880 || tesla.y < -80 || tesla.y > 480 || tesla.life <= 0) {
                            game.teslas.splice(t, 1);
                            continue;
                        }
                        if (m.x + m.w > tesla.x + 6 && m.x < tesla.x + tesla.w - 6 &&
                            m.y + m.h > tesla.y + 4 && m.y < tesla.y + tesla.h - 4) {
                            setGameOver(); return;
                        }
                    }
                    
                    for (var r = game.rockets.length - 1; r >= 0; r--) {
                        var rocket = game.rockets[r];
                        rocket.trail.push({ x: rocket.x, y: rocket.y });
                        if (rocket.trail.length > 12) rocket.trail.shift();
                        rocket.x += rocket.vx;
                        rocket.y += rocket.vy;
                        rocket.vy += 0.06;
                        rocket.life--;
                        if (rocket.x < -60 || rocket.x > 860 || rocket.y < -60 || rocket.y > 460 || rocket.life <= 0) {
                            game.rockets.splice(r, 1);
                            continue;
                        }
                        if (m.x + m.w > rocket.x + 4 && m.x < rocket.x + rocket.w - 4 &&
                            m.y + m.h > rocket.y + 4 && m.y < rocket.y + rocket.h - 4) {
                            setGameOver(); return;
                        }
                    }
                    
                    if (game.bowser && game.bowser.alive) {
                        var b2 = game.bowser;
                        if (m.x + m.w > b2.x + 4 && m.x < b2.x + b2.w - 4 &&
                            m.y + m.h > b2.y + 4 && m.y < b2.y + b2.h - 4) {
                            if (m.vy > 0 && m.y + m.h - b2.y < 25 && b2.hitTimer <= 0) {
                                b2.hp--;
                                b2.hitTimer = 30;
                                m.vy = -7;
                                game.score += 500;
                                updateUI();
                                if (isStreaming) addChatLine("💥 クッパにヒット！ 残りHP " + b2.hp);
                                if (b2.hp <= 0) {
                                    b2.alive = false;
                                    game.score += 1000;
                                    updateUI();
                                    if (isStreaming) addChatLine("🏆 クッパ撃破！");
                                }
                            } else if (b2.hitTimer <= 0) {
                                setGameOver(); return;
                            }
                        }
                    }
                }
                
                var f = game.flag;
                if (m.x + m.w > f.x + 4 && m.x < f.x + f.w - 4 && m.y + m.h > f.y + 8 && m.y < f.y + f.h - 8) {
                    game.gameClear = true;
                    if (currentStage === 'land') {
                        if (isStreaming) addChatLine("🏁 ステージ1クリア！");
                        showStageTransition('water');
                    } else if (currentStage === 'water') {
                        if (isStreaming) addChatLine("🏁 ステージ2クリア！");
                        showStageTransition('desert');
                    } else if (currentStage === 'desert') {
                        if (isStreaming) addChatLine("🏁 ステージ3クリア！");
                        showStageTransition('ice');
                    } else if (currentStage === 'ice') {
                        if (isStreaming) addChatLine("🏁 ステージ4クリア！ マグマへ");
                        showStageTransition('magma');
                    } else if (currentStage === 'magma') {
                        if (isStreaming) addChatLine("🏆 マグマステージクリア！");
                        startEnding();
                    }
                }
                if (m.vx > 0.2) m.facing = 1;
                else if (m.vx < -0.2) m.facing = -1;
            }

            function setGameOver() {
                game.gameOver = true;
                gameoverMsg.style.display = 'block';
                if (isStreaming) addChatLine("💀 GAME OVER");
                if (currentStage === 'magma') {
                    showRetryOverlay();
                }
            }

            function showRetryOverlay() {
                isRetryOverlayActive = true;
                retryFootnote.textContent = '所持スコア: ' + game.score + ' (1000必要)';
                if (game.score >= 1000) {
                    retryBtn.disabled = false;
                    retryBtn.textContent = '🪙 1000コインでリトライ';
                } else {
                    retryBtn.disabled = true;
                    retryBtn.textContent = '🪙 コイン不足 (' + game.score + '/1000)';
                }
                retryOverlay.classList.add('active');
            }

            retryBtn.addEventListener('click', function() {
                if (game.score < 1000) return;
                game.score -= 1000;
                updateUI();
                retryOverlay.classList.remove('active');
                isRetryOverlayActive = false;
                gameoverMsg.style.display = 'none';
                buildMagmaStage();
                if (isStreaming && streamUnlocked) {
                    addChatLine('🪙 1000コインを支払ってマグマステージからリトライ！');
                }
            });

            giveupBtn.addEventListener('click', function() {
                retryOverlay.classList.remove('active');
                isRetryOverlayActive = false;
                resetGame();
            });

            // ---------- エンディング (フェーズ0静止画 → 3秒 → 画像 → 3秒 → 誘導画面) ----------
            function drawPeachRescueScene() {
                var w = 800, h = 400;

                // ============ 背景（夜空） ============
                var grad = ectx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0a0a2a');
                grad.addColorStop(1, '#1a1a3a');
                ectx.fillStyle = grad;
                ectx.fillRect(0, 0, w, h);

                // 星
                for (var i = 0; i < 40; i++) {
                    var sx = (i * 37 + 13) % w;
                    var sy = (i * 53 + 7) % (h * 0.6);
                    var twinkle = 0.5 + (i % 5) * 0.1;
                    ectx.fillStyle = 'rgba(255,255,220,' + twinkle + ')';
                    ectx.fillRect(sx, sy, 2, 2);
                }

                // 地面
                ectx.fillStyle = '#2a1a3a';
                ectx.fillRect(0, h - 60, w, 60);
                ectx.fillStyle = '#3a2a4a';
                ectx.fillRect(0, h - 60, w, 4);

                // ============ 檻 ============
                var cageX = 500, cageY = h - 180, cageW = 80, cageH = 120;

                // 檻の枠（全体）
                ectx.strokeStyle = '#888';
                ectx.lineWidth = 4;
                ectx.strokeRect(cageX, cageY, cageW, cageH);

                // 縦棒
                for (var bx = cageX + 12; bx < cageX + cageW; bx += 16) {
                    ectx.beginPath();
                    ectx.moveTo(bx, cageY);
                    ectx.lineTo(bx, cageY + cageH);
                    ectx.stroke();
                }

                // 横棒（中央）
                ectx.beginPath();
                ectx.moveTo(cageX, cageY + cageH/2);
                ectx.lineTo(cageX + cageW, cageY + cageH/2);
                ectx.stroke();

                // 鍵（閉じている）
                ectx.fillStyle = '#d4a017';
                ectx.beginPath();
                ectx.arc(cageX + cageW/2, cageY + cageH/2, 6, 0, Math.PI * 2);
                ectx.fill();
                ectx.fillStyle = '#8a6a10';
                ectx.fillRect(cageX + cageW/2 - 2, cageY + cageH/2, 4, 10);

                // ============ ピーチ（檻の中） ============
                var peachX = 540;
                var peachY = cageY + 30;

                // ドレス
                ectx.fillStyle = '#ff69b4';
                ectx.beginPath();
                ectx.moveTo(peachX, peachY + 100);
                ectx.lineTo(peachX - 20, peachY + 100);
                ectx.lineTo(peachX - 12, peachY + 60);
                ectx.lineTo(peachX + 12, peachY + 60);
                ectx.lineTo(peachX + 20, peachY + 100);
                ectx.closePath();
                ectx.fill();

                // 腕（悲しみ・下げている）
                ectx.strokeStyle = '#f7d9b0';
                ectx.lineWidth = 5;
                ectx.beginPath();
                ectx.moveTo(peachX - 10, peachY + 70);
                ectx.lineTo(peachX - 16, peachY + 88);
                ectx.moveTo(peachX + 10, peachY + 70);
                ectx.lineTo(peachX + 16, peachY + 88);
                ectx.stroke();

                // 頭
                ectx.fillStyle = '#f7d9b0';
                ectx.beginPath();
                ectx.arc(peachX, peachY + 50, 14, 0, Math.PI * 2);
                ectx.fill();

                // 髪（金）
                ectx.fillStyle = '#ffd700';
                ectx.beginPath();
                ectx.arc(peachX, peachY + 42, 15, Math.PI, Math.PI * 2);
                ectx.fill();
                ectx.fillRect(peachX - 15, peachY + 42, 30, 10);
                ectx.fillRect(peachX - 17, peachY + 52, 6, 14);
                ectx.fillRect(peachX + 11, peachY + 52, 6, 14);

                // 目（悲しみ）
                ectx.fillStyle = '#222';
                ectx.beginPath();
                ectx.arc(peachX - 4, peachY + 50, 1.5, 0, Math.PI * 2);
                ectx.arc(peachX + 4, peachY + 50, 1.5, 0, Math.PI * 2);
                ectx.fill();

                // 口（悲しみ・への字）
                ectx.strokeStyle = '#222';
                ectx.lineWidth = 1.5;
                ectx.beginPath();
                ectx.arc(peachX, peachY + 58, 3, Math.PI, Math.PI * 2);
                ectx.stroke();

                // 王冠
                ectx.fillStyle = '#ffd700';
                ectx.beginPath();
                ectx.moveTo(peachX - 10, peachY + 38);
                ectx.lineTo(peachX - 8, peachY + 30);
                ectx.lineTo(peachX - 3, peachY + 36);
                ectx.lineTo(peachX, peachY + 28);
                ectx.lineTo(peachX + 3, peachY + 36);
                ectx.lineTo(peachX + 8, peachY + 30);
                ectx.lineTo(peachX + 10, peachY + 38);
                ectx.closePath();
                ectx.fill();

                // ============ マリオ（遠くから来たばかり） ============
                var marioX = 100;
                var marioY = h - 160;

                ectx.save();
                ectx.translate(marioX + 15, marioY + 20);

                // 帽子
                ectx.fillStyle = '#e33b3b';
                ectx.fillRect(-14, -22, 28, 12);
                ectx.fillRect(-10, -28, 20, 8);

                // 顔
                ectx.fillStyle = '#f7d9b0';
                ectx.fillRect(-12, -10, 24, 16);

                // 目
                ectx.fillStyle = '#222';
                ectx.fillRect(-6, -6, 4, 4);
                ectx.fillRect(2, -6, 4, 4);

                // 口
                ectx.fillRect(-4, 2, 8, 2);

                // 体
                ectx.fillStyle = '#e33b3b';
                ectx.fillRect(-12, 6, 24, 16);

                // ボタン
                ectx.fillStyle = '#f5c542';
                ectx.fillRect(-6, 12, 3, 3);
                ectx.fillRect(3, 12, 3, 3);

                // 足
                ectx.fillStyle = '#2d2d8a';
                ectx.fillRect(-12, 22, 10, 6);
                ectx.fillRect(2, 22, 10, 6);

                ectx.restore();

                // ============ テキスト ============
                ectx.fillStyle = '#ffd700';
                ectx.font = 'bold 36px "Segoe UI", sans-serif';
                ectx.textAlign = 'center';
                ectx.fillText('Thank you Mario!', w/2, 80);
                ectx.font = 'bold 24px "Segoe UI", sans-serif';
                ectx.fillStyle = '#fff';
                ectx.fillText('Your quest is over.', w/2, 120);
                ectx.textAlign = 'left';
            }

            function startEnding() {
                isEndingActive = true;
                endingOverlay.classList.add('active');
                // フェーズ0: ピーチ救出の静止画（Canvas）
                endingCanvas.style.display = 'block';
                endingImage.style.display = 'none';
                drawPeachRescueScene();

                // 3秒後にフェーズ1: 画像表示
                setTimeout(function() {
                    endingCanvas.style.display = 'none';
                    endingImage.style.display = 'block';
                }, 18000);

                // さらに3秒後（合計6秒）にフェーズ2: pass.html誘導画面
                setTimeout(function() {
                    endingOverlay.classList.remove('active');
                    isEndingActive = false;
                    isClearOverlayActive = true;
                    clearOverlay.classList.add('active');
                }, 30000);
            }

            // ---------- 描画 ----------
            function draw() {
                if (isClearOverlayActive || waitingForStageTransition || isRetryOverlayActive || isEndingActive) {
                    ctx.clearRect(0, 0, 800, 400);
                    return;
                }
                ctx.clearRect(0, 0, 800, 400);
                
                if (currentStage === 'land') {
                    var grad = ctx.createLinearGradient(0, 0, 0, 400);
                    grad.addColorStop(0, '#6fc3ff');
                    grad.addColorStop(0.7, '#b3e0ff');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 800, 400);
                    ctx.fillStyle = 'rgba(255,255,240,0.7)';
                    drawCloud(90, 40, 1); drawCloud(550, 60, 0.9); drawCloud(340, 20, 0.7);
                } else if (currentStage === 'water') {
                    var grad2 = ctx.createLinearGradient(0, 0, 0, 400);
                    grad2.addColorStop(0, '#0a2a4a');
                    grad2.addColorStop(0.6, '#1a4a6a');
                    grad2.addColorStop(1, '#2a5a7a');
                    ctx.fillStyle = grad2;
                    ctx.fillRect(0, 0, 800, 400);
                    for (var b = 0; b < 20; b++) {
                        var bx = (b * 43 + 17) % 800;
                        var by = (b * 31 + 53) % 400;
                        ctx.fillStyle = 'rgba(100, 200, 255, 0.15)';
                        ctx.beginPath();
                        ctx.arc(bx, by, 3 + b % 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (currentStage === 'desert') {
                    var grad3 = ctx.createLinearGradient(0, 0, 0, 400);
                    grad3.addColorStop(0, '#f5c56b');
                    grad3.addColorStop(0.5, '#e8a94a');
                    grad3.addColorStop(1, '#d4943a');
                    ctx.fillStyle = grad3;
                    ctx.fillRect(0, 0, 800, 400);
                    ctx.fillStyle = 'rgba(255, 240, 150, 0.9)';
                    ctx.shadowColor = '#fff7a0';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(700, 60, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(200, 150, 80, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(0, 280);
                    ctx.quadraticCurveTo(150, 240, 300, 280);
                    ctx.quadraticCurveTo(450, 240, 600, 280);
                    ctx.quadraticCurveTo(720, 250, 800, 280);
                    ctx.lineTo(800, 400);
                    ctx.lineTo(0, 400);
                    ctx.fill();
                    for (var d = 0; d < 30; d++) {
                        var dx = (d * 29 + Date.now() * 0.05) % 800;
                        var dy = (d * 47 + 100) % 300;
                        ctx.fillStyle = 'rgba(255, 220, 150, 0.4)';
                        ctx.fillRect(dx, dy, 3, 1);
                    }
                } else if (currentStage === 'ice') {
                    var grad4 = ctx.createLinearGradient(0, 0, 0, 400);
                    grad4.addColorStop(0, '#a8d8ee');
                    grad4.addColorStop(0.5, '#c8e8f5');
                    grad4.addColorStop(1, '#e0f0fa');
                    ctx.fillStyle = grad4;
                    ctx.fillRect(0, 0, 800, 400);
                    ctx.fillStyle = 'rgba(180, 220, 255, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(200, 60, 300, 40, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(200, 180, 255, 0.25)';
                    ctx.beginPath();
                    ctx.ellipse(600, 90, 250, 35, 0, 0, Math.PI * 2);
                    ctx.fill();
                    for (var f2 = 0; f2 < 40; f2++) {
                        var fx = (f2 * 37 + 23) % 800;
                        var fy = (f2 * 29 + 11) % 400;
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                        ctx.beginPath();
                        ctx.arc(fx, fy, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (currentStage === 'magma') {
                    var gradM = ctx.createLinearGradient(0, 0, 0, 400);
                    gradM.addColorStop(0, '#1a0a0a');
                    gradM.addColorStop(0.5, '#3a1a1a');
                    gradM.addColorStop(1, '#6a2a1a');
                    ctx.fillStyle = gradM;
                    ctx.fillRect(0, 0, 800, 400);
                    ctx.fillStyle = 'rgba(255, 120, 40, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(400, 420, 500, 100, 0, 0, Math.PI * 2);
                    ctx.fill();
                    for (var fp = 0; fp < 30; fp++) {
                        var fpx = (fp * 41 + Date.now() * 0.08) % 800;
                        var fpy = (fp * 31 + 50) % 350;
                        ctx.fillStyle = 'rgba(255, 150, 50, 0.6)';
                        ctx.beginPath();
                        ctx.arc(fpx, fpy, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                for (var i = 0; i < game.platforms.length; i++) {
                    var p = game.platforms[i];
                    if (p.lava) {
                        var lavaGrad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
                        lavaGrad.addColorStop(0, '#ff4400');
                        lavaGrad.addColorStop(0.4, '#ff6600');
                        lavaGrad.addColorStop(1, '#8a1a00');
                        ctx.fillStyle = lavaGrad;
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        ctx.fillStyle = 'rgba(255, 220, 100, 0.7)';
                        for (var lx = 0; lx < p.w; lx += 8) {
                            var lwave = Math.sin(lx * 0.15 + Date.now() * 0.005) * 2;
                            ctx.fillRect(lx, p.y + lwave, 5, 3);
                        }
                        ctx.fillStyle = 'rgba(255, 200, 50, 0.4)';
                        ctx.fillRect(0, p.y - 2, 800, 4);
                    } else if (p.log) {
                        ctx.fillStyle = '#6a4a2a';
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        ctx.fillStyle = '#4a3018';
                        ctx.fillRect(p.x, p.y + 4, p.w, 2);
                        ctx.fillRect(p.x, p.y + 10, p.w, 2);
                        ctx.fillStyle = '#8a6a3a';
                        ctx.beginPath();
                        ctx.ellipse(p.x + 6, p.y + p.h/2, 5, p.h/2 - 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#4a3018';
                        ctx.beginPath();
                        ctx.ellipse(p.x + 6, p.y + p.h/2, 3, p.h/2 - 4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#8a6a3a';
                        ctx.beginPath();
                        ctx.ellipse(p.x + p.w - 6, p.y + p.h/2, 5, p.h/2 - 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#4a3018';
                        ctx.beginPath();
                        ctx.ellipse(p.x + p.w - 6, p.y + p.h/2, 3, p.h/2 - 4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(100, 255, 100, 0.3)';
                        ctx.fillRect(p.x, p.y - 2, p.w, 3);
                    } else if (currentStage === 'water' && p.y === 380 && p.w === 800) {
                        ctx.fillStyle = '#1a5a3a';
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        ctx.fillStyle = 'rgba(0, 255, 100, 0.2)';
                        for (var w = 0; w < 800; w += 12) {
                            var wave = Math.sin(w * 0.1 + Date.now() * 0.002) * 3;
                            ctx.fillRect(w, p.y + wave, 6, 4);
                        }
                        ctx.fillStyle = 'rgba(255, 50, 50, 0.3)';
                        ctx.fillRect(0, p.y - 2, 800, 6);
                    } else if (p.y === 330 && p.w === 800 && currentStage === 'land') {
                        ctx.fillStyle = '#7d9e5d';
                        ctx.fillRect(p.x, p.y, p.w, 16);
                        ctx.fillStyle = '#8b6b4d';
                        ctx.fillRect(p.x, p.y + 16, p.w, p.h - 16);
                        ctx.fillStyle = '#5f7d42';
                        for (var gx = 0; gx < 800; gx += 24) { ctx.fillRect(gx, p.y - 4, 6, 8); }
                    } else if (p.y === 350 && p.w === 800 && currentStage === 'desert') {
                        ctx.fillStyle = '#d4a55a';
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        ctx.fillStyle = '#c4944a';
                        for (var sx = 0; sx < 800; sx += 16) {
                            ctx.fillRect(sx, p.y + 4, 8, 3);
                            ctx.fillRect(sx + 8, p.y + 12, 6, 3);
                        }
                        ctx.fillStyle = '#b8843a';
                        ctx.fillRect(p.x, p.y, p.w, 4);
                    } else if (p.y === 340 && p.w === 800 && currentStage === 'ice') {
                        ctx.fillStyle = '#a8e0f5';
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        ctx.fillStyle = '#c8eefc';
                        ctx.fillRect(p.x, p.y, p.w, 8);
                        ctx.fillStyle = '#e8f8ff';
                        ctx.fillRect(p.x, p.y, p.w, 3);
                        ctx.strokeStyle = 'rgba(120, 180, 220, 0.6)';
                        ctx.lineWidth = 1;
                        for (var cx = 0; cx < 800; cx += 60) {
                            ctx.beginPath();
                            ctx.moveTo(cx + 10, p.y + 8);
                            ctx.lineTo(cx + 25, p.y + 30);
                            ctx.lineTo(cx + 15, p.y + 50);
                            ctx.stroke();
                        }
                    } else {
                        if (currentStage === 'magma') {
                            ctx.fillStyle = '#5a3a2a';
                            ctx.fillRect(p.x, p.y, p.w, p.h);
                            ctx.fillStyle = '#3a2a1a';
                            ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, 4);
                            ctx.fillRect(p.x + 4, p.y + p.h - 6, p.w - 8, 4);
                            ctx.fillStyle = '#2a1a0a';
                            ctx.fillRect(p.x + 2, p.y + 2, 6, 6);
                            ctx.fillRect(p.x + p.w - 8, p.y + 2, 6, 6);
                            ctx.fillStyle = 'rgba(255, 120, 30, 0.7)';
                            ctx.fillRect(p.x + 15, p.y + p.h/2 - 1, p.w - 30, 2);
                        } else if (currentStage === 'desert') {
                            ctx.fillStyle = '#c4944a';
                            ctx.fillRect(p.x, p.y, p.w, p.h);
                            ctx.fillStyle = '#a87a3a';
                            ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, 4);
                            ctx.fillStyle = '#8a6030';
                            ctx.fillRect(p.x + 2, p.y + 2, 6, 6);
                            ctx.fillRect(p.x + p.w - 8, p.y + 2, 6, 6);
                        } else if (currentStage === 'ice') {
                            ctx.fillStyle = '#c8e8f5';
                            ctx.fillRect(p.x, p.y, p.w, p.h);
                            ctx.fillStyle = '#a8d0e8';
                            ctx.fillRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4);
                            ctx.fillStyle = '#e8f8ff';
                            ctx.fillRect(p.x, p.y, p.w, 4);
                        } else {
                            ctx.fillStyle = '#c49a6c';
                            ctx.fillRect(p.x, p.y, p.w, p.h);
                            ctx.fillStyle = '#a87d54';
                            ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, 4);
                            ctx.fillRect(p.x + 4, p.y + p.h - 6, p.w - 8, 4);
                            ctx.fillStyle = '#8b6b4d';
                            ctx.fillRect(p.x + 2, p.y + 2, 6, 6);
                            ctx.fillRect(p.x + p.w - 8, p.y + 2, 6, 6);
                        }
                    }
                }
                
                for (var c = 0; c < game.coins.length; c++) {
                    var coin = game.coins[c];
                    if (coin.collected) continue;
                    ctx.fillStyle = '#f5c542';
                    ctx.shadowColor = '#f5c542';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(coin.x + 8, coin.y + 8, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f0d050';
                    ctx.shadowBlur = 4;
                    ctx.beginPath();
                    ctx.arc(coin.x + 8, coin.y + 8, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                
                for (var e = 0; e < game.enemies.length; e++) {
                    var enemy = game.enemies[e];
                    if (!enemy.alive) continue;
                    ctx.fillStyle = '#8b5a3a';
                    ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                    ctx.fillStyle = '#6a3f2a';
                    ctx.fillRect(enemy.x + 4, enemy.y + 4, enemy.w - 8, 6);
                    ctx.fillRect(enemy.x + 4, enemy.y + enemy.h - 10, enemy.w - 8, 6);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(enemy.x + 5, enemy.y + 8, 8, 8);
                    ctx.fillRect(enemy.x + 17, enemy.y + 8, 8, 8);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(enemy.x + 8, enemy.y + 11, 4, 4);
                    ctx.fillRect(enemy.x + 20, enemy.y + 11, 4, 4);
                    if (enemy.type === 'archer') {
                        ctx.strokeStyle = '#6a3f1a';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(enemy.x + 30, enemy.y + 15, 12, -Math.PI/2, Math.PI/2);
                        ctx.stroke();
                        ctx.strokeStyle = '#eee';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + 30, enemy.y + 3);
                        ctx.lineTo(enemy.x + 30, enemy.y + 27);
                        ctx.stroke();
                        ctx.fillStyle = '#8a2020';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText('🏹', enemy.x + 8, enemy.y + 28);
                    } else if (enemy.type === 'gunner') {
                        ctx.fillStyle = '#c0c0c0';
                        ctx.fillRect(enemy.x + 28, enemy.y + 12, 18, 6);
                        ctx.fillStyle = '#e8e8e8';
                        ctx.fillRect(enemy.x + 28, enemy.y + 12, 18, 2);
                        ctx.fillStyle = '#1a1a1a';
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + 28, enemy.y + 18);
                        ctx.lineTo(enemy.x + 34, enemy.y + 18);
                        ctx.lineTo(enemy.x + 32, enemy.y + 28);
                        ctx.lineTo(enemy.x + 26, enemy.y + 28);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(enemy.x + 42, enemy.y + 10, 3, 3);
                        ctx.fillStyle = '#a0a0a0';
                        ctx.fillRect(enemy.x + 30, enemy.y + 14, 14, 3);
                        ctx.fillStyle = '#8a2020';
                        ctx.font = 'bold 10px sans-serif';
                        ctx.fillText('DE', enemy.x + 10, enemy.y + 28);
                    } else {
                        ctx.fillStyle = '#1a3d7a';
                        ctx.font = 'bold 14px sans-serif';
                        ctx.fillText('D', enemy.x + 10, enemy.y + 26);
                    }
                }
                
                if (currentStage === 'magma' && game.bowser && game.bowser.alive) {
                    var b3 = game.bowser;
                    ctx.fillStyle = '#2a6a2a';
                    ctx.beginPath();
                    ctx.ellipse(b3.x + 25, b3.y + 40, 26, 22, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a4a1a';
                    ctx.beginPath();
                    ctx.ellipse(b3.x + 25, b3.y + 40, 20, 16, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    for (var sp = 0; sp < 5; sp++) {
                        var ang = -Math.PI + (sp / 4) * Math.PI;
                        var sxp = b3.x + 25 + Math.cos(ang) * 24;
                        var syp = b3.y + 40 + Math.sin(ang) * 20;
                        ctx.beginPath();
                        ctx.moveTo(sxp, syp);
                        ctx.lineTo(sxp - 3, syp - 6);
                        ctx.lineTo(sxp + 3, syp - 6);
                        ctx.closePath();
                        ctx.fill();
                    }
                    ctx.fillStyle = '#3a8a3a';
                    ctx.beginPath();
                    ctx.arc(b3.x + 25, b3.y + 15, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(b3.x + 12, b3.y + 5);
                    ctx.lineTo(b3.x + 8, b3.y - 8);
                    ctx.lineTo(b3.x + 18, b3.y + 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(b3.x + 38, b3.y + 5);
                    ctx.lineTo(b3.x + 42, b3.y - 8);
                    ctx.lineTo(b3.x + 32, b3.y + 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(b3.x + 18, b3.y + 13, 5, 0, Math.PI * 2);
                    ctx.arc(b3.x + 32, b3.y + 13, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#c00';
                    ctx.beginPath();
                    ctx.arc(b3.x + 19, b3.y + 14, 2.5, 0, Math.PI * 2);
                    ctx.arc(b3.x + 33, b3.y + 14, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#1a3a1a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(b3.x + 15, b3.y + 24);
                    ctx.lineTo(b3.x + 35, b3.y + 24);
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(b3.x + 18, b3.y + 24);
                    ctx.lineTo(b3.x + 20, b3.y + 28);
                    ctx.lineTo(b3.x + 22, b3.y + 24);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(b3.x + 28, b3.y + 24);
                    ctx.lineTo(b3.x + 30, b3.y + 28);
                    ctx.lineTo(b3.x + 32, b3.y + 24);
                    ctx.closePath();
                    ctx.fill();
                    var hpW = 60;
                    var hpX = b3.x - 5;
                    var hpY = b3.y - 25;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(hpX - 1, hpY - 1, hpW + 2, 8);
                    ctx.fillStyle = '#c00';
                    ctx.fillRect(hpX, hpY, hpW * (b3.hp / 5), 6);
                    if (b3.hitTimer > 0 && Math.floor(b3.hitTimer / 4) % 2 === 0) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.beginPath();
                        ctx.arc(b3.x + 25, b3.y + 30, 35, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                if (currentStage === 'water') {
                    for (var s = 0; s < game.poisonSplashes.length; s++) {
                        var splash = game.poisonSplashes[s];
                        ctx.fillStyle = 'rgba(0, 255, 100, 0.7)';
                        ctx.shadowColor = '#00ff66';
                        ctx.shadowBlur = 15;
                        ctx.fillRect(splash.x, splash.y, splash.width, splash.height);
                        ctx.shadowBlur = 0;
                    }
                }
                
                if (currentStage === 'desert') {
                    for (var a = 0; a < game.arrows.length; a++) {
                        var arrow = game.arrows[a];
                        ctx.save();
                        ctx.translate(arrow.x + arrow.w/2, arrow.y + arrow.h/2);
                        var angle = Math.atan2(arrow.vy, arrow.vx);
                        ctx.rotate(angle);
                        ctx.fillStyle = '#6a4a1a';
                        ctx.fillRect(-9, -1, 14, 2);
                        ctx.fillStyle = '#aaa';
                        ctx.beginPath();
                        ctx.moveTo(5, -3);
                        ctx.lineTo(9, 0);
                        ctx.lineTo(5, 3);
                        ctx.fill();
                        ctx.fillStyle = '#d44';
                        ctx.beginPath();
                        ctx.moveTo(-9, -1);
                        ctx.lineTo(-13, -4);
                        ctx.lineTo(-9, 1);
                        ctx.fill();
                        ctx.restore();
                    }
                }
                
                if (currentStage === 'ice') {
                    for (var bi = 0; bi < game.bullets.length; bi++) {
                        var bullet = game.bullets[bi];
                        for (var t = 0; t < bullet.trail.length; t++) {
                            var tp = bullet.trail[t];
                            var alpha = (t + 1) / bullet.trail.length * 0.6;
                            ctx.fillStyle = 'rgba(255, 200, 50, ' + alpha + ')';
                            ctx.beginPath();
                            ctx.arc(tp.x + bullet.w/2, tp.y + bullet.h/2, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.save();
                        ctx.translate(bullet.x + bullet.w/2, bullet.y + bullet.h/2);
                        var bAngle = Math.atan2(bullet.vy, bullet.vx);
                        ctx.rotate(bAngle);
                        ctx.fillStyle = '#e8b84a';
                        ctx.fillRect(-6, -3, 10, 6);
                        ctx.fillStyle = '#f5d878';
                        ctx.beginPath();
                        ctx.moveTo(4, -3);
                        ctx.lineTo(8, 0);
                        ctx.lineTo(4, 3);
                        ctx.fill();
                        ctx.restore();
                    }
                }
                
                if (currentStage === 'magma') {
                    for (var lc = 0; lc < game.lavaColumns.length; lc++) {
                        var lava = game.lavaColumns[lc];
                        var lg = ctx.createLinearGradient(0, lava.y, 0, lava.y + lava.h);
                        lg.addColorStop(0, '#ffcc00');
                        lg.addColorStop(0.4, '#ff6600');
                        lg.addColorStop(1, '#8a1a00');
                        ctx.fillStyle = lg;
                        ctx.fillRect(lava.x, lava.y, lava.w, lava.h);
                        ctx.fillStyle = 'rgba(255, 240, 150, 0.9)';
                        ctx.beginPath();
                        ctx.arc(lava.x + lava.w/2, lava.y, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    for (var tt = 0; tt < game.teslas.length; tt++) {
                        var tesla = game.teslas[tt];
                        ctx.save();
                        ctx.translate(tesla.x + tesla.w/2, tesla.y + tesla.h/2);
                        ctx.rotate(tesla.rotation);
                        ctx.fillStyle = '#c8c8d0';
                        ctx.fillRect(-30, -12, 60, 24);
                        ctx.fillStyle = '#a0a0a8';
                        ctx.fillRect(-18, -18, 36, 8);
                        ctx.fillStyle = '#3a5a8a';
                        ctx.fillRect(-14, -16, 28, 6);
                        ctx.fillStyle = '#1a1a1a';
                        ctx.beginPath();
                        ctx.arc(-18, 12, 5, 0, Math.PI * 2);
                        ctx.arc(18, 12, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#c00';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText('T', -4, 4);
                        ctx.restore();
                    }
                    for (var rr = 0; rr < game.rockets.length; rr++) {
                        var rocket = game.rockets[rr];
                        for (var rt = 0; rt < rocket.trail.length; rt++) {
                            var rtp = rocket.trail[rt];
                            var rAlpha = (rt + 1) / rocket.trail.length * 0.8;
                            ctx.fillStyle = 'rgba(255, ' + (100 + rt * 15) + ', 50, ' + rAlpha + ')';
                            ctx.beginPath();
                            ctx.arc(rtp.x + rocket.w/2, rtp.y + rocket.h/2, 4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.save();
                        ctx.translate(rocket.x + rocket.w/2, rocket.y + rocket.h/2);
                        var rAngle = Math.atan2(rocket.vy, rocket.vx);
                        ctx.rotate(rAngle);
                        ctx.fillStyle = '#f0f0f0';
                        ctx.fillRect(-10, -8, 20, 32);
                        ctx.fillStyle = '#1a1a1a';
                        ctx.beginPath();
                        ctx.moveTo(-10, -8);
                        ctx.lineTo(0, -20);
                        ctx.lineTo(10, -8);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(-10, 18);
                        ctx.lineTo(-16, 26);
                        ctx.lineTo(-10, 24);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(10, 18);
                        ctx.lineTo(16, 26);
                        ctx.lineTo(10, 24);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#1a1a1a';
                        ctx.font = 'bold 8px sans-serif';
                        ctx.fillText('X', -3, 4);
                        ctx.fillStyle = 'rgba(255, 200, 50, 0.9)';
                        ctx.beginPath();
                        ctx.arc(0, 26, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255, 100, 20, 0.9)';
                        ctx.beginPath();
                        ctx.arc(0, 30, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
                
                var f = game.flag;
                ctx.fillStyle = '#6a6a6a';
                ctx.fillRect(f.x + 10, f.y, 6, f.baseY - f.y);
                ctx.fillStyle = '#c92a2a';
                ctx.beginPath();
                ctx.moveTo(f.x + 16, f.y + 6);
                ctx.lineTo(f.x + 46, f.y + 20);
                ctx.lineTo(f.x + 16, f.y + 36);
                ctx.fill();
                ctx.fillStyle = '#f5e56b';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('🏁', f.x - 2, f.y + 52);
                
                var m = game.mario;
                ctx.save();
                ctx.translate(m.x + m.w/2, m.y + m.h/2);
                if (m.facing < 0) ctx.scale(-1, 1);
                ctx.translate(-m.w/2, -m.h/2);
                if (isStreaming && streamUnlocked) {
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(20, -2);
                    ctx.lineTo(38, -20);
                    ctx.stroke();
                    ctx.fillStyle = '#222';
                    ctx.fillRect(34, -26, 16, 24);
                    ctx.fillStyle = '#3a6b9a';
                    ctx.fillRect(36, -24, 12, 16);
                    ctx.fillStyle = '#fff';
                    ctx.font = '8px sans-serif';
                    ctx.fillText('📱', 38, -14);
                    ctx.fillStyle = '#e33b3b';
                    ctx.fillRect(2, -6, 24, 12);
                    ctx.fillRect(6, -10, 16, 6);
                } else {
                    ctx.fillStyle = '#e33b3b';
                    ctx.fillRect(2, -2, 24, 12);
                    ctx.fillRect(6, -6, 16, 6);
                }
                ctx.fillStyle = '#f7d9b0';
                ctx.fillRect(4, 10, 20, 14);
                ctx.fillStyle = '#222';
                ctx.fillRect(16, 12, 6, 6);
                ctx.fillRect(6, 12, 6, 6);
                ctx.fillRect(10, 20, 10, 4);
                ctx.fillStyle = '#e33b3b';
                ctx.fillRect(2, 24, 24, 12);
                ctx.fillStyle = '#f5c542';
                ctx.fillRect(8, 28, 4, 4);
                ctx.fillRect(18, 28, 4, 4);
                ctx.fillStyle = '#2d2d8a';
                ctx.fillRect(0, 34, 10, 6);
                ctx.fillRect(18, 34, 10, 6);
                ctx.restore();
                
                ctx.fillStyle = '#1f2e1f';
                ctx.font = 'bold 20px monospace';
                ctx.fillText('SCORE: ' + game.score, 620, 36);
                
                if (isStreaming && streamUnlocked) {
                    ctx.fillStyle = 'rgba(100,65,165,0.7)';
                    ctx.fillRect(8, 8, 100, 24);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('🔴 LIVE', 16, 26);
                }
                
                if (currentStage === 'water') {
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('⚠️ 毒水注意！', 10, 60);
                } else if (currentStage === 'desert') {
                    ctx.fillStyle = 'rgba(180, 60, 20, 0.7)';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('🏹 弓クリボー注意！', 10, 60);
                } else if (currentStage === 'ice') {
                    ctx.fillStyle = 'rgba(60, 100, 180, 0.8)';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('❄️ 滑る！ 🔫 デザートイーグル注意！', 10, 60);
                } else if (currentStage === 'magma') {
                    ctx.fillStyle = 'rgba(255, 100, 40, 0.9)';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('🔥 クッパを倒してピーチを救え！', 10, 60);
                }
            }

            function drawCloud(x, y, s) {
                ctx.beginPath();
                ctx.arc(x, y, 24*s, 0, Math.PI*2);
                ctx.arc(x+30*s, y-12*s, 30*s, 0, Math.PI*2);
                ctx.arc(x+60*s, y, 26*s, 0, Math.PI*2);
                ctx.arc(x+28*s, y+8*s, 22*s, 0, Math.PI*2);
                ctx.fill();
            }

            // ---------- ゲーム制御 ----------
            function resetGame() {
                clearOverlay.classList.remove('active');
                isClearOverlayActive = false;
                stageTransition.classList.remove('active');
                waitingForStageTransition = false;
                retryOverlay.classList.remove('active');
                isRetryOverlayActive = false;
                endingOverlay.classList.remove('active');
                isEndingActive = false;
                buildLandStage();
                game.gameClear = false;
                game.gameOver = false;
                gameoverMsg.style.display = 'none';
                game.leftPressed = false;
                game.rightPressed = false;
                game.jumpPressed = false;
                updateUI();
                if (isStreaming && streamUnlocked) {
                    twitchChat.innerHTML = '';
                    addChatLine('🔄 ゲームリセット！');
                }
            }

            clearRedirectBtn.addEventListener('click', function() {
                window.location.href = 'pass.html';
            });

            // ---------- Twitchコメント ----------
            function addChatLine(msg) {
                if (!isStreaming || !streamUnlocked) return;
                var username = 'viewer' + Math.floor(Math.random() * 1000);
                var chunks = [];
                for (var i = 0; i < msg.length; i += 4) {
                    chunks.push(msg.substring(i, i + 4));
                }
                chunks.forEach(function(chunk, index) {
                    var line = document.createElement('div');
                    line.className = 'chat-line';
                    if (index === 0) {
                        line.innerHTML = '<span class="username">' + username + '</span><span class="message">' + chunk + '</span>';
                    } else {
                        line.innerHTML = '<span class="message" style="padding-left: 4px;">' + chunk + '</span>';
                    }
                    twitchChat.appendChild(line);
                });
                while (twitchChat.children.length > 30) {
                    twitchChat.removeChild(twitchChat.firstChild);
                }
                twitchChat.scrollTop = twitchChat.scrollHeight;
            }

            function randomComment() {
                if (!isStreaming || !streamUnlocked) return;
                var idx = Math.floor(Math.random() * currentCommentPool.length);
                addChatLine(currentCommentPool[idx]);
            }

            // ---------- 配信モード ----------
            function toggleStream() {
                if (!streamUnlocked) {
                    streamToggleBtn.textContent = '🔒 スコア1000必要';
                    setTimeout(function() {
                        streamToggleBtn.textContent = '🔒 配信モード (スコア1000)';
                    }, 1500);
                    return;
                }
                isStreaming = !isStreaming;
                streamToggleBtn.textContent = isStreaming ? '📡 配信モード ON' : '📡 配信モード OFF';
                twitchChat.classList.toggle('active', isStreaming);
                if (isStreaming) {
                    twitchChat.innerHTML = '';
                    addChatLine('🔴 配信開始！ コメントが流れます');
                    if (chatInterval) clearInterval(chatInterval);
                    chatInterval = setInterval(randomComment, 3000);
                } else {
                    if (chatInterval) {
                        clearInterval(chatInterval);
                        chatInterval = null;
                    }
                    twitchChat.innerHTML = '';
                }
            }

            streamToggleBtn.addEventListener('click', toggleStream);

            // ---------- イベント ----------
            leftBtn.addEventListener('mousedown', function(e) { e.preventDefault(); game.leftPressed = true; });
            leftBtn.addEventListener('mouseup', function(e) { e.preventDefault(); game.leftPressed = false; });
            leftBtn.addEventListener('mouseleave', function(e) { game.leftPressed = false; });
            rightBtn.addEventListener('mousedown', function(e) { e.preventDefault(); game.rightPressed = true; });
            rightBtn.addEventListener('mouseup', function(e) { e.preventDefault(); game.rightPressed = false; });
            rightBtn.addEventListener('mouseleave', function(e) { game.rightPressed = false; });
            jumpBtn.addEventListener('mousedown', function(e) {
                e.preventDefault();
                if (!game.gameClear && !game.gameOver && !isClearOverlayActive && !waitingForStageTransition && !isRetryOverlayActive && !isEndingActive) {
                    game.jumpPressed = true;
                }
            });
            resetBtn.addEventListener('click', resetGame);

            // ---------- ゲームループ ----------
            function gameLoop() {
                if (isEndingActive) {
                    return;
                }
                if (!game.gameClear && !game.gameOver && !waitingForStageTransition && !isRetryOverlayActive) {
                    updatePhysics();
                }
                if (!isClearOverlayActive && !waitingForStageTransition && !isRetryOverlayActive) {
                    draw();
                } else {
                    ctx.clearRect(0, 0, 800, 400);
                }
                requestAnimationFrame(gameLoop);
            }

            // ---------- 初期化 ----------
            buildLandStage();
            updateUI();
            gameLoop();

            twitchChat.classList.remove('active');
            streamToggleBtn.className = 'stream-badge';
            streamToggleBtn.textContent = '🔒 配信モード (スコア1000)';
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = null;

        })();
    </script>
</body>
</html>
