<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マリリオ · 5ステージ構成 (ボスステージ)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'メイリオ', sans-serif;
            touch-action: none;
            padding: 20px;
        }
        .container {
            background: #2d2d44;
            padding: 20px 30px 30px;
            border-radius: 28px;
            box-shadow: 0 12px 0 #0f0f1a;
            max-width: 900px;
            width: 100%;
            position: relative;
        }
        .canvas-wrap {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 6px solid #4a3f2b;
            border-radius: 16px;
            box-shadow: inset 0 0 0 3px #c9a87c, 0 10px 0 #2b241b;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            aspect-ratio: 800/400;
            cursor: default;
            touch-action: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: #f0e6b0;
            text-shadow: 2px 2px 0 #3d2f1f;
            font-weight: bold;
            font-size: 18px;
            background: #4a3f2b;
            padding: 10px 20px;
            border-radius: 60px;
            border-bottom: 5px solid #2b241b;
            flex-wrap: wrap;
            gap: 8px;
        }
        .info span { background: #2b241b; padding: 4px 18px; border-radius: 40px; color: #ffd78a; }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .mouse-btn {
            background: #5a4f3a;
            border: none;
            border-bottom: 5px solid #2b241b;
            color: #f0e6b0;
            font-weight: bold;
            font-size: 20px;
            padding: 4px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #1f1a12;
            min-width: 60px;
        }
        .mouse-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .mouse-btn.left-btn { background: #3d6b8a; }
        .mouse-btn.right-btn { background: #8a5a3d; }
        .mouse-btn.jump-btn { background: #6a8a3d; }
        button {
            background: #f5c542;
            border: none;
            border-bottom: 6px solid #b47d2a;
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 18px;
            color: #2d2d1c;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #4f3d1a;
        }
        button:active { transform: translateY(4px); border-bottom-width: 2px; }
        .footer {
            margin-top: 12px;
            text-align: center;
            color: #8d8da0;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .footer .mouse-hint {
            display: inline-block;
            background: #3d3d5a;
            padding: 4px 16px;
            border-radius: 40px;
            color: #d4d4e8;
        }
        .stream-badge {
            background: #555;
            color: #aaa;
            border-radius: 40px;
            padding: 4px 18px;
            font-weight: bold;
            cursor: not-allowed;
            transition: 0.3s;
        }
        .stream-badge.unlocked {
            background: #9147ff;
            color: white;
            cursor: pointer;
        }
        .stream-badge.unlocked:hover { opacity: 0.85; }
        .gameover-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #ff6b6b;
            font-size: 42px;
            font-weight: bold;
            padding: 20px 50px;
            border-radius: 30px;
            border: 6px solid #ff6b6b;
            text-shadow: 0 0 20px #ff0000;
            z-index: 10;
            display: none;
            text-align: center;
            pointer-events: none;
        }

        .stage-transition {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 25, 0.88);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 25;
            border-radius: 16px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 20px;
        }
        .stage-transition.active { display: flex; }
        .stage-transition .card {
            background: #f0f4f0;
            max-width: 450px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 40px 20px 40px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            border: 6px solid #f5c542;
            color: #1a2a1a;
            text-align: center;
        }
        .stage-transition .card h2 {
            font-size: 32px;
            border-bottom: 5px dotted #f5c542;
            padding-bottom: 18px;
            margin-bottom: 18px;
            color: #1f4a2f;
        }
        .stage-transition .card .big-icon { font-size: 60px; margin: 10px 0; }
        .stage-transition .card .next-btn {
            background: #3a6b4a;
            border: none;
            border-bottom: 6px solid #1f3f2a;
            color: white;
            font-weight: bold;
            font-size: 24px;
            padding: 14px 36px;
            border-radius: 60px;
            cursor: pointer;
            margin: 16px 0;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #1a2a1a;
        }
        .stage-transition .card .next-btn:active { transform: translateY(4px); border-bottom-width: 2px; }

        .retry-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 25, 0.88);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 26;
            border-radius: 16px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 20px;
        }
        .retry-overlay.active { display: flex; }
        .retry-overlay .card {
            background: #f0f4f0;
            max-width: 480px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 40px 20px 40px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            border: 6px solid #c92a2a;
            color: #1a2a1a;
            text-align: center;
        }
        .retry-overlay .card h2 {
            font-size: 30px;
            border-bottom: 5px dotted #c92a2a;
            padding-bottom: 18px;
            margin-bottom: 18px;
            color: #6a1a1a;
        }
        .retry-overlay .card .big-icon { font-size: 60px; margin: 10px 0; }
        .retry-overlay .card .retry-btn {
            background: #3a6b4a;
            border: none;
            border-bottom: 6px solid #1f3f2a;
            color: white;
            font-weight: bold;
            font-size: 22px;
            padding: 14px 30px;
            border-radius: 60px;
            cursor: pointer;
            margin: 8px 0;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #1a2a1a;
            display: block;
            width: 100%;
        }
        .retry-overlay .card .retry-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .retry-overlay .card .retry-btn:disabled {
            background: #888;
            border-bottom-color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .retry-overlay .card .giveup-btn {
            background: #b13e3e;
            border: none;
            border-bottom: 6px solid #6e2626;
            color: white;
            font-weight: bold;
            font-size: 20px;
            padding: 10px 30px;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #3d1a1a;
            display: block;
            width: 100%;
        }
        .retry-overlay .card .giveup-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .retry-overlay .card .footnote {
            margin-top: 14px;
            font-size: 14px;
            color: #4d5e4d;
            border-top: 2px dashed #b3c9b3;
            padding-top: 14px;
        }

        .clear-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 25, 0.92);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 16px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 20px;
        }
        .clear-overlay.active { display: flex; }
        .clear-card {
            background: #f0f4f0;
            max-width: 500px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 40px 20px 40px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            border: 6px solid #f5c542;
            color: #1a2a1a;
            text-align: center;
        }
        .clear-card h2 {
            font-size: 34px;
            border-bottom: 5px dotted #f5c542;
            padding-bottom: 20px;
            margin-bottom: 20px;
            color: #1f4a2f;
        }
        .clear-card .big-icon { font-size: 70px; margin: 10px 0; }
        .clear-card .redirect-btn {
            background: #3a6b4a;
            border: none;
            border-bottom: 6px solid #1f3f2a;
            color: white;
            font-weight: bold;
            font-size: 26px;
            padding: 16px 40px;
            border-radius: 60px;
            cursor: pointer;
            margin: 20px 0;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #1a2a1a;
        }
        .clear-card .redirect-btn:active { transform: translateY(4px); border-bottom-width: 2px; }

        .ending-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a1a;
            justify-content: center;
            align-items: center;
            z-index: 35;
            border-radius: 16px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 0;
            overflow: hidden;
        }
        .ending-overlay.active { display: flex; }
        .ending-overlay canvas,
        .ending-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            image-rendering: pixelated;
            display: block;
        }
        .ending-overlay img { display: none; }

        .twitch-chat {
            position: absolute;
            right: 8px;
            top: 10px;
            width: 160px;
            height: 340px;
            pointer-events: none;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #6441a5;
            box-shadow: 0 0 20px rgba(100, 65, 165, 0.5);
            display: none;
            z-index: 20;
            backdrop-filter: blur(2px);
            padding: 4px 0;
        }
        .twitch-chat.active { display: block; }
        .chat-line {
            color: #fff;
            font-size: 12px;
            padding: 2px 8px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            text-shadow: 0 0 6px #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.95;
            animation: chatScroll 7s linear forwards;
            position: relative;
            width: 100%;
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transform: translateY(0);
        }
        .chat-line .username {
            color: #bf94ff;
            font-weight: bold;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .chat-line .message {
            color: #f0f0f0;
            display: inline-block;
        }
        @keyframes chatScroll {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .stage-indicator {
            background: #2b241b;
            padding: 4px 18px;
            border-radius: 40px;
            color: #7ec8ff;
            font-size: 16px;
        }

        @media (max-width: 640px) { .twitch-chat { width: 120px; height: 250px; right: 4px; top: 6px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div id="gameoverMsg" class="gameover-msg">💀 GAME OVER</div>
            
            <div id="stageTransition" class="stage-transition">
                <div class="card">
                    <div class="big-icon" id="transitionIcon">🌊</div>
                    <h2 id="transitionTitle">ステージ2 水のステージ</h2>
                    <p id="transitionDesc" style="font-size:18px; margin-bottom:12px;">毒水に落ちたら即ゲームオーバー！<br>毒水しぶきにも注意！</p>
                    <button class="next-btn" id="stageTransitionBtn">▶ 挑戦する</button>
                </div>
            </div>

            <div id="retryOverlay" class="retry-overlay">
                <div class="card">
                    <div class="big-icon">💀</div>
                    <h2>ゲームオーバー</h2>
                    <p style="font-size:16px; margin-bottom:8px;">コイン1000を支払えば<br>マグマステージからやり直せます</p>
                    <button class="retry-btn" id="retryBtn">🪙 1000コインでリトライ</button>
                    <button class="giveup-btn" id="giveupBtn">✕ あきらめる</button>
                    <div class="footnote" id="retryFootnote">所持スコア: 0</div>
                </div>
            </div>

            <div id="clearOverlay" class="clear-overlay">
                <div class="clear-card">
                    <div class="big-icon">🏆</div>
                    <h2>🎉 全ステージクリア！</h2>
                    <p style="font-size:18px; margin-bottom:18px;">IT用語 × サッカーの解説はこちら</p>
                    <button class="redirect-btn" id="clearRedirectBtn">⚽ pass.html へ</button>
                    <div class="footnote">同じタブで移動します</div>
                </div>
            </div>

            <!-- エンディングオーバーレイ (Canvas静止画 → 3秒 → 画像 → 3秒 → 誘導画面) -->
            <div id="endingOverlay" class="ending-overlay">
                <canvas id="endingCanvas" width="800" height="400"></canvas>
                <img id="endingImage" src="img178mario.jpg" alt="Mario saves Peach">
            </div>

            <div id="twitchChat" class="twitch-chat"></div>
        </div>
        <div class="info">
            <span class="stage-indicator" id="stageDisplay">🌿 ステージ1</span>
            <span id="scoreDisplay">🟡 0</span>
            <div class="controls">
                <button class="mouse-btn left-btn" id="leftBtn">◀</button>
                <button class="mouse-btn jump-btn" id="jumpBtn">▲ ジャンプ</button>
                <button class="mouse-btn right-btn" id="rightBtn">▶</button>
            </div>
            <button id="resetBtn">↺ リスタート</button>
        </div>
        <div class="footer">
            <span class="mouse-hint">🖱 左右ボタンで移動 / ジャンプ</span>
            <span class="stream-badge" id="streamToggleBtn">🔒 配信モード (スコア1000)</span>
            <span id="stageHint">🏁 旗で次のステージへ</span>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM ----------
            var canvas = document.getElementById('gameCanvas');
            var ctx = canvas.getContext('2d');
            var endingCanvas = document.getElementById('endingCanvas');
            var ectx = endingCanvas.getContext('2d');
            var endingImage = document.getElementById('endingImage');
            var scoreSpan = document.getElementById('scoreDisplay');
            var stageDisplay = document.getElementById('stageDisplay');
            var stageHint = document.getElementById('stageHint');
            var resetBtn = document.getElementById('resetBtn');
            var clearOverlay = document.getElementById('clearOverlay');
            var clearRedirectBtn = document.getElementById('clearRedirectBtn');
            var stageTransition = document.getElementById('stageTransition');
            var stageTransitionBtn = document.getElementById('stageTransitionBtn');
            var transitionIcon = document.getElementById('transitionIcon');
            var transitionTitle = document.getElementById('transitionTitle');
            var transitionDesc = document.getElementById('transitionDesc');
            var retryOverlay = document.getElementById('retryOverlay');
            var retryBtn = document.getElementById('retryBtn');
            var giveupBtn = document.getElementById('giveupBtn');
            var retryFootnote = document.getElementById('retryFootnote');
            var endingOverlay = document.getElementById('endingOverlay');
            var gameoverMsg = document.getElementById('gameoverMsg');
            var leftBtn = document.getElementById('leftBtn');
            var rightBtn = document.getElementById('rightBtn');
            var jumpBtn = document.getElementById('jumpBtn');
            var streamToggleBtn = document.getElementById('streamToggleBtn');
            var twitchChat = document.getElementById('twitchChat');

            // ---------- 状態 ----------
            var isStreaming = false;
            var chatInterval = null;
            var isClearOverlayActive = false;
            var streamUnlocked = false;
            var currentStage = 'land';
            var waitingForStageTransition = false;
            var isRetryOverlayActive = false;
            var isEndingActive = false;

            var landComments = [
                "本物のマリオの世界だ！凄い！", "クリボーがいる！気をつけて！", "やっぱりマリオは神", "配信者かわいい", "ジャンプうますぎ", "コイン取った！", "あのクリボーやばい", "BGMほしい", "スター欲しい", "マリオ頑張れ！",
                "1UP取って！", "裏道ある？", "無限増殖バグ？", "あっちに隠しブロック", "クリボー踏めるよ", "キノコどこ？", "ファイアマリオになろう", "パワーアップ！", "ここで死んだら笑う", "もっと右！",
                "旗まであと少し", "タイム気にしなくていいの？", "スーパーマリオ感", "壁キックできる？", "あのクリボー二回踏んだ", "コイン100枚で1UP", "配信楽しい", "ワールド1-1", "おつかれさま", "また明日も見る"
            ];
            var waterComments = [
                "🌊 水のステージだ！", "毒水怖い！", "しぶきに気をつけて！", "浮島ジャンプ難しい", "落ちないで！", "マリオ泳げないの？", "毒水やばい", "クリボーも水に弱い？", "ここが難所", "がんばれ！",
                "あと少し！", "毒水しぶききた！", "ジャンプのタイミングが命", "右の足場に飛べ！", "コイン取れた！", "このステージ好き", "BGMほしい", "水の音がいい", "クリアできるかな", "もう少しで旗だ！"
            ];
            var desertComments = [
                "🏜️ 砂漠ステージ！", "クリボーが弓で撃ってくる！", "矢に気をつけて！", "砂漠暑そう", "サボテンある？", "弓クリボーやばい", "ジャンプで避けて！", "矢が飛んできた！", "砂嵐きた", "ここが難所",
                "あと少し！", "弓矢こわい", "クリボー強い", "動きながら避けて", "コイン取れた！", "このステージ好き", "砂漠のBGMほしい", "ラクダいる？", "クリアできるかな", "もう少しで旗だ！"
            ];
            var iceComments = [
                "❄️ 氷のステージ！", "床が滑る！", "デザートイーグルだ！", "銃クリボーやばい！", ".50AE怖い！", "銀色の銃だ！", "黒い銃も！", "滑って止まれない！", "ジャンプで避けて！", "弾が飛んできた！",
                "あと少し！", "デザートイーグル強すぎ", "クリボー武装しすぎ", "ここが難所", "コイン取れた！", "このステージ好き", "氷のBGMほしい", "ペンギンいる？", "クリアできるかな", "もう少しで旗だ！"
            ];
            var magmaComments = [
                "🌋 マグマステージ！ ボスだ！", "クッパだ！", "イーロン・マスク！？", "テスラが飛んできた！", "SpaceXロケットだ！", "溶岩が下から！", "クリボーもいる！", "避けて！", "ここが最終ステージ", "がんばれ！",
                "クッパ強い！", "テスラ避けた！", "ロケット怖い", "溶岩注意！", "コイン取れた！", "このステージ好き", "マグマのBGMほしい", "ピーチを救え！", "クリアできるかな", "もう少しで旗だ！",
                "旗まであと少し！", "クッパ撃破！", "緊張する", "応援してる", "ファイト！", "絶対クリアして", "すごい！", "プロの技", "感動した", "おめでとう！"
            ];
            var currentCommentPool = landComments;

            // ゲーム変数
            var game = {
                mario: { x: 50, y: 290, w: 28, h: 38, vy: 0, vx: 0, onGround: false, facing: 1 },
                platforms: [],
                coins: [],
                enemies: [],
                poisonSplashes: [],

            // ---------- ステージ構築 ----------
            function buildLandStage() {
                currentStage = 'land';
                currentCommentPool = landComments;
                stageDisplay.textContent = '🌿 ステージ1';
                stageHint.textContent = '🏁 旗で次のステージへ';
                document.querySelector('.container').style.background = '#2d2d44';

                game.platforms = [ { x: 0, y: 330, w: 800, h: 70 } ];
                game.platforms.push(

                    { x: 620, y: 180, w: 80, h: 20 }

                game.coins = [
                    { x: 180, y: 230, w: 16, h: 16, collected: false },
                    { x: 230, y: 230, w: 16, h: 16, collected: false },
                    { x: 320, y: 170, w: 16, h: 16, collected: false },
                    { x: 360, y: 170, w: 16, h: 16, collected: false },
                    { x: 500, y: 210, w: 16, h: 16, collected: false },
