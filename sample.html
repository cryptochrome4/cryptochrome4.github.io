<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高級本・質感表現</title>
  <style>
    /* 全体の背景とリセット */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #2e241f;
      background-image: radial-gradient(circle at 20% 30%, #4a3e36 0%, #1e1814 90%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Times New Roman', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      padding: 1.5rem;
      margin: 0;
    }

    /* 本全体を包むコンテナ */
    .book-wrapper {
      perspective: 2000px;
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.8));
    }

    /* 本本体 - 表紙とページを含む */
    .book {
      position: relative;
      width: 100%;
      aspect-ratio: 1.4 / 1; /* 横長 */
      max-width: 800px;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    /* ===== 高級本の表紙 ===== */
    .book-cover {
      position: absolute;
      inset: 0;
      border-radius: 8px 20px 20px 8px; /* 右側が少し丸い本らしさ */
      background: #2d1f14;
      background-image: 
        linear-gradient(145deg, rgba(200, 170, 130, 0.2) 0%, transparent 40%),
        linear-gradient(225deg, #3a2a1e 0%, #1e130c 100%);
      box-shadow: 
        inset 0 0 15px rgba(255, 235, 200, 0.3),
        inset -5px 0 15px rgba(0, 0, 0, 0.7),
        inset 5px 0 10px rgba(255, 220, 150, 0.15),
        0 20px 30px rgba(0, 0, 0, 0.7);
      z-index: 20;
      /* 革の質感：細かいノイズ */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #e6d5b8;
      text-shadow: 2px 2px 4px #0a0503, 0 0 10px rgba(180, 140, 90, 0.6);
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.8s ease;
      transform-origin: left center;
      cursor: pointer;
      border-left: 8px solid #4a3727;
      border-right: 3px solid #6b4f36;
    }

    /* 表紙の革シボ模様 */
    .book-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.08) 0px, rgba(0, 0, 0, 0.08) 2px, transparent 2px, transparent 6px),
        repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 5px);
      opacity: 0.7;
      pointer-events: none;
      border-radius: inherit;
    }

    /* 革の光沢（斜めのハイライト） */
    .book-cover::after {
      content: "";
      position: absolute;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 140%;
      background: radial-gradient(ellipse at 30% 40%, rgba(255, 235, 200, 0.25) 0%, transparent 70%);
      transform: rotate(25deg);
      pointer-events: none;
      border-radius: 50%;
      mix-blend-mode: overlay;
    }

    /* 表紙のタイトル */
    .cover-title {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      letter-spacing: 0.1em;
      font-weight: 700;
      font-family: 'Times New Roman', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      text-transform: uppercase;
      color: #dac29b;
      text-shadow: 0 0 8px #000, 3px 3px 0 #1a120d;
      border-bottom: 2px solid rgba(200, 170, 120, 0.6);
      padding-bottom: 0.25rem;
      margin-bottom: 0.5rem;
      z-index: 3;
      background: linear-gradient(180deg, #f3e3c9, #b89b70);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 3px black);
      pointer-events: none;
    }

    .cover-sub {
      font-size: clamp(0.8rem, 2vw, 1.2rem);
      letter-spacing: 0.3em;
      color: #a58e6f;
      text-transform: uppercase;
      z-index: 3;
      border-top: 1px solid rgba(200, 170, 120, 0.4);
      padding-top: 0.5rem;
      font-style: italic;
      pointer-events: none;
    }

    /* 装飾用の金箔押し風 */
    .cover-ornament {
      position: absolute;
      width: 60%;
      height: 60%;
      border: 1px solid rgba(220, 190, 130, 0.4);
      border-radius: 50%;
      z-index: 2;
      top: 20%;
      left: 20%;
      box-shadow: 0 0 20px rgba(220, 180, 100, 0.2), inset 0 0 20px rgba(220, 180, 100, 0.1);
      pointer-events: none;
    }

    /* ページ部分（右側の高級紙） */
    .pages {
      position: absolute;
      inset: 0;
      border-radius: 8px 20px 20px 8px;
      background: #f7f1e4;
      background-image: 
        linear-gradient(90deg, rgba(200, 170, 130, 0.1) 0%, transparent 10%, transparent 90%, rgba(200, 170, 130, 0.15) 100%),
        radial-gradient(circle at 30% 40%, #fff8eb 0%, #ede3d2 90%);
      box-shadow: 
        inset -10px 0 20px rgba(120, 80, 50, 0.2),
        inset 10px 0 15px rgba(100, 70, 40, 0.15),
        5px 10px 20px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #3d2b1a;
      overflow: hidden;
      border-left: 2px solid #d9c9b2;
      transition: box-shadow 0.6s ease;
    }

    /* 高級紙の質感：微細なテクスチャ */
    .pages::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        repeating-linear-gradient(0deg, rgba(180, 150, 110, 0.08) 0px, rgba(180, 150, 110, 0.08) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(200, 170, 130, 0.05) 0px, rgba(200, 170, 130, 0.05) 1px, transparent 1px, transparent 5px);
      opacity: 0.6;
      pointer-events: none;
    }

    /* ページの縁（小口）の表現 */
    .pages::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 12px;
      background: linear-gradient(90deg, #d9c9b2, #b8a58b, #d9c9b2);
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.2);
      border-radius: 0 20px 20px 0;
      opacity: 0.8;
    }

    /* ページ内のテキスト（高級紙に印刷された風） */
    .page-content {
      text-align: center;
      max-width: 80%;
      padding: 1rem;
      z-index: 5;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      line-height: 1.8;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 2px rgba(255, 255, 240, 0.8);
      color: #2c1e12;
      background: linear-gradient(180deg, rgba(255, 245, 230, 0.4), rgba(240, 225, 200, 0.2));
      padding: 1.8rem 1.2rem;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(230, 210, 180, 0.3);
      font-family: 'Times New Roman', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      border: 1px solid rgba(180, 140, 100, 0.2);
      backdrop-filter: blur(1px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .page-content i {
      font-style: italic;
      display: block;
      margin-top: 1rem;
      font-size: 0.9em;
      color: #5a4230;
      border-top: 1px dashed #b8a58b;
      padding-top: 0.8rem;
    }

    /* ===== ナビゲーションボタン ===== */
    .nav-row {
      position: absolute;
      bottom: 20px;
      right: 30px;
      z-index: 40;
      display: flex;
      gap: 0.8rem;
    }

    .nav-btn {
      background: #221a14;
      border: 2px solid #b89b70;
      color: #f0e2cc;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 0.55rem 1.4rem;
      border-radius: 40px;
      letter-spacing: 0.2em;
      cursor: pointer;
      box-shadow: 0 8px 0 #0a0603, 0 10px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.1s ease;
      font-family: 'Times New Roman', serif;
      text-transform: uppercase;
      transform: translateY(-3px);
    }

    .nav-btn:hover:not(:disabled) {
      background: #382a1e;
      box-shadow: 0 5px 0 #0a0603, 0 12px 20px rgba(0, 0, 0, 0.6);
      transform: translateY(-1px);
      color: #ffeac2;
    }

    .nav-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0a0603, 0 8px 12px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: translateY(0);
      box-shadow: 0 2px 0 #0a0603;
    }

    /* ページめくりアニメーション（表紙が開く） */
    .book-cover.flip {
      transform: rotateY(-160deg) translateX(-2%) scale(0.98);
      box-shadow: 
        inset 0 0 30px rgba(255, 235, 200, 0.4),
        inset -10px 0 20px rgba(0, 0, 0, 0.8),
        -20px 10px 30px rgba(0, 0, 0, 0.6);
    }

    /* めくった後のページ強調 */
    .pages.reveal {
      box-shadow: 
        inset -10px 0 20px rgba(120, 80, 50, 0.3),
        inset 10px 0 15px rgba(100, 70, 40, 0.2),
        -5px 10px 25px rgba(0, 0, 0, 0.7);
    }

    /* 小さな注釈 */
    .hint {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      color: #c7b29b;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.7;
      text-shadow: 0 2px 5px black;
    }

    /* ページのカール（小口の立体感） */
    .page-curl {
      position: absolute;
      top: 0;
      right: 0;
      width: 30px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 245, 230, 0.2) 40%, rgba(220, 200, 170, 0.6));
      border-radius: 0 20px 20px 0;
      pointer-events: none;
      z-index: 15;
      mix-blend-mode: overlay;
    }

    /* レスポンシブ調整 */
    @media (max-width: 600px) {
      .book {
        aspect-ratio: 1.2 / 1;
      }
      .page-content {
        font-size: 0.9rem;
        padding: 1rem;
      }
      .nav-btn {
        font-size: 0.85rem;
        padding: 0.4rem 1rem;
      }
      .nav-row {
        bottom: 12px;
        right: 18px;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="book-wrapper">
    <div class="book">
      <!-- 高級本の表紙（革） -->
      <div class="book-cover" id="cover">
        <div class="cover-ornament"></div>
        <div class="cover-title">LUXE</div>
        <div class="cover-sub">EDITION ROYALE</div>
      </div>
      
      <!-- ページ（高級紙） -->
      <div class="pages" id="pages">
        <div class="page-curl"></div>
        <div class="page-content" id="pageContent">
          <span>高級紙の質感</span>
          <i>— 上質な風合い —</i>
          <div style="margin-top: 1.5rem; font-size: 0.7em; letter-spacing: 0.2em; color: #7a624a;">PAGE 1</div>
        </div>
      </div>
      
      <!-- ナビゲーションボタン -->
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">PREV</button>
        <button class="nav-btn" id="nextBtn">NEXT</button>
      </div>
      
      <!-- ヒント -->
      <div class="hint">CLICK "NEXT" OR COVER</div>
    </div>
  </div>

  <script>
    (function() {
      const cover = document.getElementById('cover');
      const pages = document.getElementById('pages');
      const nextBtn = document.getElementById('nextBtn');
      const prevBtn = document.getElementById('prevBtn');
      const pageContent = document.getElementById('pageContent');

      // ページ内容のバリエーション
      const pageTexts = [
        { main: '高級紙の質感', sub: '— 上質な風合い —', extra: 'PAGE 1' },
        { main: '滑らかな手触り', sub: '— コットン100% —', extra: 'PAGE 2' },
        { main: '耳付きの風合い', sub: '— 手漉き風 —', extra: 'PAGE 3' },
        { main: '深みのあるインク', sub: '— 顔料系 —', extra: 'FIN' }
      ];

      let currentPage = 0;
      let isCoverOpen = false;

      // ページ内容の更新
      function updatePageContent(index) {
        const data = pageTexts[index];
        pageContent.innerHTML = `
          <span style="font-size:1.2em; font-weight:500;">${data.main}</span>
          <i>${data.sub}</i>
          <div style="margin-top: 1.5rem; font-size: 0.7em; letter-spacing: 0.2em; color: #7a624a;">${data.extra}</div>
        `;
      }

      // ボタン状態の同期
      function syncButtons() {
        if (!isCoverOpen) {
          // 表紙が閉じている：PREV無効、NEXT有効
          prevBtn.disabled = true;
          nextBtn.disabled = false;
        } else {
          // 表紙が開いている：PREVは常に有効（表紙に戻れる）
          prevBtn.disabled = false;
          nextBtn.disabled = (currentPage >= pageTexts.length - 1);
        }
      }

      // ページの小さなフラッシュアニメーション
      function flashContent() {
        pageContent.style.opacity = '0.6';
        pageContent.style.transform = 'scale(0.98)';
        setTimeout(() => {
          pageContent.style.opacity = '1';
          pageContent.style.transform = 'scale(1)';
        }, 150);
      }

      // 次のページ
      function nextPage() {
        if (!isCoverOpen) {
          // 表紙を開く
          cover.classList.add('flip');
          pages.classList.add('reveal');
          isCoverOpen = true;
          currentPage = 0;
          updatePageContent(0);
        } else {
          // 次のページへ
          if (currentPage < pageTexts.length - 1) {
            currentPage++;
            updatePageContent(currentPage);
          }
        }
        syncButtons();
        flashContent();
      }

      // 前のページ
      function prevPage() {
        if (!isCoverOpen) return;

        if (currentPage > 0) {
          // 前のページへ
          currentPage--;
          updatePageContent(currentPage);
        } else {
          // ページ0でPREV → 表紙を閉じる
          cover.classList.remove('flip');
          pages.classList.remove('reveal');
          isCoverOpen = false;
          currentPage = 0;
          updatePageContent(0);
        }
        syncButtons();
        flashContent();
      }

      // 初期化
      updatePageContent(0);
      syncButtons();

      // イベントリスナー
      nextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        nextPage();
      });

      prevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        prevPage();
      });

      // 表紙をクリックしても開く
      cover.addEventListener('click', function(e) {
        if (!isCoverOpen) {
          nextPage();
        }
      });
    })();
  </script>
</body>
</html>
