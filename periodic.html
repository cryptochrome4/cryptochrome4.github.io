<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周期表 元素Tier表作成ツール（超しつこいリセット版）</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --tier-s: #ff7f7f;
            --tier-a: #ffbf7f;
            --tier-b: #ffdf7f;
            --tier-c: #ffff7f;
            --tier-d: #bfff7f;
            --tier-e: #7fff7f;
            --tier-f: #7fffdf;
            --tier-g: #7f9fff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 240px 20px 20px 20px; /* ボタン復活のため余白を拡張 */
        }

        /* 固定ヘッダー（元素置き場 ＆ コントロール） */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #2a2a2a;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            text-align: center;
        }

        /* 操作ボタンのエリア */
        .controls {
            text-align: center;
            margin-bottom: 10px;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }

        /* Tier表の構造 */
        .tier-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #000;
            padding: 5px;
            border-radius: 8px;
        }

        .tier-row {
            display: flex;
            background-color: #222;
            min-height: 70px;
        }

        .tier-label {
            width: 80px;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: #333;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .label-s { background-color: var(--tier-s); }
        .label-a { background-color: var(--tier-a); }
        .label-b { background-color: var(--tier-b); }
        .label-c { background-color: var(--tier-c); }
        .label-d { background-color: var(--tier-d); }
        .label-e { background-color: var(--tier-e); }
        .label-f { background-color: var(--tier-f); }
        .label-g { background-color: var(--tier-g); }

        .drop-zone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px;
            align-content: center;
            min-height: 54px;
        }

        /* 元素アイテム */
        .element-item {
            width: 45px;
            height: 45px;
            background-color: #3a3a3a;
            border: 1px solid #555;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
        }

        .element-item:active {
            cursor: grabbing;
        }

        .element-symbol {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .element-number {
            font-size: 0.6rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- 未配置の元素一覧（上部に固定） -->
    <header>
        <h1>周期表 元素Tier表 (S〜G)</h1>
        <div class="controls">
            <button class="btn-reset" onclick="resetTierList()">表をリセット（初期化）</button>
        </div>
        <div id="element-bank" class="drop-zone"></div>
    </header>

    <!-- Tier表の土台 -->
    <div class="tier-container">
        <div class="tier-row"><div class="tier-label label-s">S</div><div class="drop-zone" id="tier-s"></div></div>
        <div class="tier-row"><div class="tier-label label-a">A</div><div class="drop-zone" id="tier-a"></div></div>
        <div class="tier-row"><div class="tier-label label-b">B</div><div class="drop-zone" id="tier-b"></div></div>
        <div class="tier-row"><div class="tier-label label-c">C</div><div class="drop-zone" id="tier-c"></div></div>
        <div class="tier-row"><div class="tier-label label-d">D</div><div class="drop-zone" id="tier-d"></div></div>
        <div class="tier-row"><div class="tier-label label-e">E</div><div class="drop-zone" id="tier-e"></div></div>
        <div class="tier-row"><div class="tier-label label-f">F</div><div class="drop-zone" id="tier-f"></div></div>
        <div class="tier-row"><div class="tier-label label-g">G</div><div class="drop-zone" id="tier-g"></div></div>
    </div>

    <script>
        const elements = [
            "H", "He", "Li", "Be", "B", "C", "N", "O", "F", "Ne",
            "Na", "Mg", "Al", "Si", "P", "S", "Cl", "Ar", "K", "Ca",
            "Sc", "Ti", "V", "Cr", "Mn", "Fe", "Co", "Ni", "Cu", "Zn",
            "Ga", "Ge", "As", "Se", "Br", "Kr", "Rb", "Sr", "Y", "Zr",
            "Nb", "Mo", "Tc", "Ru", "Rh", "Pd", "Ag", "Cd", "In", "Sn",
            "Sb", "Te", "I", "Xe", "Cs", "Ba", "La", "Ce", "Pr", "Nd",
            "Pm", "Sm", "Eu", "Gd", "Tb", "Dy", "Ho", "Er", "Tm", "Yb",
            "Lu", "Hf", "Ta", "W", "Re", "Os", "Ir", "Pt", "Au", "Hg",
            "Tl", "Pb", "Bi", "Po", "At", "Rn", "Fr", "Ra", "Ac", "Th",
            "Pa", "U", "Np", "Pu", "Am", "Cm", "Bk", "Cf", "Es", "Fm",
            "Md", "No", "Lr", "Rf", "Db", "Sg", "Bh", "Hs", "Mt", "Ds",
            "Rg", "Cn", "Nh", "Fl", "Mc", "Lv", "Ts", "Og"
        ];

        const elementNodes = {};
        elements.forEach((symbol, index) => {
            const atomNum = index + 1;
            const el = document.createElement('div');
            el.className = 'element-item';
            el.draggable = true;
            el.id = `elem-${atomNum}`;
            el.innerHTML = `
                <span class="element-number">${atomNum}</span>
                <span class="element-symbol">${symbol}</span>
            `;
            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', el.id);
            });
            elementNodes[`elem-${atomNum}`] = el;
        });

        const STORAGE_KEY = 'periodic_tier_list_v2';

        function saveCurrentState() {
            const state = {};
            document.querySelectorAll('.drop-zone').forEach(zone => {
                state[zone.id] = Array.from(zone.children).map(child => child.id);
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadSavedState() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                const state = JSON.parse(savedData);
                Object.keys(state).forEach(zoneId => {
                    const zone = document.getElementById(zoneId);
                    if (zone) {
                        state[zoneId].forEach(elemId => {
                            if (elementNodes[elemId]) {
                                zone.appendChild(elementNodes[elemId]);
                            }
                        });
                    }
                });
            } else {
                const bank = document.getElementById('element-bank');
                Object.values(elementNodes).forEach(el => bank.appendChild(el));
            }
        }

        const dropZones = document.querySelectorAll('.drop-zone');
        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const id = e.dataTransfer.getData('text/plain');
                const draggedElement = document.getElementById(id);
                if (draggedElement) {
                    zone.appendChild(draggedElement);
                    saveCurrentState();
                }
            });
        });

        // 🌟 4回連続でカマをかけるリセット機能
        function resetTierList() {
            if (!confirm('本当にリセットしますか？落ち着いてください、本当にリセットしますか？')) return;
            if (!confirm('いやいや、超落ち着いてください、本当にリセットしますか？')) return;
            if (!confirm('いやいや、超落ち着いてください、後悔はしませんか？')) return;
            if (!confirm('自分に問うてください、本当にリセットしますか？')) return;

            // 4回の確認をすべて突破した場合のみ実行
            localStorage.removeItem(STORAGE_KEY);
            const bank = document.getElementById('element-bank');
            Object.keys(elementNodes).sort((a, b) => {
                return parseInt(a.split('-')) - parseInt(b.split('-'));
            }).forEach(elemId => {
                bank.appendChild(elementNodes[elemId]);
            });
        }

        window.addEventListener('DOMContentLoaded', loadSavedState);
    </script>
</body>
</html>
