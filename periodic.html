<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周期表 118元素 ティア表作成ツール</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 20px;
        }
        h1 {
            font-size: 1.5rem;
        }
        .controls {
            margin-bottom: 20px;
        }
        button.reset-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button.reset-btn:hover {
            background-color: #e60000;
        }
        .tier-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tier-row {
            display: flex;
            background-color: #fff;
            border: 1px solid #ccc;
            min-height: 60px;
        }
        .tier-label {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-right: 1px solid #ccc;
            user-select: none;
        }
        /* 各ティアの識別色（最低限の視認性用） */
        .label-S { background-color: #ff7f7f; }
        .label-A { background-color: #ffbf7f; }
        .label-B { background-color: #ffff7f; }
        .label-C { background-color: #7fff7f; }
        .label-D { background-color: #7f9fff; }
        .label-E { background-color: #7fffff; }
        .label-F { background-color: #ff7fff; }
        .label-G { background-color: #bf7fff; }
        .label-POOL { background-color: #e0e0e0; width: 100px; }

        .tier-content {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px;
            align-items: center;
            flex: 1;
        }
        .element-card {
            display: inline-flex;
            align-items: center;
            background-color: #eee;
            border: 1px solid #bbb;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        .element-name {
            font-weight: bold;
            margin-right: 5px;
        }
        .move-select {
            font-size: 0.8rem;
            padding: 1px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>周期表 118元素 ティア表作成</h1>
    
    <div class="controls">
        <button class="reset-btn" onclick="secureReset()">ティア表をリセットする</button>
    </div>

    <div class="tier-container">
        <!-- ティア定義（S〜G） -->
        <div class="tier-row" id="row-S"><div class="tier-label label-S">S</div><div class="tier-content" id="content-S"></div></div>
        <div class="tier-row" id="row-A"><div class="tier-label label-A">A</div><div class="tier-content" id="content-A"></div></div>
        <div class="tier-row" id="row-B"><div class="tier-label label-B">B</div><div class="tier-content" id="content-B"></div></div>
        <div class="tier-row" id="row-C"><div class="tier-label label-C">C</div><div class="tier-content" id="content-C"></div></div>
        <div class="tier-row" id="row-D"><div class="tier-label label-D">D</div><div class="tier-content" id="content-D"></div></div>
        <div class="tier-row" id="row-E"><div class="tier-label label-E">E</div><div class="tier-content" id="content-E"></div></div>
        <div class="tier-row" id="row-F"><div class="tier-label label-F">F</div><div class="tier-content" id="content-F"></div></div>
        <div class="tier-row" id="row-G"><div class="tier-label label-G">G</div><div class="tier-content" id="content-G"></div></div>
        
        <!-- 初期プール -->
        <div class="tier-row" id="row-POOL" style="margin-top: 20px; border: 2px dashed #999;">
            <div class="tier-label label-POOL">POOL (P)</div>
            <div class="tier-content" id="content-POOL"></div>
        </div>
    </div>

<script>
// 1番から118番までの全元素データ（抜け漏れのないマスター配列）
const ALL_ELEMENTS = [
    { no: 1, sym: "H" }, { no: 2, sym: "He" }, { no: 3, sym: "Li" }, { no: 4, sym: "Be" }, { no: 5, sym: "B" },
    { no: 6, sym: "C" }, { no: 7, sym: "N" }, { no: 8, sym: "O" }, { no: 9, sym: "F" }, { no: 10, sym: "Ne" },
    { no: 11, sym: "Na" }, { no: 12, sym: "Mg" }, { no: 13, sym: "Al" }, { no: 14, sym: "Si" }, { no: 15, sym: "P" },
    { no: 16, sym: "S" }, { no: 17, sym: "Cl" }, { no: 18, sym: "Ar" }, { no: 19, sym: "K" }, { no: 20, sym: "Ca" },
    { no: 21, sym: "Sc" }, { no: 22, sym: "Ti" }, { no: 23, sym: "V" }, { no: 24, sym: "Cr" }, { no: 25, sym: "Mn" },
    { no: 26, sym: "Fe" }, { no: 27, sym: "Co" }, { no: 28, sym: "Ni" }, { no: 29, sym: "Cu" }, { no: 30, sym: "Zn" },
    { no: 31, sym: "Ga" }, { no: 32, sym: "Ge" }, { no: 33, sym: "As" }, { no: 34, sym: "Se" }, { no: 35, sym: "Br" },
    { no: 36, sym: "Kr" }, { no: 37, sym: "Rb" }, { sym: "Sr", no: 38 }, { no: 39, sym: "Y" }, { no: 40, sym: "Zr" },
    { no: 41, sym: "Nb" }, { no: 42, sym: "Mo" }, { no: 43, sym: "Tc" }, { no: 44, sym: "Ru" }, { no: 45, sym: "Rh" },
    { no: 46, sym: "Pd" }, { no: 47, sym: "Ag" }, { no: 48, sym: "Cd" }, { no: 49, sym: "In" }, { no: 50, sym: "Sn" },
    { no: 51, sym: "Sb" }, { no: 52, sym: "Te" }, { no: 53, sym: "I" }, { no: 54, sym: "Xe" }, { no: 55, sym: "Cs" },
    { no: 56, sym: "Ba" }, { no: 57, sym: "La" }, { no: 58, sym: "Ce" }, { no: 59, sym: "Pr" }, { no: 60, sym: "Nd" },
    { no: 61, sym: "Pm" }, { no: 62, sym: "Sm" }, { no: 63, sym: "Eu" }, { no: 64, sym: "Gd" }, { no: 65, sym: "Tb" },
    { no: 66, sym: "Dy" }, { no: 67, sym: "Ho" }, { no: 68, sym: "Er" }, { no: 69, sym: "Tm" }, { no: 70, sym: "Yb" },
    { no: 71, sym: "Lu" }, { no: 72, sym: "Hf" }, { no: 73, sym: "Ta" }, { no: 74, sym: "W" }, { no: 75, sym: "Re" },
    { no: 76, sym: "Os" }, { no: 77, sym: "Ir" }, { no: 78, sym: "Pt" }, { no: 79, sym: "Au" }, { no: 80, sym: "Hg" },
    { no: 81, sym: "Tl" }, { no: 82, sym: "Pb" }, { no: 83, sym: "Bi" }, { no: 84, sym: "Po" }, { no: 85, sym: "At" },
    { no: 86, sym: "Rn" }, { no: 87, sym: "Fr" }, { no: 88, sym: "Ra" }, { no: 89, sym: "Ac" }, { no: 90, sym: "Th" },
    { no: 91, sym: "Pa" }, { no: 92, sym: "U" }, { no: 93, sym: "Np" }, { no: 94, sym: "Pu" }, { no: 95, sym: "Am" },
    { no: 96, sym: "Cm" }, { no: 97, sym: "Bk" }, { no: 98, sym: "Cf" }, { no: 99, sym: "Es" }, { no: 100, sym: "Fm" },
    { no: 101, sym: "Md" }, { no: 102, sym: "No" }, { no: 103, sym: "Lr" }, { no: 104, sym: "Rf" }, { no: 105, sym: "Db" },
    { no: 106, sym: "Sg" }, { no: 107, sym: "Bh" }, { no: 108, sym: "Hs" }, { no: 109, sym: "Mt" }, { no: 110, sym: "Ds" },
    { no: 111, sym: "Rg" }, { no: 112, sym: "Cn" }, { no: 113, sym: "Nh" }, { no: 114, sym: "Fl" }, { no: 115, sym: "Mc" },
    { no: 116, sym: "Lv" }, { no: 117, sym: "Ts" }, { no: 118, sym: "Og" }
];

// ローカルストレージ用のキー
const STORAGE_KEY = 'periodic_tier_data';

// 各元素の現在の位置（ティア）を保持するオブジェクト
// 初期状態はすべて 'POOL'
let currentData = {};

// 初期データの読み込み処理
function initData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            currentData = JSON.parse(saved);
            // 保存データに漏れがないかチェックし、足りないものがあればPOOLに追加（不具合防止）
            ALL_ELEMENTS.forEach(el => {
                if (!currentData[el.no]) {
                    currentData[el.no] = 'POOL';
                }
            });
        } catch (e) {
            resetToDefault();
        }
    } else {
        resetToDefault();
    }
}

// デフォルト状態（すべてPOOL）にする
function resetToDefault() {
    currentData = {};
    ALL_ELEMENTS.forEach(el => {
        currentData[el.no] = 'POOL';
    });
}

// 画面のレンダリング処理
function renderTier() {
    // 一旦各エリアをクリア
    const targets = ['S', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'POOL'];
    targets.forEach(t => {
        document.getElementById(`content-${t}`).innerHTML = '';
    });

    // 元素を原子番号（no）の若い順に配置
    ALL_ELEMENTS.forEach(el => {
        const tier = currentData[el.no] || 'POOL';
        const container = document.getElementById(`content-${tier}`);

        if (container) {
            const card = document.createElement('div');
            card.className = 'element-card';
            
            // 元素記号テキスト
            const nameSpan = document.createElement('span');
            nameSpan.className = 'element-name';
            nameSpan.textContent = `${el.no}.${el.sym}`;
            card.appendChild(nameSpan);

            // 移動用選択ボタン（セレクトボックス）
            const select = document.createElement('select');
            select.className = 'move-select';
            select.onchange = (e) => moveElement(el.no, e.target.value);

            // セレクトボックスの選択肢（PはPOOLとして扱う）
            const options = [
                { value: 'POOL', text: 'P' },
                { value: 'S', text: 'S' },
                { value: 'A', text: 'A' },
                { value: 'B', text: 'B' },
                { value: 'C', text: 'C' },
                { value: 'D', text: 'D' },
                { value: 'E', text: 'E' },
                { value: 'F', text: 'F' },
                { value: 'G', text: 'G' }
            ];

            options.forEach(opt => {
                const o = document.createElement('option');
                o.value = opt.value;
                o.textContent = opt.text;
                if (opt.value === tier) {
                    o.selected = true;
                }
                select.appendChild(o);
            });

            card.appendChild(select);
            container.appendChild(card);
        }
    });
}

// 元素の位置を変更する関数
function moveElement(elementNo, targetTier) {
    currentData[elementNo] = targetTier;
    // 状態をローカルストレージに保存（更新しても消えない）
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
    renderTier();
}

// 4回連続で確認をかませるリセット関数
function secureReset() {
    // 1回目の確認
