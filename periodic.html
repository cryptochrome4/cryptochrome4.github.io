<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>周期表 118元素 ティア表作成</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .controls {
            margin-bottom: 20px;
        }
        button.reset-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        .tier-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tier-row {
            display: flex;
            border: 1px solid #ccc;
            background-color: #fff;
            min-height: 50px;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        /* ティアごとの背景色設定 */
        .tier-S .tier-label { background-color: #ff7f7f; }
        .tier-A .tier-label { background-color: #ffbf7f; }
        .tier-B .tier-label { background-color: #ffff7f; }
        .tier-C .tier-label { background-color: #7fff7f; }
        .tier-D .tier-label { background-color: #7f7fff; }
        .tier-E .tier-label { background-color: #7fffff; }
        .tier-F .tier-label { background-color: #ff7fff; }
        .tier-G .tier-label { background-color: #bf7fff; }
        .tier-P .tier-label { background-color: #e0e0e0; }

        .tier-content {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px;
            align-items: center;
            flex-grow: 1;
        }
        .element-card {
            display: inline-flex;
            align-items: center;
            border: 1px solid #aaa;
            padding: 3px 6px;
            background-color: #fafafa;
            border-radius: 3px;
            font-size: 14px;
        }
        .element-name {
            font-weight: bold;
            margin-right: 5px;
            min-width: 25px;
            text-align: center;
        }
        .tier-select {
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>周期表 118元素 ティア表作成</h1>
    
    <div class="controls">
        <button class="reset-btn" onclick="tryReset()">ティア表をリセットする</button>
    </div>

    <div class="tier-container">
        <!-- 各ティアの行 -->
        <div class="tier-row tier-S" id="row-S"><div class="tier-label">S</div><div class="tier-content" id="content-S"></div></div>
        <div class="tier-row tier-A" id="row-A"><div class="tier-label">A</div><div class="tier-content" id="content-A"></div></div>
        <div class="tier-row tier-B" id="row-B"><div class="tier-label">B</div><div class="tier-content" id="content-B"></div></div>
        <div class="tier-row tier-C" id="row-C"><div class="tier-label">C</div><div class="tier-content" id="content-C"></div></div>
        <div class="tier-row tier-D" id="row-D"><div class="tier-label">D</div><div class="tier-content" id="content-D"></div></div>
        <div class="tier-row tier-E" id="row-E"><div class="tier-label">E</div><div class="tier-content" id="content-E"></div></div>
        <div class="tier-row tier-F" id="row-F"><div class="tier-label">F</div><div class="tier-content" id="content-F"></div></div>
        <div class="tier-row tier-G" id="row-G"><div class="tier-label">G</div><div class="tier-content" id="content-G"></div></div>
        
        <!-- POOL（初期位置） -->
        <div class="tier-row tier-P" id="row-P"><div class="tier-label">POOL (P)</div><div class="tier-content" id="content-P"></div></div>
    </div>

<script>
// 118元素の定義（漏れがないよう完全に配置）
const allElements = [
    "H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar",
    "K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr",
    "Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe",
    "Cs","Ba","La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu",
    "Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg","Tl","Pb","Bi","Po","At","Rn",
    "Fr","Ra","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No","Lr",
    "Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og"
];

// データの保存キー
const STORAGE_KEY = "element_tier_mapping";

// 現在の配置状態を管理するオブジェクト (元素名: ティア名)
let currentMapping = {};

// 初期化処理
function init() {
    // ローカルストレージから保存データを読み込み
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        currentMapping = JSON.parse(saved);
    } else {
        // 保存データがなければ全てPOOL('P')に設定
        allElements.forEach(el => {
            currentMapping[el] = 'P';
        });
    }
    render();
}

// 画面への描画処理
function render() {
    // 一度すべてのティアの中身を空にする
    const tiers = ['S', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'P'];
    tiers.forEach(t => {
        document.getElementById(`content-${t}`).innerHTML = "";
    });

    // 118元素をループして、それぞれ指定されたティアのコンテナへ追加
    allElements.forEach(el => {
        const targetTier = currentMapping[el] || 'P';
        const container = document.getElementById(`content-${targetTier}`);
        
        if (container) {
            const card = document.createElement('div');
            card.className = 'element-card';
            
            // 元素名テキスト
            const nameSpan = document.createElement('span');
            nameSpan.className = 'element-name';
            nameSpan.textContent = el;
            card.appendChild(nameSpan);
            
            // 振り分け用セレクトボックス（ボタン代わり）
            const select = document.createElement('select');
            select.className = 'tier-select';
            select.onchange = (e) => changeTier(el, e.target.value);
            
            tiers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                if (t === targetTier) opt.selected = true;
                select.appendChild(opt);
            });
            
            card.appendChild(select);
            container.appendChild(card);
        }
    });
}

// ティアを変更したときの処理
function changeTier(element, newTier) {
    currentMapping[element] = newTier;
    // 状態を保存
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentMapping));
    // 再描画
    render();
}

// 4回警告を挟むリセット関数
function tryReset() {
    if (confirm("【警告 1/4】本当にティア表を初期化して、すべての元素をPOOLに戻しますか？")) {
        if (confirm("【警告 2/4】編集中のデータは完全に消去されます。本当によろしいですか？")) {
            if (confirm("【警告 3/4】後悔しませんか？（あと1回確認があります）")) {
                if (confirm("【最終警告 4/4】これが最後の確認です。本当にリセットしますか？")) {
                    // 全てPOOLに戻す
                    allElements.forEach(el => {
                        currentMapping[el] = 'P';
                    });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentMapping));
                    render();
                    alert("リセットが完了しました。すべての元素がPOOLに戻りました。");
                }
            }
        }
    }
}

// 開始
init();
</script>

</body>
</html>
