<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAISON DE LA BOURSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Playfair+Display:wght@400;700;900&family=Shippori+Mincho:wght@400;700&family=Inter:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #f4efe6;
    background-image: radial-gradient(circle at 25% 20%, #fffdf8 0%, #efe6d6 60%, #e2d4bd 100%);
    font-family: 'Cormorant Garamond', 'Shippori Mincho', 'Yu Mincho', serif;
    color: #4a3a28;
  }

  /* ===================== オープニング ===================== */
  #opening {
    position: fixed; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100;
  }
  #opening::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 60%, rgba(255,253,248,0.35), rgba(244,239,230,0.8));
    z-index: 0;
    opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
  }
  #opening.veil::before { opacity: 1; }
  #opening .title {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif; color: #8a6a2f;
    font-size: clamp(26px, 5.6vw, 60px); letter-spacing: 0.18em; font-weight: 900;
    text-shadow: 0 0 18px rgba(255,245,220,0.9), 0 1px 2px rgba(90,60,20,0.25);
    margin-bottom: 10px; text-align: center;
  }
  #opening .subtitle {
    position: relative; z-index: 1; color: #9a7c4a;
    font-family: 'Cormorant Garamond', serif; font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 0.35em; margin-bottom: 46px; text-transform: uppercase;
  }
  .btn-area { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; align-items: center; }

  /* 共通ボタン（白磁×金） */
  .btn {
    min-width: 230px; padding: 12px 28px;
    font-family: 'Cormorant Garamond', serif; font-size: clamp(14px, 1.8vw, 18px);
    font-weight: 700; letter-spacing: 0.2em; color: #6b4f22;
    background: linear-gradient(180deg, #fffdf8 0%, #f2e8d6 100%);
    border: 1.5px solid #c9a864; border-radius: 6px; cursor: pointer;
    text-shadow: 0 1px 0 #fff;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 3px 0 #d8c49a, 0 6px 14px rgba(120,90,40,0.18);
    transition: all 0.12s ease; transform: translateY(-2px);
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, #ffffff 0%, #f7efdf 100%);
    color: #8a6a2f;
    box-shadow: inset 0 0 14px rgba(255,250,235,1), 0 2px 0 #d8c49a, 0 8px 18px rgba(120,90,40,0.22);
    transform: translateY(0);
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #d8c49a, 0 3px 8px rgba(120,90,40,0.2); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: 0 2px 0 #d8c49a; transform: translateY(0); }

  .btn.small { min-width: 150px; padding: 8px 18px; font-size: 12px; letter-spacing: 0.16em; }

  /* 背景ビューア */
  #bgViewer { position: fixed; inset: 0; z-index: 200; background: #1a140c; display: none; justify-content: center; align-items: center; }
  #bgViewer.active { display: flex; }
  #bgViewer img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #bgViewer .close-viewer {
    position: absolute; top: 20px; right: 20px; z-index: 210; padding: 10px 24px;
    font-family: 'Cormorant Garamond', serif; letter-spacing: 0.2em; color: #f2e8d6;
    background: rgba(30,22,12,0.75); border: 1.5px solid #c9a864; cursor: pointer; border-radius: 6px;
  }
  #bgViewer .close-viewer:hover { background: rgba(201,168,100,0.3); color: #fff; }

  /* ゲーム画面 */
  #game {
    position: fixed; inset: 0; display: none; flex-direction: column;
    background: radial-gradient(circle at 50% 0%, #fffdf8 0%, #f0e7d8 70%, #e6d9c2 100%);
    z-index: 50; overflow: hidden;
  }
  #game.active { display: flex; }

  #topBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 18px;
    background: linear-gradient(180deg, #fffdf8 0%, #f4ecdd 100%);
    border-bottom: 1px solid rgba(201,168,100,0.6);
    font-size: 14px; letter-spacing: 0.12em; flex-shrink: 0; gap: 12px;
  }
  #topBar .left-group { display: flex; align-items: center; gap: 10px; }
  #topBar .right-group { display: flex; align-items: center; gap: 10px; }
  #topBar .clock {
    font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums;
    color: #8a6a2f;
  }
  #topBar .money {
    font-family: 'Playfair Display', serif; font-weight: 700; color: #6b4f22;
  }
  .bg-toggle-group {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 8px; border-left: 1px solid rgba(201,168,100,0.5);
  }
  .mini-btn {
    font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.1em;
    color: #6b4f22; background: rgba(255,253,248,0.95);
    border: 1px solid #c9a864; border-radius: 4px; padding: 3px 8px; cursor: pointer;
    transition: all 0.12s ease;
  }
  .mini-btn:hover { background: rgba(201,168,100,0.25); color: #4a3a28; }
  .mini-btn.on { background: #c9a864; color: #fffdf8; }
  #fitSelect {
    background: #fffdf8; color: #6b4f22; border: 1px solid #c9a864;
    border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 10px; padding: 3px 4px;
  }

  #main { flex: 1; display: flex; overflow: hidden; }

  #packArea {
    flex: 1.4; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 12px;
    position: relative; overflow: hidden;
  }
  #leftBgLayer {
    position: absolute; inset: 0; z-index: 0; display: none;
    background-repeat: no-repeat; background-position: center;
    background-size: cover;
  }
  #leftBgLayer.active { display: block; }
  /* 通常時はオーバーレイなし。透明度ON時のみ白味をかける */
  #leftBgLayer::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(255,253,248,0.55), rgba(244,236,221,0.75));
    opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
  }
  #leftBgLayer.veil::after { opacity: 1; }
  #packArea > *:not(#leftBgLayer) { position: relative; z-index: 1; }

  #packCardWrap { display: none; flex-direction: column; align-items: center; gap: 10px; }
  #packCardWrap.active { display: flex; }

  /* =========================================================
     銘柄カード骨格（白磁×金・耽美）
  ========================================================= */
  .ygo-card {
    width: 260px; height: 380px; padding: 10px;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
    transition: box-shadow 0.3s ease;
    border-radius: 8px;
  }

  .ygo-card.domestic {
    background:
      repeating-linear-gradient(135deg, rgba(201,168,100,0.05) 0px, rgba(201,168,100,0.05) 3px, transparent 3px, transparent 9px),
      radial-gradient(ellipse at 25% 15%, rgba(255,250,235,0.9) 0%, transparent 55%),
      linear-gradient(160deg, #fffdf8 0%, #efe4cf 100%);
    box-shadow:
      inset 0 0 24px rgba(255,255,255,0.9),
      inset 0 0 0 1px rgba(201,168,100,0.8),
      0 12px 26px rgba(120,90,40,0.22);
    border: 1px solid rgba(201,168,100,0.9);
    color: #5a4526;
  }
  .ygo-card.foreign {
    background:
      repeating-linear-gradient(45deg, rgba(160,120,170,0.06) 0px, rgba(160,120,170,0.06) 2px, transparent 2px, transparent 8px),
      radial-gradient(ellipse at 30% 20%, rgba(250,245,255,0.95) 0%, transparent 55%),
      linear-gradient(160deg, #fdfbff 0%, #ece2ef 100%);
    box-shadow:
      inset 0 0 26px rgba(255,255,255,0.9),
      inset 0 0 0 1px rgba(170,130,180,0.7),
      0 14px 30px rgba(120,80,130,0.22);
    border: 1px solid rgba(170,130,180,0.75);
    color: #5a4266;
  }
  .ygo-card.silver {
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.5) 48%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0.5) 52%, transparent 70%),
      repeating-linear-gradient(45deg, rgba(201,168,100,0.05) 0px, rgba(201,168,100,0.05) 2px, transparent 2px, transparent 6px),
      linear-gradient(160deg, #fdfbf6 0%, #e8ddc8 100%);
    box-shadow:
      inset 0 0 26px rgba(255,255,255,0.95),
      inset 0 0 0 1.5px rgba(201,168,100,0.95),
      0 16px 30px rgba(120,90,40,0.25);
    border: 1.5px solid rgba(201,168,100,0.95);
    color: #6b4f22;
  }
  .ygo-card.marble {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.9) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(240,225,255,0.9) 0%, transparent 50%),
      repeating-linear-gradient(45deg, rgba(170,130,180,0.06) 0px, rgba(170,130,180,0.06) 1px, transparent 1px, transparent 6px),
      linear-gradient(160deg, #fffaff 0%, #e9dced 100%);
    box-shadow:
      inset 0 0 32px rgba(255,255,255,0.95),
      inset 0 0 0 2px rgba(180,140,200,0.8),
      0 0 24px rgba(200,170,220,0.55),
      0 16px 30px rgba(120,80,130,0.28);
    border: 2px solid rgba(180,140,200,0.9);
    color: #5a4266;
  }
  .ygo-card.gold {
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,240,200,0.7) 48%, rgba(255,250,225,0.9) 50%, rgba(255,240,200,0.7) 52%, transparent 70%),
      radial-gradient(ellipse at 30% 20%, rgba(255,250,235,1) 0%, transparent 50%),
      repeating-linear-gradient(0deg, rgba(201,168,100,0.05) 0px, rgba(201,168,100,0.05) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, #fffdf4 0%, #f0e2bd 100%);
    box-shadow:
      inset 0 0 34px rgba(255,252,235,1),
      inset 0 0 0 2px rgba(201,168,100,1),
      0 0 30px rgba(232,200,120,0.65),
      0 18px 34px rgba(120,90,40,0.3);
    border: 2px solid rgba(201,168,100,1);
    color: #6b4f22;
  }

  .ygo-name {
    font-family: 'Playfair Display', serif; font-size: 11.5px; font-weight: 700;
    padding: 5px 8px; text-align: center; letter-spacing: 0.06em; min-height: 30px;
    display: flex; justify-content: center; align-items: center; gap: 6px;
    position: relative; z-index: 2;
  }
  .domestic .ygo-name { background: rgba(255,253,248,0.85); color: #6b4f22; border: 1px solid rgba(201,168,100,0.6); border-radius: 4px; }
  .foreign  .ygo-name { background: rgba(253,250,255,0.9);  color: #5a4266; border: 1px solid rgba(170,130,180,0.5); border-radius: 4px; }
  .silver   .ygo-name { background: rgba(255,253,248,0.9);  color: #6b4f22; border: 1px solid rgba(201,168,100,0.7); border-radius: 4px; }
  .marble   .ygo-name { background: rgba(253,250,255,0.92); color: #5a4266; border: 1px solid rgba(180,140,200,0.6); border-radius: 4px; }
  .gold     .ygo-name { background: rgba(255,253,244,0.95); color: #6b4f22; border: 1px solid rgba(201,168,100,0.85); border-radius: 4px; }

  .ygo-attr-mark {
    display: inline-block; width: 20px; height: 20px; line-height: 18px;
    text-align: center; border-radius: 4px; font-size: 10px; font-weight: 700;
    font-family: 'Shippori Mincho', serif; flex-shrink: 0;
  }
  .ygo-attr-mark.domestic { background: #c9a864; color: #fffdf8; border: 1px solid rgba(160,120,50,0.6); }
  .ygo-attr-mark.foreign  { background: #b48ac8; color: #fff; border: 1px solid rgba(140,90,170,0.6); }

  .ygo-art {
    flex: 1; margin: 6px 0; border-radius: 5px;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative; z-index: 2;
  }
  .domestic .ygo-art { background: #fffdf8; border: 1.5px solid rgba(201,168,100,0.7); }
  .foreign  .ygo-art { background: #fdfaff; border: 1.5px solid rgba(170,130,180,0.65); }
  .silver   .ygo-art { background: #fffdf8; border: 1.5px solid rgba(201,168,100,0.85); }
  .marble   .ygo-art { background: #fdfaff; border: 1.5px solid rgba(180,140,200,0.8); }
  .gold     .ygo-art { background: #fffdf4; border: 1.5px solid rgba(201,168,100,1); }
  .ygo-art canvas { width: 100%; height: 100%; image-rendering: auto; }

  .ygo-stats {
    display: flex; justify-content: space-between;
    font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums;
    font-size: 11px; font-weight: 700; padding: 4px 8px; letter-spacing: 0.03em;
    position: relative; z-index: 2;
  }
  .domestic .ygo-stats { background: rgba(255,253,248,0.9); color: #6b4f22; border: 1px solid rgba(201,168,100,0.55); border-radius: 4px; }
  .foreign  .ygo-stats { background: rgba(253,250,255,0.92); color: #5a4266; border: 1px solid rgba(170,130,180,0.5); border-radius: 4px; }
  .silver   .ygo-stats { background: rgba(255,253,248,0.92); color: #6b4f22; border: 1px solid rgba(201,168,100,0.6); border-radius: 4px; }
  .marble   .ygo-stats { background: rgba(253,250,255,0.94); color: #5a4266; border: 1px solid rgba(180,140,200,0.55); border-radius: 4px; }
  .gold     .ygo-stats { background: rgba(255,253,244,0.96); color: #6b4f22; border: 1px solid rgba(201,168,100,0.75); border-radius: 4px; }

  .ygo-effect {
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 10px;
    padding: 5px 7px; margin-top: 5px; min-height: 36px; line-height: 1.35;
    position: relative; z-index: 2; border-radius: 4px;
  }
  .domestic .ygo-effect { background: rgba(255,253,248,0.85); color: #5a4526; border: 1px solid rgba(201,168,100,0.5); }
  .foreign  .ygo-effect { background: rgba(253,250,255,0.88); color: #5a4266; border: 1px solid rgba(170,130,180,0.45); }
  .silver   .ygo-effect { background: rgba(255,253,248,0.9);  color: #5a4526; border: 1px solid rgba(201,168,100,0.55); }
  .marble   .ygo-effect { background: rgba(253,250,255,0.92); color: #5a4266; border: 1px solid rgba(180,140,200,0.5); }
  .gold     .ygo-effect { background: rgba(255,253,244,0.94); color: #5a4526; border: 1px solid rgba(201,168,100,0.65); }

  .type-tag { font-weight: 700; letter-spacing: 0.05em; }
  .type-tag.link { color: #2f7a5a; }
  .type-tag.xrp  { color: #b04848; }
  .domestic .type-tag.link { color: #2f7a5a; }
  .foreign  .type-tag.xrp  { color: #b04848; }

  .ygo-card.silver::before, .ygo-card.marble::before, .ygo-card.gold::before {
    content: ""; position: absolute; inset: 4px; border-radius: 5px; pointer-events: none; z-index: 1;
  }
  .silver::before { border: 1px solid rgba(201,168,100,0.35); }
  .marble::before { border: 1px solid rgba(180,140,200,0.4); box-shadow: inset 0 0 15px rgba(200,170,220,0.3); }
  .gold::before   { border: 1px solid rgba(201,168,100,0.6); box-shadow: inset 0 0 18px rgba(232,200,120,0.35); }

  .pack-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .pack-controls .btn { min-width: 88px; padding: 8px 12px; font-size: 11px; letter-spacing: 0.12em; }

  #buyArea { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #buyArea .buy-note { font-family: 'Inter', sans-serif; font-size: 11px; color: #9a7c4a; letter-spacing: 0.15em; }

  #infoPanel {
    flex: 1; border-left: 1px solid rgba(201,168,100,0.5);
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(255,253,248,0.98) 0%, rgba(244,236,221,0.98) 100%);
    overflow: hidden;
  }
  #infoPanel h3 {
    font-family: 'Playfair Display', serif; font-size: 12px; padding: 10px 12px;
    letter-spacing: 0.2em; color: #8a6a2f;
    border-bottom: 1px solid rgba(201,168,100,0.5);
    background: linear-gradient(90deg, rgba(201,168,100,0.15), transparent);
  }
  #sortSelect {
    margin: 8px 10px; padding: 5px 6px;
    background: #fffdf8; color: #6b4f22;
    border: 1px solid rgba(201,168,100,0.7); border-radius: 4px;
    font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.05em;
  }
  #infoList { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .info-item {
    padding: 6px 8px; font-size: 12px;
    border-bottom: 1px solid rgba(201,168,100,0.25);
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    color: #4a3a28; font-family: 'Shippori Mincho', serif; transition: background 0.15s ease;
    border-radius: 4px;
  }
  .info-item:hover { background: rgba(201,168,100,0.15); }

  #priceTable {
    border-top: 1px solid rgba(201,168,100,0.5);
    max-height: 38%; display: flex; flex-direction: column; overflow: hidden;
  }
  #priceTable h3 {
    font-size: 11px; padding: 8px 12px; color: #8a6a2f;
    border-bottom: 1px solid rgba(201,168,100,0.5);
    background: linear-gradient(90deg, rgba(201,168,100,0.15), transparent);
    font-family: 'Playfair Display', serif; letter-spacing: 0.18em;
  }
  #priceList { flex: 1; overflow-y: auto; padding: 4px 10px; font-size: 11px; font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
  .price-row {
    display: flex; justify-content: space-between; padding: 3px 0;
    border-bottom: 1px dashed rgba(201,168,100,0.25); color: #5a4526;
  }
  .price-row .up { color: #2f8a5a; }
  .price-row .down { color: #b04848; }

  #modal {
    position: fixed; inset: 0; background: rgba(40,30,18,0.55);
    display: none; justify-content: center; align-items: center; z-index: 300; backdrop-filter: blur(4px);
  }
  #modal.active { display: flex; }
  #modalInner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #modalControls { display: flex; gap: 12px; }
  #modalControls .btn { min-width: 120px; }

  #footer {
    flex-shrink: 0; height: 24px; background: rgba(255,253,248,0.98);
    display: flex; justify-content: flex-end; align-items: center;
    padding: 0 14px; font-size: 11px; border-top: 1px solid rgba(201,168,100,0.3);
  }
  #studyLink {
    display: none; color: #c9a864; text-decoration: none;
    letter-spacing: 0.15em; font-family: 'Inter', sans-serif; font-size: 10px;
  }
  #studyLink:hover { color: #8a6a2f; }
  #studyLink.visible { display: inline; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(201,168,100,0.1); }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,100,0.45); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(160,120,50,0.6); }

  #fxCanvas {
    position: fixed; inset: 0; z-index: 250; pointer-events: none;
    display: none;
  }
  #fxCanvas.active { display: block; }

  #fxLog {
    position: fixed; z-index: 260; pointer-events: none;
    font-family: 'Playfair Display', serif; font-weight: 900;
    text-shadow: 0 0 16px currentColor, 0 1px 2px rgba(90,60,20,0.25);
    opacity: 0; transition: none;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div id="opening">
  <div class="title">MAISON DE LA BOURSE</div>
  <div class="subtitle">DOMESTIC &amp; FOREIGN EQUITIES</div>
  <div class="btn-area">
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn" id="viewBgBtn">背景画像を見る</button>
    <button class="btn small" id="openingVeilBtn">透明度：OFF</button>
  </div>
</div>

<div id="bgViewer">
  <img src="" alt="背景画像" id="bgViewerImg">
  <button class="close-viewer" id="closeViewerBtn">CLOSE</button>
</div>

<div id="game">
  <div id="topBar">
    <div class="left-group">
      <div class="clock" id="clock">00:00:00</div>
      <div class="bg-toggle-group">
        <button class="mini-btn" id="bgToggleBtn" title="左側の背景画像を表示/非表示">背景</button>
        <select id="fitSelect" title="背景画像のフィット方法">
          <option value="cover">cover</option>
          <option value="contain">contain</option>
          <option value="fill">fill</option>
          <option value="none">none</option>
          <option value="100% 100%">100% 100%</option>
        </select>
        <button class="mini-btn" id="veilToggleBtn" title="背景に白味をかける">透明度：OFF</button>
      </div>
    </div>
    <div class="money" id="moneyDisplay">所持金：200円</div>
  </div>

  <div id="main">
    <div id="packArea">
      <div id="leftBgLayer"></div>

      <div id="buyArea">
        <button class="btn" id="buyPackBtn">パックを買う（200円）</button>

    currentPrice: card.basePrice
  };
});

/* =========================================================
   エンブレム本体の塗り色（装飾は金線のまま）
========================================================= */
const MOTIF_FILL = {
  auto:"#c96a3a", tech:"#3a6a9a", bank:"#3a4a7a", chip:"#3a8a6a",
  retail:"#c98a3a", game:"#b04868", chem:"#5a9a6a", trade:"#8a6a3a",
  telecom:"#4a6a8a", pharma:"#a04a6a", heavy:"#6a5a4a", hr:"#8a5a8a",
  factory:"#5a7a6a", invest:"#c9a03a", robot:"#6a7a8a",
  rail:"#4a6a5a", steel:"#6a7a8a",
  apple:"#c04040", window:"#3a7aa0", gpu:"#3a8a5a", box:"#c9803a",
  search:"#4a8a8a", social:"#5a5aa0", ev:"#a03a5a", card:"#3a5a9a",
  bottle:"#b04040", oil:"#5a4a3a", litho:"#3a6a8a", wafer:"#3a8a7a",
  phone:"#4a5a7a", crown:"#c9a03a"
};

/* =========================================================
   エンブレム描画
========================================================= */
function drawEmblem(canvas, card) {
  const emblem = card.emblem;
  const rarity = card.rarity;
  const attr = card.attr;

  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(W*0.3, H*0.2, W*0.1, W/2, H/2, W*0.8);
  if (rarity === "UR") { bg.addColorStop(0, "#fffdf4"); bg.addColorStop(1, "#f0e2bd"); }
  else if (rarity === "SR") { bg.addColorStop(0, "#fffaff"); bg.addColorStop(1, "#e9dced"); }
  else if (rarity === "R") { bg.addColorStop(0, "#fdfbf6"); bg.addColorStop(1, "#e8ddc8"); }
  else if (attr === "foreign") { bg.addColorStop(0, "#fdfbff"); bg.addColorStop(1, "#ece2ef"); }
  else { bg.addColorStop(0, "#fffdf8"); bg.addColorStop(1, "#efe4cf"); }
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(201,168,100,0.18)";
  ctx.lineWidth = 1;
  const sc = 26;
  for (let y = -sc; y < H + sc; y += sc*0.8) {
    for (let x = -sc; x < W + sc; x += sc) {
      const ox = (Math.round(y/(sc*0.8)) % 2) * (sc/2);
      ctx.beginPath();
      ctx.moveTo(x + ox, y);
      ctx.bezierCurveTo(x + ox + 8, y - 8, x + ox + 16, y + 2, x + ox + 6, y + 10);
      ctx.stroke();
    }
  }

  const cx = W/2, cy = H/2 - 4;
  const s = W / 200;

  ctx.save();
  ctx.translate(cx, cy);

  const badgeR = 68 * s;
  const badgeGrad = ctx.createRadialGradient(-12*s, -12*s, 4*s, 0, 0, badgeR);
  if (rarity === "UR") { badgeGrad.addColorStop(0, "#fffdf4"); badgeGrad.addColorStop(1, "#e8d4a0"); }
  else if (rarity === "SR") { badgeGrad.addColorStop(0, "#fffaff"); badgeGrad.addColorStop(1, "#dcc8e4"); }
  else if (rarity === "R") { badgeGrad.addColorStop(0, "#fdfbf6"); badgeGrad.addColorStop(1, "#d8c9a8"); }
  else if (attr === "foreign") { badgeGrad.addColorStop(0, "#fdfbff"); badgeGrad.addColorStop(1, "#d8c8e0"); }
  else { badgeGrad.addColorStop(0, "#fffdf8"); badgeGrad.addColorStop(1, "#d8c9a8"); }
  ctx.fillStyle = badgeGrad;
  ctx.beginPath(); ctx.arc(0, 0, badgeR, 0, Math.PI*2); ctx.fill();

  ctx.lineWidth = 2*s;
  if (rarity === "UR") ctx.strokeStyle = "rgba(201,168,100,1)";
  else if (rarity === "SR") ctx.strokeStyle = "rgba(180,140,200,0.9)";
  else if (rarity === "R") ctx.strokeStyle = "rgba(201,168,100,0.85)";
  else if (attr === "foreign") ctx.strokeStyle = "rgba(170,130,180,0.75)";
  else ctx.strokeStyle = "rgba(201,168,100,0.75)";
  ctx.beginPath(); ctx.arc(0, 0, badgeR, 0, Math.PI*2); ctx.stroke();

  ctx.strokeStyle = "rgba(201,168,100,0.5)"; ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.arc(0, 0, badgeR - 6*s, 0, Math.PI*2); ctx.stroke();

  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, badgeR - 8*s, 0, Math.PI*2); ctx.clip();
  drawStockMotif(ctx, emblem, s, rarity, attr);
  ctx.restore();
  ctx.restore();

  drawRoseCorner(ctx, W, H, s, rarity);

  if (rarity === "UR") { ctx.strokeStyle = "rgba(201,168,100,1)"; ctx.lineWidth = 3; ctx.strokeRect(2,2,W-4,H-4); }
  else if (rarity === "SR") { ctx.strokeStyle = "rgba(180,140,200,0.9)"; ctx.lineWidth = 2; ctx.strokeRect(2,2,W-4,H-4); }
  else if (rarity === "R") { ctx.strokeStyle = "rgba(201,168,100,0.8)"; ctx.lineWidth = 1; ctx.strokeRect(2,2,W-4,H-4); }
  else if (attr === "foreign") { ctx.strokeStyle = "rgba(170,130,180,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(2,2,W-4,H-4); }
  else { ctx.strokeStyle = "rgba(201,168,100,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(2,2,W-4,H-4); }
}

function drawRoseCorner(ctx, W, H, s, rarity) {
  const color = rarity === "UR" ? "rgba(201,168,100,0.95)"
              : rarity === "SR" ? "rgba(180,140,200,0.9)"
              : "rgba(201,168,100,0.7)";
  const size = 22 * s;
  const positions = [
    { x: 16*s, y: 16*s, rot: 0 },
    { x: W - 16*s, y: 16*s, rot: Math.PI/2 },
    { x: W - 16*s, y: H - 16*s, rot: Math.PI },
    { x: 16*s, y: H - 16*s, rot: -Math.PI/2 }
  ];
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.2*s;
  for (const p of positions) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.beginPath();
    for (let i = 0; i < 24; i++) {
      const t = i / 24 * Math.PI * 2;
      const r = size * (0.15 + 0.85 * (i/24));
      const x = Math.cos(t) * r * 0.5;
      const y = Math.sin(t) * r * 0.5;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(size*0.55, 0, size*0.35, size*0.16, 0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawLabel(ctx, text, s, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `700 ${11*s}px 'Playfair Display', 'Cormorant Garamond', sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 0, 46*s);
  ctx.restore();
}

/* =========================================================
   銘柄モチーフ（本体のみ色塗り・装飾は金線）
========================================================= */
function drawStockMotif(ctx, emblem, s, rarity, attr) {
  const reset = () => { ctx.shadowBlur = 0; };
  const GOLD = "#b08a3a";
  const INK = attr === "foreign" ? "#6a4a7a" : "#5a4526";
  const FILL = MOTIF_FILL[emblem] || "#c9a864";
  const FILL_SOFT = (() => {
    const c = FILL.replace("#","");
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    const mix = (v) => Math.round(v + (255 - v) * 0.72);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  })();
  const line = (w) => { ctx.lineWidth = (w||2)*s; ctx.lineCap = "round"; ctx.lineJoin = "round"; };
  const goldStroke = () => { ctx.strokeStyle = GOLD; ctx.fillStyle = FILL_SOFT; };
  const inkStroke  = () => { ctx.strokeStyle = INK;  ctx.fillStyle = FILL_SOFT; };

  switch (emblem) {
    case "auto": {
      goldStroke(); line(2);
      ctx.beginPath();
      ctx.moveTo(-26*s, 6*s); ctx.lineTo(-18*s, -8*s); ctx.lineTo(10*s, -8*s);
      ctx.lineTo(22*s, 6*s); ctx.lineTo(26*s, 6*s); ctx.lineTo(24*s, 14*s);
      ctx.lineTo(-24*s, 14*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.arc(-12*s, 16*s, 5*s, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(12*s, 16*s, 5*s, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-14*s, -8*s); ctx.lineTo(-10*s, -16*s); ctx.lineTo(6*s, -16*s); ctx.lineTo(10*s, -8*s); ctx.stroke();
      drawLabel(ctx, "AUTO", s, GOLD);
      break;
    }
    case "tech": {
      goldStroke(); line(2);
      ctx.strokeRect(-22*s, -18*s, 44*s, 32*s); ctx.fillRect(-22*s, -18*s, 44*s, 32*s);
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.moveTo(-14*s, -6*s); ctx.lineTo(14*s, -6*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-14*s, 2*s); ctx.lineTo(14*s, 2*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6*s, -18*s); ctx.lineTo(-6*s, 14*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6*s, -18*s); ctx.lineTo(6*s, 14*s); ctx.stroke();
      drawLabel(ctx, "TECH", s, GOLD);
      break;
    }
    case "bank": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-26*s, -10*s); ctx.lineTo(0, -24*s); ctx.lineTo(26*s, -10*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      for (let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*10*s, -8*s); ctx.lineTo(i*10*s, 14*s); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-26*s, 16*s); ctx.lineTo(26*s, 16*s); ctx.stroke();
      drawLabel(ctx, "BANK", s, GOLD);
      break;
    }
    case "chip": {
      goldStroke(); line(2);
      ctx.strokeRect(-18*s, -18*s, 36*s, 36*s); ctx.fillRect(-18*s, -18*s, 36*s, 36*s);
      ctx.strokeStyle = GOLD;
      ctx.strokeRect(-10*s, -10*s, 20*s, 20*s);
      for (let i=-2;i<=2;i++){
        ctx.beginPath(); ctx.moveTo(i*8*s, -18*s); ctx.lineTo(i*8*s, -24*s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i*8*s, 18*s); ctx.lineTo(i*8*s, 24*s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-18*s, i*8*s); ctx.lineTo(-24*s, i*8*s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(18*s, i*8*s); ctx.lineTo(24*s, i*8*s); ctx.stroke();
      }
      drawLabel(ctx, "CHIP", s, GOLD);
      break;
    }
    case "retail": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-20*s, -14*s); ctx.lineTo(20*s, -14*s); ctx.lineTo(16*s, 16*s); ctx.lineTo(-16*s, 16*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.moveTo(-8*s, -14*s); ctx.quadraticCurveTo(-8*s, -24*s, 0, -24*s); ctx.quadraticCurveTo(8*s, -24*s, 8*s, -14*s); ctx.stroke();
      drawLabel(ctx, "RETAIL", s, GOLD);
      break;
    }
    case "game": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.roundRect(-26*s, -10*s, 52*s, 24*s, 12*s); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.moveTo(-16*s, 2*s); ctx.lineTo(-8*s, 2*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-12*s, -2*s); ctx.lineTo(-12*s, 6*s); ctx.stroke();
      ctx.beginPath(); ctx.arc(12*s, -2*s, 2.5*s, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(18*s, 4*s, 2.5*s, 0, Math.PI*2); ctx.stroke();
      drawLabel(ctx, "GAME", s, GOLD);
      break;
    }
    case "chem": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(0, -22*s); ctx.lineTo(-18*s, 12*s); ctx.lineTo(18*s, 12*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.arc(0, 0, 4*s, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(-8*s, -8*s, 3*s, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(8*s, -8*s, 3*s, 0, Math.PI*2); ctx.stroke();
      drawLabel(ctx, "CHEM", s, GOLD);
      break;
    }
    case "trade": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-24*s, 12*s); ctx.lineTo(-24*s, -12*s); ctx.lineTo(0, -22*s); ctx.lineTo(24*s, -12*s); ctx.lineTo(24*s, 12*s); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.moveTo(-8*s, -4*s); ctx.lineTo(8*s, -4*s); ctx.lineTo(8*s, 12*s); ctx.lineTo(-8*s, 12*s); ctx.closePath(); ctx.stroke();
      drawLabel(ctx, "TRADE", s, GOLD);
      break;
    }
    case "telecom": {
      ctx.strokeStyle = GOLD; line(2);
      for (let i=0;i<4;i++){
        ctx.beginPath(); ctx.arc(0, 10*s, (8+i*6)*s, -Math.PI*0.75, -Math.PI*0.25); ctx.stroke();
      }
      ctx.fillStyle = FILL_SOFT;
      ctx.beginPath(); ctx.arc(0, 10*s, 4*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      drawLabel(ctx, "TELECOM", s, GOLD);
      break;
    }
    case "pharma": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.roundRect(-20*s, -8*s, 40*s, 16*s, 8*s); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.moveTo(-6*s, -8*s); ctx.lineTo(-6*s, 8*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6*s, -8*s); ctx.lineTo(6*s, 8*s); ctx.stroke();
      drawLabel(ctx, "PHARMA", s, GOLD);
      break;
    }
    case "heavy": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-24*s, 14*s); ctx.lineTo(-24*s, -6*s); ctx.lineTo(-8*s, -6*s); ctx.lineTo(-8*s, -18*s); ctx.lineTo(8*s, -18*s); ctx.lineTo(8*s, 14*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.arc(-12*s, 16*s, 5*s, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(14*s, 16*s, 5*s, 0, Math.PI*2); ctx.stroke();
      drawLabel(ctx, "HEAVY", s, GOLD);
      break;
    }
    case "hr": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.arc(0, -12*s, 7*s, 0, Math.PI*2); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.moveTo(-16*s, 16*s); ctx.quadraticCurveTo(-16*s, -2*s, 0, -2*s); ctx.quadraticCurveTo(16*s, -2*s, 16*s, 16*s); ctx.stroke();
      drawLabel(ctx, "HR", s, GOLD);
      break;
    }
    case "factory": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-24*s, 14*s); ctx.lineTo(-24*s, -6*s); ctx.lineTo(-8*s, -6*s); ctx.lineTo(-8*s, 2*s); ctx.lineTo(8*s, 2*s); ctx.lineTo(8*s, -10*s); ctx.lineTo(24*s, -10*s); ctx.lineTo(24*s, 14*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.arc(0, 16*s, 4*s, 0, Math.PI*2); ctx.stroke();
      drawLabel(ctx, "FACTORY", s, GOLD);
      break;
    }
    case "invest": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-24*s, 12*s); ctx.lineTo(-12*s, 0); ctx.lineTo(-2*s, 6*s); ctx.lineTo(10*s, -8*s); ctx.lineTo(22*s, 2*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(22*s, 2*s); ctx.lineTo(22*s, -8*s); ctx.lineTo(12*s, -8*s); ctx.stroke();
      drawLabel(ctx, "INVEST", s, GOLD);
      break;
    }
    case "robot": {
      goldStroke(); line(2);
      ctx.strokeRect(-16*s, -16*s, 32*s, 24*s); ctx.fillRect(-16*s, -16*s, 32*s, 24*s);
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.arc(0, -22*s, 5*s, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = GOLD;
      ctx.beginPath(); ctx.arc(-6*s, -8*s, 2*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(6*s, -8*s, 2*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-8*s, 8*s); ctx.lineTo(-8*s, 18*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8*s, 8*s); ctx.lineTo(8*s, 18*s); ctx.stroke();
      drawLabel(ctx, "ROBOT", s, GOLD);
      break;
    }
    case "rail": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-22*s, -6*s); ctx.lineTo(22*s, -6*s); ctx.lineTo(22*s, 14*s); ctx.lineTo(-22*s, 14*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      for (let i=-2;i<=2;i++){ ctx.beginPath(); ctx.arc(i*9*s, 4*s, 2*s, 0, Math.PI*2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-22*s, 16*s); ctx.lineTo(22*s, 16*s); ctx.stroke();
      drawLabel(ctx, "RAIL", s, GOLD);
      break;
    }
    case "steel": {
      goldStroke(); line(2);
      ctx.beginPath(); ctx.moveTo(-24*s, -8*s); ctx.lineTo(-10*s, -8*s); ctx.lineTo(-10*s, 10*s); ctx.lineTo(-24*s, 10*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2*s, -12*s); ctx.lineTo(24*s, -12*s); ctx.lineTo(20*s, 12*s); ctx.lineTo(-2*s, 12*s); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = GOLD;
      ctx.beginPath(); ctx.moveTo(-18*s, -2*s); ctx.lineTo(-14*s, -2*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6*s, -2*s); ctx.lineTo(18*s, -2*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6*s, 4*s); ctx.lineTo(18*s, 4*s); ctx.stroke();
      drawLabel(ctx, "STEEL", s, GOLD);
      break;
    }
    case "apple": {
      inkStroke(); line(2);
      ctx.beginPath(); ctx.arc(0, 2*s, 18*s, 0, Math.PI*2); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.moveTo(0, -16*s); ctx.quadraticCurveTo(6*s, -26*s, 14*s, -24*s); ctx.stroke();
      drawLabel(ctx, "APPLE", s, GOLD);
      break;
    }
    case "window": {
      inkStroke(); line(2);
      ctx.strokeRect(-20*s, -18*s, 18*s, 18*s); ctx.fillRect(-20*s, -18*s, 18*s, 18*s);
      ctx.strokeRect(2*s, -18*s, 18*s, 18*s); ctx.fillRect(2*s, -18*s, 18*s, 18*s);
      ctx.strokeRect(-20*s, 2*s, 18*s, 18*s); ctx.fillRect(-20*s, 2*s, 18*s, 18*s);
      ctx.strokeRect(2*s, 2*s, 18*s, 18*s); ctx.fillRect(2*s, 2*s, 18*s, 18*s);

    }
    case "gpu": {

      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(20*s, 12*s); ctx.lineTo(0, 24*s); ctx.lineTo(-20*s, 12*s); ctx.closePath(); ctx.stroke(); ctx.fill();

      inkStroke(); line(2);

      ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.moveTo(-20*s, -12*s); ctx.lineTo(0, -2*s); ctx.lineTo(20*s, -12*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -2*s); ctx.lineTo(0, 22*s); ctx.stroke();
      drawLabel(ctx, "BOX", s, GOLD);
      break;
    }
    case "search": {
      inkStroke(); line(2);
      ctx.beginPath(); ctx.arc(-6*s, -6*s, 14*s, 0, Math.PI*2); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.moveTo(6*s, 6*s); ctx.lineTo(20*s, 20*s); ctx.stroke();
      drawLabel(ctx, "SEARCH", s, GOLD);
      break;
    }
    case "social": {
      inkStroke(); line(2);
      ctx.beginPath(); ctx.arc(-12*s, -8*s, 8*s, 0, Math.PI*2); ctx.stroke(); ctx.fill();
      ctx.beginPath(); ctx.arc(12*s, -8*s, 8*s, 0, Math.PI*2); ctx.stroke(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 12*s, 8*s, 0, Math.PI*2); ctx.stroke(); ctx.fill();
      drawLabel(ctx, "SOCIAL", s, GOLD);
      break;
    }

function fxLoop() {
  requestAnimationFrame(fxLoop);
  if (!fxActive) return;
  if (fxFlash > 0) fxFlash = Math.max(0, fxFlash - 0.05);

  for (let i = fxGlitters.length-1; i >= 0; i--) {
    const g = fxGlitters[i];
    g.x += g.vx; g.y += g.vy; g.vx *= 0.96; g.vy *= 0.96;
    g.life -= g.decay;
    if (g.life <= 0) fxGlitters.splice(i,1);
  }
  for (let i = fxFeathers.length-1; i >= 0; i--) {
    const f = fxFeathers[i];
    f.x += f.vx + Math.sin(Date.now()*0.002 + f.seed)*0.4;
    f.y += f.vy; f.vy += 0.05; f.vx *= 0.99;
    f.rot += f.vr; f.life -= 0.008;
    if (f.life <= 0) fxFeathers.splice(i,1);
  }
  for (let i = fxPetals.length-1; i >= 0; i--) {
    const p = fxPetals[i];
    p.x += p.vx + Math.sin(Date.now()*0.003 + p.seed)*0.5;
    p.y += p.vy; p.vy += 0.08; p.vx *= 0.98;
    p.rot += p.vr; p.life -= 0.01;
    if (p.life <= 0) fxPetals.splice(i,1);
  }
  for (let i = fxEmblems.length-1; i >= 0; i--) {
    const e = fxEmblems[i];
    e.r = Math.min(50, e.r + 2); e.life -= 0.012;
    if (e.life <= 0) fxEmblems.splice(i,1);
  }
  for (let i = fxRibbons.length-1; i >= 0; i--) {
    const r = fxRibbons[i];
    r.t += 0.03; r.life -= 0.01;
    if (r.life <= 0) fxRibbons.splice(i,1);
  }
  for (let i = fxCandles.length-1; i >= 0; i--) {
    const c = fxCandles[i];
    c.age += 0.02; c.life -= 0.008;
    if (c.life <= 0) fxCandles.splice(i,1);
  }
  for (let i = fxStamps.length-1; i >= 0; i--) {
    const s = fxStamps[i];
    s.scale = Math.min(1, s.scale + 0.12); s.life -= 0.01;
    if (s.life <= 0) fxStamps.splice(i,1);
  }
  for (let i = fxTickers.length-1; i >= 0; i--) {
    const t = fxTickers[i];
    t.age += 0.02; t.life -= 0.008;
    if (t.life <= 0) fxTickers.splice(i,1);
  }
  for (let i = fxRates.length-1; i >= 0; i--) {
    const r = fxRates[i];
    r.age += 0.02; r.life -= 0.01;
    if (r.life <= 0) fxRates.splice(i,1);
  }
  for (let i = fxBoards.length-1; i >= 0; i--) {
    const b = fxBoards[i];
    b.age += 0.02; b.life -= 0.008;
    if (b.life <= 0) fxBoards.splice(i,1);
  }
  for (let i = fxLaurels.length-1; i >= 0; i--) {
    const l = fxLaurels[i];
    l.r = Math.min(46, l.r + 2); l.rot += 0.01; l.life -= 0.01;
    if (l.life <= 0) fxLaurels.splice(i,1);
  }
  for (let i = fxAngels.length-1; i >= 0; i--) {
    const a = fxAngels[i];
    a.t += 0.02; a.life -= 0.008;
    if (a.life <= 0) fxAngels.splice(i,1);
  }

  renderFx();

  if (fxGlitters.length === 0 && fxFeathers.length === 0 && fxPetals.length === 0 &&
      fxEmblems.length === 0 && fxRibbons.length === 0 && fxCandles.length === 0 &&
      fxStamps.length === 0 && fxTickers.length === 0 && fxRates.length === 0 &&
      fxBoards.length === 0 && fxLaurels.length === 0 && fxAngels.length === 0 &&
      fxFlash === 0) {
    fxActive = false;
    fxCanvas.classList.remove("active");
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
}

function renderFx() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

  for (const g of fxGlitters) {
    fxCtx.globalAlpha = Math.max(0, g.life);
    fxCtx.fillStyle = "#d8b968";
    fxCtx.shadowBlur = 8; fxCtx.shadowColor = "#d8b968";
    fxCtx.beginPath(); fxCtx.arc(g.x, g.y, g.size * g.life, 0, Math.PI*2); fxCtx.fill();
  }
  for (const f of fxFeathers) {
    fxCtx.save();
    fxCtx.translate(f.x, f.y); fxCtx.rotate(f.rot);
    fxCtx.globalAlpha = Math.max(0, f.life);
    fxCtx.strokeStyle = "#e8dcc0"; fxCtx.lineWidth = 1.2;
    fxCtx.beginPath();
    fxCtx.moveTo(0, -f.len);
    fxCtx.quadraticCurveTo(f.len*0.6, 0, 0, f.len);
    fxCtx.quadraticCurveTo(-f.len*0.6, 0, 0, -f.len);
    fxCtx.stroke();
    fxCtx.beginPath(); fxCtx.moveTo(0, -f.len); fxCtx.lineTo(0, f.len); fxCtx.stroke();
    fxCtx.restore();
  }
  for (const p of fxPetals) {
    fxCtx.save();
    fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.fillStyle = p.color;
    fxCtx.beginPath();
    fxCtx.ellipse(0, 0, p.size, p.size*0.5, 0, 0, Math.PI*2);
    fxCtx.fill();
    fxCtx.restore();
  }
  for (const e of fxEmblems) {
    fxCtx.save();
    fxCtx.translate(e.x, e.y); fxCtx.rotate(e.rot);
    fxCtx.globalAlpha = Math.max(0, e.life);
    fxCtx.strokeStyle = "#c9a864"; fxCtx.lineWidth = 2;
    fxCtx.beginPath(); fxCtx.arc(0, 0, e.r, 0, Math.PI*2); fxCtx.stroke();
    for (let i=0;i<8;i++){
      const a = (i/8)*Math.PI*2 + e.rot;
      fxCtx.beginPath();
      fxCtx.moveTo(Math.cos(a)*e.r*0.8, Math.sin(a)*e.r*0.8);
      fxCtx.lineTo(Math.cos(a)*e.r*1.15, Math.sin(a)*e.r*1.15);
      fxCtx.stroke();
    }
    fxCtx.restore();
  }
  for (const r of fxRibbons) {
    fxCtx.save();
    fxCtx.translate(r.x, r.y);
    fxCtx.globalAlpha = Math.max(0, r.life);
    for (const s of r.strands) {
      fxCtx.strokeStyle = "#c96a8a"; fxCtx.lineWidth = 2;
      fxCtx.beginPath();
      const a = s.base + r.t*1.5;
      fxCtx.moveTo(0, 0);
      fxCtx.quadraticCurveTo(Math.cos(a)*s.len*0.6, Math.sin(a)*s.len*0.6, Math.cos(a)*s.len, Math.sin(a)*s.len);
      fxCtx.stroke();
    }
    fxCtx.restore();
  }
  for (const c of fxCandles) {
    fxCtx.save();
    fxCtx.translate(c.x, c.y);
    fxCtx.globalAlpha = Math.max(0, c.life);
    const barW = 4, gap = 8, totalW = c.bars.length * gap;
    const drawN = Math.min(c.bars.length, Math.floor(c.age * 20));
    for (let i = 0; i < drawN; i++) {
      const b = c.bars[i];
      const cx = -totalW/2 + i*gap;
      const top = -40 + b.high*50;
      const bottom = -40 + b.low*50;
      const oTop = -40 + Math.max(b.open,b.close)*50;
      const oBot = -40 + Math.min(b.open,b.close)*50;
      fxCtx.strokeStyle = "#b08a3a"; fxCtx.lineWidth = 1;
      fxCtx.beginPath(); fxCtx.moveTo(cx+barW/2, top); fxCtx.lineTo(cx+barW/2, bottom); fxCtx.stroke();
      fxCtx.fillStyle = b.close > b.open ? "#2f8a5a" : "#b04848";
      fxCtx.fillRect(cx, oTop, barW, Math.max(1, oBot - oTop));
    }
    fxCtx.restore();
  }
  for (const s of fxStamps) {
    fxCtx.save();
    fxCtx.translate(s.x, s.y); fxCtx.rotate(s.rot); fxCtx.scale(s.scale, s.scale);
    fxCtx.globalAlpha = Math.max(0, s.life);
    fxCtx.strokeStyle = "#b04848"; fxCtx.lineWidth = 3;
    fxCtx.strokeRect(-40, -16, 80, 32);
    fxCtx.fillStyle = "#b04848"; fxCtx.font = "700 14px 'Playfair Display', serif";
    fxCtx.textAlign = "center"; fxCtx.textBaseline = "middle";
    fxCtx.fillText("EXÉCUTÉ", 0, 0);
    fxCtx.restore();
  }
  for (const t of fxTickers) {
    fxCtx.save();
    fxCtx.translate(t.x, t.y);
    fxCtx.globalAlpha = Math.max(0, t.life);
    fxCtx.font = "700 11px 'Inter', sans-serif";
    fxCtx.textAlign = "left"; fxCtx.textBaseline = "middle";
    const baseY = -30;
    for (let i = 0; i < t.texts.length; i++) {
      const offset = ((t.age*60) % (t.texts.length*20));
      const y = baseY + ((i*20 - offset + t.texts.length*20) % (t.texts.length*20)) - 20;
      fxCtx.fillStyle = "#5a4526";
      fxCtx.fillText(t.texts[i], -60, y);
    }
    fxCtx.restore();
  }
  for (const r of fxRates) {
    fxCtx.save();
    fxCtx.translate(r.x, r.y);
    fxCtx.globalAlpha = Math.max(0, r.life);
    fxCtx.font = "600 11px 'Inter', sans-serif";
    for (let i = 0; i < r.pairs.length; i++) {
      const [pair, val] = r.pairs[i];
      const blink = 0.5 + 0.5*Math.sin(r.age*8 + i);
      fxCtx.fillStyle = blink > 0.5 ? "#2f8a5a" : "#b04848";
      fxCtx.fillText(pair, -60, -20 + i*16);
      fxCtx.fillStyle = "#5a4526";
      fxCtx.fillText(val, 10, -20 + i*16);
    }
    fxCtx.restore();
  }
  for (const b of fxBoards) {
    fxCtx.save();
    fxCtx.translate(b.x, b.y);
    fxCtx.globalAlpha = Math.max(0, b.life);
    for (let i = 0; i < 5; i++) {
      for (let j = 0; j < 3; j++) {
        const x = -40 + j*28, y = -30 + i*14;
        const tick = Math.sin(b.age*6 + i*3 + j + b.seed) > 0;
        fxCtx.fillStyle = tick ? "#2f8a5a" : "#b04848";
        fxCtx.fillRect(x, y, 22, 8);
      }
    }
    fxCtx.restore();
  }
  for (const l of fxLaurels) {
    fxCtx.save();
    fxCtx.translate(l.x, l.y); fxCtx.rotate(l.rot);
    fxCtx.globalAlpha = Math.max(0, l.life);
    fxCtx.strokeStyle = "#b08a3a"; fxCtx.lineWidth = 2;
    fxCtx.beginPath(); fxCtx.arc(0, 0, l.r, 0, Math.PI*2); fxCtx.stroke();
    for (let i=0;i<12;i++){
      const a = (i/12)*Math.PI*2;
      const x = Math.cos(a)*l.r, y = Math.sin(a)*l.r;
      fxCtx.beginPath();
      fxCtx.ellipse(x, y, 6, 2.5, a, 0, Math.PI*2);
      fxCtx.stroke();
    }
    fxCtx.restore();
  }
  for (const a of fxAngels) {
    fxCtx.save();
    fxCtx.translate(a.x, a.y);
    fxCtx.globalAlpha = Math.max(0, a.life);
    const flap = Math.sin(a.t*6) * 0.3;
    fxCtx.strokeStyle = "#d8b968"; fxCtx.lineWidth = 2;
    for (const side of [-1, 1]) {
      fxCtx.save();
      fxCtx.scale(side, 1);
      fxCtx.beginPath();
      fxCtx.moveTo(0, 0);
      fxCtx.quadraticCurveTo(30, -20 + flap*20, 50, 10);
      fxCtx.quadraticCurveTo(30, 0, 0, 10);
      fxCtx.stroke();
      fxCtx.restore();
    }
    fxCtx.beginPath(); fxCtx.arc(0, -10, 4, 0, Math.PI*2); fxCtx.stroke();
    fxCtx.restore();
  }

  fxCtx.globalAlpha = 1; fxCtx.shadowBlur = 0;

  if (fxFlash > 0) {
    fxCtx.fillStyle = `rgba(${fxFlashColor},${fxFlash*0.35})`;
    fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
}
fxLoop();

/* =========================================================
   ゲームロジック
========================================================= */
const NORMAL_POOL = CARD_MASTER.filter(c => c.rarity === "N");
const RARE_POOL   = CARD_MASTER.filter(c => c.rarity !== "N");

let money = 200;
let currentPack = [];
let currentIndex = 0;
let obtainedCards = [];
let sortMode = "obtained";
let packsBought = 0;
let startTime = Date.now();
let gameStarted = false;

const $ = (id) => document.getElementById(id);
const startBtn = $("startBtn"), viewBgBtn = $("viewBgBtn");
const bgViewer = $("bgViewer"), closeViewerBtn = $("closeViewerBtn"), game = $("game");
const clockEl = $("clock"), moneyDisplay = $("moneyDisplay");
const buyPackBtn = $("buyPackBtn"), buyArea = $("buyArea"), packCardWrap = $("packCardWrap");
const packCard = $("packCard"), packName = $("packName"), packCanvas = $("packCanvas");
const packAtk = $("packAtk"), packDef = $("packDef"), packEffect = $("packEffect");
const prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), sellNowBtn = $("sellNowBtn"), endPackBtn = $("endPackBtn");
const infoList = $("infoList"), sortSelect = $("sortSelect"), priceList = $("priceList"), studyLink = $("studyLink");
const modal = $("modal"), modalCard = $("modalCard"), modalName = $("modalName"), modalCanvas = $("modalCanvas");
const modalAtk = $("modalAtk"), modalDef = $("modalDef"), modalEffect = $("modalEffect");
const modalCloseBtn = $("modalCloseBtn"), modalSellBtn = $("modalSellBtn");

const bgToggleBtn = $("bgToggleBtn"), fitSelect = $("fitSelect");
let bgVisible = false;
bgToggleBtn.addEventListener("click", () => {
  bgVisible = !bgVisible;
  leftBgLayerEl.classList.toggle("active", bgVisible);
  bgToggleBtn.classList.toggle("on", bgVisible);
});
fitSelect.addEventListener("change", () => {
  leftBgLayerEl.style.backgroundSize = fitSelect.value;
});

function updateClock() {
  const now = new Date();
  clockEl.textContent = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
}
function updateAllPrices() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  Object.values(MARKET).forEach(m => {
    if (m.trend === "up") m.currentPrice = Math.min(m.maxPrice, m.basePrice + elapsed);
    else m.currentPrice = Math.max(m.minPrice, m.basePrice - elapsed);
  });
}
function getPrice(name) { return MARKET[name] ? MARKET[name].currentPrice : 0; }
function renderPriceTable() {
  priceList.innerHTML = CARD_MASTER.map(card => {
    const m = MARKET[card.name];
    const cls = m.trend === "up" ? "up" : "down";
    const arrow = m.trend === "up" ? "▲" : "▼";
    return `<div class="price-row"><span>${card.name}</span><span class="${cls}">${arrow} ${m.currentPrice}円</span></div>`;
  }).join("");
}

function sortCards(mode) {
  const cards = [...obtainedCards];
  switch (mode) {
    case "rarity":   return cards.sort((a,b) => rarityRank(b.rarity) - rarityRank(a.rarity));
    case "atk":      return cards.sort((a,b) => b.atk - a.atk);
    case "defLow":   return cards.sort((a,b) => a.def - b.def);
    case "domestic": return cards.sort((a,b) => (a.attr === "domestic" ? -1 : 1));
    case "foreign":  return cards.sort((a,b) => (a.attr === "foreign" ? -1 : 1));
    case "link":     return cards.sort((a,b) => (a.type === "link" ? -1 : 1));
    case "xrp":      return cards.sort((a,b) => (a.type === "xrp" ? -1 : 1));
    default:         return cards.sort((a,b) => a.obtainedAt - b.obtainedAt);
  }
}
function renderInfoList() {
  const cards = sortCards(sortMode);
  infoList.innerHTML = cards.map((card, i) => {
    const mark = card.attr === "domestic"
      ? `<span class="ygo-attr-mark domestic">国</span>`
      : `<span class="ygo-attr-mark foreign">外</span>`;
    const tc = typeClass(card.type);
    return `<div class="info-item" data-id="${card.uid}">
      <span>${i+1}.</span>${mark}
      <span class="type-tag ${tc}">${card.type === "xrp" ? "X" : "L"}</span>
      <span>${card.name}</span>
    </div>`;
  }).join("");
  infoList.querySelectorAll(".info-item").forEach(el => {
    el.addEventListener("click", () => {
      const card = obtainedCards.find(c => c.uid === el.dataset.id);
      if (card) openModal(card);
    });
  });
}

function renderCardToUI(card, cardEl, nameEl, canvasEl, atkEl, defEl, effectEl) {
  cardEl.className = "ygo-card " + rarityClass(card);
  const mark = card.attr === "domestic"
    ? `<span class="ygo-attr-mark domestic">国</span>`
    : `<span class="ygo-attr-mark foreign">外</span>`;
  const tc = typeClass(card.type);
  nameEl.innerHTML = `${mark}<span>${card.name}</span><span style="font-size:9px;opacity:0.55;">${card.ticker}</span>`;
  drawEmblem(canvasEl, card);
  atkEl.textContent = `MOMENTUM ${card.atk}`;
  defEl.textContent = `DIVIDEND ${card.def}`;
  effectEl.innerHTML = `<span class="type-tag ${tc}">${typeLabel(card.type)}</span> ${card.effect}`;
}
function showPackCard() {
  const card = currentPack[currentIndex];
  if (!card) return;
  renderCardToUI(card, packCard, packName, packCanvas, packAtk, packDef, packEffect);
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === currentPack.length - 1;
}

function makeInstance(m) {
  return {
    uid: "U" + Math.random().toString(36).slice(2,10),
    name: m.name, ticker: m.ticker, attr: m.attr, rarity: m.rarity,
    type: m.type, atk: m.atk, def: m.def, effect: m.effect,
    emblem: m.emblem, obtainedAt: 0
  };
}
function buyPack() {
  if (money < 200) return;
  money -= 200; packsBought++; updateMoneyDisplay();
  currentPack = []; currentIndex = 0;
  for (let i = 0; i < 6; i++) {
    currentPack.push(makeInstance(NORMAL_POOL[Math.floor(Math.random() * NORMAL_POOL.length)]));
  }
  currentPack.push(makeInstance(RARE_POOL[Math.floor(Math.random() * RARE_POOL.length)]));
  buyArea.style.display = "none";
  packCardWrap.classList.add("active");
  showPackCard();
}
function nextCard() { if (currentIndex < currentPack.length - 1) { currentIndex++; showPackCard(); } }
function prevCard() { if (currentIndex > 0) { currentIndex--; showPackCard(); } }

function sellCurrentCard() {
  const card = currentPack[currentIndex];
  if (!card) return;
  updateAllPrices();
  money += getPrice(card.name); updateMoneyDisplay();
  currentPack.splice(currentIndex, 1);
  if (currentPack.length === 0) endPack();
  else { currentIndex = Math.min(currentIndex, currentPack.length - 1); showPackCard(); }
}
function endPack() {
  currentPack.forEach(card => {
    card.obtainedAt = obtainedCards.length;
    obtainedCards.push(card);
  });
  currentPack = []; currentIndex = 0;
  packCardWrap.classList.remove("active");
  buyArea.style.display = "flex";
  renderInfoList();
}

let modalCardData = null;
function openModal(card) {
  modalCardData = card;
  renderCardToUI(card, modalCard, modalName, modalCanvas, modalAtk, modalDef, modalEffect);
  modal.classList.add("active");
}
function closeModal() { modal.classList.remove("active"); modalCardData = null; }
function sellFromModal() {
  if (!modalCardData) return;
  updateAllPrices();
  money += getPrice(modalCardData.name); updateMoneyDisplay();
  obtainedCards = obtainedCards.filter(c => c.uid !== modalCardData.uid);
  renderInfoList(); closeModal();
}
function updateMoneyDisplay() { moneyDisplay.textContent = `所持金：${money}円`; }
function checkStudyLink() { if (packsBought >= 3) studyLink.classList.add("visible"); }

document.addEventListener("click", (e) => {
  triggerRandomFx(e.clientX, e.clientY);
});

startBtn.addEventListener("click", () => {
  openingEl.style.display = "none";
  game.classList.add("active");
  gameStarted = true; startTime = Date.now();
  updateMoneyDisplay(); renderInfoList(); renderPriceTable();
  fitSelect.value = "cover";
  leftBgLayerEl.style.backgroundSize = "cover";
});
viewBgBtn.addEventListener("click", () => bgViewer.classList.add("active"));
closeViewerBtn.addEventListener("click", () => bgViewer.classList.remove("active"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && bgViewer.classList.contains("active")) bgViewer.classList.remove("active");
});
buyPackBtn.addEventListener("click", () => { buyPack(); checkStudyLink(); });
prevBtn.addEventListener("click", prevCard);
nextBtn.addEventListener("click", nextCard);
sellNowBtn.addEventListener("click", sellCurrentCard);
endPackBtn.addEventListener("click", endPack);
sortSelect.addEventListener("change", () => { sortMode = sortSelect.value; renderInfoList(); });
modalCloseBtn.addEventListener("click", closeModal);
modalSellBtn.addEventListener("click", sellFromModal);

setInterval(() => {
  updateClock();
  if (gameStarted) { updateAllPrices(); renderPriceTable(); }
}, 1000);
updateClock();
</script>

</body>
</html>
