<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Ticker & Rank Manager</title>
    <style>
        /* --- 全体の基本デザイン（bitFlyer風） --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #111111;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            padding: 16px;
        }

        /* --- 1. 最上部：シンプルな詳細文章表示エリア --- */
        .detail-display-area {
            width: 100%;
            min-height: 100px;
            background-color: #fafafa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #333333;
        }

        .detail-display-area h3 {
            font-size: 15px;
            color: #00469b;
            margin-bottom: 6px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 4px;
        }

        /* --- 2. 中部：流れるニュースティッカーエリア --- */
        .ticker-container {
            width: 100%;
            background-color: #eef3fb;
            border-radius: 8px;
            padding: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-left: 4px solid #0052cc;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            animation: ticker-anim 35s linear infinite;
            padding-right: 100%;
        }

        .ticker-move:hover {
            animation-play-state: paused;
        }

        @keyframes ticker-anim {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            margin-right: 40px;
            cursor: pointer;
        }

        .ticker-img {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #ddd;
        }

        .ticker-text {
            font-size: 13px;
            font-weight: bold;
            color: #0052cc;
        }

        /* --- 3. 下部：ニュースの縦並び一覧（手描き枠の再現） --- */
        .list-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555555;
            display: flex;
            justify-content: space-between;
        }

        .news-manager-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        /* 1つのニュース行 */
        .news-row {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 8px;
            gap: 10px;
        }

        /* 【青枠】上下の矢印ボタンで順番を自由に入れ替えるパーツ */
        .order-control-box {
            border: 2px solid #0052cc;
            border-radius: 6px;
            padding: 2px;
            background-color: #fff;
            min-width: 65px;
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }

        .arrow-btn {
            flex: 1;
            background-color: #eef3fb;
            border: 1px solid #0052cc;
            color: #0052cc;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 0;
            text-align: center;
        }

        .arrow-btn:hover {
            background-color: #0052cc;
            color: #fff;
        }

        .arrow-btn:disabled {
            background-color: #eee;
            border-color: #ccc;
            color: #aaa;
            cursor: not-allowed;
        }

        /* 【ピンク枠】内容非表示・タイトルボタン */
        .news-content-btn {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background: none;
            border: 2px solid #ff007f;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            padding: 6px;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        .news-content-btn:hover {
            background-color: #fff0f5;
        }

        /* 赤い部分：画像を入れるところ */
        .row-img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            margin-right: 10px;
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid #ddd;
            background-color: #eee;
        }

        .row-title {
            font-size: 13px;
            font-weight: 600;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 4. 最下部：4回警告付きリセットボタン --- */
        .reset-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .reset-button {
            width: 100%;
            background-color: #ff3b30;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.2);
            transition: background-color 0.2s;
        }

        .reset-button:hover {
            background-color: #d62218;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 最上部：詳細表示エリア -->
        <div class="detail-display-area" id="detailDisplay">
            <h3>詳細表示エリア</h3>
            <p id="detailText">下のピンク枠のタイトルボタンを押すと、ここに詳しい内容が表示されます。</p>
        </div>

        <!-- 2. 中部：流れるニュースティッカー -->
        <div class="ticker-container">
            <div class="ticker-wrap">
                <div class="ticker-move" id="tickerLive">
                    <!-- JavaScriptで流れるテキストが生成されます -->
                </div>
            </div>
        </div>

        <!-- 3. 下部：縦並びリストエリア -->
        <div class="list-title">
            <span>ニュース一覧（▲▼で順番を入れ替え）</span>
            <span style="font-size: 11px; color:#888;">上ほど優先度高</span>
        </div>
        
        <div class="news-manager-list" id="managerList">
            <!-- 30個の行が自動で縦に並びます -->
        </div>

        <!-- 4. 4回確認を挟むリセットボタン -->
        <div class="reset-btn-container">
            <button class="reset-button" onclick="triggerStrictReset()">順番を初期状態にリセットする</button>
        </div>
    </div>
