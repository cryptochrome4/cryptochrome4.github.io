<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>iPod touch 5 通知センター再現</title>
    <style>
        /* iPod touch 5 の4インチ画面のサイズ(320x568)をブラウザ中央に再現 */
        body {
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .ipod-screen {
            width: 320px;
            height: 568px;
            background: #2b2b2b; /* 通知センターの背景色 */
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 4px solid #000;
            border-radius: 20px;
        }

        /* ーーー ① 当時のステータスバーの完全再現 ーーー */
        .status-bar {
            height: 20px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            box-sizing: border-box;
            z-index: 10;
            position: relative;
        }

        /* 左側: iPod と Wi-Fi */
        .status-left {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .wifi-icon {
            width: 12px;
            height: 12px;
            /* CSSでWi-Fiの扇形を簡易表現 */
            border-top: 2px solid #fff;
            border-radius: 50% 50% 0 0;
            position: relative;
        }

        /* 中央: 時間 */
        .status-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-variant-numeric: tabular-nums;
        }

        /* 右側: 縦固定鍵、バッテリー%、電池マーク */
        .status-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* 縦固定ロックの鍵マーク */
        .lock-icon {
            width: 10px;
            height: 10px;
            border: 1.5px solid #fff;
            border-radius: 50%;
            position: relative;
            display: inline-block;
        }
        .lock-icon::after {
            content: "🔒";
            font-size: 7px;
            position: absolute;
            top: -2px;
            left: 0.5px;
        }
        /* 電池マーク */
        .battery-icon {
            width: 18px;
            height: 9px;
            border: 1px solid #fff;
            border-radius: 2px;
            padding: 1px;
            display: flex;
            align-items: center;
        }
        .battery-level {
            width: 60%; /* バッテリー残量60% */
            height: 100%;
            background-color: #fff;
        }

        /* ーーー ② 通知センターのタブ再現 ーーー */
        .nc-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0, 0, 0, 0.2);
        }
        .nc-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            color: #888;
        }
        .nc-tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
        }

        /* ーーー ③ クイックメモウィジェットの再現 ーーー */
        .widget-area {
            padding: 15px;
        }
        .widget-box {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
        }
        .widget-title {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 90px; /* 縦の強烈な制限 */
            overflow: hidden;
        }
        .memo-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            line-height: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap; /* 横の強烈な制限 */
            overflow: hidden;
            text-overflow: ellipsis; 
        }
        .memo-item::before {
            content: "•";
            color: #007aff;
            font-size: 18px;
            margin-right: 8px;
        }
        .input-area {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 6px;
            padding: 6px;
            color: white;
            font-size: 13px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .input-area:focus { outline: none; }
    </style>
</head>
<body>

    <!-- iPod touch 5 の4インチ画面 -->
    <div class="ipod-screen">
        
        <!-- ステータスバー -->
        <div class="status-bar">
            <div class="status-left">
                <span>iPod</span>
                <div class="wifi-icon"></div>
            </div>
            <div class="status-center">午後 4:29</div>
            <div class="status-right">
                <div class="lock-icon"></div>
                <span>60%</span>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- 通知センターのタブ（今日 / 通知） -->
        <div class="nc-tabs">
            <div class="nc-tab active">今日の表示</div>
            <div class="nc-tab">通知</div>
        </div>

        <!-- ウィジェット表示エリア -->
        <div class="widget-area">
            <div class="widget-box">
                <div class="widget-title">クイックメモ</div>
                <ul class="memo-list" id="memoList">
                    <li class="memo-item">牛乳を買う</li>
                    <li class="memo-item">あいうえおかきくけこさしすせそ（ここで切れる）</li>
                </ul>
                <input type="text" class="input-area" id="memoInput" placeholder="タップして入力..." maxlength="30">
            </div>
        </div>

    </div>

    <script>
        const input = document.getElementById('memoInput');
        const list = document.getElementById('memoList');
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                const li = document.createElement('li');
                li.className = 'memo-item';
                li.textContent = input.value;
                list.appendChild(li);
                input.value = '';
            }
        });
    </script>
</body>
</html>
