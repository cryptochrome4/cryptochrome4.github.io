<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>iPod touch 5 クイックメモ完全再現</title>
    <style>
        /* 画面中央に配置 */
        body {
            background-color: #1a1a1a;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* iPod touch 5 の4インチ画面サイズを完全再現 */
        .ipod-screen {
            width: 320px;
            height: 568px;
            background-color: #141414; /* 実物の深い黒 */
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 4px solid #000;
            border-radius: 24px;
        }

        /* ーーー ① 最上部ステータスバー ーーー */
        .status-bar {
            height: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 0 8px;
            color: #fff;
            font-size: 11px;
            font-weight: 400;
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* 当時の極細Wi-Fiマークを再現 */
        .wifi-icon {
            width: 10px;
            height: 8px;
            border-top: 1px solid #fff;
            border-radius: 50% 50% 0 0;
            position: relative;
        }
        .wifi-icon::before {
            content: "";
            position: absolute;
            top: 3px; left: 2px; width: 6px; height: 5px;
            border-top: 1px solid #fff;
            border-radius: 50% 50% 0 0;
        }
        .status-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 500;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* 伝説の「縦画面固定ロック」鍵マーク */
        .lock-icon {
            width: 10px;
            height: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            position: relative;
        }
        .lock-icon::after {
            content: "🔒";
            font-size: 6px;
            position: absolute;
            top: -2px;
            left: 1px;
        }
        /* バッテリーアイコン */
        .battery-icon {
            width: 17px;
            height: 8px;
            border: 1px solid #fff;
            border-radius: 2px;
            padding: 1px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .battery-icon::after {
            content: "";
            position: absolute;
            right: -2px; top: 2px; width: 1px; height: 4px;
            background-color: #fff;
        }
        .battery-level {
            width: 100%; /* スクショ通り満充電 */
            height: 100%;
            background-color: #fff;
        }

        /* ーーー ② 「今日」「通知」タブ ーーー */
        .nc-tabs {
            display: flex;
            height: 38px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            background: rgba(255, 255, 255, 0.02);
        }
        .nc-tab {
            flex: 1;
            text-align: center;
            line-height: 38px;
            font-size: 13px;
            color: #838383;
        }
        .nc-tab.active {
            color: #fff;
            background-color: rgba(255,255,255,0.08);
            border-bottom: 1px solid #fff;
        }

        /* ーーー ③ 日付表示 ーーー */
        .date-header {
            color: #fff;
            font-size: 28px;
            font-weight: 300;
            text-align: center;
            margin: 22px 0 18px 0;
            letter-spacing: 0.5px;
        }

        /* ーーー ④ ウィジェット枠と境界線 ーーー */
        .widget-container {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        /* クイックメモ ヘッダー */
        .widget-header {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            height: 24px;
        }
        /* 本物のスクショに写っているアプリアイコン */
        .app-icon {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5px;
            color: #555;
            font-weight: bold;
            line-height: 1;
            text-align: center;
        }
        .widget-title {
            color: #fff;
            font-size: 15px;
            font-weight: 400;
        }

        /* メモリスト */
        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .memo-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            font-size: 15px;
            color: #fff;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 厳密に再現した「○」と「◎」の挙動 */
        .circle-btn {
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            margin-right: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-sizing: border-box;
            background: transparent;
        }
        /* タップすると中に小さな黒ポチが入って「◎」になる（でも何も起きない） */
        .circle-btn.selected {
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: transparent;
        }
        .circle-btn.selected::after {
            content: "";
            width: 4px;
            height: 4px;
            background-color: #141414; /* 背景の黒と同じ色をくり抜く */
            border-radius: 50%;
            border: 2.5px solid #fff; /* 周りを白で囲む */
        }

        /* 入力エリアと薄暗いボタンの再現 */
        .input-row {
            display: flex;
            gap: 8px;
            padding: 10px 14px 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-btn {
            flex: 1;
            height: 28px;
            background: rgba(255, 255, 255, 0.05); /* スクショのあの絶妙に薄暗いボタン */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.2); /* 無効化されてるっぽい薄い文字色 */
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* ーーー ⑤ 最下部「編集」ボタン ーーー */
        .edit-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }
        .edit-btn {
            width: 220px;
            height: 28px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            color: #aaa;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* 下部にある通知センターを閉じるための矢印ハンドル */
        .bottom-handle {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 4px;
            border-top: 2px solid rgba(255,255,255,0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="ipod-screen">
        <!-- ステータスバー -->
        <div class="status-bar">
            <div class="status-left">
                <span>iPod</span>
                <div class="wifi-icon"></div>
            </div>
            <div class="status-center">4:41</div>
            <div class="status-right">
                <div class="lock-icon"></div>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- タブ -->
        <div class="nc-tabs">
            <div class="nc-tab active">今日</div>
            <div class="nc-tab">通知</div>
        </div>

        <!-- 日付ヘッダー -->
        <div class="date-header">10月21日水曜日</div>

        <!-- クイックメモ ウィジェット本体 -->
        <div class="widget-container">
            <div class="widget-header">
                <div class="app-icon">メモ<br>ウィジェット</div>
                <div class="widget-title">クイックメモ</div>
            </div>
            
            <ul class="memo-list">
                <li class="memo-item">
                    <span class="circle-btn" onclick="toggleCircle(this)"></span>
                    <span>しゅんけつ</span>
                </li>
                <li class="memo-item">
                    <span class="circle-btn" onclick="toggleCircle(this)"></span>
                    <span>9-5</span>
                </li>
            </ul>

            <!-- 薄暗い追加・ペーストボタン -->
            <div class="input-row">
                <div class="input-btn">追加</div>
                <div class="input-btn">ペースト</div>
            </div>
        </div>

        <!-- 編集ボタン -->
        <div class="edit-btn-container">
            <div class="edit-btn">編集</div>
        </div>

        <!-- 下部の引っ張りハンドル -->
        <div class="bottom-handle"></div>
    </div>

    <script>
        // ○をタップすると◎になり、もう一度押すと○に戻る（でも何も起きない）
        function toggleCircle(element) {
            element.classList.toggle('selected');
        }
    </script>
</body>
</html>
