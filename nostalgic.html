<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>iPod touch 5 クイックメモ完全再現</title>
    <style>
        body {
            background-color: #1a1a1a;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .ipod-screen {
            width: 320px;
            height: 568px;
            background-color: #141414;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 4px solid #000;
            border-radius: 24px;
        }

        .status-bar {
            height: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 0 8px;
            color: #fff;
            font-size: 11px;
            font-weight: 400;
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .wifi-icon {
            width: 10px;
            height: 8px;
            border-top: 1px solid #fff;
            border-radius: 50% 50% 0 0;
            position: relative;
        }
        .wifi-icon::before {
            content: "";
            position: absolute;
            top: 3px; left: 2px; width: 6px; height: 5px;
            border-top: 1px solid #fff;
            border-radius: 50% 50% 0 0;
        }
        .status-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 500;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lock-icon {
            width: 10px;
            height: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            position: relative;
        }
        .lock-icon::after {
            content: "🔒";
            font-size: 6px;
            position: absolute;
            top: -2px;
            left: 1px;
        }
        .battery-icon {
            width: 17px;
            height: 8px;
            border: 1px solid #fff;
            border-radius: 2px;
            padding: 1px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .battery-icon::after {
            content: "";
            position: absolute;
            right: -2px; top: 2px; width: 1px; height: 4px;
            background-color: #fff;
        }
        .battery-level {
            width: 100%;
            height: 100%;
            background-color: #fff;
        }

        .nc-tabs {
            display: flex;
            height: 38px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            background: rgba(255, 255, 255, 0.02);
        }
        .nc-tab {
            flex: 1;
            text-align: center;
            line-height: 38px;
            font-size: 13px;
            color: #838383;
        }
        .nc-tab.active {
            color: #fff;
            background-color: rgba(255,255,255,0.08);
            border-bottom: 1px solid #fff;
        }

        .date-header {
            color: #fff;
            font-size: 28px;
            font-weight: 300;
            text-align: center;
            margin: 22px 0 18px 0;
            letter-spacing: 0.5px;
        }

        .widget-container {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .widget-header {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            height: 24px;
        }
        .app-icon {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5px;
            color: #555;
            font-weight: bold;
            line-height: 1;
            text-align: center;
        }
        .widget-title {
            color: #fff;
            font-size: 15px;
            font-weight: 400;
        }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .memo-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            font-size: 15px;
            color: #fff;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .circle-btn {
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            margin-right: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-sizing: border-box;
            background: transparent;
        }
        .circle-btn.selected {
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: transparent;
        }
        .circle-btn.selected::after {
            content: "";
            width: 4px;
            height: 4px;
            background-color: #141414;
            border-radius: 50%;
            border: 2.5px solid #fff;
        }

        /* 外側の入れ物用のエリア */
        .input-row {
            padding: 10px 14px 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ーーー 【修正】普段は完全に透明、出現時は枠（欄）も文字も一緒に浮き出る ーーー */
        .input-btn {
            width: 100%;
            height: 28px;
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            
            /* 初期状態：完全に透明 */
            background: transparent;
            border: 1px solid transparent;
            color: transparent;
            
            /* ふわっと現れるアニメーションを設定 */
            transition: background 0.4s ease, border 0.4s ease, color 0.4s ease;
        }

        /* 4分ごとに10秒間だけ、このクラスがシステムで自動追加される */
        .input-btn.show {
            background: rgba(255, 255, 255, 0.05); /* 好評だったうっすら暗い背景 */
            border: 1px solid rgba(255, 255, 255, 0.08); /* さっきの綺麗な枠線 */
            color: rgba(255, 255, 255, 0.2); /* 当時の文字色 */
        }

        .edit-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }
        .edit-btn {
            width: 220px;
            height: 28px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            color: #aaa;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .bottom-handle {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 4px;
            border-top: 2px solid rgba(255,255,255,0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="ipod-screen">
        <div class="status-bar">
            <div class="status-left">
                <span>iPod</span>
                <div class="wifi-icon"></div>
            </div>
            <div class="status-center">4:41</div>
            <div class="status-right">
                <div class="lock-icon"></div>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <div class="nc-tabs">
            <div class="nc-tab active">今日</div>
            <div class="nc-tab">通知</div>
        </div>

        <div class="date-header">10月21日水曜日</div>

        <div class="widget-container">
            <div class="widget-header">
                <div class="app-icon">メモ<br>ウィジェット</div>
                <div class="widget-title">クイックメモ</div>
            </div>
            
            <ul class="memo-list">
                <li class="memo-item">
                    <span class="circle-btn" onclick="toggleCircle(this)"></span>
                    <span>しゅんけつ</span>
                </li>
                <li class="memo-item">
                    <span class="circle-btn" onclick="toggleCircle(this)"></span>
                    <span>9-5</span>
                </li>
            </ul>

            <div class="input-row">
                <!-- 最初は完全に隠れているボタン。時間が来ると枠ごと現れます -->
                <div class="input-btn" id="addButton">追加</div>
            </div>
        </div>

        <div class="edit-btn-container">
            <div class="edit-btn">編集</div>
        </div>

        <div class="bottom-handle"></div>
    </div>

    <script>
        function toggleCircle(element) {
            element.classList.toggle('selected');
        }

        const addButton = document.getElementById('addButton');
        
        function triggerSecret() {
            // クラス「show」をつけて、枠・線・文字を同時にフワッと出現させる
            addButton.classList.add('show');
            
            // 10秒後（10000ミリ秒）に再び全部消す
            setTimeout(() => {
                addButton.classList.remove('show');
            }, 10000);
        }

        // 4分（240000ミリ秒）ごとにループ処理を実行
        setInterval(triggerSecret, 240000);
    </script>
</body>
</html>
