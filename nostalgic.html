<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>iPod touch 5 クイックメモ完全再現</title>
    <style>
        body {
            background-color: #1a1a1a;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* iPod touch 5 画面サイズと実物の完全な暗闇の背景 */
        .ipod-screen {
            width: 320px;
            height: 568px;
            background-color: #111111; /* 実物の深い闇の黒 */
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 4px solid #000;
            border-radius: 24px;
        }

        /* ーーー ① 最上部ステータスバー ーーー */
        .status-bar {
            height: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 0 8px;
            color: #fff;
            font-size: 11px;
            font-weight: 400;
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .wifi-icon {
            width: 10px;
            height: 8px;
            border-top: 1px solid #fff;
            border-radius: 50% 50% 0 0;
            position: relative;
        }
        .wifi-icon::before {
            content: "";
            position: absolute;
            top: 3px; left: 2px; width: 6px; height: 5px;
            border-top: 1px solid #fff;
            border-radius: 50% 50% 0 0;
        }
        .status-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 500;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lock-icon {
            width: 10px;
            height: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            position: relative;
        }
        .lock-icon::after {
            content: "🔒";
            font-size: 6px;
            position: absolute;
            top: -2px;
            left: 1px;
        }
        .battery-icon {
            width: 17px;
            height: 8px;
            border: 1px solid #fff;
            border-radius: 2px;
            padding: 1px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .battery-icon::after {
            content: "";
            position: absolute;
            right: -2px; top: 2px; width: 1px; height: 4px;
            background-color: #fff;
        }
        .battery-level {
            width: 100%;
            height: 100%;
            background-color: #fff;
        }

        /* ーーー ② 【修正】タブ（今日の文字色を黒に） ーーー */
        .nc-tabs {
            display: flex;
            height: 38px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            background: rgba(255, 255, 255, 0.01);
        }
        .nc-tab {
            flex: 1;
            text-align: center;
            line-height: 38px;
            font-size: 13px;
            color: #777777;
        }
        /* スクショ通り「今日」の文字色をかなり深いグレー（黒っぽく）に修正 */
        .nc-tab.active {
            color: #000000; 
            background-color: rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.4);
        }
        .nc-tab.inactive {
            color: #838383; /* 「通知」は明るい白寄りのグレー */
        }

        /* ーーー ③ 【修正】日付表示の色合い ーーー */
        .date-header {
            color: rgba(255, 255, 255, 0.85); /* ほんの少し透過したiOSの白 */
            font-size: 28px;
            font-weight: 300;
            text-align: center;
            margin: 22px 0 18px 0;
            letter-spacing: 0.5px;
        }

        /* ーーー ④ ウィジェット ーーー */
        .widget-container {
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .widget-header {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            height: 24px;
        }
        .app-icon {
            width: 18px;
            height: 18px;
            background: rgba(255,255,255,0.9);
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5px;
            color: #555;
            font-weight: bold;
            line-height: 1;
            text-align: center;
        }
        .widget-title {
            color: rgba(255,255,255,0.9);
            font-size: 15px;
            font-weight: 400;
        }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .memo-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            font-size: 15px;
            color: #fff;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 「○」と「◎」の挙動（外輪は白、タップすると中は背景と同じ黒がくり抜かれる） */
        .circle-btn {
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin-right: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-sizing: border-box;
            background: transparent;
        }
        .circle-btn.selected {
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .circle-btn.selected::after {
            content: "";
            width: 4px;
            height: 4px;
            background-color: #111111; /* くり抜き用の背景黒 */
            border-radius: 50%;
            border: 2.5px solid #fff;
        }

        /* ーーー ⑤ 【修正】極限まで暗くした「追加」「ペースト」ボタン ーーー */
        .input-row {
            display: flex;
            gap: 8px;
            padding: 10px 14px 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .input-btn {
            flex: 1;
            height: 28px;
            /* 画面の明るさを上げないと気づかないレベルの暗闇色 */
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 5px;
            /* 闇に溶け込む超暗い文字色 */
            color: rgba(255, 255, 255, 0.04); 
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* ーーー ⑥ 【修正】編集ボタン（文字色を黒に） ーーー */
        .edit-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }
        .edit-btn {
            width: 220px;
            height: 28px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 5px;
            color: #222222; /* スクショ通り、文字色を黒（濃いグレー）に修正 */
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
        }

        /* ーーー ⑦ 【修正】最下部にもう一本追加された横線 ーーー */
        .bottom-border-line {
            position: absolute;
            bottom: 25px;
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .bottom-handle {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 4px;
            border-top: 2px solid rgba(255,255,255,0.25);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="ipod-screen">
        <!-- ステータスバー -->
        <div class="status-bar">
            <div class="status-left">
                <span>iPod</span>
                <div class="wifi-icon"></div>
            </div>
            <div class="status-center">4:40</div>
            <div class="status-right">
                <div class="lock-icon"></div>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- タブ（今日：黒文字 / 通知：白グレー文字） -->
        <div class="nc-tabs">
            <div class="nc-tab active">今日</div>

        </div>

        <!-- 日付 -->
        <div class="date-header">10月21日水曜日</div>

        <div class="widget-container">

                <div class="app-icon">メモ<br>ウィジェット</div>
                <div class="widget-title">クイックメモ</div>
            </div>
            
            <ul class="memo-list">

                    <span class="circle-btn" onclick="toggleCircle(this)"></span>

                    <span class="circle-btn" onclick="toggleCircle(this)"></span>

                </li>
            </ul>

            <!-- 超暗黒化された追加とペーストボタン -->
            <div class="input-row">
                <div class="input-btn">追加</div>
                <div class="input-btn">ペースト</div>
            </div>
        </div>

        <!-- 編集ボタン（黒文字） -->
        <div class="edit-btn-container">
            <div class="edit-btn">編集</div>
        </div>

        <!-- 【追加】最下部のもう一本の横線 -->
        <div class="bottom-border-line"></div>

        <!-- 最下部のハンドル -->
        <div class="bottom-handle"></div>
    </div>
