<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピーチ救出シーン</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'メイリオ', sans-serif;
            padding: 20px;
        }
        .container {
            background: #2d2d44;
            padding: 20px 30px 30px;
            border-radius: 28px;
            box-shadow: 0 12px 0 #0f0f1a;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #f0e6b0;
            font-size: 20px;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #3d2f1f;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 6px solid #4a3f2b;
            border-radius: 16px;
            box-shadow: inset 0 0 0 3px #c9a87c, 0 10px 0 #2b241b;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            aspect-ratio: 800/400;
        }
        .footer {
            margin-top: 14px;
            text-align: center;
            color: #8d8da0;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 ピーチ救出シーン 🏆</h1>
        <canvas id="endingCanvas" width="800" height="400"></canvas>
        <div class="footer">Thank you Mario! / Your quest is over.</div>
    </div>

    <script>
        (function() {
            var endingCanvas = document.getElementById('endingCanvas');
            var ectx = endingCanvas.getContext('2d');

            function drawPeachRescueScene() {
                var w = 800, h = 400;
                // 背景（夜空）
                var grad = ectx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0a0a2a');
                grad.addColorStop(1, '#1a1a3a');
                ectx.fillStyle = grad;
                ectx.fillRect(0, 0, w, h);
                // 星
                for (var i = 0; i < 50; i++) {
                    var sx = (i * 37 + 13) % w;
                    var sy = (i * 53 + 7) % (h * 0.6);
                    ectx.fillStyle = 'rgba(255,255,220,' + (0.4 + (i % 5) * 0.12) + ')';
                    ectx.fillRect(sx, sy, 2, 2);
                }
                // 地面
                ectx.fillStyle = '#2a1a3a';
                ectx.fillRect(0, h - 60, w, 60);
                ectx.fillStyle = '#3a2a4a';
                ectx.fillRect(0, h - 60, w, 4);

                // 壊れた檻
                var cageX = 500, cageY = h - 180, cageW = 80, cageH = 120;
                ectx.strokeStyle = '#888';
                ectx.lineWidth = 4;
                ectx.beginPath();
                ectx.moveTo(cageX, cageY);
                ectx.lineTo(cageX, cageY + cageH);
                ectx.moveTo(cageX + cageW, cageY);
                ectx.lineTo(cageX + cageW, cageY + 40);
                ectx.stroke();
                // 破片
                ectx.strokeStyle = '#666';
                ectx.lineWidth = 3;
                ectx.beginPath();
                ectx.moveTo(cageX + 30, cageY + 20);
                ectx.lineTo(cageX + 50, cageY + 40);
                ectx.moveTo(cageX + 60, cageY + 10);
                ectx.lineTo(cageX + 70, cageY + 30);
                ectx.stroke();

                // ピーチ（檻の外、喜んでいる）
                var peachX = 510;
                var peachY = cageY + 30;
                // ドレス
                ectx.fillStyle = '#ff69b4';
                ectx.beginPath();
                ectx.moveTo(peachX, peachY + 100);
                ectx.lineTo(peachX - 20, peachY + 100);
                ectx.lineTo(peachX - 12, peachY + 60);
                ectx.lineTo(peachX + 12, peachY + 60);
                ectx.lineTo(peachX + 20, peachY + 100);
                ectx.closePath();
                ectx.fill();
                // 腕（喜び）
                ectx.strokeStyle = '#f7d9b0';
                ectx.lineWidth = 5;
                ectx.beginPath();
                ectx.moveTo(peachX - 10, peachY + 70);
                ectx.lineTo(peachX - 22, peachY + 45);
                ectx.moveTo(peachX + 10, peachY + 70);
                ectx.lineTo(peachX + 22, peachY + 45);
                ectx.stroke();
                // 頭
                ectx.fillStyle = '#f7d9b0';
                ectx.beginPath();
                ectx.arc(peachX, peachY + 50, 14, 0, Math.PI * 2);
                ectx.fill();
                // 髪（金）
                ectx.fillStyle = '#ffd700';
                ectx.beginPath();
                ectx.arc(peachX, peachY + 42, 15, Math.PI, Math.PI * 2);
                ectx.fill();
                ectx.fillRect(peachX - 15, peachY + 42, 30, 10);
                ectx.fillRect(peachX - 17, peachY + 52, 6, 14);
                ectx.fillRect(peachX + 11, peachY + 52, 6, 14);
                // 目（笑顔）
                ectx.strokeStyle = '#222';
                ectx.lineWidth = 1.5;
                ectx.beginPath();
                ectx.arc(peachX - 4, peachY + 50, 2, 0, Math.PI);
                ectx.arc(peachX + 4, peachY + 50, 2, 0, Math.PI);
                ectx.stroke();
                // 口（笑顔）
                ectx.beginPath();
                ectx.arc(peachX, peachY + 55, 3, 0, Math.PI);
                ectx.stroke();
                // 王冠
                ectx.fillStyle = '#ffd700';
                ectx.beginPath();
                ectx.moveTo(peachX - 10, peachY + 38);
                ectx.lineTo(peachX - 8, peachY + 30);
                ectx.lineTo(peachX - 3, peachY + 36);
                ectx.lineTo(peachX, peachY + 28);
                ectx.lineTo(peachX + 3, peachY + 36);
                ectx.lineTo(peachX + 8, peachY + 30);
                ectx.lineTo(peachX + 10, peachY + 38);
                ectx.closePath();
                ectx.fill();

                // マリオ（ピーチの隣）
                var marioX = 440;
                var marioY = h - 160;
                ectx.save();
                ectx.translate(marioX + 15, marioY + 20);
                // 帽子
                ectx.fillStyle = '#e33b3b';
                ectx.fillRect(-14, -22, 28, 12);
                ectx.fillRect(-10, -28, 20, 8);
                // 顔
                ectx.fillStyle = '#f7d9b0';
                ectx.fillRect(-12, -10, 24, 16);
                // 目（笑顔）
                ectx.strokeStyle = '#222';
                ectx.lineWidth = 1.5;
                ectx.beginPath();
                ectx.arc(-4, -3, 2, 0, Math.PI);
                ectx.arc(4, -3, 2, 0, Math.PI);
                ectx.stroke();
                // 口（笑顔）
                ectx.beginPath();
                ectx.arc(0, 3, 3, 0, Math.PI);
                ectx.stroke();
                // 体
                ectx.fillStyle = '#e33b3b';
                ectx.fillRect(-12, 6, 24, 16);
                // ボタン
                ectx.fillStyle = '#f5c542';
                ectx.fillRect(-6, 12, 3, 3);
                ectx.fillRect(3, 12, 3, 3);
                // 足
                ectx.fillStyle = '#2d2d8a';
                ectx.fillRect(-12, 22, 10, 6);
                ectx.fillRect(2, 22, 10, 6);
                ectx.restore();

                // ハート
                ectx.fillStyle = '#ff3366';
                ectx.save();
                ectx.translate(peachX - 40, peachY - 20);
                ectx.beginPath();
                ectx.moveTo(0, 5);
                ectx.bezierCurveTo(-8, -5, -16, 5, 0, 15);
                ectx.bezierCurveTo(16, 5, 8, -5, 0, 5);
                ectx.fill();
                ectx.restore();

                // テキスト
                ectx.fillStyle = '#ffd700';
                ectx.font = 'bold 36px "Segoe UI", sans-serif';
                ectx.textAlign = 'center';
                ectx.fillText('Thank you Mario!', w/2, 80);
                ectx.font = 'bold 22px "Segoe UI", sans-serif';
                ectx.fillStyle = '#fff';
                ectx.fillText('Your quest is over.', w/2, 120);
                ectx.textAlign = 'left';
            }

            drawPeachRescueScene();
        })();
    </script>
</body>
</html>
