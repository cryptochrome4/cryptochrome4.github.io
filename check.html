<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CROWD — Character Portfolio</title>
<style>
  /* ============================================
     DESIGN TOKENS  (nontitle風: 黒×白×アクセント黄)
  ============================================ */
  :root {
    --bg: #0a0a0a;
    --bg-card: #141414;
    --bg-panel: #101010;
    --fg: #f5f5f5;
    --fg-dim: #8a8a8a;
    --line: #2a2a2a;
    --accent: #e8ff3a;      /* 蛍光イエロー */
    --accent-dim: rgba(232,255,58,0.15);
    --card-width: clamp(130px, 18vw, 190px);  /* ★サイズ据え置き */
    --card-gap: clamp(10px, 1.6vw, 20px);
    --speed: 45s;
    --img-fit: cover;        /* ← デフォルト。JSで切替 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.02em;
  }

  body { padding-bottom: 80px; }

  /* ============================================
     HEADER
  ============================================ */
  .header {
    padding: 48px clamp(20px, 6vw, 80px) 32px;
    border-bottom: 1px solid var(--line);
  }
  .header__label {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .header__title {
    font-size: clamp(28px, 6vw, 64px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .header__title span {
    color: var(--accent);
  }
  .header__sub {
    margin-top: 20px;
    font-size: clamp(12px, 1.6vw, 14px);
    color: var(--fg-dim);
    max-width: 560px;
    line-height: 1.7;
  }

  /* ============================================
     SLIDER
  ============================================ */
  .slider-section {
    padding: 40px 0 24px;
    border-bottom: 1px solid var(--line);
  }
  .slider-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 0 clamp(20px, 6vw, 80px) 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .slider-head__title {
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg-dim);
    padding-top: 8px;
  }

  /* ★ 切替エリア（個別 + 全体 を縦に並べる） */
  .fit-area {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .fit-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .fit-row__label {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
    text-transform: uppercase;
  }

  .fit-switch {
    display: flex;
    gap: 6px;
  }
  .fit-switch button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .fit-switch button:hover {
    color: var(--fg);
    border-color: var(--fg-dim);
  }
  .fit-switch button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }

  /* ★ 個別キャラ選択ドロップダウン */
  .char-picker {
    position: relative;
  }
  .char-picker__btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 2px;
    font-family: inherit;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .char-picker__btn:hover {
    background: var(--accent-dim);
  }
  .char-picker__arrow {
    display: inline-block;
    font-size: 10px;
    transition: transform 0.2s;
  }
  .char-picker.open .char-picker__arrow {
    transform: rotate(180deg);
  }
  .char-picker__menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 180px;
    max-height: min(50vh, 380px);
    overflow-y: auto;
    background: var(--bg-card);
    border: 1px solid var(--line);
    z-index: 50;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  }
  .char-picker.open .char-picker__menu {
    display: block;
  }
  .char-picker__item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: var(--fg);
    font-size: 13px;
    text-align: left;
    padding: 11px 16px;
    cursor: pointer;
    font-family: inherit;
  }
  .char-picker__item:last-child { border-bottom: none; }
  .char-picker__item:hover {
    background: rgba(255,255,255,0.06);
  }
  .char-picker__item.active {
    color: var(--accent);
    font-weight: 700;
  }
  .char-picker__item small {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--fg-dim);
    text-transform: uppercase;
  }

  .slider {
    overflow: hidden;
    width: 100%;
    position: relative;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .track {
    display: flex;
    gap: var(--card-gap);
    width: max-content;
    animation: scroll-left var(--speed) linear infinite;
    will-change: transform;
  }
  .slider:hover .track,
  .slider.paused .track {
    animation-play-state: paused;
  }
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-50% - var(--card-gap) / 2)); }
  }

  /* ============================================
     CARD  (★サイズ変更なし / 回転演出だけ追加)
  ============================================ */
  .card {
    flex: 0 0 var(--card-width);
    width: var(--card-width);
    aspect-ratio: 3 / 4;
    background: var(--bg-card);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    transition: border-color 0.2s, transform 0.25s;
    perspective: 800px;             /* ★回転用の奥行き */
    transform-style: preserve-3d;   /* ★3D保持 */
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: var(--img-fit);   /* ← 切替用 */
    display: block;
    pointer-events: none;
    filter: grayscale(15%);
    transition: filter 0.25s, transform 0.4s;
    backface-visibility: hidden;    /* ★裏面見せない */
  }
  .card:hover {
    transform: translateY(-4px);
  }
  .card:hover img {
    filter: grayscale(0%);
    transform: scale(1.04);
  }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 24px rgba(232,255,58,0.2);
  }
  .card.selected img {
    filter: grayscale(0%);
  }
  .card__badge {
    position: absolute;
    top: 8px; left: 8px;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.75);
    color: var(--accent);
    padding: 3px 7px;
    border: 1px solid var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card.selected .card__badge { opacity: 1; }

  /* ★ 選択時の回転演出（カードサイズは不変） */
  .card.spin img {
    animation: card-spin 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes card-spin {
    0%   { transform: rotateY(0deg)   scale(1); }
    50%  { transform: rotateY(180deg) scale(0.96); }
    100% { transform: rotateY(360deg) scale(1); }
  }

  /* ============================================
     INFO PANEL
  ============================================ */
  .panel-section {
    padding: 48px clamp(20px, 6vw, 80px);
  }
  .panel {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
  }

  .panel__empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--fg-dim);
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 1px dashed var(--line);
  }
  .panel__empty span { color: var(--accent); }

  /* キャラヘッダー */
  .char-head {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: clamp(20px, 4vw, 48px);
    align-items: end;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--line);
    perspective: 900px;             /* ★回転用 */
  }
  .char-head__img {
    width: clamp(120px, 20vw, 200px);
    aspect-ratio: 3 / 4;
    object-fit: var(--img-fit);
    border: 1px solid var(--line);
    display: block;
    backface-visibility: hidden;
  }
  /* ★ パネル画像の回転イン */
  .char-head__img.panel-in {
    animation: panel-spin-in 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @keyframes panel-spin-in {
    0%   { opacity: 0; transform: rotateY(90deg); }
    60%  { opacity: 1; transform: rotateY(-12deg); }
    100% { opacity: 1; transform: rotateY(0deg); }
  }

  .char-head__meta { min-width: 0; }
  .char-head__no {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .char-head__name {
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    word-break: break-word;
  }
  .char-head__type {
    margin-top: 12px;
    font-size: clamp(13px, 2vw, 16px);
    color: var(--fg-dim);
    line-height: 1.6;
  }

  /* 総投資額 */
  .total-block {
    padding: 32px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .total-block__label {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  .total-block__value {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .total-block__value small {
    font-size: 0.5em;
    color: var(--fg-dim);
    font-weight: 400;
    margin-left: 6px;
  }

  /* カテゴリ（国内株 / 米国株） */
  .cat { padding: 32px 0; border-bottom: 1px solid var(--line); }
  .cat:last-child { border-bottom: none; }
  .cat__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cat__title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .cat__title::before {
    content: '';
    display: inline-block;
    width: 10px; height: 10px;
    background: var(--accent);
    margin-right: 10px;
    transform: translateY(-1px);
  }
  .cat__sum {
    font-size: 12px;
    color: var(--fg-dim);
    letter-spacing: 0.05em;
  }

  .holding {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 16px;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .holding:last-child { border-bottom: none; }
  .holding__name {
    font-size: 14px;
    font-weight: 600;
  }
  .holding__code {
    font-size: 11px;
    color: var(--fg-dim);
    margin-left: 8px;
    letter-spacing: 0.05em;
  }
  .holding__amount {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    font-weight: 600;
  }
  .holding__pct {
    font-size: 12px;
    color: var(--fg-dim);
    font-variant-numeric: tabular-nums;
    text-align: right;
    width: 56px;
  }

  /* バー */
  .holding__bar {
    grid-column: 1 / -1;
    height: 2px;
    background: var(--line);
    margin-top: 6px;
    position: relative;
    overflow: hidden;
  }
  .holding__bar-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  /* レスポンシブ */
  @media (max-width: 640px) {
    .char-head { grid-template-columns: 1fr; align-items: start; }
    .char-head__img { width: 120px; }
    .holding { grid-template-columns: 1fr auto; }
    .holding__pct { width: auto; }
    .holding__bar { grid-column: 1 / -1; }
    .fit-area { align-items: flex-start; width: 100%; }
    .fit-row { justify-content: flex-start; }
    .char-picker__menu { right: auto; left: 0; }
  }

  /* フッター */
  .footer {
    padding: 40px clamp(20px, 6vw, 80px);
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
</style>
</head>

/* ============================================================
   ユーティリティ
============================================================ */
function resolveCharacter(c) {
  if (c.isVariant) {
    const v = c.variants[Math.floor(Math.random() * c.variants.length)];
    return { ...c, name: v.name, img: v.img };
  }
  return { ...c };
}

function sumValues(obj) {
  return Object.values(obj).reduce((a, b) => a + b, 0);
}

/* ============================================================
   ★ 画像フィット管理（全体 / 個別）
   - globalFit : 全体の設定
   - indivFit  : 画像ファイル名ごとの個別設定（あれば全体より優先）
============================================================ */
let globalFit = 'cover';
const indivFit = {};   // { "img372nontitle.jpg": "fill", ... }

function getIndivStyle(imgKey) {
  return indivFit[imgKey] ? `style="object-fit:${indivFit[imgKey]}"` : '';
}

function applyIndivFitToDom(imgKey, fit) {
  document.querySelectorAll(`img[data-key="${imgKey}"]`).forEach(el => {
    el.style.objectFit = fit || '';
  });
}

/* ============================================================
   スライダー生成
============================================================ */
const track = document.getElementById('track');
const RESOLVED = CHARACTERS.map(resolveCharacter);

function createCard(char) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = char.id;
  card.innerHTML = `
    <img src="${char.img}" data-key="${char.img}" ${getIndivStyle(char.img)} alt="${char.name}" loading="lazy" />
    <div class="card__badge">SELECTED</div>
  `;
  card.addEventListener('click', () => selectCharacter(char.id));
  return card;
}

function initSlider() {
  track.innerHTML = '';
  for (let set = 0; set < 2; set++) {
    RESOLVED.forEach(char => track.appendChild(createCard(char)));
  }
}

/* ============================================================
   選択処理 → 情報パネル描画
============================================================ */
const panel = document.getElementById('panel');

function selectCharacter(id) {
  // 選択状態リセット
  document.querySelectorAll('.card').forEach(el => {
    el.classList.remove('selected', 'spin');
  });

  // 選択カードに spin クラス（2セット分すべて）
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el => {
    el.classList.add('selected');
    // アニメーション再生のため一度外して付与
    void el.offsetWidth;
    el.classList.add('spin');
  });

  const char = RESOLVED.find(c => c.id === id);
  if (!char) return;
  renderPanel(char);
}

function formatYen(n) {
  return '¥' + n.toLocaleString('ja-JP');
}

function renderPanel(char) {
  const jpTotal = sumValues(char.jp);
  const usTotal = sumValues(char.us);
  const total = jpTotal + usTotal;

  const jpList = Object.entries(char.jp)
    .map(([key, amount]) => ({ ...JP_STOCKS[key], amount }))
    .sort((a, b) => b.amount - a.amount);

  const usList = Object.entries(char.us)
    .map(([key, amount]) => ({ ...US_STOCKS[key], amount }))
    .sort((a, b) => b.amount - a.amount);

  const pct = (n) => ((n / total) * 100).toFixed(1) + '%';

  const renderHoldings = (list, isUS) => list.map(h => `
    <div class="holding">
      <div class="holding__name">
        ${h.name}
        <span class="holding__code">${isUS ? h.ticker : h.code}</span>
      </div>
      <div class="holding__amount">${formatYen(h.amount)}</div>
      <div class="holding__pct">${pct(h.amount)}</div>
      <div class="holding__bar">
        <div class="holding__bar-fill" style="width:${pct(h.amount)}"></div>
      </div>
    </div>
  `).join('');

  panel.innerHTML = `
    <div class="char-head">
      <img class="char-head__img panel-in" src="${char.img}" data-key="${char.img}" ${getIndivStyle(char.img)} alt="${char.name}" />
      <div class="char-head__meta">
        <div class="char-head__no">No.${String(char.id).padStart(2, '0')} / Character</div>
        <div class="char-head__name">${char.name}</div>
        <div class="char-head__type">${char.type}</div>
      </div>
    </div>

    <div class="total-block">
      <div class="total-block__label">Total Investment</div>
      <div class="total-block__value">${formatYen(total)}<small>総投資額</small></div>
    </div>

    <div class="cat">
      <div class="cat__head">
        <div class="cat__title">国内株式</div>
        <div class="cat__sum">${formatYen(jpTotal)} ・ ${pct(jpTotal)}</div>
      </div>
      ${renderHoldings(jpList, false)}
    </div>

    <div class="cat">
      <div class="cat__head">
        <div class="cat__title">米国株式</div>
        <div class="cat__sum">${formatYen(usTotal)} ・ ${pct(usTotal)}</div>
      </div>
      ${renderHoldings(usList, true)}
    </div>
  `;
}

/* ============================================================
   ★ 個別：キャラ選択ドロップダウン（ポートフォリオ選択とは無関係）
============================================================ */
// 18名ぶん（和田・あいかも別々に）
const ALL_CHARS = [];
CHARACTERS.forEach(c => {
  if (c.isVariant) {
    c.variants.forEach(v => ALL_CHARS.push({ name: v.name, img: v.img }));
  } else {
    ALL_CHARS.push({ name: c.name, img: c.img });
  }
});

let fitTarget = ALL_CHARS[0];   // 初期は「ハマ」

const charPicker      = document.getElementById('charPicker');
const charPickerBtn   = document.getElementById('charPickerBtn');
const charPickerLabel = document.getElementById('charPickerLabel');
const charPickerMenu  = document.getElementById('charPickerMenu');
const indivFitSwitch  = document.getElementById('indivFitSwitch');

function currentFitOf(imgKey) {
  return indivFit[imgKey] || globalFit;
}

// 個別ボタンの active 表示を、選んでいるキャラの現在のフィットに合わせる
function syncIndivButtons() {
  const fit = currentFitOf(fitTarget.img);
  indivFitSwitch.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.fit === fit);
  });
}

function renderPickerMenu() {
  charPickerMenu.innerHTML = '';
  ALL_CHARS.forEach(ch => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'char-picker__item' + (ch.img === fitTarget.img ? ' active' : '');
    const custom = indivFit[ch.img];
    item.innerHTML = `<span>${ch.name}</span>${custom ? `<small>${custom}</small>` : ''}`;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      fitTarget = ch;
      charPickerLabel.textContent = ch.name;
      charPicker.classList.remove('open');
      syncIndivButtons();
      // ※ selectCharacter() は呼ばない＝ポートフォリオは変わらない
    });
    charPickerMenu.appendChild(item);
  });
}

charPickerBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const willOpen = !charPicker.classList.contains('open');
  if (willOpen) renderPickerMenu();
  charPicker.classList.toggle('open', willOpen);
});

// 外側クリックで閉じる
document.addEventListener('click', (e) => {
  if (!charPicker.contains(e.target)) charPicker.classList.remove('open');
});

// 個別の COVER / FILL / CONTAIN
indivFitSwitch.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const fit = btn.dataset.fit;

  indivFit[fitTarget.img] = fit;
  applyIndivFitToDom(fitTarget.img, fit);
  syncIndivButtons();
});

/* ============================================================
   object-fit 切替（全体）
   ※ 全体を押すと、個別設定はリセットして全員を揃える
============================================================ */
document.getElementById('fitSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const fit = btn.dataset.fit;

  globalFit = fit;

  // 個別設定をクリア
  Object.keys(indivFit).forEach(k => delete indivFit[k]);
  document.querySelectorAll('img[data-key]').forEach(el => { el.style.objectFit = ''; });

  document.documentElement.style.setProperty('--img-fit', fit);
  document.querySelectorAll('#fitSwitch button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  syncIndivButtons();
});

/* ============================================================
   起動
============================================================ */
initSlider();
syncIndivButtons();
</script>
</body>
</html>
