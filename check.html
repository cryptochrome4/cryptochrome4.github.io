<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピーチ救出アニメーション</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'メイリオ', sans-serif;
            padding: 20px;
        }
        .container {
            background: #2d2d44;
            padding: 20px 30px 30px;
            border-radius: 28px;
            box-shadow: 0 12px 0 #0f0f1a;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #f0e6b0;
            font-size: 20px;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #3d2f1f;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 6px solid #4a3f2b;
            border-radius: 16px;
            box-shadow: inset 0 0 0 3px #c9a87c, 0 10px 0 #2b241b;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            aspect-ratio: 800/400;
        }
        .footer {
            margin-top: 14px;
            text-align: center;
            color: #8d8da0;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }
        .controls button {
            background: #f5c542;
            border: none;
            border-bottom: 6px solid #b47d2a;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 16px;
            color: #2d2d1c;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #4f3d1a;
        }
        .controls button:active { transform: translateY(4px); border-bottom-width: 2px; }
        .phase-display {
            text-align: center;
            color: #ffd78a;
            font-size: 15px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 ピーチ救出アニメーション 🏆</h1>
        <canvas id="endingCanvas" width="800" height="400"></canvas>
        <div class="phase-display" id="phaseDisplay">フェーズ0: ピーチが檻の中</div>
        <div class="controls">
            <button id="restartBtn">↺ 最初から</button>
        </div>
        <div class="footer">自動再生中（約9秒で1周）</div>
    </div>

    <script>
        (function() {
            var endingCanvas = document.getElementById('endingCanvas');
            var ectx = endingCanvas.getContext('2d');
            var phaseDisplay = document.getElementById('phaseDisplay');
            var restartBtn = document.getElementById('restartBtn');

            var endingTimer = 0;
            var endingPhase = 0;

            function updateEnding() {
                endingTimer++;
                var w = 800, h = 400;

                // 背景（夜空）
                var grad = ectx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0a0a2a');
                grad.addColorStop(1, '#1a1a3a');
                ectx.fillStyle = grad;
                ectx.fillRect(0, 0, w, h);

                // 星
                for (var i = 0; i < 40; i++) {
                    var sx = (i * 37 + 13) % w;
                    var sy = (i * 53 + 7) % (h * 0.6);
                    var twinkle = 0.5 + Math.sin(endingTimer * 0.1 + i) * 0.5;
                    ectx.fillStyle = 'rgba(255,255,220,' + twinkle + ')';
                    ectx.fillRect(sx, sy, 2, 2);
                }

                // 地面
                ectx.fillStyle = '#2a1a3a';
                ectx.fillRect(0, h - 60, w, 60);
                ectx.fillStyle = '#3a2a4a';
                ectx.fillRect(0, h - 60, w, 4);

                // ============ 檻 ============
                var cageX = 500, cageY = h - 180, cageW = 80, cageH = 120;
                var cageBroken = endingPhase >= 2;

                if (!cageBroken) {
                    // 檻の枠
                    ectx.strokeStyle = '#888';
                    ectx.lineWidth = 4;
                    ectx.strokeRect(cageX, cageY, cageW, cageH);
                    // 縦棒
                    for (var bx = cageX + 12; bx < cageX + cageW; bx += 16) {
                        ectx.beginPath();
                        ectx.moveTo(bx, cageY);
                        ectx.lineTo(bx, cageY + cageH);
                        ectx.stroke();
                    }
                    // 横棒
                    ectx.beginPath();
                    ectx.moveTo(cageX, cageY + cageH/2);
                    ectx.lineTo(cageX + cageW, cageY + cageH/2);
                    ectx.stroke();
                }

                // ============ ピーチ ============
                var peachX = cageBroken ? 520 : 540;
                var peachY = cageY + 30;

                // ドレス
                ectx.fillStyle = '#ff69b4';
                ectx.beginPath();
                ectx.moveTo(peachX, peachY + 100);
                ectx.lineTo(peachX - 20, peachY + 100);
                ectx.lineTo(peachX - 12, peachY + 60);
                ectx.lineTo(peachX + 12, peachY + 60);
                ectx.lineTo(peachX + 20, peachY + 100);
                ectx.closePath();
                ectx.fill();

                // 頭
                ectx.fillStyle = '#f7d9b0';
                ectx.beginPath();
                ectx.arc(peachX, peachY + 50, 14, 0, Math.PI * 2);
                ectx.fill();

                // 髪（金）
                ectx.fillStyle = '#ffd700';
                ectx.beginPath();
                ectx.arc(peachX, peachY + 42, 15, Math.PI, Math.PI * 2);
                ectx.fill();
                ectx.fillRect(peachX - 15, peachY + 42, 30, 10);

                // 目
                ectx.fillStyle = '#222';
                ectx.beginPath();
                ectx.arc(peachX - 4, peachY + 50, 1.5, 0, Math.PI * 2);
                ectx.arc(peachX + 4, peachY + 50, 1.5, 0, Math.PI * 2);
                ectx.fill();

                // 王冠
                ectx.fillStyle = '#ffd700';
                ectx.beginPath();
                ectx.moveTo(peachX - 10, peachY + 38);
                ectx.lineTo(peachX - 8, peachY + 30);
                ectx.lineTo(peachX - 3, peachY + 36);
                ectx.lineTo(peachX, peachY + 28);
                ectx.lineTo(peachX + 3, peachY + 36);
                ectx.lineTo(peachX + 8, peachY + 30);
                ectx.lineTo(peachX + 10, peachY + 38);
                ectx.closePath();
                ectx.fill();

                // ============ マリオ ============
                var marioStartX = 100;
                var marioEndX = 460;
                var marioX = marioStartX;
                if (endingPhase >= 1) {
                    var p = Math.min(1, (endingTimer - 90) / 90);
                    marioX = marioStartX + (marioEndX - marioStartX) * p;
                }
                var marioY = h - 160;

                ectx.save();
                ectx.translate(marioX + 15, marioY + 20);

                // 帽子
                ectx.fillStyle = '#e33b3b';
                ectx.fillRect(-14, -22, 28, 12);
                ectx.fillRect(-10, -28, 20, 8);

                // 顔
                ectx.fillStyle = '#f7d9b0';
                ectx.fillRect(-12, -10, 24, 16);

                // 目
                ectx.fillStyle = '#222';
                ectx.fillRect(-6, -6, 4, 4);
                ectx.fillRect(2, -6, 4, 4);

                // 口
                ectx.fillRect(-4, 2, 8, 2);

                // 体
                ectx.fillStyle = '#e33b3b';
                ectx.fillRect(-12, 6, 24, 16);

                // ボタン
                ectx.fillStyle = '#f5c542';
                ectx.fillRect(-6, 12, 3, 3);
                ectx.fillRect(3, 12, 3, 3);

                // 足
                ectx.fillStyle = '#2d2d8a';
                ectx.fillRect(-12, 22, 10, 6);
                ectx.fillRect(2, 22, 10, 6);

                ectx.restore();

                // ============ ハート (フェーズ3以降) ============
                if (endingPhase >= 3) {
                    var heartPulse = 1 + Math.sin(endingTimer * 0.2) * 0.15;
                    ectx.fillStyle = '#ff3366';
                    ectx.save();
                    ectx.translate(marioX + 40, marioY - 20);
                    ectx.scale(heartPulse, heartPulse);
                    ectx.beginPath();
                    ectx.moveTo(0, 5);
                    ectx.bezierCurveTo(-8, -5, -16, 5, 0, 15);
                    ectx.bezierCurveTo(16, 5, 8, -5, 0, 5);
                    ectx.fill();
                    ectx.restore();
                }

                // ============ テキスト (フェーズ4以降) ============
                if (endingPhase >= 4) {
                    ectx.fillStyle = '#ffd700';
                    ectx.font = 'bold 36px "Segoe UI", sans-serif';
                    ectx.textAlign = 'center';
                    ectx.fillText('Thank you Mario!', w/2, 80);
                    ectx.font = 'bold 24px "Segoe UI", sans-serif';
                    ectx.fillStyle = '#fff';
                    ectx.fillText('Your quest is over.', w/2, 120);
                    ectx.textAlign = 'left';
                }

                // フェーズ進行
                if (endingTimer > 90 && endingPhase < 1) endingPhase = 1;
                if (endingTimer > 180 && endingPhase < 2) endingPhase = 2;
                if (endingTimer > 270 && endingPhase < 3) endingPhase = 3;
                if (endingTimer > 360 && endingPhase < 4) endingPhase = 4;

                // フェーズ表示更新
                var phaseNames = [
                    'フェーズ0: ピーチが檻の中',
                    'フェーズ1: マリオが駆け寄る',
                    'フェーズ2: 檻が壊れる',
                    'フェーズ3: ピーチとマリオが抱き合う',
                    'フェーズ4: Thank you Mario!'
                ];
                phaseDisplay.textContent = phaseNames[endingPhase] || '';
            }

            // アニメーションループ
            function loop() {
                updateEnding();
                requestAnimationFrame(loop);
            }

            restartBtn.addEventListener('click', function() {
                endingTimer = 0;
                endingPhase = 0;
            });

            // 開始
            loop();
        })();
    </script>
</body>
</html>
