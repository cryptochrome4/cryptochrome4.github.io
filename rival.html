<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://w3.org" lang="ja" xml:lang="ja">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>wise.html</title>
    <style type="text/css">
        body {
            background-color: #333333; /* 背景を黒っぽく */
            color: #ffffff;            /* 通常の英単語は白 */
            font-family: Arial, sans-serif;
            font-size: 24px;
            padding: 40px;
        }

        /* --------------------------------------------------
           【カラー設定リスト】
           あとから手書きで色を変えるときは、spanタグの中にある
           color: #ffff00; の部分を、以下のいずれかのカラーコードに
           書き換えるだけで自由に変更できます。
           --------------------------------------------------
           ■ 黄色（デフォルト） : #ffff00 (または yellow)
           ■ 茶色             : #8b4513 (または brown)
           ■ 灰色             : #808080 (または gray)
           ■ 黒               : #000000 (または black)
           ■ 赤               : #ff0000 (または red)
           ■ 紫               : #800080 (または purple)
           ■ ピンク           : #ffc0cb (または pink)
           ■ 青               : #0000ff (または blue)
           ■ 水色             : #87ceeb (または skyblue)
           ■ 橙               : #ffa500 (または orange)
           ■ 緑               : #008000 (または green)
           ■ 黄緑             : #7fff00 (または chartreuse)
        -------------------------------------------------- */
    </style>
</head>
<body>

    <!-- この下に、次の質問から長い英文を「単語 10 単語 10」の形に並べて貼り付けていきます -->
    <div id="text-container">On <span style="color: #ffff00;">10</span> the <span style="color: #ffff00;">10</span> fifth <span style="color: #ffff00;">10</span> day</div>

</body>
</html>
