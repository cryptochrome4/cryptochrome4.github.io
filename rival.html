<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>rival.html - 単語評価ツール</title>
<style>
/* ===== 全体 ===== */
body {
    font-family: Georgia, "Times New Roman", serif;
    background-image: url('img151white.jpg');  /* 好きな画像に差し替えてね */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #f0f0f0;
    color: #000000;
    margin: 30px auto;
    padding: 0 20px;
    max-width: 900px;
    line-height: 1.7;
    font-size: 16px;
}

h1 {
    font-size: 28px;
    font-weight: normal;
    border-bottom: 2px solid #ccc;
    padding-bottom: 10px;
    text-align: center;
    background: rgba(255,255,255,0.7);
    display: inline-block;
    padding: 10px 20px;
    border-radius: 8px;
}

/* ===== 段落（白枠なし・透明） ===== */
#textContainer p {
    padding: 4px 0;
    margin: 8px 0;
    line-height: 2.4;
    word-wrap: break-word;
    background: transparent;
    border: none;
    box-shadow: none;
}

/* ===== 各単語 ===== */
.word-span {
    display: inline-block;
    position: relative;
    margin: 2px 0;
    padding: 1px 2px;
    color: #000000;
    background: transparent;
    border-radius: 2px;
}

.word-span:hover {
    background: rgba(200,200,200,0.3);
}

/* ===== ▼ボタン ===== */
.btn-eval {
    display: inline-block;
    font-size: 12px;
    padding: 1px 6px 2px 6px;
    margin-left: 3px;
    margin-right: 2px;
    border: 1px solid #999;
    background: rgba(255,255,255,0.7);
    color: #333;
    cursor: pointer;
    border-radius: 3px;
    vertical-align: middle;
    font-family: sans-serif;
    user-select: none;
}

.btn-eval:hover {
    background: rgba(200,200,200,0.7);
}

/* ===== 選択結果（単語の真横・赤文字） ===== */
.eval-result {
    display: inline-block;
    font-size: 13px;
    font-weight: bold;
    color: #ff0000;
    margin-left: 4px;
    padding: 0 4px;
    vertical-align: middle;
    min-width: 60px;
    background: rgba(255,255,255,0.5);
    border-radius: 3px;
}

/* ===== ポップアップ ===== */
.eval-popup {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 999;
    background: #ffffff;
    border: 2px solid #888;
    border-radius: 6px;
    padding: 8px 6px;
    min-width: 140px;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.25);
}

.eval-popup.show {
    display: block;
}

.eval-popup .eval-item {
    display: block;
    margin: 3px 0;
    padding: 2px 4px;
    font-size: 13px;
    font-family: sans-serif;
    white-space: nowrap;
    cursor: pointer;
    border-radius: 3px;
    color: #ff0000;
    font-weight: bold;
}

.eval-popup .eval-item:hover {
    background: #ffeeee;
}

.eval-popup .eval-item input[type="radio"] {
    margin-right: 6px;
    vertical-align: middle;
    cursor: pointer;
}

.eval-popup .eval-item label {
    cursor: pointer;
    color: #ff0000;
    vertical-align: middle;
}

/* ===== ステータスバー ===== */
#statusBar {
    margin-top: 20px;
    padding: 10px;
    background: rgba(255,255,255,0.7);
    border: 1px solid #ccc;
    font-size: 14px;
    text-align: center;
    border-radius: 4px;
}

/* ===== リセットボタン ===== */
#controlPanel {
    margin: 20px 0 10px 0;
    padding: 12px;
    background: rgba(255,255,255,0.7);
    border: 2px solid #cc0000;
    border-radius: 6px;
    text-align: center;
}

#controlPanel button {
    padding: 8px 30px;
    background: #ffffff;
    border: 2px solid #cc0000;
    border-radius: 4px;
    color: #cc0000;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.1s;
}

#controlPanel button:hover {
    background: #cc0000;
    color: #ffffff;
}

/* ===== リセット確認ポップアップ ===== */
#resetConfirmOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
}

#resetConfirmBox {
    background: #ffffff;
    padding: 30px 40px;
    border-radius: 10px;
    border: 3px solid #cc0000;
    max-width: 500px;
    text-align: center;
}

#resetConfirmBox p {
    font-size: 18px;
    margin-bottom: 20px;
}

#resetConfirmBox .reset-btn-yes {
    background: #cc0000;
    color: #fff;
    border: none;
    padding: 10px 30px;
    margin: 5px 10px;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

#resetConfirmBox .reset-btn-no {
    background: #888;
    color: #fff;
    border: none;
    padding: 10px 30px;
    margin: 5px 10px;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

#resetConfirmBox .reset-btn-yes:hover {
    background: #990000;
}
#resetConfirmBox .reset-btn-no:hover {
    background: #666;
}
</style>
</head>
<body>

<h1>Einstein's Thought Experiment</h1>
<div id="textContainer"></div>

<script>
// ============================================================
// 英文データ
// ============================================================
var englishText = 
"Einstein's Thought Experiment\n" +
"\n" +
"On the fifth day of the fifth Solvay Conference, Chairman Lorentz proposed a discussion theme: \"What causes the phenomena of the quantum world?\" and \"Can we elevate the probabilistic, indeterministic interpretations to the level of theory?\" Lorentz pointed to Bohr as a speaker on this theme.\n" +
"\n" +
"To summarize Bohr's statement, he believed that the world consists of contradictory and exclusive elements that complement each other. The duality of particles and waves, the uncertainty principle concerning position and momentum, and even the determinism of classical mechanics versus the probabilistic nature of quantum mechanics were not contradictions for Bohr; rather, they were fundamental properties of the universe. He referred to this as complementarity, asserting that it applies to quantum mechanics as well. Bohr's view of quantum theory, which includes both scientific and philosophical aspects of complementarity, is considered an upgrade to the Copenhagen interpretation. According to him, it is only through the act of observation that the wave of possibilities transitions into a particle that actually exists. In quantum mechanics, matter does not exist until it is observed. Therefore, discussions about a non-existent quantum world are meaningless in themselves.\n" +
"\n" +
"In response to Bohr's statements, Einstein illustrated his counterarguments on the blackboard with a thought experiment. He described an opaque board with a single slit and a semicircular fluorescent screen behind it. When electrons are directed at the board, some pass through the slit and strike the fluorescent screen, leaving traces. As the electrons pass through the slit, they diffract like waves, spreading uniformly towards the semicircular screen. This behavior of electrons is governed by the Schrödinger wave equation and described as a wave function, which is the current understanding in quantum mechanics. This theory excellently describes the collective behavior of electrons. If the calculation shows that 100 electrons should strike the fluorescent screen per unit area, then 100 electrons will indeed be observed striking the screen, but this is only the average value over sufficient trials.\n" +
"\n" +
"Now, consider the case of sending a single electron through the slit. In this scenario, quantum mechanics predicts that the wave function spreads uniformly and that the electron will strike the screen with equal probability at any point. This prediction is extremely accurate and contains no erroneous elements; however, it merely indicates probabilities and does not provide sufficient predictions, as there is nothing to specify where the electron will strike.\n" +
"\n" +
"Let’s think further: at the moment an electron is detected at a specific point on the screen, what happens to the wave function? The wave function of the single electron, which was initially spread uniformly across the screen, must instantaneously vanish at all locations except the collision point. Otherwise, there could be a possibility of detecting a second electron in a location where the wave function remains, even though the first electron was detected. The wave function must disappear instantly, regardless of how far it had spread. This eerie action at a distance seems to contradict the theory of relativity.\n" +
"\n" +
"In other words, Einstein used the probabilistic elements inherent in current quantum mechanics to suggest its incompleteness as a theory to describe the world. This issue relates to the reality of matter and may have implications for the entire universe. Even knowing that they may never reach the truth despite extensive discussions, Einstein could not ignore this problem. His assertion that \"God does not play dice\" was a significant point of contention with the probabilistic interpretation central to the Copenhagen interpretation.\n" +
"\n" +
"However, Einstein did not intend to debate this point; his focus was on locality. Locality is one of the fundamental properties of the world, meaning that an event occurring at one location cannot instantaneously affect another location. In light of the theory of relativity, this implies that no influence can exceed the speed of light. The term \"local realism,\" which refers to both locality and reality, is often used in discussions. From the beginning of the EB debate, which is said to have started at this Solvay Conference, Einstein aimed to focus on the issue of locality.\n" +
"\n" +
"Through his thought experiment, Einstein wanted to convey that the quantum mechanics of Bohr and the Copenhagen school contradict his theory of relativity. However, Bohr did not grasp Einstein's counterarguments. While Einstein pointed out the contradictions between quantum mechanics and relativity, he did not specify what needed to be done next, such as suggesting that current quantum mechanics is still incomplete and requires modifications or that a unified theory integrating quantum mechanics and relativity is necessary.\n" +
"\n" +
"On the other hand, Bohr believed that things that cannot be observed do not exist. The wave function and probabilistic interpretations are merely computational tools. He claimed that he did not understand what quantum mechanics truly is; he only knew a mathematical method for effectively describing phenomena. This perspective excluded discussions about the very reality of the quantum world, which likely contributed to the disconnect in their debate.\n" +
"\n" +
"In summary, outside the conference, Bohr and Einstein's discussions revealed that Bohr considered the interactions when electrons pass through the slit, incorporating the ambiguity of measurements according to the uncertainty principle, which he used to find flaws in Einstein's thought experiment. Conversely, Einstein pointed out the contradiction in Bohr's application of the uncertainty principle, which applies to microscopic entities, to macroscopic experimental apparatus, effectively countering Bohr's arguments.";

// ============================================================
// 評価ラベル
// ============================================================
var evalLabels = [
    "超下がり", "強下がり", "中下がり", "弱下がり",
    "下傾きの横ばい", "横ばい", "上傾きの横ばい",
    "弱上がり", "中上がり", "強上がり", "超上がり"
];

// ============================================================
// localStorage
// ============================================================
var STORAGE_KEY = 'rival_evaluations';

function loadFromStorage() {
    try {
        var data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : null;
    } catch(e) { return null; }
}

function saveToStorage(data) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {}
}

function clearStorage() {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

// ============================================================
// ユーティリティ
// ============================================================
function splitIntoParagraphs(text) {
    return text.split(/\n\s*\n/);
}

function splitIntoWords(paragraph) {
    return paragraph.split(/\s+/).filter(function(w) { return w.length > 0; });
}

function closeAllPopups() {
    var popups = document.querySelectorAll('.eval-popup');
    for (var i = 0; i < popups.length; i++) {
        popups[i].classList.remove('show');
    }
}

// ============================================================
// ポップアップ生成
// ============================================================
function createPopupHTML(wordIndex) {
    var html = '<div class="eval-popup" data-word-index="' + wordIndex + '">';
    for (var i = 0; i < evalLabels.length; i++) {
        var label = evalLabels[i];
        var id = 'eval_' + wordIndex + '_' + i;
        html += '<div class="eval-item">';
        html += '<input type="radio" name="eval_' + wordIndex + '" id="' + id + '" value="' + label + '">';
        html += '<label for="' + id + '">' + label + '</label>';
        html += '</div>';
    }
    html += '</div>';
    return html;
}

// ============================================================
// 結果表示更新
// ============================================================
function updateResultDisplay(wordIndex, value) {
    var resultSpan = document.querySelector('.eval-result[data-word-index="' + wordIndex + '"]');
    if (resultSpan) {
        resultSpan.textContent = value || '';
    }
}

// ============================================================
// メイン描画
// ============================================================
var selectedValues = {};

function renderText() {
    var container = document.getElementById('textContainer');
    container.innerHTML = '';

    var saved = loadFromStorage();
    if (saved) {
        for (var key in saved) {
            if (saved.hasOwnProperty(key)) {
                selectedValues[key] = saved[key];
            }
        }
    }

    var paragraphs = splitIntoParagraphs(englishText);
    var globalIndex = 0;

    for (var p = 0; p < paragraphs.length; p++) {
        var paraText = paragraphs[p];
        if (paraText.trim() === '') continue;

        var words = splitIntoWords(paraText);
        var pElem = document.createElement('p');

        for (var w = 0; w < words.length; w++) {
            var word = words[w];
            var idx = globalIndex;

            var wordSpan = document.createElement('span');
            wordSpan.className = 'word-span';
            wordSpan.setAttribute('data-word-index', idx);
            wordSpan.textContent = word;

            var btn = document.createElement('span');
            btn.className = 'btn-eval';
            btn.textContent = '▼';
            btn.setAttribute('data-word-index', idx);

            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                var i = parseInt(this.getAttribute('data-word-index'), 10);
                var popup = document.querySelector('.eval-popup[data-word-index="' + i + '"]');
                if (popup) {
                    closeAllPopups();
                    popup.classList.toggle('show');
                }
            });

            var resultSpan = document.createElement('span');
            resultSpan.className = 'eval-result';
            resultSpan.setAttribute('data-word-index', idx);
            if (selectedValues[idx]) {
                resultSpan.textContent = selectedValues[idx];
            }

            var popupHTML = createPopupHTML(idx);
            var temp = document.createElement('div');
            temp.innerHTML = popupHTML;
            var popupElem = temp.firstChild;

            var radios = popupElem.querySelectorAll('input[type="radio"]');
            for (var r = 0; r < radios.length; r++) {
                radios[r].addEventListener('change', function(e) {
                    var i = parseInt(this.name.replace('eval_', ''), 10);
                    var val = this.value;
                    selectedValues[i] = val;
                    saveToStorage(selectedValues);
                    updateResultDisplay(i, val);
                    var pop = this.closest('.eval-popup');
                    if (pop) pop.classList.remove('show');
                    updateStatus();
                });
            }

            if (selectedValues[idx]) {
                for (var r2 = 0; r2 < radios.length; r2++) {
                    if (radios[r2].value === selectedValues[idx]) {
                        radios[r2].checked = true;
                        break;
                    }
                }
            }

            wordSpan.appendChild(popupElem);
            pElem.appendChild(wordSpan);
            pElem.appendChild(btn);
            pElem.appendChild(resultSpan);
            if (w < words.length - 1) {
                pElem.appendChild(document.createTextNode(' '));
            }

            globalIndex++;
        }

        container.appendChild(pElem);
    }

    var statusBar = document.createElement('div');
    statusBar.id = 'statusBar';
    var total = Object.keys(selectedValues).length;
    statusBar.textContent = '評価済み単語: ' + total + ' / ' + globalIndex;
    container.appendChild(statusBar);

    var panel = document.createElement('div');
    panel.id = 'controlPanel';
    var resetBtn = document.createElement('button');
    resetBtn.textContent = '🔄 リセット（4段階確認）';
    resetBtn.addEventListener('click', showResetConfirm);
    panel.appendChild(resetBtn);
    container.insertBefore(panel, container.firstChild);

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.eval-popup') && !e.target.closest('.btn-eval')) {
            closeAllPopups();
        }
    });
}

// ============================================================
// ステータス更新
// ============================================================
function updateStatus() {
    var total = Object.keys(selectedValues).length;
    var allWords = document.querySelectorAll('.word-span');
    var statusBar = document.getElementById('statusBar');
    if (statusBar) {
        statusBar.textContent = '評価済み単語: ' + total + ' / ' + allWords.length;
    }
}

// ============================================================
// リセット（4段階）
// ============================================================
var resetStep = 0;
var resetMessages = [
    '',
    '本当にリセットしますか？\n（この操作は元に戻せません）',
    '本当に本当にリセットしますか？\n（もう一度確認します）',
    '最終確認です。リセットしますか？\n（あと2回で実行されます）',
    '最後の確認です。よろしいですか？\n（本当に実行しますか？）'
];

function executeReset() {
    selectedValues = {};
    clearStorage();

    var radios = document.querySelectorAll('.eval-popup input[type="radio"]');
    for (var i = 0; i < radios.length; i++) {
        radios[i].checked = false;
    }

    var results = document.querySelectorAll('.eval-result');
    for (var k = 0; k < results.length; k++) {
        results[k].textContent = '';
    }

    resetStep = 0;
    updateStatus();
    alert('全ての評価をリセットしました。');
}

function showResetConfirm() {
    if (resetStep === 0) resetStep = 1;
    if (resetStep > 4) {
        executeReset();
        return;
    }

    var old = document.getElementById('resetConfirmOverlay');
    if (old) old.parentNode.removeChild(old);

    var overlay = document.createElement('div');
    overlay.id = 'resetConfirmOverlay';

    var box = document.createElement('div');
    box.id = 'resetConfirmBox';

    var msg = document.createElement('p');
    msg.textContent = resetMessages[resetStep];
    box.appendChild(msg);

    var stepInfo = document.createElement('div');
    stepInfo.textContent = '確認 ' + resetStep + ' / 4';
    stepInfo.style.cssText = 'font-size:14px;color:#888;margin-bottom:20px;';
    box.appendChild(stepInfo);

    var btnGroup = document.createElement('div');
    btnGroup.style.cssText = 'display:flex;justify-content:center;gap:15px;';

    var yesBtn = document.createElement('button');
    yesBtn.textContent = 'はい';
    yesBtn.className = 'reset-btn-yes';
    yesBtn.addEventListener('click', function() {
        resetStep++;
        document.body.removeChild(overlay);
        showResetConfirm();
    });

    var noBtn = document.createElement('button');
    noBtn.textContent = 'いいえ（中止）';
    noBtn.className = 'reset-btn-no';
    noBtn.addEventListener('click', function() {
        resetStep = 0;
        document.body.removeChild(overlay);
        alert('リセットを中止しました。');
    });

    btnGroup.appendChild(yesBtn);
    btnGroup.appendChild(noBtn);
    box.appendChild(btnGroup);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
            resetStep = 0;
            document.body.removeChild(overlay);
            alert('リセットを中止しました。');
        }
    });
}

// ============================================================
// 起動
// ============================================================
window.addEventListener('DOMContentLoaded', renderText);
</script>

</body>
</html>
