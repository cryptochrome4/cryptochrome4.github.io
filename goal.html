<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギリシャ証券 サッカー版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root {
    --sand: #f0ece0;
    --sand-dark: #e0d8c4;
    --sand-deep: #c8bca0;
    --stone: #6a6a6a;
    --stone-dark: #3a3a3a;
    --stone-light: #9a9a9a;
    --moss: #5a7a4a;
    --moss-dark: #3a5a2a;
    --moss-light: #8aaa6a;
    --ink: #2a2a2a;
    --ink-soft: #5a5a5a;
    --line: #b8ac90;
    --sun: #b08d3f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Zen Kaku Gothic New', 'Shippori Mincho', serif;
    background: var(--sand);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  body {
    overflow-x: hidden;
    overflow-y: auto;
    background-image:
      /* 砂紋：横に流れる曲線 */
      repeating-radial-gradient(ellipse at 50% 0%,
        transparent 0px, transparent 20px,
        rgba(180,170,140,0.15) 20px, rgba(180,170,140,0.15) 22px),
      repeating-radial-gradient(ellipse at 50% 100%,
        transparent 0px, transparent 24px,
        rgba(180,170,140,0.12) 24px, rgba(180,170,140,0.12) 26px),
      /* 砂の粒 */
      radial-gradient(circle at 20% 30%, rgba(200,190,160,0.3), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(200,190,160,0.25), transparent 45%);
  }

  .goal-wrap {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 100vh;
  }

  /* ============================================================
     枯山水風ボタン
     ============================================================ */
  button {
    font-family: inherit;
    cursor: pointer;
    background: var(--sand);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 14px;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    transition: all 0.15s;
    box-shadow: 2px 2px 4px rgba(120,110,80,0.15), -1px -1px 2px rgba(255,255,255,0.6);
  }
  button:hover {
    background: var(--moss);
    color: var(--sand);
    border-color: var(--moss-dark);
  }
  button:active {
    box-shadow: inset 2px 2px 4px rgba(80,70,40,0.25), inset -1px -1px 2px rgba(255,255,255,0.4);
  }

  /* ============================================================
     HEADER（墨・砂・苔）
     ============================================================ */
  .zone-header {
    background: var(--sand);
    border-bottom: 2px solid var(--stone-dark);
    color: var(--ink);
    position: relative;
  }
  /* 障子のような細い罫線 */
  .zone-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(90deg,
      var(--stone-dark) 0px, var(--stone-dark) 2px,
      transparent 2px, transparent 20px);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 12px;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid var(--line);
  }

  .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h1.site-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--ink);
    text-shadow: 1px 1px 0 rgba(255,255,255,0.8), 2px 2px 4px rgba(120,110,80,0.2);
    border-bottom: 1px solid var(--stone-dark);
    padding-bottom: 4px;
  }

  .menu-btn {
    background: var(--sand);
    color: var(--ink);
    border: 1px solid var(--stone-dark);
    width: 42px;
    height: 42px;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
  }

  .header-links {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .header-links button {
    background: var(--sand);
    font-size: 0.72rem;
    padding: 5px 10px;
  }

  .menu-panel {
    display: none;
    background: var(--sand-dark);
    color: var(--ink);
    border-bottom: 2px solid var(--moss);
    padding: 10px 20px;
  }
  .menu-panel.open { display: block; }
  .menu-panel > button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 10px 6px;
    background: transparent;
    box-shadow: none;
    font-size: 0.85rem;
    color: var(--ink);
  }
  .menu-panel > button:hover { background: var(--moss-light); color: var(--ink); padding-left: 14px; }

  .service-sub {
    display: none;
    border-left: 2px solid var(--moss);
    padding-left: 12px;
    margin: 6px 0;
    background: rgba(90,122,74,0.06);
  }
  .service-sub.open { display: block; }
  .service-sub h4 {
    font-size: 0.68rem;
    color: var(--moss-dark);
    letter-spacing: 0.2em;
    margin: 10px 0 4px;
    font-weight: 700;
  }
  .service-sub button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    padding: 6px 4px;
    background: transparent;
    box-shadow: none;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }

  .nav-primary {
    display: flex;
    gap: 6px;
    padding: 10px 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .nav-primary button {
    background: var(--sand);
    font-size: 0.75rem;
  }

  .nav-secondary {
    display: flex;
    gap: 6px;
    padding: 10px 20px;
    flex-wrap: wrap;
    position: relative;
  }
  .nav-secondary button {
    background: var(--sand);
    font-size: 0.72rem;
  }

  .other-sub {
    display: none;
    position: absolute;
    top: 100%;
    left: 20px;
    background: var(--sand);
    border: 1px solid var(--stone-dark);
    border-radius: 2px;
    z-index: 100;
    min-width: 240px;
    padding: 6px 0;
    box-shadow: 3px 3px 8px rgba(120,110,80,0.25);
  }
  .other-sub.open { display: block; }
  .other-sub button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
    padding: 8px 14px;
    background: transparent;
    box-shadow: none;
    color: var(--ink);
  }
  .other-sub button:hover { background: var(--moss-light); }
  .other-sub button:last-child { border-bottom: none; }

  .product-select {
    position: relative;
    display: inline-flex;
    align-items: stretch;
  }
  .product-label { border-radius: 2px 0 0 2px; border-right: none; }
  .product-arrow { padding: 7px 10px; font-size: 0.7rem; border-radius: 0 2px 2px 0; }
  .product-options {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--sand);
    border: 1px solid var(--stone-dark);
    border-radius: 2px;
    z-index: 150;
    min-width: 180px;
    box-shadow: 3px 3px 8px rgba(120,110,80,0.25);
  }
  .product-options.open { display: block; }
  .product-options button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    box-shadow: none;
    color: var(--ink);
  }
  .product-options button:last-child { border-bottom: none; }

  /* ============================================================
     GOAL MENU ROW（砂紋の上に並ぶ石）
     ============================================================ */
  .goal-menu-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 14px 20px;
    background: var(--sand-dark);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .goal-menu-row button {
    background: var(--sand);
    border: 1px solid var(--stone-dark);
    font-size: 0.75rem;
    padding: 7px 14px;
    border-radius: 50px;
  }
  .goal-menu-row button:hover {
    background: var(--stone-dark);
    color: var(--sand);
  }

  .goal-time-row {
    display: flex;
    justify-content: flex-end;
    padding: 10px 20px 14px;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--ink-soft);
    font-family: 'Shippori Mincho', serif;
    background: var(--sand-dark);
    border-bottom: 2px solid var(--moss);
    cursor: pointer;
  }
  .goal-time-row:hover { color: var(--moss-dark); }

  /* ============================================================
     MIDDLE
     ============================================================ */
  .zone-middle {
    display: flex;
    flex-direction: row;
    border-top: 2px solid var(--stone-dark);
    border-bottom: 2px solid var(--stone-dark);
  }

  .zone-left {
    flex: 0 0 auto;
    width: 320px;
    background: var(--sand-dark);
    border-right: 2px solid var(--moss);
    padding: 16px 0;
    position: relative;
  }
  /* 石の配置 */
  .zone-left::before {
    content: '';
    position: absolute;
    top: 30px;
    left: 12px;
    width: 24px;
    height: 24px;
    background: var(--stone);
    border-radius: 50% 45% 55% 40%;
    box-shadow: inset -3px -3px 6px rgba(0,0,0,0.25), 2px 2px 4px rgba(120,110,80,0.4);
    opacity: 0.35;
  }

  .sidebar-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--ink);
    padding: 8px 18px 14px;
    border-bottom: 2px solid var(--moss);
    font-weight: 700;
    cursor: pointer;
  }
  .sidebar-title:hover { color: var(--moss-dark); }

  .sidebar-label {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--ink);
    padding: 16px 18px 14px;
    border-bottom: 2px solid var(--moss);
    font-weight: 700;
    cursor: pointer;
  }
  .sidebar-label:hover { color: var(--moss-dark); }

  .cat {
    border-bottom: 1px solid var(--line);
  }
  .cat-header {
    display: flex;
    align-items: center;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 12px 18px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink);
    text-align: left;
    box-shadow: none;
    position: relative;
    font-family: 'Shippori Mincho', serif;
    letter-spacing: 0.05em;
  }
  .cat-header::before {
    content: '◇';
    font-size: 0.9rem;
    color: var(--moss);
    margin-right: 10px;
    font-weight: 700;
  }
  .cat.open .cat-header::before { content: '◆'; color: var(--moss-dark); }
  .cat-header:hover { background: var(--sand); }

  .cat-items { display: none; background: var(--sand); }
  .cat.open .cat-items { display: block; }

  .cat-items button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
    padding: 9px 18px 9px 36px;
    font-size: 0.75rem;
    color: var(--ink-soft);
    background: transparent;
    box-shadow: none;
    position: relative;
    letter-spacing: 0.02em;
  }
  .cat-items button::before {
    content: '·';
    position: absolute;
    left: 20px;
    color: var(--moss);
    font-size: 1.2rem;
    line-height: 1;
    top: 50%;
    transform: translateY(-50%);
  }
  .cat-items button:hover {
    background: var(--moss-light);
    color: var(--ink);
  }

  .cat-items button.marker-blue {
    background: var(--moss);
    color: var(--sand);
    font-weight: 700;
  }
  .cat-items button.marker-blue::before { color: var(--sand); }
  .cat-items button.marker-blue:hover { background: var(--moss-dark); }

  .zone-center {
    flex: 1 1 auto;
    background: var(--sand);
    padding: 24px;
    min-width: 0;
    position: relative;
  }
  /* 大きな石 */
  .zone-center::before {
    content: '';
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 60px;
    height: 50px;
    background: var(--stone);
    border-radius: 50% 45% 55% 40%;
    box-shadow: inset -4px -4px 10px rgba(0,0,0,0.3), 3px 3px 8px rgba(120,110,80,0.4);
    opacity: 0.2;
    pointer-events: none;
  }

  .c-container { max-width: 1100px; margin: 0 auto; }

  .order-top-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .order-top-bar button { font-size: 0.75rem; }

  .quote-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .quote-row button { font-size: 0.75rem; }

  .user-name {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 16px;
    padding: 10px 14px;
    background: var(--sand-dark);
    border-left: 3px solid var(--moss);
    border-radius: 0 2px 2px 0;
    letter-spacing: 0.1em;
  }
  .user-name strong { color: var(--moss-dark); }

  .order-form {
    background: var(--sand);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 20px;
    box-shadow: 4px 4px 10px rgba(120,110,80,0.15), -2px -2px 6px rgba(255,255,255,0.7);
  }

  .form-section {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .form-section:last-child { border-bottom: none; }

  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
  }
  .form-row:last-child { margin-bottom: 0; }

  .form-label {
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--moss-dark);
    min-width: 90px;
    letter-spacing: 0.08em;
  }

  .radio-group {
    display: inline-flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .radio-group label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 700;
  }
  .radio-group input[type="radio"] {
    accent-color: var(--moss);
    width: 16px;
    height: 16px;
  }

  .text-input {
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--ink);
    background: #fff;
    min-width: 100px;
    outline: none;
    box-shadow: inset 1px 1px 3px rgba(120,110,80,0.15);
  }
  .text-input:focus {
    border-color: var(--moss);
    box-shadow: inset 1px 1px 3px rgba(120,110,80,0.15), 0 0 0 2px rgba(90,122,74,0.2);
  }

  .cond-select {
    position: relative;
    display: inline-flex;
    align-items: stretch;
  }
  .cond-label {
    background: var(--sand);
    border: 1px solid var(--line);
    border-right: none;
    border-radius: 2px 0 0 2px;
    padding: 6px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .cond-arrow {
    background: var(--sand);
    border: 1px solid var(--line);
    border-radius: 0 2px 2px 0;
    padding: 6px 8px;
    font-size: 0.7rem;
    box-shadow: none;
  }
  .cond-arrow:hover { background: var(--moss-light); }
  .cond-options {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--sand);
    border: 1px solid var(--stone-dark);
    border-radius: 2px;
    z-index: 200;
    min-width: 140px;
    box-shadow: 3px 3px 8px rgba(120,110,80,0.25);
  }
  .cond-options.open { display: block; }
  .cond-options button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
    padding: 7px 12px;
    background: transparent;
    box-shadow: none;
    font-size: 0.75rem;
    color: var(--ink);
  }
  .cond-options button:hover { background: var(--moss-light); }
  .cond-options button:last-child { border-bottom: none; }

  .market-select {
    position: relative;
    display: inline-flex;
    align-items: stretch;
  }
  .market-label {
    background: var(--sand);
    border: 1px solid var(--line);
    border-right: none;
    border-radius: 2px 0 0 2px;
    padding: 6px 10px;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .market-arrow {
    background: var(--sand);
    border: 1px solid var(--line);
    border-radius: 0 2px 2px 0;
    padding: 6px 8px;
    font-size: 0.7rem;
    box-shadow: none;
  }
  .market-arrow:hover { background: var(--moss-light); }
  .market-options {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--sand);
    border: 1px solid var(--stone-dark);
    border-radius: 2px;
    z-index: 200;
    min-width: 180px;
    box-shadow: 3px 3px 8px rgba(120,110,80,0.25);
  }
  .market-options.open { display: block; }
  .market-options button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
    padding: 7px 12px;
    background: transparent;
    box-shadow: none;
    font-size: 0.75rem;
    color: var(--ink);
  }
  .market-options button:hover { background: var(--moss-light); }
  .market-options button:last-child { border-bottom: none; }

  .period-select {
    position: relative;
    display: inline-flex;
    align-items: stretch;
  }
  .period-label {
    background: var(--sand);
    border: 1px solid var(--line);
    border-right: none;
    border-radius: 2px 0 0 2px;
    padding: 6px 10px;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .period-arrow {
    background: var(--sand);
    border: 1px solid var(--line);
    border-radius: 0 2px 2px 0;
    padding: 6px 8px;
    font-size: 0.7rem;
    box-shadow: none;
  }
  .period-arrow:hover { background: var(--moss-light); }
  .period-options {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--sand);
    border: 1px solid var(--stone-dark);
    border-radius: 2px;
    z-index: 200;
    min-width: 160px;
    box-shadow: 3px 3px 8px rgba(120,110,80,0.25);
  }
  .period-options.open { display: block; }
  .period-options button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
    padding: 7px 12px;
    background: transparent;
    box-shadow: none;
    font-size: 0.75rem;
    color: var(--ink);
  }
  .period-options button:hover { background: var(--moss-light); }
  .period-options button:last-child { border-bottom: none; }

  .caution-box {
    background: rgba(90,122,74,0.12);
    border: 1px solid var(--moss);
    border-radius: 2px;
    padding: 12px;
    font-size: 0.78rem;
    margin: 14px 0;
    line-height: 1.6;
    color: var(--ink);
  }
  .caution-box strong { color: var(--moss-dark); }

  .password-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .order-confirm-btn {
    background: var(--moss);
    color: var(--sand);
    border: 1px solid var(--moss-dark);
    font-size: 0.9rem;
    padding: 10px 22px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }
  .order-confirm-btn:hover { background: var(--moss-dark); color: var(--sand); }

  .skip-confirm {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    cursor: pointer;
    font-weight: 700;
  }
  .skip-confirm input {
    accent-color: var(--moss);
    width: 16px;
    height: 16px;
  }

  /* ============================================================
     FOOTER（苔の庭）
     ============================================================ */
  .zone-footer {
    background: var(--moss-dark);
    border-top: 2px solid var(--stone-dark);
    padding: 30px 20px;
    color: var(--sand);
    position: relative;
  }
  .zone-footer::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(90deg,
      var(--sand) 0px, var(--sand) 2px,
      transparent 2px, transparent 20px);
  }

  .footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding-top: 10px;
  }

  .section-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.15rem;
    letter-spacing: 0.2em;
    color: var(--sand);
    margin-bottom: 14px;
    font-weight: 700;
  }
  .section-title::before { content: '◦ '; color: var(--moss-light); }

  .contact-grid {
    display: grid;

  .manzai-actor {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s;
  }
  .manzai-actor.speaking {
    transform: translateY(-10px) scale(1.08);
  }

  .actor-body { position: relative; width: 100px; height: 140px; }

  .actor-head {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 70px;
    background: #e8e4d8;
    border: 4px solid #000;
    border-radius: 4px;
  }

  .actor-head .eye {
    position: absolute;
    top: 22px;
    width: 8px;
    height: 8px;
    background: #000;
    border-radius: 0;
  }
  .actor-head .eye.left { left: 14px; }
  .actor-head .eye.right { right: 14px; }

  .actor-head .mouth {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 4px;
    background: #000;
  }
  .manzai-actor.speaking .actor-head .mouth {
    height: 12px;
    width: 20px;
    border-radius: 0;
  }

  .actor-torso {
    position: absolute;
    top: 66px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 70px;
    border: 4px solid #000;
    border-radius: 4px;
  }

  .actor-name {

    color: #fff;
    background: #000;
    padding: 4px 14px;

    line-height: 1.6;

  .manzai-progress {

          <div class="form-section">

              <span class="form-label">作戦期間:</span>
              <div class="radio-group">
                <label><input type="radio" name="period" checked> 今日の試合だけ</label>

              <div class="period-select">
                <button class="period-label" id="periodLabel">26/10/08</button>

          <div class="form-section">
            <div class="form-row" style="align-items:flex-start;">
              <span class="form-label">契約形態:</span>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <label style="display:inline-flex;align-items:center;gap:5px;font-size:0.82rem;cursor:pointer;">
                  <input type="radio" name="account-type" checked style="accent-color:var(--moss);width:16px;height:16px;"> クラブが税金処理まで面倒を見る
                </label>
                <label style="display:inline-flex;align-items:center;gap:5px;font-size:0.82rem;cursor:pointer;">
                  <input type="radio" name="account-type" style="accent-color:var(--moss);width:16px;height:16px;"> 自分で確定申告する
                </label>
                <label style="display:inline-flex;align-items:center;gap:5px;font-size:0.82rem;cursor:pointer;">
                  <input type="radio" name="account-type" style="accent-color:var(--moss);width:16px;height:16px;"> 特別ルール枠での保有
                </label>
                <label style="display:inline-flex;align-items:center;gap:5px;font-size:0.82rem;cursor:pointer;">
                  <input type="radio" name="account-type" style="accent-color:var(--moss);width:16px;height:16px;"> 昔の特別ルール枠での保有
                </label>

            </div>

          <div class="caution-box">
            試合前に<strong>注意事項</strong>を必ず確認してください。<br>
            ⚠ 複数会場対象の選手については、複数会場での試合に関する注意事項を必ず確認してください。
          </div>

          <div class="password-row">
            <span class="form-label">入場パス:</span>
            <input type="password" class="text-input" placeholder="----" style="width:160px;">

              <input type="checkbox"> 確認を省いて直接プレーする

  <!-- ============================================================

       ============================================================ -->

    <div class="footer-inner">
      <h2 class="section-title">お問合せ</h2>

        <button class="link-btn">試合の注意事項</button>
        <button class="link-btn">クラブ成績公表</button>
        <button class="link-btn">試合のルールブック</button>
        <button class="link-btn">ピッチ整備のお知らせ</button>
        <button class="link-btn">アクシデントへの備え</button>
        <button class="link-btn">アクシデント対応</button>

        ⚽ ギリシャ証券 サッカー版 — 枯山水リファレンス

</div>

<script>
  /* ============================================================
     UI制御
     ============================================================ */
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuPanel.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
      menuPanel.classList.remove('open');
    }
  });

  const serviceToggle = document.getElementById('serviceToggle');
  const serviceSub = document.getElementById('serviceSub');
  serviceToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    serviceSub.classList.toggle('open');
    serviceToggle.textContent = serviceSub.classList.contains('open') ? 'クラブサービス ▾' : 'クラブサービス ▸';
  });

  const otherToggle = document.getElementById('otherToggle');
  const otherSub = document.getElementById('otherSub');
  otherToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    otherSub.classList.toggle('open');
    otherToggle.textContent = otherSub.classList.contains('open') ? 'その他のポジション ▴' : 'その他のポジション ▾';
  });
  document.addEventListener('click', (e) => {
    if (!otherSub.contains(e.target) && e.target !== otherToggle) {
      otherSub.classList.remove('open');
      otherToggle.textContent = 'その他のポジション ▾';
    }
  });

  const productLabel = document.getElementById('productLabel');
  const productToggle = document.getElementById('productToggle');
  const productOptions = document.getElementById('productOptions');
  productToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    productOptions.classList.toggle('open');
  });
  productOptions.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      productLabel.textContent = btn.dataset.product;
      productOptions.classList.remove('open');
    });
  });
  document.addEventListener('click', (e) => {
    if (!productOptions.contains(e.target) && e.target !== productToggle) {
      productOptions.classList.remove('open');
    }
  });

  document.querySelectorAll('.cat[data-cat]').forEach(cat => {
    const header = cat.querySelector('.cat-header');
    header.addEventListener('click', (e) => {
      e.stopPropagation();
      cat.classList.toggle('open');
    });
  });

  const marketLabel = document.getElementById('marketLabel');
  const marketToggle = document.getElementById('marketToggle');
  const marketOptions = document.getElementById('marketOptions');
  marketToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    marketOptions.classList.toggle('open');
  });
  marketOptions.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      marketLabel.textContent = btn.dataset.market;
      marketOptions.classList.remove('open');
    });
  });
  document.addEventListener('click', (e) => {
    if (!marketOptions.contains(e.target) && e.target !== marketToggle) {
      marketOptions.classList.remove('open');
    }
  });

  function setupCond(labelId, toggleId, optionsId) {
    const label = document.getElementById(labelId);
    const toggle = document.getElementById(toggleId);
    const options = document.getElementById(optionsId);
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      options.classList.toggle('open');
    });
    options.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        label.textContent = btn.dataset.cond;
        options.classList.remove('open');
      });
    });
    document.addEventListener('click', (e) => {
      if (!options.contains(e.target) && e.target !== toggle) {
        options.classList.remove('open');
      }
    });
  }
  setupCond('condLabel1', 'condToggle1', 'condOptions1');
  setupCond('condLabel2', 'condToggle2', 'condOptions2');
  setupCond('condLabel3', 'condToggle3', 'condOptions3');
  setupCond('condLabel4', 'condToggle4', 'condOptions4');

  const periodLabel = document.getElementById('periodLabel');
  const periodToggle = document.getElementById('periodToggle');
  const periodOptions = document.getElementById('periodOptions');
  periodToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    periodOptions.classList.toggle('open');
  });
  periodOptions.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      periodLabel.textContent = btn.dataset.period;
      periodOptions.classList.remove('open');
    });
  });
  document.addEventListener('click', (e) => {
    if (!periodOptions.contains(e.target) && e.target !== periodToggle) {
      periodOptions.classList.remove('open');
    }
  });

  function updateClock() {
    const now = new Date();
    const y = now.getFullYear();
    const mo = now.getMonth() + 1;
    const d = now.getDate();
    const h = now.getHours();
    const mi = now.getMinutes();
    const s = now.getSeconds();
    document.getElementById('liveClock').textContent =
      `${y}年${mo}月${d}日${h}時${mi}分${s}秒`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ============================================================
     漫才CM（新ネタ3本・証券と無関係）
     ============================================================ */
  const MANZAI_LINES = [
    /* 漫才1：名字の話 */
    [
      ['ボケ', 'なあ、俺の名字って珍しすぎて、毎回説明が長なるねん。'],
      ['ツッコミ', 'へえ、どんな名字やねん。'],
      ['ボケ', '「小野寺」って言うねんけどな。'],
      ['ツッコミ', '別に珍しないやろ！ 普通にあるわ！'],
      ['ボケ', 'いや、うちは「おのでら」やなくて、「おのじ」って読むねん。'],
      ['ツッコミ', '読めへんわ！ 誰も読めへん！'],
      ['ボケ', 'せやから毎回、「小野寺と書いて、おのじと読みます」って言うねん。'],
      ['ツッコミ', '毎回説明すんの大変やな。'],
      ['ボケ', 'しかも、相手が「おのじさん」って呼んだあとに、必ず聞くねん。「おのじって、お寺の寺？」って。'],
      ['ツッコミ', 'せやろな！ 寺やからな！'],
      ['ボケ', '俺、毎回「いえ、寺じゃなくて、おのじです」って返すねん。'],
      ['ツッコミ', '余計わからんわ！ 堂々巡りや！']
    ],
    /* 漫才2：美容院 */
    [
      ['ボケ', 'なあ、美容院でさ、「いつも通りで」って言うたんよ。'],
      ['ツッコミ', 'うん、定番やな。'],
      ['ボケ', 'そしたら美容師さんが、「いつもって、どんな感じですか？」って。'],
      ['ツッコミ', 'そら聞くわ。初めてやったらな。'],
      ['ボケ', 'いや、3回目やねん。'],
      ['ツッコミ', '3回目で覚えられてへんの！？ どんだけ印象薄いん！'],
      ['ボケ', 'せやから俺、「前回と同じで」って言うたんよ。'],
      ['ツッコミ', 'それで通じたん？'],
      ['ボケ', '「前回って、いつですか？」って聞かれた。'],
      ['ツッコミ', '覚えてへんの確定や！ 記録つけてへんやろ！'],
      ['ボケ', '俺、もう諦めて、「短くしてください」って言うた。'],
      ['ツッコミ', '最初からそれでええやろ！ 30分の無駄や！']
    ],
    /* 漫才3：忘れ物 */
    [
      ['ボケ', 'なあ、家出てから、何か忘れた気がしてならへんねん。'],
      ['ツッコミ', 'あるある。財布とか？'],
      ['ボケ', '財布はある。鍵もある。スマホもある。'],
      ['ツッコミ', '全部あるやん。で、何忘れたん？'],
      ['ボケ', 'それがわからへんねん。ずっとモヤモヤしてる。'],
      ['ツッコミ', '気持ち悪いな。で、家に戻ったん？'],
      ['ボケ', '戻った。そしたら、玄関のドア、開けっ放しやった。'],
      ['ツッコミ', '鍵閉め忘れとるやろ！ それは忘れ物やない！'],
      ['ボケ', 'いや、でも、鍵は持ってたんよ。'],
      ['ツッコミ', '持ってても、閉めてへんかったら意味ないやろ！'],
      ['ボケ', 'しかも、家戻ったら、ガスコンロの火、つけっぱなしやった。'],
      ['ツッコミ', 'それどころやない！ 早く消せ！ 火事になるわ！']
    ]
  ];

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const manzaiOverlay = document.getElementById('manzaiOverlay');
  const actorBoke = document.getElementById('actorBoke');
  const actorTsukkomi = document.getElementById('actorTsukkomi');
  const speechEl = document.getElementById('manzaiSpeech');
  const progressBar = document.getElementById('manzaiProgressBar');
  const skipBtn = document.getElementById('manzaiSkip');

  const playOrder = shuffle(MANZAI_LINES);

  let currentShowIndex = 0;
  let lineIndex = 0;
  let lineTimer = null;
  let skipRequested = false;

  const LINE_DURATION = 3600;
  const SITE_INTERVAL = 10 * 60 * 1000;

  function startManzai(index) {
    currentShowIndex = index;
    lineIndex = 0;
    skipRequested = false;
    const script = playOrder[index];
    manzaiOverlay.classList.add('active');
    speechEl.textContent = '';
    progressBar.style.width = '0%';
    updateProgress(0, script.length);
    showLine();
  }

  function showLine() {
    if (skipRequested) {
      endManzai();
      return;
    }
    const script = playOrder[currentShowIndex];

    if (lineIndex >= script.length) {
      setTimeout(endManzai, 800);
      return;
    }

    const [who, text] = script[lineIndex];
    actorBoke.classList.toggle('speaking', who === 'ボケ');
    actorTsukkomi.classList.toggle('speaking', who === 'ツッコミ');
    speechEl.textContent = text;
    updateProgress(lineIndex + 1, script.length);
    lineIndex++;
    lineTimer = setTimeout(showLine, LINE_DURATION);
  }

  function updateProgress(current, total) {
    const pct = (current / total) * 100;
    progressBar.style.width = pct + '%';
  }

  function endManzai() {
    manzaiOverlay.classList.remove('active');
    actorBoke.classList.remove('speaking');
    actorTsukkomi.classList.remove('speaking');
    if (lineTimer) clearTimeout(lineTimer);
    if (currentShowIndex + 1 < playOrder.length) {
      setTimeout(() => {
        startManzai(currentShowIndex + 1);
      }, SITE_INTERVAL);
    }
  }

  skipBtn.addEventListener('click', () => {
    skipRequested = true;
    if (lineTimer) clearTimeout(lineTimer);
    endManzai();
  });

  window.addEventListener('load', () => {
    setTimeout(() => {
      startManzai(0);
    }, 500);
  });
</script>

</body>
</html>
