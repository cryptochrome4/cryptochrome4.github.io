<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Does Not Play Dice?</title>
<style>
  :root {
    --paper: #f7f1df;
    --paper-line: #d9cfb8;
    --ink: #2a241c;
    --board: #234b3a;
    --board-edge: #6b4a2b;
    --chalk-white: #f8f8f2;
    --chalk-red: #ff6b6b;
    --chalk-yellow: #ffe066;
    --chalk-blue: #74c0fc;
    --desk: #4a3423;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive, sans-serif;
    background: radial-gradient(circle at 50% 20%, #6b4a2b 0%, #2b1d12 70%);
    color: var(--ink);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .scene {
    width: min(1200px, 100%);
    height: min(760px, 100%);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #f8f0dc;
    font-size: 14px;
    padding: 4px 10px;
    text-shadow: 1px 1px 0 #00000066;
  }

  .title {
    font-size: 18px;
    letter-spacing: 0.5px;
  }

  .pageinfo {
    font-size: 13px;
    opacity: 0.9;
  }

  .stage {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    min-height: 0;
  }

  /* ===== Book ===== */
  .book-wrap {
    position: relative;
    perspective: 1800px;
    min-height: 0;
  }

  .book {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }

  .page {
    position: absolute;
    inset: 0;
    background: var(--paper);
    border-radius: 10px 4px 4px 10px;
    box-shadow:
      0 10px 20px #00000055,
      inset 0 0 0 1px #ffffff88;
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: left center;
    backface-visibility: hidden;
  }

  .page::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 12px;
    background: linear-gradient(90deg, #00000022, transparent);
    pointer-events: none;
  }

  .page.cover {
    background-size: cover;
    background-position: center;
    color: #fff;
    text-shadow: 2px 2px 0 #00000099;
  }

  .page.cover .cover-label {
    margin-top: auto;
    background: #00000066;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 22px;
    line-height: 1.3;
  }

  .page-num {
    position: absolute;
    bottom: 10px;
    right: 16px;
    font-size: 12px;
    color: #00000066;
  }

  .page h1 {
    font-size: 26px;
    margin: 0 0 10px;
    line-height: 1.2;
  }

  .page h2 {
    font-size: 20px;
    margin: 0 0 10px;
    line-height: 1.2;
  }

  .page p {
    font-size: 19px;
    line-height: 1.55;
    margin: 0 0 10px;
  }

  .page .big {
    font-size: 22px;
  }

  .page .emoji {
    font-size: 34px;
    line-height: 1;
    margin: 6px 0;
  }

  .page .draw {
    margin-top: auto;
    border-top: 2px dashed var(--paper-line);
    padding-top: 8px;
    font-size: 13px;
    color: #00000077;
  }

  /* ===== Blackboard ===== */
  .board-wrap {
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .board-frame {
    flex: 1;
    background: var(--board-edge);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 14px 26px #00000066;
    min-height: 0;
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 20% 20%, #2f5d49 0%, var(--board) 55%, #183528 100%);
    border-radius: 8px;
    padding: 18px 20px;
    overflow: hidden;
    box-shadow: inset 0 0 30px #00000077;
  }

  .board::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px);
    pointer-events: none;
    border-radius: 8px;
  }

  .chalk-line {
    position: relative;
    z-index: 2;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive;
    font-size: 20px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 1.5em;
    text-shadow: 1px 1px 0 #00000055;
  }

  .chalk-white { color: var(--chalk-white); }
  .chalk-red { color: var(--chalk-red); }
  .chalk-yellow { color: var(--chalk-yellow); }
  .chalk-blue { color: var(--chalk-blue); }

  .caret {
    display: inline-block;
    width: 10px;
    height: 1.1em;
    background: #ffffffcc;
    vertical-align: -0.15em;
    animation: blink 0.7s steps(1) infinite;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .eraser {
    position: absolute;
    z-index: 5;
    width: 96px;
    height: 54px;
    border-radius: 8px;
    background: linear-gradient(180deg, #f2e6c9 0%, #d8c39a 60%, #b89a6a 100%);
    border: 2px solid #8a6b42;
    box-shadow: 0 8px 12px #00000066;
    transform: translate(-120px, -20px) rotate(-8deg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .eraser::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    top: 8px;
    height: 12px;
    border-radius: 4px;
    background: #00000012;
  }

  .eraser.show {
    opacity: 1;
  }

  .chalk-tray {
    height: 18px;
    background: linear-gradient(180deg, #7a5636, #4d3420);
    border-radius: 0 0 10px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    box-shadow: inset 0 2px 0 #ffffff22;
  }

  .chalk-stick {
    width: 34px;
    height: 8px;
    border-radius: 4px;
    box-shadow: 0 1px 2px #00000066;
  }

  .chalk-stick.white { background: var(--chalk-white); }
  .chalk-stick.red { background: var(--chalk-red); }
  .chalk-stick.yellow { background: var(--chalk-yellow); }
  .chalk-stick.blue { background: var(--chalk-blue); }

  .hint {
    color: #f8f0dc;
    font-size: 12px;
    text-align: center;
    opacity: 0.85;
    text-shadow: 1px 1px 0 #00000066;
  }

  /* page turn */
  .page.turn-next {
    animation: turnNext 0.65s ease-in-out forwards;
  }

  .page.turn-prev {
    animation: turnPrev 0.65s ease-in-out forwards;
  }

  @keyframes turnNext {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(-168deg); }
  }

  @keyframes turnPrev {
    0% { transform: rotateY(-168deg); }
    100% { transform: rotateY(0deg); }
  }

  @media (max-width: 900px) {
    .stage {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .page p { font-size: 17px; }
    .chalk-line { font-size: 17px; }
    .page h1 { font-size: 22px; }
  }
</style>
</head>

  /* 38 */ {
    title: "Two big ideas",
    body: [
      "Einstein says: It is real.",
      "Bohr says: It is maybe.",
      "Both ideas are big.",
      "Both ideas are useful.",
      "Scientists still talk about them."
    ],
    board: [
      ["white", "Einstein: real"],
      ["blue", "Bohr: maybe"],
      ["yellow", "both big"],
      ["red", "still talk today"]
    ]
  },

  /* 39 */ {
    title: "You can think too",
    body: [
      "You are smart.",
      "You can think about tiny things.",
      "You can ask big questions.",
      "You can say: maybe.",
      "You can say: let us find out."
    ],
    board: [
      ["white", "You are smart!"],
      ["yellow", "ask big questions"],
      ["blue", "say: maybe"],
      ["red", "let us find out!"]
    ]
  },

  /* 40 */ {
    type: "cover",
    image: "img41x.jpg",
    label: "The End<br><small>Keep asking questions.</small>"
  }
];

/* ============================================================
   STATE
   ============================================================ */

let current = 0;
let turning = false;
let typing = false;
let typeTimer = null;
let holdTimer = null;
let holdInterval = null;
let eraserTimer = null;

const bookEl = document.getElementById("book");
const boardEl = document.getElementById("board");
const chalkLineEl = document.getElementById("chalkLine");
const eraserEl = document.getElementById("eraser");
const pageInfoEl = document.getElementById("pageInfo");

/* ============================================================
   BUILD PAGE
   ============================================================ */

function makePageEl(page, index) {
  const el = document.createElement("div");
  el.className = "page";

  if (page.type === "cover") {
    el.classList.add("cover");
    el.style.backgroundImage = `url('${page.image}')`;
    el.innerHTML = `
      <div class="cover-label">${page.label}</div>
      <div class="page-num">${index + 1}</div>
    `;
    return el;
  }

  const bodyHtml = page.body.map(line => `<p>${line}</p>`).join("");
  el.innerHTML = `
    <h1>${page.title}</h1>
    ${bodyHtml}
    <div class="draw">Page ${index + 1}</div>
  `;
  return el;
}

function renderBook() {
  bookEl.innerHTML = "";
  const pageEl = makePageEl(pages[current], current);
  pageEl.id = "currentPage";
  bookEl.appendChild(pageEl);
}

/* ============================================================
   BLACKBOARD
   ============================================================ */

function clearBoardInstant() {
  chalkLineEl.innerHTML = "";
}

function showEraser() {
  eraserEl.classList.add("show");
}

function hideEraser() {
  eraserEl.classList.remove("show");
}

function eraseBoard(callback) {
  const page = pages[current];
  if (!page.board) {
    clearBoardInstant();
    callback();
    return;
  }

  showEraser();

  // move eraser across the board
  const boardRect = boardEl.getBoundingClientRect();
  const w = boardRect.width;
  const h = boardRect.height;

  let x = -100;
  let y = 10;
  let step = 0;

  const totalSteps = 18;
  eraserEl.style.transform = `translate(${x}px, ${y}px) rotate(-8deg)`;

  const move = () => {
    step++;
    x = -100 + (w + 200) * (step / totalSteps);
    y = 10 + Math.sin(step / 2) * 12;
    eraserEl.style.transform = `translate(${x}px, ${y}px) rotate(-8deg)`;

    // wipe text gradually
    const text = chalkLineEl.textContent || "";
    const keep = Math.max(0, text.length - Math.ceil(text.length / totalSteps));
    chalkLineEl.textContent = text.slice(0, keep);

    if (step < totalSteps) {
      eraserTimer = setTimeout(move, 28);
    } else {
      clearBoardInstant();
      setTimeout(() => {
        hideEraser();
        callback();
      }, 120);
    }
  };

  move();
}

function typeBoard(callback) {
  const page = pages[current];
  if (!page.board) {
    if (callback) callback();
    return;
  }

  typing = true;
  clearBoardInstant();

  const lines = page.board;
  let lineIndex = 0;
  let charIndex = 0;
  let span = null;

  function nextChar() {
    if (lineIndex >= lines.length) {
      typing = false;
      if (callback) callback();
      return;
    }

    const [color, text] = lines[lineIndex];

    if (charIndex === 0) {
      span = document.createElement("span");
      span.className = `chalk-${color}`;
      chalkLineEl.appendChild(span);

      if (lineIndex > 0) {
        chalkLineEl.appendChild(document.createTextNode("\n"));
      }
    }

    span.textContent += text[charIndex];
    charIndex++;

    if (charIndex >= text.length) {
      lineIndex++;
      charIndex = 0;
    }

    typeTimer = setTimeout(nextChar, 100);
  }

  nextChar();
}

function updateBoard() {
  if (typeTimer) clearTimeout(typeTimer);
  if (eraserTimer) clearTimeout(eraserTimer);

  eraseBoard(() => {
    typeBoard();
  });
}

/* ============================================================
   PAGE TURN
   ============================================================ */

function turnTo(nextIndex) {
  if (turning) return;
  if (nextIndex < 0 || nextIndex >= pages.length) return;
  if (nextIndex === current) return;

  turning = true;

  const oldPage = document.getElementById("currentPage");
  const direction = nextIndex > current ? "turn-next" : "turn-prev";

  if (oldPage) {
    oldPage.classList.add(direction);
  }

  setTimeout(() => {
    current = nextIndex;
    renderBook();
    updatePageInfo();
    updateBoard();
    turning = false;
  }, 620);
}

function nextPage() {
  turnTo(current + 1);
}

function prevPage() {
  turnTo(current - 1);
}

function updatePageInfo() {
  pageInfoEl.textContent = `Page ${current + 1} / ${pages.length}`;
}

/* ============================================================
   INPUT
   ============================================================ */

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") {
    e.preventDefault();
    nextPage();
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
    e.preventDefault();
    prevPage();
  }
});

/* click / hold click on the stage */
const stage = document.querySelector(".stage");

function startHold(clientX) {
  const rect = stage.getBoundingClientRect();
  const x = clientX - rect.left;
  const isRight = x > rect.width / 2;

  holdTimer = setTimeout(() => {
    holdInterval = setInterval(() => {
      if (isRight) nextPage();
      else prevPage();
    }, 260);
  }, 500);
}

function endHold() {
  if (holdTimer) clearTimeout(holdTimer);
  if (holdInterval) clearInterval(holdInterval);
  holdTimer = null;
  holdInterval = null;
}

stage.addEventListener("mousedown", (e) => {
  startHold(e.clientX);
});

stage.addEventListener("mouseup", (e) => {
  endHold();
  // simple click: right half = next, left half = prev
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x > rect.width / 2) nextPage();
  else prevPage();
});

stage.addEventListener("mouseleave", endHold);

/* touch */
stage.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  startHold(t.clientX);
}, { passive: true });

stage.addEventListener("touchend", (e) => {
  endHold();
  const t = e.changedTouches[0];
  const rect = stage.getBoundingClientRect();
  const x = t.clientX - rect.left;
  if (x > rect.width / 2) nextPage();
  else prevPage();
}, { passive: true });

/* ============================================================
   INIT
   ============================================================ */

renderBook();
updatePageInfo();
updateBoard();
</script>
</body>
</html>
