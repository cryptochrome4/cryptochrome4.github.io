<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル計算ドリル - 前編</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #4a5568; font-size: 24px; margin-bottom: 30px; }
        .quiz-item { border-bottom: 1px solid #e2e8f0; padding: 20px 0; }
        .quiz-item:last-child { border-bottom: none; }
        .question { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #2d3748; }
        .eng-question { color: #2b6cb0; }
        .input-area { display: flex; gap: 10px; align-items: center; }
        input[type="number"], input[type="text"] { padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; width: 120px; }
        button { background-color: #48bb78; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #38a169; }
        .result { font-weight: bold; margin-left: 15px; }
        .correct { color: #38a169; }
        .incorrect { color: #e53e3e; }
        .ans-btn { background-color: #4a5568; margin-top: 5px; }
        .ans-btn:hover { background-color: #2d3748; }
        .hint { font-size: 14px; color: #718096; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧮 計算ドリル（前編 / Part 1）</h1>
    <div id="quiz-container"></div>
</div>

<script>
// 【前編 / Part 1】問題データ（0.01〜1,000万、難易度ランダム、英語含む）
const quizData = [
    { id: 1, q: "45 + 87 = ?", a: 132, type: "ja" },
    { id: 2, q: "What is 15 multiplied by 6?", a: 90, type: "en", hint: "15 × 6 の意味です" },
    { id: 3, q: "5,000 - 2,450 = ?", a: 2550, type: "ja" },
    { id: 4, q: "12.5 ÷ 5 = ?", a: 2.5, type: "ja" },
    { id: 5, q: "0.25 + 0.79 = ?", a: 1.04, type: "ja" },
    { id: 6, q: "Subtract 45 from 100.", a: 55, type: "en", hint: "100 から 45 を引く（100 - 45）の意味です" },
    { id: 7, q: "1,200,000 + 3,500,000 = ?", a: 4700000, type: "ja" },
    { id: 8, q: "80 × 12 = ?", a: 960, type: "ja" },
    { id: 9, q: "What is 144 divided by 12?", a: 12, type: "en", hint: "144 ÷ 12 の意味です" },
    { id: 10, q: "9.6 - 4.25 = ?", a: 5.35, type: "ja" }
];

function loadQuiz() {
    const container = document.getElementById('quiz-container');
    quizData.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'quiz-item';
        
        const qClass = item.type === 'en' ? 'question eng-question' : 'question';
        const label = item.type === 'en' ? '🇺🇸 [English Question] ' : '';
        
        let hintHtml = item.hint ? `<div class="hint">💡 ヒント: ${item.hint}</div>` : '';

        itemDiv.innerHTML = `
            <div class="${qClass}">Q${item.id}. ${label}${item.q}</div>
            <div class="input-area">
                <input type="number" step="any" id="input-${index}" placeholder="回答を入力">
                <button onclick="checkAnswer(${index})">判定</button>
                <button class="ans-btn" onclick="showAnswer(${index})">答えを見る</button>
                <span id="result-${index}" class="result"></span>
            </div>
            ${hintHtml}
        `;
        container.appendChild(itemDiv);
    });
}

function checkAnswer(index) {
    const userAnswer = parseFloat(document.getElementById(`input-${index}`).value);
    const correctAnswer = quizData[index].a;
    const resultSpan = document.getElementById(`result-${index}`);
    
    if (isNaN(userAnswer)) {
        resultSpan.className = 'result incorrect';
        resultSpan.innerText = '数字を入力してください';
        return;
    }

    if (Math.abs(userAnswer - correctAnswer) < 0.00001) {
        resultSpan.className = 'result correct';
        resultSpan.innerText = '⭕ 正解！';
    } else {
        resultSpan.className = 'result incorrect';
        resultSpan.innerText = '❌ 不正解';
    }
}

function showAnswer(index) {
    const resultSpan = document.getElementById(`result-${index}`);
    resultSpan.className = 'result';
    resultSpan.innerText = `【正解: ${quizData[index].a}】`;
}

window.onload = loadQuiz;
</script>

</body>
</html>
