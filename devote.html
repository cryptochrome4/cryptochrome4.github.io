// ===== ソート用ヘルパ =====
function totalPower(s) {
  return ATTRS.reduce((sum, a) => sum + (s.attrs[a.key] || 0), 0);
}
function listedTime(s) {
  return new Date(s.listed + "T00:00:00Z").getTime();
}

// ===== レンダリング =====
function renderLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = ATTRS.map(a =>
    `<span class="legend-item"><span class="legend-dot" style="background:${a.color}"></span>${a.key}</span>`
  ).join("");
}

function renderThead() {
  const tr = document.getElementById("theadRow");
  let html = `<th>順位</th><th>銘柄名</th><th>コード</th><th>市場</th><th>国</th>`;
  html += `<th>最高株価</th><th>最低株価</th><th>平均株価<br>前編</th><th>平均株価<br>後編</th><th>直近株価</th>`;
  html += `<th style="color:#7c3aed">総合力</th>`;
  ATTRS.forEach(a => {
    html += `<th style="color:${a.color}">${a.key}</th>`;
  });
  html += `<th>上場日</th><th>代表属性</th>`;
  tr.innerHTML = html;
}

function getFilteredSorted() {
  const sort1 = document.getElementById("sort1").value;
  const sort2 = document.getElementById("sort2").value;

  let list = STOCKS.slice();

  // ソート1：対象絞り込み
  if (sort1 === "domestic") {
    list = list.filter(s => s.market === "domestic");
  } else if (sort1 === "foreign") {
    list = list.filter(s => s.market === "foreign");
  } else if (sort1.startsWith("country:")) {
    const c = sort1.split(":")[1];
    list = list.filter(s => s.market === "foreign" && s.country === c);
  }

  // ソート2：並び順
  list.sort((a, b) => {
    if (sort2 === "total") {
      const d = totalPower(b) - totalPower(a);
      if (d !== 0) return d;
      return listedTime(a) - listedTime(b);
    } else {
      const va = a.attrs[sort2] || 0;
      const vb = b.attrs[sort2] || 0;
      if (vb !== va) return vb - va;
      const d = totalPower(b) - totalPower(a);
      if (d !== 0) return d;
      return listedTime(a) - listedTime(b);
    }
  });

  return list;
}

function fmtPrice(n, market) {
  if (n === undefined || n === null) return "-";
  return n.toLocaleString("ja-JP");
}

function renderTable() {
  const list = getFilteredSorted();
  document.getElementById("count").textContent = list.length;

  const tbody = document.getElementById("tbody");
  const sort2 = document.getElementById("sort2").value;

  tbody.innerHTML = list.map((s, i) => {
    const total = totalPower(s);
    const marketLabel = s.market === "domestic" ? "国内" : "外国";
    const marketClass = s.market === "domestic" ? "market-domestic" : "market-foreign";

    let row = `<tr>`;
    row += `<td class="rank">${i + 1}</td>`;
    row += `<td class="name">${s.name}</td>`;
    row += `<td class="code">${s.code}</td>`;
    row += `<td><span class="market-badge ${marketClass}">${marketLabel}</span></td>`;
    row += `<td><span class="country-tag">${s.country}</span></td>`;
    row += `<td class="price">${fmtPrice(s.prices.high)}</td>`;
    row += `<td class="price">${fmtPrice(s.prices.low)}</td>`;
    row += `<td class="price">${fmtPrice(s.prices.avgFront)}</td>`;
    row += `<td class="price">${fmtPrice(s.prices.avgBack)}</td>`;
    row += `<td class="price">${fmtPrice(s.prices.latest)}</td>`;
    row += `<td class="total-power">${total}</td>`;

    ATTRS.forEach(a => {
      const v = s.attrs[a.key] || 0;
      const isRep = s.rep === a.key;
      const barW = Math.max(0, Math.min(100, v));
      row += `<td class="attr-cell ${v === 0 ? "zero" : ""}">`;
      row += `<span class="attr-val">${v}${isRep ? ' <span class="rep-star">★</span>' : ''}</span>`;
      if (v > 0) {
        row += `<span class="attr-bar" style="width:${barW * 0.85}%;background:${a.color}"></span>`;
      }
      row += `</td>`;
    });

    row += `<td style="font-family:monospace;font-size:11px">${s.listed}</td>`;
    row += `<td style="font-size:11px;color:#b45309;font-weight:600">${s.rep}</td>`;
    row += `</tr>`;
    return row;
  }).join("");
}

// ===== 初期化 =====
renderLegend();
renderThead();
renderTable();
document.getElementById("sort1").addEventListener("change", renderTable);
document.getElementById("sort2").addEventListener("change", renderTable);
</script>
