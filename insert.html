<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4番出口</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif; color: #eee; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: block; }

  #titleScreen { background: #111 url('img357exit.jpg') center/cover no-repeat; }
  #titleScreen::after { content:""; position:absolute; inset:0; background: rgba(0,0,0,.55); }
  .title-box { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center; padding:20px; }
  .title-box h1 { font-size: clamp(32px,8vw,64px); letter-spacing:.15em;
    text-shadow: 0 0 18px #000, 0 0 40px #000; }
  .title-box p.sub { font-size:13px; opacity:.75; letter-spacing:.1em; }
  .btn { cursor:pointer; border:1px solid #aaa; background: rgba(0,0,0,.6); color:#eee;
    padding:14px 36px; font-size:16px; letter-spacing:.12em; border-radius:4px;
    transition:.18s; min-width:220px; }
  .btn:hover { background:#eee; color:#111; }

  #bgViewer { background:#000; z-index:50; }
  #bgViewer img { width:100%; height:100%; object-fit:fill; display:block; }
  #bgViewer .closeBtn { position:absolute; top:14px; right:14px; z-index:2;
    background: rgba(0,0,0,.65); border:1px solid #ccc; color:#fff; padding:8px 16px;
    border-radius:4px; cursor:pointer; font-size:14px; }

  #gameScreen { background:#0a0a0a; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#15151a; image-rendering: pixelated; }
  #hud { position:absolute; top:12px; left:0; right:0; z-index:5; text-align:center;
    font-size:14px; letter-spacing:.1em; text-shadow:0 0 8px #000; pointer-events:none; }
  #hud .hint { display:block; font-size:12px; opacity:.6; margin-top:4px; }
  #message { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:5;
    background: rgba(0,0,0,.75); border:1px solid #444; padding:8px 18px; border-radius:4px;
    font-size:13px; opacity:0; transition: opacity .3s; pointer-events:none; white-space:nowrap; }
  #message.show { opacity:1; }

  #fade { position:absolute; inset:0; z-index:20; background:#000; opacity:0;
    pointer-events:none; transition: opacity .35s linear; }
  #fade.on { opacity:1; }

  #clearScreen { background:#000; }
  #clearScreen .wrap { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; padding:20px; text-align:center; }
  #clearScreen img { max-width:min(90vw,620px); max-height:55vh; object-fit:contain;
    border-radius:6px; box-shadow:0 0 30px rgba(255,255,255,.15); }
  #clearScreen h2 { font-size: clamp(24px,6vw,40px); letter-spacing:.2em; }
  footer.links { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  footer.links a { color:#9fd; text-decoration:none; border:1px solid #477;
    padding:12px 26px; border-radius:4px; font-size:15px; letter-spacing:.08em; transition:.18s; }
  footer.links a:hover { background:#9fd; color:#000; }
</style>
</head>
<body>

<div id="titleScreen" class="screen active">
  <div class="title-box">
    <h1>4番出口</h1>
    <p class="sub">〜 異常を見つけたら、引き返せ 〜</p>
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn" id="viewBgBtn">背景画像を見る</button>
  </div>
</div>

<div id="bgViewer" class="screen">
  <img src="img357exit.jpg" alt="背景画像">
  <button class="closeBtn" id="closeBgBtn">閉じる</button>
</div>

<div id="gameScreen" class="screen">
  <div id="stage"><canvas id="cv" width="640" height="360"></canvas></div>
  <div id="hud">
    <span id="countLabel">出口 0 / 4</span>
    <span class="hint">A/D または ←/→ で移動。異常がなければ進む、あれば引き返す。</span>
  </div>
  <div id="message"></div>
  <div id="fade"></div>
</div>

<div id="clearScreen" class="screen">
  <div class="wrap">
    <h2>クリア！</h2>
    <img src="img358exit.jpg" alt="喜んでいる画像">
    <footer class="links">
      <a href="study.html">study.html</a>
      <a href="nostalgic.html">nostalgic.html</a>
    </footer>
  </div>
</div>

<script>
(function () {
  "use strict";

  const screens = {
    title: document.getElementById('titleScreen'),
    bg:    document.getElementById('bgViewer'),
    game:  document.getElementById('gameScreen'),
    clear: document.getElementById('clearScreen')
  };
  let current = 'title';
  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    current = name;
  }
  document.getElementById('startBtn').onclick = () => { show('game'); startGame(); };
  document.getElementById('viewBgBtn').onclick = () => show('bg');
  document.getElementById('closeBgBtn').onclick = () => show('title');
  screens.bg.addEventListener('click', e => { if (e.target === screens.bg) show('title'); });

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  const GOAL = 4;
  const CORRIDOR_LEN = 420;
  const START_CAM = CORRIDOR_LEN / 2;  // 通路の中央からスタート
  const WALL_TOP = 60, WALL_BOTTOM = 300;
  const FADE_MS = 3000;

  const countLabel = document.getElementById('countLabel');
  const msgEl = document.getElementById('message');
  const fadeEl = document.getElementById('fade');

  let state = null;
  let keys = {};
  let lastTime = 0;
  let rafId = null;

  /* =========================================================
     異変 13種
     easy: true  … わかりやすい(8%)
     easy: false … よく観察しないと気づけない難しいもの(92%)
     ========================================================= */
  const ANOMALIES = [
    /* ---- わかりやすい(8%) ---- */
    { id:'redLight', easy:true, name:'赤い照明',
      apply(s, camX) {
        ctx.save(); ctx.fillStyle='rgba(255,20,20,0.35)'; ctx.fillRect(0,0,W,H); ctx.restore();
      } },

    /* ---- 難しい(92%) ---- */
    { id:'floorText', easy:false, name:'床の不気味な文字',
      apply(s, camX) {
        ctx.save(); ctx.font='bold 26px monospace';
        ctx.fillStyle='rgba(190,20,20,0.55)'; ctx.textAlign='center';
        for (let wx = 120; wx < CORRIDOR_LEN; wx += 200) {
          const sx = wx - camX;
          if (sx > -150 && sx < W + 150) ctx.fillText('オカエリ', sx, WALL_BOTTOM + 30);
        }
        ctx.restore();
      } },
    { id:'extraDoor', easy:false, name:'余計な扉',
      apply(s, camX) {
        for (let wx = 170; wx < CORRIDOR_LEN; wx += 240) {
          const sx = wx - camX;
          if (sx > -80 && sx < W + 80) drawDoor(sx, WALL_TOP + 60, 48, 120, '#302828');
        }
      } },
    { id:'eyes', easy:false, name:'壁の目',
      apply(s, camX) {
        for (let wx = 200; wx < CORRIDOR_LEN; wx += 200) {
          const ex = wx - camX;
          if (ex > -60 && ex < W + 60) {
            ctx.save();
            ctx.fillStyle='rgba(220,220,220,0.55)';
            ctx.beginPath(); ctx.ellipse(ex, 128, 10, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(ex+22, 128, 10, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle='rgba(0,0,0,0.6)';
            ctx.beginPath(); ctx.arc(ex+2, 128, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex+24, 128, 3, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },
    { id:'lowCeiling', easy:false, name:'天井が低い',
      apply(s) {
        ctx.save(); ctx.fillStyle='#0c0c10'; ctx.fillRect(0,0,W,120); ctx.restore();
      } },
    { id:'flicker', easy:false, name:'照明の点滅',
      apply(s) {
        const t = performance.now();
        if (Math.floor(t/180) % 2 === 0) {
          ctx.save(); ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H); ctx.restore();
        }
      } },
    { id:'posterFlip', easy:false, name:'ポスターが逆さま',
      apply(s, camX) {
        for (let wx = 150; wx < CORRIDOR_LEN; wx += 260) {
          const px = wx - camX;
          if (px > -60 && px < W + 60) {
            ctx.save();
            ctx.translate(px, 120); ctx.rotate(Math.PI);
            ctx.fillStyle='#4a5a6a'; ctx.fillRect(-18,-24,36,48);
            ctx.fillStyle='#9ab'; ctx.fillRect(-14,-20,28,6);
            ctx.restore();
          }
        }
      } },
    { id:'wallStain', easy:false, name:'壁の染み',
      apply(s, camX) {
        for (let wx = 140; wx < CORRIDOR_LEN; wx += 230) {
          const sx = wx - camX;
          if (sx > -60 && sx < W + 60) {
            ctx.save(); ctx.fillStyle='rgba(60,10,10,0.35)';
            ctx.beginPath(); ctx.ellipse(sx, 210, 26, 14, 0.3, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },
    { id:'lightOff', easy:false, name:'一部の照明が消えている',
      apply(s, camX) {
        const skip = 2;
        for (let i = 0; i < 4; i++) {
          if (i === skip) continue;
          const lx = 80 + i*120 - (camX % 120);
          ctx.fillStyle='rgba(255,240,200,0.18)'; ctx.fillRect(lx,18,60,8);
          ctx.fillStyle='rgba(255,240,200,0.5)';  ctx.fillRect(lx,24,60,2);
        }
      } },
    { id:'floorCrack', easy:false, name:'床のひび割れ',
      apply(s, camX) {
        ctx.save(); ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=2;
        for (let wx = 130; wx < CORRIDOR_LEN; wx += 210) {
          const sx = wx - camX;
          if (sx > -80 && sx < W + 80) {
            ctx.beginPath();
            ctx.moveTo(sx, WALL_BOTTOM+20);
            ctx.lineTo(sx+16, WALL_BOTTOM+40);
            ctx.lineTo(sx+6, WALL_BOTTOM+58);
            ctx.stroke();
          }
        }
        ctx.restore();
      } },
    { id:'shadowHand', easy:false, name:'壁に手の影',
      apply(s, camX) {
        for (let wx = 180; wx < CORRIDOR_LEN; wx += 250) {
          const sx = wx - camX;
          if (sx > -60 && sx < W + 60) {
            ctx.save(); ctx.fillStyle='rgba(0,0,0,0.35)';
            ctx.beginPath(); ctx.ellipse(sx, 150, 10, 16, 0, 0, Math.PI*2); ctx.fill();
            for (let f=0; f<4; f++) {
              ctx.beginPath(); ctx.ellipse(sx-8+f*5, 132, 2, 8, 0, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
          }
        }
      } },
    { id:'puddle', easy:false, name:'床の水たまり',
      apply(s, camX) {
        for (let wx = 160; wx < CORRIDOR_LEN; wx += 220) {
          const sx = wx - camX;
          if (sx > -80 && sx < W + 80) {
            ctx.save(); ctx.fillStyle='rgba(40,60,90,0.5)';
            ctx.beginPath(); ctx.ellipse(sx, WALL_BOTTOM+34, 34, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },
    { id:'signNum', easy:false, name:'案内板の数字が違う',
      apply(s, camX) {
        for (let wx = 120; wx < CORRIDOR_LEN; wx += 260) {
          const sx = wx - camX;
          if (sx > -60 && sx < W + 60) {
            ctx.save();
            ctx.fillStyle='#1b3a2a'; ctx.fillRect(sx-22, 84, 44, 22);
            ctx.fillStyle='#cfe'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
            ctx.fillText('3', sx, 100);
            ctx.restore();
          }
        }
      } }
  ];

  // 重み付き抽選: わかりやすい8% / 難しい92%
  function pickAnomaly() {
    const easyList = ANOMALIES.filter(a => a.easy);
    const hardList = ANOMALIES.filter(a => !a.easy);
    const useEasy = Math.random() < 0.08;
    const list = (useEasy && easyList.length) ? easyList : hardList;
    return list[Math.floor(Math.random() * list.length)];
  }

  /* ---------------- 状態管理 ---------------- */
  function pickHall() {
    const has = Math.random() < 0.5; // 1/2で異変
    return { anomaly: has ? pickAnomaly() : null };
  }

  function startGame() {
    state = {
      exitNum: 0,
      camX: START_CAM,     // 通路の中央から
      playerX: W / 2,      // 画面中央
      hall: { anomaly: null },
      cleared: false,
      transitioning: false
    };
    updateHud();
    showMsg('出口0（基礎廊下）。D で進もう。A でも次へ進めます。');
    keys = {};
    if (rafId) cancelAnimationFrame(rafId);
    lastTime = performance.now();
    loop(lastTime);
  }

  function updateHud() {
    countLabel.textContent = '出口 ' + state.exitNum + ' / ' + GOAL;
  }

  let msgTimer = null;
  function showMsg(text) {
    msgEl.textContent = text;
    msgEl.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => msgEl.classList.remove('show'), 2200);
  }

  /* ---------------- 入力 ---------------- */
  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  /* ---------------- 描画 ---------------- */
  function drawDoor(x, y, w, h, color) {
    ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#c9b37a';
    ctx.beginPath(); ctx.arc(x + w - 10, y + h/2, 3, 0, Math.PI*2); ctx.fill();
  }

  function drawCorridor(camX, anomaly) {
    ctx.fillStyle = '#15151a'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#0d0d12'; ctx.fillRect(0,0,W,WALL_TOP);
    ctx.fillStyle = '#1d1d24'; ctx.fillRect(0,WALL_BOTTOM,W,H-WALL_BOTTOM);
    ctx.fillStyle = '#2a2a33'; ctx.fillRect(0,WALL_TOP,W,WALL_BOTTOM-WALL_TOP);

    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      const sx = (x - (camX % 40));
      ctx.beginPath(); ctx.moveTo(sx, WALL_TOP); ctx.lineTo(sx, WALL_BOTTOM); ctx.stroke();
    }

    // 基本の照明4本（消灯異変のときは異変側で上書き）
    if (!anomaly || anomaly.id !== 'lightOff') {
      for (let i = 0; i < 4; i++) {
        const lx = 80 + i*120 - (camX % 120);
        ctx.fillStyle='rgba(255,240,200,0.18)'; ctx.fillRect(lx,18,60,8);
        ctx.fillStyle='rgba(255,240,200,0.5)';  ctx.fillRect(lx,24,60,2);
      }
    }

    if (anomaly && anomaly.apply) anomaly.apply(state, camX);

    const px = state.playerX, py = WALL_BOTTOM - 26;
    ctx.save();
    ctx.fillStyle='#e8e8e8';
    ctx.beginPath(); ctx.arc(px, py-44, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(px-9, py-34, 18, 34);
    ctx.fillRect(px-8, py, 6, 14);
    ctx.fillRect(px+2, py, 6, 14);
    ctx.restore();
  }

  /* ---------------- メインループ ---------------- */
  function loop(now) {
    const dt = Math.min(50, now - lastTime) / 1000;
    lastTime = now;

    if (current === 'game' && state && !state.cleared) {
      if (!state.transitioning) {
        const speed = 170;
        let dx = 0;
        if (keys['a'] || keys['arrowleft'])  dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;

        if (dx !== 0) state.camX += dx * speed * dt;

        if (state.camX < 0) state.camX = 0;
        if (state.camX > CORRIDOR_LEN) state.camX = CORRIDOR_LEN;

        // 見た目用: 中央基準でプレイヤーを画面内で動かす
        const rel = (state.camX - CORRIDOR_LEN / 2) / (CORRIDOR_LEN / 2); // -1..1
        state.playerX = W / 2 + rel * (W / 2 - 100);

        // 右端到達 → 前進判定
        if (state.camX >= CORRIDOR_LEN) {
          judgeForward();
        }
        // 左端到達 → 引き返し判定
        else if (state.camX <= 0) {
          judgeBack();
        }
      }

      drawCorridor(state.camX, state.hall.anomaly);
    }

    rafId = requestAnimationFrame(loop);
  }

  /* ---------------- 判定 ---------------- */
  // 右端=進む
  function judgeForward() {
    if (state.exitNum === 0) {
      showMsg('基礎廊下クリア。次から異常を見極めよう。');
      transitionToNext(true);
      return;
    }
    if (state.hall.anomaly) {
      showMsg('異常を見逃した… 出口0へ戻される。');
      transitionToNext(false);
    } else {
      // 非異変を右端(進む)で通過
      if (state.exitNum === GOAL) {
        // 出口4を非異変で通過 → クリア（暗転なし）
        finishClear();
        return;
      }
      showMsg('異常なし。次の通路へ。');
      transitionToNext(true);
    }
  }

  // 左端=引き返す
  function judgeBack() {
    if (state.exitNum === 0) {
      showMsg('基礎廊下クリア。次から異常を見極めよう。');
      transitionToNext(true);
      return;
    }
    if (state.hall.anomaly) {
      showMsg('異常を回避。次の通路へ。');
      transitionToNext(true);
    } else {
      showMsg('異常はなかった… 出口0へ戻される。');
      transitionToNext(false);
    }
  }

  function transitionToNext(success) {
    state.transitioning = true;
    fadeEl.classList.add('on');

    setTimeout(() => {
      if (success) {
        state.exitNum++;
      } else {
        state.exitNum = 0;
      }

      state.camX = START_CAM;   // 中央へワープ
      state.playerX = W / 2;

      state.hall = (state.exitNum === 0)
        ? { anomaly: null }
        : pickHall();

      updateHud();

      fadeEl.classList.remove('on');
      state.transitioning = false;
    }, FADE_MS);
  }

  function finishClear() {
    state.cleared = true;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    show('clear');
  }
})();
</script>
</body>
</html>
