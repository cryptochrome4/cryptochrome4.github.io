<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4番出口</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif; color: #eee; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: block; }

  #titleScreen { background: #111 url('img357exit.jpg') center/cover no-repeat; }
  #titleScreen::after { content:""; position:absolute; inset:0; background: rgba(0,0,0,.55); }
  .title-box { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center; padding:20px; }
  .title-box h1 { font-size: clamp(32px,8vw,64px); letter-spacing:.15em;
    text-shadow: 0 0 18px #000, 0 0 40px #000; }
  .title-box p.sub { font-size:13px; opacity:.75; letter-spacing:.1em; }
  .btn { cursor:pointer; border:1px solid #aaa; background: rgba(0,0,0,.6); color:#eee;
    padding:14px 36px; font-size:16px; letter-spacing:.12em; border-radius:4px;
    transition:.18s; min-width:220px; }
  .btn:hover { background:#eee; color:#111; }

  #bgViewer { background:#000; z-index:50; }
  #bgViewer img { width:100%; height:100%; object-fit:fill; display:block; }
  #bgViewer .closeBtn { position:absolute; top:14px; right:14px; z-index:2;
    background: rgba(0,0,0,.65); border:1px solid #ccc; color:#fff; padding:8px 16px;
    border-radius:4px; cursor:pointer; font-size:14px; }

  #gameScreen { background:#0a0a0a; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#15151a; image-rendering: pixelated; }
  #hud { position:absolute; top:12px; left:0; right:0; z-index:5; text-align:center;
    font-size:14px; letter-spacing:.1em; text-shadow:0 0 8px #000; pointer-events:none; }
  #hud .hint { display:block; font-size:12px; opacity:.6; margin-top:4px; }
  #message { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:5;
    background: rgba(0,0,0,.75); border:1px solid #444; padding:8px 18px; border-radius:4px;
    font-size:13px; opacity:0; transition: opacity .3s; pointer-events:none; white-space:nowrap; }
  #message.show { opacity:1; }

  #fade { position:absolute; inset:0; z-index:20; background:#000; opacity:0;
    pointer-events:none; transition: opacity .35s linear; }
  #fade.on { opacity:1; }

  #clearScreen { background:#000; }
  #clearScreen .wrap { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; padding:20px; text-align:center; }
  #clearScreen img { max-width:min(90vw,620px); max-height:55vh; object-fit:contain;
    border-radius:6px; box-shadow:0 0 30px rgba(255,255,255,.15); }
  #clearScreen h2 { font-size: clamp(24px,6vw,40px); letter-spacing:.2em; }
  footer.links { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  footer.links a { color:#9fd; text-decoration:none; border:1px solid #477;
    padding:12px 26px; border-radius:4px; font-size:15px; letter-spacing:.08em; transition:.18s; }
  footer.links a:hover { background:#9fd; color:#000; }
</style>
</head>
<body>

<div id="titleScreen" class="screen active">
  <div class="title-box">
    <h1>4番出口</h1>
    <p class="sub">〜 異常を見つけたら、引き返せ 〜</p>
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn" id="viewBgBtn">背景画像を見る</button>
  </div>
</div>

<div id="bgViewer" class="screen">
  <img src="img357exit.jpg" alt="背景画像">
  <button class="closeBtn" id="closeBgBtn">閉じる</button>
</div>

<div id="gameScreen" class="screen">
  <div id="stage"><canvas id="cv" width="640" height="360"></canvas></div>
  <div id="hud">
    <span id="countLabel">出口 0 / 4</span>
    <span class="hint">A/D または ←/→ で移動。異常がなければ進む、あれば引き返す。</span>
  </div>
  <div id="message"></div>
  <div id="fade"></div>
</div>

<div id="clearScreen" class="screen">
  <div class="wrap">
    <h2>クリア！</h2>
    <img src="img358exit.jpg" alt="喜んでいる画像">
    <footer class="links">
      <a href="versus.html">versus.html</a>
      <a href="nostalgic.html">nostalgic.html</a>
    </footer>
  </div>
</div>

<script>
(function () {
  "use strict";

  const screens = {
    title: document.getElementById('titleScreen'),
    bg:    document.getElementById('bgViewer'),
    game:  document.getElementById('gameScreen'),
    clear: document.getElementById('clearScreen')
  };
  let current = 'title';
  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    current = name;
  }
  document.getElementById('startBtn').onclick = () => { show('game'); startGame(); };
  document.getElementById('viewBgBtn').onclick = () => show('bg');
  document.getElementById('closeBgBtn').onclick = () => show('title');
  screens.bg.addEventListener('click', e => { if (e.target === screens.bg) show('title'); });

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  const GOAL = 4;
  const CORRIDOR_LEN = 2100;
  const START_CAM = CORRIDOR_LEN * 0.25;
  const WALL_TOP = 60, WALL_BOTTOM = 300;
  const FADE_MS = 3000;
  const EDGE_ZONE = 60;

  // 判定位置（線の位置）
  const LEFT_LINE  = EDGE_ZONE;
  const RIGHT_LINE = CORRIDOR_LEN - EDGE_ZONE;

  // プレイヤーは画面中央固定
  const PLAYER_SCREEN_X = W / 2;

  const countLabel = document.getElementById('countLabel');
  const msgEl = document.getElementById('message');
  const fadeEl = document.getElementById('fade');

  let state = null;
  let keys = {};
  let lastTime = 0;
  let rafId = null;

  /* =========================================================
     異変 合計43種
     ========================================================= */
  const ANOMALIES = [

    { id:'redLight', easy:true, name:'赤い照明',
      apply(s, sx) {
        ctx.save(); ctx.fillStyle='rgba(255,20,20,0.35)'; ctx.fillRect(0,0,W,H); ctx.restore();
      } },

    { id:'floorText', easy:false, name:'床の不気味な文字',
      apply(s, sx) {
        ctx.save(); ctx.font='bold 26px monospace';
        ctx.fillStyle='rgba(190,20,20,0.55)'; ctx.textAlign='center';
        for (let wx = 300; wx < CORRIDOR_LEN; wx += 600) {
          const x = wx + sx;
          if (x > -150 && x < W + 150) ctx.fillText('オカエリ', x, WALL_BOTTOM + 30);
        }
        ctx.restore();
      } },

    { id:'extraDoor', easy:false, name:'余計な扉',
      apply(s, sx) {
        for (let wx = 400; wx < CORRIDOR_LEN; wx += 700) {
          const x = wx + sx;
          if (x > -80 && x < W + 80) drawDoor(x, WALL_TOP + 60, 48, 120, '#302828');
        }
      } },

    { id:'eyes', easy:false, name:'壁の目',
      apply(s, sx) {
        for (let wx = 500; wx < CORRIDOR_LEN; wx += 650) {
          const ex = wx + sx;
          if (ex > -60 && ex < W + 60) {
            ctx.save();
            ctx.fillStyle='rgba(220,220,220,0.55)';
            ctx.beginPath(); ctx.ellipse(ex, 128, 10, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(ex+22, 128, 10, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle='rgba(0,0,0,0.6)';
            ctx.beginPath(); ctx.arc(ex+2, 128, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex+24, 128, 3, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },

    { id:'lowCeiling', easy:false, name:'天井が低い',
      apply(s) {
        ctx.save(); ctx.fillStyle='#0c0c10'; ctx.fillRect(0,0,W,120); ctx.restore();
      } },

    { id:'flicker', easy:false, name:'照明の点滅',
      apply(s) {
        const t = performance.now();
        if (Math.floor(t/180) % 2 === 0) {
          ctx.save(); ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H); ctx.restore();
        }
      } },

    { id:'posterFlip', easy:false, name:'ポスターが逆さま',
      apply(s, sx) {
        for (let wx = 450; wx < CORRIDOR_LEN; wx += 720) {
          const x = wx + sx;
          if (x > -60 && x < W + 60) {
            ctx.save();
            ctx.translate(x, 120); ctx.rotate(Math.PI);
            ctx.fillStyle='#4a5a6a'; ctx.fillRect(-18,-24,36,48);
            ctx.fillStyle='#9ab'; ctx.fillRect(-14,-20,28,6);
            ctx.restore();
          }
        }
      } },

    { id:'wallStain', easy:false, name:'壁の染み',
      apply(s, sx) {
        for (let wx = 350; wx < CORRIDOR_LEN; wx += 640) {
          const x = wx + sx;
          if (x > -60 && x < W + 60) {
            ctx.save(); ctx.fillStyle='rgba(60,10,10,0.35)';
            ctx.beginPath(); ctx.ellipse(x, 210, 26, 14, 0.3, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },

    { id:'lightOff', easy:false, name:'一部の照明が消えている',
      apply(s, sx) {
        const skip = 2;
        for (let i = 0; i < 6; i++) {
          if (i === skip) continue;
          const lx = 80 + i*120 + (sx % 120);
          ctx.fillStyle='rgba(255,240,200,0.18)'; ctx.fillRect(lx,18,60,8);
          ctx.fillStyle='rgba(255,240,200,0.5)';  ctx.fillRect(lx,24,60,2);
        }
      } },

    { id:'floorCrack', easy:false, name:'床のひび割れ',
      apply(s, sx) {
        ctx.save(); ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=2;
        for (let wx = 300; wx < CORRIDOR_LEN; wx += 580) {
          const x = wx + sx;
          if (x > -80 && x < W + 80) {
            ctx.beginPath();
            ctx.moveTo(x, WALL_BOTTOM+20);
            ctx.lineTo(x+16, WALL_BOTTOM+40);
            ctx.lineTo(x+6, WALL_BOTTOM+58);
            ctx.stroke();
          }
        }
        ctx.restore();
      } },

    { id:'shadowHand', easy:false, name:'壁に手の影',
      apply(s, sx) {
        for (let wx = 420; wx < CORRIDOR_LEN; wx += 660) {
          const x = wx + sx;
          if (x > -60 && x < W + 60) {
            ctx.save(); ctx.fillStyle='rgba(0,0,0,0.35)';
            ctx.beginPath(); ctx.ellipse(x, 150, 10, 16, 0, 0, Math.PI*2); ctx.fill();
            for (let f=0; f<4; f++) {
              ctx.beginPath(); ctx.ellipse(x-8+f*5, 132, 2, 8, 0, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
          }
        }
      } },

    { id:'puddle', easy:false, name:'床の水たまり',
      apply(s, sx) {
        for (let wx = 380; wx < CORRIDOR_LEN; wx += 620) {
          const x = wx + sx;
          if (x > -80 && x < W + 80) {
            ctx.save(); ctx.fillStyle='rgba(40,60,90,0.5)';
            ctx.beginPath(); ctx.ellipse(x, WALL_BOTTOM+34, 34, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },

    { id:'signNum', easy:false, name:'案内板の数字が違う',
      apply(s, sx) {
        for (let wx = 320; wx < CORRIDOR_LEN; wx += 640) {
          const x = wx + sx;
          if (x > -60 && x < W + 60) {
            ctx.save();
            ctx.fillStyle='#1b3a2a'; ctx.fillRect(x-22, 84, 44, 22);
            ctx.fillStyle='#cfe'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
            ctx.fillText('3', x, 100);
            ctx.restore();
          }
        }
      } },

    { id:'posterSmile', easy:false, name:'ポスターの顔が笑う',
      apply(s, sx) {
        for (let wx = 500; wx < CORRIDOR_LEN; wx += 700) {
          const x = wx + sx;
          if (x > -60 && x < W + 60) {
            ctx.save();
            ctx.fillStyle='#3a3a4a'; ctx.fillRect(x-20, 90, 40, 56);
            ctx.fillStyle='#e0c0a0'; ctx.beginPath(); ctx.arc(x, 112, 10, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle='#a03030'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(x, 116, 6, 0.2, Math.PI-0.2); ctx.stroke();
            ctx.restore();
          }
        }
      } },

    { id:'ceilingDrip', easy:false, name:'天井から水滴',
      apply(s, sx) {
        const t = performance.now();
        for (let wx = 450; wx < CORRIDOR_LEN; wx += 600) {
          const x = wx + sx;
          if (x > -20 && x < W + 20) {
            const dy = ((t/600 + wx) % 1) * 200;
            ctx.save(); ctx.fillStyle='rgba(160,200,255,0.7)';
            ctx.beginPath(); ctx.ellipse(x, 30 + dy, 3, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },

    { id:'clockReverse', easy:false, name:'時計が逆回転',
      apply(s, sx) {
        for (let wx = 600; wx < CORRIDOR_LEN; wx += 800) {
          const x = wx + sx;
          if (x > -40 && x < W + 40) {
            const t = performance.now() / 1000;
            ctx.save();
            ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.arc(x, 120, 18, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle='#222'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(x,120);
            ctx.lineTo(x + Math.cos(-t)*12, 120 + Math.sin(-t)*12); ctx.stroke();
            ctx.restore();
          }
        }
      } },

    { id:'exitSignRed', easy:false, name:'非常口サインが赤',
      apply(s, sx) {
        const on = Math.floor(performance.now()/400) % 2 === 0;
        for (let wx = 550; wx < CORRIDOR_LEN; wx += 700) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save();
            ctx.fillStyle = on ? 'rgba(255,40,40,0.9)' : 'rgba(120,20,20,0.5)';
            ctx.fillRect(x-26, 78, 52, 20);
            ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
            ctx.fillText('非常口', x, 92);
            ctx.restore();
          }
        }
      } },

    { id:'footprints', easy:false, name:'床に足跡',
      apply(s, sx) {
        for (let wx = 340; wx < CORRIDOR_LEN; wx += 500) {
          const x = wx + sx;
          if (x > -60 && x < W + 60) {
            ctx.save(); ctx.fillStyle='rgba(20,20,20,0.5)';
            ctx.beginPath(); ctx.ellipse(x, WALL_BOTTOM+30, 6, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x+18, WALL_BOTTOM+42, 6, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      } },

    { id:'mirror', easy:false, name:'壁の鏡',
      apply(s, sx) {
        for (let wx = 700; wx < CORRIDOR_LEN; wx += 900) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save();
            ctx.fillStyle='#557'; ctx.fillRect(x-22, 100, 44, 60);
            ctx.fillStyle='rgba(200,220,240,0.3)'; ctx.fillRect(x-18, 104, 36, 52);
            ctx.restore();
          }
        }
      } },

    { id:'tileDiff', easy:false, name:'色違いのタイル',
      apply(s, sx) {
        const x = 900 + sx;
        if (x > -40 && x < W + 40) {
          ctx.save(); ctx.fillStyle='rgba(120,80,40,0.5)';
          ctx.fillRect(x, WALL_BOTTOM+10, 40, 40); ctx.restore();
        }
      } },

    { id:'beamExtra', easy:false, name:'梁が多い',
      apply(s, sx) {
        ctx.save(); ctx.fillStyle='rgba(0,0,0,0.4)';
        for (let wx = 0; wx < CORRIDOR_LEN; wx += 150) {
          const x = wx + sx;
          if (x > -20 && x < W + 20) ctx.fillRect(x, 0, 12, 60);
        }
        ctx.restore();
      } },

    { id:'posterCrowd', easy:false, name:'ポスターが増えている',
      apply(s, sx) {
        for (let wx = 400; wx < CORRIDOR_LEN; wx += 260) {
          const x = wx + sx;
          if (x > -40 && x < W + 40) {
            ctx.save(); ctx.fillStyle='#445'; ctx.fillRect(x-16, 92, 32, 44);
            ctx.restore();
          }
        }
      } },

    { id:'purpleLight', easy:false, name:'紫色の照明',
      apply(s) {
        ctx.save(); ctx.fillStyle='rgba(150,60,255,0.18)'; ctx.fillRect(0,0,W,H); ctx.restore();
      } },

    { id:'wallCrack', easy:false, name:'壁のひび',
      apply(s, sx) {
        for (let wx = 480; wx < CORRIDOR_LEN; wx += 760) {
          const x = wx + sx;
          if (x > -40 && x < W + 40) {
            ctx.save(); ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(x, 90); ctx.lineTo(x+8, 140); ctx.lineTo(x-4, 190); ctx.stroke();
            ctx.restore();
          }
        }
      } },

    { id:'floorArrow', easy:false, name:'床の矢印',
      apply(s, sx) {
        for (let wx = 520; wx < CORRIDOR_LEN; wx += 600) {
          const x = wx + sx;
          if (x > -40 && x < W + 40) {
            ctx.save(); ctx.fillStyle='rgba(200,200,80,0.5)';
            ctx.beginPath();
            ctx.moveTo(x, WALL_BOTTOM+20); ctx.lineTo(x+16, WALL_BOTTOM+40);
            ctx.lineTo(x, WALL_BOTTOM+60); ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        }
      } },

    { id:'paintingTilt', easy:false, name:'傾いた絵画',
      apply(s, sx) {
        for (let wx = 640; wx < CORRIDOR_LEN; wx += 820) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save(); ctx.translate(x, 120); ctx.rotate(0.2);
            ctx.fillStyle='#665'; ctx.fillRect(-20,-16,40,32);
            ctx.fillStyle='#aa8'; ctx.fillRect(-14,-10,28,20);
            ctx.restore();
          }
        }
      } },

    { id:'lightSwing', easy:false, name:'揺れる照明',
      apply(s, sx) {
        const t = performance.now()/1000;
        const sway = Math.sin(t*2) * 6;
        for (let i = 0; i < 6; i++) {
          const lx = 80 + i*120 + (sx % 120) + sway;
          ctx.fillStyle='rgba(255,240,200,0.18)'; ctx.fillRect(lx,18,60,8);
          ctx.fillStyle='rgba(255,240,200,0.5)';  ctx.fillRect(lx,24,60,2);
        }
      } },

    { id:'graffiti', easy:false, name:'壁の落書き',
      apply(s, sx) {
        for (let wx = 750; wx < CORRIDOR_LEN; wx += 900) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save(); ctx.strokeStyle='rgba(200,60,60,0.7)'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(x, 140, 14, 0, Math.PI*1.5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x-20, 170); ctx.lineTo(x+20, 170); ctx.stroke();
            ctx.restore();
          }
        }
      } },

    { id:'litter', easy:false, name:'床の紙くず',
      apply(s, sx) {
        for (let wx = 360; wx < CORRIDOR_LEN; wx += 520) {
          const x = wx + sx;
          if (x > -30 && x < W + 30) {
            ctx.save(); ctx.fillStyle='rgba(220,220,200,0.6)';
            ctx.fillRect(x, WALL_BOTTOM+24, 10, 8); ctx.restore();
          }
        }
      } },

    { id:'arrowReverse', easy:false, name:'矢印が逆',
      apply(s, sx) {
        for (let wx = 560; wx < CORRIDOR_LEN; wx += 720) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save(); ctx.fillStyle='rgba(220,220,100,0.7)';
            ctx.beginPath();
            ctx.moveTo(x+16, 100); ctx.lineTo(x, 116); ctx.lineTo(x+16, 132);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        }
      } },

    { id:'clockStopped', easy:false, name:'止まった時計',
      apply(s, sx) {
        for (let wx = 820; wx < CORRIDOR_LEN; wx += 900) {
          const x = wx + sx;
          if (x > -40 && x < W + 40) {
            ctx.save();
            ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.arc(x, 120, 18, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle='#222'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(x,120); ctx.lineTo(x,108); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x,120); ctx.lineTo(x+8,120); ctx.stroke();
            ctx.restore();
          }
        }
      } },

    { id:'tileStripe', easy:false, name:'縦縞の床',
      apply(s, sx) {
        ctx.save(); ctx.fillStyle='rgba(80,80,100,0.25)';
        for (let wx = 0; wx < CORRIDOR_LEN; wx += 40) {
          const x = wx + sx;
          if (x > -40 && x < W + 40) ctx.fillRect(x, WALL_BOTTOM, 20, H-WALL_BOTTOM);
        }
        ctx.restore();
      } },

    { id:'vent', easy:false, name:'天井の換気口',
      apply(s, sx) {
        for (let wx = 480; wx < CORRIDOR_LEN; wx += 700) {
          const x = wx + sx;
          if (x > -40 && x < W + 40) {
            ctx.save(); ctx.fillStyle='#222'; ctx.fillRect(x-18, 6, 36, 26);
            ctx.strokeStyle='#555'; ctx.lineWidth=1;
            for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x-16, 10+i*5); ctx.lineTo(x+16, 10+i*5); ctx.stroke(); }
            ctx.restore();
          }
        }
      } },

    { id:'stairSign', easy:false, name:'非常階段サイン',
      apply(s, sx) {
        for (let wx = 620; wx < CORRIDOR_LEN; wx += 800) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save(); ctx.fillStyle='#a33'; ctx.fillRect(x-20, 80, 40, 18);
            ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
            ctx.fillText('非常階段', x, 93); ctx.restore();
          }
        }
      } },

    { id:'posterGlitch', easy:false, name:'化けたポスター',
      apply(s, sx) {
        for (let wx = 900; wx < CORRIDOR_LEN; wx += 950) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save(); ctx.fillStyle='#445'; ctx.fillRect(x-20, 92, 40, 44);
            ctx.fillStyle='rgba(220,80,80,0.8)';
            ctx.fillRect(x-14, 100, 10, 4); ctx.fillRect(x+2, 108, 12, 4);
            ctx.restore();
          }
        }
      } },

    { id:'drain', easy:false, name:'床の排水溝',
      apply(s, sx) {
        for (let wx = 560; wx < CORRIDOR_LEN; wx += 700) {
          const x = wx + sx;
          if (x > -30 && x < W + 30) {
            ctx.save(); ctx.fillStyle='#333'; ctx.fillRect(x-14, WALL_BOTTOM+20, 28, 10);
            ctx.strokeStyle='#555'; ctx.lineWidth=1;
            for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x-12+i*8, WALL_BOTTOM+20); ctx.lineTo(x-12+i*8, WALL_BOTTOM+30); ctx.stroke(); }
            ctx.restore();
          }
        }
      } },

    { id:'key', easy:false, name:'落ちている鍵',
      apply(s, sx) {
        const x = 1100 + sx;
        if (x > -40 && x < W + 40) {
          ctx.save(); ctx.strokeStyle='rgba(200,180,80,0.8)'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(x, WALL_BOTTOM+30, 5, 0, Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x+5, WALL_BOTTOM+30); ctx.lineTo(x+15, WALL_BOTTOM+30); ctx.stroke();
          ctx.restore();
        }
      } },

    { id:'hangingString', easy:false, name:'天井の紐',
      apply(s, sx) {
        for (let wx = 700; wx < CORRIDOR_LEN; wx += 800) {
          const x = wx + sx;
          if (x > -20 && x < W + 20) {
            ctx.save(); ctx.strokeStyle='rgba(150,150,120,0.7)'; ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, 90); ctx.stroke();
            ctx.restore();
          }
        }
      } },

    { id:'brokenMirror', easy:false, name:'割れた鏡',
      apply(s, sx) {
        for (let wx = 850; wx < CORRIDOR_LEN; wx += 900) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save();
            ctx.fillStyle='#557'; ctx.fillRect(x-22, 100, 44, 60);
            ctx.strokeStyle='rgba(220,220,255,0.7)'; ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(x-10,110); ctx.lineTo(x,140); ctx.lineTo(x+12,130); ctx.stroke();
            ctx.restore();
          }
        }
      } },

    { id:'ceilingHand', easy:false, name:'天井の手形',
      apply(s, sx) {
        for (let wx = 760; wx < CORRIDOR_LEN; wx += 850) {
          const x = wx + sx;
          if (x > -30 && x < W + 30) {
            ctx.save(); ctx.fillStyle='rgba(0,0,0,0.4)';
            ctx.beginPath(); ctx.ellipse(x, 30, 10, 6, 0, 0, Math.PI*2); ctx.fill();
            for (let f=0; f<4; f++) {
              ctx.beginPath(); ctx.ellipse(x-7+f*5, 20, 2, 5, 0, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
          }
        }
      } },

    { id:'blueLine', easy:false, name:'床の青い線',
      apply(s, sx) {
        ctx.save(); ctx.strokeStyle='rgba(80,160,255,0.6)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(0, WALL_BOTTOM+50); ctx.lineTo(W, WALL_BOTTOM+50); ctx.stroke();
        ctx.restore();
      } },

    { id:'posterUp', easy:false, name:'上向きポスター',
      apply(s, sx) {
        for (let wx = 1000; wx < CORRIDOR_LEN; wx += 950) {
          const x = wx + sx;
          if (x > -50 && x < W + 50) {
            ctx.save(); ctx.translate(x, 120); ctx.rotate(-Math.PI/2);
            ctx.fillStyle='#445'; ctx.fillRect(-20,-16,40,32);
            ctx.restore();
          }
        }
      } },

    { id:'emergencyLight', easy:false, name:'端の非常灯',
      apply(s, sx, camX) {
        if (camX < LEFT_LINE + 40 || camX > RIGHT_LINE - 40) {
          ctx.save();
          const a = 0.15 + 0.1*Math.sin(performance.now()/300);
          ctx.fillStyle='rgba(255,120,40,'+a+')';
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
      } }
  ];

  function pickAnomaly() {
    const easyList = ANOMALIES.filter(a => a.easy);
    const hardList = ANOMALIES.filter(a => !a.easy);
    const useEasy = Math.random() < 0.08;
    const list = (useEasy && easyList.length) ? easyList : hardList;
    return list[Math.floor(Math.random() * list.length)];
  }

  function pickHall() {
    const has = Math.random() < 0.5;
    return { anomaly: has ? pickAnomaly() : null };
  }

  function startGame() {
    state = {
      exitNum: 0,
      camX: START_CAM,
      hall: { anomaly: null },
      cleared: false,
      transitioning: false
    };
    updateHud();
    showMsg('出口0（基礎廊下）。D で進もう。A でも次へ進めます。');
    keys = {};
    if (rafId) cancelAnimationFrame(rafId);
    lastTime = performance.now();
    loop(lastTime);
  }

  function updateHud() {
    countLabel.textContent = '出口 ' + state.exitNum + ' / ' + GOAL;
  }

  let msgTimer = null;
  function showMsg(text) {
    msgEl.textContent = text;
    msgEl.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => msgEl.classList.remove('show'), 2200);
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function drawDoor(x, y, w, h, color) {
    ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#c9b37a';
    ctx.beginPath(); ctx.arc(x + w - 10, y + h/2, 3, 0, Math.PI*2); ctx.fill();
  }

  function drawMoviePosters(sx) {
    for (let wx = 200; wx < CORRIDOR_LEN; wx += 480) {
      const x = wx + sx;
      if (x > -80 && x < W + 80) {
        ctx.save();
        ctx.fillStyle='#1a1a22'; ctx.fillRect(x-26, 86, 52, 72);
        ctx.fillStyle='#2e2e3a'; ctx.fillRect(x-22, 90, 44, 64);
        ctx.fillStyle='#4a6a8a'; ctx.fillRect(x-18, 94, 36, 26);
        ctx.fillStyle='#8a5a4a'; ctx.fillRect(x-18, 124, 36, 8);
        ctx.fillStyle='#c8c8b0'; ctx.fillRect(x-18, 136, 36, 4);
        ctx.fillRect(x-18, 144, 24, 3);
        ctx.restore();
      }
    }
  }

  function drawWallPanels(sx) {
    for (let wx = 60; wx < CORRIDOR_LEN; wx += 120) {
      const x = wx + sx;
      if (x > -60 && x < W + 60) {
        ctx.save();
        ctx.fillStyle='#252530';
        ctx.fillRect(x, WALL_TOP+10, 100, 30);
        ctx.strokeStyle='rgba(255,255,255,0.06)';
        ctx.lineWidth=1;
        ctx.strokeRect(x+2, WALL_TOP+12, 96, 26);
        ctx.restore();
      }
    }
  }

  function drawFloorTiles(sx) {
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.lineWidth=1;
    for (let wx = 0; wx < CORRIDOR_LEN; wx += 60) {
      const x = wx + sx;
      if (x > -60 && x < W + 60) {
        ctx.beginPath(); ctx.moveTo(x, WALL_BOTTOM); ctx.lineTo(x, H); ctx.stroke();
      }
    }
    for (let y = WALL_BOTTOM; y < H; y += 20) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCeilingBeams(sx) {
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.35)';
    for (let wx = 0; wx < CORRIDOR_LEN; wx += 150) {
      const x = wx + sx;
      if (x > -20 && x < W + 20) ctx.fillRect(x, 0, 10, 60);
    }
    ctx.restore();
  }

  function drawEdgeZones(sx) {
    const leftScreen = LEFT_LINE + sx;
    if (leftScreen > -80 && leftScreen < W + 80) {
      ctx.save();
      ctx.strokeStyle='rgba(255,80,80,0.7)'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(leftScreen, WALL_BOTTOM);
      ctx.lineTo(leftScreen, H);
      ctx.stroke();
      ctx.strokeStyle='rgba(255,80,80,0.25)'; ctx.lineWidth=6;
      ctx.beginPath();
      ctx.moveTo(leftScreen, WALL_TOP);
      ctx.lineTo(leftScreen, WALL_BOTTOM);
      ctx.stroke();
      ctx.fillStyle='rgba(255,120,120,0.9)';
      ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
      ctx.fillText('引き返す境界', leftScreen, WALL_TOP+20);
      ctx.restore();
    }

    const rightScreen = RIGHT_LINE + sx;
    if (rightScreen > -80 && rightScreen < W + 80) {
      ctx.save();
      ctx.strokeStyle='rgba(80,200,255,0.7)'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(rightScreen, WALL_BOTTOM);
      ctx.lineTo(rightScreen, H);
      ctx.stroke();
      ctx.strokeStyle='rgba(80,200,255,0.25)'; ctx.lineWidth=6;
      ctx.beginPath();
      ctx.moveTo(rightScreen, WALL_TOP);
      ctx.lineTo(rightScreen, WALL_BOTTOM);
      ctx.stroke();
      ctx.fillStyle='rgba(120,200,255,0.9)';
      ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
      ctx.fillText('進む境界', rightScreen, WALL_TOP+20);
      ctx.restore();
    }
  }

  function drawCorridor(camX, anomaly) {
    const sx = PLAYER_SCREEN_X - camX;

    ctx.fillStyle = '#15151a'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#0d0d12'; ctx.fillRect(0,0,W,WALL_TOP);
    ctx.fillStyle = '#1d1d24'; ctx.fillRect(0,WALL_BOTTOM,W,H-WALL_BOTTOM);
    ctx.fillStyle = '#2a2a33'; ctx.fillRect(0,WALL_TOP,W,WALL_BOTTOM-WALL_TOP);

    // ★ 壁の縦線をワールド座標基準で描く（ポスターと同じ基準）
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    for (let wx = 0; wx < CORRIDOR_LEN; wx += 40) {
      const x = wx + sx;
      if (x > -20 && x < W + 20) {
        ctx.beginPath(); ctx.moveTo(x, WALL_TOP); ctx.lineTo(x, WALL_BOTTOM); ctx.stroke();
      }
    }

    drawWallPanels(sx);
    drawMoviePosters(sx);
    drawFloorTiles(sx);
    drawCeilingBeams(sx);

    if (!anomaly || anomaly.id !== 'lightOff') {
      for (let i = 0; i < 6; i++) {
        const lx = 80 + i*120 + (sx % 120);
        ctx.fillStyle='rgba(255,240,200,0.18)'; ctx.fillRect(lx,18,60,8);
        ctx.fillStyle='rgba(255,240,200,0.5)';  ctx.fillRect(lx,24,60,2);
      }
    }

    drawEdgeZones(sx);

    if (anomaly && anomaly.apply) anomaly.apply(state, sx, camX);

    const px = PLAYER_SCREEN_X, py = WALL_BOTTOM - 26;
    ctx.save();
    ctx.fillStyle='#e8e8e8';
    ctx.beginPath(); ctx.arc(px, py-44, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(px-9, py-34, 18, 34);
    ctx.fillRect(px-8, py, 6, 14);
    ctx.fillRect(px+2, py, 6, 14);
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(50, now - lastTime) / 1000;
    lastTime = now;

    if (current === 'game' && state && !state.cleared) {
      if (!state.transitioning) {
        const speed = 170;
        let dx = 0;
        if (keys['a'] || keys['arrowleft'])  dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;

        if (dx !== 0) state.camX += dx * speed * dt;

        if (state.camX < LEFT_LINE)  state.camX = LEFT_LINE;
        if (state.camX > RIGHT_LINE) state.camX = RIGHT_LINE;

        if (state.camX <= LEFT_LINE) {
          judgeBack();
        }
        else if (state.camX >= RIGHT_LINE) {
          judgeForward();
        }
      }

      drawCorridor(state.camX, state.hall.anomaly);
    }

    rafId = requestAnimationFrame(loop);
  }

  function judgeForward() {
    if (state.exitNum === 0) {
      showMsg('基礎廊下クリア。次から異常を見極めよう。');
      transitionToNext(true);
      return;
    }
    if (state.hall.anomaly) {
      showMsg('異常を見逃した… 出口0へ戻される。');
      transitionToNext(false);
    } else {
      if (state.exitNum === GOAL) {
        finishClear();
        return;
      }
      showMsg('異常なし。次の通路へ。');
      transitionToNext(true);
    }
  }

  function judgeBack() {
    if (state.exitNum === 0) {
      showMsg('基礎廊下クリア。次から異常を見極めよう。');
      transitionToNext(true);
      return;
    }
    if (state.hall.anomaly) {
      showMsg('異常を回避。次の通路へ。');
      transitionToNext(true);
    } else {
      showMsg('異常はなかった… 出口0へ戻される。');
      transitionToNext(false);
    }
  }

  function transitionToNext(success) {
    state.transitioning = true;
    fadeEl.classList.add('on');

    setTimeout(() => {
      if (success) {
        state.exitNum++;
      } else {
        state.exitNum = 0;
      }

      state.camX = START_CAM;

      state.hall = (state.exitNum === 0)
        ? { anomaly: null }
        : pickHall();

      updateHud();

      fadeEl.classList.remove('on');
      state.transitioning = false;
    }, FADE_MS);
  }

  function finishClear() {
    state.cleared = true;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    show('clear');
  }
})();
</script>
</body>
