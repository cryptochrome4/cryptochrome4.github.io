<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Word Generator</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 6px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #58a6ff; font-size: 24px; margin-bottom: 20px; }
        input {
            width: 80%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #navigator;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2ea043; }
        .result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #ff7b72;
            word-wrap: break-word;
            min-height: 33px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Chaos Word Generator</h1>
    <input type="text" id="wordInput" placeholder="単語を入力してください...">
    <br>
    <button onclick="generateChaosWord()">生成する</button>
    <div class="result" id="resultDisplay"></div>
</div>

<script>
    // ランダムに結合される言葉のリスト
    const jpWords = ["極み", "爆発", "伝説", "初心者", "構文", "虚無", "無限", "超越", "魔改造", "新星"];
    const enWords = ["Alpha", "Omega", "Chaos", "Bug", "Pro", "Cyber", "God", "Ghost", "Matrix", "System"];

    function generateChaosWord() {
        const inputWord = document.getElementById('wordInput').value.trim();
        
        if (!inputWord) {
            document.getElementById('resultDisplay').innerText = "単語を入力してね！";
            return;
        }

        // 0から100のランダムな数字
        const randomNumber = Math.floor(Math.random() * 101);

        // 50%の確率で日本語か英語を選ぶ
        const isJapanese = Math.random() < 0.5;
        let randomWord = "";

        if (isJapanese) {
            const randomIndex = Math.floor(Math.random() * jpWords.length);
            randomWord = jpWords[randomIndex];
        } else {
            const randomIndex = Math.floor(Math.random() * enWords.length);
            randomWord = enWords[randomIndex];
        }

        // パターンもランダムにする（前につくか、後ろにつくか）
        let finalResult = "";
        if (Math.random() < 0.5) {
            finalResult = `${inputWord}_${randomNumber}_${randomWord}`;
        } else {
            finalResult = `${randomWord}_${inputWord}_${randomNumber}`;
        }

        // 画面に表示
        document.getElementById('resultDisplay').innerText = finalResult;
    }
</script>

</body>
</html>
