<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .calculator {
            background-color: #1c1c1c;
            padding: 20px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #1c1c1c;
            border: none;
            color: white;
            font-size: 2.5rem;
            text-align: right;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .btn {
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            background-color: #333333;
            color: white;
        }
        .btn:active { filter: brightness(1.2); }
        .operator { background-color: #ff9f0a; }
        .clear { background-color: #a5a5a5; color: black; }
        .equal { grid-row: span 2; height: 132px; border-radius: 30px; background-color: #ff9f0a; }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn operator" onclick="appendOperator('/')">/</button>
            <button class="btn operator" onclick="appendOperator('*')">*</button>
            <button class="btn operator" onclick="appendOperator('-')">-</button>
            
            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn operator" onclick="appendOperator('+')">+</button>
            
            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn equal" onclick="calculate()">=</button>
            
            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn" onclick="appendNumber('0')">0</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        function appendNumber(num) { display.value += num; }
        function appendOperator(op) {
            const last = display.value.slice(-1);
            if (['+', '-', '*', '/'].includes(last)) { display.value = display.value.slice(0, -1) + op; }
            else if (display.value !== '') { display.value += op; }
        }
        function clearDisplay() { display.value = ''; }
        function calculate() {
            try { if (display.value) { display.value = Function('"use strict";return (' + display.value + ')')(); } }
            catch { display.value = 'Error'; }
        }
    </script>
</body>
</html>
