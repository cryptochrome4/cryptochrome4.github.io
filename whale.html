<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Keypad Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .calculator {
            background-color: #1c1c1c;
            padding: 20px;
            border-radius: 16px;
            width: 340px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #display {
            width: 100%;
            height: 70px;
            background-color: #1c1c1c;
            border: none;
            color: white;
            font-size: 2.5rem;
            text-align: right;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .btn {
            height: 60px;
            border-radius: 4px;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #e0e0e0;
            color: black;
        }
        .btn:active { filter: brightness(0.8); }
        /* スマホのキーボード風の色分け */
        .num { background-color: #ffffff; }
        .side-op { background-color: #b0bec5; }
        .clear { background-color: #ff5252; color: white; }
        .equal { background-color: #4caf50; color: white; }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- ディスプレイ -->
        <input type="text" id="display" readonly>
        
        <!-- スマホキーボード配置のボタン群 -->
        <div class="buttons">
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn side-op" onclick="appendOperator('+')">+</button>
            <button class="btn side-op" onclick="appendOperator('-')">-</button>
            <button class="btn side-op" onclick="appendOperator('*')">*</button>

            <button class="btn num" onclick="appendNumber('1')">1</button>
            <button class="btn num" onclick="appendNumber('2')">2</button>
            <button class="btn num" onclick="appendNumber('3')">3</button>
            <button class="btn side-op" onclick="appendOperator('/')">/</button>
            
            <button class="btn num" onclick="appendNumber('4')">4</button>
            <button class="btn num" onclick="appendNumber('5')">5</button>
            <button class="btn num" onclick="appendNumber('6')">6</button>
            <button class="btn side-op" onclick="appendOperator('.')">.</button>
            
            <button class="btn num" onclick="appendNumber('7')">7</button>
            <button class="btn num" onclick="appendNumber('8')">8</button>
            <button class="btn num" onclick="appendNumber('9')">9</button>
            <button class="btn equal" onclick="calculate()">=</button>
            
            <button class="btn side-op" onclick="appendOperator(':')">:</button>
            <button class="btn num" onclick="appendNumber('0')">0</button>
            <button class="btn side-op" onclick="appendOperator(',')">,</button>
            <!-- 右下空きスペース用のダミー -->
            <button class="btn side-op" style="visibility: hidden;"></button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        function appendNumber(num) { display.value += num; }
        function appendOperator(op) {
            const last = display.value.slice(-1);
            if (['+', '-', '*', '/', '.', ':', ','].includes(last)) { 
                display.value = display.value.slice(0, -1) + op; 
            } else if (display.value !== '') { 
                display.value += op; 
            }
        }
        function clearDisplay() { display.value = ''; }
        function calculate() {
            try { 
                if (display.value) { 
                    // 表示用の記号を計算用に置換して処理
                    let expression = display.value.replace(/:/g, '/').replace(/,/g, '');
                    display.value = Function('"use strict";return (' + expression + ')')(); 
                } 
            } catch { 
                display.value = 'Error'; 
            }
        }
    </script>
</body>
</html>
