<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urashima Effect - English Visual Novel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0077b6;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-outer {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            background-color: #222;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #444;
            box-sizing: border-box;
        }
        #image-area {
            width: 100%;
            height: 65%;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 0.5s ease;
        }
        #text-window {
            width: 100%;
            height: 35%;
            background: rgba(255, 182, 193, 0.95);

            border-top: 3px solid #ffb6c1;
            padding: 20px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: visible;
        }
        #speaker-name {
            font-size: 16px;
            font-weight: bold;
            color: #4fc3f7;
            margin: 0 0 8px 0;
            text-shadow: 1px 1px 2px #000;
        }
        #story-text-container {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
            letter-spacing: 0.03em;
            margin: 0;
            white-space: pre-wrap;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 10px;
        }
        #next-button {
            position: absolute;
            bottom: 0px;
            right: 0px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        #next-button:hover {
            background: linear-gradient(135deg, #81d4fa, #039be5);
            transform: scale(1.05);
        }
        #page-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #555;
            z-index: 10;
        }
        .vocab-word {
            color: #ffeb3b;
            text-decoration: underline dotted #ffeb3b;
            cursor: pointer;
            
            font-weight: bold;
        }
        .vocab-word::after {
            content: attr(data-translation);
            position: absolute;
            bottom: 150px;
            right: 15px;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid #ffeb3b;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.15s, visibility 0.15s;
            z-index: 9999;
        }
        .vocab-word.show::after {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="game-outer">
    <div id="page-counter"><span id="current-page">1</span> / 13</div>
    <div id="image-area"></div>
    <div id="text-window">
        <div id="speaker-name">Loading...</div>
        <div id="story-text-container">
            <p id="story-text"></p>
        </div>
        <button id="next-button" onclick="handleNext()">Next</button>
    </div>
</div>

<script>
// バグの元になるバックスラッシュ記号をすべて排除した、安全なシナリオデータです
const scenarioData = [
    {
        page: 1,
        speaker: "Girl A (Childhood Friend)",
        image: "img93moe.jpg",
        text: "Finally! You are so slow! Today is a perfect <span class='vocab-word' data-translation='休日'>holiday</span>! Look at this beautiful <span class='vocab-word' data-translation='海岸'>shore</span>! I had a strong <span class='vocab-word' data-translation='自信'>confidence</span> that we could have a great time here. I even dressed up in this cute outfit, not my usual <span class='vocab-word' data-translation='セーラー服、船員'>sailor</span> suit! But you kept me waiting, so I <span class='vocab-word' data-translation='侮辱を腹立たしく思う'>resented</span> your lazy attitude! Stop <span class='vocab-word' data-translation='うとうと寝、寝る'>dozingoff</span> on your <span class='vocab-word' data-translation='原付'>moped</span> and look at me!"
    },
    {
        page: 2,
        speaker: "Urashima",
        image: "img93moe.jpg",
        text: "Sorry, sorry. I had many annoying troubles <span class='vocab-word' data-translation='最近'>recent lately</span>. Wow, my heart is <span class='vocab-word' data-translation='ドキドキ、音、大敗'>pounding</span> because the summer atmosphere is so intense! Wait, let me check my pockets... Oh no, I forgot my <span class='vocab-word' data-translation='財布'>wallet</span> at home! This is a complete <span class='vocab-word' data-translation='絶望'>despair</span>... I am such an <span class='vocab-word' data-translation='間抜け、不器用な馬鹿'>imbecilic</span> guy. Please don't show your <span class='vocab-word' data-translation='天罰、激怒'>wrath</span>!"
    },
    {
        page: 3,
        speaker: "Girl A (Childhood Friend)",
        image: "img93moe.jpg",
        text: "Jeez! You forgot it again? But <span class='vocab-word' data-translation='あーでもやっぱり'>butyouknow</span>, <span class='vocab-word' data-translation='とりあえず'>for now</span>, I will forgive you <span class='vocab-word' data-translation='〜でない限り'>unless</span> you do it next time. After all, we are a perfect <span class='vocab-word' data-translation='ペアになって！一組二人'>pair</span>! Look, I made some lunch. Making this <span class='vocab-word' data-translation='酢豚'>sweetandsourpork</span> was a <span class='vocab-word' data-translation='容易い一切れ、朝飯前'>piece of cake</span>! Let's sit on that <span class='vocab-word' data-translation='ソファー'>couch</span> and eat. I <span class='vocab-word' data-translation='〜ではない（am, are, is notの短縮形）'>ain't</span> gonna let your clumsy mistake ruin this special reunion!"
    },
    {
        page: 4,
        speaker: "Urashima",
        image: "img93moe.jpg",
        text: "Thank you so much! Your cooking always looks like a <span class='vocab-word' data-translation='キラカード、素晴らしい例'>shiny example</span> of professional food. Huh? Did you hear that weird sound? Listen, <span class='vocab-word' data-translation='ささやき'>whisper</span>... Something is coming from the sea <span class='vocab-word' data-translation='突然'>suddenly</span>. Wow, it's a robotic turtle! Look at its <span class='vocab-word' data-translation='背面、後方部'>rear</span> side, it has a high-tech engine! It is moving with <span class=\"vocab-word\" data-translation=\"気力、バイタリティ\">vitality</span>! Is it an <span class='vocab-word' data-translation='一般の、普通、オーディナリー'>ordinary</span> turtle? No way, it's glowing!"
    },
    {
        page: 5,
        speaker: "Girl A (Childhood Friend)",
        image: "img93moe.jpg",
        text: "Oh my god, what a <span class='vocab-word' data-translation='風変わりな老人'>geezer</span>-looking machine! It is <span class='vocab-word' data-translation='嗅ぎ回る spy 探る'>snooping</span> around us! Why is it approaching you? Wait, it is speaking! It says: 'I need to <span class='vocab-word' data-translation='キャリー、運ぶ、支援'>carry</span> this boy to the deep ocean.' No! Don't touch him! You <span class='vocab-word' data-translation='凶暴、バーサーク'>berserker</span> machine! I will protect him <span class='vocab-word' data-translation='勇敢に、立派に'>bravely</span>! Urashima, don't <span class='vocab-word' data-translation='〜のふりをする 見せ掛け'>pretend</span> you don't know it! Did you plan this?"
    },
    {
        page: 6,
        speaker: "Urashima",
        image: "img93moe.jpg",
        text: "I swear I didn't! But the turtle says it has a special <span class='vocab-word' data-translation='使節、使者'>envoy</span> from a hidden kingdom. It says my presence is a critical <span class='vocab-word' data-translation='ファクター、要因'>factor</span> for them. I feel an <span class='vocab-word' data-translation='熱狂的な熱、フィーバー'>enthusiastic fever</span> in my chest! Look, its eyes <span class='vocab-word' data-translation='幸せ輝く、きらめき'>twinkle</span> like a starry night! I can't resist this mysterious call. I <span class='vocab-word' data-translation='頼む'>beg</span> you, let me go check it out just for a <span class='vocab-word' data-translation='秒単位の2番目、2回目'>2ndtime</span>! I will come back soon!"
    },
    {
        page: 7,
        speaker: "Girl B (Dragon Palace Princess)",
        image: "img94moe.jpg",
        text: "Welcome to the Dragon Palace! I <span class='vocab-word' data-translation='承知、認める、白状'>acknowledge</span> your courage, brave boy! I am Princess B. You made a right decision to <span class='vocab-word' data-translation='やめる、中止'>cease</span> your boring life on the shore. Look at this beautiful <span class='vocab-word' data-translation='景色、シーナリー'>scenery</span>! Forget about that noisy girl A. From now on, you are my precious guest in this deep sea <span class='vocab-word' data-translation='隠れ家、リゾート'>resort</span>! Let's enjoy our eternal party. Let us join our hearts together!"
    },
    {
        page: 8,
        speaker: "Urashima",
        image: "img94moe.jpg",
        text: "Wow! This palace is a <span class='vocab-word' data-translation='伝説の物語、レジェンダリーテイル'>Legendarytale</span>! The scale is so <span class='vocab-word' data-translation='広範囲'>extensive</span>. Hey Princess B, you are incredibly beautiful! Your hair has a <span class='vocab-word' data-translation='天使の輪、オーラ'>halo aura</span>, and your dress is so <span class='vocab-word' data-translation='眩しい、見事な'>dazzling superb</span>! Honestly, compared to you, girl A is just a <span class='vocab-word' data-translation='ちょっとした馬鹿、糞アホ'>dipshit</span>. I am completely <span class='vocab-word' data-translation='取りつかれた、憑依'>possessed</span> by your charm! I want to stay here forever! Let's make a sweet <span class='vocab-word' data-translation='名簿、ロースター'>rosters</span> of our love memories."
    },
    {
        page: 9,
        speaker: "Girl B (Dragon Palace Princess)",
        image: "img94moe.jpg",
        text: "Oh, you sweet talker! Are you trying to <span class='vocab-word' data-translation='だます、おびき出す'>scam-entice</span> me? Our relationship <span class='vocab-word' data-translation='〜ではない（is am areの次は必ず的にCになりやすい）'>is am are... to C</span>. My heart is a <span class='vocab-word' data-translation='完璧な完結（SVCのVは自己完結）'>self-contained V</span>, but you can explore my world. Look at my servants, they <span class='vocab-word' data-translation='協力する'>cooperate</span> to serve you. Even if other kingdoms think we are <span class='vocab-word' data-translation='反逆者、レベルズ'>rebels</span>, I don't care. Let's <span class='vocab-word' data-translation='並べ替え'>sorting</span> these treasures and enjoy a luxury lifestyle! No one can <span class='vocab-word' data-translation='非難する、責める'>condemn</span> us here!"
    },
    {
        page: 10,
        speaker: "Urashima",
        image: "img94moe.jpg",
        text: "This is paradise! I love how you <span class='vocab-word' data-translation='磨く、ブラシ、擦る'>brush</span> your hair. It feels like an <span class='vocab-word' data-translation='例外、エクセプション'>exception except</span> for reality! Wait, <span class='vocab-word' data-translation='最悪、最善（But now今は最悪 今は最高）'>But now</span>... I feel like my old memory is fading. Girl A's face is becoming completely <span class='vocab-word' data-translation='忘却、オブリビオン'>oblivion</span>. Who was she? A <span class='vocab-word' data-translation='未成年犯罪者'>juvie</span>? A <span class='vocab-word' data-translation='奴隷、スレイブス'>slaves</span>? It doesn't matter. Princess B, your beauty is a true <span class='vocab-word' data-translation='美学、徳、美徳'>aesthetics virtue</span>. Let's dance together in this golden <span class='vocab-word' data-translation='アリーナ、アミューズメント舞台'>arena active</span>!"
    },
    {
        page: 11,
        speaker: "Girl B (Dragon Palace Princess)",
        image: "img94moe.jpg",
        text: "Ufufu! You have a <span class='vocab-word' data-translation='個性的、ユニーク'>unique</span> soul. But our party must <span class='vocab-word' data-translation='〜を開始、始まる'>commence</span> to end. Look at the clock, a <span class='vocab-word' data-translation='時間の経過、ミス'>lapse ounce elapse</span> has happened. Time is running out. Take this <span class='vocab-word' data-translation='缶、缶詰の箱'>tin</span> box as a souvenir. It's a <span class='vocab-word' data-translation='記念、追悼'>commemorative</span> gift. <span class='vocab-word' data-translation='お互いの同意、コンセント'>consent agree</span> to my warning: never open it on the shore. This is our promise. Now, go back to your world."
    },
    {
        page: 12,
        speaker: "Urashima",
        image: "img95feat.jpg",
        text: "When I opened my eyes, I was back on the shore. But the scenery looked totally <span class='vocab-word' data-translation='ボロボロ、タターズ'>tatters</span>. I felt a sharp <span class='vocab-word' data-translation='けいれん、生理痛'>cramp</span> in my body. <span class='vocab-word' data-translation='つぃさっき以前、早く'>Earlier</span>, girl A was here, but now there is no one. I asked a <span class='vocab-word' data-translation='地方議会、審議会'>council</span> member passing by, but they didn't know her. I feel so <span class='vocab-word' data-translation='恥ずかしい、アシェイムド'>ashamed</span> and lonely. Damn it, I don't care about the warning anymore! I will open this box!"
    },
    {
        page: 13,
        speaker: "Narrator",
        image: "ruin.jpg",
        text: "White smoke popped out from the box. Instantly, Urashima's body aged into an old man. Was this a <span class='vocab-word' data-translation='天罰、激怒、復讐'>wrath fury avenge</span> for his cheating? Or was it the 'Urashima Effect'—the physical time dilation of Einstein's relativity theory caused by high-speed travel to the deep sea? The truth remains in the dark. He became an old man, matching his true timeline. 【THE END】"
    }
];

// ※ シナリオデータの箱はここまでです。次の後編コードに続きます。
// ==========================================
// 2. ゲームの進行・表示・画像を管理するシステム
// ==========================================
let currentIndex = 0; // 現在表示しているページのインデックス（0が1ページ目）

// 画面のテキスト・カウンター・画像を最新の状態に更新する関数
function updateScreen() {
    const currentScenario = scenarioData[currentIndex];
    
    // 1. 画面右上のページ番号を更新 (例: 1 / 13)
    document.getElementById("current-page").innerText = currentScenario.page;
    
    // 2. 話し手の名前（キャラクター名）を更新
    document.getElementById("speaker-name").innerText = currentScenario.speaker;
    
    // 3. 本文を更新（黄色の英単語タグをそのまま画面に反映させるためinnerHTMLを使用）
    document.getElementById("story-text").innerHTML = currentScenario.text;
    
    // 4. ページに対応した背景・キャラクター画像を自動切り替え
    const imageArea = document.getElementById("image-area");
    if (currentScenario.image) {
        imageArea.style.backgroundImage = "url('" + currentScenario.image + "')";
    }

    // 5. ボタンの文字を調整（最終13ページ目の時は「最初から読む」に切り替える）
    const nextBtn = document.getElementById("next-button");
    if (currentIndex === scenarioData.length - 1) {
        nextBtn.innerText = "Restart";
    } else {
        nextBtn.innerText = "Next";
    }

    // 長文が入ってスクロールしていた場合、ページ移動時に一番上まで自動リセットする（バグ防止）
    document.getElementById("story-text-container").scrollTop = 0;

    // 新しいページに配置された英単語に対して、クリックイベントを仕込み直す
    setupVocabClicks();
}

// 「Next（次へ）」ボタンがクリックされたときに実行される関数
function handleNext() {
    if (currentIndex < scenarioData.length - 1) {
        // まだ最後のページでなければ、次のページへ進む
        currentIndex++;
        updateScreen();
    } else {
        // 13ページ目でボタンが押されたら、ゲームを最初（1ページ目）にループさせる
        currentIndex = 0;
        updateScreen();
    }
}

// 英単語をクリックしたときに翻訳を表示・非表示（トグル）させる関数
function setupVocabClicks() {
    // 画面内にある「.vocab-word」というクラスがついた英単語をすべて探す
    const words = document.querySelectorAll('.vocab-word');
    
    words.forEach(word => {
        word.addEventListener('click', (e) => {
            // クリックイベントが後ろの背景（document）に突き抜けるのを防ぐ
            e.stopPropagation(); 
            
            // 別の単語の翻訳がすでに開いている場合、そちらを一度すべて非表示にする
            words.forEach(w => {
                if (w !== word) w.classList.remove('show');
            });
            
            // クリックされたこの単語に「show」クラスをつけ外しする（表示と非表示のトグル切り替え）
            word.classList.toggle('show');
        });
    });
}

// 画面のどこでもいいので英単語以外の場所をクリックしたら、開いている翻訳を一斉に非表示にする
document.addEventListener('click', () => {
    const words = document.querySelectorAll('.vocab-word');
    words.forEach(word => word.classList.remove('show'));
});

// ブラウザがこのHTMLファイルを読み込み終わった瞬間に、自動で最初の1ページ目を表示させる
window.onload = function() {
    updateScreen();
};
</script>
</body>
</html>
