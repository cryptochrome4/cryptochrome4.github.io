<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urashima Effect - English Visual Novel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* ゲーム画面の外枠 */
        #game-outer {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            background-color: #222;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #444;
            box-sizing: border-box;
        }
        /* 上部の画像エリア */
        #image-area {
            width: 100%;
            height: 65%;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 0.5s ease; /* 画像が切り替わるときにふわっと変わる演出 */
        }
        /* 下部のテキストウィンドウ */
        #text-window {
            width: 100%;
            height: 35%;
            background: #0d1117;
            border-top: 3px solid #4a6fa5;
            padding: 20px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        #speaker-name {
            font-size: 20px;
            font-weight: bold;
            color: #4fc3f7;
            margin: 0 0 8px 0;
            text-shadow: 1px 1px 2px #000;
        }
        #story-text-container {
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 0.03em;
            margin: 0;
            white-space: pre-wrap;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 10px;
        }
        #next-button {
            position: absolute;
            bottom: 15px;
            right: 25px;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        #next-button:hover {
            background: linear-gradient(135deg, #81d4fa, #039be5);
            transform: scale(1.05);
        }
        #page-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #555;
            z-index: 10;
        }
        /* 英単語をクリックしたときの翻訳ポップアップ */
        .vocab-word {
            color: #ffeb3b;
            text-decoration: underline dotted #ffeb3b;
            cursor: pointer;
            position: relative;
            font-weight: bold;
        }
        .vocab-word::after {
            content: attr(data-translation);
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid #ffeb3b;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.15s, visibility 0.15s;
            z-index: 100;
        }
        .vocab-word.show::after {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="game-outer">
    <div id="page-counter"><span id="current-page">1</span> / 13</div>
    
    <!-- 上：画像エリア（JavaScriptで自動的に画像を切り替えます） -->
    <div id="image-area"></div>
    
    <!-- 下：テキストウィンドウ -->
    <div id="text-window">
        <div id="speaker-name">Loading...</div>
        <div id="story-text-container">
            <p id="story-text"></p>
        </div>
        <button id="next-button" onclick="handleNext()">Next</button>
    </div>
</div>
