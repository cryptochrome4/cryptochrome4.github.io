<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Tier表単語帳 - 前編</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 {
      color: #00adb5;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
      font-size: 22px;
    }
    .word-card {
      background-color: #1e1e1e;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 5px solid #00adb5;
    }
    .word-name {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 5px;
    }
    .word-meaning {
      font-size: 14px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📘 【前編】Tier表専用コード（データ構造）</h1>

  <div class="word-card">
    <div class="word-name">tierList / tiers</div>
    <div class="word-meaning">【意味】SからGまでの各行（Tier）をまとめる最外殻の配列。</div>
  </div>

  <div class="word-card">
    <div class="word-name">tierName / label</div>
    <div class="word-meaning">【意味】各行の左端に表示する「S」「A」「B」などの文字列データ。</div>
  </div>

  <div class="word-card">
    <div class="word-name">tierColor / bgColor</div>
    <div class="word-meaning">【意味】Sは赤、Aはオレンジ、Bは黄など、各行の背景色を指定するデータ。</div>
  </div>

  <div class="word-card">
    <div class="word-name">items / characterList</div>
    <div class="word-meaning">【意味】そのTier（行）の中に今どの画像（キャラクター）が並んでいるかを管理する配列。</div>
  </div>
</div>

</body>
</html>
