    * {

        --accent-amber-dim: #a87400;
        --accent-red: #d64545;
        --accent-green: #4caf7d;
        --accent-cyan: #45b8c9;
        --grid-line: rgba(255, 176, 0, 0.04);
        --font-mono: 'IBM Plex Mono', 'SF Mono', 'Consolas', 'Courier New', monospace;

    }

            linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
            radial-gradient(ellipse at 50% 0%, #141a20 0%, #0a0c0e 70%);

        font-family: var(--font-sans);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 2rem 1rem 4rem;
        min-height: 100vh;
        line-height: 1.6;
    }

       MAIN FRAME
       ============================================================ */
    .rig {
        width: 100%;
        max-width: 960px;
        position: relative;
    }

        content: '';
        position: absolute;
        inset: -12px;
        border: 1px solid var(--metal-light);
        border-radius: 6px;
        pointer-events: none;
        opacity: 0.4;
        background:

    }

    .panel {
        background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
        border: 1px solid var(--metal-light);
        border-radius: 4px;
        position: relative;
        box-shadow:

        flex-direction: column;
        gap: 0.25rem;

    }

        font-weight: 700;
        letter-spacing: 0.35em;

        text-transform: uppercase;

        font-size: 0.7rem;
        letter-spacing: 0.5em;
        color: var(--text-dim);
        margin-top: 0.5rem;
        font-weight: 400;
        text-shadow: none;

        padding: 1.2rem 1.6rem;

        flex-direction: column;

        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        color: var(--text-dim);
        min-width: 200px;

        width: 100%;

       STATUS RAIL
       ============================================================ */

        display: flex;
        align-items: center;
        gap: 0;
        background: var(--metal-dark);
        border-bottom: 1px solid var(--metal-light);
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;

        background: var(--accent-green);

        color: var(--text-bright);

    }

        color: var(--text-bright);

       ============================================================ */

        position: relative;
        overflow: hidden;

        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255,176,0,0.06), transparent 60%);
        opacity: 0;
        transition: opacity 0.14s;
        pointer-events: none;

    .opt:hover:not(:disabled) {
        border-left-color: var(--accent-amber);
        border-color: #3f4c5c;
        transform: translateX(3px);
        box-shadow: 0 6px 18px -8px rgba(0,0,0,0.8);
    }

    .opt:hover:not(:disabled)::after {
        opacity: 1;
    }

    .opt:active:not(:disabled) {
        transform: translateX(3px) translateY(1px);
    }

    .opt:disabled {
        opacity: 0.35;
        cursor: default;
        filter: grayscale(0.6);

        font-size: 0.6rem;

        letter-spacing: 0.16em;
        color: var(--text-dim);

        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent-amber);
        background: transparent;
        border: 1px solid var(--accent-amber-dim);
        padding: 0.6rem 1.4rem;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.15s;

    .btn-reset:hover {
        background: rgba(255,176,0,0.1);
        border-color: var(--accent-amber);
        color: var(--accent-amber);
        box-shadow: 0 0 16px -4px rgba(255,176,0,0.5);
    }

    /* ============================================================
       TERMINAL LOG (history ticker)
       ============================================================ */
    .ticker {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        padding: 0.8rem 1.6rem;
        border-top: 1px solid var(--metal-light);
        background: #0d1116;
        max-height: 90px;
        overflow-y: auto;
        line-height: 1.7;

    .ticker .line {

    }

    .ticker .line .ts {
        color: var(--accent-amber-dim);
        margin-right: 0.6rem;
    }

    /* ============================================================
       WIN / END STATE
       ============================================================ */
    .endframe {
        padding: 2rem 2.2rem 2.4rem;
        border-top: 2px solid var(--accent-amber-dim);
        background: linear-gradient(180deg, rgba(255,176,0,0.05), transparent 60%);

    .endframe .banner {
        font-family: var(--font-mono);
        font-size: 1.3rem;
        letter-spacing: 0.25em;
        color: var(--accent-amber);
        text-transform: uppercase;

        padding: 1.2rem;

        background: rgba(255,176,0,0.06);
        text-shadow: 0 0 20px rgba(255,176,0,0.5);

    @keyframes glow {

    }

    .endframe .sub {
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.3em;
        color: var(--text-dim);
        margin-top: 1rem;
        text-transform: uppercase;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
        .stencil { font-size: 1.3rem; letter-spacing: 0.22em; }
        .plate-right { min-width: 100%; border-left: none; border-top: 1px solid var(--metal-light); align-items: flex-start; }
        .scene { padding: 1.4rem 1.2rem; }
        .scene-text { font-size: 0.95rem; }
        .options { padding: 0 1.2rem 1.6rem; }
        .opt-key { min-width: 2.6rem; padding: 1rem 0.7rem; font-size: 0.85rem; }
        .opt-label { font-size: 0.9rem; }
        .rail-cell { padding: 0.6rem 0.7rem; font-size: 0.6rem; }
    }
</style>
</head>

    // ----------------------------------------------------------------
    // STATE
    // ----------------------------------------------------------------
    const state = {
        nodeId: 'boot',
        history: ['boot'],
        currentAge: 30,
        currentRep: 0,
        currentThreat: 'LOW'
    };

    // ----------------------------------------------------------------
    // DOM REFS
    // ----------------------------------------------------------------
    const elSceneId = document.getElementById('sceneId');
    const elSceneTitle = document.getElementById('sceneTitle');
    const elSceneText = document.getElementById('sceneText');
    const elOptions = document.getElementById('options');
    const elTicker = document.getElementById('ticker');
    const elControlsInfo = document.getElementById('controlsInfo');
    const elRailNode = document.getElementById('railNode');
    const elRailAge = document.getElementById('railAge');
    const elRailRep = document.getElementById('railRep');
    const elRailThreat = document.getElementById('railThreat');
    const elRailThreatCell = document.getElementById('railThreatCell');
    const elRailSession = document.getElementById('railSession');
    const elBtnReset = document.getElementById('btnReset');

    // ----------------------------------------------------------------
    // TIMESTAMP for ticker lines (fake in-world clock)
    // ----------------------------------------------------------------
    function ts(index) {
        const base = new Date('2026-09-23T03:47:00Z').getTime();
        const t = new Date(base + index * 1000 * 60 * 47); // 47 min per entry
        const pad = (n) => String(n).padStart(2, '0');
        return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())} ${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}`;
    }

    function pushTicker(line) {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = `<span class="ts">[${ts(state.history.length)}]</span>${line}`;
        elTicker.appendChild(div);
        elTicker.scrollTop = elTicker.scrollHeight;
    }

    function clearTicker() {
        elTicker.innerHTML = '';
    }

    // ----------------------------------------------------------------
    // RENDER
    // ----------------------------------------------------------------
    function renderNode(id) {
        const node = NODES[id];
        if (!node) {
            console.error('Missing node:', id);
            return;
        }

        state.nodeId = id;

        // ---- scene head ----
        elSceneId.textContent = `NODE-${String(state.history.length - 1).padStart(3, '0')} · ${id.toUpperCase()}`;
        elSceneTitle.textContent = node.title;

        // ---- scene text ----
        elSceneText.innerHTML = formatText(node.text);

        // ---- rail ----
        const meta = node.meta || {};
        state.currentAge = meta.age != null ? meta.age : state.currentAge;
        state.currentRep = meta.rep != null ? meta.rep : state.currentRep;
        state.currentThreat = meta.threat != null ? meta.threat : state.currentThreat;

        elRailNode.textContent = id.toUpperCase();
        elRailAge.textContent = state.currentAge;
        elRailRep.textContent = state.currentRep;
        elRailThreat.textContent = state.currentThreat;

        // threat color
        elRailThreatCell.classList.remove('danger');
        if (state.currentThreat === 'HIGH' || state.currentThreat === 'CRITICAL' || state.currentThreat === 'LEGENDARY') {
            elRailThreatCell.classList.add('danger');
        }

        // ---- options ----
        elOptions.innerHTML = '';
        const choices = node.choices || [];

        if (node.end) {
            // terminal node — show end banner
            renderEndBanner(node);
            elControlsInfo.textContent = 'ROUTE TERMINATED · REBOOT TO TRY AGAIN';
            elRailSession.textContent = node.end.toUpperCase();
            pushTicker(`END STATE: ${node.endLabel || node.end.toUpperCase()}`);
        } else {
            const letters = ['A', 'B', 'C', 'D', 'E'];
            choices.forEach((choice, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt';
                btn.type = 'button';
                btn.innerHTML = `
                    <span class="opt-key">${letters[i] || '·'}</span>
                    <span class="opt-body">
                        <span class="opt-label">${escapeHtml(choice.label)}</span>
                        <span class="opt-tag">${escapeHtml(choice.tag || 'ROUTE')} → ${choice.next.toUpperCase()}</span>
                    </span>
                `;
                btn.addEventListener('click', () => choose(choice));
                elOptions.appendChild(btn);
            });
            elControlsInfo.textContent = `${choices.length} PATH${choices.length === 1 ? '' : 'S'} AVAILABLE · SELECT ONE`;
            elRailSession.textContent = 'LIVE';
        }
    }

    function choose(choice) {
        const node = NODES[state.nodeId];
        if (!node || !choice.next) return;

        // log
        pushTicker(`> ${choice.tag || 'CHOICE'} :: ${choice.label}`);

        state.history.push(choice.next);
        renderNode(choice.next);

        // scroll scene into view
        document.querySelector('.scene').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderEndBanner(node) {
        const banner = document.createElement('div');
        banner.className = 'endframe';
        banner.innerHTML = `
            <div class="banner">${escapeHtml(node.endLabel || node.end.toUpperCase())}</div>
            <div class="sub">REBOOT THE SIMULATION TO TRY A DIFFERENT PATH</div>
        `;
        // insert after options
        elOptions.appendChild(banner);
    }

    // ----------------------------------------------------------------
    // TEXT FORMATTING
    // ----------------------------------------------------------------
    function formatText(raw) {
        // Convert newlines to <br>, highlight some phrases.
        let out = escapeHtml(raw);
        out = out.replace(/\n/g, '<br>');

        // highlight quoted "..." lines in amber
        out = out.replace(/(&quot;|")([^"]{3,})(&quot;|")/g, (m) => {
            return `<span class="hl">${m}</span>`;
        });

        // highlight keywords
        out = out.replace(/\b(GRAVITON|ORACLE_9|GRAVITON_0)\b/g, '<span class="hl">$1</span>');
        out = out.replace(/\b(FAILED|FAIL|DANGER|DEAD|DIES|DEATH|TERMINAL|CRITICAL)\b/g, '<span class="warn">$1</span>');
        out = out.replace(/\b(COMPLETE|SUCCESS|CLEAN|PASSED|GOOD)\b/g, '<span class="good">$1</span>');
        out = out.replace(/\b(Kyle UZSXQ|Amara Okafor|Lena Voss|Vex)\b/g, '<span class="cy">$1</span>');

        return out;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ----------------------------------------------------------------
    // RESET
    // ----------------------------------------------------------------
    function resetGame() {
        state.nodeId = 'boot';
        state.history = ['boot'];
        state.currentAge = 30;
        state.currentRep = 0;
        state.currentThreat = 'LOW';
        clearTicker();
        elRailSession.textContent = 'LIVE';
        pushTicker('SESSION INITIALIZED · GRAVITON PROTOCOL · 2026-09-23 03:47 UTC');
        pushTicker('SUBJECT: Kyle UZSXQ · AGE 30 · OBJECTIVE: WORLD #1');
        renderNode('boot');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    elBtnReset.addEventListener('click', resetGame);

    // ----------------------------------------------------------------
    // INIT
    // ----------------------------------------------------------------
    pushTicker('SESSION INITIALIZED · GRAVITON PROTOCOL · 2026-09-23 03:47 UTC');
    pushTicker('SUBJECT: Kyle UZSXQ · AGE 30 · OBJECTIVE: WORLD #1');
    renderNode('boot');

})();
</script>
