<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thales — 2つの物語と解説会議</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; min-height:100vh;
    background:#0a1f1a;
    font-family:'Courier New', Courier, monospace;
    display:flex; justify-content:center; align-items:center;
    padding:16px;
  }
  .container {
    max-width:1080px; width:100%;
    background:#1e3b2f;
    border-radius:32px;
    padding:24px 24px 16px 24px;
    box-shadow:0 20px 30px rgba(0,0,0,.7), inset 0 0 0 2px #6b8f6b;
    border:4px solid #3d5e3d;
    position:relative;
    overflow:hidden;
  }
  .container::before {
    content:"";
    position:absolute; inset:0;
    background-image:url('img41x.jpg');
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
    opacity:0.15;
    filter:saturate(0.7) brightness(0.7);
    z-index:0;
    pointer-events:none;
  }
  .screen-area {
    position:relative;
    z-index:1;
    background:rgba(11,27,18,0.82);
    border-radius:20px;
    padding:16px 16px 10px 16px;
    border:6px solid #2b4a2b;
    box-shadow:inset 0 0 20px #00000080;
    backdrop-filter:blur(1px);
  }
  .main-row { display:flex; gap:12px; align-items:flex-start; }
  .canvas-wrapper { position:relative; flex:1 1 auto; min-width:0; }
  canvas#mainCanvas {
    display:block; width:100%; height:auto;
    image-rendering:crisp-edges;
    image-rendering:pixelated;
    background:#132a1d;
    border-radius:12px;
    border:4px solid #3f6b3f;
    box-shadow:0 0 0 2px #1d331d;
    cursor:pointer;
  }
  .opening-overlay {
    position:absolute; inset:0;
    display:flex; justify-content:center; align-items:center;
    background:rgba(10,31,26,0.78);
    border-radius:12px; z-index:5;
    backdrop-filter:blur(3px);
    transition:opacity .5s;
  }
  .opening-overlay.hidden { display:none; }
  .opening-buttons { display:flex; flex-direction:column; gap:28px; z-index:10; }
  .opening-buttons button {
    background:#1d331d;
    border:5px solid #8fbc8f;
    color:#f0f7e0;
    font-family:'Courier New', monospace;
    font-size:2rem; font-weight:bold;
    padding:16px 48px; border-radius:60px;
    letter-spacing:3px;
    text-shadow:2px 2px 0 #0a1f1a;
    box-shadow:0 10px 0 #0b1b12, 0 0 0 4px #2b4a2b;
    transition:all .08s linear;
    cursor:pointer; min-width:280px;
    image-rendering:pixelated;
  }
  .opening-buttons button:hover {
    background:#2f552f; border-color:#c1e0c1;
    transform:translateY(-2px);
    box-shadow:0 12px 0 #0b1b12, 0 0 0 4px #3f6b3f;
  }
  .opening-buttons button:active {
    transform:translateY(6px);
    box-shadow:0 4px 0 #0b1b12, 0 0 0 4px #2b4a2b;
  }
  .back-btn {
    position:absolute; top:12px; left:12px;
    z-index:20; background:#2b4a2b; color:#d4edc9;
    border:3px solid #8fbc8f; border-radius:30px;
    padding:6px 18px;
    font-family:'Courier New', monospace;
    font-size:1rem; font-weight:bold;
    cursor:pointer; display:none;
    box-shadow:0 4px 0 #0b1b12;
  }
  .back-btn.visible { display:block; }
  .back-btn:active { transform:translateY(3px); box-shadow:0 0 0 #0b1b12; }

  .log-panel {
    flex:0 0 320px;
    display:none; flex-direction:column;
    max-height:360px;
    background:rgba(6,18,12,0.92);
    border:4px solid #3f6b3f; border-radius:12px;
    box-shadow:0 0 0 2px #1d331d, inset 0 0 20px #00000080;
    overflow:hidden;
  }
  .log-panel.visible { display:flex; }
  .log-header {
    padding:8px 12px; background:#1d331d;
    color:#f0e6b0; font-weight:bold;
    font-size:0.95rem; letter-spacing:1px;
    border-bottom:2px solid #3f6b3f;
    display:flex; justify-content:space-between; align-items:center;
  }
  .log-header .live {
    width:10px; height:10px; border-radius:50%;
    background:#ff4444; box-shadow:0 0 8px #ff4444;
    animation:pulse 1.2s infinite;
  }
  .log-body {
    flex:1 1 auto; overflow-y:auto;
    padding:10px 12px;
    font-size:0.86rem; line-height:1.5;
    color:#cfe8cf;
    scrollbar-width:thin;
    scrollbar-color:#3f6b3f #0b1b12;
  }
  .log-body::-webkit-scrollbar { width:8px; }
  .log-body::-webkit-scrollbar-track { background:#0b1b12; }
  .log-body::-webkit-scrollbar-thumb { background:#3f6b3f; border-radius:4px; }
  .log-entry {
    margin-bottom:10px; padding-bottom:8px;
    border-bottom:1px dashed rgba(107,143,107,0.35);
    animation:fadeIn .6s ease;
  }
  .log-entry:last-child { border-bottom:none; }
  .log-speaker { font-weight:bold; margin-right:6px; }
  .log-text { color:#e8f5e0; }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* ===== ペット部屋（ロバ部屋） ===== */
  .pet-room {
    flex:0 0 320px;
    display:none;
    flex-direction:column;
    max-height:260px;
    margin-top:12px;
    background:rgba(6,18,12,0.92);
    border:4px solid #6b4a2b;
    border-radius:12px;
    box-shadow:0 0 0 2px #3a2a1a, inset 0 0 20px #00000080;
    overflow:hidden;
  }
  .pet-room.visible { display:flex; }
  .pet-header {
    padding:6px 12px;
    background:#3a2a1a;
    color:#e8d0a0;
    font-weight:bold;
    font-size:0.85rem;
    letter-spacing:1px;
    border-bottom:2px solid #6b4a2b;
    display:flex; justify-content:space-between; align-items:center;
  }
  .pet-header .hint { font-size:0.72rem; color:#b09060; font-weight:normal; }
  canvas#petCanvas {
    display:block;
    width:100%;
    height:180px;
    background:#1a2a1a;
    image-rendering:pixelated;
    cursor:pointer;
  }
  .pet-footer {
    padding:4px 10px;
    background:#1d2a1d;
    color:#c0d0c0;
    font-size:0.75rem;
    display:flex; justify-content:space-between;
    border-top:2px solid #3a2a1a;
  }

  .footer {
    position:relative; z-index:1;
    margin-top:16px;
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px;
    background:#1e3b2f;
    border-radius:40px;
    border:2px solid #4c7a4c;
    min-height:70px;
    transition:all .3s ease;
  }
  .footer-left {
    color:#b8d9b8; font-weight:bold; letter-spacing:1px;
    font-size:1.0rem;
    display:flex; flex-direction:column; gap:4px;
  }
  .footer-left .title-row { display:flex; gap:12px; align-items:center; }
  .footer-left .dot {
    width:12px; height:12px;
    background:#f0c45a; border-radius:50%;
    box-shadow:0 0 12px #f0c45a;
    animation:pulse 1.5s infinite;
    flex:0 0 auto;
  }
  .footer-left .sub-link-row {
    font-size:0.9rem; color:#a0c8a0;
    padding-left:24px; min-height:1.2em;
  }
  .footer-left .sub-link-row a {
    color:#ffe08a; text-decoration:none;
    border-bottom:1px dashed #ffe08a;
  }
  .footer-left .sub-link-row a:hover { color:#fff; border-bottom-color:#fff; }
  @keyframes pulse {
    0%{opacity:.6; transform:scale(.9);} 50%{opacity:1; transform:scale(1.2);} 100%{opacity:.6; transform:scale(.9);}
  }
  .vertical-link {
    background:#2b4a2b;
    padding:10px 24px; border-radius:30px;
    color:#d4edc9; text-decoration:none;
    font-weight:bold; font-size:1.05rem;
    letter-spacing:1px;
    border:2px solid #6b8f6b;
    transition:all .2s;
    box-shadow:0 4px 0 #0b1b12;
    opacity:0; pointer-events:none;
    transform:translateY(6px);
    transition:opacity .4s, transform .4s;
  }
  .vertical-link.visible {
    opacity:1; pointer-events:auto; transform:translateY(0);
  }
  .vertical-link:hover {
    background:#3f6b3f; color:#fff; border-color:#b8d9b8;
  }
  .vertical-link:active {
    transform:translateY(4px); box-shadow:0 0 0 #0b1b12;
  }

  /* ロバのセリフ（画面上部） */
  .donkey-speech {
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    z-index:30;
    background:rgba(255,254,240,0.96);
    color:#1a2e1a;
    padding:10px 22px;
    border-radius:14px;
    border:3px solid #6b4a2b;
    box-shadow:0 6px 0 rgba(0,0,0,0.4);
    font-size:1.0rem;
    font-weight:bold;
    max-width:80%;
    text-align:center;
    display:none;
    pointer-events:none;
    line-height:1.4;
  }
  .donkey-speech.visible { display:block; animation:speechPop .3s ease; }
  .donkey-speech::after {
    content:"";
    position:absolute;
    bottom:-14px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:14px solid #6b4a2b;
  }
  @keyframes speechPop {
    from { transform:translateX(-50%) scale(0.8); opacity:0; }
    to   { transform:translateX(-50%) scale(1); opacity:1; }
  }

  @media (max-width:820px) {
    .main-row { flex-direction:column; }
    .log-panel { flex:0 0 auto; width:100%; max-height:240px; }
    .pet-room { flex:0 0 auto; width:100%; max-height:240px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="screen-area">
    <div class="main-row">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas" width="800" height="400"></canvas>
        <button class="back-btn" id="backBtn">← 戻る</button>
        <div class="opening-overlay" id="openingOverlay">
          <div class="opening-buttons">
            <button id="derivativeBtn">derivative</button>
            <button id="asinusBtn">Asinus</button>
          </div>
        </div>
        <div class="donkey-speech" id="donkeySpeech"></div>
      </div>
      <aside class="log-panel" id="logPanel">
        <div class="log-header">
          <span>解説会議 — LIVE</span>
          <span class="live"></span>
        </div>
        <div class="log-body" id="logBody"></div>
      </aside>
    </div>
    <!-- ペット部屋（ロバ部屋） -->
    <div class="pet-room" id="petRoom">
      <div class="pet-header">
        <span>🐴 ロバ部屋</span>
        <span class="hint">餌箱・水場・頭をクリック</span>
      </div>
      <canvas id="petCanvas" width="320" height="180"></canvas>
      <div class="pet-footer">
        <span id="petStatus">餌:0 / 水:なし / なで:0</span>
        <span id="petMood">ロバはのんびりしている</span>
      </div>
    </div>
  </div>
  <div class="footer" id="footer">
    <div class="footer-left">
      <div class="title-row">
        <span class="dot"></span>
        <span id="footerTitle">タレスの2つの物語</span>
      </div>
      <div class="sub-link-row" id="footerSub"></div>
    </div>
    <div class="footer-right">
      <a href="vertical.html" class="vertical-link" id="verticalLink" target="_self">↕ vertical.html</a>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';

  /* ============================================================
     基本セットアップ
     ============================================================ */
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const petCanvas = document.getElementById('petCanvas');
  const petCtx = petCanvas.getContext('2d');
  petCtx.imageSmoothingEnabled = false;

  const openingOverlay = document.getElementById('openingOverlay');
  const derivativeBtn = document.getElementById('derivativeBtn');
  const asinusBtn = document.getElementById('asinusBtn');
  const backBtn = document.getElementById('backBtn');
  const verticalLink = document.getElementById('verticalLink');
  const footerTitle = document.getElementById('footerTitle');
  const footerSub = document.getElementById('footerSub');
  const logPanel = document.getElementById('logPanel');
  const logBody = document.getElementById('logBody');
  const petRoom = document.getElementById('petRoom');
  const petStatus = document.getElementById('petStatus');
  const petMood = document.getElementById('petMood');
  const donkeySpeech = document.getElementById('donkeySpeech');

  let animationId = null;
  let startTime = null;
  let currentStory = null;
  let isAnimating = false;
  let footerLinkVisible = false;
  let phase = 'opening';
  let intermissionStart = 0;

  const STORIES = {
    derivative: { duration: 14000, label: 'タレスの圧搾機 · デリバティブの嚆矢' },
    asinus:     { duration: 16000, label: 'Asinus · 塩を運ぶろばとタレス' }
  };

  /* ============================================================
     後編との接続口（フック）
     ============================================================ */
  window.__PHASE2__ = {
    onEvent: null,     // イベント発生時に呼ぶ (targetKey, eventType, data)
    tickPetRoom: null, // ペット部屋の毎フレーム追加描画（後編で使うかも）
    onDonkeyMounted: null, // 知識マウント時 (targetKey, knowledgeText)
    getEventFor: null  // ターゲットに応じたイベント名を返す（後編で差し替え可）
  };

  /* ============================================================
     ユーティリティ
     ============================================================ */
  function px(c, x, y, w, h, color) {
    c.fillStyle = color;
    c.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }
  function pixelText(c, text, x, y, size, color, align) {
    align = align || 'left';
    c.font = 'bold ' + size + 'px "Courier New", monospace';
    c.textAlign = align; c.textBaseline = 'middle';
    c.lineWidth = 6; c.strokeStyle = '#0b1b12';
    c.strokeText(text, x, y);
    c.fillStyle = color; c.fillText(text, x, y);
  }
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2*r) r = w/2; if (h < 2*r) r = h/2;
      this.beginPath();
      this.moveTo(x+r, y);
      this.arcTo(x+w, y, x+w, y+h, r);
      this.arcTo(x+w, y+h, x, y+h, r);
      this.arcTo(x, y+h, x, y, r);
      this.arcTo(x, y, x+w, y, r);
      this.closePath(); return this;
    };
  }
  function drawSpeechBubble(c, x, y, w, h, text, tailDir) {
    c.fillStyle = 'rgba(0,0,0,0.3)';
    c.beginPath(); c.roundRect(x+3, y+3, w, h, 10); c.fill();
    c.fillStyle = '#fffef0';
    c.beginPath(); c.roundRect(x, y, w, h, 10); c.fill();
    c.strokeStyle = '#3d5e3d'; c.lineWidth = 3; c.stroke();
    c.fillStyle = '#fffef0';
    c.beginPath();
    if (tailDir === 'left') {
      c.moveTo(x, y+h*0.5); c.lineTo(x-14, y+h*0.5+10); c.lineTo(x, y+h*0.5+18);
    } else {
      c.moveTo(x+w, y+h*0.5); c.lineTo(x+w+14, y+h*0.5+10); c.lineTo(x+w, y+h*0.5+18);
    }
    c.closePath(); c.fill();
    c.strokeStyle = '#3d5e3d'; c.stroke();
    c.font = 'bold 15px "Courier New", monospace';
    c.fillStyle = '#1a2e1a';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const lines = text.split('\n');
    lines.forEach(function(line, i){
      c.fillText(line, x + w/2, y + h/2 + (i - (lines.length-1)/2) * 20);
    });
  }
  function getSpeakerColor(key) {
    switch(key) {
      case 'bunseki':   return '#ff5555';
      case 'butsuri':   return '#55dd55';
      case 'tetsugaku': return '#bbbbbb';
      case 'senmon':    return '#c77dff';
      case 'gendai':    return '#ffd93d';
      case 'sugaku':    return '#5aa9ff';
      default:          return '#ffffff';
    }
  }
  function randPick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

  /* ============================================================
     背景・キャラ描画（前編と同じ）
     ============================================================ */
  function drawSkyBase(progress, palette) {
    const g = ctx.createLinearGradient(0, 0, 0, 400);
    let c0, c1, c2;
    if (progress < 0.35) { c0 = palette.spring[0]; c1 = palette.spring[1]; c2 = palette.spring[2]; }
    else if (progress < 0.7) { c0 = palette.summer[0]; c1 = palette.summer[1]; c2 = palette.summer[2]; }
    else { c0 = palette.autumn[0]; c1 = palette.autumn[1]; c2 = palette.autumn[2]; }
    g.addColorStop(0, c0); g.addColorStop(0.55, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 400);
  }
  function drawSun(progress, yBase) {
    const sunX = 700 - progress * 500;
    const sunY = (yBase || 80) + Math.sin(progress * Math.PI) * 40;
    ctx.fillStyle = progress < 0.5 ? '#fff9c4' : '#ffd966';
    ctx.beginPath(); ctx.arc(sunX, sunY, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,0.30)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 44, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,0.15)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 62, 0, Math.PI*2); ctx.fill();
  }
  function drawClouds(progress, alpha) {
    ctx.fillStyle = 'rgba(255,255,255,' + (alpha || 0.7) + ')';
    for (let i=0;i<5;i++){
      const cx = ((i*190 + progress*130) % 950) - 80;
      const cy = 40 + i*22 + Math.sin(i*1.7)*8;
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI*2);
      ctx.arc(cx+22, cy-6, 18, 0, Math.PI*2);
      ctx.arc(cx+42, cy, 20, 0, Math.PI*2);
      ctx.arc(cx+18, cy+8, 16, 0, Math.PI*2);
      ctx.fill();
    }
  }
  function drawMountains(progress, colorSpring, colorAutumn) {
    ctx.fillStyle = progress < 0.6 ? colorSpring : colorAutumn;
    ctx.beginPath();
    ctx.moveTo(0, 260); ctx.lineTo(120, 160); ctx.lineTo(260, 230);
    ctx.lineTo(420, 130); ctx.lineTo(600, 220); ctx.lineTo(740, 150);
    ctx.lineTo(800, 200); ctx.lineTo(800, 400); ctx.lineTo(0, 400);
    ctx.closePath(); ctx.fill();
    if (progress < 0.25) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      [[120,160],[420,130],[740,150]].forEach(function(p){
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0]+20, p[1]+22); ctx.lineTo(p[0]-20, p[1]+22);
        ctx.closePath(); ctx.fill();
      });
    }
  }
  function drawGround(progress, springColor, autumnColor) {
    ctx.fillStyle = progress < 0.65 ? springColor : autumnColor;
    ctx.fillRect(0, 340, 800, 60);
    for (let i=0;i<80;i++){
      const gx = (i*13) % 800;
      const gh = 3 + (i%4)*3;
      ctx.fillStyle = progress < 0.65 ? '#3a7a3a' : '#8a6a2a';
      px(ctx, gx, 340 - gh, 2, gh, ctx.fillStyle);
    }
    if (progress < 0.35) {
      for (let i=0;i<14;i++){
        const fx = (i*57 + 20) % 800;
        const fy = 332 + (i%3)*3;
        ctx.fillStyle = ['#ffb6c1','#fffacd','#e6e6fa'][i%3];
        px(ctx, fx, fy, 3, 3, ctx.fillStyle);
      }
    }
  }
  function drawProgressBar(progress) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(30, 95, 200, 10);
    ctx.fillStyle = '#f0c45a';
    ctx.fillRect(30, 95, 200 * progress, 10);
  }

  /* ============================================================
     話1: derivative
     ============================================================ */
  function drawOliveTree(c, baseX, baseY, scale, ripeness, sway) {
    const trunkColor = '#6b4e3a';
    const leafColor = ripeness > 0.7 ? '#2d6a2d' : '#3a8a3a';
    const oliveColor = ripeness > 0.8 ? '#2f2f1f' : '#7aa05a';
    px(c, baseX - 6*scale, baseY - 40*scale, 12*scale, 40*scale, trunkColor);
    c.fillStyle = leafColor;
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + sway;
      const rx = baseX + Math.cos(angle) * (28 + Math.sin(sway*2 + i)) * scale;
      const ry = baseY - 50*scale + Math.sin(angle) * 18 * scale;
      c.beginPath(); c.arc(rx, ry, 12*scale, 0, Math.PI*2); c.fill();
    }
    px(c, baseX - 2*scale, baseY - 38*scale, 3*scale, 34*scale, '#8b6a4a');
    if (ripeness > 0.3) {
      c.fillStyle = oliveColor;
      for (let i = 0; i < 7; i++) {
        const ox = baseX - 22*scale + i * 8 * scale;
        const oy = baseY - 60*scale + (i%3)*6*scale + Math.sin(sway + i)*2;
        c.beginPath(); c.arc(ox, oy, 3.5*scale, 0, Math.PI*2); c.fill();
        if (ripeness > 0.8) px(c, ox - 1*scale, oy - 1*scale, 1.5*scale, 1.5*scale, '#5a5a3a');
      }
    }
  }
  function drawPressMachine(c, x, y, scale, isRented) {
    const machineColor = isRented ? '#b8860b' : '#5a5a5a';
    const accentColor = isRented ? '#d4a017' : '#3a3a3a';
    c.fillStyle = 'rgba(0,0,0,0.25)';

    px(c, x + 12*scale, y - 40*scale, 8*scale, 30*scale, accentColor);

  function drawThalesOlive(c, x, y, scale, phase, mood) {
    c.fillStyle = 'rgba(0,0,0,0.25)';
    c.beginPath(); c.ellipse(x, y + 22*scale, 16*scale, 5*scale, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#f5deb3';
    c.beginPath(); c.arc(x, y - 20*scale, 10*scale, 0, Math.PI*2); c.fill();
    c.fillStyle = '#d2b48c';
    c.beginPath(); c.ellipse(x, y - 10*scale, 7*scale, 4*scale, 0, 0, Math.PI*2); c.fill();
    px(c, x - 4*scale, y - 24*scale, 2*scale, 2*scale, '#000');
    px(c, x + 2*scale, y - 24*scale, 2*scale, 2*scale, '#000');
    c.fillStyle = '#4a6b8a';
    c.beginPath(); c.ellipse(x, y, 14*scale, 18*scale, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#e8e8d8';
    c.fillRect(x - 14*scale, y + 4*scale, 28*scale, 4*scale);
    c.strokeStyle = '#4a6b8a'; c.lineWidth = 5*scale; c.lineCap = 'round';
    const armSwing = Math.sin(phase) * 0.3;
    c.beginPath(); c.moveTo(x - 12*scale, y - 6*scale); c.lineTo(x - 24*scale, y - 2*scale + armSwing*10*scale); c.stroke();
    c.beginPath(); c.moveTo(x + 12*scale, y - 6*scale); c.lineTo(x + 24*scale, y - 2*scale - armSwing*10*scale); c.stroke();
    c.strokeStyle = '#8b5a2b'; c.lineWidth = 4*scale;
    c.beginPath(); c.moveTo(x + 24*scale, y - 2*scale - armSwing*10*scale); c.lineTo(x + 28*scale, y + 26*scale); c.stroke();
  }
  function drawStarsAndTelescope(c, progress) {
    for (let i = 0; i < 30; i++) {
      const sx = (i * 47 + 13) % 750 + 20;
      const sy = (i * 29) % 200 + 20;
      const size = 1 + (i % 3);
      const twinkle = 0.6 + 0.4 * Math.sin(progress*20 + i*3);
      c.fillStyle = 'rgba(255,249,196,' + twinkle + ')';
      c.fillRect(sx, sy, size, size);
    }
    c.fillStyle = '#f0e68c';
    c.beginPath(); c.arc(700, 60, 22, 0, Math.PI*2); c.fill();
    c.fillStyle = 'rgba(240,230,140,0.25)';
    c.beginPath(); c.arc(700, 60, 36, 0, Math.PI*2); c.fill();
    px(c, 120, 180, 40, 8, '#8b5a2b');
    px(c, 140, 160, 8, 40, '#8b5a2b');
    c.fillStyle = '#708090';
    c.beginPath();
    c.moveTo(160, 180); c.lineTo(200, 140); c.lineTo(210, 150); c.lineTo(170, 190);
    c.fill();
    c.strokeStyle = '#5a3a1a'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(150, 200); c.lineTo(130, 230); c.stroke();
    c.beginPath(); c.moveTo(150, 200); c.lineTo(170, 230); c.stroke();
  }
  function drawDerivativeScene(progress) {
    const skyGradient = ctx.createLinearGradient(0, 0, 0, 400);
    if (progress < 0.3) {
      skyGradient.addColorStop(0, '#0a1f2a');
      skyGradient.addColorStop(0.55, '#1a3a4a');
      skyGradient.addColorStop(1, '#2a4a3a');
    } else if (progress < 0.65) {
      skyGradient.addColorStop(0, '#3a6b8a');
      skyGradient.addColorStop(0.55, '#7aa87a');
      skyGradient.addColorStop(1, '#a8c88a');
    } else {
      skyGradient.addColorStop(0, '#b87c4b');
      skyGradient.addColorStop(0.55, '#dbb87c');
      skyGradient.addColorStop(1, '#e8c89a');
    }
    ctx.fillStyle = skyGradient; ctx.fillRect(0, 0, 800, 400);
    if (progress < 0.4) drawStarsAndTelescope(ctx, progress);
    if (progress > 0.25) drawSun(progress, 70);
    if (progress > 0.3) drawClouds(progress, 0.55);
    ctx.fillStyle = progress < 0.65 ? '#6b8e6b' : '#8b7d4b';
    ctx.beginPath();
    ctx.moveTo(0, 260); ctx.lineTo(120, 160); ctx.lineTo(260, 230);
    ctx.lineTo(420, 130); ctx.lineTo(600, 220); ctx.lineTo(740, 150);
    ctx.lineTo(800, 200); ctx.lineTo(800, 400); ctx.lineTo(0, 400);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = progress < 0.65 ? '#3a5a3a' : '#8b7d4b';
    ctx.fillRect(0, 280, 800, 120);
    for (let i=0;i<70;i++){
      const gx = (i*15) % 800;
      const gh = 3 + (i%4)*3;
      ctx.fillStyle = progress < 0.65 ? '#2a6a2a' : '#7a5a2a';
      px(ctx, gx, 280 - gh, 2, gh, ctx.fillStyle);
    }
    const sway = Math.sin(progress * Math.PI * 4) * 0.15;
    [100, 260, 460, 640].forEach(function(x){
      const ripeness = Math.min(1, Math.max(0, (progress - 0.45) * 2.2));
      drawOliveTree(ctx, x, 280, 0.9, ripeness, sway);
    });
    [90, 210, 380, 520, 660].forEach(function(x, idx){
      drawPressMachine(ctx, x, 260, 0.8, idx < 3);
    });
    let thalesX = 200 + progress * 400;
    if (progress < 0.2) thalesX = 180;
    else if (progress > 0.8) thalesX = 600 - (progress - 0.8) * 100;
    drawThalesOlive(ctx, thalesX, 250, 1.2, progress * Math.PI * 4, progress);
    if (progress > 0.55) {
      const crowdAlpha = Math.min(1, (progress - 0.55) * 3);
      ctx.globalAlpha = crowdAlpha;
      for (let i = 0; i < 6; i++) {
        const cx = 480 + i * 55;
        const cy = 260 + Math.sin(i*1.3) * 8;
        ctx.fillStyle = ['#4a6b8a','#6b4a3a','#3a6b4a','#6b3a5a','#5a5a8a','#8a6a3a'][i%6];
        ctx.beginPath(); ctx.arc(cx, cy - 20, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(cx - 8, cy - 12, 16, 20);
        ctx.fillStyle = '#f5deb3';
        ctx.beginPath(); ctx.arc(cx, cy - 24, 6, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1.0;
    }
    if (progress > 0.78) {
      const goldAlpha = Math.min(1, (progress - 0.78) * 4);
      for (let i = 0; i < 20; i++) {
        const gx = 580 + Math.sin(i * 1.5 + progress * 12) * 100;
        const gy = 200 + Math.cos(i * 2.3 + progress * 8) * 60;
        ctx.fillStyle = 'rgba(255,215,0,' + goldAlpha + ')';
        ctx.beginPath(); ctx.arc(gx, gy, 4 + (i % 3), 0, Math.PI*2); ctx.fill();
        if (i % 4 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,' + goldAlpha*0.8 + ')';
          px(ctx, gx - 1, gy - 8, 2, 16, ctx.fillStyle);
          px(ctx, gx - 8, gy - 1, 16, 2, ctx.fillStyle);
        }
      }
    }
    pixelText(ctx, 'DERIVATIVE', 30, 40, 28, '#f0e6b0');
    pixelText(ctx, '— タレスのオリーブ圧搾機 —', 40, 72, 14, '#cfe8cf');
    let chapter = '', chapterColor = '#fff9e6';
    if (progress < 0.18) chapter = '第一章：冬 — 天文学の観測';
    else if (progress < 0.4) chapter = '第二章：圧搾機を借り占める';
    else if (progress < 0.65) chapter = '第三章：豊作の予感';
    else if (progress < 0.85) chapter = '第四章：莫大な利益';
    else { chapter = '終章：欲すれば富は可能、されど関心なし'; chapterColor = '#ffe0a0'; }
    pixelText(ctx, chapter, 40, 110, 18, chapterColor);
    drawProgressBar(progress);
    if (progress > 0.1 && progress < 0.28) drawSpeechBubble(ctx, 80, 180, 250, 60, 'タレス「来年は豊作だ」', 'left');
    else if (progress > 0.35 && progress < 0.5) drawSpeechBubble(ctx, 80, 180, 270, 70, 'タレス「全ての圧搾機を\n借りておこう」', 'left');
    else if (progress > 0.7 && progress < 0.82) drawSpeechBubble(ctx, 80, 180, 280, 80, '人々「圧搾機を貸してくれ！」\nタレス「さあ、どうぞ」', 'left');
    else if (progress > 0.88) drawSpeechBubble(ctx, 80, 180, 300, 80, 'タレス「欲すれば富は可能。\nされど我が関心は別にあり」', 'left');
  }

  function drawBackgroundAsinus(progress) {
    drawSkyBase(progress, {
      spring: ['#87ceeb', '#b0e0e6', '#98fb98'],

    });

    ctx.quadraticCurveTo(600, 320, 800, 300);

  function drawMarketStall(c, x, y, s, color) {
    c.fillStyle = 'rgba(0,0,0,0.2)';
    c.beginPath(); c.ellipse(x, y + 2*s, 34*s, 6*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(x-30*s, y-30*s); c.lineTo(x+30*s, y-30*s);
    c.lineTo(x+20*s, y-45*s); c.lineTo(x-20*s, y-45*s);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i=0;i<5;i++){
      c.beginPath();
      c.moveTo(x-26*s + i*12*s, y-30*s);
      c.lineTo(x-22*s + i*12*s, y-30*s);
      c.lineTo(x-18*s + i*12*s, y-45*s);
      c.lineTo(x-22*s + i*12*s, y-45*s);
      c.closePath(); c.fill();
    }
    px(c, x-22*s, y-30*s, 5*s, 30*s, '#8b5a2b');
    px(c, x+17*s, y-30*s, 5*s, 30*s, '#8b5a2b');
    c.fillStyle = '#d4a017';
    c.beginPath(); c.ellipse(x, y-5*s, 18*s, 8*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#e8c050';
    for (let i=0;i<4;i++){ c.beginPath(); c.arc(x-12*s + i*8*s, y-8*s, 3*s, 0, Math.PI*2); c.fill(); }
  }
  function drawThalesAsinus(c, x, y, s, phase, walking) {
    const bob = walking ? Math.sin(phase*2)*2 : 0;
    y += bob;
    c.fillStyle = 'rgba(0,0,0,0.2)';
    c.beginPath(); c.ellipse(x, y + 22*s, 15*s, 5*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#f5deb3';
    c.beginPath(); c.arc(x, y-22*s, 11*s, 0, Math.PI*2); c.fill();
    c.fillStyle = '#d2b48c';
    c.beginPath(); c.ellipse(x, y-10*s, 8*s, 5*s, 0, 0, Math.PI*2); c.fill();
    px(c, x-5*s, y-26*s, 3*s, 3*s, '#000');
    px(c, x+2*s, y-26*s, 3*s, 3*s, '#000');
    c.fillStyle = '#f0f0e0';
    c.beginPath(); c.ellipse(x, y, 15*s, 20*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#4a6b8a';
    c.fillRect(x-15*s, y+2*s, 30*s, 6*s);
    c.strokeStyle = '#f5deb3'; c.lineWidth = 5*s; c.lineCap = 'round';
    const armSwing = walking ? Math.sin(phase*2)*0.5 : 0.2;
    c.beginPath(); c.moveTo(x-12*s, y-8*s); c.lineTo(x-26*s, y-2*s + armSwing*14*s); c.stroke();
    c.beginPath(); c.moveTo(x+12*s, y-8*s); c.lineTo(x+26*s, y-2*s - armSwing*14*s); c.stroke();
    c.strokeStyle = '#8b5a2b'; c.lineWidth = 4*s;
    c.beginPath(); c.moveTo(x+26*s, y-2*s - armSwing*14*s); c.lineTo(x+30*s, y+30*s); c.stroke();
  }
  function drawDonkey(c, x, y, s, phase, walking, burden, burdenType) {
    const bob = walking ? Math.sin(phase*2)*2 : 0;
    y += bob;
    c.fillStyle = 'rgba(0,0,0,0.2)';
    c.beginPath(); c.ellipse(x, y + 30*s, 26*s, 6*s, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#6b5a4a'; c.lineWidth = 4*s; c.lineCap = 'round';
    const legSwing = walking ? Math.sin(phase*2)*0.6 : 0;
    c.beginPath(); c.moveTo(x-14*s, y+10*s); c.lineTo(x-16*s + legSwing*8*s, y+28*s); c.stroke();
    c.beginPath(); c.moveTo(x-6*s, y+10*s); c.lineTo(x-4*s - legSwing*8*s, y+28*s); c.stroke();
    c.beginPath(); c.moveTo(x+6*s, y+10*s); c.lineTo(x+8*s + legSwing*8*s, y+28*s); c.stroke();
    c.beginPath(); c.moveTo(x+14*s, y+10*s); c.lineTo(x+16*s - legSwing*8*s, y+28*s); c.stroke();
    px(c, x-17*s + legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    px(c, x-5*s - legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    px(c, x+7*s + legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    px(c, x+15*s - legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    c.fillStyle = '#8b7355';
    c.beginPath(); c.ellipse(x, y, 22*s, 13*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#a08a6a';
    c.beginPath(); c.ellipse(x, y+3*s, 18*s, 8*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#8b7355';
    c.beginPath(); c.ellipse(x-18*s, y-10*s, 9*s, 16*s, -0.4, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(x-26*s, y-22*s, 10*s, 9*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#7a6345';
    c.beginPath(); c.ellipse(x-33*s, y-20*s, 4*s, 3*s, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#8b7355';
    c.beginPath(); c.ellipse(x-30*s, y-32*s, 3*s, 8*s, -0.2, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(x-24*s, y-33*s, 3*s, 8*s, 0.2, 0, Math.PI*2); c.fill();
    c.fillStyle = '#c0a080';
    c.beginPath(); c.ellipse(x-30*s, y-32*s, 1.5*s, 5*s, -0.2, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(x-24*s, y-33*s, 1.5*s, 5*s, 0.2, 0, Math.PI*2); c.fill();
    px(c, x-30*s, y-24*s, 2.5*s, 2.5*s, '#000');
    px(c, x-34*s, y-20*s, 3*s, 2*s, '#4a3a2a');
    c.strokeStyle = '#6b5a4a'; c.lineWidth = 3*s;
    c.beginPath();
    c.moveTo(x+22*s, y-4*s);
    c.quadraticCurveTo(x+30*s, y-8*s + Math.sin(phase*3)*4*s, x+28*s, y+2*s);
    c.stroke();
    c.fillStyle = '#4a3a2a';
    c.beginPath(); c.arc(x+28*s, y+2*s, 3*s, 0, Math.PI*2); c.fill();

      c.fillStyle = '#f5f5f0';
      c.beginPath(); c.ellipse(x+2*s, y-16*s, 14*s, 9*s, 0, 0, Math.PI*2); c.fill();
      c.fillStyle = '#dcdcd0';
      c.beginPath(); c.ellipse(x+2*s, y-18*s, 10*s, 6*s, 0, 0, Math.PI*2); c.fill();
      c.strokeStyle = '#8b6a4a'; c.lineWidth = 2*s;
      c.beginPath(); c.moveTo(x-4*s, y-24*s); c.lineTo(x+8*s, y-24*s); c.stroke();
      c.fillStyle = '#ffffff';
      for (let i=0;i<5;i++) px(c, x-8*s + i*5*s, y-22*s - (i%2)*3*s, 2*s, 2*s, '#fff');
    } else if (burdenType === 'sponge' && burden) {
      c.fillStyle = '#d4b86a';
      for (let i=0;i<4;i++){ c.beginPath(); c.arc(x-10*s + i*8*s, y-18*s + (i%2)*3*s, 8*s, 0, Math.PI*2); c.fill(); }
      c.fillStyle = '#a08040';
      for (let i=0;i<8;i++) px(c, x-14*s + i*5*s, y-22*s + (i%4)*4*s, 2*s, 2*s, '#a08040');

  }

  let confLines = [];
  let confIndex = 0;
  let confTyping = '';
  let confFull = '';
  let confSpeaker = null;
  let confLastTick = 0;
  let confCharDelay = 90;
  let confPauseUntil = 0;
  let confEndTime = 0;
  let confNextStart = 0;
  let confStarted = false;

  function startConference(storyKey) {
    phase = 'conference';
    confLines = (storyKey === 'derivative') ? CONF_DERIVATIVE : CONF_ASINUS;
    confIndex = 0;
    confTyping = '';
    confFull = '';
    confSpeaker = null;
    confStarted = true;
    confLastTick = performance.now();
    confPauseUntil = 0;
    confEndTime = 0;
    confNextStart = performance.now() + 800;
    logBody.innerHTML = '';
    logPanel.classList.add('visible');
    petRoom.classList.add('visible');
    startDonkeyGame();
  }

  function stopConference() {
    confStarted = false;
    confLines = [];
    confIndex = 0;
    confTyping = '';
    confFull = '';
    confSpeaker = null;
    confPauseUntil = 0;
    confEndTime = 0;
    stopDonkeyGame();
  }

  function updateConference(now) {
    if (!confStarted) return;
    if (confSpeaker === null && now >= confNextStart) {
      if (confIndex >= confLines.length) { phase = 'end'; return; }
      const line = confLines[confIndex];
      confSpeaker = { key: line.speaker, name: line.name };
      confFull = line.text;
      confTyping = '';
      confLastTick = now;
      confPauseUntil = 0;
      confEndTime = 0;
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const spColor = getSpeakerColor(line.speaker);
      entry.innerHTML = '<span class="log-speaker" style="color:' + spColor + '">' + line.name + '：</span><span class="log-text">' + line.text + '</span>';
      logBody.appendChild(entry);
      logBody.scrollTop = logBody.scrollHeight;
    }
    if (confSpeaker !== null) {
      if (confTyping.length < confFull.length) {
        if (now >= confPauseUntil && now - confLastTick >= confCharDelay) {
          const ch = confFull.charAt(confTyping.length);
          confTyping += ch;
          confLastTick = now;
          if (ch === '、') confPauseUntil = now + 260;
          else if (ch === '。') confPauseUntil = now + 420;
          else if (ch === '！' || ch === '？') confPauseUntil = now + 420;
        }
      } else {
        if (confEndTime === 0) { confEndTime = now; }
        else if (now - confEndTime >= 1400) {
          confSpeaker = null;
          confIndex++;
          confNextStart = now + 500;
        }
      }
    }
  }

  /* ============================================================
     ペット部屋（ロバゲーム）
     ============================================================ */
  let petGame = {
    // ロバの位置（ペット部屋キャンバス内 320x180）
    x: 160, y: 130,
    vx: 0, vy: 0,
    targetX: 160, targetY: 130,
    phase: 0,
    // 餌・水・撫で
    food: 0,        // 0〜4
    water: false,
    petCount: 0,
    // 食べ/飲み行動
    eatingTimer: 0,
    drinkingTimer: 0,
    eating: false,
    drinking: false,
    // 会議室への乱入
    intrusionCooldown: 0,
    // 餌・水・撫での確率補正
    bias: { bunseki:0, butsuri:0, sugaku:0, tetsugaku:0, senmon:0, gendai:0 },
    running: false,
    lastAction: '' // 'food' | 'water' | 'pet' | ''
  };

  function startDonkeyGame() {
    petGame.running = true;
    petGame.food = 0;
    petGame.water = false;
    petGame.petCount = 0;
    petGame.bias = { bunseki:0, butsuri:0, sugaku:0, tetsugaku:0, senmon:0, gendai:0 };
    petGame.intrusionCooldown = 0;
    petGame.targetX = 60 + Math.random() * 200;
    petGame.targetY = 90 + Math.random() * 50;
    updatePetStatus();
    petMood.textContent = 'ロバはのんびりしている';
  }
  function stopDonkeyGame() {
    petGame.running = false;
    donkeyIntrusion.active = false;
  }
  function updatePetStatus() {
    petStatus.textContent = '餌:' + petGame.food + ' / 水:' + (petGame.water ? 'あり' : 'なし') + ' / なで:' + petGame.petCount;
  }

  function petCanvasPos(evt) {
    const rect = petCanvas.getBoundingClientRect();
    const scaleX = petCanvas.width / rect.width;
    const scaleY = petCanvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * scaleX,
      y: (evt.clientY - rect.top) * scaleY
    };
  }

  petCanvas.addEventListener('click', function(evt){
    if (!petGame.running) return;
    const p = petCanvasPos(evt);
    // 餌箱の位置（左端）
    const foodBox = { x: 30, y: 130, w: 40, h: 30 };
    // 水場の位置（右端）
    const waterSpot = { x: 250, y: 130, w: 40, h: 30 };
    // ロバの頭（当たり判定大きめ）
    const donkeyHead = { x: petGame.x - 22, y: petGame.y - 30, w: 44, h: 40 };

    if (p.x >= foodBox.x && p.x <= foodBox.x + foodBox.w &&
        p.y >= foodBox.y && p.y <= foodBox.y + foodBox.h) {
      if (petGame.food < 4) {
        petGame.food++;
        petGame.lastAction = 'food';
        petGame.bias.bunseki += 0.15;
        petMood.textContent = 'ロバ「お、餌だ」';
      } else {
        petMood.textContent = '餌箱はいっぱいだ';
      }
      updatePetStatus();
      return;
    }
    if (p.x >= waterSpot.x && p.x <= waterSpot.x + waterSpot.w &&
        p.y >= waterSpot.y && p.y <= waterSpot.y + waterSpot.h) {
      if (!petGame.water) {
        petGame.water = true;
        petGame.lastAction = 'water';
        petGame.bias.sugaku += 0.15;
        petMood.textContent = '水が張られた';
      } else {
        petMood.textContent = '水はもうある';
      }
      updatePetStatus();
      return;
    }
    if (p.x >= donkeyHead.x && p.x <= donkeyHead.x + donkeyHead.w &&
        p.y >= donkeyHead.y && p.y <= donkeyHead.y + donkeyHead.h) {
      petGame.petCount++;
      petGame.lastAction = 'pet';
      petGame.bias.senmon += 0.15;
      petMood.textContent = 'ロバ「……（撫でられた）」';
      // なでるとターゲットが変わるかも
      updatePetStatus();
      return;
    }
    // それ以外をクリック → ロバがそっちに行く
    petGame.targetX = Math.max(50, Math.min(270, p.x));
    petGame.targetY = Math.max(90, Math.min(150, p.y));
  });

  /* ============================================================
     ロバの乱入（会議シーン）
     ============================================================ */
  function scheduleDonkeyIntrusion(now) {
    if (donkeyIntrusion.active) return;
    if (petGame.intrusionCooldown > now) return;
    // 12〜22秒ごとに乱入
    const interval = 12000 + Math.random() * 10000;
    petGame.intrusionCooldown = now + interval;
    // ターゲット決定
    const targetKey = pickDonkeyTarget();
    // 学者の後ろ、スクリーンと学者の間の座標
    const speakers = getSpeakers();
    let targetX = 400;
    speakers.forEach(function(sp, i){
      if (sp.key === targetKey) targetX = 60 + i * 120;
    });
    donkeyIntrusion.active = true;
    donkeyIntrusion.targetKey = targetKey;
    donkeyIntrusion.x = 800;
    donkeyIntrusion.y = 265;
    donkeyIntrusion.targetX = targetX;
    donkeyIntrusion.targetY = 265;
    donkeyIntrusion.state = 'entering';
    donkeyIntrusion.timer = 0;
    donkeyIntrusion.knowledgeText = '';
  }

  function pickDonkeyTarget() {
    // 基本確率（均等）
    const w = {
      bunseki: 1,
      butsuri: 1,
      sugaku: 1,
      tetsugaku: 1,
      senmon: 1,
      gendai: 1
    };
    // 餌をやった → 分析学者UP / やらない → 物理学者UP
    if (petGame.food > 0) w.bunseki += petGame.food * 0.8;
    else w.butsuri += 1.5;
    // 水 → 数学者UP / ない → 哲学者UP
    if (petGame.water) w.sugaku += 1.5;
    else w.tetsugaku += 1.5;
    // 撫でた → 専門学者UP / ない → 現代学者UP
    if (petGame.petCount > 0) w.senmon += petGame.petCount * 0.8;
    else w.gendai += 1.5;
    // bias 加算
    Object.keys(w).forEach(function(k){
      w[k] += petGame.bias[k] || 0;
    });
    // 重み付き抽選
    const keys = Object.keys(w);
    let total = 0;
    keys.forEach(function(k){ total += w[k]; });
    let r = Math.random() * total;
    for (let i = 0; i < keys.length; i++) {
      r -= w[keys[i]];
      if (r <= 0) return keys[i];
    }
    return keys[0];
  }

  function updateDonkeyIntrusion(now) {
    if (!donkeyIntrusion.active) return;
    const d = donkeyIntrusion;
    d.timer += 16; // 約60fps想定
    if (d.state === 'entering') {
      // 右からターゲット位置へ
      if (d.x > d.targetX) {
        d.x -= 4;
      } else {
        d.x = d.targetX;
        // 到着 → マウント or イベント
        d.state = 'mounted';
        d.timer = 0;
        onDonkeyArrived(d.targetKey);
      }
    } else if (d.state === 'mounted') {
      // 3秒間マウントして帰る
      if (d.timer > 3000) {
        d.state = 'leaving';
        d.timer = 0;
      }
    } else if (d.state === 'leaving') {
      d.x += 4;
      if (d.x > 820) {
        d.active = false;
        d.state = 'idle';
      }
    }
  }

  function onDonkeyArrived(targetKey) {
    // 知識マウント or イベント（ランダム）
    const isEvent = Math.random() < 0.35;
    if (isEvent) {
      // イベントは後編で実装。前編では分析学者のfooter表示のみ。
      const evt = (window.__PHASE2__ && window.__PHASE2__.getEventFor)
        ? window.__PHASE2__.getEventFor(targetKey)
        : defaultEventFor(targetKey);
      if (window.__PHASE2__ && window.__PHASE2__.onEvent) {
        window.__PHASE2__.onEvent(targetKey, evt);
      } else {
        defaultOnEvent(targetKey, evt);
      }
    } else {
      // 知識マウント
      const list = KNOWLEDGE[targetKey] || KNOWLEDGE.bunseki;
      const text = randPick(list);
      donkeyIntrusion.knowledgeText = text;
      showDonkeySpeech(text);
      if (window.__PHASE2__ && window.__PHASE2__.onDonkeyMounted) {
        window.__PHASE2__.onDonkeyMounted(targetKey, text);
      }
    }
  }

  function defaultEventFor(targetKey) {
    switch(targetKey) {
      case 'bunseki':   return 'footerVertical';
      case 'butsuri':   return 'weather';
      case 'senmon':    return 'rainAndDrops';
      case 'gendai':    return 'img41x';
      case 'sugaku':    return 'formula';
      case 'tetsugaku': return 'ranking';
      default: return 'none';
    }
  }

  // 前編で実装するのは footerVertical のみ
  function defaultOnEvent(targetKey, eventType) {
    if (eventType === 'footerVertical') {
      showFooterVertical();
    } else {
      // 後編未実装 → とりあえずログに出すだけ
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const spColor = getSpeakerColor(targetKey);
      const name = getSpeakerName(targetKey);
      entry.innerHTML = '<span class="log-speaker" style="color:' + spColor + '">🐴 ' + name + ' に何かが起きた（' + eventType + '）</span>';
      logBody.appendChild(entry);
      logBody.scrollTop = logBody.scrollHeight;
    }
  }

  function getSpeakerName(key) {
    const map = {
      bunseki:'分析学者', butsuri:'物理学者', tetsugaku:'哲学者',
      senmon:'専門学者', gendai:'現代学者', sugaku:'数学者'
    };
    return map[key] || '学者';
  }

  function showDonkeySpeech(text) {
    donkeySpeech.textContent = '🐴 ' + text;
    donkeySpeech.classList.add('visible');
    clearTimeout(showDonkeySpeech._t);
    showDonkeySpeech._t = setTimeout(function(){
      donkeySpeech.classList.remove('visible');
    }, 3500);
    // ログにも追加
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = '<span class="log-speaker" style="color:#e0a060">🐴 ロバ：</span><span class="log-text">' + text + '</span>';
    logBody.appendChild(entry);
    logBody.scrollTop = logBody.scrollHeight;
  }

  function showFooterVertical() {
    // footer に vertical.html を表示（隠し要素）
    verticalLink.classList.add('visible');
    footerSub.innerHTML = '↕ <a href="vertical.html" target="_self">vertical.html へ</a>';
    footerLinkVisible = true;
    // ログにも
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = '<span class="log-speaker" style="color:#ff5555">分析学者：</span><span class="log-text">「……まさか、この構造に気づくとは。footer を見てみろ。」</span>';
    logBody.appendChild(entry);
    logBody.scrollTop = logBody.scrollHeight;
  }

  /* ============================================================
     ペット部屋の描画（毎フレーム）
     ============================================================ */
  function drawPetRoom(now) {
    if (!petGame.running) return;
    const c = petCtx;
    c.clearRect(0, 0, 320, 180);
    // 床
    c.fillStyle = '#2a3a2a';
    c.fillRect(0, 0, 320, 180);
    c.fillStyle = '#3a4a3a';
    c.fillRect(0, 140, 320, 40);
    // わらの散らばり（ドット）
    for (let i = 0; i < 30; i++) {
      const wx = (i * 47 + 13) % 320;
      const wy = 140 + (i * 7) % 35;
      c.fillStyle = '#8a7a3a';
      c.fillRect(wx, wy, 2, 1);
    }
    // 餌箱（左）
    c.fillStyle = '#6b4a2b';
    c.fillRect(30, 130, 40, 30);
    c.fillStyle = '#8b6a4b';
    c.fillRect(33, 133, 34, 24);
    // 餌
    if (petGame.food > 0) {
      c.fillStyle = '#d4a017';
      for (let i = 0; i < petGame.food; i++) {
        c.beginPath();
        c.arc(40 + i * 8, 145, 4, 0, Math.PI*2);
        c.fill();
        c.fillStyle = '#e8c050';
        c.beginPath();
        c.arc(40 + i * 8, 143, 2, 0, Math.PI*2);
        c.fill();
        c.fillStyle = '#d4a017';
      }
    }
    // 水場（右）
    c.fillStyle = '#6b4a2b';
    c.fillRect(250, 130, 40, 30);
    c.fillStyle = '#8b6a4b';
    c.fillRect(253, 133, 34, 24);
    if (petGame.water) {
      c.fillStyle = '#5b9bd5';
      c.fillRect(256, 138, 28, 16);
      c.fillStyle = 'rgba(255,255,255,0.3)';
      c.fillRect(256, 138, 28, 4);
    }

    // ロバの移動ロジック
    const dx = petGame.targetX - petGame.x;
    const dy = petGame.targetY - petGame.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 3) {
      petGame.x += dx * 0.02;
      petGame.y += dy * 0.02;
      petGame.phase += 0.15;
    } else {
      petGame.phase += 0.05;
      // たまに新しい目標地点
      if (Math.random() < 0.005) {
        // 餌があれば食べに行く、水があれば飲みに行く
        const r = Math.random();
        if (petGame.food > 0 && r < 0.3) {
          petGame.targetX = 50;
          petGame.targetY = 125;
        } else if (petGame.water && r < 0.5) {
          petGame.targetX = 270;
          petGame.targetY = 125;
        } else {
          petGame.targetX = 60 + Math.random() * 200;
          petGame.targetY = 90 + Math.random() * 50;
        }
      }
    }

    // 餌箱のそばに来たら食べる
    if (petGame.food > 0 && Math.abs(petGame.x - 50) < 15 && Math.abs(petGame.y - 125) < 15) {
      if (!petGame.eating) {
        petGame.eating = true;
        petGame.eatingTimer = now;
      }
      if (now - petGame.eatingTimer > 1500) {
        petGame.food--;
        petGame.eating = false;
        updatePetStatus();
        petMood.textContent = 'ロバ「むしゃむしゃ……」';
      }
    }
    if (petGame.water && Math.abs(petGame.x - 270) < 15 && Math.abs(petGame.y - 125) < 15) {
      if (!petGame.drinking) {
        petGame.drinking = true;
        petGame.drinkingTimer = now;
      }
      if (now - petGame.drinkingTimer > 1500) {
        petGame.water = false;
        petGame.drinking = false;
        updatePetStatus();
        petMood.textContent = 'ロバ「ごくごく……」';
      }
    }

    // ロバを描く（小さめ）
    drawDonkey(c, petGame.x, petGame.y, 0.7, petGame.phase, dist > 3, false, 'none');
    // 頭の上にハート（撫でられたら）
    if (petGame.petCount > 0 && now - (petGame._lastPet || 0) < 3000) {
      c.fillStyle = '#ff6b8a';
      c.font = '16px sans-serif';
      c.fillText('♥', petGame.x - 8, petGame.y - 40);

    c.fillStyle = '#8a9a8a';

  let lastNow = 0;
  function animate(timestamp) {
    const now = timestamp;
    lastNow = now;
    if (!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;
    const story = STORIES[currentStory] || STORIES.derivative;
    const progress = Math.min(elapsed / story.duration, 1.0);

    if (phase === 'animation') {
      if (currentStory === 'derivative') drawDerivativeScene(progress);
      else drawAsinusScene(progress);
    } else if (phase === 'intermission') {
      if (currentStory === 'derivative') drawDerivativeScene(1.0);
      else drawAsinusScene(1.0);
    } else if (phase === 'conference' || phase === 'end') {
      updateConference(now);
      updateDonkeyIntrusion(now);
      if (petGame.running && now - (petGame._lastIntrusionCheck || 0) > 1000) {
        petGame._lastIntrusionCheck = now;
        scheduleDonkeyIntrusion(now);
      }
      drawConferenceScene();
    }

    // ペット部屋は常時描画（running のとき）
    if (petGame.running) {
      drawPetRoom(now);
      // 後編フック
      if (window.__PHASE2__ && window.__PHASE2__.tickPetRoom) {
        window.__PHASE2__.tickPetRoom(petCtx, petGame, now);
      }
    }

    if (phase === 'animation') {
      if (progress >= 1.0) {
        phase = 'intermission';
        intermissionStart = now;
      }
    } else if (phase === 'intermission') {
      if (now - intermissionStart >= 3000) {
        startConference(currentStory);
      }
    }

    animationId = requestAnimationFrame(animate);
  }

  function startStory(storyKey) {
    if (animationId) cancelAnimationFrame(animationId);
    stopConference();
    currentStory = storyKey;
    openingOverlay.classList.add('hidden');
    backBtn.classList.add('visible');
    startTime = null;
    isAnimating = true;
    footerLinkVisible = false;

    footerTitle.textContent = STORIES[storyKey].label;
    logPanel.classList.remove('visible');
    petRoom.classList.remove('visible');
    logBody.innerHTML = '';
    phase = 'animation';
    if (storyKey === 'derivative') drawDerivativeScene(0);
    else drawAsinusScene(0);
    animationId = requestAnimationFrame(animate);
  }

    if (!siteWeather.active) return;
    siteWeather.timer += dt;
    if (siteWeather.timer > siteWeather.duration) {
      stopSiteWeather();
      return;
    }
    const el = ensureWeatherOverlay();
    const w = window.innerWidth;
    const h = window.innerHeight;
    const isSnow = siteWeather.type === 'snow';
    const isRain = siteWeather.type === 'rain' || siteWeather.type === 'rainThunder';
    const isThunder = siteWeather.type === 'thunder' || siteWeather.type === 'rainThunder';

      p.x += p.vx;

    if (isThunder) {

      ctx.fillText((i + 1) + '位', 130, y);
      // 名前（色付き）
      ctx.fillStyle = getSpeakerColor(r.key);
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText(r.name, 210, y);
      // スコア
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px "Courier New", monospace';
      ctx.fillText(r.score + '点', 360, y);
      // コメント
      ctx.fillStyle = '#c0d0c0';
      ctx.font = '12px "Courier New", monospace';
      ctx.fillText(r.comment, 430, y);
    });
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     ペット部屋の追加描画（後編フック）
     ============================================================ */
  window.__PHASE2__.tickPetRoom = function(c, game, now) {
    // ロバの状態に応じた追加描画
    // 天候イベント中はロバがびっくり
    if (siteWeather.active) {
      c.fillStyle = '#ffe0a0';
      c.font = '10px "Courier New", monospace';
      c.textAlign = 'center';
      c.fillText('！', game.x, game.y - 45);
    }
    // なでられた直後はハート
    if (game.petCount > 0 && now - (game._lastPet || 0) < 3000) {
      c.fillStyle = '#ff6b8a';
      c.font = '14px sans-serif';
      c.fillText('♥', game.x + 5, game.y - 35);
    }
  };

  /* ============================================================
     ターゲット→イベント名
     ============================================================ */
  window.__PHASE2__.getEventFor = function(targetKey) {
    switch(targetKey) {
      case 'bunseki':   return 'footerVertical';
      case 'butsuri':   return 'weather';
      case 'senmon':    return 'rainAndDrops';
      case 'gendai':    return 'img41x';
      case 'sugaku':    return 'formula';
      case 'tetsugaku': return 'ranking';
      default: return 'none';
    }
  };

  /* ============================================================
     イベント発生時の処理
     ============================================================ */
  window.__PHASE2__.onEvent = function(targetKey, eventType) {
    switch(eventType) {
      case 'footerVertical':
        // 分析学者 → footer に vertical.html（前編と同じ）
        verticalLink.classList.add('visible');
        footerSub.innerHTML = '↕ <a href="vertical.html" target="_self">vertical.html へ</a>';
        footerLinkVisible = true;
        addConferenceLog('bunseki', '「……まさか、この構造に気づくとは。footer を見てみろ。」');
        break;

      case 'weather':
        // 物理学者 → サイト全体 or スクリーンに雨/雪/雷/雨+雷
        var wtypes = ['rain', 'snow', 'thunder', 'rainThunder'];
        var wtype = wtypes[Math.floor(Math.random() * wtypes.length)];
        var scope = Math.random() < 0.5 ? 'site' : 'screen';
        if (scope === 'site') {
          startSiteWeather(wtype);
          addConferenceLog('butsuri', '「外で天気が変わったぞ。' + wtypeName(wtype) + 'だ。」');
        } else {
          startScreenWeather(wtype);
          addConferenceLog('butsuri', '「スクリーンの中で' + wtypeName(wtype) + 'が降っている。」');
        }
        break;

      case 'rainAndDrops':
        // 専門学者 → サイト全体に雨 + 画面に水滴
        startSiteWeather('rain');
        startScreenDrops();
        addConferenceLog('senmon', '「雨だ。そして画面に水滴がついた。……これは古文書の保存状態に似ている。」');
        break;

      case 'img41x':
        // 現代学者 → スクリーンが img41x.jpg になる
        startScreenImage();
        addConferenceLog('gendai', '「スクリーンが img41x.jpg に切り替わった。現代のプレゼンだ。」');
        break;

      case 'formula':
        // 数学者 → スクリーンに数式
        startScreenFormula();
        addConferenceLog('sugaku', '「私がこれから言おうとした数式を、先に出しておいた。」');
        break;

      case 'ranking':
        // 哲学者 → 会議参加者のランキング
        startRanking();
        addConferenceLog('tetsugaku', '「今回の解説の良さをランキングしてみた。……私も含めて、だ。」');
        break;

      default:
        addConferenceLog(targetKey, '（何かが起きた）');
    }
  };

  function wtypeName(t) {
    switch(t) {
      case 'rain': return '雨';
      case 'snow': return '雪';
      case 'thunder': return '雷';
      case 'rainThunder': return '雨と雷';
      default: return t;
    }
  }

  function addConferenceLog(speakerKey, text) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const spColor = getSpeakerColor(speakerKey);
    const name = getSpeakerName(speakerKey);
    entry.innerHTML = '<span class="log-speaker" style="color:' + spColor + '">🐴 ' + name + '：</span><span class="log-text">' + text + '</span>';
    logBody.appendChild(entry);
    logBody.scrollTop = logBody.scrollHeight;
  }

  /* ============================================================
     知識マウント時の追加処理（後編フック）
     ============================================================ */
  window.__PHASE2__.onDonkeyMounted = function(targetKey, text) {
    // 既に前編で showDonkeySpeech されているので、ここでは追加のログだけ
    // 何もしない（前編の showDonkeySpeech でログに出ている）
  };

  /* ============================================================
     毎フレームの更新（後編）
     ============================================================ */
  let lastPhase2Tick = 0;
  function phase2Tick(now) {
    if (!lastPhase2Tick) lastPhase2Tick = now;
    const dt = now - lastPhase2Tick;
    lastPhase2Tick = now;
    // サイト天候
    updateSiteWeather(dt);
    // スクリーン天候
    updateScreenWeather(dt);
    drawScreenWeather();
    // 水滴
    updateScreenDrops(dt);
    // 数式
    drawScreenFormula(dt);
    // img41x
    drawScreenImage(dt);
    // ランキング
    drawRanking(dt);
  }

  // メインループに後編の更新を差し込む
  // 既存の animate は requestAnimationFrame を回しているので、
  // ここで独立した rAF を回す
  function phase2Loop(ts) {
    phase2Tick(ts);
    requestAnimationFrame(phase2Loop);
  }
  requestAnimationFrame(phase2Loop);

  // ============================================================
  // ▲▲▲ 第2段階（後編）はここまで ▲▲▲
  // ============================================================

})();
</script>
</body>
</html>
