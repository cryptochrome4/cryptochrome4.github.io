<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thales — 2つの物語と解説会議</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; min-height:100vh;
    background:#0a1f1a;
    font-family:'Courier New', Courier, monospace;
    display:flex; justify-content:center; align-items:center;
    padding:16px;
  }
  .container {
    max-width:1080px; width:100%;
    background:#1e3b2f;
    border-radius:32px;
    padding:24px 24px 16px 24px;
    box-shadow:0 20px 30px rgba(0,0,0,.7), inset 0 0 0 2px #6b8f6b;
    border:4px solid #3d5e3d;
    position:relative;
    overflow:hidden;
  }
  .container::before {
    content:"";
    position:absolute; inset:0;
    background-image:url('img41x.jpg');
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
    opacity:0.15;
    filter:saturate(0.7) brightness(0.7);
    z-index:0;
    pointer-events:none;
  }
  .screen-area {
    position:relative;
    z-index:1;
    background:rgba(11,27,18,0.82);
    border-radius:20px;
    padding:16px 16px 10px 16px;
    border:6px solid #2b4a2b;
    box-shadow:inset 0 0 20px #00000080;
    backdrop-filter:blur(1px);
  }
  .main-row {
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .canvas-wrapper {
    position:relative;
    flex:1 1 auto;
    min-width:0;
  }
  canvas {
    display:block; width:100%; height:auto;
    image-rendering:crisp-edges;
    image-rendering:pixelated;
    background:#132a1d;
    border-radius:12px;
    border:4px solid #3f6b3f;
    box-shadow:0 0 0 2px #1d331d;
    cursor:pointer;
  }
  .opening-overlay {
    position:absolute; inset:0;
    display:flex; justify-content:center; align-items:center;
    background:rgba(10,31,26,0.78);
    border-radius:12px;
    z-index:5;
    backdrop-filter:blur(3px);
    transition:opacity .5s;
  }
  .opening-overlay.hidden { display:none; }
  .opening-buttons {
    display:flex; flex-direction:column; gap:28px;
    z-index:10;
  }
  .opening-buttons button {
    background:#1d331d;
    border:5px solid #8fbc8f;
    color:#f0f7e0;
    font-family:'Courier New', monospace;
    font-size:2rem; font-weight:bold;
    padding:16px 48px;
    border-radius:60px;
    letter-spacing:3px;
    text-shadow:2px 2px 0 #0a1f1a;
    box-shadow:0 10px 0 #0b1b12, 0 0 0 4px #2b4a2b;
    transition:all .08s linear;
    cursor:pointer;
    min-width:280px;
    image-rendering:pixelated;
  }
  .opening-buttons button:hover {
    background:#2f552f; border-color:#c1e0c1;
    transform:translateY(-2px);
    box-shadow:0 12px 0 #0b1b12, 0 0 0 4px #3f6b3f;
  }
  .opening-buttons button:active {
    transform:translateY(6px);
    box-shadow:0 4px 0 #0b1b12, 0 0 0 4px #2b4a2b;
  }
  .back-btn {
    position:absolute;
    top:12px; left:12px;
    z-index:20;
    background:#2b4a2b;
    color:#d4edc9;
    border:3px solid #8fbc8f;
    border-radius:30px;
    padding:6px 18px;
    font-family:'Courier New', monospace;
    font-size:1rem; font-weight:bold;
    cursor:pointer;
    display:none;
    box-shadow:0 4px 0 #0b1b12;
  }
  .back-btn.visible { display:block; }
  .back-btn:active { transform:translateY(3px); box-shadow:0 0 0 #0b1b12; }

  /* 右側ログパネル */
  .log-panel {
    flex:0 0 320px;
    display:none;
    flex-direction:column;
    height:100%;
    max-height:520px;
    background:rgba(6,18,12,0.92);
    border:4px solid #3f6b3f;
    border-radius:12px;
    box-shadow:0 0 0 2px #1d331d, inset 0 0 20px #00000080;
    overflow:hidden;
  }
  .log-panel.visible { display:flex; }
  .log-header {
    padding:8px 12px;
    background:#1d331d;
    color:#f0e6b0;
    font-weight:bold;
    font-size:0.95rem;
    letter-spacing:1px;
    border-bottom:2px solid #3f6b3f;
    display:flex; justify-content:space-between; align-items:center;
  }
  .log-header .live {
    width:10px; height:10px; border-radius:50%;
    background:#ff4444; box-shadow:0 0 8px #ff4444;
    animation:pulse 1.2s infinite;
  }
  .log-body {
    flex:1 1 auto;
    overflow-y:auto;
    padding:10px 12px;
    font-size:0.86rem;
    line-height:1.5;
    color:#cfe8cf;
    scrollbar-width:thin;
    scrollbar-color:#3f6b3f #0b1b12;
  }
  .log-body::-webkit-scrollbar { width:8px; }
  .log-body::-webkit-scrollbar-track { background:#0b1b12; }
  .log-body::-webkit-scrollbar-thumb { background:#3f6b3f; border-radius:4px; }
  .log-entry {
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px dashed rgba(107,143,107,0.35);
    animation:fadeIn .6s ease;
  }
  .log-entry:last-child { border-bottom:none; }
  .log-speaker {
    font-weight:bold;
    margin-right:6px;
  }
  .log-text { color:#e8f5e0; }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }
  /* 話者カラー */
  .c-bunseki   { color:#ff5555; } /* 分析学者 赤 */
  .c-butsuri   { color:#55dd55; } /* 物理学者 緑 */
  .c-tetsugaku { color:#bbbbbb; } /* 哲学者 灰色 */
  .c-senmon    { color:#c77dff; } /* 専門学者 紫 */
  .c-gendai    { color:#ffd93d; } /* 現代学者 黄 */
  .c-sugaku    { color:#5aa9ff; } /* 数学者 青 */
  /* スクリーン上の字幕にも色を使う */

  .footer {
    position:relative; z-index:1;
    margin-top:16px;
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px;
    background:#1e3b2f;
    border-radius:40px;
    border:2px solid #4c7a4c;
    min-height:70px;
    transition:all .3s ease;
  }
  .footer-left {
    color:#b8d9b8; font-weight:bold; letter-spacing:1px;
    font-size:1.0rem;
    display:flex; flex-direction:column; gap:4px;
  }
  .footer-left .title-row {
    display:flex; gap:12px; align-items:center;
  }
  .footer-left .dot {
    width:12px; height:12px;
    background:#f0c45a; border-radius:50%;
    box-shadow:0 0 12px #f0c45a;
    animation:pulse 1.5s infinite;
    flex:0 0 auto;
  }
  .footer-left .sub-link-row {
    font-size:0.9rem;
    color:#a0c8a0;
    padding-left:24px;
    min-height:1.2em;
  }
  .footer-left .sub-link-row a {
    color:#ffe08a;
    text-decoration:none;
    border-bottom:1px dashed #ffe08a;
  }
  .footer-left .sub-link-row a:hover { color:#fff; border-bottom-color:#fff; }
  @keyframes pulse {
    0%{opacity:.6; transform:scale(.9);} 50%{opacity:1; transform:scale(1.2);} 100%{opacity:.6; transform:scale(.9);}
  }
  .vertical-link {
    background:#2b4a2b;
    padding:10px 24px;
    border-radius:30px;
    color:#d4edc9;
    text-decoration:none;
    font-weight:bold; font-size:1.05rem;
    letter-spacing:1px;
    border:2px solid #6b8f6b;
    transition:all .2s;
    box-shadow:0 4px 0 #0b1b12;
    opacity:0; pointer-events:none;
    transform:translateY(6px);
    transition:opacity .4s, transform .4s;
  }
  .vertical-link.visible {
    opacity:1; pointer-events:auto; transform:translateY(0);
  }
  .vertical-link:hover {
    background:#3f6b3f; color:#fff;
    border-color:#b8d9b8;
  }
  .vertical-link:active {
    transform:translateY(4px); box-shadow:0 0 0 #0b1b12;
  }
  @media (max-width:820px) {
    .main-row { flex-direction:column; }
    .log-panel { flex:0 0 auto; width:100%; max-height:300px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="screen-area">
    <div class="main-row">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas" width="800" height="400"></canvas>
        <button class="back-btn" id="backBtn">← 戻る</button>
        <div class="opening-overlay" id="openingOverlay">
          <div class="opening-buttons">
            <button id="derivativeBtn">derivative</button>
            <button id="asinusBtn">Asinus</button>
          </div>
        </div>
      </div>
      <aside class="log-panel" id="logPanel">
        <div class="log-header">
          <span>解説会議 — LIVE</span>
          <span class="live"></span>
        </div>
        <div class="log-body" id="logBody"></div>
      </aside>
    </div>
  </div>
  <div class="footer" id="footer">
    <div class="footer-left">
      <div class="title-row">
        <span class="dot"></span>
        <span id="footerTitle">タレスの2つの物語</span>
      </div>
      <div class="sub-link-row" id="footerSub">
        <!-- ここに vertical.html 誘導文が入る（タイトルは消さない） -->
      </div>
    </div>
    <div class="footer-right">
      <a href="vertical.html" class="vertical-link" id="verticalLink" target="_self">↕ vertical.html</a>
    </div>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const openingOverlay = document.getElementById('openingOverlay');
  const derivativeBtn = document.getElementById('derivativeBtn');
  const asinusBtn = document.getElementById('asinusBtn');
  const backBtn = document.getElementById('backBtn');
  const verticalLink = document.getElementById('verticalLink');
  const footerTitle = document.getElementById('footerTitle');
  const footerSub = document.getElementById('footerSub');
  const logPanel = document.getElementById('logPanel');
  const logBody = document.getElementById('logBody');
  const canvasWrapper = document.getElementById('canvasWrapper');

  let animationId = null;
  let startTime = null;
  let currentStory = null;      // 'derivative' | 'asinus'
  let isAnimating = false;
  let footerLinkVisible = false;
  let phase = 'opening';        // 'opening' | 'animation' | 'intermission' | 'conference' | 'end'
  let conferenceTimer = null;
  let conferenceLogTimer = null;
  let intermissionStart = 0;
  let frozenProgress = 1.0;

  const STORIES = {
    derivative: {
      duration: 14000,
      footerStart: 6000,
      label: 'タレスの圧搾機 · デリバティブの嚆矢'
    },
    asinus: {
      duration: 16000,
      footerStart: 6500,
      label: 'Asinus · 塩を運ぶろばとタレス'
    }
  };

  // 会議の解説トピック（derivative）
  const CONF_DERIVATIVE = [
    { speaker:'bunseki',   name:'分析学者', text:'まずこの物語の構造を整理しましょう。タレスは「冬の観測」→「圧搾機の借り占め」→「収穫期の独占」→「利益」という四段階を踏んでいます。これは典型的な先物取引の構造です。' },
    { speaker:'sugaku',    name:'数学者',   text:'補足します。彼が支払ったのは圧搾機のレンタル料、すなわちプレミアムです。冬の時点ではまだ誰も豊作を確信していない。だからこそ安く借りられた。これがオプションの本質です。' },
    { speaker:'butsuri',   name:'物理学者', text:'天文学の観測という点が重要です。当時、タレスは日食の予言も行ったとされます。天体の周期性を利用した予測は、確率論的な賭けではなく、観測に基づく合理的判断でした。' },
    { speaker:'tetsugaku', name:'哲学者',   text:'しかし彼の真意は富ではなかった、と。アリストテレスはこれを「哲学者は欲すれば富めるが、欲さない」という命題の証明として紹介しています。ここに実践と観照の対立が見えます。' },
    { speaker:'senmon',    name:'専門学者', text:'オリーブの圧搾機について補足します。当時の圧搾機は木製のレバー式で、収穫期の数週間だけ需要が集中する高価な設備でした。タレスはその「季節的独占」を狙ったわけです。' },
    { speaker:'gendai',    name:'現代学者', text:'現代の金融用語で言えば、これはコールオプションの買い占めです。しかも彼は原資産そのものではなく、生産設備を押さえた。つまりサプライチェーンのボトルネックを先に握った。極めて現代的です。' },
    { speaker:'bunseki',   name:'分析学者', text:'興味深いのは、彼が「賭けた」のではなく「確信していた」点です。アリストテレスは「貧乏のゆえに哲学は役に立たぬと非難された」と前置きしています。つまりこれは反論のための実演だった。' },
    { speaker:'sugaku',    name:'数学者',   text:'期待値の観点で見ましょう。豊作の確率をp、圧搾機のレンタル料をC、収穫期の収入をRとすると、pR > C ならば賭ける価値がある。タレスは観測から p を高く見積もっていた。合理的です。' },
    { speaker:'butsuri',   name:'物理学者', text:'オリーブの豊作は気象に依存します。当時、気象を支配するのは神々と考えられていました。タレスが自然現象を自然の原因で説明しようとしたのは、ミレトス学派の画期です。' },
    { speaker:'tetsugaku', name:'哲学者',   text:'ここで注目すべきは「関心がない」という言明です。彼は富を否定したのではなく、富を目的としない立場を表明した。ソクラテス以前の哲学者に共通する、実践より観照を重んじる態度です。' },
    { speaker:'senmon',    name:'専門学者', text:'ミレトスとキオス、両方の圧搾機を押さえた点も重要です。地理的に離れた二つの地域を同時に押さえるには、事前の情報網と資金が必要だった。彼は哲学者であると同時に、実務家でもありました。' },
    { speaker:'gendai',    name:'現代学者', text:'これを現代のヘッジファンドに置き換えると、気象データを独自に解析し、先に物流を押さえる戦略です。実際、商品先物市場では似た手法が今も使われています。タレスはその祖型です。' },
    { speaker:'bunseki',   name:'分析学者', text:'つまりこの逸話は、単なる「哲学者でも儲けられる」という話ではなく、知識が実践的に転用可能であることの証明です。理論と実践の橋渡しを、タレスは自ら示したわけです。' },
    { speaker:'sugaku',    name:'数学者',   text:'最後に数学的にまとめます。彼の戦略は「低確率・高報酬」ではなく「高確率・中報酬」でした。観測精度が高ければ、ギャンブルではなく投資になる。これがデリバティブの原点です。' },
    { speaker:'butsuri',   name:'物理学者', text:'余談ですが、タレスは水を万物の根源と考えました。オリーブも、圧搾機も、水と土と太陽から成る。彼の自然哲学は、この実践の背後にも一貫して流れています。' },
    { speaker:'tetsugaku', name:'哲学者',   text:'アリストテレスの記述は、哲学が実践的に無力だという非難への反論として書かれました。しかしタレス自身は、富を求めたのではなく、非難を晴らすために一度だけ実演した。ここが味わい深い。' },
    { speaker:'senmon',    name:'専門学者', text:'補足すると、オリーブ油は当時、食料・照明・宗教儀式・体育用と多用途でした。収穫期の価格変動は激しく、圧搾機の確保は文字通り「油を売る」ビジネスの要でした。' },
    { speaker:'gendai',    name:'現代学者', text:'現代の視点では、これは「情報の非対称性」を利用した裁定取引です。タレスだけが豊作を知っていた。情報格差が利益を生む。これは現代経済学の基本命題の一つです。' },
    { speaker:'bunseki',   name:'分析学者', text:'以上をまとめると、この逸話は「観測→予測→先回り→独占→利益」という五段階の意思決定モデルとして読めます。現代のビジネス分析にもそのまま通じる構造です。' },
    { speaker:'sugaku',    name:'数学者',   text:'補足します。彼が用いたのは確率論ではなく、周期性の認識です。天体の周期と農作物の周期を結びつけた。これは統計的思考の萌芽と言えます。' },
    { speaker:'butsuri',   name:'物理学者', text:'当時の天文学は占星術と未分化でした。しかしタレスは星を「神の意志」ではなく「自然の規則」として読もうとした。ここに科学の始まりがあります。' },
    { speaker:'tetsugaku', name:'哲学者',   text:'そして彼は、その知識を金儲けに使うこともできたが、使わなかった。知識の目的は富ではなく、理解そのものにある。これが哲学の自立宣言です。' },
    { speaker:'senmon',    name:'専門学者', text:'実際、タレスはミレトスの政治にも関与したとされます。実践を軽視していたわけではない。ただ、実践を目的化しなかった。そこが重要な区別です。' },
    { speaker:'gendai',    name:'現代学者', text:'現代では、この話は「哲学は役に立たない」という批判への古典的な反論として引用されます。しかし本当の教訓は、知識はいつでも実践に転換できる、という点でしょう。' },
    { speaker:'bunseki',   name:'分析学者', text:'では最後に。タレスのこの行為は、哲学の実用性の証明であると同時に、哲学の非実用性の証明でもあります。彼は儲けることができたが、しなかった。ここに両義性があります。' },
    { speaker:'sugaku',    name:'数学者',   text:'数学的には、これは「実行可能だが実行しない選択肢」の存在証明です。選択肢を持つことと、それを選ぶことは別である。これもまた、現代の意思決定理論に通じます。' }
  ];

  // 会議の解説トピック（asinus）
  const CONF_ASINUS = [
    { speaker:'bunseki',   name:'分析学者', text:'この物語も四段階です。「最初の転倒」→「学習」→「タレスの一計」→「海綿で解決」。ただし今回は、ろばが学習するという点が加わっています。' },
    { speaker:'sugaku',    name:'数学者',   text:'私の出番ですね。海綿が水を吸ったときの重さを考えましょう。海綿の乾燥重量をm、吸水量をwとすると、総重量はm+wです。塩の場合、水に溶けて失われるのでm-w。符号が逆なんです。' },
    { speaker:'butsuri',   name:'物理学者', text:'補足します。塩は水に溶けるとイオンに分かれ、荷から離れて流れ去ります。一方、海綿は多孔質構造で毛細管現象により水を保持します。だから重くなる。これは物理的に必然です。' },
    { speaker:'tetsugaku', name:'哲学者',   text:'ここで問われるのは、ろばに「学習」があるかどうかです。アリストテレスは動物にも記憶と学習を認めました。ろばは「転ぶと楽になる」という経験を記憶し、それを再現した。' },
    { speaker:'senmon',    name:'専門学者', text:'塩の運搬について補足します。当時、塩は貴重な保存料であり、内陸部では高値で取引されました。塩を運ぶのは重要な商業活動でした。ろばはその主要な輸送手段です。' },
    { speaker:'gendai',    name:'現代学者', text:'これは現代で言えば「報酬ハッキング」です。ろばは「転ぶ→楽になる」という短期報酬を学習し、それを繰り返した。しかしタレスは環境を変えることで、その報酬を反転させた。' },
    { speaker:'bunseki',   name:'分析学者', text:'つまりタレスは、ろばの行動を罰するのではなく、行動の結果を変えた。これは現代の行動経済学でいう「インセンティブ設計」の原型です。' },
    { speaker:'sugaku',    name:'数学者',   text:'重さの計算を続けます。海綿の吸水量は、海綿の体積と水の密度に依存します。海綿の空隙率をφとすると、吸水量w ≈ φ·V·ρ_water。乾燥重量mよりwが大きければ、総重量は増える。' },
    { speaker:'butsuri',   name:'物理学者', text:'塩の場合、溶ける量は溶解度に依存します。水温と塩の量で決まる。一方、海綿は物理的に水を吸うので、温度依存性が小さい。タレスはこの違いを直感的に理解していたのでしょう。' },
    { speaker:'tetsugaku', name:'哲学者',   text:'重要なのは、タレスがろばを「悪い動物」と断じなかった点です。彼は自然の性質を利用した。塩は溶け、海綿は吸う。それぞれの物質の本性に従っただけです。' },

  /* ---------- ユーティリティ ---------- */
  function px(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }
  function pixelText(text, x, y, size, color, align) {
    align = align || 'left';
    ctx.font = 'bold ' + size + 'px "Courier New", monospace';
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#0b1b12';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2*r) r = w/2;
      if (h < 2*r) r = h/2;
      this.beginPath();
      this.moveTo(x+r, y);
      this.arcTo(x+w, y, x+w, y+h, r);
      this.arcTo(x+w, y+h, x, y+h, r);
      this.arcTo(x, y+h, x, y, r);
      this.arcTo(x, y, x+w, y, r);
      this.closePath();
      return this;
    };
  }
  function drawSpeechBubble(x, y, w, h, text, tailDir) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.roundRect(x+3, y+3, w, h, 10); ctx.fill();
    ctx.fillStyle = '#fffef0';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = '#3d5e3d'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fffef0';
    ctx.beginPath();
    if (tailDir === 'left') {
      ctx.moveTo(x, y+h*0.5); ctx.lineTo(x-14, y+h*0.5+10); ctx.lineTo(x, y+h*0.5+18);
    } else {
      ctx.moveTo(x+w, y+h*0.5); ctx.lineTo(x+w+14, y+h*0.5+10); ctx.lineTo(x+w, y+h*0.5+18);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3d5e3d'; ctx.stroke();
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillStyle = '#1a2e1a';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = text.split('\n');
    lines.forEach(function(line, i){
      ctx.fillText(line, x + w/2, y + h/2 + (i - (lines.length-1)/2) * 20);
    });
  }

  /* =========================================================
     背景共通
     ========================================================= */
  function drawSkyBase(progress, palette) {
    const g = ctx.createLinearGradient(0, 0, 0, 400);
    let c0, c1, c2;
    if (progress < 0.35) { c0 = palette.spring[0]; c1 = palette.spring[1]; c2 = palette.spring[2]; }
    else if (progress < 0.7) { c0 = palette.summer[0]; c1 = palette.summer[1]; c2 = palette.summer[2]; }
    else { c0 = palette.autumn[0]; c1 = palette.autumn[1]; c2 = palette.autumn[2]; }
    g.addColorStop(0, c0); g.addColorStop(0.55, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 400);
  }
  function drawSun(progress, yBase) {
    const sunX = 700 - progress * 500;
    const sunY = (yBase || 80) + Math.sin(progress * Math.PI) * 40;
    ctx.fillStyle = progress < 0.5 ? '#fff9c4' : '#ffd966';
    ctx.beginPath(); ctx.arc(sunX, sunY, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,0.30)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 44, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,0.15)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 62, 0, Math.PI*2); ctx.fill();
  }
  function drawClouds(progress, alpha) {
    ctx.fillStyle = 'rgba(255,255,255,' + (alpha || 0.7) + ')';
    for (let i=0;i<5;i++){
      const cx = ((i*190 + progress*130) % 950) - 80;
      const cy = 40 + i*22 + Math.sin(i*1.7)*8;
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI*2);
      ctx.arc(cx+22, cy-6, 18, 0, Math.PI*2);
      ctx.arc(cx+42, cy, 20, 0, Math.PI*2);
      ctx.arc(cx+18, cy+8, 16, 0, Math.PI*2);
      ctx.fill();
    }
  }
  function drawMountains(progress, colorSpring, colorAutumn) {
    ctx.fillStyle = progress < 0.6 ? colorSpring : colorAutumn;
    ctx.beginPath();
    ctx.moveTo(0, 260); ctx.lineTo(120, 160); ctx.lineTo(260, 230);
    ctx.lineTo(420, 130); ctx.lineTo(600, 220); ctx.lineTo(740, 150);
    ctx.lineTo(800, 200); ctx.lineTo(800, 400); ctx.lineTo(0, 400);
    ctx.closePath(); ctx.fill();
    if (progress < 0.25) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      [[120,160],[420,130],[740,150]].forEach(function(p){
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
        ctx.lineTo(p[0]+20, p[1]+22);
        ctx.lineTo(p[0]-20, p[1]+22);
        ctx.closePath(); ctx.fill();
      });
    }
  }
  function drawGround(progress, springColor, autumnColor) {
    ctx.fillStyle = progress < 0.65 ? springColor : autumnColor;
    ctx.fillRect(0, 340, 800, 60);
    for (let i=0;i<80;i++){
      const gx = (i*13) % 800;
      const gh = 3 + (i%4)*3;
      ctx.fillStyle = progress < 0.65 ? '#3a7a3a' : '#8a6a2a';
      px(gx, 340 - gh, 2, gh, ctx.fillStyle);
    }
    if (progress < 0.35) {
      for (let i=0;i<14;i++){
        const fx = (i*57 + 20) % 800;
        const fy = 332 + (i%3)*3;
        ctx.fillStyle = ['#ffb6c1','#fffacd','#e6e6fa'][i%3];
        px(fx, fy, 3, 3, ctx.fillStyle);
      }
    }
  }
  function drawProgressBar(progress) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(30, 95, 200, 10);
    ctx.fillStyle = '#f0c45a';
    ctx.fillRect(30, 95, 200 * progress, 10);
  }

  /* =========================================================
     話1: derivative
     ========================================================= */
  function drawOliveTree(baseX, baseY, scale, ripeness, sway) {
    const trunkColor = '#6b4e3a';
    const leafColor = ripeness > 0.7 ? '#2d6a2d' : '#3a8a3a';
    const oliveColor = ripeness > 0.8 ? '#2f2f1f' : '#7aa05a';
    px(baseX - 6*scale, baseY - 40*scale, 12*scale, 40*scale, trunkColor);
    ctx.fillStyle = leafColor;
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + sway;
      const rx = baseX + Math.cos(angle) * (28 + Math.sin(sway*2 + i)) * scale;
      const ry = baseY - 50*scale + Math.sin(angle) * 18 * scale;
      ctx.beginPath(); ctx.arc(rx, ry, 12*scale, 0, Math.PI*2); ctx.fill();
    }
    px(baseX - 2*scale, baseY - 38*scale, 3*scale, 34*scale, '#8b6a4a');
    if (ripeness > 0.3) {
      ctx.fillStyle = oliveColor;
      for (let i = 0; i < 7; i++) {
        const ox = baseX - 22*scale + i * 8 * scale;
        const oy = baseY - 60*scale + (i%3)*6*scale + Math.sin(sway + i)*2;
        ctx.beginPath(); ctx.arc(ox, oy, 3.5*scale, 0, Math.PI*2); ctx.fill();
        if (ripeness > 0.8) px(ox - 1*scale, oy - 1*scale, 1.5*scale, 1.5*scale, '#5a5a3a');
      }
    }
  }
  function drawPressMachine(x, y, scale, isRented) {
    const machineColor = isRented ? '#b8860b' : '#5a5a5a';
    const accentColor = isRented ? '#d4a017' : '#3a3a3a';
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y + 10*scale, 28*scale, 6*scale, 0, 0, Math.PI*2); ctx.fill();
    px(x - 25*scale, y - 10*scale, 50*scale, 20*scale, machineColor);
    px(x - 25*scale, y - 10*scale, 50*scale, 4*scale, isRented ? '#e0b030' : '#6a6a6a');
    px(x - 20*scale, y - 40*scale, 8*scale, 30*scale, accentColor);
    px(x + 12*scale, y - 40*scale, 8*scale, 30*scale, accentColor);
    px(x - 20*scale, y - 40*scale, 40*scale, 8*scale, accentColor);
    px(x - 6*scale, y - 50*scale, 12*scale, 10*scale, '#c0c0c0');
    if (isRented) px(x - 26*scale, y - 12*scale, 6*scale, 6*scale, '#ffd700');
  }
  function drawThalesOlive(x, y, scale, phase, mood) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y + 22*scale, 16*scale, 5*scale, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f5deb3';
    ctx.beginPath(); ctx.arc(x, y - 20*scale, 10*scale, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d2b48c';
    ctx.beginPath(); ctx.ellipse(x, y - 10*scale, 7*scale, 4*scale, 0, 0, Math.PI*2); ctx.fill();
    px(x - 4*scale, y - 24*scale, 2*scale, 2*scale, '#000');
    px(x + 2*scale, y - 24*scale, 2*scale, 2*scale, '#000');
    ctx.fillStyle = '#4a6b8a';
    ctx.beginPath(); ctx.ellipse(x, y, 14*scale, 18*scale, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8e8d8';
    ctx.fillRect(x - 14*scale, y + 4*scale, 28*scale, 4*scale);
    ctx.strokeStyle = '#4a6b8a'; ctx.lineWidth = 5*scale; ctx.lineCap = 'round';
    const armSwing = Math.sin(phase) * 0.3;
    ctx.beginPath(); ctx.moveTo(x - 12*scale, y - 6*scale); ctx.lineTo(x - 24*scale, y - 2*scale + armSwing*10*scale); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 12*scale, y - 6*scale); ctx.lineTo(x + 24*scale, y - 2*scale - armSwing*10*scale); ctx.stroke();
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4*scale;
    ctx.beginPath(); ctx.moveTo(x + 24*scale, y - 2*scale - armSwing*10*scale); ctx.lineTo(x + 28*scale, y + 26*scale); ctx.stroke();
  }
  function drawStarsAndTelescope(progress) {
    for (let i = 0; i < 30; i++) {
      const sx = (i * 47 + 13) % 750 + 20;
      const sy = (i * 29) % 200 + 20;
      const size = 1 + (i % 3);
      const twinkle = 0.6 + 0.4 * Math.sin(progress*20 + i*3);
      ctx.fillStyle = 'rgba(255,249,196,' + twinkle + ')';
      ctx.fillRect(sx, sy, size, size);
    }
    ctx.fillStyle = '#f0e68c';
    ctx.beginPath(); ctx.arc(700, 60, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(240,230,140,0.25)';
    ctx.beginPath(); ctx.arc(700, 60, 36, 0, Math.PI*2); ctx.fill();
    px(120, 180, 40, 8, '#8b5a2b');
    px(140, 160, 8, 40, '#8b5a2b');
    ctx.fillStyle = '#708090';
    ctx.beginPath();
    ctx.moveTo(160, 180); ctx.lineTo(200, 140); ctx.lineTo(210, 150); ctx.lineTo(170, 190);
    ctx.fill();
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(150, 200); ctx.lineTo(130, 230); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(150, 200); ctx.lineTo(170, 230); ctx.stroke();
  }

  function drawDerivativeScene(progress) {
    const skyGradient = ctx.createLinearGradient(0, 0, 0, 400);
    if (progress < 0.3) {
      skyGradient.addColorStop(0, '#0a1f2a');
      skyGradient.addColorStop(0.55, '#1a3a4a');
      skyGradient.addColorStop(1, '#2a4a3a');
    } else if (progress < 0.65) {
      skyGradient.addColorStop(0, '#3a6b8a');
      skyGradient.addColorStop(0.55, '#7aa87a');
      skyGradient.addColorStop(1, '#a8c88a');
    } else {
      skyGradient.addColorStop(0, '#b87c4b');
      skyGradient.addColorStop(0.55, '#dbb87c');
      skyGradient.addColorStop(1, '#e8c89a');
    }
    ctx.fillStyle = skyGradient; ctx.fillRect(0, 0, 800, 400);

    if (progress < 0.4) drawStarsAndTelescope(progress);
    if (progress > 0.25) drawSun(progress, 70);
    if (progress > 0.3) drawClouds(progress, 0.55);

    ctx.fillStyle = progress < 0.65 ? '#6b8e6b' : '#8b7d4b';
    ctx.beginPath();
    ctx.moveTo(0, 260); ctx.lineTo(120, 160); ctx.lineTo(260, 230);
    ctx.lineTo(420, 130); ctx.lineTo(600, 220); ctx.lineTo(740, 150);
    ctx.lineTo(800, 200); ctx.lineTo(800, 400); ctx.lineTo(0, 400);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = progress < 0.65 ? '#3a5a3a' : '#8b7d4b';
    ctx.fillRect(0, 280, 800, 120);
    for (let i=0;i<70;i++){
      const gx = (i*15) % 800;
      const gh = 3 + (i%4)*3;
      ctx.fillStyle = progress < 0.65 ? '#2a6a2a' : '#7a5a2a';
      px(gx, 280 - gh, 2, gh, ctx.fillStyle);
    }

    const sway = Math.sin(progress * Math.PI * 4) * 0.15;
    [100, 260, 460, 640].forEach(function(x){
      const ripeness = Math.min(1, Math.max(0, (progress - 0.45) * 2.2));
      drawOliveTree(x, 280, 0.9, ripeness, sway);
    });
    [90, 210, 380, 520, 660].forEach(function(x, idx){
      drawPressMachine(x, 260, 0.8, idx < 3);
    });

    let thalesX = 200 + progress * 400;
    if (progress < 0.2) thalesX = 180;
    else if (progress > 0.8) thalesX = 600 - (progress - 0.8) * 100;
    drawThalesOlive(thalesX, 250, 1.2, progress * Math.PI * 4, progress);

    if (progress > 0.55) {
      const crowdAlpha = Math.min(1, (progress - 0.55) * 3);
      ctx.globalAlpha = crowdAlpha;
      for (let i = 0; i < 6; i++) {
        const cx = 480 + i * 55;
        const cy = 260 + Math.sin(i*1.3) * 8;
        ctx.fillStyle = ['#4a6b8a','#6b4a3a','#3a6b4a','#6b3a5a','#5a5a8a','#8a6a3a'][i%6];
        ctx.beginPath(); ctx.arc(cx, cy - 20, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(cx - 8, cy - 12, 16, 20);
        ctx.fillStyle = '#f5deb3';
        ctx.beginPath(); ctx.arc(cx, cy - 24, 6, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1.0;
    }

    if (progress > 0.78) {
      const goldAlpha = Math.min(1, (progress - 0.78) * 4);
      for (let i = 0; i < 20; i++) {
        const gx = 580 + Math.sin(i * 1.5 + progress * 12) * 100;
        const gy = 200 + Math.cos(i * 2.3 + progress * 8) * 60;
        ctx.fillStyle = 'rgba(255,215,0,' + goldAlpha + ')';
        ctx.beginPath(); ctx.arc(gx, gy, 4 + (i % 3), 0, Math.PI*2); ctx.fill();
        if (i % 4 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,' + goldAlpha*0.8 + ')';
          px(gx - 1, gy - 8, 2, 16, ctx.fillStyle);
          px(gx - 8, gy - 1, 16, 2, ctx.fillStyle);
        }
      }
    }

    pixelText('DERIVATIVE', 30, 40, 28, '#f0e6b0');
    pixelText('— タレスのオリーブ圧搾機 —', 40, 72, 14, '#cfe8cf');

    let chapter = '';
    let chapterColor = '#fff9e6';
    if (progress < 0.18) chapter = '第一章：冬 — 天文学の観測';
    else if (progress < 0.4) chapter = '第二章：圧搾機を借り占める';
    else if (progress < 0.65) chapter = '第三章：豊作の予感';
    else if (progress < 0.85) chapter = '第四章：莫大な利益';
    else { chapter = '終章：欲すれば富は可能、されど関心なし'; chapterColor = '#ffe0a0'; }
    pixelText(chapter, 40, 110, 18, chapterColor);
    drawProgressBar(progress);

    if (progress > 0.1 && progress < 0.28) {
      drawSpeechBubble(80, 180, 250, 60, 'タレス「来年は豊作だ」', 'left');
    } else if (progress > 0.35 && progress < 0.5) {
      drawSpeechBubble(80, 180, 270, 70, 'タレス「全ての圧搾機を\n借りておこう」', 'left');
    } else if (progress > 0.7 && progress < 0.82) {
      drawSpeechBubble(80, 180, 280, 80, '人々「圧搾機を貸してくれ！」\nタレス「さあ、どうぞ」', 'left');
    } else if (progress > 0.88) {
      drawSpeechBubble(80, 180, 300, 80, 'タレス「欲すれば富は可能。\nされど我が関心は別にあり」', 'left');
    }
  }

  /* =========================================================
     話2: asinus
     ========================================================= */
  function drawBackgroundAsinus(progress) {
    drawSkyBase(progress, {
      spring: ['#87ceeb', '#b0e0e6', '#98fb98'],
      summer: ['#4a90d9', '#87ceeb', '#7ccd7c'],
      autumn: ['#dda15e', '#e9c46a', '#bc6c25']
    });
    drawSun(progress, 80);
    drawClouds(progress, 0.7);
    drawMountains(progress, '#6b8e6b', '#8b7d4b');

    ctx.fillStyle = progress < 0.7 ? '#5b9bd5' : '#4a7a9a';
    ctx.beginPath();
    ctx.moveTo(0, 300);
    ctx.quadraticCurveTo(200, 290, 400, 305);
    ctx.quadraticCurveTo(600, 320, 800, 300);
    ctx.lineTo(800, 340);
    ctx.quadraticCurveTo(600, 360, 400, 345);
    ctx.quadraticCurveTo(200, 330, 0, 340);
    ctx.closePath(); ctx.fill();
    for (let i=0;i<24;i++){
      const wx = (i*71 + progress*200) % 800;

  function drawMarketStall(x, y, s, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x, y + 2*s, 34*s, 6*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x-30*s, y-30*s); ctx.lineTo(x+30*s, y-30*s);
    ctx.lineTo(x+20*s, y-45*s); ctx.lineTo(x-20*s, y-45*s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i=0;i<5;i++){
      ctx.beginPath();
      ctx.moveTo(x-26*s + i*12*s, y-30*s);
      ctx.lineTo(x-22*s + i*12*s, y-30*s);
      ctx.lineTo(x-18*s + i*12*s, y-45*s);
      ctx.lineTo(x-22*s + i*12*s, y-45*s);
      ctx.closePath(); ctx.fill();
    }
    px(x-22*s, y-30*s, 5*s, 30*s, '#8b5a2b');
    px(x+17*s, y-30*s, 5*s, 30*s, '#8b5a2b');
    ctx.fillStyle = '#d4a017';
    ctx.beginPath(); ctx.ellipse(x, y-5*s, 18*s, 8*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c050';
    for (let i=0;i<4;i++){
      ctx.beginPath(); ctx.arc(x-12*s + i*8*s, y-8*s, 3*s, 0, Math.PI*2); ctx.fill();
    }
  }
  function drawThalesAsinus(x, y, s, phase, walking) {
    const bob = walking ? Math.sin(phase*2)*2 : 0;
    y += bob;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x, y + 22*s, 15*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f5deb3';
    ctx.beginPath(); ctx.arc(x, y-22*s, 11*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d2b48c';
    ctx.beginPath(); ctx.ellipse(x, y-10*s, 8*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
    px(x-5*s, y-26*s, 3*s, 3*s, '#000');
    px(x+2*s, y-26*s, 3*s, 3*s, '#000');
    ctx.fillStyle = '#f0f0e0';
    ctx.beginPath(); ctx.ellipse(x, y, 15*s, 20*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a6b8a';
    ctx.fillRect(x-15*s, y+2*s, 30*s, 6*s);
    ctx.strokeStyle = '#f5deb3'; ctx.lineWidth = 5*s; ctx.lineCap = 'round';
    const armSwing = walking ? Math.sin(phase*2)*0.5 : 0.2;
    ctx.beginPath(); ctx.moveTo(x-12*s, y-8*s); ctx.lineTo(x-26*s, y-2*s + armSwing*14*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+12*s, y-8*s); ctx.lineTo(x+26*s, y-2*s - armSwing*14*s); ctx.stroke();
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4*s;
    ctx.beginPath(); ctx.moveTo(x+26*s, y-2*s - armSwing*14*s); ctx.lineTo(x+30*s, y+30*s); ctx.stroke();
  }
  function drawDonkey(x, y, s, phase, walking, burden, burdenType) {
    const bob = walking ? Math.sin(phase*2)*2 : 0;
    y += bob;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x, y + 30*s, 26*s, 6*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#6b5a4a'; ctx.lineWidth = 4*s; ctx.lineCap = 'round';
    const legSwing = walking ? Math.sin(phase*2)*0.6 : 0;
    ctx.beginPath(); ctx.moveTo(x-14*s, y+10*s); ctx.lineTo(x-16*s + legSwing*8*s, y+28*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-6*s, y+10*s); ctx.lineTo(x-4*s - legSwing*8*s, y+28*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+6*s, y+10*s); ctx.lineTo(x+8*s + legSwing*8*s, y+28*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+14*s, y+10*s); ctx.lineTo(x+16*s - legSwing*8*s, y+28*s); ctx.stroke();
    ctx.fillStyle = '#3a2a1a';
    px(x-17*s + legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    px(x-5*s - legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    px(x+7*s + legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    px(x+15*s - legSwing*8*s, y+28*s, 4*s, 3*s, '#3a2a1a');
    ctx.fillStyle = '#8b7355';
    ctx.beginPath(); ctx.ellipse(x, y, 22*s, 13*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a08a6a';
    ctx.beginPath(); ctx.ellipse(x, y+3*s, 18*s, 8*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8b7355';
    ctx.beginPath(); ctx.ellipse(x-18*s, y-10*s, 9*s, 16*s, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x-26*s, y-22*s, 10*s, 9*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7a6345';
    ctx.beginPath(); ctx.ellipse(x-33*s, y-20*s, 4*s, 3*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8b7355';
    ctx.beginPath(); ctx.ellipse(x-30*s, y-32*s, 3*s, 8*s, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x-24*s, y-33*s, 3*s, 8*s, 0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c0a080';
    ctx.beginPath(); ctx.ellipse(x-30*s, y-32*s, 1.5*s, 5*s, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x-24*s, y-33*s, 1.5*s, 5*s, 0.2, 0, Math.PI*2); ctx.fill();
    px(x-30*s, y-24*s, 2.5*s, 2.5*s, '#000');
    px(x-34*s, y-20*s, 3*s, 2*s, '#4a3a2a');
    ctx.strokeStyle = '#6b5a4a'; ctx.lineWidth = 3*s;
    ctx.beginPath();
    ctx.moveTo(x+22*s, y-4*s);
    ctx.quadraticCurveTo(x+30*s, y-8*s + Math.sin(phase*3)*4*s, x+28*s, y+2*s);
    ctx.stroke();
    ctx.fillStyle = '#4a3a2a';
    ctx.beginPath(); ctx.arc(x+28*s, y+2*s, 3*s, 0, Math.PI*2); ctx.fill();

    if (burdenType === 'salt' && burden) {
      ctx.fillStyle = '#f5f5f0';
      ctx.beginPath(); ctx.ellipse(x+2*s, y-16*s, 14*s, 9*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#dcdcd0';
      ctx.beginPath(); ctx.ellipse(x+2*s, y-18*s, 10*s, 6*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8b6a4a'; ctx.lineWidth = 2*s;
      ctx.beginPath(); ctx.moveTo(x-4*s, y-24*s); ctx.lineTo(x+8*s, y-24*s); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      for (let i=0;i<5;i++){
        px(x-8*s + i*5*s, y-22*s - (i%2)*3*s, 2*s, 2*s, '#fff');
      }
    } else if (burdenType === 'sponge' && burden) {
      ctx.fillStyle = '#d4b86a';
      for (let i=0;i<4;i++){
        ctx.beginPath();
        ctx.arc(x-10*s + i*8*s, y-18*s + (i%2)*3*s, 8*s, 0, Math.PI*2);

  function drawAsinusScene(progress) {
    drawBackgroundAsinus(progress);
    drawMarketStall(720, 320, 1.2, '#c0392b');

    pixelText('ASINUS', 30, 380, 28, '#f0e6b0');
    pixelText('— The Salt-Laden Donkey & Thales —', 140, 382, 14, '#b8d9b8');

    let seasonText = '';
    let seasonColor = '#fff';
    if (progress < 0.35) { seasonText = '春 — 塩を運ぶ'; seasonColor = '#e0ffe0'; }
    else if (progress < 0.7) { seasonText = '夏 — 繰り返される転倒'; seasonColor = '#fff9c4'; }
    else { seasonText = '秋 — 海綿の教訓'; seasonColor = '#ffe0b0'; }

    else if (progress < 0.6) subText = '第三章：タレスの一計';
    else if (progress < 0.8) subText = '第四章：海綿の重み';
    else subText = '終章：それ以後、転ばなくなる';
    pixelText(subText, 30, 75, 16, '#cfe8cf');
    drawProgressBar(progress);

    const walkPhase = progress * Math.PI * 6;
    const thalesX = 150 + Math.sin(progress * Math.PI * 2) * 80;
    drawThalesAsinus(thalesX, 320, 1.0, walkPhase, true);

    let donkeyX = 250 + progress * 350;
    if (donkeyX > 620) donkeyX = 620;
    const donkeyY = 320;
    let burdenType = 'salt';
    let hasBurden = true;
    if (progress > 0.72) burdenType = 'sponge';
    const fallMoment = Math.abs(Math.sin(progress * Math.PI * 6)) > 0.9;
    if (fallMoment && progress < 0.7) hasBurden = false;
    drawDonkey(donkeyX, donkeyY, 1.0, walkPhase, true, hasBurden, burdenType);

    if (fallMoment && progress < 0.7) {
      ctx.fillStyle = 'rgba(200,230,255,0.7)';

        const sx = donkeyX + (Math.random()-0.5)*70;

        ctx.beginPath(); ctx.arc(sx, sy, 3 + Math.random()*5, 0, Math.PI*2); ctx.fill();
      }
      pixelText('ドボン！', donkeyX-30, donkeyY-60, 20, '#a0d8ff');
    }
    if (progress > 0.15 && progress < 0.35 && fallMoment) {
      for (let i=0;i<8;i++) px(donkeyX-20+i*8, 330 + i*3, 4, 4, 'rgba(255,255,255,0.7)');
    }

    if (progress < 0.15) {
      drawSpeechBubble(80, 130, 200, 60, '塩を市場へ運ぼう', 'left');
    } else if (progress < 0.3) {
      drawSpeechBubble(donkeyX-60, 180, 220, 70, '転んだら…\n荷が軽くなった！', 'right');
    } else if (progress < 0.45) {
      drawSpeechBubble(donkeyX-80, 160, 240, 70, 'わざと転べば\n楽できるぞ', 'right');
    } else if (progress < 0.6) {
      drawSpeechBubble(80, 140, 230, 80, 'タレス「このろば、\n学習してしまったか」', 'left');
    } else if (progress < 0.75) {
      drawSpeechBubble(80, 130, 240, 80, 'タレス「ならば\n海綿を積もう」', 'left');
    } else if (progress < 0.9) {
      drawSpeechBubble(donkeyX-80, 150, 260, 90, 'ろば「転んだら…\n重くなった！？」', 'right');
    } else {
      drawSpeechBubble(200, 140, 280, 70, 'それ以後、ろばは\nつまずかなくなった', 'left');
    }

    if (progress > 0.78 && progress < 0.92) {
      ctx.fillStyle = 'rgba(100,150,255,0.5)';
      for (let i=0;i<10;i++){
        const wx = donkeyX - 20 + i*8;

      ctx.fillStyle = '#ffd700';
      for (let i=0;i<20;i++){
        const sx = (i*97 + progress*300) % 800;

      }
    }
  }

  function drawConferenceScene(elapsedSinceConfStart, storyKey) {
    // 会議室の背景（壁・机・プロジェクター）
    // 壁
    ctx.fillStyle = '#2a3a2a';
    ctx.fillRect(0, 0, 800, 400);
    // 壁の木目
    for (let i=0;i<30;i++){
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      px(0, i*14, 800, 3, 'rgba(0,0,0,0.1)');
    }
    // 机
    ctx.fillStyle = '#5a3a1a';
    ctx.beginPath();
    ctx.moveTo(0, 340); ctx.lineTo(800, 340);
    ctx.lineTo(800, 400); ctx.lineTo(0, 400);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a5a2a';
    ctx.fillRect(0, 340, 800, 6);

    // プロジェクタースクリーン（中央上）
    const screenX = 180, screenY = 40, screenW = 440, screenH = 260;
    // スクリーン枠
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(screenX - 6, screenY - 6, screenW + 12, screenH + 12);
    // スクリーン白
    ctx.fillStyle = '#e8e8e0';
    ctx.fillRect(screenX, screenY, screenW, screenH);

    // スクリーンに映す静止画（フリーズしたアニメの一場面）
    // クリッピングして中に描く
    ctx.save();
    ctx.beginPath();
    ctx.rect(screenX, screenY, screenW, screenH);
    ctx.clip();

    // スクリーン内のシーンを再現（縮小して描画）
    // canvas 800x400 の内容を screenW x screenH にスケール
    const sx = screenW / 800;
    const sy = screenH / 400;
    // 手動でスケールして描く（簡易的に translate + scale）
    ctx.translate(screenX, screenY);
    ctx.scale(sx, sy);

    // ここで静止画を描画。frozenProgress の値で固定。
    if (storyKey === 'derivative') {
      // 静止画のシーン（クライマックス：収穫期）
      // 背景
      const g = ctx.createLinearGradient(0, 0, 0, 400);
      g.addColorStop(0, '#b87c4b'); g.addColorStop(0.55, '#dbb87c'); g.addColorStop(1, '#e8c89a');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 400);
      // 山
      ctx.fillStyle = '#8b7d4b';
      ctx.beginPath();
      ctx.moveTo(0, 260); ctx.lineTo(120, 160); ctx.lineTo(260, 230);
      ctx.lineTo(420, 130); ctx.lineTo(600, 220); ctx.lineTo(740, 150);
      ctx.lineTo(800, 200); ctx.lineTo(800, 400); ctx.lineTo(0, 400);
      ctx.closePath(); ctx.fill();
      // 地面
      ctx.fillStyle = '#8b7d4b'; ctx.fillRect(0, 280, 800, 120);
      // オリーブの木（実り）
      const swayF = 0.1;
      [100, 260, 460, 640].forEach(function(x){
        drawOliveTree(x, 280, 0.9, 1.0, swayF);
      });
      // 圧搾機
      [90, 210, 380, 520, 660].forEach(function(x, idx){
        drawPressMachine(x, 260, 0.8, idx < 3);
      });
      // タレス
      drawThalesOlive(500, 250, 1.2, 1.5, 1);
      // 人々
      for (let i = 0; i < 6; i++) {
        const cx = 480 + i * 55;
        const cy = 260 + Math.sin(i*1.3) * 8;
        ctx.fillStyle = ['#4a6b8a','#6b4a3a','#3a6b4a','#6b3a5a','#5a5a8a','#8a6a3a'][i%6];
        ctx.beginPath(); ctx.arc(cx, cy - 20, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(cx - 8, cy - 12, 16, 20);
        ctx.fillStyle = '#f5deb3';
        ctx.beginPath(); ctx.arc(cx, cy - 24, 6, 0, Math.PI*2); ctx.fill();
      }
      // 金貨
      for (let i = 0; i < 20; i++) {
        const gx = 580 + Math.sin(i * 1.5 + 12) * 100;
        const gy = 200 + Math.cos(i * 2.3 + 8) * 60;
        ctx.fillStyle = 'rgba(255,215,0,1)';
        ctx.beginPath(); ctx.arc(gx, gy, 4 + (i % 3), 0, Math.PI*2); ctx.fill();
      }
      // タイトル
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.fillStyle = '#f0e6b0';
      ctx.textAlign = 'left';
      ctx.fillText('DERIVATIVE', 30, 50);
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#fff9e6';
      ctx.fillText('第四章：莫大な利益', 40, 120);
    } else {
      // asinus の静止画（クライマックス：海綿）
      const g = ctx.createLinearGradient(0, 0, 0, 400);
      g.addColorStop(0, '#dda15e'); g.addColorStop(0.6, '#e9c46a'); g.addColorStop(1, '#bc6c25');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 400);
      // 山
      ctx.fillStyle = '#8b7d4b';
      ctx.beginPath();
      ctx.moveTo(0, 260); ctx.lineTo(150, 170); ctx.lineTo(300, 230);
      ctx.lineTo(500, 140); ctx.lineTo(700, 220); ctx.lineTo(800, 180);
      ctx.lineTo(800, 400); ctx.lineTo(0, 400); ctx.closePath(); ctx.fill();
      // 川
      ctx.fillStyle = '#4a7a9a';
      ctx.beginPath();
      ctx.moveTo(0, 300);
      ctx.quadraticCurveTo(200, 290, 400, 305);
      ctx.quadraticCurveTo(600, 320, 800, 300);
      ctx.lineTo(800, 340);
      ctx.quadraticCurveTo(600, 360, 400, 345);
      ctx.quadraticCurveTo(200, 330, 0, 340);
      ctx.closePath(); ctx.fill();
      // 地面
      ctx.fillStyle = '#b08a4a'; ctx.fillRect(0, 340, 800, 60);
      // 市場
      drawMarketStall(720, 320, 1.2, '#c0392b');
      // タレス
      drawThalesAsinus(200, 320, 1.0, 1.5, false);
      // ろば（海綿）
      drawDonkey(480, 320, 1.0, 1.5, false, true, 'sponge');
      // 海綿の水
      ctx.fillStyle = 'rgba(100,150,255,0.5)';
      for (let i=0;i<10;i++){
        const wx = 480 - 20 + i*8;
        const wy = 300 - Math.sin(12 + i)*10;

      }

      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.fillStyle = '#f0e6b0';
      ctx.textAlign = 'left';
      ctx.fillText('ASINUS', 30, 50);
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#fff9e6';
      ctx.fillText('第四章：海綿の重み', 40, 120);
    }
    ctx.restore();

    // スクリーンの反射
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.moveTo(screenX, screenY);
    ctx.lineTo(screenX + 120, screenY);
    ctx.lineTo(screenX, screenY + 120);
    ctx.closePath(); ctx.fill();

    // プロジェクター本体（天井から）
    ctx.fillStyle = '#333';
    ctx.fillRect(370, 0, 60, 20);
    ctx.fillStyle = '#555';
    ctx.fillRect(375, 20, 50, 8);
    // 投影光
    ctx.fillStyle = 'rgba(255,255,200,0.06)';
    ctx.beginPath();
    ctx.moveTo(390, 28);
    ctx.lineTo(screenX - 20, screenY + 40);
    ctx.lineTo(screenX + screenW + 20, screenY + 40);
    ctx.lineTo(410, 28);
    ctx.closePath(); ctx.fill();

    // 演者（6人）を机の前に並べる（ドット絵風）
    const speakers = [
      { key:'bunseki',   name:'分析学者', color:'#ff5555' },
      { key:'butsuri',   name:'物理学者', color:'#55dd55' },
      { key:'tetsugaku', name:'哲学者',   color:'#bbbbbb' },
      { key:'senmon',    name:'専門学者', color:'#c77dff' },
      { key:'gendai',    name:'現代学者', color:'#ffd93d' },
      { key:'sugaku',    name:'数学者',   color:'#5aa9ff' }
    ];
    speakers.forEach(function(sp, i){
      const px0 = 60 + i * 120;
      const py0 = 300;

      // 髪
      ctx.fillStyle = '#3a2a1a';
      ctx.beginPath(); ctx.arc(px0, py0 - 44, 10, Math.PI, 0); ctx.fill();
      // 名札（色付き）
      ctx.fillStyle = sp.color;
      ctx.fillRect(px0 - 30, py0 + 4, 60, 16);
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillStyle = '#111';
      ctx.textAlign = 'center';
      ctx.fillText(sp.name, px0, py0 + 16);

    // スクリーン上の字幕（発言中のもの）
    if (currentConferenceLine) {
      const line = currentConferenceLine;
      const spColor = getSpeakerColor(line.speaker);
      // 字幕背景
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(40, 310, 720, 50);
      ctx.fillStyle = spColor;
      ctx.fillRect(40, 310, 720, 4);
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = spColor;
      ctx.fillText(line.name + '：', 50, 332);
      ctx.fillStyle = '#f0f0e0';
      // 折り返し（簡易）
      const maxWidth = 620;
      const prefix = line.name + '：';
      const prefixWidth = ctx.measureText(prefix).width;
      const text = line.text;
      // 2行に分ける
      let line1 = text, line2 = '';
      if (ctx.measureText(text).width > maxWidth - prefixWidth) {
        // 分割位置を探す
        let cut = Math.floor(text.length * (maxWidth - prefixWidth) / ctx.measureText(text).width);
        if (cut < 4) cut = 4;
        line1 = text.substring(0, cut);
        line2 = text.substring(cut);
      }
      ctx.fillText(line1, 50 + prefixWidth, 332);
      if (line2) ctx.fillText(line2, 50, 356);
    }
  }

  function getSpeakerColor(key) {
    switch(key) {
      case 'bunseki':   return '#ff5555';
      case 'butsuri':   return '#55dd55';
      case 'tetsugaku': return '#bbbbbb';
      case 'senmon':    return '#c77dff';
      case 'gendai':    return '#ffd93d';
      case 'sugaku':    return '#5aa9ff';
      default:          return '#ffffff';
    }
  }

  let currentConferenceLine = null;
  let conferenceIndex = 0;
  let conferenceLines = [];

  function startConference(storyKey) {
    phase = 'conference';
    conferenceIndex = 0;
    conferenceLines = (storyKey === 'derivative') ? CONF_DERIVATIVE : CONF_ASINUS;
    currentConferenceLine = null;
    logBody.innerHTML = '';
    logPanel.classList.add('visible');
    // スクリーン比率を保つため canvas の横にログを出す。
    // canvas はそのまま、右にログパネル。
    // 会議シーン描画開始
    if (conferenceTimer) clearInterval(conferenceTimer);
    if (conferenceLogTimer) clearTimeout(conferenceLogTimer);
    // 最初のログを少し置いてから
    conferenceTimer = setInterval(function(){
      if (conferenceIndex >= conferenceLines.length) {
        clearInterval(conferenceTimer);
        conferenceTimer = null;
        phase = 'end';
        return;
      }
      const line = conferenceLines[conferenceIndex];
      currentConferenceLine = line;
      // 右ログに追加
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const spColor = getSpeakerColor(line.speaker);
      entry.innerHTML = '<span class="log-speaker" style="color:' + spColor + '">' + line.name + '：</span><span class="log-text">' + line.text + '</span>';
      logBody.appendChild(entry);
      logBody.scrollTop = logBody.scrollHeight;
      conferenceIndex++;
    }, 6500); // 6.5秒ごとに1発言（早口にしない）
  }

  function stopConference() {
    if (conferenceTimer) { clearInterval(conferenceTimer); conferenceTimer = null; }
    if (conferenceLogTimer) { clearTimeout(conferenceLogTimer); conferenceLogTimer = null; }
    currentConferenceLine = null;
    conferenceIndex = 0;
  }

  /* ---------- メインループ ---------- */
  function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;
    const story = STORIES[currentStory];
    const progress = Math.min(elapsed / story.duration, 1.0);

    if (phase === 'animation') {
      if (currentStory === 'derivative') drawDerivativeScene(progress);
      else drawAsinusScene(progress);
    } else if (phase === 'conference' || phase === 'end') {
      drawConferenceScene(elapsed, currentStory);
    } else if (phase === 'intermission') {
      // 最後のフレームを保持
      if (currentStory === 'derivative') drawDerivativeScene(1.0);
      else drawAsinusScene(1.0);
    }

    if (progress < 1.0) {
      animationId = requestAnimationFrame(animate);
    } else {
      // アニメ終了 → 3秒後に会議開始
      if (phase === 'animation') {
        phase = 'intermission';
        frozenProgress = 1.0;
        // footer を中間からずっと表示（アニメ終了後も）
        if (!footerLinkVisible) {
          verticalLink.classList.add('visible');
          footerSub.innerHTML = '↕ <a href="vertical.html" target="_self">vertical.html へ</a>';
          footerLinkVisible = true;
        }
        intermissionStart = timestamp;
        animationId = requestAnimationFrame(animate);
      } else if (phase === 'intermission') {
        if (timestamp - intermissionStart >= 3000) {
          startConference(currentStory);
        }
        animationId = requestAnimationFrame(animate);
      } else if (phase === 'conference' || phase === 'end') {
        animationId = requestAnimationFrame(animate);
      }
    }
  }

  /* ---------- 開始・リセット ---------- */
  function startStory(storyKey) {
    if (animationId) cancelAnimationFrame(animationId);
    stopConference();
    currentStory = storyKey;
    openingOverlay.classList.add('hidden');
    backBtn.classList.add('visible');
    startTime = null;
    isAnimating = true;
    footerLinkVisible = false;
    verticalLink.classList.remove('visible');
    footerSub.innerHTML = '';
    footerTitle.textContent = STORIES[storyKey].label;
    logPanel.classList.remove('visible');
    logBody.innerHTML = '';
    phase = 'animation';
    if (storyKey === 'derivative') drawDerivativeScene(0);
    else drawAsinusScene(0);
    animationId = requestAnimationFrame(animate);
  }

  function showOpening() {
    if (animationId) cancelAnimationFrame(animationId);
    stopConference();
    isAnimating = false;
    currentStory = null;
    phase = 'opening';
    openingOverlay.classList.remove('hidden');
    backBtn.classList.remove('visible');
    ctx.clearRect(0, 0, 800, 400);
    ctx.fillStyle = '#132a1d';
    ctx.fillRect(0, 0, 800, 400);
    verticalLink.classList.remove('visible');
    footerSub.innerHTML = '';
    footerTitle.textContent = 'タレスの2つの物語';
    logPanel.classList.remove('visible');
    logBody.innerHTML = '';
  }

  derivativeBtn.addEventListener('click', function(e){ e.stopPropagation(); startStory('derivative'); });
  asinusBtn.addEventListener('click', function(e){ e.stopPropagation(); startStory('asinus'); });
  backBtn.addEventListener('click', function(e){ e.stopPropagation(); showOpening(); });

  // 初期表示（オープニングを背景に描く）
  showOpening();
})();
</script>
</body>
</html>
