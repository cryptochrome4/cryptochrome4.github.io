<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS Office - Walk &amp; Talk</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    background:#0a0c0f;
    font-family:'Segoe UI','Helvetica Neue',sans-serif;
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh; color:#e0e0e0;
    padding:20px 0; overflow-y:auto;
  }
  .game-wrapper {
    background:#11161c; border-radius:24px; padding:20px 20px 14px;
    box-shadow:0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #2a3a4a inset;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    width:fit-content;
  }
  canvas {
    display:block; border-radius:16px; background:#0b0f14;
    box-shadow:0 0 30px rgba(0,255,200,0.1);
    cursor:crosshair; width:800px; height:600px;
  }
  .footer {
    display:flex; flex-direction:column; gap:6px;
    width:100%; padding:4px 8px 0; font-size:13px; color:#7a8b9b;
    letter-spacing:0.5px;
  }
  .footer .status { display:flex; gap:16px; flex-wrap:wrap; }
  .footer .status span { color:#b0c8d8; font-weight:500; }
  .footer .status .highlight { color:#00e6b0; text-shadow:0 0 8px #00e6b088; }
  .footer .status .sp { color:#ffd166; text-shadow:0 0 8px #ffd16688; }
  .footer .status .map-coord { color:#7ad7ff; text-shadow:0 0 8px #7ad7ff88; }
  .footer .status .hidden-coord { display:none; }

  .btn-row {
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    width:100%; padding:4px 0;
  }
  .ui-btn {
    background:#1a2530; color:#00e6b0; border:2px solid #00e6b0;
    border-radius:40px; padding:7px 16px; font-size:13px; font-weight:700;
    letter-spacing:1px; cursor:pointer; transition:all 0.15s ease;
    box-shadow:0 0 10px #00e6b033; font-family:inherit;
  }
  .ui-btn:hover { background:#00e6b0; color:#0a0c0f; box-shadow:0 0 20px #00e6b0aa; }
  .ui-btn:active { transform:scale(0.96); }
  .ui-btn:disabled {
    opacity:0.35; cursor:not-allowed; border-color:#4a5a6a;
    color:#4a5a6a; background:#151b22; box-shadow:none;
  }
  .ui-btn.map-toggle { color:#7ad7ff; border-color:#7ad7ff; box-shadow:0 0 10px #7ad7ff33; }
  .ui-btn.map-toggle:hover { background:#7ad7ff; color:#0a0c0f; }
  .ui-btn.warn { color:#ff4d6d; border-color:#ff4d6d; box-shadow:0 0 10px #ff4d6d33; }
  .ui-btn.warn:hover { background:#ff4d6d; color:#0a0c0f; }
  .ui-btn.list { color:#ffd166; border-color:#ffd166; box-shadow:0 0 10px #ffd16633; }
  .ui-btn.list:hover { background:#ffd166; color:#0a0c0f; }

  .hidden { display:none !important; }
  .hint { font-size:11px; color:#4a5a6a; margin-top:2px; text-align:center; width:100%; }

  /* Opening screen */
  .opening {
    position: fixed;
    inset: 0;
    background-image: url('img196battle.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
    z-index: 9999;
    transition: opacity 0.5s ease;
  }
  .opening::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 0;
  }
  .opening h1 {
    position: relative;
    z-index: 1;
    color: #00e6b0;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: 8px;
    text-shadow: 0 0 30px #00e6b0aa, 0 0 60px #00e6b055;
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
  }
  .opening .subtitle {
    position: relative;
    z-index: 1;
    color: #b0c8d8;
    font-size: 16px;
    letter-spacing: 4px;
    margin-top: -20px;
  }
  .opening .opening-btns {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .start-btn {
    background: #00e6b0;
    color: #0a0c0f;
    border: none;
    border-radius: 50px;
    padding: 18px 72px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 30px #00e6b0cc, 0 0 60px #00e6b066;
    transition: all 0.2s ease;
  }
  .start-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 50px #00e6b0ff, 0 0 100px #00e6b0aa;
    background: #1affc0;
  }
  .start-btn:active { transform: scale(0.98); }
  .bgview-btn {
    background: transparent;
    color: #7ad7ff;
    border: 2px solid #7ad7ff;
    border-radius: 50px;
    padding: 16px 40px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 20px #7ad7ff55;
    transition: all 0.2s ease;
  }
  .bgview-btn:hover {
    background: #7ad7ff;
    color: #0a0c0f;
    box-shadow: 0 0 40px #7ad7ffaa;
  }
  .opening.hidden-opening {
    opacity: 0;
    pointer-events: none;
  }

  /* Background image viewer */
  .bg-viewer {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .bg-viewer img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .bg-viewer .close-bg {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #ff4d6d;
    color: #fff;
    border: none;
    border-radius: 40px;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 20px #ff4d6daa;
  }
  .bg-viewer .close-bg:hover { background: #ff8ad8; }

  /* Checklist */
  .checklist-panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 340px;
    background: #0d131a;
    border-left: 2px solid #00e6b0;
    box-shadow: -10px 0 40px rgba(0,0,0,0.8);
    z-index: 9000;
    display: flex;
    flex-direction: column;
    padding: 16px;
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }
  .checklist-panel.open { transform: translateX(0); }
  .checklist-panel h2 {
    color: #00e6b0;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 0 10px #00e6b088;
  }
  .checklist-panel .progress {
    color: #b0c8d8;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .checklist-panel .progress b { color: #00e6b0; }
  .checklist-scroll {
    flex: 1;
    overflow-y: auto;
    border-top: 1px solid #1e3a4a;
    border-bottom: 1px solid #1e3a4a;
    padding: 8px 0;
  }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 13px;
    color: #b0c8d8;
  }
  .checklist-item.checked { color: #00e6b0; background: #00e6b010; }
  .checklist-item .mark { width: 16px; text-align: center; }
  .checklist-item .rank { color: #ffd166; font-size: 11px; margin-left: auto; }
  .checklist-panel .panel-btns {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .checklist-panel .panel-btns button { flex: 1; }

  /* Dialogue window */
  .dialogue {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    width: 720px;
    max-width: 92vw;
    background: #0d131aee;
    border: 2px solid #00e6b0;
    border-radius: 16px;
    padding: 18px 22px;
    z-index: 9500;
    box-shadow: 0 0 40px #00e6b055;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .dialogue.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .dialogue .d-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .dialogue .d-name {
    color: #00e6b0;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .dialogue .d-meta {
    color: #7a8b9b;
    font-size: 12px;
  }
  .dialogue .d-meta b { color: #ffd166; }
  .dialogue .d-text {
    color: #e0e0e0;
    font-size: 16px;
    line-height: 1.6;
    min-height: 60px;
    letter-spacing: 0.3px;
  }
  .dialogue .d-foot {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .dialogue .d-page {
    color: #7a8b9b;
    font-size: 12px;
    margin-right: auto;
    align-self: center;
  }

  /* NPC info panel */
  .npc-panel {
    position: fixed;
    left: 24px;
    bottom: 24px;
    background: #0d131aee;
    border: 2px solid #7ad7ff;
    border-radius: 14px;
    padding: 12px 16px;
    z-index: 9400;
    color: #e0e0e0;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 0 30px #7ad7ff44;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    max-width: 280px;
  }
  .npc-panel.open { opacity: 1; }
  .npc-panel .n-name { color: #7ad7ff; font-weight: 800; font-size: 15px; }
  .npc-panel .n-rank { color: #ffd166; }
  .npc-panel .n-role { color: #b0c8d8; }
  .npc-panel .n-hint { color: #00e6b0; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>

  <!-- Opening screen -->
  <div class="opening" id="opening">
    <h1>GS OFFICE</h1>
    <div class="subtitle">- WALK &amp; TALK -</div>
    <div class="opening-btns">
      <button class="start-btn" id="startBtn">START</button>
      <button class="bgview-btn" id="bgViewBtn">VIEW BACKGROUND</button>
    </div>
  </div>

  <!-- Background image viewer -->
  <div class="bg-viewer hidden" id="bgViewer">
    <button class="close-bg" id="closeBgBtn">CLOSE ✕</button>
    <img src="img196battle.jpg" alt="background">
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="footer" id="footer">
      <div class="status">
        <span>Talked: <span id="talkedDisplay" class="highlight">0</span>/140</span>
        <span>Area: <span id="areaDisplay" class="sp">Reception</span></span>
        <span id="mapCoordSpan" class="hidden-coord">Map: <span id="mapDisplay" class="map-coord">6,6</span></span>
      </div>
    </div>

    <div class="btn-row">
      <button class="ui-btn list" id="checklistBtn">📋 CHECKLIST</button>
      <button class="ui-btn map-toggle" id="mapToggleBtn">📍 SHOW COORDS</button>
    </div>

    <div class="hint" id="hint">
      Move: Arrow Keys / Talk: Approach an NPC and click / Door: Stand in front and click
    </div>
  </div>

  <!-- Checklist panel -->
  <div class="checklist-panel" id="checklistPanel">
    <h2>CHECKLIST</h2>
    <div class="progress">Talked: <b id="clProgress">0</b> / 140</div>
    <div class="checklist-scroll" id="checklistScroll"></div>
    <div class="panel-btns">
      <button class="ui-btn" id="clClose">CLOSE</button>
      <button class="ui-btn warn" id="clReset">RESET</button>
    </div>
  </div>

  <!-- Dialogue window -->
  <div class="dialogue" id="dialogue">
    <div class="d-head">
      <div class="d-name" id="dName">Name</div>
      <div class="d-meta">Age <b id="dAge">30</b> / Rank <b id="dRank">50</b> / <span id="dRole">Role</span></div>
    </div>
    <div class="d-text" id="dText"></div>
    <div class="d-foot">
      <div class="d-page" id="dPage">1 / 1</div>
      <button class="ui-btn" id="dNext">NEXT ▶</button>
      <button class="ui-btn warn" id="dClose">CLOSE</button>
    </div>
  </div>

  <!-- NPC info panel -->
  <div class="npc-panel" id="npcPanel">
    <div class="n-name" id="npName">Name</div>
    <div>Age: <span id="npAge">30</span></div>
    <div class="n-rank">Rank: <span id="npRank">50</span> / 100</div>
    <div class="n-role">Role: <span id="npRole">Trader</span></div>
    <div class="n-hint">Click to talk</div>
  </div>

    const grid = [

      ['park','hall','trading','trading','trading','hall','hall','hall','cafe','cafe','garden'],
      ['park','executive','executive','hall','server','server','hall','lounge','cafe','cafe','garden'],

      ['garden','hall','hall','hall','hall','hall','hall','lounge','gym','gym','garden'],
      ['garden','meeting','meeting','hall','library','library','hall','hall','gym','gym','garden'],
      ['garden','meeting','meeting','hall','library','library','hall','rooftop','rooftop','rooftop','garden'],
      ['garden','garden','garden','garden','garden','garden','garden','rooftop','rooftop','rooftop','garden'],
    ];
    const nameMap = {
      parking:'Parking', road:'Road', park:'Park', garden:'Garden',
      reception:'Reception', hall:'Hallway', trading:'Trading Floor',
      meeting:'Meeting Room', cafe:'Cafeteria', executive:'Executive Floor',
      server:'Server Room', lounge:'Lounge', gym:'Gym', library:'Library',
      rooftop:'Rooftop Garden',
    };
    areas = [];
    for (let r = 0; r < MAP_ROWS; r++) {
      for (let c = 0; c < MAP_COLS; c++) {
        areas.push({
          col:c, row:r,
          x:c*MAP_W, y:r*MAP_H,
          w:MAP_W, h:MAP_H,
          type:grid[r][c],
          name:nameMap[grid[r][c]] || 'Area',
        });
      }
    }
  }

  function areaAt(x, y) {
    const c = clamp(Math.floor(x / MAP_W), 0, MAP_COLS-1);
    const r = clamp(Math.floor(y / MAP_H), 0, MAP_ROWS-1);
    return areas.find(a => a.col===c && a.row===r) || areas[0];
  }

  // ============================================================
  //  Doors
  // ============================================================
  function buildDoors() {
    doors = [];
    for (const a of areas) {
      if (a.type === 'garden' || a.type === 'park' || a.type === 'road' || a.type === 'parking') continue;
      doors.push({ x:a.x + a.w/2 - 30, y:a.y - 8, w:60, h:16, open:false, area:a, side:'top' });

      doors.push({ x:a.x + a.w - 8, y:a.y + a.h/2 - 30, w:16, h:60, open:false, area:a, side:'right' });
    }

  function buildNPCs() {
    npcs = [];
    const total = 140;
    const rolePlan = [];
    rolePlan.push({role:'CEO', count:1, rankMin:100, rankMax:100});
    rolePlan.push({role:'Partner', count:4, rankMin:90, rankMax:99});
    rolePlan.push({role:'Managing Director', count:10, rankMin:80, rankMax:89});
    rolePlan.push({role:'Vice President', count:15, rankMin:70, rankMax:79});
    rolePlan.push({role:'Trader', count:20, rankMin:40, rankMax:69});
    rolePlan.push({role:'Salesperson', count:10, rankMin:40, rankMax:69});
    rolePlan.push({role:'Investment Banker', count:10, rankMin:40, rankMax:69});
    rolePlan.push({role:'Software Engineer', count:10, rankMin:40, rankMax:69});
    rolePlan.push({role:'Data Scientist', count:6, rankMin:40, rankMax:69});
    rolePlan.push({role:'Quant', count:6, rankMin:40, rankMax:69});
    rolePlan.push({role:'Risk Manager', count:5, rankMin:40, rankMax:69});
    rolePlan.push({role:'Compliance Officer', count:5, rankMin:40, rankMax:69});
    rolePlan.push({role:'HR Manager', count:4, rankMin:40, rankMax:69});
    rolePlan.push({role:'Recruiter', count:4, rankMin:40, rankMax:69});
    rolePlan.push({role:'Security', count:5, rankMin:10, rankMax:39});
    rolePlan.push({role:'Receptionist', count:3, rankMin:10, rankMax:39});
    rolePlan.push({role:'Chef', count:3, rankMin:10, rankMax:39});
    rolePlan.push({role:'Barista', count:3, rankMin:10, rankMax:39});
    rolePlan.push({role:'Janitor', count:3, rankMin:0, rankMax:9});
    rolePlan.push({role:'Intern', count:5, rankMin:0, rankMax:9});
    rolePlan.push({role:'Research Analyst', count:4, rankMin:40, rankMax:69});
    rolePlan.push({role:'Portfolio Manager', count:4, rankMin:40, rankMax:69});
    rolePlan.push({role:'Financial Advisor', count:3, rankMin:40, rankMax:69});
    rolePlan.push({role:'Accountant', count:3, rankMin:40, rankMax:69});
    rolePlan.push({role:'Lawyer', count:3, rankMin:40, rankMax:69});
    rolePlan.push({role:'Consultant', count:3, rankMin:40, rankMax:69});
    rolePlan.push({role:'Strategist', count:3, rankMin:40, rankMax:69});
    rolePlan.push({role:'Operations Manager', count:3, rankMin:40, rankMax:69});

    let idx = 0;
    for (const plan of rolePlan) {
      for (let i = 0; i < plan.count && idx < total; i++) {
        const role = plan.role;
        const age = role === 'CEO' ? 62 : randInt(22, 65);
        const rank = role === 'CEO' ? 100 : randInt(plan.rankMin, plan.rankMax);
        const first = pick(FIRST_NAMES);
        const last = pick(LAST_NAMES);
        const name = `${first} ${last}`;
        let areaType = 'hall';
        if (role === 'CEO' || role === 'Partner') areaType = 'executive';
        else if (role === 'Managing Director' || role === 'Vice President') areaType = 'trading';
        else if (role === 'Trader' || role === 'Salesperson' || role === 'Investment Banker') areaType = 'trading';
        else if (role === 'Software Engineer' || role === 'Data Scientist' || role === 'Quant') areaType = 'server';
        else if (role === 'HR Manager' || role === 'Recruiter') areaType = 'meeting';
        else if (role === 'Security' || role === 'Receptionist') areaType = 'reception';
        else if (role === 'Chef' || role === 'Barista') areaType = 'cafe';
        else if (role === 'Janitor') areaType = 'hall';
        else if (role === 'Intern') areaType = 'library';
        else areaType = pick(['trading','meeting','lounge','library','hall']);

        const areaCandidates = areas.filter(a => a.type === areaType);
        const area = areaCandidates.length ? pick(areaCandidates) : pick(areas);
        const x = rand(area.x + 60, area.x + area.w - 60);
        const y = rand(area.y + 60, area.y + area.h - 60);

        let behavior = 'idle';
        if (areaType === 'hall' || areaType === 'garden' || areaType === 'park' || areaType === 'road' || areaType === 'rooftop') {
          behavior = Math.random() < 0.6 ? 'walk' : 'idle';
        } else if (areaType === 'trading' || areaType === 'server' || areaType === 'library') {
          behavior = Math.random() < 0.8 ? 'idle' : 'walk';
        } else {
          behavior = Math.random() < 0.5 ? 'walk' : 'idle';
        }

        const walkRange = behavior === 'walk' ? rand(40, 160) : 0;
        const baseX = x, baseY = y;
        const phase = Math.random() * Math.PI * 2;
        const speed = behavior === 'walk' ? rand(0.3, 0.9) : 0;

        const baseLines = EN_LINES[role] || EN_LINES['Analyst'];
        const talkLen = randInt(1, Math.max(1, baseLines.length));
        const dialogueEN = baseLines.slice(0, talkLen);

        npcs.push({
          id: idx,
          name, age, rank, role,
          x, y,
          baseX, baseY,
          behavior, walkRange, phase, speed,
          radius: 14,
          dialogueEN,
          talked: false,
        });
        idx++;
      }
    }
    while (npcs.length < total) {
      const first = pick(FIRST_NAMES);
      const last = pick(LAST_NAMES);
      const area = pick(areas);
      const x = rand(area.x + 60, area.x + area.w - 60);
      const y = rand(area.y + 60, area.y + area.h - 60);
      const role = pick(ROLES);
      const baseLines = EN_LINES[role] || EN_LINES['Analyst'];
      npcs.push({
        id: npcs.length,
        name: `${first} ${last}`,
        age: randInt(22, 65),
        rank: randInt(0, 99),
        role,
        x, y, baseX:x, baseY:y,
        behavior: Math.random() < 0.5 ? 'walk' : 'idle',
        walkRange: rand(40, 160),
        phase: Math.random() * Math.PI * 2,
        speed: rand(0.3, 0.9),
        radius: 14,
        dialogueEN: baseLines,
        talked: false,
      });
    }
  }

  // ============================================================
  //  Save / Load
  // ============================================================
  function loadTalked() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        talked = new Set(arr);
        for (const n of npcs) {
          if (talked.has(n.id)) n.talked = true;
        }
      }
    } catch(e) { talked = new Set(); }
  }
  function saveTalked() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...talked]));
    } catch(e) {}
  }

  // ============================================================
  //  Init
  // ============================================================
  function initGame() {
    buildAreas();
    buildDoors();
    buildNPCs();
    player.x = WORLD_W / 2;
    player.y = WORLD_H / 2;
    loadTalked();
    updateHUD();
    buildChecklist();
  }

  function updateHUD() {
    talkedDisplay.textContent = talked.size;
    const a = areaAt(player.x, player.y);
    areaDisplay.textContent = a.name;
    const c = Math.floor(player.x / MAP_W) + 1;
    const r = Math.floor(player.y / MAP_H) + 1;
    mapDisplay.textContent = `${c},${r}`;
  }

  // ============================================================
  //  Checklist
  // ============================================================
  function buildChecklist() {
    checklistScroll.innerHTML = '';
    for (const n of npcs) {
      const div = document.createElement('div');
      div.className = 'checklist-item' + (talked.has(n.id) ? ' checked' : '');
      div.innerHTML = `<span class="mark">${talked.has(n.id) ? '✔' : '□'}</span>
        <span>${n.name}</span>
        <span class="rank">${n.rank}</span>`;
      checklistScroll.appendChild(div);
    }
    clProgress.textContent = talked.size;
  }

  // ============================================================
  //  Input
  // ============================================================
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      keys[e.key] = true;
    }
    if (e.key === 'Escape') {
      closeDialogue();
      closeChecklist();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      keys[e.key] = false;
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    mouseX = (e.clientX - rect.left) * sx;
    mouseY = (e.clientY - rect.top) * sy;
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    if (conversation) {
      nextDialogue();
      return;
    }
    if (activeDoor) {
      activeDoor.open = !activeDoor.open;
      return;
    }
    if (activeNPC) {
      startDialogue(activeNPC);
      return;
    }
  });

  checklistBtn.addEventListener('click', (e) => {
    e.preventDefault();
    checklistPanel.classList.toggle('open');
    buildChecklist();
  });
  clClose.addEventListener('click', (e) => { e.preventDefault(); closeChecklist(); });
  clReset.addEventListener('click', (e) => {
    e.preventDefault();
    if (confirm('Are you sure you want to reset?')) {
      if (confirm('Are you really sure you want to reset?')) {
        if (confirm('Final warning: really reset all progress?')) {
          talked = new Set();
          for (const n of npcs) n.talked = false;
          saveTalked();
          buildChecklist();
          updateHUD();
        }
      }
    }
  });
  mapToggleBtn.addEventListener('click', (e) => {
    e.preventDefault();
    showMapCoord = !showMapCoord;
    if (showMapCoord) {
      mapCoordSpan.classList.remove('hidden-coord');
      mapToggleBtn.textContent = '📍 HIDE COORDS';
    } else {
      mapCoordSpan.classList.add('hidden-coord');
      mapToggleBtn.textContent = '📍 SHOW COORDS';
    }
  });

  dNext.addEventListener('click', (e) => { e.preventDefault(); nextDialogue(); });
  dClose.addEventListener('click', (e) => { e.preventDefault(); closeDialogue(); });

  function closeChecklist() { checklistPanel.classList.remove('open'); }

  // ============================================================
  //  Dialogue
  // ============================================================
  function startDialogue(npc) {
    conversation = { npc, page: 0 };
    dName.textContent = npc.name;
    dAge.textContent = npc.age;
    dRank.textContent = npc.rank;
    dRole.textContent = npc.role;
    renderDialogue();
    dialogue.classList.add('open');
    if (!talked.has(npc.id)) {
      talked.add(npc.id);
      npc.talked = true;
      saveTalked();
      updateHUD();
      buildChecklist();
    }
  }

  function renderDialogue() {
    if (!conversation) return;
    const { npc, page } = conversation;
    dText.textContent = npc.dialogueEN[page] || '';
    dPage.textContent = `${page+1} / ${npc.dialogueEN.length}`;
    dNext.textContent = (page < npc.dialogueEN.length - 1) ? 'NEXT ▶' : 'FINISH';
  }

  function nextDialogue() {
    if (!conversation) return;
    if (conversation.page < conversation.npc.dialogueEN.length - 1) {
      conversation.page++;
      renderDialogue();
    } else {
      closeDialogue();
    }
  }

  function closeDialogue() {
    conversation = null;
    dialogue.classList.remove('open');
  }

  // ============================================================
  //  Update
  // ============================================================
  function update(dt) {
    const sp = player.speed * 0.4;
    if (keys.ArrowUp)    player.y -= sp;
    if (keys.ArrowDown)  player.y += sp;
    if (keys.ArrowLeft)  player.x -= sp;
    if (keys.ArrowRight) player.x += sp;
    player.x = clamp(player.x, 20, WORLD_W - 20);
    player.y = clamp(player.y, 20, WORLD_H - 20);

    for (const n of npcs) {
      if (n.behavior === 'walk') {
        n.phase += 0.02 * n.speed;
        n.x = n.baseX + Math.cos(n.phase) * n.walkRange;
        n.y = n.baseY + Math.sin(n.phase * 0.8) * n.walkRange * 0.5;
      }
    }

    activeNPC = null;
    let bestD = 60;
    for (const n of npcs) {
      const d = dist(n.x, n.y, player.x, player.y);
      if (d < bestD) { bestD = d; activeNPC = n; }
    }
    activeDoor = null;
    let bestDoorD = 70;
    for (const dr of doors) {
      const cx = dr.x + dr.w/2;
      const cy = dr.y + dr.h/2;
      const d = dist(cx, cy, player.x, player.y);
      if (d < bestDoorD) { bestDoorD = d; activeDoor = dr; }
    }

    if (activeNPC && !conversation) {
      npName.textContent = activeNPC.name;
      npAge.textContent = activeNPC.age;
      npRank.textContent = activeNPC.rank;
      npRole.textContent = activeNPC.role;
      npcPanel.classList.add('open');
    } else {
      npcPanel.classList.remove('open');
    }

    updateHUD();
  }

  // ============================================================
  //  Draw
  // ============================================================
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const camX = clamp(player.x - W/2, 0, WORLD_W - W);
    const camY = clamp(player.y - H/2, 0, WORLD_H - H);
    ctx.save();
    ctx.translate(-camX, -camY);

    for (const a of areas) {
      if (a.x > camX + W || a.x + a.w < camX || a.y > camY + H || a.y + a.h < camY) continue;
      drawArea(a);
    }

    for (const dr of doors) {
      if (dr.x > camX + W || dr.x + dr.w < camX || dr.y > camY + H || dr.y + dr.h < camY) continue;
      drawDoor(dr);
    }

    for (const n of npcs) {
      if (n.x < camX - 40 || n.x > camX + W + 40 || n.y < camY - 40 || n.y > camY + H + 40) continue;
      drawNPC(n);
    }

    drawPlayer();

    if (activeNPC && !conversation) {
      ctx.fillStyle = '#00e6b0';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Click to talk', activeNPC.x, activeNPC.y - 34);
    }
    if (activeDoor) {
      ctx.fillStyle = '#7ad7ff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(activeDoor.open ? 'Click to close' : 'Click to open',
        activeDoor.x + activeDoor.w/2, activeDoor.y - 6);
    }

    ctx.restore();
    drawMinimap();
  }

  function drawArea(a) {
    if (a.type === 'garden' || a.type === 'park') {
      ctx.fillStyle = '#14301e';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let i = 0; i < 6; i++) {
        const tx = a.x + 80 + (i * 110) % (a.w - 120);
        const ty = a.y + 80 + Math.floor(i / 3) * 200;
        drawTree(tx, ty);
      }
      drawBench(a.x + a.w/2 - 30, a.y + a.h/2);
    } else if (a.type === 'road') {
      ctx.fillStyle = '#1a1d22';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#e0e0e0';
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(a.x + 40 + i*90, a.y + a.h/2 - 3, 50, 6);
      }
    } else if (a.type === 'parking') {
      ctx.fillStyle = '#15181d';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.strokeRect(a.x + 60 + i*180, a.y + 120, 120, 200);
      }
      for (let i = 0; i < 3; i++) {
        drawCar(a.x + 80 + i*180, a.y + 160);
      }
    } else if (a.type === 'reception') {
      ctx.fillStyle = '#1e2833';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#2a3a4a';
      ctx.fillRect(a.x + a.w/2 - 150, a.y + 100, 300, 60);
      ctx.fillStyle = '#00e6b0';
      ctx.fillRect(a.x + a.w/2 - 150, a.y + 100, 300, 6);
    } else if (a.type === 'trading') {
      ctx.fillStyle = '#141b22';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 6; c++) {
          drawDesk(a.x + 60 + c*120, a.y + 60 + r*130);
        }
      }
    } else if (a.type === 'meeting') {
      ctx.fillStyle = '#1a222c';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#2a3a4a';
      ctx.beginPath();
      ctx.ellipse(a.x + a.w/2, a.y + a.h/2, 220, 120, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#00e6b0';
      ctx.lineWidth = 2;
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const ang = i / 8 * Math.PI * 2;
        drawChair(a.x + a.w/2 + Math.cos(ang)*260, a.y + a.h/2 + Math.sin(ang)*150);
      }
    } else if (a.type === 'executive') {
      ctx.fillStyle = '#1a1218';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#3a1a2a';
      ctx.fillRect(a.x + 80, a.y + 80, a.w - 160, a.h - 160);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3;
      ctx.strokeRect(a.x + 80, a.y + 80, a.w - 160, a.h - 160);
      ctx.fillStyle = '#2a1a0a';
      ctx.fillRect(a.x + a.w/2 - 120, a.y + 120, 240, 80);
    } else if (a.type === 'server') {
      ctx.fillStyle = '#0d1318';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 5; c++) {
          drawServerRack(a.x + 100 + c*130, a.y + 100 + r*160);
        }
      }
    } else if (a.type === 'cafe') {
      ctx.fillStyle = '#221a14';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 3; c++) {
          drawRoundTable(a.x + 150 + c*220, a.y + 150 + r*250);
        }
      }
    } else if (a.type === 'lounge') {
      ctx.fillStyle = '#1a1a24';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      drawSofa(a.x + 120, a.y + 120);
      drawSofa(a.x + 480, a.y + 120);
      drawSofa(a.x + 120, a.y + 380);
      drawSofa(a.x + 480, a.y + 380);
      drawPlant(a.x + 60, a.y + 60);
      drawPlant(a.x + a.w - 60, a.y + a.h - 60);
    } else if (a.type === 'gym') {
      ctx.fillStyle = '#1a2226';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = '#2a3a4a';
        ctx.fillRect(a.x + 80 + i*220, a.y + 120, 160, 60);
        ctx.fillStyle = '#00e6b0';
        ctx.fillRect(a.x + 80 + i*220, a.y + 120, 160, 6);
      }
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = '#4a5a6a';
        ctx.fillRect(a.x + 100 + i*150, a.y + 400, 80, 20);
      }
    } else if (a.type === 'library') {
      ctx.fillStyle = '#1e1a14';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 4; c++) {
          drawBookshelf(a.x + 100 + c*180, a.y + 100 + r*160);
        }
      }
    } else if (a.type === 'rooftop') {
      ctx.fillStyle = '#1a2a1e';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let i = 0; i < 4; i++) {
        drawTree(a.x + 100 + i*200, a.y + 100);
        drawBench(a.x + 100 + i*200, a.y + 400);
      }
    } else {
      ctx.fillStyle = '#161c24';
      ctx.fillRect(a.x, a.y, a.w, a.h);
    }
    ctx.strokeStyle = '#1e3a4a';
    ctx.lineWidth = 2;
    ctx.strokeRect(a.x, a.y, a.w, a.h);
    ctx.fillStyle = '#3a5a6a';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(a.name, a.x + 12, a.y + 24);
  }

  function drawDesk(x, y) {
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(x, y, 100, 60);
    ctx.fillStyle = '#0a1a2a';
    ctx.fillRect(x + 10, y + 8, 80, 30);
    ctx.fillStyle = '#00e6b0';
    ctx.fillRect(x + 14, y + 12, 72, 22);
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(x + 20, y + 70, 60, 20);
  }
  function drawChair(x, y) {
    ctx.fillStyle = '#3a4a5a';
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(x - 12, y - 24, 24, 12);
  }
  function drawRoundTable(x, y) {
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.arc(x, y, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  function drawSofa(x, y) {
    ctx.fillStyle = '#2a3a5a';
    ctx.fillRect(x, y, 100, 50);
    ctx.fillStyle = '#1a2a4a';
    ctx.fillRect(x, y, 100, 15);
  }
  function drawPlant(x, y) {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(x - 10, y + 10, 20, 20);
    ctx.fillStyle = '#1a5a2a';
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI*2);
    ctx.fill();
  }
  function drawServerRack(x, y) {
    ctx.fillStyle = '#1a2a3a';
    ctx.fillRect(x, y, 80, 120);
    ctx.strokeStyle = '#2a4a6a';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      ctx.strokeRect(x + 6, y + 6 + i*14, 68, 10);
      ctx.fillStyle = Math.random() < 0.5 ? '#00e6b0' : '#ff4d6d';
      ctx.fillRect(x + 10, y + 8 + i*14, 4, 4);
    }
  }
  function drawBookshelf(x, y) {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(x, y, 120, 100);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = '#2a1a0a';
      ctx.fillRect(x + 6, y + 6 + i*24, 108, 20);
      for (let j = 0; j < 6; j++) {
        ctx.fillStyle = ['#ff4d6d','#00e6b0','#ffd166','#7ad7ff','#ff8ad8'][j%5];
        ctx.fillRect(x + 10 + j*16, y + 8 + i*24, 10, 16);
      }
    }
  }
  function drawTree(x, y) {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(x - 6, y, 12, 30);
    ctx.fillStyle = '#1a5a2a';
    ctx.beginPath();
    ctx.arc(x, y - 10, 26, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#2a7a3a';
    ctx.beginPath();
    ctx.arc(x - 10, y - 20, 18, 0, Math.PI*2);
    ctx.fill();
  }
  function drawBench(x, y) {
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(x, y, 100, 14);
    ctx.fillRect(x + 6, y + 14, 8, 20);
    ctx.fillRect(x + 86, y + 14, 8, 20);
  }
  function drawCar(x, y) {
    ctx.fillStyle = '#2a4a6a';
    ctx.fillRect(x, y, 100, 50);
    ctx.fillStyle = '#1a2a3a';
    ctx.fillRect(x + 15, y + 8, 70, 20);
    ctx.fillStyle = '#0a0c0f';
    ctx.beginPath(); ctx.arc(x + 20, y + 50, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 80, y + 50, 10, 0, Math.PI*2); ctx.fill();
  }
  function drawDoor(dr) {
    if (dr.open) {
      ctx.fillStyle = '#2a5a3a';
      ctx.fillRect(dr.x, dr.y, dr.w, dr.h);
      ctx.strokeStyle = '#00e6b0';
      ctx.lineWidth = 2;
      ctx.strokeRect(dr.x, dr.y, dr.w, dr.h);
    } else {
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(dr.x, dr.y, dr.w, dr.h);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.strokeRect(dr.x, dr.y, dr.w, dr.h);
      ctx.fillStyle = '#ffd166';
      if (dr.w > dr.h) {
        ctx.beginPath(); ctx.arc(dr.x + dr.w - 8, dr.y + dr.h/2, 3, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(dr.x + dr.w/2, dr.y + dr.h - 8, 3, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  function drawNPC(n) {
    const x = n.x, y = n.y;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 16, 12, 4, 0, 0, Math.PI*2);
    ctx.fill();
    const isExec = n.rank >= 70;
    const bodyColor = isExec ? '#1a2a4a' : (n.rank >= 40 ? '#2a3a4a' : '#3a4a5a');
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x - 8, y - 4, 16, 20);
    ctx.fillStyle = '#e0b090';
    ctx.beginPath();
    ctx.arc(x, y - 12, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = ['#1a1a1a','#3a2a1a','#5a4a2a','#7a6a3a'][n.id % 4];
    ctx.beginPath();
    ctx.arc(x, y - 15, 8, Math.PI, Math.PI*2);
    ctx.fill();
    if (talked.has(n.id)) {
      ctx.fillStyle = '#00e6b0';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✔', x + 12, y - 18);
    }
    if (n.rank === 100) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(x - 10, y - 22);
      ctx.lineTo(x - 6, y - 28);
      ctx.lineTo(x, y - 22);
      ctx.lineTo(x + 6, y - 28);
      ctx.lineTo(x + 10, y - 22);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPlayer() {
    const x = player.x, y = player.y;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 16, 12, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowColor = '#00e6b0'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#0a1a1a';
    ctx.beginPath();
    ctx.arc(x, y, player.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#00e6b0'; ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#00e6b0'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(player.angle)*24, y + Math.sin(player.angle)*24);
    ctx.stroke();
  }

  function drawMinimap() {
    const mw = 160, mh = 120;
    const mx = W - mw - 12, my = H - mh - 12;
    ctx.fillStyle = 'rgba(10,12,15,0.8)';
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = '#1e3a4a';
    ctx.lineWidth = 1;
    ctx.strokeRect(mx, my, mw, mh);
    const sx = mw / WORLD_W, sy = mh / WORLD_H;
    for (const a of areas) {
      ctx.fillStyle = (a.type === 'garden' || a.type === 'park') ? '#1a3a2a' :
                      (a.type === 'road' || a.type === 'parking') ? '#2a2a2a' :
                      (a.type === 'trading') ? '#1a2a3a' :
                      (a.type === 'executive') ? '#3a1a2a' : '#1a222c';
      ctx.fillRect(mx + a.x*sx, my + a.y*sy, a.w*sx, a.h*sy);
    }
    ctx.fillStyle = '#00e6b0';
    ctx.fillRect(mx + player.x*sx - 2, my + player.y*sy - 2, 4, 4);
    ctx.fillStyle = '#ffd166';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('MINIMAP', mx + 4, my + 12);
  }

  // ============================================================
  //  Loop
  // ============================================================
  function gameLoop(timestamp) {
    const dt = Math.min(2, (timestamp - lastTime) / (1000/60));
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ============================================================
  //  Opening
  // ============================================================
  const opening = document.getElementById('opening');
  const startBtn = document.getElementById('startBtn');
  const bgViewBtn = document.getElementById('bgViewBtn');
  const bgViewer = document.getElementById('bgViewer');
  const closeBgBtn = document.getElementById('closeBgBtn');

  startBtn.addEventListener('click', (e) => {
    e.preventDefault();
    opening.classList.add('hidden-opening');
    setTimeout(() => { opening.style.display = 'none'; }, 500);
  });
  bgViewBtn.addEventListener('click', (e) => {
    e.preventDefault();
    bgViewer.classList.remove('hidden');
  });
  closeBgBtn.addEventListener('click', (e) => {
    e.preventDefault();
    bgViewer.classList.add('hidden');
  });

  // ============================================================
  //  Start
  // ============================================================
  initGame();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
