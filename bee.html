<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意外と使える数学 × サッカー戦術ノート【前編：確率と統計の罠を見破る】</title>
    
    <!-- 数式表示ライブラリ (MathJax) の確実な設定と読み込み -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            }
        };
    </script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
    
    <style>
        /* ==========================================
           デザイン・カラー変数の定義
           ========================================== */
        :root {
            --bg-main: #0a0b0e;       /* 深い漆黒（ベース背景） */
            --bg-card: #14161f;       /* カード背景（やや明るい黒） */
            --bg-code: #1d212f;       /* 数式エリア背景 */
            --bg-quiz: #192524;       /* クイズエリア背景 */
            --text-main: #f3f4f6;     /* メイン文字（優しい白） */
            --text-muted: #a1a1aa;    /* 補足文字（グレー） */
            
            /* メインアクセントカラー（ピンク＆オレンジ） */
            --color-pink: #ff2a85;     /* ネオンピンク */
            --color-orange: #ff7300;   /* 鮮やかな橙 */
            --gradient-accent: linear-gradient(135deg, #ff2a85 0%, #ff7300 100%);
            
            --border-color: #272a37;   /* 境界線の色 */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height: 1.9;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* メインヘッダー */
        header {
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 2px solid;
            border-image: var(--gradient-accent) 1;
            padding-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin: 0;
        }

        /* 前編の大きな区切り */
        .volume-section {
            margin-top: 40px;
            margin-bottom: 40px;
            position: relative;
        }

        .volume-badge {
            display: inline-block;
            background: var(--gradient-accent);
            color: #fff;
            padding: 6px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 30px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 42, 133, 0.3);
        }

        /* 各テーマを包むカード */
        .theme-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 50px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .theme-card:hover {
            transform: translateY(-2px);
            border-color: var(--color-pink);
        }

        /* テーマの見出し */
        .theme-title {
            display: flex;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .theme-number {
            background: var(--gradient-accent);
            color: #fff;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.2rem;
            margin-right: 15px;
            font-weight: bold;
        }

        .theme-text {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 各章のラベル */
        .section-label {
            display: inline-block;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 12px;
        }

        .label-formula { background: rgba(255, 42, 133, 0.15); color: var(--color-pink); }
        .label-enemy { background: rgba(255, 115, 0, 0.15); color: var(--color-orange); }
        .label-soccer { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .label-base { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); }
        .label-train { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
        .label-quiz { background: rgba(52, 211, 153, 0.15); color: #34d399; }

        /* 数式ブロック */
        .formula-box {
            background-color: var(--bg-code);
            border-left: 4px solid var(--color-pink);
            border-radius: 0 8px 8px 0;
            padding: 22px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .formula-memo {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 10px;
            line-height: 1.7;
        }

        .description {
            margin-bottom: 20px;
            color: #e4e4e7;
            text-align: justify;
        }

        /* サッカーの例え話エリア */
        .soccer-box {
            background: rgba(14, 165, 233, 0.03);
            border-left: 4px solid #0ea5e9;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }

        /* 強化メニューのリスト */
        .base-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .base-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 20px;
        }

        .base-list li::before {
            content: "";
            position: absolute;
            left: 5px;
            top: 12px;
            width: 8px;
            height: 8px;
            background-color: var(--color-orange);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--color-orange);
        }

        .list-title {
            font-weight: bold;
            color: #ffffff;
            display: block;
            margin-bottom: 6px;
            font-size: 1.05rem;
        }

        .list-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            display: block;
            line-height: 1.8;
        }

        /* 具体的なトレーニング方法の文章 */
        .train-instruction {
            background: rgba(244, 63, 94, 0.03);
            border-left: 4px solid #f43f5e;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            color: #f1f5f9;
        }

        /* クイズエリア */
        .quiz-box {
            background-color: var(--bg-quiz);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 8px;
            padding: 22px;
            margin-top: 25px;
        }

        .quiz-question {
            font-weight: bold;
            color: #34d399;
            margin-bottom: 12px;
        }

        summary {
            cursor: pointer;
            padding: 8px 15px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            transition: background 0.2s;
            border: 1px solid var(--border-color);
        }

        summary:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .answer-content {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            font-size: 0.95rem;
            border-left: 3px solid #34d399;
        }

        /* ページネーション（次へ進むリンク）のデザイン */
        .pagination-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
        }

        .next-page-btn {
            background: var(--gradient-accent);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 42, 133, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .next-page-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.5);
        }

        .next-page-btn::after {
            content: "➔";
            margin-left: 10px;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            header h1 { font-size: 1.8rem; }
            .theme-title { font-size: 1.3rem; }
            .theme-card { padding: 20px; }
            .next-page-btn { width: 100%; justify-content: center; box-sizing: border-box; }
        }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>意外と使える数学 × サッカー戦術ノート</h1>
