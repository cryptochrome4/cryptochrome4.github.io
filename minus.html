<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倍率計算ツール</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            background-color: #f8f9fa;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            font-weight: bold;
        }
        .card-title {
            color: #1e3c72;
            font-size: 1.1rem;
        }
        .card-badge {
            color: #28a745;
            font-size: 1.1rem;
        }
        .row-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #f9f9f9;
            font-size: 0.95rem;
        }
        .row-item:last-child {
            border-bottom: none;
        }
        .val-left {
            color: #888;
        }
        .val-right {
            font-weight: bold;
            color: #111;
        }
    </style>
</head>
<body>

<script>
    // 指定されたすべての倍率のリスト
    const multipliers = [
        1.0, 1.09, 1.08, 1.07, 1.06, 1.05, 1.04, 1.03, 1.02, 1.01, 
        0.0, -1.01, -1.02, -1.03, -1.04, -1.05, -1.06, -1.07, -1.08, -1.09, 
        -1.0, -1.11, -1.12, -1.13, -1.14, -1.15, -1.16, -1.17, -1.18, -1.19, 
        -1.2, -1.3, -1.4
    ];
    
    // ベースとなる数値（165〜175）
    const baseValues =;

    // 各倍率ごとにカードを動的に生成
    multipliers.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const header = document.createElement('div');
        header.className = 'card-header';
        
        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = `${m}倍の層`;
        
        const badge = document.createElement('div');
        badge.className = 'card-badge';
        badge.textContent = `×${m}`;
        
        header.appendChild(title);
        header.appendChild(badge);
        card.appendChild(header);
        
        baseValues.forEach(v => {
            const row = document.createElement('div');
            row.className = 'row-item';
            
            const left = document.createElement('div');
            left.className = 'val-left';
            left.textContent = v;
            
            const right = document.createElement('div');
            right.className = 'val-right';
            
            // 計算結果を小数点以下最大2桁に丸める
            let result = v * m;
            right.textContent = Number(result.toFixed(2));
            
            row.appendChild(left);
            row.appendChild(right);
            card.appendChild(row);
        });
        
        document.body.appendChild(card);
    });
</script>

</body>
</html>
