<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運転免許ひっかけクイズ【前編】</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .quiz-container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 30px; }
        .question-box { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px dashed #e0e0e0; }
        .question-text { font-weight: bold; font-size: 16px; margin-bottom: 15px; line-height: 1.6; }
        .btn-group { display: flex; gap: 15px; }
        .quiz-btn { flex: 1; padding: 12px; font-size: 16px; border: 2px solid #3498db; background: #fff; color: #3498db; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
        .quiz-btn:hover { background: #3498db; color: #fff; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; line-height: 1.5; font-size: 14px; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .wrong { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>運転免許ひっかけクイズ【前編】<br><small style="font-size:14px; color:#7f8c8d;">～駐停車・追い越し・徐行編～</small></h1>

    <!-- 第1問 -->
    <div class="question-box">
        <p class="question-text">Q1. 坂の頂上付近や勾配の急な坂は、上りも下りも「追い越し」が禁止されている。</p>
        <div class="btn-group">
            <button class="quiz-btn" onclick="checkAnswer(1, true)">〇 (正しい)</button>
            <button class="quiz-btn" onclick="checkAnswer(1, false)">× (間違い)</button>
        </div>
        <div id="feedback-1" class="feedback"></div>
    </div>

    <!-- 第2問 -->
    <div class="question-box">
        <p class="question-text">Q2. 交差点とその手前30メートル以内の場所は、いかなる場合も「追い抜き」をしてはならない。</p>
        <div class="btn-group">
            <button class="quiz-btn" onclick="checkAnswer(2, true)">〇 (正しい)</button>
            <button class="quiz-btn" onclick="checkAnswer(2, false)">× (間違い)</button>
        </div>
        <div id="feedback-2" class="feedback"></div>
    </div>

    <!-- 第3問 -->
    <div class="question-box">
        <p class="question-text">Q3. 安全地帯の左側とその前後10メートル以内の場所は、駐車も停車も禁止されている。</p>
        <div class="btn-group">
            <button class="quiz-btn" onclick="checkAnswer(3, true)">〇 (正しい)</button>
            <button class="quiz-btn" onclick="checkAnswer(3, false)">× (間違い)</button>
        </div>
        <div id="feedback-3" class="feedback"></div>
    </div>
</div>

<script>
    const explanations = {
        1: { answer: true, text: "【正解：〇】勾配の急な坂は「上りも下りも」追い越し禁止です。「下りはスピードが出るから追い越しOK」と勘違いしているドライバーが多いので注意。" },
        2: { answer: false, text: "【正解：×】禁止されているのは「追い越し」であり、「追い抜き」は禁止されていません。進路変更を伴わない追い抜きは交差点手前でも可能です。" },
        3: { answer: false, text: "【正解：×】安全地帯の「左側とその前後10メートル」は『駐停車禁止』ですが、これは安全地帯に「歩行者がいる場合に限る」という条件がつきます。歩行者がいない場合は禁止されません（超難問）。" }
    };

    function checkAnswer(qNum, userAns) {
        const feedbackDiv = document.getElementById(`feedback-${qNum}`);
        const isCorrect = userAns === explanations[qNum].answer;
        
        feedbackDiv.innerHTML = (isCorrect ? "<strong>【正解！】</strong> " : "<strong>【不正解…】</strong> ") + explanations[qNum].text;
        feedbackDiv.className = "feedback " + (isCorrect ? "correct" : "wrong");
        feedbackDiv.style.display = "block";
    }
</script>

</body>
</html>
