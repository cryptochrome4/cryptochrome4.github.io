<div class="quiz-container-zen">
    <h2 class="quiz-title">運転免許ひっかけクイズ【前編】<br><small>～駐停車・追い越し・徐行編～</small></h2>

    <!-- Q1 -->
    <div class="q-box">
        <p class="q-text">Q1. 坂の頂上付近や勾配の急な坂は、上りも下りも「追い越し」が禁止されている。</p>
        <div class="b-group">
            <button class="q-btn btn-z" onclick="checkAnsZen(1, true)">〇 (正しい)</button>
            <button class="q-btn btn-z" onclick="checkAnsZen(1, false)">× (間違い)</button>
        </div>
        <div id="fb-zen-1" class="fb-box"></div>
    </div>

    <!-- Q2 -->
    <div class="q-box">
        <p class="q-text">Q2. 交差点とその手前30メートル以内の場所は、いかなる場合も「追い抜き」をしてはならない。</p>
        <div class="b-group">
            <button class="q-btn btn-z" onclick="checkAnsZen(2, true)">〇 (正しい)</button>
            <button class="q-btn btn-z" onclick="checkAnsZen(2, false)">× (間違い)</button>
        </div>
        <div id="fb-zen-2" class="fb-box"></div>
    </div>

    <!-- Q3 -->
    <div class="q-box">
        <p class="q-text">Q3. 安全地帯の左側とその前後10メートル以内の場所は、駐車も停車も禁止されている。</p>
        <div class="b-group">
            <button class="q-btn btn-z" onclick="checkAnsZen(3, true)">〇 (正しい)</button>
            <button class="q-btn btn-z" onclick="checkAnsZen(3, false)">× (間違い)</button>
        </div>
        <div id="fb-zen-3" class="fb-box"></div>
    </div>
</div>

<style>
    .quiz-container-zen { max-width: 600px; margin: 0 auto 30px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); font-family: sans-serif; color: #333; }
    .quiz-title { text-align: center; color: #2c3e50; font-size: 22px; margin-bottom: 25px; line-height: 1.4; }
    .quiz-title small { font-size: 14px; color: #7f8c8d; font-weight: normal; }
    .q-box { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px dashed #e0e0e0; }
    .q-text { font-weight: bold; font-size: 16px; margin-bottom: 15px; line-height: 1.6; }
    .b-group { display: flex; gap: 15px; }
    .q-btn { flex: 1; padding: 12px; font-size: 16px; background: #fff; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
    .btn-z { border: 2px solid #3498db; color: #3498db; } .btn-z:hover { background: #3498db; color: #fff; }
    .fb-box { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; line-height: 1.5; font-size: 14px; }
    .fb-correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .fb-wrong { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>

<script>
    const expZen = {
        1: { ans: true, text: "【正解：〇】勾配の急な坂は「上りも下りも」追い越し禁止です。「下りはスピードが出るから追い越しOK」と勘違いしているドライバーが多いので注意。" },
        2: { ans: false, text: "【正解：×】禁止されているのは「追い越し」であり、「追い抜き」は禁止されていません。進路変更を伴わない追い抜きは交差点手前でも可能です。" },
        3: { ans: false, text: "【正解：×】安全地帯の「左側とその前後10メートル」は『駐停車禁止』ですが、これは安全地帯に「歩行者がいる場合に限る」という条件がつきます。歩行者がいない場合は禁止されません。" }
    };
    function checkAnsZen(q, user) {
        const fb = document.getElementById(`fb-zen-${q}`);
        const isCor = user === expZen[q].ans;
        fb.innerHTML = (isCor ? "<strong>【正解！】</strong> " : "<strong>【不正解…】</strong> ") + expZen[q].text;
        fb.className = "fb-box " + (isCor ? "fb-correct" : "fb-wrong");
        fb.style.display = "block";
    }
</script>
