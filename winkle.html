<style>

  body {

    margin: 0 auto 2.5rem;
    text-align: center;
  }
  .page-header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing: 0.2em;
    color: #c8d0e0;

  .page-header p {

  }

  .container { max-width: 1000px; margin: 0 auto; }

  /* =========================================================
     本ラッパー
     ========================================================= */
  .book-card {
    position: relative;
    perspective: 2400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .book {
    position: relative;
    width: 100%;
    max-width: 760px;
    aspect-ratio: 1.45 / 1;
    transform-style: preserve-3d;
    margin: 0 auto;
  }

  /* =========================================================
     表紙
     ========================================================= */
  .cover {
    position: absolute;
    inset: 0;
    border-radius: 6px 16px 16px 6px;
    z-index: 20;
    overflow: hidden;
    cursor: pointer;
    transform-origin: left center;
    transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.5s ease;
    border-left: 8px solid rgba(0,0,0,0.5);
    border-right: 2px solid rgba(255,255,255,0.06);
    background: #0a0a0a;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(180,190,210,0.15) 0%, transparent 50%),
      linear-gradient(160deg, #18181a 0%, #08080a 100%);
    box-shadow:
      inset 0 0 25px rgba(180,190,210,0.12),
      inset -6px 0 18px rgba(0,0,0,0.9),
      0 20px 35px rgba(0,0,0,0.9);
  }
  .cover::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 2px, transparent 2px, transparent 5px),
      repeating-linear-gradient(-45deg, rgba(180,190,210,0.02) 0px, rgba(180,190,210,0.02) 1px, transparent 1px, transparent 4px);
  }
  .cover::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(115deg, transparent 30%, rgba(200,210,230,0.12) 48%, rgba(255,255,255,0.18) 50%, rgba(200,210,230,0.12) 52%, transparent 70%);
  }

  .cover.flip {
    transform: rotateY(-160deg) translateX(-2%) scale(0.98);
    box-shadow: -20px 10px 30px rgba(0,0,0,0.8) !important;
  }

  /* 表紙レイアウト：横3分割（上・中・下） */
  .cover-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
    z-index: 3;
    pointer-events: none;
  }
  .cover-cell {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 中央セル：表紙画像 */
  .cover-img-wrap {
    position: relative;
    width: 62%;
    height: 86%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .cover-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(180,190,220,0.35), 0 4px 14px rgba(0,0,0,0.8);
    border: 1px solid rgba(180,190,220,0.25);
  }

  /* 上セル：タイトル */
  .cover-top {
    flex-direction: column;
    text-align: center;
  }
  .cover-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 0.18em;
    color: #c8d0e0;
    text-shadow: 0 0 15px rgba(180,190,220,0.4), 0 2px 4px #000;
  }
  .cover-sub {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.55rem, 1.3vw, 0.8rem);
    letter-spacing: 0.3em;
    color: #7a8298;
    border-top: 1px solid rgba(180,190,220,0.2);
    padding-top: 0.4rem;
    margin-top: 0.4rem;
  }

  /* 下セル：白/黒ページ切替ボタン */
  .cover-bottom {
    pointer-events: auto;
    gap: 0.7rem;
  }
  .theme-btn {
    pointer-events: auto;
    background: rgba(20,20,26,0.85);
    border: 1.5px solid #b89b70;
    color: #e8d5b8;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 0.45rem 1rem;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 3px 0 #0a0603, 0 5px 10px rgba(0,0,0,0.5);
    transition: all 0.12s ease;
    text-transform: uppercase;
    transform: translateY(-1px);
  }
  .theme-btn:hover {
    background: #3a2e22;
    color: #ffeac2;
    transform: translateY(1px);
    box-shadow: 0 1px 0 #0a0603, 0 6px 12px rgba(0,0,0,0.6);
  }
  .theme-btn.active {
    border-color: #ffeac2;
    color: #ffeac2;
    background: #4a3826;
    box-shadow: 0 0 16px rgba(255,234,194,0.5), 0 3px 0 #0a0603;
  }

  /* =========================================================
     ページ（表紙の下）
     ========================================================= */
  .pages {
    position: absolute;
    inset: 0;
    border-radius: 6px 16px 16px 6px;
    z-index: 10;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background 0.4s ease, color 0.4s ease;
  }

  /* 白ページバージョン */
  .pages.theme-white {
    background: #f4f6fa;
    background-image:
      linear-gradient(90deg, rgba(140,150,170,0.06) 0%, transparent 10%, transparent 90%, rgba(140,150,170,0.1) 100%),
      radial-gradient(circle at 35% 40%, #ffffff 0%, #e8ecf2 90%);
    box-shadow:
      inset -10px 0 20px rgba(140,150,170,0.15),
      inset 10px 0 15px rgba(140,150,170,0.1);
    color: #1a1a2a;
  }
  .pages.theme-white::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(140,150,170,0.04) 0px, rgba(140,150,170,0.04) 1px, transparent 1px, transparent 5px),
      repeating-linear-gradient(90deg, rgba(160,170,190,0.03) 0px, rgba(160,170,190,0.03) 1px, transparent 1px, transparent 6px);
  }
  .pages.theme-white::after {
    content: "";
    position: absolute; top:0; right:0; bottom:0; width: 12px; border-radius: 0 16px 16px 0; opacity: 0.7;
    background: linear-gradient(90deg, #d0d8e0, #b8c0d0, #d0d8e0);
    box-shadow: -2px 0 8px rgba(0,0,0,0.12);
  }

  /* 黒ページバージョン */
  .pages.theme-black {
    background: #0d0d12;
    background-image:
      linear-gradient(90deg, rgba(180,190,220,0.04) 0%, transparent 10%, transparent 90%, rgba(180,190,220,0.07) 100%),
      radial-gradient(circle at 40% 30%, #1a1a22 0%, #060608 90%);
    box-shadow:
      inset -10px 0 25px rgba(0,0,0,0.8),
      inset 10px 0 20px rgba(0,0,0,0.6);
    color: #c8d0e0;
  }
  .pages.theme-black::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(180,190,220,0.03) 0px, rgba(180,190,220,0.03) 1px, transparent 1px, transparent 5px),
      repeating-linear-gradient(90deg, rgba(180,190,220,0.025) 0px, rgba(180,190,220,0.025) 1px, transparent 1px, transparent 6px);
  }
  .pages.theme-black::after {
    content: "";
    position: absolute; top:0; right:0; bottom:0; width: 12px; border-radius: 0 16px 16px 0; opacity: 0.7;
    background: linear-gradient(90deg, #3a3a44, #2a2a32, #3a3a44);
    box-shadow: -2px 0 10px rgba(0,0,0,0.6);
  }

  /* 本文エリア */
  .page-body {
    position: relative;
    z-index: 5;
    flex: 1;
    overflow-y: auto;
    padding: 2.4rem 2.6rem 1.4rem;
    font-family: 'EB Garamond', serif;
    font-size: clamp(0.92rem, 1.5vw, 1.08rem);
    line-height: 1.85;
    letter-spacing: 0.01em;
    scrollbar-width: thin;
    scrollbar-color: rgba(180,190,220,0.4) transparent;
  }
  .page-body::-webkit-scrollbar { width: 8px; }
  .page-body::-webkit-scrollbar-thumb {
    background: rgba(180,190,220,0.35);
    border-radius: 8px;
  }
  .page-body p { margin-bottom: 0.9em; text-indent: 1.5em; }
  .page-body p.no-indent { text-indent: 0; }
  .page-body h3 {
    font-family: 'Cinzel', serif;
    font-size: 1em;
    letter-spacing: 0.15em;
    text-align: center;
    margin: 1.2em 0 0.9em;
    text-indent: 0;
  }
  .page-body .chapter-label {
    font-family: 'Cinzel', serif;
    font-size: 0.72em;
    letter-spacing: 0.3em;
    text-align: center;
    opacity: 0.6;
    margin-bottom: 1.4em;
    text-indent: 0;
  }

  /* ページフッター */
  .page-footer {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.7rem 1.8rem 0.9rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.6;
    border-top: 1px solid currentColor;
    border-color: rgba(128,140,160,0.2);
  }

  /* =========================================================
     ナビゲーション
     ========================================================= */
  .nav-row {
    display: flex;
    gap: 0.8rem;
    margin-top: 1.2rem;
    width: 100%;
    max-width: 760px;
    justify-content: center;
  }
  .nav-btn {
    background: #2a2018;
    border: 1.5px solid #b89b70;
    color: #e8d5b8;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 0.5rem 1.4rem;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 4px 0 #0a0603, 0 6px 10px rgba(0,0,0,0.5);
    transition: all 0.1s ease;
    text-transform: uppercase;
    transform: translateY(-2px);
    flex: 1;
    max-width: 160px;
  }
  .nav-btn:hover:not(:disabled) {
    background: #3a2e22;
    box-shadow: 0 2px 0 #0a0603, 0 8px 14px rgba(0,0,0,0.6);
    transform: translateY(0);
    color: #ffeac2;
  }
  .nav-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a0603, 0 4px 8px rgba(0,0,0,0.5);
  }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: translateY(0);
    box-shadow: 0 2px 0 #0a0603;
  }

  /* =========================================================
     裏表紙（ランダム画像）
     ========================================================= */
  .back-cover-wrap {
    max-width: 760px;
    margin: 2.4rem auto 0;
    display: flex;
    justify-content: center;
  }
  .back-cover {
    position: relative;
    width: 100%;
    aspect-ratio: 1.45 / 1;
    border-radius: 16px 6px 6px 16px;
    overflow: hidden;
    background: #0a0a0a;
    box-shadow:
      inset 0 0 25px rgba(180,190,210,0.12),
      inset -6px 0 18px rgba(0,0,0,0.9),
      0 20px 35px rgba(0,0,0,0.9);
    border-left: 2px solid rgba(255,255,255,0.06);
    border-right: 8px solid rgba(0,0,0,0.5);
  }
  .back-cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .back-cover::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    border-radius: inherit;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.55);
  }
  .back-cover-label {
    text-align: center;
    margin-top: 0.8rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #7a8298;
  }

  /* =========================================================
     フッター
     ========================================================= */
  .footer {
    max-width: 900px;
    margin: 4rem auto 0;
    padding: 2rem 1rem;
    text-align: center;
    color: #5a4e44;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    border-top: 1px solid rgba(180, 190, 220, 0.15);
  }

  /* レスポンシブ */
  @media (max-width: 640px) {
    .book { aspect-ratio: 1.15 / 1; }
    .page-body { padding: 1.6rem 1.4rem 1rem; font-size: 0.88rem; }
    .cover-img-wrap { width: 70%; height: 82%; }
    .theme-btn { font-size: 0.55rem; padding: 0.4rem 0.75rem; }
    .nav-btn { font-size: 0.62rem; padding: 0.4rem 0.9rem; }
    .page-footer { padding: 0.5rem 1rem 0.7rem; }
    .cover-title { font-size: 1rem; }
    .cover-sub { font-size: 0.5rem; }
  }
</style>
</head>
<body>

<header class="page-header">
  <h1>Rip Van Winkle</h1>
  <p>Black Leather &amp; Silver — A Premium Edition</p>
</header>

<main class="container">

  <div class="book-card">
    <div class="book" data-book>
      <!-- ============ 表紙 ============ -->
      <div class="cover" data-cover>

</main>

<script>
(function() {
  /* =========================================================
     裏表紙ランダム画像（サイト更新ごとに毎回）
     ========================================================= */
  const backCoverImages = ['img236overlord.jpg', 'img287heavy.jpg'];
  const backCoverImg = document.getElementById('backCoverImg');
  const chosen = backCoverImages[Math.floor(Math.random() * backCoverImages.length)];
  backCoverImg.src = chosen;

  /* =========================================================
     Rip Van Winkle 本文データ（全51ページ）
     ========================================================= */
  const pages = [
    // Page 1 — 扉
    { label: 'Frontispiece', html: `
      <h3>RIP VAN WINKLE</h3>
      <p class="no-indent" style="text-align:center;font-style:italic;margin-top:1em;">A Posthumous Writing of Diedrich Knickerbocker</p>
      <p class="no-indent" style="text-align:center;margin-top:1.4em;">By Washington Irving</p>
      <p class="no-indent" style="text-align:center;margin-top:2em;font-size:0.85em;opacity:0.7;">Black Leather &amp; Silver Edition</p>
    `},
    // Page 2 — 序文
    { label: 'Preface', html: `
      <div class="chapter-label">PREFACE</div>
      <p>The following tale was found among the papers of the late Diedrich Knickerbocker, an old gentleman of New York, who was very curious in the Dutch history of the province, and the manners of the descendants from its primitive settlers.</p>
      <p>His historical researches, however, did not lie so much among books as among men; for the former are lamentably scanty on his favorite topics; whereas he found the old burghers, and still more their wives, rich in that legendary lore, so invaluable to true history.</p>
      <p>Whenever, therefore, he happened upon a genuine Dutch family, snugly shut up in its low-roofed farmhouse, under a spreading sycamore, he looked upon it as a little clasped volume of black-letter, and studied it with the zeal of a bookworm.</p>
    `},
    // Page 3 — 序文続き
    { label: 'Preface', html: `
      <p>The result of all these researches was a history of the province during the reign of the Dutch governors, which he published some years since. There have been various opinions as to the literary character of his work, and, to tell the truth, it is not a whit better than it should be.</p>
      <p>Its chief merit is its scrupulous accuracy, which indeed was a little questioned on its first appearance, but has since been completely established; and it is now admitted into all historical collections, as a book of unquestionable authority.</p>
      <p>The old gentleman died shortly after the publication of his work; and now that he is dead and gone, it cannot do much harm to his memory to say that his time might have been much better employed in weightier labors.</p>
    `},
    // Page 4 — Chapter heading
    { label: 'Chapter I', html: `
      <div class="chapter-label">CHAPTER I</div>
      <h3>A POSTHUMOUS WRITING</h3>
      <p class="no-indent" style="text-align:center;font-style:italic;">By Woden, God of Saxons,<br>From whence comes Wensday, that is Wodensday,<br>Truth is a thing that ever I will keep<br>Unto thylke day in which I creep into<br>My sepulchre—</p>
      <p class="no-indent" style="text-align:center;margin-top:1em;font-style:italic;opacity:0.75;">Cartwright</p>
    `},
    // Page 5
    { label: 'Chapter I', html: `
      <p>Whoever has made a voyage up the Hudson must remember the Kaatskill mountains. They are a dismembered branch of the great Appalachian family, and are seen away to the west of the river, swelling up to a noble height, and lording it over the surrounding country.</p>
      <p>Every change of season, every change of weather, indeed, every hour of the day, produces some change in the magical hues and shapes of these mountains, and they are regarded by all the good wives, far and near, as perfect barometers.</p>
      <p>When the weather is fair and settled, they are clothed in blue and purple, and print their bold outlines on the clear evening sky; but sometimes, when the rest of the landscape is cloudless, they will gather a hood of gray vapors about their summits, which, in the last rays of the setting sun, will glow and light up like a crown of glory.</p>
    `},
    // Page 6
    { label: 'Chapter I', html: `
      <p>At the foot of these fairy mountains, the voyager may have descried the light smoke curling up from a village, whose shingle roofs gleam among the trees, just where the blue tints of the upland melt away into the fresh green of the nearer landscape.</p>
      <p>It is a little village of great antiquity, having been founded by some of the Dutch colonists, in the early times of the province, just about the beginning of the government of the good Peter Stuyvesant (may he rest in peace!), and there were some of the houses of the original settlers standing within a few years, built of small yellow bricks brought from Holland, having latticed windows and gable fronts, surmounted with weathercocks.</p>
    `},
    // Page 7
    { label: 'Chapter I', html: `
      <p>In that same village, and in one of these very houses (which, to tell the precise truth, was sadly time-worn and weather-beaten), there lived many years since, while the country was yet a province of Great Britain, a simple, good-natured fellow, of the name of Rip Van Winkle.</p>
      <p>He was a descendant of the Van Winkles who figured so gallantly in the chivalrous days of Peter Stuyvesant, and accompanied him to the siege of Fort Christina. He inherited, however, but little of the martial character of his ancestors.</p>
      <p>I have observed that he was a simple, good-natured man; he was, moreover, a kind neighbor, and an obedient, henpecked husband. Indeed, to the latter circumstance might be owing that meekness of spirit which gained him such universal popularity.</p>
    `},
    // Page 8
    { label: 'Chapter I', html: `
      <p>For those men are most apt to be obsequious and conciliating abroad, who are under the discipline of shrews at home. Their tempers, doubtless, are rendered pliant and malleable in the fiery furnace of domestic tribulation; and a curtain lecture is worth all the sermons in the world for teaching the virtues of patience and long-suffering.</p>
      <p>A termagant wife may, therefore, in some respects, be considered a tolerable blessing; and if so, Rip Van Winkle was thrice blessed.</p>
      <p>Certain it is, that he was a great favorite among all the good wives of the village, who, as usual with the amiable sex, took his part in all family squabbles; and never failed, whenever they talked those matters over in their evening gossippings, to lay all the blame on Dame Van Winkle.</p>
    `},
    // Page 9
    { label: 'Chapter I', html: `

  /* =========================================================
     状態
     ========================================================= */
  const book = document.querySelector('[data-book]');
  const cover = book.querySelector('[data-cover]');
  const pagesEl = book.querySelector('[data-pages]');
  const pageBody = book.querySelector('[data-page-body]');
  const pageNumEl = book.querySelector('[data-page-num]');
  const prevBtn = document.querySelector('[data-prev]');
  const nextBtn = document.querySelector('[data-next]');
  const themeBtns = document.querySelectorAll('.theme-btn');

  let isCoverOpen = false;
  let currentPage = 0;          // 0-indexed
  const totalPages = pages.length;

  /* =========================================================
     テーマ切替
     ========================================================= */
  function setTheme(theme) {
    pagesEl.classList.remove('theme-white', 'theme-black');
    pagesEl.classList.add(theme === 'black' ? 'theme-black' : 'theme-white');
    themeBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.theme === theme);
    });
  }

  themeBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setTheme(btn.dataset.theme);
    });
  });

  /* =========================================================
     ページ描画
     ========================================================= */
  function renderPage(index) {
    const p = pages[index];
    pageBody.innerHTML = p.html;
    pageNumEl.textContent = 'Page ' + (index + 1);
    pageBody.scrollTop = 0;
  }

  function syncButtons() {
    if (!isCoverOpen) {
      prevBtn.disabled = true;
      nextBtn.disabled = false;
      return;
    }
    prevBtn.disabled = false; // 常に有効（ページ0で押すと表紙に戻る）
    nextBtn.disabled = (currentPage >= totalPages - 1);
  }

  /* =========================================================
     次へ
     ========================================================= */
  function next() {
    if (!isCoverOpen) {
      cover.classList.add('flip');
      isCoverOpen = true;
      currentPage = 0;
      renderPage(0);
      syncButtons();
      return;
    }
    if (currentPage < totalPages - 1) {
      currentPage++;
      renderPage(currentPage);
      flash();
    }
    syncButtons();
  }

  /* =========================================================
     前へ
     ========================================================= */
  function prev() {
    if (!isCoverOpen) return;
    if (currentPage > 0) {
      currentPage--;
      renderPage(currentPage);
      flash();
    } else {
      // ページ0でPREV → 表紙を閉じる
      cover.classList.remove('flip');
      isCoverOpen = false;
      currentPage = 0;
      renderPage(0);
    }
    syncButtons();
  }

  function flash() {
    pageBody.style.opacity = '0.55';
    pageBody.style.transition = 'opacity 0.12s ease';
    setTimeout(() => {
      pageBody.style.opacity = '1';
    }, 100);
  }

  /* =========================================================
     初期化
     ========================================================= */
  renderPage(0);
  syncButtons();
  setTheme('white');

  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(); });
  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
  cover.addEventListener('click', () => { if (!isCoverOpen) next(); });

})();
</script>
