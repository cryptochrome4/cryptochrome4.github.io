<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>左右独立スクロール（20:80）</title>
    <style>
        /* ページ全体の初期化 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden; /* 全体のスクロールを禁止 */
            background-color: #000; /* 背景を黒にして引き締める */
        }

        /* 画面を左右に分割するコンテナ */
        .split-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 左側：スクロールエリア（完璧な幅20%） */
        .left-panel {
            width: 20%;
            height: 100%;
            overflow-y: scroll; /* 左側だけ独立して縦スクロール */
            -ms-overflow-style: none; /* スクロールバー非表示（IE, Edge） */
            scrollbar-width: none; /* スクロールバー非表示（Firefox） */
            background-color: #1a1a1a;
        }
        /* スクロールバー非表示（Chrome, Safari） */
        .left-panel::-webkit-scrollbar {
            display: none;
        }

        /* 左側の画像（歪まずに綺麗に収まり、縦に並ぶ設定） */
        .fixed-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* 右側：スクロールエリア（完璧な幅80%・最高の大きさ） */
        .right-panel {
            width: 80%;
            height: 100%;
            overflow-y: scroll; /* 右側だけ独立して縦スクロール */
            -ms-overflow-style: none; /* スクロールバー非表示 */
            scrollbar-width: none;
        }
        .right-panel::-webkit-scrollbar {
            display: none;
        }

        /* 右側のスクロール画像（最高の大きさで見せる設定） */
        .panel-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="split-container">
        <!-- 左側：スクロールエリア（20%・画像5枚） -->
        <div class="left-panel">
            <img src="img104kirara.jpg" alt="左画像1" class="fixed-img">
            <img src="img118cursive.jpg" alt="左画像2" class="fixed-img">
            <img src="img104kirara.jpg" alt="左画像3" class="fixed-img">
            <img src="image4.png" alt="左画像4" class="fixed-img">
            <img src="image5.png" alt="左画像5" class="fixed-img">
        </div>

        <!-- 右側：スクロールエリア（80%・画像12枚） -->
        <div class="right-panel">
            <!-- 最高の大きさで見せる画像（すべてダミー画像URLを入れています） -->
            <img src="img104kirara.jpg" alt="右画像1" class="panel-img">
            <img src="img111xrp.jpg" alt="右画像2" class="panel-img">
            <img src="img112xrp.jpg" alt="右画像3" class="panel-img">
            <img src="img113xrp.jpg" alt="右画像4" class="panel-img">
            <img src="img114xrp.jpg" alt="右画像5" class="panel-img">
            <img src="img115xrp.jpg" alt="右画像6" class="panel-img">
            <img src="img107comic.jpg" alt="右画像7" class="panel-img">
            <img src="img108comic.jpg" alt="右画像8" class="panel-img">
            <img src="img116xrp.jpg" alt="右画像9" class="panel-img">
            <img src="img117xrp.jpg" alt="右画像10" class="panel-img">
            <img src="img109comic.jpg" alt="右画像11" class="panel-img">
            <img src="img110comic.jpg" alt="右画像12" class="panel-img">
        </div>
    </div>

</body>
</html>
