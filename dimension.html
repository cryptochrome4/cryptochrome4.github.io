<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2連スプリットレイアウト（右スクロール）</title>
    <style>
        /* ページ全体の初期化 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden; /* 全体のスクロールを禁止 */
        }

        /* 画面を左右に分割するコンテナ */
        .split-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 共通のサイドパネル設定 */
        .panel {
            width: 50%;
            height: 100%;
        }

        /* 左側：固定表示するエリア */
        .left-panel {
            width: 20%;
            position: relative;
            overflow: hidden; /* スクロールさせない */
        }

        /* 右側：スクロールするエリア */
        .right-panel {
            width: 80%;
            overflow-y: scroll; /* 縦方向のスクロールを許可 */
            -ms-overflow-style: none;  /* IE, Edge用スクロールバー非表示 */
            scrollbar-width: none;  /* Firefox用スクロールバー非表示 */
        }
        /* Chrome, Safari用スクロールバー非表示 */
        .right-panel::-webkit-scrollbar {
            display: none;
        }

        /* 画像の基本スタイリング（縦横比を維持してフィット） */
        .panel-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* 左側の固定画像は画面いっぱいに表示 */
        .fixed-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="split-container">
        <!-- 左側：固定エリア -->
        <div class="left-panel">
            <!-- ここにずっと固定しておきたい画像を1枚配置します -->
            <img src="img118cursive.jpg" alt="左固定画像" class="fixed-img">
            <img src="img104kirara.jpg" alt="左固定画像" class="fixed-img">
        </div>

        <!-- 右側：スクロールエリア -->
        <div class="right-panel">
            <!-- ここにスクロールさせたい画像を縦に並べます -->
            <img src="img111xrp.jpg" alt="右画像1" class="panel-img">
            <img src="img112xrp.jpg" alt="右画像2" class="panel-img">
            <img src="img113xrp.jpg" alt="右画像3" class="panel-img">
            <img src="img114xrp.jpg" alt="右画像3" class="panel-img">
            <img src="img115xrp.jpg" alt="右画像3" class="panel-img">
            <img src="img116xrp.jpg" alt="右画像3" class="panel-img">
            <img src="img117xrp.jpg" alt="右画像3" class="panel-img">
            <img src="img107comic.jpg" alt="右画像3" class="panel-img">
            <img src="img108comic.jpg" alt="右画像3" class="panel-img">
            <img src="img109comic.jpg" alt="右画像3" class="panel-img">
            <img src="img110comic.jpg" alt="右画像3" class="panel-img">
        </div>
    </div>

</body>
</html>
