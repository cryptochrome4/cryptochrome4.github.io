<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像重ね合わせシミュレーター</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .control-panel { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; line-height: 2; }
        .viewer { position: relative; width: 100%; height: 800px; border: 1px solid #000; overflow: auto; }
        .layer { position: absolute; top: 0; left: 0; max-width: 100%; }
        #layer1 { z-index: 1; opacity: 1; }
        #layer2 { z-index: 2; opacity: 0.5; }
    </style>
</head>
<body>

    <h1>画像重ね合わせシミュレーター (13枚対応版)</h1>

    <div class="control-panel">
        <label for="select1">【1枚目（下になる画像）】:</label>
        <select id="select1" onchange="updateImages()">
            <option value="0">画像1</option>
            <option value="1">画像2</option>
            <option value="2">画像3</option>
            <option value="3">画像4</option>
            <option value="4">画像5</option>
            <option value="5">画像6</option>
            <option value="6">画像7</option>
            <option value="7">画像8</option>
            <option value="8">画像9</option>
            <option value="9">画像10</option>
            <option value="10">画像11</option>
            <option value="11">画像12</option>
            <option value="12">画像13</option>
        </select>
        <br>

        <label for="select2">【2枚目（上に重ねる画像）】:</label>
        <select id="select2" onchange="updateImages()">
            <option value="0">画像1</option>
            <option value="1" selected>画像2</option>
            <option value="2">画像3</option>
            <option value="3">画像4</option>
            <option value="4">画像5</option>
            <option value="5">画像6</option>
            <option value="6">画像7</option>
            <option value="7">画像8</option>
            <option value="8">画像9</option>
            <option value="9">画像10</option>
            <option value="10">画像11</option>
            <option value="11">画像12</option>
            <option value="12">画像13</option>
        </select>
        <br>

        <label for="opacitySlider">【上の画像の不透明度】:</label>
        <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="0.5" oninput="changeOpacity(this.value)">
        <span id="opacityValue">0.5</span>
    </div>

    <script>
        // 💡 GitHub上にある13枚の画像名と完全に一致させました
        var imageUrls = [
            "633464223-942dc916-168c-4cd2-bec6-8f1c22b2b008.jpg",
            "633464224-22ce0896-205d-4a4e-b5cb-e234c9c1a5be.jpg",
            "633464225-01a96894-d74b-4191-89b5-680f4f9f7407.jpg",
            "633464226-a9689e9a-49b7-4e89-9a25-e517865c66d2.jpg",
            "633464227-5796b93f-d503-4bd8-9bd3-8fb54cc041dc.jpg",
            "633464228-305fb4cd-9744-4c31-9f9b-6ef93d98fb8d.jpg",
            "633464229-70d1360f-f25b-4f52-87db-a2d98d1a6e9a.jpg",
            "633464230-57d2e5e5-8a1e-4049-923f-56bb4bf5b721.jpg",
            "633464231-2eff677b-cd59-4cac-8706-e7e890f5cb68.jpg",
            "633464232-d81d0ee5-97a5-48ad-863a-23dcf1b31da4.jpg",
            "633464233-43583c96-72b0-42dd-9003-f36bc40df524.jpg",
            "633464234-d6bddb6b-899d-4899-b1ff-9721fb6f1c7d.jpg",
            "633464235-5557ef8c-d097-4c86-90f0-c5bfae7e60cf.jpg"
        ];

        function updateImages() {
            var idx1 = document.getElementById('select1').value;
            var idx2 = document.getElementById('select2').value;
            
            document.getElementById('layer1').src = imageUrls[idx1];
            document.getElementById('layer2').src = imageUrls[idx2];
        }

        function changeOpacity(val) {
            document.getElementById('layer2').style.opacity = val;
            document.getElementById('opacityValue').textContent = val;
        }

        window.onload = function() {
            updateImages();
        };
    </script>

    <div class="viewer">
        <img id="layer1" class="layer" src="" alt="画像が読み込めません">
        <img id="layer2" class="layer" src="" alt="画像が読み込めません">
    </div>

</body>
</html>
