<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>大規模サイバー攻撃 年表マップ 2000-2026</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #081420;
    font-family: 'Segoe UI', 'Meiryo', sans-serif;
    color: #cce;
    padding: 10px;
  }
  .title {
    text-align: center;
    font-size: 22px;
    padding: 14px 0 6px;
    color: #8ccbff;
    letter-spacing: 2px;
    border-bottom: 1px solid #1a3a55;
  }
  .title small { font-size: 14px; color: #7799bb; }

  .container {
    display: flex;
    gap: 12px;
    max-width: 1160px;
    margin: 0 auto;
  }

  /* ===== 年号ボタン（左側） ===== */
  .year-nav {
    flex: 0 0 70px;
    background: #0f1f2f;
    border-radius: 12px;
    border: 1px solid #1f4a6a;
    padding: 10px 6px;
    max-height: 620px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }
  .year-nav button {
    width: 100%;
    padding: 4px 0;
    font-size: 12px;
    font-weight: bold;
    border: 1px solid #2a5a7a;
    border-radius: 6px;
    background: #0a1a2a;
    color: #88bbdd;
    cursor: pointer;
    transition: 0.2s;
  }
  .year-nav button:hover {
    background: #1a3a5a;
    color: #fff;
  }
  .year-nav button.active {
    background: #ffaa33;
    color: #000;
    border-color: #ffaa33;
  }
  .year-nav .all-btn {
    background: #1a3a3a;
    color: #88ddbb;
    border-color: #2a6a5a;
    margin-bottom: 6px;
  }
  .year-nav .all-btn:hover {
    background: #2a5a4a;
    color: #fff;
  }

  /* ===== 地図 ===== */
  .map-wrap {
    position: relative;
    flex: 1;
    background: #0a1e2e;
    border-radius: 16px;
    border: 1px solid #1f4a6a;
    padding: 6px;
  }
  .map-wrap img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    pointer-events: none;
    user-select: none;
  }

  /* ===== マーカー（全部共通） ===== */
  .marker {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: 0.25s;
    z-index: 5;
    box-shadow: 0 0 14px rgba(255,200,50,0.7);
  }
  .marker:hover {
    width: 26px;
    height: 26px;
    z-index: 20;
    box-shadow: 0 0 30px #ffaa33;
  }
  .marker.from { background: #9b59b6; border-color: #ffaa44; }
  .marker.to   { background: #ff2255; border-color: #ff7799; }

  .label {
    position: absolute;
    transform: translate(-50%, -120%);
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 0 0 12px #000, 0 0 6px #000, 0 0 3px #000;
    white-space: nowrap;
    background: rgba(0,0,0,0.65);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 6;
    letter-spacing: 0.5px;
  }
  .arrow-line {
    position: absolute;
    color: #ffdd44;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
  }
  .year-badge {
    position: absolute;
    background: rgba(0,20,40,0.85);
    color: #ffcc44;
    font-size: 10px;
    padding: 1px 8px;
    border-radius: 20px;
    border: 1px solid #ffaa33;
    transform: translate(-50%, 10%);
    pointer-events: none;
    z-index: 7;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  /* ===== ポップアップ ===== */
  .popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #0a1a2a;
    border: 2px solid #3a8abf;
    border-radius: 16px;
    padding: 28px 34px;
    max-width: 520px;
    width: 90%;
    z-index: 999;
    box-shadow: 0 0 60px rgba(0,100,200,0.5);
    color: #ddeeff;
  }
  .popup.active { display: block; }
  .popup h3 { color: #ffbb44; font-size: 20px; margin-bottom: 6px; }
  .popup .year { color: #88ddff; font-size: 15px; }
  .popup .desc { margin: 12px 0; font-size: 15px; line-height: 1.6; color: #c8dcee; }
  .popup .meta { font-size: 13px; color: #88aacc; border-top: 1px solid #1a3a5a; padding-top: 10px; }
  .popup .close {
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 28px;
    cursor: pointer;
    color: #7799bb;
    background: none;
    border: none;
  }
  .popup .close:hover { color: #ff8844; }
  .overlay {
    display: none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.7);
    z-index: 998;
  }
  .overlay.active { display: block; }

  .legend {
    max-width: 1160px;
    margin: 10px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 18px 30px;
    padding: 8px 16px;
    background: #0f1f2f;
    border-radius: 10px;
    color: #aac;
    font-size: 13px;
    justify-content: center;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot-from { width:14px; height:14px; border-radius:50%; background:#ff6633; border:1px solid #ffaa44; display:inline-block; }
  .dot-to   { width:14px; height:14px; border-radius:50%; background:#ff2255; border:1px solid #ff7799; display:inline-block; }

  .footer {
    text-align: center;
    font-size: 12px;
    color: #557799;
    padding: 16px 0 6px;
    border-top: 1px solid #1a2a3a;
    max-width: 1160px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="title">
  🌍 大規模サイバー攻撃 年表マップ <small>2000 – 2026</small>
</div>

<div class="legend">
  <span><span class="dot-from"></span> 発信元（攻撃元）</span>
  <span><span class="dot-to"></span> 標的（攻撃先）</span>
  <span>➡ 矢印＝攻撃方向</span>
  <span>🟡 年号バッジ</span>
  <span style="color:#88ddbb;">📌 左の年号ボタンでフィルター</span>
</div>

<div class="container">
  <!-- ===== 年号ボタン（左側） ===== -->
  <div class="year-nav" id="yearNav">
    <button class="all-btn active" data-year="all">📌 全部</button>
    <!-- ボタンはJSで動的に生成 -->
  </div>

  <!-- ===== 地図 ===== -->
  <div class="map-wrap" id="mapContainer">
    <img src="img152map.jpg" alt="World Map" id="mapImage">
  </div>
</div>

<div class="footer">
  📌 クリックで詳細ポップアップ表示 ｜ 年号ボタンでその年の攻撃だけに絞り込めます
</div>

<!-- ========== ポップアップ ========== -->
<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
  <button class="close" id="popupClose">✕</button>
  <h3 id="popupTitle">攻撃名</h3>
  <div class="year" id="popupYear">2000年</div>
  <div class="desc" id="popupDesc">詳細説明</div>
  <div class="meta" id="popupMeta">発信元 → 標的 ｜ 規模</div>
</div>

<script>
// ================================================================
//  攻撃データ（2000〜2026）ドイツアンカー版
// ================================================================
const attacks = [
  { id: 1, year: 2000, name: "MafiaBoy DDoS", from: "カナダ", to: "米国",
    fromPos: { left: 16, top: 43 }, toPos: { left: 15, top: 47 },
    desc: "15歳の少年がYahoo!, CNN, eBay, Amazonなど大手サイトへ大規模DDoS攻撃。",
    scale: "大規模 (商用サイト複数)" },
  { id: 2, year: 2001, name: "Code Red / Nimda", from: "中国", to: "米国",
    fromPos: { left: 75, top: 48 }, toPos: { left: 15, top: 47 },
    desc: "Code Redワームが米国政府・企業サーバーへ。Nimdaは複数経路で感染拡大。",
    scale: "世界的ワーム" },
  { id: 3, year: 2007, name: "エストニア サイバー攻撃", from: "ロシア", to: "エストニア",
    fromPos: { left: 57, top: 40 }, toPos: { left: 53, top: 38 },
    desc: "エストニア政府・銀行・メディアへ大規模DDoS。ロシア系ハッカーによる報復。",
    scale: "国家規模DDoS" },
  { id: 4, year: 2008, name: "ジョージア サイバー戦争", from: "ロシア", to: "ジョージア",
    fromPos: { left: 57, top: 40 }, toPos: { left: 55, top: 42 },
    desc: "南オセチア紛争に併行して、ジョージア政府・メディアサイトを大規模攻撃。",
    scale: "軍事作戦と連動" },
  { id: 5, year: 2010, name: "Stuxnet（震電）", from: "米国・イスラエル", to: "イラン",
    fromPos: { left: 15, top: 47 }, toPos: { left: 62, top: 49 },
    desc: "イランの核施設（ナタンズ）の遠心分離機を破壊する標的型マルウェア。",
    scale: "産業スパイ・破壊工作" },
  { id: 6, year: 2013, name: "3.20 韓国サイバー攻撃", from: "北朝鮮", to: "韓国",
    fromPos: { left: 78, top: 48 }, toPos: { left: 80, top: 50 },
    desc: "KBS・MBC・YTN放送局、新韓銀行・農協銀行などへデータ破壊マルウェア。",
    scale: "国家主導の大規模破壊" },
  { id: 7, year: 2014, name: "Sony Pictures ハッキング", from: "北朝鮮", to: "米国",
    fromPos: { left: 78, top: 48 }, toPos: { left: 15, top: 47 },
    desc: "ソニー・ピクチャーズへの攻撃。『ザ・インタビュー』公開阻止が動機。",
    scale: "エンタメ企業標的" },
  { id: 8, year: 2017, name: "WannaCry ランサムウェア", from: "北朝鮮", to: "全世界",
    fromPos: { left: 78, top: 48 }, toPos: { left: 50, top: 16 },
    desc: "世界中で30万台以上感染。NHS（英）・FedEx・テレフォニカなどが被害。",
    scale: "世界的ランサムウェア" },
  { id: 9, year: 2017, name: "NotPetya", from: "ロシア", to: "ウクライナ",
    fromPos: { left: 57, top: 40 }, toPos: { left: 55, top: 42 },
    desc: "ウクライナ政府・銀行・電力へ。Maersk・FedExなど世界的に波及。",
    scale: "世界的破壊型マルウェア" },
  { id: 10, year: 2018, name: "Marriott（スターウッド）", from: "中国", to: "米国",
    fromPos: { left: 75, top: 48 }, toPos: { left: 15, top: 47 },
    desc: "マリオットホテル顧客データ約5億件流出。中国拠点のハッカーとされる。",
    scale: "データ漏洩（5億件）" },
  { id: 11, year: 2020, name: "SolarWinds（サンライズ）", from: "ロシア", to: "米国",
    fromPos: { left: 57, top: 40 }, toPos: { left: 15, top: 47 },
    desc: "政府機関（財務省・商務省など）やFortune500企業へ。サプライチェーン攻撃。",
    scale: "国家レベルのサプライチェーン" },
  { id: 12, year: 2021, name: "Colonial Pipeline", from: "ロシア", to: "米国",
    fromPos: { left: 57, top: 40 }, toPos: { left: 15, top: 47 },
    desc: "米国東海岸の主要パイプライン操業停止。身代金約440万ドル支払い。",
    scale: "重要インフラ標的" },
  { id: 13, year: 2022, name: "ロシア・ウクライナ サイバー戦", from: "ロシア", to: "ウクライナ",
    fromPos: { left: 57, top: 40 }, toPos: { left: 55, top: 42 },
    desc: "侵攻前後から政府・金融・エネルギーへの大規模サイバー攻撃が頻発。",
    scale: "戦時サイバー作戦" },
  { id: 14, year: 2023, name: "MOVEit ゼロデイ攻撃", from: "ロシア", to: "米国・欧州",
    fromPos: { left: 57, top: 40 }, toPos: { left: 30, top: 42 },
    desc: "ファイル転送ソフトMOVEitの脆弱性を悪用。政府・企業多数が被害。",
    scale: "広範囲サプライチェーン" },
  { id: 15, year: 2024, name: "Microsoft / 米国政府 標的型", from: "中国", to: "米国",
    fromPos: { left: 75, top: 48 }, toPos: { left: 15, top: 47 },
    desc: "中国拠点の「Storm-0558」がMicrosoft社内システムと米政府メールへ侵入。",
    scale: "国家レベルの情報収集" },
  { id: 16, year: 2025, name: "台湾 大規模DDoS", from: "中国", to: "台湾",
    fromPos: { left: 75, top: 48 }, toPos: { left: 78, top: 54 },
    desc: "台湾政府・金融・メディアへの大規模DDoS攻撃。中国系ハッカー集団が関与。",
    scale: "政治的圧力" },
  { id: 17, year: 2026, name: "ベルリン市役所 身代金要求", from: "ロシア", to: "ドイツ",
    fromPos: { left: 57, top: 40 }, toPos: { left: 50, top: 42 },
    desc: "ベルリン市行政ネットワークがRhysidaグループにより暗号化。身代金約30BTC要求。",
    scale: "地方自治体標的" }
];

// ================================================================
//  年号ボタンを生成
// ================================================================
const yearNav = document.getElementById('yearNav');
const years = [...new Set(attacks.map(a => a.year))].sort();

// 「全部」ボタンは既にあるので、その後に追加
years.forEach(y => {
  const btn = document.createElement('button');
  btn.textContent = y;
  btn.dataset.year = y;
  btn.addEventListener('click', () => filterByYear(y));
  yearNav.appendChild(btn);
});

// 「全部」ボタンのイベント
document.querySelector('.all-btn').addEventListener('click', () => {
  filterByYear('all');
});

// ================================================================
//  フィルター関数
// ================================================================
let currentFilter = 'all';

function filterByYear(year) {
  currentFilter = year;

  // ボタンのアクティブ状態を更新
  document.querySelectorAll('.year-nav button').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.year == year) btn.classList.add('active');
    if (year === 'all' && btn.classList.contains('all-btn')) btn.classList.add('active');
  });

  // すべてのマーカーを一度削除して再描画
  const container = document.getElementById('mapContainer');
  document.querySelectorAll('.marker, .label, .arrow-line, .year-badge').forEach(el => el.remove());

  // フィルターに合うものだけ描画
  const filtered = year === 'all' ? attacks : attacks.filter(a => a.year == year);
  filtered.forEach((a, index) => {
    const from = a.fromPos;
    const to = a.toPos;

    const fm = document.createElement('div');
    fm.className = 'marker from';
    fm.style.left = from.left + '%';
    fm.style.top = from.top + '%';
    fm.title = a.from + ' → ' + a.to;
    fm.dataset.id = index;
    fm.addEventListener('click', () => showPopup(attacks.indexOf(a)));
    container.appendChild(fm);

    const fl = document.createElement('div');
    fl.className = 'label';
    fl.style.left = from.left + '%';
    fl.style.top = from.top + '%';
    fl.textContent = a.from;
    container.appendChild(fl);

    const tm = document.createElement('div');
    tm.className = 'marker to';
    tm.style.left = to.left + '%';
    tm.style.top = to.top + '%';
    tm.title = a.to;
    tm.dataset.id = index;
    tm.addEventListener('click', () => showPopup(attacks.indexOf(a)));
    container.appendChild(tm);

    const tl = document.createElement('div');
    tl.className = 'label';
    tl.style.left = to.left + '%';
    tl.style.top = to.top + '%';
    tl.textContent = a.to;
    container.appendChild(tl);

    const midX = (from.left + to.left) / 2;
    const midY = (from.top + to.top) / 2;
    const arrow = document.createElement('div');
    arrow.className = 'arrow-line';
    arrow.style.left = midX + '%';
    arrow.style.top = midY + '%';
    arrow.textContent = '➡';
    container.appendChild(arrow);

    const badge = document.createElement('div');
    badge.className = 'year-badge';
    badge.style.left = from.left + '%';
    badge.style.top = (from.top + 3.5) + '%';
    badge.textContent = a.year;
    container.appendChild(badge);
  });
}

// ================================================================
//  ポップアップ
// ================================================================
const popup = document.getElementById('popup');
const overlay = document.getElementById('overlay');
const popupTitle = document.getElementById('popupTitle');
const popupYear = document.getElementById('popupYear');
const popupDesc = document.getElementById('popupDesc');
const popupMeta = document.getElementById('popupMeta');
const popupClose = document.getElementById('popupClose');

function showPopup(index) {
  const d = attacks[index];
  if (!d) return;
  popupTitle.textContent = d.name + '（' + d.year + '年）';
  popupYear.textContent = '📅 ' + d.year + '年 ｜ ' + d.from + ' → ' + d.to;
  popupDesc.textContent = d.desc;
  popupMeta.textContent = '⚡ 規模：' + d.scale;
  popup.classList.add('active');
  overlay.classList.add('active');
}

function hidePopup() {
  popup.classList.remove('active');
  overlay.classList.remove('active');
}

popupClose.addEventListener('click', hidePopup);
overlay.addEventListener('click', hidePopup);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hidePopup(); });

// ================================================================
//  初期表示（全部表示）
// ================================================================
filterByYear('all');
</script>

</body>
</html>
