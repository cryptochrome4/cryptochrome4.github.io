<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>大規模サイバー攻撃 年表マップ 2000-2026</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #081420;
    font-family: 'Segoe UI', 'Meiryo', sans-serif;
    color: #cce;
    padding: 10px;
  }
  .title {
    text-align: center;
    font-size: 22px;
    padding: 14px 0 6px;
    color: #8ccbff;
    letter-spacing: 2px;
    border-bottom: 1px solid #1a3a55;
  }
  .title small { font-size: 14px; color: #7799bb; }
  .map-wrap {
    position: relative;
    max-width: 1100px;
    margin: 12px auto;
    background: #0a1e2e;
    border-radius: 16px;
    border: 1px solid #1f4a6a;
    padding: 6px;
  }
  .map-wrap img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    pointer-events: none;
    user-select: none;
  }

  /* --- マーカー & ラベル --- */
  .marker {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: 0.25s;
    z-index: 5;
    box-shadow: 0 0 14px rgba(255,200,50,0.7);
  }
  .marker:hover {
    width: 26px;
    height: 26px;
    z-index: 20;
    box-shadow: 0 0 30px #ffaa33;
  }
  .marker.from { background: #ff6633; border-color: #ffaa44; }
  .marker.to   { background: #ff2255; border-color: #ff7799; }

  .label {
    position: absolute;
    transform: translate(-50%, -120%);
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 0 0 12px #000, 0 0 6px #000, 0 0 3px #000;
    white-space: nowrap;
    background: rgba(0,0,0,0.65);
    padding: 2px 8px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 6;
    letter-spacing: 0.5px;
  }
  .arrow-line {
    position: absolute;
    color: #ffdd44;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
  }
  .year-badge {
    position: absolute;
    background: rgba(0,20,40,0.85);
    color: #ffcc44;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    border: 1px solid #ffaa33;
    transform: translate(-50%, 10%);
    pointer-events: none;
    z-index: 7;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  /* --- ポップアップ (詳細) --- */
  .popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #0a1a2a;
    border: 2px solid #3a8abf;
    border-radius: 16px;
    padding: 28px 34px;
    max-width: 520px;
    width: 90%;
    z-index: 999;
    box-shadow: 0 0 60px rgba(0,100,200,0.5);
    color: #ddeeff;
  }
  .popup.active { display: block; }
  .popup h3 { color: #ffbb44; font-size: 20px; margin-bottom: 6px; }
  .popup .year { color: #88ddff; font-size: 15px; }
  .popup .desc { margin: 12px 0; font-size: 15px; line-height: 1.6; color: #c8dcee; }
  .popup .meta { font-size: 13px; color: #88aacc; border-top: 1px solid #1a3a5a; padding-top: 10px; }
  .popup .close {
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 28px;
    cursor: pointer;
    color: #7799bb;
    background: none;
    border: none;
  }
  .popup .close:hover { color: #ff8844; }
  .overlay {
    display: none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.7);
    z-index: 998;
  }
  .overlay.active { display: block; }

  .legend {
    max-width: 1100px;
    margin: 10px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 18px 30px;
    padding: 8px 16px;
    background: #0f1f2f;
    border-radius: 10px;
    color: #aac;
    font-size: 13px;
    justify-content: center;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot-from { width:14px; height:14px; border-radius:50%; background:#ff6633; border:1px solid #ffaa44; display:inline-block; }
  .dot-to   { width:14px; height:14px; border-radius:50%; background:#ff2255; border:1px solid #ff7799; display:inline-block; }

  .footer {
    text-align: center;
    font-size: 12px;
    color: #557799;
    padding: 16px 0 6px;
    border-top: 1px solid #1a2a3a;
    max-width: 1100px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="title">

</div>

<div class="legend">
  <span><span class="dot-from"></span> 発信元（攻撃元）</span>
  <span><span class="dot-to"></span> 標的（攻撃先）</span>
  <span>➡ 矢印＝攻撃方向</span>
  <span>🟡 年号バッジ</span>
</div>

<div class="map-wrap" id="mapContainer">
  <!-- ★ 画像ファイル名を "img152map.jpg" に修正 -->
  <img src="img152map.jpg" alt="World Map" id="mapImage">
</div>

<div class="footer">
  📌 クリックで詳細ポップアップ表示 ｜ データは主要な大規模攻撃を厳選（教育目的）
</div>

<!-- ========== ポップアップ ========== -->

</div>

    scale: "地方自治体標的"
  }

// ================================================================
//  地図上に描画
// ================================================================
const container = document.getElementById('mapContainer');

attacks.forEach((a, index) => {
  const from = a.fromPos;
  const to   = a.toPos;

  // --- 発信元（from） ---
  const fm = document.createElement('div');
  fm.className = 'marker from';
  fm.style.left = from.left + '%';
  fm.style.top  = from.top + '%';
  fm.title = a.from + ' → ' + a.to;
  fm.dataset.id = index;
  fm.addEventListener('click', () => showPopup(index));
  container.appendChild(fm);

  // --- 発信元ラベル ---
  const fl = document.createElement('div');
  fl.className = 'label';
  fl.style.left = from.left + '%';
  fl.style.top  = from.top + '%';
  fl.textContent = a.from;
  container.appendChild(fl);

  // --- 標的（to） ---
  const tm = document.createElement('div');
  tm.className = 'marker to';
  tm.style.left = to.left + '%';
  tm.style.top  = to.top + '%';
  tm.title = a.to;
  tm.dataset.id = index;
  tm.addEventListener('click', () => showPopup(index));
  container.appendChild(tm);

  // --- 標的ラベル ---
  const tl = document.createElement('div');
  tl.className = 'label';
  tl.style.left = to.left + '%';
  tl.style.top  = to.top + '%';
  tl.textContent = a.to;
  container.appendChild(tl);

  // --- 矢印（中間点に配置） ---
  const midX = (from.left + to.left) / 2;
  const midY = (from.top  + to.top ) / 2;
  const arrow = document.createElement('div');
  arrow.className = 'arrow-line';
  arrow.style.left = midX + '%';
  arrow.style.top  = midY + '%';
  arrow.textContent = '➡';
  container.appendChild(arrow);

  // --- 年号バッジ（攻撃元の少し下） ---
  const badge = document.createElement('div');
  badge.className = 'year-badge';
  badge.style.left = from.left + '%';
  badge.style.top  = (from.top + 4.5) + '%';
  badge.textContent = a.year;
  container.appendChild(badge);
});

// ================================================================
//  ポップアップ表示
// ================================================================
const popup       = document.getElementById('popup');
const overlay     = document.getElementById('overlay');
const popupTitle  = document.getElementById('popupTitle');
const popupYear   = document.getElementById('popupYear');
const popupDesc   = document.getElementById('popupDesc');
const popupMeta   = document.getElementById('popupMeta');
const popupClose  = document.getElementById('popupClose');

function showPopup(index) {
  const d = attacks[index];
  popupTitle.textContent = d.name + '（' + d.year + '年）';
  popupYear.textContent  = '📅 ' + d.year + '年 ｜ ' + d.from + ' → ' + d.to;
  popupDesc.textContent  = d.desc;
  popupMeta.textContent  = '⚡ 規模：' + d.scale;
  popup.classList.add('active');
  overlay.classList.add('active');
}

function hidePopup() {
  popup.classList.remove('active');
  overlay.classList.remove('active');
}

popupClose.addEventListener('click', hidePopup);
overlay.addEventListener('click', hidePopup);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hidePopup(); });
</script>

</body>
</html>
