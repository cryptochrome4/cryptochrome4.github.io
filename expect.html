<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期待値モデルの数値化</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { font-size: 1.5rem; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; color: #38bdf8; text-align: center; }
        .section { margin-bottom: 25px; background: #111827; padding: 15px; border-radius: 8px; }
        .step-title { font-weight: bold; color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; }
        .formula { font-family: monospace; font-size: 1.2rem; color: #f8fafc; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>期待値モデルの数値化</h1>
        
        <div class="section">
            <div class="step-title">1</div>
            <div class="formula">340000 ÷ 168 = <span id="n1"></span></div>
        </div>

        <div class="section">
            <div class="step-title">2</div>
            <div class="formula">70000 ÷ 151 = <span id="n2"></span></div>
        </div>

        <div class="section">
            <div class="step-title">3</div>
            <div class="formula">
                340000 + 70000 = <span id="a_total"></span><br>
                <span id="n1_copy"></span> + <span id="n2_copy"></span> = <span id="n_total"></span><br>
                410000 ÷ <span id="n_total_copy"></span> = <span id="p_avg"></span>
            </div>
        </div>

        <div class="section">
            <div class="step-title">4</div>
            <div class="formula">
                <span id="p_avg_copy"></span> × 1.1 = <span id="p_target"></span><br>
                <span id="n_total_copy2"></span> × <span id="p_target_copy"></span> = <span id="v_target"></span><br>
                <span id="v_target_copy"></span> - 410000 = <span id="r"></span>
            </div>
        </div>

        <div class="section">
            <div class="step-title">5</div>
            <div class="formula">
                320000 ÷ <span id="p_target_copy2"></span> = <span id="n_sell"></span><br>
                <span id="n_total_copy3"></span> - <span id="n_sell_copy"></span> = <span id="n_hold"></span><br>
                <span id="n_hold_copy"></span> × <span id="p_target_copy3"></span> = <span id="v_hold"></span>
            </div>
        </div>
    </div>

    <script>
        const n1 = 340000 / 168;
        const n2 = 70000 / 151;
        const a_total = 340000 + 70000;
        const n_total = n1 + n2;
        const p_avg = a_total / n_total;
        const p_target = p_avg * 1.1;
        const v_target = n_total * p_target;
        const r = v_target - a_total;
        const n_sell = 320000 / p_target;
        const n_hold = n_total - n_sell;
        const v_hold = n_hold * p_target;

        document.getElementById('n1').innerText = n1.toFixed(2);
        document.getElementById('n2').innerText = n2.toFixed(2);
        document.getElementById('a_total').innerText = a_total;
        document.getElementById('n1_copy').innerText = n1.toFixed(2);
        document.getElementById('n2_copy').innerText = n2.toFixed(2);
        document.getElementById('n_total').innerText = n_total.toFixed(2);
        document.getElementById('n_total_copy').innerText = n_total.toFixed(2);
        document.getElementById('p_avg').innerText = p_avg.toFixed(2);
        document.getElementById('p_avg_copy').innerText = p_avg.toFixed(2);
        document.getElementById('p_target').innerText = p_target.toFixed(2);
        document.getElementById('n_total_copy2').innerText = n_total.toFixed(2);
        document.getElementById('p_target_copy').innerText = p_target.toFixed(2);
        document.getElementById('v_target').innerText = Math.round(v_target);
        document.getElementById('v_target_copy').innerText = Math.round(v_target);
        document.getElementById('r').innerText = Math.round(r);
        document.getElementById('p_target_copy2').innerText = p_target.toFixed(2);
        document.getElementById('n_sell').innerText = n_sell.toFixed(2);
        document.getElementById('n_total_copy3').innerText = n_total.toFixed(2);
        document.getElementById('n_sell_copy').innerText = n_sell.toFixed(2);
        document.getElementById('n_hold').innerText = n_hold.toFixed(2);
        document.getElementById('n_hold_copy').innerText = n_hold.toFixed(2);
        document.getElementById('p_target_copy3').innerText = p_target.toFixed(2);
        document.getElementById('v_hold').innerText = Math.round(v_hold);
    </script>
</body>
</html>
