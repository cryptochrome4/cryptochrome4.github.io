<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>仮想通貨 大規模資金移動パターン30選 (2013互換)</title>
<style>
  body { background:#f5f5f5; font-family:'MS Gothic',Osaka,'Hiragino Sans',sans-serif; margin:20px; }
  h1 { font-size:24px; border-bottom:3px solid #333; padding-bottom:8px; }
  .filter-area { margin:15px 0; padding:10px; background:#fff; border:1px solid #ccc; }
  .filter-area label { font-weight:bold; margin-right:10px; }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:14px; }
  th { background:#2c3e50; color:#fff; padding:8px 6px; text-align:left; }
  td { padding:8px 6px; border-bottom:1px solid #ddd; vertical-align:top; }
  .category { background:#ecf0f1; font-weight:bold; }
  .badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:12px; color:#fff; }
  .bg-buy { background:#27ae60; }
  .bg-sell { background:#e74c3c; }
  .bg-neutral { background:#7f8c8d; }
  .footnote { margin-top:20px; padding:12px; background:#fff9e6; border:1px solid #d4ac0d; font-size:13px; }
</style>
</head>
<body>

<h1>📊 仮想通貨 大規模資金移動パターン <small>（全30種・2013年環境対応版）</small></h1>

<div class="filter-area">
  <label>🔍 フィルタ：</label>
  <select id="catFilter" onchange="applyFilter()">
    <option value="all">すべて表示</option>
    <option value="取引所">取引所関連</option>
    <option value="マイナー">マイナー・採掘</option>
    <option value="プロジェクト">プロジェクト/開発</option>
    <option value="投資家">投資家/ファンド</option>
    <option value="規制/法制度">規制・法制度</option>
    <option value="セキュリティ">セキュリティ/不正</option>
    <option value="その他">その他</option>
  </select>
  <span style="margin-left:20px; color:#555;">※ クリックでソートは非対応（軽量化のため）</span>
</div>

<table id="movementTable">
  <thead>
    <tr><th style="width:8%;">#</th><th style="width:18%;">カテゴリ</th><th style="width:22%;">種類（イベント名）</th><th style="width:18%;">送り手</th><th style="width:18%;">受け手</th><th style="width:24%;">目的・影響</th><th style="width:10%;">相場影響</th></tr>
  </thead>
  <tbody id="tableBody">
  </tbody>
</table>

<div class="footnote">
  <strong>⚠ 2013年当時のハードウェアでも動作するよう、ES5構文・シンプルDOM操作を採用。</strong><br>
  ・各パターンは過去実例をベースに汎用化。<br>
  ・「相場影響」は典型的な方向性（買い↗ / 売り↘ / 中立→）。
</div>

<script>
(function() {
  // ---- データ定義（全30パターン） ----
  var data = [];

  // 1) 取引所関連 (6種)
  data.push({cat:'取引所', name:'取引所の大口入金', from:'個人/機関投資家', to:'取引所ウォレット', purpose:'売却準備（流動性供給）', effect:'売り圧力↘'});
  data.push({cat:'取引所', name:'取引所の大口出金', from:'取引所ウォレット', to:'個人/コールドウォレット', purpose:'長期保管（引き出し）', effect:'買い圧力↗（供給減少）'});
  data.push({cat:'取引所', name:'取引所間のアービトラージ', from:'取引所A', to:'取引所B', purpose:'価格差を利用した短期売買', effect:'中立→（価格平準化）'});
  data.push({cat:'取引所', name:'OTC（店頭取引）決済', from:'大口売り手', to:'大口買い手（取引所経由）', purpose:'相場に影響させない大口取引', effect:'中立〜買い↗（オフチェーン）'});
  data.push({cat:'取引所', name:'取引所の流動性プール移動', from:'取引所ホットウォレット', to:'別のホットウォレット', purpose:'流動性分散・リスクヘッジ', effect:'中立→'});
  data.push({cat:'取引所', name:'新規上場時の準備移動', from:'プロジェクト/投資家', to:'取引所', purpose:'上場時の流動性確保', effect:'買い↗（話題性）'});

  // 2) マイナー・採掘 (4種)
  data.push({cat:'マイナー', name:'マイニング報酬の移動', from:'マイニングプール', to:'マイナー個人ウォレット', purpose:'採掘報酬の受け取り', effect:'売り↘（売却されやすい）'});
  data.push({cat:'マイナー', name:'マイナーによる大量売却', from:'マイナーウォレット', to:'取引所', purpose:'電気代・設備投資の回収', effect:'売り↘'});
  data.push({cat:'マイナー', name:'マイナーのコイン蓄積', from:'取引所', to:'マイナーコールドウォレット', purpose:'バランスシート強化', effect:'買い↗'});
  data.push({cat:'マイナー', name:'プール間のハッシュ移転', from:'旧マイニングプール', to:'新マイニングプール', purpose:'採掘効率改善', effect:'中立→'});

  // 3) プロジェクト/開発 (6種)
  data.push({cat:'プロジェクト', name:'ICO/トークンセール資金調達', from:'投資家', to:'プロジェクト財布', purpose:'開発資金の調達', effect:'買い↗（セール期間中）'});
  data.push({cat:'プロジェクト', name:'開発チームのトークン解放', from:'プロジェクトベスティング', to:'開発者ウォレット', purpose:'チーム報酬・インセンティブ', effect:'売り↘（解放後に売却）'});
  data.push({cat:'プロジェクト', name:'エコシステムファンドへの拠出', from:'プロジェクト財布', to:'エコシステムファンド', purpose:'開発者支援・育成', effect:'中立→'});
  data.push({cat:'プロジェクト', name:'パートナーシップに伴う移転', from:'プロジェクトA', to:'プロジェクトB', purpose:'業務提携・資金協力', effect:'買い↗（期待感）'});
  data.push({cat:'プロジェクト', name:'フォークに伴う分割コイン移動', from:'旧チェーン', to:'新チェーン', purpose:'ハードフォーク実施', effect:'中立→（分裂）'});
  data.push({cat:'プロジェクト', name:'バーン（焼却）アドレスへの送信', from:'プロジェクト財布', to:'バーンアドレス', purpose:'供給量減少（デフレ）', effect:'買い↗（長期的希少性）'});

  // 4) 投資家/ファンド (5種)
  data.push({cat:'投資家', name:'ベンチャーキャピタルの投資', from:'VCファンド', to:'プロジェクト財布', purpose:'シリーズA/B資金調達', effect:'買い↗（評価額上昇）'});
  data.push({cat:'投資家', name:'ヘッジファンドのポジション構築', from:'ファンドウォレット', to:'取引所/DeFi', purpose:'運用戦略に基づく売買', effect:'売りor買い（戦略次第）'});
  data.push({cat:'投資家', name:'個人の大口投資家（クジラ）の移動', from:'クジラウォレット', to:'取引所', purpose:'利益確定売却', effect:'売り↘'});
  data.push({cat:'投資家', name:'クジラの蓄積（コイン買い増し）', from:'取引所', to:'クジラウォレット', purpose:'長期的価値上昇を見込む', effect:'買い↗'});
  data.push({cat:'投資家', name:'ファンドのリバランス', from:'複数ウォレット', to:'別アセット', purpose:'ポートフォリオ調整', effect:'中立〜売り↘'});

  // 5) 規制/法制度 (3種)
  data.push({cat:'規制/法制度', name:'政府による押収・没収', from:'犯罪者ウォレット', to:'政府ウォレット', purpose:'法執行・資産没収', effect:'売り↘（オークション懸念）'});
  data.push({cat:'規制/法制度', name:'規制当局への報告用移動', from:'取引所', to:'指定アドレス', purpose:'コンプライアンス証明', effect:'中立→'});
  data.push({cat:'規制/法制度', name:'税務申告のためのウォレット整理', from:'個人ウォレット', to:'取引所', purpose:'キャピタルゲイン計算', effect:'売り↘（確定申告期）'});

  // 6) セキュリティ/不正 (4種)
  data.push({cat:'セキュリティ', name:'ハッキングによる不正送金', from:'被害者ウォレット', to:'ハッカーウォレット', purpose:'盗難・詐取', effect:'売り↘（パニック売り）'});
  data.push({cat:'セキュリティ', name:'取引所ハッキング後の資産移動', from:'ハッカー', to:'ミキサー/別取引所', purpose:'資金洗浄（レンダリング）', effect:'売り↘'});
  data.push({cat:'セキュリティ', name:'セキュリティ強化のためのコールド移行', from:'ホットウォレット', to:'コールドウォレット', purpose:'リスク低減・保管強化', effect:'中立→（安心感で買い↗）'});
  data.push({cat:'セキュリティ', name:'バグ報奨金（バグバウンティ）支払い', from:'プロジェクト財布', to:'セキュリティ研究者', purpose:'脆弱性報告への報酬', effect:'中立→'});

  // 7) その他 (2種：補足で30に調整)
  data.push({cat:'その他', name:'慈善・寄付', from:'プロジェクト/個人', to:'慈善団体ウォレット', purpose:'社会貢献・PR', effect:'買い↗（イメージ向上）'});
  data.push({cat:'その他', name:'相続・遺産分割', from:'故人ウォレット', to:'相続人ウォレット', purpose:'資産承継', effect:'中立〜売り↘（売却ケース有）'});

  // ---- 描画関数 (ES5) ----
  function renderTable(category) {
    var tbody = document.getElementById('tableBody');
    var html = '';
    var count = 0;
    var filter = category || 'all';

    for (var i = 0; i < data.length; i++) {
      var item = data[i];
      if (filter !== 'all' && item.cat !== filter) continue;
      count++;
      var effectClass = '';
      if (item.effect.indexOf('↗') !== -1) effectClass = 'bg-buy';
      else if (item.effect.indexOf('↘') !== -1) effectClass = 'bg-sell';
      else effectClass = 'bg-neutral';

      html += '<tr>';
      html += '<td>' + count + '</td>';
      html += '<td><span class="badge ' + effectClass + '">' + item.cat + '</span></td>';
      html += '<td><strong>' + item.name + '</strong></td>';
      html += '<td>' + item.from + '</td>';
      html += '<td>' + item.to + '</td>';
      html += '<td>' + item.purpose + '</td>';
      html += '<td><span class="badge ' + effectClass + '">' + item.effect + '</span></td>';
      html += '</tr>';
    }

    if (count === 0) {
      html = '<tr><td colspan="7" style="text-align:center;padding:30px;">該当するパターンがありません</td></tr>';
    }
    tbody.innerHTML = html;
  }

  // ---- フィルタ適用関数（グローバル公開） ----
  window.applyFilter = function() {
    var sel = document.getElementById('catFilter');
    var val = sel.options[sel.selectedIndex].value;
    renderTable(val);
  };

  // ---- 初期表示 ----
  renderTable('all');
})();
</script>

</body>
</html>
