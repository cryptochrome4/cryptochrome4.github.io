<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マリリオ · 3ステージ構成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'メイリオ', sans-serif;
            touch-action: none;
            padding: 20px;
        }
        .container {
            background: #2d2d44;
            padding: 20px 30px 30px;
            border-radius: 28px;
            box-shadow: 0 12px 0 #0f0f1a;
            max-width: 900px;
            width: 100%;
            position: relative;
        }
        .canvas-wrap {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 6px solid #4a3f2b;
            border-radius: 16px;
            box-shadow: inset 0 0 0 3px #c9a87c, 0 10px 0 #2b241b;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            aspect-ratio: 800/400;
            cursor: default;
            touch-action: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: #f0e6b0;
            text-shadow: 2px 2px 0 #3d2f1f;
            font-weight: bold;
            font-size: 18px;
            background: #4a3f2b;
            padding: 10px 20px;
            border-radius: 60px;
            border-bottom: 5px solid #2b241b;
            flex-wrap: wrap;
            gap: 8px;
        }
        .info span { background: #2b241b; padding: 4px 18px; border-radius: 40px; color: #ffd78a; }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .mouse-btn {
            background: #5a4f3a;
            border: none;
            border-bottom: 5px solid #2b241b;
            color: #f0e6b0;
            font-weight: bold;
            font-size: 20px;
            padding: 4px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #1f1a12;
            min-width: 60px;
        }
        .mouse-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .mouse-btn.left-btn { background: #3d6b8a; }
        .mouse-btn.right-btn { background: #8a5a3d; }
        .mouse-btn.jump-btn { background: #6a8a3d; }
        button {
            background: #f5c542;
            border: none;
            border-bottom: 6px solid #b47d2a;
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 18px;
            color: #2d2d1c;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #4f3d1a;
        }
        button:active { transform: translateY(4px); border-bottom-width: 2px; }
        .footer {
            margin-top: 12px;
            text-align: center;
            color: #8d8da0;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .footer .mouse-hint {
            display: inline-block;
            background: #3d3d5a;
            padding: 4px 16px;
            border-radius: 40px;
            color: #d4d4e8;
        }
        .stream-badge {
            background: #555;
            color: #aaa;
            border-radius: 40px;
            padding: 4px 18px;
            font-weight: bold;
            cursor: not-allowed;
            transition: 0.3s;
        }
        .stream-badge.unlocked {
            background: #9147ff;
            color: white;
            cursor: pointer;
        }
        .stream-badge.unlocked:hover { opacity: 0.85; }
        .gameover-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #ff6b6b;
            font-size: 42px;
            font-weight: bold;
            padding: 20px 50px;
            border-radius: 30px;
            border: 6px solid #ff6b6b;
            text-shadow: 0 0 20px #ff0000;
            z-index: 10;
            display: none;
            text-align: center;
            pointer-events: none;
        }

        .stage-transition {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 25, 0.88);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 25;
            border-radius: 16px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 20px;
        }
        .stage-transition.active {
            display: flex;
        }
        .stage-transition .card {
            background: #f0f4f0;
            max-width: 450px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 40px 20px 40px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            border: 6px solid #f5c542;
            color: #1a2a1a;
            text-align: center;
        }
        .stage-transition .card h2 {
            font-size: 32px;
            border-bottom: 5px dotted #f5c542;
            padding-bottom: 18px;
            margin-bottom: 18px;
            color: #1f4a2f;
        }
        .stage-transition .card .big-icon {
            font-size: 60px;
            margin: 10px 0;
        }
        .stage-transition .card .next-btn {
            background: #3a6b4a;
            border: none;
            border-bottom: 6px solid #1f3f2a;
            color: white;
            font-weight: bold;
            font-size: 24px;
            padding: 14px 36px;
            border-radius: 60px;
            cursor: pointer;
            margin: 16px 0;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #1a2a1a;
        }
        .stage-transition .card .next-btn:active { transform: translateY(4px); border-bottom-width: 2px; }

        .clear-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 25, 0.92);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 16px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 20px;
        }
        .clear-overlay.active {
            display: flex;
        }
        .clear-card {
            background: #f0f4f0;
            max-width: 500px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 40px 20px 40px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            border: 6px solid #f5c542;
            color: #1a2a1a;
            text-align: center;
        }
        .clear-card h2 {
            font-size: 34px;
            border-bottom: 5px dotted #f5c542;
            padding-bottom: 20px;
            margin-bottom: 20px;
            color: #1f4a2f;
        }
        .clear-card .big-icon {
            font-size: 70px;
            margin: 10px 0;
        }
        .clear-card .redirect-btn {
            background: #3a6b4a;
            border: none;
            border-bottom: 6px solid #1f3f2a;
            color: white;
            font-weight: bold;
            font-size: 26px;
            padding: 16px 40px;
            border-radius: 60px;
            cursor: pointer;
            margin: 20px 0;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #1a2a1a;
        }
        .clear-card .redirect-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .clear-card .close-btn {
            background: #b13e3e;
            border: none;
            border-bottom: 6px solid #6e2626;
            color: white;
            font-weight: bold;
            font-size: 22px;
            padding: 8px 30px;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 14px;
            transition: 0.05s linear;
            box-shadow: 0 2px 0 #3d1a1a;
        }
        .clear-card .close-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .clear-card .footnote {
            margin-top: 18px;
            font-size: 14px;
            color: #4d5e4d;
            border-top: 2px dashed #b3c9b3;
            padding-top: 14px;
        }

        .twitch-chat {
            position: absolute;
            right: 8px;
            top: 10px;
            width: 160px;
            height: 340px;
            pointer-events: none;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #6441a5;
            box-shadow: 0 0 20px rgba(100, 65, 165, 0.5);
            display: none;
            z-index: 20;
            backdrop-filter: blur(2px);
            padding: 4px 0;
        }
        .twitch-chat.active {
            display: block;
        }
        .chat-line {
            color: #fff;
            font-size: 12px;
            padding: 2px 8px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            text-shadow: 0 0 6px #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.95;
            animation: chatScroll 7s linear forwards;
            position: relative;
            width: 100%;
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transform: translateY(0);
        }
        .chat-line .username {
            color: #bf94ff;
            font-weight: bold;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .chat-line .message {
            color: #f0f0f0;
            display: inline-block;
        }
        @keyframes chatScroll {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .stage-indicator {
            background: #2b241b;
            padding: 4px 18px;
            border-radius: 40px;
            color: #7ec8ff;
            font-size: 16px;
        }

        @media (max-width: 640px) { .twitch-chat { width: 120px; height: 250px; right: 4px; top: 6px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div id="gameoverMsg" class="gameover-msg">💀 GAME OVER</div>
            
            <div id="stageTransition" class="stage-transition">
                <div class="card">
                    <div class="big-icon" id="transitionIcon">🌊</div>
                    <h2 id="transitionTitle">ステージ2 水のステージ</h2>
                    <p id="transitionDesc" style="font-size:18px; margin-bottom:12px;">毒水に落ちたら即ゲームオーバー！<br>毒水しぶきにも注意！</p>
                    <button class="next-btn" id="stageTransitionBtn">▶ 挑戦する</button>
                </div>
            </div>

            <div id="clearOverlay" class="clear-overlay">
                <div class="clear-card">
                    <div class="big-icon">🏆</div>
                    <h2>🎉 全ステージクリア！</h2>
                    <p style="font-size:18px; margin-bottom:18px;">IT用語 × サッカーの解説はこちら</p>
                    <button class="redirect-btn" id="clearRedirectBtn">⚽ pass.html へ</button>
                    <br>
                    <button class="close-btn" id="clearCloseBtn">✕ もう一度プレイ</button>
                    <div class="footnote">同じタブで移動します</div>
                </div>
            </div>
            <div id="twitchChat" class="twitch-chat"></div>
        </div>
        <div class="info">
            <span class="stage-indicator" id="stageDisplay">🌿 ステージ1</span>
            <span id="scoreDisplay">🟡 0</span>
            <div class="controls">
                <button class="mouse-btn left-btn" id="leftBtn">◀</button>
                <button class="mouse-btn jump-btn" id="jumpBtn">▲ ジャンプ</button>
                <button class="mouse-btn right-btn" id="rightBtn">▶</button>
            </div>
            <button id="resetBtn">↺ リスタート</button>
        </div>
        <div class="footer">
            <span class="mouse-hint">🖱 左右ボタンで移動 / ジャンプ</span>
            <span class="stream-badge" id="streamToggleBtn">🔒 配信モード (スコア1000)</span>
            <span id="stageHint">🏁 旗で次のステージへ</span>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM ----------
            var canvas = document.getElementById('gameCanvas');
            var ctx = canvas.getContext('2d');
            var scoreSpan = document.getElementById('scoreDisplay');
            var stageDisplay = document.getElementById('stageDisplay');
            var stageHint = document.getElementById('stageHint');
            var resetBtn = document.getElementById('resetBtn');
            var clearOverlay = document.getElementById('clearOverlay');
            var clearRedirectBtn = document.getElementById('clearRedirectBtn');
            var clearCloseBtn = document.getElementById('clearCloseBtn');
            var stageTransition = document.getElementById('stageTransition');
            var stageTransitionBtn = document.getElementById('stageTransitionBtn');
            var transitionIcon = document.getElementById('transitionIcon');
            var transitionTitle = document.getElementById('transitionTitle');
            var transitionDesc = document.getElementById('transitionDesc');
            var gameoverMsg = document.getElementById('gameoverMsg');
            var leftBtn = document.getElementById('leftBtn');
            var rightBtn = document.getElementById('rightBtn');
            var jumpBtn = document.getElementById('jumpBtn');
            var streamToggleBtn = document.getElementById('streamToggleBtn');
            var twitchChat = document.getElementById('twitchChat');

            // ---------- 状態 ----------
            var isStreaming = false;
            var chatInterval = null;
            var isClearOverlayActive = false;
            var streamUnlocked = false;
            var currentStage = 'land'; // 'land' | 'water' | 'desert'
            var waitingForStageTransition = false;

            var landComments = [
                "本物のマリオの世界だ！凄い！", "クリボーがいる！気をつけて！", "やっぱりマリオは神", "配信者かわいい", "ジャンプうますぎ", "コイン取った！", "あのクリボーやばい", "BGMほしい", "スター欲しい", "マリオ頑張れ！",
                "1UP取って！", "裏道ある？", "無限増殖バグ？", "あっちに隠しブロック", "クリボー踏めるよ", "キノコどこ？", "ファイアマリオになろう", "パワーアップ！", "ここで死んだら笑う", "もっと右！",
                "旗まであと少し", "タイム気にしなくていいの？", "スーパーマリオ感", "壁キックできる？", "あのクリボー二回踏んだ", "コイン100枚で1UP", "配信楽しい", "ワールド1-1", "おつかれさま", "また明日も見る"
            ];
            var waterComments = [
                "🌊 水のステージだ！", "毒水怖い！", "しぶきに気をつけて！", "浮島ジャンプ難しい", "落ちないで！", "マリオ泳げないの？", "毒水やばい", "クリボーも水に弱い？", "ここが難所", "がんばれ！",
                "あと少し！", "毒水しぶききた！", "ジャンプのタイミングが命", "右の足場に飛べ！", "コイン取れた！", "このステージ好き", "BGMほしい", "水の音がいい", "クリアできるかな", "もう少しで旗だ！"
            ];
            var desertComments = [
                "🏜️ 砂漠ステージ！", "クリボーが弓で撃ってくる！", "矢に気をつけて！", "砂漠暑そう", "サボテンある？", "弓クリボーやばい", "ジャンプで避けて！", "矢が飛んできた！", "砂嵐きた", "ここが難所",
                "あと少し！", "弓矢こわい", "クリボー強い", "動きながら避けて", "コイン取れた！", "このステージ好き", "砂漠のBGMほしい", "ラクダいる？", "クリアできるかな", "もう少しで旗だ！",
                "旗まであと少し！", "弓クリボー撃破した！", "緊張する", "応援してる", "ファイト！", "絶対クリアして", "すごい！", "プロの技", "感動した", "おめでとう！"
            ];
            var currentCommentPool = landComments;

            // ゲーム変数
            var game = {
                mario: { x: 50, y: 290, w: 28, h: 38, vy: 0, vx: 0, onGround: false, facing: 1 },
                platforms: [],
                coins: [],
                enemies: [],
                poisonSplashes: [],
                arrows: [],  // 砂漠ステージの弓矢
                flag: { x: 740, y: 130, w: 24, h: 60, baseY: 330 },
                gravity: 0.45,
                friction: 0.82,
                jumpPower: -8.5,
                moveSpeed: 3.8,
                score: 0,
                gameClear: false,
                gameOver: false,
                leftPressed: false,
                rightPressed: false,
                jumpPressed: false,
                splashTimer: 0,
                splashInterval: 90,
                arrowTimer: 0,
                arrowInterval: 60
            };

            // ---------- ステージ構築 ----------
            function buildLandStage() {
                currentStage = 'land';
                currentCommentPool = landComments;
                stageDisplay.textContent = '🌿 ステージ1';
                stageHint.textContent = '🏁 旗で次のステージへ';
                document.querySelector('.container').style.background = '#2d2d44';

                game.platforms = [ { x: 0, y: 330, w: 800, h: 70 } ];
                game.platforms.push(
                    { x: 160, y: 260, w: 80, h: 20 },
                    { x: 300, y: 200, w: 80, h: 20 },
                    { x: 480, y: 240, w: 80, h: 20 },
                    { x: 620, y: 180, w: 80, h: 20 }
                );
                game.coins = [
                    { x: 180, y: 230, w: 16, h: 16, collected: false },
                    { x: 230, y: 230, w: 16, h: 16, collected: false },
                    { x: 320, y: 170, w: 16, h: 16, collected: false },
                    { x: 360, y: 170, w: 16, h: 16, collected: false },
                    { x: 500, y: 210, w: 16, h: 16, collected: false },
                    { x: 540, y: 210, w: 16, h: 16, collected: false },
                    { x: 640, y: 150, w: 16, h: 16, collected: false },
                    { x: 680, y: 150, w: 16, h: 16, collected: false }
                ];
                game.enemies = [
                    { x: 200, y: 310, w: 30, h: 30, vx: -0.8, alive: true, type: 'walker' },
                    { x: 520, y: 310, w: 30, h: 30, vx: 0.8, alive: true, type: 'walker' }
                ];
                game.poisonSplashes = [];
                game.arrows = [];
                game.splashTimer = 0;
                game.arrowTimer = 0;
                game.flag.x = 740;
                game.flag.y = 130;
                game.flag.baseY = 330;
                
                var m = game.mario;
                m.x = 50; m.y = 290; m.vy = 0; m.vx = 0; m.onGround = false; m.facing = 1;
                game.gameClear = false;
                game.gameOver = false;
                gameoverMsg.style.display = 'none';
                clearOverlay.classList.remove('active');
                isClearOverlayActive = false;
                waitingForStageTransition = false;
                stageTransition.classList.remove('active');
                updateUI();
            }

            function buildWaterStage() {
                currentStage = 'water';
                currentCommentPool = waterComments;
                stageDisplay.textContent = '🌊 ステージ2';
                stageHint.textContent = '⚠️ 毒水に注意！';
                document.querySelector('.container').style.background = '#1a3a5a';

                game.platforms = [
                    { x: 0, y: 380, w: 800, h: 20 },
                    { x: 100, y: 310, w: 70, h: 16 },
                    { x: 220, y: 260, w: 70, h: 16 },
                    { x: 340, y: 210, w: 70, h: 16 },
                    { x: 460, y: 250, w: 70, h: 16 },
                    { x: 580, y: 200, w: 70, h: 16 },
                    { x: 680, y: 290, w: 80, h: 16 }
                ];
                game.coins = [
                    { x: 115, y: 280, w: 16, h: 16, collected: false },
                    { x: 235, y: 230, w: 16, h: 16, collected: false },
                    { x: 355, y: 180, w: 16, h: 16, collected: false },
                    { x: 475, y: 220, w: 16, h: 16, collected: false },
                    { x: 595, y: 170, w: 16, h: 16, collected: false },
                    { x: 695, y: 260, w: 16, h: 16, collected: false },
                    { x: 730, y: 260, w: 16, h: 16, collected: false }
                ];
                game.enemies = [
                    { x: 150, y: 285, w: 30, h: 30, vx: -0.6, alive: true, type: 'walker' },
                    { x: 400, y: 185, w: 30, h: 30, vx: 0.6, alive: true, type: 'walker' },
                    { x: 600, y: 175, w: 30, h: 30, vx: -0.5, alive: true, type: 'walker' }
                ];
                game.poisonSplashes = [];
                game.arrows = [];
                game.splashTimer = 0;
                game.arrowTimer = 0;
                game.splashInterval = 90;
                game.flag.x = 740;
                game.flag.y = 130;
                game.flag.baseY = 330;

                var m = game.mario;
                m.x = 50; m.y = 280; m.vy = 0; m.vx = 0; m.onGround = false; m.facing = 1;
                game.gameClear = false;
                game.gameOver = false;
                gameoverMsg.style.display = 'none';
                clearOverlay.classList.remove('active');
                isClearOverlayActive = false;
                stageTransition.classList.remove('active');
                waitingForStageTransition = false;
                updateUI();
            }

            function buildDesertStage() {
                currentStage = 'desert';
                currentCommentPool = desertComments;
                stageDisplay.textContent = '🏜️ ステージ3';
                stageHint.textContent = '🏹 弓クリボーに注意！';
                document.querySelector('.container').style.background = '#3a2a1a';

                // 砂漠の足場（砂の大地）
                game.platforms = [ { x: 0, y: 350, w: 800, h: 50 } ];
                game.platforms.push(
                    { x: 130, y: 280, w: 70, h: 16 },
                    { x: 260, y: 230, w: 70, h: 16 },
                    { x: 400, y: 280, w: 70, h: 16 },
                    { x: 520, y: 220, w: 70, h: 16 },
                    { x: 630, y: 290, w: 80, h: 16 }
                );
                game.coins = [
                    { x: 145, y: 250, w: 16, h: 16, collected: false },
                    { x: 275, y: 200, w: 16, h: 16, collected: false },
                    { x: 415, y: 250, w: 16, h: 16, collected: false },
                    { x: 535, y: 190, w: 16, h: 16, collected: false },
                    { x: 650, y: 260, w: 16, h: 16, collected: false },
                    { x: 700, y: 260, w: 16, h: 16, collected: false }
                ];
                // 弓クリボー (archer タイプ) と 通常クリボー
                game.enemies = [
                    { x: 180, y: 320, w: 30, h: 30, vx: -0.6, alive: true, type: 'walker' },
                    { x: 450, y: 320, w: 30, h: 30, vx: 0.5, alive: true, type: 'walker' },
                    { x: 620, y: 160, w: 30, h: 30, vx: 0, alive: true, type: 'archer', shootTimer: 30 },
                    { x: 340, y: 200, w: 30, h: 30, vx: 0, alive: true, type: 'archer', shootTimer: 60 }
                ];
                game.poisonSplashes = [];
                game.arrows = [];
                game.splashTimer = 0;
                game.arrowTimer = 0;
                game.flag.x = 740;
                game.flag.y = 130;
                game.flag.baseY = 350;

                var m = game.mario;
                m.x = 50; m.y = 310; m.vy = 0; m.vx = 0; m.onGround = false; m.facing = 1;
                game.gameClear = false;
                game.gameOver = false;
                gameoverMsg.style.display = 'none';
                clearOverlay.classList.remove('active');
                isClearOverlayActive = false;
                stageTransition.classList.remove('active');
                waitingForStageTransition = false;
                updateUI();
            }

            // ---------- ステージ遷移 ----------
            function showStageTransition(nextStage) {
                waitingForStageTransition = true;
                if (nextStage === 'water') {
                    transitionIcon.textContent = '🌊';
                    transitionTitle.textContent = 'ステージ2 水のステージ';
                    transitionDesc.innerHTML = '毒水に落ちたら即ゲームオーバー！<br>毒水しぶきにも注意！';
                } else if (nextStage === 'desert') {
                    transitionIcon.textContent = '🏜️';
                    transitionTitle.textContent = 'ステージ3 砂漠のステージ';
                    transitionDesc.innerHTML = '弓クリボーが矢を放ってくる！<br>ジャンプで避けろ！';
                }
                stageTransition.classList.add('active');
                stageTransition.dataset.nextStage = nextStage;
            }

            stageTransitionBtn.addEventListener('click', function() {
                var nextStage = stageTransition.dataset.nextStage;
                if (nextStage === 'water') {
                    buildWaterStage();
                    if (isStreaming && streamUnlocked) {
                        twitchChat.innerHTML = '';
                        addChatLine('🌊 水のステージ開始！');
                    }
                } else if (nextStage === 'desert') {
                    buildDesertStage();
                    if (isStreaming && streamUnlocked) {
                        twitchChat.innerHTML = '';
                        addChatLine('🏜️ 砂漠のステージ開始！ 弓クリボーに注意！');
                    }
                }
            });

            // ---------- UI更新 ----------
            function updateUI() {
                scoreSpan.textContent = '🟡 ' + game.score;
                if (game.score >= 1000 && !streamUnlocked) {
                    streamUnlocked = true;
                    streamToggleBtn.className = 'stream-badge unlocked';
                    streamToggleBtn.textContent = '📡 配信モード OFF';
                    if (!isStreaming) {
                        streamToggleBtn.textContent = '📡 配信モード OFF';
                    }
                }
            }

            // ---------- 毒水しぶき生成 ----------
            function spawnPoisonSplash() {
                if (currentStage !== 'water') return;
                var x = Math.random() * 780 + 10;
                game.poisonSplashes.push({
                    x: x,
                    y: 370,
                    vy: -2.5 - Math.random() * 2,
                    active: true,
                    width: 12,
                    height: 16
                });
            }

            // ---------- 弓矢生成 ----------
            function spawnArrow(fromEnemy) {
                if (currentStage !== 'desert') return;
                var m = game.mario;
                // マリオの方向へ矢を放つ
                var dx = (m.x + m.w/2) - (fromEnemy.x + fromEnemy.w/2);
                var dy = (m.y + m.h/2) - (fromEnemy.y + fromEnemy.h/2);
                var dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 1) dist = 1;
                var speed = 3.2;
                game.arrows.push({
                    x: fromEnemy.x + fromEnemy.w/2,
                    y: fromEnemy.y + fromEnemy.h/2,
                    vx: (dx / dist) * speed,
                    vy: (dy / dist) * speed,
                    w: 18,
                    h: 4,
                    life: 200
                });
            }

            // ---------- 物理更新 ----------
            function updatePhysics() {
                if (game.gameClear || game.gameOver) return;
                var m = game.mario;
                
                if (game.leftPressed) { m.vx = -game.moveSpeed; }
                else if (game.rightPressed) { m.vx = game.moveSpeed; }
                else { m.vx *= game.friction; if (Math.abs(m.vx) < 0.1) m.vx = 0; }
                
                if (game.jumpPressed && m.onGround) {
                    m.vy = game.jumpPower;
                    m.onGround = false;
                    game.jumpPressed = false;
                }
                
                m.vy += game.gravity;
                if (m.vy > 12) m.vy = 12;
                
                var newX = m.x + m.vx;
                for (var i = 0; i < game.platforms.length; i++) {
                    var p = game.platforms[i];
                    if (newX < p.x + p.w && newX + m.w > p.x && m.y < p.y + p.h && m.y + m.h > p.y) {
                        if (m.vx > 0) { newX = p.x - m.w; } else if (m.vx < 0) { newX = p.x + p.w; }
                        m.vx = 0;
                        break;
                    }
                }
                m.x = newX;
                
                var newY = m.y + m.vy;
                m.onGround = false;
                for (var j = 0; j < game.platforms.length; j++) {
                    var p2 = game.platforms[j];
                    if (m.x < p2.x + p2.w && m.x + m.w > p2.x && newY < p2.y + p2.h && newY + m.h > p2.y) {
                        if (m.vy > 0) { 
                            newY = p2.y - m.h; 
                            m.vy = 0; 
                            m.onGround = true; 
                        } else if (m.vy < 0) { 
                            newY = p2.y + p2.h; 
                            m.vy = 0; 
                        }
                        break;
                    }
                }
                m.y = newY;
                
                if (m.x < 0) m.x = 0;
                if (m.x + m.w > 800) m.x = 800 - m.w;
                
                // 毒水落下判定（水ステージのみ）
                if (currentStage === 'water' && m.y + m.h > 380) {
                    setGameOver();
                    if (isStreaming) addChatLine("💀 毒水に落ちた！");
                    return;
                }
                // 地上/砂漠ステージの落下判定
                if ((currentStage === 'land' || currentStage === 'desert') && m.y > 400) {
                    setGameOver();
                    if (isStreaming) addChatLine("💀 落下した！");
                    return;
                }
                
                // コイン取得
                for (var k = 0; k < game.coins.length; k++) {
                    var coin = game.coins[k];
                    if (coin.collected) continue;
                    if (m.x + m.w > coin.x && m.x < coin.x + coin.w && m.y + m.h > coin.y && m.y < coin.y + coin.h) {
                        coin.collected = true;
                        game.score += 100;
                        updateUI();
                        if (isStreaming) addChatLine("🪙 コインGET！ +100");
                    }
                }
                
                // エネミー
                for (var e = 0; e < game.enemies.length; e++) {
                    var enemy = game.enemies[e];
                    if (!enemy.alive) continue;
                    
                    // 弓クリボーは移動しない（その場で撃つ）
                    if (enemy.type === 'archer') {
                        enemy.shootTimer--;
                        if (enemy.shootTimer <= 0) {
                            spawnArrow(enemy);
                            enemy.shootTimer = 90 + Math.floor(Math.random() * 60);
                            if (isStreaming) addChatLine("🏹 クリボーが矢を放った！");
                        }
                    } else {
                        // 通常の歩行クリボー
                        enemy.x += enemy.vx;
                        if (enemy.x < 0) { enemy.x = 0; enemy.vx = Math.abs(enemy.vx); }
                        if (enemy.x + enemy.w > 800) { enemy.x = 800 - enemy.w; enemy.vx = -Math.abs(enemy.vx); }
                    }
                    
                    // 足場の端で反転（歩行タイプのみ）
                    if (enemy.type === 'walker') {
                        for (var pi = 0; pi < game.platforms.length; pi++) {
                            var pl = game.platforms[pi];
                            if (enemy.x + enemy.w > pl.x && enemy.x < pl.x + pl.w &&
                                enemy.y < pl.y + pl.h && enemy.y + enemy.h > pl.y) {
                                if (enemy.vx > 0 && enemy.x + enemy.w >= pl.x && enemy.x < pl.x) {
                                    enemy.vx = -Math.abs(enemy.vx);
                                } else if (enemy.vx < 0 && enemy.x <= pl.x + pl.w && enemy.x + enemy.w > pl.x + pl.w) {
                                    enemy.vx = Math.abs(enemy.vx);
                                }
                            }
                        }
                    }
                    
                    // マリオとの接触
                    if (m.x + m.w > enemy.x + 4 && m.x < enemy.x + enemy.w - 4 &&
                        m.y + m.h > enemy.y + 4 && m.y < enemy.y + enemy.h - 4) {
                        if (m.vy > 0 && m.y + m.h - enemy.y < 20) {
                            enemy.alive = false;
                            game.score += 200;
                            updateUI();
                            m.vy = -5;
                            if (isStreaming) addChatLine("💥 クリボーを踏んだ！ +200");
                        } else {
                            setGameOver();
                            if (isStreaming) addChatLine("💀 やられた…");
                            return;
                        }
                    }
                }
                
                // 毒水しぶき（水ステージのみ）
                if (currentStage === 'water') {
                    game.splashTimer++;
                    if (game.splashTimer >= game.splashInterval) {
                        game.splashTimer = 0;
                        spawnPoisonSplash();
                    }
                    
                    for (var s = game.poisonSplashes.length - 1; s >= 0; s--) {
                        var splash = game.poisonSplashes[s];
                        splash.y += splash.vy;
                        splash.vy += 0.08;
                        if (splash.y < 0 || splash.y > 400) {
                            game.poisonSplashes.splice(s, 1);
                            continue;
                        }
                        if (m.x + m.w > splash.x && m.x < splash.x + splash.width &&
                            m.y + m.h > splash.y && m.y < splash.y + splash.height) {
                            setGameOver();
                            if (isStreaming) addChatLine("☠️ 毒水しぶきに当たった！");
                            return;
                        }
                    }
                }
                
                // 弓矢の更新（砂漠ステージのみ）
                if (currentStage === 'desert') {
                    for (var a = game.arrows.length - 1; a >= 0; a--) {
                        var arrow = game.arrows[a];
                        arrow.x += arrow.vx;
                        arrow.y += arrow.vy;
                        arrow.vy += 0.05; // 重力で少し落ちる
                        arrow.life--;
                        
                        // 画面外 or 寿命
                        if (arrow.x < -30 || arrow.x > 830 || arrow.y < -30 || arrow.y > 430 || arrow.life <= 0) {
                            game.arrows.splice(a, 1);
                            continue;
                        }
                        
                        // マリオとの当たり判定
                        if (m.x + m.w > arrow.x && m.x < arrow.x + arrow.w &&
                            m.y + m.h > arrow.y && m.y < arrow.y + arrow.h) {
                            setGameOver();
                            if (isStreaming) addChatLine("🏹 矢に当たった！");
                            return;
                        }
                    }
                }
                
                // フラグ
                var f = game.flag;
                if (m.x + m.w > f.x + 4 && m.x < f.x + f.w - 4 && m.y + m.h > f.y + 8 && m.y < f.y + f.h - 8) {
                    game.gameClear = true;
                    if (currentStage === 'land') {
                        if (isStreaming) addChatLine("🏁 ステージ1クリア！ 水ステージへ");
                        showStageTransition('water');
                    } else if (currentStage === 'water') {
                        if (isStreaming) addChatLine("🏁 ステージ2クリア！ 砂漠ステージへ");
                        showStageTransition('desert');
                    } else if (currentStage === 'desert') {
                        if (isStreaming) addChatLine("🏆 全ステージクリア！");
                        showClearOverlay();
                    }
                }
                if (m.vx > 0.2) m.facing = 1;
                else if (m.vx < -0.2) m.facing = -1;
            }

            function setGameOver() {
                game.gameOver = true;
                gameoverMsg.style.display = 'block';
                if (isStreaming) addChatLine("💀 GAME OVER");
            }

            // ---------- 描画 ----------
            function draw() {
                if (isClearOverlayActive || waitingForStageTransition) {
                    ctx.clearRect(0, 0, 800, 400);
                    return;
                }
                ctx.clearRect(0, 0, 800, 400);
                
                if (currentStage === 'land') {
                    var grad = ctx.createLinearGradient(0, 0, 0, 400);
                    grad.addColorStop(0, '#6fc3ff');
                    grad.addColorStop(0.7, '#b3e0ff');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 800, 400);
                    ctx.fillStyle = 'rgba(255,255,240,0.7)';
                    drawCloud(90, 40, 1); drawCloud(550, 60, 0.9); drawCloud(340, 20, 0.7);
                } else if (currentStage === 'water') {
                    var grad2 = ctx.createLinearGradient(0, 0, 0, 400);
                    grad2.addColorStop(0, '#0a2a4a');
                    grad2.addColorStop(0.6, '#1a4a6a');
                    grad2.addColorStop(1, '#2a5a7a');
                    ctx.fillStyle = grad2;
                    ctx.fillRect(0, 0, 800, 400);
                    for (var b = 0; b < 20; b++) {
                        var bx = (b * 43 + 17) % 800;
                        var by = (b * 31 + 53) % 400;
                        ctx.fillStyle = 'rgba(100, 200, 255, 0.15)';
                        ctx.beginPath();
                        ctx.arc(bx, by, 3 + b % 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (currentStage === 'desert') {
                    // 砂漠の背景
                    var grad3 = ctx.createLinearGradient(0, 0, 0, 400);
                    grad3.addColorStop(0, '#f5c56b');
                    grad3.addColorStop(0.5, '#e8a94a');
                    grad3.addColorStop(1, '#d4943a');
                    ctx.fillStyle = grad3;
                    ctx.fillRect(0, 0, 800, 400);
                    
                    // 太陽
                    ctx.fillStyle = 'rgba(255, 240, 150, 0.9)';
                    ctx.shadowColor = '#fff7a0';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(700, 60, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // 遠くの砂丘
                    ctx.fillStyle = 'rgba(200, 150, 80, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(0, 280);
                    ctx.quadraticCurveTo(150, 240, 300, 280);
                    ctx.quadraticCurveTo(450, 240, 600, 280);
                    ctx.quadraticCurveTo(720, 250, 800, 280);
                    ctx.lineTo(800, 400);
                    ctx.lineTo(0, 400);
                    ctx.fill();
                    
                    // 砂嵐の粒子
                    for (var d = 0; d < 30; d++) {
                        var dx = (d * 29 + Date.now() * 0.05) % 800;
                        var dy = (d * 47 + 100) % 300;
                        ctx.fillStyle = 'rgba(255, 220, 150, 0.4)';
                        ctx.fillRect(dx, dy, 3, 1);
                    }
                }
                
                // プラットフォーム
                for (var i = 0; i < game.platforms.length; i++) {
                    var p = game.platforms[i];
                    if (currentStage === 'water' && p.y === 380 && p.w === 800) {
                        ctx.fillStyle = '#1a5a3a';
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        ctx.fillStyle = 'rgba(0, 255, 100, 0.2)';
                        for (var w = 0; w < 800; w += 12) {
                            var wave = Math.sin(w * 0.1 + Date.now() * 0.002) * 3;
                            ctx.fillRect(w, p.y + wave, 6, 4);
                        }
                        ctx.fillStyle = 'rgba(255, 50, 50, 0.3)';
                        ctx.fillRect(0, p.y - 2, 800, 6);
                    } else if (p.y === 330 && p.w === 800 && currentStage === 'land') {
                        ctx.fillStyle = '#7d9e5d';
                        ctx.fillRect(p.x, p.y, p.w, 16);
                        ctx.fillStyle = '#8b6b4d';
                        ctx.fillRect(p.x, p.y + 16, p.w, p.h - 16);
                        ctx.fillStyle = '#5f7d42';
                        for (var gx = 0; gx < 800; gx += 24) { ctx.fillRect(gx, p.y - 4, 6, 8); }
                    } else if (p.y === 350 && p.w === 800 && currentStage === 'desert') {
                        // 砂の大地
                        ctx.fillStyle = '#d4a55a';
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        ctx.fillStyle = '#c4944a';
                        for (var sx = 0; sx < 800; sx += 16) {
                            ctx.fillRect(sx, p.y + 4, 8, 3);
                            ctx.fillRect(sx + 8, p.y + 12, 6, 3);
                        }
                        ctx.fillStyle = '#b8843a';
                        ctx.fillRect(p.x, p.y, p.w, 4);
                    } else {
                        // 浮島（砂漠では砂岩っぽく）
                        if (currentStage === 'desert') {
                            ctx.fillStyle = '#c4944a';
                            ctx.fillRect(p.x, p.y, p.w, p.h);
                            ctx.fillStyle = '#a87a3a';
                            ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, 4);
                            ctx.fillRect(p.x + 4, p.y + p.h - 6, p.w - 8, 4);
                            ctx.fillStyle = '#8a6030';
                            ctx.fillRect(p.x + 2, p.y + 2, 6, 6);
                            ctx.fillRect(p.x + p.w - 8, p.y + 2, 6, 6);
                        } else {
                            ctx.fillStyle = '#c49a6c';
                            ctx.fillRect(p.x, p.y, p.w, p.h);
                            ctx.fillStyle = '#a87d54';
                            ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, 4);
                            ctx.fillRect(p.x + 4, p.y + p.h - 6, p.w - 8, 4);
                            ctx.fillStyle = '#8b6b4d';
                            ctx.fillRect(p.x + 2, p.y + 2, 6, 6);
                            ctx.fillRect(p.x + p.w - 8, p.y + 2, 6, 6);
                            if (currentStage === 'water') {
                                ctx.fillStyle = 'rgba(50, 120, 50, 0.3)';
                                ctx.fillRect(p.x, p.y - 2, p.w, 4);
                            }
                        }
                    }
                }
                
                // コイン
                for (var c = 0; c < game.coins.length; c++) {
                    var coin = game.coins[c];
                    if (coin.collected) continue;
                    ctx.fillStyle = '#f5c542';
                    ctx.shadowColor = '#f5c542';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(coin.x + 8, coin.y + 8, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f0d050';
                    ctx.shadowBlur = 4;
                    ctx.beginPath();
                    ctx.arc(coin.x + 8, coin.y + 8, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                
                // エネミー
                for (var e = 0; e < game.enemies.length; e++) {
                    var enemy = game.enemies[e];
                    if (!enemy.alive) continue;
                    
                    // 体
                    ctx.fillStyle = '#8b5a3a';
                    ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                    ctx.fillStyle = '#6a3f2a';
                    ctx.fillRect(enemy.x + 4, enemy.y + 4, enemy.w - 8, 6);
                    ctx.fillRect(enemy.x + 4, enemy.y + enemy.h - 10, enemy.w - 8, 6);
                    
                    // 目
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(enemy.x + 5, enemy.y + 8, 8, 8);
                    ctx.fillRect(enemy.x + 17, enemy.y + 8, 8, 8);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(enemy.x + 8, enemy.y + 11, 4, 4);
                    ctx.fillRect(enemy.x + 20, enemy.y + 11, 4, 4);
                    
                    // 弓クリボーは弓を持つ
                    if (enemy.type === 'archer') {
                        // 弓
                        ctx.strokeStyle = '#6a3f1a';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(enemy.x + 30, enemy.y + 15, 12, -Math.PI/2, Math.PI/2);
                        ctx.stroke();
                        // 弦
                        ctx.strokeStyle = '#eee';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + 30, enemy.y + 3);
                        ctx.lineTo(enemy.x + 30, enemy.y + 27);
                        ctx.stroke();
                        // ラベル
                        ctx.fillStyle = '#8a2020';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText('🏹', enemy.x + 8, enemy.y + 28);
                    } else {
                        ctx.fillStyle = '#1a3d7a';
                        ctx.font = 'bold 14px sans-serif';
                        ctx.fillText('D', enemy.x + 10, enemy.y + 26);
                    }
                }
                
                // 毒水しぶき（水ステージのみ）
                if (currentStage === 'water') {
                    for (var s = 0; s < game.poisonSplashes.length; s++) {
                        var splash = game.poisonSplashes[s];
                        ctx.fillStyle = 'rgba(0, 255, 100, 0.7)';
                        ctx.shadowColor = '#00ff66';
                        ctx.shadowBlur = 15;
                        ctx.fillRect(splash.x, splash.y, splash.width, splash.height);
                        ctx.fillStyle = 'rgba(0, 200, 80, 0.5)';
                        ctx.fillRect(splash.x - 2, splash.y + 4, 4, 4);
                        ctx.fillRect(splash.x + 10, splash.y + 2, 4, 4);
                        ctx.shadowBlur = 0;
                    }
                }
                
                // 弓矢（砂漠ステージのみ）
                if (currentStage === 'desert') {
                    for (var a = 0; a < game.arrows.length; a++) {
                        var arrow = game.arrows[a];
                        ctx.save();
                        ctx.translate(arrow.x + arrow.w/2, arrow.y + arrow.h/2);
                        var angle = Math.atan2(arrow.vy, arrow.vx);
                        ctx.rotate(angle);
                        // 矢軸
                        ctx.fillStyle = '#6a4a1a';
                        ctx.fillRect(-9, -1, 14, 2);
                        // 矢じり
                        ctx.fillStyle = '#aaa';
                        ctx.beginPath();
                        ctx.moveTo(5, -3);
                        ctx.lineTo(9, 0);
                        ctx.lineTo(5, 3);
                        ctx.fill();
                        // 羽
                        ctx.fillStyle = '#d44';
                        ctx.beginPath();
                        ctx.moveTo(-9, -1);
                        ctx.lineTo(-13, -4);
                        ctx.lineTo(-9, 1);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(-9, 1);
                        ctx.lineTo(-13, 4);
                        ctx.lineTo(-9, -1);
                        ctx.fill();
                        ctx.restore();
                    }
                }
                
                // フラグ
                var f = game.flag;
                ctx.fillStyle = '#6a6a6a';
                ctx.fillRect(f.x + 10, f.y, 6, f.baseY - f.y);
                ctx.fillStyle = '#c92a2a';
                ctx.beginPath();
                ctx.moveTo(f.x + 16, f.y + 6);
                ctx.lineTo(f.x + 46, f.y + 20);
                ctx.lineTo(f.x + 16, f.y + 36);
                ctx.fill();
                ctx.fillStyle = '#f5e56b';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('🏁', f.x - 2, f.y + 52);
                
                // マリオ
                var m = game.mario;
                ctx.save();
                ctx.translate(m.x + m.w/2, m.y + m.h/2);
                if (m.facing < 0) ctx.scale(-1, 1);
                ctx.translate(-m.w/2, -m.h/2);
                if (isStreaming && streamUnlocked) {
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(20, -2);
                    ctx.lineTo(38, -20);
                    ctx.stroke();
                    ctx.fillStyle = '#222';
                    ctx.fillRect(34, -26, 16, 24);
                    ctx.fillStyle = '#3a6b9a';
                    ctx.fillRect(36, -24, 12, 16);
                    ctx.fillStyle = '#fff';
                    ctx.font = '8px sans-serif';
                    ctx.fillText('📱', 38, -14);
                    ctx.fillStyle = '#e33b3b';
                    ctx.fillRect(2, -6, 24, 12);
                    ctx.fillRect(6, -10, 16, 6);
                } else {
                    ctx.fillStyle = '#e33b3b';
                    ctx.fillRect(2, -2, 24, 12);
                    ctx.fillRect(6, -6, 16, 6);
                }
                ctx.fillStyle = '#f7d9b0';
                ctx.fillRect(4, 10, 20, 14);
                ctx.fillStyle = '#222';
                ctx.fillRect(16, 12, 6, 6);
                ctx.fillRect(6, 12, 6, 6);
                ctx.fillRect(10, 20, 10, 4);
                ctx.fillStyle = '#e33b3b';
                ctx.fillRect(2, 24, 24, 12);
                ctx.fillStyle = '#f5c542';
                ctx.fillRect(8, 28, 4, 4);
                ctx.fillRect(18, 28, 4, 4);
                ctx.fillStyle = '#2d2d8a';
                ctx.fillRect(0, 34, 10, 6);
                ctx.fillRect(18, 34, 10, 6);
                ctx.restore();
                
                ctx.fillStyle = '#1f2e1f';
                ctx.font = 'bold 20px monospace';
                ctx.fillText('SCORE: ' + game.score, 620, 36);
                
                if (isStreaming && streamUnlocked) {
                    ctx.fillStyle = 'rgba(100,65,165,0.7)';
                    ctx.fillRect(8, 8, 100, 24);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('🔴 LIVE', 16, 26);
                }
                
                if (currentStage === 'water') {
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('⚠️ 毒水注意！', 10, 60);
                } else if (currentStage === 'desert') {
                    ctx.fillStyle = 'rgba(180, 60, 20, 0.7)';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('🏹 弓クリボー注意！', 10, 60);
                }
            }

            function drawCloud(x, y, s) {
                ctx.beginPath();
                ctx.arc(x, y, 24*s, 0, Math.PI*2);
                ctx.arc(x+30*s, y-12*s, 30*s, 0, Math.PI*2);
                ctx.arc(x+60*s, y, 26*s, 0, Math.PI*2);
                ctx.arc(x+28*s, y+8*s, 22*s, 0, Math.PI*2);
                ctx.fill();
            }

            // ---------- ゲーム制御 ----------
            function resetGame() {
                clearOverlay.classList.remove('active');
                isClearOverlayActive = false;
                stageTransition.classList.remove('active');
                waitingForStageTransition = false;
                buildLandStage();
                game.gameClear = false;
                game.gameOver = false;
                gameoverMsg.style.display = 'none';
                game.leftPressed = false;
                game.rightPressed = false;
                game.jumpPressed = false;
                updateUI();
                if (isStreaming && streamUnlocked) {
                    twitchChat.innerHTML = '';
                    addChatLine('🔄 ゲームリセット！');
                }
            }

            function showClearOverlay() {
                isClearOverlayActive = true;
                clearOverlay.classList.add('active');
            }

            clearCloseBtn.addEventListener('click', function() {
                resetGame();
            });
            clearRedirectBtn.addEventListener('click', function() {
                window.location.href = 'pass.html';
            });

            // ---------- Twitchコメント ----------
            function addChatLine(msg) {
                if (!isStreaming || !streamUnlocked) return;
                var username = 'viewer' + Math.floor(Math.random() * 1000);
                var chunks = [];
                for (var i = 0; i < msg.length; i += 4) {
                    chunks.push(msg.substring(i, i + 4));
                }
                chunks.forEach(function(chunk, index) {
                    var line = document.createElement('div');
                    line.className = 'chat-line';
                    if (index === 0) {
                        line.innerHTML = '<span class="username">' + username + '</span><span class="message">' + chunk + '</span>';
                    } else {
                        line.innerHTML = '<span class="message" style="padding-left: 4px;">' + chunk + '</span>';
                    }
                    twitchChat.appendChild(line);
                });
                while (twitchChat.children.length > 30) {
                    twitchChat.removeChild(twitchChat.firstChild);
                }
                twitchChat.scrollTop = twitchChat.scrollHeight;
            }

            function randomComment() {
                if (!isStreaming || !streamUnlocked) return;
                var idx = Math.floor(Math.random() * currentCommentPool.length);
                addChatLine(currentCommentPool[idx]);
            }

            // ---------- 配信モード切り替え ----------
            function toggleStream() {
                if (!streamUnlocked) {
                    streamToggleBtn.textContent = '🔒 スコア1000必要';
                    setTimeout(function() {
                        streamToggleBtn.textContent = '🔒 配信モード (スコア1000)';
                    }, 1500);
                    return;
                }
                isStreaming = !isStreaming;
                streamToggleBtn.textContent = isStreaming ? '📡 配信モード ON' : '📡 配信モード OFF';
                twitchChat.classList.toggle('active', isStreaming);
                if (isStreaming) {
                    twitchChat.innerHTML = '';
                    addChatLine('🔴 配信開始！ コメントが流れます');
                    if (chatInterval) clearInterval(chatInterval);
                    chatInterval = setInterval(randomComment, 3000);
                } else {
                    if (chatInterval) {
                        clearInterval(chatInterval);
                        chatInterval = null;
                    }
                    twitchChat.innerHTML = '';
                }
            }

            streamToggleBtn.addEventListener('click', toggleStream);

            // ---------- イベント ----------
            leftBtn.addEventListener('mousedown', function(e) { e.preventDefault(); game.leftPressed = true; });
            leftBtn.addEventListener('mouseup', function(e) { e.preventDefault(); game.leftPressed = false; });
            leftBtn.addEventListener('mouseleave', function(e) { game.leftPressed = false; });
            rightBtn.addEventListener('mousedown', function(e) { e.preventDefault(); game.rightPressed = true; });
            rightBtn.addEventListener('mouseup', function(e) { e.preventDefault(); game.rightPressed = false; });
            rightBtn.addEventListener('mouseleave', function(e) { game.rightPressed = false; });
            jumpBtn.addEventListener('mousedown', function(e) {
                e.preventDefault();
                if (!game.gameClear && !game.gameOver && !isClearOverlayActive && !waitingForStageTransition) {
                    game.jumpPressed = true;
                }
            });
            resetBtn.addEventListener('click', resetGame);

            // ---------- ゲームループ ----------
            function gameLoop() {
                if (!game.gameClear && !game.gameOver && !waitingForStageTransition) {
                    updatePhysics();
                }
                if (!isClearOverlayActive && !waitingForStageTransition) {
                    draw();
                } else {
                    ctx.clearRect(0, 0, 800, 400);
                }
                requestAnimationFrame(gameLoop);
            }

            // ---------- 初期化 ----------
            buildLandStage();
            updateUI();
            gameLoop();

            twitchChat.classList.remove('active');
            streamToggleBtn.className = 'stream-badge';
            streamToggleBtn.textContent = '🔒 配信モード (スコア1000)';
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = null;

        })();
    </script>
</body>
</html>
