            neuralink_later: {
                id: 'neuralink_later',
                text: `You found Neuralink in 2016. You aim to create a brain-computer interface to treat neurological disorders and eventually merge with AI.\nYou demonstrate a monkey playing Pong with its mind. You are 50.\nYou believe that AI symbiosis is the only way for humanity to survive.\nWhat do you combine with?`,
                choices: [
                    { label: 'Tesla — AI and robotics.', next: 'tesla_bot' },
                    { label: 'SpaceX — neural control for astronauts.', next: 'starship_orbital' },
                    { label: 'OpenAI — AGI alignment.', next: 'openai' }
                ],
                meta: 'age 50 · Neuralink'
            },

            openai: {
                id: 'openai',
                text: `You co-found OpenAI as a non-profit to ensure that artificial general intelligence (AGI) benefits all of humanity. You push for AI safety and transparency.\nYou also use AI at Tesla for FSD. You are at the forefront of the AI revolution.\nWhat is your ultimate move?`,
                choices: [
                    { label: 'Tesla Bot — physical AI.', next: 'tesla_bot' },
                    { label: 'Neuralink — brain-AI fusion.', next: 'neuralink_later' },
                    { label: 'SpaceX — AI for space navigation.', next: 'starship_orbital' }
                ],
                meta: 'age 45 · OpenAI'
            },

            tesla_bot: {
                id: 'tesla_bot',
                text: `You announce Tesla Bot (Optimus), a humanoid robot designed to do dangerous and boring tasks. It uses the same AI as Tesla FSD.\nYou believe that robotics will be as big as cars. You are 51.\nYou are building the future — sustainable energy, space, AI, and robotics.\nBut the ultimate goal is Mars. What do you do?`,
                choices: [
                    { label: 'Starship — Mars colony.', next: 'starship_orbital' },
                    { label: 'Starlink — fund it all.', next: 'starlink' },
                    { label: 'Neuralink — enhance humans.', next: 'neuralink_later' }
                ],

            },

            mars_foundation: {
                id: 'mars_foundation',
                text: `You establish a foundation to research Mars colonization. You fund universities and labs. You also start SpaceX to build the rockets.\nBy 2020, you have a clear plan: Starship, Starlink, and a self-sustaining city on Mars.\nYou are 50. You have changed the world.\nWhat is the last piece?`,
                choices: [
                    { label: 'Starship orbital test flight.', next: 'starship_orbital' },
                    { label: 'Tesla Cybertruck — for Mars roads.', next: 'tesla_giga' },

            solar_city: {
                id: 'solar_city',
                text: `You co-found SolarCity in 2006 to make solar power affordable. Tesla acquires it in 2016. You integrate solar with Powerwall and Tesla cars.\nYou are a leader in clean energy. You also build SpaceX and Starlink.\nYou are now 52. The world is your canvas.\nWhat is your legacy move?`,
                choices: [

                choices: [

            game_venture: {
                id: 'game_venture',
                text: `You create a space trading video game. It becomes a cult hit. You sell it and use the money to start an internet company.\nYou eventually found SpaceX and Tesla. The game taught you about resource management and risk.\nYou are now 50. What do you build?`,
                choices: [
                    { label: 'Starship — the ultimate rocket.', next: 'starship_orbital' },
                    { label: 'Tesla Bot — AI robotics.', next: 'tesla_bot' },
                    { label: 'Starlink — global connectivity.', next: 'starlink' }

                meta: 'age 50 · Game Dev'
            },

            // ---- FINAL NODE: MERGE WITH PRESENT ELON ----
            starship_orbital: {
                id: 'starship_orbital',
                text: `✨✨✨\n2026 · Starship reaches orbit successfully. You have built the most powerful rocket ever. You are now working on the first crewed mission to Mars.\nTesla is the most valuable car company. Starlink covers the planet. Neuralink is helping the blind see. The Boring Company digs tunnels.\nYou have become the Elon Musk of today — a visionary engineer, entrepreneur, and pioneer.\n🎉 YOU HAVE MERGED WITH THE PRESENT ELON. GAME COMPLETE. 🎉`,
                choices: [],
                meta: '★ PRESENT · 2026',
                isWin: true
            }
        };

        // ----- game state -----
        let currentId = 'start';
        let history = ['start'];

        const sceneTextEl = document.getElementById('sceneText');
        const optionsContainer = document.getElementById('optionsContainer');
        const stageBadge = document.getElementById('stageBadge');
        const progressIndicator = document.getElementById('progressIndicator');
        const resetBtn = document.getElementById('resetBtn');

        function renderNode(id) {
            const node = STORY[id];
            if (!node) return;

            sceneTextEl.innerHTML = node.text.replace(/\n/g, '<br>');

            if (node.meta) {
                stageBadge.textContent = node.meta;
                progressIndicator.textContent = node.meta;
            }

            optionsContainer.innerHTML = '';
            if (node.choices && node.choices.length > 0) {
                const letters = ['A', 'B', 'C'];
                node.choices.forEach((choice, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    const letterSpan = document.createElement('span');
                    letterSpan.className = 'opt-letter';
                    letterSpan.textContent = letters[index] || '•';
                    btn.appendChild(letterSpan);
                    const textSpan = document.createElement('span');
                    textSpan.textContent = choice.label;
                    btn.appendChild(textSpan);

                    btn.addEventListener('click', function() {
                        if (node.isWin) return;
                        const nextId = choice.next;
                        if (nextId && STORY[nextId]) {
                            currentId = nextId;
                            history.push(nextId);
                            renderNode(nextId);
                            document.getElementById('sceneContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                    optionsContainer.appendChild(btn);
                });
            } else {
                const winDiv = document.createElement('div');
                winDiv.className = 'win-message';
                winDiv.innerHTML = '🚀✨ You are Elon Musk. The future is yours. ✨🚀';
                optionsContainer.appendChild(winDiv);
            }
        }

        function resetGame() {
            currentId = 'start';
            history = ['start'];
            renderNode('start');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        resetBtn.addEventListener('click', resetGame);
        renderNode('start');
    })();
</script>
