<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Day - Walk &amp; Talk</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    background:#0a0c0f;
    font-family:'Segoe UI','Helvetica Neue',sans-serif;
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh; color:#e0e0e0;
    padding:20px 0; overflow-y:auto;
  }
  .game-wrapper {
    background:#11161c; border-radius:24px; padding:20px 20px 14px;
    box-shadow:0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #2a3a4a inset;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    width:fit-content;
  }
  canvas {
    display:block; border-radius:16px; background:#0b0f14;
    box-shadow:0 0 30px rgba(0,255,200,0.1);
    cursor:crosshair; width:800px; height:600px;
  }
  .footer {
    display:flex; flex-direction:column; gap:6px;
    width:100%; padding:4px 8px 0; font-size:13px; color:#7a8b9b;
    letter-spacing:0.5px;
  }
  .footer .status { display:flex; gap:16px; flex-wrap:wrap; }
  .footer .status span { color:#b0c8d8; font-weight:500; }
  .footer .status .highlight { color:#00e6b0; }
  .footer .status .sp { color:#ffd166; }
  .footer .status .clock { color:#7ad7ff; }
  .footer .status .map-coord { color:#7ad7ff; }
  .footer .status .hidden-coord { display:none; }
  .btn-row {
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    width:100%; padding:4px 0;
  }
  .ui-btn {
    background:#1a2530; color:#00e6b0; border:2px solid #00e6b0;
    border-radius:40px; padding:7px 16px; font-size:13px; font-weight:700;
    letter-spacing:1px; cursor:pointer; font-family:inherit;
  }
  .ui-btn:hover { background:#00e6b0; color:#0a0c0f; }
  .ui-btn.map-toggle { color:#7ad7ff; border-color:#7ad7ff; }
  .ui-btn.map-toggle:hover { background:#7ad7ff; color:#0a0c0f; }
  .ui-btn.minimap-toggle { color:#ff8ad8; border-color:#ff8ad8; }
  .ui-btn.minimap-toggle:hover { background:#ff8ad8; color:#0a0c0f; }
  .ui-btn.warn { color:#ff4d6d; border-color:#ff4d6d; }
  .ui-btn.warn:hover { background:#ff4d6d; color:#0a0c0f; }
  .ui-btn.list { color:#ffd166; border-color:#ffd166; }
  .ui-btn.list:hover { background:#ffd166; color:#0a0c0f; }

  .hidden { display:none !important; }
  .hint { font-size:11px; color:#4a5a6a; margin-top:2px; text-align:center; width:100%; }

  .opening {
    position: fixed;
    inset: 0;
    background: #0a0c0f;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
    z-index: 9999;
  }
  .opening h1 {
    color: #00e6b0;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: 8px;
  }
  .opening .subtitle {
    color: #b0c8d8;
    font-size: 16px;
    letter-spacing: 4px;
    margin-top: -20px;
  }
  .opening .opening-btns {
    display: flex;
    gap: 16px;
  }
  .start-btn {
    background: #00e6b0;
    color: #0a0c0f;
    border: none;
    border-radius: 50px;
    padding: 18px 72px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 30px #00e6b0cc;
  }
  .start-btn:hover { background: #1affc0; }
  .opening.hidden-opening { display: none; }

  .dialogue {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    width: 720px;
    max-width: 92vw;
    background: #0d131aee;
    border: 2px solid #00e6b0;
    border-radius: 16px;
    padding: 18px 22px;
    z-index: 9500;
    box-shadow: 0 0 40px #00e6b055;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .dialogue.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .dialogue .d-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .dialogue .d-name {
    color: #00e6b0;
    font-size: 18px;
    font-weight: 800;
  }
  .dialogue .d-meta {
    color: #7a8b9b;
    font-size: 12px;
  }
  .dialogue .d-text {
    color: #e0e0e0;
    font-size: 16px;
    line-height: 1.6;
    min-height: 60px;
  }
  .dialogue .d-foot {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    justify-content: flex-end;
  }
  .dialogue .d-page {
    color: #7a8b9b;
    font-size: 12px;
    margin-right: auto;
    align-self: center;
  }

  .npc-panel {
    position: fixed;
    left: 24px;
    bottom: 24px;
    background: #0d131aee;
    border: 2px solid #7ad7ff;
    border-radius: 14px;
    padding: 12px 16px;
    z-index: 9400;
    color: #e0e0e0;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 0 30px #7ad7ff44;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    max-width: 280px;
  }
  .npc-panel.open { opacity: 1; }
  .npc-panel .n-name { color: #7ad7ff; font-weight: 800; font-size: 15px; }
  .npc-panel .n-hint { color: #00e6b0; font-size: 11px; margin-top: 6px; }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: #0d131aee; border: 2px solid #00e6b0; color: #00e6b0;
    border-radius: 40px; padding: 10px 24px; font-size: 14px; font-weight: 700;
    z-index: 12000; box-shadow: 0 0 30px #00e6b055;
    opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>

<script>
(function(){
  // ============================================================
  //  Basic setup
  // ============================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 600;
  const MAP_W = 800, MAP_H = 600;
  const MAP_COLS = 11, MAP_ROWS = 11;
  const WORLD_W = MAP_W * MAP_COLS;
  const WORLD_H = MAP_H * MAP_ROWS;
  const HOUR_SECONDS = 7;

  const timeDisplay = document.getElementById('timeDisplay');
  const talkedDisplay = document.getElementById('talkedDisplay');
  const areaDisplay = document.getElementById('areaDisplay');
  const mapDisplay = document.getElementById('mapDisplay');
  const mapCoordSpan = document.getElementById('mapCoordSpan');
  const minimapBtn = document.getElementById('minimapBtn');
  const mapToggleBtn = document.getElementById('mapToggleBtn');
  const helpBtn = document.getElementById('helpBtn');
  const dialogue = document.getElementById('dialogue');
  const dName = document.getElementById('dName');
  const dMeta = document.getElementById('dMeta');
  const dText = document.getElementById('dText');
  const dPage = document.getElementById('dPage');
  const dNext = document.getElementById('dNext');
  const dClose = document.getElementById('dClose');
  const npcPanel = document.getElementById('npcPanel');
  const npName = document.getElementById('npName');
  const npInfo = document.getElementById('npInfo');
  const toast = document.getElementById('toast');

  // ============================================================
  //  Utilities
  // ============================================================
  const dist = (x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  const randInt = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const fmt = (h,m)=>`${h}:${String(m).padStart(2,'0')}`;

  let toastTimer = 0;
  function showToast(msg, dur) {
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = (dur || 2) * 60;
  }

  // ============================================================
  //  Game state
  // ============================================================
  const player = { x: WORLD_W/2, y: WORLD_H/2, speed: 90, angle: 0, radius: 16 };
  const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };
  let mouseX = W/2, mouseY = H/2;
  let lastTime = 0;
  let gameStarted = false;
  let showMapCoord = false;
  let showMinimap = false;

  let gameHours = 4, gameMinutes = 0, timeAccum = 0;

  let npcs = [];
  let guests = [];
  let guestGroups = [];
  let doors = [];
  let walls = [];
  let areas = [];

  let myRoom = null;

  let activeNPC = null;
  let activeDoor = null;
  let conversation = null;

  let talked = new Set();

  let presenter = null;

  // ============================================================
  //  Area definition (11x11)
  // ============================================================
  function buildAreas() {
    const grid = [
      ['garden','garden','garden','garden','garden','garden','garden','garden','garden','garden','garden'],
      ['garden','lobby','lobby','lobby','lobby','lobby','lobby','lobby','lobby','lobby','garden'],
      ['garden','room','room','room','room','room','room','room','room','room','room'],
      ['garden','hall','hall','hall','hall','hall','hall','hall','hall','hall','banquet'],
      ['garden','room','room','room','room','room','room','room','room','room','room'],
      ['garden','hall','hall','hall','hall','hall','hall','hall','hall','hall','gacha'],
      ['garden','room','room','room','room','room','room','room','room','room','room'],
      ['garden','hall','hall','hall','hall','hall','hall','hall','hall','hall','onsen'],
      ['garden','room','room','room','room','room','room','room','room','room','room'],
      ['garden','hall','hall','hall','hall','hall','hall','hall','hall','hall','rest'],
      ['garden','garden','garden','garden','garden','garden','garden','garden','garden','garden','garden'],
    ];
    const nameMap = {
      garden:'Garden', lobby:'Lobby', room:'Room', hall:'Hallway',
      banquet:'Banquet Hall', gacha:'Gachapon', onsen:'Onsen', rest:'Rest Room',
    };
    areas = [];
    for (let r = 0; r < MAP_ROWS; r++) {
      for (let c = 0; c < MAP_COLS; c++) {
        let type = grid[r][c];
        let name = nameMap[type];
        let roomNum = null;
        let floor = null;
        if (type === 'room') {
          if (r === 2) floor = 4;
          else if (r === 4) floor = 3;
          else if (r === 6) floor = 2;
          else if (r === 8) floor = 1;
          const idx = c;
          if (idx >= 1 && idx <= 10) {
            roomNum = floor * 100 + idx;
            name = 'Room ' + roomNum;
          }
        }
        areas.push({ col:c, row:r, x:c*MAP_W, y:r*MAP_H, w:MAP_W, h:MAP_H,
          type, name, roomNum, floor });
      }
    }
  }

  function areaAt(x, y) {
    const c = clamp(Math.floor(x / MAP_W), 0, MAP_COLS-1);
    const r = clamp(Math.floor(y / MAP_H), 0, MAP_ROWS-1);
    return areas.find(a => a.col===c && a.row===r) || areas[0];
  }

  // ============================================================
  //  Walls + Doors
  // ============================================================
  const WALL_THICK = 20;
  const DOOR_LEN = 80;

  function isOutdoor(a) { return a.type === 'garden'; }

  function buildWallsAndDoors() {
    walls = [];
    doors = [];
    const visited = new Set();
    function boundaryKey(x1, y1, x2, y2) {
      if (x1 > x2 || (x1 === x2 && y1 > y2)) return `${x2},${y2}-${x1},${y1}`;
      return `${x1},${y1}-${x2},${y2}`;
    }
    function buildBoundary(a, side) {
      let x1, y1, x2, y2, horizontal;
      if (side === 'top') { x1=a.x; y1=a.y; x2=a.x+a.w; y2=a.y; horizontal=true; }
      else if (side === 'bottom') { x1=a.x; y1=a.y+a.h; x2=a.x+a.w; y2=a.y+a.h; horizontal=true; }
      else if (side === 'left') { x1=a.x; y1=a.y; x2=a.x; y2=a.y+a.h; horizontal=false; }
      else { x1=a.x+a.w; y1=a.y; x2=a.x+a.w; y2=a.y+a.h; horizontal=false; }
      const key = boundaryKey(x1, y1, x2, y2);
      if (visited.has(key)) return;
      visited.add(key);
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      if (horizontal) {
        const wallY = (side === 'top') ? a.y : a.y + a.h;
        walls.push({ x:a.x, y:wallY - WALL_THICK/2, w:(a.w - DOOR_LEN)/2, h:WALL_THICK });
        walls.push({ x:a.x + (a.w + DOOR_LEN)/2, y:wallY - WALL_THICK/2, w:(a.w - DOOR_LEN)/2, h:WALL_THICK });
        doors.push({ x: cx - DOOR_LEN/2, y: wallY - 8, w: DOOR_LEN, h: 16, open: false });
      } else {
        const wallX = (side === 'left') ? a.x : a.x + a.w;
        walls.push({ x:wallX - WALL_THICK/2, y:a.y, w:WALL_THICK, h:(a.h - DOOR_LEN)/2 });
        walls.push({ x:wallX - WALL_THICK/2, y:a.y + (a.h + DOOR_LEN)/2, w:WALL_THICK, h:(a.h - DOOR_LEN)/2 });
        doors.push({ x: wallX - 8, y: cy - DOOR_LEN/2, w: 16, h: DOOR_LEN, open: false });
      }
    }
    for (const a of areas) {
      if (isOutdoor(a)) continue;
      buildBoundary(a, 'top');
      buildBoundary(a, 'bottom');
      buildBoundary(a, 'left');
      buildBoundary(a, 'right');
    }
  }

  // ============================================================
  //  Guest data (39 rooms = 51 people)
  // ============================================================
  const GUEST_GROUPS_DATA = [
    { members:[{name:'高橋 陽一', gender:'M', age:45}], eventType:'banquet' },
    { members:[{name:'中村 由美', gender:'F', age:38}], eventType:'banquet' },
    { members:[{name:'小林 翔太', gender:'M', age:29}], eventType:'banquet' },
    { members:[{name:'加藤 さくら', gender:'F', age:33}], eventType:'banquet' },

    { members:[{name:'山本 健一', gender:'M', age:42},{name:'山本 由紀', gender:'F', age:39},{name:'山本 蓮', gender:'M', age:8}], eventType:'banquet' },
    { members:[{name:'木村 拓也', gender:'M', age:36}], eventType:'banquet' },
    { members:[{name:'林 香織', gender:'F', age:31}], eventType:'banquet' },
    { members:[{name:'清水 涼介', gender:'M', age:48}], eventType:'banquet' },
    { members:[{name:'渡辺 智子', gender:'F', age:47}], eventType:'banquet' },
    { members:[{name:'中島 修', gender:'M', age:50},{name:'中島 香', gender:'F', age:48},{name:'中島 大和', gender:'M', age:15},{name:'中島 美月', gender:'F', age:10}], eventType:'banquet' },
    { members:[{name:'前田 浩二', gender:'M', age:51}], eventType:'onsen' },
    { members:[{name:'藤田 麻衣', gender:'F', age:34}], eventType:'onsen' },
    { members:[{name:'後藤 誠', gender:'M', age:46}], eventType:'onsen' },
    { members:[{name:'岡田 彩', gender:'F', age:23}], eventType:'onsen' },
    { members:[{name:'長谷川 亮', gender:'M', age:37}], eventType:'onsen' },
    { members:[{name:'村上 有希', gender:'F', age:30}], eventType:'onsen' },
    { members:[{name:'佐々木 隆', gender:'M', age:45},{name:'佐々木 真理', gender:'F', age:43},{name:'佐々木 結衣', gender:'F', age:12},{name:'佐々木 悠斗', gender:'M', age:6}], eventType:'onsen' },
    { members:[{name:'藤井 学', gender:'M', age:40}], eventType:'onsen' },
    { members:[{name:'西村 綾', gender:'F', age:35}], eventType:'onsen' },
    { members:[{name:'福田 剛', gender:'M', age:54}], eventType:'onsen' },
    { members:[{name:'太田 沙織', gender:'F', age:32}], eventType:'onsen' },
    { members:[{name:'三浦 洋平', gender:'M', age:47}], eventType:'rest' },
    { members:[{name:'藤原 奈々', gender:'F', age:29}], eventType:'rest' },
    { members:[{name:'伊藤 浩', gender:'M', age:38},{name:'伊藤 沙耶', gender:'F', age:36},{name:'伊藤 陽菜', gender:'F', age:4}], eventType:'rest' },
    { members:[{name:'中野 優子', gender:'F', age:41}], eventType:'rest' },

    { members:[{name:'小川 杏奈', gender:'F', age:26}], eventType:'rest' },
    { members:[{name:'竹内 陽介', gender:'M', age:33}], eventType:'rest' },
    { members:[{name:'森 雄大', gender:'M', age:26}], eventType:'banquet' },
    { members:[{name:'池田 直美', gender:'F', age:42}], eventType:'banquet' },
    { members:[{name:'橋本 竜也', gender:'M', age:39}], eventType:'banquet' },
    { members:[{name:'石川 千夏', gender:'F', age:28}], eventType:'onsen' },
    { members:[{name:'近藤 隆', gender:'M', age:58}], eventType:'onsen' },
    { members:[{name:'大野 加奈子', gender:'F', age:46}], eventType:'onsen' },
    { members:[{name:'遠藤 淳', gender:'M', age:43}], eventType:'onsen' },
    { members:[{name:'青木 舞', gender:'F', age:25}], eventType:'onsen' },
    { members:[{name:'松本 健一', gender:'M', age:52},{name:'松本 美咲', gender:'F', age:49},{name:'松本 翔', gender:'M', age:17}], eventType:'banquet' },
    { members:[{name:'井上 真由美', gender:'F', age:44}], eventType:'rest' },
  ];

  const ROOM_LINES = [
    "Oh, you have a key to my room? How unusual.",
    "I was just resting. This hotel is quite nice.",
    "The bed here is surprisingly comfortable.",
    "Did you need something from me?",

  ];
  const ONSEN_LINES = [
    "The onsen is wonderful this time of day.",
    "Ah, nothing beats a hot bath.",

  ];
  const BANQUET_LINES = [
    "The banquet hall is beautifully decorated.",

    "I'm glad I came tonight.",
  ];
  const CHILD_LINES_ROOM = ["Hey, do you have any candy?","This room is so big!","Can I watch TV?","I want to stay up late!"];
  const CHILD_LINES_BANQUET = ["The cake looks so yummy!","I want to see the comedy!","This hall is huge!","I'm going to eat everything!"];
  const CHILD_LINES_ONSEN = ["The water is so warm!","I can swim here!","The steam tickles!","Look at the bubbles!"];

  // ============================================================
  //  Build NPCs
  // ============================================================
  function buildNPCs() {
    npcs = []; guests = []; guestGroups = [];

    const allRooms = [];
    for (const floor of [1,2,3,4]) {
      for (let i = 1; i <= 10; i++) {
        allRooms.push({ num: floor*100 + i, floor, col: i });
      }
    }
    const shuffled = shuffle(allRooms);
    myRoom = shuffled[0].num;
    const guestRooms = shuffled.slice(1, 40);

    let personId = 0;
    for (let i = 0; i < 39; i++) {
      const data = GUEST_GROUPS_DATA[i];
      const room = guestRooms[i];
      const area = areas.find(a => a.roomNum === room.num);
      const group = { id: i, room: room.num, floor: room.floor,
        eventType: data.eventType, members: [],
        baseX: area.x + area.w/2, baseY: area.y + area.h/2 };
      for (const m of data.members) {
        const g = {
          id: personId++, groupId: i,
          name: m.name, gender: m.gender, age: m.age,
          room: room.num, floor: room.floor,
          x: group.baseX, y: group.baseY,
          baseX: group.baseX, baseY: group.baseY,
          radius: 14,
          color: pick(['#1a2a4a','#2a3a4a','#3a4a5a','#2a4a3a','#4a3a2a']),
          hair: pick(['#1a1a1a','#3a2a1a','#5a4a2a','#7a6a3a']),
          location: 'room',
          isGuest: true,
        };
        group.members.push(g);
        guests.push(g);
        npcs.push(g);
      }
      guestGroups.push(group);
    }

    // Presenter (outside, top garden area)
    const outArea = areas.find(a => a.type === 'garden' && a.row === 0 && a.col === 5);
    presenter = {
      id: 'presenter', name: '山田 太郎', age: 38, gender: 'M',
      x: outArea.x + outArea.w/2, y: outArea.y + outArea.h/2 + 100,
      baseX: outArea.x + outArea.w/2, baseY: outArea.y + outArea.h/2 + 100,
      radius: 16, color:'#4a3a2a', hair:'#3a2a1a',
      location: 'outside', isPresenter: true,
    };
    npcs.push(presenter);
  }

  // ============================================================
  //  Init
  // ============================================================
  function initGame() {
    buildAreas();
    buildWallsAndDoors();
    buildNPCs();
    // Start player in the lobby (row 1, col 5)
    const lobby = areas.find(a => a.type === 'lobby' && a.col === 5 && a.row === 1);
    player.x = lobby.x + lobby.w/2;
    player.y = lobby.y + lobby.h/2;
    gameHours = 4; gameMinutes = 0; timeAccum = 0;
    talked = new Set();
    conversation = null;
    updateHUD();
  }

  function updateHUD() {
    timeDisplay.textContent = fmt(gameHours, gameMinutes);
    talkedDisplay.textContent = talked.size;
    const a = areaAt(player.x, player.y);
    areaDisplay.textContent = a.name;
    const c = Math.floor(player.x / MAP_W) + 1;
    const r = Math.floor(player.y / MAP_H) + 1;
    mapDisplay.textContent = `${c},${r}`;
  }

  // ============================================================
  //  Time
  // ============================================================
  function updateTime(dt) {
    timeAccum += dt / (HOUR_SECONDS * 60);
    while (timeAccum >= 1) {
      timeAccum -= 1;
      gameHours++;
      if (gameHours >= 24) gameHours -= 24;
      onHourChanged();
    }
  }

  function onHourChanged() {
    if (gameHours === 7) showToast('It is 7:00. The rest room is open.', 2.5);
    if (gameHours === 11) showToast('It is 11:00. The rest room closes.', 2);
    if (gameHours === 18) showToast('It is 18:00. The onsen is open.', 2.5);
    if (gameHours === 19) showToast('It is 19:00. The banquet hall is open.', 2.5);
    if (gameHours === 21) showToast('It is 21:00. The banquet closes.', 2);
    if (gameHours === 22) showToast('It is 22:00. The onsen closes.', 2);
    updateGuestLocations();
    updateHUD();
  }

  function updateGuestLocations() {
    for (const g of guests) {
      const group = guestGroups[g.groupId];
      let loc = 'room';
      if (group.eventType === 'rest' && gameHours >= 7 && gameHours < 11) loc = 'rest';
      else if (group.eventType === 'onsen' && gameHours >= 18 && gameHours < 22) loc = 'onsen';
      else if (group.eventType === 'banquet' && gameHours >= 19 && gameHours < 21) loc = 'banquet';
      g.location = loc;

      if (loc === 'room') {
        const roomArea = areas.find(a => a.roomNum === g.room);
        if (roomArea) {
          g.baseX = roomArea.x + roomArea.w/2;
          g.baseY = roomArea.y + roomArea.h/2;
        }
      } else if (loc === 'rest') {
        const c = areas.find(a => a.type === 'rest');
        g.baseX = c.x + 150 + (g.id % 4) * 150;
        g.baseY = c.y + 220 + Math.floor((g.id/4) % 3) * 110;
      } else if (loc === 'onsen') {
        const c = areas.find(a => a.type === 'onsen');
        g.baseX = c.x + 150 + (g.id % 4) * 150;
        g.baseY = c.y + 220 + Math.floor((g.id/4) % 3) * 110;
      } else if (loc === 'banquet') {
        const c = areas.find(a => a.type === 'banquet');
        const cols = 5;
        const idx = g.id % (cols * 3);
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        g.baseX = c.x + 100 + col * 140;
        g.baseY = c.y + 340 + row * 90;
      }
      g.x = g.baseX;
      g.y = g.baseY;
    }
  }

  // ============================================================
  //  Input
  // ============================================================
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      keys[e.key] = true;
    }
    if (e.key === 'Escape') {
      closeDialogue();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      keys[e.key] = false;
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
    mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    if (conversation) { nextDialogue(); return; }
    if (activeDoor) { activeDoor.open = !activeDoor.open; return; }
    if (activeNPC) { startDialogue(activeNPC); return; }
  });

  dialogue.addEventListener('click', (e) => {
    e.preventDefault();
    nextDialogue();
  });

  minimapBtn.addEventListener('click', (e) => {
    e.preventDefault();
    showMinimap = !showMinimap;
    minimapBtn.textContent = showMinimap ? '🗺 HIDE MINIMAP' : '🗺 SHOW MINIMAP';
  });
  mapToggleBtn.addEventListener('click', (e) => {
    e.preventDefault();
    showMapCoord = !showMapCoord;
    if (showMapCoord) {
      mapCoordSpan.classList.remove('hidden-coord');
      mapToggleBtn.textContent = '📍 HIDE COORDS';
    } else {
      mapCoordSpan.classList.add('hidden-coord');
      mapToggleBtn.textContent = '📍 SHOW COORDS';
    }
  });
  helpBtn.addEventListener('click', (e) => {
    e.preventDefault();
    showToast('Move: Arrows / Talk: Approach a person & click', 4);
  });

  // ============================================================
  //  Dialogue
  // ============================================================
  function startDialogue(npc) {
    if (!npc) return;
    conversation = { npc, page: 0, lines: [] };

    if (npc.isPresenter) {
      conversation.lines = [
        "Hey! You look like someone who could use some money.",
        "I'm giving a business presentation nearby.",
        "Come find me if you're interested.",
      ];
    } else if (npc.isGuest) {
      let lines;
      if (npc.location === 'rest') lines = REST_LINES;
      else if (npc.location === 'onsen') lines = ONSEN_LINES;
      else if (npc.location === 'banquet') lines = BANQUET_LINES;
      else lines = ROOM_LINES;
      const len = randInt(1, Math.min(4, lines.length));
      conversation.lines = shuffle(lines).slice(0, len);
      if (npc.age < 18) {
        if (npc.location === 'banquet') conversation.lines.unshift(pick(CHILD_LINES_BANQUET));
        else if (npc.location === 'onsen') conversation.lines.unshift(pick(CHILD_LINES_ONSEN));
        else conversation.lines.unshift(pick(CHILD_LINES_ROOM));
      }
      talked.add(npc.id);
    } else {
      conversation.lines = ["Hello there."];
    }

    renderDialogue();
    dialogue.classList.add('open');
  }

  function renderDialogue() {
    if (!conversation) return;
    const { npc, page, lines } = conversation;
    dName.textContent = npc.name || '???';
    if (npc.isGuest) dMeta.textContent = `${npc.gender} / Age ${npc.age} / Room ${npc.room}`;
    else if (npc.isPresenter) dMeta.textContent = 'Presenter';
    else dMeta.textContent = '';
    dText.textContent = lines[page] || '';
    dPage.textContent = `${page+1} / ${lines.length}`;
    dNext.textContent = (page < lines.length - 1) ? 'NEXT ▶' : 'FINISH';
  }

  function nextDialogue() {
    if (!conversation) return;
    if (conversation.page < conversation.lines.length - 1) {
      conversation.page++;
      renderDialogue();
    } else {
      closeDialogue();
    }
  }

  function closeDialogue() {
    conversation = null;
    dialogue.classList.remove('open');
  }

  // ============================================================
  //  Collision
  // ============================================================
  function resolveRectCollision(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx;
    const dy = cy - ny;
    const d2 = dx*dx + dy*dy;
    if (d2 >= r*r) return null;
    if (d2 > 0.0001) {
      const d = Math.sqrt(d2);
      const overlap = r - d;
      return { x: cx + (dx / d) * overlap, y: cy + (dy / d) * overlap };
    }
    const left = cx - rx, right = rx + rw - cx;
    const top = cy - ry, bottom = ry + rh - cy;
    const min = Math.min(left, right, top, bottom);
    if (min === left)   return { x: rx - r, y: cy };
    if (min === right)  return { x: rx + rw + r, y: cy };
    if (min === top)    return { x: cx, y: ry - r };
    return { x: cx, y: ry + rh + r };
  }

  function tryMovePlayer(dx, dy) {
    let nx = clamp(player.x + dx, 20, WORLD_W - 20);
    player.x = nx;
    for (const w of walls) {
      const res = resolveRectCollision(player.x, player.y, player.radius, w.x, w.y, w.w, w.h);
      if (res) { player.x = res.x; player.y = res.y; }
    }
    for (const dr of doors) {
      if (dr.open) continue;
      const res = resolveRectCollision(player.x, player.y, player.radius, dr.x, dr.y, dr.w, dr.h);
      if (res) { player.x = res.x; player.y = res.y; }
    }
    let ny = clamp(player.y + dy, 20, WORLD_H - 20);
    player.y = ny;
    for (const w of walls) {
      const res = resolveRectCollision(player.x, player.y, player.radius, w.x, w.y, w.w, w.h);
      if (res) { player.x = res.x; player.y = res.y; }
    }
    for (const dr of doors) {
      if (dr.open) continue;
      const res = resolveRectCollision(player.x, player.y, player.radius, dr.x, dr.y, dr.w, dr.h);
      if (res) { player.x = res.x; player.y = res.y; }
    }
  }

  // ============================================================
  //  Update
  // ============================================================
  function update(dt) {
    if (!gameStarted) return;

    updateTime(dt);

    const baseSpeed = player.speed * 0.4;
    let dx = 0, dy = 0;
    if (keys.ArrowUp)    dy -= 1;
    if (keys.ArrowDown)  dy += 1;
    if (keys.ArrowLeft)  dx -= 1;
    if (keys.ArrowRight) dx += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx = dx / len * baseSpeed;
      dy = dy / len * baseSpeed;
      const total = Math.hypot(dx, dy);
      const steps = Math.max(1, Math.ceil(total / 4));
      for (let s = 0; s < steps; s++) tryMovePlayer(dx/steps, dy/steps);
    }

    const camX = clamp(player.x - W/2, 0, WORLD_W - W);
    const camY = clamp(player.y - H/2, 0, WORLD_H - H);
    const wmx = mouseX + camX;
    const wmy = mouseY + camY;
    player.angle = Math.atan2(wmy - player.y, wmx - player.x);

    // Active NPC detection
    activeNPC = null;
    let bestD = 60;
    for (const n of npcs) {
      const d = dist(n.x, n.y, player.x, player.y);
      if (d < bestD) { bestD = d; activeNPC = n; }
    }

    // Active door
    activeDoor = null;
    let bestDoorD = 55;
    for (const dr of doors) {
      const cx = dr.x + dr.w/2;
      const cy = dr.y + dr.h/2;
      const d = dist(cx, cy, player.x, player.y);
      if (d < bestDoorD) { bestDoorD = d; activeDoor = dr; }
    }

    // NPC panel
    if (activeNPC && !conversation) {
      npName.textContent = activeNPC.name;
      if (activeNPC.isGuest) {
        npInfo.textContent = `${activeNPC.gender} / Age ${activeNPC.age} / Room ${activeNPC.room}`;
      } else if (activeNPC.isPresenter) {
        npInfo.textContent = 'Presenter';
      } else {
        npInfo.textContent = '';
      }
      npcPanel.classList.add('open');
    } else {
      npcPanel.classList.remove('open');
    }

    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) toast.classList.remove('show');
    }

    updateHUD();
  }

  // ============================================================
  //  Draw
  // ============================================================
  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!gameStarted) {
      ctx.fillStyle = '#0a0c0f';
      ctx.fillRect(0, 0, W, H);
      return;
    }
    const camX = clamp(player.x - W/2, 0, WORLD_W - W);
    const camY = clamp(player.y - H/2, 0, WORLD_H - H);
    ctx.save();
    ctx.translate(-camX, -camY);

    for (const a of areas) {
      if (a.x > camX + W || a.x + a.w < camX || a.y > camY + H || a.y + a.h < camY) continue;
      drawArea(a);
    }

    for (const dr of doors) {
      if (dr.x > camX + W || dr.x + dr.w < camX || dr.y > camY + H || dr.y + dr.h < camY) continue;
      drawDoor(dr);
    }

    for (const n of npcs) {
      if (n.x < camX - 40 || n.x > camX + W + 40 || n.y < camY - 40 || n.y > camY + H + 40) continue;
      drawNPC(n);
    }

    drawPlayer();

    if (activeNPC && !conversation) {
      ctx.fillStyle = '#00e6b0';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Click to talk', activeNPC.x, activeNPC.y - 34);
    }
    if (activeDoor) {
      ctx.fillStyle = '#7ad7ff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(activeDoor.open ? 'Click to close' : 'Click to open',
        activeDoor.x + activeDoor.w/2, activeDoor.y - 6);
    }

    ctx.restore();
    if (showMinimap) drawMinimap();
  }

  function drawArea(a) {
    if (a.type === 'garden') {
      ctx.fillStyle = '#14301e';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      for (let i = 0; i < 6; i++) {
        const tx = a.x + 80 + (i * 110) % (a.w - 120);
        const ty = a.y + 80 + Math.floor(i / 3) * 200;
        drawTree(tx, ty);
      }
    } else if (a.type === 'lobby') {
      ctx.fillStyle = '#1e2833';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#2a3a4a';
      ctx.fillRect(a.x + a.w/2 - 150, a.y + 100, 300, 60);
      ctx.fillStyle = '#00e6b0';
      ctx.fillRect(a.x + a.w/2 - 150, a.y + 100, 300, 6);
      // Receptionist
      drawPerson(a.x + a.w/2, a.y + 80, '#7ad7ff', '#ffd166', '佐藤 美咲');
    } else if (a.type === 'room') {
      ctx.fillStyle = '#2a2a3a';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#5a4a3a';
      ctx.fillRect(a.x + 80, a.y + 200, 280, 200);
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(a.x + 80, a.y + 200, 280, 60);
      ctx.fillStyle = '#7ad7ff';
      ctx.fillRect(a.x + 80, a.y + 260, 280, 140);
      if (a.roomNum) {
        ctx.fillStyle = '#ffd166';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Room ' + a.roomNum, a.x + a.w/2, a.y + 60);
      }
      if (a.roomNum === myRoom) {
        ctx.fillStyle = '#00e6b0';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('MY ROOM', a.x + a.w/2, a.y + 100);
      }
    } else if (a.type === 'hall') {
      ctx.fillStyle = '#1a222c';
      ctx.fillRect(a.x, a.y, a.w, a.h);
    } else if (a.type === 'rest') {
      ctx.fillStyle = '#221a14';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('REST ROOM', a.x + a.w/2, a.y + 50);
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = '#2a3a5a';
        ctx.fillRect(a.x + 100 + (i%3)*200, a.y + 150 + Math.floor(i/3)*150, 150, 80);
      }
    } else if (a.type === 'onsen') {
      ctx.fillStyle = '#0d1a1a';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#1a3a4a';
      ctx.beginPath();
      ctx.arc(a.x + a.w/2, a.y + a.h/2 + 60, 220, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#7ad7ff'; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#7ad7ff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ONSEN', a.x + a.w/2, a.y + 130);
    } else if (a.type === 'gacha') {
      ctx.fillStyle = '#1a1a24';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#3a1a2a';
      ctx.fillRect(a.x + a.w/2 - 220, a.y + a.h/2 - 120, 440, 260);
      ctx.strokeStyle = '#ff8ad8'; ctx.lineWidth = 4;
      ctx.strokeRect(a.x + a.w/2 - 220, a.y + a.h/2 - 120, 440, 260);
      ctx.fillStyle = '#ff8ad8';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GACHAPON', a.x + a.w/2, a.y + 80);
    } else if (a.type === 'banquet') {
      ctx.fillStyle = '#1a1218';
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#3a1a2a';
      ctx.fillRect(a.x + a.w/2 - 280, a.y + 80, 560, 160);
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
      ctx.strokeRect(a.x + a.w/2 - 280, a.y + 80, 560, 160);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BANQUET HALL', a.x + a.w/2, a.y + 50);
    } else {
      ctx.fillStyle = '#161c24';
      ctx.fillRect(a.x, a.y, a.w, a.h);
    }
    ctx.strokeStyle = '#1e3a4a';
    ctx.lineWidth = 2;
    ctx.strokeRect(a.x, a.y, a.w, a.h);
    ctx.fillStyle = '#3a5a6a';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(a.name, a.x + 12, a.y + 24);
  }

  function drawTree(x, y) {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(x - 6, y, 12, 30);
    ctx.fillStyle = '#1a5a2a';
    ctx.beginPath(); ctx.arc(x, y - 10, 26, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a7a3a';
    ctx.beginPath(); ctx.arc(x - 10, y - 20, 18, 0, Math.PI*2); ctx.fill();
  }

  function drawDoor(dr) {
    if (dr.open) {
      ctx.fillStyle = 'rgba(42,90,58,0.55)';
      ctx.fillRect(dr.x, dr.y, dr.w, dr.h);
      ctx.strokeStyle = '#00e6b0';
      ctx.lineWidth = 2;
      ctx.strokeRect(dr.x, dr.y, dr.w, dr.h);
    } else {
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(dr.x, dr.y, dr.w, dr.h);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.strokeRect(dr.x, dr.y, dr.w, dr.h);
    }
  }

  function drawPerson(x, y, bodyColor, hairColor, name) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 16, 12, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x - 8, y - 4, 16, 20);
    ctx.fillStyle = '#e0b090';
    ctx.beginPath();
    ctx.arc(x, y - 12, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.arc(x, y - 15, 8, Math.PI, Math.PI*2);
    ctx.fill();
    if (name) {
      ctx.fillStyle = '#b0c8d8';
      ctx.font = 'bold 13px "Hiragino Sans","Yu Gothic",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(name, x, y - 34);
    }
  }

  function drawNPC(n) {
    const x = n.x, y = n.y;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 16, 12, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = n.color;
    ctx.fillRect(x - 8, y - 4, 16, 20);
    ctx.fillStyle = '#e0b090';
    ctx.beginPath();
    ctx.arc(x, y - 12, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = n.hair;
    ctx.beginPath();
    ctx.arc(x, y - 15, 8, Math.PI, Math.PI*2);
    ctx.fill();
    if (n.age < 18) {
      ctx.fillStyle = '#ff8ad8';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('👶', x, y - 28);
    }
    if (n.name) {
      ctx.fillStyle = '#b0c8d8';
      ctx.font = 'bold 13px "Hiragino Sans","Yu Gothic",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, x, y - 40);
    }
    if (talked.has(n.id)) {
      ctx.fillStyle = '#00e6b0';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✔', x + 14, y - 20);
    }
  }

  function drawPlayer() {
    const x = player.x, y = player.y;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 16, 12, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowColor = '#00e6b0'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#0a1a1a';
    ctx.beginPath();
    ctx.arc(x, y, player.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#00e6b0'; ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#00e6b0'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(player.angle)*24, y + Math.sin(player.angle)*24);
    ctx.stroke();
  }

  function drawMinimap() {
    const mw = 160, mh = 120;
    const mx = W - mw - 12, my = H - mh - 12;
    ctx.fillStyle = 'rgba(10,12,15,0.8)';
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = '#1e3a4a';
    ctx.lineWidth = 1;
    ctx.strokeRect(mx, my, mw, mh);
    const sx = mw / WORLD_W, sy = mh / WORLD_H;
    for (const a of areas) {
      ctx.fillStyle = (a.type === 'garden') ? '#1a3a2a' :
                      (a.type === 'room') ? '#2a2a3a' :
                      (a.type === 'rest') ? '#221a14' :
                      (a.type === 'onsen') ? '#0d1a1a' :
                      (a.type === 'banquet') ? '#3a1a2a' :
                      (a.type === 'gacha') ? '#3a1a2a' :
                      (a.type === 'lobby') ? '#1e2833' : '#1a222c';
      ctx.fillRect(mx + a.x*sx, my + a.y*sy, a.w*sx, a.h*sy);
    }
    ctx.fillStyle = '#00e6b0';
    ctx.fillRect(mx + player.x*sx - 2, my + player.y*sy - 2, 4, 4);
    ctx.fillStyle = '#ffd166';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('MINIMAP', mx + 4, my + 12);
  }

  // ============================================================
  //  Loop
  // ============================================================
  function gameLoop(timestamp) {
    const dt = Math.min(2, (timestamp - lastTime) / (1000/60));
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ============================================================
  //  Opening — START button
  // ============================================================
  const opening = document.getElementById('opening');
  const startBtn = document.getElementById('startBtn');

  startBtn.addEventListener('click', function(e) {
    e.preventDefault();
    gameStarted = true;
    opening.style.display = 'none';
    lastTime = performance.now();
    showToast('Welcome to the hotel!', 3);
  });

  // ============================================================
  //  Start
  // ============================================================
  initGame();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
