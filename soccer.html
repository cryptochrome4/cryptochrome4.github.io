<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>サッカー観戦ゲーム</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a3d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #gameWrapper {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: #0d260d;
            padding: 10px;
            border-radius: 20px;
            border: 4px solid #2d5a2d;
        }
        #infoPanel {
            width: 160px;
            background: rgba(0,0,0,0.85);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 11px;
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 600px;
            max-height: 620px;
            overflow-y: auto;
        }
        #infoPanel .team-title {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 4px 0;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 6px;
        }
        #infoPanel .team-title.blue { color: #66aaff; }
        #infoPanel .team-title.red { color: #ff6666; }
        #infoPanel .player-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 10px;
        }
        #infoPanel .player-row .pos { color: #aaa; width: 25px; }
        #infoPanel .player-row .num { color: #fff; width: 20px; text-align: center; font-weight: bold; }
        #infoPanel .player-row .param { color: #ffdd44; width: 25px; text-align: right; }
        #infoPanel .player-row .gk { color: #ffcc00; }
        #infoPanel .player-row .blue-row { background: rgba(50,100,255,0.08); }
        #infoPanel .player-row .red-row { background: rgba(255,50,50,0.08); }
        #infoPanel .section { margin-bottom: 8px; }
        #infoPanel .param-label { font-size: 9px; color: #888; text-align: center; padding: 2px; }
        #gameContainer {
            position: relative;
            width: 700px;
            height: 600px;
            background: #2d8a2d;
            border: 6px solid #fff;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }
        #pitch {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            pointer-events: none;
        }
        .center-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(255,255,255,0.25);
            pointer-events: none;
        }
        .penalty-area-top {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 70px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top: none;
            pointer-events: none;
        }
        .penalty-area-bottom {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 70px;
            border: 2px solid rgba(255,255,255,0.25);
            border-bottom: none;
            pointer-events: none;
        }
        .goal-top {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 10px;
            background: #fff;
            border-radius: 2px;
            pointer-events: none;
        }
        .goal-bottom {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 10px;
            background: #fff;
            border-radius: 2px;
            pointer-events: none;
        }
        .player {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px rgba(0,0,0,0.9);
            border: 2px solid rgba(255,255,255,0.7);
            transition: all 0.12s ease;
            z-index: 2;
            cursor: default;
            user-select: none;
        }
        .player.blue { background: #2255dd; border-color: #88bbff; }
        .player.red { background: #dd2222; border-color: #ff8888; }
        .player.gk { background: #ffcc00; border-color: #fff; color: #000; text-shadow: none; }
        .player.blue.gk { background: #ffcc00; color: #000; }
        .player.red.gk { background: #ffcc00; color: #000; }
        .ball {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid #333;
            z-index: 3;
            transition: all 0.1s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            pointer-events: none;
        }
        #scoreboard {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.2);
            pointer-events: none;
        }
        #scoreRed { color: #ff6666; }
        #scoreBlue { color: #66aaff; }
        #timer {
            position: absolute;
            top: 60px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            z-index: 10;
            border: 1px solid #0f0;
            pointer-events: none;
        }
        #setupPanel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
            border-radius: 16px;
        }
        #setupPanel h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: #ffdd44;
            text-shadow: 0 0 20px rgba(255,200,0,0.2);
        }
        #setupPanel .form-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 6px 0;
            width: 100%;
            max-width: 650px;
        }
        #setupPanel .form-group {
            background: rgba(255,255,255,0.06);
            padding: 12px 16px;
            border-radius: 10px;
            min-width: 180px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        #setupPanel .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        #setupPanel .form-group select,
        #setupPanel .form-group input {
            width: 100%;
            padding: 5px 8px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            font-size: 13px;
        }
        #setupPanel .form-group select option { background: #222; }
        #setupPanel .players-edit {
            width: 100%;
            max-width: 650px;
            margin: 6px 0;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.06);
        }
        #setupPanel .players-edit .player-stat {
            display: inline-block;
            width: 52px;
            text-align: center;
            font-size: 10px;
            margin: 1px 2px;
            background: rgba(0,0,0,0.3);
            padding: 2px 3px;
            border-radius: 3px;
        }
        #setupPanel .players-edit .player-stat input {
            width: 34px;
            padding: 1px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 10px;
            text-align: center;
        }
        #setupPanel .btn {
            padding: 8px 35px;
            font-size: 18px;
            background: #ffdd44;
            color: #222;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 0 30px rgba(255,200,0,0.15);
        }
        #setupPanel .btn:hover { background: #ffcc22; transform: scale(1.02); }
        #resultScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            border-radius: 16px;
        }
        #resultScreen h1 { font-size: 40px; margin-bottom: 8px; }
        #resultScreen .sub { font-size: 20px; color: #aaa; }
        #resultScreen .btn {
            padding: 10px 35px;
            font-size: 18px;
            background: #ffdd44;
            color: #222;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.2s;
        }
        #resultScreen .btn:hover { background: #ffcc22; transform: scale(1.02); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        @media (max-width: 900px) {
            #gameWrapper { flex-direction: column; align-items: center; }
            #infoPanel { width: 100%; max-width: 700px; min-height: auto; max-height: 200px; }
            #gameContainer { width: 100%; max-width: 700px; height: 75vw; max-height: 600px; }
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <!-- 情報パネル -->
    <div id="infoPanel">
        <div class="section">
            <div class="team-title blue">🔵 青 (味方)</div>
            <div id="blueInfoList"></div>
            <div class="param-label">┈ パラメータ ┈</div>
            <div id="blueParamList"></div>
        </div>
        <div class="section" style="border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
            <div class="team-title red">🔴 赤 (敵)</div>
            <div id="redInfoList"></div>
            <div class="param-label">┈ パラメータ ┈</div>
            <div id="redParamList"></div>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameContainer">
        <div id="pitch">
            <div class="center-circle"></div>
            <div class="center-line"></div>
            <div class="penalty-area-top"></div>
            <div class="penalty-area-bottom"></div>
            <div class="goal-top"></div>
            <div class="goal-bottom"></div>
            <div id="scoreboard">
                <span id="scoreRed">0</span>
                <span style="color:#888;">-</span>
                <span id="scoreBlue">0</span>
            </div>
            <div id="timer">2:00</div>
            <div id="ball" class="ball" style="left:345px; top:295px;"></div>
        </div>

        <!-- セットアップ画面 -->
        <div id="setupPanel">
            <h1>⚽ サッカー観戦</h1>
            <div class="form-row">
                <div class="form-group">
                    <label>🔵 味方フォーメーション</label>
                    <select id="blueFormation">
                        <option value="0">フォーメーションA (4-3-3)</option>
                        <option value="1">フォーメーションB (4-4-2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>🔴 敵フォーメーション</label>
                    <select id="redFormation">
                        <option value="random">ランダム</option>
                        <option value="0">フォーメーションA</option>
                        <option value="1">フォーメーションB</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1; min-width:220px;">
                    <label>🔵 味方パラメータ</label>
                    <select id="blueParamMode">
                        <option value="random">ランダム (0〜100)</option>
                        <option value="edit">手動編集</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1; min-width:220px;">
                    <label>🔴 敵パラメータ</label>
                    <select id="redParamMode">
                        <option value="random">ランダム (0〜100)</option>
                        <option value="edit">手動編集</option>
                    </select>
                </div>
            </div>
            <div id="blueEditArea" class="players-edit" style="display:none;">
                <div style="font-size:11px; color:#88bbff; margin-bottom:3px;">🔵 味方選手パラメータ (0〜100)</div>
                <div id="blueEditContainer"></div>
            </div>
            <div id="redEditArea" class="players-edit" style="display:none;">
                <div style="font-size:11px; color:#ff8888; margin-bottom:3px;">🔴 敵選手パラメータ (0〜100)</div>
                <div id="redEditContainer"></div>
            </div>
            <button class="btn" id="startGameBtn">試合開始</button>
            <div style="margin-top:6px; font-size:11px; color:#666;">※ GKは固定50、背番号表示</div>
        </div>

        <!-- 結果画面 -->
        <div id="resultScreen">
            <h1 id="resultTitle">🏆 結果</h1>
            <div class="sub" id="resultSub">詳細</div>
            <button class="btn" id="goToOomph">➡ oomph.html へ</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// サッカー観戦ゲーム - 背番号・情報パネル対応版
// ============================================================

// ---------- 定数 ----------
const PLAYER_RADIUS = 15;
const BALL_RADIUS = 5;
const FIELD_W = 700;
const FIELD_H = 600;
const GOAL_TOP_Y = 3;
const GOAL_BOTTOM_Y = FIELD_H - 3;
const GOAL_WIDTH = 50;
const GOAL_CENTER_X = FIELD_W / 2;

// 背番号マッピング (ポジション→背番号)
const SHIRT_NUMBERS = {
    'GK': 1, 'RSB': 2, 'CB': 3, 'CB2': 4, 'LSB': 5,
    'CMF': 6, 'CMF2': 7, 'OMF': 8, 'RWG': 9, 'ST': 10, 'CF': 11,
    // フォーメーションB用
    'LWG': 9, 'CF': 11
};

// ポジション名表示 (情報パネル用)
const POS_NAME = {
    'GK': 'GK', 'RSB': 'RSB', 'CB': 'CB', 'CB2': 'CB', 'LSB': 'LSB',
    'CMF': 'CMF', 'CMF2': 'CMF', 'OMF': 'OMF',
    'RWG': 'RWG', 'LWG': 'LWG', 'ST': 'ST', 'CF': 'CF'
};

// フォーメーション定義 (背番号順に表示するための順序)
const POS_ORDER_BLUE_A = ['GK','LSB','CB','CB2','RSB','CMF','CMF2','OMF','LWG','ST','RWG'];
const POS_ORDER_BLUE_B = ['GK','LSB','CB','CB2','RSB','CMF','CMF2','LWG','OMF','RWG','CF'];
const POS_ORDER_RED_A = ['GK','RSB','CB','CB2','LSB','CMF','CMF2','OMF','RWG','ST','LWG'];
const POS_ORDER_RED_B = ['GK','RSB','CB','CB2','LSB','CMF','CMF2','RWG','OMF','LWG','CF'];

const FORMATIONS = {
    0: {
        blue: {
            GK:  { x: 0.50, y: 0.93 },
            LSB: { x: 0.20, y: 0.78 },
            CB:  { x: 0.40, y: 0.85 },
            CB2: { x: 0.60, y: 0.85 },
            RSB: { x: 0.80, y: 0.78 },
            CMF: { x: 0.35, y: 0.60 },
            CMF2:{ x: 0.65, y: 0.60 },
            OMF: { x: 0.50, y: 0.42 },
            LWG: { x: 0.20, y: 0.30 },
            ST:  { x: 0.50, y: 0.18 },
            RWG: { x: 0.80, y: 0.30 },
        },
        red: {
            GK:  { x: 0.50, y: 0.07 },
            RSB: { x: 0.80, y: 0.22 },
            CB:  { x: 0.60, y: 0.15 },
            CB2: { x: 0.40, y: 0.15 },
            LSB: { x: 0.20, y: 0.22 },
            CMF: { x: 0.65, y: 0.40 },
            CMF2:{ x: 0.35, y: 0.40 },
            OMF: { x: 0.50, y: 0.58 },
            RWG: { x: 0.80, y: 0.70 },
            ST:  { x: 0.50, y: 0.82 },
            LWG: { x: 0.20, y: 0.70 },
        }
    },
    1: {
        blue: {
            GK:  { x: 0.50, y: 0.93 },
            LSB: { x: 0.18, y: 0.78 },
            CB:  { x: 0.35, y: 0.85 },
            CB2: { x: 0.65, y: 0.85 },
            RSB: { x: 0.82, y: 0.78 },
            CMF: { x: 0.35, y: 0.62 },
            CMF2:{ x: 0.65, y: 0.62 },
            LWG: { x: 0.15, y: 0.40 },
            OMF: { x: 0.50, y: 0.45 },
            RWG: { x: 0.85, y: 0.40 },
            CF:  { x: 0.50, y: 0.18 },
        },
        red: {
            GK:  { x: 0.50, y: 0.07 },
            RSB: { x: 0.82, y: 0.22 },
            CB:  { x: 0.65, y: 0.15 },
            CB2: { x: 0.35, y: 0.15 },
            LSB: { x: 0.18, y: 0.22 },
            CMF: { x: 0.65, y: 0.38 },
            CMF2:{ x: 0.35, y: 0.38 },
            RWG: { x: 0.85, y: 0.60 },
            OMF: { x: 0.50, y: 0.55 },
            LWG: { x: 0.15, y: 0.60 },
            CF:  { x: 0.50, y: 0.82 },
        }
    }
};

// ---------- 状態 ----------
let gameState = {
    scoreRed: 0,
    scoreBlue: 0,
    timeSeconds: 120,
    gameActive: false,
    intervalId: null,
    animFrameId: null,
    players: [],
    ball: { x: FIELD_W/2, y: FIELD_H/2, vx: 0, vy: 0 },
    formationBlue: 0,
    formationRed: 0,
    paramsBlue: [],
    paramsRed: [],
    posOrderBlue: POS_ORDER_BLUE_A,
    posOrderRed: POS_ORDER_RED_A,
    tick: 0,
    goalCooldown: 0,
    gameEnded: false,
};

// DOM参照
const pitch = document.getElementById('pitch');
const ballEl = document.getElementById('ball');
const scoreRedEl = document.getElementById('scoreRed');
const scoreBlueEl = document.getElementById('scoreBlue');
const timerEl = document.getElementById('timer');
const setupPanel = document.getElementById('setupPanel');
const resultScreen = document.getElementById('resultScreen');
const resultTitle = document.getElementById('resultTitle');
const resultSub = document.getElementById('resultSub');

// ---------- ユーティリティ ----------
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randf(min, max) { return Math.random() * (max - min) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function generateParams(count, isGK = false) {
    const p = [];
    for (let i = 0; i < count; i++) {
        if (isGK) p.push(50);
        else p.push(rand(0, 100));
    }
    return p;
}

function getPositions(formationKey, team) {
    const f = FORMATIONS[formationKey];
    if (!f) return FORMATIONS[0][team];
    return f[team];
}

function getShirtNumber(posKey) {
    return SHIRT_NUMBERS[posKey] || 99;
}

// ---------- 情報パネル更新 ----------
function updateInfoPanel() {
    const blueInfo = document.getElementById('blueInfoList');
    const blueParam = document.getElementById('blueParamList');
    const redInfo = document.getElementById('redInfoList');
    const redParam = document.getElementById('redParamList');
    
    // 青情報
    let blueInfoHTML = '';
    let blueParamHTML = '';
    const bluePlayers = gameState.players.filter(p => p.team === 'blue');
    const blueOrder = gameState.posOrderBlue;
    for (const pos of blueOrder) {
        const p = bluePlayers.find(pl => pl.id === pos);
        if (p) {
            const num = getShirtNumber(pos);
            const isGK = pos === 'GK';
            blueInfoHTML += `<div class="player-row blue-row"><span class="pos">${POS_NAME[pos]||pos}</span><span class="num ${isGK?'gk':''}">${num}</span></div>`;
            blueParamHTML += `<div class="player-row blue-row"><span class="pos">${num}</span><span class="param">${p.param}</span></div>`;
        }
    }
    blueInfo.innerHTML = blueInfoHTML;
    blueParam.innerHTML = blueParamHTML;
    
    // 赤情報
    let redInfoHTML = '';
    let redParamHTML = '';
    const redPlayers = gameState.players.filter(p => p.team === 'red');
    const redOrder = gameState.posOrderRed;
    for (const pos of redOrder) {
        const p = redPlayers.find(pl => pl.id === pos);
        if (p) {
            const num = getShirtNumber(pos);
            const isGK = pos === 'GK';
            redInfoHTML += `<div class="player-row red-row"><span class="pos">${POS_NAME[pos]||pos}</span><span class="num ${isGK?'gk':''}">${num}</span></div>`;
            redParamHTML += `<div class="player-row red-row"><span class="pos">${num}</span><span class="param">${p.param}</span></div>`;
        }
    }
    redInfo.innerHTML = redInfoHTML;
    redParam.innerHTML = redParamHTML;
}

// ---------- 選手作成 ----------
function createPlayers(formationKey, team, params, isRed) {
    const posMap = getPositions(formationKey, team);
    const keys = Object.keys(posMap);
    const players = [];
    const color = isRed ? 'red' : 'blue';
    let idx = 0;
    for (const key of keys) {
        const pos = posMap[key];
        const isGK = (key === 'GK');
        const param = params[idx] !== undefined ? params[idx] : (isGK ? 50 : 50);
        const num = getShirtNumber(key);
        players.push({
            id: key,
            x: pos.x * FIELD_W,
            y: pos.y * FIELD_H,
            targetX: pos.x * FIELD_W,
            targetY: pos.y * FIELD_H,
            param: param,
            isGK: isGK,
            team: team,
            color: color,
            shirtNum: num,
            posLabel: key,
            baseSpeed: 0.4 + (param / 100) * 1.6,
            physical: 0.2 + (param / 100) * 1.0,
            passSpeed: 0.3 + (param / 100) * 1.2,
            shootPower: 0.2 + (param / 100) * 1.5,
            dribbleSpeed: 0.3 + (param / 100) * 1.4,
            stamina: 0.5 + (param / 100) * 1.0,
            isDefender: ['LSB','RSB','CB','CB2'].includes(key),
            isMidfielder: ['CMF','CMF2','OMF'].includes(key),
            isForward: ['LWG','RWG','ST','CF'].includes(key),
        });
        idx++;
    }
    return players;
}

// ---------- 試合初期化 ----------
function initMatch(blueForm, redForm, blueParams, redParams) {
    document.querySelectorAll('.player').forEach(el => el.remove());
    
    // ポジション順序設定
    gameState.posOrderBlue = (blueForm === 0) ? POS_ORDER_BLUE_A : POS_ORDER_BLUE_B;
    gameState.posOrderRed = (redForm === 0) ? POS_ORDER_RED_A : POS_ORDER_RED_B;
    
    const firstAttack = Math.random() < 0.5 ? 'blue' : 'red';
    gameState.firstAttack = firstAttack;
    
    const redPlayers = createPlayers(redForm, 'red', redParams, true);
    const bluePlayers = createPlayers(blueForm, 'blue', blueParams, false);
    
    gameState.players = [...redPlayers, ...bluePlayers];
    gameState.formationBlue = blueForm;
    gameState.formationRed = redForm;
    gameState.paramsBlue = blueParams;
    gameState.paramsRed = redParams;
    gameState.scoreRed = 0;
    gameState.scoreBlue = 0;
    gameState.timeSeconds = 120;
    gameState.gameActive = true;
    gameState.gameEnded = false;
    gameState.goalCooldown = 0;
    gameState.tick = 0;
    gameState.ball.x = FIELD_W/2;
    gameState.ball.y = FIELD_H/2;
    gameState.ball.vx = 0;
    gameState.ball.vy = 0;
    
    scoreRedEl.textContent = '0';
    scoreBlueEl.textContent = '0';
    timerEl.textContent = '2:00';
    
    // 選手DOM追加
    for (const p of gameState.players) {
        const el = document.createElement('div');
        el.className = `player ${p.color}`;
        if (p.isGK) el.classList.add('gk');
        el.dataset.id = p.id;
        el.style.left = (p.x - PLAYER_RADIUS) + 'px';
        el.style.top = (p.y - PLAYER_RADIUS) + 'px';
        el.textContent = p.shirtNum;
        pitch.appendChild(el);
        p.el = el;
    }
    
    // 情報パネル更新
    updateInfoPanel();
    
    ballEl.style.left = (gameState.ball.x - BALL_RADIUS) + 'px';
    ballEl.style.top = (gameState.ball.y - BALL_RADIUS) + 'px';
    
    setupPanel.style.display = 'none';
    resultScreen.style.display = 'none';
    pitch.style.opacity = '1';
    
    if (gameState.intervalId) clearInterval(gameState.intervalId);
    gameState.intervalId = setInterval(gameTick, 1000);
    
    if (gameState.animFrameId) cancelAnimationFrame(gameState.animFrameId);
    gameLoop();
}

// ---------- ゲームループ ----------
function gameLoop() {
    if (!gameState.gameActive && !gameState.gameEnded) {
        gameState.animFrameId = requestAnimationFrame(gameLoop);
        return;
    }
    if (gameState.gameEnded) {
        gameState.animFrameId = requestAnimationFrame(gameLoop);
        return;
    }
    updatePhysics();
    render();
    gameState.animFrameId = requestAnimationFrame(gameLoop);
}

// ---------- 物理更新 ----------
function updatePhysics() {
    if (!gameState.gameActive || gameState.gameEnded) return;
    gameState.tick++;
    
    const ball = gameState.ball;
    const players = gameState.players;
    const dt = 0.016;
    const goalCooldown = gameState.goalCooldown;
    if (goalCooldown > 0) {
        gameState.goalCooldown -= dt;
        return;
    }
    
    ball.x += ball.vx * dt * 60;
    ball.y += ball.vy * dt * 60;
    ball.vx *= 0.98;
    ball.vy *= 0.98;
    
    if (ball.x < 10) { ball.x = 10; ball.vx *= -0.5; }
    if (ball.x > FIELD_W - 10) { ball.x = FIELD_W - 10; ball.vx *= -0.5; }
    if (ball.y < 25) {
        if (ball.x > GOAL_CENTER_X - GOAL_WIDTH/2 && ball.x < GOAL_CENTER_X + GOAL_WIDTH/2) {
            gameState.scoreBlue++;
            scoreBlueEl.textContent = gameState.scoreBlue;
            gameState.goalCooldown = 1.5;
            resetBall('blue');
            updateInfoPanel();
            return;
        } else {
            ball.y = 25; ball.vy *= -0.5;
        }
    }
    if (ball.y > FIELD_H - 25) {
        if (ball.x > GOAL_CENTER_X - GOAL_WIDTH/2 && ball.x < GOAL_CENTER_X + GOAL_WIDTH/2) {
            gameState.scoreRed++;
            scoreRedEl.textContent = gameState.scoreRed;
            gameState.goalCooldown = 1.5;
            resetBall('red');
            updateInfoPanel();
            return;
        } else {
            ball.y = FIELD_H - 25; ball.vy *= -0.5;
        }
    }
    
    const ballTarget = { x: ball.x, y: ball.y };
    for (const p of players) {
        const isRed = (p.color === 'red');
        const isBlue = (p.color === 'blue');
        let targetX = p.targetX;
        let targetY = p.targetY;
        
        const ballDist = dist(p, ballTarget);
        const isGK = p.isGK;
        if (isGK) {
            if (isRed) {
                targetX = GOAL_CENTER_X + (Math.random() - 0.5) * 25;
                targetY = 20 + Math.random() * 12;
            } else {
                targetX = GOAL_CENTER_X + (Math.random() - 0.5) * 25;
                targetY = FIELD_H - 20 - Math.random() * 12;
            }
            if (ballDist < 50) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                targetX = p.x + (dx / d) * 25;
                targetY = p.y + (dy / d) * 25;
                if (ballDist < 25) {
                    ball.vx += (p.x - ball.x) * 0.25;
                    ball.vy += (p.y - ball.y) * 0.25;
                }
            }
        } else {
            const isForward = p.isForward;
            const isDef = p.isDefender;
            
            let attackBias = 0.5;
            if (isRed) {
                attackBias = 0.6 + Math.random() * 0.2;
                if (isDef) attackBias = 0.4;
            } else {
                attackBias = 0.5 + (isForward ? 0.3 : 0);
                if (isDef) attackBias = 0.3;
            }
            
            if (ballDist < 130 && Math.random() < 0.7) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                const moveForce = 0.3 + (p.param / 200);
                targetX = p.x + (dx / d) * 35 * moveForce;
                targetY = p.y + (dy / d) * 35 * moveForce;
            } else {
                const homeX = p.targetX;
                const homeY = p.targetY;
                const homeDist = dist(p, {x: homeX, y: homeY});
                if (homeDist > 15) {
                    const dx = homeX - p.x;
                    const dy = homeY - p.y;
                    const d = Math.hypot(dx, dy) || 1;
                    targetX = p.x + (dx / d) * Math.min(12, homeDist * 0.3);
                    targetY = p.y + (dy / d) * Math.min(12, homeDist * 0.3);
                }
            }
            
            if (ballDist < 22 && !isGK) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                const power = 0.3 + (p.param / 150);
                if (isRed && p.y < 180 && Math.random() < 0.12) {
                    const goalX = GOAL_CENTER_X + (Math.random() - 0.5) * 35;
                    const goalY = 8;
                    const gdx = goalX - ball.x;
                    const gdy = goalY - ball.y;
                    const gd = Math.hypot(gdx, gdy) || 1;
                    ball.vx += (gdx / gd) * 5.5 * power;
                    ball.vy += (gdy / gd) * 5.5 * power;
                } else if (isBlue && p.y > 420 && Math.random() < 0.12) {
                    const goalX = GOAL_CENTER_X + (Math.random() - 0.5) * 35;
                    const goalY = FIELD_H - 8;
                    const gdx = goalX - ball.x;
                    const gdy = goalY - ball.y;
                    const gd = Math.hypot(gdx, gdy) || 1;
                    ball.vx += (gdx / gd) * 5.5 * power;
                    ball.vy += (gdy / gd) * 5.5 * power;
                } else {
                    let target = null;
                    let minDist = 999;
                    for (const other of players) {
                        if (other === p) continue;
                        if (other.color !== p.color) continue;
                        const d2 = dist(p, other);
                        if (d2 < minDist && d2 > 25) {
                            minDist = d2;
                            target = other;
                        }
                    }
                    if (target) {
                        const tdx = target.x - ball.x;
                        const tdy = target.y - ball.y;
                        const td = Math.hypot(tdx, tdy) || 1;
                        const passPow = 0.5 + (p.param / 120);
                        ball.vx += (tdx / td) * 4.5 * passPow;
                        ball.vy += (tdy / td) * 4.5 * passPow;
                    } else {
                        ball.vx += (Math.random() - 0.5) * 2.5;
                        ball.vy += (Math.random() - 0.5) * 2.5;
                    }
                }
                ball.x += (ball.x - p.x) * 0.2;
                ball.y += (ball.y - p.y) * 0.2;
            }
            
            if (ballDist < 18 && !isGK) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                const dribSpeed = 0.3 + (p.param / 120);
                if (d > 3) {
                    ball.vx += (dx / d) * 0.4 * dribSpeed;
                    ball.vy += (dy / d) * 0.4 * dribSpeed;
                }
            }
        }
        
        p.x += (targetX - p.x) * 0.08;
        p.y += (targetY - p.y) * 0.08;
        p.x = clamp(p.x, 5, FIELD_W - 5);
        p.y = clamp(p.y, 5, FIELD_H - 5);
        for (const other of players) {
            if (other === p) continue;
            if (other.color !== p.color) continue;
            const d = dist(p, other);
            if (d < 18) {
                const dx = p.x - other.x;
                const dy = p.y - other.y;
                const d2 = Math.hypot(dx, dy) || 1;
                const push = 0.3;
                p.x += (dx / d2) * push;
                p.y += (dy / d2) * push;
                other.x -= (dx / d2) * push;
                other.y -= (dy / d2) * push;
            }
        }
    }
    
    const maxSpeed = 11;
    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd > maxSpeed) {
        ball.vx = (ball.vx / spd) * maxSpeed;
        ball.vy = (ball.vy / spd) * maxSpeed;
    }
}

function resetBall(scorer) {
    const ball = gameState.ball;
    ball.x = FIELD_W / 2;
    ball.y = FIELD_H / 2;
    ball.vx = (scorer === 'red') ? 1 : -1;
    ball.vy = (scorer === 'red') ? -1 : 1;
}

// ---------- レンダリング ----------
function render() {
    const ball = gameState.ball;
    for (const p of gameState.players) {
        if (p.el) {
            p.el.style.left = (p.x - PLAYER_RADIUS) + 'px';
            p.el.style.top = (p.y - PLAYER_RADIUS) + 'px';
        }
    }
    ballEl.style.left = (ball.x - BALL_RADIUS) + 'px';
    ballEl.style.top = (ball.y - BALL_RADIUS) + 'px';
}

// ---------- タイマー ----------
function gameTick() {
    if (!gameState.gameActive || gameState.gameEnded) return;
    gameState.timeSeconds--;
    if (gameState.timeSeconds < 0) gameState.timeSeconds = 0;
    const mins = Math.floor(gameState.timeSeconds / 60);
    const secs = gameState.timeSeconds % 60;
    timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    
    if (gameState.timeSeconds <= 0) {
        endMatch();
    }
}

// ---------- 試合終了 ----------
function endMatch() {
    if (gameState.gameEnded) return;
    gameState.gameActive = false;
    gameState.gameEnded = true;
    if (gameState.intervalId) {
        clearInterval(gameState.intervalId);
        gameState.intervalId = null;
    }
    
    const r = gameState.scoreRed;
    const b = gameState.scoreBlue;
    let winner = '';
    let message = '';
    if (r > b) {
        winner = '🔴 赤 (敵) の勝利！';
        message = `赤 ${r} - ${b} 青`;
    } else if (b > r) {
        winner = '🔵 青 (味方) の勝利！';
        message = `青 ${b} - ${r} 赤`;
    } else {
        const coin = Math.random() < 0.5 ? 'red' : 'blue';
        if (coin === 'red') {
            winner = '🪙 コイントス: 🔴 赤 (敵) の勝ち！';
            message = `引き分け ${r}-${b} → 赤勝利`;
        } else {
            winner = '🪙 コイントス: 🔵 青 (味方) の勝ち！';
            message = `引き分け ${r}-${b} → 青勝利`;
        }
    }
    resultTitle.textContent = `🏁 試合終了`;
    resultSub.textContent = `${winner} (${message})`;
    resultScreen.style.display = 'flex';
    pitch.style.opacity = '0.3';
}

// ---------- oomph.htmlへ ----------
document.getElementById('goToOomph').addEventListener('click', function() {
    window.location.href = 'oomph.html';
});

// ---------- セットアップUI ----------
function setupUI() {
    const blueFormSel = document.getElementById('blueFormation');
    const redFormSel = document.getElementById('redFormation');
    const blueParamMode = document.getElementById('blueParamMode');
    const redParamMode = document.getElementById('redParamMode');
    const blueEditArea = document.getElementById('blueEditArea');
    const redEditArea = document.getElementById('redEditArea');
    const blueEditContainer = document.getElementById('blueEditContainer');
    const redEditContainer = document.getElementById('redEditContainer');
    
    const posListBlueA = ['GK','LSB','CB','CB2','RSB','CMF','CMF2','OMF','LWG','ST','RWG'];
    const posListBlueB = ['GK','LSB','CB','CB2','RSB','CMF','CMF2','LWG','OMF','RWG','CF'];
    const posListRedA = ['GK','RSB','CB','CB2','LSB','CMF','CMF2','OMF','RWG','ST','LWG'];
    const posListRedB = ['GK','RSB','CB','CB2','LSB','CMF','CMF2','RWG','OMF','LWG','CF'];
    
    function buildEditFields(container, posList, prefix, defaultParams) {
        container.innerHTML = '';
        for (let i = 0; i < posList.length; i++) {
            const div = document.createElement('div');
            div.className = 'player-stat';
            const num = getShirtNumber(posList[i]);
            const val = defaultParams && defaultParams[i] !== undefined ? defaultParams[i] : 50;
            div.innerHTML = `<span>${num}</span><input type="number" min="0" max="100" value="${val}" data-idx="${i}" data-prefix="${prefix}">`;
            container.appendChild(div);
        }
    }
    
    let defaultBlueParams = generateParams(11);
    let defaultRedParams = generateParams(11);
    defaultBlueParams[0] = 50;
    defaultRedParams[0] = 50;
    
    buildEditFields(blueEditContainer, posListBlueA, 'blue', defaultBlueParams);
    buildEditFields(redEditContainer, posListRedA, 'red', defaultRedParams);
    
    blueParamMode.addEventListener('change', function() {
        blueEditArea.style.display = (this.value === 'edit') ? 'block' : 'none';
    });
    redParamMode.addEventListener('change', function() {
        redEditArea.style.display = (this.value === 'edit') ? 'block' : 'none';
    });
    
    blueFormSel.addEventListener('change', function() {
        const val = parseInt(this.value);
        const list = (val === 0) ? posListBlueA : posListBlueB;
        const inputs = blueEditContainer.querySelectorAll('input');
        const vals = [];
        inputs.forEach(inp => vals.push(parseInt(inp.value) || 50));
        buildEditFields(blueEditContainer, list, 'blue', vals);
    });
    redFormSel.addEventListener('change', function() {
        const val = parseInt(this.value);
        const list = (val === 0) ? posListRedA : posListRedB;
        const inputs = redEditContainer.querySelectorAll('input');
        const vals = [];
        inputs.forEach(inp => vals.push(parseInt(inp.value) || 50));
        buildEditFields(redEditContainer, list, 'red', vals);
    });
    
    document.getElementById('startGameBtn').addEventListener('click', function() {
        let blueParams = [];
        let redParams = [];
        const blueMode = blueParamMode.value;
        const redMode = redParamMode.value;
        
        if (blueMode === 'random') {
            blueParams = generateParams(11);
            blueParams[0] = 50;
        } else {
            const inputs = blueEditContainer.querySelectorAll('input');
            inputs.forEach(inp => {
                let v = parseInt(inp.value);
                if (isNaN(v)) v = 50;
                blueParams.push(clamp(v, 0, 100));
            });
            while (blueParams.length < 11) blueParams.push(50);
            blueParams[0] = 50;
        }
        
        if (redMode === 'random') {
            redParams = generateParams(11);
            redParams[0] = 50;
        } else {
            const inputs = redEditContainer.querySelectorAll('input');
            inputs.forEach(inp => {
                let v = parseInt(inp.value);
                if (isNaN(v)) v = 50;
                redParams.push(clamp(v, 0, 100));
            });
            while (redParams.length < 11) redParams.push(50);
            redParams[0] = 50;
        }
        
        let blueForm = parseInt(blueFormSel.value);
        let redForm = parseInt(redFormSel.value);
        if (isNaN(blueForm)) blueForm = 0;
        if (isNaN(redForm) || redFormSel.value === 'random') {
            redForm = Math.random() < 0.5 ? 0 : 1;
        }
        
        initMatch(blueForm, redForm, blueParams, redParams);
    });
}

// ---------- 初期化 ----------
window.onload = function() {
    setupUI();
    document.getElementById('blueEditArea').style.display = 'none';
    document.getElementById('redEditArea').style.display = 'none';
};

window.addEventListener('beforeunload', function() {
    if (gameState.intervalId) clearInterval(gameState.intervalId);
    if (gameState.animFrameId) cancelAnimationFrame(gameState.animFrameId);
});

</script>
