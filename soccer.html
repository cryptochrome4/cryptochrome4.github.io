<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>サッカー観戦ゲーム</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a3d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: #2d8a2d;
            border: 8px solid #fff;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        #pitch {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* ピッチライン */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: none;
        }
        .center-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 100%;
            background: rgba(255,255,255,0.3);
            pointer-events: none;
        }
        .penalty-area-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 80px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: none;
            pointer-events: none;
        }
        .penalty-area-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 80px;
            border: 3px solid rgba(255,255,255,0.3);
            border-bottom: none;
            pointer-events: none;
        }
        .goal-top {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 12px;
            background: #fff;
            border-radius: 3px;
            pointer-events: none;
        }
        .goal-bottom {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 12px;
            background: #fff;
            border-radius: 3px;
            pointer-events: none;
        }
        .player {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.6);
            transition: all 0.15s ease;
            z-index: 2;
            cursor: default;
            user-select: none;
        }
        .player.blue { background: #2255dd; border-color: #88bbff; }
        .player.red { background: #dd2222; border-color: #ff8888; }
        .player.gk { background: #ffcc00; border-color: #fff; color: #000; }
        .player.blue.gk { background: #ffcc00; }
        .player.red.gk { background: #ffcc00; }
        .ball {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid #333;
            z-index: 3;
            transition: all 0.1s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            pointer-events: none;
        }
        #scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            display: flex;
            gap: 30px;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.3);
            pointer-events: none;
        }
        #timer {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            z-index: 10;
            border: 1px solid #0f0;
            pointer-events: none;
        }
        #setupPanel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
            border-radius: 20px;
        }
        #setupPanel h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ffdd44;
            text-shadow: 0 0 20px rgba(255,200,0,0.3);
        }
        #setupPanel .form-row {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0;
            width: 100%;
            max-width: 700px;
        }
        #setupPanel .form-group {
            background: rgba(255,255,255,0.08);
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 200px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #setupPanel .form-group label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 6px;
        }
        #setupPanel .form-group select, 
        #setupPanel .form-group input {
            width: 100%;
            padding: 6px 10px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 14px;
        }
        #setupPanel .form-group select option { background: #222; }
        #setupPanel .players-edit {
            width: 100%;
            max-width: 700px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.08);
        }
        #setupPanel .players-edit .player-stat {
            display: inline-block;
            width: 60px;
            text-align: center;
            font-size: 11px;
            margin: 2px 4px;
            background: rgba(0,0,0,0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }
        #setupPanel .players-edit .player-stat input {
            width: 40px;
            padding: 2px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 11px;
            text-align: center;
        }
        #setupPanel .btn {
            padding: 10px 40px;
            font-size: 20px;
            background: #ffdd44;
            color: #222;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.2s;
            box-shadow: 0 0 30px rgba(255,200,0,0.2);
        }
        #setupPanel .btn:hover { background: #ffcc22; transform: scale(1.03); }
        #resultScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            border-radius: 20px;
        }
        #resultScreen h1 { font-size: 48px; margin-bottom: 10px; }
        #resultScreen .sub { font-size: 24px; color: #aaa; }
        #resultScreen .btn {
            padding: 12px 40px;
            font-size: 20px;
            background: #ffdd44;
            color: #222;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 25px;
            transition: 0.2s;
        }
        #resultScreen .btn:hover { background: #ffcc22; transform: scale(1.03); }
        .param-label { font-size: 9px; opacity: 0.7; }
        .pos-label { font-size: 7px; font-weight: bold; line-height: 1; }
        #debugInfo { position: absolute; bottom: 5px; left: 10px; color: rgba(255,255,255,0.3); font-size: 10px; z-index: 1; pointer-events: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
        @media (max-width: 820px) {
            #gameContainer { width: 100vw; height: 75vw; max-height: 100vh; }
            #setupPanel .form-row { flex-direction: column; align-items: center; gap: 10px; }
            #setupPanel .form-group { width: 90%; }
            #setupPanel .players-edit { max-height: 100px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="pitch">
        <div class="center-circle"></div>
        <div class="center-line"></div>
        <div class="penalty-area-top"></div>
        <div class="penalty-area-bottom"></div>
        <div class="goal-top"></div>
        <div class="goal-bottom"></div>
        <div id="scoreboard">
            <span id="scoreRed">0</span>
            <span style="color:#888;">-</span>
            <span id="scoreBlue">0</span>
        </div>
        <div id="timer">2:00</div>
        <div id="debugInfo"></div>
        <div id="ball" class="ball" style="left:390px; top:290px;"></div>
    </div>

    <!-- セットアップ画面 -->
    <div id="setupPanel">
        <h1>⚽ サッカー観戦</h1>
        <div class="form-row">
            <div class="form-group">
                <label>🔵 味方フォーメーション</label>
                <select id="blueFormation">
                    <option value="0">フォーメーションA (4-3-3)</option>
                    <option value="1">フォーメーションB (4-4-2)</option>
                </select>
            </div>
            <div class="form-group">
                <label>🔴 敵フォーメーション</label>
                <select id="redFormation">
                    <option value="random">ランダム</option>
                    <option value="0">フォーメーションA</option>
                    <option value="1">フォーメーションB</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group" style="flex:1; min-width:250px;">
                <label>🔵 味方パラメータ</label>
                <select id="blueParamMode">
                    <option value="random">ランダム (0〜100)</option>
                    <option value="edit">手動編集</option>
                </select>
            </div>
            <div class="form-group" style="flex:1; min-width:250px;">
                <label>🔴 敵パラメータ</label>
                <select id="redParamMode">
                    <option value="random">ランダム (0〜100)</option>
                    <option value="edit">手動編集</option>
                </select>
            </div>
        </div>
        <div id="blueEditArea" class="players-edit" style="display:none;">
            <div style="font-size:12px; color:#88bbff; margin-bottom:4px;">🔵 味方選手パラメータ (0〜100)</div>
            <div id="blueEditContainer"></div>
        </div>
        <div id="redEditArea" class="players-edit" style="display:none;">
            <div style="font-size:12px; color:#ff8888; margin-bottom:4px;">🔴 敵選手パラメータ (0〜100)</div>
            <div id="redEditContainer"></div>
        </div>
        <button class="btn" id="startGameBtn">試合開始</button>
        <div style="margin-top:10px; font-size:12px; color:#666;">※ GKは固定50、ポジション名表示</div>
    </div>

    <!-- 結果画面 -->
    <div id="resultScreen">
        <h1 id="resultTitle">🏆 結果</h1>
        <div class="sub" id="resultSub">詳細</div>
        <button class="btn" id="goToOomph">➡ oomph.html へ</button>
    </div>
</div>

<script>
// ============================================================
// 2013年対応 シンプルサッカー観戦ゲーム
// ============================================================

// ---------- 定数 ----------
const PLAYER_RADIUS = 14;
const BALL_RADIUS = 6;
const FIELD_W = 800;
const FIELD_H = 600;
const GOAL_TOP_Y = 5;
const GOAL_BOTTOM_Y = FIELD_H - 5;
const GOAL_WIDTH = 60;
const GOAL_CENTER_X = FIELD_W / 2;

// ポジション定義 (フォーメーションごと)
const FORMATIONS = {
    // フォーメーションA: 4-3-3
    0: {
        blue: {
            GK:  { x: 0.50, y: 0.93 },
            LSB: { x: 0.20, y: 0.78 },
            CB:  { x: 0.40, y: 0.85 },
            CB2: { x: 0.60, y: 0.85 },
            RSB: { x: 0.80, y: 0.78 },
            CMF: { x: 0.35, y: 0.60 },
            CMF2:{ x: 0.65, y: 0.60 },
            OMF: { x: 0.50, y: 0.42 },
            LWG: { x: 0.20, y: 0.30 },
            ST:  { x: 0.50, y: 0.18 },
            RWG: { x: 0.80, y: 0.30 },
        },
        red: {
            GK:  { x: 0.50, y: 0.07 },
            RSB: { x: 0.80, y: 0.22 },
            CB:  { x: 0.60, y: 0.15 },
            CB2: { x: 0.40, y: 0.15 },
            LSB: { x: 0.20, y: 0.22 },
            CMF: { x: 0.65, y: 0.40 },
            CMF2:{ x: 0.35, y: 0.40 },
            OMF: { x: 0.50, y: 0.58 },
            RWG: { x: 0.80, y: 0.70 },
            ST:  { x: 0.50, y: 0.82 },
            LWG: { x: 0.20, y: 0.70 },
        }
    },
    // フォーメーションB: 4-4-2
    1: {
        blue: {
            GK:  { x: 0.50, y: 0.93 },
            LSB: { x: 0.18, y: 0.78 },
            CB:  { x: 0.35, y: 0.85 },
            CB2: { x: 0.65, y: 0.85 },
            RSB: { x: 0.82, y: 0.78 },
            CMF: { x: 0.35, y: 0.62 },
            CMF2:{ x: 0.65, y: 0.62 },
            LWG: { x: 0.15, y: 0.40 },
            OMF: { x: 0.50, y: 0.45 },
            RWG: { x: 0.85, y: 0.40 },
            CF:  { x: 0.50, y: 0.18 },
        },
        red: {
            GK:  { x: 0.50, y: 0.07 },
            RSB: { x: 0.82, y: 0.22 },
            CB:  { x: 0.65, y: 0.15 },
            CB2: { x: 0.35, y: 0.15 },
            LSB: { x: 0.18, y: 0.22 },
            CMF: { x: 0.65, y: 0.38 },
            CMF2:{ x: 0.35, y: 0.38 },
            RWG: { x: 0.85, y: 0.60 },
            OMF: { x: 0.50, y: 0.55 },
            LWG: { x: 0.15, y: 0.60 },
            CF:  { x: 0.50, y: 0.82 },
        }
    }
};

// ポジション名表示用
const POS_DISPLAY = {
    GK: 'GK', LSB: 'LSB', CB: 'CB', CB2: 'CB', RSB: 'RSB',
    CMF: 'CMF', CMF2: 'CMF', OMF: 'OMF',
    LWG: 'LWG', RWG: 'RWG', ST: 'ST', CF: 'CF'
};

// ---------- 状態 ----------
let gameState = {
    scoreRed: 0,
    scoreBlue: 0,
    timeSeconds: 120, // 2:00
    gameActive: false,
    intervalId: null,
    animFrameId: null,
    players: [],
    ball: { x: FIELD_W/2, y: FIELD_H/2, vx: 0, vy: 0, dx: 0, dy: 0 },
    formationBlue: 0,
    formationRed: 0,
    paramsBlue: [],
    paramsRed: [],
    teamNames: ['赤', '青'],
    tick: 0,
    goalCooldown: 0,
    gameEnded: false,
};

// DOM参照
const pitch = document.getElementById('pitch');
const ballEl = document.getElementById('ball');
const scoreRedEl = document.getElementById('scoreRed');
const scoreBlueEl = document.getElementById('scoreBlue');
const timerEl = document.getElementById('timer');
const setupPanel = document.getElementById('setupPanel');
const resultScreen = document.getElementById('resultScreen');
const resultTitle = document.getElementById('resultTitle');
const resultSub = document.getElementById('resultSub');
const debugInfo = document.getElementById('debugInfo');

// ---------- ユーティリティ ----------
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randf(min, max) { return Math.random() * (max - min) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// ---------- パラメータ生成 ----------
function generateParams(count, isGK = false) {
    const p = [];
    for (let i = 0; i < count; i++) {
        if (isGK) p.push(50);
        else p.push(rand(0, 100));
    }
    return p;
}

function getPositions(formationKey, team) {
    const f = FORMATIONS[formationKey];
    if (!f) return FORMATIONS[0][team];
    return f[team];
}

// 選手オブジェクト作成
function createPlayers(formationKey, team, params, isRed) {
    const posMap = getPositions(formationKey, team);
    const keys = Object.keys(posMap);
    const players = [];
    const color = isRed ? 'red' : 'blue';
    let idx = 0;
    for (const key of keys) {
        const pos = posMap[key];
        const isGK = (key === 'GK');
        const param = params[idx] !== undefined ? params[idx] : (isGK ? 50 : 50);
        players.push({
            id: key,
            x: pos.x * FIELD_W,
            y: pos.y * FIELD_H,
            targetX: pos.x * FIELD_W,
            targetY: pos.y * FIELD_H,
            param: param,
            isGK: isGK,
            team: team,
            color: color,
            posLabel: POS_DISPLAY[key] || key,
            speed: 0,
            baseSpeed: 0.4 + (param / 100) * 1.6,
            physical: 0.2 + (param / 100) * 1.0,
            passSpeed: 0.3 + (param / 100) * 1.2,
            shootPower: 0.2 + (param / 100) * 1.5,
            dribbleSpeed: 0.3 + (param / 100) * 1.4,
            stamina: 0.5 + (param / 100) * 1.0,
            // ポジション別特性 (簡易)
            isDefender: ['LSB','RSB','CB','CB2'].includes(key),
            isMidfielder: ['CMF','CMF2','OMF'].includes(key),
            isForward: ['LWG','RWG','ST','CF'].includes(key),
        });
        idx++;
    }
    return players;
}

// ---------- 試合初期化 ----------
function initMatch(blueForm, redForm, blueParams, redParams) {
    // 既存の選手を削除
    document.querySelectorAll('.player').forEach(el => el.remove());
    
    // 先攻後攻ランダム
    const firstAttack = Math.random() < 0.5 ? 'blue' : 'red';
    gameState.firstAttack = firstAttack;
    
    // 敵(赤) 作成
    const redPlayers = createPlayers(redForm, 'red', redParams, true);
    // 味方(青) 作成
    const bluePlayers = createPlayers(blueForm, 'blue', blueParams, false);
    
    gameState.players = [...redPlayers, ...bluePlayers];
    gameState.formationBlue = blueForm;
    gameState.formationRed = redForm;
    gameState.paramsBlue = blueParams;
    gameState.paramsRed = redParams;
    gameState.scoreRed = 0;
    gameState.scoreBlue = 0;
    gameState.timeSeconds = 120;
    gameState.gameActive = true;
    gameState.gameEnded = false;
    gameState.goalCooldown = 0;
    gameState.tick = 0;
    gameState.ball.x = FIELD_W/2;
    gameState.ball.y = FIELD_H/2;
    gameState.ball.vx = 0;
    gameState.ball.vy = 0;
    gameState.ball.dx = 0;
    gameState.ball.dy = 0;
    
    // スコア表示更新
    scoreRedEl.textContent = '0';
    scoreBlueEl.textContent = '0';
    timerEl.textContent = '2:00';
    
    // 選手をDOMに追加
    for (const p of gameState.players) {
        const el = document.createElement('div');
        el.className = `player ${p.color}`;
        if (p.isGK) el.classList.add('gk');
        el.dataset.id = p.id;
        el.style.left = (p.x - PLAYER_RADIUS) + 'px';
        el.style.top = (p.y - PLAYER_RADIUS) + 'px';
        // ポジション名+パラメータ表示
        el.innerHTML = `<span class="pos-label">${p.posLabel}</span><span class="param-label" style="display:block;font-size:6px;margin-top:-2px;">${p.param}</span>`;
        pitch.appendChild(el);
        p.el = el;
    }
    
    // ボール位置
    ballEl.style.left = (gameState.ball.x - BALL_RADIUS) + 'px';
    ballEl.style.top = (gameState.ball.y - BALL_RADIUS) + 'px';
    
    // セットアップ非表示
    setupPanel.style.display = 'none';
    resultScreen.style.display = 'none';
    
    // タイマー開始
    if (gameState.intervalId) clearInterval(gameState.intervalId);
    gameState.intervalId = setInterval(gameTick, 1000);
    
    // アニメーション開始
    if (gameState.animFrameId) cancelAnimationFrame(gameState.animFrameId);
    gameLoop();
}

// ---------- ゲームループ (アニメーション) ----------
function gameLoop() {
    if (!gameState.gameActive && !gameState.gameEnded) {
        gameState.animFrameId = requestAnimationFrame(gameLoop);
        return;
    }
    if (gameState.gameEnded) {
        // 結果表示中もアニメーション停止
        gameState.animFrameId = requestAnimationFrame(gameLoop);
        return;
    }
    updatePhysics();
    render();
    gameState.animFrameId = requestAnimationFrame(gameLoop);
}

// ---------- 物理更新 (簡易AI) ----------
function updatePhysics() {
    if (!gameState.gameActive || gameState.gameEnded) return;
    gameState.tick++;
    
    const ball = gameState.ball;
    const players = gameState.players;
    const dt = 0.016; // 固定
    const goalCooldown = gameState.goalCooldown;
    if (goalCooldown > 0) {
        gameState.goalCooldown -= dt;
        return;
    }
    
    // ボールの慣性
    ball.x += ball.vx * dt * 60;
    ball.y += ball.vy * dt * 60;
    ball.vx *= 0.98;
    ball.vy *= 0.98;
    
    // 壁反射 (フィールド境界)
    if (ball.x < 10) { ball.x = 10; ball.vx *= -0.5; }
    if (ball.x > FIELD_W - 10) { ball.x = FIELD_W - 10; ball.vx *= -0.5; }
    if (ball.y < 30) { 
        // ゴール判定 (赤側)
        if (ball.x > GOAL_CENTER_X - GOAL_WIDTH/2 && ball.x < GOAL_CENTER_X + GOAL_WIDTH/2) {
            // 青の得点
            gameState.scoreBlue++;
            scoreBlueEl.textContent = gameState.scoreBlue;
            gameState.goalCooldown = 1.5;
            resetBall('blue');
            return;
        } else {
            ball.y = 30; ball.vy *= -0.5;
        }
    }
    if (ball.y > FIELD_H - 30) {
        if (ball.x > GOAL_CENTER_X - GOAL_WIDTH/2 && ball.x < GOAL_CENTER_X + GOAL_WIDTH/2) {
            // 赤の得点
            gameState.scoreRed++;
            scoreRedEl.textContent = gameState.scoreRed;
            gameState.goalCooldown = 1.5;
            resetBall('red');
            return;
        } else {
            ball.y = FIELD_H - 30; ball.vy *= -0.5;
        }
    }
    
    // 選手の動き (シンプルなAI)
    const ballTarget = { x: ball.x, y: ball.y };
    for (const p of players) {
        // ボールに近づく (チームごと)
        const isRed = (p.color === 'red');
        const isBlue = (p.color === 'blue');
        let targetX = p.targetX;
        let targetY = p.targetY;
        
        // 攻撃/守備の振る舞い
        const ballDist = dist(p, ballTarget);
        const isGK = p.isGK;
        if (isGK) {
            // GKはゴールライン付近に
            if (isRed) {
                targetX = GOAL_CENTER_X + (Math.random() - 0.5) * 30;
                targetY = 25 + Math.random() * 15;
            } else {
                targetX = GOAL_CENTER_X + (Math.random() - 0.5) * 30;
                targetY = FIELD_H - 25 - Math.random() * 15;
            }
            // ボールが近ければセーブ動作
            if (ballDist < 60) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                targetX = p.x + (dx / d) * 30;
                targetY = p.y + (dy / d) * 30;
                // ボールをはじく
                if (ballDist < 30) {
                    ball.vx += (p.x - ball.x) * 0.2;
                    ball.vy += (p.y - ball.y) * 0.2;
                }
            }
        } else {
            // フィールドプレイヤー
            const isForward = p.isForward;
            const isMid = p.isMidfielder;
            const isDef = p.isDefender;
            
            // オフェンス/ディフェンスのバランス
            let attackBias = 0.5;
            if (isRed) {
                // 敵は攻撃的に
                attackBias = 0.6 + Math.random() * 0.2;
                if (isDef) attackBias = 0.4;
            } else {
                // 味方はバランス
                attackBias = 0.5 + (isForward ? 0.3 : 0);
                if (isDef) attackBias = 0.3;
            }
            
            // ボールに向かう
            if (ballDist < 150 && Math.random() < 0.7) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                const moveForce = 0.3 + (p.param / 200);
                targetX = p.x + (dx / d) * 40 * moveForce;
                targetY = p.y + (dy / d) * 40 * moveForce;
            } else {
                // ポジションに戻る傾向
                const homeX = p.targetX;
                const homeY = p.targetY;
                const homeDist = dist(p, {x: homeX, y: homeY});
                if (homeDist > 20) {
                    const dx = homeX - p.x;
                    const dy = homeY - p.y;
                    const d = Math.hypot(dx, dy) || 1;
                    targetX = p.x + (dx / d) * Math.min(15, homeDist * 0.3);
                    targetY = p.y + (dy / d) * Math.min(15, homeDist * 0.3);
                }
            }
            
            // ボールを奪う/パス
            if (ballDist < 25 && !isGK) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                // ボールを蹴る (パス/シュート)
                const power = 0.3 + (p.param / 150);
                // ゴールに向かってシュート (ゴールに近い場合)
                if (isRed && p.y < 200 && Math.random() < 0.15) {
                    // シュート
                    const goalX = GOAL_CENTER_X + (Math.random() - 0.5) * 40;
                    const goalY = 10;
                    const gdx = goalX - ball.x;
                    const gdy = goalY - ball.y;
                    const gd = Math.hypot(gdx, gdy) || 1;
                    ball.vx += (gdx / gd) * 6 * power;
                    ball.vy += (gdy / gd) * 6 * power;
                } else if (isBlue && p.y > 400 && Math.random() < 0.15) {
                    const goalX = GOAL_CENTER_X + (Math.random() - 0.5) * 40;
                    const goalY = FIELD_H - 10;
                    const gdx = goalX - ball.x;
                    const gdy = goalY - ball.y;
                    const gd = Math.hypot(gdx, gdy) || 1;
                    ball.vx += (gdx / gd) * 6 * power;
                    ball.vy += (gdy / gd) * 6 * power;
                } else {
                    // パス (味方に向けて)
                    let target = null;
                    let minDist = 999;
                    for (const other of players) {
                        if (other === p) continue;
                        if (other.color !== p.color) continue;
                        const d2 = dist(p, other);
                        if (d2 < minDist && d2 > 30) {
                            minDist = d2;
                            target = other;
                        }
                    }
                    if (target) {
                        const tdx = target.x - ball.x;
                        const tdy = target.y - ball.y;
                        const td = Math.hypot(tdx, tdy) || 1;
                        const passPow = 0.5 + (p.param / 120);
                        ball.vx += (tdx / td) * 5 * passPow;
                        ball.vy += (tdy / td) * 5 * passPow;
                    } else {
                        // 適当に蹴る
                        ball.vx += (Math.random() - 0.5) * 3;
                        ball.vy += (Math.random() - 0.5) * 3;
                    }
                }
                // ボールをはじく
                ball.x += (ball.x - p.x) * 0.2;
                ball.y += (ball.y - p.y) * 0.2;
            }
            
            // ドリブル (ボール保持)
            if (ballDist < 20 && !isGK) {
                // ボールを引き連れる
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const d = Math.hypot(dx, dy) || 1;
                const dribSpeed = 0.3 + (p.param / 120);
                if (d > 5) {
                    ball.vx += (dx / d) * 0.5 * dribSpeed;
                    ball.vy += (dy / d) * 0.5 * dribSpeed;
                }
            }
        }
        
        // 移動制限 + スムーズ
        p.x += (targetX - p.x) * 0.08;
        p.y += (targetY - p.y) * 0.08;
        p.x = clamp(p.x, 5, FIELD_W - 5);
        p.y = clamp(p.y, 5, FIELD_H - 5);
        // チームメイト同士の衝突
        for (const other of players) {
            if (other === p) continue;
            if (other.color !== p.color) continue;
            const d = dist(p, other);
            if (d < 20) {
                const dx = p.x - other.x;
                const dy = p.y - other.y;
                const d2 = Math.hypot(dx, dy) || 1;
                const push = 0.3;
                p.x += (dx / d2) * push;
                p.y += (dy / d2) * push;
                other.x -= (dx / d2) * push;
                other.y -= (dy / d2) * push;
            }
        }
    }
    
    // ボール速度制限
    const maxSpeed = 12;
    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd > maxSpeed) {
        ball.vx = (ball.vx / spd) * maxSpeed;
        ball.vy = (ball.vy / spd) * maxSpeed;
    }
}

function resetBall(scorer) {
    const ball = gameState.ball;
    ball.x = FIELD_W / 2;
    ball.y = FIELD_H / 2;
    ball.vx = (scorer === 'red') ? 1 : -1;
    ball.vy = (scorer === 'red') ? -1 : 1;
    // キックオフ
}

// ---------- レンダリング ----------
function render() {
    const ball = gameState.ball;
    // 選手更新
    for (const p of gameState.players) {
        if (p.el) {
            p.el.style.left = (p.x - PLAYER_RADIUS) + 'px';
            p.el.style.top = (p.y - PLAYER_RADIUS) + 'px';
            // 簡易回転なし
        }
    }
    // ボール
    ballEl.style.left = (ball.x - BALL_RADIUS) + 'px';
    ballEl.style.top = (ball.y - BALL_RADIUS) + 'px';
}

// ---------- タイマー ----------
function gameTick() {
    if (!gameState.gameActive || gameState.gameEnded) return;
    gameState.timeSeconds--;
    if (gameState.timeSeconds < 0) gameState.timeSeconds = 0;
    const mins = Math.floor(gameState.timeSeconds / 60);
    const secs = gameState.timeSeconds % 60;
    timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    
    if (gameState.timeSeconds <= 0) {
        // 試合終了
        endMatch();
    }
    // debugInfo.textContent = `赤:${gameState.scoreRed} 青:${gameState.scoreBlue} 残り:${gameState.timeSeconds}s`;
}

// ---------- 試合終了 ----------
function endMatch() {
    if (gameState.gameEnded) return;
    gameState.gameActive = false;
    gameState.gameEnded = true;
    if (gameState.intervalId) {
        clearInterval(gameState.intervalId);
        gameState.intervalId = null;
    }
    
    // 結果表示
    let winner = '';
    let message = '';
    const r = gameState.scoreRed;
    const b = gameState.scoreBlue;
    if (r > b) {
        winner = '🔴 赤 (敵) の勝利！';
        message = `赤 ${r} - ${b} 青`;
    } else if (b > r) {
        winner = '🔵 青 (味方) の勝利！';
        message = `青 ${b} - ${r} 赤`;
    } else {
        // 引き分け: コイントス
        const coin = Math.random() < 0.5 ? 'red' : 'blue';
        if (coin === 'red') {
            winner = '🪙 コイントス: 🔴 赤 (敵) の勝ち！';
            message = `引き分け ${r}-${b} → 赤勝利`;
        } else {
            winner = '🪙 コイントス: 🔵 青 (味方) の勝ち！';
            message = `引き分け ${r}-${b} → 青勝利`;
        }
    }
    resultTitle.textContent = `🏁 試合終了`;
    resultSub.textContent = `${winner} (${message})`;
    resultScreen.style.display = 'flex';
    
    // ゲーム画面を非表示にする (ピッチを暗く)
    pitch.style.opacity = '0.3';
}

// ---------- oomph.htmlへ ----------
document.getElementById('goToOomph').addEventListener('click', function() {
    window.location.href = 'oomph.html';
});

// ---------- セットアップUI ----------
function setupUI() {
    const blueFormSel = document.getElementById('blueFormation');
    const redFormSel = document.getElementById('redFormation');
    const blueParamMode = document.getElementById('blueParamMode');
    const redParamMode = document.getElementById('redParamMode');
    const blueEditArea = document.getElementById('blueEditArea');
    const redEditArea = document.getElementById('redEditArea');
    const blueEditContainer = document.getElementById('blueEditContainer');
    const redEditContainer = document.getElementById('redEditContainer');
    
    // ポジションリスト
    const posListBlue = ['GK','LSB','CB','CB2','RSB','CMF','CMF2','OMF','LWG','ST','RWG'];
    const posListRed = ['GK','RSB','CB','CB2','LSB','CMF','CMF2','OMF','RWG','ST','LWG'];
    
    function buildEditFields(container, posList, prefix, defaultParams) {
        container.innerHTML = '';
        for (let i = 0; i < posList.length; i++) {
            const div = document.createElement('div');
            div.className = 'player-stat';
            const val = defaultParams && defaultParams[i] !== undefined ? defaultParams[i] : 50;
            div.innerHTML = `<span>${posList[i]}</span><input type="number" min="0" max="100" value="${val}" data-idx="${i}" data-prefix="${prefix}">`;
            container.appendChild(div);
        }
    }
    
    // デフォルトパラメータ
    let defaultBlueParams = generateParams(11);
    let defaultRedParams = generateParams(11);
    defaultBlueParams[0] = 50; // GK
    defaultRedParams[0] = 50;
    
    buildEditFields(blueEditContainer, posListBlue, 'blue', defaultBlueParams);
    buildEditFields(redEditContainer, posListRed, 'red', defaultRedParams);
    
    // モード切り替え
    blueParamMode.addEventListener('change', function() {
        blueEditArea.style.display = (this.value === 'edit') ? 'block' : 'none';
    });
    redParamMode.addEventListener('change', function() {
        redEditArea.style.display = (this.value === 'edit') ? 'block' : 'none';
    });
    
    // フォーメーション変更でポジションリスト更新 (簡易)
    blueFormSel.addEventListener('change', function() {
        const val = parseInt(this.value);
        let list = (val === 0) ? ['GK','LSB','CB','CB2','RSB','CMF','CMF2','OMF','LWG','ST','RWG'] : ['GK','LSB','CB','CB2','RSB','CMF','CMF2','LWG','OMF','RWG','CF'];
        // 現在の値を保持
        const inputs = blueEditContainer.querySelectorAll('input');
        const vals = [];
        inputs.forEach(inp => vals.push(parseInt(inp.value) || 50));
        buildEditFields(blueEditContainer, list, 'blue', vals);
    });
    redFormSel.addEventListener('change', function() {
        const val = parseInt(this.value);
        let list = (val === 0) ? ['GK','RSB','CB','CB2','LSB','CMF','CMF2','OMF','RWG','ST','LWG'] : ['GK','RSB','CB','CB2','LSB','CMF','CMF2','RWG','OMF','LWG','CF'];
        const inputs = redEditContainer.querySelectorAll('input');
        const vals = [];
        inputs.forEach(inp => vals.push(parseInt(inp.value) || 50));
        buildEditFields(redEditContainer, list, 'red', vals);
    });
    
    // スタート
    document.getElementById('startGameBtn').addEventListener('click', function() {
        // パラメータ収集
        let blueParams = [];
        let redParams = [];
        const blueMode = blueParamMode.value;
        const redMode = redParamMode.value;
        
        if (blueMode === 'random') {
            blueParams = generateParams(11);
            blueParams[0] = 50;
        } else {
            const inputs = blueEditContainer.querySelectorAll('input');
            inputs.forEach(inp => {
                let v = parseInt(inp.value);
                if (isNaN(v)) v = 50;
                blueParams.push(clamp(v, 0, 100));
            });
            if (blueParams.length < 11) {
                while (blueParams.length < 11) blueParams.push(50);
            }
            blueParams[0] = 50;
        }
        
        if (redMode === 'random') {
            redParams = generateParams(11);
            redParams[0] = 50;
        } else {
            const inputs = redEditContainer.querySelectorAll('input');
            inputs.forEach(inp => {
                let v = parseInt(inp.value);
                if (isNaN(v)) v = 50;
                redParams.push(clamp(v, 0, 100));
            });
            if (redParams.length < 11) {
                while (redParams.length < 11) redParams.push(50);
            }
            redParams[0] = 50;
        }
        
        // フォーメーション
        let blueForm = parseInt(blueFormSel.value);
        let redForm = parseInt(redFormSel.value);
        if (isNaN(blueForm)) blueForm = 0;
        if (isNaN(redForm) || redFormSel.value === 'random') {
            redForm = Math.random() < 0.5 ? 0 : 1;
        }
        
        // 試合開始
        initMatch(blueForm, redForm, blueParams, redParams);
    });
}

// ---------- 初期化 ----------
window.onload = function() {
    setupUI();
    // デフォルト表示
    document.getElementById('blueEditArea').style.display = 'none';
    document.getElementById('redEditArea').style.display = 'none';
};

// ページ離脱時にタイマー停止
window.addEventListener('beforeunload', function() {
    if (gameState.intervalId) clearInterval(gameState.intervalId);
    if (gameState.animFrameId) cancelAnimationFrame(gameState.animFrameId);
});

</script>
