<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語圏の数字・通貨単位まとめ（millionthからquintillionまで）</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --bg-color: #f8fafc;
            --table-border: #e2e8f0;
            --text-color: #334155;
            --accent-blue: #eff6ff;
            --accent-red: #fff5f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            padding: 20px;
            margin: 0;
        }
        .table-container {
            max-width: 1000px;
            margin: 0 auto;
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            background: #ffffff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--table-border);
        }
        th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .unit-name {
            font-weight: bold;
        }
        .row-小数 {
            background-color: var(--accent-red);
        }
        .row-整数 {
            background-color: #ffffff;
        }
        .row-基準 {
            background-color: #f0fdf4;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }
        .badge-small { background-color: #fed7d7; color: #9b2c2c; }
        .badge-large { background-color: #cbe6ff; color: #004085; }
    </style>
</head>
<body>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>英語の単位</th>
                <th>数字の表記</th>
                <th>円（Core/補助通貨）</th>
                <th>ドル（Core/補助通貨/日本円換算目安）</th>
            </tr>
        </thead>
        <tbody>
            <!-- 小数の世界 -->
            <tr class="row-小数">
                <td class="unit-name">millionth <span class="badge badge-small">小数</span></td>
                <td>10<sup>-6</sup> (0.000001)</td>
                <td>百万分の一円（0.0001銭）</td>
                <td>1 millionth of a dollar（※理論上の最小単位）</td>
            </tr>
            <tr class="row-小数">
                <td class="unit-name">thousandth <span class="badge badge-small">小数</span></td>
                <td>10<sup>-3</sup> (0.001)</td>
                <td>千分の一円（0.1銭）</td>
                <td>1 mill（※米国の税計算などで使われる単位）</td>
            </tr>
            <tr class="row-小数">
                <td class="unit-name">hundredth <span class="badge badge-small">小数</span></td>
                <td>0.01</td>
                <td>1銭（※現在は一円玉に統合）</td>
                <td>1 cent（通称: Penny / 約1.6円）</td>
            </tr>
            <tr class="row-小数">
                <td class="unit-name">tenth <span class="badge badge-small">小数</span></td>
                <td>0.1</td>
                <td>10銭</td>
                <td>10 cents（通称: Dime / 約16円）</td>
            </tr>
