<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>元素サッカーポジション仕分け</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 15px;
            color: #333;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 {
            text-align: center;
            font-size: 1.3rem;
            margin: 10px 0 20px 0;
            color: #1d1d1f;
        }
        .btn-reset {
            display: block;
            width: 100%;
            max-width: 240px;
            margin: 0 auto 20px auto;
            padding: 12px;
            background-color: #ff3b30;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255,59,48,0.25);
            transition: opacity 0.1s;
        }
        .btn-reset:active {
            opacity: 0.7;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto 40px auto;
        }
        .group-box {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #e5e5e5;
        }
        .group-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e5e5e5;
            color: #1d1d1f;
        }
        /* 各グループごとのタイトルの左側の色を、画像ライクに強調可能（お好みで） */
        #group-nantes .group-title { border-bottom-color: #007aff; }
        #pool {
            background: #eef2f3;
            border: 2px dashed #b0bec5;
        }
        .elements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
            gap: 8px;
        }
        
        /* 元素ボタン全体のスタイル（画像のデザインに近いすっきりした長方形に統合） */
        .element-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 6px 6px 6px 8px;
            border-radius: 6px;
            border: 1px solid #d1d1d6;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            width: 100%;
            height: 34px;
        }
        .element-btn::after {
            content: "▼";
            font-size: 0.6rem;
            color: #8e8e93;
            margin-left: 4px;
        }
        
        /* メニューのハミ出し・隠れを完全に防ぐ（固定ポップアップ式） */
        .move-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 9999; /* 最前面に保証 */
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid #d1d1d6;
            padding: 4px;
            width: 130px;
            margin-top: 2px;
        }
        .move-menu button {
            display: block;
            width: 100%;
            padding: 8px;
            text-align: left;
            background: none;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 5px;
            color: #333;
        }
        .move-menu button:active {
            background: #f2f2f7;
            color: #007aff;
        }

        /* 画像のポジションに忠実な文字色（白背景用にコントラストを最適化） */
        .color-cf { color: #ff3b30; } /* CF: 赤 */
        .color-st { color: #ff2d55; } /* ST: ピンク (Fはここだけ) */
        .color-lwg { color: #ff9500; } /* LWG: オレンジ */
        .color-omf { color: #8e8e93; } /* OMF: グレー */
        .color-rwg { color: #af52de; } /* RWG: 紫 */
        .color-lmf { color: #34c759; } /* LMF: 黄緑 */
        .color-cmf { color: #24b04b; } /* CMF: 緑 */
        .color-rmf { color: #a25114; } /* RMF: 茶色 */
        .color-dmf { color: #000000; } /* DMF: 黒 */
        .color-lsb { color: #00c7be; text-shadow: 0 0 0.5px rgba(0,0,0,0.2); } /* LSB: 水色 */
        .color-cb { color: #555555; }  /* CB: 濃いグレー */
        .color-rsb { color: #007aff; } /* RSB: 青 */
        .color-gk { color: #ffcc00; text-shadow: 0 0 1px rgba(0,0,0,0.4); } /* GK: 黄色 */
    </style>
</head>

    <h1>118元素 サッカーポジション配置</h1>

        <div class="group-box" id="group-mercury"><div class="group-title">夜の水星</div><div class="elements-grid" id="list-mercury"></div></div>
        <div class="group-box" id="group-magnetic"><div class="group-title">磁場</div><div class="elements-grid" id="list-magnetic"></div></div>
        <div class="group-box" id="group-cyber"><div class="group-title">サイバーチーム</div><div class="elements-grid" id="list-cyber"></div></div>
