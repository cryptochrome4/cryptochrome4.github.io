<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仮面ライダー バトル</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
    color: white;
    user-select: none;
    padding: 10px;
  }

  #game-wrap { position: relative; width: 800px; max-width: 100%; }
  #game {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    background: linear-gradient(#1a0a2a 0%, #4a1a6a 60%, #2a0a1a 100%);
    border: 4px solid #ff3333;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,50,50,0.4);
  }
  #ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 20%;
    background: linear-gradient(#3a2a1a, #1a1008);
    border-top: 3px solid #ff3333;
  }

  .fighter {
    position: absolute;
    bottom: 20%;
    width: 7.5%;
    height: 30%;
    transition: bottom 0.15s, height 0.15s;
  }
  #player {
    background: linear-gradient(160deg, #ff2222 0%, #cc0000 40%, #1a1a1a 45%, #1a1a1a 100%);
    border-radius: 40% 40% 20% 20% / 30% 30% 10% 10%;
    box-shadow: inset -4px 0 8px rgba(0,0,0,0.5), 0 0 12px rgba(255,50,50,0.6);
    position: relative;
  }
  #player::before {
    content: '';
    position: absolute;
    top: 22%; left: 8%;
    width: 85%; height: 22%;
    background: radial-gradient(ellipse at center, #88ffff 0%, #00aacc 50%, #003355 100%);
    border-radius: 50% 50% 30% 30%;
    box-shadow: 0 0 8px #00ccff;
    border: 1px solid #000;
  }
  #player::after {
    content: '';
    position: absolute;
    bottom: 32%; left: 10%;
    width: 80%; height: 8%;
    background: linear-gradient(90deg, #ffcc00, #ffaa00);
    border-radius: 2px;
    box-shadow: 0 0 6px #ffcc00;
  }
  #enemy {
    background: linear-gradient(200deg, #8822ff 0%, #4411aa 40%, #1a1a1a 45%, #1a1a1a 100%);
    border-radius: 40% 40% 20% 20% / 30% 30% 10% 10%;
    box-shadow: inset 4px 0 8px rgba(0,0,0,0.5), 0 0 12px rgba(150,50,255,0.6);
    transform: scaleX(-1);
    position: relative;
  }
  #enemy::before {
    content: '';
    position: absolute;
    top: 22%; left: 8%;
    width: 85%; height: 22%;
    background: radial-gradient(ellipse at center, #ff88ff 0%, #cc00cc 50%, #550055 100%);
    border-radius: 50% 50% 30% 30%;
    box-shadow: 0 0 8px #ff00ff;
    border: 1px solid #000;
  }
  #enemy::after {
    content: '';
    position: absolute;
    bottom: 32%; left: 10%;
    width: 80%; height: 8%;
    background: linear-gradient(90deg, #cc00cc, #880088);
    border-radius: 2px;
    box-shadow: 0 0 6px #cc00cc;
  }

  .punching { transform: translateX(22px) !important; }
  #enemy.punching { transform: scaleX(-1) translateX(22px) !important; }
  .kicking { transform: translateX(30px) !important; filter: brightness(1.3); }
  #enemy.kicking { transform: scaleX(-1) translateX(-30px) !important; filter: brightness(1.3); }

  #player.jumping { bottom: 40%; height: 26%; }
  #player.crouching { height: 20%; }
  #enemy.jumping { bottom: 40%; height: 26%; }
  #enemy.crouching { height: 20%; }

  .hp-bar {
    position: absolute;
    top: 4%;
    width: 38%;
    height: 7%;
    background: #222;
    border: 2px solid #ff3333;
    border-radius: 4px;
    overflow: hidden;
  }
  #player-hp { left: 2%; }
  #enemy-hp { right: 2%; }
  .hp-fill {
    height: 100%;
    background: linear-gradient(#00ff00, #00aa00);
    transition: width 0.2s;
  }
  #enemy-hp .hp-fill { float: right; }

  .move-label {
    position: absolute;
    top: 13%;
    font-size: 13px;
    color: #ffcc00;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    opacity: 0;
    transition: opacity 0.2s;
    font-family: Arial, sans-serif;
  }
  #player-move { left: 2%; }
  #enemy-move { right: 2%; }
  .move-label.show { opacity: 1; }

  #message {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(24px, 5vw, 56px);
    font-weight: bold;
    text-shadow: 4px 4px 0 #000;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }

  #opening {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 18px;
    overflow: hidden;
  }
  #opening-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 0;
    opacity: 0.55;
  }
  #opening > *:not(#opening-bg) { position: relative; z-index: 1; }
  #opening h1 {
    font-size: clamp(26px, 5.5vw, 54px);
    margin: 0;
    background: linear-gradient(180deg, #ffffff, #ff2222);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 12px rgba(255,0,0,0.8);
    letter-spacing: 3px;
    animation: pulse 1.5s infinite alternate;
    text-align: center;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  #opening p.sub {
    margin: 0;
    color: #fff;
    font-size: clamp(11px, 2vw, 15px);
    font-family: Arial, sans-serif;
    text-shadow: 1px 1px 4px #000, 0 0 8px #000;
    text-align: center;
    padding: 0 10px;
  }
  .opening-buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .open-btn {
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(15px, 2.6vw, 22px);
    padding: 12px 36px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  #start-btn {
    background: linear-gradient(180deg, #ff2222, #cc0000);
    color: #fff;
    box-shadow: 0 6px 0 #660000, 0 8px 20px rgba(255,0,0,0.6);
  }
  #view-bg-btn {
    background: linear-gradient(180deg, #666, #333);
    color: #fff;
    box-shadow: 0 6px 0 #111, 0 8px 20px rgba(0,0,0,0.6);
  }
  .open-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #333; }
  .open-btn:hover { filter: brightness(1.15); }

  #bg-viewer {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  #bg-viewer.active { display: flex; }
  #bg-viewer img { width: 100%; height: 100%; object-fit: fill; }
  #close-bg {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(255,0,0,0.85);
    color: #fff;
    border: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 201;
    font-weight: bold;
  }

  #info-panel {
    width: 800px;
    max-width: 100%;
    margin-top: 14px;
    background: #16162a;
    border: 2px solid #3a3a5a;
    border-radius: 12px;
    padding: 12px;
  }
  #panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  #panel-header .title {
    font-size: 14px; color: #8a8ab0;
    font-family: Arial, sans-serif; letter-spacing: 1px;
  }
  #pad-selector {
    display: flex; gap: 6px;
    background: #0c0c18; padding: 4px; border-radius: 20px;
  }
  .pad-tab {
    font-family: Arial, sans-serif; font-size: 12px;
    padding: 6px 14px; border: none; border-radius: 16px;
    cursor: pointer; background: transparent; color: #8888aa; transition: all 0.15s;
  }
  .pad-tab.active {
    background: linear-gradient(180deg, #ff3355, #cc0022);
    color: #fff; font-weight: bold;
  }
  #pad-area {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; min-height: 170px;
  }

  .ctrl-btn {
    border: none; cursor: pointer;
    font-family: 'Arial Black', sans-serif;
    user-select: none; touch-action: none;
    transition: transform 0.08s, filter 0.08s;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn.pressed { transform: scale(0.92); filter: brightness(1.4); }

  .ps-layout { display: flex; width: 100%; align-items: center; justify-content: space-around; gap: 10px; }
  #dpad { position: relative; width: 130px; height: 130px; }
  .dpad-btn {
    position: absolute; width: 44px; height: 44px;
    background: linear-gradient(180deg, #3a3a55, #1a1a2a);
    border: 2px solid #5555aa; border-radius: 8px;
    color: #bbb; font-size: 16px;
  }
  .dpad-btn[data-dir="up"]    { left: 43px; top: 0; }
  .dpad-btn[data-dir="down"]  { left: 43px; bottom: 0; }
  .dpad-btn[data-dir="left"]  { left: 0; top: 43px; }
  .dpad-btn[data-dir="right"] { right: 0; top: 43px; }
  .dpad-center { position: absolute; left: 43px; top: 43px; width: 44px; height: 44px; background: #22223a; border-radius: 50%; }
  .ps-face-buttons { position: relative; width: 140px; height: 140px; }
  .ps-btn {
    position: absolute; width: 54px; height: 54px; border-radius: 50%;
    color: #fff; font-size: 18px; font-weight: bold;
    border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 0 rgba(0,0,0,0.5);
  }
  .ps-btn[data-btn="punch"] { left: 0; top: 43px; background: radial-gradient(circle at 35% 30%, #ffaaaa, #cc0000); }
  .ps-btn[data-btn="kick"]  { right: 0; top: 43px; background: radial-gradient(circle at 35% 30%, #aaccff, #0044dd); }

  .arcade-layout { display: flex; width: 100%; align-items: center; justify-content: space-around; }
  #lever-base { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
  #lever-dirs { position: relative; width: 130px; height: 130px; }
  .lever-dir {
    position: absolute; width: 42px; height: 42px;
    background: #2a2a44; border: 2px solid #5555aa; border-radius: 8px;
    color: #aaaaff; font-size: 18px;
  }
  .lever-dir[data-dir="left"]  { left: 0; top: 44px; }
  .lever-dir[data-dir="right"] { right: 0; top: 44px; }
  .lever-dir[data-dir="up"]    { left: 44px; top: 0; }
  .lever-dir[data-dir="down"]  { left: 44px; bottom: 0; }
  .arcade-buttons { display: flex; gap: 16px; align-items: center; }
  .arcade-btn {
    width: 74px; height: 74px; border-radius: 50%; color: #fff; font-size: 16px;
    border: 3px solid rgba(255,255,255,0.4);
    box-shadow: 0 6px 0 rgba(0,0,0,0.5), inset 0 -6px 12px rgba(0,0,0,0.4);
  }
  .arcade-btn.punch { background: radial-gradient(circle at 35% 30%, #ff8888, #cc0000); }
  .arcade-btn.kick  { background: radial-gradient(circle at 35% 30%, #88aaff, #0033cc); }

  .kbd-layout {
    display: flex; width: 100%; align-items: center; justify-content: space-around;
    gap: 10px; font-family: monospace;
  }
  .kbd-group { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .kbd-row { display: flex; gap: 8px; }
  .kbd-key {
    width: 52px; height: 52px;
    background: linear-gradient(180deg, #3a3a4a, #22222e);
    border: 2px solid #555; border-bottom-width: 5px;
    border-radius: 8px; color: #ddd; font-size: 15px; font-weight: bold;
  }
  .kbd-key.punch { color: #ff8888; }
  .kbd-key.kick  { color: #88aaff; }

  #hint {
    margin-top: 10px; font-size: 12px; color: #666688;
    text-align: center; font-family: Arial, sans-serif;
  }

  @media (max-width: 640px) {
    .lever-dir, .dpad-btn { width: 38px; height: 38px; }
    .lever-dir[data-dir="left"], .lever-dir[data-dir="right"] { top: 38px; }
    .lever-dir[data-dir="up"], .lever-dir[data-dir="down"] { left: 38px; }
    .dpad-btn[data-dir="up"], .dpad-btn[data-dir="down"] { left: 38px; }
    .dpad-btn[data-dir="left"], .dpad-btn[data-dir="right"] { top: 38px; }
    .arcade-btn { width: 58px; height: 58px; font-size: 13px; }
    .ps-btn { width: 46px; height: 46px; }
    #dpad, #lever-dirs { width: 114px; height: 114px; }
    .kbd-key { width: 40px; height: 40px; font-size: 12px; }
  }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="game">
    <div id="player-hp" class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
    <div id="enemy-hp" class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
    <div id="player-move" class="move-label"></div>
    <div id="enemy-move" class="move-label"></div>
    <div id="ground"></div>
    <div id="player" class="fighter"></div>
    <div id="enemy" class="fighter"></div>
    <div id="message"></div>

    <div id="opening">
      <img id="opening-bg" src="img369rider.jpg" alt="背景">
      <h1>仮面ライダー<br>バトル</h1>
      <p class="sub">— 上:ジャンプ / 下:しゃがみ / パンチ・キックで戦え —</p>
      <div class="opening-buttons">
        <button id="start-btn" class="open-btn">はじめる</button>
        <button id="view-bg-btn" class="open-btn">背景を見る</button>
      </div>
      <div id="bg-viewer">
        <img src="img369rider.jpg" alt="背景拡大">
        <button id="close-bg">✕</button>
      </div>
    </div>
  </div>
</div>

<div id="info-panel">
  <div id="panel-header">
    <span class="title">▼ CONTROLLER</span>
    <div id="pad-selector">
      <button class="pad-tab active" data-pad="ps">プレステ</button>
      <button class="pad-tab" data-pad="arcade">ゲーセン</button>
      <button class="pad-tab" data-pad="kbd">キーボード</button>
    </div>
  </div>

  <div id="pad-area">
    <div class="ps-layout" id="pad-ps">
      <div id="dpad">
        <button class="ctrl-btn dpad-btn" data-dir="up">▲</button>
        <button class="ctrl-btn dpad-btn" data-dir="left">◀</button>
        <div class="dpad-center"></div>
        <button class="ctrl-btn dpad-btn" data-dir="right">▶</button>
        <button class="ctrl-btn dpad-btn" data-dir="down">▼</button>
      </div>
      <div class="ps-face-buttons">
        <button class="ctrl-btn ps-btn" data-btn="punch">✕</button>
        <button class="ctrl-btn ps-btn" data-btn="kick">□</button>
      </div>
    </div>

    <div class="arcade-layout" id="pad-arcade" style="display:none;">
      <div id="lever-base">
        <div id="lever-dirs">
          <button class="ctrl-btn lever-dir" data-dir="up">▲</button>
          <button class="ctrl-btn lever-dir" data-dir="left">◀</button>
          <button class="ctrl-btn lever-dir" data-dir="right">▶</button>
          <button class="ctrl-btn lever-dir" data-dir="down">▼</button>
        </div>
      </div>
      <div class="arcade-buttons">
        <button class="ctrl-btn arcade-btn punch" data-btn="punch">PUNCH</button>
        <button class="ctrl-btn arcade-btn kick" data-btn="kick">KICK</button>
      </div>
    </div>

    <div class="kbd-layout" id="pad-kbd" style="display:none;">
      <div class="kbd-group">
        <div class="kbd-row">
          <button class="ctrl-btn kbd-key" data-dir="up">W</button>
        </div>
        <div class="kbd-row">
          <button class="ctrl-btn kbd-key" data-dir="left">A</button>
          <button class="ctrl-btn kbd-key" data-dir="down">S</button>
          <button class="ctrl-btn kbd-key" data-dir="right">D</button>
        </div>
      </div>
      <div class="kbd-group">
        <div class="kbd-row">
          <button class="ctrl-btn kbd-key punch" data-btn="punch">J</button>
          <button class="ctrl-btn kbd-key kick" data-btn="kick">K</button>
        </div>
      </div>
    </div>
  </div>
  <div id="hint">クリック / タップ / 長押しで操作 ｜ ▲ジャンプ ▼しゃがみ（回避）</div>
</div>

<script>
const player = document.getElementById('player');
const enemy = document.getElementById('enemy');
const playerHpFill = document.querySelector('#player-hp .hp-fill');
const enemyHpFill  = document.querySelector('#enemy-hp .hp-fill');
const message = document.getElementById('message');
const opening = document.getElementById('opening');
const startBtn = document.getElementById('start-btn');
const viewBgBtn = document.getElementById('view-bg-btn');
const bgViewer = document.getElementById('bg-viewer');
const closeBg = document.getElementById('close-bg');
const playerMoveLbl = document.getElementById('player-move');
const enemyMoveLbl  = document.getElementById('enemy-move');

let playerHp = 100;
let enemyHp = 100;
let playerX = 150;
let enemyX = 590;
let gameOver = false;
let gameStarted = false;
let canAttack = true;

let playerJumping = false;
let playerCrouching = false;
let playerJumpTimer = 0;

let enemyJumping = false;
let enemyCrouching = false;
let enemyAttackCooldown = 0;
let enemyMoveTimer = 0;
let enemyNextAttack = 0;

const GAME_W = 800;
const MIN_DIST = 80;
const JUMP_FRAMES = 40;
const ATTACK_COOLDOWN = 18;

const keys = { left: false, right: false };

startBtn.addEventListener('click', () => {
  opening.style.display = 'none';
  gameStarted = true;
});
viewBgBtn.addEventListener('click', () => bgViewer.classList.add('active'));
closeBg.addEventListener('click', () => bgViewer.classList.remove('active'));

document.querySelectorAll('.pad-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.pad-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const pad = tab.dataset.pad;
    document.getElementById('pad-ps').style.display     = pad === 'ps'     ? 'flex' : 'none';
    document.getElementById('pad-arcade').style.display = pad === 'arcade' ? 'flex' : 'none';
    document.getElementById('pad-kbd').style.display    = pad === 'kbd'    ? 'flex' : 'none';
  });
});

document.querySelectorAll('[data-dir]').forEach(btn => {
  const dir = btn.dataset.dir;
  const on = (e) => {
    e.preventDefault();
    btn.classList.add('pressed');
    if (dir === 'left')  keys.left = true;
    if (dir === 'right') keys.right = true;
    if (dir === 'up')    doJump();
    if (dir === 'down')  doCrouch(true);
  };
  const off = (e) => {
    e.preventDefault();
    btn.classList.remove('pressed');
    if (dir === 'left')  keys.left = false;
    if (dir === 'right') keys.right = false;
    if (dir === 'down')  doCrouch(false);
  };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('pointercancel', off);
});

document.querySelectorAll('[data-btn]').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    btn.classList.add('pressed');
    attack(btn.dataset.btn);
  });
  const release = () => btn.classList.remove('pressed');
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
});

function doJump() {
  if (!gameStarted || gameOver) return;
  if (playerJumping) return;
  if (playerCrouching) doCrouch(false);
  playerJumping = true;
  playerJumpTimer = JUMP_FRAMES;
  player.classList.add('jumping');
  showLabel(playerMoveLbl, 'JUMP!');
}

function doCrouch(flag) {
  if (!gameStarted || gameOver) return;
  playerCrouching = flag;
  if (flag && !playerJumping) {
    player.classList.add('crouching');
    showLabel(playerMoveLbl, 'GUARD');
  } else {
    player.classList.remove('crouching');
  }
}

function attack(type) {
  if (!gameStarted || gameOver || !canAttack) return;
  if (playerJumping) return;
  canAttack = false;

  if (type === 'punch') {
    player.classList.add('punching');
    showLabel(playerMoveLbl, 'PUNCH');
    if (!playerCrouching) {
      const range = 100;
      if (Math.abs(playerX - enemyX) < range) {
        if (enemyCrouching) {
          showLabel(enemyMoveLbl, 'GUARD!');
        } else if (!enemyJumping) {
          damageEnemy(8);
        } else {
          showLabel(enemyMoveLbl, 'MISS (空中)');
        }
      }
    }
  } else {
    player.classList.add('kicking');
    showLabel(playerMoveLbl, 'KICK');
    const range = 110;
    if (Math.abs(playerX - enemyX) < range) {
      if (enemyJumping) {
        showLabel(enemyMoveLbl, 'MISS (ジャンプ)');
      } else {
        damageEnemy(12);
      }
    }
  }

  setTimeout(() => {
    player.classList.remove('punching', 'kicking');
    canAttack = true;
  }, 200);
}

function damageEnemy(dmg) {
  enemyHp = Math.max(0, enemyHp - dmg);
  enemyHpFill.style.width = enemyHp + '%';
  enemy.style.filter = 'brightness(2.2)';
  setTimeout(() => enemy.style.filter = '', 140);
  checkGameOver();
}

function damagePlayer(dmg) {
  playerHp = Math.max(0, playerHp - dmg);
  playerHpFill.style.width = playerHp + '%';
  player.style.filter = 'brightness(2.2)';
  setTimeout(() => player.style.filter = '', 140);
  checkGameOver();
}

function showLabel(el, text) {
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 700);
}

function enemyAI() {
  if (gameOver) return;
  const dist = Math.abs(playerX - enemyX);

  if (enemyJumping) {
    enemyMoveTimer--;
    if (enemyMoveTimer <= 0) {
      enemyJumping = false;
      enemy.classList.remove('jumping');
    }
    return;
  }

  if (enemyCrouching) {
    enemyMoveTimer--;
    if (enemyMoveTimer <= 0) {
      enemyCrouching = false;
      enemy.classList.remove('crouching');
    }
    return;
  }

  if (enemyAttackCooldown > 0) {
    enemyAttackCooldown--;
    return;
  }

  if (dist > 100) {
    enemyX -= 2.5;
  } else {
    if (enemyNextAttack <= 0) {
      if (player.classList.contains('punching') && Math.random() < 0.5) {
        enemyCrouching = true;
        enemyMoveTimer = 25;
        enemy.classList.add('crouching');
        showLabel(enemyMoveLbl, 'しゃがみ回避');
        enemyNextAttack = 40;
      } else if (player.classList.contains('kicking') && Math.random() < 0.5) {
        enemyJumping = true;
        enemyMoveTimer = 25;
        enemy.classList.add('jumping');
        showLabel(enemyMoveLbl, 'ジャンプ回避');
        enemyNextAttack = 40;
      } else {
        const useKick = Math.random() < 0.4;
        if (useKick) {
          enemy.classList.add('kicking');
          showLabel(enemyMoveLbl, 'KICK');
          if (!playerJumping && Math.abs(playerX - enemyX) < 110) {
            damagePlayer(12);
          }
          setTimeout(() => enemy.classList.remove('kicking'), 200);
        } else {
          enemy.classList.add('punching');
          showLabel(enemyMoveLbl, 'PUNCH');
          if (!playerCrouching && !playerJumping && Math.abs(playerX - enemyX) < 100) {
            damagePlayer(8);
          } else if (playerCrouching) {
            showLabel(playerMoveLbl, '回避成功!');
          }
          setTimeout(() => enemy.classList.remove('punching'), 200);
        }
        enemyAttackCooldown = ATTACK_COOLDOWN;
        enemyNextAttack = 30 + Math.floor(Math.random() * 30);
      }
    }
  }

  if (enemyNextAttack > 0) enemyNextAttack--;

  if (enemyX < playerX + MIN_DIST) enemyX = playerX + MIN_DIST;
  if (enemyX > GAME_W - 80) enemyX = GAME_W - 80;
  enemy.style.right = (GAME_W - enemyX - 60) + 'px';
}

function checkGameOver() {
  if (enemyHp <= 0) endGame('YOU WIN!', '#00ff44');
  else if (playerHp <= 0) endGame('YOU LOSE...', '#ff3344');
}

function endGame(text, color) {
  if (gameOver) return;
  gameOver = true;
  message.textContent = text;
  message.style.color = color;
  message.style.display = 'block';
  if (text === 'YOU WIN!') {
    setTimeout(() => { window.location.href = 'study.html'; }, 1500);
  } else {
    setTimeout(() => location.reload(), 3000);
  }
}

function loop() {
  if (gameStarted && !gameOver) {
    if (keys.left && playerX > 20) playerX -= 4;
    if (keys.right && playerX < enemyX - MIN_DIST) playerX += 4;
    player.style.left = playerX + 'px';

    if (playerJumping) {
      playerJumpTimer--;
      if (playerJumpTimer <= 0) {
        playerJumping = false;
        player.classList.remove('jumping');
      }
    }

    enemyAI();
  }
  requestAnimationFrame(loop);
}

loop();
</script>
