<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仮面ライダー バトル</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
    color: white;
    user-select: none;
    padding: 8px;
    gap: 8px;
  }

  /* ===== ゲーム画面（拡大） ===== */
  #game-wrap {
    position: relative;
    width: min(96vw, 1000px);
  }
  #game {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    background: linear-gradient(#1a0a2a 0%, #4a1a6a 60%, #2a0a1a 100%);
    border: 4px solid #ff3333;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,50,50,0.4);
  }
  #ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 20%;
    background: linear-gradient(#3a2a1a, #1a1008);
    border-top: 3px solid #ff3333;
    z-index: 1;
  }

  /* ===== キャラ（%指定で確実に表示） ===== */
  .fighter {
    position: absolute;
    bottom: 20%;
    width: 8%;
    height: 30%;
    transition: bottom 0.15s, height 0.15s, filter 0.1s;
    z-index: 2;
  }
  #player {
    left: 18%;
    background: linear-gradient(160deg, #ff2222 0%, #cc0000 40%, #1a1a1a 45%, #1a1a1a 100%);
    border-radius: 40% 40% 20% 20% / 30% 30% 10% 10%;
    box-shadow: inset -4px 0 8px rgba(0,0,0,0.5), 0 0 12px rgba(255,50,50,0.6);
  }
  #player::before {
    content: '';
    position: absolute;
    top: 22%; left: 8%;
    width: 85%; height: 22%;
    background: radial-gradient(ellipse at center, #88ffff 0%, #00aacc 50%, #003355 100%);
    border-radius: 50% 50% 30% 30%;
    box-shadow: 0 0 8px #00ccff;
    border: 1px solid #000;
  }
  #player::after {
    content: '';
    position: absolute;
    bottom: 32%; left: 10%;
    width: 80%; height: 8%;
    background: linear-gradient(90deg, #ffcc00, #ffaa00);
    border-radius: 2px;
    box-shadow: 0 0 6px #ffcc00;
  }
  #enemy {
    right: 18%;
    background: linear-gradient(200deg, #8822ff 0%, #4411aa 40%, #1a1a1a 45%, #1a1a1a 100%);
    border-radius: 40% 40% 20% 20% / 30% 30% 10% 10%;
    box-shadow: inset 4px 0 8px rgba(0,0,0,0.5), 0 0 12px rgba(150,50,255,0.6);
    transform: scaleX(-1);
  }
  #enemy::before {
    content: '';
    position: absolute;
    top: 22%; left: 8%;
    width: 85%; height: 22%;
    background: radial-gradient(ellipse at center, #ff88ff 0%, #cc00cc 50%, #550055 100%);
    border-radius: 50% 50% 30% 30%;
    box-shadow: 0 0 8px #ff00ff;
    border: 1px solid #000;
  }
  #enemy::after {
    content: '';
    position: absolute;
    bottom: 32%; left: 10%;
    width: 80%; height: 8%;
    background: linear-gradient(90deg, #cc00cc, #880088);
    border-radius: 2px;
    box-shadow: 0 0 6px #cc00cc;
  }

  .punching { transform: translateX(22px) !important; }
  #enemy.punching { transform: scaleX(-1) translateX(22px) !important; }
  .kicking { transform: translateX(30px) !important; filter: brightness(1.3); }
  #enemy.kicking { transform: scaleX(-1) translateX(-30px) !important; filter: brightness(1.3); }

  #player.jumping { bottom: 40%; height: 26%; }
  #player.crouching { height: 20%; }
  #enemy.jumping { bottom: 40%; height: 26%; }
  #enemy.crouching { height: 20%; }

  .hp-bar {
    position: absolute;
    top: 4%;
    width: 38%;
    height: 7%;
    background: #222;
    border: 2px solid #ff3333;
    border-radius: 4px;
    overflow: hidden;
    z-index: 3;
  }
  #player-hp { left: 2%; }
  #enemy-hp { right: 2%; }
  .hp-fill {
    height: 100%;
    background: linear-gradient(#00ff00, #00aa00);
    transition: width 0.2s;
  }
  #enemy-hp .hp-fill { float: right; }

  .move-label {
    position: absolute;
    top: 13%;
    font-size: 13px;
    color: #ffcc00;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    opacity: 0;
    transition: opacity 0.2s;
    font-family: Arial, sans-serif;
    z-index: 3;
  }
  #player-move { left: 2%; }
  #enemy-move { right: 2%; }
  .move-label.show { opacity: 1; }

  #message {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(24px, 5vw, 56px);
    font-weight: bold;
    text-shadow: 4px 4px 0 #000;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }

  /* ===== オープニング（PREV画面：将来の設定/キャラ選択枠） ===== */
  #opening {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    overflow: hidden;
  }
  #opening-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 0;
    opacity: 0.5;
  }
  #opening .opening-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    padding: 4% 5%;
  }
  #opening h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 52px);
    background: linear-gradient(180deg, #ffffff, #ff2222);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 12px rgba(255,0,0,0.8);
    letter-spacing: 3px;
    animation: pulse 1.5s infinite alternate;
    text-align: center;
    line-height: 1.1;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  #opening p.sub {
    margin: 6px 0 0;
    color: #fff;
    font-size: clamp(10px, 1.6vw, 14px);
    font-family: Arial, sans-serif;
    text-shadow: 1px 1px 4px #000, 0 0 8px #000;
    text-align: center;
  }
  /* 将来の「設定」「キャラ選択」枠（今は無効表示） */
  .future-slot {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .future-btn {
    font-family: Arial, sans-serif;
    font-size: clamp(9px, 1.3vw, 12px);
    padding: 6px 14px;
    border: 1px dashed #666;
    border-radius: 20px;
    background: rgba(0,0,0,0.4);
    color: #888;
    cursor: not-allowed;
  }
  .opening-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .open-btn {
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(14px, 2.4vw, 22px);
    padding: 12px 36px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
  }
  #start-btn {
    background: linear-gradient(180deg, #ff2222, #cc0000);
    color: #fff;
    box-shadow: 0 6px 0 #660000, 0 8px 20px rgba(255,0,0,0.6);
  }
  #view-bg-btn {
    background: linear-gradient(180deg, #666, #333);
    color: #fff;
    box-shadow: 0 6px 0 #111, 0 8px 20px rgba(0,0,0,0.6);
  }
  .open-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #333; }
  .open-btn:hover { filter: brightness(1.15); }

  #bg-viewer {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  #bg-viewer.active { display: flex; }
  #bg-viewer img {
    width: 100%;
    height: 100%;
    object-fit: fill;
  }
  #close-bg {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(255,0,0,0.85);
    color: #fff;
    border: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 201;
    font-weight: bold;
  }

  /* ===== 情報パネル（小型・ゲーセンのみ） ===== */
  #info-panel {
    width: min(96vw, 1000px);
    background: #16162a;
    border: 2px solid #3a3a5a;
    border-radius: 10px;
    padding: 8px 10px;
  }
  #panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  #panel-header .title {
    font-size: 11px;
    color: #8a8ab0;
    font-family: Arial, sans-serif;
    letter-spacing: 1px;
  }
  #hint {
    font-size: 10px;
    color: #666688;
    font-family: Arial, sans-serif;
  }

  /* ゲーセン風コントローラー（コンパクト） */
  #pad-area {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 20px;
    padding: 4px 0;
  }
  .lever-base {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .lever-dirs {
    position: relative;
    width: 110px;
    height: 110px;
  }
  .lever-dir {
    position: absolute;
    width: 36px;
    height: 36px;
    background: linear-gradient(180deg, #2a2a44, #16162a);
    border: 2px solid #5555aa;
    border-radius: 8px;
    color: #aaaaff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    transition: transform 0.08s, filter 0.08s;
  }
  .lever-dir.pressed { transform: scale(0.9); filter: brightness(1.5); }
  .lever-dir[data-dir="left"]  { left: 0; top: 37px; }
  .lever-dir[data-dir="right"] { right: 0; top: 37px; }
  .lever-dir[data-dir="up"]    { left: 37px; top: 0; }
  .lever-dir[data-dir="down"]  { left: 37px; bottom: 0; }

  .arcade-buttons {
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .arcade-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    border: 3px solid rgba(255,255,255,0.4);
    box-shadow: 0 6px 0 rgba(0,0,0,0.5), inset 0 -6px 12px rgba(0,0,0,0.4);
    touch-action: none;
    user-select: none;
    transition: transform 0.08s, filter 0.08s;
  }
  .arcade-btn.pressed { transform: scale(0.92) translateY(2px); filter: brightness(1.4); }
  .arcade-btn.punch { background: radial-gradient(circle at 35% 30%, #ff8888, #cc0000); }
  .arcade-btn.kick  { background: radial-gradient(circle at 35% 30%, #88aaff, #0033cc); }

  @media (max-width: 640px) {
    .lever-base { width: 100px; height: 100px; }
    .lever-dirs { width: 92px; height: 92px; }
    .lever-dir { width: 30px; height: 30px; font-size: 13px; }
    .lever-dir[data-dir="left"], .lever-dir[data-dir="right"] { top: 31px; }
    .lever-dir[data-dir="up"], .lever-dir[data-dir="down"] { left: 31px; }
    .arcade-btn { width: 56px; height: 56px; font-size: 11px; }
    .arcade-buttons { gap: 12px; }
  }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="game">
    <div id="player-hp" class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
    <div id="enemy-hp" class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
    <div id="player-move" class="move-label"></div>
    <div id="enemy-move" class="move-label"></div>
    <div id="ground"></div>
    <div id="player" class="fighter"></div>
    <div id="enemy" class="fighter"></div>
    <div id="message"></div>

    <!-- PREV画面（オープニング） -->
    <div id="opening">
      <img id="opening-bg" src="img369rider.jpg" alt="背景">
      <div class="opening-inner">
        <div style="text-align:center; margin-top: 2%;">
          <h1>仮面ライダー<br>バトル</h1>
          <p class="sub">— 上:ジャンプ / 下:しゃがみ / パンチ・キックで戦え —</p>
          <div class="future-slot">
            <span class="future-btn">⚙ 設定（準備中）</span>
            <span class="future-btn">👤 キャラ選択（準備中）</span>
          </div>
        </div>
        <div class="opening-buttons" style="margin-bottom: 2%;">
          <button id="start-btn" class="open-btn">はじめる</button>
          <button id="view-bg-btn" class="open-btn">背景を見る</button>
        </div>
      </div>

      <!-- 背景拡大ビューア -->
      <div id="bg-viewer">
        <img src="img369rider.jpg" alt="背景拡大">
        <button id="close-bg">✕</button>
      </div>
    </div>
  </div>
</div>

<!-- 情報パネル（ゲーセンのみ・小型） -->
<div id="info-panel">
  <div id="panel-header">
    <span class="title">▼ CONTROLLER（アーケード）</span>
    <span id="hint">クリック/長押しで操作</span>
  </div>
  <div id="pad-area">
    <div class="lever-base">
      <div class="lever-dirs">
        <button class="lever-dir" data-dir="up">▲</button>
        <button class="lever-dir" data-dir="left">◀</button>
        <button class="lever-dir" data-dir="right">▶</button>
        <button class="lever-dir" data-dir="down">▼</button>
      </div>
    </div>
    <div class="arcade-buttons">
      <button class="arcade-btn punch" data-btn="punch">PUNCH</button>
      <button class="arcade-btn kick" data-btn="kick">KICK</button>
    </div>
  </div>
</div>

<script>
const player = document.getElementById('player');
const enemy = document.getElementById('enemy');
const playerHpFill = document.querySelector('#player-hp .hp-fill');
const enemyHpFill  = document.querySelector('#enemy-hp .hp-fill');
const message = document.getElementById('message');
const opening = document.getElementById('opening');
const startBtn = document.getElementById('start-btn');
const viewBgBtn = document.getElementById('view-bg-btn');
const bgViewer = document.getElementById('bg-viewer');
const closeBg = document.getElementById('close-bg');
const playerMoveLbl = document.getElementById('player-move');
const enemyMoveLbl  = document.getElementById('enemy-move');

/* ===== 状態 ===== */
let playerHp = 100;
let enemyHp = 100;

// %ベースの位置管理（表示崩れ防止）
let playerX = 18;   // %
let enemyX  = 82;   // %（左基準ではなく右からの距離で扱わないよう統一）
let playerJumping = false;
let playerCrouching = false;
let playerJumpTimer = 0;

let enemyJumping = false;
let enemyCrouching = false;
let enemyAttackCooldown = 0;
let enemyMoveTimer = 0;
let enemyNextAttack = 0;

let gameStarted = false;
let gameOver = false;
let canAttack = true;

const MIN_DIST = 12;      // %（キャラ同士の最小間隔）
const JUMP_FRAMES = 40;
const ATTACK_COOLDOWN = 18;
const PLAYER_SPEED = 0.7; // %/frame

const keys = { left: false, right: false };

/* ===== オープニング ===== */
startBtn.addEventListener('click', () => {
  opening.style.display = 'none';
  gameStarted = true;
});
viewBgBtn.addEventListener('click', () => bgViewer.classList.add('active'));
closeBg.addEventListener('click', () => bgViewer.classList.remove('active'));

/* ===== コントローラー入力 ===== */
document.querySelectorAll('[data-dir]').forEach(btn => {
  const dir = btn.dataset.dir;
  const on = (e) => {
    e.preventDefault();
    btn.classList.add('pressed');
    if (dir === 'left')  keys.left = true;
    if (dir === 'right') keys.right = true;
    if (dir === 'up')    doJump();
    if (dir === 'down')  doCrouch(true);
  };
  const off = (e) => {
    e.preventDefault();
    btn.classList.remove('pressed');
    if (dir === 'left')  keys.left = false;
    if (dir === 'right') keys.right = false;
    if (dir === 'down')  doCrouch(false);
  };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('pointercancel', off);
});

document.querySelectorAll('[data-btn]').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    btn.classList.add('pressed');
    attack(btn.dataset.btn);
  });
  const release = () => btn.classList.remove('pressed');
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
});

/* ===== プレイヤー動作 ===== */
function doJump() {
  if (!gameStarted || gameOver) return;
  if (playerJumping) return;
  if (playerCrouching) doCrouch(false);
  playerJumping = true;
  playerJumpTimer = JUMP_FRAMES;
  player.classList.add('jumping');
  showLabel(playerMoveLbl, 'JUMP!');
}

function doCrouch(flag) {
  if (!gameStarted || gameOver) return;
  playerCrouching = flag;
  if (flag && !playerJumping) {
    player.classList.add('crouching');
    showLabel(playerMoveLbl, 'GUARD');
  } else {
    player.classList.remove('crouching');
  }
}

function attack(type) {
  if (!gameStarted || gameOver || !canAttack) return;
  if (playerJumping) return;
  canAttack = false;

  const dist = Math.abs(playerX - enemyX);

  if (type === 'punch') {
    player.classList.add('punching');
    showLabel(playerMoveLbl, 'PUNCH');
    if (!playerCrouching) {
      if (dist < 13) {
        if (enemyCrouching) {
          showLabel(enemyMoveLbl, 'GUARD!');
        } else if (!enemyJumping) {
          damageEnemy(8);
        } else {
          showLabel(enemyMoveLbl, 'MISS (空中)');
        }
      }
    }
  } else {
    player.classList.add('kicking');
    showLabel(playerMoveLbl, 'KICK');
    if (dist < 14) {
      if (enemyJumping) {
        showLabel(enemyMoveLbl, 'MISS (ジャンプ)');
      } else {
        damageEnemy(12);
      }
    }
  }

  setTimeout(() => {
    player.classList.remove('punching', 'kicking');
    canAttack = true;
  }, 200);
}

function damageEnemy(dmg) {
  enemyHp = Math.max(0, enemyHp - dmg);
  enemyHpFill.style.width = enemyHp + '%';
  enemy.style.filter = 'brightness(2.2)';
  setTimeout(() => enemy.style.filter = '', 140);
  checkGameOver();
}

function damagePlayer(dmg) {
  playerHp = Math.max(0, playerHp - dmg);
  playerHpFill.style.width = playerHp + '%';
  player.style.filter = 'brightness(2.2)';
  setTimeout(() => player.style.filter = '', 140);
  checkGameOver();
}

function showLabel(el, text) {
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 700);
}

/* ===== 敵AI ===== */
function enemyAI() {
  if (gameOver) return;
  const dist = Math.abs(playerX - enemyX);

  if (enemyJumping) {
    enemyMoveTimer--;
    if (enemyMoveTimer <= 0) {
      enemyJumping = false;
      enemy.classList.remove('jumping');
    }
    return;
  }
  if (enemyCrouching) {
    enemyMoveTimer--;
    if (enemyMoveTimer <= 0) {
      enemyCrouching = false;
      enemy.classList.remove('crouching');
    }
    return;
  }
  if (enemyAttackCooldown > 0) {
    enemyAttackCooldown--;
    return;
  }

  if (dist > 14) {
    // 近づく（右→左へ）
    enemyX -= 0.45;
  } else {
    if (enemyNextAttack <= 0) {
      if (player.classList.contains('punching') && Math.random() < 0.5) {
        enemyCrouching = true;
        enemyMoveTimer = 25;
        enemy.classList.add('crouching');
        showLabel(enemyMoveLbl, 'しゃがみ回避');
        enemyNextAttack = 40;
      } else if (player.classList.contains('kicking') && Math.random() < 0.5) {
        enemyJumping = true;
        enemyMoveTimer = 25;
        enemy.classList.add('jumping');
        showLabel(enemyMoveLbl, 'ジャンプ回避');
        enemyNextAttack = 40;
      } else {
        const useKick = Math.random() < 0.4;
        if (useKick) {
          enemy.classList.add('kicking');
          showLabel(enemyMoveLbl, 'KICK');
          if (!playerJumping && Math.abs(playerX - enemyX) < 14) {
            damagePlayer(12);
          }
          setTimeout(() => enemy.classList.remove('kicking'), 200);
        } else {
          enemy.classList.add('punching');
          showLabel(enemyMoveLbl, 'PUNCH');
          if (!playerCrouching && !playerJumping && Math.abs(playerX - enemyX) < 13) {
            damagePlayer(8);
          } else if (playerCrouching) {
            showLabel(playerMoveLbl, '回避成功!');
          }
          setTimeout(() => enemy.classList.remove('punching'), 200);
        }
        enemyAttackCooldown = ATTACK_COOLDOWN;
        enemyNextAttack = 30 + Math.floor(Math.random() * 30);
      }
    }
  }

  if (enemyNextAttack > 0) enemyNextAttack--;

  // 位置制限（%）
  if (enemyX < playerX + MIN_DIST) enemyX = playerX + MIN_DIST;
  if (enemyX > 92) enemyX = 92;
}

/* ===== 勝敗 ===== */
function checkGameOver() {
  if (enemyHp <= 0) endGame('YOU WIN!', '#00ff44');
  else if (playerHp <= 0) endGame('YOU LOSE...', '#ff3344');
}

function endGame(text, color) {
  if (gameOver) return;
  gameOver = true;
  message.textContent = text;
  message.style.color = color;
  message.style.display = 'block';
  if (text === 'YOU WIN!') {
    setTimeout(() => { window.location.href = 'study.html'; }, 1500);
  } else {
    setTimeout(() => location.reload(), 3000);
  }
}

/* ===== メインループ ===== */
function loop() {
  if (gameStarted && !gameOver) {
    // プレイヤー移動（%）
    if (keys.left && playerX > 4) playerX -= PLAYER_SPEED;
    if (keys.right && playerX < enemyX - MIN_DIST) playerX += PLAYER_SPEED;

    // ジャンプカウントダウン
    if (playerJumping) {
      playerJumpTimer--;
      if (playerJumpTimer <= 0) {
        playerJumping = false;
        player.classList.remove('jumping');
      }
    }

    enemyAI();

    // 位置反映（%指定で確実に表示）
    player.style.left = playerX + '%';
    enemy.style.right = (100 - enemyX) + '%';
  }
  requestAnimationFrame(loop);
}

loop();
</script>
