    { q: "What is the charge of an electron?", a: ["-1.6×10⁻¹⁹ C", "+1.6×10⁻¹⁹ C", "0 C", "-9.1×10⁻³¹ C"], correct: 0 },
    { q: "Who proposed the wave equation?", a: ["Erwin Schrödinger", "Werner Heisenberg", "Paul Dirac", "Max Planck"], correct: 0 },
    { q: "What is the unit of resistance?", a: ["Volt", "Ampere", "Ohm", "Farad"], correct: 2 },
    { q: "Who discovered the neutron?", a: ["James Chadwick", "Ernest Rutherford", "J.J. Thomson", "Niels Bohr"], correct: 0 },
    { q: "What does the second law of thermodynamics state?", a: ["Entropy always decreases", "Entropy always increases or stays same", "Entropy is constant", "Entropy can be negative"], correct: 1 },
    { q: "Who explained the photoelectric effect?", a: ["Albert Einstein", "Max Planck", "Niels Bohr", "Louis de Broglie"], correct: 0 },
    { q: "What is the unit of capacitance?", a: ["Henry", "Farad", "Tesla", "Weber"], correct: 1 },
    { q: "Who proposed the de Broglie wavelength?", a: ["Louis de Broglie", "Erwin Schrödinger", "Werner Heisenberg", "Max Born"], correct: 0 },
    { q: "What is the strong nuclear force responsible for?", a: ["Radioactive decay", "Binding quarks and nucleons", "Electromagnetic repulsion", "Gravity"], correct: 1 },
    { q: "What is the unit of magnetic flux?", a: ["Tesla", "Weber", "Henry", "Gauss"], correct: 1 },
    { q: "Who developed the first nuclear reactor?", a: ["Enrico Fermi", "Robert Oppenheimer", "Albert Einstein", "Niels Bohr"], correct: 0 },
    { q: "What is the half-life of carbon-14?", a: ["5,730 years", "1,000 years", "10,000 years", "50,000 years"], correct: 0 },
    { q: "Which particle mediates the electromagnetic force?", a: ["Gluon", "Photon", "W boson", "Graviton"], correct: 1 },
    { q: "What is the Planck constant?", a: ["6.63×10⁻³⁴ J·s", "3×10⁸ m/s", "1.6×10⁻¹⁹ C", "9.11×10⁻³¹ kg"], correct: 0 },
    { q: "Who discovered superconductivity?", a: ["Heike Kamerlingh Onnes", "Albert Einstein", "Niels Bohr", "John Bardeen"], correct: 0 },
    { q: "What is the unit of pressure?", a: ["Newton", "Pascal", "Joule", "Watt"], correct: 1 },
    { q: "Who proposed the Copenhagen interpretation?", a: ["Niels Bohr", "Albert Einstein", "Erwin Schrödinger", "Max Planck"], correct: 0 },
    { q: "What is the rest mass of an electron?", a: ["9.11×10⁻³¹ kg", "1.67×10⁻²⁷ kg", "6.63×10⁻³⁴ kg", "1.6×10⁻¹⁹ kg"], correct: 0 },
    { q: "What does E=mc² calculate?", a: ["Kinetic energy", "Rest energy", "Potential energy", "Thermal energy"], correct: 1 },
    { q: "Who discovered the positron?", a: ["Carl Anderson", "Paul Dirac", "Ernest Rutherford", "James Chadwick"], correct: 0 },
    { q: "What is the unit of inductance?", a: ["Farad", "Henry", "Tesla", "Weber"], correct: 1 },
    { q: "Which force is the weakest?", a: ["Strong nuclear", "Electromagnetic", "Weak nuclear", "Gravity"], correct: 3 },
    { q: "What is the Heisenberg uncertainty principle about?", a: ["Position and momentum", "Energy and time", "Both A and B", "Charge and mass"], correct: 2 },
    { q: "Who won the Nobel Prize in Physics in 1921?", a: ["Albert Einstein", "Niels Bohr", "Max Planck", "Werner Heisenberg"], correct: 0 },
    { q: "What is the Schwarzschild radius?", a: ["Radius of a black hole's event horizon", "Radius of a neutron star", "Radius of the universe", "Radius of an atom"], correct: 0 },
    { q: "Which particle is its own antiparticle?", a: ["Electron", "Proton", "Photon", "Neutron"], correct: 2 }
  ];

  // ========================
  //  GAME STATE
  // ========================
  let currentSet = [];
  let currentIndex = 0;           // 0-49
  let fiftyUsed = 0;              // 0-9
  let currentCorrectIndex = -1;
  let answerLocked = false;
  let gameActive = false;
  let isTransitioning = false;

  // DOM elements
  const openingScreen = document.getElementById('opening-screen');
  const gameScreen = document.getElementById('game-screen');
  const endingScreen = document.getElementById('ending-screen');
  const startBtn = document.getElementById('start-btn');
  const qCounter = document.getElementById('q-counter');
  const questionText = document.getElementById('question-text');
  const answersContainer = document.getElementById('answers-container');
  const fiftyBtn = document.getElementById('fifty-btn');
  const gunOverlay = document.getElementById('gun-overlay');
  const gunVideo = document.getElementById('gun-video');

  // All answer buttons
  const answerBtns = document.querySelectorAll('.answer-btn');

  // ========================
  //  UTILITY FUNCTIONS
  // ========================
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Randomly pick one of Q, Z, U
  function pickRandomSet() {
    const r = Math.random();
    if (r < 1/3) return [...Q_SET];
    if (r < 2/3) return [...Z_SET];
    return [...U_SET];
  }

  // Shuffle questions and answers inside each question
  function prepareSet(set) {
    // shuffle questions
    const shuffled = shuffleArray([...set]);
    // shuffle answers within each question while keeping track of correct
    return shuffled.map(q => {
      const correctText = q.a[q.correct];
      const shuffledAnswers = shuffleArray([...q.a]);
      const newCorrectIndex = shuffledAnswers.indexOf(correctText);
      return {
        q: q.q,
        a: shuffledAnswers,
        correct: newCorrectIndex
      };
    });
  }

  // ========================
  //  GAME FLOW
  // ========================
  function startGame() {
    // reset state
    const rawSet = pickRandomSet();
    currentSet = prepareSet(rawSet);
    currentIndex = 0;
    fiftyUsed = 0;
    answerLocked = false;
    gameActive = true;
    isTransitioning = false;

    // UI transitions
    openingScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    endingScreen.style.display = 'none';
    gunOverlay.style.display = 'none';

    // reset 50:50 button
    updateFiftyButton();

    // load first question
    loadQuestion();
  }

  function loadQuestion() {
    if (!gameActive) return;
    if (currentIndex >= 50) {
      // should not happen here (win handled after 50th correct)
      return;
    }

    answerLocked = false;
    const qData = currentSet[currentIndex];
    currentCorrectIndex = qData.correct;

    // update counter
    qCounter.textContent = `Question ${currentIndex + 1} / 50`;

    // set question text
    questionText.textContent = qData.q;

    // set answers
    answerBtns.forEach((btn, idx) => {
      btn.textContent = qData.a[idx];
      btn.classList.remove('correct', 'wrong', 'hidden-option');
      btn.disabled = false;
      btn.style.display = 'block';
    });

    // reset 50:50 state for this question
    // (button disabled state is handled globally)
    updateFiftyButton();

    // ensure any previous timeouts or overlays are cleared
    gunOverlay.style.display = 'none';
    if (gunVideo) {
      gunVideo.pause();
      gunVideo.currentTime = 0;
    }
  }

  function updateFiftyButton() {
    const remaining = 9 - fiftyUsed;
    fiftyBtn.textContent = `50:50 (${remaining} left)`;
    if (remaining <= 0) {
      fiftyBtn.disabled = true;
    } else {
      fiftyBtn.disabled = false;
    }
    // if answer is locked or transitioning, disable
    if (answerLocked || isTransitioning || !gameActive) {
      fiftyBtn.disabled = true;
    }
  }

  // Handle 50:50
  function useFiftyFifty() {
    if (fiftyUsed >= 9 || answerLocked || !gameActive || isTransitioning) return;
    if (currentIndex >= 50) return;

    // increment used count
    fiftyUsed++;
    updateFiftyButton();

    // determine wrong answers to hide (2 of them)
    const wrongIndices = [];
    for (let i = 0; i < 4; i++) {
      if (i !== currentCorrectIndex) wrongIndices.push(i);
    }
    // shuffle wrong indices and pick 2
    shuffleArray(wrongIndices);
    const toHide = wrongIndices.slice(0, 2);

    answerBtns.forEach((btn, idx) => {
      if (toHide.includes(idx)) {
        btn.classList.add('hidden-option');
        btn.disabled = true; // cannot click hidden ones
      }
    });

    // disable 50:50 for rest of question (but button already disabled by updateFiftyButton? no)
    // We'll disable it manually now
    fiftyBtn.disabled = true;
  }

  // Handle answer selection
  function selectAnswer(index) {
    if (answerLocked || !gameActive || isTransitioning) return;
    if (currentIndex >= 50) return;

    // prevent clicking hidden options (already disabled, but double-check)
    if (answerBtns[index].classList.contains('hidden-option')) return;

    answerLocked = true;
    // disable all answer buttons to prevent multiple clicks
    answerBtns.forEach(btn => btn.disabled = true);
    // disable 50:50
    fiftyBtn.disabled = true;

    const isCorrect = (index === currentCorrectIndex);

    // highlight correct and wrong
    if (isCorrect) {
      answerBtns[index].classList.add('correct');
      // show gun video for 5 seconds
      showGunVideo();
    } else {
      answerBtns[index].classList.add('wrong');
      // also highlight correct answer for learning? optional, but nice.
      answerBtns[currentCorrectIndex].classList.add('correct');
    }

    // after animation / delay, decide next step
    setTimeout(() => {
      if (isCorrect) {
        // move to next question or win
        if (currentIndex === 49) {
          // WIN!
          gameActive = false;
          gameScreen.style.display = 'none';
          endingScreen.style.display = 'flex';
        } else {
          currentIndex++;
          // reset 50:50? No, fiftyUsed persists across questions
          loadQuestion();
          // re-enable buttons based on current state
          answerBtns.forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('correct', 'wrong', 'hidden-option');
          });
          updateFiftyButton();
          answerLocked = false;
          isTransitioning = false;
        }
      } else {
        // WRONG: restart whole game
        restartGame();
      }
    }, 1200); // short delay to show correct/wrong colors
  }

  function showGunVideo() {
    isTransitioning = true;
    gunOverlay.style.display = 'flex';
    // img183quiz.jpg is an image, but spec says "img183quiz.jpgを5秒間流して"
    // Since it's an image, we simulate a 5-second display.
    // We'll show it for 5 seconds, then hide.
    if (!gunOverlay.querySelector('img.gun-img')) {
      const img = document.createElement('img');
      img.className = 'gun-img';
      img.src = 'img183quiz.jpg';
      img.style.width = '80%';
      img.style.maxWidth = '900px';
      img.style.borderRadius = '20px';
      img.style.boxShadow = '0 0 80px #f5e56b';
      gunOverlay.appendChild(img);
    }
    // hide video
    gunVideo.style.display = 'none';
    const gunImg = gunOverlay.querySelector('img.gun-img');
    if (gunImg) gunImg.style.display = 'block';

    // after 5 seconds hide overlay
    setTimeout(() => {
      gunOverlay.style.display = 'none';
      if (gunImg) gunImg.style.display = 'none';
      gunVideo.style.display = 'block'; // reset
      isTransitioning = false;
    }, 5000);
  }

  function restartGame() {
    gameActive = false;
    isTransitioning = false;
    answerLocked = false;
    // reset UI
    gameScreen.style.display = 'none';
    endingScreen.style.display = 'none';
    openingScreen.style.display = 'flex';
    gunOverlay.style.display = 'none';
    if (gunVideo) {
      gunVideo.pause();
      gunVideo.currentTime = 0;
    }
    // reset any leftover answer classes
    answerBtns.forEach(btn => {
      btn.disabled = false;
      btn.classList.remove('correct', 'wrong', 'hidden-option');
    });
    fiftyUsed = 0;
    currentIndex = 0;
    updateFiftyButton();
  }

  // ========================
  //  EVENT LISTENERS
  // ========================
  startBtn.addEventListener('click', startGame);

  fiftyBtn.addEventListener('click', useFiftyFifty);

  answerBtns.forEach((btn, idx) => {
    btn.addEventListener('click', () => selectAnswer(idx));
  });

  // initial state: opening screen visible
  openingScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  endingScreen.style.display = 'none';
  gunOverlay.style.display = 'none';

  // ensure background of app is handled (opening screen has its own bg)
  // The #app background remains default, but opening screen covers it.

  // fix for video element: we use image instead, so hide video initially
  gunVideo.style.display = 'none';

  // add small css for gun image
  const style = document.createElement('style');
  style.textContent = `
    .gun-img {
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { filter: drop-shadow(0 0 20px #f5e56b); }
      to { filter: drop-shadow(0 0 60px #ffaa00); }
    }
  `;
  document.head.appendChild(style);

</script>
</body>
</html>
