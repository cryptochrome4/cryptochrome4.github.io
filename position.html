<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーボード位置覚えゲー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.6rem;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.9rem;
        }
        .section {
            background-color: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            border-left: 5px solid #007bff;
            padding-left: 8px;
        }
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background-color: #e2e8f0;
            padding: 8px;
            border-radius: 10px;
            user-select: none;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }
        /* 通常キーの初期状態（枠線のみ、文字は非表示） */
        .key {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            flex: 1;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0px; /* 文字サイズを0にして完全に隠す */
            color: #333333;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 0 #cbd5e1;
        }
        /* クリックされたら文字サイズを大きくして表示する */
        .key.revealed {
            font-size: 1.3rem !important;
            background-color: #eff6ff;
            border-color: #3b82f6;
        }
        /* グレーの特殊キー（最初から文字が見える） */
        .key.side-key {
            background-color: #94a3b8;
            border-color: #64748b;
            box-shadow: 0 2px 0 #64748b;
            color: #ffffff;
            font-size: 1rem;
            cursor: default;
        }
        .key.space-key {
            flex: 3;
            font-size: 0px;
        }
        .key.space-key.revealed {
            font-size: 1.3rem !important;
        }
    </style>
</head>
<body>

    <h1>⌨️ キーボード位置覚えゲー</h1>
    <p>空欄のキーを押すと文字が浮かび上がります！<br>もう一度押すと元に戻ります。</p>

    <!-- 1. 小文字アルファベットバージョン -->
    <div class="section">
        <div class="section-title">1. 小文字アルファベット バージョン</div>
        <div class="keyboard">
            <div class="row">
                <div class="key" onclick="reveal(this)">q</div>
                <div class="key" onclick="reveal(this)">w</div>
                <div class="key" onclick="reveal(this)">e</div>
                <div class="key" onclick="reveal(this)">r</div>
                <div class="key" onclick="reveal(this)">t</div>
                <div class="key" onclick="reveal(this)">y</div>
                <div class="key" onclick="reveal(this)">u</div>
                <div class="key" onclick="reveal(this)">i</div>
                <div class="key" onclick="reveal(this)">o</div>
                <div class="key" onclick="reveal(this)">p</div>
            </div>
            <div class="row">
                <div class="key" onclick="reveal(this)">a</div>
                <div class="key" onclick="reveal(this)">s</div>
                <div class="key" onclick="reveal(this)">d</div>
                <div class="key" onclick="reveal(this)">f</div>
                <div class="key" onclick="reveal(this)">g</div>
                <div class="key" onclick="reveal(this)">h</div>
                <div class="key" onclick="reveal(this)">j</div>
                <div class="key" onclick="reveal(this)">k</div>
                <div class="key" onclick="reveal(this)">l</div>
            </div>
            <div class="row">
                <div class="key side-key">⇧</div>
                <div class="key" onclick="reveal(this)">z</div>
                <div class="key" onclick="reveal(this)">x</div>
                <div class="key" onclick="reveal(this)">c</div>
                <div class="key" onclick="reveal(this)">v</div>
                <div class="key" onclick="reveal(this)">b</div>
                <div class="key" onclick="reveal(this)">n</div>
                <div class="key" onclick="reveal(this)">m</div>
                <div class="key side-key">⌫</div>
            </div>
            <div class="row">
                <div class="key side-key" style="font-size:0.75rem">あA</div>
                <div class="key side-key" style="font-size:0.65rem">MENU</div>
                <div class="key space-key" onclick="reveal(this)">␣</div>
                <div class="key side-key">←</div>
                <div class="key side-key">→</div>
                <div class="key side-key">↵</div>
            </div>
        </div>
    </div>

    <!-- 2. 大文字アルファベットバージョン -->
    <div class="section">
        <div class="section-title">2. 大文字アルファベット バージョン</div>
        <div class="keyboard">
            <div class="row">
                <div class="key" onclick="reveal(this)">Q</div>
                <div class="key" onclick="reveal(this)">W</div>
                <div class="key" onclick="reveal(this)">E</div>
                <div class="key" onclick="reveal(this)">R</div>
                <div class="key" onclick="reveal(this)">T</div>
                <div class="key" onclick="reveal(this)">Y</div>
                <div class="key" onclick="reveal(this)">U</div>
                <div class="key" onclick="reveal(this)">I</div>
                <div class="key" onclick="reveal(this)">O</div>
                <div class="key" onclick="reveal(this)">P</div>
            </div>
            <div class="row">
                <div class="key" onclick="reveal(this)">A</div>
                <div class="key" onclick="reveal(this)">S</div>
                <div class="key" onclick="reveal(this)">D</div>
                <div class="key" onclick="reveal(this)">F</div>
                <div class="key" onclick="reveal(this)">G</div>
                <div class="key" onclick="reveal(this)">H</div>
                <div class="key" onclick="reveal(this)">J</div>
                <div class="key" onclick="reveal(this)">K</div>
                <div class="key" onclick="reveal(this)">L</div>
            </div>
            <div class="row">
                <div class="key side-key">▲</div>
                <div class="key" onclick="reveal(this)">Z</div>
                <div class="key" onclick="reveal(this)">X</div>
                <div class="key" onclick="reveal(this)">C</div>
                <div class="key" onclick="reveal(this)">V</div>
                <div class="key" onclick="reveal(this)">B</div>
                <div class="key" onclick="reveal(this)">N</div>
                <div class="key" onclick="reveal(this)">M</div>
                <div class="key side-key">⌫</div>
            </div>
            <div class="row">
                <div class="key side-key" style="font-size:0.75rem">あA</div>
                <div class="key side-key" style="font-size:0.65rem">MENU</div>
                <div class="key space-key" onclick="reveal(this)">␣</div>
                <div class="key side-key">←</div>
                <div class="key side-key">→</div>
                <div class="key side-key">↵</div>
            </div>
        </div>
    </div>
