<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>部位破壊デモ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#0a0e14; }
  canvas { display:block; cursor:crosshair; }
  #hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    color:#8ab; font:14px/1.5 "Segoe UI",sans-serif; letter-spacing:.1em;
    text-shadow:0 0 8px #000; pointer-events:none; user-select:none;
    opacity:.8; transition:opacity .4s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">モンスターの部位（装甲）を連打して破壊せよ</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

// ---------- 装甲（部位）の設定 ----------
const part = {
  x: W/2, y: H/2, r: Math.min(W,H)*0.28,
  hp: 100, maxHp: 100,
  broken: false, breakTime: 0,
  shakeT: 0
};
function resetPart(){
  part.x = W/2; part.y = H/2; part.r = Math.min(W,H)*0.28;
  part.hp = part.maxHp = 100;
  part.broken = false; part.breakTime = 0; part.shakeT = 0;
  cracks = []; particles = []; hitstop = 0; popups = [];
}
let cracks = [];      // 蓄積するひび
let particles = [];   // 破片・火花
let popups = [];      // 「PART BROKEN」テキスト
let hitstop = 0;      // ヒットストップ用カウンタ
let flash = 0;        // 画面フラッシュ

// ---------- クリック処理 ----------
canvas.addEventListener('pointerdown', e => {
  const mx = e.clientX, my = e.clientY;
  const dx = mx - part.x, dy = my - part.y;
  const dist = Math.hypot(dx, dy);

  // 装甲の外をクリック → 空振り（小さな火花だけ）
  if (part.broken || dist > part.r) {
    for(let i=0;i<8;i++) spawnSpark(mx,my,'#7fd');
    return;
  }

  // 命中！
  const dmg = 22 + Math.random()*12;
  part.hp -= dmg;
  part.shakeT = 10;            // 部位シェイク
  hitstop = 4;                 // ヒットストップ（数フレーム停止）
  flash = 0.35;

  // クリック地点にひびを追加
  addCrack(mx, my);
  // 火花・破片
  for(let i=0;i<18;i++) spawnSpark(mx,my,'#ffd27f');

  // 破壊判定
  if(part.hp <= 0 && !part.broken){
    part.broken = true;
    part.breakTime = performance.now();
    bigBreak();
  }
});

// ---------- ひび生成 ----------
function addCrack(x, y){
  // 中心から放射状にジグザグのひび
  const branches = 4 + Math.floor(Math.random()*3);
  for(let b=0;b<branches;b++){
    const baseAng = Math.random()*Math.PI*2;
    const segs = [];
    let cx = x, cy = y, ang = baseAng, len = 12 + Math.random()*20;
    for(let s=0;s<5;s++){
      ang += (Math.random()-0.5)*1.2;
      const nx = cx + Math.cos(ang)*len;
      const ny = cy + Math.sin(ang)*len;
      // 装甲の縁で止める
      if(Math.hypot(nx-part.x, ny-part.y) > part.r) break;
      segs.push([cx,cy,nx,ny]);
      cx = nx; cy = ny;
      len *= 0.85;
    }
    cracks.push({segs, life:1});
  }
  if(cracks.length > 60) cracks.splice(0, cracks.length-60);
}

// ---------- 破片パーティクル ----------
function spawnSpark(x,y,color){
  const a = Math.random()*Math.PI*2;
  const sp = 2 + Math.random()*7;
  particles.push({
    x,y,
    vx: Math.cos(a)*sp,
    vy: Math.sin(a)*sp - 1,
    life: 1,
    decay: 0.02 + Math.random()*0.03,
    size: 1 + Math.random()*3,
    color
  });
}

// ---------- 大破壊 ----------
function bigBreak(){
  hitstop = 12;
  flash = 1.2;
  part.shakeT = 30;
  // 破片を大量放出
  for(let i=0;i<120;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 3 + Math.random()*12;
    particles.push({
      x: part.x + Math.cos(a)*part.r*Math.random(),
      y: part.y + Math.sin(a)*part.r*Math.random(),
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - 3,
      life: 1,
      decay: 0.012 + Math.random()*0.02,
      size: 2 + Math.random()*5,
      color: ['#ffce6b','#ff8a3d','#ffe9b0','#c94f2b'][Math.floor(Math.random()*4)],
      gravity: 0.25
    });
  }
  // ポップアップ
  popups.push({
    x: part.x, y: part.y - 40,
    text: '部位破壊達成', sub: 'PART BROKEN',
    life: 1, age: 0
  });
  // 3秒後にリセット
  setTimeout(()=>{ if(part.broken) resetPart(); }, 3200);
}

// ---------- ループ ----------
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = Math.min(50, now - last)/16.67; // フレーム正規化
  last = now;

  // ヒットストップ中は時間を止める
  if(hitstop > 0){
    hitstop--;
    render(0);
    return;
  }

  update(dt);
  render(dt);
}

function update(dt){
  // 部位シェイク減衰
  if(part.shakeT > 0) part.shakeT = Math.max(0, part.shakeT - dt);
  flash = Math.max(0, flash - 0.04*dt);

  // パーティクル
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.gravity||0.18)*dt;
    p.vx *= 0.99; p.vy *= 0.99;
    p.life -= p.decay*dt;
    if(p.life <= 0) particles.splice(i,1);
  }
  // ひびフェード
  for(let i=cracks.length-1;i>=0;i--){
    cracks[i].life -= 0.004*dt;
    if(cracks[i].life <= 0) cracks.splice(i,1);
  }
  // ポップアップ
  for(let i=popups.length-1;i>=0;i--){
    const pu = popups[i];
    pu.age += 0.016*dt;
    pu.life = 1 - pu.age/2.2;
    if(pu.life <= 0) popups.splice(i,1);
  }
}

// ---------- 描画 ----------
function render(dt){
  // 背景（暗い洞窟風グラデ）
  const bg = ctx.createRadialGradient(part.x, part.y, 50, W/2, H/2, Math.max(W,H));
  bg.addColorStop(0, '#1a2430');
  bg.addColorStop(1, '#05080c');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  ctx.save();

  // 部位シェイク
  if(part.shakeT > 0){
    const s = part.shakeT * 0.6;
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  drawArmor();
  drawCracks();
  drawParticles();
  drawPopups();

  ctx.restore();

  // フラッシュ
  if(flash > 0){
    ctx.fillStyle = `rgba(255,240,200,${flash*0.6})`;
    ctx.fillRect(0,0,W,H);
  }
}

function drawArmor(){
  const {x,y,r,hp,maxHp,broken,breakTime} = part;

  if(broken){
    // 破壊後：崩れた輪郭
    const t = (performance.now() - breakTime)/1000;
    const alpha = Math.max(0, 1 - t/2.8);
    if(alpha <= 0) return;
    ctx.globalAlpha = alpha;
    // 欠片の残骸
    ctx.fillStyle = '#2a2018';
    ctx.beginPath();
    for(let i=0;i<24;i++){
      const a = (i/24)*Math.PI*2;
      const rr = r * (0.5 + Math.random()*0.5) * (1 - t*0.15);
      const px = x + Math.cos(a)*rr;
      const py = y + Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    return;
  }

  // 装甲本体（金属的なグラデ）
  const g = ctx.createRadialGradient(x-r*0.3, y-r*0.3, r*0.1, x, y, r);
  g.addColorStop(0, '#6b7a88');
  g.addColorStop(0.5, '#3d4956');
  g.addColorStop(1, '#1c232b');
  ctx.fillStyle = g;
  ctx.beginPath();
  // ゴツゴツした多角形の装甲
  const N = 18;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2 - Math.PI/2;
    const jag = 0.88 + 0.12*Math.sin(i*7.3);
    const px = x + Math.cos(a)*r*jag;
    const py = y + Math.sin(a)*r*jag;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();

  // 装甲の縁取り
  ctx.strokeStyle = 'rgba(150,180,210,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 中央の核（目っぽい発光）
  const coreG = ctx.createRadialGradient(x, y, 2, x, y, r*0.35);
  coreG.addColorStop(0, `rgba(255,${100+hp*1.2},60,0.9)`);
  coreG.addColorStop(1, 'rgba(255,80,30,0)');
  ctx.fillStyle = coreG;
  ctx.beginPath();
  ctx.arc(x, y, r*0.35, 0, Math.PI*2);
  ctx.fill();

  // HPバー（円弧）
  const hpRatio = hp/maxHp;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(x, y, r+18, -Math.PI/2, Math.PI*1.5);
  ctx.stroke();

  ctx.strokeStyle = hpRatio > 0.5 ? '#5ad06a' : hpRatio > 0.25 ? '#ffcf3d' : '#ff4433';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(x, y, r+18, -Math.PI/2, -Math.PI/2 + Math.PI*2*hpRatio);
  ctx.stroke();

  // 発光
  ctx.shadowBlur = 20;
  ctx.shadowColor = 'rgba(120,180,255,0.6)';
  ctx.strokeStyle = 'rgba(160,200,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x, y, r+18, 0, Math.PI*2);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawCracks(){
  for(const c of cracks){
    ctx.strokeStyle = `rgba(20,10,5,${c.life})`;
    ctx.lineWidth = 2.5;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(255,180,80,${c.life*0.8})`;
    for(const [x1,y1,x2,y2] of c.segs){
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawPopups(){
  for(const pu of popups){
    const t = pu.age;
    const scale = Math.min(1, t*4);            // ポンと出る
    const alpha = Math.min(1, pu.life*2);
    ctx.save();
    ctx.translate(pu.x, pu.y - t*30);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';

    // サブ（英語）
    ctx.font = 'bold 18px "Segoe UI",sans-serif';
    ctx.fillStyle = '#ffcf3d';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ff8a00';
    ctx.fillText(pu.sub, 0, -30);

    // メイン（日本語）
    ctx.font = 'bold 48px "Yu Gothic","Hiragino Sans",sans-serif';
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ff8a00';
    ctx.fillText(pu.text, 0, 20);

    ctx.restore();
  }
}

requestAnimationFrame(loop);
</script>
</body>
</html>
