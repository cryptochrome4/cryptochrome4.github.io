<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONSTER HUNT CARD GAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Shippori+Mincho:wght@400;700&family=Inter:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0705;
    background-image: radial-gradient(circle at 20% 30%, #241a12 0%, #0a0705 90%);
    font-family: 'Shippori Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
    color: #e8dcc8;
  }

  /* ===================== オープニング ===================== */
  #opening {
    position: fixed; inset: 0;
    background-image: url("img368monster.jpg");
    background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100;
  }
  #opening::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 60%, rgba(10,7,5,0.4), rgba(10,7,5,0.85)); z-index: 0;
  }
  #opening .title {
    position: relative; z-index: 1;
    font-family: 'Cinzel', serif; color: #e8a53a;
    font-size: clamp(28px, 6vw, 64px); letter-spacing: 0.15em; font-weight: 900;
    text-shadow: 0 0 30px rgba(232,80,20,0.7), 0 2px 6px #000;
    margin-bottom: 12px; text-align: center;
  }
  #opening .subtitle {
    position: relative; z-index: 1; color: #c9a877;
    font-family: 'Cinzel', serif; font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 0.35em; margin-bottom: 50px;
  }
  .btn-area { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 16px; align-items: center; }

  /* 共通ボタン */
  .btn {
    min-width: 220px; padding: 12px 28px;
    font-family: 'Cinzel', serif; font-size: clamp(13px, 1.8vw, 17px);
    font-weight: 700; letter-spacing: 0.2em; color: #e8c99a;
    background: linear-gradient(180deg, #2a1d12 0%, #140c06 100%);
    border: 1.5px solid #b8822f; border-radius: 3px; cursor: pointer;
    text-shadow: 0 1px 2px #000;
    box-shadow: inset 0 0 12px rgba(232,150,50,0.1), 0 4px 0 #0a0603, 0 6px 12px rgba(0,0,0,0.6);
    transition: all 0.12s ease; transform: translateY(-2px);
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, #3a2818 0%, #1e140a 100%);
    color: #ffdf9e; box-shadow: inset 0 0 16px rgba(255,180,60,0.25), 0 2px 0 #0a0603, 0 8px 16px rgba(0,0,0,0.7);
    transform: translateY(0);
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #0a0603, 0 4px 8px rgba(0,0,0,0.6); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: 0 2px 0 #0a0603; transform: translateY(0); }

  /* 背景ビューア */
  #bgViewer { position: fixed; inset: 0; z-index: 200; background: #000; display: none; justify-content: center; align-items: center; }
  #bgViewer.active { display: flex; }
  #bgViewer img { width: 100%; height: 100%; object-fit: fill; display: block; }
  #bgViewer .close-viewer {
    position: absolute; top: 20px; right: 20px; z-index: 210; padding: 10px 24px;
    font-family: 'Cinzel', serif; letter-spacing: 0.2em; color: #e8d5b8;
    background: rgba(0,0,0,0.7); border: 1.5px solid #b8822f; cursor: pointer;
  }
  #bgViewer .close-viewer:hover { background: rgba(184,130,47,0.25); color: #ffeac2; }

  /* ゲーム画面 */
  #game {
    position: fixed; inset: 0; display: none; flex-direction: column;
    background: radial-gradient(circle at 50% 0%, #1e1408 0%, #0a0705 70%);
    z-index: 50; overflow: hidden;
  }
  #game.active { display: flex; }

  #topBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 18px;
    background: linear-gradient(180deg, rgba(26,18,12,0.98) 0%, rgba(10,7,5,0.98) 100%);
    border-bottom: 1px solid rgba(232,165,58,0.4);
    font-size: 14px; letter-spacing: 0.12em; flex-shrink: 0; gap: 12px;
  }
  #topBar .left-group { display: flex; align-items: center; gap: 10px; }
  #topBar .clock {
    font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums;
    color: #e8a53a; text-shadow: 0 0 10px rgba(232,165,58,0.5);
  }
  #topBar .money {
    font-family: 'Cinzel', serif; font-weight: 700; color: #ffeac2;
    text-shadow: 0 0 8px rgba(232,165,58,0.4);
  }
  .bg-toggle-group {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 8px; border-left: 1px solid rgba(232,165,58,0.25);
  }
  .mini-btn {
    font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.1em;
    color: #e8c99a; background: rgba(20,14,8,0.9);
    border: 1px solid #b8822f; border-radius: 3px; padding: 3px 8px; cursor: pointer;
    transition: all 0.12s ease;
  }
  .mini-btn:hover { background: rgba(184,130,47,0.3); color: #ffeac2; }
  .mini-btn.on { background: #b8822f; color: #10080a; }
  #fitSelect {
    background: #140c06; color: #e8c99a; border: 1px solid #b8822f;
    border-radius: 3px; font-family: 'Inter', sans-serif; font-size: 10px; padding: 3px 4px;
  }

  #main { flex: 1; display: flex; overflow: hidden; }

  #packArea {
    flex: 1.4; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 12px;
    position: relative; overflow: hidden;
  }
  #leftBgLayer {
    position: absolute; inset: 0; z-index: 0; display: none;
    background-image: url("img367monster.jpg");
    background-repeat: no-repeat; background-position: center;
    background-size: cover;
  }
  #leftBgLayer.active { display: block; }
  #leftBgLayer::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10,7,5,0.55), rgba(10,7,5,0.75));
  }
  #packArea > *:not(#leftBgLayer) { position: relative; z-index: 1; }

  #packCardWrap { display: none; flex-direction: column; align-items: center; gap: 10px; }
  #packCardWrap.active { display: flex; }

  /* =========================================================
     モンスターカード骨格（モンハン風）
  ========================================================= */
  .ygo-card {
    width: 260px; height: 380px; padding: 10px;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
    transition: box-shadow 0.3s ease;
    border-radius: 4px;
  }

  .ygo-card.beast {
    background:
      repeating-linear-gradient(135deg, rgba(120,90,50,0.06) 0px, rgba(120,90,50,0.06) 3px, transparent 3px, transparent 9px),
      radial-gradient(ellipse at 25% 15%, rgba(220,150,60,0.15) 0%, transparent 55%),
      linear-gradient(160deg, #2a1d10 0%, #100a05 100%);
    box-shadow:
      inset 0 0 30px rgba(220,140,50,0.15),
      inset 0 0 0 1px rgba(200,150,70,0.5),
      0 15px 30px rgba(0,0,0,0.8);
    border: 1px solid rgba(160,110,50,0.6);
    color: #e8cf9a;
  }
  .ygo-card.spirit {
    background:
      repeating-linear-gradient(45deg, rgba(80,20,120,0.12) 0px, rgba(80,20,120,0.12) 2px, transparent 2px, transparent 8px),
      radial-gradient(ellipse at 30% 20%, rgba(140,40,200,0.18) 0%, transparent 55%),
      linear-gradient(160deg, #1a0a28 0%, #060208 100%);
    box-shadow:
      inset 0 0 35px rgba(140,40,200,0.2),
      inset 0 0 0 1px rgba(120,50,180,0.5),
      0 18px 35px rgba(0,0,0,0.9);
    border: 1px solid rgba(140,60,200,0.55);
    color: #d8b8f0;
  }
  .ygo-card.silver {
    background:
      linear-gradient(115deg, transparent 30%, rgba(200,220,240,0.12) 48%, rgba(255,255,255,0.18) 50%, rgba(200,220,240,0.12) 52%, transparent 70%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 6px),
      linear-gradient(160deg, #1a1a20 0%, #08080c 100%);
    box-shadow:
      inset 0 0 30px rgba(160,180,220,0.15),
      inset 0 0 0 1px rgba(180,200,230,0.5),
      0 20px 35px rgba(0,0,0,0.9);
    border: 1px solid rgba(180,200,230,0.5);
    color: #c8d4ec;
  }
  .ygo-card.marble {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(180,80,255,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(120,40,200,0.14) 0%, transparent 50%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 6px),
      linear-gradient(160deg, #1a0a28 0%, #060208 100%);
    box-shadow:
      inset 0 0 40px rgba(160,70,240,0.2),
      inset 0 0 0 1.5px rgba(180,90,240,0.6),
      0 20px 35px rgba(0,0,0,0.9);
    border: 1.5px solid rgba(180,90,240,0.7);
    color: #dcb8f8;
  }
  .ygo-card.gold {
    background:
      linear-gradient(115deg, transparent 30%, rgba(232,165,58,0.22) 48%, rgba(255,230,150,0.32) 50%, rgba(232,165,58,0.22) 52%, transparent 70%),
      radial-gradient(ellipse at 30% 20%, rgba(232,165,58,0.15) 0%, transparent 50%),
      repeating-linear-gradient(0deg, rgba(232,165,58,0.04) 0px, rgba(232,165,58,0.04) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, #221608 0%, #08050a 100%);
    box-shadow:
      inset 0 0 40px rgba(232,165,58,0.2),
      inset 0 0 0 1.5px rgba(232,165,58,0.8),
      0 0 30px rgba(232,165,58,0.4),
      0 20px 40px rgba(0,0,0,0.9);
    border: 1.5px solid rgba(232,165,58,0.85);
    color: #f0cf78;
  }

  .ygo-name {
    font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700;
    padding: 5px 8px; text-align: center; letter-spacing: 0.08em; min-height: 28px;
    display: flex; justify-content: center; align-items: center; gap: 6px;
    position: relative; z-index: 2;
  }
  .beast  .ygo-name { background: rgba(160,100,30,0.35); color: #ffe2a0; border: 1px solid rgba(200,140,60,0.4); }
  .spirit .ygo-name { background: rgba(80,20,140,0.5);  color: #e0c0ff; border: 1px solid rgba(140,60,200,0.4); }
  .silver .ygo-name { background: rgba(30,40,60,0.6);   color: #d0dcf0; border: 1px solid rgba(180,200,230,0.35); }
  .marble .ygo-name { background: rgba(60,20,90,0.6);   color: #e0c0ff; border: 1px solid rgba(180,90,240,0.4); }
  .gold   .ygo-name { background: rgba(40,25,8,0.7);    color: #ffdc8a; border: 1px solid rgba(232,165,58,0.55); }

  .ygo-attr-mark {
    display: inline-block; width: 20px; height: 20px; line-height: 18px;
    text-align: center; border-radius: 50%; font-size: 11px; font-weight: 700;
    font-family: 'Shippori Mincho', serif; flex-shrink: 0;
  }
  .ygo-attr-mark.beast  { background: #8a4a10; color: #ffe2a0; border: 1px solid rgba(255,200,100,0.5); }
  .ygo-attr-mark.spirit { background: #5a1090; color: #e0c0ff; border: 1px solid rgba(200,120,255,0.6); }

  .ygo-art {
    flex: 1; margin: 6px 0; border-radius: 3px;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative; z-index: 2;
  }
  .beast  .ygo-art { background: #10080a; border: 1.5px solid rgba(200,140,60,0.45); }
  .spirit .ygo-art { background: #0a0510; border: 1.5px solid rgba(140,60,200,0.5); }
  .silver .ygo-art { background: #08080c; border: 1.5px solid rgba(180,200,230,0.4); }
  .marble .ygo-art { background: #0a0510; border: 1.5px solid rgba(180,90,240,0.5); }
  .gold   .ygo-art { background: #060504; border: 1.5px solid rgba(232,165,58,0.6); }
  .ygo-art canvas { width: 100%; height: 100%; image-rendering: auto; }

  .ygo-stats {
    display: flex; justify-content: space-between;
    font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums;
    font-size: 12px; font-weight: 700; padding: 4px 8px; letter-spacing: 0.05em;
    position: relative; z-index: 2;
  }
  .beast  .ygo-stats { background: rgba(160,100,30,0.25); color: #ffe2a0; border: 1px solid rgba(200,140,60,0.3); }
  .spirit .ygo-stats { background: rgba(80,20,140,0.4);   color: #e0c0ff; border: 1px solid rgba(140,60,200,0.3); }
  .silver .ygo-stats { background: rgba(20,30,50,0.6);    color: #d0dcf0; border: 1px solid rgba(180,200,230,0.25); }
  .marble .ygo-stats { background: rgba(50,15,80,0.6);    color: #e0c0ff; border: 1px solid rgba(180,90,240,0.35); }
  .gold   .ygo-stats { background: rgba(40,25,8,0.7);     color: #ffdc8a; border: 1px solid rgba(232,165,58,0.4); }

  .ygo-effect {
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 10px;
    padding: 5px 7px; margin-top: 5px; min-height: 36px; line-height: 1.35;
    position: relative; z-index: 2;
  }
  .beast  .ygo-effect { background: rgba(20,10,5,0.6);  color: #e8cfa8; border: 1px solid rgba(200,140,60,0.3); }
  .spirit .ygo-effect { background: rgba(15,5,25,0.7);  color: #d8b8f0; border: 1px solid rgba(140,60,200,0.35); }
  .silver .ygo-effect { background: rgba(0,0,0,0.6);    color: #c8d4ec; border: 1px solid rgba(180,200,230,0.25); }
  .marble .ygo-effect { background: rgba(15,5,25,0.7);  color: #d8b8f0; border: 1px solid rgba(180,90,240,0.35); }
  .gold   .ygo-effect { background: rgba(20,12,3,0.75); color: #e8cf9a; border: 1px solid rgba(232,165,58,0.4); }

  .type-tag { font-weight: 700; letter-spacing: 0.05em; }
  .type-tag.fang  { color: #ffb86b; }
  .type-tag.curse { color: #c88aff; }
  .beast  .type-tag.fang  { color: #ffa040; }
  .spirit .type-tag.curse { color: #d0a0ff; }

  .ygo-card.silver::before, .ygo-card.marble::before, .ygo-card.gold::before {
    content: ""; position: absolute; inset: 4px; border-radius: 2px; pointer-events: none; z-index: 1;
  }
  .silver::before { border: 1px solid rgba(180,200,230,0.25); }
  .marble::before { border: 1px solid rgba(180,90,240,0.3); box-shadow: inset 0 0 15px rgba(140,40,200,0.15); }
  .gold::before   { border: 1px solid rgba(232,165,58,0.5); box-shadow: inset 0 0 18px rgba(232,165,58,0.2); }

  .pack-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .pack-controls .btn { min-width: 88px; padding: 8px 12px; font-size: 10px; letter-spacing: 0.15em; }

  #buyArea { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #buyArea .buy-note { font-family: 'Inter', sans-serif; font-size: 11px; color: #a08868; letter-spacing: 0.15em; }

  #infoPanel {
    flex: 1; border-left: 1px solid rgba(232,165,58,0.35);
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(20,12,6,0.97) 0%, rgba(10,7,5,0.97) 100%);
    overflow: hidden;
  }
  #infoPanel h3 {
    font-family: 'Cinzel', serif; font-size: 12px; padding: 10px 12px;
    letter-spacing: 0.22em; color: #e8a53a;
    border-bottom: 1px solid rgba(232,165,58,0.35);
    background: linear-gradient(90deg, rgba(232,165,58,0.1), transparent);
    text-shadow: 0 0 8px rgba(232,165,58,0.4);
  }
  #sortSelect {
    margin: 8px 10px; padding: 5px 6px;
    background: #1a1008; color: #e8c99a;
    border: 1px solid rgba(184,130,47,0.6); border-radius: 3px;
    font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.08em;
  }
  #infoList { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .info-item {
    padding: 6px 8px; font-size: 12px;
    border-bottom: 1px solid rgba(184,130,47,0.18);
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    color: #e8dcc8; font-family: 'Shippori Mincho', serif; transition: background 0.15s ease;
  }
  .info-item:hover { background: rgba(232,165,58,0.1); }

  #priceTable {
    border-top: 1px solid rgba(232,165,58,0.35);
    max-height: 38%; display: flex; flex-direction: column; overflow: hidden;
  }
  #priceTable h3 {
    font-size: 11px; padding: 8px 12px; color: #e8a53a;
    border-bottom: 1px solid rgba(232,165,58,0.35);
    background: linear-gradient(90deg, rgba(232,165,58,0.1), transparent);
    font-family: 'Cinzel', serif; letter-spacing: 0.2em;
  }
  #priceList { flex: 1; overflow-y: auto; padding: 4px 10px; font-size: 11px; font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
  .price-row {
    display: flex; justify-content: space-between; padding: 3px 0;
    border-bottom: 1px dashed rgba(232,165,58,0.18); color: #d8c8a8;
  }
  .price-row .up { color: #8ee7a8; }
  .price-row .down { color: #ff8a8a; }

  #modal {
    position: fixed; inset: 0; background: rgba(5,3,2,0.92);
    display: none; justify-content: center; align-items: center; z-index: 300; backdrop-filter: blur(4px);
  }
  #modal.active { display: flex; }
  #modalInner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #modalControls { display: flex; gap: 12px; }
  #modalControls .btn { min-width: 120px; }

  #footer {
    flex-shrink: 0; height: 24px; background: rgba(5,3,2,0.97);
    display: flex; justify-content: flex-end; align-items: center;
    padding: 0 14px; font-size: 11px; border-top: 1px solid rgba(232,165,58,0.18);
  }
  #studyLink {
    display: none; color: #4a3e30; text-decoration: none;
    letter-spacing: 0.15em; font-family: 'Inter', sans-serif; font-size: 10px;
  }
  #studyLink:hover { color: #e8a53a; text-shadow: 0 0 6px rgba(232,165,58,0.5); }
  #studyLink.visible { display: inline; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
  ::-webkit-scrollbar-thumb { background: rgba(184,130,47,0.35); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(232,165,58,0.55); }

  #fxCanvas {
    position: fixed; inset: 0; z-index: 250; pointer-events: none;
    display: none;
  }
  #fxCanvas.active { display: block; }

  #fxLog {
    position: fixed; z-index: 260; pointer-events: none;
    font-family: 'Cinzel', serif; font-weight: 900;
    text-shadow: 0 0 20px currentColor, 0 2px 4px #000;
    opacity: 0; transition: none;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div id="opening">
  <div class="title">MONSTER HUNT CARD</div>
  <div class="subtitle">ANCIENT BEASTS &amp; WICKED SPIRITS</div>
  <div class="btn-area">
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn" id="viewBgBtn">背景画像を見る</button>
  </div>
</div>

<div id="bgViewer">
  <img src="img368monster.jpg" alt="背景画像">
  <button class="close-viewer" id="closeViewerBtn">CLOSE</button>
</div>

<div id="game">
  <div id="topBar">
    <div class="left-group">
      <div class="clock" id="clock">00:00:00</div>
      <div class="bg-toggle-group">
        <button class="mini-btn" id="bgToggleBtn" title="左側の背景画像を表示/非表示">背景</button>
        <select id="fitSelect" title="背景画像のフィット方法">
          <option value="cover">cover</option>
          <option value="contain">contain</option>
          <option value="fill">fill</option>
          <option value="none">none</option>
          <option value="100% 100%">100% 100%</option>
        </select>
      </div>
    </div>
    <div class="money" id="moneyDisplay">所持金：200G</div>
  </div>

  <div id="main">
    <div id="packArea">
      <div id="leftBgLayer"></div>

      <div id="buyArea">
        <button class="btn" id="buyPackBtn">パックを買う（200G）</button>
        <div class="buy-note">1 PACK = 7 CARDS</div>
      </div>

      <div id="packCardWrap">
        <div class="ygo-card beast" id="packCard">
          <div class="ygo-name" id="packName"></div>
          <div class="ygo-art"><canvas id="packCanvas" width="200" height="200"></canvas></div>
          <div class="ygo-stats">
            <span id="packAtk">ATK 0</span>
            <span id="packDef">DEF 0</span>
          </div>
          <div class="ygo-effect" id="packEffect"></div>
        </div>
        <div class="pack-controls">
          <button class="btn" id="prevBtn">PREV</button>
          <button class="btn" id="nextBtn">NEXT</button>
          <button class="btn" id="sellNowBtn">その場で売る</button>
          <button class="btn" id="endPackBtn">売らずに開封終了</button>
        </div>
      </div>
    </div>

    <div id="infoPanel">

function typeClass(t)  { return t === "curse" ? "curse" : "fang"; }
function rarityClass(card) {
  if (card.rarity === "UR") return "gold";
  if (card.rarity === "SR") return "marble";
  if (card.rarity === "R")  return "silver";
  return card.attr === "悪" ? "spirit" : "beast";
}

const MARKET = {};
CARD_MASTER.forEach(card => {
  MARKET[card.name] = {
    trend: Math.random() < 0.5 ? "up" : "down",
    basePrice: card.basePrice,
    maxPrice: card.basePrice * 2,
    minPrice: 0,
    currentPrice: card.basePrice
  };
});

/* =========================================================
   エンブレム描画（card オブジェクトを受け取る）
========================================================= */
function drawEmblem(canvas, card) {
  const emblem = card.emblem;
  const rarity = card.rarity;
  const attr = card.attr;
  const palette = card.palette || null;

  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // 背景
  const bg = ctx.createRadialGradient(W*0.3, H*0.2, W*0.1, W/2, H/2, W*0.8);
  if (rarity === "UR") { bg.addColorStop(0, "#2a1a05"); bg.addColorStop(1, "#050302"); }
  else if (rarity === "SR") { bg.addColorStop(0, "#200a30"); bg.addColorStop(1, "#040208"); }
  else if (rarity === "R") { bg.addColorStop(0, "#101828"); bg.addColorStop(1, "#04060c"); }
  else if (attr === "悪") { bg.addColorStop(0, "#180828"); bg.addColorStop(1, "#030206"); }
  else { bg.addColorStop(0, "#0f1a10"); bg.addColorStop(1, "#040604"); }
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // スケール
  ctx.strokeStyle = (attr === "悪") ? "rgba(140,60,200,0.08)" : "rgba(180,200,120,0.07)";
  ctx.lineWidth = 1;
  const sc = 22;
  for (let y = -sc; y < H + sc; y += sc*0.75) {
    for (let x = -sc; x < W + sc; x += sc) {
      const ox = (Math.round(y/(sc*0.75)) % 2) * (sc/2);
      ctx.beginPath(); ctx.arc(x + ox, y, sc*0.45, 0.2, Math.PI - 0.2); ctx.stroke();
    }
  }

  const cx = W/2, cy = H/2 - 4;
  const s = W / 200;

  ctx.save();
  ctx.translate(cx, cy);

  const badgeR = 68 * s;
  const badgeGrad = ctx.createRadialGradient(-12*s, -12*s, 4*s, 0, 0, badgeR);
  if (rarity === "UR") { badgeGrad.addColorStop(0, "#3a2408"); badgeGrad.addColorStop(1, "#0a0502"); }
  else if (rarity === "SR") { badgeGrad.addColorStop(0, "#30105a"); badgeGrad.addColorStop(1, "#06020c"); }
  else if (rarity === "R") { badgeGrad.addColorStop(0, "#14203a"); badgeGrad.addColorStop(1, "#040608"); }
  else if (attr === "悪") { badgeGrad.addColorStop(0, "#220a3a"); badgeGrad.addColorStop(1, "#040208"); }
  else { badgeGrad.addColorStop(0, "#1a1a10"); badgeGrad.addColorStop(1, "#080806"); }
  ctx.fillStyle = badgeGrad;
  ctx.beginPath(); ctx.arc(0, 0, badgeR, 0, Math.PI*2); ctx.fill();

  ctx.lineWidth = 2*s;
  if (rarity === "UR") ctx.strokeStyle = "rgba(232,165,58,0.95)";
  else if (rarity === "SR") ctx.strokeStyle = "rgba(180,90,240,0.8)";
  else if (rarity === "R") ctx.strokeStyle = "rgba(180,200,230,0.7)";
  else if (attr === "悪") ctx.strokeStyle = "rgba(140,60,200,0.6)";
  else ctx.strokeStyle = "rgba(160,180,100,0.6)";
  ctx.beginPath(); ctx.arc(0, 0, badgeR, 0, Math.PI*2); ctx.stroke();

  ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.arc(0, 0, badgeR - 6*s, 0, Math.PI*2); ctx.stroke();

  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, badgeR - 8*s, 0, Math.PI*2); ctx.clip();
  drawMonsterMotif(ctx, emblem, s, rarity, attr, palette);
  ctx.restore();
  ctx.restore();

  // 外枠
  if (rarity === "UR") { ctx.strokeStyle = "rgba(232,165,58,0.9)"; ctx.lineWidth = 3; ctx.strokeRect(2,2,W-4,H-4); }
  else if (rarity === "SR") { ctx.strokeStyle = "rgba(180,90,240,0.7)"; ctx.lineWidth = 2; ctx.strokeRect(2,2,W-4,H-4); }
  else if (rarity === "R") { ctx.strokeStyle = "rgba(180,200,230,0.5)"; ctx.lineWidth = 1; ctx.strokeRect(2,2,W-4,H-4); }
  else if (attr === "悪") { ctx.strokeStyle = "rgba(140,60,200,0.4)"; ctx.lineWidth = 1; ctx.strokeRect(2,2,W-4,H-4); }
  else { ctx.strokeStyle = "rgba(160,180,100,0.35)"; ctx.lineWidth = 1; ctx.strokeRect(2,2,W-4,H-4); }
}

function drawLabel(ctx, text, s, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `700 ${13*s}px 'Cinzel', 'Shippori Mincho', sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowBlur = 6*s; ctx.shadowColor = color;
  ctx.fillText(text, 0, 46*s);
  ctx.restore();
}

/* =========================================================
   モンスターシルエット描画
   - palette が渡されたらそれを使用（恐竜系は個別配色）
   - palette が null なら従来デフォルト（悪霊系）
========================================================= */
function drawMonsterMotif(ctx, emblem, s, rarity, attr, palette) {
  const reset = () => { ctx.shadowBlur = 0; };
  const glow = (c, b) => { ctx.shadowColor = c; ctx.shadowBlur = (b||8)*s; };

  const isRare = rarity === "R" || rarity === "SR" || rarity === "UR";

  let P;
  if (palette) {
    // 個別配色（恐竜系）
    P = {
      body:    palette.body,
      bodyHi:  palette.bodyHi,
      belly:   palette.belly,
      scale:   palette.scale,
      horn:    palette.horn,
      tooth:   "#f0f0e8",
      eye:     palette.eye,
      eyeGlow: palette.eyeGlow,
      wing:    palette.wing  || (attr === "悪" ? "#5a1880" : "#4a5a3a"),
      wingHi:  palette.wingHi|| (attr === "悪" ? "#8a40b0" : "#7a8a58"),
      spike:   palette.spike,
      claw:    "#f8f0d8",
      aura:    palette.aura
    };
  } else {
    // デフォルト（悪霊系はこちら）
    P = {
      body:   attr === "悪"
                ? (rarity==="UR" ? "#5a2a8a" : rarity==="SR" ? "#4a1a6a" : "#3a1050")
                : (rarity==="UR" ? "#5a7a3a" : rarity==="SR" ? "#4a6a30" : "#3a5a28"),
      bodyHi: attr === "悪"
                ? (rarity==="UR" ? "#a070d0" : "#8050b0")
                : (rarity==="UR" ? "#9ab060" : rarity==="SR" ? "#7a9040" : "#6a8038"),
      belly:  attr === "悪" ? "#2a0a3a" : "#c8b880",
      scale:  attr === "悪" ? "#2a0850" : "#1e3020",
      horn:   rarity==="UR" ? "#ffe0a0" : rarity==="SR" ? "#d0b0ff" : isRare ? "#e0e0f0" : "#e8d8b0",
      tooth:  "#f0f0e8",
      eye:    attr === "悪" ? "#ff2060" : "#ffcc00",
      eyeGlow:attr === "悪" ? "#ff4080" : "#ffe060",
      wing:   attr === "悪" ? "#5a1880" : "#4a5a3a",
      wingHi: attr === "悪" ? "#8a40b0" : "#7a8a58",
      spike:  attr === "悪" ? "#a050d0" : "#b8a070",
      claw:   "#f8f0d8",
      aura:   attr === "悪" ? "#c060ff" : "#a8c060"
    };
  }

  switch (emblem) {
    case "trex": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath();
      ctx.moveTo(-30*s,-8*s); ctx.quadraticCurveTo(-30*s,-28*s, 0,-28*s);
      ctx.quadraticCurveTo(28*s,-28*s, 32*s,-4*s);
      ctx.lineTo(22*s, 6*s); ctx.lineTo(10*s, 8*s);
      ctx.lineTo(6*s, 18*s); ctx.lineTo(-2*s, 18*s);
      ctx.lineTo(-6*s, 6*s); ctx.lineTo(-22*s, 8*s);
      ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.belly;
      ctx.beginPath(); ctx.ellipse(2*s, 6*s, 16*s, 4*s, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = P.scale;
      for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(-10*s + i*8*s, -6*s, 2*s, 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 10);
      ctx.beginPath(); ctx.arc(10*s,-12*s, 3.5*s, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.tooth;
      for (let i=0;i<5;i++){
        ctx.beginPath();
        ctx.moveTo(6*s + i*5*s, 8*s); ctx.lineTo(8*s + i*5*s, 14*s); ctx.lineTo(10*s + i*5*s, 8*s);
        ctx.closePath(); ctx.fill();
      }
      drawLabel(ctx, "T-REX", s, P.aura);
      break;
    }
    case "tricera": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath();
      ctx.moveTo(-28*s, 6*s); ctx.quadraticCurveTo(-28*s,-18*s, 0,-20*s);
      ctx.quadraticCurveTo(26*s,-20*s, 28*s, 0);
      ctx.lineTo(18*s, 10*s); ctx.lineTo(-18*s, 10*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.bodyHi;
      ctx.beginPath();
      ctx.moveTo(-18*s,-16*s); ctx.lineTo(-32*s,-28*s); ctx.lineTo(-22*s,-14*s);
      ctx.lineTo(-32*s,-8*s); ctx.lineTo(-20*s,-4*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.spike;
      for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-24*s + i*3*s, -14*s + i*3*s, 1.8*s, 0, Math.PI*2); ctx.fill(); }
      ctx.strokeStyle = P.horn; ctx.lineWidth = 3*s; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(18*s,-6*s); ctx.lineTo(34*s,-16*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(20*s,-2*s); ctx.lineTo(36*s,-4*s); ctx.stroke();
      reset();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 10);
      ctx.beginPath(); ctx.arc(10*s,-8*s, 3*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "TRICERA", s, P.aura);
      break;
    }
    case "raptor": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath();
      ctx.moveTo(-24*s,-4*s); ctx.quadraticCurveTo(-24*s,-18*s, 0,-18*s);
      ctx.lineTo(28*s,-8*s); ctx.lineTo(20*s, 2*s);
      ctx.lineTo(4*s, 4*s); ctx.lineTo(0, 14*s);
      ctx.lineTo(-8*s, 6*s); ctx.lineTo(-22*s, 8*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.bodyHi;
      ctx.beginPath();
      ctx.moveTo(-14*s,-14*s); ctx.quadraticCurveTo(-4*s,-18*s, 8*s,-12*s);
      ctx.lineTo(4*s,-8*s); ctx.quadraticCurveTo(-4*s,-12*s,-12*s,-10*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 8);
      ctx.beginPath(); ctx.arc(8*s,-8*s, 2.8*s, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.strokeStyle = P.claw; ctx.lineWidth = 2*s;
      ctx.beginPath(); ctx.moveTo(28*s,-8*s); ctx.lineTo(36*s,-12*s); ctx.stroke();
      drawLabel(ctx, "RAPTOR", s, P.aura);
      break;
    }
    case "veloci": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath();
      ctx.moveTo(-16*s,-18*s); ctx.lineTo(4*s,-14*s); ctx.lineTo(8*s,-8*s);
      ctx.lineTo(-2*s,-6*s); ctx.lineTo(-8*s,0*s); ctx.lineTo(-20*s,-4*s);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-4*s, 4*s, 18*s, 8*s, -0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-10*s, 8*s); ctx.lineTo(-16*s, 22*s); ctx.lineTo(-10*s, 22*s); ctx.lineTo(-6*s, 10*s); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(6*s, 8*s); ctx.lineTo(10*s, 22*s); ctx.lineTo(16*s, 22*s); ctx.lineTo(10*s, 8*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.bodyHi;
      ctx.beginPath();
      ctx.moveTo(-20*s, 2*s); ctx.quadraticCurveTo(-36*s, 0, -40*s,-12*s);
      ctx.lineTo(-34*s,-10*s); ctx.quadraticCurveTo(-30*s, 2, -20*s, 8*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = "#ff6a20"; glow("#ff6a20", 12);
      ctx.beginPath(); ctx.arc(-30*s,-18*s, 3*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-38*s,-14*s, 2*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "VELOCIRA", s, P.aura);
      break;
    }
    case "ptera": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath(); ctx.ellipse(0, 4*s, 10*s, 16*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = P.wing;
      ctx.beginPath();
      ctx.moveTo(0,-6*s); ctx.quadraticCurveTo(-30*s,-24*s,-42*s,-8*s);
      ctx.quadraticCurveTo(-24*s,-10*s,-6*s,4*s); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0,-6*s); ctx.quadraticCurveTo(30*s,-24*s,42*s,-8*s);
      ctx.quadraticCurveTo(24*s,-10*s,6*s,4*s); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = P.wingHi; ctx.lineWidth = 1.5*s;
      ctx.beginPath(); ctx.moveTo(0,-6*s); ctx.lineTo(-42*s,-8*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-6*s); ctx.lineTo(42*s,-8*s); ctx.stroke();
      ctx.fillStyle = P.body;
      ctx.beginPath();
      ctx.moveTo(-6*s,-14*s); ctx.lineTo(0,-24*s); ctx.lineTo(6*s,-14*s);
      ctx.lineTo(4*s,-6*s); ctx.lineTo(-4*s,-6*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#e8b040";
      ctx.beginPath(); ctx.moveTo(0,-24*s); ctx.lineTo(18*s,-28*s); ctx.lineTo(4*s,-22*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 8);
      ctx.beginPath(); ctx.arc(0,-16*s, 2*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "PTERA", s, P.aura);
      break;
    }
    case "stego": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath(); ctx.ellipse(0, 6*s, 26*s, 12*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-24*s, 2*s); ctx.quadraticCurveTo(-32*s,-10*s,-26*s,-18*s);
      ctx.lineTo(-18*s,-18*s); ctx.quadraticCurveTo(-20*s,-8*s,-16*s, 0*s); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(22*s, 4*s); ctx.lineTo(42*s, -6*s); ctx.lineTo(40*s, 0); ctx.lineTo(24*s, 10*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.spike; glow(P.aura, 4);
      for (let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(i*10*s, -4*s); ctx.lineTo(i*10*s - 4*s, -20*s); ctx.lineTo(i*10*s + 4*s, -20*s);
        ctx.closePath(); ctx.fill();
      }
      reset();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 8);
      ctx.beginPath(); ctx.arc(-20*s,-14*s, 2*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "STEGO", s, P.aura);
      break;
    }
    case "ankylo": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath(); ctx.ellipse(0, 6*s, 26*s, 14*s, 0, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.spike;
      for (let i=-2;i<=2;i++){
        ctx.beginPath(); ctx.arc(i*9*s, -8*s, 4*s, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = P.body;
      ctx.beginPath(); ctx.ellipse(-24*s, 8*s, 8*s, 8*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = P.horn;
      ctx.fillRect(20*s, 4*s, 16*s, 4*s);
      ctx.beginPath(); ctx.arc(40*s, 6*s, 8*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "ANKYLO", s, P.aura);
      break;
    }
    case "brachio": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath(); ctx.ellipse(0, 12*s, 22*s, 12*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-16*s, 6*s); ctx.quadraticCurveTo(-28*s,-20*s,-20*s,-30*s);
      ctx.lineTo(-14*s,-28*s); ctx.quadraticCurveTo(-18*s,-14*s,-8*s, 6*s); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-20*s,-30*s, 6*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-14*s, 20*s, 6*s, 16*s);
      ctx.fillRect(4*s, 20*s, 6*s, 16*s);
      reset();
      ctx.fillStyle = P.bodyHi;
      ctx.beginPath(); ctx.ellipse(0, 16*s, 16*s, 4*s, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 8);
      ctx.beginPath(); ctx.arc(-20*s,-30*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "BRACHIO", s, P.aura);
      break;
    }
    case "spino": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath();
      ctx.moveTo(-24*s,-6*s); ctx.quadraticCurveTo(-24*s,-22*s, -2*s,-22*s);
      ctx.lineTo(24*s,-12*s); ctx.lineTo(20*s,-2*s);
      ctx.lineTo(0, 0); ctx.lineTo(-4*s, 8*s); ctx.lineTo(-14*s, 4*s);
      ctx.lineTo(-22*s, 6*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.bodyHi; glow(P.aura, 4);
      ctx.beginPath();
      ctx.moveTo(-20*s, 6*s);
      ctx.quadraticCurveTo(-4*s,-4*s, 22*s, 4*s);
      for (let i=0;i<5;i++){
        ctx.lineTo(22*s - i*8*s, -20*s + i*2*s);
        ctx.lineTo(18*s - i*8*s, 4*s);
      }
      ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 10);
      ctx.beginPath(); ctx.arc(8*s,-12*s, 3*s, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.tooth;
      for (let i=0;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(6*s + i*4*s, 2*s); ctx.lineTo(8*s + i*4*s, 8*s); ctx.lineTo(10*s + i*4*s, 2*s);
        ctx.closePath(); ctx.fill();
      }
      drawLabel(ctx, "SPINO", s, P.aura);
      break;
    }
    case "dilo": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath();
      ctx.moveTo(-22*s,-2*s); ctx.quadraticCurveTo(-22*s,-16*s, 0,-16*s);
      ctx.lineTo(24*s,-8*s); ctx.lineTo(18*s, 2*s);
      ctx.lineTo(4*s, 4*s); ctx.lineTo(0, 14*s); ctx.lineTo(-8*s, 6*s);
      ctx.lineTo(-20*s, 8*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.bodyHi;
      ctx.beginPath(); ctx.moveTo(-6*s,-16*s); ctx.lineTo(-14*s,-28*s); ctx.lineTo(0,-18*s); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(4*s,-16*s); ctx.lineTo(-2*s,-30*s); ctx.lineTo(10*s,-16*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 8);
      ctx.beginPath(); ctx.arc(8*s,-8*s, 2.5*s, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.tooth;
      for (let i=0;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(4*s + i*4*s, 2*s); ctx.lineTo(6*s + i*4*s, 7*s); ctx.lineTo(8*s + i*4*s, 2*s);
        ctx.closePath(); ctx.fill();
      }
      drawLabel(ctx, "DILO", s, P.aura);
      break;
    }
    case "carno": {
      ctx.fillStyle = P.body; glow(P.aura, 6);
      ctx.beginPath();
      ctx.moveTo(-24*s,-2*s); ctx.quadraticCurveTo(-24*s,-18*s, 2*s,-18*s);
      ctx.lineTo(30*s,-4*s); ctx.lineTo(22*s, 4*s);
      ctx.lineTo(4*s, 6*s); ctx.lineTo(0, 16*s); ctx.lineTo(-8*s, 8*s);
      ctx.lineTo(-20*s, 8*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.bodyHi;
      ctx.beginPath();
      ctx.moveTo(-4*s,-18*s); ctx.lineTo(-10*s,-30*s); ctx.lineTo(2*s,-18*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 8);

    case "helwyvern": {

    }
    case "ghoul": {
      ctx.fillStyle = P.body; glow(P.aura, 8);
      ctx.beginPath(); ctx.arc(0,-4*s, 18*s, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.tooth;
      for (let i=-2;i<=2;i++){
        ctx.beginPath();

    case "banshee": {
      ctx.fillStyle = P.body; glow(P.aura, 10);

      ctx.moveTo(-16*s,-18*s); ctx.quadraticCurveTo(0,-30*s, 16*s,-18*s);
      ctx.lineTo(20*s, 12*s); ctx.lineTo(-20*s, 12*s); ctx.closePath(); ctx.fill();

      ctx.beginPath(); ctx.ellipse(0, 2*s, 6*s, 10*s, 0, 0, Math.PI*2); ctx.fill();

    }
    case "lich": {
      ctx.fillStyle = P.body; glow(P.aura, 10);
      ctx.beginPath();
      ctx.moveTo(-18*s,-20*s); ctx.quadraticCurveTo(0,-32*s, 18*s,-20*s);
      ctx.lineTo(22*s, 6*s); ctx.lineTo(-22*s, 6*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.horn;
      ctx.beginPath(); ctx.arc(0,-4*s, 14*s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#0a0412";
      ctx.beginPath(); ctx.arc(-5*s,-4*s, 3.5*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(5*s,-4*s, 3.5*s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#d8d0e0";
      ctx.fillRect(-4*s, 4*s, 8*s, 6*s);
      ctx.fillStyle = "#0a0412";
      for (let i=0;i<4;i++){ ctx.fillRect(-4*s + i*2*s, 4*s, 1*s, 6*s); }
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 14);
      ctx.beginPath(); ctx.arc(-5*s,-4*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(5*s,-4*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "LICH", s, P.aura);
      break;
    }
    case "nightmare": {
      ctx.fillStyle = P.body; glow(P.aura, 10);
      ctx.beginPath();
      ctx.moveTo(-20*s, 8*s); ctx.quadraticCurveTo(-16*s,-20*s, 4*s,-24*s);
      ctx.lineTo(14*s,-14*s); ctx.lineTo(20*s,-2*s); ctx.lineTo(12*s, 8*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 14);
      ctx.beginPath(); ctx.arc(2*s,-10*s, 3.2*s, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.aura; glow(P.aura, 14);
      for (let i=0;i<4;i++){
        ctx.beginPath();
        ctx.arc(-16*s + i*4*s, -26*s + (i%2)*4*s, 3*s, 0, Math.PI*2); ctx.fill();
      }
      reset();
      drawLabel(ctx, "NIGHTMARE", s, P.aura);
      break;
    }
    case "darklord": {
      ctx.fillStyle = P.body; glow(P.aura, 14);
      ctx.beginPath();
      ctx.moveTo(-26*s,-2*s); ctx.quadraticCurveTo(-26*s,-24*s, 4*s,-24*s);
      ctx.lineTo(32*s,-6*s); ctx.lineTo(24*s, 4*s);
      ctx.lineTo(4*s, 6*s); ctx.lineTo(0, 18*s); ctx.lineTo(-10*s, 8*s);
      ctx.lineTo(-24*s, 10*s); ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = P.spike;
      ctx.beginPath();
      ctx.moveTo(-8*s,-24*s); ctx.lineTo(-18*s,-40*s); ctx.lineTo(0,-26*s); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(6*s,-24*s); ctx.lineTo(0,-38*s); ctx.lineTo(16*s,-24*s); ctx.closePath(); ctx.fill();

      for (let i=0;i<5;i++){
        ctx.beginPath();

    /* ===== 新規悪霊 ===== */
    case "wraith": {
      ctx.fillStyle = P.body; glow(P.aura, 12);

      ctx.quadraticCurveTo(0,-28*s, 18*s,-16*s);

        ctx.lineTo(x, 20*s + (i%2)*6*s);
        ctx.lineTo(x - 4*s, 10*s);

      ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = "#e0e0ff"; glow("#a0a0ff", 14);
      ctx.beginPath(); ctx.arc(-6*s,-8*s, 3*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(6*s,-8*s, 3*s, 0, Math.PI*2); ctx.fill();

      drawLabel(ctx, "WRAITH", s, P.aura);

    }
    case "poltergeist": {
      ctx.fillStyle = P.body; glow(P.aura, 10);
      ctx.fillRect(-14*s, 4*s, 8*s, 16*s);
      ctx.fillRect(-18*s, 0, 16*s, 6*s);
      ctx.fillRect(-16*s, -10*s, 4*s, 12*s);
      ctx.beginPath(); ctx.ellipse(15*s, -6*s, 10*s, 3*s, 0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-20*s, 20*s, 8*s, 2.5*s, -0.2, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 12);
      ctx.beginPath(); ctx.arc(-10*s, -20*s, 2.5*s, 0, Math.PI*2); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-6*s,-14*s); ctx.lineTo(-4*s,-8*s); ctx.lineTo(-2*s,-14*s);

      break;
    }
    case "scarecrow": {
      ctx.fillStyle = P.body; glow(P.aura, 10);
      ctx.fillRect(-2*s, -20*s, 4*s, 40*s);
      ctx.fillRect(-18*s, -8*s, 36*s, 4*s);
      ctx.fillStyle = P.bodyHi;
      ctx.beginPath(); ctx.ellipse(0,-24*s, 10*s, 12*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = P.scale; ctx.lineWidth = 1.2*s;
      ctx.beginPath(); ctx.moveTo(-8*s,-26*s); ctx.lineTo(8*s,-26*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6*s,-22*s); ctx.lineTo(6*s,-22*s); ctx.stroke();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(-4*s,-28*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(4*s,-28*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = P.spike; ctx.lineWidth = 1.2*s;
      for (let i=0;i<3;i++){
        ctx.beginPath(); ctx.moveTo(-18*s + i*2*s, -8*s); ctx.lineTo(-26*s + i*2*s, -4*s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(18*s - i*2*s, -8*s); ctx.lineTo(26*s - i*2*s, -4*s); ctx.stroke();
      }
      reset();
      drawLabel(ctx, "SCARECROW", s, P.aura);
      break;
    }
    case "doppel": {
      ctx.fillStyle = P.body; glow(P.aura, 10);
      ctx.beginPath(); ctx.arc(-14*s,-10*s, 6*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-14*s, 6*s, 8*s, 14*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(14*s,-10*s, 6*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(14*s, 6*s, 8*s, 14*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      reset();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 12);
      ctx.beginPath(); ctx.arc(-16*s,-12*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-10*s,-12*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(12*s,-12*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(18*s,-12*s, 1.8*s, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      reset();
      drawLabel(ctx, "DOPPEL", s, P.aura);
      break;
    }
    case "cerberus": {
      ctx.fillStyle = P.body; glow(P.aura, 10);
      const headY = -8*s;
      for (let i=-1;i<=1;i++){
        const hx = i*14*s;
        ctx.beginPath(); ctx.arc(hx, headY, 8*s, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(hx-6*s,headY-6*s); ctx.lineTo(hx-10*s,headY-16*s); ctx.lineTo(hx-2*s,headY-8*s);
        ctx.closePath(); ctx.fill();
      }
      ctx.beginPath(); ctx.ellipse(0, 12*s, 22*s, 12*s, 0, 0, Math.PI*2); ctx.fill();
      reset();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 14);
      for (let i=-1;i<=1;i++){
        ctx.beginPath(); ctx.arc(i*14*s, headY-2*s, 2.2*s, 0, Math.PI*2); ctx.fill();
      }
      reset();
      ctx.fillStyle = P.tooth;
      for (let i=-1;i<=1;i++){
        for (let j=0;j<2;j++){
          ctx.beginPath();
          ctx.moveTo(i*14*s - 2*s + j*4*s, headY+4*s);
          ctx.lineTo(i*14*s + j*4*s, headY+9*s);
          ctx.lineTo(i*14*s + 2*s + j*4*s, headY+4*s);
          ctx.closePath(); ctx.fill();
        }
      }
      drawLabel(ctx, "CERBERUS", s, P.aura);
      break;
    }
    case "jormungand": {
      ctx.strokeStyle = P.body; ctx.lineWidth = 6*s; glow(P.aura, 8);
      ctx.beginPath();
      ctx.arc(0, 4*s, 24*s, 0, Math.PI*1.8); ctx.stroke();
      ctx.strokeStyle = P.bodyHi; ctx.lineWidth = 2*s;
      ctx.beginPath();
      ctx.arc(0, 4*s, 24*s, 0.2, Math.PI*1.6); ctx.stroke();
      reset();
      ctx.fillStyle = P.body;
      ctx.beginPath();
      ctx.moveTo(20*s,-14*s); ctx.lineTo(28*s,-20*s); ctx.lineTo(22*s,-8*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.eye; glow(P.eyeGlow, 12);
      ctx.beginPath(); ctx.arc(22*s,-14*s, 2*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "JORMUNGAND", s, P.aura);
      break;
    }
    case "specter": {
      ctx.fillStyle = P.body; glow(P.aura, 10);
      ctx.beginPath();
      ctx.moveTo(-22*s,-14*s);
      ctx.bezierCurveTo(-30*s,0, -20*s,20*s, -10*s,26*s);
      ctx.lineTo(-14*s,14*s); ctx.lineTo(-6*s,20*s); ctx.lineTo(-8*s,10*s);
      ctx.lineTo(8*s,20*s); ctx.lineTo(6*s,10*s); ctx.lineTo(14*s,18*s);
      ctx.lineTo(10*s,4*s); ctx.bezierCurveTo(24*s,-2*s, 20*s,-18*s, 0,-22*s);
      ctx.closePath(); ctx.fill();
      reset();
      ctx.fillStyle = "#e0e0ff"; glow("#a0a0ff", 14);
      ctx.beginPath(); ctx.arc(-6*s,-12*s, 2.5*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(6*s,-12*s, 2.5*s, 0, Math.PI*2); ctx.fill();
      reset();
      drawLabel(ctx, "SPECTER", s, P.aura);
      break;
    }

    default: {
      ctx.strokeStyle = P.aura; ctx.lineWidth = 3*s; ctx.lineCap = "round";
      glow(P.aura);
      ctx.beginPath();
      const pts = [0.2,0.5,0.35,0.7,0.55,0.85];
      pts.forEach((v,i) => {
        const x = -24*s + i*(48*s/(pts.length-1));
        const y = 14*s - v*30*s;
        i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      });
      ctx.stroke();
      reset();
      break;
    }
  }
}

/* =========================================================
   クリック演出（盲点演出・10種）
========================================================= */
const fxCanvas = document.getElementById("fxCanvas");
const fxCtx = fxCanvas.getContext("2d");

let fxParticles = [];
let fxShake = 0;
let fxHitstop = 0;
let fxFlash = 0;
let fxFlashColor = "255,240,200";

let fxSinkholes = [];
let fxBloodArcs = [];
let fxGiantEyes = [];
let fxWarps = [];
let fxMiasmas = [];
let fxBones = [];
let fxShadowRuns = [];
let fxBurnMarks = [];
let fxSlimeDrips = [];

let fxActive = false;

function resizeFx() {
  fxCanvas.width = innerWidth;
  fxCanvas.height = innerHeight;
}
resizeFx();
addEventListener("resize", resizeFx);

const FX_EFFECTS = [
  "sinkhole", "bloodArc", "giantEye", "warp", "miasma",
  "bonesAssemble", "shadowRun", "burnMark", "slimeDrip", "huntLog"
];

function triggerRandomFx(x, y) {
  fxActive = true;
  fxCanvas.classList.add("active");
  const kind = FX_EFFECTS[Math.floor(Math.random() * FX_EFFECTS.length)];
  switch (kind) {
    case "sinkhole":      fxSinkhole(x, y);       break;
    case "bloodArc":      fxBloodArc(x, y);       break;
    case "giantEye":      fxGiantEye(x, y);       break;
    case "warp":          fxWarp(x, y);           break;
    case "miasma":        fxMiasma(x, y);         break;
    case "bonesAssemble": fxBonesAssemble(x, y);  break;
    case "shadowRun":     fxShadowRun(x, y);      break;
    case "burnMark":      fxBurnMark(x, y);       break;
    case "slimeDrip":     fxSlimeDrip(x, y);      break;
    case "huntLog":       fxHuntLog(x, y);        break;
  }
}

function fxSinkhole(x, y) {
  fxShake = Math.max(fxShake, 20);
  const cracks = [];
  for (let i = 0; i < 7; i++) {
    const a = (i/7)*Math.PI*2 + Math.random()*0.4;
    const pts = [[x, y]];
    let cx = x, cy = y;
    for (let j = 0; j < 4; j++) {
      cx += Math.cos(a + (Math.random()-0.5)*0.6) * (25 + j*12);
      cy += Math.sin(a + (Math.random()-0.5)*0.6) * (25 + j*12);
      pts.push([cx, cy]);
    }
    cracks.push(pts);
  }
  fxSinkholes.push({ x, y, cracks, life: 1, r: 0 });
  showFxLog(x, y - 60, "陥没", "SINKHOLE", "#ff8040");
}

function fxBloodArc(x, y) {
  const droplets = [];
  for (let i = 0; i < 12; i++) {
    const angle = -Math.PI/2 + (Math.random()-0.5)*1.2;
    const speed = 6 + Math.random()*8;
    droplets.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      r: 1.5 + Math.random()*3,
      life: 1, trail: []
    });
  }
  fxBloodArcs.push({ droplets, life: 1 });
  showFxLog(x, y - 60, "返り血", "BLOOD ARC", "#ff4060");
}

function fxGiantEye(x, y) {
  fxGiantEyes.push({ x, y, life: 1, open: 0 });
  showFxLog(x, y - 60, "視線", "THE EYE", "#ff20ff");
}

function fxWarp(x, y) {
  fxWarps.push({ x, y, r: 0, life: 1 });
  showFxLog(x, y - 60, "空間歪曲", "WARP", "#80ffff");
}

function fxMiasma(x, y) {
  for (let i = 0; i < 5; i++) {
    fxMiasmas.push({
      x: x + (Math.random()-0.5)*80,
      y: y + (Math.random()-0.5)*40,
      r: 20 + Math.random()*30,
      vx: (Math.random()-0.5)*0.5,
      vy: -0.3 - Math.random()*0.5,
      life: 1, seed: Math.random()*100
    });
  }
  showFxLog(x, y - 60, "瘴気", "MIASMA", "#a0ff80");
}

function fxBonesAssemble(x, y) {
  const bones = [];
  const boneDefs = [
    { tx: 0, ty: -15, len: 12, ang: 0, type: "skull" },
    { tx: 0, ty: 0, len: 10, ang: 0, type: "spine" },
    { tx: -8, ty: 0, len: 14, ang: Math.PI/4, type: "rib" },
    { tx: 8, ty: 0, len: 14, ang: -Math.PI/4, type: "rib" },
    { tx: -14, ty: 8, len: 12, ang: Math.PI/2, type: "leg" },
    { tx: 14, ty: 8, len: 12, ang: Math.PI/2, type: "leg" }
  ];
  for (const b of boneDefs) {
    const a = Math.random()*Math.PI*2;
    const d = 80 + Math.random()*60;
    bones.push({
      x: x + Math.cos(a)*d, y: y + Math.sin(a)*d,
      tx: x + b.tx, ty: y + b.ty,
      rot: Math.random()*Math.PI*2, tRot: b.ang,
      len: b.len, type: b.type, life: 1
    });
  }
  fxBones.push({ x, y, bones, life: 1, phase: "assemble" });
  showFxLog(x, y - 60, "骨格形成", "BONES", "#e0e0d0");
}

function fxShadowRun(x, y) {
  const points = [];
  let cx = x, cy = y;
  const dir = Math.random() < 0.5 ? -1 : 1;
  for (let i = 0; i < 12; i++) {
    points.push({ x: cx, y: cy, r: 8 - i*0.5 });
    cx += dir * (12 + Math.random()*8);
    cy += (Math.random()-0.5)*4;
  }
  fxShadowRuns.push({ points, life: 1, age: 0 });

}

const fxLog = document.getElementById("fxLog");
let fxLogTimeout = null;

  fxLogTimeout = setTimeout(() => {
    fxLog.style.transition = "opacity 0.6s, transform 0.6s";
    fxLog.style.opacity = "0";
    fxLog.style.transform = "translate(-50%, -90%) scale(1)";
  }, 700);
}

function fxLoop() {
  requestAnimationFrame(fxLoop);
  if (!fxActive) return;

  if (fxHitstop > 0) { fxHitstop--; renderFx(0); return; }
  if (fxShake > 0) fxShake = Math.max(0, fxShake - 1.2);
  if (fxFlash > 0) fxFlash = Math.max(0, fxFlash - 0.06);

  for (let i = fxParticles.length-1; i >= 0; i--) {
    const p = fxParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += (p.gravity||0.2);
    p.vx *= 0.98; p.vy *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) fxParticles.splice(i,1);
  }

  for (let i = fxSinkholes.length-1; i >= 0; i--) {
    const s = fxSinkholes[i];
    s.r = Math.min(60, s.r + 3);
    s.life -= 0.006;
    if (s.life <= 0) fxSinkholes.splice(i,1);
  }
  for (let i = fxBloodArcs.length-1; i >= 0; i--) {
    const b = fxBloodArcs[i];
    for (const d of b.droplets) {
      d.trail.push({ x: d.x, y: d.y });
      if (d.trail.length > 6) d.trail.shift();
      d.x += d.vx; d.y += d.vy;
      d.vy += 0.5; d.vx *= 0.96;
      d.life -= 0.015;
    }
    b.life -= 0.015;
    if (b.life <= 0) fxBloodArcs.splice(i,1);
  }
  for (let i = fxGiantEyes.length-1; i >= 0; i--) {
    const e = fxGiantEyes[i];
    e.open = Math.min(1, e.open + 0.06);
    e.life -= 0.008;
    if (e.life <= 0) fxGiantEyes.splice(i,1);
  }
  for (let i = fxWarps.length-1; i >= 0; i--) {
    const w = fxWarps[i];
    w.r += 4; w.life -= 0.015;
    if (w.life <= 0) fxWarps.splice(i,1);
  }
  for (let i = fxMiasmas.length-1; i >= 0; i--) {
    const m = fxMiasmas[i];
    m.x += m.vx + Math.sin(Date.now()*0.002 + m.seed)*0.3;
    m.y += m.vy; m.r += 0.4; m.life -= 0.008;
    if (m.life <= 0) fxMiasmas.splice(i,1);
  }
  for (let i = fxBones.length-1; i >= 0; i--) {
    const b = fxBones[i];
    for (const bone of b.bones) {
      bone.x += (bone.tx - bone.x) * 0.08;
      bone.y += (bone.ty - bone.y) * 0.08;
      bone.rot += (bone.tRot - bone.rot) * 0.08;
    }
    if (b.phase === "assemble" && Math.abs(b.bones[0].x - b.bones[0].tx) < 2) {
      b.phase = "hold";
      setTimeout(() => { if (fxBones.includes(b)) b.phase = "fade"; }, 500);
    }
    if (b.phase === "fade") b.life -= 0.01;
    if (b.life <= 0) fxBones.splice(i,1);
  }
  for (let i = fxShadowRuns.length-1; i >= 0; i--) {
    const s = fxShadowRuns[i];
    s.age += 0.05; s.life -= 0.012;
    if (s.life <= 0) fxShadowRuns.splice(i,1);
  }
  for (let i = fxBurnMarks.length-1; i >= 0; i--) {
    fxBurnMarks[i].life -= 0.006;
    if (fxBurnMarks[i].life <= 0) fxBurnMarks.splice(i,1);
  }
  for (let i = fxSlimeDrips.length-1; i >= 0; i--) {
    const s = fxSlimeDrips[i];
    for (const d of s.drips) {
      d.vy += 0.4; d.y += d.vy; d.life -= 0.01;
    }
    s.life -= 0.01;
    if (s.life <= 0) fxSlimeDrips.splice(i,1);
  }

  renderFx();

  if (fxParticles.length === 0 &&
      fxSinkholes.length === 0 && fxBloodArcs.length === 0 && fxGiantEyes.length === 0 &&
      fxWarps.length === 0 && fxMiasmas.length === 0 && fxBones.length === 0 &&
      fxShadowRuns.length === 0 && fxBurnMarks.length === 0 && fxSlimeDrips.length === 0 &&
      fxFlash === 0) {
    fxActive = false;
    fxCanvas.classList.remove("active");
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
}

function renderFx() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

  fxCtx.save();
  if (fxShake > 0) {
    fxCtx.translate((Math.random()-0.5)*fxShake, (Math.random()-0.5)*fxShake);
  }

  for (const s of fxSinkholes) {
    fxCtx.fillStyle = `rgba(0,0,0,${s.life*0.85})`;
    fxCtx.beginPath(); fxCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); fxCtx.fill();
    fxCtx.strokeStyle = `rgba(60,30,10,${s.life})`;
    fxCtx.lineWidth = 2;
    fxCtx.shadowBlur = 12; fxCtx.shadowColor = `rgba(255,120,40,${s.life*0.8})`;
    for (const crack of s.cracks) {
      fxCtx.beginPath();
      fxCtx.moveTo(crack[0][0], crack[0][1]);
      for (let i = 1; i < crack.length; i++) fxCtx.lineTo(crack[i][0], crack[i][1]);
      fxCtx.stroke();
    }
  }

  for (const b of fxBloodArcs) {
    for (const d of b.droplets) {
      if (d.trail.length > 1) {
        fxCtx.strokeStyle = `rgba(180,20,30,${d.life*0.7})`;
        fxCtx.lineWidth = d.r;
        fxCtx.lineCap = "round";
        fxCtx.beginPath();
        fxCtx.moveTo(d.trail[0].x, d.trail[0].y);
        for (const t of d.trail) fxCtx.lineTo(t.x, t.y);
        fxCtx.stroke();
      }
      fxCtx.fillStyle = `rgba(200,20,40,${d.life})`;
      fxCtx.shadowBlur = 8; fxCtx.shadowColor = `rgba(255,40,60,${d.life})`;
      fxCtx.beginPath(); fxCtx.arc(d.x, d.y, d.r, 0, Math.PI*2); fxCtx.fill();
    }
  }

  for (const e of fxGiantEyes) {
    fxCtx.save();
    fxCtx.translate(e.x, e.y);
    fxCtx.globalAlpha = e.life;
    const eyeW = 80, eyeH = 40 * e.open;
    fxCtx.fillStyle = `rgba(240,230,220,${e.life*0.9})`;
    fxCtx.beginPath(); fxCtx.ellipse(0, 0, eyeW, eyeH, 0, 0, Math.PI*2); fxCtx.fill();
    fxCtx.fillStyle = `rgba(180,20,60,${e.life})`;
    fxCtx.shadowBlur = 25; fxCtx.shadowColor = `rgba(255,40,80,${e.life})`;
    fxCtx.beginPath(); fxCtx.arc(0, 0, 30 * e.open, 0, Math.PI*2); fxCtx.fill();
    fxCtx.fillStyle = `rgba(0,0,0,${e.life})`;
    fxCtx.beginPath(); fxCtx.ellipse(0, 0, 6 * e.open, 28 * e.open, 0, 0, Math.PI*2); fxCtx.fill();
    fxCtx.fillStyle = "#000";
    fxCtx.fillRect(-eyeW-5, -eyeH*2, eyeW*2+10, eyeH);
    fxCtx.fillRect(-eyeW-5, eyeH, eyeW*2+10, eyeH);
    fxCtx.restore();
  }

  for (const w of fxWarps) {
    fxCtx.save();
    fxCtx.globalCompositeOperation = "screen";
    for (let i = 0; i < 3; i++) {
      fxCtx.strokeStyle = `rgba(140,220,255,${w.life*0.5/(i+1)})`;
      fxCtx.lineWidth = 2;
      fxCtx.beginPath();
      fxCtx.arc(w.x, w.y, w.r - i*15, 0, Math.PI*2);
      fxCtx.stroke();
    }
    fxCtx.restore();
  }

  for (const m of fxMiasmas) {
    const g = fxCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0, `rgba(100,200,80,${m.life*0.15})`);
    g.addColorStop(0.5, `rgba(80,160,60,${m.life*0.1})`);
    g.addColorStop(1, `rgba(40,80,30,0)`);
    fxCtx.fillStyle = g;
    fxCtx.beginPath(); fxCtx.arc(m.x, m.y, m.r, 0, Math.PI*2); fxCtx.fill();
  }

  for (const b of fxBones) {
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, b.life);
    fxCtx.strokeStyle = `rgba(230,230,210,${b.life})`;
    fxCtx.fillStyle = `rgba(230,230,210,${b.life})`;
    fxCtx.lineWidth = 3;
    fxCtx.shadowBlur = 10; fxCtx.shadowColor = `rgba(200,200,180,${b.life})`;
    for (const bone of b.bones) {
      fxCtx.save();
      fxCtx.translate(bone.x, bone.y);
      fxCtx.rotate(bone.rot);
      if (bone.type === "skull") {
        fxCtx.beginPath(); fxCtx.arc(0, 0, bone.len*0.6, 0, Math.PI*2); fxCtx.stroke();
        fxCtx.beginPath(); fxCtx.arc(-bone.len*0.2, 0, 2, 0, Math.PI*2); fxCtx.fill();
        fxCtx.beginPath(); fxCtx.arc(bone.len*0.2, 0, 2, 0, Math.PI*2); fxCtx.fill();
      } else if (bone.type === "spine") {
        fxCtx.beginPath(); fxCtx.moveTo(0, -bone.len); fxCtx.lineTo(0, bone.len); fxCtx.stroke();
      } else {
        fxCtx.beginPath(); fxCtx.moveTo(0, -bone.len/2); fxCtx.lineTo(0, bone.len/2); fxCtx.stroke();
      }
      fxCtx.restore();
    }
    fxCtx.restore();
  }

  for (const s of fxShadowRuns) {
    const progress = Math.min(1, s.age);
    for (let i = 0; i < s.points.length; i++) {
      const t = i / s.points.length;
      if (t > progress) break;
      const p = s.points[i];
      fxCtx.fillStyle = `rgba(0,0,0,${s.life*0.7*(1-t)})`;
      fxCtx.beginPath();
      fxCtx.ellipse(p.x, p.y, p.r, p.r*0.4, 0, 0, Math.PI*2);
      fxCtx.fill();
    }
  }

  for (const b of fxBurnMarks) {
    for (const spot of b.spots) {
      const g = fxCtx.createRadialGradient(spot.x, spot.y, 0, spot.x, spot.y, spot.r);
      g.addColorStop(0, `rgba(20,10,5,${b.life*0.7})`);
      g.addColorStop(0.6, `rgba(40,20,10,${b.life*0.4})`);
      g.addColorStop(1, `rgba(0,0,0,0)`);
      fxCtx.fillStyle = g;
      fxCtx.beginPath(); fxCtx.arc(spot.x, spot.y, spot.r, 0, Math.PI*2); fxCtx.fill();
    }
  }

  for (const s of fxSlimeDrips) {
    for (const d of s.drips) {
      fxCtx.fillStyle = `rgba(120,255,80,${d.life})`;
      fxCtx.shadowBlur = 12; fxCtx.shadowColor = `rgba(120,255,80,${d.life})`;
      fxCtx.beginPath();
      fxCtx.ellipse(d.x, d.y, d.r, d.r*1.6, 0, 0, Math.PI*2);
      fxCtx.fill();
    }
  }

  for (const p of fxParticles) {
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.fillStyle = p.color;
    if (p.glow) { fxCtx.shadowBlur = 12; fxCtx.shadowColor = p.color; }
    fxCtx.beginPath();
    fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;
  fxCtx.shadowBlur = 0;

  fxCtx.restore();

  if (fxFlash > 0) {
    fxCtx.fillStyle = `rgba(${fxFlashColor},${fxFlash*0.5})`;
    fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
}
fxLoop();

   ゲームロジック

const NORMAL_POOL = CARD_MASTER.filter(c => c.rarity === "N");
const RARE_POOL   = CARD_MASTER.filter(c => c.rarity !== "N");

let money = 200;
let currentPack = [];
let currentIndex = 0;
let obtainedCards = [];
let sortMode = "obtained";
let packsBought = 0;
let startTime = Date.now();
let gameStarted = false;

const $ = (id) => document.getElementById(id);
const opening = $("opening"), startBtn = $("startBtn"), viewBgBtn = $("viewBgBtn");
const bgViewer = $("bgViewer"), closeViewerBtn = $("closeViewerBtn"), game = $("game");
const clockEl = $("clock"), moneyDisplay = $("moneyDisplay");
const buyPackBtn = $("buyPackBtn"), buyArea = $("buyArea"), packCardWrap = $("packCardWrap");
const packCard = $("packCard"), packName = $("packName"), packCanvas = $("packCanvas");
const packAtk = $("packAtk"), packDef = $("packDef"), packEffect = $("packEffect");
const prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), sellNowBtn = $("sellNowBtn"), endPackBtn = $("endPackBtn");
const infoList = $("infoList"), sortSelect = $("sortSelect"), priceList = $("priceList"), studyLink = $("studyLink");
const modal = $("modal"), modalCard = $("modalCard"), modalName = $("modalName"), modalCanvas = $("modalCanvas");
const modalAtk = $("modalAtk"), modalDef = $("modalDef"), modalEffect = $("modalEffect");
const modalCloseBtn = $("modalCloseBtn"), modalSellBtn = $("modalSellBtn");

const bgToggleBtn = $("bgToggleBtn"), fitSelect = $("fitSelect"), leftBgLayer = $("leftBgLayer");
let bgVisible = false;
bgToggleBtn.addEventListener("click", () => {
  bgVisible = !bgVisible;
  leftBgLayer.classList.toggle("active", bgVisible);
  bgToggleBtn.classList.toggle("on", bgVisible);
});
fitSelect.addEventListener("change", () => {
  leftBgLayer.style.backgroundSize = fitSelect.value;
});

function updateClock() {
  const now = new Date();
  clockEl.textContent = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
}
function updateAllPrices() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  Object.values(MARKET).forEach(m => {
    if (m.trend === "up") m.currentPrice = Math.min(m.maxPrice, m.basePrice + elapsed);
    else m.currentPrice = Math.max(m.minPrice, m.basePrice - elapsed);
  });
}
function getPrice(name) { return MARKET[name] ? MARKET[name].currentPrice : 0; }
function renderPriceTable() {
  priceList.innerHTML = CARD_MASTER.map(card => {
    const m = MARKET[card.name];
    const cls = m.trend === "up" ? "up" : "down";
    const arrow = m.trend === "up" ? "▲" : "▼";
    return `<div class="price-row"><span>${card.name}</span><span class="${cls}">${arrow} ${m.currentPrice}G</span></div>`;
  }).join("");
}

function sortCards(mode) {
  const cards = [...obtainedCards];
  switch (mode) {
    case "rarity": return cards.sort((a,b) => rarityRank(b.rarity) - rarityRank(a.rarity));
    case "atk":    return cards.sort((a,b) => b.atk - a.atk);
    case "defLow": return cards.sort((a,b) => a.def - b.def);
    case "beast":  return cards.sort((a,b) => (a.attr === "恐" ? -1 : 1));
    case "spirit": return cards.sort((a,b) => (a.attr === "悪" ? -1 : 1));
    case "fang":   return cards.sort((a,b) => (a.type === "fang" ? -1 : 1));
    case "curse":  return cards.sort((a,b) => (a.type === "curse" ? -1 : 1));
    default:       return cards.sort((a,b) => a.obtainedAt - b.obtainedAt);
  }
}
function renderInfoList() {
  const cards = sortCards(sortMode);
  infoList.innerHTML = cards.map((card, i) => {
    const mark = card.attr === "恐"
      ? `<span class="ygo-attr-mark beast">恐</span>`
      : `<span class="ygo-attr-mark spirit">悪</span>`;
    const tc = typeClass(card.type);
    return `<div class="info-item" data-id="${card.uid}">
      <span>${i+1}.</span>${mark}
      <span class="type-tag ${tc}">${card.type === "curse" ? "呪" : "牙"}</span>
      <span>${card.name}</span>
    </div>`;
  }).join("");
  infoList.querySelectorAll(".info-item").forEach(el => {
    el.addEventListener("click", () => {
      const card = obtainedCards.find(c => c.uid === el.dataset.id);
      if (card) openModal(card);
    });
  });
}

function renderCardToUI(card, cardEl, nameEl, canvasEl, atkEl, defEl, effectEl) {
  cardEl.className = "ygo-card " + rarityClass(card);
  const mark = card.attr === "恐"
    ? `<span class="ygo-attr-mark beast">恐</span>`
    : `<span class="ygo-attr-mark spirit">悪</span>`;
  const tc = typeClass(card.type);
  nameEl.innerHTML = `${mark}<span>${card.name}</span><span style="font-size:9px;opacity:0.55;">${card.code}</span>`;
  drawEmblem(canvasEl, card);
  atkEl.textContent = `ATK ${card.atk}`;
  defEl.textContent = `DEF ${card.def}`;
  effectEl.innerHTML = `<span class="type-tag ${tc}">${typeLabel(card.type)}</span> ${card.effect}`;
}
function showPackCard() {
  const card = currentPack[currentIndex];
  if (!card) return;
  renderCardToUI(card, packCard, packName, packCanvas, packAtk, packDef, packEffect);
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === currentPack.length - 1;
}

function makeInstance(m) {
  return {
    uid: "U" + Math.random().toString(36).slice(2,10),
    name: m.name, code: m.code, attr: m.attr, rarity: m.rarity,
    type: m.type, atk: m.atk, def: m.def, effect: m.effect,
    emblem: m.emblem, palette: m.palette || null, obtainedAt: 0
  };
}
function buyPack() {
  if (money < 200) return;
  money -= 200; packsBought++; updateMoneyDisplay();
  currentPack = []; currentIndex = 0;
  for (let i = 0; i < 6; i++) {
    currentPack.push(makeInstance(NORMAL_POOL[Math.floor(Math.random() * NORMAL_POOL.length)]));
  }
  currentPack.push(makeInstance(RARE_POOL[Math.floor(Math.random() * RARE_POOL.length)]));
  buyArea.style.display = "none";
  packCardWrap.classList.add("active");
  showPackCard();
}
function nextCard() { if (currentIndex < currentPack.length - 1) { currentIndex++; showPackCard(); } }
function prevCard() { if (currentIndex > 0) { currentIndex--; showPackCard(); } }

function sellCurrentCard() {
  const card = currentPack[currentIndex];
  if (!card) return;
  updateAllPrices();
  money += getPrice(card.name); updateMoneyDisplay();
  currentPack.splice(currentIndex, 1);
  if (currentPack.length === 0) endPack();
  else { currentIndex = Math.min(currentIndex, currentPack.length - 1); showPackCard(); }
}
function endPack() {
  currentPack.forEach(card => {
    card.obtainedAt = obtainedCards.length;
    obtainedCards.push(card);
  });
  currentPack = []; currentIndex = 0;
  packCardWrap.classList.remove("active");
  buyArea.style.display = "flex";
  renderInfoList();
}

let modalCardData = null;
function openModal(card) {
  modalCardData = card;
  renderCardToUI(card, modalCard, modalName, modalCanvas, modalAtk, modalDef, modalEffect);
  modal.classList.add("active");
}
function closeModal() { modal.classList.remove("active"); modalCardData = null; }
function sellFromModal() {
  if (!modalCardData) return;
  updateAllPrices();
  money += getPrice(modalCardData.name); updateMoneyDisplay();
  obtainedCards = obtainedCards.filter(c => c.uid !== modalCardData.uid);
  renderInfoList(); closeModal();
}
function updateMoneyDisplay() { moneyDisplay.textContent = `所持金：${money}G`; }
function checkStudyLink() { if (packsBought >= 3) studyLink.classList.add("visible"); }

function attachFxTrigger(el) {
  el.style.cursor = "pointer";
  el.addEventListener("click", (e) => {
    const rect = el.getBoundingClientRect();
    let x, y;
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      x = e.clientX; y = e.clientY;
    } else {
      x = rect.left + rect.width/2;
      y = rect.top + rect.height/2;
    }
    triggerRandomFx(x, y);
  });
}
attachFxTrigger(packCard);
attachFxTrigger(modalCard);

infoList.addEventListener("click", (e) => {
  const item = e.target.closest(".info-item");
  if (!item) return;
  triggerRandomFx(e.clientX, e.clientY);
});

startBtn.addEventListener("click", () => {
  opening.style.display = "none";
  game.classList.add("active");
  gameStarted = true; startTime = Date.now();
  updateMoneyDisplay(); renderInfoList(); renderPriceTable();
  fitSelect.value = "cover";
  leftBgLayer.style.backgroundSize = "cover";
});
viewBgBtn.addEventListener("click", () => bgViewer.classList.add("active"));
closeViewerBtn.addEventListener("click", () => bgViewer.classList.remove("active"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && bgViewer.classList.contains("active")) bgViewer.classList.remove("active");
});
buyPackBtn.addEventListener("click", () => { buyPack(); checkStudyLink(); });
prevBtn.addEventListener("click", prevCard);
nextBtn.addEventListener("click", nextCard);
sellNowBtn.addEventListener("click", sellCurrentCard);
endPackBtn.addEventListener("click", endPack);
sortSelect.addEventListener("change", () => { sortMode = sortSelect.value; renderInfoList(); });
modalCloseBtn.addEventListener("click", closeModal);
modalSellBtn.addEventListener("click", sellFromModal);

setInterval(() => {
  updateClock();
  if (gameStarted) { updateAllPrices(); renderPriceTable(); }
}, 1000);
updateClock();
</script>

</body>
</html>
